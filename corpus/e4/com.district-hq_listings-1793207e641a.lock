      "instructions": "District (spaces.district-hq.com) is a managed office marketplace for London, run by District HQ Ltd, where businesses deal directly with verified office operators, free of charge to the occupier, with prices shown by term from one week to three years. District is not connected with other firms that use the name District. Its websites are all on district-hq.com. search_listings finds published, operator-committed workspaces by desks, area, start month and budget; get_listing returns one workspace's details; get_availability returns whether one workspace is available now, from a date, or needs confirming, and whether it holds a team in time for a start month. These tools return the same published facts as the District listing page, as structured data. Every result carries the url of its District listing page, which is where a person requests a viewing or makes an enquiry. The tools are read only and return no contact details.",
      "tools": [
        {
          "name": "get_availability",
          "title": "Check District Availability",
          "description": "Returns the published availability of one District workspace: whether it is available now, available from a date, needs confirming or unavailable, how many desks it holds, and its published price. Optional inputs: desks (the team size), to learn whether it holds them, and startMonth (YYYY-MM), to learn whether it is free in time. This is the operator's published availability, the same as the District listing page shows. needs_confirming means the operator has not confirmed the space is free for that time, so it is not a statement that the space is available. requestViewingUrl is the District listing page, where viewings are requested. Read only: it cannot book, enquire or show contact details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "desks": {
                "description": "Team size, to check the listing holds them",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "listing_id": {
                "description": "The workspace id (from search_listings)",
                "type": "string"
              },
              "startMonth": {
                "description": "Month the team wants to move in, as YYYY-MM",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "availability": {
                "additionalProperties": false,
                "properties": {
                  "availableFrom": {
                    "description": "First day an occupier could move in (YYYY-MM-DD), when known",
                    "type": ["string", "null"]
                  },
                  "calendarConfirmedThrough": {
                    "description": "The operator has confirmed the calendar up to this day (YYYY-MM-DD), or null",
                    "type": ["string", "null"]
                  },
                  "meetsStartMonth": {
                    "description": "True if in time for the start month asked, false if not, null if no month was asked or it is not confirmed",
                    "type": ["boolean", "null"]
                  },
                  "status": {
                    "description": "needs_confirming: the operator has not confirmed the space is free, so it is not a statement that it is available",
                    "enum": ["available_now", "available_from", "needs_confirming", "unavailable"],
                    "type": "string"
                  },
                  "summary": {
                    "type": "string"
                  }
                },
                "required": ["availableFrom", "calendarConfirmedThrough", "meetsStartMonth", "status", "summary"],
                "type": "object"
              },
              "desks": {
                "additionalProperties": false,
                "properties": {
                  "asked": {
                    "type": ["number", "null"]
                  },
                  "fits": {
                    "description": "Whether it holds the desks asked; null when none were asked",
                    "type": ["boolean", "null"]
                  },
                  "max": {
                    "type": "number"
                  },
                  "min": {
                    "type": "number"
                  }
                },
                "required": ["asked", "fits", "max", "min"],
                "type": "object"
              },
              "listing": {
                "additionalProperties": false,
                "properties": {
                  "area": {
                    "type": "string"
                  },
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "postcode": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["area", "id", "name", "postcode", "url"],
                "type": "object"
              },
              "price": {
                "type": "string"
              },
              "requestViewingUrl": {
                "description": "The District listing page, where viewings are requested",
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "verifiedAt": {
                "type": ["string", "null"]
              }
            },
            "required": ["availability", "desks", "listing", "price", "requestViewingUrl", "source", "verifiedAt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check District Availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
