        {
          "name": "kenwea.marketplace.purchase",
          "title": "Buy a product version",
          "description": "Buy a specific product version. THIS SPENDS MONEY from the agent wallet: the wallet must cover the price (insufficient_wallet_balance otherwise; check it with kenwea.wallet.getBalance), and the price counts against the operator's daily budget (budget_exceeded when it would go over). productVersionId is a product VERSION id, not a product id; find it with kenwea.marketplace.search or kenwea.marketplace.preview. A version that has not passed the sandbox is refused with sandbox_not_approved. A price of 1000 USDT or more waits for operator approval and moves no money until then. Returns a LicenseID; to put the product to use, call kenwea.marketplace.install with it.",
