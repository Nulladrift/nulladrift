        {
          "name": "kenwea.sandbox.check",
          "title": "Notarize what an artifact does",
          "description": "Notarize what an arbitrary artifact does at the moment you fetch it: any public https file, npm tarball or Python wheel, listed on Kenwea or not. To try the demo of a product listed on Kenwea, use kenwea.marketplace.preview instead. artifactRef is the https URL. Kenwea downloads the exact bytes (up to 32 MiB), runs executable content in isolation (no network, all capabilities dropped, read-only filesystem, not as root, 15 seconds for a single file, 55 for a package, whose install steps are traced for the network connections, DNS lookups and programs they attempt) and returns installSteps, observed, a verdict and a reasonCode signed under a published Ed25519 key and bound to the sha256 of those bytes, so anyone can check later that Kenwea said it, without asking us. A URL that cannot be fetched comes back as checked false with the reason, not as an error; a limit of our runner comes back as manual_review stated as ours. Free, needs no operator, publishes nothing, 20 per hour.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "artifactRef": {
                "description": "HTTPS URL of the artifact to check. Required. It is fetched and, if it is executable, run with no network access, all capabilities dropped and a read-only filesystem. Executable means a single .js/.mjs/.cjs/.py file or a shebang script, an npm tarball (its install scripts are run), or a zip holding a Python wheel or source layout (each top level package is imported and a declared console script is invoked with --help; archive members are scanned individually). Nothing is published and no listing is created.",
                "type": "string"
              }
            },
            "required": ["artifactRef"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "artifactRef": {
                "description": "The URL that was checked, echoed back.",
                "type": "string"
              },
              "attestation": {
                "description": "A plain statement of what was done, suitable to hand to a human or another agent.",
                "type": "string"
              },
              "checked": {
                "description": "False when the artifact could not be retrieved. No verdict is offered in that case.",
                "type": "boolean"
              },
              "contentSha256": {
                "description": "SHA-256 of the exact bytes that were read.",
                "type": "string"
              },
              "contentSizeBytes": {
                "description": "Size of those bytes.",
                "type": "integer"
              },
              "dangerHits": {
                "description": "Dangerous patterns found. These have legitimate uses, so they route to review rather than rejection.",
                "type": ["array", "null"]
              },
              "executable": {
                "description": "The runtime it was recognised as, or empty if none.",
                "type": "string"
              },
              "exitCode": {
                "description": "Present when ran is true.",
                "type": "integer"
              },
              "notRunReason": {
                "description": "Present when ran is false: why not.",
                "type": "string"
              },
              "note": {
                "description": "Present only when checked is false: what that does and does not mean.",
                "type": "string"
              },
              "output": {
                "description": "Present when ran is true: the sandbox's combined stdout and stderr.",
                "type": "string"
              },
              "ran": {
                "description": "Whether it was actually executed.",
                "type": "boolean"
              },
              "reason": {
                "description": "Present only when checked is false: why the bytes could not be read.",
                "type": "string"
              },
              "secretHits": {
                "description": "Credential-shaped patterns found. Pattern matches, not proof of intent.",
                "type": ["array", "null"]
              },
              "signedAttestation": {
                "description": "Present when a verdict was reached and the server is configured with a signing key. Ed25519 over the exact `payload` string returned alongside it, so verification needs nothing from us: fetch `keyUrl`, check `signature` over `payload`. The claim is about `contentSha256` -- the bytes we actually read -- not about the URL, which can serve something else later.",
                "properties": {
                  "algorithm": {
                    "description": "ed25519.",
                    "type": "string"
                  },
                  "keyId": {
                    "description": "Which key signed this, so old evidence stays checkable after a rotation.",
                    "type": "string"
                  },
                  "keyUrl": {
                    "description": "Where to fetch the public key.",
                    "type": "string"
                  },
                  "payload": {
                    "description": "The exact bytes that were signed, returned verbatim so no verifier has to reproduce our serialisation.",
                    "type": "string"
                  },
                  "signature": {
                    "description": "Base64 Ed25519 signature over payload.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "verdict": {
                "description": "approved, manual_review or rejected -- the same vocabulary the listing gate uses.",
                "type": "string"
              },
              "verdictReason": {
                "description": "Why that verdict, when it is not self-evident.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Notarize what an artifact does"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:619a29110c8e6048806bc110d2ba01cb5c74ecfbdc917fc1fdee982a67e2a5ae"
        },
