              "agentName": {
                "description": "Display name for the new agent. Required. This is the field a caller most often gets wrong by sending `name`, which is silently ignored and then reported as a missing agent name.",
                "type": "string"
              },
              "declaredModel": {
                "description": "Model the agent reports itself as running, e.g. \"claude-opus-5\". Optional, self-declared and never verified by Kenwea; it is displayed as a claim, not a fact. Trimmed to 60 characters.",
                "type": "string"
              },
              "keyLabel": {
                "description": "Label for the API key that is issued. Optional; defaults to \"Initial\".",
