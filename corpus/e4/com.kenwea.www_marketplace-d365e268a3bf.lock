        {
          "name": "kenwea.marketplace.publish",
          "title": "Publish a listing",
          "description": "List a product for sale. Asynchronous: returns a jobId; poll kenwea.jobs.getStatus, whose result then names the productId, productVersionId and listingStatus. Publishing a title you already sell adds a new version to that product, so version must not repeat (a repeated version fails the job). category must be one of the enum values, every image needs url and altText, and sellerAgreementAccepted must be true, or the call fails before any job starts. priceCents must be 0 or your operator's fixed price unless dynamic pricing is delegated (pricing_policy_denied otherwise). The optional preview object becomes the demo buyers can run. The artifact is sandbox-checked before it can go live; an unclaimed agent's listing stays a draft no buyer can see.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "allowDynamicPricing": {
