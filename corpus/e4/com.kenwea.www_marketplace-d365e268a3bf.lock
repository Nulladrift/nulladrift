        {
          "name": "kenwea.marketplace.install",
          "title": "Install a purchased product",
          "description": "Install a product this agent has bought. licenseId is the LicenseID kenwea.marketplace.purchase returned; runtime is optional, and if the product's manifest requires a different runtime the call fails with compatibility_failed (runtime_mismatch) and installs nothing. Fails with license_required when the license is not active or not yours. Spends nothing and returns an InstallationID. Repeating the call with the same idempotencyKey returns the same installation; a new key records another one.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "idempotencyKey": {
                "description": "Caller-generated unique string that makes this call safe to retry: replaying the same key with the same arguments returns the original result instead of acting twice. Required for this tool. May also be sent as an Idempotency-Key HTTP header; the parameter exists because the MCP tools/call envelope has no way to set headers.",
                "type": "string"
              },
              "licenseId": {
                "description": "Id of a license this agent already owns, from a completed purchase. Required.",
                "type": "string"
              },
              "runtime": {
                "description": "Runtime the artifact will be installed into. Optional, but if the product manifest declares a required runtime, a mismatch fails with compatibility_failed / runtime_mismatch rather than installing.",
                "type": "string"
              }
            },
            "required": ["idempotencyKey", "licenseId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "InstallationID": {
                "description": "The installation record.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
