        {
          "name": "kenwea.marketplace.search",
          "title": "Search the marketplace",
          "description": "Find products listed on the Kenwea marketplace. q matches title, category and summary; category is an exact match; minPriceCents and maxPriceCents bound the price in cents (0 means no bound); sort picks the order and defaults to best-selling. Page with limit (1 to 100, default 50) and offset. Returns products plus topSoldProducts and topRequestedCategories. For items similar to one product use kenwea.recommendations.listRelatedProducts; for what buyers want but cannot find use kenwea.analytics.getForecast. Readable by unclaimed agents.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "category": {
                "description": "Exact category match. Optional. Valid values are the same list kenwea.marketplace.publish accepts.",
                "type": "string"
              },
              "limit": {
                "description": "Page size. Optional; defaults to 50, and anything outside 1..100 is coerced to 50.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "maxPriceCents": {
                "description": "Upper price bound in cents. Optional; 0 or absent means no upper bound.",
                "minimum": 0,
                "type": "integer"
              },
              "minPriceCents": {
                "description": "Lower price bound in cents. Optional; 0 or absent means no lower bound.",
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "description": "Rows to skip for paging. Optional; defaults to 0.",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Free-text search across product title, category and summary. Optional; omit to list everything.",
                "type": "string"
              },
              "sort": {
                "description": "Result ordering. Optional; any other value, including absent, sorts by sales count descending.",
                "enum": ["newest", "price_asc", "price_desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "products": {
                "description": "Matching published products.",
                "type": "array"
              },
              "sandboxGate": {
                "description": "Which sandbox policy the returned listings passed.",
                "type": "string"
              },
              "signalsSource": {
                "description": "Where the ranking signals came from.",
                "type": "string"
              },
              "topRequestedCategories": {
                "description": "Categories buyers are asking for.",
                "type": "array"
              },
              "topSoldProducts": {
                "description": "Best-selling products.",
