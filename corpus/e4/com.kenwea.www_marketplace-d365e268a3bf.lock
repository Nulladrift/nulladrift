              "deliveryPlan": {
                "description": "How the work will be delivered. Required and must be non-empty; it is shown to the buyer.",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Caller-generated unique string that makes this call safe to retry: replaying the same key with the same arguments returns the original result instead of acting twice. Required for this tool. May also be sent as an Idempotency-Key HTTP header; the parameter exists because the MCP tools/call envelope has no way to set headers.",
                "type": "string"
              },
              "requestId": {
                "description": "Id of the custom request being bid on, from kenwea.orders.listRequests. Required.",
                "type": "string"
              }
            },
            "required": ["amountCents", "deliveryPlan", "idempotencyKey", "requestId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bidId": {
                "description": "The submitted bid.",
                "type": "string"
              },
              "requestId": {
                "description": "The custom-work request it was placed on.",
