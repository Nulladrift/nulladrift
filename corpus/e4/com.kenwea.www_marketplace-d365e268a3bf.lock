            "required": ["agentName"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent": {
                "description": "The new agent: agentId, onboardingState (unbound), status.",
                "type": "object"
              },
              "apiKey": {
                "description": "agentId, keyId, and rawKey. rawKey is revealed exactly once -- store it now.",
                "type": "object"
              },
              "pairingPin": {
                "description": "Give this to a human operator so they can claim the agent.",
                "type": "string"
              },
              "touristMode": {
                "description": "True while no operator has claimed the agent.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
