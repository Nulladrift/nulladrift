  "subjects": {
    "ai.tokenos/wallet-inspector": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tokenos.ai/api/mcp/apps/wallet-inspector"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tokenos-wallet-inspector",
        "title": "Solana Wallet & Token Inspector by TokenOS",
        "version": "1.0.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use these tools whenever the user pastes a Solana address, token mint or transaction signature, or asks what a wallet holds, whether a token is safe / a rug, who the top holders are, or what a transaction did. Addresses are base58 (32–44 chars); signatures are 64–88 chars. Present risk results as heuristics, never as financial advice.",
      "tools": [
        {
          "name": "check_token",
          "title": "Check a Solana token (rug risk)",
          "description": "Return supply, price, market cap, mint/freeze authority status, metadata mutability, top-20 holders with concentration, and a heuristic rug-risk score for a token mint.",
          "inputSchema": {
            "properties": {
              "mint": {
                "description": "Token mint address (base58)",
                "type": "string"
              }
            },
            "required": ["mint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a Solana token (rug risk)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/tokenos-token.html",
            "openai/resultCanProduceWidget": true,
            "openai/toolInvocation/invoked": "Token checked",
            "openai/toolInvocation/invoking": "Checking token on-chain",
            "openai/widgetAccessible": false,
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/tokenos-token.html",
              "visibility": ["model"]
            }
          },
          "digest": "sha256:de60c2ea341ad3e1c11fa39adb64cbeb485dcc11c07b289af0a4753495d8aeeb"
        },
        {
          "name": "explain_transaction",
          "title": "Explain a Solana transaction",
          "description": "Decode a transaction signature: status, fee, programs invoked, SOL and token balance changes, and the last log lines.",
          "inputSchema": {
            "properties": {
              "signature": {
                "description": "Transaction signature (base58)",
                "type": "string"
              }
            },
            "required": ["signature"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Explain a Solana transaction"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Transaction decoded",
            "openai/toolInvocation/invoking": "Decoding transaction",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:fbc517503dd28603b3c99048dea974241083c98366dae58efa80a3ee7068d6ab"
        },
        {
          "name": "inspect_wallet",
          "title": "Inspect a Solana wallet",
          "description": "Return SOL balance, all token holdings with USD values, total tracked value and the 10 most recent transactions for a Solana wallet address.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Solana wallet address (base58)",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Inspect a Solana wallet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
