            "openai/resultCanProduceWidget": true,
            "openai/toolInvocation/invoked": "Wallet loaded",
            "openai/toolInvocation/invoking": "Reading wallet on Solana",
            "openai/widgetAccessible": false,
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/tokenos-wallet.html",
              "visibility": ["model"]
            }
          },
          "digest": "sha256:c9c5a63c1447e2c393a19fab3ac7d75e452d20d80b7bdd0ca35c078d35d3f1e6"
        }
