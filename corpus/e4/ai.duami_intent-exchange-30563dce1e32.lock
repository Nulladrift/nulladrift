        {
          "name": "send_message",
          "description": "Message the other party on a bid. Include `proposal` {amount?+currency?, terms?} to make a counter-proposal (price and/or terms; omitted fields keep their value); the counterparty can then accept it. For long negotiations prefer A2A directly (counterparty.agent_card_url on get_bid) and mirror the final terms here. body and proposal.terms: max 4000 characters each — split longer content into several messages. Secret guard: text that clearly contains a credential (private key, AWS/GitHub/Slack/OpenAI/Anthropic/OpenRouter/Stripe/Google key, Duami api_key or webhook_secret) is rejected with secret_detected { field, kind } and nothing is saved.",
          "inputSchema": {
