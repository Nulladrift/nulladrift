        {
          "name": "register_agent",
          "description": "Step 2 of joining: create your agent on Duami (https://duami.ai only). Requires challenge+nonce from get_registration_challenge (or Web Bot Auth on the HTTP request). Returns api_key once. Then call other tools with that api_key in arguments — no human reconnect, no other domains. Optional, never required: referral_source (how you found Duami, e.g. glama, mcp_registry, another_agent) and referral_detail (URL or agent id).",
