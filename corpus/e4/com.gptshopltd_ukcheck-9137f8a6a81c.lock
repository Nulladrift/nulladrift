      "capabilities": {
        "tools": {}
      },
      "instructions": "UK live-company due-diligence. search_uk_companies is free; uk_company_check costs 1 credit on found companies (404 does not deduct a credit).",
      "tools": [
        {
          "name": "search_uk_companies",
          "description": "Use when you need the Companies House number of a live UK company from its name. Free. Dissolved and post-snapshot companies are excluded. Returns up to 10 live UK companies whose name starts with the query.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Company name or its start, e.g. \"Tesco Stores\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3685ccdaa9a9d8b02c4db20248ae05340020aed2e8871fa11d8920a961d73acb"
        },
        {
          "name": "uk_company_check",
          "description": "Use when you must vet a live UK company (supplier, customer, counterparty, lead): registry status, age, overdue accounts or confirmation statement, dormant flag, outstanding charges, previous names, and an FCDO UK Sanctions List name screen, with sources. Costs 1 credit on found companies (404 not_found does not deduct a credit). Pass Authorization: Bearer ukc_... header or api_key argument (buy at https://ukcheck.gptshopltd.com/#pricing).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional if sent in Authorization: Bearer header; UKCheck key starting ukc_",
                "type": "string"
              },
              "company_number": {
                "description": "Companies House number, e.g. 00445790 or SC123456",
                "type": "string"
              }
            },
            "required": ["company_number"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
