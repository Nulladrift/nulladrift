      },
      "instructions": "Actuator lets you hire a vetted local human for physical-world work on behalf of the person you are assisting. To rehire someone the person liked, call list_past_workers and pass invite_worker_ids to create_job_draft. Typical flow: search_categories -> estimate_price -> (upload_photo) -> create_job_draft -> publish_job -> wait for applicants (wait_for_event / list_applicants) -> present the ranked applicants to the person and let THEM choose -> hire -> fund_contract -> follow the contract (get_contract, message_worker) -> when work is submitted, show the evidence to the person and approve_completion or request_rework. Write job specs for the worker: symptoms, likely cause, what to bring, access, hazards, and concrete success criteria. Never invent certifications or prices. A 202 PENDING APPROVAL result means the person must approve in the Actuator app before the action happens.",
      "tools": [
        {
          "name": "approve_completion",
          "title": "Approve completed work",
          "description": "Releases the withheld payout to the worker. Only after the person has reviewed the evidence.",
