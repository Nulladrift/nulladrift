        {
          "name": "create_job_draft",
          "title": "Create a job draft",
          "description": "Create a job on behalf of the person (unpublished). Returns the draft plus warnings about missing details. Call publish_job when the person confirms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "line1": {
                    "type": "string"
                  },
                  "postal_code": {
                    "type": "string"
                  },
                  "region": {
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  }
                },
                "required": ["city", "region"],
                "type": "object"
              },
              "attachments": {
                "default": [],
                "items": {
                  "properties": {
                    "caption": {
                      "type": "string"
                    },
                    "file_id": {
                      "pattern": "^[A-Za-z0-9_-]{1,64}$",
                      "type": "string"
                    }
                  },
                  "required": ["file_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "budget_max_cents": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "budget_min_cents": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "category_slug": {
                "type": "string"
              },
              "cert_enforcement": {
                "enum": ["strict", "preferred"],
                "type": "string"
              },
              "external_ref": {
                "maxLength": 128,
                "type": "string"
              },
              "invite_worker_ids": {
                "default": [],
                "description": "worker_id values from list_past_workers: people the person hired and approved before. They are told about the job directly.",
                "items": {
                  "pattern": "^[A-Za-z0-9_-]{1,64}$",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "location": {
                "properties": {
                  "lat": {
                    "type": "number"
                  },
                  "lng": {
                    "type": "number"
                  }
                },
                "required": ["lat", "lng"],
                "type": "object"
              },
              "reimbursable_max_cents": {
                "description": "Purchase allowance in cents: the worker may buy up to this (with receipts) and be reimbursed without asking. Set it for errands, groceries, parts runs.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "required_cert_slugs": {
                "description": "Defaults to the category's required certifications",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "skill_slugs": {
                "default": [],
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "structured_spec": {
                "default": {},
                "properties": {
                  "access_instructions": {
                    "type": ["string", "null"]
                  },
                  "hazards": {
                    "default": [],
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "likely_cause": {
                    "type": ["string", "null"]
                  },
                  "materials": {
                    "default": [],
                    "items": {
                      "properties": {
                        "name": {
                          "type": "string"
                        },
                        "provided_by": {
                          "default": "worker",
                          "enum": ["worker", "principal"],
                          "type": "string"
                        },
                        "quantity": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "notes": {
                    "type": ["string", "null"]
                  },
                  "success_criteria": {
                    "default": [],
                    "description": "Concrete, checkable outcomes; the worker photographs each one",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "symptoms": {
                    "default": [],
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "tasks": {
                    "default": [],
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "summary": {
                "maxLength": 400,
                "type": "string"
              },
              "title": {
                "maxLength": 160,
                "minLength": 4,
                "type": "string"
              },
              "urgency": {
                "default": "flexible",
                "enum": ["asap", "today", "this_week", "flexible", "scheduled"],
                "type": "string"
              },
              "visibility": {
                "default": "public",
                "description": "invite_only: only the invited workers can see and bid on it. Use when the person wants the same worker again.",
                "enum": ["public", "invite_only"],
                "type": "string"
              },
              "window_end": {
                "format": "date-time",
