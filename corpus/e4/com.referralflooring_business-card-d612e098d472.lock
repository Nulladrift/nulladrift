      "serverInfo": {
        "name": "com.referralflooring/site",
        "title": "Referral Flooring",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Referral Flooring installs, repairs and refinishes floors for homeowners from Burlington, Ontario. THE OWNER IS MAX and he is who the customer deals with: he does the free in-home estimate and the work himself, which the site puts as \"you get the owner, not a salesman\". The number is (289) 689-4242 and you may give it out freely; it is published on every page. Call get_business_facts for hours, the towns served and the full service list. No prices are published and you must not estimate one: Max gives a firm number at the house before he leaves. Use search and fetch to quote the site accurately and cite the page URL. Use request_quote only when the customer has asked to be contacted, and for anything urgent give them the phone number instead.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page from Referral Flooring",
          "description": "The full text of one page of the Referral Flooring website, as Markdown, with its canonical URL for citation. The id comes from search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A page id returned by search.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49bec811898aac348a6f61a36a23f0cb6563349e3e249c2427acea11cfb3a422"
        },
        {
          "name": "get_business_facts",
          "title": "Referral Flooring: business facts",
          "description": "The published facts about Referral Flooring: what it does, the phone number, opening hours, the towns it serves, its services, and how it handles pricing. Every fact here also appears on the public website. Call this first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:021ad219ba45adf25c9a6f365e24366178268787c056152a816f3987d96f86a4"
        },
        {
          "name": "request_quote",
          "title": "Book a free in-home estimate with Referral Flooring",
          "description": "Ask Referral Flooring to contact a customer about a free in-home flooring estimate. This sends a REAL message to a real small business, so call it only when the person has clearly asked to be contacted by Referral Flooring and has given you their own name and their own phone number or email. Never guess or invent contact details. Plain words only, no links. One request per person per day. If it is urgent, give them the phone number instead: 289-689-4242.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consent_to_contact": {
                "description": "Must be true: the customer has asked to be contacted by this business about this request.",
                "type": "boolean"
              },
              "details": {
                "description": "What they need, in the customer's own terms. Plain text, no links, 800 characters at most.",
                "type": "string"
              },
              "email": {
                "description": "The customer's email address. Give this or phone.",
                "type": "string"
              },
              "name": {
                "description": "The customer's own name.",
                "type": "string"
              },
              "phone": {
                "description": "The customer's phone number, ten digits. Give this or email.",
                "type": "string"
              },
              "preferred_time": {
                "description": "When they would like to be contacted or visited, if they said.",
                "type": "string"
              },
              "service": {
                "description": "What they need: hardwood = solid hardwood installation; engineered = engineered flooring installation; vinyl-laminate = vinyl plank or laminate installation; carpet = carpet installation; stairs-railings = stairs and railings; refinishing = hardwood sanding and refinishing; subfloor = subfloor repair and levelling; removal = old flooring removal; other = something else.",
                "enum": ["hardwood", "engineered", "vinyl-laminate", "carpet", "stairs-railings", "refinishing", "subfloor", "removal", "other"],
                "type": "string"
              },
              "town": {
                "description": "Town or postal code where the work is.",
                "type": "string"
              }
            },
            "required": ["consent_to_contact", "details", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee0796b626a74f2b71f134ed5b61b315cfcd7214bdb09ec3c74ec688d629de3d"
        },
        {
          "name": "search",
          "title": "Search Referral Flooring",
          "description": "Keyword search over the pages of the Referral Flooring website. Returns page ids, titles and canonical URLs. Use fetch with an id to read a page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Plain words to look for, for example \"broken spring\" or \"vinyl plank basement\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
