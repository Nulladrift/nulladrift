      "serverInfo": {
        "name": "eurocollis-mcp",
        "version": "2.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "convert_currency",
          "description": "Convert an amount between EuroCollis-supported currencies using live MAD-based rates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "type": "number"
              },
              "from_currency": {
                "type": "string"
              },
              "to_currency": {
                "type": "string"
              }
            },
            "required": ["amount", "from_currency", "to_currency"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25b1a8fcd1d9c7f4228d6facdd839507a0ac212a256e2d8777c09741f23a005a"
        },
        {
          "name": "estimate_customs",
          "description": "Indicative duty + VAT estimate. NOT authoritative — always render the returned disclaimer verbatim.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "declared_value_eur": {
                "type": "number"
              },
              "destination_country": {
                "description": "ISO-3166 alpha-2",
                "type": "string"
              }
            },
            "required": ["declared_value_eur", "destination_country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ed72e6ab10af9216c0b0dbb8b6266f81b5f2bc12b7145c5e63dc36d9764c3ce4"
        },
        {
          "name": "get_cities",
          "description": "Supported pickup/delivery cities for one country. Use these exact names as origin_city / destination_city in get_quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO-3166 alpha-2, e.g. MA or FR",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0013130df6bb4a7015a2a8d5398c1bb966b7472dfb0a220fc1eaeb703531b135"
        },
        {
          "name": "get_courier",
          "description": "Public profile for one courier by storefront slug or courier id. No PII.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "courier": {
                "description": "Storefront slug or courier UUID",
                "type": "string"
              }
            },
            "required": ["courier"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5df09ec15c6d7601241537045af060cdc203bd24ec5d4d99f22b7aead41adb5f"
        },
        {
          "name": "get_eurocollis_info",
          "description": "What EuroCollis is, the corridors it operates, currency, deposit model and where bookings are completed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:434f44e449bcca783afb81244b9bed9f1f8bbbbaa09e011947460e1ddac6dcab"
        },
        {
          "name": "get_prohibited_items",
          "description": "Items EuroCollis and Morocco/EU customs prohibit. Always surface before a booking recommendation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8fe829a04e7ffc466e7c04644d821e40562ff3f9555d33ca595991cd681624cf"
        },
        {
          "name": "get_quote",
          "description": "Authoritative price quote for a Europe ↔ Africa shipment, returned from the same pricing engine the website uses. Provide weight_kg for boxes/suitcases or items[] for catalogue goods. Never re-compute prices yourself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination_city": {
                "type": "string"
              },
              "destination_country": {
                "description": "ISO-3166 alpha-2",
                "type": "string"
              },
              "flex_days": {
                "description": "Search window after pickup_date (default 14)",
                "type": "number"
              },
              "items": {
                "description": "Catalogue goods. Use item_id (or name) from get_services.",
                "items": {
                  "properties": {
                    "item_id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "quantity": {
                      "type": "number"
                    }
                  },
                  "required": ["quantity"],
                  "type": "object"
                },
                "type": "array"
              },
              "origin_city": {
                "type": "string"
              },
              "origin_country": {
                "description": "ISO-3166 alpha-2",
                "type": "string"
              },
              "pickup_date": {
                "description": "YYYY-MM-DD, defaults to today",
                "type": "string"
              },
              "weight_kg": {
                "description": "Total weight for box/suitcase shipments",
                "type": "number"
              }
            },
            "required": ["destination_city", "destination_country", "origin_city", "origin_country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e7e8538ccb908d1ad5de0084a7b1722b24d5b8eacd5cdbdfbd2328bbc1bd3586"
        },
        {
          "name": "get_routes",
          "description": "Every supported Europe ↔ Africa corridor. Optionally scope to one corridor for live trip volume.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination_country": {
                "description": "ISO-3166 alpha-2",
                "type": "string"
              },
              "origin_country": {
                "description": "ISO-3166 alpha-2",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b581cd8e82f4b29fd6a5af0c8d1b0b0a7b7df0eb83a8c53e8af863d3af5313be"
        },
        {
          "name": "get_services",
          "description": "Shippable item catalogue with pricing units — use item_id values when calling get_quote with items.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58392088fab814f41c956eca91ba6a55601098e8a10b98b8d4a0ae5a838b4239"
        },
        {
          "name": "get_storefront",
          "description": "Published courier storefront with its canonical URL (custom domain / subdomain / platform path) and corridor pages. Omit slug to list storefronts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Used when listing",
                "type": "number"
              },
              "slug": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ca08fccdd185e2d68ad9b0dc43e1fc4a43dd70952d26d720d39846924a28d7a"
        },
        {
          "name": "search_couriers",
          "description": "Live, verified couriers with upcoming trips on a corridor. Demo accounts, unverified couriers and past departures are excluded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination_country": {
                "description": "ISO-3166 alpha-2",
                "type": "string"
              },
              "from_date": {
                "description": "YYYY-MM-DD, defaults to today",
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "origin_country": {
                "description": "ISO-3166 alpha-2",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:837a57875992800f55320880c59559463a50d9e463270c53d14b2f554a4c0976"
        },
        {
          "name": "track_shipment",
          "description": "Public shipment status. Requires BOTH the reference and the delivery city (anti-enumeration). No PII returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "delivery_city": {
                "type": "string"
              },
              "reference": {
                "description": "e.g. BK-XXXXXX",
                "type": "string"
              }
            },
            "required": ["delivery_city", "reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b6400d516e880d554f3dd74920a005e86b4ff580e6c9bda23844570158a700cf"
        }
      ],
      "digest": "sha256:c9c6970067d0aedab4d05bcf780eb025d08a9e552021befa1a3912c34eb95e93"
    }
  }
