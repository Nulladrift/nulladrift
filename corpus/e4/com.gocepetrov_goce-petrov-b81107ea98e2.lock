        {
          "name": "show_work_and_offer",
          "title": "Goce Petrov: work and offer",
          "description": "Shows Goce Petrov's selected work, his services with prices and a short brief form as an interactive card in the chat. Use when someone wants to see his work, compare his services, or start a project with him. Hosts without in-chat apps get the same facts as text. view opens a tab (work, offer or brief); service preselects one service for the brief; sector filters the work.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "sector": {
                "description": "Show only case studies from this sector",
                "enum": ["ai-security", "fintech-crypto", "public-sector", "events", "brand-identity", "education"],
                "type": "string"
              },
              "service": {
                "description": "A service id from get_services, to preselect it in the brief",
                "enum": ["next-stage-sprint", "brand-sprint", "brand-system-website", "brand-automation", "ai-for-design-teams", "read-check", "tool-copy", "in-chat-design"],
                "type": "string"
              },
              "view": {
                "default": "work",
                "description": "The tab to open: work, offer or brief",
                "enum": ["work", "offer", "brief"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
