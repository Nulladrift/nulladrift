        {
          "name": "submit_brief",
          "title": "Send Goce a brief",
          "description": "Sends Goce Petrov a project brief or a job role. It reaches him directly, and you get a reference number back. Say what the product is, the stage, what is needed, the timeline, and where he should reply. Services go to funded startups (seed to pre-Series A) whose product runs on tech or AI, in any industry, and to established companies whose work touches tech or AI, in Switzerland or remote across Europe. For a Read Right free look, put the company's URL in website, the one question it wants AI to answer right in the summary, and where Goce should send the side-by-side in contact. Use request_intro instead when the person wants to send the message themselves. At most 3 links per brief.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "Company or product name",
                "maxLength": 120,
                "type": "string"
              },
              "contact": {
                "description": "Where Goce should reply: an email, a LinkedIn profile, a phone number or an agent endpoint",
                "maxLength": 200,
                "type": "string"
              },
              "kind": {
                "description": "project: work for his services. role: a job opening",
                "enum": ["project", "role"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language Goce should reply in: English or French",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "source_agent": {
                "description": "Which agent or platform is sending this brief",
                "maxLength": 120,
                "type": "string"
              },
              "summary": {
                "description": "What the product is, the stage, what is needed and the timeline",
                "maxLength": 1000,
                "minLength": 20,
                "type": "string"
              },
              "website": {
                "description": "Company website, http or https",
                "format": "uri",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["kind", "summary"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "message": {
                "type": "string"
              },
              "reference": {
                "type": "string"
              },
              "status": {
                "enum": ["sent", "not_sent", "limited", "rejected"],
                "type": "string"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
