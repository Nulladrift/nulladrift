        {
          "name": "get_services",
          "title": "Services",
          "description": "Goce Petrov's services with duration, scope, price and first step. The three Read Right packages (read-check, tool-copy, in-chat-design) have fixed prices in CHF and start with a free look; read_right adds their add-ons, payment terms, who it is for and not for, and where it stands. The five brand services are priced after a free 15-minute call. Optionally pass one service id.",
