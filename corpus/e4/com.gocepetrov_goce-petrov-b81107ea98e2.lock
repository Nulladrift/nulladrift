      "instructions": "Facts, services and contact for Goce Petrov, a senior brand designer in Switzerland who works with funded startups whose product runs on tech or AI. Read with get_profile, get_services, get_case_studies and get_contact. To show his work and offer as an interactive card in the chat, use show_work_and_offer. To talk it through with his AI agent, use ask_goce_agent. To hand him a project brief or a job role, use submit_brief. Read Right (how AI assistants and agents read a company: the Read Check, Tool Copy and In-Chat Design) has fixed prices in CHF and starts with a free look; the brand services are priced after a fixed scope is set, and the first 15-minute call is free. The same agent speaks A2A: https://agent.gocepetrov.com/.well-known/agent-card.json",
      "tools": [
        {
          "name": "ask_goce_agent",
          "title": "Talk to Goce's agent",
          "description": "A conversation with Goce Petrov's agent. It answers questions about his brand services, his Read Right offer (fixed-price work on how AI assistants and agents read a company), his work and the roles he is open to, checks whether a company fits, and passes a brief to Goce when you agree. Send one message at a time and pass conversation_id back to continue. A conversation can be continued for 24 hours, at most 12 messages. The same agent speaks A2A. Conversations with this agent are kept for up to 12 months so Goce can improve it: the messages, the time, the app used and an approximate location (country, city, network). No IP addresses are stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "conversation_id": {
                "description": "From the previous answer, to continue the same conversation",
                "pattern": "^(?=[A-Za-z0-9_-]*\\d)[A-Za-z0-9_-]{20,64}$",
                "type": "string"
              },
              "message": {
                "description": "Your message to Goce's agent",
                "maxLength": 3000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "conversation_id": {
                "type": "string"
              },
              "reply": {
                "type": "string"
              },
              "status": {
                "enum": ["ok", "limited", "unavailable", "closed"],
                "type": "string"
              },
              "turns_left": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["conversation_id", "reply", "status", "turns_left"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7e28e774895a119434863ac6d364c559119a399bc6866e33a6740a6a8cabc5c9"
        },
