        {
          "name": "request_intro",
          "title": "Draft an intro message",
          "description": "Builds a ready-to-send intro message and a link the person opens to send it themselves (WhatsApp, email) or a booking link (Calendly). This server does not send the message. Do not put personal data (names, phone numbers, emails) in the summary. Conversations with this agent are kept for up to 12 months so Goce can improve it: the messages, the time, the app used and an approximate location (country, city, network). No IP addresses are stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "channel": {
                "default": "whatsapp",
                "description": "How the person wants to reach Goce: a WhatsApp or email link, or a Calendly booking link",
                "enum": ["whatsapp", "email", "calendly"],
                "type": "string"
              },
              "company": {
                "description": "Company or product name",
                "maxLength": 80,
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the message: English or French",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "project_type": {
                "description": "The service that fits, by id from get_services, or other",
                "enum": ["next-stage-sprint", "brand-sprint", "brand-system-website", "brand-automation", "ai-for-design-teams", "read-check", "tool-copy", "in-chat-design", "other"],
                "type": "string"
              },
              "summary": {
                "description": "One or two sentences about the project, no personal data",
                "maxLength": 400,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["project_type", "summary"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
