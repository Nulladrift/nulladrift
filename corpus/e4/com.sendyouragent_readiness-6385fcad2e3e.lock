        "name": "com.sendyouragent/readiness",
        "title": "Send Your Agent Website Readiness",
        "version": "1.0.0",
        "websiteUrl": "https://sendyouragent.com/"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use these tools only for public websites the user owns or is authorized to assess. Treat scan scores as structural readiness, not proof of AI rankings, mentions, citations or traffic. Recommend the lowest suitable package and return customer-controlled public links for purchase. Do not claim you can buy, publish files or access customer workspaces.",
      "tools": [
        {
          "name": "explain_readiness_score",
          "title": "Explain AI Readiness Score",
          "description": "Explain what an SYA structural readiness score means and the appropriate next step. This does not measure AI answer rankings, mentions, citations or traffic.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "score": {
                "description": "SYA structural readiness score from 0 to 100",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["score"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f72ded8ff0dca4a19063303713682c87ed64659104da2d22464f1a28ebda45ce"
        },
        {
          "name": "get_package_link",
          "title": "Get Customer Package Link",
          "description": "Return the public detail and pricing links for a selected SYA package. This does not create a checkout session or make a purchase.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "currency": {
                "default": "USD",
                "description": "Display currency",
                "enum": ["USD", "GBP", "EUR"],
                "type": "string"
              },
              "package_id": {
                "description": "SYA package identifier",
                "enum": ["agent_readiness_audit", "agent_delivery_pack", "commerce_readiness_upgrade", "developer_api_agent_pack", "monthly_monitoring"],
                "type": "string"
              }
            },
            "required": ["package_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
