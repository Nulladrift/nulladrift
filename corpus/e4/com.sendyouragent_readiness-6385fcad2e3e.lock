          "title": "Get Public Sample Report",
          "description": "Return one of the limited public SYA sample report previews for SaaS, API, ecommerce or Web3 websites.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "sample": {
                "default": "saas",
                "description": "Public sample type",
