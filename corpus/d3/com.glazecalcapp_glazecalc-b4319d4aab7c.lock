        {
          "name": "vary_material",
          "title": "What one material does across a range",
          "description": "Shows what one material does to a glaze, by putting more and more of it into a base recipe (an ingredient blend or progression test: whiting 0 to 20, say, in 2 to 11 tiles). With mode \"add\" (the default) it goes on top of the base, so the recipe grows; with mode \"replace\" the same amount comes out of another material of the base (`instead`), so the total stays the same. Each tile has its amount of the material, its recipe in percent, its key unity formula figures (silica, alumina, boron, the fluxes), silica to alumina, calculated expansion, its place on Stull's chart (stull: region, crazed), the names of the limit cautions it has, and, with a firing, whether its chemistry fits that firing (coneFit verdict), and its flux ratio (fluxRatio: R2O alkalis against RO fluxes, in the unity formula). trend sums up what moves from the first tile to the last (oxides, silica to alumina, expansion, the R2O share of the flux ratio), which Stull regions the tiles cross, the first tile with a limit caution the first tile does not have (firstCaution) and, with a firing, the first whose coneFit verdict changes (firstConeFitChange). Give base materials only, no colorants. This is a calculation from published figures, not a test result: the tiles, fired, decide, and the cautions are guides, not a guarantee of food safety.",
