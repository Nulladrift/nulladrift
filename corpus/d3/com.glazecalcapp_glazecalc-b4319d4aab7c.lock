        {
          "name": "create_firing_log",
          "title": "Save a new firing log",
          "description": "Saves a new firing log in your Glazecalc account (the Firing page): its title, the day, the kiln, the columns kept (time, temperature, cone, atmosphere, comments...) and a row for each reading, as the person dictated them. Add later readings with add_firing_rows. Save only what the person said and agreed to; never fill in an amount, temperature or analysis they did not give. Needs an access token that can read and change your records.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "columns": {
                "description": "The columns kept, by these names, as on the Firing page: Time, Temperature F or Temperature C (the scale said), Cone, Atmosphere, Ramp, Hold, Damper, Comments and the rest.",
                "items": {
                  "enum": ["Time", "Gas", "Fuel", "Primary Air", "Blower", "Damper", "Passive Damper", "Tank", "Meter", "Burner", "Cone", "Temperature F", "Temperature C", "Temperature K", "Ox Probe", "Atmosphere", "Weather", "Ramp", "Hold", "Comments", "Draw Tile", "Delta", "Rate", "Salt", "Soda", "Sawdust", "Pilots", "Pressure", "Secondary Air", "Hours", "Cones Top", "Cones Bottom", "Spy", "Temp Diff", "Segment", "Kg", "Pounds", "Timer", "Exhaust", "Misc", "Probe 1", "Probe 2", "Probe 3", "Probe 4", "Ring 1", "Ring 2", "Ring 3", "Ring 4", "Ring 5", "Ring 6", "Burner 1", "Burner 2", "Burner 3", "Burner 4", "Burner 5", "Burner 6", "Burner 7", "Burner 8", "Burner 9", "Burner 10"],
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "date": {
                "description": "The day it was fired, as 2026-10-21; today when left out.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "kiln": {
                "description": "The kiln, as the person names it.",
                "maxLength": 100,
                "type": "string"
              },
              "notes": {
                "description": "Anything else said about the firing, in the person’s words.",
                "maxLength": 10000,
                "type": "string"
              },
              "rows": {
                "description": "One row for each reading, one cell for each column, in column order, as the person said it (\"9:40\", \"1850\", \"5 bending\"); \"\" for a cell not said.",
                "items": {
                  "items": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "maxItems": 60,
                  "type": "array"
                },
                "maxItems": 500,
                "type": "array"
              },
              "title": {
                "description": "The log’s name, as the person gave it (\"Glaze firing, cone 6\").",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["columns", "rows", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
