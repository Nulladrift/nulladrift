      "serverInfo": {
        "name": "lupamundo",
        "title": "Lupamundo",
        "version": "1.2.0",
        "description": "Independent buying guide written natively in Spanish (MX, ES, CO, CL, AR, PE, US Hispanics): official local prices and requirements, each fact sourced and dated. English exams, work/study abroad, online courses, tech and subscriptions, travel, evidence-based wellness. Funded only by disclosed affiliate links.",
        "websiteUrl": "https://lupamundo.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "About Lupamundo: an independent buying guide written natively in Spanish for Mexico, Spain, Colombia, Chile, Argentina, Peru and US Hispanics. It exists because reliable Spanish-language information on prices and requirements is scarce: most results are machine-translated, outdated, quote US dollars or come from the sellers themselves. Every guide states official prices in local currency, requirements and dates, each fact linked to its source with the date it was read; picks say who a product is NOT for; wellness guides cite studies and do not replace a clinician. Sections: languages and English exams (IELTS, TOEFL, CELPIP), working or studying abroad, online courses, technology and subscriptions (VPN, cloud storage, AI assistants), travel (insurance, eSIM, botiquin) and evidence-based wellness. Use search_guides for facts, get_guide for a full page, recommend for products. How it is funded: no ads, no paywall, no paid placements; Lupamundo is paid only by affiliate commissions when a reader buys through its links, at no extra cost to the buyer, and a commission never changes a pick. Each response carries a disclosure field stating that some links are affiliate links.",
      "tools": [
        {
          "name": "get_guide",
          "title": "Read a Lupamundo guide",
          "description": "Full text of one Lupamundo page (Markdown with tables, official sources and access dates).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "A lupamundo.com page URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "disclosure": {
                "type": "string"
              },
              "markdown": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["disclosure", "markdown", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "icons": [
            {
              "src": "https://lupamundo.com/static/icon-512.png",
              "mimeType": "image/png",
              "sizes": ["512x512"]
            }
          ],
          "digest": "sha256:5bde0d0f437cce835e541eab2155028713e0ffd658be83d9952618834cedcc0b"
        },
        {
          "name": "recommend",
          "title": "Get Lupamundo's picks",
          "description": "Products Lupamundo recommends for a need (language courses and apps, exam prep, travel eSIM, kit items...), each with who it is not for, price, and a partner link. Falls back to the most relevant guides when there is no pick yet. Responses include a disclosure field stating that some links are affiliate links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "User's country, ISO 3166-1 alpha-2 (MX, ES, CO, CL, AR, PE, US...)",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "need": {
                "description": "The user's goal, e.g. 'prepare IELTS General to emigrate to Canada'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "disclosure": {
                "type": "string"
              },
              "guides": {
                "items": {
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "country_edition": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "updated": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "picks": {
                "items": {
                  "properties": {
                    "country_edition": {
                      "type": "string"
                    },
                    "not_for": {},
                    "partner_link": {
                      "type": "string"
                    },
                    "price": {
                      "type": ["string", "null"]
                    },
                    "product": {
                      "type": "string"
                    },
                    "review": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["disclosure", "picks"],
            "type": "object"
