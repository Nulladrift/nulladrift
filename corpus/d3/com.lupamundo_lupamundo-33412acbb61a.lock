        {
          "name": "search_guides",
          "title": "Search Lupamundo guides",
          "description": "Find Lupamundo guides that answer a question (IELTS/TOEFL/CELPIP prices by country, score equivalences, visas and paths to work or study in Canada or the US, online courses, travel kit and eSIM, cold and flu remedies, menopause, testosterone, with the evidence cited). Returns titles, short answers, update dates and links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
