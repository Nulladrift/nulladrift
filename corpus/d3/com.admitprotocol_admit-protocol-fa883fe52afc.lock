        {
          "name": "add_file",
          "title": "Add a file",
          "description": "Uploads one PDF, JPG, PNG, HEIC or DOCX (base64, 20 MB max) as an item.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "application_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "application_token": {
                "description": "The application_token returned by verify_email for this school",
                "minLength": 20,
                "type": "string"
              },
              "base64": {
                "minLength": 1,
                "type": "string"
              },
              "filename": {
                "maxLength": 200,
                "type": "string"
              },
              "meta": {
                "properties": {
                  "attestation": {
                    "properties": {
                      "agent_edited": {
                        "const": false,
                        "type": "boolean"
                      },
                      "confirmed_by": {
                        "description": "Who confirmed the attestation before sending",
                        "enum": ["parent", "guardian"],
                        "type": "string"
                      },
                      "written_by": {
                        "const": "student",
                        "type": "string"
                      }
                    },
                    "required": ["agent_edited", "confirmed_by", "written_by"],
                    "type": "object"
                  },
                  "prompt": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "title": {
                    "maxLength": 160,
                    "type": "string"
                  },
                  "type": {
                    "enum": ["writing", "parent_statement", "transcript", "report_card", "test_score", "english_competency", "iep_504", "awards", "additional"],
                    "type": "string"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "school": {
                "description": "The school's slug from list_schools, e.g. \"vvs\"",
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["application_id", "application_token", "base64", "filename", "meta", "school"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a file"
