        {
          "name": "get_AutoComplete",
          "title": "Auto Complete",
          "description": "Auto Complete Group: Explore. Billing per call: 1 Credits. Agents can pay per call ($0.01 via x402/MPP, no API key).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "q": {
                "example": "Elon",
                "title": "Search query",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
