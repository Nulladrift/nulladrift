        },
        {
          "name": "get_Search",
          "title": "Search",
          "description": "Search Group: Explore. Billing per call: 1 Credits. Agents can pay per call ($0.01 via x402/MPP, no API key).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of Tweet results",
                "example": 20,
                "title": "Count",
                "type": "integer"
              },
              "cursor": {
                "description": "Cursor for other results",
                "title": "Cursor token",
                "type": "string"
              },
              "q": {
                "description": "You can use advanced search queries. E.g. dogecoin (from:elonmusk) Check out for more information: https://twitter.com/search-advanced",
                "example": "Dogecoin",
                "title": "Search query",
                "type": "string"
              },
              "type": {
                "description": "Default: Top.",
                "enum": ["Top", "Latest", "People", "Media", "Lists"],
                "example": "Top",
                "title": "Search type",
                "type": "string"
