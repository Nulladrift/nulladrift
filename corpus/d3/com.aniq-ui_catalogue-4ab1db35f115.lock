{
  "lockfileVersion": 2,
  "subjects": {
    "com.aniq-ui/catalogue": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.aniq-ui.com/api/catalogue/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.aniq-ui/catalogue",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Aniq-UI (https://www.aniq-ui.com) sells ready-made Next.js templates: full-stack products with an API and an admin dashboard, dashboards, landing pages and free templates, many with English and Arabic (right to left) built in. This server is public and read-only. search-templates finds templates by words, category, type or price; get-template gives one template's packages, current prices, features, tech stack and demos; list-categories lists the categories search-templates accepts. Prices are live, in US dollars, and already include any sale or launch discount running now, so quote them from here rather than from memory. A purchase is made on the template's page (pageUrl), where checkout may add local tax; send the person there, or to a demo to try it first.",
      "tools": [
        {
          "name": "get-template",
          "description": "One Aniq-UI template in full, by its slug from search-templates: its packages with the price of each now (after any sale or launch discount), what each package includes and its licence line, features, use cases, tech stack, demos, docs, the apps it is made of or the templates a bundle contains, and the bundles it is also sold in. Buying happens on pageUrl.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the texts and page links (default en)",
                "enum": ["en", "fr", "es", "ar"],
                "type": "string"
              },
              "slug": {
                "description": "The template's slug, as search-templates gives it",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one Aniq-UI template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ea35f0eaeaebd0829580a48ac8cf1e020b4d0e4f5ae3aa0e75f3af434353e50"
        },
        {
          "name": "list-categories",
          "description": "The categories of the Aniq-UI catalogue that hold at least one template, with how many each holds and its page. Pass a category's key to search-templates to list its templates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the names and page links (default en)",
                "enum": ["en", "fr", "es", "ar"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Aniq-UI template categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f77181e251369adeda8a442b937fb63dc2974a24de5cde21c316e5814f97c640"
        },
        {
          "name": "search-templates",
          "description": "Find Aniq-UI templates. With no arguments it lists the newest first. `query` matches names, descriptions, categories, tags and features, for example \"restaurant\" or \"admin dashboard arabic\". `category` takes a key from list-categories, `type` narrows to templates or bundles, and `freeOnly` or `maxPriceUsd` narrow by the price paid now. Each result has its live price in US dollars (with any discount running now), a short summary, the page to buy it on (pageUrl) and its demo. get-template has the packages and details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "A category key from list-categories",
                "maxLength": 60,
                "type": "string"
              },
              "freeOnly": {
                "description": "Only free templates",
                "type": "boolean"
              },
              "limit": {
                "description": "How many results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the texts and page links (default en)",
                "enum": ["en", "fr", "es", "ar"],
                "type": "string"
              },
              "maxPriceUsd": {
                "description": "Highest price paid now, in US dollars",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Words to look for",
                "maxLength": 120,
                "type": "string"
              },
              "type": {
                "description": "Only templates, or only bundles of several templates",
                "enum": ["template", "bundle"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Aniq-UI templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71031df239d1154a0af5d9e544dc233a280be4284580e7b35759d7931b7f84ac"
        }
      ],
      "digest": "sha256:dc9dbcd6310658f14f617a7b28d75e35537c24102d2ca0f3c77141003cffedb1"
    }
  }
}
