      },
      "instructions": "Jump on the Trend (jumponthetrend.app) puts a person's face, a friend or their pet into viral AI video trends and templates from TikTok, Reels and Shorts. The person adds a photo on the trend's page, sees a free preview still of themselves in the scene in under a minute (no sign-up), then makes the video if they like it. No app and no prompt. Use search_trends or top_trends to find trends, get_trend for one trend's details, and always give the person the trend's page link: that is where they add their photo. You can't make a video from chat. If the person has a link to a specific video they want to be in (a TikTok, Reel, Short or a video on X or Facebook), remake_video_link gives them a page with that video loaded, ready for their photo. If a trend someone asks for isn't here and they have no video of their own, suggest_trend sends its TikTok, Instagram or YouTube link to the team.",
