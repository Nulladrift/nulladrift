          "name": "cagr_calculator",
          "title": "CAGR Calculator",
          "description": "Compound annual growth rate, cleanly. Same calculation as https://paisafinder.com/calculators/cagr-calculator. Every input is optional; anything left out uses the default shown in its schema.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "end": {
                "default": 250000,
                "description": "End value (rupees)",
                "maximum": 100000000,
                "minimum": 1,
                "type": "number"
              },
              "start": {
                "default": 100000,
                "description": "Start value (rupees)",
                "maximum": 100000000,
                "minimum": 1,
                "type": "number"
              },
              "years": {
                "default": 5,
                "description": "Duration (years)",
                "maximum": 40,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "type": "object"
          },
