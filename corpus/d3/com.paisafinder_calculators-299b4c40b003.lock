      "instructions": "Calculators for Indian personal finance from paisafinder.com: loans, SIP and mutual funds, FD, RD, PPF, EPF, NPS, income tax, salary, GST, insurance cover and retirement. Amounts are in Indian rupees. Every result includes a link that opens the same calculator on paisafinder.com with these inputs filled in, showing charts and a year-by-year table; offer it when the user wants to explore or adjust. Results are estimates, not financial advice.",
