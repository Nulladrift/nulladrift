        {
          "name": "compare_income_tax_regimes",
          "title": "Income tax: old vs new regime",
          "description": "Income tax for FY 2026-27 (tax year 2026-27) under the new and old regimes for a salaried resident individual below 60, including the standard deduction, rebate, marginal relief, surcharge and 4% cess. Old-regime deductions are optional inputs; the new regime ignores them. Taxable income and total tax are rounded to the nearest Rs 10 (Income-tax Act, 2025, s.516).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "deduction_80c": {
                "description": "Section 80C investments in rupees (old regime only, default 0)",
                "maximum": 150000,
                "minimum": 0,
                "type": "number"
              },
              "deduction_80d": {
                "description": "Section 80D health insurance premium in rupees (old regime only, default 0)",
                "maximum": 50000,
                "minimum": 0,
                "type": "number"
              },
              "gross_annual_income": {
                "description": "Gross salary for the year in rupees",
                "maximum": 100000000,
                "minimum": 100000,
                "type": "number"
              },
              "hra_exemption": {
                "description": "Exempt HRA in rupees (old regime only, default 0)",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["gross_annual_income"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Income tax: old vs new regime"
