        {
          "name": "calculate_xirr",
          "title": "XIRR from dated transactions",
          "description": "XIRR (annualised return) on investments made on different dates, such as mutual fund SIP instalments, top-ups and withdrawals, from a list of dated transactions and the holding's current value. Same definition as Excel's XIRR (actual days / 365). Also returns total invested, withdrawn, gain and absolute return.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "current_value": {
                "description": "What the holding is worth now, in rupees (0 if fully withdrawn)",
                "maximum": 100000000000,
                "minimum": 0,
                "type": "number"
              },
              "transactions": {
                "description": "Each investment or withdrawal, in any order",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Amount in rupees, always positive",
                      "maximum": 10000000000,
                      "minimum": 1,
                      "type": "number"
                    },
                    "date": {
                      "description": "Date as YYYY-MM-DD",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "type": {
                      "description": "invest = money put in; withdraw = money taken out (default invest)",
                      "enum": ["invest", "withdraw"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "date"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "value_date": {
                "description": "Date of current_value as YYYY-MM-DD (default: today in India)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["current_value", "transactions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "XIRR from dated transactions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://paisafinder/calculator-chart-v2.html",
            "openai/toolInvocation/invoked": "Calculated on PaisaFinder",
            "openai/toolInvocation/invoking": "Calculating on PaisaFinder",
            "ui": {
              "resourceUri": "ui://paisafinder/calculator-chart-v2.html"
            }
          },
          "digest": "sha256:b06bf0b7b0aa64769978705a4515dc3d3c428c792e00f98914c5c0f0f6ac40a3"
        },
        {
          "name": "compare_income_tax_regimes",
          "title": "Income tax: old vs new regime",
          "description": "Income tax for FY 2026-27 (tax year 2026-27) under the new and old regimes for a salaried resident individual below 60, including the standard deduction, rebate, marginal relief, surcharge and 4% cess. Starts from salary: the HRA exemption is worked out from basic pay, HRA received and rent. Old-regime deductions (HRA, 80C, 80D, own NPS 80CCD(1B), home loan interest) are optional inputs; employer NPS counts in both regimes (up to 14% of basic in the new regime, 10% in the old). Taxable income and total tax are rounded to the nearest Rs 10 (Income-tax Act, 2025, s.516).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "basic_monthly": {
                "description": "Basic + DA a month in rupees (default: half of gross / 12). Used for HRA and the employer NPS limit",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "deduction_80c": {
                "description": "Section 80C investments in rupees, including employee EPF (old regime only, default 0)",
                "maximum": 150000,
                "minimum": 0,
                "type": "number"
              },
              "deduction_80d": {
                "description": "Section 80D health insurance premium in rupees (old regime only, default 0)",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "employer_nps": {
                "description": "Employer NPS contribution for the year in rupees (both regimes, default 0)",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "gross_annual_income": {
                "description": "Gross salary for the year in rupees, including HRA, bonus and employer NPS",
                "maximum": 100000000,
                "minimum": 100000,
                "type": "number"
              },
              "home_loan_interest": {
                "description": "Interest on a self-occupied home loan for the year in rupees (old regime only, default 0)",
                "maximum": 200000,
                "minimum": 0,
                "type": "number"
              },
              "hra_received_monthly": {
                "description": "HRA received a month in rupees (default 0)",
                "maximum": 2500000,
                "minimum": 0,
                "type": "number"
              },
              "lives_in_50_percent_city": {
                "description": "Lives in Mumbai, Delhi, Kolkata, Chennai, Bengaluru, Hyderabad, Pune or Ahmedabad (default true)",
                "type": "boolean"
              },
              "own_nps_80ccd1b": {
                "description": "Own NPS contribution under 80CCD(1B), in rupees (old regime only, default 0)",
                "maximum": 50000,
                "minimum": 0,
                "type": "number"
              },
              "rent_monthly": {
                "description": "Rent paid a month in rupees (default 0)",
                "maximum": 2500000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["gross_annual_income"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Income tax: old vs new regime"
          },
          "behavior": {
            "destructive": false,
