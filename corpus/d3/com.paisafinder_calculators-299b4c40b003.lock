        {
          "name": "health_insurance_cover_calculator",
          "title": "Health Insurance Cover",
          "description": "Tier-aware sum insured with medical inflation. Same calculation as https://paisafinder.com/calculators/health-insurance-cover-calculator. Every input is optional; anything left out uses the default shown in its schema.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "default": 2,
                "description": "Adults covered",
                "maximum": 4,
                "minimum": 1,
                "type": "number"
              },
              "age": {
                "default": 40,
                "description": "Age of eldest insured (years)",
                "maximum": 80,
                "minimum": 18,
                "type": "number"
              },
              "cityTier": {
                "default": 1,
                "description": "City tier. 1 = metros (Mumbai, Delhi, BLR) · 2 = major cities · 3 = smaller towns",
                "maximum": 3,
                "minimum": 1,
                "type": "number"
              },
              "existing": {
                "default": 500000,
                "description": "Existing health cover (rupees). Include employer cover",
                "maximum": 50000000,
                "minimum": 0,
                "type": "number"
              },
