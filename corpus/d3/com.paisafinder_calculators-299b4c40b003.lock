        {
          "name": "calculate_loan_emi",
          "title": "Loan EMI",
          "description": "Monthly EMI, total interest and total repayment for a home, car or personal loan in India (reducing-balance method, monthly rests). Optional part-payments (a yearly amount, and a one-time amount in a chosen year) keep the EMI and shorten the loan, as banks do by default; the result then shows the interest saved and when the loan ends.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_interest_rate": {
                "description": "Interest rate, % per year (8.5 means 8.5%)",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "one_time_part_payment": {
                "description": "Optional one-time extra payment, in rupees (default 0)",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "one_time_part_payment_year": {
                "description": "Year whose last EMI the one-time payment is made with (default 5)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "principal": {
                "description": "Loan amount in rupees",
                "maximum": 100000000,
                "minimum": 5000,
                "type": "number"
              },
              "tenure_years": {
                "description": "Loan tenure in years",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "yearly_part_payment": {
                "description": "Optional extra payment made with every 12th EMI, in rupees (default 0)",
                "maximum": 50000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["annual_interest_rate", "principal", "tenure_years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Loan EMI"
