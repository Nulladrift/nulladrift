      "instructions": "Calculators for Indian personal finance from paisafinder.com: loans, SIP and mutual funds, FD, RD, PPF, EPF, NPS, income tax, salary, GST, insurance cover and retirement. Amounts are in Indian rupees. Every result includes a link that opens the same calculator on paisafinder.com with these inputs filled in, showing charts and a year-by-year table; offer it when the user wants to explore or adjust. Results are estimates, not financial advice.",
      "tools": [
        {
          "name": "cagr_calculator",
          "title": "CAGR Calculator",
          "description": "Average yearly growth between a start and an end value. Same calculation as https://paisafinder.com/calculators/cagr-calculator. Every input is optional; anything left out uses the default shown in its schema.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "end": {
                "default": 250000,
                "description": "End value (rupees)",
                "maximum": 100000000,
                "minimum": 1,
                "type": "number"
              },
              "start": {
                "default": 100000,
                "description": "Start value (rupees)",
                "maximum": 100000000,
                "minimum": 1,
                "type": "number"
              },
              "years": {
                "default": 5,
                "description": "Duration (years)",
                "maximum": 40,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
