        {
          "name": "calculate_salary_in_hand",
          "title": "Salary in-hand from CTC",
          "description": "Monthly and yearly in-hand salary from an annual CTC in India under the new tax regime (FY 2026-27). Assumes employee and employer PF at 12% of basic capped at Rs 1,800 a month, gratuity at 4.81% of basic, and professional tax of Rs 200 a month. Variable pay is shown separately after its own tax.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_ctc": {
                "description": "Annual CTC in rupees",
                "maximum": 50000000,
                "minimum": 200000,
                "type": "number"
              },
              "basic_percent": {
                "description": "Basic salary as % of fixed pay (default 50)",
                "maximum": 60,
                "minimum": 30,
                "type": "number"
              },
              "variable_pay_percent": {
                "description": "Variable pay or bonus as % of CTC (default 0)",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["annual_ctc"],
            "type": "object"
          },
          "annotations": {
