        {
          "name": "gst_calculator",
          "title": "GST Calculator",
          "description": "Add or remove GST for any rate and amount. Same calculation as https://paisafinder.com/calculators/gst-calculator. Every input is optional; anything left out uses the default shown in its schema.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amt": {
                "default": 10000,
                "description": "Amount (rupees)",
                "maximum": 100000000,
                "minimum": 1,
                "type": "number"
              },
              "mode": {
                "default": 0,
