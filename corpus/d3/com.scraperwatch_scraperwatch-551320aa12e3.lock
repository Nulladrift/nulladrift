{
  "lockfileVersion": 2,
  "subjects": {
    "com.scraperwatch/scraperwatch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scraperwatch.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ScraperWatch",
        "title": "ScraperWatch: saved scraper usage and success statistics",
        "version": "1.3.0",
        "description": "Find and compare named ready-made scrapers from saved usage, reliability and billing evidence; compare saved RAG extraction and proxy pricing offers with source links.",
        "websiteUrl": "https://scraperwatch.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use find_scrapers when you need to extract data from a specific website (e.g. 'zillow', 'amazon', 'google maps') to compare ready-made scrapers using saved official Apify Store 30-day aggregate statistics. Read evidence for the snapshot source date, age and date status; these statistics are not a live execution test or assurance of current operation. Use compare_scrapers with two to five exact actor IDs from find_scrapers for an explicit candidate comparison and existing target-page links. Use compare_proxy_providers for cached proxy product pricing and optional monthly GB workloads; unknown costs remain unknown.",
      "tools": [
        {
          "name": "actor_history",
          "description": "How have one tracked actor's usage, run completion and primary event price changed by day? Uses compact official Apify Store history exports; dates are snapshot filenames, not verified per-actor observation times. days is a UTC calendar window ending today (1-365). Missing days stay absent; event rates are not total cost or necessarily per result.",
          "inputSchema": {
            "properties": {
              "actor_id": {
                "title": "Actor Id",
                "type": "string"
              },
              "days": {
                "default": 30,
                "maximum": 365,
                "minimum": 1,
                "title": "Days",
                "type": "integer"
              }
            },
            "required": ["actor_id"],
            "title": "actor_historyArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4fd185de90848a85f02e9961a0c1171f884f319d5e5bbc687d1efe71da41781d"
        },
        {
          "name": "best_scraper",
          "description": "Which tracked actors lead recorded run completion, usage and qualifying price for a website? Uses the filtered official Apify Store export; data_updated and evidence give snapshot date and age. Completion candidates require 300+ runs and 20+ users; price candidates also require 95%+ completion and known result-event rates. No live tests or output-quality measure.",
          "inputSchema": {
            "properties": {
              "site": {
                "title": "Site",
                "type": "string"
              }
            },
            "required": ["site"],
            "title": "best_scraperArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f5a796e66c4f5d0c3f301e01bae2f329b620835d81dd098ccd32bf786b62773c"
        },
        {
          "name": "compare_proxy_providers",
          "description": "What captured proxy offers cover a product type and optional monthly GB? Uses research/e5/proxies.json; observed_on dates each captured offer, with observations outside the past 30 days omitted. Estimates full saved package bills only; IP offers are separate and unknown costs remain null. No live prices or performance measurements.",
          "inputSchema": {
            "properties": {
              "monthly_gb": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Monthly Gb"
              },
              "product_type": {
                "enum": ["residential", "datacenter", "isp_static_residential", "mobile"],
                "title": "Product Type",
                "type": "string"
              }
            },
            "required": ["product_type"],
            "title": "compare_proxy_providersArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84393cede819de3bcc48636e95f0635ce860e128315fe767eb037471c8611ab4"
        },
        {
          "name": "compare_rag_extractors",
          "description": "How did Firecrawl, Jina Reader and DIY extraction score on saved documentation fixtures? Uses the saved RAG benchmark and hash-checked table audit. Per-vendor last_run dates are source observations; generation time is unknown. Returns text/code/table scores and latency with limitations; audit may be unavailable or stale. No live tests or comparable cost.",
          "inputSchema": {
            "properties": {},
            "title": "compare_rag_extractorsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abc9d32fbf96e2a187a5b86477234eb2767f73c7d8ce46835f55391413fdb356"
        },
        {
          "name": "compare_scrapers",
          "description": "How do two to five exact actor IDs compare? Uses the filtered official Apify Store export; data_updated and evidence describe the saved snapshot date and age. Reports usage, eligible run completion and compatible result-event rates; unknown/excluded IDs are indistinguishable. Different targets have no winner; listed rates are not total cost.",
          "inputSchema": {
            "properties": {
              "actor_ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "title": "Actor Ids",
                "type": "array"
              }
            },
            "required": ["actor_ids"],
            "title": "compare_scrapersArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15eaa9ad3740e33525e523280bf7182c5c5fbd46dc6ba875681a432bbead7439"
        },
        {
          "name": "compare_scraping_apis",
          "description": "What do saved scraping API tests report? Uses the saved API benchmark summary and frozen matched ScraperAPI/ScrapingBee report. generated_at/window_days date the aggregate only; matched evidence has its own window. Returns completion/content checks and latency with separate denominators and limitations; no current vendor requests.",
          "inputSchema": {
            "properties": {},
            "title": "compare_scraping_apisArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ab268c19b1eee5fdb0eb4c5fd339ba1219a07cdab695b51d95ea24a9df447da9"
        },
        {
          "name": "find_scrapers",
          "description": "Which tracked scrapers have the most recorded 30-day users for a website? Uses the filtered official Apify Store export; data_updated is the saved snapshot timestamp, with age/status in evidence. Returns usage, run completion and billing fields, not live tests. min_success_rate: zero includes unknown rates; positive thresholds require known rates.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "title": "Limit",
                "type": "integer"
              },
              "min_success_rate": {
                "default": 0,
                "maximum": 1,
                "minimum": 0,
                "title": "Min Success Rate",
                "type": "number"
              },
              "site": {
                "title": "Site",
                "type": "string"
              }
            },
            "required": ["site"],
            "title": "find_scrapersArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2c582ec737d975313e3a5f004f7ce3ac2f7a3b4f939da9290404299b8d949df"
        },
        {
          "name": "list_websites",
          "description": "Which websites are in the filtered scraper export, and how many actors and summed 30-day users does each have? Uses saved official Apify Store statistics from latest.json. Counts reflect that snapshot, not live coverage; this response has no date field. Summed actor users are not deduplicated across actors.",
          "inputSchema": {
            "properties": {},
            "title": "list_websitesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "list_websitesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:39703eb7d32aa46caea5df6bc121b1f90793354f7593115dfc4c3d1ffa767263"
        }
      ],
      "digest": "sha256:2825ec2f66f19296a258206000649219e92ab95edab1725b0ad103f90a1a7f66"
    }
  }
}
