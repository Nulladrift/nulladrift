        {
          "name": "calculate_auto_loan",
          "title": "Calculate an auto loan",
          "description": "Monthly payment, amount financed, total interest and total cost for one US car loan. Amount financed = price − down − trade-in + owed on trade-in; sales tax and fees are paid upfront unless tax_and_fees_financed is true, then they are added to the loan. total_cost = cash due at purchase + all payments (price + tax + fees + interest − trade-in + owed). Returns the inputs echoed back and a carloanmath.com share_url. When optional inputs are omitted, the result includes assumed_defaults (the values actually used) and a short text line so you can call again with those parameters. assumed_defaults is omitted when every optional input was provided.",
