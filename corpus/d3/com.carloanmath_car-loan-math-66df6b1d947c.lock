        {
          "name": "max_vehicle_price_for_budget",
          "title": "Max car price for a monthly budget",
          "description": "Reverse calculation: the highest vehicle price whose monthly payment stays within monthly_budget, for one or more terms. Uses the same tax, fee, down payment and trade-in rules as calculate_auto_loan. Each row includes the check calculation and its share_url. When optional inputs are omitted, the result includes assumed_defaults (the values actually used) and a short text line so you can call again with those parameters. assumed_defaults is omitted when every optional input was provided.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "apr": {
                "description": "Yearly interest rate in percent, compounded monthly (the same number as the site’s rate field), e.g. 6.5 for 6.5%. A lender’s APR can be a little higher because it folds in some fees. Use 0 for 0% financing.",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "country": {
                "default": "US",
                "description": "Country of the purchase, ISO 3166-1 alpha-2. Default \"US\". Only US is available for now.",
                "enum": ["US"],
                "type": "string"
              },
              "down": {
                "description": "Cash down payment in USD. Default 0.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "fees": {
                "description": "Title, registration, documentation and dealer fees in USD. Default 0.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "monthly_budget": {
                "description": "Most the buyer wants to pay per month, in USD.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "owed_on_trade_in": {
                "description": "Loan balance still owed on the trade-in, rolled into the new loan (negative equity). Default 0.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "sales_tax_rate": {
                "description": "Sales tax in percent of the vehicle price, e.g. 7 for 7%. No state rules or trade-in tax credit are applied. Default 0.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "tax_and_fees_financed": {
                "default": false,
                "description": "false (default, the site's \"Pay upfront\"): sales tax and fees are paid in cash at purchase, not financed. true: they are added to the loan.",
                "type": "boolean"
              },
              "term_months": {
