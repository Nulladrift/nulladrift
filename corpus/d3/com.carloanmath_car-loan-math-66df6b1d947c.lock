      },
      "instructions": "US auto-loan maths in USD. Every tool takes an optional country (ISO 3166-1 alpha-2, default US; only US for now), echoed in results. Rates and tax are percents (6.5 = 6.5%). Terms are 1–120 months. Every result has a carloanmath.com share_url that opens the same scenario; give it to the user. If optional inputs were omitted, assumed_defaults lists the values used so you can call again with those parameters. Estimates only, not a loan offer.",
      "tools": [
        {
          "name": "amortization_schedule",
          "title": "Auto loan amortization schedule",
          "description": "Principal, interest and remaining balance over the life of one loan. Yearly summary by default; period 'month' gives every payment (up to 120 rows). When optional inputs are omitted, the result includes assumed_defaults (the values actually used) and a short text line so you can call again with those parameters. assumed_defaults is omitted when every optional input was provided.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "apr": {
                "description": "Yearly interest rate in percent, compounded monthly (the same number as the site’s rate field), e.g. 6.5 for 6.5%. A lender’s APR can be a little higher because it folds in some fees. Use 0 for 0% financing.",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "country": {
                "default": "US",
                "description": "Country of the purchase, ISO 3166-1 alpha-2. Default \"US\". Only US is available for now.",
                "enum": ["US"],
                "type": "string"
              },
              "down": {
                "description": "Cash down payment in USD. Default 0.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "fees": {
                "description": "Title, registration, documentation and dealer fees in USD. Default 0.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "owed_on_trade_in": {
                "description": "Loan balance still owed on the trade-in, rolled into the new loan (negative equity). Default 0.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "period": {
                "description": "'year' (default) or 'month'.",
                "enum": ["year", "month"],
                "type": "string"
              },
              "price": {
                "description": "Vehicle price in USD (before tax, fees, down payment and trade-in).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "sales_tax_rate": {
                "description": "Sales tax in percent of the vehicle price, e.g. 7 for 7%. No state rules or trade-in tax credit are applied. Default 0.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "tax_and_fees_financed": {
                "default": false,
                "description": "false (default, the site's \"Pay upfront\"): sales tax and fees are paid in cash at purchase, not financed. true: they are added to the loan.",
                "type": "boolean"
              },
              "term_months": {
                "description": "Loan term in whole months, 1–120 (common: 36, 48, 60, 72, 84).",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "trade_in": {
                "description": "Trade-in value in USD credited against the price. Default 0.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["apr", "price", "term_months"],
            "type": "object"
          },
