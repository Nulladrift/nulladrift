      "serverInfo": {
        "name": "Canarias.com Rentacar",
        "version": "1.1.0",
        "description": "Car hire in Tenerife with offices across the island. Real-time prices and availability."
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "tools": [
        {
          "name": "buscar_disponibilidad",
          "title": "Find cars and prices",
          "description": "Searches available cars and final prices for given dates and Tenerife offices. Returns only Canarias.com's own fleet. The price includes full insurance with no excess (drivers aged 23 or over, subject to terms). Each offer also shows the deposit. Each result includes precioOnline (advance online payment, 10% online payment discount; null when only pay at pickup is available), precioEnOficina (standard rate, paid at pickup), ahorroOnline (precioEnOficina minus precioOnline, computed by the engine) and, when available, resumenPrecio (ready-made text with both prices). Online payment is optional; prepaid rentals can be cancelled free of charge up to 24 hours before pickup, with a refund. The deposit guarantees the car is returned on time.",
          "inputSchema": {
            "properties": {
              "devolucion": {
                "description": "Local drop-off date and time, YYYY-MM-DDTHH:mm",
                "type": "string"
              },
              "edad": {
                "default": 30,
                "description": "Driver age, 21 to 85",
                "type": "integer"
              },
              "oficinaDevolucion": {
                "description": "Numeric drop-off office ID",
                "type": "integer"
              },
              "oficinaRecogida": {
                "description": "Numeric pickup office ID",
                "type": "integer"
              },
              "recogida": {
                "description": "Local pickup date and time, YYYY-MM-DDTHH:mm",
                "type": "string"
              }
            },
            "required": ["devolucion", "oficinaDevolucion", "oficinaRecogida", "recogida"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find cars and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://canarias/coches-v1.html",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:6cd0e525dcf7d1214d7861563c67ef3802f116d013a3fe6e3d30d49d71a1f9db"
        },
        {
          "name": "buscar_oficinas",
          "title": "Find offices in Tenerife",
          "description": "Lists Canarias.com rental offices in Tenerife for pickup and drop-off.",
          "inputSchema": {
