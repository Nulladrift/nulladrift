        },
        {
          "name": "crear_enlace_reserva",
          "title": "Create a link to complete the booking",
          "description": "Prepares the selected car and extras and returns a single-use link to the pre-filled booking form on rentacar.canarias.com. Customer details are optional and included only with permission. The customer reviews current availability and the final price and completes the booking on the website. The link expires after at most 30 minutes, or sooner if the offer expires. The response contains enlace (the continuation URL), caducaEnMinutosMaximos (maximum validity in minutes), mensajeCliente (customer-facing text) and aviso (the reminder that completion takes place on the website). This tool does not book, charge or cancel.",
          "inputSchema": {
            "properties": {
              "cliente": {
                "default": null,
                "description": "Optional customer details shared with permission",
                "properties": {
                  "apellidos": {
                    "type": ["string", "null"]
                  },
                  "email": {
                    "type": ["string", "null"]
                  },
                  "nombre": {
                    "type": ["string", "null"]
                  },
                  "telefono": {
                    "type": ["string", "null"]
                  },
                  "vuelo": {
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "extras": {
                "default": null,
                "description": "Selected extras by ID and quantity",
                "items": {
                  "properties": {
                    "cantidad": {
                      "description": "Quantity",
                      "type": "integer"
                    },
                    "id": {
                      "description": "Extra ID",
                      "type": ["string", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"]
              },
              "idOferta": {
                "description": "Offer ID",
                "type": "string"
              },
              "pagoOnline": {
                "default": null,
                "description": "Initial payment preference; the customer can change it on the website",
                "type": ["boolean", "null"]
              }
            },
            "required": ["idOferta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a link to complete the booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
