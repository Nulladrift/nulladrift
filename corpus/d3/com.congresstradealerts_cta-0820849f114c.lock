{
  "lockfileVersion": 2,
  "subjects": {
    "com.congresstradealerts/cta": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://congresstradealerts.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "congress-trade-alerts",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Congress Trade Alerts serves congressional stock-trade disclosures from periodic transaction reports (PTRs), as recorded in CTA's database. Coverage: House PTRs come from the House Clerk. Senate PTRs come from the Senate eFD system up to October 23, 2026, when eFD began blocking CTA's collector; since then the only Senate rows are filings relayed by readers, so recent Senate coverage is partial. Every count, ranking and list these tools return describes CTA's records, not the full trading of Congress. Disclosures can arrive up to 45 days after a trade (later when filed late), so the newest part of any window is incomplete. Each filing's lateness is measured against the 45-day STOCK Act deadline. Not financial advice.",
      "tools": [
        {
          "name": "get_aggregate_stats",
          "title": "Aggregate Stats",
          "description": "Get high-level stats on CTA's records: trades recorded (since records began + 30/60/90d), members with recorded trades, avg filing delay, sector breakdown.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a999c51b8adbd1aa3ddb25e24d36e6f082f7988abcbae37e780a97bc9112cc63"
        },
        {
          "name": "get_chamber_breakdown",
          "title": "Chamber Breakdown",
          "description": "Get counts of the trades in CTA's records broken down by chamber (House vs Senate), with optional date filter. Senate counts since October 23, 2026 are partial (see the server instructions).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "Look-back window in days, measured on trade date. Disclosures can arrive up to 45 days after the trade (later if filed late), so the newest part of any window is incomplete.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:83c9e97ecb62f2b4d14af378ec8146890474f511d70c102a9b50840ff7e640df"
        },
        {
          "name": "get_committee_trading",
          "title": "Committee Trading Activity",
          "description": "For a given congressional committee, returns which members have stock trades in CTA's records for the last N days, their trade counts, and the percentage of the committee with at least one recorded trade.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "committee_name": {
                "description": "Committee name or partial match, e.g. \"Armed Services\", \"Finance\"",
                "type": "string"
              },
              "days": {
                "default": 90,
                "description": "Look-back window in days, measured on trade date (default 90). Disclosures can arrive up to 45 days after the trade (later if filed late), so the newest part of any window is incomplete.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["committee_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c73c78f8afe0fe8dcac8dfff2465191300cd8f5efe8200de7ddff820d1936d59"
        },
        {
          "name": "get_member_profile",
          "title": "Member Profile",
          "description": "Returns a trading profile for one member of Congress from CTA's records: trade count, buys and sells, first and last trade dates, average disclosure lag, party, chamber, state, and committee assignments. member_name must exactly match the stored member name (the STOCK Act filer name with honorifics removed, often a legal name); a name that does not match returns total_trades 0 and no error, so resolve names with search_members_and_tickers first. The profile covers only trades filed under that exact spelling.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "member_name": {
                "description": "Exact stored member name, e.g. \"Tommy Tuberville\"; look it up with search_members_and_tickers",
                "type": "string"
              }
            },
            "required": ["member_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:03d89a3a3cfb07f5f7dd90c703ea06e622f13979ad991453ee916c74e9544187"
        },
        {
          "name": "get_member_trades",
          "title": "Member Trades",
          "description": "Returns stock trades disclosed by one member of Congress, newest trade first, with optional ticker and date-window filters. member_name must exactly match the member name as stored: the STOCK Act filer name with honorifics removed, which is often a legal name rather than the name the member is commonly known by. A name that does not match returns count 0 and no error, so resolve a common or partial name with search_members_and_tickers first. Only trades filed under that exact spelling are returned; for a member who filed under more than one spelling, use get_trade_feed with a partial name to include the other spellings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "Only trades whose trade date is within the last N days. Disclosures can arrive up to 45 days after the trade (later if filed late), so the newest part of the window is incomplete.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 50,
                "description": "Max trades to return (default 50)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "member_name": {
                "description": "Exact stored member name, e.g. \"Nancy Pelosi\"; look it up with search_members_and_tickers",
                "type": "string"
              },
              "ticker": {
                "description": "Filter to a specific ticker symbol, e.g. \"NVDA\"",
                "type": "string"
              }
            },
            "required": ["member_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:775435b9577596b15b189fa6a8514805014e92c9b683a173c2bf5fcd1a9b842e"
        },
        {
          "name": "get_party_breakdown",
          "title": "Party Breakdown",
          "description": "Get counts of the trades in CTA's records broken down by party (D/R/I), with optional date filter.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "Look-back window in days, measured on trade date. Disclosures can arrive up to 45 days after the trade (later if filed late), so the newest part of any window is incomplete.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4475331173d337aacc231f2c00bafa092b43b3a34911a4870d3c81fb0dbfe097"
        },
        {
          "name": "get_ticker_buyers",
          "title": "Ticker Buyers",
          "description": "Get the members of Congress with a recorded purchase of a specific ticker in CTA's records for the last N days, aggregated per politician.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "default": 90,
                "description": "Look-back window in days, measured on trade date. Disclosures can arrive up to 45 days after the trade (later if filed late), so the newest part of any window is incomplete.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "Ticker symbol, e.g. \"NVDA\"",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:428ba4906da12fc0cda93fa9085f5dfae297e5298a1dad3776c2214633a30bde"
        },
        {
          "name": "get_top_tickers",
          "title": "Top Tickers",
          "description": "Get the tickers with the most congressional trades in CTA's records for the last N days. Set tx_type='Purchase' for most-bought tickers, or tx_type='Sale' for most-sold. Omit tx_type to rank purchases and sales together (default).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "default": 90,
                "description": "Look-back window in days, measured on trade date. Disclosures can arrive up to 45 days after the trade (later if filed late), so the newest part of any window is incomplete.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "description": "Max results",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "tx_type": {
                "description": "Filter by transaction type: \"Purchase\" = buys only, \"Sale\" = sells only. Omit for all trades.",
                "enum": ["Purchase", "Sale"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b582934e33f08f81cc4fe6fc03ae24a655d44550ac32862222f93b4c97ba7a1"
        },
        {
          "name": "get_top_traders",
          "title": "Top Traders",
          "description": "Returns the members of Congress with the most trades in CTA's records, by trade count, optionally filtered by chamber (House or Senate) and date window.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chamber": {
                "description": "Filter by chamber",
                "enum": ["House", "Senate"],
                "type": "string"
              },
              "days": {
                "default": 90,
                "description": "Look-back window in days, measured on trade date (default 90). Disclosures can arrive up to 45 days after the trade (later if filed late), so the newest part of any window is incomplete.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "description": "Number of traders to return (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4c0193b15548d5e8a13cea8d496c55776d37288e2b1fd27dad6e256d019d628"
        },
        {
          "name": "get_trade_feed",
          "title": "Trade Feed",
          "description": "Get recently disclosed congressional stock trades from CTA's records, with optional filters for politician, ticker, party, chamber, and transaction type.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chamber": {
                "description": "Filter by chamber",
                "enum": ["House", "Senate"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max results",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "party": {
                "description": "Filter by party",
                "enum": ["D", "R", "I"],
                "type": "string"
              },
              "politician": {
                "description": "Case-insensitive partial match on the member name, e.g. \"Pelosi\"",
                "type": "string"
              },
              "ticker": {
                "description": "Filter by ticker symbol",
                "type": "string"
              },
              "tx_type": {
                "description": "Filter by transaction type",
                "enum": ["Purchase", "Sale"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36f5500abe72571e935f7e667d1a4b1ac250fe67cb72cf21c5ecf28fd4f954ae"
        },
        {
          "name": "get_trades_by_ticker",
          "title": "Trades by Ticker",
          "description": "Get the congressional trades in CTA's records for a specific stock ticker symbol, newest first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "Look-back window in days, measured on trade date. Disclosures can arrive up to 45 days after the trade (later if filed late), so the newest part of any window is incomplete.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 50,
                "description": "Max results",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "Ticker symbol, e.g. \"AAPL\"",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1a4f3e600f35e2ec6986f243583622bccf02179488d30ce1bc3ed24e3f3a3e2"
        },
        {
          "name": "search_members_and_tickers",
          "title": "Search",
          "description": "Case-insensitive substring search over member names, ticker symbols, and company names. Returns up to `limit` matching members and up to `limit` matching tickers, each ordered by trade count. Use it to turn a common or partial name into the exact stored name that get_member_trades and get_member_profile require. A member who filed under several spellings appears once, under one of them, with trade_count summed across those spellings, so get_member_trades on that name can return fewer trades. It matches substrings only and does not correct misspellings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Max results",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search query",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a32622f2f8a693c5e68f9aee7e28f05a74817876b8e7f61a9333b54c8c0924ca"
        }
      ],
      "digest": "sha256:4b54c17442cc017530426f1703534b46952ec7ecc1c6b594090fdd18b63cba50"
    }
  }
}
