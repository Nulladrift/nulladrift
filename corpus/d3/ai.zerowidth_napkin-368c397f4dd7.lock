                "description": "Mermaid flowchart source. Start with `flowchart TD` (top-down) or `flowchart LR` (left-right). Declare shaped nodes — `A[\"Rect\"]`, `B(\"Rounded\")`, `C{\"Decision\"}`, `D([\"Stadium\"])`, `E((\"Circle\"))`, `F{{\"Hexagon\"}}` — and link them with `A -->|label| B`, `A -.-> B` (dotted), or `A ==> B` (thick). Group steps with `subgraph Name[\"Title\"] ... end`. Color a node with a trailing `style A fill:#fee2e2` line. Only the flowchart subset is supported. Each label is a short name on one line, written plainly: no `\\n`, no backslashes before quotes. A step's label is its name everywhere in Compass.",
                "maxLength": 200000,
                "type": "string"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "workspace": {
