                      "type": "string"
                    },
                    "size": {
                      "description": "This slide's own size, when slides differ — a set of ads at 1:1, 4:5 and 9:16 in one deck. Same keys as `size`.",
                      "enum": ["16:9", "16:10", "4:3", "1:1", "4:5", "9:16", "1.91:1", "x-post", "og", "pin", "youtube-thumb", "linkedin-page", "linkedin-profile", "x-header", "youtube-banner", "facebook-cover", "300x250", "336x280", "728x90", "970x250", "300x600", "160x600", "320x50", "320x100", "email-header", "letter", "a4"],
                      "type": "string"
                    },
                    "sizes": {
                      "description": "Make this slide once per size — with a layout, each size gets its own arrangement.",
                      "items": {
                        "enum": ["16:9", "16:10", "4:3", "1:1", "4:5", "9:16", "1.91:1", "x-post", "og", "pin", "youtube-thumb", "linkedin-page", "linkedin-profile", "x-header", "youtube-banner", "facebook-cover", "300x250", "336x280", "728x90", "970x250", "300x600", "160x600", "320x50", "320x100", "email-header", "letter", "a4"],
                        "type": "string"
                      },
                      "maxItems": 12,
                      "type": "array"
                    },
                    "slots": {
                      "additionalProperties": {
                        "maxLength": 2000,
