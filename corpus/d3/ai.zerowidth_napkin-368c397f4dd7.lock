        {
          "name": "napkin_interfaces_grant",
          "title": "Change what a Napkin interface can reach",
          "description": "Set what an interface may run — flows and shims, each pinned to a published version. This is the interface's ONLY reach into the workspace, and it replaces the whole list, so include everything it should keep. Ids and published versions come from workbench_flows_list / workbench_shim_list and their revisions. Ask the user before widening this.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "grants": {
                "description": "The complete list. Passing an empty list removes all access.",
                "items": {
                  "properties": {
                    "kind": {
                      "description": "What kind of thing this grant names.",
                      "enum": ["flow", "shim"],
                      "type": "string"
                    },
                    "targetId": {
                      "description": "The flow's or shim's id.",
                      "type": "string"
                    },
                    "version": {
                      "description": "A PUBLISHED version of it. The interface runs exactly this one until it's changed.",
                      "type": "string"
                    }
                  },
                  "required": ["kind", "targetId", "version"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "interfaceId": {
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["grants", "interfaceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Change what a Napkin interface can reach"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
