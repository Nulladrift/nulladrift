          "description": "Save a picture the user attached in THIS conversation to the workspace's files, in the Home folder \"From chat\", and get back its file id. Use it when the user wants a picture they sent you used somewhere — an interface shows it as <img src=\"file:<fileId>\"> (CSS: url(file:<fileId>)). Pick the picture by `name`: the name in its `[attached image: <name>]` marker. Omit `name` only when the latest message with pictures has exactly one. Saving the same picture again returns the file it was already saved as. Only pictures from this conversation can be saved; a picture on a website can't be fetched, so ask the user to attach it here.",
