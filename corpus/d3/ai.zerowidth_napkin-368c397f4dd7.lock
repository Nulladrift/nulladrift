        {
          "name": "napkin_boards_update",
          "title": "Rename, describe, archive, or share a Napkin board",
          "description": "Edits a board's details: name, description, visibility, or `archived` (true takes it out of the gallery; false brings it back — the recovery move for a board you created by mistake or the user no longer wants). Board ids come from napkin_boards_list. Boards are working material: no approval card, every change attributed.",
