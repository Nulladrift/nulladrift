                      },
                      "description": "What goes in the layout's slots. Plain text; `points` is one item per line; `image` and `mark` are `kit:<name>` or `file:<id>`.",
                      "propertyNames": {
                        "enum": ["eyebrow", "headline", "subhead", "body", "points", "stat", "statLabel", "quote", "attribution", "cta", "footer", "image", "mark"],
                        "type": "string"
                      },
                      "type": "object"
