          "title": "DNS Lookup: Look up DNS records of one type",
          "description": "Free, no payment. DNS records for a name via Cloudflare's 1.1.1.1 (DNS over HTTPS). Types: A, AAAA, CNAME, MX, NS, TXT, CAA, SOA. Reports a name that doesn't exist (NXDOMAIN) as exists: false. Next step (paid): Checking whether an email domain is set up properly? Email Check reads SPF, DMARC and DKIM and explains them.",
