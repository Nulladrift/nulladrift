      "serverInfo": {
        "name": "ignoreo",
        "title": "IGNOREO: tools for AI agents",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for AI agents: free ones (no payment), paid ones, and a marketplace of tools from independent sellers. Start with marketplace_search (free). Paid tools answer first with an x402 PaymentRequired result; pay it with an x402 MCP client (e.g. @x402/mcp) and the call goes through. A tool that fails is not charged. Paying means accepting the terms at /terms on this server's site.",
      "tools": [
        {
          "name": "backgammon_analyze",
          "title": "Backgammon Analysis: Best checker plays for a roll, or the cube decision, from GNU Backgammon",
          "description": "Backgammon Analysis: Best checker plays for a roll, or the cube decision, from GNU Backgammon Costs $0.003 per call in USDC, paid over x402. Not charged if it fails.",
          "inputSchema": {
            "properties": {
              "board": {
                "description": "{ on_roll: [25], opponent: [25] }: checkers per point, each side from its own home board (0 = its 1-point, 23 = its 24-point, 24 = bar)",
                "type": "object"
              },
              "crawford": {
                "type": "boolean"
              },
              "cube": {
                "description": "Cube value, default 1",
                "type": "integer"
              },
              "cube_owner": {
                "enum": ["centered", "on_roll", "opponent"],
                "type": "string"
              },
              "depth": {
                "description": "0-2 plies, default 2",
                "type": "integer"
              },
              "dice": {
                "description": "[d1, d2] for checker play; leave out for a cube decision",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "doubled": {
                "description": "true: the opponent has just doubled; analyse take or pass",
                "type": "boolean"
              },
              "jacoby": {
                "description": "Money games; default true",
                "type": "boolean"
              },
              "match_id": {
                "description": "GNU Backgammon Match ID (12 characters), or use the plain fields below",
                "type": "string"
              },
              "match_length": {
                "description": "0 = money game (default)",
                "type": "integer"
              },
              "max_moves": {
                "description": "1-20, default 5",
                "type": "integer"
              },
              "position_id": {
                "description": "GNU Backgammon Position ID (14 characters), or use board",
                "type": "string"
              },
              "score": {
                "description": "[on_roll, opponent] in a match",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
