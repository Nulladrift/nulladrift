{
  "lockfileVersion": 2,
  "subjects": {
    "com.converttoit/converter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://converttoit.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "converttoit",
        "title": "Convert To It",
        "version": "1.0.0",
        "websiteUrl": "https://converttoit.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Convert To It (https://converttoit.com) converts files inside the user's own browser: nothing is uploaded, and this server never receives files. Use check_conversion to see whether one format can become another; when it can, give the user the returned url, which opens the converter with both formats chosen. search_formats finds formats by name or extension, and list_conversion_targets lists everything a format can become.",
      "tools": [
        {
          "name": "check_conversion",
          "title": "Check a conversion",
          "description": "Check whether Convert To It can convert a file from one format to another and in how many steps, and get a link that opens the converter with both formats chosen. Formats are file extensions such as \"heic\" or \"jpg\". The conversion itself runs in the user's browser.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Extension of the file to convert, e.g. \"heic\".",
                "type": "string"
              },
              "to": {
                "description": "Extension to convert to, e.g. \"jpg\".",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "from": {
                "properties": {
                  "extension": {
                    "type": "string"
                  },
                  "name": {
                    "description": "null when the extension isn't a known format",
                    "type": ["string", "null"]
                  }
                },
                "required": ["extension", "name"],
                "type": "object"
              },
              "possible": {
                "type": "boolean"
              },
              "reason": {
                "description": "Why the conversion isn't possible.",
                "type": "string"
              },
              "steps": {
                "description": "Conversions on the most direct route; 1 is direct.",
                "type": "integer"
              },
              "to": {
                "properties": {
                  "extension": {
                    "type": "string"
                  },
                  "name": {
                    "description": "null when the extension isn't a known format",
                    "type": ["string", "null"]
                  }
                },
                "required": ["extension", "name"],
                "type": "object"
              },
              "url": {
                "description": "Opens the converter with both formats chosen; the user then picks the file.",
                "type": "string"
              }
            },
            "required": ["from", "possible", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bfdebdeac9996c9ce2dcf7d4fb3435e630001a65d681272ce9f25e258018264a"
        },
        {
          "name": "list_conversion_targets",
          "title": "List conversion targets",
          "description": "List every format Convert To It can convert a given format to, grouped by the number of conversion steps (1 is direct), most direct first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Extension of the file to convert, e.g. \"png\".",
                "type": "string"
              }
            },
            "required": ["from"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "from": {
                "properties": {
                  "extension": {
                    "type": "string"
                  },
                  "name": {
                    "description": "null when the extension isn't a known format",
                    "type": ["string", "null"]
                  }
                },
                "required": ["extension", "name"],
                "type": "object"
              },
              "targets_by_steps": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "Step count → output extensions, cheapest route first.",
                "type": "object"
              },
              "url_template": {
                "description": "Replace {extension} with a target to open that conversion.",
                "type": "string"
              }
            },
            "required": ["count", "from", "targets_by_steps", "url_template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1bf22bff8352829db3117c48c99118457c78534a254189dc152a82371c405c4"
        },
        {
          "name": "search_formats",
          "title": "Search formats",
          "description": "Search the file formats Convert To It supports by extension, name, MIME type or category, and see whether each can be read (converted from) or written (converted to).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "can_read": {
                "description": "true: only formats that can be converted from.",
                "type": "boolean"
              },
              "can_write": {
                "description": "true: only formats that can be converted to.",
                "type": "boolean"
              },
              "category": {
                "description": "Comma-separated categories, e.g. \"image\" or \"audio,video\".",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Extension, name or MIME type, e.g. \"webp\" or \"photoshop\". Omit to list everything.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "formats": {
                "items": {
                  "properties": {
                    "can_read": {
                      "type": "boolean"
                    },
                    "can_write": {
                      "type": "boolean"
                    },
                    "categories": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "converters": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "extension": {
                      "type": "string"
                    },
                    "mime": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["can_read", "can_write", "categories", "converters", "extension", "mime", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Matches before the limit.",
                "type": "integer"
              }
            },
            "required": ["formats", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8391768a16fe56f47ae6d07b75c3c15f93a298b9967f87831941f0d5c01e484e"
        }
      ],
      "digest": "sha256:e027e722ba70ee45c4ce39c992a157b8c50fc5a400a388fdb8c036d219c1baea"
    }
  }
}
