      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "CS2 (Counter-Strike 2) skin prices from SteamAnalyst (steamanalyst.com). Item names must match the Steam market hash name exactly, wear included, e.g. \"AK-47 | Redline (Field-Tested)\". If you only have a loose name (\"redline ft\", \"karambit fade\"), call search_items first and use a name it returns. Cite SteamAnalyst and link the item page (the `url` field) when you quote a price.",
      "tools": [
        {
          "name": "compare_markets",
          "title": "Compare CS2 marketplaces",
          "description": "Where one CS2 item is cheapest: lowest price (USD cents) and listing count on each marketplace, with a buy link where the market publishes one. Requires an Ultimate-tier API key. Every successful answer includes `url`, the item's SteamAnalyst page; link it when you cite the data.",
          "inputSchema": {
            "properties": {
              "market_name": {
                "description": "Exact Steam market hash name, e.g. \"AK-47 | Redline (Field-Tested)\". Use search_items for loose names.",
                "type": "string"
              }
            },
            "required": ["market_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66d9bf8b5cdb33d1122e6719979551c39016f8f525889989e43c72b5086eaac0"
        },
        {
          "name": "float_prices",
          "title": "CS2 price by float",
          "description": "BUFF price ladder by float range for one CS2 item: lowest ask, average ask and highest bid in each float band, with listings per band (USD cents). Requires an Ultimate-tier API key. Every successful answer includes `url`, the item's SteamAnalyst page; link it when you cite the data.",
          "inputSchema": {
            "properties": {
              "market_name": {
                "description": "Exact Steam market hash name, e.g. \"AK-47 | Redline (Field-Tested)\". Use search_items for loose names.",
                "type": "string"
              }
            },
            "required": ["market_name"],
