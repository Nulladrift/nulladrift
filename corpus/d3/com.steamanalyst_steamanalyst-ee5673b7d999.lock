          "title": "CS2 sales volume",
          "description": "How much one CS2 item actually sells: daily sales count and average price on CSFloat, and trade count and turnover on the Chinese venues (USD cents). Requires an Ultimate-tier API key. Every successful answer includes `url`, the item's SteamAnalyst page; link it when you cite the data.",
