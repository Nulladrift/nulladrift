{
  "lockfileVersion": 2,
  "subjects": {
    "com.rebidpro/contractor-quotes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rebidpro.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "RebidPro contractor quotes",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "RebidPro: contractor quotes, bids and fair-price checks for US property jobs (plumbing, HVAC, electrical, roofing, unit turns, appliance repair) and re-bids of service contracts (landscaping, pest control, janitorial, snow removal, pool, HVAC maintenance). Use check_fair_price when the user asks if a contractor price is fair or what a job costs in their area. Use request_quotes when they want real quotes or bids from local contractors. Call list_job_types first to get valid trade and job_type ids. These MCP tools are free to call. A quote job (including contract re-bids) costs $39, paid by the agent in USDC over x402: request_quotes returns the exact paid HTTP request to send.",
      "tools": [
        {
          "name": "check_fair_price",
          "title": "Check if a contractor price is fair",
          "description": "Use this when the user asks whether a contractor price or quote is fair, or what a job typically costs in their area (US). Compares against real quotes we collected for the same job type in the same 3-digit ZIP region. Returns the median, sample size and, if quoted_usd is given, a verdict (low, fair, high). Free. The full low/typical/high distribution is on the x402 endpoint GET https://rebidpro.com/agent/v1/price-check ($0.25).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_type": {
                "description": "Job type id from list_job_types, e.g. water_heater_replace",
                "type": "string"
              },
              "quoted_usd": {
                "description": "The price the user was quoted, in US dollars",
                "type": "number"
              },
              "trade": {
                "description": "Trade id from list_job_types",
                "enum": ["plumbing", "hvac", "electrical", "roofing", "unit_turn", "appliance", "landscaping", "snow_removal", "pest_control", "janitorial", "pool"],
                "type": "string"
              },
              "zip": {
                "description": "ZIP code of the property (3 or 5 digits)",
                "type": "string"
              }
            },
            "required": ["job_type", "trade", "zip"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:874c62966340f059828328649fa5db00f758607bee117dfef052bee0279fc861"
        },
        {
          "name": "get_quote_job",
          "title": "Get quote job status",
          "description": "Use this when the user asks how their contractor quote request is going. Returns status, contractors contacted and replied, and the ranked quotes so far for a job_token from request_quotes. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_token": {
                "type": "string"
              }
            },
            "required": ["job_token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:444aea360430cefabaf94f7f51875c8ec9224b2607533254dedaad28ae30183b"
        },
        {
          "name": "list_job_types",
          "title": "List job types",
          "description": "Use this first when the user mentions a repair, replacement or recurring service at a US property. Returns the trade and job_type ids that request_quotes and check_fair_price need, plus prices. Free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f679f0f042a8cb37b070821512f4910ae5e8883bb52928d1d98a9f6024eb6f1"
        },
        {
          "name": "request_quotes",
          "title": "Request contractor quotes",
          "description": "Use this when the user wants quotes or bids from local contractors for a real job at a US property, or wants to re-bid an annual service contract. We email licensed, well-reviewed local contractors, follow up, and return a ranked comparison, usually within 48 hours. Price: $39 per job in USDC over x402. This tool checks the job and returns the exact paid HTTP request for your x402 wallet to send. Contract re-bids (contract_rebid job types) need incumbent_annual_usd. Not for price lookups: use check_fair_price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "type": "string"
              },
              "contact_email": {
                "description": "Optional: an email to notify when the comparison is ready. Agents can poll get_quote_job instead.",
                "type": "string"
              },
              "contact_name": {
                "type": "string"
              },
              "description": {
                "description": "Scope in plain words: what's wrong, size/model, access notes, unit/building",
                "type": "string"
              },
              "incumbent_annual_usd": {
                "description": "Current annual price (required for contract re-bids)",
                "type": "number"
              },
              "incumbent_vendor": {
                "type": "string"
              },
              "job_type": {
                "description": "Job type id from list_job_types, e.g. water_heater_replace",
                "type": "string"
              },
              "needed_by": {
                "description": "e.g. 'this week', '2026-12-01'",
                "type": "string"
              },
              "state": {
                "description": "2-letter state code",
                "type": "string"
              },
              "title": {
                "description": "Short title, e.g. 'Replace leaking 40-gal water heater'",
                "type": "string"
              },
              "trade": {
                "description": "Trade id from list_job_types",
                "enum": ["plumbing", "hvac", "electrical", "roofing", "unit_turn", "appliance", "landscaping", "snow_removal", "pest_control", "janitorial", "pool"],
                "type": "string"
              },
              "zip": {
                "description": "5-digit ZIP code of the property",
                "type": "string"
              }
            },
            "required": ["city", "description", "job_type", "state", "title", "trade", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:da97fc54a20abd35c9d5506194c1bb4c996f54cc5d0f5c62e864f9ed313eb2df"
        }
      ],
      "digest": "sha256:346ed8d43ba24c07b51aa1cbeb7bcecac14dc033844cf44aa97078b9866d20b9"
    }
  }
}
