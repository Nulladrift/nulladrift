            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "Optional 2-letter IATA or 3-letter ICAO airline filter (e.g. \"UAL\", \"BAW\").",
                "type": "string"
              },
              "airport": {
                "description": "Optional IATA/ICAO airport code (e.g. \"LHR\", \"JFK\", \"SFO\") auto-resolved to lat/lon.",
                "type": "string"
              },
              "lat": {
                "description": "Center latitude (-90 to 90), optional if airport code is provided.",
                "type": "number"
              },
              "limit": {
                "default": 25,
                "description": "Max aircraft to return (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Center longitude (-180 to 180), optional if airport code is provided.",
                "type": "number"
              },
              "on_ground": {
                "description": "Filter by ground/airborne state (true=ground only, false=airborne only).",
                "type": "boolean"
              },
              "radius_nm": {
                "default": 50,
                "description": "Search radius in nautical miles (1–250).",
                "maximum": 250,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "description": "Status code (0 for success).",
