      "instructions": "Track live global ADS-B aircraft by callsign/ICAO24/registration, scan 1–250 NM airspace radar around any coordinates or airport, check real-time US FAA NAS airport delays & ground stops, and search 49,000+ global airports & 6,100+ airlines. Handshake and tools/list are free; pass x-api-key (ft_live_...) or OAuth 2.1 Bearer token for tools/call. Claim 3,000 Free Credits ($0.30) on sign-up at https://flighttrackerapi.com/signup.",
      "tools": [
        {
          "name": "get_airspace_flights_nearby",
          "title": "Scan Live Airspace Radius Radar Around Any Coordinates or Airport",
          "description": "Scan all live ADS-B aircraft within a 1–250 nautical mile radius around any lat/lon coordinates or airport IATA/ICAO code (e.g. airport=\"LHR\" or lat=51.47, lon=-0.4543, radius_nm=50). Returns aircraft sorted by distance_nm with live altitude, speed, heading, and airline. Cost: 2 Credits / aircraft returned (0 Credits if empty). Data attribution: adsb.lol (ODbL 1.0).",
