{
  "lockfileVersion": 2,
  "subjects": {
    "com.assetsforthreejs/assetsforthreejs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://assetsforthreejs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "assetsforthreejs",
        "title": "Assets for three.js",
        "version": "1.0.0",
        "websiteUrl": "https://assetsforthreejs.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Assets for three.js sells original GLB 3D models for three.js and WebGL: London housing, high streets and pubs, London architecture, building sites (cranes, machinery, build stages), and parks, play and sport. Use search_models to find models (filter by pack, type, era, setting, price, triangles, textures), get_model for one model's full details, and list_packs for packs, bundles and prices. Cite the store page URL. An \"assembly\" is a supplied arrangement of component models, not an extra unique model. Some models embed textures and some use PBR colours only: check embedded_textures per model rather than assuming. Prices in GBP include UK VAT; USD prices are the US edition, tax-exclusive. These tools never return model files or download links: paid models are bought on the store page (buy_url), and the free starter pack's link is emailed from its page.",
      "tools": [
        {
          "name": "get_model",
          "title": "Get one 3D model's details",
          "description": "Everything the store lists for one model or assembly: name, pack, store page and preview image, size in metres, triangles and file size at each level of detail (high, medium, low), embedded texture count, material slots, sockets, era and setting, the parts an assembly places, the licence summary, and its price with a buy link (or the free pack page). Pass the id from search_models or the model's store page URL. It does not return the GLB file or a download link, and it cannot buy anything. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The model id (e.g. \"london-pubs-corner\") or its page URL (https://assetsforthreejs.com/assets/<id>/).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59881d0989204342b7ce0d7878fb454f0c15a19011cdb591cafa0cf9b8d945f4"
        },
        {
          "name": "list_packs",
          "title": "List model packs and prices",
          "description": "The packs on sale at Assets for three.js, grouped by shelf: each pack's summary, number of component models and assemblies, how many of its models embed textures, triangle range, price in GBP (VAT included) and USD (tax-exclusive, US edition), page and buy link. Also the shelf bundles, the lifetime licence and the free starter pack. It does not sell, reserve or check stock of anything. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "shelf": {
                "description": "Optional: one shelf id, e.g. \"london-housing\", \"building-sites\", \"london-high-streets\", \"london-architecture\", \"parks-play-sport\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:39d8007279859ee92ec7ecebb38e5228e5499ed153ad1756a1f7775ebfb51da2"
        },
        {
          "name": "search_models",
          "title": "Search 3D models for three.js",
          "description": "Search the Assets for three.js catalogue: original GLB models (London houses, shops, pubs, building sites, cranes, parks, playgrounds, sports) made for three.js and WebGL. Matches words against model names, packs, eras and settings, and filters by pack, type (a single component model, or an assembly: a supplied arrangement of component models), era, setting, price, triangle count and whether a model embeds textures. Returns each match with its store page, preview image, triangle count and how to get it (free starter pack, £5 on its own, or its pack price) with a buy link. It does not return model files or download links, and it cannot buy anything: buying happens on the store page. Read-only. Use get_model for one model's full details and list_packs for the packs and their prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "era": {
                "description": "Optional: georgian, victorian, edwardian, interwar, 1930s, post-war, contemporary or 2020s.",
                "type": "string"
              },
              "free_only": {
                "description": "Optional: only models that come in the free London Street Starter pack.",
                "type": "boolean"
              },
              "limit": {
                "description": "Results to return. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_gbp": {
                "description": "Optional: the most you want to pay in pounds (VAT included) for the cheapest way to get the model: 0 for free, 5 for an assembly sold on its own, otherwise its pack price.",
                "minimum": 0,
                "type": "number"
              },
              "max_triangles": {
                "description": "Optional: most high-detail triangles.",
                "minimum": 0,
                "type": "integer"
              },
              "min_triangles": {
                "description": "Optional: fewest high-detail triangles (an assembly counts every part it places).",
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many results, for paging. Default 0.",
                "minimum": 0,
                "type": "integer"
              },
              "pack": {
                "description": "Optional: a pack id or name from list_packs, e.g. \"london-pubs\" or \"Tower cranes and lifting\".",
                "type": "string"
              },
              "query": {
                "description": "Optional words to look for, e.g. \"sash window\", \"tower crane\", \"corner pub\", \"swing\". Leave empty to filter only.",
                "type": "string"
              },
              "setting": {
                "description": "Optional setting.",
                "enum": ["exterior", "street", "interior", "industrial"],
                "type": "string"
              },
              "textured": {
                "description": "Optional, component models only: true = the GLB embeds textures; false = PBR colours only. Assemblies are left out when this is set (their parts vary).",
                "type": "boolean"
              },
              "type": {
                "description": "Optional: \"model\" = one component GLB (a window, a door, a crane mast section); \"assembly\" = a complete building, machine or scene put together from component models.",
                "enum": ["model", "assembly"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3664dcb97e33280fbcd5021580360ea66e5acfccf486f3e3950cc17d657017b1"
        }
      ],
      "digest": "sha256:4c80988de51d8794dc99da021b50b782cda19acf26ac9f9705e28de8d80b8567"
    }
  }
