      "serverInfo": {
        "name": "oldways-library",
        "title": "The Old Ways Library",
        "version": "1.0.0",
        "websiteUrl": "https://theoldways.co/ai"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "list_collections",
          "title": "List Old Ways books and supported collections",
          "description": "List available book landing pages, traditions, content types, index-build timestamp and the source policy before exploring The Old Ways. Index-build time is not the publication date of a historical text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b98991529aeed9aec100cc82b984b893e77a97c7a0c517185c2b0d34610ee02c"
        },
        {
          "name": "read_page",
          "title": "Read a cited Old Ways page or passage",
          "description": "Read a bounded text excerpt from an indexed public theoldways.co page. Supply a canonical URL or path returned by search_library. Returns a citation URL, edition/source note, text and nextOffset for continuation. Never accesses arbitrary websites, private accounts or the live app. Imported historical editions can contain transcription errors; editorial summaries are not passage-level source verification.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "length": {
                "default": 4000,
                "maximum": 8000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 2000000,
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e5b86c361454ea1bf4f8da54e8c7b13cfb908e0407ab4dfe5ec2753ae35dca61"
        },
        {
          "name": "search_library",
          "title": "Search The Old Ways public library",
          "description": "Search the Old Ways historical-text and mythology reference collection: Norse, Greek/Hellenic, Egyptian/Kemetic, Celtic and Zoroastrian writings, glossary, deity profiles and explanatory questions. Returns canonical citation URLs and short previews from a prebuilt lexical index. Not web search or verification of historical claims. Use read_page to examine the passage and recorded edition details. Known malformed and noindex pages are excluded.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["chapter", "book", "glossary", "questions", "reference"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "tradition": {
                "enum": ["norse", "hellenic", "kemetic", "celtic", "zoroastrian"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d6cb9bdf52ca326a1acee26dcd45bd884c5bf15d9e8b464737163fc93d0c8a6c"
        }
      ],
      "resources": [
        {
          "uri": "oldways://reading-guide",
          "name": "reading-guide",
          "title": "Old Ways first-reading guide",
          "mimeType": "text/plain",
          "digest": "sha256:91c3a4dac619c15e64dfd2fcd8e57254091e6b59f6673090a133ee872457b2a1"
        },
        {
