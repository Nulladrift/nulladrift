{
  "lockfileVersion": 2,
  "subjects": {
    "com.kitchengradeapp/kitchengrade": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kitchengradeapp.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "kitchengrade",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_restaurant_grade",
          "title": "Get Exact KitchenGrade Inspection Grade",
          "description": "KitchenGrade searches captured Florida DBPR records for Lake, Orange, Osceola and Seminole counties only. This is not statewide coverage or a live statewide search. Get the current KitchenGrade grade and dated inspection basis for an exact public DBPR establishment ID (e.g. 2010:5816523) in this catalog. A missing ID is not evidence of closure or no inspections. Preserves unavailable/historical/expired grades as unknown, without guessing. KitchenGrade independent grade is not issued by DBPR and is not a food-safety guarantee.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "establishment_id": {
                "description": "Exact public KitchenGrade DBPR establishment ID (not name or a private identifier).",
                "pattern": "^\\d{1,6}:\\d{1,12}$",
                "type": "string"
              }
            },
            "required": ["establishment_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb2d82261a70c4f4b374f19e624b528ea5924a9805550a77b7586e1b403db688"
        },
        {
          "name": "search_restaurants",
          "title": "Search KitchenGrade Restaurants",
          "description": "KitchenGrade searches captured Florida DBPR records for Lake, Orange, Osceola and Seminole counties only. This is not statewide coverage or a live statewide search. Use this tool only for an actual restaurant, public address or city search. Do not use it for MCP questions, documentation or connection tests, or send placeholder queries such as 'hello world' or 'model context protocol'. Use MCP ping for connection checks. Explain this coverage limit when a requested location is outside it or no record matches; zero results do not establish that a restaurant does not exist or has no inspections. Prefer a restaurant name as query and a separate city filter. Common requests such as 'find Winter Garden restaurants named Spoleto' are also supported. Returns exact identifiers and independently calculated, dated KitchenGrade inspection grades; not DBPR grades or food-safety guarantees. Empty results may include separately labeled nameSuggestions: possible close restaurant names that retain all submitted filters, not primary matches or a confirmed interpretation of the intended restaurant. Filter-recovery options instead explain which filters would need to change; those alternatives do not satisfy every original filter. Neither kind adds primary matches. Only describe recovery suggestions as nearby when nearRequestedCity is true, using the returned proximity qualification. Use an exact establishment ID with get_restaurant_grade before recommending a specific restaurant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acceptable_only": {
                "default": false,
                "description": "Return only current A+, A, B grades; do not hide other grades when evaluating a supplied restaurant.",
                "type": "boolean"
              },
              "city": {
                "description": "Optional strict recorded-city filter within the covered counties, not a nearby radius. Omit it when searching the broader area; Orlando records do not match Winter Park. A city filter does not enable statewide coverage.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "county": {
                "description": "Optional filter within the covered counties only; it cannot expand coverage.",
                "enum": ["Lake", "Orange", "Osceola", "Seminole"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Prefer just the restaurant name (e.g. Spoleto), public address or city text. Put the city in city when known. Common find/search for/look up/show me requests with a name and city are supported; arbitrary conversational instructions may need clarification. No personal data or coordinates. Do not send 'hello world', 'model context protocol', or other placeholder searches. MCP questions and connection tests are not restaurant searches. Use MCP ping for connection checks.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6cb3606ba5d6eb31ab9db6dc4bca4868515c3a41805878204c932c7a97881909"
        }
      ],
      "digest": "sha256:0dec8f8b4e8c7a434cc64ea7b165c8c7aa1677d30caa041f0a91390084a6a7e4"
    }
  }
}
