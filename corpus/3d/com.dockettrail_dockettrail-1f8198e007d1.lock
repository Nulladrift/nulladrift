        {
          "name": "review_stats",
          "title": "How reviews go",
          "description": "How reviews end and how long they take, computed from the records: per program, outcomes in the agency's own words with counts, shares (waived, taken to a cost and market impact review, approved with conditions, follow-up reviews) and durations in days (median, 25th to 75th percentile, range, n) over proceedings carrying both agency dates; deals reviewed in more than one state; the organizations in the most proceedings. Where n is under 5 the cases are listed instead of a median. Each figure names the list (href) behind it; the method is at https://dockettrail.com/stats#method. Every result points at the records it was computed from (href), each of which carries its source_url. Nothing is estimated or predicted. Covers healthcare transaction reviews (OR, CA, MA, NM, WA, MN), certificate-of-need projects (WA, IA, IL, FL, NC, HI, MO, GA, SC, VA, KY, DE, DC) and nonprofit health facility notices (CA, GA) only (see https://dockettrail.com/coverage for what is tracked and what was checked and not tracked). Every result is a public agency record, in the agency's own words, with source_url (the agency page it was read from) and the day DocketTrail observed it (observed_day, first_seen_at, last_checked_at; UTC). Nothing here is legal advice, and absence from the data is not a claim that no review exists.",
