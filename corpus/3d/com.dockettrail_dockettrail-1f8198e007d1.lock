      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "DocketTrail follows healthcare transaction reviews, certificate-of-need projects and nonprofit health facility notices (mergers, acquisitions, affiliations, facility projects) across state agencies. Covers healthcare transaction reviews (OR, CA, MA, NM, WA, MN), certificate-of-need projects (WA, IA, IL, FL, NC, HI, MO, GA, SC, VA, KY, DE, DC) and nonprofit health facility notices (CA, GA) only (see https://dockettrail.com/coverage for what is tracked and what was checked and not tracked). Every result is a public agency record, in the agency's own words, with source_url (the agency page it was read from) and the day DocketTrail observed it (observed_day, first_seen_at, last_checked_at; UTC). Nothing here is legal advice, and absence from the data is not a claim that no review exists. Without a key: state, program and status filters, 25 records a page, 60 requests an hour per address, the last 30 days of changes. With a founding key (Authorization: Bearer): every filter, 200 records a page, the full change history, 5,000 requests a day. https://dockettrail.com/developers",
      "tools": [
        {
          "name": "find_organization",
          "title": "Find an organization",
          "description": "Find an organization by name (its canonical name or any name it files under, as the agency printed it), or open one by slug to see its transactions, the names it files under in each state and how each was matched. Organizations are linked across states only from a reviewed list, never by a name that looks alike. Covers healthcare transaction reviews (OR, CA, MA, NM, WA, MN), certificate-of-need projects (WA, IA, IL, FL, NC, HI, MO, GA, SC, VA, KY, DE, DC) and nonprofit health facility notices (CA, GA) only (see https://dockettrail.com/coverage for what is tracked and what was checked and not tracked). Every result is a public agency record, in the agency's own words, with source_url (the agency page it was read from) and the day DocketTrail observed it (observed_day, first_seen_at, last_checked_at; UTC). Nothing here is legal advice, and absence from the data is not a claim that no review exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Part of an organization name; at least two letters or digits.",
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Records per page. Default 25; 25 is the most without a founding key, 200 with one.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "An organization slug, to open that organization.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code: OR, CA, MA, WA, IA, IL, FL, NC, HI, MO, GA, SC, VA, KY, DE, NM, DC, MN.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find an organization"
          },
          "behavior": {
            "destructive": false,
