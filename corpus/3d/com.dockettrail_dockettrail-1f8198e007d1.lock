        {
          "name": "get_proceeding",
          "title": "Get a proceeding",
          "description": "One transaction by the slug of its DocketTrail page (the transaction_slug of a search result): every state proceeding in it with the agency's wording and source link, the full trail of dated events (as the agency published or printed them), documents, and the changes DocketTrail observed. Covers healthcare transaction reviews (OR, CA, MA, NM, WA, MN), certificate-of-need projects (WA, IA, IL, FL, NC, HI, MO, GA, SC, VA, KY, DE, DC) and nonprofit health facility notices (CA, GA) only (see https://dockettrail.com/coverage for what is tracked and what was checked and not tracked). Every result is a public agency record, in the agency's own words, with source_url (the agency page it was read from) and the day DocketTrail observed it (observed_day, first_seen_at, last_checked_at; UTC). Nothing here is legal advice, and absence from the data is not a claim that no review exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The transaction slug, the last part of https://dockettrail.com/transactions/{slug}.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a proceeding"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c77feafa4a160be67000bfb4ca10c36aa69a2170d79e32c8343e0e818e6adcb5"
        },
        {
          "name": "list_changes",
          "title": "List changes",
          "description": "What changed, newest first: new proceedings, the agency's wording changed (before and after, verbatim), new events, new documents. Dated by the day DocketTrail observed the change on a check of the agency's page, not the day it happened. Without a key: the last 30 days, filtered by state, program and kind. A founding key reads the full history and adds org, agency, q and since. Covers healthcare transaction reviews (OR, CA, MA, NM, WA, MN), certificate-of-need projects (WA, IA, IL, FL, NC, HI, MO, GA, SC, VA, KY, DE, DC) and nonprofit health facility notices (CA, GA) only (see https://dockettrail.com/coverage for what is tracked and what was checked and not tracked). Every result is a public agency record, in the agency's own words, with source_url (the agency page it was read from) and the day DocketTrail observed it (observed_day, first_seen_at, last_checked_at; UTC). Nothing here is legal advice, and absence from the data is not a claim that no review exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Founding key only. An agency slug: the agency's name, lower-case and hyphenated.",
                "type": "string"
              },
              "kind": {
                "description": "RECORD_ADDED, STATUS_CHANGED (the agency wording changed), EVENT_ADDED (an agency action; a deadline, or a date the agency printed for the future, is not a change), NOTE_CHANGED (a note or document) or RETYPESET (the agency re-typeset its wording: spacing or dashes only; listed only when asked for).",
                "type": "string"
              },
              "org": {
                "description": "Founding key only. An organization slug, from find_organization.",
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Records per page. Default 25; 25 is the most without a founding key, 200 with one.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "program": {
                "description": "A program id (or-hcmo, ca-ohca, ma-hpc, wa-con, ia-con, il-con, fl-con, ca-ag, nc-con, hi-con, mo-con, ga-con, sc-con, va-copn, ky-con, de-cpr, nm-hca, dc-con, wa-ag, ga-ag, mn-ag) or a record type (transaction-review, certificate-of-need, nonprofit-hospital-notice). Free, like state.",
                "type": "string"
              },
              "q": {
                "description": "Founding key only. A keyword, matched as a substring of the parties as filed, the agency title and status, and the agency name.",
                "type": "string"
              },
              "since": {
                "description": "Founding key only. A date, yyyy-mm-dd (UTC): only what DocketTrail observed changing on or after that day.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code: OR, CA, MA, WA, IA, IL, FL, NC, HI, MO, GA, SC, VA, KY, DE, NM, DC, MN.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List changes"
          },
          "behavior": {
            "destructive": false,
