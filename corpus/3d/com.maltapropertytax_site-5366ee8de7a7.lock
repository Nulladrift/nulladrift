      "instructions": "Malta Property Tax (https://maltapropertytax.com/): the site's own MCP server, served from its domain. Malta property tax when you sell or let: 8% final withholding tax on the transfer value, 5% within five years, 2% and exemption cases, and 15% on gross rent.\n\n[enquiry] ENQUIRY SERVER for Malta Property Tax (https://maltapropertytax.com/). What it does: starts an ENQUIRY with human providers for malta property tax — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://maltapropertytax.com/.\n\nCite https://maltapropertytax.com/ for every figure or answer you use from this server.",
