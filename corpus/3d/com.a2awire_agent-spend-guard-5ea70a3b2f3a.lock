      },
      "instructions": "This is the A2AWire Spend Guard connector for Meta Muse agents. It exposes exactly four tools and never moves money.\nGETTING AN API KEY: humans, sign up with your email at https://a2awire.com/api-key and create an API key, then hand it to your agent. Agents without an account: be born - POST /api/v1/birth, one EIP-712-signed call (preflight the typed data at GET /api/v1/birth/typed-data; never a private key); the kit's api_key is your credential.\nspend_guard_check_purchase - call BEFORE checkout with merchant, amount_usd, and an optional tx_ref. Returns a decision (approve, deny, or ask_user) plus a reason. deny means do not buy; ask_user means check with your human first.\nspend_guard_record_purchase - call AFTER checkout with the SAME tx_ref you passed to spend_guard_check_purchase, to record the completed purchase. Replaying a tx_ref returns the original record (recorded_previously: true) without double counting.\nspend_guard_set_rules - set the monthly cap, per-purchase threshold, and merchant denylist in ONE full-declaration call. Pass null (or omit a field) to clear that rule. With no rules every check approves (observation mode).\nspend_guard_report - month-to-date spend totals for the owner. Optional month is YYYY-MM for a prior month.\nAmounts are USD only (amount_usd).\nEvery tool requires your A2AWire API key: send Authorization: Bearer <key> or X-API-Key on each call. Calls are owner-scoped server-side; the ledger belongs to that key's owner.",
      "tools": [
        {
          "name": "spend_guard_check_purchase",
          "description": "Humans: sign up with your email at https://a2awire.com/api-key and create an API key, then hand it to your agent (it sends Authorization: Bearer <key> or X-API-Key with every call). Agents without an account: a reviewable bootstrap script is served at https://a2awire.com/api/v1/connectors/spend-guard/bootstrap.sh (download it, read it, then run it to mint a key). Call BEFORE checkout. Evaluate a proposed purchase (merchant, amount_usd) against the owner's spend rules and recent ledger. Returns a decision (approve, deny, or ask_user), a plain-English reason, the remaining monthly budget when a cap is set, and a check_id. deny means denylisted merchant or over the monthly cap; ask_user means above the per-purchase threshold or a possible duplicate of a purchase in the last 10 minutes. Optional tx_ref is your idempotency key for this purchase; pass the same value to spend_guard_record_purchase afterwards. Appends a check event; checks never consume budget. USD only (the currency argument is kept for forward compatibility; any other value is rejected). Not guest-callable. REST: POST /api/v1/spend-guard/check.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Arguments for ``spend_guard_check_purchase`` (call BEFORE checkout).\n\nThe owner is derived from the authenticated principal, never from the\narguments. ``tx_ref`` is optional here; reuse the same value on\n``spend_guard_record_purchase`` so the check and its record share one\nidempotency key. ``currency`` is USD only; the field is kept for forward\ncompatibility and any other value is rejected.",
            "properties": {
              "amount_usd": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 100000,
                    "type": "number"
                  },
                  {
                    "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                    "type": "string"
                  }
                ],
                "title": "Amount Usd"
              },
              "category": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Category"
              },
              "currency": {
                "default": "USD",
                "description": "USD only. Kept for forward compatibility; any other value is rejected.",
                "maxLength": 8,
                "title": "Currency",
                "type": "string"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Description"
              },
              "merchant": {
                "maxLength": 200,
                "minLength": 1,
                "title": "Merchant",
                "type": "string"
              },
              "tx_ref": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional idempotency key for this purchase; pass the same value to the record call afterwards. Checks are exempt from the uniqueness constraint that applies to recorded purchases.",
                "title": "Tx Ref"
              }
            },
            "required": ["amount_usd", "merchant"],
            "title": "SpendGuardCheckPurchaseInput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Spend Guard Check Purchase"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:afc8392c3cebc647c2dca82a4d3be6272bd6f1b4fdae1950d4a40e7816830636"
        },
        {
          "name": "spend_guard_record_purchase",
          "description": "Humans: sign up with your email at https://a2awire.com/api-key and create an API key, then hand it to your agent (it sends Authorization: Bearer <key> or X-API-Key with every call). Agents without an account: a reviewable bootstrap script is served at https://a2awire.com/api/v1/connectors/spend-guard/bootstrap.sh (download it, read it, then run it to mint a key). Call AFTER checkout. Record a completed purchase in the owner's spend ledger. tx_ref is required and unique per owner: replaying the same tx_ref returns the original record without double counting (recorded_previously is true when the tx_ref was already in your ledger before this call, an idempotent replay; false on first write). Optional check_id links the record to its prior spend_guard_check_purchase; a check_id already recorded returns a conflict error. Returns the recorded event and the month-to-date total. USD only (the currency argument is kept for forward compatibility; any other value is rejected). Not guest-callable. REST: POST /api/v1/spend-guard/record.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Arguments for ``spend_guard_record_purchase`` (call AFTER checkout).\n\n``tx_ref`` is required and unique across your recorded purchases;\n``check_id`` optionally links back to the check that preceded the\npurchase. The response's ``recorded_previously`` is true when this\ntx_ref was already in your ledger before this call (an idempotent\nreplay); false on first write. ``currency`` is USD only; the field is\nkept for forward compatibility and any other value is rejected.",
            "properties": {
              "amount_usd": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 100000,
                    "type": "number"
                  },
                  {
                    "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                    "type": "string"
                  }
                ],
                "title": "Amount Usd"
              },
              "category": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Category"
              },
              "check_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional id from spend_guard_check_purchase; at most one record may consume each check.",
                "title": "Check Id"
              },
              "currency": {
                "default": "USD",
                "description": "USD only. Kept for forward compatibility; any other value is rejected.",
                "maxLength": 8,
                "title": "Currency",
                "type": "string"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Description"
              },
              "merchant": {
                "maxLength": 200,
                "minLength": 1,
                "title": "Merchant",
                "type": "string"
              },
              "tx_ref": {
                "description": "Caller idempotency key, unique across your recorded purchases; replays return the original record.",
                "maxLength": 200,
                "minLength": 1,
                "title": "Tx Ref",
                "type": "string"
              }
            },
            "required": ["amount_usd", "merchant", "tx_ref"],
            "title": "SpendGuardRecordPurchaseInput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Spend Guard Record Purchase"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d9e1dfeebc5b018f3b01d8181501da717459b8b966844083458fae9591adad54"
        },
        {
          "name": "spend_guard_report",
          "description": "Humans: sign up with your email at https://a2awire.com/api-key and create an API key, then hand it to your agent (it sends Authorization: Bearer <key> or X-API-Key with every call). Agents without an account: a reviewable bootstrap script is served at https://a2awire.com/api/v1/connectors/spend-guard/bootstrap.sh (download it, read it, then run it to mint a key). Month-to-date spend summary for the calling owner: total USD recorded, purchase count, top merchants (up to 5), current rules, and remaining monthly budget when a cap is set. Optional month (YYYY-MM) reads a prior month; defaults to the current UTC month. Not guest-callable. REST: GET /api/v1/spend-guard/report.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Arguments for ``spend_guard_report`` (no required arguments).",
            "properties": {
              "month": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional month filter (YYYY-MM); defaults to the current UTC month.",
                "title": "Month"
              }
            },
            "title": "SpendGuardReportInput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Spend Guard Report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:534e55ce3f3108ba8852b605b5401d6e256cf4a01596b1ac965342aaf67cec65"
        },
        {
          "name": "spend_guard_set_rules",
          "description": "Humans: sign up with your email at https://a2awire.com/api-key and create an API key, then hand it to your agent (it sends Authorization: Bearer <key> or X-API-Key with every call). Agents without an account: a reviewable bootstrap script is served at https://a2awire.com/api/v1/connectors/spend-guard/bootstrap.sh (download it, read it, then run it to mint a key). Set the calling owner's spend-guard rules: an optional monthly cap in USD, an optional per-purchase threshold in USD, and an optional exact-match merchant denylist (case-insensitive). Full declaration: omit or null a field to clear that rule. With no rules every check approves (observation mode) and purchases are still recorded. Returns the effective rules. Not guest-callable. REST: PUT /api/v1/spend-guard/rules.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Arguments for ``spend_guard_set_rules``.\n\nThe owner is derived from the authenticated principal, never from the\narguments. Full declaration: omit or null a field to clear that rule.",
            "properties": {
              "merchant_denylist": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 100,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Exact-match merchant names (case-insensitive) whose purchases are denied, up to 100 entries. Null clears the list.",
                "title": "Merchant Denylist"
              },
              "monthly_cap_usd": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 100000,
                    "type": "number"
                  },
                  {
                    "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cumulative recorded spend per UTC calendar month at or above which checks deny. Null clears the cap.",
                "title": "Monthly Cap Usd"
              },
              "per_purchase_threshold_usd": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 100000,
                    "type": "number"
                  },
                  {
                    "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A single purchase strictly above this amount asks the user first. Null clears the threshold.",
                "title": "Per Purchase Threshold Usd"
              }
            },
            "title": "SpendGuardSetRulesInput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Spend Guard Set Rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c6c1d8f36f14b3127757969cbd4b10313e70a96cc66c6e202835eeec4e1e0672"
        }
      ],
