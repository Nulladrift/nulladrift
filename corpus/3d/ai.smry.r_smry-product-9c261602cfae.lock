        {
          "name": "mutate_feeds",
          "title": "Selector-based writes with dry-run preview",
          "description": "Preview changes to matching sources, entries, or collections. Default dry_run:true returns would_affect, sample, and commit_token without changing them. Commit by sending the same op and commit_token; retries replay the recorded result. Explicit dry_run:false applies immediately. sources.move needs set.collection; sources.rename needs set.title; collections.create/rename need set.name. Collections rename/delete need exactly one where.collection. Use manage_collections for direct collection CRUD. Check partial and each outcome after committing.\nExample: {\"op\":\"collections.create\",\"set\":{\"name\":\"Research\"}}\nExample: {\"op\":\"sources.move\",\"where\":{\"source\":{\"include\":[42]}},\"set\":{\"collection\":\"Research\"}}\nExample: {\"op\":\"sources.move\",\"commit_token\":\"<commit_token from preview>\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "commit_token": {
                "description": "From a dry run. Single-use and idempotent: resending after a network failure replays the recorded outcome.",
                "maxLength": 100,
                "type": "string"
              },
              "dry_run": {
