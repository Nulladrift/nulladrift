        {
          "name": "create_monitor",
          "title": "Monitor a web page for changes",
          "description": "Create a scheduled web-change monitor whose detected changes arrive as an ordinary followed source — query, watch, and mutate it like any feed. Naming a collection that does not exist creates it. Active monitor limits are Free 3, Patron 10, and Pro 100; scheduled monthly credits are 150, 720, and 7,200, respectively. Page and sitemap runs reserve 1 credit; extract runs reserve 10. The shortest interval is 60 minutes and the default schedule is daily. The response reports remaining slots and scheduled credits.\nExample: {\"name\":\"Example page changes\",\"target\":{\"type\":\"page\",\"url\":\"https://example.com\"},\"collection\":\"Research\"}",
