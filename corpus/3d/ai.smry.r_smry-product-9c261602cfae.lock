                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "published_before": {
                    "description": "Relative window (\"7d\", \"36h\", \"45m\", \"2w\"), \"now\", or ISO date.",
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "source": {
                    "additionalProperties": false,
                    "properties": {
                      "exclude": {
