        {
          "name": "get_feed_changes",
          "title": "What changed since a cursor — the polling primitive",
          "description": "One stream, two checkpoint owners. Stateful callers pass cursor:\"latest\", then store each next_cursor themselves; that first call only establishes the checkpoint and returns no events, so poll again with the returned next_cursor. Stateless scheduled agents pass consumer_id; smry retains the acknowledged position and the consumer's saved where predicate. Pass exactly one. Managed batches repeat until their next_cursor is acknowledged. Every response also carries a capped source-health attention block. To read what is already there rather than what changes next, use query_feeds.\nExample: {\"cursor\":\"latest\",\"limit\":20}\nExample: {\"consumer_id\":7,\"limit\":20}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attention_limit": {
                "description": "Sources listed per attention bucket (default 5; the *_count fields always carry the full tally). Pass up to 500 for the exhaustive roster, 0 for counts only.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "consumer_id": {
                "description": "smry-managed progress: poll this consumer's saved predicate. Omit cursor and where.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "cursor": {
                "description": "Caller-managed progress: \"latest\" to start, then the next_cursor you stored.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "fields": {
                "description": "Project event entries to these fields; [\"id\"] is the cheapest diff. id is always included.",
                "items": {
                  "anyOf": [
                    {
                      "const": "id",
                      "type": "string"
                    },
                    {
                      "const": "source",
                      "type": "string"
                    },
                    {
                      "const": "source_id",
                      "type": "string"
                    },
                    {
                      "const": "collection",
                      "type": "string"
                    },
                    {
                      "const": "title",
                      "type": "string"
                    },
                    {
                      "const": "url",
                      "type": "string"
                    },
                    {
                      "const": "summary",
                      "type": "string"
                    },
                    {
                      "const": "author",
                      "type": "string"
                    },
                    {
                      "const": "image_url",
                      "type": "string"
                    },
                    {
                      "const": "published_at",
                      "type": "string"
                    },
                    {
                      "const": "discovered_at",
                      "type": "string"
                    },
                    {
                      "const": "unread",
                      "type": "string"
                    },
                    {
                      "const": "classification",
                      "type": "string"
                    },
                    {
                      "const": "feedback",
                      "type": "string"
                    }
                  ]
                },
                "type": "array"
              },
              "limit": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "where": {
                "additionalProperties": false,
                "description": "Entry selection predicate: fields AND together; omit a field to not filter on it. Source queries/mutations accept only collection and source; use query having for source-health filters.",
                "properties": {
                  "classification": {
                    "additionalProperties": false,
                    "description": "The Collection filter's binary delivery decision and optional underlying assessment. Requires exactly one Collection.",
                    "properties": {
                      "assessment": {
                        "anyOf": [
                          {
                            "const": "relevant",
                            "type": "string"
                          },
                          {
                            "const": "irrelevant",
                            "type": "string"
                          },
                          {
                            "const": "uncertain",
                            "type": "string"
                          }
                        ]
                      },
                      "decision": {
                        "anyOf": [
                          {
                            "const": "include",
                            "type": "string"
                          },
                          {
                            "const": "exclude",
                            "type": "string"
                          }
                        ]
                      }
                    },
                    "required": ["decision"],
                    "type": "object"
                  },
                  "collection": {
                    "items": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": 1,
                          "type": "integer"
                        },
                        {
                          "maxLength": 100,
                          "minLength": 1,
                          "type": "string"
                        }
                      ],
                      "description": "A collection id or its exact name."
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "discovered_after": {
                    "description": "When smry first saw the entry. Backfill makes old posts look new here, so use it for diffs, not for \"what's new\". Relative window (\"7d\", \"36h\", \"45m\", \"2w\"), \"now\", or ISO date.",
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
