        {
          "name": "manage_feed_consumers",
          "title": "manage feed consumers (create/list/ack/delete)",
          "description": "create: Save a where predicate and let smry retain one processing checkpoint. New consumers start at the current high-water mark, so they receive future discoveries rather than replaying history. For history, create the Consumer first, query the historical window separately, then poll; that order closes the query/create race. Create one per independent processing loop, not per source. Retrying the same case-insensitive name and predicate returns the existing Consumer; the same name with another predicate is a 409. Required fields: name.\nExample: {\"action\":\"create\",\"name\":\"Engineering briefing\",\"where\":{\"collection\":[\"Research\"]}}\nlist: List each saved consumer, its opaque acknowledged_cursor, delivery and acknowledgement timestamps, and how many matching entries are waiting past that checkpoint. Required fields: none.\nExample: {\"action\":\"list\"}\nack: After processing every event returned by getFeedChanges for this consumer, acknowledge that response's next_cursor. Crashes before ack cause safe redelivery; stale, foreign, and invented cursors are rejected. Required fields: id, cursor.\nExample: {\"action\":\"ack\",\"id\":7,\"cursor\":\"<next_cursor from get_feed_changes>\"}\ndelete: Remove only the saved predicate and checkpoint. Followed sources, entries, and human read state are untouched. Required fields: id.\nExample: {\"action\":\"delete\",\"id\":7}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "\"create\": Create a managed feed consumer · \"list\": List managed consumers with pending counts · \"ack\": Acknowledge a managed consumer batch · \"delete\": Delete a managed feed consumer",
                "enum": ["create", "list", "ack", "delete"],
                "type": "string"
              },
              "cursor": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "id": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "where": {
                "additionalProperties": false,
                "description": "Entry selection predicate: fields AND together; omit a field to not filter on it. Source queries/mutations accept only collection and source; use query having for source-health filters.",
                "properties": {
                  "classification": {
                    "additionalProperties": false,
                    "description": "The Collection filter's binary delivery decision and optional underlying assessment. Requires exactly one Collection.",
                    "properties": {
                      "assessment": {
                        "anyOf": [
                          {
                            "const": "relevant",
                            "type": "string"
                          },
                          {
                            "const": "irrelevant",
                            "type": "string"
                          },
                          {
                            "const": "uncertain",
                            "type": "string"
                          }
                        ]
                      },
                      "decision": {
                        "anyOf": [
                          {
                            "const": "include",
                            "type": "string"
                          },
                          {
                            "const": "exclude",
                            "type": "string"
                          }
                        ]
                      }
                    },
                    "required": ["decision"],
                    "type": "object"
                  },
                  "collection": {
                    "items": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": 1,
                          "type": "integer"
                        },
                        {
                          "maxLength": 100,
                          "minLength": 1,
                          "type": "string"
                        }
                      ],
                      "description": "A collection id or its exact name."
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "discovered_after": {
                    "description": "When smry first saw the entry. Backfill makes old posts look new here, so use it for diffs, not for \"what's new\". Relative window (\"7d\", \"36h\", \"45m\", \"2w\"), \"now\", or ISO date.",
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "discovered_before": {
                    "description": "Relative window (\"7d\", \"36h\", \"45m\", \"2w\"), \"now\", or ISO date.",
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "match": {
                    "description": "Case-insensitive text match over title and summary. \"a OR b\" matches either.",
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  },
                  "published_after": {
                    "description": "When the source published the entry (entries with no publish date are excluded; use top-level since to include them). Relative window (\"7d\", \"36h\", \"45m\", \"2w\"), \"now\", or ISO date.",
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "published_before": {
                    "description": "Relative window (\"7d\", \"36h\", \"45m\", \"2w\"), \"now\", or ISO date.",
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "source": {
                    "additionalProperties": false,
                    "properties": {
                      "exclude": {
                        "items": {
