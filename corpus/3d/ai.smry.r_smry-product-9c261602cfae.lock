            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "change_detection": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "type": {
                        "const": "exact",
                        "type": "string"
                      }
                    },
                    "required": ["type"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "confidence_threshold": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "type": {
                        "const": "semantic",
                        "type": "string"
                      }
                    },
                    "required": ["type"],
                    "type": "object"
                  }
                ]
              },
              "collection": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "Collection id or name. A new name is created. Omit for Unsorted."
              },
              "name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "schedule": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "frequency": {
                        "maximum": 43200,
                        "minimum": 60,
                        "type": "integer"
