                        "type": "string"
                      },
                      "unit": {
                        "const": "days",
                        "type": "string"
                      }
                    },
                    "required": ["frequency", "type", "unit"],
                    "type": "object"
                  }
                ],
                "description": "Default: daily. Shortest interval: 60 minutes."
              },
