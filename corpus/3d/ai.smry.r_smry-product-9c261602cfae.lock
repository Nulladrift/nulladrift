                            },
                            {
                              "maxLength": 500,
                              "minLength": 1,
                              "type": "string"
                            }
                          ],
                          "description": "A source id (from any v2 response) or its title. Reads also accept a fragment that matches exactly one title."
                        },
                        "maxItems": 100,
                        "minItems": 1,
                        "type": "array"
                      },
                      "include": {
                        "items": {
                          "anyOf": [
                            {
                              "maximum": 9007199254740991,
                              "minimum": 1,
                              "type": "integer"
                            },
                            {
                              "maxLength": 500,
                              "minLength": 1,
                              "type": "string"
                            }
                          ],
                          "description": "A source id (from any v2 response) or its title. Reads also accept a fragment that matches exactly one title."
                        },
                        "maxItems": 100,
                        "minItems": 1,
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  "unread": {
                    "description": "true = only unread entries, false = only read entries.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "attention": {
                "additionalProperties": {},
                "description": "Source health, capped to five per bucket (stalled: longest silent first; erroring and never_produced: alphabetical); the *_count fields carry the full tally. Query select:\"sources\" with having for the complete list.",
                "properties": {
                  "erroring": {
                    "items": {
                      "patternProperties": {
                        "^(.*)$": {}
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "erroring_count": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "never_produced": {
                    "items": {
                      "patternProperties": {
                        "^(.*)$": {}
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "never_produced_count": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "stalled": {
                    "items": {
                      "patternProperties": {
                        "^(.*)$": {}
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "stalled_count": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["erroring", "erroring_count", "never_produced", "never_produced_count", "stalled", "stalled_count"],
                "type": "object"
              },
              "checkpoint": {
                "additionalProperties": {},
                "properties": {
                  "ack_required": {
                    "description": "True only for managed delivery; acknowledge next_cursor after processing every event, including an empty batch.",
                    "type": "boolean"
                  },
                  "consumer_id": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "owner": {
                    "anyOf": [
                      {
                        "const": "caller",
                        "type": "string"
                      },
                      {
                        "const": "smry",
                        "type": "string"
                      }
