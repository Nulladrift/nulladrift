        {
          "uri": "https://www.dadaville.ch/101/adalinda-gasparini.md",
          "name": "101/adalinda-gasparini",
          "title": "Adalinda Gasparini ⊷ Piattaforma dei 101",
          "description": "Psicoanalista, nata a Firenze nel 1951, dove vive ed esercita. Laureata in Filosofia, dal 1980 studia le fiabe e i miti e i loro intrecci con il sogno, il racconto clinico e la letteratura. Ha elaborato il metodo della versione collettiva per usare le fiabe nella scuola. Tra i suoi libri: Aladino e la lampada meravigliosa (1993), La luna nella cenere (1999) e, con Claudia Chellini, Lupus in fabula (2017) e Setole e spine (2019). Con Claudia Chellini cura Fabulando, piccola enciclopedia della fiaba online. È socia fondatrice e presidente di Fairitaly ONLUS.",
          "mimeType": "text/markdown",
          "digest": "sha256:9e86aecd80b6a7c029dee9a44fe74bb6297d9fa9fefed18f7f40646818b371ca"
        },
        {
          "uri": "https://www.dadaville.ch/101/andrea-stabellini.md",
          "name": "101/andrea-stabellini",
          "title": "Andrea Stabellini ⊷ Piattaforma dei 101",
          "description": "Presbitero e canonista, nato a Como nel 1976. Ha conseguito il dottorato in Diritto canonico alla Pontificia Università Lateranense nel 2014. Dal 2015 è professore di diritto canonico alla Facoltà di Teologia di Lugano. È stato Vicario Giudiziale della Diocesi di Como dal 2011 al 2016 e dal 2020 è nella Diocesi di Lugano. Con Libero Gerosa ha scritto Introduzione al diritto canonico (2012).",
          "mimeType": "text/markdown",
          "digest": "sha256:5fdcff38eefac7cd90af4a95539dd3cb1224c959ed76e8c74b802a9632446844"
        },
        {
          "uri": "https://www.dadaville.ch/101/angelo-duro.md",
          "name": "101/angelo-duro",
          "title": "Angelo Duro ⊷ Piattaforma dei 101",
          "description": "Comico, attore e scrittore, nato a Palermo nel 1982. Entra in televisione con Le Iene (Italia 1, dal 2009 al 2015). Debutta a teatro con Perché mi stai guardando? (2017), poi in sala con Tiramisù (2016) e con Io sono la fine del mondo (2025), che scrive con Gennaro Nunziante. Nel 2023 è ospite della seconda serata del Festival di Sanremo. Ha pubblicato i romanzi Il piano B (2018) e Come diventare stronzi ed essere amati (2025).",
          "mimeType": "text/markdown",
          "digest": "sha256:338d47a0c824de7fc1f65f978a549ae7aa30018985eed74fe88ed08fc013b2d2"
        },
        {
          "uri": "https://www.dadaville.ch/101/arturo-cattaneo.md",
          "name": "101/arturo-cattaneo",
          "title": "Arturo Cattaneo ⊷ Piattaforma dei 101",
          "description": "Canonista e teologo, nato a Lugano nel 1948. Laureato in architettura al Politecnico federale di Zurigo nel 1974. Dottore in Diritto canonico a Pamplona nel 1981 e licenziato in Teologia nel 1992. Ha insegnato a Pamplona, Roma e Venezia, e alla Facoltà di Teologia di Lugano dal 1992 al 1997 e dal 2010. Dal 2011 è membro della Commissione teologica della Conferenza episcopale svizzera. Tra i suoi libri: Il presbiterio della Chiesa particolare (Giuffrè, 1993) e La Chiesa locale (Libreria Editrice Vaticana, 2003).",
          "mimeType": "text/markdown",
          "digest": "sha256:1f6ee6ce81b574934867e41f5192b885309a79932928183e87763e2dc714149f"
        },
        {
          "uri": "https://www.dadaville.ch/101/catia-berbeglia.md",
          "name": "101/catia-berbeglia",
          "title": "Catia Berbeglia ⊷ Piattaforma dei 101",
          "description": "Pittrice e docente, nata a Viterbo nel 1967. Ha studiato all'Accademia di Belle Arti di Viterbo e dal 1996 insegna discipline d'arte. Dal 2005 si dedica anche all'incisione e alla stampa, nell'atelier Il Brunitoio di Ghiffa. Ha illustrato tre libri di Angelo Cassano, usciti tra il 2020 e il 2023. Dal 2006 vive e opera nel suo studio a Bellinzona e dal 2024 fa parte di Visarte. Con Cristina Antonini ha realizzato Convergenze, esposto ad Ascona tra il 2024 e il 2025.",
          "mimeType": "text/markdown",
          "digest": "sha256:7122f338b7b9772ac6d5f9850674111b732e5dc9178295d9ec8df1fed7720e33"
        },
        {
          "uri": "https://www.dadaville.ch/101/celine-cavallo-de-paoli.md",
          "name": "101/celine-cavallo-de-paoli",
          "title": "Céline Cavallo de' Paoli ⊷ Piattaforma dei 101",
          "description": "Strategic advisor e leader certificata nei board, con oltre vent'anni di esperienza nell'accompagnare aziende globali e startup ad alto impatto verso una crescita sostenibile. Oggi è consulente presso Tokenance, dove si occupa di trasformazione digitale, innovazione e blockchain. Siede nell'advisory board dell'Istituto Marangoni Miami, con cui collabora fin dalla nascita. Ha una laurea in Financial Engineering, un Global Executive MBA alla Bocconi e studi di strategia digitale al MIT Sloan. Parla italiano, francese, inglese e spagnolo.",
          "mimeType": "text/markdown",
          "digest": "sha256:dcff248f1231d0401aa33b0a0a1109916170546f3040405a71af730b35a11dab"
        },
        {
          "uri": "https://www.dadaville.ch/101/damiano-robbiani.md",
          "name": "101/damiano-robbiani",
          "title": "Damiano Robbiani ⊷ Piattaforma dei 101",
          "description": "Storico e archivista, nato nel 1983. È collaboratore scientifico della Divisione cultura della Città di Lugano e conservatore del Museo del Malcantone a Curio. Ha conseguito un dottorato in storia medievale all'Università di Friburgo e, nel 2011, un MAS in conservazione del patrimonio monumentale. Le sue pubblicazioni riguardano la storia delle istituzioni urbane e la storia locale.",
          "mimeType": "text/markdown",
          "digest": "sha256:d9cfe8352c66b75d520298d98b055b58746ca09f6f98578275201d87e3ab461c"
        },
        {
          "uri": "https://www.dadaville.ch/101/debora-ferrari.md",
          "name": "101/debora-ferrari",
          "title": "Debora Ferrari ⊷ Piattaforma dei 101",
          "description": "Giornalista iscritta all'Albo dal 1989, critica d'arte e autrice di testi letterari e guide. Ha studiato lettere e arte contemporanea con Luciano Caramel all'Università Cattolica di Milano. Dal 1986 si occupa di arte, cultura e turismo, con collaborazioni con quotidiani, periodici e case editrici. Ha curato mostre in musei nazionali e alla 54ª Biennale di Venezia. Dal 2008 pubblica con TraRari TIPI, la sua casa editrice. È autrice di oltre cento pubblicazioni di arte, turismo, poesia e teatro.",
          "mimeType": "text/markdown",
          "digest": "sha256:431eee75b2ac46206ecfffcc64bbeb613f3dbd9a7b5968e7f265c9f6ec26984b"
        },
        {
          "uri": "https://www.dadaville.ch/101/gabriele-adinolfi.md",
          "name": "101/gabriele-adinolfi",
          "title": "Gabriele Adinolfi ⊷ Piattaforma dei 101",
          "description": "Saggista, nato a Roma nel 1954. Ha militato nella destra radicale ed è stato tra i fondatori di Terza Posizione. Si occupa di analisi politica e metapolitica, ha fondato centri studi e riviste e cura il sito Noreporter. Tra i suoi libri figurano Noi Terza Posizione, scritto con Roberto Fiore, Matteo Salvini (2019) e Il mito dell'Europa (2023).",
          "mimeType": "text/markdown",
          "digest": "sha256:ada81f9eb37b456f533952324bbf258bd908864538009cc9d3be27d927dc3523"
        },
        {
          "uri": "https://www.dadaville.ch/101/jan-trautmann.md",
          "name": "101/jan-trautmann",
          "title": "Jan Trautmann ⊷ Piattaforma dei 101",
          "description": "Responsabile del Servizio comunicazione e innovazione digitale della Città di Lugano dal 1° aprile 2024, nato nel 1988. Dal 2021 ha lavorato come capoprogetto presso Lugano Living Lab. Ha un bachelor in Scienze politiche e relazioni internazionali all'Università di Losanna, un master in Economia e politiche internazionali all'Università della Svizzera italiana e un CAS in Project Management Professional alla SUPSI.",
          "mimeType": "text/markdown",
          "digest": "sha256:b9c3b6a6fc443c4d9cf24f90fcc6bea6d2e430c16bcdaecda4f5eb5ab3b835fe"
        },
        {
          "uri": "https://www.dadaville.ch/101/mya-lurgo.md",
          "name": "101/mya-lurgo",
          "title": "Mya Lurgo ⊷ Piattaforma dei 101",
          "description": "Artista, nata a Bordighera nel 1971. Lavora con pittura, Light Art, Land Art, arte digitale, video e performance. La sua ricerca esplora il rapporto tra materia e coscienza e lo spirituale nell'arte. Nel 2007 ha presentato il concetto di Acentrismo. Ha un atelier ad Aranno, in Ticino. Tra le sue esposizioni figurano Cieli verticali a Lugano (2022) e Here & Now alla Nellimya Arthouse (2026).",
          "mimeType": "text/markdown",
          "digest": "sha256:0328fb4c50916570e8e1946f47bc96b38defa51439414e20da86d1964052202e"
        },
        {
          "uri": "https://www.dadaville.ch/101/roberto-manzi.md",
          "name": "101/roberto-manzi",
          "title": "Roberto Manzi ⊷ Piattaforma dei 101",
          "description": "Si occupa di programmi per startup ad alto contenuto di innovazione: porta i programmi di ricerca verso l'impresa. Ha studiato Filosofia e Teologia e ha un dottorato in Scienze della comunicazione all'Università della Svizzera italiana, dove è stato Business Development Manager dal 2018 al 2025. Dal 2017 è partner di Enlight Strategy Consulting. È tra gli advisor del business plan di Dadaville. È sua l'idea di Una città intelligente, percorso teatrale itinerante su Napoli.",
          "mimeType": "text/markdown",
          "digest": "sha256:d785a25cc530bbc55b6f9e13db64a7a1dfbb8b428ad66248c1f1fe1495a9c61b"
        },
        {
          "uri": "https://www.dadaville.ch/101/tiziana-lotti-tramezzani.md",
          "name": "101/tiziana-lotti-tramezzani",
          "title": "Tiziana Lotti Tramezzani ⊷ Piattaforma dei 101",
          "description": "Storica dell'arte e curatrice, nata a Zurigo nel 1978. Si è laureata all'Università di Losanna nel 2004. Ha lavorato nella didattica dei musei ticinesi e nel 2006 ha coordinato l'esposizione di Massimo Cavalli al Museo cantonale d'arte di Lugano. Si è occupata della collezione e dell'archivio della Fondazione d'arte Erich Lindenberg a Porza e ha curato testi per le sue pubblicazioni.",
          "mimeType": "text/markdown",
          "digest": "sha256:78288db021d8b3491d48c7de72438674ad0c92567cebe6987032d6b8c60a932d"
        },
        {
          "uri": "https://www.dadaville.ch/101/vittorio-castracane.md",
          "name": "101/vittorio-castracane",
          "title": "Vittorio Castracane ⊷ Piattaforma dei 101",
          "description": "Guida turistica, vive a Milano. Si è laureato in Scienze linguistiche e letterature straniere all'Università Cattolica del Sacro Cuore e ha una laurea magistrale in Storia e critica delle arti e dello spettacolo all'Università di Parma. Dal 2016 accompagna visite guidate a Milano e a Parma.",
          "mimeType": "text/markdown",
          "digest": "sha256:56e1aba7560685510e953a2cb1339b87391efc94bb220cea505ca69e572c8dfd"
        },
        {
          "uri": "https://www.dadaville.ch/101billion.md",
