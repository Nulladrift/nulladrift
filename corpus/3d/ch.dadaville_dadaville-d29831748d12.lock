        },
        {
          "uri": "https://www.dadaville.ch/101billion/alexandr-wang.md",
          "name": "101billion/alexandr-wang",
          "title": "Alexandr Wang ⊷ 101 Billion",
          "description": "Ha cominciato con una domanda alla quale un computer, da solo, non ha saputo rispondere.",
          "mimeType": "text/markdown",
          "digest": "sha256:22f4ba18b6126303b04b82758dddedc2d6f3be5ce64d77b884200a4a8220831b"
