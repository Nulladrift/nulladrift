{
  "lockfileVersion": 2,
  "subjects": {
    "app.repairinfo/repairinfo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.repairinfo.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "repairinfo",
        "title": "repairinfo.app: repairability and durability of devices",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "repairinfo.app compares consumer devices by how long they last and how well they can be repaired. Manufacturer declarations from the EU product database EPREL and the French repairability and durability indices. repairinfo.app does not test devices itself. score is 0 to 10 (higher is better). scoreType says what it is based on: overall_eu_data (smartphones, tablets), repairability_index_fr, durability_index_fr. consumptionScore (0 to 10) rates energy, water and noise of washing machines and dishwashers. url is the device page on repairinfo.app. This interface carries no prices and no affiliate links. Rankings are sorted by score only. Data summaries CC BY 4.0. Cite as: repairinfo.app, based on EPREL (European Commission) and data.gouv.fr.",
      "tools": [
        {
          "name": "get_device",
          "title": "Device details",
          "description": "All data for one device: score and what it is based on, repairability class and index, guaranteed software update years and the year updates last until at least, user-replaceable battery, battery life, charge cycles, spare-part years, energy class, EPREL registration number, official recalls or safety warnings (EU Safety Gate, RappelConso) if any, and the link to the device page.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Device id from search_devices or top_devices, e.g. smartphones/gigaset-gs6-pro",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Device details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:648c0b7f600c9ef6bb2487678fe550a07df4edff52b5297ae25068a0f3e106ba"
        },
        {
          "name": "lookup_barcode",
          "title": "Look up a barcode",
          "description": "Find a device by its EAN/GTIN barcode (8 to 14 digits), as printed on the box or shelf label. Returns the same data as get_device.",
          "inputSchema": {
            "properties": {
              "ean": {
                "description": "EAN-8, UPC-A, EAN-13 or GTIN-14",
                "type": "string"
              }
            },
            "required": ["ean"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a barcode"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:639aae6c7cc79ee1393170580cb21972f95aa1be812904ebd8a642fe1a213cd5"
        },
        {
          "name": "search_devices",
          "title": "Search devices",
          "description": "Search smartphones, tablets, laptops, TVs, washing machines, dishwashers and vacuum cleaners by brand, sales name or model number. Returns repairability and durability score, EU repairability class, guaranteed update years and the link to the device page.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["smartphones", "tablets", "laptops", "tvs", "washing_machines", "dishwashers", "vacuum_cleaners"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Brand, sales name or model number, e.g. \"Galaxy S26\" or \"SM-S942B\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search devices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d43e7ae49e7523c064065168522cae628a16a3141c3201caf65b338a94b07e5"
        },
        {
          "name": "top_devices",
          "title": "Best devices in a category",
          "description": "The most repairable and durable devices of a category, sorted by score. Optional filters: minimum guaranteed update years, user-replaceable battery, brand. Use this for questions like \"which phone gets updates the longest\" or \"which tablets have a replaceable battery\".",
          "inputSchema": {
            "properties": {
              "brand": {
                "type": "string"
              },
              "category": {
                "enum": ["smartphones", "tablets", "laptops", "tvs", "washing_machines", "dishwashers", "vacuum_cleaners"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_update_years": {
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "replaceable_battery": {
                "type": "boolean"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best devices in a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59dd1f6a78ed6ac97878ae563af121a30c4ed4e5c521272ccfe91dc65fc9c03d"
        }
      ],
      "digest": "sha256:72676182a9bf6cd0f0333b2ccae11ee77ded06d81e33dec7976cbf45a8f41e4a"
    }
  }
}
