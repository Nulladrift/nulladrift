      },
      "transport": {
        "type": "http",
        "url": "https://commerce.designmaster.com.br/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "DMCommerce",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "    Shop at Brazilian online stores that run on DMCommerce. Prices are in BRL and shipping is quoted to a Brazilian CEP.\n    Flow: search_products (or find_store first when the person names a store), then get_product for sizes, colors,\n    stock and the product link, then quote_shipping when the person gives a CEP. Inside one store: list_categories and\n    browse_products (filters by size, color, brand, price, on sale, best sellers), list_product_reviews,\n    list_product_questions, get_size_chart and get_related_products; get_store_info for contact, payment, installments,\n    shipping and the policy pages (read_store_page), list_promotions for current deals and the store blog. The purchase\n    always happens on the store's own website: give the person the product_url of the item they chose. Never ask for\n    card numbers, passwords or documents (CPF) in the chat.",
      "tools": [
        {
          "name": "browse_products",
          "title": "Browse store products",
          "description": "Products of one store like the store website lists them: by category, tag or brand, with size/color filters, price range in BRL, only in stock, only on sale or featured, sorted by newest, price, best sellers or ending offers. The first page also brings the filters available (sizes, colors, brands, categories, price range) and the total. 20 per page.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand ids separated by comma (filters.brands).",
                "maxLength": 500,
                "type": "string"
              },
              "category": {
                "description": "Category id (list_categories or filters.categories).",
                "maxLength": 200,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "maxLength": 500,
                "type": "string"
              },
              "featured": {
                "description": "Only the featured products of the home page.",
                "type": "boolean"
              },
              "filters": {
                "description": "Attribute filters from filters.attributes: {\"tamanho\": \"p,m\", \"cor\": \"preto\"} (attribute slug => value slugs).",
                "type": "object"
              },
              "in_stock": {
                "description": "Only products in stock.",
                "type": "boolean"
              },
              "max_price": {
                "description": "Highest price in BRL (reais).",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Lowest price in BRL (reais).",
                "minimum": 0,
                "type": "number"
              },
              "on_sale": {
                "description": "Only products with a current promotion.",
                "type": "boolean"
              },
              "sort": {
                "description": "Order; without it, the store order.",
                "enum": ["newest", "price_asc", "price_desc", "bestselling", "ending", "name"],
                "type": "string"
              },
              "store": {
                "description": "Store id (\"store\" field from find_store or search_products).",
                "type": "string"
              },
              "tag": {
                "description": "Tag id (filters.tags).",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["store"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse store products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c46df940877e55ef56757ad19f91dc18206c37a58d0abc277cd7c57ae88db88"
        },
        {
          "name": "find_store",
          "title": "Find a store",
          "description": "Find online stores in Brazil that sell on DMCommerce, by store name or by what they sell (e.g. \"jeans\", \"suplementos\", \"acessórios 4x4\"). Leave query empty to list every store. Returns up to 20 stores with their website and main categories.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Store name or kind of product, e.g. \"Zé Marcos 4x4\", \"moda infantil\", \"óculos\". Empty lists all stores.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
