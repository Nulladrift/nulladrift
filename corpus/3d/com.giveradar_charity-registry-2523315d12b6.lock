      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "giveradar-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GiveRadar exposes 7.9M+ charity profiles via MCP. Use `resources/list` with optional country filter (ISO 3166-1 alpha-2) to discover charities, then `resources/read` with a `gr://charity/<slug>` URI for full schema.org JSON-LD + FAQs. Sensitive fields gated on the website (email, phone, full officer names) are NOT exposed via this endpoint by design.",
      "tools": [
        {
          "name": "compare_charities",
          "title": "Compare Charities",
          "description": "Side-by-side comparison of 2-5 charities by slug. Returns their integrity scores, program/admin/fundraising ratios, annual revenue, founding year, foundation type, and a deterministic verdict on which has the strongest transparency signal. Use this when the user wants to choose between named charities.",
          "inputSchema": {
            "properties": {
              "slugs": {
                "description": "Charity slugs to compare (2-5).",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare Charities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b876a50a85ff0ee9310a8298b1b7d618c2796eb52e3f869a59e62502a7f89bc"
        },
        {
          "name": "find_similar",
          "title": "Find Similar Charities",
          "description": "Given one charity's slug, return up to `limit` other charities in the same country + category. Useful for 'find more like this' recommendations. Excludes the input charity from the result.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Source charity slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Similar Charities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0dedcc22e41b2cffd4d7b4f54928655ca22d7f374a21f8e2fc960c111cc8e2f6"
        },
        {
          "name": "search_charities",
          "title": "Search Charities",
          "description": "Search the charity registry by free-text name. Returns up to `limit` matches, each with slug, name, country, city/state, foundation_type, integrity_score, and the canonical page URL. Use this BEFORE resources/read when the user names a charity but you don't know its slug. The match is case-insensitive substring on the charity's name.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional ISO 3166-1 alpha-2 country filter (e.g. 'ID', 'NL').",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name search query, 2+ chars.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Charities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0566ae5d4a91374bcaf6592a424d01cc29d945de9c3e001fa51d0aa04932d3ad"
        },
        {
          "name": "verify_charity",
          "title": "Verify Charity Registration",
          "description": "Look up a charity by its official registry identifier - EIN (US), Charity Commission number (GB), RSIN (NL), AHU/Kemenkumham reg number (ID), or a generic registration_number for other countries. Returns the matched charity or null. Use this when the user provides a registry number and wants to confirm what's registered under it.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code.",
                "type": "string"
              },
              "id_value": {
                "description": "The registration / EIN / charity number.",
                "type": "string"
              }
            },
            "required": ["country", "id_value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify Charity Registration"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0080c28c17035ee5ded9f57fd1011410e46927f86d0a947b5da089c67e79ae07"
        }
      ],
