            "readOnly": true
          },
          "digest": "sha256:c5174adcfe89baf1846985ffb8f0bfb979b6d349e3fb1156e3eaea9eaa945991"
        },
        {
          "name": "costa_search_knowledge",
          "title": "Search reviewed Costa guidance",
          "description": "Search published and reviewed Costa Contable guides and corridors. Returns source and review metadata; educational information only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "enum": ["es", "en"],
                "type": "string"
              },
              "query": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["locale", "query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
