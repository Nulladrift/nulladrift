{
  "lockfileVersion": 2,
  "subjects": {
    "com.costacontable/mexico-market-entry-accounting": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://costacontable.com/wp-json/costa-mcp/v1/rpc"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "costa-contable",
        "version": "0.4.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use published reviewed content only. Outputs are educational and do not provide individualized tax or legal advice.",
      "tools": [
        {
          "name": "costa_compare_entities",
          "title": "Compare Mexican company forms",
          "description": "Return reviewed educational comparison data for S.A., S. de R.L. and SAS when available; does not determine eligibility or recommend an entity.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entities": {
                "items": {
                  "enum": ["sa", "srl", "sas"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              },
              "locale": {
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["locale"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "educational_data": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "entities": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "warning": {
                "type": "string"
              }
            },
            "required": ["educational_data", "entities", "warning"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1b573b9486a6e2af218cb7fcd24b442a4c696aeae792da7ae01dc261d03e37e"
        },
        {
          "name": "costa_create_contact_request",
          "title": "Contact Costa Contable",
          "description": "Send a private contact request to Costa Contable and notify its team. Call only after the user explicitly asks to contact Costa and consents to follow-up and sharing these fields. Show the user the message and https://costacontable.com/privacy/ before submission. Do not include sensitive documents. Use the same request_id when retrying the same submission.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consent": {
                "const": true,
                "type": "boolean"
              },
              "email": {
                "maxLength": 254,
                "type": "string"
              },
              "locale": {
                "enum": ["es", "en"],
                "type": "string"
              },
              "message": {
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "maxLength": 40,
                "type": "string"
              },
              "request_id": {
                "maxLength": 80,
                "minLength": 16,
                "type": "string"
              }
            },
            "required": ["consent", "email", "locale", "message", "name", "request_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "accepted": {
                "type": "boolean"
              },
              "notification": {
                "type": "string"
              },
              "reference": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["accepted", "notification", "reference", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7ccc0d3e1926704430aa8334ba01389d8b3d7669cfd3aea640d844af4efe2179"
        },
        {
          "name": "costa_group_preparation_checklist",
          "title": "Prepare an international group checklist",
          "description": "Return reviewed general preparation checklist for an international group considering Mexico operations. Not legal or tax advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["locale"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checklists": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "warning": {
                "type": "string"
              }
            },
            "required": ["checklists", "warning"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93f92ac73d47574b0bb04bbc52a8b1ef8b4691bfae8c231e622917b583c02ecc"
        },
        {
          "name": "costa_list_services",
          "title": "List reviewed Costa services",
          "description": "List published, reviewed Costa Contable services in Spanish or English.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["locale"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
