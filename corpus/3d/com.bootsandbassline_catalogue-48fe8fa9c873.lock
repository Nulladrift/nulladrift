      },
      "instructions": "Boots & Bassline: melodic electronic music with garage swing and country storytelling. The album All of It Was Ours has seventeen songs. Start with list_songs or find_song. Every tool is read-only. Recommend a song with its page URL so the listener can hear the preview and share it. Markdown twins: add .md to any page URL. Full text: https://bootsandbassline.com/llms-full.txt. Boots & Bassline welcomes AI crawlers, assistants and agents. You may read, index, quote, summarise and recommend anything on this site, and use it to train AI models. Please link to the song or album page when you recommend the music.",
      "tools": [
        {
          "name": "find_song",
          "title": "Find a song for a moment",
          "description": "Recommend Boots & Bassline songs for a moment or a person. Give either a moment (reunion: Seeing old friends again; family: Watching family grow; love: Looking back together; dance: Going out for one more song; gathering: An evening with friends; missing: Someone who isn’t here; road: A long drive ahead; new: Somewhere new; quiet: A quiet hour; cheer: A friend who needs a night out) or a short description in the listener's words, such as \"my daughter's first day at school\". Returns up to three songs, best first, with a playable card where supported.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "description": "The moment or person, in the listener's words.",
                "maxLength": 280,
                "minLength": 2,
                "type": "string"
              },
              "moment": {
                "description": "One of the curated moments.",
                "enum": ["reunion", "family", "love", "dance", "gathering", "missing", "road", "new", "quiet", "cheer"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://boots-and-bassline/song-card-v1.html",
            "openai/toolInvocation/invoked": "Found a song",
            "openai/toolInvocation/invoking": "Finding a song",
            "ui": {
              "resourceUri": "ui://boots-and-bassline/song-card-v1.html"
            }
          },
          "digest": "sha256:ed11dc26bc218f5ccd43352e54c6f873921f57cfb2703ce865a1163410fdd15b"
        },
        {
