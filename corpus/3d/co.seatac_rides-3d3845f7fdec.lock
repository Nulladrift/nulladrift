        {
          "name": "recommend_hotels_with_rides",
          "title": "Hotels with whole-trip ride costs",
          "description": "Recommend Seattle hotels for a stay with the whole-trip cost: typical room rate for the nights plus the rides the stay needs (Seatac → hotel on check-in day, then hotel → cruise pier or back to Seatac on check-out day). near is a cruise pier (pier-66, pier-91: check-out day is sailing day) or a hotel area. For a pier it also prices a SeaTac airport hotel, so the traveler can see when a cheaper airport room plus rides beats a downtown room. Room links lead; ride links are the add-on. Typical rates and ride estimates, not live prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkin": {
                "description": "Check-in date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date, YYYY-MM-DD (sailing day for a pier).",
                "format": "date",
                "type": "string"
              },
              "compare_airport_hotel": {
                "description": "For a pier: also price a SeaTac airport hotel (default true).",
                "type": "boolean"
              },
              "limit": {
                "description": "Hotels to return (1-8, default 5).",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A cruise pier (pier-66, pier-91) or a hotel area.",
                "enum": ["pier-66", "pier-91", "seatac-hotels", "downtown-seattle", "waterfront", "belltown-slu-seattle-center", "bellevue", "eastside", "kirkland"],
                "type": "string"
              },
              "party_size": {
                "description": "Travelers (1-14, default 2).",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["checkin", "checkout", "near"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "airport_hotel_alternative": {
                "type": ["object", "null"]
