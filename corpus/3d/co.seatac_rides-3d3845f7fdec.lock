        {
          "name": "plan_seattle_trip",
          "title": "Plan a Seattle trip",
          "description": "Plan a Seattle visit day by day, the same plan as seatac.co/seattle-trip-planner: a work trip, seeing family, a game or concert, or a holiday (for a cruise use plan_cruise_trip). Give the dates; everything else is optional and can be added on later calls. Returns each day in order: arrival (flight, the Seatac ride with its pickup time and estimate), the hotel, each day's plan from morning to evening with meetings at their set times, meals, experiences and events, the estimated travel time between stops and a ride link for each leg, warnings when something won't fit, suggested restaurants and experiences for empty parts of the day, games and concerts on each date with ticket links, the ride back to the airport timed from the flight home, hotel options ranked for the trip (nearest the meetings for work), an estimated total, and plan_page_url, which opens exactly this plan for the traveler to change and book. Nothing is assumed booked. Read-only; no payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arrival_flight": {
                "description": "Arriving flight number, e.g. AS 33.",
                "type": "string"
              },
              "arrival_place": {
                "description": "train, bus, ferry or other: where they arrive (a bus stop, a ferry terminal). Defaults: King Street Station for the train, Colman Dock for the ferry.",
                "type": "string"
              },
              "arrive_by": {
                "description": "fly (default), drive, train (King Street Station), bus, ferry (Colman Dock or Pier 69), or other.",
                "enum": ["fly", "drive", "train", "bus", "ferry", "other", "train_bus_ferry"],
                "type": "string"
              },
              "departure_time": {
                "description": "Flight home's departure, Seattle time HH:MM. Sets the last day and the ride to the airport.",
                "type": "string"
              },
              "end": {
                "description": "Day they leave, YYYY-MM-DD (same as start for a day trip). Or give nights.",
                "format": "date",
                "type": "string"
              },
              "home_airport": {
                "description": "3-letter code of the airport they fly from, e.g. ORD.",
                "type": "string"
              },
              "hotel_name": {
                "description": "Or a hotel they booked elsewhere, \"name, address\".",
                "type": "string"
              },
              "hotel_slug": {
                "description": "One of our hotels (slug from hotel_options).",
                "type": "string"
              },
              "landing_time": {
                "description": "Landing time at Seatac, Seattle time HH:MM. Sets the airport pickup and the first afternoon.",
                "type": "string"
              },
              "meetings": {
                "description": "Meetings or appointments at set times (up to 10).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "description": "Where it is, e.g. \"Amazon Spheres, 2111 7th Ave, Seattle, WA\".",
                      "type": "string"
