        {
          "name": "plan_trip",
          "title": "Plan a SEA / Seattle trip",
          "description": "Creates a trip plan for a trip through Seattle-Tacoma Airport (SEA) or Seattle: rides, hotel, flights, a cruise from Seattle, tours and events in one plan, timed so it fits. Give the arrival date (or a cruise sailing), travelers, and anything already known; you can add the rest later with add_to_plan. Creates a stored plan and returns plan_id, edit_key (keep private; needed to change it), plan_url (the visual, shareable plan page: show this to the traveler), summary_markdown, what's still needed, warnings, and hotel_options. The rides between the airport, hotel, pier and stops are planned automatically. Nothing is booked or charged: the traveler books from plan_url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arrival_flight": {
                "description": "flight: arriving flight number, e.g. AS 23, only once booked (the plan then shows the flight in as booked). Before that give landing_time, or search_flights.",
                "type": "string"
              },
              "cruise_already_booked": {
                "description": "They already booked the cruise.",
                "type": "boolean"
              },
              "cruise_sail_date": {
                "description": "The sailing date in Seattle, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "cruise_ship": {
                "description": "A cruise from Seattle: the ship (from find_cruise_sailings).",
                "type": "string"
              },
              "departure_time": {
                "description": "flight: flight home's departure, Seattle time HH:MM.",
                "type": "string"
              },
              "end": {
                "description": "The day they leave (no cruise), YYYY-MM-DD. Or give nights.",
                "format": "date",
                "type": "string"
              },
              "event_date": {
                "description": "The event's date, YYYY-MM-DD (with event_id).",
                "format": "date",
                "type": "string"
              },
              "event_id": {
                "description": "A trip built around one game, concert or show: its pick_id (ev-<slug>) from find_events_near. Give event_date too; it sets the dates (start defaults to that day) and purpose event, and puts the event on its day.",
                "type": "string"
              },
              "home_airport": {
                "description": "flight: 3-letter code they fly from, e.g. ORD.",
                "type": "string"
              },
              "hotel_name": {
                "description": "hotel: or a hotel booked elsewhere, \"name, address\".",
                "type": "string"
              },
              "hotel_slug": {
                "description": "One of our hotels (slug from hotel_options of an earlier answer, or recommend_hotels_with_rides).",
                "type": "string"
              },
              "items": {
                "description": "More to put on the plan right away (up to 12), each like add_to_plan's item, e.g. {\"type\":\"tour\",\"id\":\"space-needle\",\"date\":\"2027-05-05\"}.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "description": "meeting: where it is (a business address).",
                      "type": "string"
                    },
                    "already_booked": {
                      "description": "hotel, flight, cruise, tour: the traveler already booked it (shown as booked).",
                      "type": "boolean"
                    },
                    "arrival_flight": {
                      "description": "flight: arriving flight number, e.g. AS 23, only once booked (the plan then shows the flight in as booked). Before that give landing_time, or search_flights.",
                      "type": "string"
                    },
                    "date": {
                      "description": "The day (YYYY-MM-DD), a day in Seattle on the plan. Needed for tours, restaurants, events, meetings; optional for parking and rental_car.",
                      "format": "date",
                      "type": "string"
                    },
                    "departure_time": {
                      "description": "flight: flight home's departure, Seattle time HH:MM.",
                      "type": "string"
                    },
                    "home_airport": {
                      "description": "flight: 3-letter code they fly from, e.g. ORD.",
                      "type": "string"
                    },
                    "hotel_name": {
                      "description": "hotel: or a hotel booked elsewhere, \"name, address\".",
                      "type": "string"
                    },
                    "hotel_slug": {
                      "description": "hotel: one of hotel_options (bookable on seatac.co).",
                      "type": "string"
                    },
                    "id": {
                      "description": "tour/experience: pick_id from find_things_to_do (e.g. space-needle). restaurant: pick_id from find_restaurants (eat-...). event: ev-<slug> from find_events_near.",
                      "type": "string"
                    },
                    "landing_time": {
                      "description": "flight: landing at SEA, Seattle time HH:MM.",
                      "type": "string"
                    },
                    "minutes": {
                      "description": "meeting: length in minutes (15-600, default 60).",
                      "maximum": 600,
                      "minimum": 15,
                      "type": "integer"
                    },
                    "name": {
                      "description": "meeting: a short label, e.g. Client meeting. No personal details.",
                      "type": "string"
                    },
                    "part": {
                      "description": "Part of the day: morning, lunch, afternoon, dinner or evening (default: when it usually fits).",
                      "enum": ["morning", "lunch", "afternoon", "dinner", "evening"],
                      "type": "string"
                    },
                    "return_flight": {
                      "description": "flight: flight home, e.g. AS 38.",
                      "type": "string"
                    },
                    "sail_date": {
                      "description": "cruise: embarkation date in Seattle, YYYY-MM-DD.",
                      "format": "date",
                      "type": "string"
                    },
                    "ship": {
                      "description": "cruise: ship name from find_cruise_sailings.",
                      "type": "string"
                    },
                    "time": {
                      "description": "meeting: start, Seattle time HH:MM.",
                      "type": "string"
                    },
                    "type": {
                      "description": "What to add.",
                      "enum": ["hotel", "flight", "cruise", "tour", "experience", "restaurant", "event", "meeting", "ride", "parking", "rental_car"],
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "type": "array"
              },
              "kids": {
                "description": "How many of them are kids (default 0).",
                "maximum": 13,
                "minimum": 0,
                "type": "integer"
              },
              "landing_time": {
                "description": "flight: landing at SEA, Seattle time HH:MM.",
                "type": "string"
              },
              "local": {
                "description": "They live in the Seattle area: no flight or hotel; the plan offers the ride there and back (by licensed partners) or parking. With an event and no end, a same-day plan.",
                "type": "boolean"
              },
              "nights": {
                "description": "Nights in Seattle instead of end (0-21, default 2). With a cruise the Seattle nights run to sailing day.",
                "maximum": 21,
                "minimum": 0,
                "type": "integer"
              },
              "purpose": {
                "description": "vacation (default), business, visit, event or other.",
                "enum": ["business", "visit", "event", "vacation", "other"],
                "type": "string"
              },
              "return_flight": {
                "description": "flight: flight home, e.g. AS 38.",
                "type": "string"
              },
              "start": {
                "description": "The day they arrive in Seattle, YYYY-MM-DD. Optional with a cruise (default: the day before sailing).",
                "format": "date",
                "type": "string"
              },
              "travelers": {
                "description": "Everyone traveling (1-14, default 2).",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "edit_key": {
                "type": "string"
              },
              "name": {
                "description": "The plan's name, e.g. \"Alaska cruise · May 7–14\": use it when the traveler has more than one plan.",
                "type": "string"
              },
              "plan_id": {
                "type": "string"
              },
              "plan_url": {
                "description": "The visual plan page for the traveler. Share this link.",
                "format": "uri",
                "type": "string"
              },
              "summary_markdown": {
                "description": "A short day-by-day summary to show in the chat.",
                "type": "string"
              },
              "traveler_edit_url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["edit_key", "plan_id", "plan_url"],
            "type": "object"
          },
