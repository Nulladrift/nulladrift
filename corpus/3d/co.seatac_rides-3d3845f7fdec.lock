                  "type": "string"
                },
                "type": "object"
              },
              "parking_breakeven_days": {
                "type": ["integer", "null"]
              },
              "ranking": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "trip": {
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
