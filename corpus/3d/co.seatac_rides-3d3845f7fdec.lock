      },
      "instructions": "Seatac Co (seatac.co) is the independent trip guide and planner for Seatac Airport (SEA) and Seattle: one place to plan a whole trip (rides, hotel, flights, an Alaska cruise, tours and events), timed so it fits, and book it.\n\nTo plan a trip, start with plan_trip, then add_to_plan for each thing the traveler wants, check_plan for timing and cost, and get_checkout_link when they're ready. Every answer carries plan_url: the visual plan page. Show the traveler summary_markdown and plan_url (\"Here is your plan\").\n\nThe traveler books the parts in any order, each paid on its own: the trip itself (the cruise or event tickets, with a partner), the flight (with a partner), the hotel (rooms book on seatac.co's hotel pages) and the rides (by licensed partner operators, paid on seatac.co, several in one payment). Only a ride waits, and only for what it connects to: a ride to or from Seatac for its flight, to or from the hotel for the hotel, to or from the pier for the sailing (booked, booked elsewhere or not needed all count). Rides are timed to the flight, hotel and sailing. Partner links are labeled partner_link. No tool books or charges anything: the traveler confirms and pays on seatac.co.\n\nHelpers: find_cruise_sailings (which ship sails when, Pier 66 or 91), find_things_to_do and find_restaurants (pick_ids for add_to_plan), find_events_near, recommend_hotels_with_rides, check_hotel_prices and search_flights (live prices), quote_ride (an exact ride fare), compare_parking_vs_ride, compare_rental_vs_ride, compare_airport_options and plan_airport_departure. plan_seattle_trip and plan_cruise_trip build a plan without storing it; start_booking gives a single prefilled ride link.\n\nNever invent prices: estimates say so, and quote_ride gives the exact fare. Rides book up to the booking window check_plan names. Phone (206) 737-0808.",
      "tools": [
        {
          "name": "add_to_plan",
          "title": "Add to the trip plan",
          "description": "Add one thing to a plan: hotel, flight details, cruise, tour or experience, restaurant, event, meeting, parking or rental_car (rides are planned automatically). A hotel, flight or cruise replaces the one already in the plan. Adding the same thing again changes nothing. Returns item_id (for remove_from_plan), the updated summary and the same plan_url, which now shows it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "edit_key": {
                "description": "edit_key from plan_trip. Keep it private: it lets you change the plan.",
                "type": "string"
              },
              "item": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "description": "meeting: where it is (a business address).",
                    "type": "string"
                  },
                  "already_booked": {
                    "description": "hotel, flight, cruise, tour: the traveler already booked it (shown as booked).",
                    "type": "boolean"
                  },
                  "arrival_flight": {
                    "description": "flight: arriving flight number, e.g. AS 23, only once booked (the plan then shows the flight in as booked). Before that give landing_time, or search_flights.",
                    "type": "string"
                  },
                  "date": {
                    "description": "The day (YYYY-MM-DD), a day in Seattle on the plan. Needed for tours, restaurants, events, meetings; optional for parking and rental_car.",
                    "format": "date",
                    "type": "string"
                  },
                  "departure_time": {
                    "description": "flight: flight home's departure, Seattle time HH:MM.",
                    "type": "string"
                  },
                  "home_airport": {
                    "description": "flight: 3-letter code they fly from, e.g. ORD.",
                    "type": "string"
                  },
                  "hotel_name": {
                    "description": "hotel: or a hotel booked elsewhere, \"name, address\".",
                    "type": "string"
                  },
                  "hotel_slug": {
                    "description": "hotel: one of hotel_options (bookable on seatac.co).",
                    "type": "string"
                  },
                  "id": {
                    "description": "tour/experience: pick_id from find_things_to_do (e.g. space-needle). restaurant: pick_id from find_restaurants (eat-...). event: ev-<slug> from find_events_near.",
                    "type": "string"
                  },
                  "landing_time": {
                    "description": "flight: landing at SEA, Seattle time HH:MM.",
                    "type": "string"
                  },
                  "minutes": {
                    "description": "meeting: length in minutes (15-600, default 60).",
                    "maximum": 600,
                    "minimum": 15,
                    "type": "integer"
                  },
                  "name": {
                    "description": "meeting: a short label, e.g. Client meeting. No personal details.",
                    "type": "string"
                  },
                  "part": {
                    "description": "Part of the day: morning, lunch, afternoon, dinner or evening (default: when it usually fits).",
                    "enum": ["morning", "lunch", "afternoon", "dinner", "evening"],
                    "type": "string"
                  },
                  "return_flight": {
                    "description": "flight: flight home, e.g. AS 38.",
                    "type": "string"
                  },
                  "sail_date": {
                    "description": "cruise: embarkation date in Seattle, YYYY-MM-DD.",
                    "format": "date",
                    "type": "string"
                  },
                  "ship": {
                    "description": "cruise: ship name from find_cruise_sailings.",
                    "type": "string"
                  },
                  "time": {
                    "description": "meeting: start, Seattle time HH:MM.",
                    "type": "string"
                  },
                  "type": {
                    "description": "What to add.",
                    "enum": ["hotel", "flight", "cruise", "tour", "experience", "restaurant", "event", "meeting", "ride", "parking", "rental_car"],
                    "type": "string"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "plan_id": {
                "description": "plan_id from plan_trip.",
                "type": "string"
              }
            },
            "required": ["edit_key", "item", "plan_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "confirmation": {
                "description": "Which plan the change went on, e.g. \"Added to Seattle · Dec 4–7\".",
                "type": "string"
              },
              "item_id": {
                "type": ["string", "null"]
              },
              "name": {
                "description": "The plan's name, e.g. \"Alaska cruise · May 7–14\": use it when the traveler has more than one plan.",
                "type": "string"
              },
              "plan_id": {
                "type": "string"
              },
              "plan_url": {
                "description": "The visual plan page for the traveler. Share this link.",
                "format": "uri",
                "type": "string"
              },
              "summary_markdown": {
                "description": "A short day-by-day summary to show in the chat.",
                "type": "string"
              }
            },
            "required": ["plan_id", "plan_url"],
            "type": "object"
          },
