        {
          "name": "find_things_to_do",
          "title": "Find things to do in Seattle",
          "description": "Seattle experiences the trip planner offers (Space Needle and Chihuly Garden, a harbor cruise, the Museum of Flight, food tours and more): what each is, how long it takes, which parts of the day it fits, rough price level, where it is, a ticket link, and with hotel_slug about how long it takes to get there. Each has a pick_id to pass to plan_seattle_trip's picks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hotel_slug": {
                "description": "Our hotel (from plan_seattle_trip's hotel_options) to estimate travel time from.",
                "type": "string"
              },
              "limit": {
                "description": "How many (default 10).",
                "minimum": 1,
                "type": "integer"
              },
              "part": {
                "description": "Only those that fit this part of the day.",
                "enum": ["morning", "lunch", "afternoon", "dinner", "evening"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "type": "string"
              },
              "experiences": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "page_url": {
