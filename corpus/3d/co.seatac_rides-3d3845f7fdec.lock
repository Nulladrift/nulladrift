        {
          "name": "compare_parking_vs_ride",
          "title": "Compare SEA parking vs a ride",
          "description": "Compare parking at the Seatac (SEA) airport garage for a trip with a round-trip private ride to and from the airport, using the same numbers as seatac.co/parking: Port of Seattle drive-up rates (taxes included) against example sedan fares from seven Seattle-area starting points. Returns both totals, which is cheaper and by how much, and the trip length where the ride starts winning. Optional: pass address + pickup_datetime for a live fare (one rate-limited quote).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Optional exact pickup/drop-off address in the Seattle area for a live fare instead of the stored example fare, e.g. \"1301 5th Ave, Seattle\". Needs pickup_datetime. Uses one rate-limited live quote.",
                "type": "string"
              },
              "bags": {
                "description": "Checked-size bags for the live fare (0-12, default 2).",
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "days": {
                "description": "Days the car would be parked (whole 24-hour days, 1-60).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "from_area": {
                "description": "Where the traveler drives from (default downtown-seattle).",
                "enum": ["downtown-seattle", "waterfront", "bellevue", "kirkland", "tacoma", "federal-way", "renton"],
                "type": "string"
              },
              "passengers": {
                "description": "Passengers for the live fare (1-12, default 2).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "pickup_datetime": {
                "description": "With address: the ride's pickup date and time, ISO 8601, Seattle local time when no offset, e.g. 2026-11-02T14:30.",
                "type": "string"
              }
            },
            "required": ["days"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "airport_garage": {
                "properties": {
                  "total_usd": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "breakeven_days": {
                "description": "Trip length (days) from which the ride costs less than the garage.",
                "type": ["integer", "null"]
              },
              "cheaper": {
                "enum": ["ride", "parking", "tie"],
                "type": "string"
              },
              "difference_usd": {
                "type": "number"
              },
              "error": {
                "type": "string"
              },
              "page_url": {
                "format": "uri",
                "type": "string"
              },
              "private_ride": {
                "properties": {
                  "booking_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "fare_source": {
                    "enum": ["example_fare", "live_quote"],
                    "type": "string"
                  },
                  "one_way_usd": {
                    "type": "number"
                  },
                  "round_trip_usd": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "trip": {
                "type": "object"
              },
              "verdict": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d49b2274d08361616bd4985e0b485ef1074349cddfd71459bcb6c06d60d05ac"
        },
