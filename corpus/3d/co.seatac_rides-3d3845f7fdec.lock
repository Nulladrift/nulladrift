        {
          "name": "find_cruise_sailings",
          "title": "Find Seattle cruise sailings",
          "description": "Look up Seattle cruise sailings from the Port of Seattle schedule (2026 season and the preliminary 2027 season): which pier and terminal a ship uses on a date, and which ships sail on a day. Filter by ship (fuzzy), cruise_line, date or from/to, and pier. Each upcoming embarkation (turnaround) day includes ride_to_pier with a prefilled seatac.co booking link from Seattle-Tacoma International Airport; call quote_ride with its quote_ride_arguments plus a pickup time for the live fare. Without a date filter, only sailings from today on are returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cruise_line": {
                "description": "Cruise line, e.g. \"Norwegian\" or \"Holland America\".",
                "type": "string"
              },
              "date": {
                "description": "A single date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "from": {
                "description": "Start of a date range, YYYY-MM-DD (inclusive).",
                "format": "date",
                "type": "string"
              },
              "pier": {
                "description": "Pier 66 (Bell Street) or Pier 91 (Smith Cove).",
                "enum": ["66", "91"],
                "type": "string"
              },
              "ship": {
                "description": "Ship name, any case; partial names work, e.g. \"Norwegian Bliss\" or \"Bliss\".",
                "type": "string"
              },
              "to": {
                "description": "End of a date range, YYYY-MM-DD (inclusive).",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1916c3c05e255631dfdd478b8236cee9a06fac46f8dc10e832b56ec218d78d89"
        },
        {
          "name": "find_events_near",
          "title": "Find Seattle events near a place",
          "description": "Find Seattle-area games, concerts and shows on given dates (from Seatac's daily Ticketmaster snapshot), the same list seatac.co shows as \"Happening while you're here\". With near (the airport, a cruise pier, or a hotel area) events are nearest first, one per venue, within 20 miles, with the straight-line distance; without it, the biggest events first. Each event has its start time, the planned ride (pickup time to arrive 45 minutes early, estimated end, ride back), a prefilled round-trip booking link, the event page and the ticket link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First date, YYYY-MM-DD (Seattle).",
                "format": "date",
                "type": "string"
              },
              "kind": {
                "description": "Only sports, concert, or show.",
                "enum": ["sports", "concert", "show"],
                "type": "string"
              },
              "limit": {
                "description": "Events to return (1-10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "Where the traveler is: sea-airport, a cruise pier, or a hotel area. Omit for the biggest events.",
                "enum": ["sea-airport", "pier-66", "pier-91", "downtown-seattle", "waterfront", "belltown-slu-seattle-center", "bellevue", "eastside", "kirkland"],
                "type": "string"
              },
              "ride_from": {
                "description": "Optional address the ride to the event starts from (e.g. their hotel), prefilled in the booking link.",
                "type": "string"
              },
              "to": {
                "description": "Last date, inclusive (up to 14 days after from). Omit for one day.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["from"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "type": "string"
              },
              "events": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "event_page_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "ride_booking_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "ride_plan": {
                      "type": ["object", "null"]
                    },
                    "start_time": {
                      "type": ["string", "null"]
                    },
                    "tickets_url": {
                      "type": "string"
                    },
                    "venue": {
                      "type": "object"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "page_url": {
                "format": "uri",
                "type": "string"
              },
              "searched": {
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
