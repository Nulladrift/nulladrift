        {
          "name": "quote_ride",
          "title": "Quote a Seatac Co ride",
          "description": "Get the live fare for a specific Seatac Co ride, per eligible vehicle, priced exactly as seatac.co checkout prices it. Each vehicle includes a booking_url where the customer reviews and pays. Rate limited; reuse a quote instead of re-requesting it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bags": {
                "description": "Number of checked-size bags (0-12).",
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "dropoff": {
                "description": "Drop-off location. Street address, hotel, or place in the Seattle area, e.g. \"Seattle-Tacoma International Airport\", \"Pier 91\", \"Hyatt Regency Bellevue\", or \"1301 5th Ave, Seattle\". Optional for hourly charters.",
                "type": "string"
              },
              "flight_number": {
                "description": "Optional flight number for Seatac pickups or drop-offs, e.g. AS 123.",
                "type": "string"
              },
              "hours": {
                "description": "Set only for an hourly charter: the number of hours (1-24).",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "passengers": {
                "description": "Number of passengers (1-12).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "pickup": {
                "description": "Pickup location. Street address, hotel, or place in the Seattle area, e.g. \"Seattle-Tacoma International Airport\", \"Pier 91\", \"Hyatt Regency Bellevue\", or \"1301 5th Ave, Seattle\".",
                "type": "string"
              },
              "pickup_datetime": {
                "description": "Pickup date and time, ISO 8601. Without an offset it is read as Seattle local time (America/Los_Angeles), e.g. 2026-11-02T14:30.",
                "type": "string"
              }
            },
            "required": ["passengers", "pickup", "pickup_datetime"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booking_url": {
                "format": "uri",
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "trip": {
                "type": "object"
              },
              "vehicles": {
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
