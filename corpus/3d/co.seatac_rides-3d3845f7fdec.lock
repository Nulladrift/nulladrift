{
  "lockfileVersion": 2,
  "subjects": {
    "co.seatac/rides": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://seatac.co/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "seatac-co",
        "title": "Seatac Connection rides",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Seatac Connection (seatac.co) runs private, pre-booked SUV and sedan rides between Seatac Airport and the Seattle area, plus hourly charters. Use get_service_info for the service area, vehicles, and policies; quote_ride for a live fare on a specific trip; start_booking for a prefilled seatac.co link where the customer reviews and pays; find_cruise_sailings for which pier and terminal a ship sails from on a date, with a ready ride-to-pier booking link; search_flights for live airfares to or from SEA and check_hotel_prices for live Seattle hotel prices, each with a seatac.co booking link; and the trip planners: plan_seattle_trip (any Seattle visit day by day: work trips with meetings, family visits, events, holidays; hotel, meals, experiences, events, travel times, rides and a link that opens the plan), plan_cruise_trip (day-by-day cruise trip with costs), find_things_to_do and find_restaurants (the planner's own lists, with pick_ids for plan_seattle_trip), compare_airport_options, compare_parking_vs_ride and compare_rental_vs_ride (ride vs parking vs rental with real numbers), recommend_hotels_with_rides (room plus rides, whole-trip cost), find_events_near (games and concerts with ride timing), and plan_airport_departure (when to leave for SEA). Planner figures are estimates or example fares and say so; quote_ride gives the exact fare. Never invent prices: fares are quoted per trip. Phone (206) 737-0808, hello@seatac.co.",
      "tools": [
        {
          "name": "check_hotel_prices",
          "title": "Live Seattle hotel prices",
          "description": "Live room prices for Seattle-area hotels on given dates: the lowest total for the stay (2 adults, 1 room, USD, our price as seatac.co shows it). near is a cruise pier (pier-66, pier-91) or a hotel area. Each hotel's rooms_url opens its seatac.co page on those dates, where the traveler picks a room and pays, and can add the ride from Seatac. Rate limited; reuse results instead of re-checking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkin": {
                "description": "YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "checkout": {
                "description": "YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "limit": {
                "description": "Hotels to price (1-6, default 5).",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A cruise pier (pier-66, pier-91) or a hotel area.",
                "enum": ["pier-66", "pier-91", "seatac-hotels", "downtown-seattle", "waterfront", "belltown-slu-seattle-center", "bellevue", "eastside", "kirkland"],
                "type": "string"
              }
            },
            "required": ["checkin", "checkout", "near"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "type": "string"
              },
              "hotels": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "page_url": {
                "format": "uri",
                "type": "string"
              },
              "stay": {
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f3f321cff93b66fafa36b8baefff380e0fdca48750bfb124ff72897e09ac9b29"
        },
        {
          "name": "compare_airport_options",
          "title": "Compare ways to and from SEA",
          "description": "Compare every way to get between Seatac Airport (SEA) and a Seattle-area place for one trip: a private Seatac Connection ride, driving and parking at the SEA garage, a rental car, app rideshare or taxi, and Link light rail. Priced options carry real numbers (Port of Seattle garage rates, typical rental costs, example or live ride fares); rideshare and light rail are described, not priced, because their prices are not fixed. direction: \"departing\" (flying out of SEA: the alternative is parking), \"arriving\" (visiting: the alternative is a rental), or \"both\". Ranks the priced options cheapest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Optional exact pickup/drop-off address in the Seattle area for a live fare instead of the stored example fare, e.g. \"1301 5th Ave, Seattle\". Needs pickup_datetime. Uses one rate-limited live quote.",
                "type": "string"
              },
              "area": {
                "description": "Seattle-area place the trip starts or ends at (default downtown-seattle).",
                "enum": ["downtown-seattle", "waterfront", "bellevue", "kirkland", "tacoma", "federal-way", "renton"],
                "type": "string"
              },
              "bags": {
                "description": "Checked-size bags for the live fare (0-12, default 2).",
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "direction": {
                "description": "departing = a local flying out of SEA (compare parking); arriving = a visitor flying in (compare a rental); both (default).",
                "enum": ["departing", "arriving", "both"],
                "type": "string"
              },
              "passengers": {
                "description": "Passengers for the live fare (1-12, default 2).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "pickup_datetime": {
                "description": "With address: the ride's pickup date and time, ISO 8601, Seattle local time when no offset, e.g. 2026-11-02T14:30.",
                "type": "string"
              },
              "rental_daily_rate": {
                "description": "Optional: the traveler's own daily rental rate before tax, USD.",
                "minimum": 0,
                "type": "number"
              },
              "trip_days": {
                "description": "Length of the trip in days (1-30): days parked, or nights in town for a rental.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["trip_days"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cheapest_priced": {
                "type": ["string", "null"]
              },
              "error": {
                "type": "string"
              },
              "options": {
                "items": {
                  "properties": {
                    "how": {
                      "type": "string"
                    },
                    "option": {
                      "enum": ["private_ride", "airport_garage_parking", "rental_car", "rideshare_or_taxi", "link_light_rail"],
                      "type": "string"
                    },
                    "total_usd": {
                      "type": ["number", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "pages": {
                "additionalProperties": {
                  "format": "uri",
                  "type": "string"
                },
                "type": "object"
              },
              "parking_breakeven_days": {
                "type": ["integer", "null"]
              },
              "ranking": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "trip": {
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
