        {
          "name": "get_beach_water_quality",
          "title": "Beach water quality",
          "description": "Puerto Rico beach water quality: which beaches are under a no-swimming advisory, and the latest Enterococcus bacteria count at each of the ~49 beaches the island monitors under the federal BEACH Act. Returns the beaches named in DRNA's current notice with their town and the days the water was sampled, every station's latest count with its sample date and a verdict, how often each beach has been flagged across the notices on record, and the separate volunteer-lab samples (Surfrider Rincón, Arrecifes Pro Ciudad). IMPORTANT — the verdict vocabulary is exactly three states and NEVER the word 'safe': 'advisory' (not suitable for swimming), 'within' (the count was at or under the 70 colonies/100 mL Beach Action Value), and 'stale' (no sample in 21 days — the source's own latest value for a station can be YEARS old, so it is not a verdict either way; check verdict.sampledOn before believing any number). Only DRNA's notice can place a beach under advisory (verdict.basis 'notice'); a count above 70 that no notice covers is reported as verdict.basis 'reading'. Results are published days after sampling and water changes with rain and tide, so never state or imply that a beach is currently safe to swim — report the number, the date, and the advisory state. Cite 787daily.com/live/beaches/.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "beach": {
                "description": "Optional beach name, station id (e.g. RW-19) or town to filter to. Omit for the whole island.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
