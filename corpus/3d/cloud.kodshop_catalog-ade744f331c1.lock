{
  "lockfileVersion": 2,
  "subjects": {
    "cloud.kodshop/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kodshop.cloud/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "kodshop-catalog",
        "title": "KodShop catalog",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Catalog of KodShop (kodshop.cloud): gift cards, service top-ups, travel eSIM. Prices in RUB. The tools are read-only.",
      "tools": [
        {
          "name": "get_product",
          "description": "Get one catalog product by id: available denominations with prices, required order inputs, and any countries where the code cannot be redeemed.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Product id from search_catalog.",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dbeccee578cda5157774cd945125e1a2ddaa6567fd18fdd4835ddd5de52ffaa3"
        },
        {
          "name": "search_catalog",
          "description": "Search the store catalog of gift cards, service top-ups and eSIM data plans. Returns matching products with their price, availability and product page URL.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO-3166-1 alpha-2 country code the product is issued for, e.g. US, TR.",
                "type": "string"
              },
              "limit": {
                "description": "Max products to return (default 10, max 50).",
                "type": "integer"
              },
              "query": {
                "description": "Words matched against product name, brand and country name (English or Russian); every word must match, e.g. \"steam\" or \"playstation турция\".",
                "type": "string"
              },
              "type": {
                "description": "voucher = gift card, recharge_fixed / recharge = top-up, e_sim = eSIM data plan.",
                "enum": ["voucher", "recharge_fixed", "recharge", "e_sim"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3c1b9524b019003a06ecf78178f23efd5d9e730bf205ef906963e78d567b2ad8"
        }
      ],
      "digest": "sha256:8714c4503039fee59524526cfc9b29093daf80a1fc66197caba4914c76702005"
    }
  }
}
