{
  "lockfileVersion": 2,
  "subjects": {
    "cloud.kodshop/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kodshop.cloud/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "kodshop-catalog",
        "title": "KodShop catalog",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Catalog of KodShop (kodshop.cloud): gift cards, service top-ups, travel eSIM. Prices in RUB. The tools are read-only.",
      "tools": [
        {
          "name": "get_product",
          "description": "Get one catalog product by id: available denominations with prices, required order inputs, and any countries where the code cannot be redeemed.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Product id from search_catalog.",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ada902e0a630efca3b0a7442cd5063722cbd977078c6ff1db17c6533c8ce1f43"
        },
        {
          "name": "search_catalog",
          "description": "Search the store catalog of gift cards, service top-ups and eSIM data plans. Returns matching products with their price, availability and product page URL.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO-3166-1 alpha-2 country code the product is issued for, e.g. US, TR.",
                "type": "string"
              },
              "limit": {
                "description": "Max products to return (default 10, max 50).",
                "type": "integer"
              },
              "query": {
                "description": "Free text matched against product name and brand, e.g. \"steam\" or \"playstation\".",
                "type": "string"
              },
              "type": {
                "description": "voucher = gift card, recharge_fixed / recharge = top-up, e_sim = eSIM data plan.",
                "enum": ["voucher", "recharge_fixed", "recharge", "e_sim"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b5c8294bfeaea248e33913d38fd6321f803823a7833fcd1147a2def17ff7b8a"
        }
      ],
      "digest": "sha256:8c04b3e5038aaa638716f506ce5193dba3710b40fb0b9c76e0ff1913cfa77bf6"
    }
  }
}
