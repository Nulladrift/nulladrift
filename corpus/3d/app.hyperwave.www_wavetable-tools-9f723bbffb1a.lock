        {
          "name": "calculate_frame_size",
          "description": "Calculate packed float32 mono WAV sample count, payload bytes, total bytes, and durations. Pure calculation; no audio rendering or saved data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "frameCount": {
                "description": "Number of frames packed into the WAV",
                "maximum": 65536,
                "minimum": 1,
                "type": "integer"
              },
              "sampleRate": {
                "description": "WAV sample-rate header, in Hz",
                "maximum": 384000,
                "minimum": 1,
                "type": "integer"
              },
              "samplesPerFrame": {
                "description": "Samples in each single-cycle frame",
                "maximum": 65536,
                "minimum": 2,
