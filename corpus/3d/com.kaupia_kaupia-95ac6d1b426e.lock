{
  "lockfileVersion": 2,
  "subjects": {
    "com.kaupia/kaupia": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.kaupia.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kaupia",
        "version": "1.30.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kaupia is where an AI agent buys things for a person: stores serving US consumers, delivered price and arrival date, one order, Kaupia answers for the outcome. Flow: search_products -> get_product -> get_quote (delivered price to a zip) -> place_order (user pays Kaupia at pay_url, the participating merchant fulfills directly) -> order_status. Only verified, payout-ready merchants with recent offers are public. No research-only or unjoined-store offers.",
      "tools": [
        {
          "name": "authorize_payment",
          "description": "Preview, disabled pending seller/provider acceptance. Authorize an approved Kaupia order with a buyer-granted Stripe SPT; never send raw card data. No automatic capture. May require buyer authentication or payment review; never retry through a second payment flow.",
          "inputSchema": {
            "properties": {
              "approved_total": {
                "title": "Approved Total",
                "type": "string"
              },
              "order_id": {
                "title": "Order Id",
                "type": "string"
              },
              "shared_payment_token": {
                "title": "Shared Payment Token",
                "type": "string"
              }
            },
            "required": ["approved_total", "order_id", "shared_payment_token"],
            "title": "authorize_paymentArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48fd8244d60cf5a56e49dd23c0b534776a9d69eef95299a8b2b603e304142faf"
        },
        {
          "name": "create_checkout",
          "description": "Prepare a Kaupia purchase. Use get_quote and place_order for the buyer-approved payment link.",
          "inputSchema": {
            "properties": {
              "agent": {
                "default": "unknown",
                "title": "Agent",
                "type": "string"
              },
              "product_id": {
                "title": "Product Id",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "title": "Quantity",
                "type": "integer"
              },
              "variant_id": {
                "title": "Variant Id",
                "type": "string"
              }
            },
            "required": ["product_id", "variant_id"],
            "title": "create_checkoutArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60937f25d3d885da96ccb1675295d2be098979d8d6dd71f28c132d8d8fd53ec1"
        },
        {
          "name": "get_product",
          "description": "Recently checked details for one eligible product. Recheck the final quote before ordering.",
          "inputSchema": {
            "properties": {
              "agent": {
                "default": "unknown",
                "title": "Agent",
                "type": "string"
              },
              "country": {
                "default": "US",
                "title": "Country",
                "type": "string"
              },
              "product_id": {
                "title": "Product Id",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "title": "get_productArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7aa235d0a64c001e1f55cc02b220509280032591d8ad12cc57188436bc5f8156"
        },
        {
          "name": "get_quote",
          "description": "Delivered price for one variant to a US zip code: item + the store's own shipping rate for that address +\n    estimated sales tax, plus the delivery estimate. Nothing is bought. Use it to compare real totals across stores.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "title": "Product Id",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "title": "Quantity",
                "type": "integer"
              },
              "state": {
                "default": "",
                "title": "State",
                "type": "string"
              },
              "variant_id": {
                "title": "Variant Id",
                "type": "string"
              },
              "zip": {
                "title": "Zip",
                "type": "string"
              }
            },
            "required": ["product_id", "variant_id", "zip"],
            "title": "get_quoteArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2ab30fa01cd6d101ec6be663b6d0e63ae370c1a26e2471f02bde39323dce313"
        },
        {
          "name": "order_status",
          "description": "Status of an order placed through Kaupia (received → paid → placed → shipped → delivered) with tracking.",
          "inputSchema": {
            "properties": {
              "order_id": {
                "title": "Order Id",
                "type": "string"
              }
            },
            "required": ["order_id"],
            "title": "order_statusArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c3f3464a2417ca52566019a3abc6f462f97657f6a24ce0c25e994aee1ddd8e9d"
        },
        {
          "name": "place_order",
          "description": "Order through Kaupia. customer = {name, email, address1, address2?, city, state, zip, phone?} (US only).\n    The user pays Kaupia the delivered price at pay_url (Stripe); the participating merchant fulfills directly for the\n    user. Confirm item and address and pass the buyer-approved exact quote total as approved_total.\n    A changed or missing total creates no order. Problems are reviewed through order help; refunds are not automatic.",
          "inputSchema": {
            "properties": {
              "agent": {
                "default": "unknown",
                "title": "Agent",
                "type": "string"
              },
              "approved_total": {
                "title": "Approved Total",
                "type": "string"
              },
              "customer": {
                "additionalProperties": true,
                "title": "Customer",
                "type": "object"
              },
              "product_id": {
                "title": "Product Id",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "title": "Quantity",
                "type": "integer"
              },
              "variant_id": {
                "title": "Variant Id",
                "type": "string"
              }
            },
            "required": ["approved_total", "customer", "product_id", "variant_id"],
            "title": "place_orderArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d94eaece40399d2e816412e926cf6aba65fc1990275d6ebc934c5421f3df30e5"
        },
        {
          "name": "report_outcome",
          "description": "Legacy checkout-link feedback only, not verified order/payment evidence and not used in ranking. New Kaupia purchases use order_status and order help.",
          "inputSchema": {
            "properties": {
              "checkout_id": {
                "title": "Checkout Id",
                "type": "string"
              },
              "note": {
                "default": "",
                "title": "Note",
                "type": "string"
              },
              "outcome": {
                "title": "Outcome",
                "type": "string"
              }
            },
            "required": ["checkout_id", "outcome"],
            "title": "report_outcomeArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b8fac23c9d487417aa7f0e00cd056a5ce71c7564ce34e01912dc804888d4ada"
        },
        {
          "name": "search_products",
          "description": "Search products for a buyer intent. Returns ranked candidates with price, availability and product_id.\n    Call get_product(product_id) before quoting a specific variant. Prices in major units (USD).",
          "inputSchema": {
            "properties": {
              "agent": {
                "default": "unknown",
                "title": "Agent",
                "type": "string"
              },
              "country": {
                "default": "US",
                "title": "Country",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "title": "Limit",
                "type": "integer"
              },
              "max_price_usd": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Max Price Usd"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_productsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8dc7cd50367ae223dc8d4198b23956eb2b7b29a699d97273f6e919d159350423"
        },
        {
          "name": "shop_scorecard",
          "description": "Funded Kaupia orders only, excluding tests and legacy link requests. Delivered is merchant-marked, not independently carrier-verified. An empty list means no qualifying evidence.",
          "inputSchema": {
            "properties": {},
            "title": "shop_scorecardArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3925867c060ff8d5b9ffcb0fc072a7537928b17110e7fa4c56b783f5e24ba9cc"
        }
      ],
      "digest": "sha256:93950d920692d915ffc13b4771775d1ea595e04c3065d64b85326001cd448cab"
    }
  }
}
