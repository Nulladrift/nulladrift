{
  "lockfileVersion": 2,
  "subjects": {
    "com.kaupia/kaupia": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.kaupia.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kaupia",
        "version": "1.27.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kaupia is where an AI agent buys things for a person: stores serving US consumers, delivered price and arrival date, one order, Kaupia answers for the outcome. Flow: search_products -> get_product -> get_quote (delivered price to a zip) -> place_order (user pays Kaupia at pay_url, the participating merchant fulfills directly; other stores use create_checkout) -> order_status. create_checkout gives the store's own checkout instead.",
      "tools": [
        {
          "name": "create_checkout",
          "description": "Start a purchase. v0 returns the merchant's checkout link for the chosen variant plus a Kaupia\n    checkout_id. Keep the checkout_id and call report_outcome later so the order is covered and ranked.",
          "inputSchema": {
            "properties": {
              "agent": {
                "default": "unknown",
                "title": "Agent",
                "type": "string"
              },
              "product_id": {
                "title": "Product Id",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "title": "Quantity",
                "type": "integer"
              },
              "variant_id": {
                "title": "Variant Id",
                "type": "string"
              }
            },
            "required": ["product_id", "variant_id"],
            "title": "create_checkoutArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "create_checkoutOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c55ef35c4c34d67f5bdf24381290db687eac3c67a74151b0bbd245be4c7142b8"
        },
        {
          "name": "get_product",
          "description": "Live details for one product: variants, price, stock status, checkout links.",
          "inputSchema": {
            "properties": {
              "agent": {
                "default": "unknown",
                "title": "Agent",
                "type": "string"
              },
              "country": {
                "default": "US",
                "title": "Country",
                "type": "string"
              },
              "product_id": {
                "title": "Product Id",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "title": "get_productArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_productOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1496799002f291d59503746206d5f565515d14001294071baf1235a598f455fd"
        },
        {
          "name": "get_quote",
          "description": "Delivered price for one variant to a US zip code: item + the store's own shipping rate for that address +\n    estimated sales tax, plus the delivery estimate. Nothing is bought. Use it to compare real totals across stores.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "title": "Product Id",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "title": "Quantity",
                "type": "integer"
              },
              "state": {
                "default": "",
                "title": "State",
                "type": "string"
              },
              "variant_id": {
                "title": "Variant Id",
                "type": "string"
              },
              "zip": {
                "title": "Zip",
                "type": "string"
              }
            },
            "required": ["product_id", "variant_id", "zip"],
            "title": "get_quoteArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_quoteOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3ddbddc305ee9c17d2c3c5e84ace5a479d38c06019332dc144f3a2538268bddb"
        },
        {
          "name": "order_status",
          "description": "Status of an order placed through Kaupia (received → paid → placed → shipped → delivered) with tracking.",
          "inputSchema": {
            "properties": {
              "order_id": {
                "title": "Order Id",
                "type": "string"
              }
            },
            "required": ["order_id"],
            "title": "order_statusArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "order_statusOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f68f20cf175a5d74205e182ba10a38a043ac17c921bb9ab90efe2be944a510bf"
        },
        {
          "name": "place_order",
          "description": "Order through Kaupia. customer = {name, email, address1, address2?, city, state, zip, phone?} (US only).\n    The user pays Kaupia the delivered price at pay_url (Stripe); the participating merchant fulfills directly for the\n    user; late, wrong or missing = refund. Confirm item, address and total with the user before calling.",
          "inputSchema": {
            "properties": {
              "agent": {
                "default": "unknown",
                "title": "Agent",
                "type": "string"
              },
              "customer": {
                "additionalProperties": true,
                "title": "Customer",
                "type": "object"
              },
              "product_id": {
                "title": "Product Id",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "title": "Quantity",
                "type": "integer"
              },
              "variant_id": {
                "title": "Variant Id",
                "type": "string"
              }
            },
            "required": ["customer", "product_id", "variant_id"],
            "title": "place_orderArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "place_orderOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5d461638c03832e3f755b301d45223e9d9fe6892f9523c8769a76fd4e2465d5"
        },
        {
          "name": "report_outcome",
          "description": "Report what happened to a checkout: placed | delivered | wrong_item | late | refunded | failed.",
          "inputSchema": {
            "properties": {
              "checkout_id": {
                "title": "Checkout Id",
                "type": "string"
              },
              "note": {
                "default": "",
                "title": "Note",
                "type": "string"
              },
              "outcome": {
                "title": "Outcome",
                "type": "string"
              }
            },
            "required": ["checkout_id", "outcome"],
            "title": "report_outcomeArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "report_outcomeOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:989f6b7c437dbe0f2520a05c2572167aca79f13b0d09c4ba364020b781d8ae65"
        },
        {
          "name": "search_products",
          "description": "Search products for a buyer intent. Returns ranked candidates with price, availability and product_id.\n    Call get_product(product_id) before quoting a specific variant. Prices in major units (USD).",
          "inputSchema": {
            "properties": {
              "agent": {
                "default": "unknown",
                "title": "Agent",
                "type": "string"
              },
              "country": {
                "default": "US",
                "title": "Country",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "title": "Limit",
                "type": "integer"
              },
              "max_price_usd": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Max Price Usd"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_productsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_productsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6aab06567dfedd5dc4a70c5fcba17b880081357fbbba8965178287322018e788"
        },
        {
          "name": "shop_scorecard",
          "description": "Per-shop outcome stats collected through Kaupia (delivered vs problems).",
          "inputSchema": {
            "properties": {},
            "title": "shop_scorecardArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "shop_scorecardOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:381d60d2e727383e21cd805526492e01939a735cae07236b201d7f605c5fd240"
        }
      ],
      "digest": "sha256:e9b4b6c8975567f1902b475f1b63ac894c0a4eaa1de0d672cdc2a9c322081fae"
    }
  }
