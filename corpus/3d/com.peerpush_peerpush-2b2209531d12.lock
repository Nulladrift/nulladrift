{
  "lockfileVersion": 2,
  "subjects": {
    "com.peerpush/peerpush": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://peerpush.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "PeerPush",
        "version": "1.4.0",
        "description": "PeerPush is a product discovery platform for people and AI, with structured, curated data on software products, SaaS tools, developer tools, AI tools, and apps. Create and discover products, find alternatives, compare tools side by side, look up product details and pricing, and explore trending products, new launches, and active deals. Product data covers pricing, platforms, use cases, target audiences, and community engagement metrics (upvotes, followers, reviews). Create and discover products without authentication. Discovery tools are read-only. Product creation returns a private link to sign in, confirm details, and choose a plan; it does not claim, publish, or purchase anything."
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "peerpush_compare",
          "title": "Compare Products",
          "description": "Compares 2-5 named software products side by side. Relevant when the user wants a comparison or asks which of several specific products to choose (e.g. \"Vercel vs Netlify\"). Returns a structured comparison showing shared and unique features, pricing differences, platform coverage, use cases, audiences, and community engagement metrics. Requested products that PeerPush knows only as alternatives, without structured data, are returned under notListedOnPeerPush with a name and website. Link each product with its websiteUrl, or its peerpushUrl for the PeerPush page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "products": {
                "description": "Product names to compare (e.g. [\"Vercel\", \"Netlify\", \"Railway\"])",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54d8f771789ad5677d0aeda65f7bd0a443137a7c8ae139a4b8799e7061e019bc"
        },
        {
          "name": "peerpush_create_product",
          "title": "Create a Product",
          "description": "Create a private, unclaimed product on PeerPush. No API key or account is needed to create. Accepts the same fields as POST /api/v1/products and returns the same data envelope: id, status, claimUrl, expiresAt, claimedAt. Show the private claim link to the user so they can sign in, confirm details in the normal editor, and choose a plan. This does not claim, publish, or purchase anything. Keep the claim link private. Only create when the user asks to create a product. Each successful call creates a new product; do not automatically retry after an uncertain response.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alternatives": {
                "default": [],
                "items": {
                  "properties": {
                    "productId": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "type": {
                      "const": "internal",
                      "type": "string"
                    }
                  },
                  "required": ["productId", "type"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "apiDocsUrl": {
                "type": ["string", "null"]
              },
              "appStoreUrl": {
                "type": ["string", "null"]
              },
              "audiences": {
                "default": [],
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "categories": {
                "default": [],
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "cliInstallCommand": {
                "type": ["string", "null"]
              },
              "contactEmail": {
                "description": "Contact address for the person who should claim this product. Required. Never published or returned by the API, and only PeerPush staff can see it. PeerPush emails it once, to remind the owner to claim the product before the link expires.",
                "format": "email",
                "maxLength": 320,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "description": {
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "discountCodes": {
                "items": {
                  "properties": {
                    "code": {
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "percentOff": {
                      "maximum": 100,
                      "minimum": 10,
                      "type": "integer"
                    },
                    "title": {
                      "maxLength": 50,
                      "minLength": 1,
                      "type": "string"
                    },
                    "validUntil": {
                      "description": "Expiry as an ISO date string or Unix timestamp in milliseconds",
                      "type": ["string", "number"]
                    }
                  },
                  "required": ["code", "percentOff", "title", "validUntil"],
                  "type": "object"
                },
                "maxItems": 1,
                "type": "array"
              },
              "externalId": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "linkedinUrl": {
                "default": null,
                "type": ["string", "null"]
              },
              "logoUrl": {
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "mcpServerUrl": {
                "type": ["string", "null"]
              },
              "mrr": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "name": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "platforms": {
                "default": [],
                "items": {
                  "enum": ["Web", "Api", "Desktop", "Mcp", "Cli", "Mobile", "Ios", "Android"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "playStoreUrl": {
                "type": ["string", "null"]
              },
              "pricingType": {
                "anyOf": [
                  {
                    "enum": ["Free", "Freemium", "Subscription", "OneTime", "Paid"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "screenshotUrls": {
                "default": [],
                "items": {
                  "format": "uri",
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "startingPrice": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "tagline": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "twitterUsername": {
                "default": null,
                "type": ["string", "null"]
              },
              "useCases": {
                "default": [],
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "websiteUrl": {
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["contactEmail", "description", "logoUrl", "name", "tagline", "websiteUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e2a2ea422247620e62aa3d894e7329f1125eca59ebb40b2407241de822dff3e"
        },
        {
          "name": "peerpush_deals",
          "title": "Product Deals",
          "description": "Lists products on PeerPush with currently active discount codes. Relevant when the user asks about software deals, discounts, coupons, or promotions. Returns products with their active discount code and percentage off. Link each product with its websiteUrl, or its peerpushUrl for the PeerPush page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Filter by category name or slug (e.g. \"ai\", \"developer-tools\", \"productivity\")",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of results",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Product Deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6274fde8143f5b0a7131c1712e71f391abd4adb6d2a61b52838c49c5ed28e88d"
        },
        {
          "name": "peerpush_discover",
          "title": "Discover Products",
          "description": "Browses the PeerPush catalog by structured criteria: use case, target audience, platform, pricing model, and category. Relevant when the user wants to explore products matching specific filters rather than a keyword search (e.g. \"free CLI tools for developers\"). Returns matching products sorted by score, recency, or trending momentum. Link each product with its websiteUrl, or its peerpushUrl for the PeerPush page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audience": {
                "description": "Target audience (e.g. \"Developers\", \"Indie Hackers\", \"Marketers\", \"Designers\", \"Startups\")",
                "type": "string"
              },
              "category": {
                "description": "Category name or slug (e.g. \"ai\", \"developer-tools\", \"productivity\")",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of results",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "platforms": {
                "description": "Platform: Web, Api, Desktop, Mcp, Cli, Mobile",
                "items": {
                  "enum": ["Web", "Api", "Desktop", "Mcp", "Cli", "Mobile", "Ios", "Android"],
                  "type": "string"
                },
                "type": "array"
              },
              "pricingType": {
                "description": "Pricing: Free, Freemium, Subscription, OneTime, Paid",
                "enum": ["Free", "Freemium", "Subscription", "OneTime", "Paid"],
                "type": "string"
              },
              "sort": {
                "default": "score",
                "description": "Sort order",
                "enum": ["score", "newest", "trending"],
                "type": "string"
              },
              "useCase": {
                "description": "Use case (e.g. \"Code Development\", \"Email Campaigns\", \"Analytics & Reporting\", \"AI Code Assistant\")",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Discover Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af3b40d501cd2dcfc138bdcfb366f9b96c647699aa8601dc60b9c97fa7214dd3"
        },
        {
          "name": "peerpush_find_alternative",
          "title": "Find Alternatives",
          "description": "Finds alternatives and competitors to a named software product, tool, app, or service. Relevant when the user asks for an alternative, replacement, or competitor to a specific product (e.g. \"alternative to Notion\", \"something like Figma but free\"). Returns ranked alternatives with pricing, platforms, use cases, and community engagement metrics. Link each product with its websiteUrl, or its peerpushUrl for the PeerPush page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audience": {
                "description": "Filter by target audience (e.g. \"Developers\", \"Indie Hackers\", \"Marketers\", \"Designers\")",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of alternatives to return",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "platforms": {
                "description": "Filter by platform: Web, Api, Desktop, Mcp, Cli, Mobile",
                "items": {
                  "enum": ["Web", "Api", "Desktop", "Mcp", "Cli", "Mobile", "Ios", "Android"],
                  "type": "string"
                },
                "type": "array"
              },
              "pricingType": {
                "description": "Filter by pricing: Free, Freemium, Subscription, OneTime, Paid",
                "enum": ["Free", "Freemium", "Subscription", "OneTime", "Paid"],
                "type": "string"
              },
              "product": {
                "description": "The product name to find alternatives for (e.g. \"Notion\", \"Figma\", \"Stripe\")",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Alternatives"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86d705763145c07b251f186d5fd422a7d3c9680d310a761be1f20b22209d2109"
        },
        {
          "name": "peerpush_find_product",
          "title": "Find Products",
          "description": "Searches the PeerPush product catalog with a natural language query and semantic matching, plus optional structured filters for pricing, platform, audience, and use case. Relevant when the user wants a software product, tool, app, or service recommended for a specific need (e.g. \"email API for transactional emails\"). Returns products ranked by relevance and community engagement. Link each product with its websiteUrl, or its peerpushUrl for the PeerPush page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "audience": {
                "description": "Filter by target audience (e.g. \"Developers\", \"Indie Hackers\", \"Marketers\")",
                "type": "string"
              },
              "category": {
                "description": "Filter by category name or slug (e.g. \"ai\", \"developer-tools\", \"productivity\")",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of results",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "platforms": {
                "description": "Filter by platform: Web, Api, Desktop, Mcp, Cli, Mobile",
                "items": {
                  "enum": ["Web", "Api", "Desktop", "Mcp", "Cli", "Mobile", "Ios", "Android"],
                  "type": "string"
                },
                "type": "array"
              },
              "pricingType": {
                "description": "Filter by pricing: Free, Freemium, Subscription, OneTime, Paid",
                "enum": ["Free", "Freemium", "Subscription", "OneTime", "Paid"],
                "type": "string"
              },
              "query": {
                "description": "What the user is looking for in natural language (e.g. \"email API for transactional emails\", \"project management for small teams\")",
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "description": "Sort order",
                "enum": ["relevance", "score", "newest", "trending"],
                "type": "string"
              },
              "useCase": {
                "description": "Filter by use case (e.g. \"Code Development\", \"Email Campaigns\", \"Analytics & Reporting\")",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
