        {
          "name": "peerpush_product_details",
          "title": "Product Details",
          "description": "Looks up a single product on PeerPush by name or slug. Relevant when the user asks about a specific product's pricing, features, platforms, target audience, or recent activity. Returns product data including pricing, platforms, use cases, target audiences, active discount codes, community metrics, recent development updates, and optionally alternatives. Link each product with its websiteUrl, or its peerpushUrl for the PeerPush page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "includeAlternatives": {
                "default": true,
                "description": "Include alternative products (both on PeerPush and external)",
