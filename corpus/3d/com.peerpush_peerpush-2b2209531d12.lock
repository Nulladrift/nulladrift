          },
          "digest": "sha256:f779a2d257fe0602edb170f58d2685235e1133055d38f0f39d957783620a513e"
        },
        {
          "name": "peerpush_new_launches",
          "title": "New Launches",
          "description": "Lists products recently launched on PeerPush within a chosen number of days. Relevant when the user asks about newly launched products or recent software releases. Returns the most recently published products. Link each product with its websiteUrl, or its peerpushUrl for the PeerPush page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Filter by category name or slug (e.g. \"ai\", \"developer-tools\", \"productivity\")",
                "type": "string"
              },
              "days": {
                "default": 7,
                "description": "How many days back to look (default: last 7 days)",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Number of results",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
