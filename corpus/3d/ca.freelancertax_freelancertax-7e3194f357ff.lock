{
  "lockfileVersion": 2,
  "subjects": {
    "ca.freelancertax/freelancertax": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://freelancertax.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "freelancertax",
        "title": "FreelancerTax — verified Canadian self-employed tax math",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "cpp_self_employed",
          "description": "Compute self-employed CPP contributions for a given year: base + enhanced contributions, CPP2 (second ceiling), total payable, and the tax-deduction vs tax-credit split that goes on the T1 (Schedule 8). Quebec residents pay QPP instead — use estimate_self_employed_tax with province QC for QPP.",
          "inputSchema": {
            "properties": {
              "net_self_employment_income": {
                "description": "Net self-employment income, CAD",
                "minimum": 0,
                "type": "number"
              },
              "year": {
                "enum": [2025, 2026],
                "type": "integer"
              }
            },
            "required": ["net_self_employment_income", "year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1572e0bb917f24948c87692bccbbf963b3ae4ab991c27fac16710e0026e5f054"
        },
        {
          "name": "estimate_self_employed_tax",
          "description": "Estimate a Canadian self-employed (sole proprietor) person's full tax bill: federal tax, provincial tax, CPP/QPP (incl. CPP2/QPP + QPIP for Quebec), total, after-tax income and effective rate. Fully verified provinces: ON, BC, AB, MB, SK, NS, NB, QC. Other provinces/territories return an honest federal+CPP-only partial estimate flagged supported:false.",
          "inputSchema": {
            "properties": {
              "net_self_employment_income": {
                "description": "Net self-employment income (after expenses), CAD",
                "minimum": 0,
                "type": "number"
              },
              "province": {
                "description": "Two-letter province/territory code",
                "enum": ["ON", "BC", "AB", "MB", "SK", "NS", "NB", "QC", "PE", "NL", "YT", "NT", "NU"],
                "type": "string"
              },
              "year": {
                "description": "Tax year",
                "enum": [2025, 2026],
                "type": "integer"
              }
            },
            "required": ["net_self_employment_income", "province", "year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:103f3fd136300b981efe3e69d97fe5e4054f5aed81b3e4b47cdfca1e5efc9aae"
        },
        {
          "name": "get_tax_deadlines",
          "description": "Upcoming CRA tax deadlines for Canadian freelancers / self-employed individuals (filing, payment, GST/HST, RRSP, quarterly instalments), each on its CRA effective date with the weekend next-business-day rule applied. Also available as a subscribable calendar feed.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max deadlines to return (default 10)",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5cd567d41b1b9fea4b53c050e38a6d183400b84474960ca499437b5294641726"
        },
        {
          "name": "gst_hst_registration_check",
          "description": "Check whether a Canadian small business / freelancer must register for GST/HST under the $30,000 small-supplier tests (single-quarter test and rolling four-quarter test), with the exact mechanics of when to charge and the registration deadline. Set is_rideshare true for taxi/ride-share drivers (they must register from the first fare).",
          "inputSchema": {
            "properties": {
              "is_rideshare": {
                "description": "Taxi or commercial ride-share driver",
                "type": "boolean"
              },
              "quarterly_revenues": {
                "description": "Worldwide taxable revenue per calendar quarter, oldest first (up to 8 quarters), CAD",
                "items": {
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["quarterly_revenues"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e298138d9fec2caa0e08f9019ffd3f495f32dd5992958078f88bf3082d3f39e"
        },
        {
          "name": "gst_quick_method_compare",
          "description": "Compare the GST/HST Quick Method against the regular method for a Canadian small business: eligibility (revenue ceiling + excluded professions), remittance under each method, and which one keeps more money. Annual figures.",
          "inputSchema": {
            "properties": {
              "business_type": {
                "description": "Free-text business type, e.g. 'services', 'consultant', 'retail goods', 'bookkeeper' (used for the excluded-professions test; goods vs services rate)",
                "type": "string"
              },
              "itc_eligible_expenses_incl_tax": {
                "description": "Annual ITC-eligible operating expenses INCLUDING tax, CAD (for the regular-method comparison)",
                "minimum": 0,
                "type": "number"
              },
              "province": {
                "description": "Two-letter province code of the permanent establishment (e.g. ON, BC, QC)",
                "type": "string"
              },
              "revenue": {
                "description": "Annual taxable revenue BEFORE tax, CAD",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["province", "revenue"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:93e1d640f158e91e7afbb5b4f114b76bbfb4e101b94af3de779583edee419751"
        },
        {
          "name": "instalment_plan",
          "description": "Determine whether a Canadian individual must pay quarterly income-tax instalments (the $3,000 / $1,800-Quebec net-tax-owing tests) and compute all three CRA payment options (no-calculation, prior-year, current-year) as quarterly schedules with a suggested no-interest choice. Per the CRA's instalment calculation chart, 'net tax owing' EXCLUDES CPP contributions and EI premiums payable — pass those separately as cpp_payable and they are added to the instalment amounts only (chart line 24), never to the threshold test.",
          "inputSchema": {
            "properties": {
              "cpp_payable": {
                "description": "OPTIONAL: current-year CPP contributions and EI premiums payable on self-employment income, CAD. The CRA chart excludes this from the net-tax-owing threshold test but ADDS it to the instalment amounts (chart line 24). Ignored for Quebec residents — QPP/QPIP are billed by Revenu Québec, not the CRA.",
                "minimum": 0,
                "type": "number"
              },
              "current_year_estimate": {
                "description": "Estimated NET TAX OWING for the CURRENT year, CAD — per the CRA calculation chart: income tax minus amounts withheld, EXCLUDING CPP/EI payable on self-employment income (pass those in cpp_payable, do NOT include them here)",
                "minimum": 0,
                "type": "number"
              },
              "prior_year_owing": {
                "description": "Net tax owing for the prior year, CAD (same chart basis: excludes CPP/EI payable)",
                "minimum": 0,
                "type": "number"
              },
              "quebec": {
                "description": "Quebec resident (lower federal threshold; amounts cover the FEDERAL side only — Revenu Québec runs a separate instalment system, form TP-1026)",
                "type": "boolean"
              },
              "second_prior_year_owing": {
                "description": "Net tax owing two years ago, CAD (same chart basis: excludes CPP/EI payable)",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["current_year_estimate", "prior_year_owing", "second_prior_year_owing"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e793048702d53a77cbcb2511dd6ca506c7bebcf0e1062b8f12d6447689b6cf67"
        }
      ],
      "digest": "sha256:16de4eced7a1a375a6bddc5e76a71972ce37e4703bdb393e812c0a95cd03ee58"
    }
  }
}
