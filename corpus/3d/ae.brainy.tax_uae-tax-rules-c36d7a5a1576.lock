      "serverInfo": {
        "name": "brainy-tax-uae-rules",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "uae_einvoicing_dates",
          "title": "UAE E-Invoicing Mandatory Dates",
          "description": "Compute UAE Accredited Service Provider (ASP) appointment and mandatory e-invoicing go-live dates from annual gross revenue and entity type (MD 243/2025, MD 244/2025, MD 66/2026, MD 197/2026, CD 173/2026).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annual_revenue_aed": {
                "description": "Total annual gross revenue in AED. Required unless government_entity is true, or b2c_only is true with receives_b2b set to false. Mixed and in-scope B2C-only businesses must include B2C revenue.",
                "minimum": 0,
                "type": "number"
              },
              "b2c_only": {
                "description": "True only if all sales of the business are exclusively B2C (MD 244/2025 art. 5(2)). Combine with receives_b2b to indicate whether the business receives B2B supplies.",
                "type": "boolean"
              },
              "government_entity": {
                "description": "True if the entity is a UAE Government Entity under MD 244/2025 art. 5(1)(c).",
                "type": "boolean"
              },
              "receives_b2b": {
                "description": "Optional for b2c_only businesses: true if the business buys goods or services from other businesses (receives B2B supplies); false only if it makes exclusively B2C sales and receives no B2B supplies. When omitted or true, B2C-only sellers follow the prudent in-scope path per the FTA e-invoicing FAQ (page updated 17 November 2026); MD 244/2025 art. 5(2) remains the legal text.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:21aa5efcba873e9c47fdd0a49a42be6a44cb17ce7bdc3bdb2f46c2a203c08d65"
        },
        {
          "name": "uae_einvoicing_penalty_estimate",
          "title": "UAE E-Invoicing Implementation Penalty Estimator (Annex Item 1)",
          "description": "Estimate UAE e-invoicing implementation administrative penalties under Cabinet Decision No. 173 of 2026, Annex item 1 (initial AED 5,000 plus AED 5,000 per continuing month or part-month, with AED 50,000 rolling 12-month calendar cap), returning full notices (avisos) and out-of-scope reasons (fueraDeAlcance).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "compliance_date": {
                "description": "Optional date (YYYY-MM-DD) on which compliance was achieved. Omit if non-compliance is still ongoing as of reference_date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "reference_date": {
                "description": "Optional reference date (YYYY-MM-DD) used as cut-off when compliance_date is omitted. Defaults to today UTC.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "violation_date": {
                "description": "Date (YYYY-MM-DD) of the initial e-invoicing implementation breach under Cabinet Decision No. 173 of 2026, Annex item 1.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["violation_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d3bda837c0a2111cd22d0cd6af0d2528bfe88b5a2eeb057693ab10b3d3c9d350"
        },
        {
          "name": "uae_quick_tax_estimate",
          "title": "UAE Quick Corporate Tax & VAT Threshold Estimate",
          "description": "Estimate UAE Corporate Tax (0% / 9% general bands, Qualifying Free Zone Person rates, or natural-person AED 1,000,000 business turnover threshold), potential Small Business Relief, and VAT registration status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entity_type": {
                "description": "Taxpayer profile type: standard UAE company, Qualifying Free Zone Person (qfzp), or individual conducting business (natural_person).",
                "enum": ["company", "qfzp", "natural_person"],
                "type": "string"
              },
              "non_qualifying_income_aed": {
                "description": "Taxable Income that is not Qualifying Income in AED (required when entity_type is qfzp; omit otherwise).",
                "minimum": 0,
                "type": "number"
              },
              "period_end": {
                "description": "Optional tax period end date (YYYY-MM-DD). Defaults to Dec 31 of reference_date year.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "period_start": {
                "description": "Optional tax period start date (YYYY-MM-DD). Defaults to Jan 1 of reference_date year.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "qualifying_income_aed": {
                "description": "Qualifying Income in AED (required when entity_type is qfzp; omit otherwise).",
                "minimum": 0,
                "type": "number"
              },
              "reference_date": {
                "description": "Optional reference date (YYYY-MM-DD). Defaults to today UTC.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "revenue_aed": {
                "description": "Gross revenue / business turnover in AED for the period (for natural_person, Gregorian calendar-year business turnover excluding wage, personal investment and real estate investment under CD 49/2023).",
                "minimum": 0,
                "type": "number"
              },
              "taxable_income_aed": {
                "description": "Taxable Income in AED (required when entity_type is company or natural_person; omit for qfzp).",
                "minimum": 0,
                "type": "number"
              },
              "taxable_supplies_12m_aed": {
                "description": "Optional value of taxable supplies and qualifying imports over the previous 12 months in AED, to check VAT registration thresholds.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["entity_type", "revenue_aed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:66a7eb21780e77c8bcbc24a26e3022c6f1ae0e256fe91a4a4d2cfeb24a752fe8"
        },
        {
          "name": "uae_tax_calendar",
          "title": "UAE Business Tax Calendar",
          "description": "Generate a 12-month UAE business tax calendar (Corporate Tax return and first-period waiver deadlines, VAT201 deadlines with federal weekend shifts, Small Business Relief assessment, QFZP notices and e-invoicing dates) from a minimal synthetic profile.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "annual_revenue_aed": {
                "description": "Annual gross revenue in AED for the evaluated period.",
                "minimum": 0,
                "type": "number"
              },
              "artificial_separation": {
                "description": "True if artificial separation of business activities applies under MD 73/2023.",
                "type": "boolean"
              },
              "b2c_only": {
                "description": "True only if the business engages exclusively in B2C sales.",
                "type": "boolean"
              },
              "excluded_mne_group": {
                "description": "True if member of a Multinational Enterprise Group excluded from Small Business Relief.",
                "type": "boolean"
              },
              "financial_year_end": {
                "additionalProperties": false,
                "description": "Annual financial year-end day and month (for example, { day: 31, month: 12 }).",
                "properties": {
                  "day": {
                    "description": "Financial year-end calendar day (1-31).",
                    "maximum": 31,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "month": {
                    "description": "Financial year-end calendar month (1-12).",
                    "maximum": 12,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["day", "month"],
                "type": "object"
              },
              "first_ct_period": {
                "description": "True if the entity is still in its first Corporate Tax period.",
                "type": "boolean"
              },
              "first_ct_period_end": {
                "description": "Explicit end date (YYYY-MM-DD) of the first Corporate Tax period, if known.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "government_entity": {
                "description": "True if the entity is a UAE Government Entity.",
                "type": "boolean"
              },
              "incorporation_date": {
                "description": "Optional incorporation date (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "intends_qfzp": {
                "description": "True if considering Qualifying Free Zone Person election/status.",
                "type": "boolean"
              },
              "is_qfzp": {
                "description": "True if confirmed Qualifying Free Zone Person; false if confirmed not.",
                "type": "boolean"
              },
              "prior_revenues_aed": {
                "description": "Optional gross revenues (AED) of relevant prior tax periods for Small Business Relief evaluation.",
                "items": {
                  "description": "Prior tax-period gross revenue in AED.",
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 10,
                "type": "array"
              },
              "receives_b2b": {
                "description": "Optional for b2c_only businesses: false only if the business makes exclusively B2C sales and receives no B2B supplies; true or omitted follows the prudent in-scope path per the FTA e-invoicing FAQ (updated 17 November 2026).",
                "type": "boolean"
              },
              "reference_date": {
                "description": "Optional reference date (YYYY-MM-DD) anchoring the 12-month calendar window [reference_date, +12 months). Defaults to today UTC.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "sbr_period_end": {
                "description": "Optional explicit end date (YYYY-MM-DD) of the evaluated SBR period.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "sbr_period_start": {
                "description": "Optional explicit start date (YYYY-MM-DD) of the evaluated SBR period.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "uae_resident": {
                "description": "True if UAE Resident Person for Corporate Tax; false if Non-Resident.",
                "type": "boolean"
              },
              "vat": {
                "additionalProperties": false,
                "description": "Optional UAE VAT registration schedule.",
                "properties": {
                  "period_type": {
                    "description": "FTA-assigned standard VAT return schedule (required when registered is true).",
                    "enum": ["monthly", "quarterly"],
                    "type": "string"
                  },
                  "quarter_end_months": {
                    "description": "Four distinct quarter-end months spaced 3 months apart (for example [3, 6, 9, 12]), required when period_type is quarterly.",
                    "items": {
                      "description": "Quarter-end calendar month (1-12).",
                      "maximum": 12,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "maxItems": 4,
                    "minItems": 4,
                    "type": "array"
                  },
                  "registered": {
                    "description": "True if registered for UAE VAT.",
                    "type": "boolean"
                  },
                  "start_date": {
                    "description": "Optional VAT registration effective start date (YYYY-MM-DD).",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["registered"],
                "type": "object"
              }
            },
            "required": ["annual_revenue_aed", "financial_year_end"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:faec3c4e10bc1226176c41562bb4c713ed2e7bc3b6f2af820f0bb2bf3e10da97"
        },
        {
          "name": "uae_vat_credit_expiry",
          "title": "UAE Excess VAT Credit Expiry & Transitional Window Check",
          "description": "Calculate the ordinary 5-year VAT credit deadline and the 31 December 2026 transitional refund or tax/penalty settlement window from the end dates of the original credit-generating VAT periods (no amounts accepted).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "period_closes": {
                "description": "One or more original VAT credit-generating period end dates (YYYY-MM-DD). No AED amounts are needed or accepted.",
                "items": {
                  "description": "End date (YYYY-MM-DD) of the tax period that ORIGINALLY generated the excess VAT credit (not a carry-forward period).",
                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                  "type": "string"
                },
                "maxItems": 24,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["period_closes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:415e3cb81f07e389c6afb0b4b56eccbcad96500e0b2b9e4f5eb0794cffb87d8e"
        }
      ],
      "digest": "sha256:43fddabe87307982728ec3297285d2f7301cd16b663fb8ecf71ce0c2cea68dfa"
    }
  }
}
