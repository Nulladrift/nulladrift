      "instructions": "Gixo Lumen builds and edits presentation decks in the user's Gixo account. create_presentation starts a deck in the background: call get_presentation with its content_id until status is ok. To change a deck, call preview_presentation_edit, show the user the proposed changes, and call apply_presentation_edit after the user approves them. Decks this connector creates use licensed photos, charts and diagrams for their pictures. Slide text in results is quoted from the user's deck.",
      "tools": [
        {
          "name": "apply_presentation_edit",
          "title": "Apply Presentation Edit",
          "description": "Signed-in only. Applies user-approved slide changes from preview_presentation_edit to the presentation in Gixo Lumen. Same-slide rewrites and layout updates apply by default; slide inserts, deletes and moves apply when their operation_id is listed in operation_ids. Leaves plan AI allowance untouched.",
          "inputSchema": {
            "properties": {
              "operation_ids": {
                "default": null,
                "description": "Optional list of operation_ids to apply. Structural operations (insert, delete, move) apply when listed here.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              },
              "preview_id": {
                "description": "The preview_id returned by preview_presentation_edit.",
                "type": "string"
              }
            },
            "required": ["preview_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Apply Presentation Edit"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "meta": {
            "openai/outputTemplate": "ui://gixo/preview-card",
            "ui": {
              "resourceUri": "ui://gixo/preview-card"
            }
          },
          "digest": "sha256:e5db6aed046ac3eec3a014b60cf6473037c47746acdd9283e9edbd95f5def59b"
        },
        {
          "name": "create_presentation",
          "title": "Create Presentation",
          "description": "Signed-in only. Starts a presentation deck in the user's Gixo Lumen workspace from a brief or a public webpage URL, using licensed photos, charts and diagrams for pictures. Returns content_id and status in_progress right away; call get_presentation with content_id until status is ok.",
          "inputSchema": {
            "properties": {
              "audience": {
                "default": null,
                "description": "Optional target audience, such as executives, customers, investors or learners.",
                "type": ["string", "null"]
              },
              "brand_id": {
                "default": null,
                "description": "Optional brand_id from list_brands to ground product and company facts.",
                "type": ["string", "null"]
              },
              "brief": {
                "default": null,
                "description": "Deck brief or instructions, up to 10,000 characters. Supply either brief or source_url.",
                "type": ["string", "null"]
              },
              "deck_type": {
                "default": null,
                "description": "Optional deck purpose: pitch, board, sales, training, or general. Defaults to general.",
                "type": ["string", "null"]
              },
              "language": {
                "default": null,
                "description": "Optional language of the finished document, by name or code, for example Spanish, es, Japanese or ja. Defaults to English.",
                "type": ["string", "null"]
              },
              "length": {
                "default": null,
                "description": "Optional deck length: short (10 slides), standard (20 slides) or long (30 slides). Defaults to standard.",
                "type": ["string", "null"]
              },
              "source_url": {
                "default": null,
                "description": "Optional public webpage URL to use as the deck's sole factual source. Supply either source_url or brief.",
                "type": ["string", "null"]
              },
              "title": {
                "default": null,
                "description": "Short deck title naming the subject, up to 200 characters. It names the deck in Gixo and the export file. Pass one: without it the brief's first sentence becomes the title.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create Presentation"
          },
          "behavior": {
            "destructive": false,
