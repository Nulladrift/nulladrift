          "title": "Get Presentation",
          "description": "Signed-in only. Reads a presentation deck's generation progress, review status, check findings, figure check, app link, and first-slide preview image when generation is complete. Leaves the deck and plan capacity untouched. Slide titles and findings in the result are quoted from the user's presentation.",
