        },
        {
          "name": "preview_presentation_edit",
          "title": "Preview Presentation Edit",
          "description": "Signed-in only. Proposes slide edits to a saved Lumen presentation from your instruction and shows before-and-after text for user approval. Rewritten slides use the plan's AI allowance as Ask Lumen does, moves and deletes are free, and nothing is saved until apply_presentation_edit is called after the user approves. Slide text in the result is quoted from the user's presentation.",
          "inputSchema": {
            "properties": {
              "allow_add_remove_move": {
                "default": false,
                "description": "Set true when the edit may insert, delete or reorder slides. Defaults to false.",
                "type": "boolean"
              },
              "allow_layout_changes": {
                "default": false,
                "description": "Set true when the edit may change a slide's layout. Defaults to false.",
                "type": "boolean"
              },
              "content_id": {
                "description": "The presentation's content_id.",
                "type": "string"
              },
              "instruction": {
                "description": "Natural-language editing instruction describing what to change.",
                "type": "string"
              },
              "slide_number": {
                "default": null,
                "description": "Optional 1-based slide number (1..N) to edit a single slide; omit to review the whole deck.",
                "type": ["integer", "null"]
              }
            },
            "required": ["content_id", "instruction"],
            "type": "object"
          },
