          "digest": "sha256:bb3ea7dc44a931881dc0a161f6c91d597dae7c95df48a4b9eeaf6d49120e82ad"
        },
        {
          "name": "export_presentation",
          "title": "Export Presentation",
          "description": "Signed-in only. Exports a finished presentation deck as a signed, expiring PowerPoint (pptx) or PDF (pdf) download link. Leaves the deck and plan capacity untouched.",
          "inputSchema": {
            "properties": {
              "content_id": {
                "description": "The presentation's content_id.",
                "type": "string"
              },
              "format": {
                "description": "Export file format: pptx or pdf.",
