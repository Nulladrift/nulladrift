        {
          "name": "list_my_presentations",
          "title": "List My Presentations",
          "description": "Signed-in only. Lists the signed-in user's own Lumen presentations, newest first, with content_id, status and app link. Leaves decks and plan capacity untouched. Slide titles and findings in the result are quoted from the user's presentation.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": null,
                "description": "Page size from 1 to 50. Defaults to 20.",
                "type": ["integer", "null"]
              },
              "offset": {
