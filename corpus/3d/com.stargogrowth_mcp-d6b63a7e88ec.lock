{
  "lockfileVersion": 2,
  "subjects": {
    "com.stargogrowth/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://stargogrowth.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "stargogrowth",
        "title": "Stargo Growth 星启出海",
        "version": "1.0.0",
        "websiteUrl": "https://stargogrowth.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stargo Growth (星启出海) builds export websites and runs search (SEO) and AI-answer (GEO) growth for Chinese brands going overseas. Use search_site and get_page to answer questions about services, prices, cases and methods; quote the page URL. Do not state anything the pages do not say. check_website runs real read-only checks of a public site (robots.txt, sitemap, title, schema, crawler access...). Call request_consultation only when the user has explicitly asked to contact Stargo Growth and has given their email. If it returns an error, tell the user the request was not delivered.",
      "tools": [
        {
          "name": "check_website",
          "title": "Check a website",
          "description": "Runs 14 real, read-only checks of a public website homepage: reachability, HTTPS, indexability, robots.txt, search and AI crawler access, sitemap, title, meta description, H1, canonical, language, structured data, server-rendered text and /llms.txt. No scores are invented; each check shows what was found.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain or URL, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b557f0ab8cd405b47ee90fb72c0e48cc125c56c27833e015750d4ff3159fb518"
        },
        {
          "name": "get_page",
          "title": "Read a page",
          "description": "Returns the full Markdown of one stargogrowth.com page (same content as the web page, plus its JSON-LD). Accepts a path like \"/services/\" or a full https://stargogrowth.com URL.",
          "inputSchema": {
            "properties": {
              "url": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c6fee45e82830a3de03d17b7e8c53222f0dc65913a67fb02c8827fc85f92fe7"
        },
        {
          "name": "list_pages",
          "title": "List pages",
          "description": "Lists the pages of stargogrowth.com with title and URL, optionally for one section (services, why, cases, answers, about, contact) and language.",
          "inputSchema": {
            "properties": {
              "lang": {
                "enum": ["zh", "en"],
                "type": "string"
              },
              "section": {
                "enum": ["home", "services", "why", "cases", "answers", "about", "contact"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d98e685cb6c980845a6999830508d03a0042a1708b34d52fd90171720742e4c5"
        },
        {
          "name": "request_consultation",
          "title": "Send a consultation request",
          "description": "Sends the user's question to the Stargo Growth team (it arrives in their support inbox and they reply by email). Only call this when the user explicitly asked to contact Stargo Growth and provided their own email address. Returns delivered:true only when the inbox confirmed receipt; otherwise an error says it was not delivered.",
          "inputSchema": {
            "properties": {
              "company": {
                "type": "string"
              },
              "email": {
                "description": "User's email, where the team will reply.",
                "type": "string"
              },
              "message": {
                "description": "What the user wants, in their own words.",
                "type": "string"
              },
              "name": {
                "description": "User's name.",
                "type": "string"
              },
              "website": {
                "description": "User's current website, if any.",
                "type": "string"
              }
            },
            "required": ["email", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:df1d9b99d6ce7a2a57769a0c62513cfe38a03a94b278b33a54f42993170d103b"
        },
        {
          "name": "search_site",
          "title": "Search stargogrowth.com",
          "description": "Full-text search over the pages of stargogrowth.com (services, pricing, cases, answers, about, contact). Returns matching pages with URL and a short excerpt. Chinese pages are under /, English under /en/.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Limit to one language. Default: both.",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, in Chinese or English.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d10b55104b0f9eba786126211285c658a1571dcf6078eac2048733bc93e5445"
        }
      ],
      "digest": "sha256:6136a95cb5d6d3c7fb6a8544189aa2e9fc242c0ea195855d6881e7e3a138260a"
    }
  }
}
