          "description": "List the Pokémon that most reliably beat the given Pokémon on the ladder, ranked by Smogon's checks-and-counters score. The data records one-on-one outcomes (a knockout or a forced switch), so in doubles treat it as a rough signal. Pokémon with few recorded matchups have no data.",
