              },
              "formatName": {
                "description": "Display name of the regulation",
                "type": "string"
              },
              "from": {
                "description": "First month compared, YYYY-MM",
                "type": "string"
              },
              "rising": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "accelerating": {
                      "description": "True if the rise or decline is steeper in the later half of the range",
