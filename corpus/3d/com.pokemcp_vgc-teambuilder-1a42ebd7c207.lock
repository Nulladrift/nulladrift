              "from": {
                "description": "First month, YYYY-MM. The nearest month with data is used if it has none",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "limit": {
                "description": "Maximum entries to return (1–25). Defaults to 10",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "months": {
                "description": "Months to look back from `to` when `from` is omitted. Defaults to 6",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Last month, YYYY-MM. Defaults to the most recent month",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "type": "object"
