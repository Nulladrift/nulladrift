                        "spe": {
                          "maximum": 6,
                          "minimum": -6,
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    },
                    "item": {
                      "description": "Held item, or \"none\". Defaults to the Pokémon's most used item in the regulation.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "nature": {
                      "description": "Nature, such as Adamant or Timid. If nature and statPoints are both left out, the Pokémon's most common spread in the regulation's usage statistics is used.",
                      "maxLength": 20,
                      "type": "string"
