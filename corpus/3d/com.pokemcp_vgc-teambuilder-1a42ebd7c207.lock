      "serverInfo": {
        "name": "vgc-teambuilder",
        "title": "VGC Teambuilder",
        "version": "1.0.0",
        "websiteUrl": "https://www.pokemcp.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "VGC Teambuilder provides read-only data tools for building competitive Pokémon doubles (VGC) teams under Pokémon Champions regulations: Pokémon data, move and team legality checks, defensive type analysis, usage statistics and trends, and matchup calculations (damage, Speed order, and a team checked against the most used Pokémon). Use the calculation tools instead of estimating numbers, and tell the user what a result assumed. They are single calculations, not battle simulations. Usage figures come from Pokémon Showdown ladder data that Smogon publishes monthly; percentages are shares of teams or sets, not win rates. Formats are regulation ids from list_formats; when a tool's format is omitted it uses champions-regmc. Use English Pokémon names, with alternate forms hyphenated (Landorus-Therian, Charizard-Mega-Y). This is an unofficial fan project, not affiliated with or endorsed by Nintendo, Creatures Inc., GAME FREAK inc. or The Pokémon Company.",
      "tools": [
        {
          "name": "analyze_team_types",
          "title": "Analyze a team's defensive typing",
          "description": "For a list of Pokémon, count how many are weak to, resist or are immune to each attacking type, and report shared weaknesses, types nothing on the team resists, and defensive types that would patch the most gaps. It considers typing only — not abilities, items or moves — and suggests types, not specific Pokémon. Pass a Mega form's name (e.g. \"Charizard-Mega-Y\") to analyse its post-Mega typing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "team": {
                "description": "Pokémon names on the team",
                "items": {
                  "description": "Pokémon name in English, e.g. \"Incineroar\" or \"Landorus-Therian\"",
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["team"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "matchups": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "immune": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "resist": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "type": {
                      "description": "Attacking type",
                      "type": "string"
                    },
                    "weak": {
                      "description": "Team members hit super effectively",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["immune", "resist", "type", "weak"],
                  "type": "object"
                },
                "type": "array"
              },
              "notFound": {
                "description": "Names that were not recognised and skipped",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sharedWeaknesses": {
                "description": "Attacking types that two or more members are weak to",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "suggestedTypes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "covers": {
                      "description": "Weaknesses this type resists",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "required": ["covers", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "team": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "types": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["name", "types"],
                  "type": "object"
                },
                "type": "array"
              },
              "unresisted": {
                "description": "Attacking types no member resists or is immune to",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["matchups", "notFound", "sharedWeaknesses", "suggestedTypes", "team", "unresisted"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze a team's defensive typing"
