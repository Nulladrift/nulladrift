                      "description": "True if the rise or decline is steeper in the later half of the range",
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "slopePointsPerMonth": {
                      "description": "Fitted change in usage per month, in percentage points",
