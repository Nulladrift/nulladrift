        {
          "name": "validate_team",
          "title": "Validate a team for a regulation",
          "description": "Check a team against a Pokémon Champions regulation: each Pokémon is on the regulation's allowed list, Species Clause, Item Clause, at most four moves each, moves are learnable and abilities belong to the Pokémon. A Mega Evolution named directly (e.g. \"Charizard-Mega-Y\") is checked as its base Pokémon holding its Mega Stone. It does not check stat spreads or held-item availability. Move data comes from Pokémon Showdown across all generations, not Pokémon Champions' own move lists, so a move from an older game can pass and a Champions-only move can fail.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "format": {
                "description": "Regulation id from list_formats. Defaults to \"champions-regmc\" (Pokémon Champions — Regulation M-C).",
                "enum": ["champions-regma", "champions-regmb", "champions-regmc"],
                "type": "string"
              },
              "team": {
                "description": "Team members. Only `pokemon` is required for each",
                "items": {
                  "properties": {
                    "ability": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "item": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "moves": {
                      "items": {
                        "maxLength": 60,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 8,
                      "type": "array"
                    },
