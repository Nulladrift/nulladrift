                    "slopePointsPerMonth": {
                      "description": "Fitted change in usage per month, in percentage points",
                      "type": "number"
                    },
                    "usagePercent": {
                      "description": "Usage in the last month, 0–100",
                      "type": "number"
                    }
                  },
                  "required": ["accelerating", "name", "slopePointsPerMonth", "usagePercent"],
                  "type": "object"
                },
                "type": "array"
              },
              "snapshots": {
                "description": "Monthly snapshots in the range",
                "type": "number"
              },
              "to": {
                "description": "Last month compared, YYYY-MM",
                "type": "string"
