        {
          "name": "compare_speed",
          "title": "Compare Speed and turn order",
          "description": "Work out the Speed of several Pokémon in Pokémon Champions and the order they move in, including the effect of items such as Choice Scarf, Tailwind, paralysis, stat stages, weather abilities and Trick Room. Use it to answer who outspeeds whom. Any part of a set that is left out is filled in from the regulation's usage statistics and listed under `assumptions`. Speed decides order only among moves of the same priority.",
