                      "maxLength": 40,
                      "type": "string"
                    },
                    "abilityActive": {
                      "description": "A conditional Speed ability is active, such as Unburden after its item is used. Weather abilities follow `weather` and need no flag.",
                      "type": "boolean"
                    },
                    "boosts": {
                      "additionalProperties": false,
                      "description": "Stat stages from moves and abilities, -6 to +6. For example { atk: 2 }.",
                      "properties": {
                        "atk": {
                          "maximum": 6,
                          "minimum": -6,
                          "type": "integer"
