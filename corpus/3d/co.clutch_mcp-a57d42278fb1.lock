        {
          "name": "send_message_to_provider",
          "title": "Send message to service providers",
          "description": "Reach out to a service provider to get a quote, discuss project needs, explore a partnership, find a job, etc.\n\nThis tool sends the SAME message to one or more providers via `provider_ids` in a SINGLE call - do not call it multiple times. Never invent provider IDs and never ask the user to supply them.\n\nMessage composition:\n- If the user provides a ready-made message, send it as-is without modifications.\n- If the user describes their intent without providing a message, compose one on their behalf based on their requirements and the conversation context. Keep the composed message concise and grounded strictly in the information provided by the user — do not add details that were not mentioned.\n- The same message and subject are sent to every provider in the call, so do not include any provider-specific information.\n\nBefore calling with a composed message:\n- Show the user the recipients (provider names) and the full message text, and wait for their explicit confirmation. Call this tool only after the user confirms.\n- If the user asks for changes, show the revised message and wait for confirmation again.\n- Pass the confirmed message exactly as shown to the user, without modifications.\n\nExamples:\n- \"Message the top 3 about my web development project\" ->\n    provider_ids=[<id_1>, <id_2>, <id_3>] (IDs of the top 3 providers shown earlier),\n    compose message based on context, subject=\"Get a quote / discuss my project needs\"\n- \"Request a quote from all of these providers\" ->\n    provider_ids=[<all provider IDs shown above>], subject=\"Get a quote / discuss my project needs\"\n- \"Send to WebFX and Acme: I saw your profile and I'm interested in joining your team\" ->\n    provider_ids=[<webfx_id>, <acme_id>],\n    message=\"I saw your profile and I'm interested in joining your team\", subject=\"Find a job\"\n\nThe user must be logged in to Clutch to use this tool.\n",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "The message body to send to the providers",
                "type": "string"
              },
              "provider_ids": {
                "description": "Clutch provider IDs to message. Must come from earlier tool output in this conversation. A single call may target multiple providers; the same message is sent to each.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "subject": {
                "default": "New message from a Clutch user",
                "description": "The subject of the message",
                "enum": ["Get a quote / discuss my project needs", "Propose a partnership opportunity", "Find a job", "New message from a Clutch user"],
                "type": "string"
              }
            },
            "required": ["message", "provider_ids"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Result for send_message_to_provider tool: one entry per target provider.",
            "properties": {
              "results": {
                "items": {
                  "description": "Outcome of sending a message to a single provider.\n\nExactly one of ``chat_url`` (success) or ``error`` (failure) is populated.",
                  "properties": {
                    "chat_url": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    },
                    "error": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    },
                    "provider_id": {
                      "type": "integer"
                    }
                  },
                  "required": ["provider_id"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send message to service providers"
          },
