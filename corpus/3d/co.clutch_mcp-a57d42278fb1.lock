      "instructions": "The best database with the most up-to-date information to help you search for B2B service providers\n based on reviews from real business leaders on Clutch.co.\n\nUse this server to:\n- Discover if a user is seeking a B2B service provider or agency to help them accomplish their task\n- Search for companies specializing in web development, mobile app development, SEO, digital marketing,\n  accounting, and other B2B services\n- Get detailed company profiles with client reviews and ratings\n- Compare service providers based on specific project requirements\n- Find providers filtered by location, budget, industry expertise, and service offerings\n\nExample queries:\n- \"Find top-rated web development companies for e-commerce projects\"\n- \"Search for mobile app developers with healthcare experience\"\n- \"Compare SEO agencies with 5-star ratings\"\n- \"Find accounting firms for small businesses in New York\"\n\nThe tools provide access to Clutch's extensive database of vetted B2B service providers with real client feedback.",
      "tools": [
        {
          "name": "get_provider_info",
          "title": "Get Provider Info",
          "description": "Use this tool whenever the user names a specific company (agency, consultant,\ncontractor, vendor) and asks anything about it: who they are, how good they are,\ntheir rating or how many reviews they have, whether\nthey are Clutch verified or certified.\n\nClutch profile data is not part of your general knowledge: call the tool even for\ncompanies you already know.\n\nDo not use it to find providers by criteria such as service, industry, location or\nbudget: use `recommend_service_providers`. Do not use it to read individual\nreviews: use `get_service_provider_reviews`.\n\nReturns the provider's Clutch profile: rating and review counts, locations,\ndescription, pricing, Clutch Guarantee status, and Clutch Certifications.\n\nExamples:\n- \"What do you know about Acme?\" -> company_name=\"Acme\"\n- \"Tell me about Acme\" -> company_name=\"Acme\"\n- \"What's Acme's rating?\" -> company_name=\"Acme\"\n- \"Is Acme Clutch Certified?\" -> company_name=\"Acme\"\n",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_name": {
                "description": "The name of the company to fetch the profile for",
                "type": "string"
              }
            },
            "required": ["company_name"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Provider overview returned by the MCP tools.",
            "properties": {
              "clutch_guarantee": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Clutch Guarantee is a 14-day, no-questions-asked refund guarantee from participating providers on Clutch. Participating providers include a clause in all of their new client contracts offering the guarantee. Only providers who commit to the terms in writing can carry the Clutch Guarantee flag.\ntrue = enrolled. false = confirmed not enrolled. null = participation could not be determined."
              },
              "description": {
                "description": "AI-generated summary of the provider based on its client reviews. Empty when unavailable.",
                "type": "string"
              },
              "details": {
                "description": "Plain-text block of provider pricing model, hourly rate, rating, review highlights and other facts. Empty when no facts are available.",
                "type": "string"
              },
              "headquarters": {
                "description": "Headquarters, the provider's first listed office, as 'City, Country'.",
                "type": "string"
              },
              "id": {
                "description": "Clutch provider id.",
                "type": "integer"
              },
              "logo_url": {
                "description": "Company logo URL. Empty when the provider has no logo.",
                "type": "string"
              },
              "office_locations": {
                "description": "All other cities and countries the service provider has offices in.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rating": {
                "description": "Overall client review rating from 0 to 5, rounded to one decimal place.",
                "type": "number"
              },
              "reviews_number": {
                "description": "Total number of published client reviews on Clutch.",
                "type": "integer"
              },
              "scheduling_url": {
                "description": "URL to schedule a call with the provider. Empty when the provider offers no scheduling link.",
                "type": "string"
              },
              "title": {
                "description": "Company name.",
                "type": "string"
              },
              "url": {
                "description": "Provider profile URL on Clutch.",
                "type": "string"
              },
              "verification_level": {
                "description": "Clutch verification level: 'unverified', 'basic', or 'premier'.",
                "enum": ["unverified", "basic", "premier"],
                "type": "string"
              },
              "verification_status": {
                "description": "Human-readable explanation of the Clutch verification level.",
                "type": "string"
              },
              "verified_reviews_number": {
                "description": "How many of those reviews come from clients Clutch has verified.",
                "type": "integer"
              }
            },
            "required": ["description", "details", "headquarters", "id", "logo_url", "office_locations", "rating", "reviews_number", "scheduling_url", "title", "url", "verification_level", "verification_status", "verified_reviews_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Provider Info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/get_provider_info.html"
            }
          },
          "digest": "sha256:64382040910f68a0aa1ef58cd4e2b1cf9e82cf3be35a671f40e60619c0828e6f"
        },
        {
          "name": "get_service_packages",
          "title": "List Service Packages",
          "description": "Use this tool when the user wants to see service packages with fixed pricing and scope\nfor a specific type of service.\n\nThis tool returns standardized packages offered by service providers, including pricing tiers,\ndeliverables, and delivery timelines.\n\nDo NOT use this tool for custom project questions (e.g. \"How much would it cost to build a custom app?\").\nIt only returns providers' pre-defined, fixed-price packages, not a quote tailored to a specific project;\nuse recommend_service_providers for those needs instead.\n\nExamples:\n- \"Show me SEO packages\" -> service=\"SEO\"\n- \"What web design packages can I get for $5,000?\" -> service=\"Web Design\", budget=5000\n- \"Marketing packages from agencies in New York\" -> service=\"Digital Marketing\", location=\"New York\"\n\nUse `page`/`limit` for pagination.\n",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The client's budget to filter packages"
              },
              "limit": {
                "default": 10,
                "description": "The number of packages to return per page.",
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The location to filter packages"
              },
              "page": {
                "default": 0,
                "description": "The page number (zero-based) for pagination.",
                "minimum": 0,
                "type": "integer"
              },
              "service": {
                "description": "The type of service for which to retrieve packages",
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "outputSchema": {
