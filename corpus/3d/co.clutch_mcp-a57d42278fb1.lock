        {
          "name": "recommend_service_providers",
          "title": "Recommend Service Providers",
          "description": "Use this tool when the user is looking for service providers\n(companies, agencies, consultants, contractors, vendors) and describes requirements such as\nservice type, industry, location, budget and pricing, company size, or specific focus areas (technologies/specialties).\n\nThe tool returns a ranked list of providers that best match the criteria, including basic profile info\nand review/rating signals for comparison. Use `offset`/`limit` for pagination. Only the top\n20 providers of a query are available: `offset` and `limit` that reach\npast them are trimmed, and an `offset` at or beyond that point returns no providers.\n\nExamples:\n- \"Give me top web development companies for small businesses in the healthcare industry\" ->\n    service=\"Web Development\", industry=\"Healthcare\", client_type=\"Small Business( <$10M)\"\n- \"I need to improve SEO of my online store\" -> service=\"SEO\"\n- \"I need SEO agencies that specialize in Shopify and have at least 10 reviews\" ->\n    service=\"SEO\", focus_areas=[\"Shopify\"], min_reviews=10\n        ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client_budget": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The dollar amount the user is willing to spend on the project."
              },
              "client_type": {
                "anyOf": [
                  {
                    "enum": ["Small Business( <$10M)", "Midmarket($10M - $1B)", "Enterprise( >$1B)"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The type of client the user represents (e.g., 'small business', 'enterprise'). Only set client_type if the user explicitly specifies their business type."
              },
              "company_size": {
                "anyOf": [
                  {
                    "enum": ["Freelancer", "2 - 9", "10 - 49", "50 - 249", "250 - 999", "1,000 - 9,999", "10,000+"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The size of the company the user is looking for. This parameter is not budget-dependent, only set if the user explicitly requests it."
              },
              "find_near_me": {
                "default": false,
                "description": "Takes user location into account if set to true, but that must be explicitly requested by the user. In that case the location parameter will be ignored.",
                "type": "boolean"
              },
              "focus_areas": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "hourly_rate": {
                "anyOf": [
                  {
                    "enum": ["0-25", "25-49", "50-99", "100-149", "150-199", "200-300", "300"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The service company's minimum hourly rate. This parameter is not budget-dependent, only set if the user explicitly requests it."
              },
              "industry": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The industry the user is in or the project is related to (e.g., 'Medical', 'eCommerce')."
              },
              "limit": {
                "default": 5,
                "description": "The number of providers to return.",
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "min_reviews": {
                "default": 0,
                "description": "Minimum number of reviews a provider must have to be considered. Only set min_reviews if the user explicitly requests a minimum review count.",
                "enum": [0, 1, 3, 5, 10, 15, 20],
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "The number of providers to skip (for pagination).",
                "minimum": 0,
                "type": "integer"
              },
              "service": {
                "description": "The type of service the user is looking for (e.g., 'Web Development', 'Digital Marketing').",
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "description": "Top-level response model for provider recommendation tool output.",
                    "properties": {
                      "page_url": {
                        "type": "string"
                      },
                      "providers": {
                        "items": {
                          "description": "Provider overview returned by the MCP tools.",
                          "properties": {
                            "clutch_guarantee": {
                              "anyOf": [
                                {
                                  "type": "boolean"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "default": null,
                              "description": "Clutch Guarantee is a 14-day, no-questions-asked refund guarantee from participating providers on Clutch. Participating providers include a clause in all of their new client contracts offering the guarantee. Only providers who commit to the terms in writing can carry the Clutch Guarantee flag.\ntrue = enrolled. false = confirmed not enrolled. null = participation could not be determined."
                            },
                            "description": {
                              "description": "AI-generated summary of the provider based on its client reviews. Empty when unavailable.",
                              "type": "string"
                            },
                            "details": {
                              "description": "Plain-text block of provider pricing model, hourly rate, rating, review highlights and other facts. Empty when no facts are available.",
                              "type": "string"
