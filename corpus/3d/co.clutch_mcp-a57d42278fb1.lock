        {
          "name": "get_service_provider_reviews",
          "title": "Get Service Provider's Reviews",
          "description": "Use this tool when the user asks to see client reviews for a specific service provider (company).\n\nIt returns detailed reviews that include project information, pricing, scope, client feedback, ratings,\n and more.\nOptionally filter reviews by a specific service.\n        ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_name": {
                "description": "The name of the company to get reviews for",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "The maximum number of reviews to return",
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "The number of reviews to skip for pagination",
                "minimum": 0,
                "type": "integer"
              },
              "service": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The specific service to filter reviews by"
              }
            },
            "required": ["company_name"],
            "type": "object"
          },
          "outputSchema": {
