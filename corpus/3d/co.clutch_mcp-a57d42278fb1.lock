                              "description": "All other cities and countries the service provider has offices in.",
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            },
                            "rating": {
                              "description": "Overall client review rating from 0 to 5, rounded to one decimal place.",
                              "type": "number"
                            },
                            "reviews_number": {
                              "description": "Total number of published client reviews on Clutch.",
                              "type": "integer"
                            },
                            "scheduling_url": {
                              "description": "URL to schedule a call with the provider. Empty when the provider offers no scheduling link.",
                              "type": "string"
                            },
                            "title": {
                              "description": "Company name.",
                              "type": "string"
                            },
                            "url": {
                              "description": "Provider profile URL on Clutch.",
                              "type": "string"
                            },
                            "verification_level": {
                              "description": "Clutch verification level: 'unverified', 'basic', or 'premier'.",
                              "enum": ["unverified", "basic", "premier"],
                              "type": "string"
                            },
                            "verification_status": {
                              "description": "Human-readable explanation of the Clutch verification level.",
                              "type": "string"
                            },
                            "verified_reviews_number": {
                              "description": "How many of those reviews come from clients Clutch has verified.",
                              "type": "integer"
