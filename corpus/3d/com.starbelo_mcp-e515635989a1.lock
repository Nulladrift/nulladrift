{
  "lockfileVersion": 2,
  "subjects": {
    "com.starbelo/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.starbelo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "starbelo",
        "title": "Starbelo",
        "version": "1.0.0",
        "websiteUrl": "https://starbelo.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Starbelo is a free, read-only directory of public AI creator cases, AI tools, and prompt pages. Use search_cases for a niche or platform, get_tool for one tool name, and search_prompts for a prompt page. Results are short previews. Always show the starbelo.com URL. Full prompt text is not returned.",
      "tools": [
        {
          "name": "get_tool",
          "title": "Get an AI tool",
          "description": "Look up one AI tool on Starbelo by its name. Returns a short description, category, free-plan flag, Starbelo page URL, up to 3 example cases, and sometimes an affiliate try link.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Tool name, for example \"ElevenLabs\".",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51a339a873bc8b74e5747a23016817931b9e4cdc5411f43d35a49b40a2127482"
        },
        {
          "name": "search_cases",
          "title": "Search AI money use cases",
          "description": "Search public, sourced AI creator cases by niche, platform, or tool. Returns a short title, reported result, tools used, a short why-it-works note, and the starbelo.com URL.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Niche, platform, or tool, for example \"faceless youtube\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24777365f9d99bfc8bf04a87b8ca8bbe44349a63079afe453041d9d3c73c80d1"
        },
        {
          "name": "search_prompts",
          "title": "Search AI prompts",
          "description": "Search public prompt pages. Returns the title, model, a short description, and the page URL. Does not return prompt text.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:04dffa2b9e7fed05735aa3c5fbc2f1bd448ae8718dfb4ee3662f7362facb685a"
        }
      ],
      "digest": "sha256:bf416a81a0cd6e25a926f023579690277340171ba69a4af41641e37a7e8f7f1f"
    }
  }
}
