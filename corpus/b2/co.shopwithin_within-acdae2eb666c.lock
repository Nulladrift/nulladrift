              "kind": {
                "description": "What the piece is, one of: coat-wool, coat-cotton, coat-polyester, puffer-down, jacket-wool, jacket-cotton, jacket-polyester, jacket-leather, blazer-wool, blazer-cotton, blazer-polyester, trousers-wool, trousers-cotton, trousers-polyester, dress-wool, dress-cotton, dress-silk, dress-polyester, skirt-wool, skirt-cotton, skirt-polyester, shirt-cotton, shirt-silk, shirt-polyester, tshirt-cotton, tshirt-polyester, sweater-cashmere, sweater-wool, sweater-cotton, sweater-polyester, shoes-leather, sneakers-leather, boots-leather, sneakers-textile, bag-leather, bag-textile, wallet-leather, jewellery-gold, jewellery-silver, jewellery-costume, watch-automatic, watch-gold, belt-leather, scarf-silk, scarf-wool, tie-silk, sunglasses.",
                "maxLength": 40,
                "type": "string"
              },
              "made_in": {
                "description": "Two letter country code of where it was made, e.g. IT, FR, CA, US, JP.",
                "maxLength": 2,
