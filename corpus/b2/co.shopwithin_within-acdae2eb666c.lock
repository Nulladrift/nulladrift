          "name": "piece_fit",
          "title": "How an item fits",
          "description": "How one item fits: its own measurements (the boutique's, or the designer's chart for this style), the designer's body chart, fit notes and whether it runs small or large, the model's size and height, and a line for each size in stock. Use this when someone asks what size to take, whether an item runs big or small, or whether to size up or down. Name the item by url, or by boutique_domain and id from a result; give the size the person usually wears, in any system, so the answer points at the rows that matter. The url is a shopwithin.co product page link; the tool reads within's own catalog, documented at https://shopwithin.co/agents.",
