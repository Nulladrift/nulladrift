        {
          "name": "delivered_price",
          "title": "What an item costs delivered",
          "description": "What one item on within costs delivered to a country: the item's price, the boutique's own delivery price, and an estimate of the duty, tariffs, tax and fees, added up to the landed cost at the door. The duty estimate covers the United States, the United Kingdom and Australia; Canada adds sales tax by province; for other countries it gives the item and delivery only and says what is missing. Use this when someone asks what an item really costs shipped to them, for the total with shipping and customs, or for an import duty, customs duty or landed cost calculator on one item. Name the item by its shopwithin.co link, or by boutique_domain and id. The url is a shopwithin.co product page link; the tool reads within's own catalog, documented at https://shopwithin.co/agents. It is an estimate; the carrier's bill is the final word.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "boutique_domain": {
                "description": "The item's boutique_domain from a result, with id.",
                "maxLength": 120,
                "type": "string"
              },
              "country": {
                "description": "Where it is delivered: a country name or two letter code, e.g. 'US', 'Canada', 'United Kingdom'.",
                "maxLength": 60,
                "type": "string"
              },
              "id": {
                "description": "The item's id from a result, with boutique_domain.",
                "maxLength": 80,
                "type": "string"
              },
              "kind": {
                "description": "What the item is, for the duty rate, when the answer says it is missing. One of: coat-wool, coat-cotton, coat-polyester, puffer-down, jacket-wool, jacket-cotton, jacket-polyester, jacket-leather, blazer-wool, blazer-cotton, blazer-polyester, trousers-wool, trousers-cotton, trousers-polyester, dress-wool, dress-cotton, dress-silk, dress-polyester, skirt-wool, skirt-cotton, skirt-polyester, shirt-cotton, shirt-silk, shirt-polyester, tshirt-cotton, tshirt-polyester, sweater-cashmere, sweater-wool, sweater-cotton, sweater-polyester, shoes-leather, sneakers-leather, boots-leather, sneakers-textile, bag-leather, bag-textile, wallet-leather, jewellery-gold, jewellery-silver, jewellery-costume, watch-automatic, watch-gold, belt-leather, scarf-silk, scarf-wool, tie-silk, sunglasses.",
                "maxLength": 40,
                "type": "string"
              },
              "made_in": {
                "description": "Where the item was made, as a country name or two letter code (e.g. 'IT'), when the answer says it is missing. It is on the item's label or in its description.",
                "maxLength": 60,
                "type": "string"
              },
              "region": {
                "description": "The province or state: a Canadian province by name or code ('ON', 'Quebec'), a US state by its two letter code ('NY'). Canada needs it for sales tax; some delivery prices differ by province or state.",
                "maxLength": 40,
                "type": "string"
