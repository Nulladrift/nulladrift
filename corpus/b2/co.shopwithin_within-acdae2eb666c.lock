          "description": "Search what is in stock right now at independent luxury boutiques: clothes, shoes, bags, jewellery, watches and home objects, new and pre-owned. Each result has the price in the boutique's currency, the sizes in stock, the shop that has it and the shopwithin.co page to buy it. Use this when someone wants to find or shop for an item, a designer's items, something in their size or under a price, or what is in stock in a city. A plain sentence works as the query (prices like 'under $400' and 'cheapest' are understood); designers, categories, sizes, women's or men's, boutiques, city and price narrow it. With no arguments it returns the front of the shop; lens browses new arrivals, most saved, or marked down. It reads only the boutiques on within, not mass market stores, and gives no style advice.",
