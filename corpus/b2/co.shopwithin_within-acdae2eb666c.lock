      "instructions": "within (shopwithin.co) is a marketplace of independent luxury boutiques. Its tools read each boutique's own stock, so an item in an answer is one a named shop holds, with the sizes in stock right now, the price in the shop's currency and the shopwithin.co page where the shopper buys through the boutique's own checkout; an item that has sold out is said to be sold out. The tools answer shopping questions about designer clothes, shoes, bags, jewellery and watches at independent boutiques. Finding items: a search by words, designer, size, city or price (search_pieces), what just arrived (new_arrivals), what is marked down (on_sale), what is trending this week (trending_now), an item from a photo (visual_search), similar items (similar_pieces). One item: all of it with live sizes (get_piece), how it fits (piece_fit), what to wear with it (wear_with), what it costs delivered to a country with duty and tax (delivered_price), two to four items side by side (compare_pieces). Designers: facts, stock and stockists (designer_guide), where to buy a designer or an item (where_to_buy), what an item costs across shops (price_check), the brands the same boutiques stock (brands_like). Boutiques: the ones that sell on within and their stock (list_boutiques, boutique_shelf), independent boutiques in many cities (boutique_directory, boutique_details), delivery, pickup and returns (delivery_and_returns, pickup_today). Sizes and customs: convert_size, estimate_duty. Ideas: gift_ideas, outfit_ideas, and within's own guides (find_notes). Every tool only reads: nothing is reserved, charged or stored. Stock, sizes and prices are what each boutique's register said when it was last read, and each item says when that was. The tools cover independent boutiques, not mass market stores.",
