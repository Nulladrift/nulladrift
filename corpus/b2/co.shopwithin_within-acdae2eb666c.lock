        {
          "name": "estimate_duty",
          "title": "Estimate import duty and tax",
          "description": "Work out what clothing, shoes, a bag, jewellery, a watch or an accessory costs at the door when it is shipped to the US, Canada, the UK or Australia: the duty, any extra tariff on the country it was made in, the tax, the government and carrier fees, and the total. Every line names its official source and the day it was read, and the answer links the page on shopwithin.co/duty-calculator that shows it. Use this when someone asks about customs, duty, tariffs or import tax on an order from another country, or wants an import duty calculator. It is an estimate; the carrier's bill is the final word.",
