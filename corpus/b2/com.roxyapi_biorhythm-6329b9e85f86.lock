                  "required": ["advisory", "cycle", "date", "direction", "period", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "doubleCriticalDays": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "endDate": {
                "type": "string"
              },
              "startDate": {
                "type": "string"
              },
              "totalCriticalDays": {
                "type": "number"
              },
              "tripleCriticalDay": {
                "type": ["string", "null"]
              }
            },
            "required": ["birthDate", "criticalDays", "doubleCriticalDays", "endDate", "startDate", "totalCriticalDays", "tripleCriticalDay"],
            "type": "object"
