        {
          "name": "post_biorhythm_compatibility",
          "title": "Calculate compatibility - Biorhythm alignment between two people",
          "description": "Calculate biorhythm compatibility between two people by overlaying their cycle profiles on a target date. Returns per-cycle alignment scores (0-100) for physical, emotional, and intellectual cycles, an overall compatibility score, relationship rating, strengths, challenges, practical advice, and a daily sync snapshot showing the absolute difference in each primary cycle. Perfect for dating apps, relationship platforms, team-building tools, and couples coaching applications.",
          "inputSchema": {
            "examples": [
              {
                "person1": {
                  "birthDate": "1990-07-15"
                },
                "person2": {
                  "birthDate": "1992-03-22"
                }
              }
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "person1": {
                "properties": {
                  "birthDate": {
                    "description": "Birth date of person 1 in YYYY-MM-DD format.",
                    "example": "1990-07-15",
                    "format": "date",
                    "type": "string"
                  }
                },
                "required": ["birthDate"],
                "type": "object"
              },
              "person2": {
                "properties": {
                  "birthDate": {
                    "description": "Birth date of person 2 in YYYY-MM-DD format.",
                    "example": "1992-03-22",
                    "format": "date",
                    "type": "string"
                  }
                },
                "required": ["birthDate"],
                "type": "object"
