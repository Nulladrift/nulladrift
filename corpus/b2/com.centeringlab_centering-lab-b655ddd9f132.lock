      "instructions": "Centering Lab is free. Known numeric ratios + \"is it PSA 10?\" or ceiling → MUST use grade_centering, not manual calculation from get_centering_standards. Thresholds/tolerance/sources only → get_centering_standards. Unknown ratio face OR axis → ask BEFORE any tool call, never assume front/LR. Photo → ask front/back, then measure_card_centering with one actual user URL or exact COMPLETE bytes. Never invent URLs, edit/decode/repair/shorten base64; pass prefix and whitespace verbatim. Unforwardable attachment → https://centeringlab.com/. standard includes Japanese Pokémon; small is 59×86 mm (Yu-Gi-Oh!). Sleeves/toploaders, tilted or borderless → retake/back/manual site first. needs-review/failed: no usable ceiling. Report incomplete and approximate/interpreted sources. This is a ceiling from centering alone, not a prediction of the final grade. TAG excluded, never substitute PSA unless requested; SGC back has no table/ceiling. Respect Retry-After, no parallel retries. API photos in server memory; site photos local.",
      "tools": [
        {
          "name": "get_centering_standards",
          "title": "Card centering standards and sources",
          "description": "USE ONLY for questions about published THRESHOLDS, tolerance, rules or SOURCES without grading the user's supplied numeric ratios. For PSA 10 compatibility with supplied ratios use grade_centering instead; it applies rounding and house-specific rules. If face/axis is unknown, ask first without any call. Example: {\"house\":\"BGS\",\"face\":\"back\"}; fields optional, {} returns all. Houses PSA/BGS/CGC/SGC (case accepted), TAG excluded: explain proprietary assessment; never substitute another house. Face front/back in English; case/spaces accepted, reverse/obverse and translations rejected. SGC back has empty bands, no published table or ceiling; never invent one. Returns official/interpreted/approximate status, sources and verification. Not a final-grade prediction.",
