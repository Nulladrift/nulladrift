{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.iknowthepilot/flight-deals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://iknowthepilot.com.au/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "I Know The Pilot",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Find curated cheap flight deals from Australia. Use search_deals to find deals by destination, list_top_deals_from to see the cheapest deals from a specific airport, or get_deal for full deal details. For cheapest cached fares by date (not curated deals), use get_cheapest_flight_dates when the origin is known, or find_cheapest_flights_to to compare origins.",
      "tools": [
        {
          "name": "find_cheapest_flights_to",
          "title": "Find Cheapest Flights To Destination",
          "description": "When the user hasn't said where they're flying from, compare the cheapest fare to a destination from every origin airport with cached data. Prices are cached fares in AUD from I Want That Flight (I Know The Pilot's sister flight-search site) - refreshed regularly and indicative, not live availability. Always present the travel dates alongside prices. Use this for 'cheapest flights to Bali next month' queries; use get_cheapest_flight_dates when the origin is known.",
          "inputSchema": {
            "properties": {
              "cabin_class": {
                "default": "economy",
                "description": "Cabin class",
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "depart_date_from": {
                "description": "Start of the departure window (YYYY-MM-DD)",
                "type": "string"
              },
              "depart_date_to": {
                "description": "End of the departure window (YYYY-MM-DD)",
                "type": "string"
              },
              "destination": {
                "description": "Destination airport code, city name, or country name (e.g. 'DPS', 'Bali', 'Japan')",
                "type": "string"
              },
              "round_trip": {
                "default": true,
                "description": "True for return fares (default), false for one-way",
                "type": "boolean"
              }
            },
            "required": ["depart_date_from", "depart_date_to", "destination"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "currency": {
                "description": "Currency code (always AUD)",
                "type": "string"
              },
              "destination_airports": {
                "description": "Airport codes the destination resolved to",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "message": {
                "description": "Optional message about the results",
                "type": "string"
              },
              "origin": {
                "description": "Origin airport code (present when an origin was specified)",
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "airlines": {
                      "description": "Airline code(s) for the itinerary",
                      "type": "string"
                    },
                    "depart_date": {
                      "description": "Departure date (YYYY-MM-DD)",
                      "type": "string"
                    },
                    "destination": {
                      "description": "Destination airport code",
                      "type": "string"
                    },
                    "origin": {
                      "description": "Origin airport code",
                      "type": "string"
                    },
                    "price": {
                      "description": "Cheapest price in AUD",
                      "type": "integer"
                    },
                    "return_date": {
                      "description": "Return date (YYYY-MM-DD); omitted for one-way",
                      "type": "string"
                    },
                    "route_url": {
                      "description": "I Want That Flight route page to view and book this route",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Number of results returned",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:820a8004502dae4aec06dc51aa3d6c12e166f7f782af14718f0cce793ee98d0a"
        },
        {
          "name": "get_cheapest_flight_dates",
          "title": "Get Cheapest Flight Dates",
          "description": "For a known origin and destination, get the cheapest fare for each departure date in a date window. Prices are cached fares in AUD from I Want That Flight (I Know The Pilot's sister flight-search site) - refreshed regularly and indicative, not live availability. Always present the travel dates alongside prices. Use this for 'cheapest flights from Sydney to Bali in September' queries; use search_deals for curated editorial deals.",
          "inputSchema": {
            "properties": {
              "cabin_class": {
                "default": "economy",
                "description": "Cabin class",
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "depart_date_from": {
                "description": "Start of the departure window (YYYY-MM-DD)",
                "type": "string"
              },
              "depart_date_to": {
                "description": "End of the departure window (YYYY-MM-DD)",
                "type": "string"
              },
              "destination": {
                "description": "Destination airport code, city name, or country name (e.g. 'DPS', 'Bali', 'Japan')",
                "type": "string"
              },
              "origin": {
                "description": "3-letter IATA origin airport code (e.g. 'SYD', 'MEL')",
                "type": "string"
              },
              "round_trip": {
                "default": true,
                "description": "True for return fares (default), false for one-way",
                "type": "boolean"
              }
            },
            "required": ["depart_date_from", "depart_date_to", "destination", "origin"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "currency": {
                "description": "Currency code (always AUD)",
                "type": "string"
              },
              "destination_airports": {
                "description": "Airport codes the destination resolved to",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "message": {
                "description": "Optional message about the results",
                "type": "string"
              },
              "origin": {
                "description": "Origin airport code (present when an origin was specified)",
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "airlines": {
                      "description": "Airline code(s) for the itinerary",
                      "type": "string"
                    },
                    "depart_date": {
                      "description": "Departure date (YYYY-MM-DD)",
                      "type": "string"
                    },
                    "destination": {
                      "description": "Destination airport code",
                      "type": "string"
                    },
                    "origin": {
                      "description": "Origin airport code",
                      "type": "string"
                    },
                    "price": {
                      "description": "Cheapest price in AUD",
                      "type": "integer"
                    },
                    "return_date": {
                      "description": "Return date (YYYY-MM-DD); omitted for one-way",
                      "type": "string"
                    },
                    "route_url": {
                      "description": "I Want That Flight route page to view and book this route",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Number of results returned",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32f91563ea874401f587b607fa1a4d32a2dcec325ebed059559b5dd1f3b599cd"
        },
        {
          "name": "get_deal",
          "title": "Get Deal Details",
          "description": "Get full details for a specific flight deal including routes and airlines.",
          "inputSchema": {
            "properties": {
              "deal_id": {
                "description": "The deal ID",
