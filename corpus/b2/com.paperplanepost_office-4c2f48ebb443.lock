      "tools": [
        {
          "name": "show_postcard",
          "title": "Postcard Maker",
          "description": "Display the Finish your postcard button for an existing unpaid draft URL returned by start_postcard, including after the Claude skill's file-transfer helper. Does not create a draft, read its contents, charge, or mail anything. Only use the exact returned URL; never invent one. This cannot look up orders or delivery status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The link the person opens to finish and pay for the postcard.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://paper-plane-post/handoff-v1.html"
            },
            "ui/resourceUri": "ui://paper-plane-post/handoff-v1.html"
          },
          "digest": "sha256:f2a8c63e6463ab2f97d33e09731168e7636d3e9c35010af24f0b33c9da8e7970"
        },
        {
          "name": "start_postcard",
          "title": "Postcard Maker",
          "description": "Start a Paper Plane Post postcard: a photo printed on a 4×6 card, with an optional illustrated version of it, mailed first class for $7 with postage included. Mails from the US to 194 countries; the address country is an ISO 3166-1 alpha-2 code. Use photo for an uploaded or ChatGPT-generated image. Other clients can send photo_base64 encoded from the file itself, or photo_url if the image is already online. If no image is available, ask for an uploaded photo or public image URL. Do not call this tool or invent image data. Set is_ai_generated to true for an image you generated or know was AI-generated; its illustration is made only if the person selects Illustrated on the website. Include the note and recipient address if the person has supplied them. If either is missing, start the postcard immediately without asking for it; the person can complete it on the website. Returns a link for the person to open: they see their photo on the card, finish the note and address, can choose the illustrated version, and pay on the website. Nothing is charged or mailed until they do. Never ask for payment details. The link expires after about a week. This tool only starts postcards. It cannot retrieve orders or delivery status; explain that limitation for lookup requests instead of calling it. On a busy day the tool may first answer with a short challenge of four questions to solve and send back in the challenge argument; the proof-of-work question needs a code tool.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "challenge": {
                "description": "Only after this tool answered with a challenge: its id, and your answers to its four questions in the order they were asked, each as a short string. Solve the proof-of-work question with a code tool; it needs a few million SHA-256 hashes. Send the rest of the arguments again unchanged.",
                "properties": {
                  "answers": {
                    "items": {
                      "anyOf": [
                        {
                          "maxLength": 200,
                          "type": "string"
                        },
                        {
                          "type": "number"
                        }
                      ]
                    },
                    "maxItems": 4,
                    "type": "array"
                  },
                  "id": {
                    "maxLength": 4096,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["answers", "id"],
                "type": "object"
              },
              "is_ai_generated": {
                "description": "Set true when the supplied image was already AI-generated. The website keeps the original and only generates an illustrated version if the person selects Illustrated.",
                "type": "boolean"
              },
              "note": {
                "description": "The note for the back of the card, if the person told you what to say. Up to 350 characters.",
                "type": "string"
              },
              "photo": {
                "description": "The uploaded photo or image created in this conversation. Use the actual file supplied by ChatGPT.",
                "properties": {
                  "download_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "file_id": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "photo_base64": {
                "description": "For clients without native file transfer: the photo file's own bytes as base64 or a data: URL, read and encoded with a file or code tool. JPEG, PNG, WebP or HEIC, up to about 10 MB. Never invent base64 from memory or from looking at an image.",
                "type": "string"
              },
              "photo_url": {
                "description": "A public https:// URL of the photo. Use this only when the photo is already online and you don't have the file.",
                "format": "uri",
                "type": "string"
              },
              "recipient": {
                "description": "Whatever you know of the recipient's mailing address. The person completes and checks it before paying.",
                "properties": {
                  "city": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "country": {
                    "enum": ["US", "AL", "DZ", "AD", "AO", "AI", "AG", "AR", "AW", "AU", "AT", "AZ", "BS", "BH", "BD", "BB", "BE", "BZ", "BJ", "BO", "BA", "BW", "BR", "VG", "BN", "BG", "BF", "BI", "KH", "CM", "CA", "CV", "BQ", "KY", "TD", "CL", "CN", "CO", "KM", "CD", "CK", "CR", "HR", "CW", "CY", "CZ", "CI", "DK", "DJ", "DM", "DO", "EC", "EG", "SV", "GQ", "EE", "SZ", "ET", "FK", "FO", "FJ", "FI", "FR", "GA", "GM", "GE", "DE", "GH", "GI", "GR", "GL", "GD", "GT", "GN", "GW", "GY", "HN", "HK", "HU", "IS", "IN", "ID", "IQ", "IE", "IL", "IT", "JM", "JP", "JO", "KZ", "KE", "KW", "KG", "LA", "LV", "LB", "LS", "LR", "LY", "LI", "LT", "LU", "MO", "MG", "MW", "MY", "MV", "ML", "MT", "MR", "MU", "MX", "MD", "MC", "MN", "ME", "MS", "MA", "MZ", "MM", "NA", "NR", "NP", "NL", "NZ", "NI", "NE", "NG", "NU", "NF", "MK", "NO", "OM", "PK", "PA", "PG", "PY", "PE", "PH", "PN", "PL", "PT", "QA", "RO", "RW", "SH", "KN", "LC", "VC", "WS", "SM", "SA", "SN", "RS", "SL", "SG", "SX", "SK", "SI", "SB", "ZA", "KR", "ES", "LK", "SR", "SE", "CH", "ST", "TW", "TJ", "TZ", "TH", "TL", "TG", "TK", "TO", "TT", "TN", "TC", "TV", "TR", "UG", "UA", "AE", "GB", "UY", "UZ", "VU", "VA", "VE", "VN", "EH", "ZM", "ZW"],
                    "type": "string"
                  },
                  "line1": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "line2": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "state": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "zip": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "url": {
