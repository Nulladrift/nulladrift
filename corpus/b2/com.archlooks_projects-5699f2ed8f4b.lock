{
  "lockfileVersion": 2,
  "subjects": {
    "com.archlooks/projects": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://archlooks.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "archlooks.com",
        "title": "archlooks — interior & architecture gallery, x402-gated project pages",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "archlooks gallery of interior and architecture projects. search_projects and get_project_card are free. access_project requires x402 payment ($0.01): call it once to get the offer, pay on Base/Solana/Tron, then retry with the payment field.",
      "tools": [
        {
          "name": "access_project",
          "title": "Access project page (x402 paid)",
          "description": "x402-gated project page access, $0.01. Call without `payment` to get the offer (accepts: Base USDC via EIP-3009 gasless, or legacy on-chain USDC/USDT/PYUSD on Solana/Tron/EVM). Then retry with payment.payload (base64 PaymentPayload) or payment.tx_hash + payment.network. Returns access_token + canonical URL.",
          "inputSchema": {
            "properties": {
              "payment": {
                "description": "Payment proof from the offer",
                "properties": {
                  "network": {
                    "description": "base|ethereum|arbitrum|solana|tron",
                    "type": "string"
                  },
                  "payload": {
                    "description": "base64 x402 PaymentPayload (EIP-3009, eip155:8453)",
                    "type": "string"
                  },
                  "tx_hash": {
                    "description": "on-chain tx hash (legacy transfer)",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "project_id": {
                "description": "Numeric project id",
                "pattern": "^[0-9]+$",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0e8373dab2261f293c5f3c25795218e0cec3a277f0e9ee0071df342c83fce14d"
        },
        {
          "name": "get_project_card",
          "title": "Get project metadata",
          "description": "Public metadata card for one project: title, designer, location, type, preview image, canonical URL, license note. Same payload as GET /x402/card/{id}.json.",
          "inputSchema": {
            "properties": {
              "project_id": {
                "description": "Numeric project id",
                "pattern": "^[0-9]+$",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5d5524347dd6dbf2f18c510adf44185f3c1427caa42d291d9615a5eba3e16784"
        },
        {
          "name": "search_projects",
          "title": "Search architecture projects",
          "description": "Full-text search over the archlooks gallery (title, designer, city, country, category). Returns project ids — follow up with get_project_card for metadata or access_project (paid).",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results, 1-25 (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search text, e.g. \"hotel lobby\" or designer name",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dee5ff565e9cd4ee13a310bbce504a4978d2293417823f0eed9c7f33007fa8bb"
        }
      ],
      "resources": [
        {
