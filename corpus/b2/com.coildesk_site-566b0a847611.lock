          },
          "digest": "sha256:08bcefe07c646d76868ba7edfc2093bdb860ee71f7e14be7ea35386f551d8d38"
        },
        {
          "name": "dataset_top",
          "title": "Rank rows by a numeric column",
          "description": "The highest (or lowest) rows of the CoilDesk dataset by a numeric column — \"which is the most/least X\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ascending": {
                "description": "true for the lowest first; default highest first",
                "type": "boolean"
              },
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "limit": {
