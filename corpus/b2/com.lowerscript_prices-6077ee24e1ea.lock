      "serverInfo": {
        "name": "lowerscript-prices",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "compare_canada",
          "title": "Compare Canadian and U.S. prices",
          "description": "Use this when someone asks about buying prescription medicine from Canada, Canadian pharmacy prices versus U.S. prices, or what the new U.S. Customs mail-import date, January 20, 2027, means for a Canadian mail-order refill. Give 1 to 5 medicine names (brand or generic, English or Spanish, any capitalization) from LowerScript's list of medicines people buy from Canada plus the caller's 5-digit ZIP in a state LowerScript serves (FL, TX, AZ, NC, SC, GA, IL, CA). For each medicine it returns the Canadian last-listed price exactly as captured (price, pack, strength, origin, source pharmacy, capture date; shipping not included), today's lowest LowerScript cash price near the ZIP for the brand and the generic when the exact same strength and quantity is priced (pharmacy and as-of date), a verdict (lower_here, lower_canada, same, compare_packs or no_price) computed only on exact matches and never scaled across strengths or packs, whether the medicine is on the Medicare-negotiated list, and links to the state's Canada page, the medicine's brand page (Florida example) and the price check. Names not on the list come back in not_found with a pointer to the price check. One internal price lookup per call. Cost information only: it refuses clinical questions (dose, safety, interactions, starting or stopping a medicine). LowerScript is a prescription discount program, not insurance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "drugs": {
                "description": "1 to 5 medicine names, brand or generic (e.g. \"Eliquis\", \"apixaban\", \"Januvia\"). Matching is case- and accent-insensitive against the Canada comparison list.",
                "items": {
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "description": "Response language. Defaults to English.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code in FL, TX, AZ, NC, SC, GA, IL or CA. Used to find today's LowerScript prices nearby and to link the right state page.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["drugs", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare Canadian and U.S. prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e45d725ffdc56b5c9ad794150633c68427ac8817b8adfd3c0fc2b0e02a29e071"
        },
        {
          "name": "find_drug",
          "title": "Find a drug",
          "description": "Resolve free-text drug wording (brand or generic, English or Spanish) to the canonical LowerScript/RxSense drug: its known dosage forms, strengths, and a typical fill quantity. Cost/availability lookup only — never a substitute drug, never a dose recommendation, never priced (use get_prices for a price). Returns a \"try another name\" message when nothing matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Response language. Defaults to English.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "query": {
                "description": "Drug name in English or Spanish, brand or generic (e.g. \"metformin\", \"Ozempic\", \"amoxicilina\").",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a drug"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ffee5d0cea9c8c5b801436619a0147d65cf0cc2bad61bee80d141a4992a48a2d"
        },
        {
          "name": "get_card",
          "title": "Get the LowerScript card",
          "description": "The static LowerScript discount card: RxBIN/RxPCN/RxGRP codes, how to use it at the pharmacy counter, wallet-pass and card-page links, member support, and the exact compliance wording (not insurance, up to 80%). No lookup involved — always the same answer for a given language.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Card language / RxGRP network. Defaults to English.",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the LowerScript card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d517f8f1c59d3e0f582674434bdb5e0384d3a9a0dd745cbc4ab164d3122a2214"
        },
        {
          "name": "get_prices",
          "title": "Get pharmacy prices",
          "description": "Live cash prices for one drug at nearby pharmacies (up to 10, cheapest first, full spread shown — not just the lowest), using the LowerScript discount network (RxSense). Carries the LowerScript card codes, a wallet-pass link, and the lowerscript.com page for the same answer. One drug per call — no bulk lookups. Requires a 5-digit US ZIP in a state LowerScript currently serves (FL, TX, AZ, NC, SC, GA, IL, CA); city/state alone is not yet supported. Cost and pharmacy information only — refuses any clinical question (dose, safety, interactions, pregnancy, starting or stopping a medicine) with no price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Optional city name, for context only. Does not replace zip — a price lookup still needs a 5-digit ZIP.",
                "type": "string"
              },
              "drug": {
                "description": "Drug name, English or Spanish, brand or generic.",
                "minLength": 2,
                "type": "string"
              },
              "form": {
                "description": "Optional dosage form, e.g. \"tablet\", \"capsule\", \"pen\", \"inhaler\".",
                "type": "string"
              },
              "language": {
                "description": "Response language. Defaults to English.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "quantity": {
                "description": "Optional fill quantity. Defaults to a typical fill size for the drug's own form (e.g. 30 tablets; 1 pen/inhaler).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "state": {
                "description": "Optional 2-letter US state, for context only. Does not replace zip.",
                "type": "string"
              },
              "strength": {
                "description": "Optional strength, e.g. \"500 mg\".",
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code. Required for a price — city/state alone cannot be geocoded by this tool yet.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["drug", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get pharmacy prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eec8693e069496f15bded36321262b27287726c5f1256946e450d792d1a65a55"
        }
      ],
