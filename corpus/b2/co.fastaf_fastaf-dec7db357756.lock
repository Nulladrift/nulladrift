              },
              "currency": {
                "description": "Three-letter uppercase currency code for prices, e.g. \"EUR\"; omitted uses source default. No option surcharge; 5 credits per successful request.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "departure_id": {
                "description": "Required three-letter uppercase IATA departure airport code, e.g. \"JFK\"; no default. No option surcharge; 5 credits per successful request.",
