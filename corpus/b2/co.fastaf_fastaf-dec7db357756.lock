                "description": "Two-letter country code that localizes results, e.g. \"it\" for Italy or \"gb\" for the United Kingdom. Omit for the source default, us.",
                "enum": ["au", "br", "ca", "de", "es", "fr", "gb", "in", "it", "jp", "mx", "nl", "us"],
                "type": "string"
              },
              "language": {
                "description": "Two-letter language code for the results, e.g. \"en\" or \"it\". Omit for the source default, en.",
