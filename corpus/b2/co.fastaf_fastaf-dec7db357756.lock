          "title": "Google Search",
          "description": "Searches Google web results and returns up to 20 organic results (title, url, snippet, position) for a query, localized by country and language; page gives later results. Use it to find pages and sources. It does not return page contents (use scrape_url on a result url), ads or other result blocks, and is not for news, products or local places (use search_news, google_shopping_prices or google_maps_places). A search with no matches is charged; errors are not. Required: query.",
