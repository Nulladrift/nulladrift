          "description": "Searches Google Flights for itineraries and current fares between two airports given as IATA codes, and returns the source JSON (best_flights and other flights with price, legs and airports). Set type \"2\" for one way, or \"1\" for a round trip with return_date. It does not book tickets and does not cover hotels, trains or car hire. A search with no matches is charged; errors are not. Required: departure_id, arrival_id, outbound_date.",
