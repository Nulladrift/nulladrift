                "type": "string"
              },
              "gl": {
                "description": "Two-letter country code that localizes fares, e.g. \"us\" or \"it\"; omitted uses source default. No option surcharge; 5 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "hl": {
                "description": "Interface language code, e.g. \"en\" or \"it\"; omitted uses source default. No option surcharge; 5 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "outbound_date": {
                "description": "Required outbound date in YYYY-MM-DD format, e.g. \"2027-01-15\"; no default. No option surcharge; 5 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "return_date": {
                "description": "Return date in YYYY-MM-DD format, on or after outbound_date, e.g. \"2027-01-22\"; for round trips (type \"1\"); optional. No option surcharge; 5 credits per successful request.",
