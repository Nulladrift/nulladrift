        {
          "name": "read_reddit",
          "title": "Read Reddit Feed",
          "description": "Reads a public Reddit subreddit or thread through its public RSS feed and returns markdown (titles, dates, links, post text), capped at 12,000 characters. Author usernames and links to user profiles are removed, and the feed can hold fewer posts or comments than the website. It does not read user pages, and is not for other sites (use scrape_url). Required: url.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Required public reddit.com subreddit or thread URL, e.g. https://www.reddit.com/r/python/ or https://www.reddit.com/r/python/comments/abc123/; no default. Reads the public RSS feed only; user pages are refused. No option surcharge; 1 credits per successful request.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read Reddit Feed"
          },
          "behavior": {
