      },
      "transport": {
        "type": "http",
        "url": "https://api.fastaf.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "FastAF",
        "version": "1.3.0"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "FastAF tools fetch live web data: pages as markdown, structured JSON extraction with a JSON Schema (extract), Google search, Maps, news, shopping, Amazon, Walmart, eBay, Zillow, jobs, scholar, YouTube, LinkedIn and X. Email-verified accounts get 500 free credits every month (reset on the 1st, UTC; unused free credits do not carry over), shared across REST, MCP and all keys and spent before prepaid credits at the normal per-call price. Calls report credits_used and credits_remaining (free plus paid); a failed call uses no credits. A verification, empty or incomplete page is never charged: scrape_url then says so. An empty or incomplete page built in the browser can be retried with render_js=true (5 credits); a verification page means the site refuses automated access, so do not retry it. Use search_ebay and search_zillow for those sites, and give google_maps_places a location (or name the place in the query). No key yet? Create an account at https://fastaf.co/signup. Existing keys can still top up with POST /x402/topup or POST /v1/checkout. Initialize and discovery are public. Tool calls need Authorization: Bearer <key-or-OAuth-token> or x-api-key: <key>. Unauthenticated tool calls return HTTP 401 with OAuth protected-resource metadata so clients can start OAuth. To pay per call in USDC without one, use the REST mirror GET https://api.fastaf.co/x402/v1/{endpoint} over x402. Docs: https://fastaf.co/llms.txt",
      "tools": [
        {
          "name": "amazon_product",
          "title": "Amazon Product",
          "description": "Looks up Amazon products. With asin it returns one product (asin, title, brand, price, availability, rating, reviews_count, url, image); with query, up to 20 results from the first search page (title, url, asin, price, rating, reviews_count, position). Send asin or query, not both; marketplace selects the Amazon site (default com). It does not return reviews, offers, bestseller lists or price history, nor prices from other merchants (use google_shopping_prices). A search with no matches is charged; errors are not. Required: asin or query.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "Amazon product ID (ASIN), exactly 10 letters or digits, e.g. \"B00CH9QWOU\", for one product. Send asin or query, not both.",
                "pattern": "^[A-Za-z0-9]{10}$",
                "type": "string"
              },
              "marketplace": {
                "description": "Amazon site as its domain suffix, e.g. \"com\" for amazon.com, \"co.uk\" or \"it\". Omit for com.",
                "enum": ["ae", "ca", "co.jp", "co.uk", "com", "com.au", "com.be", "com.br", "com.mx", "com.tr", "de", "eg", "es", "fr", "in", "it", "nl", "pl", "sa", "se", "sg"],
                "type": "string"
              },
              "query": {
                "description": "Product search text, 1-500 characters, e.g. \"espresso machine\". Send query or asin, not both.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "results": {
                "default": 10,
                "description": "Maximum search results returned for query, integer 1-20, default 10, e.g. 5. Not used with asin.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Amazon Product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:59edba45a38d0dd4bef115189e3d5de9b6d0b4395cfd0d9618317ffb6fced5bb"
        },
        {
          "name": "bing_search",
          "title": "Bing Search",
          "description": "Searches Bing web results and returns up to 20 ranked results (title, link, snippet, rank), with market (mkt or cc), safe search and coordinate (lat, lon) targeting. Use it when Bing results are wanted. It does not return page contents (use scrape_url) and does not return Google results (use google_search). A search with no matches is charged; errors are not. Required: query.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cc": {
                "description": "Two-letter country code, e.g. \"us\" or \"it\"; omit for source default, mutually exclusive with mkt. No option surcharge; 5 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "count": {
                "description": "Requested result count, integer 1-50, e.g. 20; actual count varies, omitted uses source default. No option surcharge; 5 credits per successful request.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "filters": {
                "description": "Opaque Bing filters copied from a Bing search URL; omitted means no explicit filter. No option surcharge; 5 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "first": {
                "description": "One-based position of the first result, integer at least 1, e.g. 11 to start at the 11th result; default 1. No option surcharge; 5 credits per successful request.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "lat": {
                "description": "GPS latitude of the search origin in decimal degrees, e.g. \"41.9028\"; send with lon; omitted uses source default. No option surcharge; 5 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "lon": {
                "description": "GPS longitude of the search origin in decimal degrees, e.g. \"12.4964\"; send with lat; omitted uses source default. No option surcharge; 5 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "mkt": {
                "description": "Market as language-COUNTRY, e.g. \"en-US\" or \"it-IT\"; omit for source default, mutually exclusive with cc. No option surcharge; 5 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Required web search keywords, e.g. \"what is an api\"; no default. No option surcharge; 5 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "safeSearch": {
                "description": "Adult-content filter: Off, Moderate or Strict, e.g. \"Strict\"; omitted uses source default. No option surcharge; 5 credits per successful request.",
                "enum": ["Off", "Moderate", "Strict"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Bing Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a431cd79c9db4e62feb544960490a9bae5a97be25338e2a8a4539958536ab543"
        },
        {
          "name": "extract",
          "title": "Extract Structured Data",
          "description": "Fetches a public page and returns, in data, JSON that matches the supplied JSON Schema. Only fields listed in required are guaranteed; optional nulls are omitted. Use it to get specific fields as structured data. Not for plain page text: use scrape_url. Reddit and Amazon pages are refused (use read_reddit or amazon_product). 40 credits per successful call, whatever the options; an answer that does not match the schema returns EXTRACTION_FAILED and is not charged. Required: url, schema.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "premium": {
                "default": false,
                "description": "Fetch through residential proxies, for pages that come back blocked. Boolean, default false; same price.",
                "type": "boolean"
              },
              "render_js": {
                "default": false,
                "description": "Run the page's JavaScript in a browser before extracting, for pages built in the browser. Boolean, default false; same price.",
                "type": "boolean"
              },
              "schema": {
                "additionalProperties": {},
                "description": "JSON Schema (draft 2020-12 subset) of the JSON to return, e.g. {\"type\":\"object\",\"required\":[\"title\",\"price\"],\"properties\":{\"title\":{\"type\":\"string\"},\"price\":{\"type\":\"number\"}}}. Root type object or array; at most 8 KB, 5 levels and 50 properties; local $ref only.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "url": {
                "description": "Public http or https page URL, at most 8192 characters, e.g. \"https://example.com/product/42\". Reddit and Amazon pages, private addresses and sign-in pages are refused without charge.",
                "format": "uri",
                "maxLength": 8192,
                "type": "string"
              }
            },
            "required": ["schema", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Extract Structured Data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb8da76d658f78ba89dadfe9710757051b0a4f6baa69580e3193d2a59bb2aaec"
        },
        {
          "name": "get_linkedin_profile",
          "title": "Get LinkedIn Profile",
          "description": "Reads one public LinkedIn person profile by its profile ID (the part after /in/ in the profile URL) and returns name, headline, location, summary, url, followers_count and connections_count; counts are rounded as LinkedIn shows them. It does not read company pages or private data, and does not search for people (use google_search to find a profile URL). Required: profile_id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "profile_id": {
                "description": "Public profile ID, the part after /in/ in a LinkedIn profile URL, e.g. \"williamhgates\" for https://www.linkedin.com/in/williamhgates/. Not a full URL or a company page.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["profile_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get LinkedIn Profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:00904a2a8eea21579cb0e56ea9daa4aacc5520495f1a0131260cbdb8ceee1349"
        },
        {
          "name": "google_ai_answer",
          "title": "Google AI Answer",
          "description": "Asks Google AI Mode a question and returns the generated answer as markdown text plus up to 20 references (title, url, source). Use it for a summarized answer with its cited sources. Reference urls can be Google redirect links rather than publisher URLs. It does not return a ranked list of results (use google_search). Required: query.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code that localizes the answer and its sources, e.g. \"it\" or \"gb\". Omit for the source default, us.",
                "enum": ["au", "br", "ca", "de", "es", "fr", "gb", "in", "it", "jp", "mx", "nl", "us"],
                "type": "string"
              },
              "language": {
                "description": "Two-letter language code for the answer, e.g. \"en\" or \"it\". Omit for the source default, en.",
                "enum": ["de", "en", "es", "fr", "it", "ja", "nl", "pt"],
                "type": "string"
              },
              "query": {
                "description": "Question in natural language, 1-8000 characters, e.g. \"How does an espresso machine build pressure?\".",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Google AI Answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3f32fd4e8f204af73910b53d6054e5e7d552f25d49979b69329cbb4126af7f16"
        },
        {
          "name": "google_images",
          "title": "Google Images",
          "description": "Searches Google Images and returns up to 20 image results (title, original image URL, source page link, thumbnail and dimensions when available), with size, colour, type, aspect-ratio and licence filters. It does not download image files and does not return web pages (use google_search). Image rights stay with the source; the licence filter does not grant them. A search with no matches is charged; errors are not. Required: query.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter search country code, e.g. \"it\"; default us. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "domain": {
                "description": "Google search domain, e.g. \"google.co.uk\"; default google.com. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "image_color": {
                "description": "Color filter such as bw, trans, red, blue or white, e.g. \"bw\"; omitted means any color. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "image_type": {
                "description": "Image type: face, photo, clipart, lineart or animated, e.g. \"photo\"; omitted means any type. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "imgar": {
                "description": "Aspect ratio: s (square), t (tall), w (wide), xw (panoramic), e.g. \"w\"; omitted means any. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "imgsz": {
                "description": "Image size such as l, m, i, vga or 2mp, e.g. \"l\" for large; omitted means any size. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Result language code, e.g. \"it\"; default en. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "licenses": {
                "description": "License filter: f, fc, fm, fmc, cl or ol, e.g. \"cl\"; omitted means any license. Verify rights with the source before reuse. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Zero-based results page, integer at least 0, e.g. 1 for the second page; default 0. No option surcharge; 10 credits per successful request.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Required Google Images search keywords, e.g. \"espresso machine\"; no default. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "safe": {
                "description": "Adult-content filter: active or off, e.g. \"active\"; default off. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              },
              "tbs": {
                "description": "Advanced Google Images filter expression copied from a search URL, e.g. \"qdr:w\" for the past week; omitted means no filter. No option surcharge; 10 credits per successful request.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Google Images"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:72fad34ec673f99dd066eb2d81988ef5b8fe49023dfbc26aa4c4f492a9b2d9eb"
        },
        {
