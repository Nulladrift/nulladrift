        {
          "name": "search_recipes",
          "title": "Search Mixly recipes",
          "description": "Search Mixly's public recipes (Thermomix first, plus air fryer, slow cooker, pressure cooker, oven and everyday cooking). Use it when someone wants recipe ideas, a dish by name, or something that fits an ingredient, a diet, a time limit, a course, a cuisine or an occasion. Returns up to 20 recipes, best first, each with its id, title, total time, diets and its page on getmixly.com. All arguments are optional: with none, it returns this week's best recipes. Diet and allergen filters are read from ingredient lists and are not a medical guarantee.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "course": {
                "description": "Course or kind of dish.",
                "enum": ["breakfast", "starters", "soups", "salads", "pasta", "rice_grains", "meat", "poultry", "fish", "vegetarian", "sides", "breads", "desserts", "baking", "drinks", "sauces", "baby"],
                "type": "string"
              },
              "cuisine": {
                "description": "Cuisine as a two-letter country code: \"it\" Italian, \"fr\" French, \"es\" Spanish, \"in\" Indian, \"jp\" Japanese, \"mx\" Mexican and so on.",
                "pattern": "^([a-z]{2}|intl)$",
                "type": "string"
              },
              "cursor": {
                "description": "For the next page: the \"next_cursor\" of the previous answer, with the same other arguments.",
                "type": "string"
              },
              "diets": {
                "description": "Only recipes that fit all of these diets.",
                "items": {
                  "enum": ["vegetarian", "vegan", "pescatarian", "gluten_free", "dairy_free", "nut_free", "egg_free", "halal", "kosher", "low_carb"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "exclude_allergens": {
                "description": "Leave out recipes with any of these allergens (EU list). On the careful side: for gluten, milk, egg, nut and peanut only recipes marked as free from them are returned.",
                "items": {
                  "enum": ["gluten", "crustacean", "egg", "fish", "peanut", "soy", "milk", "nut", "celery", "mustard", "sesame", "sulphite", "lupin", "mollusc"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "ingredient": {
                "description": "One main ingredient the recipe must use, such as \"leek\" or \"salmon\".",
                "maxLength": 40,
                "type": "string"
              },
              "kitchen": {
                "description": "Kind of kitchen the recipe is written for. thermomix: guided Thermomix recipes; everyday: hob and basic equipment.",
                "enum": ["thermomix", "air_fryer", "slow_cooker", "pressure_cooker", "oven", "everyday"],
                "type": "string"
              },
              "language": {
                "description": "Language to answer in. Default: en.",
                "enum": ["en", "fr", "es", "de", "pt", "it"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "How many recipes to return. Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_total_minutes": {
                "description": "Longest total time, in minutes, start to table.",
                "maximum": 600,
                "minimum": 5,
                "type": "integer"
              },
              "occasion": {
                "description": "An occasion the recipe suits.",
                "enum": ["thanksgiving", "christmas", "hanukkah", "new_year", "epiphany", "lunar_new_year", "valentines", "chandeleur", "mardi_gras", "passover", "easter", "ramadan_eid", "diwali", "st_patricks", "mothers_day", "fourth_of_july", "oktoberfest", "halloween", "cinco_de_mayo", "fathers_day", "midsummer", "bastille_day", "eid_al_adha", "rosh_hashanah", "mid_autumn", "day_of_the_dead", "bonfire_night", "st_nicholas", "super_bowl", "all_saints", "st_martin", "burns_night", "barbecue", "back_to_school", "ferragosto", "canada_day"],
                "type": "string"
              },
              "query": {
                "description": "Words to look for in titles and ingredients, such as \"leek soup\" or \"chocolate\". Up to four words count; a recipe must contain all of them.",
                "maxLength": 80,
                "type": "string"
              },
              "thermomix_model": {
                "description": "Only recipes that work on this Thermomix model.",
                "enum": ["TM7", "TM6", "TM5"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "more_url": {
                "type": "string"
              },
              "next_cursor": {
                "type": "string"
              },
              "recipes": {
                "items": {
                  "properties": {
                    "courses": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "diets": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "type": "string"
                    },
                    "image_url": {
