        "name": "com.getmixly/recipes",
        "title": "Mixly Recipes",
        "version": "1.0.1",
        "description": "Thermomix and everyday recipes from Mixly, with step settings. Not affiliated with Vorwerk.",
        "websiteUrl": "https://getmixly.com",
        "icons": [
          {
            "src": "https://getmixly.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
