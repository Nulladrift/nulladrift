      },
      "instructions": "Mixly Recipes gives read-only access to Mixly's public recipe collection: recipes written for the Thermomix (with time, temperature and speed for every step) and for air fryers, slow cookers, pressure cookers, ovens and everyday kitchens, in English, French, Spanish, German, Portuguese and Italian.\n\nHow to use it:\n- search_recipes finds recipes by words and filters. get_recipe returns one recipe in full. whats_in_season returns this week's seasonal selection. list_catalogue lists the courses, cuisines, occasions and kitchens that can be used as filters.\n- show_recipe and show_recipes display a recipe card or a row of recipe cards to the person, in hosts that can show them. They take the ids that the other tools return.\n- Every recipe has a \"url\" on getmixly.com. When you mention a recipe, link to that url and name Mixly as the source.\n- Ask for the person's language with \"language\" (en, fr, es, de, pt, it). A recipe that is not available in that language comes back in the language it was written in, and says so in \"language\".\n- Diet and allergen filters are read from the ingredient lists. They help choose, but they are not a medical guarantee: remind people with allergies to check the labels of what they buy.\n- Nothing here is personal: there are no accounts, and nothing can be saved or changed. To save a recipe, send it to Cookidoo or cook it step by step, people open its page on getmixly.com.\n\nMixly is an independent product and is not affiliated with Vorwerk. Thermomix and Cookidoo are trademarks of their owner.",
      "tools": [
        {
