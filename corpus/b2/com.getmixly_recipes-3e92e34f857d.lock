                    },
                    "in_season": {
                      "type": "boolean"
                    },
                    "kitchen": {
                      "type": "string"
                    },
                    "language": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "total_minutes": {
                      "type": "integer"
                    },
                    "url": {
                      "description": "The recipe's page on getmixly.com. Cite and link this.",
                      "type": "string"
                    }
                  },
                  "required": ["courses", "diets", "id", "image_url", "in_season", "kitchen", "language", "title", "total_minutes", "url"],
                  "type": "object"
                },
                "type": "array"
