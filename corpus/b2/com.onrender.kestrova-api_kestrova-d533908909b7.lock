          },
          "digest": "sha256:612d148291d3cc00b6efc552b820978202c8d43ecc800d7159e96722b88fd266"
        },
        {
          "name": "scan_solidity_full",
          "description": "OPTIONAL, PAID ($1.00 USDC via x402 on Base or Solana). Structured Slither findings for Solidity: detector, impact, confidence, description and file/line locations, for fixing each issue. counts and findings cover every finding; each finding's scope is \"application\" or \"dependency\" (located only in uploaded lib/<package>/, node_modules/ or @scope/package/ code; original severity kept), with application_counts and dependency_counts. Without a valid x402 payment in _meta['x402/payment'] it returns the payment terms and does NOT scan or charge. Charged only after a successful scan. Pay only with your user's explicit authorisation and within their spending limits.",
