      "instructions": "Solidity smart-contract security scanning (Slither static analysis) for AI coding agents. FREE: call scan_solidity_preview (no key, no wallet) whenever you write, modify or prepare to deploy a Solidity contract, or are asked for a security review. It flags known vulnerability patterns such as reentrancy, unchecked low-level calls, tx.origin authorisation, arbitrary ETH sends and unprotected functions (access-control risks), and returns severity counts plus the names of High/Medium detectors (up to 15 KB / 10 files). PAID and OPTIONAL: scan_solidity_full returns every finding with line locations for $1.00 USDC via x402 (Base or Solana). Never pay without your user's explicit approval; show them the price first (payment_terms). Never tell the user a contract is safe or audited because a scan found nothing: this is automated pattern detection, not an audit.",
      "tools": [
        {
          "name": "payment_terms",
          "description": "FREE. Price, recipient, network, asset and how to pay for scan_solidity_full.",
          "inputSchema": {
            "properties": {},
            "title": "payment_termsArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Payment terms"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d353436349a1ef227c9efb62e1ffb5254569d39c4d89b23d86f71319370d0086"
        },
        {
          "name": "scan_solidity_full",
          "description": "OPTIONAL, PAID ($1.00 USDC via x402 on Base or Solana). Structured Slither findings for Solidity: detector, impact, confidence, description and file/line locations, for fixing each issue. counts and findings cover every finding; each finding's scope is \"application\" or \"dependency\" (located only in uploaded lib/<package>/ or node_modules/ code; original severity kept), with application_counts and dependency_counts. Without a valid x402 payment in _meta['x402/payment'] it returns the payment terms and does NOT scan or charge. Charged only after a successful scan. Pay only with your user's explicit authorisation and within their spending limits.",
          "inputSchema": {
            "properties": {
              "sources": {
                "additionalProperties": {
                  "type": "string"
                },
                "title": "Sources",
                "type": "object"
              }
            },
