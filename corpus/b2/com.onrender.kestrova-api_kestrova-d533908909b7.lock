            "title": "scan_solidity_fullArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Solidity full scan (paid)"
          },
          "behavior": {
