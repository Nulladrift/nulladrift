          },
          "digest": "sha256:aa5d2e16bf28bae70aea21fc7c3c5f6ddf7a41a8b8ec6c74066803498b1ed3bf"
        },
        {
          "name": "scan_solidity_preview",
          "description": "FREE Solidity security check (Slither static analysis), no key and no wallet. Detects known vulnerability patterns (reentrancy, unchecked calls, tx.origin authorisation, arbitrary ETH sends, unprotected functions and more) and returns severity counts plus High/Medium detector names. Use after writing or changing a contract and before deployment. Input: {\"sources\": {\"File.sol\": \"<source>\"}} (include imported files). Up to 15 KB / 10 files; rate-limited per client. Zero findings does not mean safe.",
