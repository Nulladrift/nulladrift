        },
        {
          "name": "scan_solidity_preview",
          "description": "FREE Solidity security check (Slither static analysis), no key and no wallet. Detects known vulnerability patterns (reentrancy, unchecked calls, tx.origin authorisation, arbitrary ETH sends, unprotected functions and more) and returns severity counts, High/Medium detector names, a description of each High/Medium issue (issues: what and why, no location) and one lower-severity finding in full as an example (example_finding); exact file/line of every finding is in scan_solidity_findings, fixes in scan_solidity_full. Use after writing or changing a contract and before deployment. Input: {\"sources\": {\"File.sol\": \"<source>\"}} (include imported files; package imports such as @openzeppelin/contracts/... stay as written when the package files are submitted under that path, node_modules/ or lib/openzeppelin-contracts/contracts/). Up to 15 KB / 10 files; rate-limited per client. Zero findings does not mean safe.",
