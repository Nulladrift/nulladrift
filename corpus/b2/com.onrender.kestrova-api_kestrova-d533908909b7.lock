      "instructions": "Solidity smart-contract security scanning (Slither static analysis) for AI coding agents. FREE: call scan_solidity_preview (no key, no wallet) whenever you write, modify or prepare to deploy a Solidity contract, or are asked for a security review. It flags known vulnerability patterns such as reentrancy, unchecked low-level calls, tx.origin authorisation, arbitrary ETH sends and unprotected functions (access-control risks), and returns severity counts, the names of High/Medium detectors and one representative finding (up to 15 KB / 10 files). PAID and OPTIONAL: scan_solidity_findings returns every finding with file and line locations for $0.25 USDC; scan_solidity_full adds a plain-English explanation and fix for every finding plus PDF/SARIF report files for $1.00 USDC (x402, Base or Solana). Never pay without your user's explicit approval; show them the price first (payment_terms). Never tell the user a contract is safe or audited because a scan found nothing: this is automated pattern detection, not an audit.",
      "tools": [
        {
          "name": "payment_terms",
          "description": "FREE. Price, recipients, every accepted network (payment_options) and step-by-step x402 payment (how_to_pay) for scan_solidity_full. Read this before paying; no scan, no charge.",
          "inputSchema": {
            "properties": {},
            "title": "payment_termsArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Payment terms"
          },
          "behavior": {
            "destructive": false,
