            "readOnly": true
          },
          "digest": "sha256:0c624e445b59d744144a1637b9cd47cc7b59af3bb8001ee0cfbce4e64a532b80"
        },
        {
          "name": "scan_solidity_findings",
          "description": "OPTIONAL, PAID ($0.25 USDC via x402 on Base or Solana). Agent tier: every Slither finding for Solidity with detector, impact, confidence, Slither's description and file/line locations, as JSON; each finding's scope is \"application\" or \"dependency\". scan_solidity_full ($1.00 USDC) adds a plain-English explanation and fix for every finding plus PDF and SARIF report files. Without a valid x402 payment in _meta['x402/payment'] it returns the payment terms and does NOT scan or charge. Charged only after a successful scan. Pay only with your user's explicit authorisation and within their spending limits.",
