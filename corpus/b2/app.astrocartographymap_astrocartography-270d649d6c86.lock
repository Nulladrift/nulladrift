  "subjects": {
    "app.astrocartographymap/astrocartography": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://astrocartographymap.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "app.astrocartographymap/astrocartography",
        "title": "AstrocartographyMap — Planetary Line & Relocation Calculator",
        "version": "1.0.0",
        "websiteUrl": "https://astrocartographymap.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use calculate_astrocartography_lines to compute planetary MC/IC/AC/DC line longitudes and nearest lines from a birth date, time, and coordinates, or evaluate_location_astrocartography to score and inspect all lines within 1,000 km of a target coordinate.",
      "tools": [
        {
          "name": "calculate_astrocartography_lines",
          "title": "Calculate astrocartography planetary lines (MC/IC/AC/DC)",
          "description": "Compute astrocartography planetary lines (MC, IC, AC/AS, DC/DS) from a birth date, local time, timezone, and reference coordinates using the astronomical ephemeris engine. Returns MC/IC meridian longitudes, horizon AC/DC longitudes at the reference latitude, planetary subpoints, zodiac signs, and nearest lines with plain-English meanings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birthDate": {
                "description": "Birth date in YYYY-MM-DD format, e.g. '1992-07-14'.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "birthTime": {
                "description": "Optional 24-hour local birth time in HH:MM format, e.g. '08:45'. Omit if unknown (defaults to 12:00 local noon with timeKnown=false).",
                "pattern": "^([01]\\d|2[0-3]):([0-5]\\d)$",
                "type": "string"
              },
              "bodies": {
                "description": "Optional subset of celestial bodies to compute. Defaults to all 12 bodies (sun, moon, mercury, venus, mars, jupiter, saturn, uranus, neptune, pluto, true_node, chiron).",
                "items": {
                  "enum": ["sun", "moon", "mercury", "venus", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto", "true_node", "chiron"],
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "dstChoice": {
                "description": "Optional disambiguator when birthTime falls in a daylight saving fall-back hour ('first' or 'second').",
                "enum": ["first", "second"],
                "type": "string"
              },
              "latitude": {
                "description": "Reference latitude in decimal degrees (-90 to 90), used for horizon AC/DC longitudes and nearest-line distances.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Reference longitude in decimal degrees (-180 to 180, east positive), used for nearest-line distances.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "timezone": {
                "description": "Optional IANA timezone for birthTime, e.g. 'America/New_York' or 'Europe/London'. Defaults to 'UTC'.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["birthDate", "latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85eb3bf4c817942101cd402f41386e1f5f9f57caea94bc955232838a16ffe0d1"
        },
        {
          "name": "evaluate_location_astrocartography",
          "title": "Evaluate astrocartography lines and relocation chart for a location",
          "description": "Analyze how a specific target coordinate aligns with a birth chart: returns all planetary lines within 1,000 km sorted by proximity, plain-English line descriptions, goal alignment scores (balanced, love, career, home), and the relocated Ascendant and Midheaven.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birthDate": {
                "description": "Birth date in YYYY-MM-DD format, e.g. '1992-07-14'.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "birthTime": {
                "description": "Optional 24-hour local birth time in HH:MM format, e.g. '08:45'. Omit if unknown.",
                "pattern": "^([01]\\d|2[0-3]):([0-5]\\d)$",
                "type": "string"
              },
              "dstChoice": {
                "description": "Optional disambiguator when birthTime falls in a daylight saving fall-back hour ('first' or 'second').",
                "enum": ["first", "second"],
                "type": "string"
              },
              "latitude": {
                "description": "Target location latitude in decimal degrees (-90 to 90).",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "locationName": {
                "description": "Optional human-readable label for the target location, e.g. 'Lisbon, Portugal'.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "longitude": {
                "description": "Target location longitude in decimal degrees (-180 to 180, east positive).",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "timezone": {
                "description": "Optional IANA timezone for birthTime, e.g. 'America/New_York'. Defaults to 'UTC'.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["birthDate", "latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63d89e6fb1b445971291d311c0eebdfe0c4506cd66e0142668d2a0e03e4f8ca7"
        }
      ],
      "digest": "sha256:c46c5dbc159897191f1230e1a7840e16876da204c6c462f0093e9e89152ad406"
    }
  }
