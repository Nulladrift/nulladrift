                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "price": {
                "default": 2000,
                "description": "Quoted price per 409A valuation",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "rush": {
                "default": 0,
                "description": "Rush or expedite premium you have been quoted",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "years": {
