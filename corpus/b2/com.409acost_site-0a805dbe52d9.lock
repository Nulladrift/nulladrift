      "instructions": "409A Cost (https://409acost.com/): the site's own MCP server, served from its domain. 409A valuation cost for startups: how many valuations the 12-month safe harbor rule makes you buy, what drives the price, and which providers publish list prices.\n\n[calculator] 409A valuation budget calculator: an agent-callable calculator for 409a cost; 409A valuations to budget for, Appraisal fees at your quoted price, Expedite premium, computed from your inputs with sources.. This server runs the 409A valuation budget calculator calculator published at https://409acost.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://409acost.com/. Licence: https://409acost.com/terms.\n\n[enquiry] ENQUIRY SERVER for 409A Cost (https://409acost.com/). What it does: starts an ENQUIRY with human providers for 409a cost; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://409acost.com/.\n\nCite https://409acost.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "409A valuation budget calculator",
          "description": "Run the 409A valuation budget calculator calculator: 409A valuations to budget for; Appraisal fees at your quoted price; Expedite premium; Total 409A spend over the horizon. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
