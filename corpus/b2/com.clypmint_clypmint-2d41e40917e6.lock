        {
          "name": "create_video",
          "title": "Make a faceless video",
          "description": "Make a faceless video from an idea or a script, with no footage: the style’s pictures, designed screens, captions and sound. Send exactly one of idea (Clypmint writes the narration) or script (spoken exactly as supplied), which sets the length, so leave seconds out. Defaults to a 30-second vertical video; seconds 10 to 60. style_id only when they name one or their own fits; every style can make a video from words, in its own look; its inputs are presets: Serif Editorial Launch has inputs.voice:none (no narrator unless the user asks for a voiceover); Bold Navy Statement is narrated, with Chris by default. Optional: formats (the main shape first), voice (one of 21 narrators by name), sound_effects (on unless false), music_bed (the style’s music under the voice, only when true), pictures (asset_ids, or asset_staging_keys from import_asset), a song (music_staging_key), purpose and instructions. Cost: 3 credits to make, plus 1 for each started minute of voice-over and 1 for each started minute of finished video after the first, plus 2 for each extra format; dry_run: true answers the cost and starts nothing. Answers with studio_url: follow it with check_video. It does not post.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_ids": {
                "default": [],
                "description": "Pictures or clips already in Clypmint to show (src_... from list_assets or save_clip).",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "asset_staging_keys": {
                "default": [],
                "description": "Pictures the user wants shown (a portrait, a product, an app screen), each imported with import_asset.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "dry_run": {
                "description": "true: answer the credit cost and start nothing.",
                "type": "boolean"
              },
              "format": {
                "default": "vertical",
                "description": "The older one-shape switch; formats says more.",
                "enum": ["vertical", "horizontal"],
                "type": "string"
              },
              "formats": {
                "description": "Every shape to make, the main one first: 9:16, 16:9, 1:1, 4:5.",
                "items": {
                  "enum": ["9:16", "16:9", "1:1", "4:5"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "idea": {
                "description": "What the video is about, in a line or two: Clypmint writes the narration.",
                "maxLength": 4000,
                "minLength": 3,
                "type": "string"
              },
              "instructions": {
                "description": "Anything else the user asked for, in their own words. A link here is not opened: use import_asset.",
                "maxLength": 8000,
                "type": "string"
              },
              "music_bed": {
                "description": "true: lay the style's own music bed under the narration (none unless asked); false: never. music_staging_key brings a song of your own instead.",
                "type": "boolean"
              },
              "music_staging_key": {
                "description": "A song from import_asset (mp3, wav or m4a) to lay under the voice.",
                "type": "string"
              },
              "operation_id": {
                "description": "Same id retries run once.",
                "type": "string"
              },
              "purpose": {
                "description": "organic (a post), ad (three openings by default), youtube (horizontal), sales_page.",
                "enum": ["organic", "ad", "youtube", "sales_page"],
                "type": "string"
              },
              "script": {
                "description": "The exact words to narrate, read as written. Send script or idea, not both.",
                "maxLength": 4000,
                "minLength": 3,
                "type": "string"
              },
              "seconds": {
                "default": 30,
                "description": "Any length, 10 to 60. With a script, leave it out: the script sets the length (about 2.5 words a second).",
                "maximum": 60,
                "minimum": 10,
                "type": "integer"
              },
              "sound_effects": {
                "description": "Sound effects: on unless false.",
                "type": "boolean"
              },
              "style_id": {
                "description": "Only one they named or their own (get_profile own_styles).",
                "type": "string"
              },
              "style_version": {
                "description": "A saved version of the user's own style; its newest when left out.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "title": {
                "description": "The video's name in the user's library.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
