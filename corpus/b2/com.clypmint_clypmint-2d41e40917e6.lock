        {
          "name": "edit_video",
          "title": "Edit a video",
          "description": "Brings the footage in for you to edit; no Clypmint model touches it (every word captioned), delivered ready. Then read get_timeline and get_transcript. Edit with cut, set_captions, put_overlay, write_graphic, set_audio, set_look. Hooks, shorts and clips stay with Clypmint's editor. style_id sets its captions. In ChatGPT the video is attached as video; elsewhere the answer carries a private upload link good for 2 hours, and editing starts when the file lands. One upload per video. Cost: 3 credits to make, plus 1 for each started minute of footage and 1 for each started minute of finished video after the first, plus 2 for each extra hook, length or format and 2 for each clip; dry_run: true answers the cost and starts nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_ids": {
                "description": "Pictures or clips already in Clypmint to use (src_... from list_assets or save_clip).",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "asset_staging_keys": {
                "description": "Pictures from import_asset to use, such as a logo (stg_...).",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "camera_sound": {
                "description": "The footage's own sound. mute: only the song plays (the default for a montage with a song). keep: the camera sound stays (the default otherwise).",
                "enum": ["keep", "mute"],
                "type": "string"
              },
              "clips": {
                "additionalProperties": false,
                "description": "Clips alone from one recording (no main film): podcasts, streams, long talks.",
                "properties": {
                  "about": {
                    "description": "Topics to look for first, in plain words.",
                    "maxLength": 300,
                    "minLength": 2,
                    "type": "string"
                  },
                  "count": {
                    "anyOf": [
                      {
                        "maximum": 30,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "enum": ["all"],
                        "type": "string"
                      }
                    ],
                    "description": "How many clips (1-30), or 'all' the good ones."
                  },
                  "from_seconds": {
                    "description": "Look only after this second of the recording.",
                    "maximum": 21600,
                    "minimum": 0,
                    "type": "number"
                  },
                  "max_seconds": {
                    "description": "The longest clip, in seconds.",
                    "maximum": 95,
                    "minimum": 10,
                    "type": "integer"
                  },
                  "min_seconds": {
                    "description": "The shortest clip, in seconds.",
                    "maximum": 95,
                    "minimum": 10,
                    "type": "integer"
                  },
                  "shape": {
                    "description": "source keeps the recording's shape; 9:16 cuts each clip vertical on the speaker.",
                    "enum": ["source", "9:16"],
                    "type": "string"
                  },
                  "to_seconds": {
                    "description": "Look only before this second of the recording.",
                    "exclusiveMinimum": 0,
                    "maximum": 21600,
                    "type": "number"
                  }
                },
                "required": ["count"],
                "type": "object"
              },
              "dry_run": {
                "description": "true: answer the credit cost and start nothing.",
                "type": "boolean"
              },
              "footage_from": {
                "description": "A video_id already made from this footage: a new edit of it with no new upload (another kind, length or style).",
                "type": "string"
              },
              "formats": {
                "description": "Only when the user asked for a shape: 9:16 (vertical, TikTok, Reels, Shorts), 1:1 (square), 4:5, 16:9 (YouTube, widescreen), the main one first. Left out, nothing is cropped.",
                "items": {
                  "enum": ["9:16", "16:9", "1:1", "4:5"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "hooks": {
                "description": "Openings to make (1-3): an ad gets 3 by default, the main cut counting as one.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "instructions": {
                "description": "Anything else the user asked for, in their own words, usually a sentence or two; not what has its own field. Never describe the footage or write rules.",
                "maxLength": 8000,
                "type": "string"
              },
              "kind": {
                "description": "talking: their words lead (talking head, interview, podcast). montage: pictures and music lead (sport, travel, b-roll). Left out, Clypmint decides from the footage.",
                "enum": ["talking", "montage"],
                "type": "string"
              },
              "length": {
                "additionalProperties": false,
                "description": "Finished length: \"45-60 s\" is {min_seconds: 45, max_seconds: 60}; \"under a minute\" is {max_seconds: 60}. Leave out if none named.",
                "properties": {
                  "max_seconds": {
                    "maximum": 3600,
                    "minimum": 5,
                    "type": "integer"
                  },
                  "min_seconds": {
                    "maximum": 3600,
                    "minimum": 5,
                    "type": "integer"
                  }
                },
                "required": ["max_seconds"],
                "type": "object"
              },
              "music_staging_key": {
                "description": "The song for this video, from import_asset (mp3, wav or m4a): a montage's soundtrack, or music under the speech.",
                "type": "string"
              },
              "names": {
                "description": "Exact person, company and product names to spell right in this video.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "operation_id": {
                "description": "Same id retries run once.",
                "type": "string"
              },
              "purpose": {
                "description": "organic (a post), ad (three openings by default), youtube (horizontal), sales_page.",
                "enum": ["organic", "ad", "youtube", "sales_page"],
                "type": "string"
              },
              "reference_mode": {
                "description": "clone (default): a deep copy of the motion and captions; slower, uses a monthly style copy, then credits. match: fast and approximate, included.",
                "enum": ["clone", "match"],
                "type": "string"
              },
              "reference_url": {
                "description": "A video to look like: a public Instagram, TikTok, X, Facebook, Loom or LinkedIn link. Its style is copied first; leave style_id out.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "shorts": {
                "anyOf": [
                  {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "enum": ["all"],
                    "type": "string"
                  }
                ],
                "description": "Shorts to cut from the recording too (0-10), or 'all' the good ones."
              },
              "song_upload": {
                "description": "true when the user has a song file but no link: the upload link then takes the video and the song together. Leave out with music_staging_key.",
                "type": "boolean"
              },
              "sound_effects": {
                "description": "true: sound effects on the edit.",
                "type": "boolean"
              },
              "source_url": {
                "description": "A public https link to the footage (where links are open), instead of a file.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "speaker_company": {
                "description": "The speaker's company or business, spelled exactly for this video.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "speaker_name": {
                "description": "Who is talking, spelled right, e.g. \"Dr. Ana Ruiz\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "spellings": {
                "additionalProperties": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "description": "Heard-to-correct spellings for this video, e.g. {\"KMAC\":\"KMAK\"}.",
                "propertyNames": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "style_id": {
                "description": "Only one they named or their own (get_profile own_styles).",
                "type": "string"
              },
              "style_version": {
                "description": "A saved version of the user's own style; its newest when left out.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "title": {
                "description": "The video's name in the user's library.",
                "maxLength": 120,
                "type": "string"
              },
              "video": {
                "additionalProperties": false,
                "description": "The video the user attached in ChatGPT: always pass it here, never an upload script. Leave out only when nothing is attached, to get a private upload link.",
                "properties": {
                  "download_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "file_id": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Clypmint edit_video result. Error results carry error; successful requests expose the identifiers and state available for the next step. Signed media stays in private metadata.",
            "properties": {
              "available": {
                "type": "boolean"
              },
              "code": {
                "type": ["string", "null"]
              },
              "cost": {
                "additionalProperties": true,
                "type": "object"
              },
              "dry_run": {
                "type": "boolean"
              },
              "error": {
                "type": "string"
              },
              "import_id": {
                "type": ["string", "null"]
              },
