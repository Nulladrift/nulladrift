        {
          "name": "vivid_contact_team",
          "title": "Contact the Vivid team (opens a support case)",
          "description": "Open a support case with the Vivid Ads team (emails the team and saves a record) for anything the other tools cannot do: a problem with an order (damaged, faulty, missing, wrong item or colour — reprint/refund claims), an order change (address, cancel, hold, split into one line per design), proof help (resend, changes), a human design service request, a sample/swatch request, a trade/reseller or payment-terms account, a price-match request, a tight deadline, or simply 'I want to talk to a person'. Call it ONCE per issue, after collecting a clear summary and the customer's email or phone. It never returns order details: an order number is passed to the team as the customer's own reference (marked unverified unless an identity token from vivid_identity_verify is supplied). For B2B AI-automation enquiries use reason 'ai_automation'. Never use this to take payment or approve a proof.",
          "inputSchema": {
            "properties": {
              "company": {
                "type": "string"
              },
              "email": {
                "description": "how the team replies (email or phone required)",
                "type": "string"
              },
              "idempotency_key": {
                "description": "optional: a unique key for this request — a retry with the same key returns the first result instead of repeating the action",
                "maxLength": 128,
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "order_number": {
                "description": "the customer's order or quote number, if this is about an existing order",
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "product": {
                "type": "string"
              },
              "reason": {
                "description": "what the case is about",
                "enum": ["problem_with_order", "order_change", "proof_help", "design_service", "sample_request", "trade_account", "price_match", "deadline", "promo_code", "talk_to_person", "ai_automation", "other"],
                "type": "string"
              },
              "summary": {
                "description": "everything the team needs, in the customer's words: what happened / what they want, product, size, quantity, deadline. For a problem: what is wrong and when it arrived (photos can be sent with vivid_upload_artwork).",
