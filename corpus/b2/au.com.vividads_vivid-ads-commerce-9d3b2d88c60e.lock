        {
          "name": "vivid_reorder",
          "title": "Reorder a past job (creates a draft)",
          "description": "Reorder a customer's previous signage job — fast. Requires identity verification (emailed one-time code), not just an order number. action:'list' shows their past orders; action:'reorder' repeats one. ARTWORK: it reuses only the customer's previously APPROVED artwork (the print file), never a pre-approval upload; if it can't be confirmed automatically the team confirms it. A fresh proof is ALWAYS re-issued to confirm the artwork before printing. The customer may also supply new artwork or change the quantity. Re-prices with CURRENT pricing (never the old price). Creates a proof-gated draft order; never charges a card. CODE REQUIRED: needs the customer's email AND a verified identity token. Without a token this tool emails the customer a 6-digit code and returns status need_verification with a verificationId — ask the customer for the code, call vivid_identity_verify, then call this tool again with the token. It shows nothing before that.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "'list' (show past orders) or 'reorder' (repeat one)",
                "type": "string"
              },
              "artwork": {
                "description": "new print-ready artwork file URL (optional; default = reuse previous)",
                "type": "string"
              },
              "confirm": {
                "description": "set true to place the reorder (draft, proof-gated, never charges)",
                "type": "boolean"
              },
              "email": {
                "description": "the email the customer ordered under (required to find past orders)",
                "type": "string"
              },
              "idempotency_key": {
                "description": "optional: a unique key for this request — a retry with the same key returns the first result instead of repeating the action",
                "maxLength": 128,
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "order": {
                "description": "order name to reorder from, e.g. '#D12345' (optional)",
                "type": "string"
              },
              "product": {
                "description": "which product to reorder, e.g. 'corflute' (optional; default = most recent eligible)",
                "type": "string"
              },
              "quantity": {
                "description": "override quantity (optional; default = same as last time)",
                "type": "number"
              },
              "token": {
                "description": "the identity token from vivid_identity_verify (required — proves the customer owns this email)",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
