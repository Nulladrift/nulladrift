        {
          "name": "vivid_artwork",
          "title": "Attach artwork to an order",
          "description": "Attach a customer-provided artwork file or link to a signage order (a successful attach does NOT mean it is print-ready — the team still checks it). EASIEST: pass a shareable link to the file (sourceUrl) — Google Drive, Dropbox, WeTransfer, etc. — and use the returned fileUrl in vivid_place_order's artwork {mode:'upload_file', fileUrl}. For a large file with no link yet, set requestUpload:true to get a direct-upload URL (the file uploads straight to storage — handles 50–200MB+), then call again with the returned fileId to get the share link.",
          "inputSchema": {
            "properties": {
              "contentType": {
                "type": "string"
              },
              "fileId": {
                "description": "after a direct upload completes, pass the returned file id here to finalise and get the share link",
                "type": "string"
              },
              "filename": {
                "description": "filename (required with requestUpload), e.g. 'flyer.pdf'",
                "type": "string"
              },
              "requestUpload": {
                "description": "set true to get a direct-upload URL for a large file (client uploads straight to storage)",
                "type": "boolean"
              },
              "sourceUrl": {
                "description": "a shareable https link to the print-ready artwork (PDF/PNG/JPG/AI/EPS) — the easiest path",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Attach artwork to an order"
          },
