              "quantity": {
                "description": "how many identical items — turnaround depends on it (default 1)",
                "type": "number"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "agent_note": {
                "type": ["string", "null"]
              },
              "message": {
                "type": ["string", "null"]
              },
              "production_hours": {},
              "quantity": {},
              "status": {
                "description": "outcome discriminator, e.g. ok / priced / need_size / manual_quote / unknown_product / error",
                "type": "string"
              },
              "turnaround": {
                "description": "quantity-aware ready-to-dispatch: { ready_to_dispatch, approve_by, working_days, basis: tier|provisional, sentence }"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate delivery timing"
