        {
          "name": "vivid_fulfilment_order_status",
          "description": "Authoritative order state with a per-line-item breakdown and an order-level rollup. States: received, in_production, partially_ready, ready_for_pickup, dispatched, in_transit, out_for_delivery, delivered, completed, on_hold, cancelled. Includes the StarShipit shipping summary where available.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["order_id"]
              },
              {
                "required": ["order_name"]
              }
            ],
            "properties": {
              "customer_email": {
                "description": "The email address on the order. REQUIRED for identity — order details are only returned when this email matches the order. The customer must give their email AND one of their order numbers.",
                "type": "string"
              },
              "line_item_id": {
                "description": "Optional Shopify line item GID to scope to one item.",
                "type": "string"
              },
              "order_id": {
                "description": "Shopify order GID, e.g. gid://shopify/Order/123.",
                "type": "string"
              },
              "order_name": {
                "description": "Human order name, e.g. \"#12345\" (alias for order_id).",
                "type": "string"
              },
              "token": {
                "description": "identity token from vivid_identity_verify — REQUIRED to see any details. Without it a 6-digit code is emailed to customer_email and the tool returns need_verification.",
                "type": "string"
              }
            },
            "required": ["customer_email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "order status"
