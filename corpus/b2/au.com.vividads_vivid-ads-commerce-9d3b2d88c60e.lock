        {
          "name": "vivid_upload_artwork",
          "title": "Upload artwork",
          "description": "Upload a customer's artwork FILE through the agent (no website file picker needed). Accepts the file as base64, stores it in Vivid's Google Drive, and returns a stable shareable link plus metadata. Accepts PDF / AI / EPS / JPG / PNG. Does NOT verify print-readiness — the team checks that. Uploading needs no verification, but ATTACHING the file to an existing order does: pass the identity token from vivid_identity_verify, otherwise the file is held unattached and the reply says so. Use when a customer wants to send their print file via chat.",
          "inputSchema": {
            "properties": {
              "contentBase64": {
                "description": "the file contents, base64-encoded (data URI prefix OK). Small files only; for very large files share a download link instead.",
                "type": "string"
              },
              "email": {
                "description": "customer email (optional). Only recorded once verified — see token.",
                "type": "string"
              },
              "filename": {
                "description": "original filename incl. extension, e.g. 'banner-artwork.pdf'",
                "type": "string"
              },
              "idempotency_key": {
                "description": "optional: a unique key for this request — a retry with the same key returns the first result instead of repeating the action",
                "maxLength": 128,
                "type": "string"
              },
              "mimeType": {
                "description": "MIME type, e.g. 'application/pdf'",
                "type": "string"
              },
              "orderId": {
                "description": "attach to an existing order (optional). Ignored unless a valid token is supplied — an unverified caller must not be able to put a file on somebody else's order.",
                "type": "string"
              },
              "quoteId": {
                "description": "associate with a quote request (optional)",
                "type": "string"
              },
              "sessionId": {
                "description": "associate with a design session (optional)",
                "type": "string"
              },
              "token": {
                "description": "identity token from vivid_identity_verify. Required to attach this upload to an order or to record the email; without it the file is still stored, just not claimed by anyone.",
                "type": "string"
              }
            },
            "required": ["contentBase64", "filename"],
            "type": "object"
