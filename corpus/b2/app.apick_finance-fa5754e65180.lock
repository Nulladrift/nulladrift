        },
        {
          "name": "crypto_market",
          "title": "암호화폐 통합 시세·김치프리미엄",
          "description": "Compare Korean-won crypto prices with global USDT prices and return the Korea premium (kimchi premium) per coin. 국내외 주요 거래소의 실시간 시세를 모아 원화 환산 기준가와 한국 시장 프리미엄을 함께 계산합니다. 일부 거래소가 응답하지 않으면 partial=true 로 나머지 시세만 돌려줍니다. [호출당 30포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "symbols": {
                "description": "심볼을 쉼표로 구분 (예: BTC,ETH,XRP). 생략하면 BTC,ETH,XRP,SOL,DOGE",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:50b7549d34f0490b6162ab4d672f4c5a66ea08f78866d8dbef4933c197f8fed8"
        },
        {
          "name": "exchange_rate",
          "title": "환율 조회(월평균·연평균·일별)",
          "description": "Monthly and yearly average exchange rates, plus daily base rates, against the Korean won (KRW) for about 50 major currencies. 원화 기준 주요 통화의 월평균·연평균 환율(month)과 일별 매매기준율(date)을 조회합니다. month 를 생략하면 지난달, date 를 생략하면 오늘이며 둘은 함께 보낼 수 없습니다. 일별은 영업일 기준이고 비영업일이면 직전 영업일 고시를 돌려주며 as_of_date 로 실제 고시일을 알립니다. JPY·IDR·VND 는 100단위(unit=100) 값입니다. [호출당 5포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "description": "통화 코드를 쉼표로 구분 (예: USD,JPY,EUR). 생략하면 전체 통화",
                "type": "string"
              },
              "date": {
                "description": "조회 일자 YYYYMMDD (예: 20261114). 생략하면 오늘. 일별 매매기준율 조회이며 month 와 함께 보낼 수 없음",
                "type": "string"
              },
              "month": {
                "description": "조회 월 YYYYMM (예: 202609). 생략하면 지난달. 이번 달 이후는 조회 불가. date 와 함께 보낼 수 없음",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d30d58ec875b425894709742a548cce0e07cd91706468e2223e3444333720adb"
        },
        {
          "name": "intl_interest_rate",
          "title": "국제금리 조회",
          "description": "Daily international interest rates (overnight RFRs such as SOFR and ESTR, term rates and CIRR) by currency and term. SOFR·ESTR·TONA 등 국제금리와 통화별 중장기 고시 금리를 일자별로 조회합니다. date(YYYYMMDD)를 생략하면 오늘이고, 영업일 기준이며 비영업일이면 직전 영업일 고시를 돌려주고 as_of_date 로 실제 고시일을 알립니다. 응답은 date·as_of_date·count·rates(currency·term·rate) 입니다. [호출당 5포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "조회 일자 YYYYMMDD (예: 20261114). 생략하면 오늘",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:282c85939a1a88e53b1f05e10bb549745bdc362135f88da4d04e29505b431e2d"
        },
        {
          "name": "loan_interest_rate",
          "title": "대출금리 조회",
          "description": "Daily fixed base rates and yields by loan term for the requested business day. 대출기간별 고정기준금리와 유통수익률을 일자별로 조회합니다. date(YYYYMMDD)를 생략하면 오늘이고, 영업일 기준이며 비영업일이면 직전 영업일 고시를 돌려주고 as_of_date 로 실제 고시일을 알립니다. 응답은 date·as_of_date·count·rates(term·rate) 입니다. [호출당 5포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "조회 일자 YYYYMMDD (예: 20261114). 생략하면 오늘",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
