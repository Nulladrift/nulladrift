      "tools": [
        {
          "name": "account_realname",
          "title": "계좌 예금주 실명 조회",
          "description": "Look up the account holder name of a Korean bank account. 대한민국 은행 계좌의 예금주명을 조회합니다. 송금 전 예금주 확인 등에 사용합니다. bank_code 또는 bank_name 중 하나는 입력해야 합니다. [호출당 60포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "account_num": {
                "description": "계좌번호 (숫자만, 하이픈 제외)",
                "type": "string"
              },
              "bank_code": {
                "description": "은행 코드 (bank_code Tool로 조회 가능, 예: 004)",
                "type": "string"
              },
              "bank_name": {
                "description": "은행명 (예: 국민). bank_code 대신 입력 가능",
                "type": "string"
              }
            },
            "required": ["account_num"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d9180a2c73a56608974c0d67c36364d926f5d8fc5ef5a6d35d1689cddd952cb5"
        },
        {
          "name": "bank_code",
          "title": "은행코드 조회",
          "description": "List Korean bank codes and names. 대한민국 은행 코드·은행명 전체 목록을 반환합니다. transfer_1won, account_realname Tool의 bank_code 입력값을 찾을 때 사용합니다. 무료입니다. [무료]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b4b022f1f836d7ca6dd5c3e57bb4b1a2e62a8f7f79253b839a431ec16eb3e0f7"
        },
        {
          "name": "crypto_market",
          "title": "암호화폐 통합 시세·김치프리미엄",
          "description": "Compare Korean-won crypto prices with global USDT prices and return the Korea premium (kimchi premium) per coin. 국내외 주요 거래소의 실시간 시세를 모아 원화 환산 기준가와 한국 시장 프리미엄을 함께 계산합니다. 일부 거래소가 응답하지 않으면 partial=true 로 나머지 시세만 돌려줍니다. [호출당 30포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "symbols": {
                "description": "심볼을 쉼표로 구분 (예: BTC,ETH,XRP). 생략하면 BTC,ETH,XRP,SOL,DOGE",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:50b7549d34f0490b6162ab4d672f4c5a66ea08f78866d8dbef4933c197f8fed8"
        },
        {
          "name": "exchange_rate",
          "title": "월평균·연평균 환율 조회",
          "description": "Monthly average and yearly average (year-to-date for the current year) exchange rates against the Korean won (KRW) for about 50 major currencies. 원화 기준 주요 통화의 월평균·연평균 환율을 월 단위로 조회합니다. month 를 생략하면 지난달이고, JPY·IDR·VND 는 100단위(unit=100) 값입니다. [호출당 5포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "description": "통화 코드를 쉼표로 구분 (예: USD,JPY,EUR). 생략하면 전체 통화",
                "type": "string"
              },
              "month": {
                "description": "조회 월 YYYYMM (예: 202609). 생략하면 지난달. 이번 달 이후는 조회 불가",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6e0b2b3edb1d71d1a74cd85ec2f478e03cb446063bcc832b0160b449f1025d23"
        },
        {
          "name": "transfer_1won",
          "title": "1원 인증",
          "description": "Send a 1 KRW verification deposit to a Korean bank account and return the 4-character verification code printed on the transaction. 대한민국 은행 계좌로 1원을 입금해 적요에 표시되는 인증코드를 반환합니다. 계좌 실소유 확인(1원 인증) 절차에 사용합니다. bank_code 또는 bank_name 중 하나는 입력해야 합니다. [호출당 60포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
