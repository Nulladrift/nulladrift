{
  "lockfileVersion": 2,
  "subjects": {
    "app.stackpick/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://stackpick.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "stackpick",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "StackPick is a read-only directory of AI dev tools ranked by job. Scores are editorial estimates, not benchmarks. Affiliate links may be used to monetize, but they never affect scores or rankings, and rankings are never sponsored. Call list_categories, then get_best_tools with a category slug. There is no API key and no write tool.",
      "tools": [
        {
          "name": "compare_tools",
          "title": "Compare tools",
          "description": "Side-by-side scores and ranks for two or more tool slugs. Each rank is within that tool's category. Rankings are never paid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slugs": {
                "description": "Two or more tool slugs to compare. Order is preserved.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5802bce9b895c797606be7fdb76d96e6e22b6cdd4f62a26ce050c1e99b1df311"
        },
        {
          "name": "get_best_tools",
          "title": "Best tools for a job",
          "description": "Ranked tools for one category slug, highest score first. Scores and order match the category page. Rankings are never paid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug from list_categories, such as ai-code-editors.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e6ff689ba01db1c0cfae80b7ba2a0eb9911f7966687a53da81dab2134afb104"
        },
        {
          "name": "get_tool",
          "title": "Get a tool",
          "description": "One StackPick tool by slug, including its category rank, score, website, and last reviewed date. Rankings are never paid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Tool slug, such as cursor.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
