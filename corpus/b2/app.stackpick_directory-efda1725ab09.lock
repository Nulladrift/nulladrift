        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List StackPick jobs and the tool slugs ranked in each one. Order matches the category pages. Rankings are never paid.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
