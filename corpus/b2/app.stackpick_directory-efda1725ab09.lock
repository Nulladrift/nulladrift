        },
        {
          "name": "latest_releases",
          "title": "Latest releases",
          "description": "Newest StackPick release notes, the same records as the changelog, newest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many releases to return, newest first. Defaults to 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
