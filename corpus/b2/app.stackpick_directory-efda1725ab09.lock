        {
          "name": "search_tools",
          "title": "Search tools",
          "description": "Search StackPick tools by name, former name, tagline, description, category, or tag. Results use the same score order as the site search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum matches to return. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Matches name, former names, tagline, description, best-for line, category, and tags.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
