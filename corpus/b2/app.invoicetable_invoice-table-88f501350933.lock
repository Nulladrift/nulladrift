            "additionalProperties": false,
            "properties": {
              "records": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "currency": {
                      "type": ["string", "null"]
                    },
                    "dueDate": {
                      "type": ["string", "null"]
                    },
                    "filename": {
                      "type": "string"
                    },
                    "invoiceDate": {
                      "type": ["string", "null"]
                    },
                    "invoiceNumber": {
                      "type": ["string", "null"]
                    },
                    "subtotal": {
                      "type": ["number", "null"]
                    },
                    "tax": {
                      "type": ["number", "null"]
                    },
                    "total": {
                      "type": ["number", "null"]
                    },
                    "vendor": {
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["records"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "csv": {
                "type": "string"
              },
              "filename": {
                "type": "string"
              },
              "mediaType": {
                "const": "text/csv",
                "type": "string"
              },
              "summary": {
