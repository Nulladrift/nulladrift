      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "invoice-table",
        "version": "0.4.4"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use Invoice Table to extract or validate invoice records and prepare spreadsheet-safe CSV. Tool requests can contain filenames, invoice text, and structured invoice fields; responses can contain derived invoice fields, validation flags, summaries, and CSV text. Invoice Table processes these inputs and outputs only for the request and does not retain them after responding. Always require human comparison with the source invoice before bookkeeping, tax, audit, payment, or accounting use. Privacy policy: https://invoicetable.app/privacy",
      "tools": [
        {
          "name": "analyze_invoice_text",
          "title": "Analyze invoice text",
          "description": "Processes the filenames and invoice text you supply to extract common fields, check dates and subtotal-plus-tax arithmetic, flag likely duplicates, and return the derived records and review summary. Invoice Table does not store the tool input or output after the response. Human source review is required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "documents": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "filename": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["filename", "text"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["documents"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "records": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "confidence": {
                      "type": "number"
                    },
                    "currency": {
                      "type": ["string", "null"]
                    },
                    "dueDate": {
                      "type": ["string", "null"]
                    },
                    "duplicate": {
                      "type": "boolean"
                    },
                    "duplicateOf": {
                      "type": ["string", "null"]
                    },
                    "filename": {
                      "type": "string"
                    },
                    "invoiceDate": {
                      "type": ["string", "null"]
                    },
                    "invoiceNumber": {
                      "type": ["string", "null"]
                    },
                    "issues": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "poNumber": {
                      "type": ["string", "null"]
                    },
                    "reviewReasons": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "reviewStatus": {
                      "enum": ["ready", "review", "blocked", "duplicate"],
                      "type": "string"
                    },
                    "subtotal": {
                      "type": ["number", "null"]
                    },
                    "tax": {
                      "type": ["number", "null"]
                    },
                    "total": {
                      "type": ["number", "null"]
                    },
                    "valid": {
                      "type": "boolean"
                    },
                    "vendor": {
                      "type": ["string", "null"]
                    },
                    "warnings": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["category", "confidence", "duplicate", "filename", "issues", "reviewReasons", "reviewStatus", "valid", "warnings"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "additionalProperties": false,
                "properties": {
                  "accountingEligibleCount": {
                    "type": "integer"
                  },
                  "arithmeticCheckedCount": {
                    "type": "integer"
                  },
                  "arithmeticMismatchCount": {
                    "type": "integer"
                  },
                  "blockedCount": {
                    "type": "integer"
                  },
                  "duplicateCount": {
                    "type": "integer"
                  },
                  "invoiceCount": {
                    "type": "integer"
                  },
                  "readyCount": {
                    "type": "integer"
                  },
                  "reviewCount": {
                    "type": "integer"
                  },
                  "totalsByCurrency": {
                    "additionalProperties": {
                      "type": "number"
                    },
                    "type": "object"
                  }
                },
                "required": ["accountingEligibleCount", "arithmeticCheckedCount", "arithmeticMismatchCount", "blockedCount", "duplicateCount", "invoiceCount", "readyCount", "reviewCount", "totalsByCurrency"],
                "type": "object"
              }
            },
            "required": ["records", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze invoice text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:af54c056a067bc02f5983a83edca239d21f3e3bdbcca30762553135356611c07"
        },
        {
          "name": "export_invoice_records",
          "title": "Prepare invoice CSV",
          "description": "Processes the reviewed invoice fields you supply and returns spreadsheet-safe CSV text, a filename, media type, and summary. Invalid and duplicate rows remain visible. Invoice Table does not store the tool input or output after the response.",
