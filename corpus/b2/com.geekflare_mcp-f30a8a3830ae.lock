        {
          "name": "webScrape",
          "description": "Scrape a webpage with custom options",
          "inputSchema": {
            "properties": {
              "aiPrompt": {
                "description": "AI-powered extraction/analysis of the scraped page, always run against the Markdown regardless of format. Shape depends on 'type': prompt (query), schema (schema), listing (itemSchema, maxItems), summary (style, focus, maxLength), sentiment (aspects), keywords (maxKeywords, includeEntities). Adds +7 credits",
                "type": "object"
