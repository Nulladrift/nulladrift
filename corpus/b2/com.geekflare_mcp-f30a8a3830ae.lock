        {
          "name": "screenshot",
          "description": "Capture a screenshot of a website",
          "inputSchema": {
            "properties": {
              "addTimestamp": {
                "default": false,
                "type": "boolean"
              },
              "blockAds": {
                "default": true,
                "type": "boolean"
              },
              "captureBeyondViewport": {
                "description": "Allow the capture to include content beyond the configured viewport",
                "type": "boolean"
              },
              "delay": {
                "description": "Seconds to wait before screenshot",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "device": {
                "default": "desktop",
                "enum": ["desktop", "mobile"],
                "type": "string"
              },
              "disableAnimations": {
                "default": false,
                "description": "Freeze CSS/JS animations and transitions before capturing",
                "type": "boolean"
              },
              "fallbackToFullPage": {
                "default": false,
                "description": "If selector is not found, fall back to a full-page capture instead of failing",
                "type": "boolean"
              },
              "fullPage": {
                "default": false,
                "type": "boolean"
              },
              "hideCookie": {
                "default": true,
                "description": "Hide cookie consent banners",
                "type": "boolean"
              },
              "highlightLinks": {
                "default": false,
                "description": "Draw borders around links (useful for AI vision)",
                "type": "boolean"
              },
              "inline": {
                "default": false,
                "description": "Return image data inline instead of a CDN URL",
                "type": "boolean"
              },
              "pageHeight": {
                "description": "Height of page for partial screenshot",
                "maximum": 5000,
                "minimum": 100,
                "type": "number"
              },
              "proxyCountry": {
                "description": "Country code for proxy routing",
                "type": "string"
              },
              "quality": {
                "default": 90,
                "description": "Image quality for JPEG/WEBP",
                "maximum": 100,
                "minimum": 10,
                "type": "number"
              },
              "removeBackground": {
                "default": false,
                "description": "Remove page background for a transparent PNG (PNG only)",
                "type": "boolean"
              },
              "scaleFactor": {
                "description": "Device pixel ratio",
                "maximum": 5,
                "minimum": 0.1,
                "type": "number"
              },
              "selector": {
                "description": "CSS selector of the element to capture, instead of the full viewport/page",
                "type": "string"
              },
              "theme": {
                "default": "auto",
                "description": "Color scheme to render before capturing",
                "enum": ["light", "dark", "auto"],
                "type": "string"
              },
              "type": {
                "default": "png",
