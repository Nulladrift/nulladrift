        {
          "name": "search",
          "description": "Search the web and return clean results in JSON, Markdown, or HTML. Also supports scraping result pages, AI grounded answers, and the full Google results page (SERP) via serp: true",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "general",
                "description": "Category filter. Ignored in SERP mode",
                "enum": ["general", "code", "pdf", "research", "linkedin", "wiki"],
                "type": "string"
              },
              "city": {
                "description": "City for localized results, using the name exactly as listed in the supported cities file, e.g. 'London,England,United Kingdom'. Works with standard search and serp: true. Supported cities: https://cdn.geekflare.com/api-assets/geotargets-2026-08-12.json",
                "type": "string"
              },
              "device": {
                "default": "desktop",
                "description": "Device to emulate when searching",
                "enum": ["desktop", "mobile"],
                "type": "string"
              },
              "excludeDomains": {
                "description": "Exclude these domains",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "format": {
                "default": "json",
                "description": "Output format. Ignored in SERP mode",
                "enum": ["json", "markdown", "html"],
                "type": "string"
              },
              "groundedAnswer": {
                "default": false,
                "description": "Generate AI-grounded answer from results. Ignored in SERP mode",
                "type": "boolean"
              },
              "includeDomains": {
                "description": "Only include these domains",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 10,
                "description": "Number of results",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "location": {
                "default": "us",
                "description": "Country code (ISO alpha-2). When city is set, city takes priority over location",
                "type": "string"
              },
              "query": {
                "description": "Search query",
                "maxLength": 2048,
                "type": "string"
              },
              "scrape": {
                "default": false,
                "description": "Scrape content from result URLs. Ignored in SERP mode",
                "type": "boolean"
              },
              "scrapeLimit": {
                "default": 3,
                "description": "Number of URLs to scrape (requires scrape: true). Ignored in SERP mode",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "serp": {
                "default": false,
                "description": "Return the full Google results page: organic results, AI Overview, related searches, People Also Ask and pagination (first page only). Supports query, location, city, device, limit, source (one value), time, includeDomains and excludeDomains; category, format, scrape and groundedAnswer are ignored",
                "type": "boolean"
              },
              "source": {
                "default": "web",
                "description": "Search source. SERP mode accepts one source per request",
                "enum": ["web", "news", "images"],
                "type": "string"
              },
              "time": {
                "default": "any",
                "description": "Time filter: any, h, d, w, m, y, or with a count like h2, h6, d7",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Web Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7fc963f92685a9fff070a759026192db9e84110be0b25c3fa1f03e83e5d09cbd"
