        {
          "name": "list_regions",
          "title": "Regions",
          "description": "Bulgaria, its 6 NUTS2 regions and 28 oblasts with their slugs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
