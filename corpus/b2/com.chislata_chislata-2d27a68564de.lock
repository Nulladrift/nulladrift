        {
          "name": "search_datasets",
          "title": "Search the catalogue",
          "description": "Find datasets from NSI and Eurostat (population, income, poverty, prices, employment, GDP, climate …) by words of their Bulgarian title. Without a query, lists all of them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Words to look for, best in Bulgarian, e.g. „население общини“ or „инфлация“.",
                "maxLength": 100,
                "type": "string"
              },
              "source": {
                "description": "Publisher.",
                "enum": ["НСИ", "Евростат"],
                "maxLength": 100,
                "type": "string"
              },
              "topic": {
                "description": "Topic.",
                "enum": ["labour", "income", "population", "society", "eu", "prices", "economy", "climate"],
                "maxLength": 100,
                "type": "string"
