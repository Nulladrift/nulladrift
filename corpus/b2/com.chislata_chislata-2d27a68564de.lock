          "title": "Elections",
          "description": "Parliamentary (since 1991) and presidential (since 1992) elections: date, voters, turnout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "type": {
                "description": "ns = parliament, pr = president.",
                "enum": ["ns", "pr"],
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
