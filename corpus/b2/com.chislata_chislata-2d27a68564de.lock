{
  "lockfileVersion": 2,
  "subjects": {
    "com.chislata/chislata": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://chislata.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "chislata",
        "title": "Числата",
        "version": "1.1.0",
        "websiteUrl": "https://chislata.com/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Public data of Bulgaria from Числата (chislata.com): wages (NSI), population and vital statistics by municipality, elections since 1991 (CIK) and 100+ datasets from NSI and Eurostat. Labels are in Bulgarian; amounts are in euro unless a field says bgn. When you use a number, cite the source given in the result and link the page in `page`. Start with search_datasets, get_municipality or list_elections.",
      "tools": [
        {
          "name": "get_activity_wages",
          "title": "Wages by economic activity",
          "description": "Average gross monthly wage by year for an economic activity; also public/private sector or men/women.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "activity": {
                "description": "Activity slug from list_activities.",
                "maxLength": 100,
                "pattern": "[a-z0-9][a-z0-9\\-]{0,63}",
                "type": "string"
              },
              "breakdown": {
                "description": "Which wage.",
                "enum": ["total", "public", "private", "men", "women"],
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["activity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Wages by economic activity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81c8164ddec985fd0863a148283f07003c452ee47bbb21282de172ab8252606b"
        },
        {
          "name": "get_dataset",
          "title": "Dataset dimensions",
          "description": "Title, period, source and the dimensions of a dataset with their codes and labels, needed for get_dataset_data filters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset_id": {
                "description": "Dataset id from search_datasets, e.g. nsi-1169.",
                "maxLength": 100,
                "pattern": "[a-z]+-[A-Za-z0-9_\\-]{1,60}",
                "type": "string"
              }
            },
            "required": ["dataset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dataset dimensions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b504ce13afdf175d2c15526408471f659582945fc7b520d4e2157e0d0537add1"
        },
        {
          "name": "get_dataset_data",
          "title": "Dataset values",
          "description": "Values of a dataset, filtered by dimension codes (from get_dataset) and period. At most 2000 rows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset_id": {
                "description": "Dataset id, e.g. nsi-1169.",
                "maxLength": 100,
                "pattern": "[a-z]+-[A-Za-z0-9_\\-]{1,60}",
                "type": "string"
              },
              "filters": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Dimension → code, e.g. {\"EKATTE\": \"PDV23\", \"GenderID\": \"0\"}.",
                "maxProperties": 10,
                "type": "object"
              },
              "from": {
                "description": "First period, e.g. 2015 or 2015-01.",
                "maxLength": 100,
                "pattern": "[0-9]{4}(-[0-9]{2}|-?Q[1-4]|-S[12])?",
                "type": "string"
              },
              "to": {
                "description": "Last period.",
                "maxLength": 100,
                "pattern": "[0-9]{4}(-[0-9]{2}|-?Q[1-4]|-S[12])?",
                "type": "string"
              }
            },
            "required": ["dataset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dataset values"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17f19d176c4f68862122004e8ee87140de6002e2c98128195cf8632d153bfadc"
        },
        {
          "name": "get_election_results",
          "title": "Election results",
          "description": "Votes and shares of every party or candidate in the country, abroad or by oblast.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "election_id": {
                "description": "Election id from list_elections, e.g. ns2026 or pr2026-t2.",
                "maxLength": 100,
                "pattern": "[a-z0-9][a-z0-9\\-]{0,63}",
                "type": "string"
              },
              "level": {
                "description": "country (default), abroad or oblast.",
                "enum": ["country", "abroad", "oblast"],
                "maxLength": 100,
                "type": "string"
              },
              "unit": {
                "description": "For level oblast: one oblast slug, e.g. varna. Omit for all.",
                "maxLength": 100,
                "pattern": "[a-z0-9][a-z0-9\\-]{0,63}",
                "type": "string"
              }
            },
            "required": ["election_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Election results"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b69834beaaae14c6f5b69d0d0a7dbe7556854379bb602eb0c9cdd2b117303821"
        },
        {
          "name": "get_municipality",
          "title": "Municipality profile",
          "description": "Population, births and deaths by year for one of the 265 municipalities, by its Bulgarian name (e.g. Първомай, Столична) or EKATTE code, with the link to its page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Municipality name in Bulgarian, its slug or EKATTE code.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Municipality profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ba2bd7280f4168e956966360d778f47afcb16d79d24d00b95191f7df20adb9b"
        },
        {
          "name": "get_occupation_wages",
          "title": "Wages by occupation",
          "description": "Gross, median and net monthly wage by occupation class from the NSI Structure of Earnings survey (every 4 years). Without a year, the latest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "sex": {
                "description": "all, men or women.",
                "enum": ["all", "men", "women"],
                "maxLength": 100,
                "type": "string"
              },
              "year": {
                "description": "Survey year.",
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Wages by occupation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df5057d887d3415d570670164c930f3e2bb01170ae54c93277be829dd26502b8"
        },
        {
          "name": "get_region_wages",
          "title": "Wages by region",
          "description": "Average gross monthly wage by year (2008–) for Bulgaria, a NUTS2 region or an oblast, in euro and leva, with the number of employees.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "region": {
                "description": "Region slug from list_regions, e.g. bulgaria, plovdiv, sofiya-stolitsa.",
                "maxLength": 100,
                "pattern": "[a-z0-9][a-z0-9\\-]{0,63}",
                "type": "string"
              }
            },
            "required": ["region"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Wages by region"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fddabe28f0e273abfad4fdb34aeeb83d255d697c60a1b599f4c7f3e277d5fb26"
        },
        {
          "name": "list_activities",
          "title": "Economic activities",
          "description": "The economic activities (NACE sections, КИД-2008) with their slugs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
