{
  "lockfileVersion": 2,
  "subjects": {
    "app.apick/vision": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://apick.app/mcp/vision"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "app.apick/vision",
        "title": "APICK Vision",
        "version": "0.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "extract_video_thumbnail",
          "title": "동영상 미리보기 이미지 추출",
          "description": "Extract preview thumbnail images from a video at regular intervals and return them as a ZIP file. 동영상에서 일정 구간마다 미리보기 이미지를 추출해 ZIP 파일로 반환합니다. [호출당 10포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "description": "추출할 이미지 개수 (범위: 0 ~ 200, 기본값 100)",
                "type": "string"
              },
              "video_url": {
                "description": "다운로드 가능한 https URL (허용 형식: video/mp4, video/quicktime, video/x-msvideo, video/webm, video/x-matroska) (최대 200MB)",
                "type": "string"
              },
              "width": {
                "description": "이미지 가로 길이 (범위: 100 ~ 2000, 기본값 480). 세로 길이는 가로 비율에 따라 자동 계산",
                "type": "string"
              }
            },
            "required": ["video_url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:131ebc95bb84541bb86dbb720cd7a737f78a59f68dfc90f3607045ad835902d6"
        },
        {
          "name": "face_detection",
          "title": "이미지 얼굴 인식",
          "description": "Detect faces in an image and return their coordinates. 이미지 파일에서 얼굴을 인식해 해당 좌표를 반환합니다. use_feature=1 입력 시 얼굴 특징 정보를 함께 반환합니다. [호출당 3포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "image_url": {
                "description": "다운로드 가능한 https URL (허용 형식: image/jpeg, image/png, image/webp, image/bmp) (최대 50MB)",
                "type": "string"
              },
              "threshold": {
                "description": "얼굴 추출 민감도 (범위: 0 ~ 0.9, 기본값 0.5, 높을수록 정확한 얼굴만 추출)",
                "type": "string"
              },
              "use_feature": {
                "description": "얼굴 특징 정보 포함 여부 (포함: 1, 미포함: 0, 기본값 0)",
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2b31dbf4e40fa28b2baf5f779e25f7f04f678bc37bd6d5008800fdb9758e417"
        },
        {
          "name": "image_similarity",
          "title": "이미지 유사도 비교",
          "description": "Compare a base image with another image and return a similarity score. 기준 이미지와 비교 대상 이미지의 유사도를 분석해 점수를 반환합니다. 원본 검증, 중복 이미지 탐지 등에 사용합니다. [호출당 10포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compare_image_url": {
                "description": "다운로드 가능한 https URL (허용 형식: image/jpeg, image/png, image/webp, image/bmp) (최대 50MB)",
                "type": "string"
              },
              "image_url": {
                "description": "다운로드 가능한 https URL (허용 형식: image/jpeg, image/png, image/webp, image/bmp) (최대 50MB)",
                "type": "string"
              }
            },
            "required": ["compare_image_url", "image_url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3adde8b6d90fa0cf575450982f7bf7ee1676495d5568c8c56db377fb098f248e"
        },
        {
          "name": "nsfw_detection",
          "title": "선정적인 컨텐츠(NSFW) 탐지",
          "description": "Detect whether an image contains NSFW (violent or sexually explicit) content and return an nsfw_score. 이미지가 NSFW(폭력적·선정적) 콘텐츠인지 탐지해 nsfw_score 를 반환합니다. detail=1 입력 시 세부 판정 결과를 함께 반환합니다. [호출당 10포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "description": "세부 판정 결과 포함 여부 (포함: 1, 미포함: 0, 기본값 0)",
                "type": "string"
              },
              "image_url": {
                "description": "다운로드 가능한 https URL (허용 형식: image/jpeg, image/png, image/webp, image/bmp) (최대 50MB)",
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f9ad702b7aa142a5c05d6c86a3fef681ed7c87cabeb5998eeb1e6eee0e2c773"
        },
        {
          "name": "video_to_mp3",
          "title": "동영상 MP3 추출",
          "description": "Extract the audio track of a video file as an MP3 file. 동영상 파일에서 오디오를 추출해 MP3 파일로 반환합니다. [호출당 30포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "video_url": {
                "description": "다운로드 가능한 https URL (허용 형식: video/mp4, video/quicktime, video/x-msvideo, video/webm, video/x-matroska) (최대 200MB)",
                "type": "string"
              }
            },
            "required": ["video_url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96fd99aea3b74ee3e0aab277072799ee1403539b2d7b5a46b850f38ec2ef8f20"
        },
        {
          "name": "word_cloud",
          "title": "워드클라우드 생성",
          "description": "Generate a word cloud image (JPEG) from input text, sizing each word by frequency. 입력 텍스트를 구성하는 단어의 중요도(빈도수)에 따라 서로 다른 크기의 단어로 이루어진 워드클라우드 이미지(JPEG)를 생성해 반환합니다. [호출당 10포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "text": {
                "description": "워드클라우드를 생성할 텍스트",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ded206286609ce0057b73a73875d76a0cf0a63921744a558605b6d924b7032c"
        }
      ],
      "digest": "sha256:0c41fd598ff1ff2df0a914b5ddef3630e4bde9612e48f7650a0b5df3144f4610"
    }
  }
}
