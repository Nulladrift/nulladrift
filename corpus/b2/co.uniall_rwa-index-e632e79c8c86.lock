        {
          "name": "check_eligibility",
          "title": "Check investor eligibility",
          "description": "Answers whether a given investor profile can buy or hold one UNIALL asset, and why. Combines sourced offering rules with the on-chain transferability oracle. Returns ELIGIBLE | NOT_ELIGIBLE | REQUIRES_ONBOARDING | UNKNOWN. UNKNOWN when rules are missing or older than 90 days. Informational only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assetId": {
                "type": "string"
              },
              "investmentUsd": {
                "type": "number"
              },
              "investorType": {
                "enum": ["RETAIL", "ACCREDITED", "QUALIFIED_PURCHASER", "PROFESSIONAL", "INSTITUTIONAL"],
                "type": "string"
              },
              "jurisdiction": {
                "type": "string"
              },
              "walletAddress": {
                "type": "string"
              }
            },
            "required": ["assetId", "investorType", "jurisdiction"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "Short natural-language summary of the result.",
                "type": "string"
              },
              "assets": {
                "description": "Matched assets when applicable (find_assets). Empty or omitted for stats/summary tools.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "aum_usd": {
                      "type": ["number", "null"]
                    },
                    "category": {
                      "type": ["string", "null"]
                    },
                    "chains": {
