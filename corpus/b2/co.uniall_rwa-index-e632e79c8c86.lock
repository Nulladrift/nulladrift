        {
          "name": "screen_eligible_assets",
          "title": "Screen eligible assets",
          "description": "Screens the UNIALL index for assets this investor profile can buy or hold (ELIGIBLE or REQUIRES_ONBOARDING). SQL-filters offering rules first; on-chain checks only for the current page. Informational only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
