        {
          "name": "find_assets",
          "title": "Find tokenized assets",
          "description": "Searches the UNIALL index of tokenized real-world assets by free-text query (name, ticker, issuer) and filters for category, chain, issuer, underlying ticker, AUM, transfer standard and verification. Use `underlying` (e.g. QQQ) to return only wrappers of that spot underlier — leveraged/inverse products (TQQQ, SQQQ, PSQ, QLD, QQQI) are excluded. Results include verified and unverified assets; verified assets rank first. Set verified_only=true to return verified assets only. Category keys: equities, real_estate, etfs_funds, commodities_precious_metals, private_credit, treasuries (includes money market funds), money_market, commodities_other, structured_products, collectibles, corporate_bonds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Asset category key or list of keys. One of: equities, real_estate, etfs_funds, commodities_precious_metals, private_credit, treasuries, money_market, commodities_other, structured_products, collectibles, corporate_bonds.",
                "oneOf": [
                  {
                    "enum": ["equities", "real_estate", "etfs_funds", "commodities_precious_metals", "private_credit", "treasuries", "money_market", "commodities_other", "structured_products", "collectibles", "corporate_bonds"],
                    "type": "string"
                  },
                  {
                    "items": {
                      "enum": ["equities", "real_estate", "etfs_funds", "commodities_precious_metals", "private_credit", "treasuries", "money_market", "commodities_other", "structured_products", "collectibles", "corporate_bonds"],
                      "type": "string"
                    },
                    "maxItems": 11,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "chain": {
                "description": "Blockchain name, e.g. ethereum, base, polygon, solana",
                "type": "string"
              },
              "issuer": {
                "description": "Issuer name or alias, case-insensitive, e.g. BlackRock, Ondo",
                "type": "string"
              },
              "limit": {
                "description": "Max matches to return (default 5).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_aum_usd": {
                "description": "Minimum assets under management in USD",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Free-text search over asset name, symbol, underlying name/ticker, and issuer name (e.g. BUIDL, BlackRock).",
