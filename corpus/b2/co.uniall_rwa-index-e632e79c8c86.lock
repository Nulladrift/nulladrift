                    },
                    "name": {
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "transfer_standard": {
                      "type": ["string", "null"]
                    },
                    "uniall_url": {
                      "type": "string"
                    },
                    "verified": {
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                },
