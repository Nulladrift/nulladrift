              "transfer_standard": {
                "description": "On-chain transfer restriction standard filter (e.g. erc-3643 for T-REX permissioned tokens, securitize-ds, erc1404).",
                "enum": ["erc-3643", "erc-7943", "erc1404", "securitize-ds", "whitelist", "permissionless"],
                "type": "string"
              },
              "underlying": {
                "description": "Spot underlying ticker (e.g. QQQ). Matches stored underlying fields and issuer-suffixed symbols (QQQON, QQQx, QQQB, RQQQ). Excludes leveraged/inverse products of that underlier.",
