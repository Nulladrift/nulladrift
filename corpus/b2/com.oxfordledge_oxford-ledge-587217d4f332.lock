      "instructions": "Oxford Ledge MCP provides public U.S. financial data -- SEC EDGAR filings and XBRL fundamentals, institutional and insider ownership, BDC private-credit holdings, and FRED/Treasury macro series. All figures are as-filed or as-published and may be lagged, revised, or incomplete; SEC ownership filings are periodic and can be up to 45 days behind. This data is informational only and is not investment, financial, legal, or tax advice. Each tool's caveats arrive with its answer, in the response's tool_notes field. Terms: https://www.oxfordledge.com/terms\n\nTools are grouped by the data they return: company fundamentals (front door: search_company, which resolves a company name or ticker to its SEC identity), filings and disclosure, insiders and institutions (front door: ol_13f_filer_search, which resolves a fund manager's name to its 13F CIK), BDC and private credit (front door: search_bdc_borrower, which resolves a borrower name to the borrower_norm that ol_bdc_borrower_dispersion and ol_borrower_profile take), bonds and rates (front door: get_yield_curve, which returns, by default, the Treasury curve plus the main US macro series, including CPI, unemployment, payrolls and GDP), macro and FRED, news and events, portfolio, and learn and reference. 50 of the 65 tools answer an anonymous caller. The other 15 need an Oxford Ledge API key, and 4 of those 15 also need the Researcher plan on that key; tools/list marks them with requires_key: true or min_tier. MCP access and API keys are free; a key is configured by the person who operates the MCP client, in the client's own settings, and is never part of the conversation. Anonymous calls share an hourly limit per network address; a key has its own hourly allowance, and paid plans raise it. A refused tool call answers isError: true with an error code and whether a retry can help, in _meta.error and again in its last content item.",
      "tools": [
        {
          "name": "get_13f_holdings",
          "title": "13F Holdings of a Fund",
          "description": "What one institutional filer owns: the largest positions in its latest SEC 13F-HR, plus QoQ changes (keyless: from stored quarters). Accepts a numeric CIK (preferred), a ticker (BRK-B or BRK.B for Berkshire), or a filer NAME (3-80 characters): ONE name-prefix match in the curated 13F filer universe resolves to its CIK (`resolved_from` says so); an ambiguous name is refused with candidates, never guessed. Returns {cik, fundName, filingDate, periodOfReport, totalHoldings, totalValue, holdings}; rows carry name, title_of_class, value (whole USD), shares, type, position_type, lots. There is NO ticker field and `cusip` is stripped on every channel (no plan carries a CUSIP Global Services licence today); `title_of_class` is the share-class discriminator. `position_type` is COM|PRN|PUT|CALL: do NOT sum across types. Source: SEC EDGAR 13F-HR, ~45-day quarterly delay. Heavy operation, max 2 concurrent.",
          "inputSchema": {
            "properties": {
              "fund": {
                "description": "Fund CIK number (e.g. 1067983 for Berkshire Hathaway) -- preferred. A ticker is resolved via SEC's company map: letters with at most one class suffix (e.g. BLK, or BRK-B / BRK.B -- SEC lists Berkshire as BRK-A / BRK-B, so bare 'BRK' does not resolve). A filer NAME (3-80 chars) resolves when exactly one curated filer name starts with it; otherwise the error names ol_13f_filer_search. Any other shape is rejected as INVALID_PARAMS.",
                "type": "string"
              },
              "max_holdings": {
                "description": "Maximum number of holdings to return (default 50)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["fund"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:de6701a89a6612211e2710542e1c265fd7af2fd12129fb849cbaaf00ef3826ba"
        },
        {
          "name": "get_access_status",
          "title": "Access Status",
          "description": "Who this server resolved the caller as (caller.kind api_key / bearer / cookie / anonymous, key_presented, key_accepted), the plan, the hourly data-tool budget left (anonymous calls share one budget per network address), and data_through for the 13F and BDC stores. Asking does not spend that budget. A rejected key is refused 401 invalid_api_key before any tool runs. No personal data. Source: Oxford Ledge account and store metadata.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
