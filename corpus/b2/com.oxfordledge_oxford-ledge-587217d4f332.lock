          "digest": "sha256:0da95bc37929b57b2ce985cfd2821f69f3ad8e80ae75fdb8c28fb65d92141003"
        },
        {
          "name": "get_activist_stakes",
          "title": "Activist Stakes (13D/13G)",
          "description": "Schedule 13D/13G >5% beneficial-owner filings for a ticker -- event-driven stake-building, unlike quarterly 13F. Returns {ticker, count, filings}, newest first, limit default 50 (hard cap 200); rows carry filer_name, filing_date, form_type, shares, percent_of_class, accession_number and is_activist (a FORM-TYPE label: true iff the form is a 13D, not a judgement). `reports_zero` is the filer's own statement that it no longer owns more than 5% -- an exit OR a reporting realignment, so cross-check get_institutional_holders before reading it as a sale. FRESHNESS: keyless callers are served STORED rows and never trigger the EDGAR refresh -- read `stale` and `stale_basis`. Complements get_institutional_consensus. Source: SEC EDGAR.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max filings to return (default 50)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "Stock ticker symbol (e.g. AAPL)",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
