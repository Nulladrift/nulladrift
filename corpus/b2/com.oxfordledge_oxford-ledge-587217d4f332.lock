        },
        {
          "name": "get_bdc_holdings",
          "title": "BDC Holdings",
          "description": "One BDC's portfolio holdings at its latest SERVED SEC filing, paged: `limit` (default 40, max 100) and `offset` window the `holdings` rows (borrower, industry, security type, lien, rate, maturity, par/cost/fair value, mark); `page` and `completeness` say what is left, and every total is the whole filing's. A withheld filing is never served as the book (`withheldFilings` names it). Money is whole USD; marks are percent of par. get_bdc_list lists the tickers. Source: SEC EDGAR schedule-of-investments, Oxford Ledge parse.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Holding rows per page (default 40, max 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Rows to skip before the page (default 0). Past the end returns an empty page with page.total intact.",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "ticker": {
                "description": "BDC ticker, e.g. ARCC (get_bdc_list lists them).",
                "type": "string"
