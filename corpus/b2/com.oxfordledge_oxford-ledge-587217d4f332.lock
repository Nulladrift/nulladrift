            "readOnly": true
          },
          "digest": "sha256:3026314eda801f8a39925565be452cc3def611d7631a69ed803677f777e6d72d"
        },
        {
          "name": "get_debt_maturities",
          "title": "Debt Maturities",
          "description": "Forward debt maturity ladder parsed from the latest 10-K/20-F footnote. Returns {ticker, maturities:[{year, amount}], thereafter, confidence, confidence_score, source, validation}. AMOUNTS ARE IN MILLIONS OF USD, not raw dollars -- 400 means $400M. THE LADDER IS AS OF the filing date, not today: the current-year bucket may already be repaid or refinanced. Check `validation` (the balance-sheet cross-check) before quoting a total. Every empty answer carries `refusal_reason` and a readable `refusal_note`. For historical issuance/repayment use get_capital_allocation. Source: SEC EDGAR 10-K note extraction. Requires Researcher tier.",
          "inputSchema": {
            "properties": {
