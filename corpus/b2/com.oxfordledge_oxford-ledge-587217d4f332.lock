            "readOnly": true
          },
          "digest": "sha256:716781fbb88dbe92a9798551874ebc6f336c4d48eb6ec53a6acbc380547a2bb0"
        },
        {
          "name": "get_anomaly_flags",
          "title": "Red-Flag Screens",
          "description": "Run 15 red-flag screens on a ticker (short interest >12%, Altman Z distress, net leverage >4x, negative FCF, P/E >50, dividend yield >6%, insider net selling, revenue decline, payout >90%, goodwill >50% of assets, SBC >10% of revenue, declining ROIC and others). Returns {ticker, available, flags, count}; each flag is {severity, label, detail, scrollTo}: SEVERITY IS ONLY 'red' OR 'amber', red first. A flag is a question to investigate, NOT a sell signal. available: false (+ reason, no flags) = not checked. Empty flags is no all-clear either: a screen missing its input is skipped. Pair with get_fundamentals and ol_intrinsic_value. Source: vendor quote/fundamentals snapshot plus computed heuristics. Needs a free Oxford Ledge API key that the client's operator configures.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "Stock ticker symbol (e.g. AAPL)",
                "type": "string"
