        {
          "name": "get_fails_to_deliver",
          "title": "Fails to Deliver",
          "description": "SEC fails-to-deliver history for one ticker -- the settlement-failure side of short pressure. Returns {ticker, days, history, count, window, coverage, as_of, summary}; each row is {date (settlement date), fails (SHARES, not dollars), price (USD), description}, OLDEST-FIRST. `days` (default 180, hard cap 730) is anchored to the latest LOADED settlement date, not to today; `end_date` ends it elsewhere. An empty or thin history describes the loaded SEC files, not an absence of fails: read `coverage` and `summary` before reading a gap. Prices are NOT split-adjusted. An unreachable store REFUSES (DATA_UNAVAILABLE). Pair with ol_short_interest_trend for the other half. Source: SEC Fails-to-Deliver dataset (published twice monthly, ~3-week lag).",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Trailing window in days (default 180, max 730), ending at `as_of` unless end_date is given",
