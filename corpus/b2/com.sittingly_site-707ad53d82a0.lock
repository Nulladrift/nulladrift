          "digest": "sha256:9e0d99ef3254ac1e4947356cee2c24c10a3b984e2cea0e043d0dbacfc5c009e8"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Sittingly dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
