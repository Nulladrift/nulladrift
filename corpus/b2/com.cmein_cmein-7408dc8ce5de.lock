        },
        {
          "name": "see_examples",
          "title": "See what the photos look like",
          "description": "Where to see CMeIn's actual output: the examples gallery, organised by scene, plus the accounts where new work is posted, and how many scenes the product offers. Use this when someone wants to judge the results for themselves rather than read about them. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
