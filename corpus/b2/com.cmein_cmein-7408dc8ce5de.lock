      "serverInfo": {
        "name": "cmein",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CMeIn turns a handful of ordinary phone photos of someone into realistic, candid photos of them — out in the world, doing things. No beautifying, no studio headshots. Over 4,500 scenes to choose from.\n\nSix tools need no account. photo_advice answers questions about photos of yourself from CMeIn's published articles; cmein_pricing and cmein_info read the site's own pages, so their numbers and terms are current rather than remembered; see_examples and find_video point at the actual output; contact_us sends a real message to a real person, and should only be called when someone asks for that.\n\nFour more work on the signed-in account and will prompt to connect it: my_credits, my_generations, find_scene and request_credits_back. find_scene is for recommending — describe what someone is after and it finds the scenes that fit. Generating the photo itself is done in the app and is not available through these tools.\n\nAnswers from the articles and pages carry a source link — keep it. Tools that act on a person's own photos and credits need an account and are not available yet.",
      "tools": [
        {
          "name": "cmein_info",
          "title": "Read a CMeIn information page",
          "description": "Reads one of CMeIn's own information pages and returns its text with the link: \"pricing\" — what CMeIn costs — credit packs, the price of one photo, and that there is no subscription; \"examples\" — the gallery of generated photos, by scene, and whose photos they are; \"faq\" — how many reference photos are needed, whether results look like you, what happens to uploads, whether dating apps allow them; \"about\" — who builds CMeIn and why it only does candid realism; \"refund\" — when a refund applies, the time limit, and how to ask for one; \"careers\" — whether CMeIn is hiring and what it would hire for; \"guides\" — the guides index — longer how-to writing on taking and choosing profile photos; \"bestAngle\" — how to choose which photo to lead with, what a photographer actually judges in a portrait, and the free tool that scores and ranks up to six of your photos; \"terms\" — the terms of service; \"privacy\" — the privacy policy — what is collected and what happens to uploaded photos. Read live at request time, so terms, policies and open roles are current rather than remembered. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Which page to read.",
                "enum": ["pricing", "examples", "faq", "about", "refund", "careers", "guides", "bestAngle", "terms", "privacy"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a CMeIn information page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f94b5cdfb4dc6389d60521ee4a4a7d05c53e2ca41004d5f8b397a0938d87bd2a"
        },
        {
          "name": "cmein_pricing",
          "title": "What CMeIn costs",
          "description": "What CMeIn costs: the credit packs and their prices, how many credits one generated photo spends, and that there is no subscription. Read from the live pricing page at request time, so the figures are current. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What CMeIn costs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9674092affed32ea8b0f379c00a74a6f995bcf01821d5a211d4909f5342eecbc"
        },
        {
          "name": "contact_us",
          "title": "Send a message to CMeIn",
          "description": "Sends a message to CMeIn's support inbox and gets a reply by email. For questions the articles and pages do not answer, problems with an order, or anything that needs a person. Needs an email address to reply to. No account needed. This sends a real message to a real person — only call it when someone has asked to be put in touch, and show them the text first. For a refund of unspent credits, see the refund policy via cmein_info(\"refund\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Where the reply should go. Required.",
                "format": "email",
                "maxLength": 255,
                "type": "string"
              },
              "message": {
                "description": "The message, in the person's own words.",
                "maxLength": 5000,
                "minLength": 10,
                "type": "string"
              },
              "name": {
                "description": "What to call them, if they said.",
                "maxLength": 120,
                "type": "string"
              },
              "subject": {
                "description": "One line saying what it is about.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["email", "message", "subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a message to CMeIn"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0e462cdb93cacbfb29cc229cba7083c118093eeb6b497c729dd812bf5d6db15f"
        },
        {
          "name": "find_scene",
          "title": "Find a scene to be photographed in",
          "description": "Searches CMeIn's scene catalogue — over 4,500 settings, filtered to the ones that suit this account. Use it to recommend one: describe what the person is after and it finds the scenes that fit. Generating the photo itself is done in the app. Needs the \"scenes:read\" permission.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many to return. Default 12.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "A place, activity or setting — \"cafe\", \"hiking\", \"rooftop\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a scene to be photographed in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e0d9077696a5ad28a65c61e3e37f58924ee0537bb20cd25a06cfa3607d21c64"
        },
        {
          "name": "find_video",
          "title": "Find a CMeIn short film",
          "description": "Finds one of CMeIn's short films by what it is about. The films are dating scenarios — money and dating, who pays, why people run, what she actually said — and every character in them is generated by CMeIn, which is the point they are making. Returns titles, links and view counts. Covers the 15 most recent films only. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "about": {
                "description": "What the film should be about. Leave empty for the newest ones.",
                "maxLength": 300,
                "type": "string"
              },
              "limit": {
                "description": "How many to return. Default 3.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a CMeIn short film"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c095004a74f51c2863503988d1b98f433939fbc8e07c8ba6d05be51a870c132d"
        },
        {
          "name": "my_credits",
          "title": "How many credits you have",
          "description": "The credit balance on the signed-in CMeIn account, and roughly how many photos that buys. Needs the \"credits:read\" permission.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "How many credits you have"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:03f8366b8c124a1ed09a804688425fb2a53d697961f494a8d394af2b653dffc7"
        },
        {
          "name": "my_generations",
          "title": "What you have made",
          "description": "The most recent photos generated on this account — the scene each one was, whether it finished, and when. The images themselves stay in the app rather than passing through here. Needs the \"photos:read\" permission.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many to list. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What you have made"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e7dadee4c556ba50413c6adbe13d9297673e8f08d415201a8ffcf05619d3a603"
        },
        {
          "name": "photo_advice",
          "title": "Ask about dating-profile photos",
          "description": "Answers a question about dating-profile photos — what works, what does not, lighting, angles, backgrounds, expressions, what dating apps do with them — from CMeIn's published articles. Returns the relevant passages with a link to each source article, and the date the content was last synced. No account needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many articles to draw from. Default 3.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "The question, in the words the person asked it.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask about dating-profile photos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dbdcba8c493b631562164a88457d3d72a60e74681d7a817d52a74fb74359c304"
        },
        {
          "name": "request_credits_back",
          "title": "Ask for credits back",
          "description": "Opens a request for credits to be returned when a generated photo did not look like the person. It goes to a human and is answered by email; the refund policy decides the outcome, not this tool. Needs the \"support:write\" permission.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "generationId": {
                "description": "The generation it is about, from my_generations.",
                "format": "uuid",
                "type": "string"
              },
              "reason": {
                "description": "What was wrong with the photo, in the person's own words.",
                "maxLength": 5000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["reason"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
