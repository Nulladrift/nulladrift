          },
          "digest": "sha256:8c3fbb9ad669a7f3e96bd9075430230bcf0afbf0c5f1db12bb7f48fe9f1864ec"
        }
      ],
      "digest": "sha256:8ca7a0016d090257496cdc83bb6146dabb7653420b67a1a4b967e504f6e4da96"
    }
