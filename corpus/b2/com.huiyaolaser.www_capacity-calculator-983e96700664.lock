      "tools": [
        {
          "name": "calculate_battery_line_capacity",
          "title": "Calculate Battery Line Capacity",
          "description": "Estimate theoretical and OEE-adjusted annual battery-cell and energy output from line throughput, schedule, OEE, nominal cell voltage, and nominal cell capacity. Use for early production-line sizing and scenario checks; results are engineering estimates, not guaranteed output.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cell_capacity_ah": {
                "description": "Nominal capacity of one cell in ampere-hours.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "cell_voltage_v": {
                "description": "Nominal voltage of one cell in volts.",
                "exclusiveMinimum": 0,
                "maximum": 20,
                "type": "number"
              },
              "hours_per_shift": {
                "description": "Scheduled hours in each shift.",
                "exclusiveMinimum": 0,
                "maximum": 24,
                "type": "number"
              },
              "oee_percent": {
                "description": "Overall equipment effectiveness as a percentage from 0 to 100.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "operating_days_per_year": {
                "description": "Scheduled operating days per year.",
                "maximum": 366,
                "minimum": 1,
                "type": "integer"
              },
              "shifts_per_day": {
                "description": "Number of scheduled production shifts per day.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "throughput_cells_per_minute": {
                "description": "Steady-state cell throughput in cells per minute.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              }
            },
            "required": ["cell_capacity_ah", "cell_voltage_v", "hours_per_shift", "oee_percent", "operating_days_per_year", "shifts_per_day", "throughput_cells_per_minute"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cell_output": {
                "additionalProperties": false,
                "properties": {
                  "oee_adjusted_cells_per_year": {
                    "type": "number"
                  },
                  "theoretical_cells_per_year": {
                    "type": "number"
                  }
                },
                "required": ["oee_adjusted_cells_per_year", "theoretical_cells_per_year"],
