                    "type": "number"
                  },
                  "theoretical_gwh_per_year": {
                    "type": "number"
                  },
                  "theoretical_mwh_per_year": {
                    "type": "number"
                  }
                },
                "required": ["oee_adjusted_gwh_per_year", "oee_adjusted_mwh_per_year", "theoretical_gwh_per_year", "theoretical_mwh_per_year"],
                "type": "object"
