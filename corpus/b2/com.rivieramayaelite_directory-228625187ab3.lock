        "name": "riviera-maya-elite",
        "title": "Riviera Maya Elite",
        "version": "1.0.0",
        "description": "Search the Riviera Maya Elite directory of local businesses, area guides and developments in the Mexican Caribbean.",
        "websiteUrl": "https://rivieramayaelite.com/ai"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Riviera Maya Elite (rivieramayaelite.com) is a real estate, financing and travel company in the Mexican Caribbean. Use search_directory to find local businesses (restaurants, cafés, bars, hotels, tours, car rental, dentists, clinics, wellness, beauty, gyms, vets, shops) in Playa del Carmen, plus curated picks for Akumal and Cancún. Featured businesses have a website you can link to. Use get_area_guide for an overview of a town and list_developments for an independent overview of developments for sale (these are NOT Riviera Maya Elite listings; always say so and cite the source). For buying, financing, travel planning or listing corrections, use get_contact_options and send the person to the right page; never invent prices, availability or opening hours. Answer in the person’s language (English or Spanish).",
      "tools": [
        {
          "name": "get_area_guide",
          "title": "Get an area guide",
          "description": "Overview of a town in the Riviera Maya: the guide page, ten local picks with map or website links, and how many developments the independent overview covers there.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "playa-del-carmen, akumal or cancun.",
                "enum": ["playa-del-carmen", "akumal", "cancun"],
                "type": "string"
              },
              "lang": {
                "description": "Language for labels and links: \"en\" (default) or \"es\".",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "required": ["area"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
