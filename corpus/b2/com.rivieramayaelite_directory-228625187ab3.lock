          "title": "How to contact Riviera Maya Elite",
          "description": "Links to Riviera Maya Elite’s pages for buying property, mortgage pre-qualification, travel planning, general contact, and for business owners to claim, correct or remove a directory listing. Use it when the person wants to act; send them to the page — this server never submits anything for them.",
