        },
        {
          "name": "search_directory",
          "title": "Search the local business directory",
          "description": "Search Riviera Maya Elite’s directory of local businesses: over 2,000 in Playa del Carmen plus curated picks for Akumal and Cancún. Filter by free text (name, type, neighbourhood — e.g. \"tacos centro\", \"dentist\", \"boat tours\"), category and area. Returns name, type, neighbourhood, a map link, the business website when it is a featured business, and a link for owners to claim or correct the listing.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Town: playa-del-carmen, akumal or cancun.",
                "enum": ["playa-del-carmen", "akumal", "cancun"],
                "type": "string"
              },
              "category": {
                "description": "Category key from list_categories, e.g. \"restaurants\", \"tours\", \"dental\".",
                "maxLength": 40,
                "type": "string"
              },
              "featured_only": {
                "description": "Only featured businesses (they have a website).",
                "type": "boolean"
              },
              "lang": {
                "description": "Language for labels and links: \"en\" (default) or \"es\".",
                "enum": ["en", "es"],
                "type": "string"
              },
              "limit": {
                "description": "How many results (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"seafood\", \"yoga\", \"car rental\", or a business name.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
