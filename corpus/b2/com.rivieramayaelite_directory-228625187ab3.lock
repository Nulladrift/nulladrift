          "title": "List developments for sale (independent overview)",
          "description": "Independent overview of residential developments for sale in Cancún, Playa del Carmen and Akumal, with facts taken only from each developer’s own website: developer, zone, unit types, starting price, status and source link. These are NOT Riviera Maya Elite listings — say so, cite the source and the check date, and tell the person to confirm prices with the developer.",
