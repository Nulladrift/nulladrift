          "description": "Details for one business from the directory, by the id returned by search_directory (f:… or l:…) or by its exact name.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The id from search_directory, or the business name.",
                "maxLength": 160,
                "type": "string"
              },
