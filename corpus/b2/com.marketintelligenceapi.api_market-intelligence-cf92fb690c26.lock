        {
          "name": "check_portfolio",
          "title": "Check portfolio",
          "description": "Review holdings in one call ($0.25): up to 15 positions (symbol with valueUsd or quantity) and 5 on-chain tokens. Returns concentration, correlations, volatility and one-day 95% VaR from hourly on-chain data, the current decision per symbol, token risk verdicts, macro events in the next 24h, flags and a verdict (OK, REVIEW, HIGH_RISK). Use for existing holdings; for one new trade use pre_trade_check.",
          "inputSchema": {
            "properties": {
              "decisions": {
                "default": true,
                "description": "Include the live decision for each position",
                "type": "boolean"
              },
              "positions": {
                "description": "Holdings: up to 15 objects with symbol and valueUsd or quantity",
                "items": {
                  "properties": {
                    "quantity": {
                      "type": "number"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "valueUsd": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 15,
                "type": "array"
              },
              "tokens": {
                "description": "On-chain tokens to review: up to 5 objects with address, chain and valueUsd",
                "items": {
                  "properties": {
                    "address": {
                      "type": "string"
                    },
                    "chain": {
                      "type": "string"
                    },
                    "valueUsd": {
                      "type": "number"
                    }
                  },
                  "type": "object"
