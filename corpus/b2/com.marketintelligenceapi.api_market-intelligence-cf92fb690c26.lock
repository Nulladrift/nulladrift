          "description": "Due diligence before buying any token (Base by default; also ethereum, arbitrum, optimism, polygon, solana). EVM: simulated sell and buy (honeypot check), owner and upgradeable proxy, mint, blacklist, pause and fee functions, liquidity, LP burn, observed buy tax, last-hour flow. Solana mints: mint and freeze authority, Token-2022 transfer fee, permanent delegate, transfer hook, pause and top-wallet concentration. Verdict LOW_RISK, CAUTION or HIGH_RISK. Use for the full due-diligence report with every check; for a short answer use get_token_verdict.",
