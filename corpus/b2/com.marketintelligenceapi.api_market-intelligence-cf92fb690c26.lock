        {
          "name": "find_opportunities",
          "title": "Find opportunities",
          "description": "Goal-driven scan: name an objective and constraints, get ranked symbols with supporting and conflicting evidence grouped by independent source (spot DEX flow, perp positioning, smart-money wallets), typed risk factors, data quality, the live 1h hit rate of the signal and the next calls to make. Use instead of chaining screeners. Objectives: unusual_buying, unusual_selling, breakout, breakdown, crowded_positioning, smart_money_accumulation, smart_money_distribution. Use to discover symbols; once you have one, call pre_trade_check or get_decision_lite.",
          "inputSchema": {
            "properties": {
              "assetClass": {
                "description": "Restrict to crypto, us_equity or perp_only symbols",
                "enum": ["crypto", "us_equity", "perp_only"],
                "type": "string"
              },
              "include": {
                "description": "Blocks to return; default all",
                "items": {
                  "enum": ["metrics", "evidence", "risk_factors", "data_quality", "track_record", "market_context"],
                  "type": "string"
                },
                "type": "array"
              },
              "maxResults": {
                "default": 10,
                "description": "Maximum number of ranked symbols (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minBuyPressure": {
                "default": 60,
                "description": "Pressure on the objective's side (buy for buying, sell for selling)",
                "maximum": 100,
                "minimum": 50,
                "type": "number"
              },
              "minConfidence": {
                "default": 50,
                "description": "Minimum signal confidence, 0-100",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "minIndependentSources": {
                "default": 1,
                "description": "Distinct sources confirming the direction",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "minVolumeMultiple": {
                "default": 1.5,
                "description": "Volume vs the symbol's own baseline",
                "type": "number"
              },
              "minVolumeUsd": {
                "default": 0,
                "description": "USD traded in the window",
                "type": "number"
              },
              "objective": {
                "description": "What to look for",
                "enum": ["unusual_buying", "unusual_selling", "breakout", "breakdown", "crowded_positioning", "smart_money_accumulation", "smart_money_distribution"],
                "type": "string"
              },
              "universe": {
                "description": "Symbols to scan (max 100); omit for all covered symbols",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "window": {
                "default": "5m",
                "description": "Aggregation window of the live trade buckets: 1m, 5m (default) or 15m",
                "enum": ["1m", "5m", "15m", "1h", "4h", "24h"],
                "type": "string"
              }
