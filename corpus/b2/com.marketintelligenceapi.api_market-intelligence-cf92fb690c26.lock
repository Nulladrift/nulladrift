        {
          "name": "subscribe_alerts",
          "title": "Subscribe alerts",
          "description": "Push instead of polling ($0.50): buys a 7-day pack of up to 200 webhook deliveries to your public HTTPS URL, signed with HMAC-SHA256. Events: decision_change (hourly decision flips), unusual_flow, funding_extreme (Hyperliquid), news (materiality filter), token_risk_change (up to 5 watched tokens), sec_filing (new SEC filings of your US tickers; needs symbols, filter with forms). Returns the subscription id and its secret (shown once).",
          "inputSchema": {
            "properties": {
              "categories": {
                "description": "News categories for news events; omit for all",
                "items": {
                  "enum": ["crypto", "stocks", "europe", "policy", "filings"],
                  "type": "string"
                },
                "type": "array"
              },
              "events": {
                "description": "Event types to receive: decision_change, unusual_flow, funding_extreme, news, token_risk_change, stablecoin_depeg, prediction_market_move, sec_filing",
                "items": {
                  "enum": ["decision_change", "unusual_flow", "funding_extreme", "news", "token_risk_change", "stablecoin_depeg", "sec_filing", "prediction_market_move"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "forms": {
                "description": "For sec_filing: only these forms (default all)",
                "items": {
                  "enum": ["4", "8-K", "144", "SC 13D", "SC 13G", "10-Q", "10-K", "S-1", "DEF 14A"],
                  "type": "string"
                },
                "type": "array"
              },
              "minMateriality": {
                "default": 4,
                "description": "Minimum news materiality, 1-5",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "symbols": {
                "description": "Optional: only these symbols",
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "type": "array"
              },
              "tokens": {
                "description": "For token_risk_change: [{\"address\": \"0x...\", \"chain\": \"base\"}]",
                "items": {
                  "properties": {
                    "address": {
                      "type": "string"
                    },
                    "chain": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "url": {
                "description": "Public HTTPS URL that receives the POSTs",
                "type": "string"
              }
            },
            "required": ["events", "url"],
            "type": "object"
