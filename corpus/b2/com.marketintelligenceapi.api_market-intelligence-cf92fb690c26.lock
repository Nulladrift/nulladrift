      },
      "instructions": "Live market data and analytics across crypto, US and European stocks, perps, rates, FX and macro, built on observed data (executed on-chain trades, official filings and releases), each answer timestamped with its source. Start with get_symbol_intelligence (live order flow of one asset), get_market_summary (what is moving), check_token_risk (before buying a token) or find_opportunities (goal-driven scan). get_decision aggregates the data into one action; its measured hit rate is free (get_decision_sample, /api/v1/decision/track-record). initialize, tools/list and the sample tools get_market_preview, get_signal_track_record_summary and get_data_coverage are free; every other tools/call is paid per call with x402 (USDC on Base, Polygon, Arbitrum, World Chain or Solana, or EURC on Base or World Chain): an unpaid call returns a result with isError true and the x402 PaymentRequired in structuredContent; retry with the signed payment in params._meta[\"x402/payment\"]. No data for a query is a JSON-RPC error and is never charged.",
      "tools": [
        {
          "name": "analyze_token",
          "title": "Analyze token",
          "description": "Send any ERC-20 token contract address (Base by default; also ethereum, arbitrum, optimism, polygon), get its live DEX trade flow for the last hour: buy/sell volume in USD, buy pressure, price change, largest trade, trader concentration and a verdict. Use for trade flow of a token; for safety before buying use check_token_risk.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "0x-prefixed token contract address",
                "type": "string"
              },
              "chain": {
                "default": "base",
                "description": "Chain of the token or pool: base (default), ethereum, arbitrum, optimism or polygon (solana where listed). Not the payment network",
                "enum": ["base", "ethereum", "arbitrum", "optimism", "polygon"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
