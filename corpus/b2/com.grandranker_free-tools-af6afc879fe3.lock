      "serverInfo": {
        "name": "Grandranker Free Tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free SEO and AI-search checks from Grandranker. No account, no token, no signup.\n\nTools:\n- check_ai_crawler_readiness: can GPTBot, ClaudeBot, PerplexityBot and other AI crawlers read the site?\n- validate_llms_txt: is the site's llms.txt valid? Or validate llms.txt text you drafted.\n- check_ai_citations: are ChatGPT, Perplexity and Gemini citing the domain for given questions?\n\nLimits are per IP: 10 crawler checks per minute, 20 llms.txt checks per minute, 5 AI citation checks per 30 minutes.\n\nFor the full product (keywords, articles, rank tracking, AI visibility and automatic fixes), see https://grandranker.com.",
      "tools": [
        {
          "name": "check_ai_citations",
          "title": "Check AI citations",
          "description": "Check whether ChatGPT, Perplexity and Gemini cite a domain when asked the given questions. Send 1 to 5 realistic buyer questions (each at least 5 characters). Returns, per AI, how many questions cited the domain. Each check calls paid AI APIs, so the limit is 5 checks per 30 minutes per IP.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The domain to look for in AI answers, e.g. example.com.",
                "type": "string"
              },
              "queries": {
                "description": "1 to 5 buyer questions to ask each AI, e.g. \"best crm for dentists\". Each at least 5 characters.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["domain", "queries"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:44308fd2e1892c1370074c401e54fece498d09ecc6406341a831fc6d8fc1efbd"
        },
        {
          "name": "check_ai_crawler_readiness",
          "title": "Check AI crawler readiness",
          "description": "Check whether AI crawlers (GPTBot, ClaudeBot, PerplexityBot, Google-Extended, Bytespider, CCBot) can read a website, and whether it has llms.txt, schema markup and server-rendered content. Returns a 0-100 score and the failed checks.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Website URL to check, starting with http:// or https://, e.g. https://example.com.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:91fc869114bf5985fef8a183faf3eaa5a7938afb492f07612d33b7cc9115ed15"
        },
        {
          "name": "validate_llms_txt",
          "title": "Validate llms.txt",
          "description": "Validate an llms.txt file. Pass a website URL to fetch and check its /llms.txt (or /llms-full.txt), or pass the llms.txt text itself. Returns a 0-100 score, valid true/false, and each check. Use it to check a site or to review text drafted for the user. If both are given, the url is used.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "The llms.txt text to validate, up to 200,000 characters. Leave empty when passing url.",
                "type": "string"
              },
              "url": {
                "description": "Website URL. The tool fetches its /llms.txt or /llms-full.txt. Leave empty when passing content.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9974171deef6df5e7d1dda349a73892cf5d724de8ea74afcacca00bab3417cbc"
        }
      ],
      "digest": "sha256:85d36bf44ad3ad229f107d1fcb43bdd8e99b632598e0fd7e735f91bfaf428464"
    }
  }
