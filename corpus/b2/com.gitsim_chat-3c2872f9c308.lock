        {
          "name": "search_packages",
          "title": "Search eSIM Packages",
          "description": "Search for eSIM data packages by country. Returns up to 10 packages per page sorted by price. Use the page parameter to paginate. No auth required. Call get_business_context first to understand IP routing and package types.\n\nPackage types:\n- \"regular\": Fixed data pool (e.g. 3GB for 30 days). Best for most travelers.\n- \"daily\": Data resets each day (e.g. 2GB/day for 5 days). Good for short trips with predictable daily usage. Top-up days are available.\n\nIP routing (important for Asia):\n- \"breakout\": Local IP in destination country. Best for streaming, banking, social media. ALWAYS recommend by default.\n- \"hk\": Hong Kong IP. Cheapest but TikTok app and Facebook app are BLOCKED.\n- \"nonhk\": Third-country IP (UK, Singapore). No HK restrictions but IP won't match destination.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. JP, TH, US",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "ip_route": {
                "description": "Filter by IP routing type. \"breakout\" = local IP (recommended default), \"hk\" = Hong Kong IP (restricted, cheapest), \"nonhk\" = other breakout (no HK restrictions)",
                "enum": ["breakout", "hk", "nonhk"],
                "type": "string"
              },
              "is_regional": {
                "description": "true = only multi-country/regional packages (e.g. Europe, Asia). false = only single-country packages. Omit for both.",
                "type": "boolean"
              },
              "max_data_gb": {
                "description": "Maximum data in GB. For daily packages this is the per-day amount.",
                "type": "number"
              },
              "max_duration_days": {
                "description": "Maximum duration in days",
                "type": "number"
              },
              "min_data_gb": {
                "description": "Minimum data in GB. For daily packages this is the per-day amount.",
                "type": "number"
              },
              "min_duration_days": {
                "description": "Minimum duration in days",
                "type": "number"
              },
              "name": {
                "description": "Case-insensitive substring match on package name",
                "type": "string"
              },
              "page": {
                "description": "Page number (1-based, default 1). Each page returns up to 10 results.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "\"daily\" = data resets each day (e.g. 2GB/day for 5 days, can top-up days). \"regular\" = fixed data pool for the full duration. Omit for both.",
                "enum": ["daily", "regular"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
