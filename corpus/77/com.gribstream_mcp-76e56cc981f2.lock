              "valid": {
                "description": "Whether the request body passed local shape, selector, and expression checks.",
                "type": "boolean"
              },
              "warnings": {
                "description": "Validation warnings.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["body", "curl", "endpoint", "headers", "method", "timestamp_semantics", "url", "valid"],
            "type": "object"
          },
          "annotations": {
