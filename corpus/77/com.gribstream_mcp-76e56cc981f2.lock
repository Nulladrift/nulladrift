                "description": "Optional RFC3339 valid time with offset, e.g. 2026-10-16T12:00:00-03:00. Response normalizes to UTC. Filters nominal horizon, not live run availability. Resolve place and local timezone first; never assume local noon is UTC noon.",
                "type": "string"
