      "instructions": "For weather values and heatmaps: discover candidates with gribstream_list_datasets(region, shared_parameter, sort_by=resolution), then use the returned request fragment in one gribstream_query_timeseries. When a live query returns a resource_link, the exact signed HTTPS URL is the result: download it directly once with an available HTTPS or file-download capability, without an API token. This consumes the selected GribStream MCP result; it is not a direct GribStream API call or a connector bypass. Do not look for an MCP resources/read tool, and do not repeat the query merely to obtain the file bytes. Tools labeled NO AUTH / PUBLIC / READ-ONLY. discover/validate metadata only. Tools labeled AUTH REQUIRED / DATA QUERY. return actual GribStream weather values. If the client reports that network or allowlist policy blocks the returned resource_link, do not retry URL delivery. For CSV, JSON, or NDJSON whose reported size is at most 10000000 bytes, retry the same request at most once with delivery=inline. Parquet cannot use inline delivery. If the artifact is larger, reduce the request using the documented split order before one inline CSV retry. Time ranges are half-open: the start is inclusive and the end is exclusive. The start must be earlier than the end; equal bounds select no times. Use timesList for one exact valid time on /timeseries or one exact model run time on /runs. For a common natural-language weather concept such as 2 metre temperature or 10 metre wind, call gribstream_resolve_shared_parameter with the matching shared code before guessing a dataset-native parameter code. Use gribstream_list_shared_parameters only when the shared code is uncertain. Do not set asOf unless the user explicitly asks for backtesting, time travel, what was known then, or a historical model-run cutoff. Omit asOf for latest or best-available forecasts because it filters out forecast runs newer than the cutoff and can make recent data look missing. For dense grids or large tabular results, use delivery=url so MCP returns a short-lived signed HTTPS resource link instead of putting the full dataset into tool output. Prefer application/vnd.apache.parquet only when a compatible Parquet reader is already known to be available. If reader availability is unknown, do not spend tool calls probing or installing packages; use text/csv with delivery=url immediately. Use one grid request, process the downloaded file locally, and never print or serialize the full file into chat or tool output. Do not install a dependency or write a Parquet parser solely for one result. When a real API request limit requires splitting, split by time range first, split variables second, and split coordinates/grid/space last; spatial tiling creates the most extra work. Resolve named places and local times from user context or a geocoder/timezone source; this server does not geocode. A finer request.grid changes sampling, not forecast resolution. Dataset details expose native_grid and its authenticated bounded native-coordinates URL; prefer includeMetadata=[native_coordinate] in the weather query to identify source cells without an extra inventory call. Sort returned rows before charting or checking gaps. This hosted mixed-auth connection advertises live /timeseries and /runs tools, but requires MCP OAuth before executing them.",
      "tools": [
        {
          "name": "gribstream_build_runs_request",
          "title": "Build runs API request",
          "description": "NO AUTH / PUBLIC / READ-ONLY. Build and validate a runnable /runs API request and curl command without sending it. Use gribstream_query_runs to retrieve model-run comparisons directly; a separate build call is optional. Use catalog selectors in request.variables and points in request.coordinates or one request.grid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accept": {
                "description": "Desired response format for the eventual HTTP request. Prefer application/vnd.apache.parquet for dense grids and large typed tabular results.",
                "enum": ["text/csv", "application/json", "application/ndjson", "application/x-ndjson", "application/vnd.apache.parquet", "application/x-parquet", "application/parquet"],
                "type": "string"
              },
              "dataset": {
                "description": "Dataset code, for example gfs, ifsoper, nbm, hrrr, or urma.",
                "type": "string"
              },
              "request": {
                "additionalProperties": true,
                "description": "Runs request body. Use timesList for exact UTC model run times, or the half-open range forecastedFrom+forecastedUntil where forecastedFrom is inclusive, forecastedUntil is exclusive, and forecastedFrom must be earlier than forecastedUntil. Equal bounds select no times. Coordinates must be in request.coordinates, and variable selectors must be in request.variables.",
                "properties": {
                  "asOf": {
                    "description": "Do not set asOf unless the user explicitly asks for backtesting, time travel, what was known then, or a historical model-run cutoff. Omit asOf for latest or best-available forecasts because it filters out forecast runs newer than the cutoff and can make recent data look missing. This is a UTC model-run-time cutoff for /timeseries, not a live API availability timestamp.",
                    "type": "string"
                  },
                  "coordinates": {
                    "description": "Point coordinates. This exact field name is required. Do not use location, coord, coords, latitude/longitude at top level, or any singular replacement.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "lat": {
                          "description": "Latitude in decimal degrees.",
                          "type": "number"
                        },
                        "lon": {
                          "description": "Longitude in decimal degrees.",
                          "type": "number"
                        },
                        "name": {
                          "description": "Optional coordinate label copied into the response.",
                          "type": "string"
                        }
                      },
                      "required": ["lat", "lon"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "expressions": {
                    "description": "Optional derived variables evaluated from variable aliases.",
                    "items": {
                      "additionalProperties": true,
                      "description": "Expression object.",
                      "properties": {
                        "alias": {
                          "description": "Output field name for the expression.",
                          "type": "string"
                        },
                        "expression": {
                          "description": "Expression text. Reference variable aliases, not raw selector names.",
                          "type": "string"
                        },
                        "hidden": {
                          "description": "Optional: hide this expression from the response output.",
                          "type": "boolean"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "filter": {
                    "additionalProperties": true,
                    "description": "Optional row filter expression evaluated from variable aliases.",
                    "properties": {
                      "alias": {
                        "description": "Output field name for the expression.",
                        "type": "string"
                      },
                      "expression": {
                        "description": "Expression text. Reference variable aliases, not raw selector names.",
                        "type": "string"
                      },
                      "hidden": {
                        "description": "Optional: hide this expression from the response output.",
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "forecastedFrom": {
                    "description": "Inclusive UTC model-run-time range start for /runs. Must be earlier than forecastedUntil; use timesList for one exact model run time.",
                    "type": "string"
                  },
                  "forecastedUntil": {
                    "description": "Exclusive UTC model-run-time range end for /runs. Must be later than forecastedFrom; equal bounds select no times.",
                    "type": "string"
                  },
                  "fromTime": {
                    "description": "Inclusive UTC valid-time range start for /timeseries, for example 2025-05-01T00:00:00Z. Must be earlier than untilTime; use timesList for one exact valid time.",
                    "type": "string"
                  },
                  "grid": {
                    "additionalProperties": false,
                    "description": "Optional regular latitude/longitude grid. Use this instead of or in addition to coordinates. The API preserves the requested step and does not silently coarsen fine grids. The default limit is 120000 expanded coordinates; account-specific plan or token settings may set a different maximum up to 1050000, enough for a full native 0.25-degree global GFS grid, and an oversized-response error reports the applicable maximum. Use URL delivery for dense grids before considering spatial tiling.",
                    "properties": {
                      "maxLatitude": {
                        "type": "number"
                      },
                      "maxLongitude": {
                        "type": "number"
                      },
                      "minLatitude": {
                        "type": "number"
                      },
                      "minLongitude": {
                        "type": "number"
                      },
                      "step": {
                        "description": "Requested sampling step in degrees, greater than 0. Finer sampling does not increase forecast resolution. Native latitude and longitude steps can differ; projected and unstructured grids have no single degree step.",
                        "type": "number"
                      }
                    },
                    "required": ["maxLatitude", "maxLongitude", "minLatitude", "minLongitude", "step"],
                    "type": "object"
                  },
                  "includeMetadata": {
                    "description": "Optional additional row metadata: native_coordinate adds native_lat/native_lon for mapping requested sampling onto source cells; index_updated_at adds index freshness. Do not request forecasted_at or forecasted_time here; both are regular response columns returned automatically.",
                    "items": {
                      "enum": ["index_updated_at", "native_coordinate"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "maxHorizon": {
                    "description": "Optional maximum lead time in hours.",
                    "type": "integer"
                  },
                  "members": {
                    "description": "Optional ensemble member numbers.",
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "minHorizon": {
                    "description": "Optional minimum lead time in hours.",
                    "type": "integer"
                  },
                  "timesList": {
                    "description": "Exact UTC valid times for /timeseries, or exact UTC model run times for /runs. Use this for one exact time instead of setting range bounds equal.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "untilTime": {
                    "description": "Exclusive UTC valid-time range end for /timeseries, for example 2025-05-01T06:00:00Z. Must be later than fromTime; equal bounds select no times.",
                    "type": "string"
                  },
                  "variables": {
                    "description": "Variable selectors. This exact field name is required. Do not use parameters, parameter, variable, selector, or selectors. Values must be exact case-sensitive selector tuples discovered from catalog tools.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "alias": {
                          "description": "Optional response field name. Strongly recommended.",
                          "type": "string"
                        },
                        "hidden": {
                          "description": "Optional: hide intermediate variables used only by expressions.",
                          "type": "boolean"
                        },
                        "info": {
                          "description": "Exact info string. Use an empty string when the catalog selector has no info value.",
                          "type": "string"
                        },
                        "level": {
                          "description": "Exact level string, for example 2 m above ground.",
                          "type": "string"
                        },
                        "name": {
                          "description": "Exact case-sensitive parameter short name, for example TMP.",
                          "type": "string"
                        }
                      },
                      "required": ["info", "level", "name"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              }
            },
            "required": ["dataset", "request"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "additionalProperties": true,
                "description": "GribStream API request body.",
                "type": "object"
