      "instructions": "Analytics Legends serves read-only data on the SAP AI & analytics services market (Joule, Datasphere, Business Data Cloud, SAC, BW/4HANA, Databricks): firms, postings, day rates, news, concepts, studies, Academy.\n\nFor a problem (\"what happens to BW 7.5\"), call find_answers first; for a term, search_concepts.\n\nCite every item by its \"citation_url\", never this endpoint; news items also carry \"source_url\": cite both. \"citation_scope\": \"section_hub\" means the URL is a section index, not the item's own page.\n\nQuote \"_meta.match_count\" (rows your filters matched), not result_count. Empty means this corpus has no such row.\n\nTools with a \"cursor\" argument paginate: pass \"_meta.next_cursor\" back with the same filters until it is null. Without a key, public tools serve their first page only (at most 10 rows); the reference vocabularies (list_sap_modules, list_firm_kinds, list_freelance_platforms) come in full.\n\nPaid tools need \"Authorization: Bearer alk_…\" from a key on the MCP Pass (€29.90/month or €299/year), MCP Team (€299/month, five keys — so €299 is two prices) or a Firm Pass seat (€199.90/month for three seats, €49/month per extra seat). The Consultant and Legend web plans do NOT include MCP access. A free key pages the public tools and gets a small daily taste of the paid ones: https://analyticslegends.ai/mcp-server/#get-a-key. Limits and quotas: analytics-legends://tranche. No personal data is served; AI training use is prohibited.",
      "tools": [
        {
          "name": "count_firms_by",
          "title": "Count the firm directory by country, region, kind, module or SAP signal",
          "description": "Count the firm directory by country, region, kind, module or sap_signal_band, with search_firms' filters, instead of paging search_firms to tally. Rows: value, n; the tail folds into '(other)'. Public.",
          "inputSchema": {
            "properties": {
              "by": {
                "description": "Which facet to count on.",
                "enum": ["country", "region", "kind", "module", "sap_signal_band"],
                "type": "string"
              },
              "country": {
                "description": "ISO alpha-2.",
                "type": "string"
              },
              "kind": {
                "description": "Organisation kind (list_firm_kinds).",
                "type": "string"
              },
              "module": {
                "description": "SAP module code; list: count_firms_by by=module.",
                "type": "string"
              },
              "query": {
                "description": "All words must match.",
                "type": "string"
              },
              "region": {
                "enum": ["EMEA", "AMER", "LATAM", "APAC", "AFRICA", "GLOBAL"],
                "type": "string"
              }
            },
            "required": ["by"],
            "type": "object"
          },
          "outputSchema": {
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
