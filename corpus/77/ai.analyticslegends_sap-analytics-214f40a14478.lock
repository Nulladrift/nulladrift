          "description": "Start here for an SAP AI & analytics PROBLEM, asked in EN, FR or DE (agents in production, Joule value, BW 7.5 cliff, BDC vs Datasphere vs Databricks…). Returns up to 3 tracked challenges: short answer, what shipped, what is announced, next steps, citation_url. Empty = not a tracked challenge; try search_concepts. Public.",
