              "lang": {
                "description": "Default: language of the question.",
                "enum": ["EN", "FR", "DE"],
                "type": "string"
              },
              "question": {
                "description": "As asked, in EN, FR or DE.",
                "examples": ["What happens to BW 7.5 after 2027?"],
                "type": "string"
              }
