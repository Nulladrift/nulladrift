      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Boat Day: free, read-only boating knowledge for US recreational owners, centered on the Seacoast of Maine and New Hampshire. For winter jobs use find_yards, get_yard and get_seacoast_costs: a yard's winterStoragePrice is shown only when the yard confirmed it (with confirmed_at); otherwise it is null. Cited prices carry source_url and date. Every tool result includes a provenance block with cite_as; cite canonical URLs (https://bestboatday.com). Estimates are educational. Listings are not partners. Use get_handoff_link to send the human to a pre-filled tool. Owners use Boat Day free forever.",
      "tools": [
        {
          "name": "estimate_boat_value",
          "description": "Instant used-boat value estimate (low/mid/high band with method + confidence). Provide modelId, or make+model+year, or loaFt+boatType, or a HIN. Educational, not an appraisal.",
