        {
          "name": "find_yards",
          "description": "Find Seacoast ME–NH and Casco Bay boatyards, marinas and storage (public-web listings, not partners). Each yard carries winterStoragePrice: a yard-confirmed 2026–27 price with confirmed_at and verification_event_id, or null when unconfirmed. Set confirmed=true for confirmed yards only. Human-readable index: /yards. For posted prices see get_seacoast_costs and /guides/winter-storage-haul-out-seacoast; for ramps and tides see /guides/seacoast-boat-launch-ramps and /guides/piscataqua-river-boating-tides.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Listing category, e.g. marina-yard",
                "type": "string"
              },
              "confirmed": {
                "description": "Only yards with a confirmed winter storage price",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (default 25)",
                "type": "number"
              },
              "q": {
                "description": "Text, e.g. 'kittery' or 'storage'",
                "type": "string"
              },
              "region": {
                "description": "Region (default: both)",
                "enum": ["seacoast", "casco-bay"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "confirmations": {
                "additionalProperties": true,
                "type": "object"
              },
              "count": {
                "type": "integer"
              },
              "data": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "claimed": {
                      "type": "boolean"
                    },
                    "confirmed": {
                      "additionalProperties": true,
                      "type": ["object", "null"]
                    },
                    "gap": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page": {
                      "type": "string"
                    },
                    "partner": {
                      "const": false,
                      "type": "boolean"
                    },
                    "phone": {
                      "type": ["string", "null"]
                    },
                    "region": {
                      "type": ["string", "null"]
                    },
                    "source": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "state": {
                      "type": ["string", "null"]
                    },
                    "website": {
                      "type": ["string", "null"]
                    },
                    "winterStoragePrice": {
                      "additionalProperties": true,
                      "description": "Yard-confirmed winter storage price. status 'unconfirmed' or 'unavailable' means value is null: Boat Day never fills a default.",
                      "properties": {
                        "confirmed_at": {
                          "type": ["string", "null"]
                        },
                        "field": {
                          "type": "string"
                        },
                        "status": {
                          "enum": ["confirmed", "expired", "unconfirmed", "unavailable"],
                          "type": "string"
                        },
                        "unit": {
                          "type": ["string", "null"]
                        },
                        "value": {
                          "type": ["number", "null"]
                        },
                        "verification_event_id": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["confirmed_at", "field", "status", "unit", "value", "verification_event_id"],
                      "type": "object"
                    }
                  },
                  "required": ["id", "name", "page", "partner", "winterStoragePrice"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "additionalProperties": true,
                "type": "object"
              },
              "provenance": {
                "additionalProperties": true,
                "description": "Source, as_of, method, confidence, honesty and cite_as.",
                "type": "object"
              },
              "truncated": {
                "properties": {
                  "returned": {
                    "type": "integer"
                  },
                  "total": {
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["count", "data", "provenance"],
            "type": "object"
