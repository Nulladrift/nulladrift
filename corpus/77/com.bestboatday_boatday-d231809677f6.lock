            "properties": {
              "boatType": {
                "description": "Boat type id",
                "type": "string"
              },
              "hin": {
                "description": "Hull ID number (12 chars)",
                "type": "string"
              },
              "loaFt": {
                "description": "Length overall ft",
                "type": "number"
              },
              "make": {
                "description": "Make",
                "type": "string"
              },
              "model": {
                "description": "Model",
                "type": "string"
              },
              "modelId": {
                "description": "Model id",
                "type": "string"
              },
              "year": {
                "description": "Model year",
                "type": "number"
              }
            },
            "type": "object"
          },
