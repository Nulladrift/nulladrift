{
  "lockfileVersion": 2,
  "subjects": {
    "ai.assistable/assistable": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.assistable.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "assistable",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools target the CreateAssistants v3 REST API (multi-channel voice AI: voice, SMS, WhatsApp, web chat). Use search_tools with the user's intent first; it returns a small set of exact registered tool names, input schemas, annotations and the current catalog version. Then call the matching tool directly. Search results do not grant access: every operation still requires the caller's v3 API key (Authorization: Bearer ask_live_…) and the key's scopes/subaccount access. Subaccount-scoped tools take a subAccountId argument where shown. list_/get_ tools are read-only; create/update are writes; archive/delete are destructive. Auth + docs: https://www.assistable.ai/auth.md",
      "tools": [
        {
          "name": "appointments_list",
          "description": "List appointments in a subaccount within an optional date range.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "type": "string"
              },
              "endDate": {
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "startDate": {
                "type": "string"
              },
              "subAccountId": {
                "type": "string"
              }
            },
            "required": ["subAccountId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3b672d5f84d25d9e36ec5bf9fd57ee7de2cdd7695b2b092f7602e4c466462ed8"
        },
        {
          "name": "assistants_archive",
          "description": "Archive (soft-delete) an assistant.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "assistantId": {
                "type": "string"
              }
            },
            "required": ["assistantId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d8224858d642c8af5c7872dae44b1c161e60122eb60629f70703478807b13cee"
        },
        {
          "name": "assistants_create",
          "description": "Create an assistant. Required: subAccountId, name. Optional config blocks (llmConfig, voiceConfig, chatConfig) mirror the dashboard create dialog. voice_settings configures call greeting mode, opening messages, and voicemail behavior; platform_tools attaches platform-catalog tools (declarative full-replace — see the field description).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "assistantType": {
                "enum": ["STANDARD", "FLOW_BUILDER"],
                "type": "string"
              },
              "chatConfig": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "description": {
                "type": "string"
              },
              "llmConfig": {
                "properties": {
                  "model": {
                    "type": "string"
                  },
                  "prompt": {
                    "type": "string"
                  },
                  "temperature": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "name": {
                "type": "string"
              },
              "platform_tools": {
                "description": "Platform tool names to attach, e.g. [\"book_appointment\", \"send_email\"]. Declarative within the platform catalog: tools in the list are attached, catalog tools missing from the list are detached, custom tools are never touched. Omit for no change; [] detaches all platform tools. See GET /v3/tools for the catalog; custom tools attach via POST /v3/tools/{id}/assign.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "subAccountId": {
                "type": "string"
              },
              "voiceConfig": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "voiceId": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "voice_settings": {
                "properties": {
                  "enable_voicemail_detection": {
                    "description": "Records intent only: persisted and returned on read, but voicemail detection is currently platform-managed and this flag does not yet gate runtime behavior.",
                    "type": "boolean"
                  },
                  "greeting_mode": {
                    "description": "How the assistant opens a call: `dynamic` (AI-generated opener; default), `fixed` (speaks the configured opening message verbatim), or `contact_first` (stays silent until the contact speaks).",
                    "enum": ["dynamic", "fixed", "contact_first"],
                    "type": "string"
                  },
                  "inbound_opening_message": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Spoken opener for inbound calls. Only valid in `fixed` greeting mode. Template variables (e.g. a contact first-name placeholder) are allowed and resolve per call. `null` clears this direction."
                  },
                  "outbound_opening_message": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Spoken opener for outbound calls. Only valid in `fixed` greeting mode. Template variables are allowed and resolve per call. `null` clears this direction."
                  },
                  "voicemail_message": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Played when voicemail is detected, after which the assistant stops. Empty or `null` means the assistant hangs up on voicemail instead."
                  }
                },
                "type": "object"
              }
            },
            "required": ["name", "subAccountId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
