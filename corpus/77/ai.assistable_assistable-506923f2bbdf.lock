                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "startDate": {
                "type": "string"
              },
              "subAccountId": {
                "type": "string"
              }
            },
            "required": ["subAccountId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
