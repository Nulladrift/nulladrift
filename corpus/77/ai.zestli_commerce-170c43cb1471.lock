        {
          "name": "booking_support",
          "title": "Booking Support",
          "description": "For the signed-in booking holder only: open a support request about their booking, or read the durable result using support_ref. Zestli answers it. A cancellation happens only through kind cancel_booking followed by the holder's confirm of the quoted refund; Zestli then carries it out under the booking's terms (read the outcome with get_booking_status). Anything else is a person's decision. kind urgent_in_trip, for a booking under way or starting within 24 hours, alerts Zestli's team and the operator at once and returns next_steps to tell the user now, including emergency services for a safety issue. When the support desk is paused, a request is emailed to Zestli support instead (status sent_to_support_email, no support_ref): a person replies to the user by email; tell them so, using the result's text. Opening a request never changes a booking or moves money by itself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "properties": {
                  "action": {
                    "description": "request opens one; status reads it by support_ref; confirm (with support_ref and confirm_refund_minor) is the holder's yes to a quoted cancellation.",
                    "enum": ["request", "status", "confirm"],
                    "type": "string"
                  },
                  "booking_id": {
                    "description": "The booking: its booking_id, or the reference shown to the user in Zestli's emails and pages (booking_reference, e.g. ZST-1A2B3C4D). Only bookings this connection owns.",
                    "type": "string"
                  },
                  "confirm_refund_minor": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "For confirm: the exact refund (minor units) the holder agreed to, from cancel_quote. 0 confirms cancelling with no refund. Only after the holder said yes."
                  },
                  "kind": {
                    "default": "question",
                    "description": "Never show these names; offer the plain words. question (\"Ask a question or sort out a problem\"): anything that needs an answer or a fix, including a complaint. urgent_in_trip (\"I need help now\"): a problem right now on a booking under way or starting within 24 hours; set problem. feedback (\"Tell us what you think\"): an opinion that needs no fix; Zestli passes one about an offering to its operator.",
                    "enum": ["question", "urgent_in_trip", "feedback", "cancel_booking"],
                    "type": "string"
                  },
                  "message": {
                    "anyOf": [
                      {
                        "maxLength": 2000,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "problem": {
                    "anyOf": [
                      {
                        "enum": ["operator_no_show", "cant_find_operator", "safety_issue", "operator_cancelled_today", "other"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Required for urgent_in_trip."
                  },
                  "support_ref": {
                    "anyOf": [
                      {
                        "maxLength": 80,
                        "minLength": 5,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  }
                },
                "required": ["action", "booking_id"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Booking Support"
