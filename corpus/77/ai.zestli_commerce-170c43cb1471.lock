        {
          "name": "ask_someone_to_pay",
          "title": "Ask Someone To Pay",
          "description": "Sends one adult an email with a secure link to pay for the user's own booking proposal, and records that payment request. It fits when the user says someone else (a parent, partner or sponsor) will pay, and when the user is under 18, because a parent or legal guardian pays for their bookings. Requires the user's own connected Zestli account and a proposal_id from initiate_booking (operator offerings, hotels or flights; the offering's party rules still apply). The payer signs in with that email on Zestli's page, sees a fresh price and the deadline, and pays as themselves; the user keeps the booking. Nothing is charged until that adult pays there, the payer's card is never shared, and the user never becomes the payer. Returns the request's status and request_id. A request to the same payer_email for the same proposal_id is sent once: calling again with them reads the request's current status and sends no email. Once paid, the status is completed, with booking_id, booking_reference (ZST-...), the booking's status and paid_by_someone_else with the amount paid; get_booking_status reads the same booking later. withdraw=true cancels the request and its link stops working; ask_again=true sends a new request to the same person after a decline or withdrawal. Zestli sets the payer's role from the user's age on their account: for a person under 18 the payer confirms they are the parent or legal guardian; otherwise they pay as a sponsor. For a person aged 13-17 the proposal's party includes them at their own age (child_ages for a hotel or flight, or a rate option whose age range fits them) and meets the offering's age and adult rules; a payer who isn't traveling does not count as the accompanying adult. Each new proposal is a separate purchase with its own request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Who should pay for which proposal, or a withdrawal.",
                "properties": {
                  "ask_again": {
                    "default": false,
                    "description": "true only when the user asks to send a new request to this person after their earlier one was declined or withdrawn. Otherwise a repeat call only reads it.",
                    "type": "boolean"
                  },
                  "payer_email": {
                    "description": "The email of the one adult asked to pay, exactly as the user gave it.",
                    "maxLength": 320,
                    "pattern": "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$",
                    "type": "string"
                  },
                  "proposal_id": {
                    "description": "The proposal_id from initiate_booking (a UUID).",
                    "type": "string"
                  },
                  "withdraw": {
                    "default": false,
                    "description": "true only when the user asks to cancel this request; its link stops.",
                    "type": "boolean"
                  }
                },
                "required": ["payer_email", "proposal_id"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
