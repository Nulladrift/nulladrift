        {
          "name": "open_saved_card_setup",
          "title": "Open Saved Card Setup",
          "description": "Give the user Zestli's secure page for saving, adding or replacing the card used for one-tap booking approval in chat. Use it when the user asks to save, add, change or replace a card or payment method on Zestli, or when a booking result says no card is saved for in-chat approval. Requires the user's own Zestli connection; takes no arguments. Returns setup_url, their Zestli account page, where they sign in, enter the card and accept the one-tap terms; when this client supports URL elicitation, Zestli also offers to open the page directly. Card details are never collected in chat or by this tool, nothing is saved until the user finishes on that page, and it never books or approves a payment. To pay for a booking without saving a card, give the user its checkout_url.",
