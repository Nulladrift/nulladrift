      "instructions": "Zestli travel supply for a person's own assistant. Searching supply, reading details and checking availability need no account. Quotes, bookings and booking records need the user to connect their Zestli account via OAuth; an approved partner's API key, sent as a Bearer token, also authenticates. Payment happens only when the user approves it in a supported review card, native approval form or hosted checkout, or through a Stripe shared payment token the user's assistant platform issued with their approval. Zestli's tools take no card details, and assistant text is not payment approval.",
      "tools": [
        {
          "name": "answer_package_part_cancellation",
          "title": "Answer Package Part Cancellation",
          "description": "Answer the choice Zestli offers after an operator cancelled part of a booking: its part of a package, or some nights of a stay (scope 'stay'; cancelled_nights and kept_nights are local dates). get_booking_status lists it in package_choices. Call with confirm=false to read both outcomes: keep_rest keeps the other parts or nights booked and refunds what was cancelled (keep_rest_refund_minor); refund_all cancels the whole booking and refunds everything (refund_everything_minor). Tell the user both, and the answer_by deadline (no answer by then refunds everything). Then, with the user's explicit choice, call again with confirm=true, the choice's cancellation_id, the answer and a new request_id; retrying with the same request_id and answer is safe and answers the same choice again, changing nothing. One answer per choice. The refund then moves within about a minute; its refund_state here and in get_booking_status says whether it has settled.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "Input for answer_package_part_cancellation.",
                "properties": {
                  "answer": {
                    "anyOf": [
                      {
                        "enum": ["keep_rest", "refund_all"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "The user's choice; required when confirm is true"
                  },
                  "booking_id": {
                    "description": "The booking: its booking_id, or the reference shown to the user in Zestli's emails and pages (booking_reference, e.g. ZST-1A2B3C4D). Only bookings this connection owns.",
                    "type": "string"
                  },
                  "cancellation_id": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Which choice to answer: its cancellation_id from choices (this tool's preview or get_booking_status package_choices); required when confirm is true"
                  },
                  "confirm": {
                    "default": false,
                    "description": "false: preview only, nothing changes. true: record the answer",
                    "type": "boolean"
                  },
                  "request_id": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "A new UUID for this answer; required when confirm is true"
                  }
                },
                "required": ["booking_id"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
