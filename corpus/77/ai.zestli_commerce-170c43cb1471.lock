        {
          "name": "check_availability",
          "title": "Check Availability",
          "description": "Use this when the user has a specific item in mind (a supply_id from search_supply or the product feed) and you need to verify it is actually available for their dates before quoting. Returns a live supplier availability answer and the current price for the window. Without `travelers` it returns unit options but no party price, lines, or party-specific availability; an actually sold-out departure remains unavailable. Scheduled experiences return their departures in `occurrences` (occurrence_id, local start/end, seats left); if several fit, ask the user and pass the chosen occurrence_id to create_quote. Rentals return `rental` terms; pass rental_selection (duration, local pickup time, items and kits with quantities) for the exact price, the return time and units_left per item; a refusal names the rule or the item that is short. Read-only — it never holds inventory or locks a price. create_quote records the selected current price and terms; checkout revalidates them. Pass the user's currency as currency whenever you know it, signed in or not.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "Input for checking live availability of one supply item.",
                "properties": {
                  "add_ons": {
                    "description": "Optional extras the user asked for, from `add_ons`.",
                    "items": {
                      "description": "How many of one optional extra the user wants.",
                      "properties": {
                        "add_on_id": {
                          "description": "add_on_id from `add_ons`",
                          "type": "string"
                        },
                        "quantity": {
                          "description": "Units; at most the party size (per_person) or 1 (per_booking)",
                          "maximum": 20,
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["add_on_id", "quantity"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "check_in": {
                    "description": "ISO 8601 start date (YYYY-MM-DD)",
                    "type": "string"
                  },
                  "check_out": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "ISO 8601 end date; defaults to check_in (same-day activity)"
                  },
                  "currency": {
                    "anyOf": [
                      {
                        "pattern": "^[A-Za-z]{3}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "ISO 4217 code of the user's currency, e.g. EUR. Prices come back converted at the current rate and marked price_conversion=current_rate. Omitted: a signed-in user's prices come in their own Zestli currency (their saved choice, else home country or language, else USD); without a signed-in user they stay in each item's listed currency. An item with no rate keeps its listed currency, as does every item for KWD, BHD, JOD, OMR and TND, which Zestli can't charge in yet; message then names the listed currency."
                  },
                  "guest_nationality": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
