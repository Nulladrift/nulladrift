        {
          "name": "request_human_booking_approval",
          "title": "Request Human Booking Approval",
          "description": "Ask the user to approve one booking proposal in a form inside this chat that shows its exact price, cancellation terms and lead guest; if they approve, Zestli charges the card they saved for one-tap approval and books. Use it after initiate_booking, once the user has said they want to book. Requires the proposal_id, the user's own Zestli connection, a client that supports form elicitation and a saved card. Returns the booking outcome (status confirmed with a booking_id, or the payment result), or status checkout_required with checkout_url when the booking must be approved on Zestli's secure checkout instead, for example because this client cannot show the form or no card is saved: give that link to the user. Approval is recorded only in the form, not from chat text. It does not save cards; use open_saved_card_setup for that. For a person under 18 it returns status guardian_must_pay with no form or checkout: use ask_someone_to_pay instead.",
