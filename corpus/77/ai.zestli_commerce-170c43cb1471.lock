        {
          "name": "request_offering",
          "title": "Request Offering",
          "description": "Use this when the user wants to book a listing whose booking_status is coming_soon: a business Zestli lists whose operator hasn't joined yet, so it has no price or availability and can't be quoted. Saves the user's date and party size; Zestli asks the operator to join and tells the user, in their account and through this connection, when it can be booked. Nothing is charged or held and the booking is not confirmed, so say so. Asking again for the same date updates the earlier request. Needs the user's own Zestli account connection. Not for bookable listings: use check_availability and create_quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "properties": {
                  "date": {
                    "description": "The date the user wants, year-month-day, such as 2027-03-14.",
                    "type": "string"
                  },
                  "notes": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Anything the operator should know, in the user's words, such as a preferred time or occasion. At most 1000 characters. Leave out personal contact details."
                  },
                  "party_size": {
                    "description": "How many people would go, 1 to 100.",
                    "type": "integer"
                  },
                  "supply_id": {
                    "description": "supply_id of a search or details result whose booking_status is coming_soon.",
                    "type": "string"
                  }
                },
                "required": ["date", "party_size", "supply_id"],
                "type": "object"
              }
            },
            "required": ["request"],
