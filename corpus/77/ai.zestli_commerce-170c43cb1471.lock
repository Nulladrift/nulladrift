        {
          "name": "start_account_closure",
          "title": "Start Account Closure",
          "description": "Send the user a link to delete their Zestli account, when they ask. Takes no arguments. Nothing is deleted yet: the link goes to the account's email and opens a page that explains what deleting means, and the account is deleted only if they press Delete my account there. Tell the user before calling this: deleting can't be undone; it removes their profile, saved guest details and documents and disconnects their assistants; booking and payment records are kept for accounting and disputes with personal details removed; it doesn't cancel upcoming bookings or refund anything (cancel those first if they want). While a payment is still being processed, the page refuses and nothing is deleted. Returns where the link went.",
