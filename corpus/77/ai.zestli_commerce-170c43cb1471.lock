        {
          "name": "cancel_booking",
          "title": "Cancel Booking",
          "description": "Use this when the user wants to cancel a booking previously made through this server (its booking_id, or the ZST-… reference from Zestli's emails and pages), or some parts of it. Cancelling takes two calls with the user's answer in between. First call with preview=true: nothing is cancelled; it returns the refund the user would get now (refund_amount_minor, refund_currency, refund_rule, any cancellation_fee_minor, and per part refund_parts, including a together discount taken back) and a preview_id. Operator-run experiences refund by their published cancellation tiers measured to the booked start time, often partial and 0 after the start; other suppliers refund in full or less the fee shown at checkout. A card only authorized, never charged (such as a request the operator has not accepted) previews not_charged with no refund amount: cancelling releases the authorization and refunds nothing because nothing was taken. The user agrees to the previewed refund, not just to cancelling: a request to cancel is not agreement to an amount they have not seen. Once they confirm that refund, a call without preview, with the same booking_id, segment_ids and the preview_id, cancels, refunds exactly that amount (0 moves no money) and reports it. DESTRUCTIVE and not reversible. If the refund changed since the preview, the call is refused with the new figures and a new preview_id: show them and ask again. If a leg fails or the refund is not confirmed, the message says what to do next.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "Input for cancelling a confirmed booking.",
                "properties": {
                  "booking_id": {
                    "description": "The booking: its booking_id, or the reference shown to the user in Zestli's emails and pages (booking_reference, e.g. ZST-1A2B3C4D). Only bookings this connection owns.",
                    "type": "string"
                  },
                  "preview": {
                    "default": false,
                    "description": "true = only report what cancelling now would refund, and a preview_id; nothing is cancelled.",
                    "type": "boolean"
                  },
                  "preview_id": {
                    "anyOf": [
                      {
                        "maxLength": 64,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Required to cancel: the preview_id of the preview whose refund the user confirmed. Refused if missing or if that refund has changed since."
                  },
                  "reason": {
                    "default": "agent_requested",
                    "description": "Short cancellation reason (recorded on the booking)",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "segment_ids": {
                    "description": "Bookings of several offerings: the parts to cancel (each part's part_id from get_booking_status). Omit to cancel the whole booking. Parts booked 'only with' a cancelled part are cancelled too; preview shows them.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 6,
                    "type": "array"
                  }
                },
                "required": ["booking_id"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "already_cancelled": {
                "type": "boolean"
              },
              "booking_id": {
                "type": "string"
              },
              "cancellation_fee_minor": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cancelled_part_ids": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "error_code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "is_sandbox": {
                "type": "boolean"
              },
              "message": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "needs_review": {
                "type": "boolean"
              },
              "not_charged": {
                "type": "boolean"
              },
              "preview_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "refund_amount_minor": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
