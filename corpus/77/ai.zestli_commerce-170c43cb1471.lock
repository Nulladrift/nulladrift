                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "links": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "share_id": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "share_id", "url"],
                  "type": "object"
                },
                "type": "array"
