        {
          "name": "get_supply_details",
          "title": "Get Supply Details",
          "description": "Use this when the user wants to know more about one specific item from search_supply results (a supply_id): full description, ordered photos and video links, amenities, cancellation terms and price, and for direct operator offerings traveler_facts (inclusions, what to bring, languages, accessibility). Relay a not_stated fact as unknown, never as 'no' or 'none'. Pass check_in/check_out to price those dates and list scheduled departures (`occurrences`) in that window, and travelers (or stay_selection for direct operator rooms) for the party price and how it adds up (`lines`). A rental returns `rental`: its items with stock and fit, kits, durations with exact prices, opening hours, allowed pickup times and open dates. Use check_availability when you need the supplier to confirm the dates live, or to get an external hotel's room options: create_quote needs the option_reference it returns. Not for finding items (use search_supply). Pass the user's currency as currency whenever you know it, signed in or not. Media is paged with media.next_offset; supplied media is not independent visual verification.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "Input for getting full supply details.",
                "properties": {
                  "check_in": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional ISO date: list scheduled departures from this date"
                  },
                  "check_out": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional ISO date ending the departure window"
                  },
                  "currency": {
                    "anyOf": [
                      {
                        "pattern": "^[A-Za-z]{3}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "ISO 4217 code of the user's currency, e.g. EUR. Prices come back converted at the current rate and marked price_conversion=current_rate. Omitted: a signed-in user's prices come in their own Zestli currency (their saved choice, else home country or language, else USD); without a signed-in user they stay in each item's listed currency. An item with no rate keeps its listed currency, as does every item for KWD, BHD, JOD, OMR and TND, which Zestli can't charge in yet; message then names the listed currency."
                  },
                  "media_limit": {
                    "default": 6,
                    "description": "Maximum gallery assets to return",
                    "maximum": 20,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "media_offset": {
                    "default": 0,
                    "description": "Gallery offset from media.next_offset",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "offer_id": {
                    "anyOf": [
                      {
                        "format": "uuid",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Exact offering ID returned by search/details; retain it with supply_id so the selected operator and commercial terms cannot change."
                  },
                  "stay_selection": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "Explicit property-local half-open stay and each room's actual occupancy.",
                        "properties": {
                          "check_in": {
                            "format": "date",
                            "type": "string"
                          },
                          "check_out": {
                            "format": "date",
                            "type": "string"
                          },
                          "rooms": {
                            "items": {
                              "additionalProperties": false,
                              "description": "One actual occupied room; its stable ID survives corrections and guest assignment.",
                              "properties": {
                                "adults": {
                                  "description": "Guests aged 18 or over; zero is allowed",
                                  "minimum": 0,
                                  "type": "integer"
                                },
                                "adults_ages": {
                                  "anyOf": [
                                    {
                                      "items": {
                                        "anyOf": [
                                          {
                                            "type": "integer"
                                          },
                                          {
                                            "type": "null"
                                          }
                                        ]
                                      },
                                      "type": "array"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "default": null,
                                  "description": "Actual adult ages only when published occupancy terms require them"
                                },
                                "children_ages": {
                                  "description": "One entry per child: age at check-in, or null when unstated; empty for no children",
                                  "items": {
                                    "anyOf": [
                                      {
                                        "type": "integer"
                                      },
                                      {
                                        "type": "null"
                                      }
                                    ]
                                  },
                                  "type": "array"
                                },
                                "count": {
                                  "const": 1,
                                  "default": 1,
                                  "type": "integer"
                                },
                                "rate_plan_id": {
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "room_type_id": {
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "selection_id": {
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "unit_id": {
                                  "anyOf": [
                                    {
                                      "type": "string"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "default": null
                                }
                              },
                              "required": ["adults", "children_ages", "rate_plan_id", "room_type_id", "selection_id"],
                              "type": "object"
                            },
                            "minItems": 1,
                            "type": "array"
                          }
                        },
                        "required": ["check_in", "check_out", "rooms"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Direct operator accommodation: chosen local dates and each room with its stable selection_id, room type, rate, optional named unit and actual occupants. Never infer a room split."
                  },
                  "supply_id": {
                    "description": "A supply_id from search_supply results",
                    "type": "string"
                  },
                  "travelers": {
                    "anyOf": [
                      {
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Number of people including children and infants, for the party's total; omit to read the headline unit price (labelled by price_basis) and rate_options only"
                  }
                },
                "required": ["supply_id"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "details": {
                "anyOf": [
                  {
                    "properties": {
                      "accommodation": {
                        "anyOf": [
                          {
                            "additionalProperties": true,
