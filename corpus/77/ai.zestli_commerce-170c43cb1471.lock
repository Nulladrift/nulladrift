        {
          "name": "get_booking_status",
          "title": "Get Booking Status",
          "description": "Use this when the user asks about an existing booking (its booking_id, or the ZST-… reference from Zestli's emails and pages): current lifecycle status, per-segment supplier state, and the real financial summary; for the signed-in user who owns it, also the lead guest's name. Read-only. Money fields are minor units; *_major fields are readable major-unit amounts. Each part states its monetary currency; names do not define units or FX. A refund_decision is an agreed amount, not a payment receipt; null totals or refund_owed are unknown, not zero or the original price minus confirmed refunds. An uncertain payment effect (being_checked) must not be retried as a new cancellation. This read neither schedules recovery nor sends notifications; an unknown refund record does not establish that Zestli is working on it or will email the user. A person someone else paid for reads it by booking_id or reference too (ask_someone_to_pay returns both once it is paid): paid_by_someone_else then gives the amount they paid, never their card or refunds. Otherwise payment_outcome states whether the card was charged or refunded, from Zestli's payment records; unknown means not established. The proposal_id initiate_booking returned works too: it reads the booking its checkout created, or status not_booked while checkout hasn't booked anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "Input for checking booking status.",
                "properties": {
                  "booking_id": {
                    "description": "The booking: its booking_id, or the reference shown to the user in Zestli's emails and pages (booking_reference, e.g. ZST-1A2B3C4D). Only bookings this connection owns.",
                    "type": "string"
                  }
