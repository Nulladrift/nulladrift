        {
          "name": "search_supply",
          "title": "Search Supply",
          "description": "Use this when the user wants to find something bookable in a place: a tour, activity, stay, meal or ride, or anything else they describe. Results are the listings Zestli can book there; which kinds exist differs by place, and an empty result with its message is the answer, not a fault. warming=true means more listings are still being gathered, or the user's photo is still being matched, so search again shortly (with the same photo) instead of reporting none. A message with warming=false can say that gathering ended with incomplete coverage; keep that warning with the results. Where a result is for reference only and cannot be booked, message says so. Unpriced listings say price_requires_availability_check. Returns supply records without a preference score (pass a result's supply_id to create_quote), with cursor pagination. A 'query' in the user's own words and language orders results by query_relevance, highest first: word or meaning matches, then other listings, each group by query_relevance. total_count counts the matches. query_match names the retrieval basis (literal or semantic), not a verification. message says which results match and which are shown for comparison; it is written for the user, so you can relay it. query_image_url (a public https photo link the user shared), or query_image (a photo the user uploaded), also returns the listings whose own photos look most like it, with query_match looks_like_photo (see query_match before suggesting one). When relevance is null it was not checked; judge each against the request. Results with next_available_date match but are not available on the requested dates; offer their next date instead. If the user names an offering or its operator but no place, omit destination and pass the name as query to look it up everywhere (up to 25, no paging, dates and filters not applied); never guess places, and never offer a different listing because none has that name. Not for checking a known item's availability (use check_availability) or for pricing (use create_quote). Pass the user's currency as currency whenever you know it, signed in or not.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query_image": {
                "anyOf": [
                  {
                    "description": "A photo the user uploaded, as the assistant's host hands it to the tool.",
                    "properties": {
                      "download_url": {
                        "description": "Temporary https link to the uploaded photo's bytes",
                        "type": "string"
                      },
                      "file_id": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null
                      }
                    },
                    "required": ["download_url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A photo the user uploaded, used like request.query_image_url (needs request.destination and request.category)."
              },
              "request": {
                "description": "Input for searching travel supply.",
                "properties": {
                  "category": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Kind of listing: activity (tours, classes, experiences; rentals of bikes, boats, boards and gear are activities too, and their details list durations, prices and pickup times), hotel (any stay), restaurant (dining), transfer (rides) or flight. Aliases like 'accommodation', 'tour', 'dining' and 'rental' are accepted. A kind with no listings in a place returns an empty result. Required with a destination; optional when looking up by name"
                  },
                  "check_in": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "ISO 8601 start date (YYYY-MM-DD). Required for hotel and flight; optional for activity/restaurant/transfer"
                  },
                  "check_out": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "ISO 8601 end of the hotel stay or optional search window. This does not request a return flight; use return_date for a round trip."
                  },
                  "currency": {
                    "anyOf": [
                      {
                        "pattern": "^[A-Za-z]{3}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "ISO 4217 code of the user's currency, e.g. EUR. Prices come back converted at the current rate and marked price_conversion=current_rate. Omitted: a signed-in user's prices come in their own Zestli currency (their saved choice, else home country or language, else USD); without a signed-in user they stay in each item's listed currency. An item with no rate keeps its listed currency, as does every item for KWD, BHD, JOD, OMR and TND, which Zestli can't charge in yet; message then names the listed currency."
                  },
                  "cursor": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Opaque next_cursor from a previous search_supply page, passed back exactly (fetches the next page). INVALID_CURSOR or SUPPLY_RESULT_SET_EXPIRED: run the search again with the same inputs"
                  },
                  "destination": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Destination city or region, e.g. 'Barcelona', 'Rome, Italy' or 'Portland, ME'; or a destination_id from destination_options or searched_destination, which searches exactly that place. Omit it only when the user names an offering or its operator but no place: query then holds the name and listings are looked up by name everywhere"
                  },
                  "filters": {
                    "additionalProperties": true,
                    "description": "Optional structured filters, and only these: subcategory (activity); accessibility_required (true for any stated accessibility, or a list of accessible_bathroom, elevator, entrance_ramp, hearing_assist, limited_mobility, low_vision, medical_equipment, service_animal, sign_language_guide_available, step_free, wheelchair_accessible, wheelchair_accessible_route; elevator is a lift and entrance_ramp a ramp at the entrance, neither is step-free); accessibility_in_room_required (true for any, or a list of accessible_bathtub, grab_bars_bathroom, lowered_counters, raised_toilet_seat, roll_in_shower, visual_alarms). Unknown filters or codes are rejected. When no listing states the accessibility, search without it and ask the operator (for partner supply, the hotel or provider)",
                    "type": "object"
                  },
                  "guest_nationality": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Guest nationality used only when a supplier requires ISO 3166-1 alpha-2 pricing context; never infer it."
                  },
                  "origin": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Flight origin city or IATA code. Required for flights; resolved read-only and returned for confirmation when ambiguous."
                  },
                  "page_size": {
                    "default": 10,
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "query": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional request in the user's words and language, e.g. 'sunset kayak tour, not a big group'; results are ordered by how well they match it. Put accessibility needs in filters.accessibility_required: query_relevance is not a statement about accessibility"
                  },
                  "query_image_url": {
                    "anyOf": [
                      {
                        "maxLength": 2048,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional public https link to the image file itself (not a page showing it) the user shared, with a destination and category; if the photo can't be read, ask for another or describe it in query. Listings whose own photos look most like it come back with query_match looks_like_photo, nearest first (after any query matches)"
                  },
                  "response_format": {
                    "default": "concise",
                    "description": "Both formats include hero media; detailed adds descriptions and blur hashes.",
                    "enum": ["concise", "detailed"],
                    "type": "string"
                  },
                  "return_date": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Flights only: explicit ISO 8601 return departure date for a round trip."
                  },
                  "travelers": {
                    "anyOf": [
                      {
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Number of people including children and infants; omit to search at one-seat capacity and show unit or from prices only"
                  }
                },
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
