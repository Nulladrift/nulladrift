        {
          "name": "set_booking_guest_answers",
          "title": "Set Booking Guest Answers",
          "description": "Save or correct explicit guest answers on your unstarted booking proposal.\n\nAfter initiate_booking, ask the exact guest_questions from the quote/review. Never\ninfer dietary, accessibility or other answers. Send proposal_id, its current review\nfingerprint, and ALL answers to keep as supply_id, offer_id, question_id and answer.\nEmpty clears an answer; omitted optional questions stay unanswered. Choice answers\nmust exactly match an offered choice. This is a reversible save, never purchase\nconsent. The result includes the new review fingerprint and exact answers. For a\ncorrection, use that new fingerprint. Started purchases and stale concurrent edits\nrefuse. Required blanks can be saved, but block payment until answered. The user\ncan also answer on hosted checkout; after saving ask for human booking approval.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Replace all answers on the currently reviewed proposal, without purchasing.",
                "properties": {
                  "answers": {
                    "items": {
                      "additionalProperties": false,
                      "description": "A user's explicit answer, or an empty string to clear one.",
                      "properties": {
                        "answer": {
                          "type": "string"
                        },
                        "offer_id": {
                          "format": "uuid",
                          "type": "string"
                        },
                        "question_id": {
                          "type": "string"
                        },
                        "supply_id": {
                          "format": "uuid",
                          "type": "string"
                        }
                      },
                      "required": ["answer", "offer_id", "question_id", "supply_id"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "expected_fingerprint": {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  "proposal_id": {
                    "format": "uuid",
                    "type": "string"
                  }
                },
                "required": ["answers", "expected_fingerprint", "proposal_id"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Set Booking Guest Answers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/widgetAccessible": true,
            "securitySchemes": [
              {
                "scopes": ["commerce:book"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://commerce/booking-review"
            }
          },
          "digest": "sha256:5767e2e18c33a504af31b518d150408bb61152376c8ceb2e43c68a670db1e957"
        },
        {
          "name": "set_booking_travelers",
          "title": "Set Booking Travelers",
          "description": "Save each person's details on your user's own unstarted booking proposal.\n\nUse it when a proposal lists travelers_needed and the user will approve in chat.\nRequires the user's own Zestli connection. Send one entry per slot, in slot\norder, with exactly that slot's fields as the user states them, as on their\nID (and its optional_fields only when the user gives them): never guess or\nreuse one person's details for another, and ask for nothing a slot doesn't list.\nOmit email and phone for a contact_is_payer slot. Zestli checks each date of birth\nagainst the quoted ages on the travel date (for an operator rate option, its age\nrange, and that an adult travels when it needs one); a mismatch saves and charges\nnothing and needs a fresh quote with the right ages. Passport details are never taken in chat:\nwhen a slot needs identity_documents, give the user checkout_url. Sending a new\nlist replaces the saved one, and the user must approve again. This never\napproves or pays: the result is the proposal whose review names each person for\nthe user's approval.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "Every quoted person for one proposal, in travelers_needed order.",
                "properties": {
                  "proposal_id": {
                    "description": "The proposal from initiate_booking",
                    "format": "uuid",
                    "type": "string"
                  },
                  "travelers": {
                    "description": "One entry per travelers_needed slot, in order",
                    "items": {
                      "additionalProperties": false,
                      "description": "One quoted person as the user stated them; only the slot's fields.",
                      "properties": {
                        "age_on_day": {
                          "anyOf": [
                            {
                              "maximum": 120,
                              "minimum": 0,
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "Whole years on the day of the booking, where a slot asks for it"
                        },
                        "born_on": {
                          "anyOf": [
                            {
                              "maxLength": 10,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "YYYY-MM-DD; flights only"
                        },
                        "email": {
                          "anyOf": [
                            {
                              "maxLength": 254,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "Lead guest only"
                        },
                        "family_name": {
                          "anyOf": [
                            {
                              "maxLength": 100,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "As on their ID"
                        },
                        "gender": {
                          "anyOf": [
                            {
                              "enum": ["m", "f"],
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "As on their passport"
                        },
                        "given_name": {
                          "anyOf": [
                            {
                              "maxLength": 100,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "As on their ID"
                        },
                        "nationality": {
                          "anyOf": [
                            {
                              "maxLength": 2,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "ISO 3166-1 alpha-2, as on their passport"
                        },
                        "phone_number": {
                          "anyOf": [
                            {
                              "maxLength": 32,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "Lead guest only; international form with + and country code"
                        },
                        "title": {
                          "anyOf": [
                            {
                              "maxLength": 8,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
