        {
          "name": "start_split_payment",
          "title": "Start Split Payment",
          "description": "Split one unpaid booking proposal between several people who each pay their share.\n\nIt fits when the user (the organizer) wants the group to pay separately for one\nbooking; friends buying their own places make separate bookings instead.\nOpens a pay-together window of up to 24 hours, ending before the experience starts\n(not a price lock), and returns one hosted link per payer. Seats are held once\npayments reach an equal share of the total; until then only as long as the quote. Each payer signs in as themselves\nand authorizes their share plus an equal part of the split payment fee, shown before\npaying. Zestli books only when every share is authorized, then charges everyone; a\ndecline, expiry, or price or terms change releases everyone and books nothing.\nRequires the user's own Zestli connection (OAuth): a partner API key cannot\norganize and gets ORGANIZER_ACCOUNT_REQUIRED; the user can then choose \"Split the\ncost with others\" on the hosted checkout page. Operator offerings only for now.\nEqual shares give leftover cents to the organizer. Links are emailed only with\nsend_links. Retrying returns the same window. Cards are entered only on each\npayer's hosted page, never through this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "Open a pay-together window on an unstarted booking proposal.",
                "properties": {
                  "payers": {
                    "description": "Every payer, the organizer (this user) first.",
                    "items": {
                      "description": "One payer of the booking.",
                      "properties": {
                        "amount_minor": {
                          "anyOf": [
                            {
                              "minimum": 1,
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "Custom share in minor units. Give it for every payer or none; custom shares must add up exactly to the booking total. Omit for equal shares."
                        },
                        "email": {
                          "anyOf": [
                            {
                              "format": "email",
                              "maxLength": 254,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "Payer's email, used only when send_links is true (Zestli caps how many it sends a day). Omit to share the link yourself."
                        },
                        "name": {
                          "description": "How the organizer refers to this payer (a first name is enough). The first payer is the organizer.",
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    },
                    "maxItems": 12,
                    "minItems": 2,
                    "type": "array"
                  },
                  "proposal_id": {
                    "description": "The proposal_id initiate_booking returned.",
                    "type": "string"
                  },
                  "send_links": {
                    "default": false,
                    "description": "Email each payer their link. Only when the organizer asked to send them.",
                    "type": "boolean"
                  },
                  "window_minutes": {
                    "anyOf": [
                      {
                        "maximum": 1440,
                        "minimum": 5,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "A shorter window if the group wants one. It never lengthens the window past its limit (24 hours for operator offerings, ending before the start)."
                  }
                },
                "required": ["payers", "proposal_id"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booking_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "booking_reference": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
