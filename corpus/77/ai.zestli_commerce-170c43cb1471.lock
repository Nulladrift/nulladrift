                  },
                  "offer_id": {
                    "anyOf": [
                      {
                        "format": "uuid",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Exact offering ID returned by search/details; retain it with supply_id so the selected operator and commercial terms cannot change."
                  },
                  "rate_options": {
                    "description": "Scheduled experiences with `rate_options`: the user's choice, e.g. 2 x adult and 1 x child (quantities add up to travelers), or 1 x a per_booking option for the whole party. Required when an offering has more than one option; never choose for them.",
                    "items": {
                      "description": "How many people book at one of the offering's rate options.",
                      "properties": {
