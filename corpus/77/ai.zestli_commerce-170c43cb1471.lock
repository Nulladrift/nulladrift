        {
          "name": "cancel_split_payment",
          "title": "Cancel Split Payment",
          "description": "End an unfinished pay-together window at the organizer's request.\n\nEvery authorization is released; nothing is booked or charged. Only the organizer\ncan do this, and only before the booking is made. After booking, cancel the booking\nitself with cancel_booking (refunds go to each payer's own card).",
