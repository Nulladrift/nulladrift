        {
          "name": "list_date_change_options",
          "title": "List Date Change Options",
          "description": "List the other dates a booking can move to for free under its operator's date-change term, each with seats left, the new price and any refund (a cheaper date refunds the difference times the refund cancelling now gives: all of it in a full-refund window, half in a 50% one, nothing in a no-refund one; a dearer date costs nothing extra, unless an earlier move already refunded money: then it is listed unavailable). A move caps what any later cancellation refunds: each option's refund_cap_text states the most it refunds in money after that move, and that with the move's refund it is at most refund_cap_percent of the original price; tell the user before they approve. Read-only. Whole party, single-offering bookings only; without the term, a date change is a cancellation under the booking's terms and a new booking.",
