        {
          "name": "confirm_booking",
          "title": "Confirm Booking",
          "description": "Use this when the user asks to continue an owned, unexpired proposal. Without payment it returns the secure hosted checkout handoff and charges nothing: that page verifies the user, shows the current price and cancellation terms, and collects the lead guest, approval and payment. After the user paid there, call it again with the proposal_id: it returns the booking and charges nothing. With payment (a Stripe shared payment token your platform issued for this purchase with the user's approval) it charges that token for the exact quoted total and returns the booking outcome; a changed total charges nothing (TOTAL_CHANGED). For a person under 18 it returns status guardian_must_pay, charges nothing and gives no checkout: use ask_someone_to_pay instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "Input for confirming a booking proposal.",
                "properties": {
                  "confirmed": {
                    "default": true,
                    "description": "Leave true. It does not approve payment: the user approves and pays on the secure checkout this returns, or through payment.",
                    "type": "boolean"
                  },
                  "payment": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "A Stripe shared payment token the user's assistant platform issued for this purchase.\n\nSame party rules as the ACP purchase body (``ExternalPurchaseRequest``).",
                        "properties": {
                          "currency": {
                            "description": "The quoted ISO-4217 currency, e.g. USD",
                            "maxLength": 3,
                            "minLength": 3,
                            "type": "string"
                          },
                          "expected_total_minor": {
                            "description": "The total the user approved, in minor units, exactly as quoted. If the booking's total differs, nothing is charged (TOTAL_CHANGED)",
                            "type": "integer"
                          },
                          "guest": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "description": "An actual lead contact for direct supply or a supported partner booking.",
                                "properties": {
                                  "email": {
                                    "format": "email",
                                    "type": "string"
                                  },
                                  "family_name": {
                                    "maxLength": 100,
                                    "minLength": 1,
                                    "type": "string"
                                  },
                                  "given_name": {
                                    "maxLength": 100,
                                    "minLength": 1,
                                    "type": "string"
                                  },
                                  "phone_number": {
                                    "anyOf": [
                                      {
                                        "maxLength": 32,
                                        "type": "string"
                                      },
                                      {
                                        "type": "null"
                                      }
                                    ],
                                    "default": null
                                  }
                                },
                                "required": ["email", "family_name", "given_name"],
                                "type": "object"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "Direct operator bookings: the lead guest's contact"
                          },
                          "payer_email": {
                            "description": "The email of whoever pays: Zestli, the merchant of record, emails them the payment receipt and any refund confirmation",
                            "format": "email",
                            "type": "string"
                          },
                          "shared_payment_token": {
                            "description": "A Stripe shared payment token (spt_...) that your platform issued for this exact purchase after the user approved paying this total. Zestli charges only a token Stripe issued for this purchase. Without a token, omit payment and use the hosted checkout.",
                            "format": "password",
                            "maxLength": 255,
                            "pattern": "^spt_[A-Za-z0-9_]+$",
                            "type": "string",
                            "writeOnly": true
                          },
                          "travelers": {
                            "anyOf": [
                              {
                                "items": {
                                  "additionalProperties": false,
                                  "description": "One quoted person as the user gave them.",
                                  "properties": {
                                    "age_on_day": {
                                      "anyOf": [
                                        {
                                          "maximum": 120,
                                          "minimum": 0,
                                          "type": "integer"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ],
                                      "default": null,
                                      "description": "Whole years on the day of the booking"
                                    },
                                    "born_on": {
                                      "anyOf": [
                                        {
                                          "format": "date",
                                          "type": "string"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ],
                                      "default": null,
                                      "description": "Flights only"
                                    },
                                    "email": {
                                      "anyOf": [
                                        {
                                          "format": "email",
                                          "type": "string"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ],
                                      "default": null
                                    },
                                    "family_name": {
                                      "anyOf": [
                                        {
                                          "maxLength": 100,
                                          "type": "string"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ],
                                      "default": null
                                    },
                                    "gender": {
                                      "anyOf": [
                                        {
                                          "enum": ["m", "f"],
                                          "type": "string"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ],
                                      "default": null,
                                      "description": "As on the passport"
                                    },
                                    "given_name": {
                                      "anyOf": [
                                        {
                                          "maxLength": 100,
                                          "type": "string"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ],
                                      "default": null
                                    },
                                    "nationality": {
                                      "anyOf": [
                                        {
                                          "maxLength": 2,
                                          "type": "string"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ],
                                      "default": null,
                                      "description": "ISO 3166-1 alpha-2; only when required"
                                    },
                                    "phone_number": {
                                      "anyOf": [
                                        {
                                          "maxLength": 32,
                                          "type": "string"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ],
                                      "default": null
                                    },
                                    "title": {
                                      "anyOf": [
                                        {
                                          "maxLength": 8,
                                          "type": "string"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ],
                                      "default": null,
                                      "description": "Only when required"
                                    }
                                  },
                                  "type": "object"
                                },
                                "maxItems": 20,
                                "minItems": 1,
                                "type": "array"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "Supplier hotel/flight bookings: every quoted person, lead first. Direct operator bookings with age-priced tickets: with guest, each travelers_needed slot's date of birth, in order"
                          }
                        },
                        "required": ["currency", "expected_total_minor", "payer_email", "shared_payment_token"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Only when your platform issued a Stripe shared payment token for this purchase with the user's approval: Zestli charges it for the exact quoted total and books. Omit it to get the hosted checkout instead."
                  },
                  "proposal_id": {
                    "description": "Proposal UUID from initiate_booking",
                    "type": "string"
                  }
                },
                "required": ["proposal_id"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
