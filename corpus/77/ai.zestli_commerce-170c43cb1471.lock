          "name": "create_quote",
          "title": "Create Quote",
          "description": "Use this when the user is ready to see a firm, bookable price for specific supply items (supply_ids from search_supply). For a scheduled experience with several departures, pass the user's chosen occurrence_id; without it the result is OCCURRENCE_CHOICE_REQUIRED with occurrence_choices. When it has rate_options (e.g. adult/child, private group) pass the user's choice, plus any add_ons they want. Live-prices each item and records a quote with a 15-minute expiry and a line-item payment breakdown. Expiry is not a supplier price or inventory lock; checkout revalidates price, availability and terms. Separate supplier charges may be incomplete; only a stated all-in total is all-in. Quoting never charges or holds anything — booking happens via initiate_booking + confirm_booking. Flights are quoted only where Zestli sells them; otherwise FLIGHTS_NOT_SOLD. For hotels with more than one person, ask how to split adults and children across rooms; never assume. Rentals (bikes, boats, boards, gear) sell a fixed list of durations from allowed pickup times: pass rental_selection with the duration, local pickup time and every item or kit with its quantity in one quote; the result states the pickup and return times. Tell the user any line item's travel_notice before they pay. State amounts using the *_display fields.",
