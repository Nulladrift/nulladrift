        {
          "name": "initiate_booking",
          "title": "Initiate Booking",
          "description": "Use this when the user has agreed to a quoted price and wants to book: turns a live quote_id into a booking proposal with final pricing and terms for review. Nothing is charged or booked yet — show the proposal to the user. When they want to go ahead, call request_human_booking_approval (an approval form in this chat, with a saved card) or confirm_booking (Zestli's secure checkout link) with the proposal_id. Payment happens only in that form or on the checkout, where the user approves and pays; a reply in chat pays nothing. For a person under 18 (guardian_must_pay true) there is no checkout: use ask_someone_to_pay so their parent or legal guardian pays. Send one idempotency_key per intended purchase and reuse it on retry; each call without one creates a new proposal that holds its own seats. Creating another proposal, including from a revised quote, does not replace or release an earlier proposal or hold. Only a current Zestli readback establishes whether an earlier hold is active, released, or expired. State amounts using the *_display fields.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "Input for initiating a booking (creates a proposal, not a booking).",
                "properties": {
                  "idempotency_key": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "One key per intended purchase, chosen by you (e.g. a UUID). Reuse it when retrying the same request after an error or lost response: you get the same proposal and the seat is held once. Use a new key only for a genuinely separate booking. Reusing a key with different inputs is refused."
                  },
                  "lead_guest": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "The lead guest as the user gave them: a name, and an email or phone if they gave one.",
                        "properties": {
                          "email": {
                            "anyOf": [
                              {
                                "format": "email",
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "Lead guest's email"
                          },
                          "full_name": {
                            "description": "Lead guest's full name, as on their ID",
                            "maxLength": 200,
                            "minLength": 1,
                            "type": "string"
                          },
                          "phone": {
                            "anyOf": [
                              {
                                "maxLength": 32,
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "Lead guest's phone with country code, for example +1 415 555 0100"
                          }
                        },
                        "required": ["full_name"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Only what the user has told you: the lead guest's full name, plus an email or phone only if the user gave one. If the user hasn't named a guest, omit this and the checkout asks. Never invent or guess any of it. Shared with the operator of this booking only; the user can change it on the checkout."
                  },
                  "quote_id": {
                    "description": "Quote UUID from create_quote",
                    "type": "string"
                  }
                },
                "required": ["quote_id"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
