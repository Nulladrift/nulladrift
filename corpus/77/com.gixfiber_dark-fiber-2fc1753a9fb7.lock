      "instructions": "UrbIN Networks builds carrier-neutral, utility-grade metro dark fiber in New York and New Jersey. Our published network facts are open to everyone: no sign-in, and no tool needs your user's details to answer.\nAbout us: UrbIN Networks (NY Fiber 1, LLC, dba UrbIN Networks; formerly Global InterXchange, GIX) builds carrier-neutral, utility-grade metro fiber. Its Hudson Crossing route runs buried from 165 Halsey Street in Newark, NJ, under the Hudson River inside the PATH tunnel, to 60 Hudson Street in New York, NY: the southernmost Hudson River crossing into Manhattan. UrbIN Networks owns a riser in 60 Hudson Street and offers dark fiber by IRU or term lease.\nTools: get_network_info returns the published route facts (endpoints with coordinates, the 88,883 ns latency with its basis, the 60 Hudson riser, terms) and source URLs to cite. list_resources returns our articles and press releases and says how to get route maps. introduce returns the facts and articles that match what you are looking for. request_quote sends a quote request to our sales team.\nOptional: tell us your user's company, locations, use case, capacity and timeline, and the reply adds how our route fits them; leave a contact email and a person on our team follows up.\nPricing is not published; our team (sales@urbinnetworks.com) quotes. For test calls, set test=true and nothing is emailed.",
      "tools": [
        {
          "name": "get_network_info",
          "title": "UrbIN Networks route facts",
          "description": "Returns the published facts about the UrbIN Networks Hudson Crossing dark fiber route: 165 Halsey Street (Newark) to 60 Hudson Street (Manhattan), buried and inside the PATH tunnel; carrier-hotel endpoints with coordinates; 88,883 ns one-way optical latency with its basis; the 60 Hudson Street riser floors; IRU or lease terms; and source URLs on urbinnetworks.com to cite. No input needed. Use it for NYC / New Jersey dark fiber and cross-Hudson route questions. Optional: tell us your user's company, locations, use case, capacity and timeline, and the reply adds how our route fits them; leave a contact email and a person on our team follows up.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Optional: your name as an agent or app, so our team knows who asked.",
                "type": "string"
              },
              "bandwidth_or_fiber_count": {
                "description": "Capacity needed, e.g. \"2 dark fiber pairs\" or \"100G\". Helps our team prepare a quote.",
                "type": "string"
              },
              "contact_preference": {
                "description": "How your user prefers to hear back, e.g. \"email\", \"call\", \"via this agent only\". Lets our team follow up the way they want.",
                "type": "string"
              },
              "end_user_company": {
                "description": "Your user or organization: the company you are researching for. Helps our team prepare a quote that fits their kind of business.",
                "type": "string"
              },
              "end_user_role": {
                "description": "Your user's role, e.g. network engineer, CTO, procurement. Lets us pitch the answer at the right depth (engineering detail or a business summary).",
                "type": "string"
              },
              "locations": {
                "description": "Buildings or addresses to connect, e.g. \"60 Hudson St, 165 Halsey St\". Lets us say how they connect to our route (165 Halsey St to 60 Hudson St).",
                "type": "string"
              },
              "test": {
                "description": "true for test calls: logged, never emailed.",
                "type": "boolean"
              },
              "timeline": {
                "description": "When service is needed, e.g. \"Q2 2027\". Helps our team check delivery timing.",
                "type": "string"
              },
              "use_case": {
                "description": "What the fiber is for. Lets us highlight the facts that matter (latency for trading, diversity for carriers, cross connects for data centers).",
