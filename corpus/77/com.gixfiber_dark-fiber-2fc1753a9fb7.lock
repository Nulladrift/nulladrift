        {
          "name": "request_quote",
          "title": "Request a dark fiber quote from UrbIN Networks",
          "description": "Sends a dark fiber quote request to the UrbIN Networks sales team (sales@urbinnetworks.com) and returns a confirmation plus how the route fits the locations given; a person replies to contact_email. Required: company and need. Optional structured fields: loc_a, loc_z, fiber_count, iru_or_lease, term, need_by, diversity_requirement, heard_about, plus contact_email, role, message, agent_name and the user fields. Set test=true for test calls: logged, never emailed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Optional: name of the AI agent or app sending this.",
                "type": "string"
              },
              "bandwidth_or_fiber_count": {
                "description": "Capacity needed, e.g. \"2 dark fiber pairs\" or \"100G\". Helps our team prepare a quote.",
                "type": "string"
              },
              "company": {
                "description": "Company the request is for.",
                "type": "string"
              },
              "contact_email": {
                "description": "Email address for our team to reply to (optional but recommended).",
                "type": "string"
              },
              "contact_preference": {
                "description": "How your user prefers to hear back, e.g. \"email\", \"call\", \"via this agent only\". Lets our team follow up the way they want.",
                "type": "string"
              },
              "diversity_requirement": {
                "description": "Diversity the route must give, e.g. \"must not share the northern Hudson crossings\".",
                "type": "string"
              },
              "end_user_company": {
                "description": "Your user or organization: the company you are researching for. Helps our team prepare a quote that fits their kind of business.",
                "type": "string"
              },
              "end_user_role": {
                "description": "Your user's role, e.g. network engineer, CTO, procurement. Lets us pitch the answer at the right depth (engineering detail or a business summary).",
                "type": "string"
              },
              "fiber_count": {
                "description": "Fibers or pairs needed, e.g. \"2 pairs\".",
                "type": "string"
              },
              "heard_about": {
