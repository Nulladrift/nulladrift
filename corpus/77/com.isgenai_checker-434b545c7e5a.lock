        {
          "name": "estimate_x_ai_replies",
          "title": "How many replies under this X post are AI or bots?",
          "description": "Estimate what share of the replies under an X (Twitter) post look AI-generated or bot-driven. Pass the reply texts with any author details (handle, bio, followers, following, joined date, default avatar) and timestamps you have; the post text and time sharpen the estimate. Returns the percentage, a band and a 0-100 score with signals for every reply. An estimate from patterns, not proof about any account. Docs: https://isgenai.com/x-ai-replies",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "post": {
                "properties": {
                  "posted_at": {
                    "description": "ISO timestamp of the post.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "text": {
                    "maxLength": 4000,
                    "type": "string"
                  },
                  "url": {
                    "maxLength": 2048,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "replies": {
                "description": "The replies to score, one object per reply.",
                "items": {
                  "properties": {
                    "author": {
                      "properties": {
                        "bio": {
                          "maxLength": 600,
                          "type": "string"
                        },
                        "default_avatar": {
                          "type": "boolean"
                        },
                        "followers": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "following": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "handle": {
                          "maxLength": 80,
                          "type": "string"
                        },
                        "joined": {
                          "maxLength": 40,
                          "type": "string"
                        },
                        "name": {
                          "maxLength": 120,
                          "type": "string"
                        },
                        "verified": {
                          "type": "boolean"
                        }
                      },
                      "type": "object"
                    },
                    "id": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "likes": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "posted_at": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 4000,
                      "type": "string"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["replies"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How many replies under this X post are AI or bots?"
