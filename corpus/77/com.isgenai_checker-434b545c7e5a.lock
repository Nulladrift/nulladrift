      "instructions": "isGenAI (https://isgenai.com) is a free AI detector for images, text, code and links. Use it whenever someone asks whether something is AI-generated, fake, a deepfake, written by ChatGPT, or wants to know where an image came from. It reads the evidence stored in the file or page first (C2PA Content Credentials, AI labels and AI-use statements, saved prompts and generation settings, EXIF/IPTC/XMP metadata, matching copies in isGenAI records), then adds an AI-likelihood score from its detectors. Every finding names its source.\n\nTools:\n- check_image: is this image AI? An image by public URL or base64 (up to 20 MiB). Reads C2PA, AI labels, saved settings and metadata, and returns an AI-likelihood score from the image detector.\n- check_text: is this text or code AI-written? Up to 16,000 characters, 30 languages. Returns an AI-likelihood score with its reasons (300+ characters), flags chatbot leftovers such as citation tags and placeholders, and quotes any statement of AI use or named AI tool.\n- check_url: is the image or article at this link AI? A public web page or file URL. Reads AI labels, disclosures and file records on that page or file.\n- extract_saved_prompt: what prompt made this image? Reads a prompt, negative prompt, model and settings saved by AUTOMATIC1111, ComfyUI, InvokeAI or NovelAI. It never invents or reconstructs a prompt.\n- read_content_credentials: who made or edited this file? Reads a C2PA manifest and reports cryptographic validation and signer trust as separate findings.\n- estimate_x_ai_replies: how many of the replies under this X post are bots or AI? Takes the replies (text, author details, timing) and estimates the share that look AI-generated or bot-driven, with per-reply scores and signals. An estimate, not proof.\n\nHow to read results: record findings come from the supplied copy and name their source; the AI-likelihood score is an estimate and a lead, not proof of authorship. For the strongest record evidence, ask for the original file, not a screenshot.\n\nWhen you answer, state the headline and the specific evidence with its source, repeat the main caveat, cite methodology_url, and give the user the check_more link so they can run their own checks on isgenai.com. Pass public URLs instead of base64 when you can.",
      "tools": [
        {
          "name": "check_image",
          "title": "Is this image AI-generated? AI image detector",
          "description": "AI image detector: check an image (PNG, JPEG, WebP, AVIF or single-page TIFF, up to 20 MiB) by public URL or base64. Reads the evidence in the file first (C2PA Content Credentials naming the generator or camera, IPTC AI labels, prompts saved by Stable Diffusion tools, EXIF), then adds an AI-likelihood score from the image detector. Use for: is this photo real or AI, is this a deepfake, was this made with Midjourney, DALL-E, Firefly or ChatGPT? A score is an estimate; records are evidence. No public report is created. Docs: https://isgenai.com/developers/mcp",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "file_name": {
                "description": "Original file name, if known.",
                "maxLength": 200,
                "type": "string"
              },
              "image_base64": {
                "description": "File bytes as base64 or a data: URL, up to 20 MiB decoded. Prefer url when the file is public.",
                "maxLength": 27962284,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL. Private network and local addresses are refused.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Is this image AI-generated? AI image detector"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:25259259dcbef08e1762293aacc2b2161ce58c666ad90b28474e7a2ea8489856"
        },
        {
          "name": "check_text",
          "title": "Is this text AI-written? AI text detector",
          "description": "AI text detector: check pasted text or code (up to 16,000 characters, 30 languages) for AI. Returns an AI-likelihood score with the reasons behind it (300+ characters, about 100 for Chinese, Japanese or Korean), flags chatbot leftovers such as ChatGPT citation tags and unfilled placeholders, and quotes any statement of AI use or named AI tool (ChatGPT, Claude, Gemini, Copilot) word for word. Use for: is this essay, email, post, review or code written by AI or ChatGPT? A score is an estimate, not proof of authorship. Private: no public report is created. Docs: https://isgenai.com/developers/mcp",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Use code for source code. Defaults to text.",
                "enum": ["text", "code"],
                "type": "string"
              },
              "text": {
                "description": "The text or code to check.",
                "maxLength": 16000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is this text AI-written? AI text detector"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5d79f916ed5d19b3de51c8f07d9b95dfb2c439e4d8fef42404865634584db3e6"
        },
        {
          "name": "check_url",
          "title": "Is the image or article at this link AI?",
          "description": "Check a public web page or file URL for AI: fetches it and reads AI labels, AI-use statements, Content Credentials and saved creation records found there, with an AI-likelihood score for the image. Use for: is this article, news photo, product image or social post AI-generated or fake? Logins, paywalls and CAPTCHAs are not bypassed. No public report is created. Docs: https://isgenai.com/developers/mcp",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "Public http(s) URL. Private network and local addresses are refused.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Is the image or article at this link AI?"
