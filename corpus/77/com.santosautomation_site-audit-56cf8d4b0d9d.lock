        {
          "name": "extract_structured_data",
          "description": "PAID CAPABILITY ($0.08 USDC per successful schema-conforming extraction via x402 v2). Fetches one public page and returns JSON fields extracted by an LLM against your own JSON Schema, re-validated against that schema before return; non-conforming output returns 422 and never settles. Single page only — no crawling or JavaScript rendering; page content is truncated to 8000 characters. This MCP call validates the target and returns the canonical x402 HTTP handoff; payment and the result are exchanged at POST https://api.santosautomation.com/v1/extract/structured with {\"url\": \"…\", \"schema\": {...}} — POST only, because a JSON Schema does not fit in a query string. No account or API key is required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "schema": {
                "description": "Optional here — the handoff is returned either way. Required on the paid POST: a self-contained JSON Schema (type: object, no $ref) describing the fields to extract. Max 4000 characters.",
