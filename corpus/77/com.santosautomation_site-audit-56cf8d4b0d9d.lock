      "instructions": "audit_website_preview is the ONE free tool: a real Quick Intelligence Audit, 1/day per caller IP, meant as a sample of the output rather than as capacity. Every other tool is paid via x402 v2 on Base mainnet and returns a canonical HTTP handoff rather than data — the MCP call validates the target and tells you exactly where to pay: audit_agent_readiness ($0.075 USDC), extract_page_markdown (/v1/extract, $0.005), extract_structured_data (POST /v1/extract/structured, $0.08), feed_parse (/v1/feed, $0.003), link_map (/v1/links, $0.003), summarize (/v1/summarize, $0.033). No account or API key is required for any of them. Humans without a USDC wallet can buy a report by card at https://api.santosautomation.com/agent-readiness/buy.",
      "tools": [
        {
          "name": "audit_agent_readiness",
          "description": "PAID CAPABILITY ($0.075 USDC per successful audit via x402 v2). Passively assesses how well a public website or service can be discovered, understood, invoked, and—where explicitly applicable—paid by agents. This MCP call validates the target and returns the canonical x402 HTTP handoff; payment and the versioned result are exchanged at GET https://api.santosautomation.com/api/agent-readiness?url=...&depth=quick. No account or API key is required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "depth": {
                "default": "quick",
                "enum": ["quick"],
                "type": "string"
              },
              "url": {
                "description": "A publicly reachable HTTP or HTTPS target.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
