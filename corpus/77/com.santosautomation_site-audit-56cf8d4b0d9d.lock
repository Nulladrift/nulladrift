        {
          "name": "audit_website_preview",
          "description": "FREE PREVIEW (1 audit per day per caller IP) of Santos Website Intelligence. Runs a fast Quick Intelligence Audit of one public page: fetch timing, page weight, SEO, basic HTML accessibility, security headers, Website Intelligence dimensions, pass/fail checks, and remediation guidance. It audits one page only—no crawling, JavaScript rendering, Core Web Vitals, WCAG certification, or vulnerability scanning. Note for hosted agents: the quota is keyed on the calling IP, so all users of one platform share a single daily preview. Treat it as a sample of the output, not as capacity. For real use, call the machine-payable production endpoint: GET https://api.santosautomation.com/api/audit?url=... — $0.015 USDC per successful audit on Base mainnet (eip155:8453) via x402 v2; no account or API key required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "A publicly reachable HTTP or HTTPS page.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "audited_by": {
                "type": "string"
              },
              "checks": {
                "description": "Individual pass/fail checks with detail.",
                "type": "object"
              },
              "fetched_at": {
                "format": "date-time",
                "type": "string"
              },
              "http_status": {
                "type": "integer"
              },
              "issues": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "overall_score": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "schema_version": {
                "type": "string"
              },
              "scores": {
                "description": "performance, seo, accessibility, security (0-100 each).",
                "type": "object"
              },
