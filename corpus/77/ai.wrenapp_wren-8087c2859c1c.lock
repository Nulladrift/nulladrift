                "required": ["figureContent", "figureKind"],
                "type": "object"
              },
              "noteId": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "pages": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "covers": {
                      "maxLength": 160,
                      "minLength": 1,
                      "type": "string"
                    },
                    "pageKind": {
                      "enum": ["worked_example", "concept_summary", "comparison_sheet", "process_walkthrough", "revision_sheet", "verbatim"],
                      "type": "string"
                    },
                    "part": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "maxLength": 160,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["covers", "pageKind", "title"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "subject": {
                "description": "Subject, printed on the cover and used to file the note.",
                "maxLength": 120,
                "type": "string"
              },
              "title": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
