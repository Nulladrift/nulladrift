        {
          "name": "draw_figure",
          "title": "Draw one figure in Wren",
          "description": "Draws one standalone figure in the user's Wren notebook, large on its own page: a graph, labelled diagram, chart, table, timeline, flowchart, mind map, concept map, number line or shapes. Figure only, no text blocks (write_notebook_page pages can hold figure blocks next to text). No target: a new note. target.noteId: a new page at the end of that note; with target.pageNumber: drawn onto that page if Wren wrote it (mode append keeps its ink, replace redraws it). The result includes noteUrl, a private link that opens in the user's Wren account after sign-in. Wren emails the user a link to their first note saved here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "additionalProperties": false,
                "properties": {
                  "course": {
                    "description": "Course name, printed on the notebook cover.",
                    "type": "string"
                  },
                  "language": {
                    "description": "BCP-47 language tag of the page text; sets the writing direction (right-to-left or left-to-right).",
                    "type": "string"
                  },
                  "subject": {
                    "description": "Subject, printed on the notebook cover and used to file the note.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "figure": {
                "additionalProperties": false,
                "properties": {
                  "content": {
                    "additionalProperties": {},
                    "description": "graph_2d {prompt:\"y = x^2 - 4\"} (one equation) or {xRange,yRange,curves:[{equation}]}; formula {latex}; table {headers,rows}; bar_chart {bars:[{label,value}],title?}; timeline {events:[{id,at,label}]}; flowchart {nodes:[{id,label}],edges:[{from,to}]}; mindmap {root:{id,label},branches:[{id,label,children?}]}; concept_map {nodes,edges:[{from,to,label}]}; labelled_diagram {center,outline?,labels:[{text,shape?}]}; number_line {min,max,step?,marks?:[{value,label?}]}; shapes {shapes:[{shape,x,y,w,h,label?}]} (x,y,w,h 0..1).",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "kind": {
                    "enum": ["graph_2d", "table", "bar_chart", "timeline", "flowchart", "mindmap", "concept_map", "formula", "labelled_diagram", "shapes", "number_line"],
                    "type": "string"
                  }
                },
                "required": ["content", "kind"],
                "type": "object"
              },
              "subject": {
                "description": "Subject a new note is filed under.",
                "maxLength": 120,
                "type": "string"
              },
              "target": {
                "additionalProperties": false,
                "properties": {
                  "mode": {
                    "enum": ["append", "replace"],
                    "type": "string"
                  },
                  "noteId": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "pageNumber": {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["noteId"],
                "type": "object"
              },
              "title": {
                "description": "A new note's title.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["figure"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "figureKind": {
                "type": "string"
              },
              "noteId": {
                "type": "string"
              },
              "noteUrl": {
                "description": "Private link to the note in the user's Wren account (opens after sign-in).",
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "pageCount": {
                "type": "number"
              },
              "pageId": {
                "type": "string"
              },
              "pageNumber": {
                "type": "number"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
