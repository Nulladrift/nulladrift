        {
          "name": "write_notebook_page",
          "title": "Write a handwritten Wren notebook page",
          "description": "Write a handwritten study page in the user's Wren notebook (same topic -> target.noteId, not a new note). Write a FULL page (not for verbatim): 110-140 words in 6-8 blocks (a table/figure = ~40 words), a heading per part, 3-6 key terms marked (underline/highlight; a mark copies exact words of its own block), every number+unit and formula marked as math (its latex keeps every word: 20\\ \\text{m/s}), one accent, at most 1 short marginNote, the takeaway in a callout (key_answer, key_idea) or summary. Pair two <=12-word callouts with layoutHint:\"side_by_side\". Unknown fields are refused. Editable ink, not the user's own handwriting. Recipes: worked_example = problem callout (box) + 3-4 steps (1-2 sentences + equation each) + Check heading+paragraph + common_mistake & key_answer callouts. concept_summary = definition callout + boxed equation or table/flowchart + 2 headings with 2-sentence paragraphs + key_idea callout. comparison_sheet = 1-sentence intro + 5-6 row table + heading+paragraph on why it matters + common_mistake & key_idea callouts (side_by_side). process_walkthrough = overview + 4-6 steps, each with label (stage name) + 1-2 sentences, optional flowchart showing what the steps don't + key_idea or summary. revision_sheet = 2-3 headings with concise paragraphs/equations + common_mistake & remember callouts (side_by_side) + 4-item checklist. verbatim = text the user gave you to copy: their words unchanged and once, in paragraph/heading blocks, nothing added.",
