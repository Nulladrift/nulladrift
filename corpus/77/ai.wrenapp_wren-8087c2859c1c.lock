        {
          "name": "plan_notebook",
          "title": "Plan a handwritten Wren notebook",
          "description": "Plans a 1-30 page handwritten Wren notebook and writes its cover and contents (page 1; over 8 pages: a cover page and contents pages). The cover is not a slot: slots are the content pages, numbered from 1. Each slot's page is written by write_notebook_page with target.noteId + planSlot, one page per call. With noteId, the plan extends that existing note: new pages become the next slots after the existing ones. Optional per page: part, a topic group such as \"Obstetrics\" (separate from the page title). Optional coverFigure: one on-topic sketch drawn on the cover. Wren emails the user a link to their first note saved here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
