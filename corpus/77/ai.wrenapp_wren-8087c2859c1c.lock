        {
          "name": "draw_figure",
          "title": "Draw one figure in Wren",
          "description": "Draw ONE standalone figure in the user's Wren notebook, big on its own page: a graph, labelled diagram, chart, table, timeline, flowchart, mind map, concept map, number line or shapes. Notes, explanations, worked examples, summaries or text to copy go to write_notebook_page (a figure that goes with text: a figure block there). No target: a new note. target.noteId: a new page at the end of that note (same topic -> same note); with target.pageNumber: drawn onto that page if Wren wrote it (mode append keeps its ink, replace redraws it). The result has a private link (noteUrl; opens in the user's Wren account after sign-in): give it to the user.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "context": {
                "additionalProperties": false,
                "properties": {
                  "course": {
                    "type": "string"
                  },
                  "coveredSoFar": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "goal": {
                    "enum": ["exam_revision", "homework", "lecture_notes", "self_study", "teaching", "copy_text", "other"],
                    "type": "string"
                  },
                  "language": {
                    "type": "string"
                  },
                  "level": {
                    "enum": ["primary", "middle", "high_school", "undergraduate", "graduate", "professional", "other"],
                    "type": "string"
                  },
                  "subject": {
                    "type": "string"
                  },
                  "userRequest": {
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "conversation_id": {
                "description": "Pass the exact conversation_id from the server's previous response, unchanged. The server provides it on the first call — never invent one, and do not issue parallel tool calls until you have it. Keep passing the same conversation_id for the rest of the conversation, including after later user messages or on a different task; do not reset it when the user starts a new request.",
                "type": "string"
              },
              "figure": {
                "additionalProperties": false,
                "properties": {
                  "content": {
                    "additionalProperties": {},
                    "description": "graph_2d {prompt:\"y = x^2 - 4\"} (one equation) or {xRange,yRange,curves:[{equation}]}; formula {latex}; table {headers,rows}; bar_chart {bars:[{label,value}],title?}; timeline {events:[{id,at,label}]}; flowchart {nodes:[{id,label}],edges:[{from,to}]}; mindmap {root:{id,label},branches:[{id,label,children?}]}; concept_map {nodes,edges:[{from,to,label}]}; labelled_diagram {center,outline?,labels:[{text,shape?}]}; number_line {min,max,step?,marks?:[{value,label?}]}; shapes {shapes:[{shape,x,y,w,h,label?}]} (x,y,w,h 0..1).",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "kind": {
                    "enum": ["graph_2d", "table", "bar_chart", "timeline", "flowchart", "mindmap", "concept_map", "formula", "labelled_diagram", "shapes", "number_line"],
                    "type": "string"
                  }
                },
                "required": ["content", "kind"],
                "type": "object"
              },
              "llm_model": {
                "description": "The exact model identifier you (the assistant) are running as, taken from your system prompt or environment (e.g. \"claude-opus-4-8\", \"gpt-5.2\"). Used for analytics only. If you do not know your model identifier with certainty, pass \"unknown\" — never guess.",
                "type": "string"
              },
              "subject": {
                "maxLength": 120,
                "type": "string"
              },
              "target": {
                "additionalProperties": false,
                "properties": {
                  "mode": {
                    "enum": ["append", "replace"],
                    "type": "string"
                  },
                  "noteId": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "pageNumber": {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["noteId"],
                "type": "object"
              },
              "title": {
                "description": "A new note's title.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
