      "instructions": "Wren writes real, editable handwritten ink into the user's Wren notebook. write_notebook_page writes one page: notes, an explanation, a worked example, a summary or revision sheet, text to copy, or a figure with text. plan_notebook creates a multi-page notebook with a cover and numbered page slots, each filled by one write_notebook_page call. draw_figure draws one standalone figure (graph, diagram, chart, mind map, number line) on its own page. list_recent_notebooks returns the user's recent notes with their noteIds; target.noteId adds a page to an existing note.",
      "tools": [
        {
          "name": "connect_account",
          "title": "Connect your Wren account",
          "description": "Link the user's Wren account so authored notes land in their notebook. Returns the linked uid when a credential is present; otherwise explains that account linking must be completed first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "linked": {
                "description": "The Wren account is linked to this ChatGPT account.",
                "type": "boolean"
              },
              "nextStep": {
                "description": "How notes reach the iPad (sign in with the same account).",
                "type": "string"
              },
              "ok": {
                "description": "true when the account is linked.",
                "type": "boolean"
              },
              "uid": {
                "description": "Linked Wren account id (Firebase uid).",
                "type": "string"
              }
            },
            "required": ["linked", "nextStep", "ok", "uid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Connect your Wren account"
          },
