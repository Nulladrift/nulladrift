                    "description": "Course name, printed on the notebook cover.",
                    "type": "string"
                  },
                  "language": {
                    "description": "BCP-47 language tag of the page text; sets the writing direction (right-to-left or left-to-right).",
                    "type": "string"
                  },
                  "subject": {
                    "description": "Subject, printed on the notebook cover and used to file the note.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "coverFigure": {
                "additionalProperties": false,
                "description": "e.g. formula {latex}, graph_2d {curves:[{expr}]}, flowchart; drawn in one pen.",
                "properties": {
                  "figureContent": {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "figureKind": {
                    "enum": ["graph_2d", "formula", "annotation", "table", "bar_chart", "timeline", "flowchart", "mindmap", "concept_map"],
                    "type": "string"
                  },
                  "title": {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
