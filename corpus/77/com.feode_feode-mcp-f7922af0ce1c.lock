          "name": "submit_machining_rfq",
          "description": "Submit a structured machining/testing RFQ. Runs a lightweight compliance screen (prohibited-use + sanctions) and, if cleared, registers the enquiry for human follow-up from enquiry@feode.com. Not a contract or quotation; no payment is taken here. You must provide the legal entity behind the request.",
