          "name": "fetch",
          "title": "Page or section text",
          "description": "Returns the full text of a page, or of one section of a page, by the identifier given by search, for example ccs or ccs#specifications (identifiers of Chinese results start with zh:). Page addresses are accepted as well.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Identifier returned by search",
                "maxLength": 300,
                "type": "string"
              },
              "lang": {
                "description": "Language of the result: en (English, the default) or zh (Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "language": {
                "enum": ["en", "zh"],
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
