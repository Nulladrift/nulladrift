            "properties": {
              "company": {
                "description": "Legal entity name placing the order",
                "type": "string"
              },
              "contact_name": {
                "description": "Real human contact name",
                "type": "string"
              },
              "country": {
                "description": "Country of registration of the legal entity",
                "type": "string"
              },
