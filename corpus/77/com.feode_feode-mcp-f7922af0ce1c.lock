      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "This server provides the information published by Shenzhen Far East Oil Drilling Engineering Ltd. (FEODE) on its products, services, certificates and operating record, a drill-string reference, and the intake of enquiries. Use list_products or search first, then get_product_specs or fetch for detail; when citing a figure, state the object and the date it refers to, as given in the result. The content is provided for information and does not constitute an offer, quotation or contract.",
