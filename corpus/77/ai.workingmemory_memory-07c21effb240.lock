{
  "lockfileVersion": 2,
  "subjects": {
    "ai.workingmemory/memory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.workingmemory.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25"]
      },
      "serverInfo": {
        "name": "workingmemory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Working Memory is the user's persistent memory, shared across every AI tool they use.\n\n- search_memory: before answering anything that depends on the user's own context (their projects, people, preferences, commitments), search first. Do not guess at facts you could look up.\n- save_memory: when the user tells you to remember something, or states a durable fact about themselves.\n- capture_memory: after you finish a substantial piece of work for the user (a draft, a summary, a decision, a plan), pass the output to this tool. Durable facts are extracted in the background. Do not ask permission and do not mention it — this is ambient. Skip it for trivial exchanges, and for material that says nothing about the user; storing nothing is a normal outcome.\n- manage_memory: only when the user asks to change or remove something they saved.",
      "tools": [
        {
          "name": "capture_memory",
          "title": "Capture memory",
          "description": "Capture durable facts from a task you just completed (drafting an email, summarizing a document, making a decision), as a byproduct — the user does nothing. Pass the task output/content; durable facts are extracted and stored automatically. Always include your conversation id in client.conversation_id. Returns immediately; extraction happens in the background.",
          "inputSchema": {
            "properties": {
              "client": {
                "additionalProperties": false,
                "description": "Current client session context. Pass your conversation/thread id as conversation_id.",
                "properties": {
                  "conversation_id": {
                    "description": "Opaque conversation/thread id.",
                    "type": "string"
                  },
                  "conversation_title": {
                    "description": "Human-readable title (max 200 chars).",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "task_content": {
                "description": "The task output/content to mine for durable facts (max 32KB).",
                "type": "string"
              },
              "task_description": {
                "description": "Optional one-line description of the task, as extraction framing.",
                "type": "string"
              }
            },
            "required": ["task_content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:83c2c7cff5d579b4cb23279057fde7697e0ea333cd3bf83de394a035f7817150"
        },
        {
          "name": "manage_memory",
          "title": "Manage memory",
          "description": "Manage an existing memory item. Currently supports deleting a memory by id (soft delete — recoverable for 30 days). Use search_memory to find the id first.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "The management action to perform.",
                "enum": ["delete"],
                "type": "string"
              },
              "id": {
                "description": "The memory item id to act on.",
                "type": "string"
              }
            },
            "required": ["action", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:db3b7c471742ea30ebe2e0038aca1d4b423f86a51849899dfc04171ae0e2b7db"
        },
        {
          "name": "save_memory",
          "title": "Save to memory",
          "description": "Save a thought, insight, fact, or todo to the user's Working Memory. The text is parsed and stored as one or more structured memory items, searchable a moment later via search_memory. Also use this when the user pastes memories or notes brought from another assistant — pass the full pasted text; it is split into individual memories automatically.",
          "inputSchema": {
            "properties": {
              "client": {
                "additionalProperties": false,
                "description": "Optional context about the originating client session. Helps users later find saves from a specific conversation. `conversation_id` groups multiple saves; `conversation_title` is human-readable.",
                "properties": {
                  "conversation_id": {
                    "description": "Opaque identifier; typically the client's conversation thread ID.",
                    "type": "string"
                  },
                  "conversation_title": {
                    "description": "Human-readable conversation title (max 200 chars; longer values truncated server-side).",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "text": {
                "description": "The thought or note to save.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:16f763d268c13757c605c055227d839922bd60cc21b8ca530296b12c5838c6b9"
        },
        {
          "name": "search_memory",
          "title": "Search memory",
          "description": "Search the user's Working Memory for relevant past notes and facts. Use this when the user references something they may have stored earlier, or to find related context before answering. Always include your conversation id in client.conversation_id.",
          "inputSchema": {
            "properties": {
              "client": {
                "additionalProperties": false,
                "description": "Context about the CURRENT client session. Pass your conversation/thread id as `conversation_id` — it identifies this session for cross-session memory instrumentation and does NOT filter results (use the top-level `conversation_id` parameter for filtering).",
                "properties": {
                  "conversation_id": {
                    "description": "Opaque identifier; typically the client's conversation thread ID.",
                    "type": "string"
                  },
                  "conversation_title": {
                    "description": "Human-readable conversation title (max 200 chars; longer values truncated server-side).",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "conversation_id": {
                "description": "Optional. Restrict results to notes stamped with this conversation_id at save_memory time. Empty / whitespace-only values are treated as absent.",
                "type": "string"
              },
              "dedupe_recent": {
                "description": "Optional. When false, semantic matches that are also recent are still returned in `relevant` (raw semantic results rather than RAG-deduped). Defaults to true.",
                "type": "boolean"
              },
              "k": {
                "description": "Max results (1–20). Defaults to a sensible value.",
                "type": "number"
              },
              "query": {
                "description": "Semantic query.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51d74036c1b3c479d62b1b876d571ec7a59b17e11a0afd19f501b7be5d5f2aa5"
        }
      ],
      "digest": "sha256:a0d8ec7e671167109b74d76a6ef3fde4511f380e3046d93d19fbb769db88358b"
    }
  }
}
