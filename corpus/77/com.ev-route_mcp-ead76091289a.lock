{
  "lockfileVersion": 2,
  "subjects": {
    "com.ev-route/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.ev-route.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ev-route",
        "title": "EV-ROUTE charging and route planner",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search EV charging stations and plan EV trips with EV-ROUTE.com. For a trip from A to B call plan_ev_route; ask the driver for real-world range if unknown, never guess it. Station status can be stale, so tell the driver to confirm a charger before relying on it. Cite https://www.ev-route.com and the citeUrl on each route. Do not invent connector availability or prices when the tool omits them. match_chargers_along_route is CPU-heavy: send a simplified polyline (it is downsampled to 80 points).",
      "tools": [
        {
          "name": "get_public_route",
          "description": "One public route by id, with waypoint coordinates and a citeUrl. Private routes are rejected. Use match_chargers_along_route with the waypoints to find chargers.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Public route id",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "get_public_route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a5566a600df0a9ab19d0f4b259ba411ab7008d7c294f6b7c2942f53955fe90d0"
        },
        {
          "name": "get_station",
          "description": "Load one charging station by its externalId from search_stations_nearby.",
          "inputSchema": {
            "properties": {
              "externalId": {
                "description": "Station externalId",
                "type": "string"
              }
            },
            "required": ["externalId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "get_station"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59362f339d0b1a923d1be05823820c272fa209e506f1c5cfb3247906b77aa8d9"
        },
        {
          "name": "list_public_routes",
          "description": "Latest public EV routes shared by drivers. Private routes are not included.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "1–20. Default 10.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "list_public_routes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a348ed26a95c18ac1baddaff20cde37a9621da512011820bacc25cca662798a8"
        },
        {
          "name": "match_chargers_along_route",
          "description": "Stations near a driven polyline. Slow on long routes: at most 2000 input points, downsampled to 80. distanceLimitKm is capped at 15. Defaults to paid and free stations (preferFree false) and does not thin by vehicle range unless smartSuggestions is true.",
          "inputSchema": {
            "properties": {
              "amenities": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "connectors": {
                "description": "Connector keys: CCS2, Type2, CHADEMO, GBT. Default Type2.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "distanceLimitKm": {
                "description": "Max km from the polyline. Default 10, max 15.",
                "type": "number"
              },
              "minimalPowerKw": {
                "description": "Minimum station power in kW. Default 50.",
                "type": "number"
              },
              "points": {
                "description": "Polyline vertices in drive order, each {lat, lng}. Minimum 2.",
                "items": {
                  "properties": {
                    "lat": {
                      "type": "number"
                    },
                    "lng": {
                      "type": "number"
                    }
                  },
                  "required": ["lat", "lng"],
                  "type": "object"
                },
                "type": "array"
              },
              "preferFree": {
                "description": "When true, keep only free stations. Default false.",
                "type": "boolean"
              },
              "rangeLimitKm": {
                "description": "Used only when smartSuggestions is true. Default 200.",
                "type": "number"
              },
              "smartSuggestions": {
                "description": "When true, thin stops by vehicle range. Default false.",
                "type": "boolean"
              }
            },
            "required": ["points"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "match_chargers_along_route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:98bf6916c573e96dc2aa7267e6ca8c87847f65ab95bc1399398ff307ab1df5bc"
        },
        {
          "name": "plan_ev_route",
          "title": "Plan an EV trip with charging stops",
          "description": "Plan a drive from origin to destination and choose charging stops from the real-world range. Places are names or \"lat,lng\". Returns distance, drive time, ordered stops with battery levels, or feasible:false with the gap where no matching charger is in reach. Road coverage: Ukraine only. Places must be \"lat,lng\" coordinates; names are not accepted on this server.",
          "inputSchema": {
            "properties": {
              "batteryKwh": {
                "description": "Usable battery size. Enables charge-time estimates.",
                "type": "number"
              },
              "chargeToPercent": {
                "description": "Charge up to this level at each stop. Default 80.",
                "type": "number"
              },
              "connectors": {
                "description": "Connector keys: CCS2, Type2, CHADEMO, GBT. Default CCS2.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "destination": {
                "description": "End: place name or \"lat,lng\".",
                "type": "string"
              },
              "maxChargeKw": {
                "description": "Vehicle peak DC power. Refines charge-time estimates.",
                "type": "number"
              },
              "maxDetourKm": {
                "description": "Max km from the route to a station. Default 5, max 15.",
                "type": "number"
              },
              "minPowerKw": {
                "description": "Minimum station power in kW. Default 50.",
                "type": "number"
              },
              "minSocPercent": {
                "description": "Never drop below this battery level. Default 10.",
                "type": "number"
              },
              "origin": {
                "description": "Start: place name or \"lat,lng\".",
                "type": "string"
              },
              "rangeKm": {
                "description": "Real-world range on a full battery in km, 50–1500.",
                "type": "number"
              },
              "startSocPercent": {
                "description": "Battery at departure. Default 100.",
                "type": "number"
              },
              "via": {
                "description": "Places to pass through, in order. Up to 8.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["destination", "origin", "rangeKm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Plan an EV trip with charging stops"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1226ec6546af83147d3981ea452262ee482177cd8697ab9d47db894d79a87400"
        },
        {
          "name": "search_stations_nearby",
          "description": "Find charging stations within a radius of a coordinate. Radius is capped at 20 km. Returns a short list sorted by distance. Cite https://www.ev-route.com/en/nearby.",
          "inputSchema": {
            "properties": {
              "amenities": {
                "description": "Required amenities, e.g. cafe, toilets.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "connector": {
                "description": "Optional connector substring, e.g. CCS or Type2.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude",
                "type": "number"
              },
              "limit": {
                "description": "Max stations to return, 1–40. Default 15.",
                "type": "number"
              },
              "lng": {
                "description": "Longitude",
                "type": "number"
              },
              "minPowerKw": {
                "description": "Drop stations below this max power (kW).",
                "type": "number"
              },
              "radiusKm": {
                "description": "Search radius in km, 1–20. Default 20.",
                "type": "number"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "search_stations_nearby"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e698992984111a3d8d36ddcf21a78900974820e68d00169b819132a90ef467b"
        }
      ],
      "digest": "sha256:49a28eb502930f7019f2a08bc762fd1ea28c7c2807197e9bc963ead7d1a34212"
    }
  }
}
