                "type": "array"
              },
              "products_ranked": {
                "type": "integer"
              },
              "source_url": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "tier_meanings": {
                "type": "object"
              }
            },
            "required": ["attribution", "category", "license", "method", "monetization", "products", "products_ranked", "source_url", "summary", "tier_meanings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
