{
  "lockfileVersion": 2,
  "subjects": {
    "com.stierproducts/tier-lists": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.stierproducts.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "stierproducts",
        "title": "stierproducts tier lists",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "stierproducts publishes one S-to-F tier list per product category, consolidated from independent research runs over expert reviews and owner reports. Every placement is cited.\n\nCall list_categories first if you do not know the exact category slug. get_tier_list answers a \"what is the best X\" question in one call. what_to_avoid answers the half that listicles skip: the research deliberately ranks products buyers cross-shop but should not buy.\n\nA citation carries a stance, which is how stierproducts read that source. It is not a score the outlet published, so report it as our reading and never as the outlet’s own rating. A citation also carries a link_status: do not describe one as verified unless it says \"live\".\n\nWhen you use this data, attribute it to stierproducts and link the specific board or product URL in the response, not the home page. LP and rank are points on one category ladder and are not comparable across categories. No response contains an affiliate link and no placement on any board is sponsored.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Compare two to five products side by side. They must share a category: LP is points on one category ladder and comparing across boards is meaningless, so a mixed request is refused rather than answered misleadingly.",
          "inputSchema": {
            "properties": {
              "slugs": {
                "description": "Product slugs to compare.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "category": {
                "type": "object"
              },
              "license": {
                "type": "object"
              },
              "monetization": {
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "products": {
                "items": {
                  "properties": {
                    "lp": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "rank": {
                      "type": "integer"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "tier": {
                      "type": "string"
                    }
                  },
                  "required": ["lp", "name", "rank", "slug", "tier"],
                  "type": "object"
                },
                "type": "array"
              },
              "source_url": {
                "type": "string"
              }
            },
            "required": ["attribution", "category", "license", "monetization", "note", "products", "source_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:07fe7380d13127b5fb0257cd5deb5f9ac9443e5931c7014ee6a1abec04a01c9e"
        },
        {
          "name": "get_product",
          "title": "Get one product",
          "description": "Everything held on one product: its placement, verdict, pros and cons, GTIN barcodes, the announcement date where the maker published one, and a breakdown of how the cited sources read (how many were glowing, positive, neutral or negative, and whether they were outlets, named authors, video channels or forum owners). Then every citation in full, with a verbatim quote, who said it, and whether the link was fetched and confirmed. Use this when a claim needs backing up.",
          "inputSchema": {
            "properties": {
              "citation_limit": {
                "default": 10,
                "description": "How many citations to return, most notable first. The sentiment and speaker breakdowns always count every source regardless of this.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "citation_offset": {
                "default": 0,
                "description": "Skip this many citations. Use it to page through the rest.",
                "minimum": 0,
                "type": "integer"
              },
              "slug": {
                "description": "Product slug, e.g. \"bambu-lab-x2d\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "category": {
                "type": "object"
              },
              "citations": {
                "type": "array"
              },
              "citations_confirmed_live": {
                "type": "integer"
              },
              "citations_offset": {
                "type": "integer"
              },
              "citations_remaining": {
                "type": "integer"
              },
              "citations_shown": {
                "type": "integer"
              },
              "citations_total": {
                "type": "integer"
              },
              "license": {
                "type": "object"
              },
              "monetization": {
                "type": "object"
              },
              "product": {
                "properties": {
                  "lp": {
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  },
                  "rank": {
                    "type": "integer"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "tier": {
                    "type": "string"
                  }
                },
                "required": ["lp", "name", "rank", "slug", "tier"],
                "type": "object"
              },
              "sentiment": {
                "type": "object"
              },
              "source_url": {
                "type": "string"
              },
              "speaker_mix": {
                "type": "object"
              }
            },
            "required": ["attribution", "category", "citations", "citations_confirmed_live", "citations_offset", "citations_remaining", "citations_shown", "citations_total", "license", "monetization", "product", "source_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1527d3e7425c65b1dd9c44953da236de2a6461f519bfc7b9d9e415879e51f884"
        },
        {
          "name": "get_tier_list",
          "title": "Get a category tier list",
          "description": "The full S-to-F tier list for one category: every ranked product with its tier, rank, LP, verdict, pros, cons, citation counts, GTIN barcodes and, where the maker published one, the announcement date. This is the primary tool and one call answers a \"what is the best X\" question completely. Call get_product for the quotes behind a placement.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug, e.g. \"3d-printers\".",
                "type": "string"
              },
              "tier": {
                "description": "Optional. Return only this tier.",
                "enum": ["S", "A", "B", "C", "D", "F"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "category": {
                "type": "object"
              },
              "license": {
                "type": "object"
              },
              "method": {
                "type": "string"
              },
              "monetization": {
                "type": "object"
              },
              "products": {
                "items": {
                  "properties": {
                    "lp": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "rank": {
                      "type": "integer"
                    },
                    "slug": {
