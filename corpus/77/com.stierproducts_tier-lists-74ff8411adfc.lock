        {
          "name": "list_categories",
          "title": "List product categories",
          "description": "List the product categories that have a published tier list, newest research first. Call this first when you do not already know the exact category slug: slugs cannot be guessed reliably and every other tool takes one.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "maximum": 208,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional filter matched against the category name and description.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "categories": {
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "license": {
                "type": "object"
              },
              "monetization": {
                "type": "object"
              },
              "source_url": {
                "type": "string"
              }
            },
            "required": ["attribution", "categories", "count", "license", "monetization", "source_url"],
            "type": "object"
          },
          "annotations": {
