      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SheetSense explains spreadsheet formulas and translates them between Excel, Google Sheets, SQL and pandas. Use search_formula_library first for common tasks (it is instant and unlimited); use explain_formula for a specific formula the user has. Explanations are AI-written and should be tested.",
      "tools": [
        {
          "name": "explain_formula",
          "title": "Explain and translate a spreadsheet formula",
          "description": "Explains an Excel or Google Sheets formula in plain English and returns the equivalent in Excel, Google Sheets, SQL and pandas, with common pitfalls. Use when the user has a specific formula they do not understand or want to move to another tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "formula": {
                "description": "The formula, starting with =, exactly as it appears in the cell.",
                "type": "string"
              }
            },
            "required": ["formula"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Explain and translate a spreadsheet formula"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:db743187bbb558ce670a6098864ce5e8920f84c1a4488175ad1904976e0538d3"
        },
        {
          "name": "search_formula_library",
          "title": "Search the SheetSense formula library",
          "description": "Searches 60 hand-checked worked examples of common spreadsheet tasks (lookups, SUMIFS, dates, text cleanup, arrays) and returns the formula with Excel, Google Sheets, SQL and pandas versions, pitfalls and a link. Use for 'how do I ...' spreadsheet questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "What the user wants to do, e.g. 'lookup with two conditions' or 'count unique values'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
