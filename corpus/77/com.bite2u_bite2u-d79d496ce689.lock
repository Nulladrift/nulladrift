        {
          "name": "search_restaurants",
          "title": "Search Bite2u restaurants",
          "description": "Use this when the user wants to find a restaurant to order food from (delivery or pickup) or to eat at, and the restaurant could be on Bite2u \"Order here\" (bite2u.com/order). Searches by restaurant name, city, cuisine or dish. Returns only restaurants listed on Bite2u, with whether they are open now, delivery/pickup/dine-in, rating and a link. Ordering and payment happen on the restaurant page at bite2u.com (the url field); this tool does not place orders.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City or area, if the user said one. Optional.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, if known (e.g. \"DO\", \"US\", \"ES\"). Optional.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "open_now": {
                "description": "true to return only restaurants open right now. Optional.",
                "type": "boolean"
              },
              "query": {
                "description": "What the user is looking for: a cuisine, dish or restaurant name (e.g. \"pizza\", \"sushi\", \"burger\"). Optional.",
                "type": "string"
              },
              "service": {
                "description": "Only restaurants that offer this service. Optional.",
                "enum": ["delivery", "pickup", "dine_in"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "restaurants": {
                "items": {
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
