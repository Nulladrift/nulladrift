      "instructions": "Bite2u \"Order here\" (bite2u.com/order) is a restaurant marketplace: people find restaurants near them and order directly from the restaurant. Use search_restaurants to find restaurants and get_menu to show a menu. When the user has chosen dishes, use prepare_order: it checks the order and returns checkout_url, the restaurant page on bite2u.com with the basket already in it. Orders and payments are completed on bite2u.com.",
      "tools": [
        {
          "name": "get_menu",
          "title": "Get a Bite2u restaurant menu",
          "description": "Use this when the user wants to see the menu, dishes or prices of a restaurant returned by search_restaurants. Pass that restaurant's slug. Returns the menu by category with prices in the restaurant's currency, availability and allergens, plus order_url: the user completes the order and payment on that bite2u.com page.",
