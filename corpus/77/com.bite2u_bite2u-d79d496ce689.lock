        {
          "name": "prepare_order",
          "title": "Prepare a Bite2u order",
          "description": "Use this when the user has chosen dishes from a menu returned by get_menu and wants to order. Pass the restaurant slug and the items (dish_id from get_menu, quantity, and size_id / options when the dish has sizes or option groups). It checks every item against the current menu and returns the lines, the subtotal in the restaurant's currency, any problem (for example a required option still to choose) and checkout_url: the restaurant page on bite2u.com with this basket already in it, where the user completes the order and payment. This tool does not place or charge the order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "dish_id": {
                      "description": "The dish id from get_menu.",
                      "type": "string"
                    },
                    "note": {
                      "description": "Short note for the kitchen, only if the user asked (e.g. \"no onions\").",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "options": {
                      "description": "Chosen options, per option group of the dish (see option_groups in get_menu).",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "group_id": {
                            "type": "string"
                          },
                          "option_ids": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          }
                        },
                        "required": ["group_id", "option_ids"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "quantity": {
                      "maximum": 50,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "size_id": {
                      "description": "Required when the dish has sizes: one id from its sizes.",
                      "type": "string"
                    }
                  },
                  "required": ["dish_id", "quantity"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "slug": {
                "description": "The restaurant slug from search_restaurants / get_menu.",
                "type": "string"
              }
            },
            "required": ["items", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checkout_url": {
                "type": ["string", "null"]
              },
              "currency": {
                "type": "string"
              },
              "lines": {
                "items": {
