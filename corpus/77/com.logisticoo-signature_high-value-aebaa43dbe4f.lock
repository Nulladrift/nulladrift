{
  "lockfileVersion": 2,
  "subjects": {
    "com.logisticoo-signature/high-value": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://logisticoo-signature.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "highvalue-agent",
        "title": "Logisticoo Signature — Logisticoo GmbH",
        "version": "0.5.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_service_profile",
          "title": "Leistungsprofil / Service profile",
          "description": "Returns what Logisticoo Signature (Logisticoo GmbH) offers: services, what is not offered, whether prices are available, how to submit an inquiry, contact and legal links. Call this first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd3c1fe43d9f1d0de03e62fefbdf4fd5ff5a134732c775160ae6019cd28ca8b4"
        },
        {
          "name": "preview_inquiry",
          "title": "Anfrage-Vorschau / Preview transport inquiry",
          "description": "Step 1 of 2 for a real transport inquiry to the operator's sales team (they reply by e-mail with a quote). Validates the data and returns exactly what will be sent, a privacy notice and a preview_token (15 min). Nothing is sent yet. Show the summary AND privacy_notice to the user and get explicit confirmation before calling submit_inquiry. Only use contact details the user provided for this purpose.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cargo_description": {
                "description": "What is shipped (goods, packaging), max 500 chars",
                "maxLength": 500,
                "type": "string"
              },
              "contact": {
                "description": "The requesting person's business contact — required",
                "properties": {
                  "company": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "email": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["company", "email", "name"],
                "type": "object"
              },
              "dangerous_goods": {
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "delivery_by": {
                "description": "Latest delivery date YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "properties": {
                  "city": {
                    "description": "City name (German or English), e.g. Berlin, Warsaw",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "country": {
                    "description": "ISO 3166-1 alpha-2, e.g. DE, PL, FR",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "5-digit postal code for DE (used for the estimate); other countries: passed on to the team",
                    "maxLength": 10,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["country"],
                "type": "object"
              },
              "dimensions_cm": {
                "description": "Largest single piece",
                "properties": {
                  "height_cm": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000,
                    "type": "number"
                  },
                  "length_cm": {
                    "exclusiveMinimum": 0,
                    "maximum": 10000,
                    "type": "number"
                  },
                  "width_cm": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "loading_meters": {
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "message": {
                "description": "Additional notes for the sales team, max 1000 chars",
                "maxLength": 1000,
                "type": "string"
              },
              "origin": {
                "properties": {
                  "city": {
                    "description": "City name (German or English), e.g. Berlin, Warsaw",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "country": {
                    "description": "ISO 3166-1 alpha-2, e.g. DE, PL, FR",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "5-digit postal code for DE (used for the estimate); other countries: passed on to the team",
                    "maxLength": 10,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["country"],
                "type": "object"
              },
              "oversize": {
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "pallets": {
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "integer"
              },
              "pickup_date": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "temperature_controlled": {
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "vehicle": {
                "description": "Requested vehicle, free text (optional)",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "weight_kg": {
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              }
            },
            "required": ["contact", "destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2aaa65d9826b3af309a3d4eef3794803f0b341515c4e9b2028118e4b34572be6"
        },
        {
          "name": "submit_inquiry",
          "title": "Anfrage absenden / Submit transport inquiry",
          "description": "Step 2 of 2: sends the previewed inquiry to the operator's sales team. Only call after the user explicitly confirmed the summary and privacy notice. Use a new random idempotency_key per inquiry and reuse it when retrying the same inquiry. Status accepted means we received it; it is NOT a booking and NOT a binding price — a person replies by e-mail.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "idempotency_key": {
                "description": "Random key, e.g. a UUID; same key for retries",
                "pattern": "^[A-Za-z0-9_-]{8,100}$",
                "type": "string"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "preview_token": {
                "maxLength": 20000,
                "minLength": 10,
                "type": "string"
              },
              "user_confirmed": {
                "const": true,
                "description": "true = the user explicitly confirmed summary and privacy notice",
                "type": "boolean"
              }
            },
            "required": ["idempotency_key", "preview_token", "user_confirmed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fa2f2349872711cae98c24eca7e0a97a6e5d69eaf6a02753c972a7ee0e49eff"
        }
      ],
      "digest": "sha256:f8e146bc4243035792d9d09783e885947b07df45e38456fa05df681c346b877e"
    }
  }
}
