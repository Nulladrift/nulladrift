      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use this server when a user needs an AI model or bioinformatics tool for a biology or chemistry task, wants to know where to run one without a GPU, or asks about a model's licence. Results link to Corollary pages where models run online and where the Corollary research agent runs tools, databases and pipelines.",
      "tools": [
        {
          "name": "compare_scientific_ai_for_task",
          "title": "Compare the models or tools for a task",
          "description": "For a task such as 'protein structure prediction', 'protein design', 'antibody design', 'molecular docking', 'single-cell', 'ADMET', 'phage genomics' or 'CRISPR', return every model or tool Corollary lists for it — what each does, licence, whether it runs online — and guidance on how to choose between them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task": {
                "description": "The task, in plain words.",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55896d3ad6218262f868b8deb08027f5f8ab91565d34a6786258f0a264a500fb"
        },
        {
          "name": "get_scientific_ai_details",
          "title": "Explain one model, tool, database, pipeline or dataset",
          "description": "Full reference for one entry: what it is, how it works, key facts, uses, strengths, limitations, citation, licence, and how to run it on Corollary. Pass a name ('RFdiffusion'), an id ('esmfold2', 'nf-core/rnaseq', 'facebook/esm2_t33_650M_UR50D') or a corollary-labs.com URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ref": {
                "description": "Name, id or Corollary page URL.",
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
