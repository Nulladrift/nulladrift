        {
          "name": "confirm_hardware_dimensions",
          "title": "Confirm a part’s exact dimensions",
          "description": "Records your shop’s confirmation of the exact part and dimensions you stock, so designers can build parts around it. Only confirm a part you have checked: designs are cut to these numbers. Give evidence: a datasheet link or how you measured it. Needs a connected Printlooper account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "depth_mm": {
                "description": "Same as width for a round or hexagonal part",
                "maximum": 200,
                "minimum": 0.5,
                "type": "number"
              },
              "evidence": {
                "description": "The datasheet lines, or how and with what it was measured",
                "maxLength": 2000,
                "minLength": 12,
                "type": "string"
              },
              "height_mm": {
                "maximum": 200,
                "minimum": 0.5,
                "type": "number"
              },
              "offering_id": {
                "description": "offering_id from list_my_hardware",
                "format": "uuid",
                "type": "string"
              },
              "part_number": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "shape": {
                "enum": ["round", "rectangular", "hexagonal"],
                "type": "string"
              },
              "source_url": {
                "default": "",
                "maxLength": 2048,
                "type": "string"
              },
              "tolerance_mm": {
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "width_mm": {
                "description": "Diameter for a round part, across flats for a hexagonal part",
                "maximum": 200,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "required": ["depth_mm", "evidence", "height_mm", "offering_id", "part_number", "shape", "tolerance_mm", "width_mm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
