        {
          "name": "get_listing_options",
          "title": "Price a design for my shop",
          "description": "For a marketplace design (from search_designs) or a staged model, quotes what print shops charge to make it, the platform fee and royalty, and the retail price that leaves a chosen margin. Use it before suggesting a price. Returns the page to create the listing. Each quote lists the materials and colors that shop offers; pass material and color to quote one of them. Needs a connected Printlooper account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "Quote this color, by hex (#1A1A1A) or name. Shops without it quote their default color.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "design_id": {
                "description": "A design id from search_designs, or a staged model id (file_...)",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "finish": {
                "description": "With color: the finish to prefer when a shop has that color in more than one, for example matte or glossy",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "margin_percent": {
                "default": 40,
                "description": "Profit as a percent of the retail price",
                "maximum": 80,
                "minimum": 5,
                "type": "number"
              },
              "material": {
                "description": "Quote this material, for example PLA or PETG. Shops without it are left out.",
                "maxLength": 20,
                "minLength": 2,
                "type": "string"
              },
              "shop": {
                "description": "Quote one print shop (id or handle). Otherwise up to three shops are quoted.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["design_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price a design for my shop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
