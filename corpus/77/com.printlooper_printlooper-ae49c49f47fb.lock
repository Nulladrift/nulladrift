        {
          "name": "create_listing_draft",
          "title": "Start a listing",
          "description": "Starts a listing from a ready staged model with the title, description, tags and price you suggest. Pass the shop, material and colors from get_listing_options when the user chose them, and the listing page starts on them. The user opens complete_url to confirm they own the rights, pick the shop and colors, add photos and publish. Nothing goes live until they do. Needs a connected Printlooper account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "colors": {
                "description": "The colors the user chose, each as hex and finish from get_listing_options",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "finish": {
                      "maxLength": 20,
                      "type": "string"
                    },
                    "hex": {
                      "pattern": "^#[0-9a-fA-F]{6}$",
                      "type": "string"
                    }
                  },
                  "required": ["hex"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "description": {
                "default": "",
                "maxLength": 5000,
                "type": "string"
              },
              "file_id": {
                "description": "A ready staged model id (file_...)",
                "maxLength": 80,
                "type": "string"
              },
              "material": {
                "description": "The material the user chose, for example PLA",
                "maxLength": 20,
                "type": "string"
              },
              "price_usd": {
                "description": "Suggested retail price for sellers",
                "maximum": 10000,
                "minimum": 1,
                "type": "number"
              },
              "shop_id": {
                "description": "The print shop the user chose, as shop.id from get_listing_options",
                "maxLength": 64,
                "type": "string"
              },
              "tags": {
                "default": [],
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["file_id", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a listing"
