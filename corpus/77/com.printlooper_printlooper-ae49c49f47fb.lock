          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "photo_files": {
                "description": "Images the user attached, as the file objects an app passes to tools. Leave out when you have no download_url for an image",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "format": "uri",
                      "maxLength": 4096,
                      "type": "string"
                    },
                    "file_id": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "file_name": {
                      "maxLength": 255,
                      "type": "string"
                    },
                    "mime_type": {
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 6,
                "type": "array"
              },
              "photo_urls": {
                "description": "Public https links, each downloading one PNG or JPG image (a direct link to the file, not a web page)",
                "items": {
                  "format": "uri",
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "product_id": {
                "description": "product_id from list_my_products",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "variant_id": {
                "description": "variant_id from get_my_product. May be left out when the product has one variant.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
