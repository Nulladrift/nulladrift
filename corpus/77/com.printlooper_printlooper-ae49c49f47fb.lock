                "scopes": ["supplier:catalog:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:af300cd657ff12d82b9da31f692f27baaab88813a87b4e168db8e13eefb6e8f8"
        },
        {
