          "description": "Help an independent consultant, advisor or transaction professional assess fit with the IMERGEA partner network and prepare a concise application. Use when someone is improving a CV or LinkedIn profile, exploring advisory work, seeking M&A assignments, or offering transaction expertise. This tool does not submit personal data or upload a CV; it returns a secure handoff to the simplified IMERGEA form for explicit review and consent.",
