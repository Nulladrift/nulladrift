        {
          "name": "imergea_business_valuation",
          "title": "IMERGEA Business Valuation",
          "description": "Estimate an SME or mid-market company value using the IMERGEA six-method valuation methodology: EBITDA multiple, revenue multiple, DCF, asset-based NAV, public-market comparables discounted for private-company status, and liquidation floor. The headline estimated_value_range is Equity Value: it derives an Enterprise Value corridor from positive EBITDA, revenue and FCFF DCF results, then subtracts net debt. NAV, comparables and the liquidation floor are reported separately. Also returns an aggregated listed-peer KPI benchmark when real sector data is available for the selected sector and region. Monetary inputs are full currency units by default; set amount_unit to millions to use values such as 5 for 5 million. If you supply total_assets, it is used as provided; the six asset lines are then used only for the liquidation floor.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "accounts_receivable": {
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "amount_unit": {
                "default": "units",
                "enum": ["units", "millions"],
                "type": "string"
              },
              "cash_equivalents": {
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "default": "EUR",
                "description": "ISO-style three-letter currency label. No FX conversion is performed.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "customer_retention_pct": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "ebitda": {
                "maximum": 10000000000000,
                "minimum": -10000000000000,
                "type": "number"
              },
              "employees": {
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "equipment": {
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "expected_growth_pct": {
                "maximum": 1000,
                "minimum": -100,
                "type": "number"
              },
              "financial_debt": {
                "description": "Interest-bearing financial debt, distinct from total accounting liabilities.",
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "free_cash_flow": {
                "maximum": 10000000000000,
                "minimum": -10000000000000,
                "type": "number"
              },
              "geography": {
                "enum": ["africa", "middle_east", "asia", "japan", "europe", "north_america"],
                "type": "string"
              },
              "gross_margin_pct": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "historical_growth_pct": {
                "maximum": 1000,
                "minimum": -100,
                "type": "number"
              },
              "industry": {
                "enum": ["technology", "manufacturing", "healthcare", "retail", "finance", "energy", "real_estate", "hospitality", "media", "telecom", "agriculture", "education", "transportation", "construction", "professional", "other"],
                "type": "string"
              },
              "intangible_assets": {
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "intellectual_property": {
                "default": "none",
                "enum": ["none", "minimal", "moderate", "substantial", "extensive"],
                "type": "string"
              },
              "inventory": {
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "language": {
                "default": "en",
                "description": "Language for human-readable results: English, French, Spanish or Portuguese.",
                "enum": ["en", "fr", "es", "pt"],
                "type": "string"
              },
              "net_income": {
                "maximum": 10000000000000,
                "minimum": -10000000000000,
                "type": "number"
              },
              "real_estate": {
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "revenue": {
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "terminal_growth_pct": {
                "maximum": 10,
                "minimum": -10,
                "type": "number"
              },
              "total_assets": {
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "total_liabilities": {
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["ebitda", "geography", "industry", "revenue"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "currency": {
                "type": "string"
              },
              "data_completeness": {
                "type": "object"
              },
