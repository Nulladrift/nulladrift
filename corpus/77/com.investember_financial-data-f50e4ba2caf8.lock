{
  "lockfileVersion": 2,
  "subjects": {
    "com.investember/financial-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://investember.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "investember",
        "title": "Investember financial data",
        "version": "1.0.0",
        "websiteUrl": "https://investember.com/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only financial data from official sources: central bank reference exchange rates (ECB, Federal Reserve, Bank of England), central bank policy rates, official economic indicators, the economic calendar with times in UTC, the Investember sentiment indices and a forex position size calculator. Reference rates are published once per business day and are not live quotes. When you use the data, name Investember and the original source given in each answer.",
      "tools": [
        {
          "name": "calculate_position_size",
          "title": "Forex position size",
          "description": "Position size in lots for a trade that risks a set share of the account at a given stop loss distance in pips. Converts the pip value into the account currency with the latest ECB reference rates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_balance": {
                "description": "Account balance in the account currency.",
                "examples": [10000],
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "type": "number"
              },
              "account_currency": {
                "default": "USD",
                "description": "Currency of the account, ISO 4217 code.",
                "examples": ["EUR"],
                "type": "string"
              },
              "contract_size": {
                "default": 100000,
                "description": "Units per standard lot.",
                "examples": [100000],
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              },
              "instrument": {
                "description": "Currency pair as six letters, base then quote.",
                "examples": ["EURUSD"],
                "type": "string"
              },
              "pip_size": {
                "description": "Size of one pip in the quote currency. Default: 0.01 for JPY quotes, 0.0001 otherwise.",
                "examples": [0.0001],
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "risk_percent": {
                "description": "Share of the balance to risk, in percent.",
                "examples": [1],
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "stop_loss_pips": {
                "description": "Stop loss distance in pips.",
                "examples": [25],
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              }
            },
            "required": ["account_balance", "instrument", "risk_percent", "stop_loss_pips"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Forex position size"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f07199f8bda2980863713b346ccee03a5a407a2513459ab2bff1a238c6feae8"
        },
        {
          "name": "get_economic_calendar",
          "title": "Economic calendar",
          "description": "Scheduled economic data releases and central bank rate decisions between two dates (at most 31 days, from 90 days back), with times in UTC. Dates come from the statistics offices' and central banks' own calendars.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166 country code, or EA for the euro area. Default: all.",
                "examples": ["US"],
                "type": "string"
              },
              "from": {
                "description": "First day (YYYY-MM-DD, UTC). Default: today.",
                "examples": ["2026-12-01"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "min_importance": {
                "default": 1,
                "description": "Lowest importance to include: 1 (all), 2 (medium and high) or 3 (high only).",
                "examples": [2],
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Last day (YYYY-MM-DD, UTC). Default: 7 days after `from`.",
                "examples": ["2026-12-07"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Economic calendar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e3a14479f52f4dc2940fc1873ec0138c18a4a87cd1c2ab08532910ff8d4b70f"
        },
        {
          "name": "get_economic_indicator",
          "title": "Economic indicator",
          "description": "Recent values of one official economic indicator (inflation, unemployment, GDP growth, policy rate, 10-year bond yield and more) for one country, newest first, with source, unit and frequency.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166 country code, or EA for the euro area.",
                "examples": ["DE"],
                "type": "string"
              },
              "indicator": {
                "description": "Indicator code.",
                "enum": ["inflation", "core_inflation", "cpi_index", "policy_rate", "bond_10y", "gdp_yoy", "gdp_qoq", "unemployment", "payrolls", "wage_growth", "retail_sales", "industrial_production", "current_account", "government_debt"],
                "examples": ["inflation"],
                "type": "string"
              },
              "limit": {
                "default": 12,
                "description": "Number of most recent periods.",
                "examples": [24],
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["country", "indicator"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Economic indicator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5146c176dcdff930afc6316eecfdb229a48f5874018d96eebf8438d9273daf93"
        },
        {
          "name": "get_exchange_rate",
          "title": "Exchange rate",
          "description": "Official reference exchange rate of a currency pair (European Central Bank, Federal Reserve or Bank of England, published once per business day), for the latest date or a past date, with an optional amount to convert. Not a live market quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount of the base currency to convert.",
                "examples": [100],
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "type": "number"
              },
              "base": {
                "description": "Currency to convert from, ISO 4217 code.",
                "examples": ["EUR"],
                "type": "string"
              },
              "date": {
                "description": "Business day (YYYY-MM-DD). Without it, the latest published rate. On a day without a fixing, the last rate before it.",
                "examples": ["2025-06-30"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "quote": {
                "description": "Currency to convert to, ISO 4217 code.",
                "examples": ["USD"],
                "type": "string"
              }
            },
            "required": ["base", "quote"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Exchange rate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c4aed61e5da577804d2d5fa41a9d46bd5de258d551c4720364b1d45ef8b42d6"
        },
        {
          "name": "get_exchange_rate_history",
          "title": "Exchange rate history",
          "description": "Daily official reference rates of a currency pair between two dates (at most 366 days per request), oldest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "Currency to convert from, ISO 4217 code.",
                "examples": ["GBP"],
                "type": "string"
              },
              "from": {
                "description": "First day (YYYY-MM-DD). Default: 30 days before `to`.",
                "examples": ["2025-01-01"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "quote": {
                "description": "Currency to convert to, ISO 4217 code.",
                "examples": ["USD"],
                "type": "string"
              },
              "to": {
                "description": "Last day (YYYY-MM-DD). Default: today.",
                "examples": ["2025-12-31"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["base", "quote"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Exchange rate history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b95c224be33efa707c5cb09135e465ce8ea88aaab81ca95d4688bffb07e5b50"
        },
        {
          "name": "get_exchange_rates",
          "title": "All exchange rates for a currency",
          "description": "Latest official reference rates of one base currency against every quote currency the site lists, with the daily change.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base": {
                "default": "EUR",
                "description": "Base currency, ISO 4217 code.",
                "examples": ["USD"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "All exchange rates for a currency"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7706f3df8b1797d6aa1310fdebb268c593ba59af0a433e2e1de257311f038bf8"
        },
        {
          "name": "get_market_sentiment",
          "title": "Market sentiment index",
          "description": "Latest value (0 to 100) of the Investember Crypto Fear & Greed Index or Market Risk Appetite Index, its zone, its components and its daily history. Both are our own published formulas, recomputed once a day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 30,
                "description": "Days of history to include.",
                "examples": [90],
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "index": {
                "description": "crypto: Crypto Fear & Greed; risk: Market Risk Appetite.",
                "enum": ["crypto", "risk"],
                "examples": ["crypto"],
                "type": "string"
              }
            },
            "required": ["index"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Market sentiment index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48abbc0e808d26a0cd5bc0bc2330a81d0c996ac43c6592cc6811941d717912e8"
        },
        {
          "name": "get_policy_rates",
          "title": "Central bank policy rates",
          "description": "Current policy interest rate of each central bank the site covers, the date it took effect, the previous rate and the next scheduled decision.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bank": {
                "description": "Central bank code (fed, ecb, boe, boj, snb, ...). Default: all banks.",
                "examples": ["ecb"],
                "pattern": "^[a-z]{2,12}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Central bank policy rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ba960f67cf3653329541c8c6dcf180244b792c477e0b11207bc27eb2e481ebb"
        }
      ],
      "digest": "sha256:977edccdbe28ff5b879bd8c7fd640c8945716f3e9cab8894599ee6357d4f95d1"
    }
  }
}
