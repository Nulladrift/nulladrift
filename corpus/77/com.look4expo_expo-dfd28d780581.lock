{
  "lockfileVersion": 2,
  "subjects": {
    "com.look4expo/expo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://look4expo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "look4expo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "look4expo 是境外 B2B 专业展中文黄页（只读）。先用 list_countries / list_sectors 拿可用代码，再用 search_exhibitions 找展会，get_exhibition 取单场全字段，market_stats 看某国某行业的城市与月份分布。所有数字都是构建时快照，引用时请带上返回里的 data_updated。",
      "tools": [
        {
          "name": "get_exhibition",
          "description": "按 slug 取单场展会的全字段：档期、城市、场馆、主办方及联系方式、官网、行业、历届记录与数据核验日期。",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "展会 slug（取自 search_exhibitions 返回的 slug 字段或详情页 URL），如 southern-christmas-show-2026",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f848f2f261e2c55f7b22bc0b485a5768cc22b68429817b3cb6451cb03e87806"
        },
        {
          "name": "list_countries",
          "description": "列出本站收录的全部国家与地区（ISO2 + 中文名 + 场次数），按场次降序，无需参数。",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a6ee25e2e009e3bf1cab2ab7395cd66d52db00c80c5057ccb40a0c25e36682af"
        },
        {
          "name": "list_sectors",
          "description": "列出全部 UFI 行业分类（行业码 + 中文名 + 场次数），按场次降序，无需参数。",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76bfbb818847a07e299d26d2a56b998a40dd2b8964bc4400550b4452b5ad3ebe"
        },
        {
          "name": "market_stats",
          "description": "按国家／行业统计市场：总场次、Top5 城市及占比、未来 12 个月每月场次、最近 10 场（slug + 日期），口径与 /guide/ 数据页一致。",
          "inputSchema": {
            "anyOf": [
              {
                "required": ["country"]
              },
              {
                "required": ["sector"]
              }
            ],
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 国家代码（如 US）；与 sector 至少给一个",
                "type": "string"
              },
              "sector": {
                "description": "UFI 行业码（如 CONSTRUCTION）；与 country 至少给一个，两个都给即统计该国该行业",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c41d861ccff1ab53cfacf3ca1c3bb0712fe1d99ad1ebb60ef8db201271aa1f3a"
        },
        {
          "name": "search_exhibitions",
          "description": "按国家、行业、月份区间和关键词筛在办展会，返回命中总数与清单（slug、中英文名、档期、城市、国家、行业、详情页 URL）。",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 国家代码，如 DE、US、JP；不传则不限国家",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "返回条数，默认 20，上限 50",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "month_from": {
                "description": "开展月份下界 YYYY-MM（含），按开展日期过滤；无档期的条目不会返回",
                "type": "string"
              },
              "month_to": {
                "description": "开展月份上界 YYYY-MM（含）",
                "type": "string"
              },
              "q": {
                "description": "关键词，忽略大小写匹配中文名或英文名，如 机床 / Hannover",
                "type": "string"
              },
              "sector": {
                "description": "UFI 行业码（大写），如 INDUSTRIAL、CONSTRUCTION、FOOD；一场展的 industry_l1 或 industry_l2 命中即算；不传则不限行业",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:df5d7d4e6e1ef2e6e210febcb4ec3873c78a893958aa25a5590ee21f18432b1c"
        }
      ],
      "digest": "sha256:d38292bfca8f7620c2b79bc94f0d20893d6aac48fe6f2d36e58e8bd8aadea877"
    }
  }
}
