      "serverInfo": {
        "name": "provider-trust",
        "title": "Provider Trust",
        "version": "1.2.0",
        "description": "Verify a provider or source before an AI agent trusts or uses it.",
        "icons": [
          {
            "src": "https://www.scriptmasterlabs.com/assets/provider-trust-favicon.png",
            "mimeType": "image/png",
            "sizes": ["64x64"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use Provider Trust before an AI agent relies on a provider or source. It is public, read-only, evidence-first, and never signs or spends. Unknown stays unknown.",
      "tools": [
        {
          "name": "canon_registry_bulk_lookup",
          "title": "CANON Registry Bulk Lookup",
          "description": "PAID tool ($0.01 USDC via x402, Base). Resolve up to 100 artifact freshness records in one call against live registries and cryptographically verified CANON publisher manifests: detects stale mirrors, superseded artifacts, and publisher/registry conflicts. Send the x402 PAYMENT-SIGNATURE header on the /mcp request; without payment the call returns the canonical x402 challenge (HTTP 402, amount 10000 = $0.01 USDC, payTo of the CANON endpoint). Settlement is performed by the canonical CANON endpoint on SqueezeOS; this MCP never holds funds and never pays on your behalf.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "One to 100 package or artifact freshness checks.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "held_integrity": {
                      "description": "Optional integrity value currently held by the caller, for tamper comparison when evidence supports it.",
                      "type": "string"
                    },
                    "held_version": {
                      "description": "Optional version currently held by the caller or mirror, for freshness comparison.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Package or artifact identifier to resolve, e.g. an npm package name.",
                      "maxLength": 2048,
                      "minLength": 1,
                      "type": "string"
                    },
                    "publisher_domain": {
                      "description": "Optional public publisher domain whose CANON manifest and Ed25519 keyset should be verified.",
                      "type": "string"
                    },
                    "type": {
                      "description": "Artifact family; omit only when CANON can infer it from the identifier.",
                      "enum": ["npm", "pypi", "api", "doc"],
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "CANON Registry Bulk Lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:30a99dff6fc4fa25fa57064d868ea8acc48665fc9c4c735cec098460e433090f"
        },
