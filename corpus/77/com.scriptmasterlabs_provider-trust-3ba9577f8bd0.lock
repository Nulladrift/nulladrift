          "title": "Verify Provider",
          "description": "PAID tool ($0.001 USDC via x402, Base). Verify a provider or source before an AI agent trusts or uses it. Returns live evidence only; unknown stays unknown. Send the x402 PAYMENT-SIGNATURE header on the /mcp request; without payment the call returns the canonical x402 challenge (HTTP 402, amount 1000 = $0.001 USDC, payTo of the canonical SML receiver). Settlement is performed by the canonical CANON endpoint on SqueezeOS; this MCP never holds funds and never pays on your behalf.",
