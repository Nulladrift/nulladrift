{
  "lockfileVersion": 2,
  "subjects": {
    "com.craftuary/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://craftuary.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "craftuary",
        "title": "Craftuary",
        "version": "1.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use check_crochet_pattern when someone shares a written crochet pattern and asks whether it is right, why their piece came out wrong, or which round has a mistake. Use find_free_pattern when someone wants a free crochet, embroidery, cross stitch, knitting or sewing pattern. Use explain_stitch for how to do a stitch or technique, and craft_calculator for blanket, scarf or C2C sizes and increasing or decreasing evenly.",
      "tools": [
        {
          "name": "check_crochet_pattern",
          "title": "Check a crochet pattern's stitch counts",
          "description": "Counts every round of a written crochet pattern (US terms) and reports which rounds' printed stitch counts don't match the stitches the round actually makes, before anyone crochets it. Paste the pattern text, rounds or rows with their counts, e.g. 'Rnd 2: inc in each st around (12)'. Returns rounds read, counts matched and the rounds to look at, with a link to the full round-by-round report.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pattern_text": {
                "description": "The written pattern, as plain text (US crochet terms).",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["pattern_text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a crochet pattern's stitch counts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b4cc72e7c2a4db69560b438a73b3a308fff3529f821af1ca7d35f3d6ba1f6bcc"
        },
        {
          "name": "craft_calculator",
          "title": "Blanket, scarf, C2C and increase-evenly calculator",
          "description": "Works out stitches, starting chain, rows and yarn for a crochet or knit blanket or scarf, the C2C grid for a size, or how to increase or decrease evenly from one stitch count to another. Same maths as Craftuary's free calculators.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "craft": {
                "enum": ["crochet", "knit"],
                "type": "string"
              },
              "from": {
                "description": "evenly: stitches now.",
                "type": "integer"
              },
              "kind": {
                "enum": ["blanket", "scarf", "c2c", "evenly"],
                "type": "string"
              },
              "length": {
                "description": "Length.",
                "type": "number"
              },
              "rows": {
                "description": "evenly: worked in rows (true) or rounds (false).",
                "type": "boolean"
              },
              "stitch": {
                "description": "sc, hdc, dc (crochet) or garter, stockinette, seed, rib (knit).",
                "type": "string"
              },
              "to": {
                "description": "evenly: stitches wanted.",
                "type": "integer"
              },
              "unit": {
                "enum": ["in", "cm"],
                "type": "string"
              },
              "width": {
                "description": "Width (blanket, scarf, c2c).",
                "type": "number"
              },
              "yarn_weight": {
                "description": "Craft Yarn Council number: 3 DK, 4 worsted, 5 bulky.",
                "maximum": 7,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Blanket, scarf, C2C and increase-evenly calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c5c142141576df73550f03de715441d9f94b99d19bb42bb95160b7f58d026b8"
        },
        {
          "name": "explain_stitch",
          "title": "Explain a crochet, knitting or embroidery stitch",
          "description": "Explains a stitch or technique in plain words (e.g. 'magic ring', 'single crochet', 'invisible decrease', 'French knot', 'cast on') and links to Craftuary's free lesson or guide with a 3D step-by-step diagram.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The stitch or technique.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a crochet, knitting or embroidery stitch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03f232bcfe9122ab199e5df7e27c0d65915a51a36ebcadf6df24b200a4c3960b"
        },
        {
          "name": "find_free_pattern",
          "title": "Find a free Craftuary pattern",
          "description": "Finds free crochet, embroidery, cross stitch, knitting and sewing patterns on craftuary.com that match what the maker wants (e.g. 'free crochet bunny', 'easy Christmas ornament', 'embroidery hoop flowers'). Returns up to 6 patterns with a photo, size, yarn and a link to the free pattern page. The pattern itself is on the page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "craft": {
                "description": "Optional craft.",
                "enum": ["any", "crochet", "embroidery", "cross stitch", "knitting", "sewing"],
                "type": "string"
              },
              "query": {
                "description": "What to make, in the maker's words.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a free Craftuary pattern"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bca10cbaad4a837617cf606173a449f9e668285bfecbb203b79f16349f308c40"
        }
      ],
      "digest": "sha256:b1b0d7b90922c351dac7442200233259b3db4949cf961d7bd13141ef4632daea"
    }
  }
}
