          "name": "dropslop_critique_for_agent",
          "title": "Critique a draft for an agent",
          "description": "Fast CPU Agent Self-Heal Critique (~2s, 0 GPU wait). Runs Detector v4, Slop X-Ray, Fact-Guard entity locking, Sentence-Claim coverage, Abstract Boilerplate detection, and 4-Dimension Brand Voice scoring. Returns `passes_all_gates`, `locked_entities_must_keep`, `hot_paragraphs_to_edit`, and a coordinate-indexed `agent_instruction_sheet` so the calling agent can surgically edit its own draft in 1-2 turns.",
