        {
          "name": "dropslop_diff_gate",
          "title": "Check a draft's changes before publishing",
          "description": "CI/CD & CMS Pre-Publish Diff Gate (`PASS` | `WARN` | `BLOCK`). Accepts a unified `git diff` (`diff_text`) or `before_text` + `after_text`, extracts only added/modified prose blocks (>= 18 words, skipping fenced code, YAML frontmatter, and raw tables), batch-scores AI probability + Brand Voice + banned terms + AI tells + broken markdown links `[text]()`, and returns file/line-anchored annotations.",
          "inputSchema": {
            "properties": {
              "after_text": {
                "description": "Optional updated text when not passing `diff_text`.",
                "type": "string"
              },
              "banned_terms": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "before_text": {
                "description": "Optional baseline text when not passing `diff_text`.",
                "type": "string"
              },
              "diff_text": {
                "description": "Unified `git diff` string (supports multi-file diffs).",
                "type": "string"
              },
              "file_path": {
                "default": "document.md",
                "type": "string"
              },
              "max_ai_prob_block": {
                "default": 0.5,
                "type": "number"
              },
              "max_ai_prob_warn": {
                "default": 0.25,
                "type": "number"
              },
              "min_block_words": {
                "default": 18,
                "minimum": 1,
                "type": "integer"
              },
              "min_voice_score_block": {
                "type": "number"
              },
              "min_voice_score_warn": {
                "default": 60,
                "type": "number"
              },
              "voice_profile_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a draft's changes before publishing"
