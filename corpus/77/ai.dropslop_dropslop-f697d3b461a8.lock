        {
          "name": "dropslop_edit_lineage_attest",
          "title": "Certify a document's edit history",
          "description": "Issue a tamper-evident Cryptographic Edit-Lineage & Process Provenance Certificate (`lin_...`) with a SHA-256 hash chain, binary Merkle root, and HMAC-SHA256 signature from either a caller-owned `doc_id` or explicit `revisions` (minimum 2). Supports `privacy_mode=True` (zero intermediate draft text stored) and computes edit kinematics (`ORGANIC_ITERATIVE_DRAFTING` vs `SINGLE_PASTE_BULK_INSERT` vs `SURGICAL_POLISH_PASS`).",
          "inputSchema": {
            "properties": {
              "doc_id": {
                "description": "Caller-owned DropSlop `doc_id` whose `document_versions` should be attested.",
                "type": "string"
              },
              "pinned_terms": {
                "description": "Optional entities/metrics to track across outline-to-final continuity.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "privacy_mode": {
                "default": true,
                "description": "When true (default), intermediate draft texts are never stored in the public receipt.",
                "type": "boolean"
              },
              "revisions": {
                "description": "Ordered revision snapshots (minimum 2) when attesting outside DropSlop Library.",
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    },
                    "timestamp": {
                      "type": "string"
                    }
