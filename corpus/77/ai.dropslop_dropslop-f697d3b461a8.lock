      },
      "instructions": "DropSlop: check whether writing reads as AI-written, see the phrases behind it, rewrite what reads machine-made with Fact-Guard checks, and audit whole sites. No key is needed for the daily free use; with an API key (Authorization: Bearer hk_live_... or X-API-Key) your plan's allowance applies. Every score is an estimate, not proof of who wrote a text.",
      "tools": [
        {
          "name": "dropslop_certify",
          "title": "Issue a certificate for a text",
          "description": "Issue a tamper-evident certificate (/v/{cert_id}): a signed record of this exact text (SHA-256 hash), the scores it got from DropSlop's checker and, for a verified certificate, from two outside detectors, and a Fact-Guard receipt. A certificate is a record of a check, not proof of who wrote the text. Uses one certificate per started 1,000 words (2,400 words = 3); text both outside detectors scored in the last 7 days uses none. Needs your own API key.",
          "inputSchema": {
            "properties": {
              "basic": {
                "default": false,
                "description": "A basic certificate: DropSlop's own check only, no outside detector. Free and unlimited, up to 5,000 words.",
                "type": "boolean"
              },
              "pinned_terms": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "text": {
                "description": "Final text to certify.",
                "type": "string"
              },
              "title": {
                "default": "Verified Human-Authored Document",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Issue a certificate for a text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:dc9d5527a96b3607d2d550d615263f2dfed1de98c53d9d08e6b184d9608c7549"
        },
        {
          "name": "dropslop_corpus_monoculture_check",
          "title": "Check articles for template sameness",
          "description": "Cross-article sameness check (0 GPU): finds articles that share one template, the pattern search engines treat as scaled, low-value content. Compares a draft against corpus_texts, a completed site audit (audit_job_id), an SSRF-safe sitemap crawl (crawl_target), and/or the caller's saved library documents across 4 sensors: opening-hook skeleton collisions, H2 section-arc cloning, 64-bit SimHash + 5-word shingle & stock-metaphor reuse, and TF-IDF + entity/stat topic cannibalization.",
          "inputSchema": {
            "properties": {
              "audit_job_id": {
                "description": "Optional completed dropslop_site_audit job_id owned by the caller.",
                "type": "string"
              },
              "corpus_texts": {
                "description": "Optional comparison articles (strings or {doc_id, title, url, text} objects).",
                "items": {
                  "type": ["string", "object"]
                },
                "type": "array"
              },
              "crawl_target": {
                "description": "Optional public domain or sitemap URL to sample up to max_corpus_docs pages from.",
                "type": "string"
              },
              "include_saved_documents": {
                "default": true,
                "description": "Include the signed-in caller's saved documents in DropSlop Library.",
                "type": "boolean"
              },
              "max_corpus_docs": {
                "default": 60,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "text": {
                "description": "New draft markdown or prose to test for corpus monoculture.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check articles for template sameness"
          },
          "behavior": {
            "destructive": false,
