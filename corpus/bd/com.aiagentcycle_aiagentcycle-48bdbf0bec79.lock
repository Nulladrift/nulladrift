        {
          "name": "list_integrations",
          "title": "Systems AIAgentCycle integrates",
          "description": "The integrations catalogue of aiagentcycle.com (190 systems): name, status, domain, category,\ndescription, open-source license and a detail-page url where one exists. Status: productie = already\nrunning in production at AIAgentCycle or a client; standaard = n8n has a built-in node; maatwerk = custom\nvia API, export, database or screen automation. Filters: query (name or text, max 100 chars), domain\n(administratie, verkoop, samenwerken, data), status, open_source. lang is nl or en. A system that is not\nlisted can usually still be connected through one of those four routes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "default": "",
                "description": "Optional domain filter: administratie (finance and admin), verkoop (customers and sales), samenwerken (work and communication) or data (data, servers and AI).",
                "enum": ["", "administratie", "verkoop", "samenwerken", "data"],
                "type": "string"
              },
              "lang": {
                "default": "nl",
                "description": "Language of the content: nl (Dutch, the primary site language) or en (English).",
                "enum": ["nl", "en"],
                "type": "string"
              },
              "open_source": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "true for only open-source systems, false for only proprietary ones; leave out for both."
              },
              "query": {
                "default": "",
                "description": "Optional words that must all occur in the name, description, category or license, for example 'twinfield' or 'crm'. Max 100 characters.",
                "type": "string"
              },
              "status": {
                "default": "",
                "description": "Optional status filter: productie (running in production), standaard (n8n built-in node) or maatwerk (custom).",
                "enum": ["", "productie", "standaard", "maatwerk"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
