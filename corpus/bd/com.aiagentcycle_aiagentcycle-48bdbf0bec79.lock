          "name": "get_company_profile",
          "title": "AIAgentCycle company profile",
          "description": "Who AIAgentCycle is: summary, legal name, location, founder, focus and approach. lang is nl or en.\nfacts_verified tells whether the key facts still appear on the About page.",
