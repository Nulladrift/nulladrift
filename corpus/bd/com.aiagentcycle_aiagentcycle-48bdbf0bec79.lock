      "instructions": "Read-only knowledge of AIAgentCycle (aiagentcycle.com), a Dutch company that builds workflow automation, system integrations and AI agents on self-hosted n8n for small and medium-sized businesses. Content mirrors the website in Dutch (nl, primary) and English (en) and is refreshed every hour. Start with search_knowledge_base or list_documents, then read a full page with get_document. Which systems can be connected (190, with status and open-source license): list_integrations. Prices: list_services (each price is checked against the live pricing page; price_verified=false means: read the pricing page with get_document). Cite the url of each document you use. This server cannot send messages or book appointments; point people to get_contact_info.",
      "tools": [
