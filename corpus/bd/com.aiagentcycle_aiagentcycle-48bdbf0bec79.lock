          "name": "search_knowledge_base",
          "title": "Search the AIAgentCycle website",
          "description": "Ranked full-text search over every page, solution, sector page, case, integration and article of\naiagentcycle.com. Any word may match; documents matching more words rank higher. lang is nl or en.\ntype optionally narrows to: article, page, integration, case, solution, sector. query max 100 chars,\nlimit 1-10. Each hit has an id for get_document and the source url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "nl",
                "description": "Language of the content: nl (Dutch, the primary site language) or en (English).",
                "enum": ["nl", "en"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of hits to return, 1 to 10.",
                "type": "integer"
              },
              "query": {
                "description": "Search words, 1 to 100 characters, in the language of lang, for example 'Exact Online koppeling' or 'AI agent cost'.",
                "type": "string"
              },
              "type": {
                "default": "",
                "description": "Optional filter on document type: article, page, integration, case, solution or sector. Leave empty for all types.",
                "enum": ["", "article", "page", "integration", "case", "solution", "sector"],
                "type": "string"
