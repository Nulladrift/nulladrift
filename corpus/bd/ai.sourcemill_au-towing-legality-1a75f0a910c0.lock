      "serverInfo": {
        "name": "au-towing-legality",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_towing",
          "description": "Use when someone asks whether an Australian vehicle can legally tow a particular caravan or trailer — \"can my Ranger tow a 3 tonne van\", \"am I over GCM\", \"what is the heaviest caravan I can tow\", \"is my towing setup legal\". Given a vehicle + variant and the caravan's ATM (plus optional tow-vehicle payload), returns whether the combination is legally compliant, marginal or illegal, WHICH limit binds (braked capacity, towball download, GVM or GCM — often not the braked rating everyone quotes), the maximum ATM that is legal for that vehicle, and remaining payload. Manufacturer-spec information, not advice.",
          "inputSchema": {
            "properties": {
              "load": {
                "description": "people + gear in the tow vehicle (kg)",
                "type": "number"
              },
              "van_atm": {
                "description": "caravan Aggregate Trailer Mass (kg)",
                "type": "number"
              },
              "variant": {
                "description": "trim/variant, e.g. V6 or SR5",
                "type": "string"
              },
              "vehicle": {
                "description": "make + model, e.g. Ford Ranger",
                "type": "string"
              }
            },
            "required": ["van_atm", "vehicle"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfc7d7358ca4314502efc129d90aec9e0383c986122e6e4d3feedd6febd32e12"
        }
      ],
