        {
          "name": "export_csv",
          "title": "Export csv",
          "description": "Export as CSV text for analysis: messages, deliveries, events, opt_outs, webhook_deliveries, usage, usage_monthly, audit_log or credit_history. At most 50,000 rows; narrow the date range with from and to.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "audit_log: one action, or a group prefix with a trailing dot (team.)",
                "type": "string"
              },
              "actor": {
                "description": "audit_log: actor id or part of the actor email",
                "type": "string"
              },
              "batch": {
                "description": "messages, deliveries: batch id (bc_...)",
                "type": "string"
              },
              "blocked_reason": {
                "description": "messages, deliveries: blocked messages with this reason",
                "type": "string"
              },
              "created_after": {
                "description": "audit_log: same as on GET /audit-logs (from is accepted too)",
                "type": "string"
              },
              "created_before": {
                "description": "audit_log: same as on GET /audit-logs (to is accepted too)",
                "type": "string"
              },
              "customer_id": {
                "description": "messages, deliveries",
                "type": "string"
              },
              "direction": {
                "description": "messages",
                "enum": ["outbound", "inbound"],
                "type": "string"
              },
              "endpoint_id": {
                "description": "webhook_deliveries (default: all endpoints)",
                "type": "string"
              },
              "failure_code": {
                "description": "messages, deliveries: failed for this reason (the `failure.code` on a message)",
                "enum": ["carrier_filtered", "unreachable", "invalid_number", "opted_out", "campaign_mismatch", "content_blocked", "screen_unavailable", "rate_limited", "landline", "carrier_rejected", "spend_limit_reached", "insufficient_credits", "billing_required", "sender_not_registered", "quiet_hours", "consent_required", "reconfirmation_pending", "reconfirmation_expired", "held_for_review", "review_rejected", "review_expired", "campaign_paused", "sender_rotation", "recipient_not_verified", "quota_exceeded", "destination_not_allowed", "voip_number", "toll_free_destination", "toll_free_unverified", "account_closed", "account_suspended", "account_paused", "topic_unsubscribed", "unknown"],
                "type": "string"
              },
              "from": {
                "description": "ISO date/time or epoch ms (messages, deliveries, events, webhook_deliveries)",
                "type": "string"
              },
              "from_number": {
                "description": "messages, deliveries: exact sender (E.164)",
                "type": "string"
              },
              "kind": {
                "description": "messages, deliveries, events, opt_outs, webhook_deliveries, usage, usage_monthly, audit_log or credit_history",
                "type": "string"
              },
              "months": {
                "default": 3,
                "description": "usage: daily rows for the last N months",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "number": {
                "description": "messages, deliveries: digits matched against either side",
                "type": "string"
              },
              "ok": {
                "description": "webhook_deliveries",
                "type": "boolean"
              },
              "q": {
                "description": "messages: body/failure text; events: id/payload text",
                "type": "string"
              },
              "status": {
                "description": "messages, deliveries",
                "enum": ["queued", "sent", "delivered", "failed", "blocked", "received"],
                "type": "string"
              },
              "target_type": {
                "description": "audit_log",
                "type": "string"
              },
              "to": {
                "description": "Inclusive; a bare date means the end of that day (UTC)",
                "type": "string"
              },
              "to_number": {
                "description": "messages, deliveries: exact recipient (E.164). `to`/`from` are the date range here.",
                "type": "string"
              },
              "type": {
                "description": "events, webhook_deliveries",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
