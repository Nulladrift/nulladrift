        {
          "name": "import_contacts",
          "title": "Import contacts",
          "description": "Create or update up to 500 contacts per call, matched by phone_number. Attributes go in fields (up to 20 strings, e.g. plan) for segments and {{field:name}} merge tags; tags group contacts. opt_in carries consent evidence (status: false records an opt-out). import_id from the first response groups several calls; dry_run: true returns what would change and writes nothing.",
          "inputSchema": {
            "properties": {
              "campaign_id": {
                "description": "Applies to every opt_in row that does not name its own campaign_id",
                "type": "string"
              },
              "check_line_types": {
                "description": "dry_run only. Looks up line types to count landlines; live lookups are paid, so only the first 500 numbers are checked.",
                "type": "boolean"
              },
              "contacts": {
                "description": "Contacts to create or update, up to 500 per call",
                "items": {
                  "properties": {
                    "company": {
                      "description": "Company name",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "email": {
                      "description": "Email address",
                      "maxLength": 254,
                      "type": "string"
                    },
                    "fields": {
                      "additionalProperties": {
                        "maxLength": 500,
                        "type": "string"
                      },
                      "description": "Up to 20 string values (account id, plan, location...), usable in segments and as {{field:key}} merge fields",
                      "type": "object"
                    },
                    "first_name": {
                      "description": "First name",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "last_name": {
                      "description": "Last name",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "name": {
                      "description": "Display name. Defaults to first + last name.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "notes": {
                      "description": "Free-text notes",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "opt_in": {
                      "description": "Import only (POST /v1/contacts/import). Stored as consent evidence; never lifts an opt-out.",
                      "properties": {
                        "at": {
                          "description": "When they opted in: ISO timestamp, date, or epoch ms",
                          "type": "string"
                        },
                        "campaign_id": {
                          "description": "The registration the opt-in is for. A marketing or mixed registration needs at, a recognised source, and page_url for a web form, or the row is skipped",
                          "type": "string"
                        },
                        "page_url": {
                          "description": "The page a web-form opt-in was collected on",
                          "format": "uri",
                          "type": "string"
                        },
                        "source": {
                          "description": "web_form, keyword, paper, checkout or verbal are stored as proof; anything else is kept as a note",
                          "type": "string"
                        },
                        "status": {
                          "description": "true = opted in; false = unsubscribed (recorded as an opt-out)",
                          "type": "boolean"
                        }
                      },
                      "type": "object"
                    },
                    "phone_number": {
                      "description": "E.164, US or Canada",
                      "type": "string"
                    },
                    "source": {
                      "description": "Where the contact came from. Defaults to \"api\".",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "state": {
                      "description": "US state or Canadian province, usually a 2-letter code",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "tags": {
                      "description": "Labels that group contacts",
                      "items": {
                        "maxLength": 40,
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    }
                  },
                  "required": ["phone_number"],
                  "type": "object"
                },
                "maxItems": 500,
                "type": "array"
              },
              "dry_run": {
                "description": "true returns what would change and writes nothing",
                "type": "boolean"
              },
              "import_id": {
                "description": "From a previous response, to group several requests as one import.",
                "type": "string"
              },
              "name": {
                "description": "A label for the import (first request only).",
                "type": "string"
              }
            },
            "required": ["contacts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Import contacts"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:113320c62e007b329d216b4750a31939dc77571a67dc6fb7b8a65ed521acaf50"
        },
