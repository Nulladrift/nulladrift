                "maxLength": 2000,
                "type": "string"
              },
              "opt_in_screenshot_url": {
                "description": "A public image of the step where people enter their number and agree. Needed when the opt-in page itself has no phone field, like a later step of a form or an app.",
                "format": "uri",
                "type": "string"
              },
              "opt_in_url": {
                "description": "The opt-in page. With none of your own we make you a hosted one.",
                "format": "uri",
                "type": "string"
              },
              "phones_in_messages": {
                "description": "Phone numbers your messages include, or \"None\".",
                "type": "string"
              },
              "postal_code": {
                "description": "ZIP or postal code.",
                "type": "string"
              },
              "previous_content": {
                "description": "Sample messages from the previous service (not new only).",
                "maxLength": 2000,
                "type": "string"
              },
              "previous_numbers": {
                "description": "The numbers it used (not new only).",
                "type": "string"
              },
              "previous_service": {
                "description": "Where this traffic ran before.",
                "enum": ["new", "short_code", "long_number"],
                "type": "string"
              },
              "privacy_url": {
                "description": "The privacy policy page.",
                "format": "uri",
                "type": "string"
              },
              "sample_messages": {
                "description": "At least two example messages.",
                "items": {
                  "maxLength": 640,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "state": {
                "description": "State or province code.",
                "type": "string"
              },
              "stop_reply": {
                "description": "The reply to STOP: names the business and says they are unsubscribed. Omit to keep ours.",
                "type": "string"
              },
              "street": {
                "description": "Street address of the business.",
                "type": "string"
              },
