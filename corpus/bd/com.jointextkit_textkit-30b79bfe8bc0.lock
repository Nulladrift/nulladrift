              },
              "brand_email": {
                "description": "The business's own email, for its customers: the HELP reply and the hosted opt-in page name it.",
                "type": "string"
              },
              "business_name": {
                "description": "The legal name, as on the IRS EIN letter, optionally with \"d/b/a\" and the brand your messages carry.",
                "type": "string"
              },
              "city": {
                "description": "City.",
                "type": "string"
              },
              "contact_first_name": {
                "description": "First name of the person the carriers can contact about this program.",
                "type": "string"
              },
              "contact_last_name": {
                "description": "Their last name.",
                "type": "string"
              },
              "contact_phone": {
                "description": "A phone number they answer.",
                "type": "string"
              },
              "country": {
                "description": "Country of the business.",
                "type": "string"
              },
              "ein": {
                "description": "The EIN (US), matching the legal name; elsewhere the business registration number.",
                "type": "string"
              },
              "entity_type": {
                "description": "The kind of business.",
                "enum": ["PRIVATE_PROFIT", "PUBLIC_PROFIT", "NON_PROFIT", "GOVERNMENT", "SOLE_PROPRIETOR"],
                "type": "string"
              },
              "fortune_500": {
                "description": "The company is in the Fortune 500.",
                "type": "boolean"
              },
              "help_reply": {
                "description": "The reply to HELP: names the business and how to reach it. Omit to keep ours.",
                "type": "string"
              },
              "id": {
                "description": "Toll-free verification id (tfv_...)",
                "type": "string"
              },
              "monthly_volume": {
                "description": "How many texts a month this program sends.",
                "type": "string"
              },
              "multiple_numbers_reason": {
                "description": "Why the program needs more than one number (one per store, say). Required with more than one number.",
                "type": "string"
              },
              "number_published": {
                "description": "Where people see this number.",
                "type": "string"
              },
              "numbers": {
