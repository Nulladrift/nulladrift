              "fees_acknowledged": {
                "description": "Must be true. Confirms the registration fee terms above.",
                "enum": [true],
                "type": "boolean"
              },
              "id": {
                "description": "Registration id (reg_...)",
                "type": "string"
              }
            },
            "required": ["fees_acknowledged", "id"],
