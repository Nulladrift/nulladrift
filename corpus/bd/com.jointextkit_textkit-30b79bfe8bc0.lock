        {
          "name": "send_batch",
          "title": "Send batch",
          "description": "Send one message to many people (a broadcast or campaign): pick recipients by segment_id, tags, contact_ids, or an explicit recipients list. Opted-out numbers, numbers without marketing consent, and people unsubscribed from topic_id are removed before sending. dry_run: true sends nothing and returns the count, cost, rejected rows and consent. scheduled_at sends at one instant; send_at_local (like 2026-11-10T17:00) sends at that time on each person's own clock.no_opt_in (recipients the send will skip for having no opt-in). Leave out `from` and TextKit picks a number approved for `category` (marketing unless you say otherwise), one per recipient; `sender` shows them, and with none approved it answers 400 and sends nothing. scheduled_at sends later (up to 30 days). shorten_links: true tracks link clicks: suggest it whenever the text has a link. Each recipient can carry external_id (their Mixpanel distinct_id) so the text's events land on their Mixpanel profile. With a live key it texts real people.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "The message text. Merge tags fill per recipient",
                "maxLength": 1600,
                "type": "string"
              },
              "category": {
                "description": "Optional. It can make the batch stricter (`marketing`), never looser: the sending number's registration and the wording decide ([which messages are marketing](/docs/compliance-checks#which-messages-are-marketing)). From a number with no registration, a batch is marketing.",
                "enum": ["marketing", "transactional", "otp"],
                "type": "string"
              },
              "check_line_types": {
                "description": "Reject landlines (first 500 unique numbers are checked).",
                "type": "boolean"
              },
              "contact_ids": {
                "description": "Send to these contacts, by id",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "dry_run": {
                "description": "Validate only: returns a BatchValidation and sends nothing.",
                "type": "boolean"
              },
              "from": {
                "description": "One of your numbers, to pin the batch to it. Leave it out and TextKit picks a number approved for `category` (marketing unless you say otherwise), the same one per recipient. Nothing approved is a 400.",
                "type": "string"
              },
              "list_id": {
                "description": "Send to the contacts in this list, as it is when the batch is created (instead of recipients).",
                "type": "string"
              },
              "name": {
                "description": "A name for the broadcast",
                "maxLength": 80,
                "type": "string"
              },
              "quiet_hours": {
                "description": "Optional. What to do with a message in the recipient's quiet hours: `block` refuses it (403 quiet_hours), `defer` holds it until their next 9:00am. Omitted: each recipient in quiet hours is held until their 9:00am.",
                "enum": ["block", "defer"],
                "type": "string"
              },
              "recipients": {
                "description": "Explicit recipients, up to 10,000",
                "items": {
                  "properties": {
                    "external_id": {
                      "description": "Optional. The person's id in your analytics tool (their Mixpanel distinct_id; `mixpanel_distinct_id` is accepted too). With a Mixpanel integration connected, each event about this text lands on that profile in Mixpanel. Without it, the contact with this number that Mixpanel supplied is used.",
                      "maxLength": 255,
                      "type": "string"
                    },
                    "to": {
                      "description": "Recipient's number in E.164",
                      "type": "string"
                    },
                    "variables": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "description": "Merge values for this recipient, by name",
                      "type": "object"
                    }
                  },
                  "required": ["to"],
                  "type": "object"
                },
                "maxItems": 10000,
                "type": "array"
              },
              "scheduled_at": {
                "description": "Future ISO timestamp or epoch ms, up to 30 days out.",
                "type": "string"
              },
              "segment_id": {
                "description": "Send to the contacts in this saved segment, evaluated when the batch is created (instead of recipients).",
                "type": "string"
              },
              "send_at_local": {
                "description": "Instead of `scheduled_at`: a date and time with no time zone, up to 30 days out, sent at that time in each recipient's own zone, read from the area code. Refused if it has passed for any recipient. Quiet hours still hold a time outside the window.",
                "type": "string"
              },
              "shorten_links": {
                "description": "Optional. Rewrite every http(s) link to a tracked short link, per recipient, when each message is sent. Clicks show in GET /batches/{id}/results.",
                "type": "boolean"
              },
              "tags": {
                "description": "Send to contacts carrying any of these tags (instead of recipients).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "topic_id": {
                "description": "Subscription topic. Recipients unsubscribed from it are removed at validation (`topic_unsubscribed`) and skipped at send time, like opt-outs. Omit to apply opt-outs only.",
                "type": "string"
              }
            },
            "required": ["body"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send batch"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7e6541b4b7974f90cd454ac0a39f5f0f570478a5fcaedcbac3d3ed0e2d2f82fa"
        },
        {
          "name": "send_message",
          "title": "Send message",
          "description": "Send one SMS from one of your numbers. Set category \"marketing\" for promotions (the opt-in check applies) and scheduled_at to send later. Quiet hours apply to every message: outside 8am-9pm (narrower in some states) in the recipient's local time a marketing message is refused and anything else is held until 9am, except one-time codes and replies within 4 hours of their text. In sandbox (test keys), delivery is simulated: +15005550006 delivers, +15005550002 fails, +15005550007 is filtered as spam, +15005550013 delivers after a delay, +15005550016 has no opt-in (see /docs/sandbox).",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "The message text",
                "maxLength": 1600,
                "type": "string"
              },
              "category": {
                "description": "Optional. It can make a message stricter (`marketing`), never looser: what a message is comes from the sending number's registration and its wording ([which messages are marketing](/docs/compliance-checks#which-messages-are-marketing)). A message outside its registration's use case is refused with 403 campaign_mismatch.",
                "enum": ["marketing", "transactional", "otp"],
                "type": "string"
              },
              "consent": {
                "description": "Optional. How the recipient agreed to your messages. A recurring non-marketing message from a number linked to a registration needs an opt-in on file for that registration; when none is, this records it and the message is sent. Never counts for marketing (use POST /v1/consent with proof). Not with scheduled_at.",
                "properties": {
                  "collected_at": {
                    "description": "When they agreed: ISO timestamp or epoch ms, not in the future.",
                    "type": "string"
                  },
                  "page_url": {
                    "description": "Required for web_form: the page the form was on.",
                    "format": "uri",
                    "type": "string"
                  },
                  "source": {
                    "description": "How the recipient agreed",
                    "enum": ["web_form", "keyword", "paper", "checkout", "verbal"],
                    "type": "string"
                  }
                },
                "required": ["collected_at", "source"],
                "type": "object"
              },
              "customer_id": {
                "description": "Optional. Attribute to one of your customers. Defaults to the customer the from-number is assigned to; a number assigned to another customer is rejected (400).",
                "type": "string"
              },
              "from": {
                "description": "One of your numbers, or a sender pool id (pool_...): TextKit picks a pool member, the same one for each recipient every time. Optional when the account has exactly one number for the key's mode.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Retries are already safe: the same call with the same inputs within 10 minutes is done once and answers with the first result. Pass your own key to dedupe across a longer gap, or a new one to repeat an identical call on purpose.",
                "maxLength": 200,
                "type": "string"
              },
              "media": {
                "description": "Reserved for MMS; currently returns 400 mms_not_enabled.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "type": "array"
              },
              "quiet_hours": {
                "description": "Optional. What to do with a message in the recipient's quiet hours: `block` refuses it (403 quiet_hours), `defer` holds it until their next 9:00am. Omitted: the account default (a single marketing send is refused; every other message is held). One-time codes are never held.",
                "enum": ["block", "defer"],
                "type": "string"
              },
              "scheduled_at": {
                "description": "Optional. Future ISO timestamp (or epoch ms), up to 30 days out. The message is queued and the response is a scheduled_message object instead of a message. A marketing message scheduled into the recipient's quiet hours is refused now (403 quiet_hours) or, with quiet_hours defer, moved to their next 9:00am; any other message is moved.",
                "type": "string"
              },
              "shorten_links": {
                "description": "Optional. Rewrite every http(s) link in `body` to a short link with clicks tracked (`links` on the message, `message.link_clicked` events): on <your business>.txtkto.com once your business is verified, txtkto.com before that, or your own link domain when you have an active one (POST /link-domains). The links are checked as you wrote them; texts are counted on the shortened body. Works with scheduled_at.",
                "type": "boolean"
              },
              "status_callback": {
                "description": "Optional. Also send this message's status events (message.sent, message.delivered, message.failed, message.blocked) to this https URL, signed with your callback secret (POST /v1/webhooks/callback_secret; 400 callback_secret_required until it exists). Logged and retried like a webhook endpoint, under endpoint `status_callback`. Immediate sends only.",
                "format": "uri",
                "type": "string"
              },
              "tags": {
                "description": "Optional. Your own labels, up to 10 (letters, digits, space _ . : -; up to 32 characters each; lowercased), for example a campaign or a flow. Stored on the message, sent on its webhook events, and reported by GET /v1/deliverability?group_by=tag. Filter with GET /v1/messages?tag=.",
                "items": {
                  "maxLength": 32,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "to": {
                "description": "Recipient's number in E.164",
                "type": "string"
              }
            },
            "required": ["body", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send message"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6626ebbaa68fa87575b7f8c6c1cc8beee11541b14146b2b287cdee678ea9ba2c"
        },
        {
          "name": "send_verification",
          "title": "Send verification",
          "description": "Send a one-time verification code (OTP) to a phone number by text, or to an email address with channel \"email\". TextKit generates the code, handles expiry (10 min) and attempt limits (5), and blocks SMS-pumping and email-bombing abuse.",
          "inputSchema": {
            "properties": {
              "app_name": {
                "description": "Your product name, shown in the message",
                "maxLength": 24,
                "type": "string"
              },
              "channel": {
                "default": "sms",
                "description": "How the code goes out. `sms` needs `phone`; `email` needs `email`.",
                "enum": ["sms", "email"],
                "type": "string"
              },
              "customer_id": {
                "description": "Optional: attribute the verification to one of your customers",
                "type": "string"
              },
              "email": {
                "description": "The address to email the code to (channel `email`). Disposable addresses are refused.",
                "type": "string"
              },
              "from": {
                "description": "Optional, channel `sms` only: send from a number you own instead of the TextKit pool",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Retries are already safe: the same call with the same inputs within 10 minutes is done once and answers with the first result. Pass your own key to dedupe across a longer gap, or a new one to repeat an identical call on purpose.",
                "maxLength": 200,
                "type": "string"
              },
              "phone": {
                "description": "The number to text the code to (channel `sms`). `to` works too.",
                "type": "string"
              },
              "user_ip": {
                "description": "Optional. Your end user's IP address, as your server saw it. With it, one person requesting codes for many numbers or addresses is limited (20 an hour per IP on your account, texts and emails together); without it there is no per-IP limit, since requests come from your server.",
                "type": "string"
              }
            },
            "type": "object"
          },
