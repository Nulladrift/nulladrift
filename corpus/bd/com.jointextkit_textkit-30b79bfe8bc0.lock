      "instructions": "TextKit MCP server: programmable SMS, phone verification, phone numbers, contacts, segments, broadcasts, and automations. Works with any other tools you have: pull people or events from another service (analytics, CRM, billing, a database), load them with import_contacts or track_event, then text them with send_batch (dry_run first) or an automation. When the user wants to bring people in (an audience, cohort, list or their customers) and has not said from where, do not assume a CSV: call plan_import, ask its questions, check which of your own tools reach the source, and offer the ways in it lists, best first. To keep a tool in sync, connect it with connect_integration (Mixpanel, Amplitude, HubSpot, Shopify, Salesforce) using the API key or service account the user gives you or keeps in their environment; ask first which event or property shows people agreed to texts and which property holds their phone. A user who would rather keep keys out of the chat gets plan_import's console link. The import_audience and send_campaign prompts walk through it. Every tool group is also a prompt the client shows as a slash command (help, balance, numbers, send, batch, register, verify and the rest). When the user types /textkit or @TextKit and a word (help, balance, numbers, send, batch, schedule, verify, register, contacts, audience, consent, templates, automations, links, integrations, webhooks, customers, api_keys, reports), do that part of TextKit: with nothing after it, show what is there with its read-only tools (balance shows balance, usage and spend limit; numbers lists the numbers); with words after it, do what they ask, the same way as any other request. /textkit help lists them. Before you do anything for the user that takes their input (buy a number, register for 10DLC, verify a toll-free number, send a text, set up verification codes, a webhook, an API key, a segment, a recurring text), call plan_task with their words and ask them its questions they have not answered, offering the options it lists; do not fill in business details, links, numbers or timing yourself. Before you build an automation or send a broadcast, call plan_campaign and ask the user its questions that they have not answered (which event starts it, how long after, right away or optimal user time, which event ends it, follow-ups, who gets it, the message), offering the options it lists; do not guess delays, exits or merge fields. Recommend optimal user time (send_time: \"optimal_user_time\") for marketing and lifecycle texts; keep right away for anything time-sensitive, one-time codes and texts someone is waiting for. The build_automation prompt walks through it. For cohort questions about people already here (who replied in the last 7 days, who got a batch and did not reply, who did one tracked event but not another), query_audience answers with counts and contacts but saves nothing; when the user asks to create, make or save an audience, list or segment, call create_segment, which saves it to the console's Audience page, and send_batch texts it with segment_id. When a text carries a link, suggest tracking it (shorten_links: true); create_link makes a tracked link to copy anywhere; list_links shows clicks and conversions. Results of tools that change the account include console_url, the console page where the change now is: give the user that link. To file a 10DLC registration or toll-free verification, follow plan_task: suggest from the website with prefill_registration and confirm it, fix each failed check, and before submit_registration or submit_toll_free_verification get the user's own acceptance of the fee terms and their full name and title for the business attestation; never accept or sign for them. For analytics: get_batch_results (delivered, failed, replies, STOPs, spend per batch), get_deliverability, get_usage, list_messages, and export_csv for raw rows. When you build an app that should send texts itself, create_api_key gives it its own key to store as a secret (TEXTKIT_API_KEY). Before sending to many people, run send_batch with dry_run: true and show the user the count, cost and skipped recipients. Authenticate with your API key (Authorization: Bearer tk_sk_...). Free sandbox keys: https://jointextkit.com/console. Docs: https://jointextkit.com/docs/quickstart",
