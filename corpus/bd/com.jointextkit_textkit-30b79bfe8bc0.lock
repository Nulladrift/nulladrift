        {
          "name": "create_automation",
          "title": "Create automation",
          "description": "Create a triggered text flow (as a draft): when trigger.event is tracked, run steps such as send_sms, wait, wait_for_event, and condition branches. Example: on cart_abandoned, wait 3600s, then if checkout_completed was not received send a reminder. A send_sms step with send_time: \"optimal_user_time\" and max_wait_seconds (60 to 86400, required) waits for the hour that person usually replies or clicks, 10am their time with no history, inside quiet hours: recommend it for marketing and lifecycle texts, leave it off anything time-sensitive, and it is refused for one-time codes and order or shipping texts. For events that repeat, trigger.cooldown_seconds stops the same person starting it again for that long. Merge fields like {{plan}} fill from the trigger event's properties; `issues` names any no tracked event carries. Leave out `from` and TextKit picks a number approved for `category` (marketing, transactional for alerts, otp for codes) when it sends; `sender` shows the numbers, and `issues` says so when none is approved yet. Pass `from` only to pin a number. Drafts send nothing until activated.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "What it sends: marketing, alerts (transactional) or codes (otp). With no `from`, TextKit picks a number approved for this. Falls back to a built-in topic.",
                "enum": ["marketing", "transactional", "otp"],
                "nullable": true,
                "type": "string"
              },
              "from": {
                "description": "One of your numbers, to pin the flow to it. Leave it out and TextKit picks a number approved for `category`. A sandbox number makes it a sandbox flow.",
                "nullable": true,
                "type": "string"
              },
              "name": {
                "description": "Automation name",
                "maxLength": 80,
                "type": "string"
              },
              "steps": {
                "description": "Up to 20 steps, run in order",
                "items": {
                  "description": "One of: send_sms {body, from?, send_time?, max_wait_seconds?}; wait {seconds}; wait_for_event {event, timeout_seconds, on_received, on_timeout}; condition {check, on_met, on_not_met}; end. Branches are \"continue\", \"end\", or \"goto:<id of a later step>\".",
                  "properties": {
                    "body": {
                      "description": "send_sms. Merge fields: event properties by name, {{first_name}}, {{name}}, {{phone}}, {{field:<custom>}}.",
                      "maxLength": 1600,
                      "type": "string"
                    },
                    "check": {
                      "description": "{kind: event_received, event} | {kind: property, property, op, value?} | {kind: contact_field, field, op, value?}. op: eq, neq, contains, gt, lt, exists, not_exists.",
                      "type": "object"
                    },
                    "event": {
                      "description": "wait_for_event: the event to wait for",
                      "type": "string"
                    },
                    "from": {
                      "description": "send_sms: overrides the flow sender.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Stable handle for goto branches; assigned when omitted.",
                      "type": "string"
                    },
                    "max_wait_seconds": {
                      "description": "send_sms with optimal_user_time, required: the longest this text may wait for that hour",
                      "maximum": 86400,
                      "minimum": 60,
                      "type": "integer"
                    },
                    "on_met": {
                      "description": "condition: where to go when the check passes: continue, end, or goto:<step id>",
                      "type": "string"
                    },
                    "on_not_met": {
                      "description": "condition: where to go when the check fails: continue, end, or goto:<step id>",
                      "type": "string"
                    },
                    "on_received": {
                      "description": "wait_for_event: where to go when the event arrives: continue, end, or goto:<step id>",
                      "type": "string"
                    },
                    "on_timeout": {
                      "description": "wait_for_event: where to go when time runs out: continue, end, or goto:<step id>",
                      "type": "string"
                    },
                    "seconds": {
                      "description": "wait: how long, from 60 seconds to 30 days",
                      "maximum": 2592000,
                      "minimum": 60,
                      "type": "integer"
                    },
                    "send_time": {
                      "description": "send_sms: `optimal_user_time` waits for the hour this person usually replies or clicks, inside quiet hours. Default: right_away. Refused for one-time codes and order or shipping texts.",
                      "enum": ["right_away", "optimal_user_time"],
                      "type": "string"
                    },
                    "timeout_seconds": {
                      "description": "wait_for_event: how long to wait, from 60 seconds to 30 days",
                      "maximum": 2592000,
                      "minimum": 60,
                      "type": "integer"
                    },
                    "type": {
                      "description": "What the step does",
                      "enum": ["send_sms", "wait", "wait_for_event", "condition", "end"],
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "topic_id": {
                "description": "Skip recipients unsubscribed from this topic.",
                "nullable": true,
                "type": "string"
              },
              "trigger": {
                "description": "What starts a run: an event, with optional filters",
                "properties": {
                  "cooldown_seconds": {
                    "description": "Optional. After a run starts for a person, they do not start another for this long (for events that repeat, like a paywall view).",
                    "maximum": 7776000,
                    "minimum": 60,
                    "type": "integer"
                  },
                  "event": {
                    "description": "The tracked event that starts a run",
                    "type": "string"
                  },
                  "filters": {
                    "description": "Up to 5 checks on the event's properties. All must hold",
                    "items": {
                      "properties": {
                        "op": {
                          "description": "eq, neq, contains, gt, lt, exists or not_exists",
                          "type": "string"
                        },
                        "property": {
                          "description": "The event property to check",
                          "type": "string"
                        },
                        "value": {
                          "description": "The value to compare with. Not used by exists or not_exists"
                        }
                      },
                      "type": "object"
                    },
                    "maxItems": 5,
                    "type": "array"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
