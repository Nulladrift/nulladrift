        {
          "name": "update_segment",
          "title": "Update segment",
          "description": "Rename a segment or replace its rules.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "What the segment is for",
                "maxLength": 200,
                "nullable": true,
                "type": "string"
              },
              "id": {
                "description": "Segment id",
                "type": "string"
              },
              "match": {
                "default": "all",
                "description": "all: a contact must match every rule. any: at least one rule",
                "enum": ["all", "any"],
                "type": "string"
              },
              "name": {
                "description": "Segment name",
                "maxLength": 80,
                "type": "string"
              },
              "rules": {
                "description": "Up to 10 rules that decide who matches",
                "items": {
                  "properties": {
                    "field": {
                      "description": "Attributes: tag, the name and profile fields, source, field (a custom field), import, status (opt-out), topic, list (in a static list), created_at. Behaviour: last_message_at (last text either way), last_reply_at (last text from them), batch (what happened to them in one batch), event (a tracked event; the newest 20,000 events are searched).",
                      "enum": ["tag", "first_name", "last_name", "name", "email", "company", "state", "source", "field", "import", "status", "topic", "created_at", "last_message_at", "last_reply_at", "batch", "event", "list"],
                      "type": "string"
                    },
                    "key": {
                      "description": "The custom field name (field), topic id (topic), batch id (batch), or event name (event)",
                      "type": "string"
                    },
                    "op": {
                      "description": "Text fields take is / is_not / contains / not_contains / exists / not_exists; tag takes is / is_not / exists / not_exists; status, topic, import, batch and list take is / is_not; created_at takes before / after; last_message_at, last_reply_at and event take after (at or after the time), before (it happened, and the last time was before it), exists (ever) and not_exists (never). Comparisons ignore case.",
                      "enum": ["is", "is_not", "contains", "not_contains", "exists", "not_exists", "before", "after"],
                      "type": "string"
                    },
                    "value": {
                      "description": "status: subscribed or opted_out. topic: subscribed or unsubscribed. import: an import id. list: a list id (lst_...). batch: included, sent, failed, skipped or replied (sent, then texted the batch's number after it was created). Times (created_at, last_message_at, last_reply_at, event): an ISO date, or a window back from now such as 7d or 24h, read each time the segment is used.",
                      "type": "string"
                    }
                  },
                  "required": ["field"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
