        {
          "name": "connect_integration",
          "title": "Connect integration",
          "description": "Connect a tool so its people sync in as contacts, in a list of their own, every 6 hours: Mixpanel (projectId, username, secret = a service account; sourceId = cohort id), Amplitude (apiKey, secretKey, sourceId), HubSpot (accessToken), Shopify (shopDomain, accessToken), Salesforce, or a webhook. Takes the event or property that shows people agreed to texts (consentEvent / consentField) and the property that holds their phone (phoneField). Credentials are proved with one read, sealed, and never returned. Mixpanel also takes eventTriggers, which turn Mixpanel events into TextKit events that start, end or branch automations; `warnings` names mapped events with no volume in 7 days.",
          "inputSchema": {
            "properties": {
              "accessToken": {
                "description": "HubSpot private app token, or Shopify Admin API access token.",
                "type": "string"
              },
              "apiKey": {
                "description": "Amplitude API key.",
                "type": "string"
              },
              "clientId": {
                "description": "Salesforce consumer key, or Shopify client id.",
                "type": "string"
              },
              "clientSecret": {
                "description": "Salesforce consumer secret, or Shopify client secret.",
                "type": "string"
              },
              "consentEvent": {
                "description": "Mixpanel / Amplitude: the opt-in event the cohort is built on (e.g. SMS Opt In). Everyone in the cohort is recorded as opted in, from that event.",
                "type": "string"
              },
              "consentField": {
                "description": "The tool's property that records SMS consent (e.g. sms_opt_in).",
                "type": "string"
              },
              "eventTriggers": {
                "description": "Mixpanel (with a service account): events to turn into TextKit events within about 10 minutes, so automations start, wait and branch on them. Each entry is a TextKit event name and the Mixpanel events that count as it, like { event: \"purchase_completed\", mixpanel_events: [\"Purchase Completed\", \"Web Trial Successful\"] }. Only events from people in the integration's list become events, matched by their Mixpanel id. [] clears them. The answer's `warnings` names mapped events that fired 0 times in the last 7 days.",
                "items": {
                  "properties": {
                    "event": {
                      "description": "The TextKit event to record",
                      "type": "string"
                    },
                    "mixpanel_events": {
                      "description": "The Mixpanel events that map to it, up to 10",
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "exportEvents": {
                "description": "Mixpanel (with a service account): send each text's events onto the person's Mixpanel profile: TextKit Message Sent, Delivered, Failed, Link Clicked, Reply Received and Opted Out, with the message, batch or automation and step ids and names. The person is matched by the batch recipient's external_id, the user id or mixpanel_distinct_id of the event that started the automation, or the contact Mixpanel supplied. On unless false. Needs a service account Mixpanel lets import (Admin or Owner on the project).",
                "type": "boolean"
              },
              "instanceUrl": {
                "description": "Salesforce My Domain URL.",
                "type": "string"
              },
              "mode": {
                "description": "Mixpanel / Amplitude: pull with credentials every 6 hours (default when credentials are sent), or push: no credentials, the tool's cohort sync posts to the ingest URL.",
                "enum": ["pull", "push"],
                "type": "string"
              },
              "name": {
                "description": "What to call it (default: the tool and its source).",
                "type": "string"
              },
              "phoneEvent": {
                "description": "Mixpanel: an event that carries the number when profiles do not (e.g. Verification Check Success). A member with no phone on the profile gets it from their latest such event.",
                "type": "string"
              },
              "phoneEventProperty": {
                "description": "Mixpanel: that event's property holding the number (default phone).",
                "type": "string"
              },
              "phoneField": {
                "description": "The tool's property holding the mobile number, when not the usual one ($phone, phone, mobilephone).",
                "type": "string"
              },
              "projectId": {
                "description": "Mixpanel project id.",
                "type": "string"
              },
              "provider": {
                "description": "The tool to connect",
                "enum": ["shopify", "hubspot", "salesforce", "mixpanel", "amplitude", "webhook"],
                "type": "string"
              },
              "region": {
                "description": "Mixpanel / Amplitude data residency.",
                "enum": ["us", "eu"],
                "type": "string"
              },
              "secret": {
