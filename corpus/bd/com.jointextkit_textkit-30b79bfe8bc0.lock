        {
          "name": "update_integration",
          "title": "Update integration",
          "description": "Rename, pause or resume (status), or change an integration's settings or credentials (left-out credentials keep the stored ones). eventTriggers (Mixpanel) maps Mixpanel events to TextKit events; exportEvents: false stops sending text events to Mixpanel (on by default); changing only those does not re-test credentials or resync.",
          "inputSchema": {
            "properties": {
              "accessToken": {
                "description": "HubSpot private app token, or Shopify Admin API access token",
                "type": "string"
              },
              "apiKey": {
                "description": "Amplitude API key",
                "type": "string"
              },
              "consentEvent": {
                "description": "Mixpanel / Amplitude: the opt-in event the cohort is built on",
                "type": "string"
              },
              "consentField": {
                "description": "The tool's property that records SMS consent",
                "type": "string"
              },
              "eventTriggers": {
                "description": "Mixpanel (with a service account): events to turn into TextKit events within about 10 minutes, so automations start, wait and branch on them. Each entry is a TextKit event name and the Mixpanel events that count as it, like { event: \"purchase_completed\", mixpanel_events: [\"Purchase Completed\", \"Web Trial Successful\"] }. Only events from people in the integration's list become events, matched by their Mixpanel id. [] clears them. Changing only these keeps the credentials and the sync schedule as they are (no re-test, no resync). The answer's `warnings` names mapped events that fired 0 times in the last 7 days.",
                "items": {
                  "properties": {
                    "event": {
                      "description": "The TextKit event to record",
                      "type": "string"
                    },
                    "mixpanel_events": {
                      "description": "The Mixpanel events that map to it, up to 10",
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "exportEvents": {
                "description": "Mixpanel (with a service account): send each text's events onto the person's Mixpanel profile: TextKit Message Sent, Delivered, Failed, Link Clicked, Reply Received and Opted Out, with the message, batch or automation and step ids and names. The person is matched by the batch recipient's external_id, the user id or mixpanel_distinct_id of the event that started the automation, or the contact Mixpanel supplied. On unless false. Needs a service account Mixpanel lets import (Admin or Owner on the project).",
                "type": "boolean"
              },
              "id": {
                "description": "Integration id",
                "type": "string"
              },
              "name": {
                "description": "What to call it",
                "type": "string"
              },
              "phoneEvent": {
                "description": "Mixpanel: an event that carries the number when profiles do not",
                "type": "string"
              },
              "phoneEventProperty": {
                "description": "Mixpanel: that event's property holding the number (default phone)",
                "type": "string"
              },
              "phoneField": {
                "description": "The tool's property holding the mobile number",
                "type": "string"
              },
              "secret": {
                "description": "Mixpanel service account secret",
                "type": "string"
              },
              "secretKey": {
                "description": "Amplitude secret key",
                "type": "string"
              },
              "sourceId": {
                "description": "Mixpanel or Amplitude cohort id; HubSpot list id; Salesforce campaign id; a Shopify customer search",
                "type": "string"
              },
              "status": {
                "description": "active, or paused to stop syncing",
                "enum": ["active", "paused"],
                "type": "string"
              },
              "username": {
                "description": "Mixpanel service account username",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
