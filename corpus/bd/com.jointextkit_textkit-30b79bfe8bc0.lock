        {
          "name": "create_registration",
          "title": "Create registration",
          "description": "Create a 10DLC registration (the carrier registration local numbers need to text the public) and check it: the website, privacy policy, terms, opt-in page and example texts against carrier rules. Returns ready or checks_failed, with each finding, its fix and copy to paste. Nothing goes to the carriers and nothing is billed. Business details come from the person, not from guesses.",
          "inputSchema": {
            "properties": {
              "age_gated": {
                "description": "Your messages are for adults only (alcohol, cannabis, gambling).",
                "type": "boolean"
              },
              "brand": {
                "description": "The business as the carriers register it. street must be a street address, not a P.O. box; state a 2-letter US state or territory code; postal_code a 5-digit ZIP (optionally +4). Anything else is refused with 400 naming the field.",
                "properties": {
                  "city": {
                    "description": "City.",
                    "type": "string"
                  },
                  "contact_email": {
                    "description": "The representative's own email at the business's domain. A free mailbox (gmail.com, outlook.com, ...) or a shared inbox (info@, sales@, support@, ...) is refused with 400 (param brand.contact_email). Carriers verify the business by writing to it.",
                    "type": "string"
                  },
                  "contact_name": {
                    "description": "The authorized representative: a person who works for the business and can act for it. Required to submit. Kept with the registration for business verification; not sent to the registry.",
                    "type": "string"
                  },
                  "contact_phone": {
                    "description": "A 10-digit US number the representative answers. Required to submit: the carrier registry refuses a brand without one.",
                    "type": "string"
                  },
                  "contact_title": {
                    "description": "The representative's job title, like Owner or Operations Manager. Required to submit.",
                    "type": "string"
                  },
                  "country": {
                    "description": "US only.",
                    "type": "string"
                  },
                  "ein": {
                    "description": "The EIN, matching the legal name. Not sent for SOLE_PROPRIETOR.",
                    "type": "string"
                  },
                  "entity_type": {
                    "description": "SOLE_PROPRIETOR needs no EIN, legal name or title: send contact_name, contact_email and contact_phone (their mobile). One number on the registration, and after submitting they enter the code texted to that mobile.",
                    "enum": ["PRIVATE_PROFIT", "PUBLIC_PROFIT", "NON_PROFIT", "GOVERNMENT", "SOLE_PROPRIETOR"],
                    "type": "string"
                  },
                  "legal_name": {
                    "description": "The legal name exactly as on the IRS EIN letter. Not needed for SOLE_PROPRIETOR.",
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "5-digit ZIP, optionally ZIP+4.",
                    "type": "string"
                  },
                  "state": {
                    "description": "2-letter US state or territory code.",
                    "type": "string"
                  },
                  "stock_exchange": {
                    "description": "PUBLIC_PROFIT only, and then required to submit: the exchange the stock trades on.",
                    "enum": ["NASDAQ", "NYSE", "AMEX", "TSX", "LON", "AMX", "ASX", "B3", "BME", "BSE", "BZX", "FRA", "ICEX", "JPX", "JSE", "KRX", "NSE", "NNQS", "OMX", "SEHK", "SGX", "SSE", "STO", "SWX", "SZSE", "TWSE", "VSE", "XPAR", "XAMS", "XMIL", "XCSE", "XBRU", "XMAD", "XOSL", "XWAR", "XETR", "XSTU", "XBER", "XMUN", "XHAM", "XHAN", "XDUS", "XEUR", "OTHER"],
                    "type": "string"
                  },
                  "stock_symbol": {
                    "description": "PUBLIC_PROFIT only, and then required to submit: the stock ticker, like ACME or BRK.B (up to 10 letters, digits, dots or dashes).",
                    "type": "string"
                  },
                  "street": {
                    "description": "Street address, not a P.O. box.",
                    "type": "string"
                  },
                  "vertical": {
                    "description": "The industry the business is in, like REAL_ESTATE, HEALTHCARE or RETAIL.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "business_name": {
                "description": "The name customers know the business by, as the texts will name it.",
                "maxLength": 120,
                "type": "string"
              },
              "description": {
                "description": "What you send and to whom (40 to 500 characters). Omit or null to file the generated one.",
                "maxLength": 500,
                "nullable": true,
                "type": "string"
              },
              "direct_lending": {
                "description": "Your messages are about loans you make yourself.",
                "type": "boolean"
              },
              "help_reply": {
                "description": "Your wording of the HELP reply. It must name your business, give a way to reach you (email, phone or web page) and keep the STOP instruction. Omit or null for the standard wording.",
                "maxLength": 320,
                "minLength": 20,
                "nullable": true,
                "type": "string"
              },
              "includes_links": {
                "description": "Your messages include web links. Also true whenever an example contains one.",
                "type": "boolean"
              },
              "includes_phone_numbers": {
                "description": "Your messages include phone numbers. Also true whenever an example contains one.",
                "type": "boolean"
              },
              "opt_in_flow": {
                "description": "How people opt in, in your own words. It leads the filed opt-in account; the opt-in page, the disclosure and the START keyword are added after it. Omit or null to file the standard sentence.",
                "maxLength": 500,
                "minLength": 40,
                "nullable": true,
                "type": "string"
              },
              "opt_in_screenshot_url": {
                "description": "People opt in inside an app: a public link to an image of that screen. Checked in place of a phone field and filed with the opt-in. null clears it.",
                "format": "uri",
                "nullable": true,
                "type": "string"
              },
              "opt_in_url": {
                "description": "Page where people enter their number",
                "format": "uri",
                "type": "string"
              },
              "privacy_url": {
                "description": "Discovered from homepage links when omitted",
                "format": "uri",
                "type": "string"
              },
              "sample_messages": {
                "description": "Real examples of the texts you will send, as a recipient would get them (no template variables). Carriers compare them with your traffic. Each must name your business; marketing and mixed use cases need opt-out wording in at least one. More than 5, or one over 320 characters, is a 400; too few or too short comes back as findings. Omit to get starter drafts; null or [] goes back to them.",
                "items": {
                  "maxLength": 320,
                  "minLength": 20,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "nullable": true,
                "type": "array"
              },
              "samples_confirmed": {
                "description": "true = the starter drafts are right as they are; they become your examples. Ignored when sample_messages is sent.",
                "type": "boolean"
              },
              "starter_messages": {
                "description": "Draft examples suggested for this business (fields.sample_messages from POST /registrations/prefill). Shown instead of the template starter drafts; samples_source stays starter and they are never filed until you edit or confirm them. Drafts that would not pass the example check for the business name and use case are ignored.",
                "items": {
                  "maxLength": 320,
                  "type": "string"
                },
                "maxItems": 5,
                "nullable": true,
                "type": "array"
              },
              "stop_reply": {
                "description": "Your wording of the confirmation sent when someone opts out. It must name your business, say they are unsubscribed, and carry no link; anything else is a 400 naming what is missing. Omit or null for the standard wording in your business name. Filed with the registration and sent by its numbers.",
                "maxLength": 320,
                "minLength": 20,
                "nullable": true,
                "type": "string"
              },
              "support_email": {
                "description": "Used in the generated HELP reply",
                "format": "email",
                "type": "string"
              },
              "terms_url": {
                "description": "Discovered from homepage links when omitted",
                "format": "uri",
                "type": "string"
              },
              "use_case": {
                "description": "What the texts are for. marketing and mixed need an opt-in for each person.",
                "enum": ["2fa", "account_notification", "customer_care", "delivery_notification", "fraud_alert", "higher_education", "marketing", "mixed", "polling_voting", "public_service_announcement", "security_alert", "low_volume"],
                "type": "string"
              },
              "website": {
                "description": "The business's own website. Reviewers visit it to confirm the business is real.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["business_name", "use_case", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create registration"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff61160d90265fe506b2fd27519f4d9c394f9e458e7158338a0e942b5401059e"
        },
        {
          "name": "create_schedule",
          "title": "Create schedule",
          "description": "Send the same text to one number every day, week or month at a local time (e.g. a weekly reminder). Every occurrence runs the usual send checks.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "The text sent each time",
                "maxLength": 1600,
                "type": "string"
              },
              "category": {
                "description": "Optional. It can make each occurrence stricter (`marketing`), never looser: the sending number's registration and the wording decide ([which messages are marketing](/docs/compliance-checks#which-messages-are-marketing)).",
                "enum": ["marketing", "transactional", "otp"],
                "nullable": true,
                "type": "string"
              },
              "end_date": {
                "description": "Last local date it may run (inclusive).",
                "format": "date",
                "nullable": true,
                "type": "string"
              },
              "from": {
                "description": "One of your numbers. Optional when the account has exactly one number for the key's mode.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Retries are already safe: the same call with the same inputs within 10 minutes is done once and answers with the first result. Pass your own key to dedupe across a longer gap, or a new one to repeat an identical call on purpose.",
                "maxLength": 200,
                "type": "string"
              },
              "max_occurrences": {
                "description": "The schedule completes after this many messages have been sent.",
                "minimum": 1,
                "nullable": true,
                "type": "integer"
              },
              "quiet_hours": {
                "description": "Optional. What to do with a message in the recipient's quiet hours: `block` refuses it (403 quiet_hours), `defer` holds it until their next 9:00am. Omitted: an occurrence in quiet hours is held until the recipient's 8:00am and recorded as `deferred`.",
                "enum": ["block", "defer"],
                "nullable": true,
                "type": "string"
              },
              "repeat": {
                "description": "When it sends: how often, the local time and the time zone",
                "properties": {
                  "day_of_month": {
                    "description": "Monthly only, required. Months without that day run on their last day.",
                    "maximum": 31,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "days_of_week": {
                    "description": "Weekly only, required: which weekdays.",
                    "items": {
                      "enum": ["sun", "mon", "tue", "wed", "thu", "fri", "sat"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "frequency": {
                    "description": "How often it sends",
                    "enum": ["daily", "weekly", "monthly"],
                    "type": "string"
                  },
                  "time": {
                    "description": "24-hour wall-clock time, HH:MM, in `timezone`.",
                    "type": "string"
                  },
                  "timezone": {
                    "description": "IANA time zone.",
                    "type": "string"
                  }
                },
                "required": ["frequency", "time", "timezone"],
                "type": "object"
              },
              "start_date": {
                "description": "First local date it may run. Defaults to today.",
                "format": "date",
                "nullable": true,
                "type": "string"
              },
              "to": {
                "description": "Recipient's number in E.164",
                "type": "string"
              }
            },
            "required": ["body", "repeat", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create schedule"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
