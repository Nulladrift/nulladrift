                    "enum": ["NASDAQ", "NYSE", "AMEX", "TSX", "LON", "AMX", "ASX", "B3", "BME", "BSE", "BZX", "FRA", "ICEX", "JPX", "JSE", "KRX", "NSE", "NNQS", "OMX", "SEHK", "SGX", "SSE", "STO", "SWX", "SZSE", "TWSE", "VSE", "XPAR", "XAMS", "XMIL", "XCSE", "XBRU", "XMAD", "XOSL", "XWAR", "XETR", "XSTU", "XBER", "XMUN", "XHAM", "XHAN", "XDUS", "XEUR", "OTHER"],
