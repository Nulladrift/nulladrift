              },
              "previous_service": {
                "description": "Where this traffic ran before.",
                "enum": ["new", "short_code", "long_number"],
                "type": "string"
              },
              "privacy_url": {
                "description": "The privacy policy page.",
                "format": "uri",
                "type": "string"
              },
              "sample_messages": {
                "description": "At least two example messages.",
                "items": {
                  "maxLength": 640,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "state": {
                "description": "State or province code.",
                "type": "string"
              },
              "stop_reply": {
                "description": "The reply to STOP: names the business and says they are unsubscribed. Omit to keep ours.",
                "type": "string"
              },
              "street": {
                "description": "Street address of the business.",
                "type": "string"
              },
              "terms_url": {
                "description": "The terms page, with the SMS program terms.",
                "format": "uri",
                "type": "string"
              },
              "urls_in_messages": {
                "description": "Links your messages include, or \"None\".",
                "type": "string"
              },
              "use_case": {
                "description": "What the texts are for.",
                "enum": ["2fa", "account_notification", "customer_care", "delivery_notification", "fraud_alert", "higher_education", "marketing", "mixed", "polling_voting", "public_service_announcement", "security_alert", "low_volume"],
                "type": "string"
              },
              "use_case_summary": {
                "description": "What the program sends, to whom and why. At least 40 characters.",
                "maxLength": 1500,
