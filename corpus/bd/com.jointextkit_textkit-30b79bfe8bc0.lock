              },
              "id": {
                "description": "Registration id (reg_...)",
                "type": "string"
              },
              "includes_links": {
                "description": "Your messages include web links. Also true whenever an example contains one.",
                "type": "boolean"
              },
              "includes_phone_numbers": {
                "description": "Your messages include phone numbers. Also true whenever an example contains one.",
                "type": "boolean"
              },
              "opt_in_flow": {
                "description": "How people opt in, in your own words. It leads the filed opt-in account; the opt-in page, the disclosure and the START keyword are added after it. Omit or null to file the standard sentence.",
                "maxLength": 500,
                "minLength": 40,
