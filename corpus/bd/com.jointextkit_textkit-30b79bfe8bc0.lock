              },
              "volume_basis": {
                "description": "existing: what it sends today. projecting: an estimate.",
                "enum": ["existing", "projecting"],
                "type": "string"
              },
              "website": {
                "description": "The business's website.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["id"],
