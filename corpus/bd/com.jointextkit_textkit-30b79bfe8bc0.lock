                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "opt_in_description": {
                "description": "How people opt in, step by step. At least 40 characters.",
                "maxLength": 2000,
                "type": "string"
              },
              "opt_in_screenshot_url": {
                "description": "A public image of the step where people enter their number and agree. Needed when the opt-in page itself has no phone field, like a later step of a form or an app.",
                "format": "uri",
                "type": "string"
              },
              "opt_in_url": {
                "description": "The opt-in page. With none of your own we make you a hosted one.",
                "format": "uri",
                "type": "string"
              },
              "phones_in_messages": {
                "description": "Phone numbers your messages include, or \"None\".",
                "type": "string"
              },
              "postal_code": {
                "description": "ZIP or postal code.",
                "type": "string"
              },
              "previous_content": {
