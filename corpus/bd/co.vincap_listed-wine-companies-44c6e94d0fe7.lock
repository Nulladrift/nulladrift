        },
        {
          "name": "get_wine_stock_index",
          "title": "VINCAP Wine Stock Index",
          "description": "The VINCAP Wine Stock Index (BCWINE): live level, published close, constituents with symbol, country, exchange and weight. Prices are delayed. Example: {}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
