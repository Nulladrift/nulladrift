        "type": "http",
        "url": "https://vincap.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "vincap",
        "title": "VINCAP — listed wine companies",
        "version": "0.3.0",
        "description": "The VINCAP Wine Stock Index, the results, investor calendar and estates of listed wine companies, each row with its source. Editorial research and market data, not investment advice.",
        "websiteUrl": "https://vincap.co"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "VINCAP keeps the record of publicly traded wine companies: the VINCAP Wine Stock Index (code BCWINE), each company's reported results with the filing they were read from, the investor calendar (results dates, AGMs, dividends and statutory windows) and the estates the companies own.\n\nStart with `get_wine_stock_index` for the constituents and their symbols, then `get_wine_company` for one company. `rank_wine_companies` ranks every listed wine company VINCAP tracks on weights the caller sets (revenue growth, net margin, 1-year share price, wine share of revenue, distance from the 52-week high). `benchmark_winery` sets one private winery's figures against the same listed companies and the private deals on record — the VinCap Benchmark page's own computation. `get_investor_calendar` and `get_estates` answer a free summary; the full record sits behind the x402 route named in the answer's `paid` block.\n\nEvery answer carries `as_of`, `license` and `disclaimer`. A calendar row with `date_status: \"window\"` is a statutory window, not a date: never present it as one.\n\nEditorial research and market data, not investment advice. Nothing here is a recommendation to buy or sell.",
      "tools": [
        {
          "name": "benchmark_winery",
          "title": "VinCap Benchmark — what's my winery worth?",
          "description": "One private winery's figures against the listed wine companies VINCAP tracks: growth, net margin and size percentiles, and the value range listed price/sales and price/earnings multiples and recorded private-deal EBITDA multiples imply — the same computation as https://vincap.co/benchmark. revenue, profit, ebitda, land_value and inventory are in `currency` (USD or EUR); growth is %. Inputs are used for this answer only and never stored. A range from recorded multiples, not an appraisal. Example: {\"revenue\":5000000,\"profit\":400000,\"currency\":\"EUR\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "the winery's country (as the page lists them)",
                "maxLength": 40,
                "type": "string"
              },
              "currency": {
                "description": "USD (default) or EUR",
                "enum": ["USD", "EUR"],
                "type": "string"
              },
              "ebitda": {
                "$ref": "#/properties/revenue",
                "description": "last full-year EBITDA (may be negative)"
              },
              "growth": {
                "$ref": "#/properties/revenue",
                "description": "revenue growth on the year before, %"
              },
              "hectares": {
                "$ref": "#/properties/revenue",
                "description": "vineyard hectares"
              },
              "inventory": {
                "$ref": "#/properties/revenue",
                "description": "wine in stock at cost, in `currency`"
              },
              "land_value": {
                "$ref": "#/properties/revenue",
                "description": "your own estimate of the land's value, in `currency`"
              },
              "profit": {
                "$ref": "#/properties/revenue",
                "description": "last full-year net profit (may be negative)"
              },
              "revenue": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 30,
                    "type": "string"
                  }
                ],
                "description": "last full-year revenue, in `currency`"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2f86b9719aa422bba4d46f1a0d848c11514fd1ad3849733d3d594b5ab0bc954a"
        },
        {
          "name": "get_estates",
          "title": "Estates owned by listed wine companies",
          "description": "Which estates, wineries and vineyards a listed wine company owns. Free: the count and names. The full monthly record with history and source probes: the paid x402 route in `paid`. Example: {\"symbol\":\"TWE.AX\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "The company's symbol, e.g. TWE.AX (get_wine_stock_index lists them)",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2ba5367f5b52e7366782b5dd1b32d11e0fa9330ec9a6a6f360fba2253d824be7"
        },
        {
          "name": "get_investor_calendar",
          "title": "Wine stocks investor calendar",
          "description": "The next results dates, AGMs and dividends of listed wine companies, from issuer and exchange sources. Free: the next 5 rows. The full calendar with recorded outcomes: the paid x402 route in `paid`. Example: {\"symbol\":\"TWE.AX\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "The company's symbol, e.g. TWE.AX (get_wine_stock_index lists them)",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
