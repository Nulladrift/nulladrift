          },
          "digest": "sha256:a840c2a1347964e20625e4705b24a60be59ce263ac88151c5f4d3b9f1bd6595e"
        },
        {
          "name": "get_wine_company",
          "title": "Listed wine company",
          "description": "One listed wine company by symbol: latest reported result lines (revenue, operating and net result) with the source URL and locator they were read from, and its next investor event. Example: {\"symbol\":\"TWE.AX\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "The company's symbol, e.g. TWE.AX (get_wine_stock_index lists them)",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
