{
  "lockfileVersion": 2,
  "subjects": {
    "com.ampdat/control": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://control.ampdat.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.ampdat/control",
        "title": "Ampdat Control",
        "version": "1.1.2",
        "description": "Who controls a DeFi contract and what is about to change: a title search, not a rating.",
        "websiteUrl": "https://control.ampdat.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ampdat Control answers who controls a DeFi contract and what is about to change, from Ethereum mainnet, deterministically. Use it before a user deposits into a covered contract and while they hold (today: Morpho vaults, Compound v3's markets and governance, many of the Safes that hold their roles, and six stablecoins). Inputs are addresses: resolve a name with search_covered_contracts, then call get_control_state. Report the facts (who holds each role and what that holder is, the notice each change gives, what is queued and who can revoke it) with the block they are as of. It is a title search, not a rating: do not turn the answer into a safety score or a recommendation. A notice of 'at least' is a lower bound, and one that is not known must never be reported as no notice. Nothing pending means none in what is read: other contracts' queues and off-chain signatures are not. How answers are made: code for Morpho's vault versions, Compound's markets and nearly all the Safes was matched to recompiled source (new vaults are accepted by factory); stablecoins and Compound's proxies and governance are pinned by code hash, not recompiled. State comes from on-chain events and reads, compared with getters at each refresh for key Compound and stablecoin values, at audits for vaults and Safes. Main permissions and timelocks were fork-tested on Compound v3 and samples of Morpho vaults, not on stablecoins or Safes. Method, limits and how to check it yourself: https://github.com/ampdat/control#how-its-made. get_control_evidence and get_change_records are paid per call over x402; without a payment they return the price and the HTTP URL that sells the same answer, and charge nothing. get_control_evidence also gives the transaction and log behind each pending change.",
      "tools": [
        {
          "name": "get_change_records",
          "title": "Change history and feed (paid)",
          "description": "Past and recent changes as records, for monitoring a position or auditing a contract's history: the change history as record/v1 records, oldest first: what changed, from what to what, who acted, who may execute or revoke it, when it takes effect, and the transaction and log each rests on. With `address`, one contract's history; without, the feed across every covered contract (filter with `since`, a block number). Paged: pass the previous result's next_cursor. Paid per call over x402; a call without a payment returns the price and where to buy, and charges nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Optional: only this contract's records.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "cursor": {
                "pattern": "^[0-9]+-[0-9]+-[0-9]+$",
                "type": "string"
              },
              "family": {
                "description": "Feed only: a family id from get_coverage, e.g. metamorpho-v1.1.",
                "type": "string"
              },
              "kind": {
                "enum": ["change", "action", "bundle"]
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "observed_status": {
                "description": "A record's status as first observed; a record never changes, so what is pending now is get_control_state's `pending`.",
                "enum": ["effective", "pending", "revoked", "expired", "failed", "proposed"]
              },
              "since": {
                "description": "First Ethereum block to include (default 0).",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Change history and feed (paid)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b8fd72ac98f9e2ad8515f5da01029a4c0957f0a6c874eded617169954bfe85f7"
        },
        {
          "name": "get_control_evidence",
          "title": "The evidence-backed control answer (paid)",
          "description": "The machine-readable, evidence-backed answer for one covered contract (the subject/v1 envelope): the full control graph (each Safe's signers, threshold, modules and guard, EIP-7702 delegates, and what is still unresolved), the complete state (every market, cap and queue), every pending change as a record with the transaction and log it rests on, the 20 most recent changes, and the value at stake. Use it when the user needs to verify or audit, not just read: the whole chain behind a role holder in one answer, what a pending change rests on, or the exact caps. Paid per call over x402; a call without a payment returns the price and where to buy, and charges nothing. get_control_state is the free summary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The contract's address on Ethereum mainnet (0x and 40 hex digits), e.g. a Morpho vault's, a Compound v3 market's, a Safe's or a stablecoin's. Not a name: use search_covered_contracts to find an address.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "sections": {
                "description": "Optional: only these parts of the envelope (default all). The whole answer can exceed 50 KB.",
                "items": {
                  "enum": ["state", "control", "records"]
                },
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "The evidence-backed control answer (paid)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ba350ac2ee7ebd5a987916662464fc70d3273fac20762586a0827aff445d01fb"
        },
        {
          "name": "get_control_state",
          "title": "Who controls this contract, and what is pending",
          "description": "Who controls a covered contract right now: who holds each role and what that holder is (a single key, a Safe and its threshold, a DAO, a known contract); what each role can change and how much notice (timelock) each change gives; and the changes queued in the contracts it reads, when each can take effect and who can revoke it. A notice that is not known (notice_s null) does not mean there is none. For a Morpho vault, before a deposit or while holding: the owner, curator, guardian or sentinels, and allocators. For a Compound v3 market: its governance and the Timelock every change waits in, what is queued or under vote and who can cancel it, and who can pause the market. For a stablecoin: who can mint, burn, pause, freeze, upgrade the contract or appoint those roles. For a Safe: its signers' threshold, modules and guards, and the vault roles it holds (holds_roles_on); a Safe changes in one transaction, so nothing in it is pending. Deterministic facts from the chain at a stated block; a title search, not a rating, so it returns no safety score. An address that is not covered returns covered: false.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The contract's address on Ethereum mainnet (0x and 40 hex digits), e.g. a Morpho vault's, a Compound v3 market's, a Safe's or a stablecoin's. Not a name: use search_covered_contracts to find an address.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Who controls this contract, and what is pending"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dce234c4519f66437bae8b8815b0f5d794bfaaf5a63a94ff81bfd86766853feb"
        },
        {
          "name": "get_coverage",
          "title": "What Ampdat Control covers",
          "description": "What this server can answer about: which contract families on which chain (today, on Ethereum mainnet: every Morpho vault, MetaMorpho v1.0 and v1.1 and Morpho Vaults V2; Compound v3's six lending markets and the governance they share; many of the Safes that hold roles on those contracts; and the contracts of six stablecoins, USDC, USDT, USDS, DAI, PYUSD and USD1), how many contracts, and the block the data is at. Call it once to learn the scope, or with `address` to check whether one address is covered before relying on an answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Optional: check this address.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What Ampdat Control covers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7eb012f43dbfb6cd54e03a6fc3446447187643e47887073454e807d2db282a50"
        },
        {
          "name": "search_covered_contracts",
          "title": "Find a covered contract by name",
          "description": "Find a covered contract's address from words the user gave: its name (e.g. 'Steakhouse USDC'), its asset symbol (e.g. 'WETH') or part of its address. Returns up to `limit` matches with address, name, asset and family. Use it when the user names a vault, a lending market (e.g. 'Compound USDC') or a coin instead of giving an address, then call get_control_state with the address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that must all appear in the contract's name, asset symbol, family or address. Case does not matter.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a covered contract by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:998337ec0b0c2c8d50c244080bb59ee4151f3d9e948334119ff303aba04772bf"
        }
      ],
      "digest": "sha256:fba8a0355e5f4ec9773b0efe8e5c89217cff2aca57157f76fe43f3a2716dbe18"
    }
  }
}
