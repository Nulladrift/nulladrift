{
  "lockfileVersion": 2,
  "subjects": {
    "com.ampdat/control": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://control.ampdat.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.ampdat/control",
        "title": "Ampdat Control",
        "version": "1.0.1",
        "description": "Who controls a DeFi contract and what is about to change: a title search, not a rating.",
        "websiteUrl": "https://control.ampdat.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ampdat Control answers who controls a DeFi contract and what is about to change, from Ethereum mainnet, deterministically. Use it before a user deposits into a covered contract and while they hold (today: Morpho vaults, the Safes that hold their roles, and six stablecoins). Inputs are addresses: resolve a name with search_covered_contracts, then call get_control_state. Report the facts (who holds each role and what that holder is, the notice each change gives, what is queued and who can revoke it) with the block they are as of. It is a title search, not a rating: do not turn the answer into a safety score or a recommendation. How answers are made: a contract is covered only once its published source, recompiled, matches the deployed bytecode exactly. Roles, timelocks and queued changes are derived from on-chain events and state and checked against the contracts' own getters, and each family's derivation is tested on a mainnet fork (the named holders can call, everyone else is refused, and a queued change opens exactly when stated). Every answer gives the block it is as of, so any value can be re-read from any Ethereum node at that block. Method and how to check it yourself: https://github.com/ampdat/control#how-its-made. get_control_evidence and get_change_records are paid per call over x402; without a payment they return the price and the HTTP URL that sells the same answer, and charge nothing. get_control_evidence also gives the transaction and log behind each pending change.",
      "tools": [
        {
          "name": "get_change_records",
          "title": "Change history and feed (paid)",
          "description": "Past and recent changes as records, for monitoring a position or auditing a contract's history: the change history as record/v1 records, oldest first: what changed, from what to what, who acted, who may execute or revoke it, when it takes effect, and the transaction and log each rests on. With `address`, one contract's history; without, the feed across every covered contract (filter with `since`, a block number). Paged: pass the previous result's next_cursor. Paid per call over x402; a call without a payment returns the price and where to buy, and charges nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Optional: only this contract's records.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "cursor": {
                "pattern": "^[0-9]+-[0-9]+-[0-9]+$",
                "type": "string"
              },
              "family": {
                "description": "Feed only: a family id from get_coverage, e.g. metamorpho-v1.1.",
                "type": "string"
              },
              "kind": {
                "enum": ["change", "action", "bundle"]
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "observed_status": {
                "description": "A record's status as first observed; a record never changes, so what is pending now is get_control_state's `pending`.",
                "enum": ["effective", "pending", "revoked", "expired", "failed"]
              },
              "since": {
                "description": "First Ethereum block to include (default 0).",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Change history and feed (paid)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e9787f2f06ecdf6e89b764ee596cb0b7398bc13387ebc2785a10db34d8982e22"
        },
        {
          "name": "get_control_evidence",
          "title": "The evidence-backed control answer (paid)",
          "description": "The machine-readable, evidence-backed answer for one covered contract (the subject/v1 envelope): the full control graph (each Safe's signers, threshold, modules and guard, EIP-7702 delegates, and what is still unresolved), the complete state (every market, cap and queue), every pending change as a record with the transaction and log it rests on, the 20 most recent changes, and the value at stake. Use it when the user needs to verify or audit, not just read: the whole chain behind a role holder in one answer, what a pending change rests on, or the exact caps. Paid per call over x402; a call without a payment returns the price and where to buy, and charges nothing. get_control_state is the free summary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The contract's address on Ethereum mainnet (0x and 40 hex digits), e.g. a Morpho vault's, a Safe's or a stablecoin's. Not a name: use search_covered_contracts to find an address.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "sections": {
                "description": "Optional: only these parts of the envelope (default all). The whole answer can exceed 50 KB.",
                "items": {
                  "enum": ["state", "control", "records"]
                },
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "The evidence-backed control answer (paid)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c9fe0e4276889ba95529deaff785671acc354259abbad3e3a22469af8893c15a"
        },
        {
          "name": "get_control_state",
          "title": "Who controls this contract, and what is pending",
          "description": "Who controls a covered contract right now: who holds each role and what that holder is (a single key, a Safe and its threshold, a DAO, a known contract); what each role can change and how much notice (timelock) each change gives; and every change already queued, when it can take effect and who can revoke it. For a Morpho vault, before a deposit or while holding: the owner, curator, guardian or sentinels, and allocators. For a stablecoin: who can mint, burn, pause, freeze, upgrade the contract or appoint those roles. For a Safe: its signers' threshold, modules and guards, and the vault roles it holds (holds_roles_on); a Safe changes in one transaction, so nothing in it is pending. Deterministic facts from the chain at a stated block; a title search, not a rating, so it returns no safety score. An address that is not covered returns covered: false.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The contract's address on Ethereum mainnet (0x and 40 hex digits), e.g. a Morpho vault's, a Safe's or a stablecoin's. Not a name: use search_covered_contracts to find an address.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Who controls this contract, and what is pending"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f436441a7b52739ffe0184c480d181882f0bae56a48eb4352e20c81cfdbe2d8a"
        },
        {
          "name": "get_coverage",
          "title": "What Ampdat Control covers",
          "description": "What this server can answer about: which contract families on which chain (today, on Ethereum mainnet: every Morpho vault, MetaMorpho v1.0 and v1.1 and Morpho Vaults V2; the Safes that hold those vaults' roles; and the contracts of six stablecoins, USDC, USDT, USDS, DAI, PYUSD and USD1), how many contracts, and the block the data is at. Call it once to learn the scope, or with `address` to check whether one address is covered before relying on an answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Optional: check this address.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What Ampdat Control covers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:79c8395d5b326748e674fd6092b80322a3ae3da5bf4b07d49eff274b7d6d8066"
        },
        {
          "name": "search_covered_contracts",
          "title": "Find a covered contract by name",
          "description": "Find a covered contract's address from words the user gave: its name (e.g. 'Steakhouse USDC'), its asset symbol (e.g. 'WETH') or part of its address. Returns up to `limit` matches with address, name, asset and family. Use it when the user names a vault or a coin instead of giving an address, then call get_control_state with the address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that must all appear in the contract's name, asset symbol, family or address. Case does not matter.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a covered contract by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9719a373ac7c9d52a1d4de78ff168cbca68f462de2cb8bb15e4dfc30fea39ce3"
        }
      ],
      "digest": "sha256:a257f46c3661061c42c89b169bfbd091381cd4f73250bd9d82d5979c82228528"
    }
  }
}
