  "subjects": {
    "app.lithophanes/lithophane": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lithophanes.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "lithophanes",
        "title": "Lithophanes",
        "version": "1.0.0",
        "websiteUrl": "https://lithophanes.app/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Lithophane tools from lithophanes.app: size and filament estimates per shape, recommended thickness and print settings, 3D print cost, the site's prices, and how to make a lithophane from a photo. Read-only; nothing is stored. MCP can't receive photos: each result links to the maker on the site.",
      "tools": [
        {
          "name": "how_to_make_lithophane",
          "title": "How to make a lithophane from a photo",
          "description": "Step-by-step: turn a photo into a 3D-printable lithophane STL and print it, with a link to the maker for the chosen shape. MCP can't receive photos; the photo is added on the site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "shape": {
                "description": "Shape to make (default flat)",
                "enum": ["flat", "curved", "lamp", "heart", "nightlight"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ee28d8ee1f9e4b0e009fba290b2ed3f749de38a72267c909f1f63dc38aee22f"
        },
        {
          "name": "lithophane_estimate",
          "title": "Lithophane size, filament and STL estimate",
          "description": "Printed size (mm), grams of PLA and STL file size for a lithophane of a given shape, width and wall thickness, from the same mesh engine as the lithophanes.app maker. Also says whether the options need Pro.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "border_mm": {
                "description": "Solid frame, default 3",
                "maximum": 12,
                "minimum": 0,
                "type": "number"
              },
              "curve_deg": {
                "description": "Curved shape only: arc angle, default 120",
                "maximum": 270,
                "minimum": 30,
                "type": "number"
              },
              "height_mm": {
                "description": "Lamp shade height in mm (40–200, default 100). Other shapes take their height from the photo.",
                "maximum": 200,
                "minimum": 40,
                "type": "number"
              },
              "photo_aspect": {
                "description": "Width ÷ height of each photo, default 1.333 (4:3 landscape). Portrait 3:4 is 0.75.",
                "maximum": 8,
                "minimum": 0.25,
                "type": "number"
              },
              "photos": {
                "description": "Photos side by side in one print, 1–4 (heart: 1). More than one needs Pro.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "resolution": {
                "description": "standard (0.25 mm, free) or hd (0.125 mm, Pro)",
                "enum": ["standard", "hd"],
                "type": "string"
              },
              "shape": {
                "default": "flat",
                "description": "flat (free), curved, lamp (cylinder shade), heart or nightlight (panel on a foot)",
                "enum": ["flat", "curved", "lamp", "heart", "nightlight"],
                "type": "string"
              },
              "thickest_mm": {
                "description": "Thickest (darkest) wall, default 3",
                "maximum": 8,
                "minimum": 1.5,
                "type": "number"
              },
              "thinnest_mm": {
                "description": "Thinnest (brightest) wall, default 0.8",
                "maximum": 3,
                "minimum": 0.4,
                "type": "number"
              },
              "width_mm": {
                "description": "Width in mm (40–220); for the lamp, the shade diameter. Defaults per shape: flat 100, curved 120, lamp 80, heart 90, nightlight 100",
                "maximum": 220,
                "minimum": 40,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6efddc3259b4fd9bad7fcff833facf308d8e15c8157e94083a9ea0dd00064313"
        },
        {
          "name": "lithophane_pricing",
          "title": "Lithophanes plans and prices",
          "description": "What lithophanes.app offers and its exact prices: free flat lithophanes, Pro and the Gift pack (one-time), what each includes, and the refund policy.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69c215090a909a3102bc76f7dbf853e7d2a95f53036fe31166cdb68a3cc7cc5d"
        },
        {
          "name": "lithophane_settings",
          "title": "Recommended lithophane thickness and print settings",
          "description": "Recommended wall thickness, border, size and resolution per lithophane shape, the allowed ranges, and slicer settings (layer height, infill, orientation, filament, light).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "shape": {
                "description": "Only this shape; omit for all five",
                "enum": ["flat", "curved", "lamp", "heart", "nightlight"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eaea36e39f6e5f9fe813a9d008d370bc091f8279c340740b69e83bafce5d3b59"
        },
        {
          "name": "print_cost",
          "title": "3D print cost calculator",
          "description": "Cost of a 3D print (any print, not only lithophanes) from filament grams and print time: filament, electricity, printer wear and failed prints, plus a selling price with markup. USD by default; any currency works if all prices use it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "failurePct": {
                "description": "Share of prints that fail, % (default 10)",
                "maximum": 89,
                "minimum": 0,
                "type": "number"
              },
              "grams": {
                "description": "Filament used by the print, from the slicer (default 25)",
                "minimum": 0,
                "type": "number"
              },
              "hours": {
                "description": "Print time in hours, from the slicer (default 4)",
                "minimum": 0,
                "type": "number"
              },
              "kwhPrice": {
                "description": "Electricity price per kWh (default 0.17)",
                "minimum": 0,
                "type": "number"
              },
              "markupPct": {
                "description": "Markup when selling, % (default 0)",
                "minimum": 0,
                "type": "number"
              },
              "spoolGrams": {
                "description": "Spool weight in grams (default 1000)",
                "minimum": 0,
                "type": "number"
              },
              "spoolPrice": {
                "description": "Spool price (default 20)",
                "minimum": 0,
                "type": "number"
              },
              "watts": {
                "description": "Average printer power draw in W (default 120)",
                "minimum": 0,
                "type": "number"
              },
              "wearPerHour": {
                "description": "Printer wear per print hour (default 0.1)",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe8bee8639462382d6f2d1ee1d89efbbdc2846aace5e57641bcbd1f7c8faaf39"
        }
      ],
