            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Required ISO 4217 currency code (uppercase) of the cart lines; no default and no conversion.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "customer": {
                "additionalProperties": false,
                "description": "Optional buyer snapshot (name/email/phone, or a storefront customer externalId). Omit for an anonymous order.",
                "properties": {
                  "email": {
                    "format": "email",
                    "maxLength": 255,
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "externalId": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "firstName": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "lastName": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 50,
                    "minLength": 1,
                    "type": "string"
                  },
                  "shippingAddress": {
                    "additionalProperties": false,
                    "properties": {
                      "city": {
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
                      },
                      "country": {
                        "maxLength": 2,
                        "minLength": 2,
                        "type": "string"
                      },
                      "line1": {
                        "maxLength": 255,
                        "minLength": 1,
                        "type": "string"
                      },
                      "line2": {
                        "maxLength": 255,
                        "minLength": 1,
                        "type": "string"
                      },
                      "postalCode": {
                        "maxLength": 32,
                        "minLength": 1,
                        "type": "string"
                      },
                      "region": {
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
