        {
          "name": "set_channel_texts",
          "title": "Set listing words for a channel",
          "description": "Set the listing words of ONE product or ONE model for a channel — amazon (title up to 75 characters and up to 5 selling points) or ebay (title up to 80 characters, no points) — in the marketplace's language, which the CRM picks from the channel's marketplace (pass locale only when it says the channel sells in several languages). Which title a listing gets: the product's own words, else its model's title plus its colour or size («DEMI Borsa duffle 40 L, Blu»), else the product's name in that language. A model's title is also the title of Amazon's variation parent and of eBay's listing with variations — set it once per model instead of per colour. Write from the product's facts (get_product) and what the user said — never invent a claim. Saved in the CRM: new listings carry them; an existing Amazon offer gets them with update_amazon_listing_content parts [\"texts\"], an existing parent with update_amazon_variation_parent. title null with bulletPoints [] removes them; bulletPoints left out keeps the saved points. Idempotent. The result echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bulletPoints": {
                "description": "Selling points in order; empty strings are dropped. Amazon shows up to 5 (500 characters each); eBay has none. Omit to keep the points already saved (changing only the title); [] removes them.",
                "items": {
                  "maxLength": 500,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "locale": {
                "description": "The language the words are written in. Omit it: the CRM uses the channel's marketplace language (amazon.it → it). Needed only when the channel sells in several languages here (eBay on ebay.it and ebay.de, Amazon on amazon.it and amazon.de).",
                "enum": ["uk", "ru", "en", "pl", "de", "it", "fr", "es", "pt", "nl", "cs", "sk", "hu", "ro", "bg", "lt", "lv", "et", "tr", "sv"],
                "type": "string"
              },
              "modelId": {
                "description": "A product model id (get_product shows the model). Words set on the model go to every article of it without words of its own — as «model title, colour» — and are the title of Amazon's variation parent and of eBay's listing with variations. Give exactly one of productId or modelId.",
                "minLength": 1,
                "type": "string"
              },
              "platform": {
                "description": "The channel the words are for: amazon (title up to 75 characters and selling points) or ebay (title up to 80 characters, no points).",
                "enum": ["amazon", "ebay"],
                "type": "string"
              },
              "productId": {
                "description": "A product id returned by search_products — this article's own words, which win over its model's. Give exactly one of productId or modelId.",
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The title in the marketplace's language, within the channel's limit; null to fall back (an article to its model's title plus its colour or size, then its name; a model to its name in that language). null with bulletPoints [] removes the words."
              }
            },
            "required": ["platform", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
