                      "maxLength": 255,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Quantity ordered (integer, at least 1).",
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "Product SKU snapshot (from search_products). Optional.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "unitPrice": {
                      "anyOf": [
                        {
                          "pattern": "^\\d+(\\.\\d{1,2})?$",
                          "type": "string"
                        },
                        {
                          "minimum": 0,
