        {
          "name": "create_order",
          "title": "Create order",
          "description": "Create an order with line items. Currency is required: use trusted source facts or CRM product prices; never guess or convert. Idempotent by externalId: re-sending the same request returns the existing order. Counts toward the plan's monthly order limit (403 PLAN_LIMIT_EXCEEDED when reached). The result echoes the operating workspace. Use search_products first. For a promo code use quote_order_promotion, then send promotion.code and promotion.expectedTotal. CRM alone calculates discounts, net totals, usage limits and free shipping. Do not invent a discount, send a legacy discountAmount, or promise free shipping from your own arithmetic.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Required ISO 4217 currency code from the source facts or selected CRM product prices. Never guess or convert between currencies.",
                "maxLength": 3,
                "minLength": 3,
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "customer": {
                "additionalProperties": false,
                "description": "Optional buyer snapshot (name/email/phone, or a storefront customer externalId). Omit for an anonymous order.",
                "properties": {
                  "email": {
                    "format": "email",
                    "maxLength": 255,
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "externalId": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "firstName": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "lastName": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 50,
                    "minLength": 1,
                    "type": "string"
                  },
                  "shippingAddress": {
                    "additionalProperties": false,
                    "properties": {
                      "city": {
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
                      },
                      "country": {
                        "maxLength": 2,
                        "minLength": 2,
                        "type": "string"
                      },
                      "line1": {
                        "maxLength": 255,
                        "minLength": 1,
                        "type": "string"
                      },
                      "line2": {
                        "maxLength": 255,
                        "minLength": 1,
                        "type": "string"
                      },
                      "postalCode": {
                        "maxLength": 32,
                        "minLength": 1,
                        "type": "string"
