        {
          "name": "set_amazon_field_values",
          "title": "Set Amazon field values",
          "description": "Set or remove values of Amazon product type fields on ONE product, model or category (name exactly one id) — the attributes Amazon requires that are not product facts the shop shows on its site or other channels (Reparto, Tipo di chiusura, Capacità). A category's value is the default of every product in it, a model's is shared by every colour and size, a product's overrides both. Keys and values come from get_amazon_fields: for a choice, one of its values (or labels); a number as digits; a measure with a unit it lists. An attribute made of several values is set part by part under attribute.part (shirt_size.size_system): a part's value must be on its list, and one answer on the model serves every article; the CRM builds a size from each article's own size, so only a part it reported as unresolved needs an answer. Every value is checked against Amazon's schema first, and the whole call is refused, naming the fields, when a key is not one a person fills or a value cannot be taken. Write only what the user stated or what the product's facts (get_product) establish, in the marketplace's language. Saved in the CRM only: a new listing carries them; an existing offer is not changed. null removes a value, so the level below shows through again. Idempotent. The result echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "categoryId": {
                "description": "Set the values on this CATEGORY — the default for every product in it.",
                "minLength": 1,
                "type": "string"
              },
              "marketplaceId": {
                "description": "The Amazon store whose product type, language and allowed values to use (APJ6JRA9NG5V4 is amazon.it, A1PA6795UKMFR9 is amazon.de). Omit for the main store.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "modelId": {
                "description": "Set the values on this MODEL — shared by every colour and size of it.",
                "minLength": 1,
                "type": "string"
              },
              "productId": {
                "description": "Set the values on this one PRODUCT (article).",
                "minLength": 1,
                "type": "string"
              },
              "values": {
                "description": "The fields to set or remove, by Amazon attribute key. A value replaces what this level held; null removes it, so the model's or the category's value shows through again.",
                "items": {
                  "properties": {
                    "key": {
                      "description": "The marketplace's attribute key (closure, department, number_of_compartments), or attribute.part for one part of an attribute made of several values (shirt_size.size_system) — get_amazon_fields lists them.",
                      "maxLength": 120,
                      "minLength": 1,
                      "pattern": "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)?$",
                      "type": "string"
                    },
                    "unit": {
                      "anyOf": [
                        {
                          "maxLength": 40,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "For a measurement, the unit as the marketplace names it (liters, centimeters, kilograms) — one of the units get_amazon_fields lists for the field."
                    },
                    "value": {
                      "anyOf": [
                        {
                          "maxLength": 500,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The value as a person writes it, in the marketplace's language: for a field with a list, one of its values or labels; a number as digits. null removes the value at this level."
                    }
                  },
                  "required": ["key", "value"],
                  "type": "object"
                },
                "maxItems": 80,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["values"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
