                  "properties": {
                    "channel": {
                      "description": "A social channel: telegram (the bound Telegram channel), instagram, facebook (the Facebook page), linkedin, threads or viber (the connected Viber channel). Use only channels list_content_channels reports as ready.",
                      "enum": ["instagram", "facebook", "telegram", "linkedin", "threads", "viber"],
                      "type": "string"
                    },
                    "text": {
                      "description": "Text written for THIS network only. Omit it to publish the post's main text. It must fit the channel's maxTextLength from list_content_channels together with the hashtags (Threads allows 500 characters, Instagram 2200).",
                      "maxLength": 63206,
                      "type": "string"
                    }
                  },
                  "required": ["channel"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "files": {
                "description": "Image files the person attached in ChatGPT. ChatGPT fills this field itself; any other client leaves it out and passes image links instead (or uploads files with create_image_upload).",
                "items": {
                  "properties": {
                    "download_url": {
                      "description": "Temporary link ChatGPT gives to the attached file.",
                      "format": "uri",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "ChatGPT's id of the attached file.",
                      "type": "string"
                    },
                    "file_name": {
                      "description": "The attached file's name.",
                      "type": "string"
                    },
                    "mime_type": {
                      "description": "The attached file's type.",
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 10,
