        {
          "name": "set_google_merchant_labels",
          "title": "Set Google Merchant labels",
          "description": "Set or clear Google's custom labels customLabel1 to customLabel4 on up to 100 products, models or categories, so ad campaigns can be split by your own groups (\"season sale\", \"clearance\"). This writes to the CRM only: the labels reach Google with the next hourly product push, and only if the owner armed that push — it never sends anything itself, never arms anything, and never touches the preview stamp. A product takes its own label, else its model's, else its category's (nearest ancestor). customLabel0 is derived from each product's markup and is refused. Omit a slot to leave it alone; null or empty clears it. Returns { set, cleared, targets }; an id not in the workspace refuses the whole call. Idempotent. Use preview_google_merchant_products to see the labels in the body, and push_google_merchant_catalog to send sooner. The result echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "labels": {
                "description": "The slots to set or clear. At least one of customLabel1..4.",
                "properties": {
                  "customLabel0": {
                    "description": "Not settable: customLabel0 is derived from each product's markup and is refused if sent. Use customLabel1 to customLabel4."
                  },
                  "customLabel1": {
                    "description": "Value for customLabel1, at most 100 characters. Omit to leave the slot alone; null or an empty string clears it.",
                    "type": ["string", "null"]
                  },
                  "customLabel2": {
                    "description": "Value for customLabel2, at most 100 characters. Omit to leave the slot alone; null or an empty string clears it.",
                    "type": ["string", "null"]
                  },
                  "customLabel3": {
                    "description": "Value for customLabel3, at most 100 characters. Omit to leave the slot alone; null or an empty string clears it.",
                    "type": ["string", "null"]
                  },
                  "customLabel4": {
                    "description": "Value for customLabel4, at most 100 characters. Omit to leave the slot alone; null or an empty string clears it.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "targets": {
                "description": "The products, models or categories to label, at most 100.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "The product id (search_products), model id or category id (list_categories).",
                      "minLength": 1,
                      "type": "string"
                    },
                    "kind": {
                      "description": "What the id is. A model or category label applies to every product under it that has no label of its own.",
                      "enum": ["product", "model", "category"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "kind"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
