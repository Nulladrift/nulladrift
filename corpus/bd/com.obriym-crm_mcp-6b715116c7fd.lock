        {
          "name": "get_amazon_fields",
          "title": "Get Amazon fields",
          "description": "The fields of the Amazon product type of ONE product, model or category (name exactly one id), read from Amazon's own schema for the workspace's Amazon marketplace: each field's attribute key, its title in the marketplace's language, its kind (choice with Amazon's list of values and labels, number, measure with the units it accepts, text), whether the type requires it, the value set on this level (own) and the one it inherits from the model or the category (inherited), and — for a product, or a model read through its first active article — its status: missing or invalid (what Amazon would refuse) or filled, and fromCrm when the CRM already fills it from the product's characteristics or fields. fields lists in full the ones that are required, missing, refused or already hold a value; otherFields names every other field by key, title and kind — pass their keys in keys to get them in full. An attribute made of several values that only mean something together (a size: shirt_size, bottoms_size, footwear_size) appears as one field per part, keyed attribute.part (shirt_size.size_system); the article's own size part is listed only for a product. Fields the CRM always writes itself (title, brand, barcode, price, photos, the colour's name, the variation relationship) are never listed. The colour's name is the product's colour in the store's language (translations on get_product, written with upsert_product_translation); which of Amazon's colour families it belongs to is the field color.standardized_values, listed for a product only, which the CRM fills from the name unless a value is set here. Use it before set_amazon_field_values; for what a product still lacks to be listed, check_amazon_readiness. Read-only: it changes nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "categoryId": {
                "description": "Read the fields of this CATEGORY's Amazon product type and the values set on it.",
                "minLength": 1,
                "type": "string"
              },
              "keys": {
                "description": "Attribute keys to return in full besides the ones that need attention — for a field listed under otherFields whose allowed values you need.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "marketplaceId": {
                "description": "The Amazon store whose product type, language and allowed values to use (APJ6JRA9NG5V4 is amazon.it, A1PA6795UKMFR9 is amazon.de). Omit for the main store.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "modelId": {
                "description": "Read the fields for this MODEL — the values set on it and on its category, and what its first active article still misses.",
                "minLength": 1,
                "type": "string"
              },
              "productId": {
                "description": "Read the fields for this one PRODUCT (article) — the values set on it, its model and its category, and what it still misses.",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
