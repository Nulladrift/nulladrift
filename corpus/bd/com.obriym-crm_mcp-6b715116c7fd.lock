        {
          "name": "set_product_channel_price",
          "title": "Set product channel price",
          "description": "Set — or clear — the price ONE sales channel gets for ONE product, instead of the product's ordinary price in that currency. Send price as a decimal string to set it (with an optional compareAtPrice, the old price, higher than price) or price null to remove the override so the channel gets the ordinary price again. Per platform and currency: Prom, Rozetka, eBay, Amazon, Shopify, WooCommerce, OLX or Google Merchant. Send only an amount the person stated. The new price reaches the channel the same way a price edit does — only where the owner armed price writes. This is not the price-list row for a currency (upsert_product_prices). Idempotent; clearing a missing override is not an error. Returns { changed }. Read get_product_pricing first. Echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compareAtPrice": {
                "anyOf": [
                  {
                    "pattern": "^\\d+(\\.\\d{1,2})?$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The old (struck-through) price on this channel, higher than price; omit or null for none. Ignored when price is null."
              },
              "currency": {
                "description": "The currency the channel sells in (uppercase 3-letter ISO code). get_product_pricing and the channel's readiness show which currency a channel uses.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "id": {
                "description": "The product id returned by search_products or get_product — never a SKU or a name.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "platform": {
                "description": "The sales channel this price is for: prom, rozetka, woocommerce, shopify, olx, amazon, ebay or google_merchant.",
                "enum": ["prom", "rozetka", "woocommerce", "shopify", "olx", "amazon", "ebay", "google_merchant", "vinted", "etsy"],
                "type": "string"
              },
              "price": {
                "anyOf": [
                  {
                    "pattern": "^\\d+(\\.\\d{1,2})?$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The price this ONE channel gets, instead of the product's ordinary price in that currency, as a decimal string above zero. null removes the override — the channel then gets the ordinary price again. Send only an amount the person stated; never a converted or guessed value."
              }
            },
            "required": ["currency", "id", "platform", "price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
