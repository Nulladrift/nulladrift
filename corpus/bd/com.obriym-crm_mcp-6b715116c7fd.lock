                "description": "Optional: the value of that custom label, for example 'margin_high'. Needs labelIndex."
              },
              "maxCpc": {
                "description": "Maximum cost per click as a positive decimal string in the ad account's currency, for example '0.40'.",
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Campaign name, at most 128 characters. Google refuses a name already in use.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["dailyBudget", "maxCpc", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
