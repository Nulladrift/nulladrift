        },
        {
          "name": "preview_bulk_price_change",
          "title": "Preview bulk price change",
          "description": "Dry run of a bulk price change — step 1 of 2; nothing is written. Give a rule (percent, fixed, fromCost, discount, endDiscount, compareAtMarkup, compareAtClear), a scope (a named category, brand, supplier, warehouse or model, or up to 100 explicit product ids) and optionally a target (the product's price, a price-list currency, or the purchase cost). Returns totalItems (how many products would change), a sample of up to 10 with from/to, old price and cost, belowCost (how many would sell below their cost), skipped grouped by reason (no price, no cost, no rate, unchanged, …), the currency, and a digest. Always show the person the counts, the sample, the skipped reasons and any belowCost warning BEFORE applying. Then call apply_bulk_price_change with the SAME rule, scope and target and this digest. Ids come from list_categories, list_brands, list_suppliers, list_warehouses (a category includes its sub-categories only with includeSubcategories) and search_products. Read-only and repeatable.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "rule": {
                "description": "HOW prices move. The target 'cost' accepts only op 'percent'. Pick the one that matches the request: a percent change, a fixed price, a markup over cost, a discount (and its end), or the old price.",
                "oneOf": [
                  {
                    "properties": {
                      "op": {
                        "const": "percent",
                        "description": "Raise or lower by a percent.",
                        "type": "string"
                      },
                      "percent": {
                        "description": "Percent change: 10 raises by 10%, -10 lowers by 10%. Between -90 and 900.",
                        "maximum": 900,
                        "minimum": -90,
                        "type": "number"
                      },
                      "rounding": {
                        "description": "How the new price is rounded: cents (to 2 decimals), whole (up to the next whole unit), nine (up to the next price ending in 9, e.g. 644.80 -> 649) or tens (up to the next ten). Everything except cents rounds UP.",
                        "enum": ["cents", "whole", "nine", "tens"],
                        "type": "string"
                      }
                    },
                    "required": ["op", "percent", "rounding"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "amount": {
                        "description": "One price for EVERY product in scope, as a decimal string, e.g. '1290' or '1290.50'. Rare for a whole category — check the preview.",
                        "pattern": "^\\d{1,10}(\\.\\d{1,2})?$",
                        "type": "string"
                      },
                      "op": {
                        "const": "fixed",
                        "description": "Set one price for every product in scope.",
                        "type": "string"
                      }
                    },
                    "required": ["amount", "op"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "markupPercent": {
                        "description": "Markup over the purchase cost, in percent: 40 means price = cost x 1.4. The cost is crossed into the price's currency at the rates the workspace states; a product without a cost or a rate is skipped.",
                        "maximum": 900,
                        "minimum": -90,
                        "type": "number"
                      },
                      "op": {
                        "const": "fromCost",
                        "description": "Price = purchase cost plus a markup.",
                        "type": "string"
                      },
                      "rounding": {
