                      "example": "en",
                      "type": "string"
                    }
                  },
                  "required": ["description", "locale"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "website": {
                "anyOf": [
                  {
                    "format": "uri",
                    "maxLength": 255,
