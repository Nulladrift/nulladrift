                    }
                  },
                  "required": ["name", "value"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "id": {
                "description": "The product id returned by search_products or get_product.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["attributes", "id"],
            "type": "object"
          },
