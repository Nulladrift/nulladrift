        {
          "name": "set_product_price_tiers",
          "title": "Set product wholesale prices",
          "description": "Replace ONE product's wholesale quantity breaks in ONE currency — 'from 12 units, 12.40 each'. The list you send becomes the whole set for that currency (at most 10; each quantity at least 2 and once; a bigger quantity must cost less per unit); an empty list removes all its breaks. The product must already be priced in that currency. Breaks apply to buyers outside the team (the customer portal and connected partners), never to the website or marketplaces, and the buyer gets the better of a break or their own discount. Idempotent. Returns { count }. Read get_product_pricing first. Echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "description": "The currency of these breaks (uppercase 3-letter ISO code). The product must already be priced in it — its own currency or a price-list row.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "id": {
                "description": "The product id returned by search_products or get_product — never a SKU or a name.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "tiers": {
                "description": "The wholesale breaks for that currency, at most 10. This list REPLACES the product's breaks in that currency; an empty list removes them all. Each quantity once, and a bigger quantity always costs less per unit.",
                "items": {
                  "properties": {
                    "minQuantity": {
                      "description": "From this many units. At least 2 — the price for one unit is the product's own price.",
                      "maximum": 1000000,
                      "minimum": 2,
                      "type": "integer"
                    },
                    "price": {
                      "description": "The price PER UNIT from that quantity, as a decimal string. Must be lower than the price of every smaller break.",
                      "pattern": "^\\d+(\\.\\d{1,2})?$",
                      "type": "string"
                    }
                  },
                  "required": ["minQuantity", "price"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["currency", "id", "tiers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
