        {
          "name": "update_order_item",
          "title": "Update order item",
          "description": "Update a line item on an order (quantity, unit price, discount, name, or SKU). Recomputes the order total. Only allowed while the order is pending or confirmed; otherwise it fails with 409 CONFLICT \"Order lines can only be changed while the order is pending or confirmed\" (stock is committed from processing on). Use get_order to find the order's externalId and the item's itemId. The CRM recalculates shipping eligibility from the saved priced lines; a separate whole-order discount may require source-confirmed amount correction. The result echoes the operating workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
