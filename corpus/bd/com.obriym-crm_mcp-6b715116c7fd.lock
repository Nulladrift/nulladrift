        },
        {
          "name": "set_product_ebay_fulfillment_policy",
          "title": "Set a product's eBay shipping policy",
          "description": "Choose the eBay shipping (fulfillment) policy of ONE product, or with fulfillmentPolicyId null return it to the connection default. A product with no eBay listing stores the choice for its next draft. A draft or LIVE listing has its eBay offer updated in place — no relisting — when listing writes are armed on the eBay connection, and the offer is then read back to confirm; with listing writes off a live listing is refused and a draft stores the choice for go-live. Per-service shipping cost overrides tied to the old policy are removed (droppedShippingCostOverrides). Returns productId, sku, offerId, marketplaceId, previousFulfillmentPolicyId, newFulfillmentPolicyId, status (updated, unchanged, saved, unverified, failed), verified and error — tell the user a listing changed only when status is updated. Refused until the workspace owner switches on AI publishing. Idempotent. The result echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fulfillmentPolicyId": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9_-]+$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "A fulfillmentPolicyId from list_ebay_fulfillment_policies, for the same marketplace. null removes the product's own choice so the connection default (then eBay's first policy) applies."
              },
              "marketplaceId": {
                "description": "An eBay MARKETPLACE id such as EBAY_IT — never the eBay connection id. Omit it when the eBay connection sells on one site; the server uses that one. Required when the connection sells on several, unless the product already has an eBay offer (its own site is then used).",
                "enum": ["EBAY_US", "EBAY_GB", "EBAY_DE", "EBAY_AT", "EBAY_BE", "EBAY_FR", "EBAY_IT", "EBAY_NL", "EBAY_ES", "EBAY_IE", "EBAY_PL", "EBAY_CH", "EBAY_CA", "EBAY_AU"],
                "type": "string"
              },
              "productId": {
                "description": "A product id returned by search_products.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["fulfillmentPolicyId", "productId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
