        {
          "name": "update_amazon_listing_content",
          "title": "Send photos and GPSR to Amazon",
          "description": "Send the photos and GPSR contacts of up to 25 products to their EXISTING Amazon offers — a real write to the seller's live listings: Amazon's photos are replaced with the CRM's, the manufacturer and EU responsible person with the companies set on the product's brand or supplier, and — when asked for — the title and bullet points written for Amazon, the safety documents, the shipping template with handling time, and any listing data this store does not show yet. Nothing else on the offer changes (a partial patch). Run preview_amazon_listing_content first and pass only products whose status is ready. Refused until the owner switches on AI publishing, and while photo/GPSR updates are not armed on the Amazon connection. Returns the same rows as the preview, with status sent where Amazon accepted the patch; notAttempted lists products not reached in the time budget — call again with those ids. Never tell the user a change is live unless its row says sent; Amazon shows it to buyers within minutes. Idempotent: the same content again leaves the offer as it was. The result echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "marketplaceId": {
                "description": "One Amazon store by its id (APJ6JRA9NG5V4 is amazon.it, A1PA6795UKMFR9 is amazon.de). Omit for the main store; a send needs it when several stores are open for photos and GPSR.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "parts": {
                "default": ["images", "gpsr", "texts", "documents", "shipping", "attributes"],
                "description": "What to send: images (the product's main photo and up to 8 more, replacing Amazon's), gpsr (the manufacturer and the EU responsible person, as the emails of records the seller created in Seller Central — taken from the product's brand, else its supplier), texts (the title and bullet points written for Amazon with set_amazon_listing_texts — nothing is sent when none were written), documents (the product's safety PDFs, set with set_product_safety_documents), shipping (the shipping template and handling time set with set_amazon_shipping; a handling time travels with the quantity, so it needs a merchant-fulfilled product with tracked stock) and attributes (every other fact a new listing would carry on this store in its language: the colour's name with Amazon's colour family, the brand, the manufacturer, material, description, measurements and the values set with set_amazon_field_values; only what this store does not show yet, so a live listing's are never rewritten. An offer carried over from another store has none of them, and Amazon hides it from search until it does). Default: all six; a part with nothing to send is reported in skipped.",
                "items": {
                  "enum": ["images", "gpsr", "texts", "documents", "shipping", "attributes"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "productIds": {
                "description": "The products whose Amazon offers to update, at most 25 ids from search_products or inspect_amazon_listings.",
                "items": {
                  "description": "A product id returned by search_products.",
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["productIds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
