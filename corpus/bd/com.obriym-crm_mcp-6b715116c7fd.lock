                  }
                ],
                "description": "Set true to return only stale leads: not unqualified/converted and either past their next-action date or untouched for more than 7 days."
              },
              "status": {
                "description": "Filter by lead status. Omit to return every status. Allowed: new, contacted, qualified, unqualified, converted.",
