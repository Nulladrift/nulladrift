        {
          "name": "upsert_product_prices",
          "title": "Set product prices in other currencies",
          "description": "Add, update or REMOVE the price-list rows of ONE product — the price it sells at in another currency, for example EUR for an eBay site — keeping its other currencies and its own workspace-currency price. Send only an amount the user stated: never a converted or estimated price; to drop a currency send its code in remove. The product's own currency is refused; change that with update_product's price. A price for one channel only is set_product_channel_price; see all of a product's prices with get_product_pricing. Saves through the same product-card operation as the CRM form, with a version check (on CONFLICT re-read the product and retry), and the new price reaches connected channels like a manual edit. Idempotent. The result echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The product id returned by search_products or get_product.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "prices": {
                "description": "Price-list rows to add or update, one per currency (uppercase 3-letter ISO code, e.g. EUR), an amount greater than 0 — the price the product sells at in that currency on every channel that trades in it. Refused for the product's own workspace currency — use update_product's price field for that one. Never a converted or guessed value: send exactly the amount the user gave for that market. Not a per-channel price: a price for ONE channel only is set_product_channel_price. Omit it when you only remove currencies.",
                "items": {
                  "properties": {
                    "compareAtPrice": {
                      "anyOf": [
                        {
                          "pattern": "^\\d+(\\.\\d{1,2})?$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "currency": {
                      "maxLength": 3,
                      "minLength": 3,
                      "type": "string"
                    },
                    "price": {
                      "pattern": "^\\d+(\\.\\d{1,2})?$",
                      "type": "string"
                    }
                  },
                  "required": ["currency", "price"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "remove": {
                "description": "Currencies whose price-list row to REMOVE (uppercase 3-letter ISO code). The product stops being sold in that currency on channels that trade in it. The product's own workspace currency cannot be removed here, and a currency named in prices cannot also be removed. A currency with no row is ignored.",
                "items": {
                  "pattern": "^[A-Z]{3}$",
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:686370975255e96ced8ebb719cb55dcb80d104e2d55805886c2fbcefc178ac61"
        },
        {
