        {
          "name": "update_product",
          "title": "Update product",
          "description": "Update fields on an existing catalog product by id — including status, to publish a draft or archive a product. Provide a patch with at least one field; use get_product first to see the current values. A changed stock number is applied as a relative movement and recorded in the product stock history; prefer adjust_stock when the intent is a correction with a reason. A bundle's stock is derived from its components, so a stock sent for a bundle is refused; sending bundleItems replaces its composition. A product's type (simple or bundle) cannot change after creation — create a new product instead — and a product that is a component of a bundle that is not archived cannot be archived. A change to price, stock, tracking or status is pushed to every connected sales channel. For a product that belongs to a model, a changed shared field (name, description, category, brand, unit, keywords, videos, material, pattern, gender, age group, size type, condition) is applied to the whole model and every article of it; productGroupId null detaches the product from its model, and the code of another model moves it there. The result echoes the operating workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The product id returned by search_products.",
                "minLength": 1,
                "type": "string"
              },
              "patch": {
                "additionalProperties": false,
                "description": "The product fields to update; include at least one changed field.",
                "properties": {
                  "ageGroup": {
                    "anyOf": [
                      {
                        "enum": ["newborn", "infant", "toddler", "kids", "adult"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "brandId": {
                    "anyOf": [
                      {
                        "maxLength": 160,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "bundleItems": {
                    "description": "Components of a bundle (type bundle only): simple, non-archived products of the bundle's warehouse, each listed once. Selling the bundle deducts these components; the bundle's stock is how many whole bundles they make. On update, sending it replaces the whole composition.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "productId": {
                          "maxLength": 160,
                          "minLength": 1,
                          "type": "string"
                        },
                        "quantity": {
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        }
                      },
                      "required": ["productId", "quantity"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "categoryId": {
                    "anyOf": [
                      {
                        "maxLength": 160,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "color": {
                    "anyOf": [
                      {
                        "maxLength": 80,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "compareAtPrice": {
                    "anyOf": [
                      {
                        "anyOf": [
                          {
                            "type": "number"
                          },
                          {
                            "minLength": 1,
                            "type": "string"
                          }
                        ]
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "condition": {
                    "anyOf": [
                      {
                        "enum": ["new", "used", "refurbished"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "costCurrency": {
                    "anyOf": [
                      {
                        "pattern": "^[A-Z]{3}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "costPrice": {
                    "anyOf": [
                      {
                        "anyOf": [
                          {
                            "type": "number"
                          },
                          {
                            "minLength": 1,
                            "type": "string"
                          }
                        ]
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Purchase price per unit, in costCurrency. Ignored for a bundle: its cost is the sum of its components' costs when all are known and in one currency."
                  },
                  "depth": {
                    "anyOf": [
                      {
                        "anyOf": [
                          {
                            "type": "number"
                          },
                          {
                            "minLength": 1,
                            "type": "string"
                          }
                        ]
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "description": {
                    "anyOf": [
                      {
                        "maxLength": 2000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "dimensionUnit": {
                    "anyOf": [
                      {
                        "enum": ["cm", "mm", "in"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "ean": {
                    "anyOf": [
                      {
                        "pattern": "^[0-9]{8,14}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "GTIN/EAN-8/12/13/14 barcode. Presence-and-shape validation only, no checksum.",
                    "example": "4006381333931"
                  },
                  "gender": {
                    "anyOf": [
                      {
                        "enum": ["male", "female", "unisex"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "height": {
                    "anyOf": [
                      {
                        "anyOf": [
                          {
                            "type": "number"
                          },
                          {
                            "minLength": 1,
                            "type": "string"
                          }
                        ]
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "images": {
                    "description": "The product's photos as { url, alt }, at most 10; the first is the main photo. On an update the list you send replaces the whole set. An entry whose url equals a photo the product already has keeps that stored file and takes only the caption (alt) you send, so sending back what you read never downgrades a stored photo.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "alt": {
                          "description": "Alternative text of the photo, up to 200 characters. Optional: when empty a storefront should use the product name.",
                          "example": "White leather sneakers, side view",
                          "maxLength": 200,
                          "type": "string"
