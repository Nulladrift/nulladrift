                },
                "type": "object"
              },
              "delivery": {
                "additionalProperties": false,
                "description": "How the buyer asked to receive the order: carrier, branch/courier/pickup, branch text, recipient, cash-on-delivery and a delivery note. This is the buyer's choice at checkout — it does not dispatch anything. Record what actually ships with POST /orders/{externalId}/shipments.",
                "properties": {
                  "branch": {
                    "description": "Branch or parcel locker as the buyer named it, e.g. \"відділення №5\" or \"поштомат 12345\". Free text: the CRM resolves it against the live branch list of the carrier when creating a waybill.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "branchRef": {
                    "description": "The carrier's own identifier for the branch or parcel locker, as returned by GET /api/v1/carriers/{carrier}/warehouses. The same value the shipment-label endpoint calls warehouseRef. Sent, this removes all guessing; omitted, the CRM falls back to matching `branch` as text.",
                    "maxLength": 64,
                    "type": "string"
                  },
                  "building": {
                    "description": "House number for courier delivery, structured rather than inside the address line because carriers validate it on its own (Nova Poshta accepts up to 11 characters matching digits plus an optional Cyrillic letter or block, e.g. \"12Б\" or \"12/4\").",
                    "maxLength": 35,
                    "type": "string"
                  },
                  "carrier": {
                    "description": "Carrier slug the buyer chose, from GET /capabilities (e.g. \"nova_poshta\", \"ukrposhta\", \"pickup\"). This is a preference, not a dispatch — the shipment endpoint still records what actually ships.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "cityRef": {
                    "description": "The carrier's own identifier for the destination city, as returned by GET /api/v1/carriers/{carrier}/cities. Required alongside branchRef or streetRef for a waybill to be created from the order alone.",
                    "maxLength": 64,
                    "type": "string"
                  },
                  "cod": {
                    "description": "True when the buyer pays on delivery (cash on delivery).",
                    "type": "boolean"
                  },
                  "comment": {
                    "description": "Delivery note from the buyer, e.g. \"дзвонити після 18:00\". Not the order notes.",
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "flat": {
                    "description": "Apartment or office number for courier delivery.",
                    "maxLength": 35,
                    "type": "string"
                  },
                  "method": {
                    "description": "How the parcel reaches the buyer: \"branch\" (carrier office/locker), \"courier\" (to the address) or \"pickup\" (buyer collects from you).",
                    "enum": ["branch", "courier", "pickup"],
                    "type": "string"
                  },
                  "phone": {
                    "description": "Recipient phone, when it differs from the buyer's own contact phone.",
                    "maxLength": 50,
                    "type": "string"
                  },
                  "recipientName": {
                    "description": "Who receives the parcel, when that is not the buyer (a gift, an office).",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "streetRef": {
                    "description": "The carrier's own identifier for the street, as returned by GET /api/v1/carriers/{carrier}/streets. Courier delivery only; pair it with `building`.",
                    "maxLength": 64,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "items": {
                "description": "Order line items (1-100). Each snapshots productName/sku/unitPrice.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "discount": {
                      "default": 0,
                      "description": "Percentage discount on this line (0-100). Default 0.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "productName": {
                      "description": "Line item name, snapshotted onto the order. Use search_products to quote a real catalog product's name. Required.",
                      "maxLength": 255,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Quantity ordered (integer, at least 1).",
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "Product SKU snapshot (from search_products). Optional.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "unitPrice": {
                      "anyOf": [
                        {
                          "pattern": "^\\d+(\\.\\d{1,2})?$",
                          "type": "string"
                        },
                        {
                          "minimum": 0,
                          "type": "number"
                        }
                      ],
                      "description": "Price per unit in the order currency, as a decimal (e.g. 199.99). Snapshotted onto the line."
                    }
                  },
                  "required": ["productName", "quantity", "unitPrice"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "promotion": {
                "additionalProperties": false,
                "description": "Ask the CRM to validate and calculate this promo code. Do not supply promoCode, discountAmount or shippingThresholdAmount alongside it. An optional expectedTotal refuses a changed quote; the server always owns the actual discount.",
                "properties": {
                  "code": {
                    "description": "CRM-managed promo code, 3–64 letters, digits, hyphens or underscores; case-insensitive. Must be enabled for this connection's source; a personal or capture code also needs the buyer email it was issued to.",
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$",
                    "type": "string"
                  },
                  "expectedTotal": {
                    "description": "Net merchandise total the buyer was shown, as a decimal string with up to two decimals (for example \"199.90\"), in the order currency. If the CRM now calculates a different amount the request is refused with price_changed.",
                    "pattern": "^\\d{1,10}(?:\\.\\d{1,2})?$",
                    "type": "string"
                  }
                },
                "required": ["code"],
                "type": "object"
              }
            },
            "required": ["currency", "items", "promotion"],
            "type": "object"
          },
