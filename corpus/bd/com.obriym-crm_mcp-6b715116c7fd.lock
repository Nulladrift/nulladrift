      "serverInfo": {
        "name": "obriym-crm",
        "title": "Obriym CRM",
        "version": "1.29.2",
        "description": "Operate Obriym CRM from your AI assistant — leads, deals, orders, catalog and stock, eBay listings from inspection to publication and their shipping policies, marketplace channel status, social posts drafted, scheduled and published to the connected channels, dashboard and reports over the Model Context Protocol.",
        "websiteUrl": "https://obriym-crm.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "An Obriym CRM user can belong to MULTIPLE workspaces (isolated businesses).\nEvery tool operates exactly one workspace — the one this connection is bound to. Nothing in a tool payload can change that.\nSign-in (OAuth) connections of a user with several workspaces start LOCKED: every data tool first asks the client to show a workspace selection form when supported; otherwise it returns WORKSPACE_SELECTION_REQUIRED with the workspace list in structured content. Never choose a workspace for the user yourself.\nAfter the user selects a workspace, call select_workspace with that organization id, then retry the user's original CRM request.\nBefore creating or changing data in a session, verify the bound workspace with get_workspace_info and tell the user which workspace you are operating.\nBefore writing marketing about Obriym CRM itself, call get_obriym_product_facts. Keep claims within its requirements and limitations; publishing-channel readiness and old posts do not establish product capabilities or customer results.\nSign-in (OAuth) connections: use list_workspaces to see the user's workspaces and select_workspace to re-bind this connection when the user asks to work in another workspace.\nAPI-token connections are permanently fixed to the workspace that issued the token — to work in another workspace, use a token created there.\nEvery write-tool result echoes the workspace it landed in — repeat it to the user when confirming an action.\nTools are added over time, and a client keeps the tool list it read when it connected. If the user asks for something and your list has no tool for it, call get_workspace_info: its server.tools names every tool this server has now. If the tool you need is there but missing from your list, your list is outdated — ask the user to refresh the Obriym CRM connection in their AI app (server.refreshHint says how) instead of saying Obriym cannot do it.",
      "tools": [
        {
          "name": "add_content_locales",
          "title": "Add export languages",
          "description": "Add languages to the workspace's export languages, which gives products, categories and brands a translation tab in each of them and makes them targets for a bulk translation. Languages already offered are ignored, and none is ever removed. Use list_content_locales first to see what is offered. Idempotent. The result names what was added and echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locales": {
                "description": "Languages to add to the workspace's export languages, ISO 639-1. Languages it already offers are ignored.",
                "items": {
                  "enum": ["uk", "ru", "en", "pl", "de", "it", "fr", "es", "pt", "nl", "cs", "sk", "hu", "ro", "bg", "lt", "lv", "et", "tr", "sv"],
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["locales"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4de677d36ad06c1b1b06189d5c46403a3abb9117ed9502970ba87362b7aef9ae"
        },
        {
          "name": "add_order_item",
          "title": "Add order item",
          "description": "Add a line item to an existing order by its externalId. Recomputes the order total. Only allowed while the order is pending or confirmed; on any other status (processing and later, cancelled, refunded) it fails with 409 CONFLICT \"Order lines can only be changed while the order is pending or confirmed\". Use list_orders or create_order for the order externalId, and search_products to quote a real product. The CRM recalculates shipping eligibility from the saved priced lines; a separate whole-order discount may require source-confirmed amount correction. The result echoes the operating workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "discount": {
                "default": 0,
                "description": "Percentage discount on this line (0-100). Default 0.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "externalId": {
                "description": "The order externalId returned by list_orders or create_order.",
                "minLength": 1,
                "type": "string"
              },
              "productName": {
                "description": "Line item name, snapshotted onto the order. Use search_products to quote a real catalog product's name. Required.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "quantity": {
                "description": "Quantity ordered (integer, at least 1).",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "sku": {
                "description": "Product SKU snapshot (from search_products). Optional.",
                "maxLength": 120,
                "type": "string"
              },
              "unitPrice": {
                "anyOf": [
                  {
                    "pattern": "^\\d+(\\.\\d{1,2})?$",
                    "type": "string"
                  },
                  {
                    "minimum": 0,
                    "type": "number"
                  }
                ],
                "description": "Price per unit in the order currency, as a decimal (e.g. 199.99). Snapshotted onto the line."
              }
            },
            "required": ["externalId", "productName", "quantity", "unitPrice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:40de2b3b4f0cf62fe286be32f65c76422d238137cb1b9a7df677dc3a64e5e866"
        },
        {
          "name": "add_product_images",
          "title": "Add product images",
          "description": "Add photos to ONE product, after the photos it already has: public https image links (images, each with an optional caption), files the person attached in ChatGPT (files — ChatGPT fills it), or links returned by create_image_upload for files on the agent's own machine. Obriym downloads every image and stores its OWN COPY in the workspace's storage — the link may be temporary and nothing hotlinks to it. Limits: JPEG, PNG or WebP, at most 2 MB each (a bigger file is refused — there is no resize), at most 10 photos per product. All or nothing: if any link fails, or the total would exceed 10, nothing is stored and the reason is returned. Saves through the product form's own operation (version check, audit, channel updates). Not idempotent: repeating the call adds the photos again. Returns the product's full photo list { url, alt } — the first is the main photo. Use get_product first to see the current photos and update_product_images to reorder, caption or remove them. The result echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "files": {
                "description": "Image files the person attached in ChatGPT. ChatGPT fills this field itself; any other client leaves it out and passes image links instead (or uploads files with create_image_upload).",
                "items": {
                  "properties": {
                    "download_url": {
                      "description": "Temporary link ChatGPT gives to the attached file.",
                      "format": "uri",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "ChatGPT's id of the attached file.",
                      "type": "string"
                    },
                    "file_name": {
                      "description": "The attached file's name.",
                      "type": "string"
                    },
                    "mime_type": {
                      "description": "The attached file's type.",
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "images": {
                "description": "Photos to ADD after the product's current ones, in order. The product may hold at most 10 photos in total; a request that would exceed it is refused and nothing is stored.",
                "items": {
                  "properties": {
                    "alt": {
                      "description": "Caption (alt text) of the photo, up to 200 characters. Empty or omitted: the storefront falls back to the product name. Do not invent a description of what you cannot see.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "url": {
                      "description": "A public https image link (JPEG, PNG or WebP, at most 2 MB). Obriym downloads it and stores its own copy in the workspace, so the link may be temporary.",
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "productId": {
                "description": "The product id from search_products or get_product.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["files"]
          },
          "digest": "sha256:d2519c718e5c2c9b0c3d2b4c362a26be632abf90aeeb145d3538b5e867957b26"
        },
        {
          "name": "adjust_stock",
          "title": "Adjust stock",
          "description": "Move a product stock by a relative delta (negative to write off, positive to add) with a reason, and record it in the stock history. This is the correct tool for a correction, a write-off or damage — it never sets an absolute number, so an order committing at the same moment is not overwritten. The reason decides the direction: write_off, damage and return_to_supplier must carry a negative delta, opening_balance a positive one, while correction and other accept either; a delta that contradicts its reason is rejected. Any other word is your own vocabulary and is accepted in either direction. The product must already track inventory; a product that does not returns a conflict rather than having tracking switched on for it. A bundle also returns a conflict: its stock is derived from its components, so adjust each component instead. Pass a stable externalId to make a retry idempotent. The new stock is pushed to every connected sales channel. The result echoes the operating workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "delta": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "externalId": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "note": {
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "productId": {
                "minLength": 1,
                "type": "string"
              },
              "reason": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["delta", "productId", "reason"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b9312cb42fc302d5a452aa6efeaa6389483b68c6ea106cf10768c29c5a8caeb9"
        },
        {
          "name": "apply_bulk_price_change",
          "title": "Apply bulk price change",
          "description": "Apply a bulk price change — step 2 of 2, after preview_bulk_price_change. Send the SAME rule, scope and target and the digest the preview returned, copied verbatim and never invented. The plan is recomputed from live prices and refused with CONFLICT if it no longer matches the digest (prices moved, or the rule would compound on a retry) — preview again and show the person the new numbers. Changes real prices: a selling price reaches connected channels where the owner armed price writes; a purchase cost is never published. Returns { affected, skipped }. Needs the owner's \"AI may change prices in bulk\" switch (Settings → Integrations → Connect AI); without it the call is refused and you should tell the person to ask the owner. Not idempotent for percent rules — never repeat a successful apply. Confirm with the person unless they asked for the change outright. Echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "digest": {
                "description": "The digest returned by preview_bulk_price_change for THIS rule, scope and target — copied verbatim, never invented. If prices moved since, the apply returns CONFLICT and you must preview again.",
                "minLength": 1,
                "type": "string"
              },
              "rule": {
                "description": "HOW prices move. The target 'cost' accepts only op 'percent'. Pick the one that matches the request: a percent change, a fixed price, a markup over cost, a discount (and its end), or the old price.",
                "oneOf": [
                  {
                    "properties": {
                      "op": {
                        "const": "percent",
                        "description": "Raise or lower by a percent.",
                        "type": "string"
                      },
                      "percent": {
                        "description": "Percent change: 10 raises by 10%, -10 lowers by 10%. Between -90 and 900.",
                        "maximum": 900,
                        "minimum": -90,
                        "type": "number"
                      },
                      "rounding": {
                        "description": "How the new price is rounded: cents (to 2 decimals), whole (up to the next whole unit), nine (up to the next price ending in 9, e.g. 644.80 -> 649) or tens (up to the next ten). Everything except cents rounds UP.",
                        "enum": ["cents", "whole", "nine", "tens"],
                        "type": "string"
                      }
                    },
                    "required": ["op", "percent", "rounding"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "amount": {
                        "description": "One price for EVERY product in scope, as a decimal string, e.g. '1290' or '1290.50'. Rare for a whole category — check the preview.",
                        "pattern": "^\\d{1,10}(\\.\\d{1,2})?$",
                        "type": "string"
                      },
                      "op": {
                        "const": "fixed",
                        "description": "Set one price for every product in scope.",
                        "type": "string"
                      }
                    },
                    "required": ["amount", "op"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "markupPercent": {
                        "description": "Markup over the purchase cost, in percent: 40 means price = cost x 1.4. The cost is crossed into the price's currency at the rates the workspace states; a product without a cost or a rate is skipped.",
                        "maximum": 900,
                        "minimum": -90,
                        "type": "number"
                      },
                      "op": {
                        "const": "fromCost",
                        "description": "Price = purchase cost plus a markup.",
                        "type": "string"
                      },
                      "rounding": {
                        "description": "How the new price is rounded: cents (to 2 decimals), whole (up to the next whole unit), nine (up to the next price ending in 9, e.g. 644.80 -> 649) or tens (up to the next ten). Everything except cents rounds UP.",
                        "enum": ["cents", "whole", "nine", "tens"],
                        "type": "string"
                      }
                    },
                    "required": ["markupPercent", "op", "rounding"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "op": {
                        "const": "discount",
                        "description": "Start a sale: the old price becomes the current price (or stays, if a higher one is set) and the price drops by the percent.",
                        "type": "string"
                      },
                      "percent": {
                        "description": "Discount in percent, 1 to 90.",
                        "maximum": 90,
                        "minimum": 1,
                        "type": "number"
                      },
                      "rounding": {
                        "description": "How the new price is rounded: cents (to 2 decimals), whole (up to the next whole unit), nine (up to the next price ending in 9, e.g. 644.80 -> 649) or tens (up to the next ten). Everything except cents rounds UP.",
                        "enum": ["cents", "whole", "nine", "tens"],
                        "type": "string"
                      }
                    },
                    "required": ["op", "percent", "rounding"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "op": {
                        "const": "endDiscount",
                        "description": "End a sale: the price returns to the old price and the old price is cleared.",
                        "type": "string"
                      }
                    },
                    "required": ["op"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "op": {
                        "const": "compareAtMarkup",
                        "description": "Set the old (struck-through) price above the current price by a percent. Does not change the price.",
                        "type": "string"
                      },
                      "percent": {
                        "description": "How far above the price the old price sits, in percent.",
                        "maximum": 900,
                        "minimum": 1,
                        "type": "number"
                      },
                      "rounding": {
                        "description": "How the new price is rounded: cents (to 2 decimals), whole (up to the next whole unit), nine (up to the next price ending in 9, e.g. 644.80 -> 649) or tens (up to the next ten). Everything except cents rounds UP.",
                        "enum": ["cents", "whole", "nine", "tens"],
                        "type": "string"
                      }
                    },
                    "required": ["op", "percent", "rounding"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "op": {
                        "const": "compareAtClear",
                        "description": "Remove the old price. Does not change the price.",
                        "type": "string"
                      }
                    },
                    "required": ["op"],
                    "type": "object"
                  }
                ]
              },
              "scope": {
                "description": "WHICH products. Prefer a named container (category, brand, supplier, warehouse) when the person says 'all products of …' — it is read back by name in the preview. There is no free filter: a request like 'everything cheaper than 100' is not a scope; find the products first and send their ids.",
                "oneOf": [
                  {
                    "properties": {
                      "ids": {
                        "description": "Explicit product ids actually fetched with search_products, at most 100.",
                        "items": {
                          "description": "A product id from search_products.",
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 100,
                        "minItems": 1,
                        "type": "array"
                      },
                      "kind": {
                        "const": "ids",
                        "description": "Specific products you fetched. Prefer a container.",
                        "type": "string"
                      }
                    },
                    "required": ["ids", "kind"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "id": {
                        "description": "The warehouse id returned by list_warehouses.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "kind": {
                        "const": "warehouse",
                        "description": "Every product of one warehouse.",
                        "type": "string"
                      }
                    },
                    "required": ["id", "kind"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "id": {
                        "description": "The category id returned by list_categories.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "includeSubcategories": {
                        "description": "true to include every sub-category under it ('everything under Backpacks'); omit it for exactly that one category. Never widen it unless the person means the whole branch.",
                        "type": "boolean"
                      },
                      "kind": {
                        "const": "category",
                        "description": "Every product of one category.",
                        "type": "string"
                      }
                    },
                    "required": ["id", "kind"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "id": {
                        "description": "The brand id returned by list_brands.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "kind": {
                        "const": "brand",
                        "description": "Every product of one brand.",
                        "type": "string"
                      }
                    },
                    "required": ["id", "kind"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "id": {
                        "description": "The supplier id returned by list_suppliers.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "kind": {
                        "const": "supplier",
                        "description": "Every product of one supplier.",
                        "type": "string"
                      }
                    },
                    "required": ["id", "kind"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "id": {
                        "description": "The model id from get_product (its model block).",
                        "minLength": 1,
                        "type": "string"
                      },
                      "kind": {
                        "const": "model",
                        "description": "Every article of one product model.",
                        "type": "string"
                      }
                    },
                    "required": ["id", "kind"],
                    "type": "object"
                  }
                ]
              },
              "target": {
                "default": {
                  "currency": null,
                  "field": "price"
                },
                "description": "WHICH number moves. Omit it to change the product's own selling price. Use {field:'price', currency:'EUR'} for the euro price list, {field:'cost'} for the purchase cost.",
                "oneOf": [
                  {
                    "properties": {
                      "currency": {
                        "anyOf": [
                          {
                            "pattern": "^[A-Z]{3}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "null (default) = the product's own price in the workspace currency. A 3-letter code = that currency's row of the product's price list (the workspace currency itself means null)."
                      },
                      "field": {
                        "const": "price",
                        "description": "Change the selling price.",
                        "type": "string"
                      }
                    },
                    "required": ["field"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "field": {
                        "const": "cost",
                        "description": "Change the purchase cost (percent only). Not published to channels.",
                        "type": "string"
                      }
                    },
                    "required": ["field"],
                    "type": "object"
                  }
                ]
              }
            },
            "required": ["digest", "rule", "scope"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4a41e965f830f2da4ff506f4e02724120e77b60f02978340dcd94182c1387641"
        },
        {
          "name": "archive_products",
          "title": "Archive products",
          "description": "Archive up to 100 products — this is how an AI client removes a product. It leaves sale and every sales channel's feed, and nothing is erased: update_product with status active or draft restores it. Hard deletion is not available over MCP. A product that a non-archived bundle is made of is NOT archived: it is listed in heldByBundle with the bundles that contain it — archive or change those bundles first. Archiving also asks Prom to take the product's listings down; notAttempted counts takedowns not reached in time. To end a live eBay listing use withdraw_ebay_listings. Returns { affected, skipped, notAttempted, heldByBundle } — skipped products were already archived. Idempotent. The result echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "productIds": {
                "description": "The products to archive, at most 100 ids from search_products.",
                "items": {
                  "description": "A product id returned by search_products.",
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["productIds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:fc9f7acc389a9d4320178493d94a40fdb0206a949c6e4d59ddf060633f1c3558"
        },
        {
          "name": "assign_economic_operators",
          "title": "Assign GPSR companies",
          "description": "Point a brand or a supplier at its GPSR companies: the manufacturer and the EU responsible person (ids from list_economic_operators, or null to clear). Every product of that brand takes them first, then the supplier's. Replaces both roles at once. The result echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "owner: { kind: brand | supplier, id }; manufacturerId and responsiblePersonId: a company id or null.",
            "properties": {
              "manufacturerId": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "owner": {
                "oneOf": [
