                "description": "The order externalId returned by list_orders or create_order.",
                "minLength": 1,
                "type": "string"
              },
              "itemId": {
                "description": "The order item id returned by get_order.",
                "minLength": 1,
                "type": "string"
              },
              "patch": {
                "additionalProperties": false,
                "description": "The order item fields to update; include at least one changed field.",
                "properties": {
                  "discount": {
                    "description": "Percentage discount on this line (0-100). Default 0.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "productName": {
                    "description": "Line item name, snapshotted onto the order. Use search_products to quote a real catalog product's name. Required.",
                    "maxLength": 255,
                    "minLength": 1,
                    "type": "string"
                  },
                  "quantity": {
                    "description": "Quantity ordered (integer, at least 1).",
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  "sku": {
                    "description": "Product SKU snapshot (from search_products). Optional.",
                    "maxLength": 120,
                    "type": "string"
                  },
