        {
          "name": "update_product_images",
          "title": "Reorder, caption or remove product images",
          "description": "Reorder, caption or REMOVE the photos a product already has. Send the photos as they should be afterwards: the order given is the display order (the first is the main photo), each alt replaces the stored caption (empty clears it), and a current photo you leave out is removed from the product (the stored file is kept, exactly as when a person removes a photo in the product form). Returns the new list and how many were removed. It never adds photos: every url must already belong to the product, otherwise the call is refused and nothing changes — use add_product_images to add. Idempotent: the same call twice leaves the same result. Saves through the product form's own operation. Call get_product first and copy the urls exactly. The result echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "images": {
                "description": "The product's photos as they should be AFTER the change: the order given becomes the display order (the first is the main photo) and each alt replaces the stored caption (empty clears it). A current photo you leave out is REMOVED from the product; the stored file is kept, as when a person removes it in the product form. Every url must already belong to the product — to add a photo use add_product_images.",
                "items": {
                  "properties": {
                    "alt": {
                      "description": "Caption (alt text) of the photo, up to 200 characters. Empty or omitted: the storefront falls back to the product name. Do not invent a description of what you cannot see.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "url": {
                      "description": "The url of a photo the product ALREADY has, exactly as get_product returns it.",
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "productId": {
                "description": "The product id from search_products or get_product.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["images", "productId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
