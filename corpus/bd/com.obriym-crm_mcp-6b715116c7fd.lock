            "readOnly": false
          },
          "digest": "sha256:1112c81bac8f689e79332e32fa5cd78373cda323ddc8eee1888eb34c981f8ffb"
        },
        {
          "name": "upsert_brand_translation",
          "title": "Set a brand translation",
          "description": "Set a brand's DESCRIPTION in ONE language, leaving every other language as it is; null or an empty description removes that language. Translate the text yourself — Obriym does not translate for MCP clients. Never translate a brand NAME: marketplaces match it verbatim. Call list_content_locales first; the workspace's base language is refused (use update_brand for it). update_brand's translations field REPLACES the whole set, so use this tool to change a single language. Idempotent. Returns a warning when the CRM does not show that language yet. Echoes the workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brandId": {
                "description": "The brand id returned by list_brands.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 5000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The brand description in this language. null or an empty string clears that language. The brand NAME is never translated."
              },
              "locale": {
                "description": "The language to write, as an ISO 639-1 code. Call list_content_locales for the codes this workspace uses; never the workspace's base language.",
                "enum": ["uk", "ru", "en", "pl", "de", "it", "fr", "es", "pt", "nl", "cs", "sk", "hu", "ro", "bg", "lt", "lv", "et", "tr", "sv"],
                "type": "string"
