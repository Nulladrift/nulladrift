        {
          "name": "create_category",
          "title": "Create category",
          "description": "Create a catalog category, optionally nested under an existing one, with optional description and per-language translations. The slug is normalized to Latin whatever is sent. The parent must exist in this workspace, and a name already used under the same parent is rejected, so call list_categories first to avoid duplicates. To link marketplace categories send marketplaceCategories ({ prom, rozetka, olx, amazon, google_merchant, etsy } with the id as a string, null to clear): look the ids up with search_marketplace_categories first and never guess them. The format is always checked on write, and against the marketplace while it is connected (OLX and Etsy must be a leaf category; a Google id must exist in the Google taxonomy). Translate only the category's own name and description into each locale — add no facts the user did not give. The result is the created category with its id (use it as categoryId for create_product/update_product) and echoes the operating workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "description": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Prose a storefront shows at the top of the category shelf, in the workspace's base language (up to 4000 characters). Send null to clear it."
              },
              "googleProductCategory": {
                "anyOf": [
                  {
                    "maxLength": 255,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Google Product Taxonomy id or full path for this category (for Google Shopping). Prefer marketplaceCategories.google_merchant, which this field is an alias of; send the Google category in one place only. Separate from the name; send null to clear it."
              },
              "marketplaceCategories": {
                "additionalProperties": false,
                "description": "The category's id on each marketplace, keyed by platform. Omit a platform to leave it untouched, send null to clear it. Every value is checked on write (format always; against the marketplace itself while it is connected) — find valid ids with search_marketplace_categories first.",
                "properties": {
                  "amazon": {
                    "anyOf": [
                      {
                        "maxLength": 60,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Amazon product type (e.g. SHOES, HOME_BED_AND_BATH) — the schema Amazon validates every listing of this category against; no Amazon listing can be created without it. Upper-cased on write. While Amazon is connected it is checked against Amazon. Take it from search_marketplace_categories, never guess. Not inherited by subcategories. Send null to clear it."
                  },
                  "etsy": {
                    "anyOf": [
                      {
                        "maxLength": 10,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Etsy seller-taxonomy node id (digits) a listing is created in. Must be a FINAL (leaf) node. Not inherited by subcategories. Send null to clear it."
                  },
                  "google_merchant": {
                    "anyOf": [
                      {
                        "maxLength": 255,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Google Product Taxonomy entry for Google Shopping — the numeric id (e.g. 187). An exact English taxonomy path is accepted and stored as its id. Take it from search_marketplace_categories, never guess. Subcategories without their own value inherit the nearest parent's. Send null to clear it."
                  },
                  "olx": {
                    "anyOf": [
                      {
                        "maxLength": 10,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "OLX category id (digits) that products of this category publish into. Must be a FINAL (leaf) OLX category — OLX refuses an advert in a parent. While OLX is connected it is checked against OLX and its path is stored for display. Take it from search_marketplace_categories, never guess. Not inherited by subcategories. Send null to clear it."
                  },
                  "prom": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Prom.ua rubric id (digits) — exported as <portal_category_id>; Prom refuses an offer without it. Prom publishes no category directory: take the id from search_marketplace_categories (rubrics observed on the merchant's own Prom listings) or from the user, never guess. Not inherited by subcategories. Send null to clear it."
                  },
                  "rozetka": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Rozetka category id (digits) — exported as rz_id, which links this category to Rozetka's tree. Take it from search_marketplace_categories, never guess. Not inherited by subcategories. Send null to clear it."
                  }
                },
                "type": "object"
              },
              "name": {
                "description": "The category name in the workspace's base language, up to 120 characters. Must be unique among categories with the same parent.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "parentId": {
                "anyOf": [
                  {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Id of the parent category from list_categories, to nest this one under it; it must exist in this workspace. Omit or send null for a top-level category."
              },
              "slug": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "URL segment for the category. Normalized to lowercase Latin letters, digits and hyphens whatever is sent (Cyrillic is transliterated); derived from the name when omitted."
              },
              "translations": {
                "description": "Category name (and optional description) per locale. Omit to leave existing translations untouched; when sent it REPLACES the whole set, so an empty array removes them all.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "anyOf": [
                        {
                          "maxLength": 4000,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "locale": {
                      "description": "Content locale, one of the workspace's supported languages.",
                      "enum": ["uk", "ru", "en", "pl", "de", "it", "fr", "es", "pt", "nl", "cs", "sk", "hu", "ro", "bg", "lt", "lv", "et", "tr", "sv"],
                      "example": "en",
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["locale", "name"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:127533eaf5c90175475caa9bcd3ffdfec5d5fd366af244ebcb477a0668afc1fc"
