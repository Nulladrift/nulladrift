        {
          "name": "create_brand",
          "title": "Create brand",
          "description": "Create a catalog brand with optional description, website and per-language description translations. The brand NAME is never translated: marketplaces match the vendor name verbatim, so send it exactly as the vendor is known. The slug is normalized to Latin. A name already used in this workspace is rejected, so call list_brands first to avoid duplicates. Translate only the brand's own description — add no facts the user did not give. The result is the created brand with its id (use it as brandId for create_product/update_product) and echoes the operating workspace.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "description": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Brand description in the workspace's base language (up to 4000 characters). Send null to clear it."
              },
              "name": {
                "description": "The brand name exactly as marketplaces know the vendor, up to 120 characters; unique in the workspace. Never translated.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "URL segment for the brand. Normalized to lowercase Latin letters, digits and hyphens whatever is sent; derived from the name when omitted."
              },
              "translations": {
                "description": "Brand description per locale (the brand NAME is never translated). Omit to leave existing translations untouched; when sent it REPLACES the whole set, so an empty array removes them all.",
