                "minLength": 1,
                "type": "string"
              },
              "modelId": {
                "description": "Assign on this MODEL — shared by every colour and size of it.",
                "minLength": 1,
                "type": "string"
              },
              "productId": {
                "description": "Assign on this one PRODUCT (article).",
                "minLength": 1,
                "type": "string"
              },
              "templateId": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The shipping template: its id or its name from list_amazon_shipping_templates. null removes it so the level below shows through. Omit to leave it as it is."
              }
            },
            "type": "object"
