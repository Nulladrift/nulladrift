        {
          "name": "search_marketplace_categories",
          "title": "Search marketplace categories",
          "description": "Find the category id a marketplace uses, to link it to a catalog category. Read-only. Pass the platform (prom, rozetka, olx, amazon, google_merchant or etsy) and a query, or for OLX, Rozetka and Etsy a parentId to browse one level of the tree (no query and no parentId lists the top level). Sources differ: Google Merchant searches the bundled Google product taxonomy and needs no connection; Etsy searches Etsy's seller taxonomy, shared by every shop; OLX, Rozetka and Amazon ask the marketplace through the connected adapter (connected tells you whether one exists); Prom publishes no category directory, so only rubrics already seen on this merchant's own Prom listings are returned (partial tells you the list may be incomplete, note explains why). OLX and Etsy only accept a LEAF category: check isLeaf and keep browsing with parentId until you reach one. Results are candidates for the USER to choose from: when several fit, show them and ask, never pick one silently. Then pass the chosen id in marketplaceCategories of update_category or create_category.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "parentId": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Browse one level of the marketplace tree under this id (OLX and Rozetka). Omit, together with query, to list the top level."
              },
              "platform": {
                "description": "The marketplace whose categories to look up.",
                "enum": ["prom", "rozetka", "olx", "amazon", "google_merchant", "etsy"],
                "type": "string"
              },
              "query": {
                "description": "Words describing the shelf, e.g. the CRM category's name ('кросівки', 'running shoes'). At least two characters.",
                "maxLength": 150,
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cd3046d73c67d8f9d363b77a9c95e4947e72835d8d4562de34f89518bd20214e"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "List and search catalog products (active unless status says otherwise: draft, archived or any), filtered by text (name or SKU), barcode (barcode or EAN/GTIN) or having none (withoutBarcode), category/brand/collection/model (productGroupId — the other colours and sizes of one model)/size/color/stock/tag/type, by price in a given currency (priceCurrency with minPrice/maxPrice, read through the product's price list) or having no price in it (withoutPriceIn), by being on or off a marketplace channel (channel, onChannel), or by supplier and the supplier's last stock report (supplierId, supplierStock), sorted by name, price, newest or popularity (units sold in the last 90 days), and paginated. Returns each product's catalog fields — price and prices per currency, stock (null when the shop does not count it; see trackInventory), availability, variant fields (productGroupId, color, size, material and the rest), attributes (every characteristic), category, brand — plus its model, warehouse and supplier by name and supplierOffers (what the supplier last said: quantity, restock date, purchase price, state), and pagination { page, perPage, total }. A full row is heavy: pass fields to receive only the parts you read (id is always included). Use get_product to fetch one product's full detail by id or SKU.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "barcode": {
                "description": "Only products whose barcode or EAN/GTIN equals this value (exact; leading zeros are ignored, so a 12-digit UPC finds its 13-digit EAN form). Omit for any.",
                "maxLength": 64,
                "minLength": 6,
                "type": "string"
              },
              "brandId": {
                "default": "",
                "description": "Filter to one brand by its id. Empty string means any brand.",
                "maxLength": 40,
                "type": "string"
              },
              "categoryId": {
                "default": "",
                "description": "Filter to one category by its id. Empty string means any category.",
                "maxLength": 40,
                "type": "string"
              },
              "channel": {
                "description": "A marketplace slug from list_marketplaces. Keeps the ACTIVE products that are on that channel (the same definition list_channel_products uses), or with onChannel=false those that are not. Omit for any.",
                "enum": ["prom", "rozetka", "woocommerce", "shopify", "olx", "amazon", "ebay", "google_merchant", "vinted", "etsy"],
                "type": "string"
              },
              "collection": {
                "default": "",
                "description": "Filter to the products of one collection, by its slug from GET /collections. Only a collection that is visible and in season matches — an unknown, hidden or out-of-season slug is reported as not found, exactly like GET /collections/{slug}. Empty means no collection filter.",
                "maxLength": 120,
                "type": "string"
              },
              "color": {
                "default": "",
                "description": "Filter to products whose color equals this value, ignoring letter case (the product's own color field, not a free-form attribute). Empty means any color.",
                "maxLength": 80,
                "type": "string"
              },
              "fields": {
                "description": "Which parts of each product to return; omit for the full row. `id` is always included. A hundred full rows weigh hundreds of kilobytes (description, translations, attributes, images, supplier offers), so when you only match or list products ask for what you read, for example [\"name\",\"sku\",\"status\",\"price\",\"currency\",\"stock\",\"availability\"]. `prices` is the price per currency, `stock` is null when the shop does not count it (see `trackInventory`), `supplierOffers` is what the supplier last said.",
                "items": {
                  "enum": ["ageGroup", "attributes", "availability", "availableQuantity", "barcode", "brand", "bundleItems", "category", "color", "compareAtPrice", "condition", "countryOfOrigin", "currency", "customFields", "description", "descriptionHtml", "dimensions", "ean", "gender", "images", "keywords", "lowStockThreshold", "material", "minOrderQuantity", "model", "mpn", "name", "pattern", "price", "prices", "productGroupId", "reservedQuantity", "size", "sizeSystem", "sizeType", "sku", "status", "stock", "storefrontVisible", "supplier", "supplierOffers", "tags", "trackInventory", "translations", "type", "uktzed", "unit", "updatedAt", "videos", "warehouse", "warehouseId", "weight"],
                  "type": "string"
                },
                "maxItems": 52,
                "minItems": 1,
                "type": "array"
              },
              "inStock": {
                "default": "",
                "description": "Set \"true\" to return only products with stock available. Empty means include out-of-stock.",
                "enum": ["", "true"],
                "type": "string"
              },
              "maxPrice": {
                "description": "Only products priced at or below this amount — in the workspace currency, or in priceCurrency when you pass it.",
                "minimum": 0,
                "type": "number"
              },
              "minPrice": {
                "description": "Only products priced at or above this amount — in the workspace currency, or in priceCurrency when you pass it.",
                "minimum": 0,
                "type": "number"
              },
              "onChannel": {
                "description": "Used with channel: true (default) = only products on the channel, false = only products NOT on it. Ignored without channel.",
                "type": "boolean"
              },
              "page": {
                "default": 1,
                "description": "1-based page number of results to return. Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "perPage": {
                "default": 20,
                "description": "Number of products per page (1-100). Default 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "priceCurrency": {
                "description": "ISO 4217 code such as EUR. Makes minPrice/maxPrice compare the price the product has in THIS currency (its price list, else its own price when that is its currency) and keeps only products that are sold in it. Without minPrice/maxPrice it simply keeps the products sold in that currency. Omit to compare the workspace-currency price.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "productGroupId": {
                "default": "",
                "description": "Filter to the variants of one model: products whose productGroupId equals this value exactly. It is the merchant's (or supplier's) own model code, so letter case is part of it. Use it to render the other colours and sizes of the product a buyer is looking at. Empty means any model.",
                "maxLength": 120,
                "type": "string"
              },
              "q": {
                "default": "",
                "description": "Free-text search over product name and SKU. Empty for no text filter.",
                "maxLength": 200,
                "type": "string"
              },
              "size": {
                "default": "",
                "description": "Filter to products whose size equals this value, ignoring letter case (the product's own size field). Empty means any size.",
                "maxLength": 60,
                "type": "string"
              },
              "sort": {
                "default": "",
                "description": "Sort order. Empty sorts by name. Allowed: name_asc, name_desc, price_asc, price_desc, newest, popular — popular ranks by units sold in confirmed, processing, ready-to-ship, shipped or delivered orders over the last 90 days. Ties break by name.",
                "enum": ["", "name_asc", "name_desc", "price_asc", "price_desc", "newest", "popular"],
                "type": "string"
              },
              "status": {
                "default": "",
                "description": "Filter by catalog status. Empty keeps the storefront default of active only. Use \"draft\" to find products waiting to be reviewed (marketplace imports and unknown SKUs from orders land there), or \"any\" for every status.",
                "enum": ["", "draft", "active", "archived", "any"],
                "type": "string"
              },
              "stockState": {
                "default": "",
                "description": "Filter by stock state, for products that track inventory. \"low\" returns products at or under their reorder threshold; \"out\" returns products with nothing left. Empty applies no stock-state filter.",
                "enum": ["", "low", "out"],
                "type": "string"
              },
              "supplierId": {
                "description": "Only products bought from this supplier — an id from list_suppliers — or \"none\" for products with no supplier. Omit for any supplier.",
                "minLength": 1,
                "type": "string"
              },
              "supplierStock": {
                "description": "Only products whose supplier feed (e.g. Sipec) last reported this: in_stock (quantity above zero), arriving (none now, a restock date given), out_of_stock (none, no date), unknown (the supplier has not said). Omit for any.",
                "enum": ["in_stock", "arriving", "out_of_stock", "unknown"],
                "type": "string"
              },
              "tag": {
                "default": "",
                "description": "Filter to products carrying this tag. Empty means any tag.",
                "maxLength": 100,
                "type": "string"
              },
              "type": {
                "default": "",
                "description": "Filter by product type. Empty for any; \"simple\" or \"bundle\".",
                "enum": ["", "simple", "bundle"],
                "type": "string"
              },
              "warehouseId": {
                "default": "",
                "description": "Filter to products in one warehouse by its id, from the warehouse list. Use \"none\" for products assigned to no warehouse — they match no id, so nothing else surfaces them. Empty means any warehouse. An id absent from this workspace is reported as an error, never as an empty result.",
                "maxLength": 40,
                "type": "string"
              },
              "withoutBarcode": {
                "description": "true = only products with neither a barcode nor an EAN/GTIN — the ones a marketplace refuses without an exemption. Omit for any.",
                "type": "boolean"
              },
              "withoutPriceIn": {
                "description": "ISO 4217 code such as EUR. Only products with NO price in this currency (no price-list row and it is not their own currency) — the ones a store in that currency cannot sell. Omit for any.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc1273d361418fee15078e846fabea7423f46017f4aea0766a14706fc05da49e"
        },
        {
          "name": "select_workspace",
          "title": "Select workspace",
          "description": "Re-bind this OAuth connection to the workspace selected by the user. Takes effect on the next tool call. Use the organizationId returned by list_workspaces or by WORKSPACE_SELECTION_REQUIRED; never invent or guess it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "organizationId": {
                "description": "The workspace organizationId chosen by the user from list_workspaces or WORKSPACE_SELECTION_REQUIRED.",
                "minLength": 1,
