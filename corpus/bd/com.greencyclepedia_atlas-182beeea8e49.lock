              "names": {
                "description": "Compound, terpene, receptor or condition names or ids, for example [\"cbd\", \"myrcene\", \"CB1\", \"epilepsy\"]. At most 20 are answered, in this order.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
