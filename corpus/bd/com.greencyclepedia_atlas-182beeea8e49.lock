        {
          "name": "get_pain_pathway",
          "title": "Follow a pain signal from the fingertip to the brain",
          "description": "Use when asked how pain, a burn, chili heat, menthol cool or touch is felt, where a pain signal travels, or which receptors and brain parts are on the way. The route from the index fingertip to the brain in 8 stops (skin receptor, nerve fibre, dorsal root ganglion, spinal dorsal horn, spinothalamic tract, thalamus, cortex and the descending control from the periaqueductal gray), for one stimulus (heat, capsaicin, irritant, cool or touch) or all. Each stop gives its body structures (Greencyclepedia and Z-Anatomy, CC BY-SA 4.0), receptors with measured RNA where one exists (Human Protein Atlas, CC BY 4.0; RNA, not protein), a plain line in English or German, a verdict, the evidence rungs (people, animals, cells, proposed only) with species and the PubMed studies, each labelled by how it was done, the line where studies differ, and the actions of compounds (capsaicin, menthol, mustard oil, THC, CBD, CB2 and NK1 drug classes) with the studies that support, differ or find no clear effect. Gaps and what not to claim come back as such; a stop no study was read for is anatomy only. Illustration of published research, never a diagnosis, dose or treatment advice. Educational reference, not medical advice. No doses. Example arguments: {\"stimulus\":\"capsaicin\",\"site\":\"fingertip\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the plain lines: en or de.",
                "enum": ["en", "de"],
                "type": "string"
              },
              "site": {
                "description": "Where on the body. Only the index fingertip route is saved, and it is the default; another place gets a note.",
                "maxLength": 40,
                "type": "string"
              },
              "stimulus": {
                "description": "What starts the signal: heat, capsaicin, irritant, cool or touch (chili, mustard, menthol and pressure also work). Leave out for every stimulus; an unknown one gets the whole route and a note.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
