        {
          "name": "find_studies",
          "title": "Find the studies behind a finding",
          "description": "Use when asked \"what is the evidence\" or \"which studies\". The PubMed studies Greencyclepedia cites for a compound, a target, a condition or a compound at one target, each with its PubMed link, what it supports (an effect at a target, a binding value, a caution, a systematic review or a trial as administered) and the Greencyclepedia record it belongs to, a quality label for each (how the study was done, a band from stronger to early, and the rule; sort strongest puts the strongest designs first), plus the PubMed search behind each record. Doses are left out on purpose. Educational reference, not medical advice. Example arguments: {\"compound\":\"cbd\",\"condition\":\"epilepsy\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "A compound id or name, for example \"cbd\".",
                "maxLength": 120,
                "type": "string"
              },
              "condition": {
                "description": "A condition, for example \"epilepsy\".",
                "maxLength": 120,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many items to return, at most 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Or a plain phrase, for example \"cbd epilepsy\" or \"studies on CB1\": the compound, target and condition it names are used.",
                "maxLength": 120,
                "type": "string"
              },
              "sort": {
                "description": "relevance (default) or strongest (strongest study design first).",
                "enum": ["relevance", "strongest"],
                "type": "string"
              },
              "target": {
                "description": "A target, for example \"TRPV1\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
