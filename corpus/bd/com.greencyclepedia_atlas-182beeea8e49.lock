        {
          "name": "search",
          "title": "Search Greencyclepedia",
          "description": "Use when you do not know the exact name or id, or want to see what Greencyclepedia holds on a topic. Search all of Greencyclepedia by any name: cannabis compounds (THC, CBD, CBG, terpenes, flavonoids), receptors and enzymes (CB1, CB2, TRPV1, 5-HT1A, FAAH), medical conditions with an evidence grade (epilepsy, chronic pain, sleep) and registered clinical trials. Returns results with id, title and url; pass an id to fetch for the full sourced record. Educational reference, not medical advice. Example arguments: {\"query\":\"cannabidiol\"}.",
