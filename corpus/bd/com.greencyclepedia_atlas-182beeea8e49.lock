        {
          "name": "list_brain_regions",
          "title": "List brain regions",
          "description": "Use when asked where in the brain a receptor sits or a condition is linked, which brain regions have the most CB1, or what the parts of a region are. Lists brain regions (divisions, regions, sub-regions) in the order of the hierarchy, by name, by studies, by RNA level or by PET binding, with three kinds of value kept apart for one receptor (CB1 unless you name another): measured PET binding in living people (8 regions, one study), RNA level from the Human Protein Atlas (RNA, not protein; partOf true means the value is for a larger region), and a 0 to 4 teaching scale (a summary, not a measurement). Filter by query, parent (its direct parts), receptor or condition. Gaps come back as gaps. Studies differ on how daily cannabis use changes CB1; get_brain_region says where. Sources: Human Protein Atlas (CC BY 4.0), Terry et al. 2009 (PMID 19573609), PubMed counts, Z-Anatomy (CC BY-SA 4.0). Educational reference, not medical advice. No doses. Example arguments: {\"receptor\":\"CB1\",\"sort\":\"pet\",\"limit\":5}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "condition": {
                "description": "A condition id or name, for example epilepsy: only regions whose record lists it (10 regions have conditions).",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many items to return, at most 60.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "parent": {
                "description": "A region id or name: only its direct parts are listed, for example \"amygdala\" or \"cerebral_cortex\".",
                "maxLength": 120,
                "type": "string"
              },
              "query": {
                "description": "Part of a region name in English or German, or its id, for example \"amygdala\" or \"Hippocampus\".",
                "maxLength": 120,
                "type": "string"
              },
              "receptor": {
                "description": "A receptor, channel or enzyme with a value in the brain regions, for example CB1, CB2, TRPV1, FAAH or 5-HT1A (its gene name also works). Regions with no value for it are left out and counted.",
                "maxLength": 40,
                "type": "string"
              },
              "sort": {
                "default": "hierarchy",
                "description": "hierarchy (the order of the file), name, studies (most PubMed studies first), rna (highest RNA level of the receptor first) or pet (highest measured binding first).",
                "enum": ["hierarchy", "name", "studies", "rna", "pet"],
                "type": "string"
              }
            },
            "type": "object"
          },
