        {
          "name": "lookup_many",
          "title": "Look up many names at once",
          "description": "Use when you have several compound, terpene, receptor or condition names and want each checked in one call instead of one call per name. Send 1 to 20 names or ids; each answer comes back in the same order as a short record summary (id, kind, title, link, cite_as and a one line summary) or as a soft miss with a did-you-mean. One unknown name never fails the call; names after the 20th are left out with a note. Compounds, terpenes, receptors and conditions only: a product or strain together with a condition gets the soft refusal for that one name. Educational reference, not medical advice. No doses. Example arguments: {\"names\":[\"cbd\",\"myrcene\",\"CB1\",\"epilepsy\"]}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
