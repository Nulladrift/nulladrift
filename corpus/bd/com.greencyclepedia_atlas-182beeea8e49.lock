        {
          "name": "search_compounds",
          "title": "Search compounds",
          "description": "Use when you need a list of cannabis compounds, for example every compound at CB2 or every terpene. Find the compounds mapped onto the human body (curated Greencyclepedia records and database compounds with a measured, sourced value at a target placed in tissue) by name, chemical class, record type or molecular target (for example every compound acting at CB2, TRPV1, 5-HT1A or FAAH, or every terpene). Returns identity, PubChem CID, record type, targets and the Greencyclepedia url. Use get_compound for one full record. Educational reference, not medical advice. Example arguments: {\"target\":\"CB2\",\"limit\":10}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "class": {
                "description": "Chemical class.",
                "enum": ["cannabinoid", "terpene", "flavonoid", "metabolite", "phenolic", "fatty"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many items to return, at most 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a name or identifier, for example \"cannabidiol\", \"CBD\", \"thymol\" or \"CDB000032\". Leave out to list all.",
                "maxLength": 120,
                "type": "string"
              },
              "recordType": {
                "description": "curated (Greencyclepedia records with reviewed effects and grades) or database (compounds with a measured value at a placed target).",
                "enum": ["curated", "database"],
                "type": "string"
              },
              "target": {
                "description": "A receptor, channel or enzyme by name or gene, for example \"CB2\", \"CNR1\" or \"PPAR-gamma\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
