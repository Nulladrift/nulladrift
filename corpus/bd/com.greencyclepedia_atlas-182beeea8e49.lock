          "description": "Use when asked \"THC versus CBD\" or a similar comparison. Two to four compounds side by side, target by target, with each action, evidence grade, measured binding values and PubMed identifiers, the targets they share and the Greencyclepedia comparison page when one exists. Educational reference, not medical advice. Not a ranking of which is better for anyone. Example arguments: {\"ids\":[\"thc\",\"cbd\"]}.",
