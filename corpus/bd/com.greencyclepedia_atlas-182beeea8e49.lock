        {
          "name": "list_new_studies",
          "title": "List new cannabis studies",
          "description": "Use when asked what cannabis research was published or entered in PubMed lately, or whether a new study exists on a topic. The newest cannabis, cannabinoid, cannabidiol and THC studies from PubMed, by PubMed entry date, newest first, each sorted by kind of evidence (people, animals, cells, review, other) with the rule that decided it, and matched to the Greencyclepedia compounds, conditions and body parts. Every study carries a quality label (how it was done, a band from stronger to early, and the rule); sort strongest puts the strongest designs first. A study in animals or cells always says so in note. Filter by since (entry date), kind, topic, compound, condition or no_home. Source: PubMed (National Library of Medicine), with PMID links. Titles only, no abstracts, no doses. Educational reference, not medical advice. Example arguments: {\"kind\":\"animals\",\"limit\":5}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
