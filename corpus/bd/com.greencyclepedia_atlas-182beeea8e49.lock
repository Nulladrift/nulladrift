        {
          "name": "list_trials",
          "title": "List registered trials",
          "description": "Use when asked about clinical trials. Registered trials from the Greencyclepedia snapshot of ClinicalTrials.gov (trials whose intervention is named cannabis, a cannabinoid, cannabidiol, THC or a related medicine): identifier, title, status, phase, enrolment, conditions, countries, start date, the Greencyclepedia compounds involved and the registry link, newest snapshot first. Intervention names that state an amount are left out. Titles are third party text. Educational reference, not medical advice. Example arguments: {\"query\":\"epilepsy\",\"limit\":5}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "Greencyclepedia compound id or name, for example \"cbd\".",
                "maxLength": 120,
                "type": "string"
              },
              "condition": {
                "description": "Greencyclepedia condition id, name or other name, for example \"cancer\", \"glioblastoma\" or \"sleep\": the trials Greencyclepedia counts for that condition (only conditions with a tally; the answer says when there is none).",
                "maxLength": 120,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many items to return, at most 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many matching trials (for paging).",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "phase": {
                "description": "Phase as registered.",
                "enum": ["EARLY_PHASE1", "PHASE1", "PHASE2", "PHASE3", "PHASE4", "NA"],
                "type": "string"
              },
              "query": {
                "description": "Words in the title, the conditions or the MeSH terms, for example \"epilepsy\" or \"chronic pain\".",
                "maxLength": 120,
                "type": "string"
              },
              "status": {
                "description": "Overall status as registered.",
                "enum": ["RECRUITING", "NOT_YET_RECRUITING", "ENROLLING_BY_INVITATION", "ACTIVE_NOT_RECRUITING", "COMPLETED", "TERMINATED", "SUSPENDED", "WITHDRAWN", "UNKNOWN", "AVAILABLE", "NO_LONGER_AVAILABLE", "APPROVED_FOR_MARKETING"],
                "type": "string"
              }
            },
            "type": "object"
