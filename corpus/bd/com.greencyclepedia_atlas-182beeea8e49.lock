          "digest": "sha256:2319b195632b02ba00078db667f4b628768e24374b82822316ca20297d9ee351"
        },
        {
          "name": "check_claim",
          "title": "Check the evidence behind one sentence",
          "description": "Use when you hold one sentence about cannabis and want to know what evidence our records hold behind it, for example \"CBD helps with epilepsy\" or \"beta-caryophyllene reduces inflammation\". It finds the compounds, conditions and receptors the sentence names and returns the records it matched, the studies in our records counted by kind (human trial, human observational, animal, cell, review) with the best five and their citations, and one plain level made from the counts alone: human trials found, human studies without trials, only animal or cell studies, or no studies in our records. It never says a sentence is true, safe or effective. A product or strain is refused, and an amount in the sentence is removed, never judged. Educational reference, not medical advice. No doses. Example arguments: {\"claim\":\"CBD helps with epilepsy\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claim": {
                "description": "One sentence that names a compound, a condition or a receptor, in English or German, for example \"CBD helps with epilepsy\" or \"Myrcen macht müde\".",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["claim"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
