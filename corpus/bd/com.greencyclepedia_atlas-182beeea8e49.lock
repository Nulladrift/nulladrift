        {
          "name": "search_conditions",
          "title": "Search conditions by evidence grade",
          "description": "Use when asked \"does cannabis help with ...\". Conditions on the Greencyclepedia evidence ladder (substantial, moderate, limited, insufficient, evidence of no benefit): the grade and why, the systematic reviews and trials behind it by PubMed identifier, the compounds and body structures involved and the Greencyclepedia page. Trials are kept as administered in each trial; doses are left out on purpose. Educational reference, not medical advice. Not a diagnostic or dosing tool. Example arguments: {\"query\":\"sleep\"}.",
