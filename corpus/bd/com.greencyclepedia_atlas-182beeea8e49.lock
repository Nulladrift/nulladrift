        {
          "name": "get_compound",
          "title": "Get a compound",
          "description": "Use when asked \"what does THC, CBD or myrcene do in the body\". The full record of one mapped compound by Greencyclepedia id, Cannabis Compound Database id, name or PubChem CID. A curated record gives identity and structure identifiers, every target with the action, effect, evidence grade, body structures and PubMed identifiers, the measured binding values (pKi, pIC50, pEC50) from the IUPHAR/BPS Guide to PHARMACOLOGY, the cultivars a laboratory measured it in with their sources, an evidence summary, its cautions and a ready citation. A database compound gives its identity and every measured value at a placed target with its PubMed id or DOI. The view object links the 3D page, a still picture and a drawing of the compound. Educational reference, not medical advice. No doses. Example arguments: {\"id\":\"cbd\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
