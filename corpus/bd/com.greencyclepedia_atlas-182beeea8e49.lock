        {
          "name": "get_brain_region",
          "title": "Get one brain region",
          "description": "Use when you have the id or name of one brain region (from list_brain_regions) and want everything the saved data holds on it. One region in full: where it sits in the hierarchy and its parts, a plain description in English and German, every measured PET value, every RNA level of 12 receptors and enzymes with its band, the 0 to 4 teaching scale, studies that differ stated as such, the compounds and conditions Greencyclepedia lists for it, the PubMed study count, the gaps in plain words and every credit line (Human Protein Atlas CC BY 4.0, the published PET paper, Z-Anatomy CC BY-SA 4.0, PubMed counts). Measured, RNA and teaching values are labelled and never mixed; a part never inherits a value from its parent. Educational reference, not medical advice. No doses. Example arguments: {\"id\":\"hippocampus\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A region id or name in English or German, for example \"hippocampus\", \"amygdala\" or \"Hippocampus\".",
