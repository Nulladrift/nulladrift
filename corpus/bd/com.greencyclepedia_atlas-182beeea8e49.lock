        {
          "name": "get_compound",
          "title": "Get a compound",
          "description": "Use when asked \"what does THC, CBD or myrcene do in the body\". The full record of one mapped compound by Greencyclepedia id, Cannabis Compound Database id, name or PubChem CID. A curated record gives identity and structure identifiers, every target with the action, effect, evidence grade, body structures and PubMed identifiers, the measured binding values (pKi, pIC50, pEC50) from the IUPHAR/BPS Guide to PHARMACOLOGY, the cultivars a laboratory measured it in with their sources, an evidence summary, its cautions and a ready citation. A database compound gives its identity and every measured value at a placed target with its PubMed id or DOI. Educational reference, not medical advice. No doses. Example arguments: {\"id\":\"cbd\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Greencyclepedia id (\"thc\", \"bcp\"), database id (\"CDB000032\"), name (\"Beta-caryophyllene\", \"Thymol\") or PubChem CID (16078 or \"CID 16078\").",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db7a99335c878d0737000f2609047431f76aeab7a990c0c2b1908fbc953de4dd"
        },
        {
          "name": "get_cultivar",
          "title": "Get a measured cultivar",
          "description": "Use when asked about the chemistry of a strain or cultivar. One cultivar from the laboratory measurements Greencyclepedia uses (Cannabis Compound Database values, mg per gram of dry flower), by CCD id or name: every Greencyclepedia compound measured in it with the mean, the number of values and the PubMed identifier of each source. Cultivar names are a poor guide to chemistry (PMID 35588111, PMID 39137353); never the community strain index. Educational reference, not medical advice. Example arguments: {\"id\":\"STRAIN0001\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "CCD cultivar id (\"STRAIN0001\") or name (\"8-Ball Kush\").",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
