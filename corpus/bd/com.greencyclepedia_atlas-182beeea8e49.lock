        {
          "name": "fetch",
          "title": "Fetch one record",
          "description": "Use when search has returned an id and you want the whole record. The full text of one Greencyclepedia record by the id that search returned (\"compound:cbd\", \"target:CB1\", \"condition:epilepsy\", \"trial:NCT03883360\", \"cultivar:STRAIN0001\"): what it is, the targets and effects with evidence grades, measured binding values, cautions, every source (PubMed ids with links) and the citation line, with the Greencyclepedia url. Educational reference, not medical advice. No doses. Example arguments: {\"id\":\"compound:cbd\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A record id from search, for example \"compound:cbd\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
