      "instructions": "Tra cứu font hiển thị đủ dấu tiếng Việt, từ kết quả kiểm thật 134 ký tự. Check Vietnamese diacritics support of fonts and get font recommendations.",
      "tools": [
        {
          "name": "goi_y_font_tieng_viet",
          "description": "Gợi ý font tiếng Việt đã kiểm, hạng A trước rồi B. vai_tro: tieu_de, than_bai, so, serif, display, script hoặc mono (tuỳ chọn). tinh_huong: mô tả ngắn như slide, thiệp, dashboard, video (tuỳ chọn), nếu khớp sẽ trả cặp font tiêu đề/thân bài/số kèm cỡ chữ. chi_giay_phep_mo: mặc định true, chỉ font giấy phép mở. Recommend Vietnamese-safe fonts by role or situation (open-licence fonts by default). Kết quả kèm quy_tac và luu_y. Results come from a real 134-character test and include rules and a disclaimer.",
          "inputSchema": {
            "properties": {
              "chi_giay_phep_mo": {
                "default": true,
                "title": "Chi Giay Phep Mo",
                "type": "boolean"
              },
              "tinh_huong": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Tinh Huong"
              },
              "vai_tro": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Vai Tro"
              }
            },
            "title": "goi_y_font_toolArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "goi_y_font_toolDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d39cc11f898c116808de1084e31c5bdcde90e5a37c5a6081b6d43a9d6e6570c9"
        },
        {
          "name": "kiem_tra_font_tieng_viet",
          "description": "Kiểm tra một font có hiển thị đủ dấu tiếng Việt không (đã thử 134 ký tự). ten_font: tên font, không phân biệt hoa thường. ket_luan: dung_tot (hạng A), dung_duoc (B), co_dieu_kien (C), cam, ten_gia (font đổi tên giả), chua_kiem (chưa có dữ liệu, không đoán). Check whether a font fully supports Vietnamese diacritics (134 characters tested); returns a verdict and replacement suggestions. Kết quả kèm quy_tac và luu_y. Results come from a real 134-character test and include rules and a disclaimer.",
          "inputSchema": {
            "properties": {
              "ten_font": {
                "title": "Ten Font",
                "type": "string"
              }
            },
            "required": ["ten_font"],
