        },
        {
          "name": "generate_fixes",
          "description": "Get the paste-ready patches Grounded AEO generated from its own measurements of a cataloged domain: per-page <title>/<meta description> blocks for pages the crawl flagged, robots.txt Allow lines for AI crawlers measured as blocked, FAQPage/Organization JSON-LD built from published verified facts, and an /llms.txt file. Every line is the site's own text, the owner's published facts, or a measurement — no language model wrote any of it, and a patch that could not be built honestly is skipped and counted rather than guessed. USE THIS TO ACT: if you have write access to the site's codebase, apply each patch to the file that serves its path, then re-run run_audit to confirm. Claimed domains only; deterministic and read-only on our side.",
          "inputSchema": {
            "properties": {
