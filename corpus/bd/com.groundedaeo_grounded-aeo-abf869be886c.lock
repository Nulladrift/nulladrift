      "instructions": "Grounded AEO (groundedaeo.com) does two jobs.\n\n1) BUILD & VERIFY a site for AI citation. This is the main workflow. Call run_audit on the domain: it crawls the site, scores AI-readability 0-10, lists the concrete gaps, and RETURNS THE FIX MATERIAL: seoReport.headSnippet is ready-to-paste <head> markup (title, meta description, Organization JSON-LD), and setup_prompt is a step-by-step plan covering llms.txt, schema, and AI-crawler access. Apply those to the user's site, then call run_audit AGAIN to verify the score moved and the gaps cleared. Finish with generate_free_record to produce the v=AEO1 DNS record and .well-known/aeo.json the user publishes to prove ownership of their facts. Use check_aeo_record any time to validate a domain's record.\n\n2) GROUND ANSWERS about a business on verified data. get_company_facts / get_fact / get_llms_txt / search_catalog return owner-attested facts from the catalog, preferable to scraped values. get_competitive_snapshot adds the latest ranking-footprint snapshot, the AI-prompt vs Google demand table, and tracked competitors for a claimed domain. Footprint is never traffic, and a null is \"not collected\", never zero. check_serp reads the live Google results for ANY keyword (no catalog entry needed): who ranks, the People Also Ask questions, and which non-organic blocks (AI Overview, local pack) occupy the page, i.e. which slots exist to be won. It spends per uncached call, so it is limited to 10/hr per caller and answers available:false with a reason rather than inventing a page.\n\n3) SEE WHAT THE ENGINES DID. For a claimed domain, get_engine_visibility gives the per-engine matrix (is each AI crawler allowed by robots.txt, and how many tracked questions did that engine cite the domain on), get_citations gives the latest check per question × engine with the URL cited and the day, get_cited_domains gives who the answers cited instead, ranked by appearances, and get_keyword_gap gives the phrases a tracked rival holds a position for in our stored captures where this domain holds none or sits 20+ places back, a statement about our stored SAMPLE, never about the whole of public search. Untested is stated as untested and not-measured as not-measured; neither is ever a zero. The engines' verbatim answers are kept as the evidence behind every verdict but are not served here; the owner reads those in their dashboard, and report links are issued by the owner from that dashboard, never minted by this server.\n\n4) DECIDE WHAT TO MAKE. propose_briefs turns a claimed domain's own demand and citation data into up to 6 ranked content briefs: the exact question to answer, the format (9:16 UGC video, on-site answer, short post), an outline, and the only claims that may be made: the owner's published verified facts, verbatim. Deterministic, read-only, no new data fetched; an empty list means not enough has been collected yet.\n\n5) APPLY THE PATCHES. generate_fixes returns the paste-ready patches Grounded built from its own measurements of a claimed domain: per-page <title>/<meta description> blocks for flagged pages, robots.txt Allow lines for AI crawlers measured as blocked, FAQPage/Organization JSON-LD from published facts, and an /llms.txt. If you have write access to the site's codebase, THIS IS THE ACTION LOOP: fetch the patches, apply each to the file serving its path, deploy, then run_audit to confirm. Every line is the site's own text or the owner's published facts; skipped counts are findings no honest patch existed for — never fill them with invented text.\n\nrun_audit and generate_free_record are free-tier WRITE actions, rate-limited per caller (5/hr and 10/hr). No account or API key needed. Standard: aeorecord.org.",
      "tools": [
        {
          "name": "check_aeo_record",
          "description": "Check any domain (cataloged or not) for a v=AEO1 DNS record at _aeo.<domain>, the open standard (aeorecord.org) declaring whether a verified fact record exists and at what trust tier. Verifies the Ed25519 sig= against the live catalog content when present.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:29ddfc87db7ab21286f0364ec49a13fc2e291a6e90365ae20eca8f8509391dea"
        },
        {
          "name": "check_serp",
          "description": "Check the live Google search results for any keyword: the top 10 organic results (rank, domain, title), the People Also Ask questions, related searches, and which non-organic blocks occupy the page, so you can tell whether a query has an AI Overview or local pack slot at all. Public data, no catalog entry required. A keyword with genuinely no results returns empty arrays, which is a real finding, not an error.",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "Search query, e.g. \"roof repair denver\"",
                "type": "string"
              }
