        {
          "name": "confirm_publish",
          "title": "Confirm and publish",
          "description": "Step two of two. Spends the confirmation_token from publish_pages and makes each page in the summary in App Store Connect, one job for each page. Returns the jobs: call get_job for each.\nCall it only after the person has seen the summary and the preview links from publish_pages and has said yes, in their own words, to publishing those pages. If they asked for a change, make it and call publish_pages again. This is hard to undo: a page can be taken back in the web app only until it is submitted for review.\nNothing is submitted for review: the developer submits each page to Apple in App Store Connect. The default product page, the keyword field, the app binary, pricing and in-app purchases are not changed. A page that changed after the summary refuses the whole confirmation and nothing is sent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirmation_token": {
                "description": "The confirmation_token publish_pages returned, starting pfc_.",
                "type": "string"
              }
            },
            "required": ["confirmation_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "visibility": ["model"]
            }
          },
          "digest": "sha256:5ad692c079aca8b60ce6144b0bd2afbce1365a64d9015cf0dbad478da6542be6"
