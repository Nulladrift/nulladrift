        {
          "name": "analyze_app",
          "title": "Analyze an app",
          "description": "Reads an iOS app from its App Store link or id and says what Pagefully understood of it. Call this first.\nSigned in (OAuth or a Pagefully token): adds the app to the workspace (no App Store Connect key is needed to plan and make pages) and returns the app, with its app_id, its brief (what the app does, who it is for and how it sounds) and its screens. \"screens\" is the app's own source screenshots as Pagefully holds them, in order: each with its position, its picture at display size (url), and what Pagefully read on it (read: the headline and subline the developer drew on it, and \"design\", which is \"theirs\" for a designed screenshot a page keeps and only rewords, or \"ours\" for a bare screen a page puts in Pagefully's own design). Compare a page against these, not against another page. An app that is not on the public App Store says so in app.listing.note, with where its facts came from: repeat that sentence, and do not look the app up elsewhere. Reading a new app takes a while, so the first call may return a job_id and no brief: call get_job with it until it is done, then call analyze_app again with app_id. Called with app_id it only reads. Called with nothing it lists the apps on the workspace.\nNot signed in: returns the free public preview of that app, the pages Pagefully would plan for it and the first one designed, with a preview_url. While state is \"making\", call again with the same app in a few seconds. This works on public App Store data only and is limited for each visitor.\nShow the person the brief (or the preview_url) and ask whether it is right before planning. Never guess an App Store id: ask for the link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app_id": {
                "description": "The app's id in Pagefully, for an app already on the workspace. Reads only.",
                "type": "string"
              },
              "app_store_id": {
                "description": "Apple's id for the app: the number at the end of its App Store address.",
                "type": "string"
              },
              "app_store_url": {
                "description": "The app's address on the App Store, which ends in id and a number: https://apps.apple.com/us/app/name/id1234567890",
                "type": "string"
              },
              "screens": {
                "description": "false leaves the app's source screens out of the answer.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
