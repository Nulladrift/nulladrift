                "description": "Approve the page as it now stands. Only after the person has seen the preview and said yes.",
                "type": "boolean"
              },
              "changes": {
                "description": "Several screenshots of this page in one call: one item for each, with its position or slot_id and what to change. In place of the single form, not with it.",
                "items": {
                  "properties": {
                    "design": {
                      "enum": ["ours", "theirs"],
                      "type": "string"
                    },
                    "headline": {
                      "type": "string"
                    },
                    "position": {
                      "description": "Which screenshot, by its place on the page.",
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "screen": {
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "slot_id": {
                      "description": "Which screenshot, by its id from preview_page.",
                      "type": "string"
                    },
                    "style": {
                      "anyOf": [
                        {
                          "enum": ["clean", "bold", "soft", "night", "lift", "closeup"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "subline": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "design": {
                "description": "Whose design this screenshot is drawn in. \"ours\": the app's screen in Pagefully's own design, where a headline and a style both apply. \"theirs\": the developer's own design, with only its words changed. It is kept for that screen on every page of the app. Only when the person asks.",
                "enum": ["ours", "theirs"],
                "type": "string"
              },
              "headline": {
                "type": "string"
              },
              "own_words": {
                "description": "With approve: approve even though some screenshots still show the developer's own words. Only when the person says so.",
                "type": "boolean"
              },
              "page_id": {
                "description": "The page's id (a UUID), as generate_pages, get_job or propose_plan returned it.",
                "type": "string"
              },
              "position": {
                "description": "Which screenshot, by its place on the page. 1 is the first.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "regenerate": {
                "description": "Have Pagefully make it again. \"page\" is the whole page and needs no position. Counts against the month's rewrites.",
                "enum": ["headline", "background", "screen", "page"],
