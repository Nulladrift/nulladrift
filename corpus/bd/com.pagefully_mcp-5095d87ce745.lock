        {
          "name": "score_screenshots",
          "title": "Score screenshots against the Index",
          "description": "Reads a set of screenshots with the App Screenshot Index's own reader and holds it against a category: each screenshot comes back with the same tactic keys search_screenshots uses (with label and group), its words and its colour, and each notable tactic comes back with whether the set has it, which screenshots carry it, and what share of the category's top 100 apps, of its top ten and of the rest have it. Use it to turn \"how does this set compare\" from your reading of pictures into a measurement. Needs sign-in (generate scope).\nSay which set with one of: page_id (a page made here: its drawn screenshots, which is how you measure a new set), app_id (an app on the workspace: the screenshots of its listing as Pagefully holds them, which is the baseline, and works for an app that is not on the public App Store), or app_store_url or app_store_id (any public App Store app). Pictures cannot be handed to this tool: to measure a design, make the page with generate_pages and send its page_id.\nFor the old set against the new, send the new set and put the old one in baseline, such as page_id with baseline { app_id }. The answer then has \"changes\": the tactics gained, dropped and kept, each with the screenshots that carried it before and after and the category's numbers, so nothing has to be worked out by eye.\nThe category is the app's own unless you name one with category (a slug from search_screenshots). Where the Index does not hold the app's category the screenshots are still tagged, with no comparison, and category_note says why.\nReading costs, so it is metered: a picture is read once and kept, and a workspace can have 60 new screenshots read a day, 10 for a set at most. If any screenshot has not been read yet the answer is a job_id and no tags: call get_job until it is done, then call score_screenshots again with the same arguments. A set read before answers at once. Do not call it in a loop, and after edit_page score a page again only when the person wants the new measurement.\nThere is no score out of a hundred, on purpose. The numbers describe what the leading apps do. They do not show that a tactic causes installs or rank, so say \"most top Finance apps do this and this set does not\", never \"adding this will raise installs\". A tactic the set lacks is an observation for the person to weigh, not a fault to fix unasked. Another app's words and name never go into a page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app_id": {
                "description": "An app on the workspace, by its id in Pagefully: the iPhone screenshots of its listing, as Pagefully holds them, are the set.",
                "type": "string"
              },
              "app_store_id": {
                "description": "A public App Store app, by Apple's id for it.",
                "type": "string"
              },
              "app_store_url": {
                "description": "A public App Store app, by its address, which ends in id and a number.",
                "type": "string"
              },
              "baseline": {
                "description": "A second, older set to compare the first with, named the same way: one of page_id, app_id, app_store_url or app_store_id. The answer then says what changed.",
                "properties": {
                  "app_id": {
                    "type": "string"
                  },
                  "app_store_id": {
                    "type": "string"
                  },
                  "app_store_url": {
                    "type": "string"
                  },
                  "page_id": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "category": {
                "description": "The category to compare with: a slug from search_screenshots, such as health-fitness, finance or music. Leave it out for the app's own.",
                "type": "string"
              },
              "page_id": {
                "description": "A page made here, by its id: its drawn iPhone screenshots are the set.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
