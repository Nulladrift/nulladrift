        {
          "name": "generate_pages",
          "title": "Generate pages",
          "description": "Makes a page for every intent that is switched on and has none: the words are written, drawn onto the app's own screenshots, and checked against App Review's rules (pre-flight). Each page is its own job. Returns the jobs with their page ids, and the app's pages with a preview_url each.\nCall it once the person has agreed the plan. Then call get_job for each job until it is done, and preview_page for each page. It is safe to call twice: a page already made or being made is not started again.\nNew pages count against the app's plan (Free makes 1 page, the Pack 10, Pro up to Apple's 70). When the plan stops a page the answer says so in facts, with the address of the plan screen: repeat that to the person as it is and do not try another way round it.\nNothing here is sent to Apple.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app_id": {
                "description": "The app's id in Pagefully (a UUID), as analyze_app returned it in app.id.",
                "type": "string"
              },
              "locale": {
                "description": "An App Store language, such as en-US. Leave it out for the app's own language.",
                "type": "string"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "annotations": {
