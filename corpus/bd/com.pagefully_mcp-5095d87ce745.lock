                "enum": ["page", "changed"],
                "type": "string"
              },
              "screen": {
                "description": "The position of the app screen this screenshot should show. Each screen appears once on a page.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "slot_id": {
                "description": "Which screenshot, by its id from preview_page.",
                "type": "string"
              },
              "style": {
                "anyOf": [
                  {
                    "enum": ["clean", "bold", "soft", "night", "lift", "closeup"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "This screenshot's style. null gives it back the page's own."
              },
