      "instructions": "Pagefully makes App Store custom product pages for an iOS app: one page for each thing people search for, drawn on the app's own screenshots, checked against App Review's rules, and made in App Store Connect.\nThe order of work: analyze_app, propose_plan, generate_pages, get_job until done, preview_page, edit_page, publish_pages, confirm_publish. Later, get_results and suggest_refresh. add_screens, at any point, adds captures of the running app for pages to be drawn from.\nStart with one page. Give the person every preview_url: a page is looked at before it is approved.\nNever approve a page or call confirm_publish without the person's explicit yes, given after they have seen the preview and the publish summary.\nWhen an answer has code upgrade_required, repeat its sentence and its plan screen address as they are.\nRead pagefully://playbook before the first call. Without signing in, analyze_app works as a free preview and search_screenshots works in full, both on public App Store data.\nsearch_screenshots looks through the App Screenshot Index: what the top 100 apps in each category put on their screenshots. Use it before planning or reviewing a page, to see what the category does. It describes what leading apps do, not what causes installs.\nscore_screenshots measures a set with the Index's own tags, beside its category: a page made here (page_id), or the app's current screenshots (app_id) as the baseline, and the old set against the new with baseline. It needs sign-in and is metered by the day. It gives no score: what is the same, what is different, and the category's numbers.",
      "tools": [
        {
          "name": "add_screens",
          "title": "Add screens",
          "description": "Adds screens of the app for pages to be drawn from: captures of the running app, beside the screenshots its App Store listing already has. Use it when the listing's screenshots are stale, when a page needs a screen the listing does not show, or when the app is not on the store yet. Returns each screen with its position, which is what edit_page takes as \"screen\". A page made after this may choose an uploaded screen by itself. Nothing is sent to Apple.\nHow to capture one: run the app in the iOS simulator, go to the screen, then run: xcrun simctl io booted screenshot --type=jpeg home.jpg (leave out --type=jpeg for a PNG). Use a simulator whose screen is a size Apple takes for a screenshot: iPhone 17 Pro Max or 16 Pro Max (1320 x 2868), or iPad Pro 13-inch (2064 x 2752). Capture real screens with real content, with no debug overlay.\nHow to send it. If you have a shell, upload the file itself, which is the quickest way and keeps the picture out of this conversation: curl -X POST -H \"Authorization: Bearer $PAGEFULLY_TOKEN\" -F \"file=@home.jpg\" https://pagefully.com/api/v1/apps/APP_ID/screens (the token is the one this server was given; never print it). Otherwise call this tool with each screen as \"url\", an https address of the file on the public internet that the server fetches (no redirect is followed), or as \"data\", the file in base64, which only suits a small JPEG.\nPNG or JPEG, 8 MB a file at most, 10 in one call. An app has 10 places for iPhone screens and 10 for iPad, the listing's own included. Called with no screens it lists the app's screens and what is accepted. Tell the person which screens were added, and never upload a picture that is not a screen of their own app.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app_id": {
                "description": "The app's id in Pagefully (a UUID), as analyze_app returned it in app.id.",
                "type": "string"
              },
              "screens": {
                "description": "The screens to add. Leave it out to list the screens the app has.",
                "items": {
                  "properties": {
                    "data": {
                      "description": "The file in base64, bare or as a data: address. Only for a small JPEG.",
                      "type": "string"
                    },
                    "name": {
                      "description": "What the screen shows, in a few words: home, a finished session, settings.",
                      "type": "string"
                    },
                    "position": {
                      "description": "The place it should take. Leave it out for the next free one. Give an iPad screen the position of the iPhone screen it is the iPad view of.",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "url": {
                      "description": "An https address of the PNG or JPEG, on the public internet. The server fetches it.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
