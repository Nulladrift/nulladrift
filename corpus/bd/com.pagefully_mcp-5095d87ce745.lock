        },
        {
          "name": "update_plan",
          "title": "Update the plan",
          "description": "Changes the plan in one call, as the person asked: add an intent, update one (its name, what its page says, or on and off), approve (switch on) a list, remove a list, or reorder (the order is build priority). Changes apply in that order and stop at the first one the product refuses; the ones before it are saved and the error says so.\nAn intent that is on gets a page when generate_pages is called. To start with one page, switch the others off with update, not remove: they stay in the plan for later. An intent whose page is built cannot be removed, only switched off.\nReturns the plan after the changes. Never put another app's name into a page's name or message: a competitor's name is a keyword only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "add": {
                "items": {
                  "properties": {
                    "keywords": {
                      "description": "Keywords from the app's keyword field this page claims. One that is on another page moves here.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "kind": {
                      "enum": ["problem", "feature", "competitor"],
                      "type": "string"
                    },
                    "message": {
                      "description": "What the page says to that person.",
                      "type": "string"
                    },
                    "name": {
                      "description": "The intent, in a few words: what the person is searching for.",
                      "type": "string"
                    },
                    "targets": {
                      "description": "For a page reached from ads and links: the searches an ad bids on, or an audience.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["kind", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "app_id": {
                "description": "The app's id in Pagefully (a UUID), as analyze_app returned it in app.id.",
                "type": "string"
              },
              "approve": {
                "description": "Intent ids to switch on.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "locale": {
                "description": "An App Store language, such as en-US. Leave it out for the app's own language.",
                "type": "string"
              },
              "remove": {
                "description": "Intent ids to take out of the plan.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reorder": {
                "description": "Every intent id, in the new order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "update": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "on": {
                      "description": "true: a page is wanted. false: it stays in the plan and no page is made.",
                      "type": "boolean"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
