        },
        {
          "name": "search_screenshots",
          "title": "Search the App Screenshot Index",
          "description": "Searches the App Screenshot Index: every screenshot of the top 100 free apps in each App Store category (United States), read and tagged by what it does. Needs no account. Use it to see how the leading apps in a category design their screenshots before you plan, write or review a page, and to hold a page against what its category does.\nFour ways to call it. (1) With nothing: the catalogue, every category and every tactic with its key, what it means and how common it is. Tactics are grouped: meaning (what the words lead with: a problem, an outcome, a feature, who it is for, trust), words (headline length, where the words sit), layout (how the phone is drawn), look (colour, light or dark, a person in the picture) and proof (a rating, an award, a number of users, a press name, a quoted review). There are also tactics of a whole set (set_...): one template throughout, proof on the first screenshot, and so on. (2) With a category alone: every tactic used in that category, with the top ten apps beside the rest, and the keys nobody in it uses. (3) With app: one app's whole set in order, what each screenshot leads with, and what the set does as a whole (whether one colour holds, whether the first screenshot is laid out differently, how many carry a headline). This is how to study a set's story. (4) With any filter: the screenshots that match.\nFilters: query (words the screenshot says, or an app's name), tactics (a screenshot must carry all of them), any_tactics (it must carry at least one), category, colour, top_ten_only, and screenshot_position (1 for first screenshots only: the first one does a different job from the rest). A result has the words on the screenshot, every tactic it carries, its set's tactics, its colour, the app and its chart position, the picture's address and its page on the Index. When tactics are given the answer says how common each is, and seen_with names what else the matching screenshots share more often than screenshots in general.\nSet detail to \"compact\" to read many at once: tactic keys with no labels, no count by category, up to 80 screenshots in a call. Set with_images to look at the first 8 pictures yourself, small.\nWhat the numbers mean: they describe what the leading apps do. They do not show that a tactic causes installs or rank, so say \"most top Finance apps do this\", never \"this will raise your rank\". Another app's words and name are for understanding a category. Never copy them into a page, and never name another app in copy.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "any_tactics": {
                "description": "Tactic keys of which a screenshot must carry at least one. For tactics that seldom appear together.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "app": {
                "description": "One app, by its App Store id or its name. Returns its whole set in order, with what the set does as a whole. If several apps answer to the name, they are listed: call again with the id.",
                "maxLength": 120,
                "type": "string"
              },
              "category": {
                "description": "A category slug from the catalogue, such as health-fitness, finance or music. Leave it out to search every category.",
                "type": "string"
              },
              "colour": {
                "description": "The screenshot's main colour family.",
                "enum": ["red", "orange", "yellow", "green", "teal", "blue", "purple", "pink", "neutral"],
                "type": "string"
              },
              "detail": {
                "description": "\"compact\" returns tactic keys only and leaves out the count by category, so up to 80 screenshots fit in one answer. \"full\" unless set.",
                "enum": ["full", "compact"],
                "type": "string"
              },
              "limit": {
                "description": "How many screenshots to return. 12 unless set; 30 at most in full detail, 80 in compact.",
                "maximum": 80,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "How many matches to skip, to read the next page of a long answer.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words to find in what a screenshot says or in the app's name, such as \"sleep\" or \"track your budget\". Every word must be present.",
                "maxLength": 80,
                "type": "string"
              },
              "screenshot_position": {
                "description": "Only the screenshot at this place in its set. 1 is the first screenshot, the one seen in search results.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "tactics": {
                "description": "Tactic keys from the catalogue, such as leads_problem, rating_shown, device_none or set_consistent. A screenshot must carry every one.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "top_ten_only": {
                "description": "Only apps at chart positions one to ten.",
                "type": "boolean"
              },
              "with_images": {
                "description": "Also return the first 8 pictures as small images, for a client that can look at them. They are the developers' own screenshots, from Apple's servers.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "visibility": ["model"]
            }
          },
          "digest": "sha256:e18da603caefb92e14027d16a63c9be6495fd33e8aea4406f1e83edd2ed70023"
        },
        {
          "name": "suggest_refresh",
          "title": "Suggest what to do next",
          "description": "The pages Pagefully suggests the app should have and does not: each with a name, a kind, what the page would say, the searches it is for and the reason. These are the suggestions the product already holds (such as a use the app's reviewers raise, or a competitor it follows). Reading them asks nothing of a model and costs nothing.\nCall it when the person asks what to make next, or after get_results. To take one up, pass its \"add\" object to update_plan as an item of add, then call generate_pages. Offer them to the person and let them choose: never add one unasked.\nPagefully does not yet propose a fix for a page that trails the default page. For that, read get_results and the playbook (pagefully://playbook), and suggest edits to the first two screenshots for the person to decide.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app_id": {
                "description": "The app's id in Pagefully (a UUID), as analyze_app returned it in app.id.",
                "type": "string"
              },
              "locale": {
                "description": "An App Store language, such as en-US. Leave it out for the app's own language.",
                "type": "string"
