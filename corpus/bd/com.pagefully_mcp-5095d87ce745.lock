        {
          "name": "propose_plan",
          "title": "Propose a plan",
          "description": "Returns the app's plan: one custom product page for each search intent. Each intent has a kind (problem, feature or competitor), what its page says, and the keywords from the app's keyword field that the page claims. A keyword belongs to one page only. An intent with no keyword from the field is a page for ads and links, and has targets instead.\nCall it after analyze_app has returned a brief. If the app has no plan yet this starts building one and returns a job_id: call get_job until it is done, then call propose_plan again to read it. If a plan exists it is returned as it stands. Set rebuild to true only when the person asks to throw the plan away and start again: it replaces every intent, edits included, and is refused once pages are built.\nShow the person the intents and let them choose. Suggest starting with one page. Never switch an intent on or off, or rebuild, without being asked.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app_id": {
                "description": "The app's id in Pagefully (a UUID), as analyze_app returned it in app.id.",
                "type": "string"
              },
              "locale": {
                "description": "An App Store language, such as en-US. Leave it out for the app's own language.",
                "type": "string"
              },
              "rebuild": {
                "description": "Replace the whole plan, edits included. Only when the person asks.",
                "type": "boolean"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
