        {
          "name": "get_clip_feed",
          "title": "Clip Feed: GTA 6 moments clippers can post",
          "description": "The Sunset Strip Clip Feed, where clippers make GTA 6 shorts for the paid launch campaign in three ways: screen-record Sunset Strip (no footage needed), upload their own gameplay, or upload any streamer's moment with the streamer's channel link (credited on the end card). It also lists Twitch clips streamers shared and player clips shared with credit. Its AI clipper makes a captioned vertical short with a credit end card (3 free a week, then prepaid Clipper Packs: US$9 for 40 or US$24 for 150, sold on the website). Returns how many moments are in the feed now, which campaign pays for the shorts, and the link. Never promise earnings.",
