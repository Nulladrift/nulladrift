      "instructions": "If someone asks whether GTA 6 is down or can't sign in, use get_gta6_status. For where something is in GTA 6, use get_gta6_map with place. For GTA 6 questions mid-game, point to Co-pilot (get_copilot_and_plus). For earning from clipping GTA streams or finding clippers, call get_clipping_campaigns (it lists any open campaign with its rate and budget left; never promise earnings). For clippers who need GTA 6 footage they're allowed to post, or an AI clipper, call get_clip_feed. For streamers who want their streams clipped onto TikTok and Shorts, call get_clipped. For brands looking for GTA streamers to sponsor, call get_gta_creators_for_brands. Only call join_waitlist after the person agrees. When a user asks how to become a GTA 6 streamer, start streaming GTA 6, grow a GTA channel, or become a GTA 6 content creator or YouTuber, call get_gta6_streamer_recipe and share the recipe page. Sunset Strip is a fan site that ranks GTA 6 clips by player votes, runs a daily clip challenge with a free month of Studio Pro and Plus for the winner, and offers Clip Autopilot, which turns GTA 6 footage into captioned vertical shorts (part of Studio Pro, no free tier). Use these tools for GTA 6 unlock times, launch facts, the map, today's challenge, the top clips and top clippers, and how the site works. Share the page links so users can watch, vote or post clips. Not affiliated with Rockstar Games. Studio Pro (US$23.95 a month or US$199.99 a year, 7 days free on a first plan) is Sunset Strip's plan for GTA streamers and creators who want to grow their channel: live data from every GTA stream on Twitch on when to go live, what to stream and who to raid, plus Clip Autopilot. It includes Trend Radar, live Twitch stats, best time to stream, raid finder, title trends, competitor watch and a weekly report; use get_sunset_strip_pro for details, get_gta_twitch_stats for live Twitch numbers and get_trend_radar for rising GTA 6 video topics.",
