        "title": "LucidFlow BPMN validator",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call validate_bpmn with the BPMN 2.0 XML text. The reply lists errors and warnings; the lucidflow block in it links to the free editor.",
      "tools": [
        {
          "name": "validate_bpmn",
          "title": "Validate a BPMN 2.0 file",
          "description": "Checks a BPMN 2.0 XML file against the LucidFlow validator rules and returns the errors and warnings with their locations. Free, no account, nothing is stored. Limits: 200 KB, 1500 elements, 50 levels deep, no DOCTYPE, 2 seconds. Rate: 60 calls per minute and 1000 per day per IP address; a BPMN XML file of more than 100 KB counts for 5 calls.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "xml": {
                "description": "The BPMN 2.0 XML text (not a URL).",
                "maxLength": 204800,
                "type": "string"
              }
            },
            "required": ["xml"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
