{
  "lockfileVersion": 2,
  "subjects": {
    "com.iar.docs-mcp/iar-documentation": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://docs-mcp.iar.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "iar-documentation",
        "version": "0.2.0",
        "description": "IAR user documentation (docs.iar.com) for AI assistants"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server serves the IAR user documentation published on docs.iar.com. When the user asks about IAR Embedded Workbench, the IAR C/C++ compiler, assembler, ILINK linker, C-SPY debugger, C-STAT, IAR debug probes or IAR cloud licensing, use iar_documentation_search to find the relevant page and iar_documentation_read to read it before answering. Pass the product parameter so results come from the right target architecture: ewarm (Arm), ewriscv (RISC-V), ewrh850 (RH850), ewrl78 (RL78), ewrx (RX), probes (debug probes), lmsc (cloud licensing). Compiler options, pragmas, intrinsics and linker directives differ between architectures, so do not answer for one target from another target's pages. Each page includes an 'Online:' link to docs.iar.com; cite it.",
      "tools": [
        {
          "name": "iar_documentation_read",
          "description": "Read the full content of an IAR documentation page. Use the filename shown in search results.",
          "inputSchema": {
            "properties": {
              "file": {
                "description": "Documentation page filename from a search result.",
                "type": "string"
              },
              "symbol": {
                "default": "",
                "description": "Optional: Return only one member's documentation instead of the whole page. A name (e.g. 'singleShot', 'anchors.fill', 'AlignmentFlag', 'onCompleted') returns every overload and any property of that name; an enum constant or property access function returns its enum or property. An anchor, shown as {#anchor} after each signature (e.g. 'singleShot-5'), returns that block only. An unknown name returns the page's member list.",
                "type": "string"
              },
              "version": {
                "default": "",
                "description": "Optional: product version to read from. Defaults to the latest available version.",
                "type": "string"
              }
            },
            "required": ["file"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23508011114a0d84eefbade75e0ec3843c4463a49e495f02047b0492bfd0783e"
        },
        {
          "name": "iar_documentation_search",
          "description": "Search the IAR user documentation (docs.iar.com): IAR Embedded Workbench for Arm, RISC-V, RH850, RL78 and RX (IDE, C/C++ compiler, assembler, linker, C-SPY debugger, C-STAT), IAR debug probes and cloud licensing. Set product to ewarm, ewriscv, ewrh850, ewrl78, ewrx, probes or lmsc. Returns page filenames and excerpts.",
          "inputSchema": {
            "properties": {
              "filter": {
                "default": "",
                "description": "Optional: document type filter. Leave unset (default 'all') for IAR documentation.",
                "type": "string"
              },
              "intent": {
                "default": "",
                "description": "Optional: Prioritizes (not filters) results by type. One of 'api', 'tutorial', 'guide', 'concept', 'example', 'migration'. 'api'=class reference, 'tutorial'=how-to guides, 'guide'=overviews, 'concept'=explanations, 'example'=code samples, 'migration'=porting guides.",
                "type": "string"
              },
              "keywords": {
                "default": [],
                "description": "Optional: array of keywords to search for. Results match ANY keyword. Example: [\"pragma\", \"location\", \"absolute\"]. Alternative to 'query' for multi-term matching.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "max_results": {
                "default": 0,
                "description": "Optional: Maximum number of results to return (1-10). Default is 3.",
                "maximum": 2147483647,
                "minimum": -2147483648,
                "type": "integer"
              },
              "module": {
                "default": "",
                "description": "Optional: limit the search to one manual (e.g., 'iarccdevelopment', 'cspydebugging', 'cstatstaticanalysis', 'iarassembler', 'ideprojectmanagementandbuilding', 'migrationinformation').",
                "type": "string"
              },
              "product": {
                "default": "",
                "description": "Optional: one of 'ewarm' (Arm), 'ewriscv' (RISC-V), 'ewrh850' (RH850), 'ewrl78' (RL78), 'ewrx' (RX), 'probes' (debug probes), 'lmsc' (cloud licensing). Compiler options and pragmas differ per architecture, so always set it.",
                "type": "string"
              },
              "query": {
                "default": "",
                "description": "Search query (e.g., 'ILINK config file', '#pragma location', 'C-SPY breakpoints'). Optional if 'keywords' is provided.",
                "type": "string"
              },
              "version": {
                "default": "",
                "description": "Optional: product version to search (e.g., '10.10' for ewarm). Defaults to the latest available version.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0fd3591cba95246e621a9c9c899455e7179ac0fb72e15c2d4a0b0d5532040e93"
        }
      ],
      "digest": "sha256:0b255d8d8fdf54b7de8742f5aa989582977fcbfb4b8bc3d3ac059cd78ea6948e"
    }
  }
}
