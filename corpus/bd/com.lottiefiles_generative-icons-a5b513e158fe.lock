      },
      "instructions": "Generative Icons is a library of animated UI icons (dotLottie) by LottieFiles for web, iOS and Android apps. Use search_icons with what the icon should mean (for example \"delete\", \"upload failed\", \"interrupt the bot\"), then get_icon for its file, install commands and code. Every icon has Light and Strong motion and Outline (three weights), Solid and Duotone styles, recolored at runtime. search_icons also says how well the library matches (\"strong\", \"loose\" or \"none\") and lists community icons: generated on the website by signed-in people, public and marked unreviewed (get_community_icon). If nothing fits, request_icon gives a link where a person signed in with LottieFiles generates it in about three minutes, or read_guide with \"creating-icons\" explains how a coding agent creates one in the same style in its own project.",
      "tools": [
        {
          "name": "get_community_icon",
          "title": "Get a community icon",
          "description": "A community icon (generated on the website, public and marked unreviewed): its label, the request it was made for, what its motion shows, the dotLottie file URL, its page and the descriptor the runtime takes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The community icon id (from search_icons).",
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a community icon"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:32a40f12a872923af1684873c558bb8975f17ede44e810b148ce438ee13e91dc"
        },
        {
          "name": "get_icon",
          "title": "Get an icon",
          "description": "Everything needed to use one icon: its description, states, styles, weights, motions, the dotLottie file URL and hash, install commands, and JavaScript, React, iOS and Android snippets.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The icon id, e.g. \"trash\" (from search_icons).",
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
