        {
          "name": "request_icon",
          "title": "Request a new icon",
          "description": "When search_icons finds nothing that fits: a link where a person signed in with LottieFiles generates the icon on the website, in the family's style, in about three minutes. Give the link to the person you are helping; the icon then appears in search_icons as a community icon. Nothing is generated by this call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "What the icon should show, e.g. \"a kite flying\" or \"piggy bank for a savings app\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Request a new icon"
          },
          "behavior": {
            "destructive": false,
