            "readOnly": true
          },
          "digest": "sha256:136e22288dc7110472d6c026af1138cacc828a99e27352f015be160fe45a1d1b"
        },
        {
          "name": "search_icons",
          "title": "Search icons",
          "description": "Find icons by name or meaning. Matches labels, search terms (synonyms, UI slang, abbreviations) and, through embeddings, plain-language needs; tolerates typos. Returns the best matches first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only icons of this category (see list_categories).",
                "enum": ["essentials", "actions", "interface", "tools", "ai-conversation", "ai-knowledge", "ai-creation", "ai-agents", "feedback-status", "loading-indicators", "fintech-finance", "travel", "commerce-delivery", "voice", "media-playback", "motion-design", "agent-operations", "arrows", "annotation-arrows", "teamwork", "get-help", "file-transfer", "everyday-controls", "account-privacy", "forms-input", "tables-analytics", "text-document-editing", "accessibility-reading", "developer-version-control", "infrastructure-devices", "communication-social", "scheduling-time", "weather", "health-fitness", "smart-home", "education", "food-drink", "files-folders", "notifications", "search-discovery", "maps-navigation", "photos-camera", "music-audio", "drawing-tools", "events-tickets", "automotive", "legal-compliance", "preferences", "onboarding-tips", "video-editing", "chat-messaging", "gamification-rewards", "models-providers", "model-training", "vector-editing", "voice-agents", "emoji"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "At most this many results.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the icon should show or mean, e.g. \"trash\", \"go back\", \"payment failed\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
