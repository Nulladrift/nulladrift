        {
          "name": "data_lookup",
          "title": "Look up one key in a dataset",
          "description": "Figures for one state, county or other key from one open dataset, e.g. limitation periods, lawyers per resident, bankruptcy filings, law firms, court backlogs. Results are not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
