        },
        {
          "name": "check_ad_against_state_rules",
          "title": "Check an ad against a state's advertising rules",
          "description": "Loads one state's lawyer advertising rules, with sources, and asks the assistant to point out which rules an ad touches. It summarizes rules; it does not approve the ad. Not legal advice.",
          "arguments": [
            {
              "name": "state",
              "description": "Two-letter code (TX), or DC",
              "required": true
            },
            {
              "name": "ad_text",
              "description": "The ad copy, script or landing-page text (optional; never stored)",
              "required": false
            },
            {
              "name": "channel",
              "description": "Where it runs: search, social, TV, radio, billboard, letter, text message, website (optional)",
              "required": false
            }
