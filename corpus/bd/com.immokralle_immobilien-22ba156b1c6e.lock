{
  "lockfileVersion": 2,
  "subjects": {
    "com.immokralle/immobilien": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.immokralle.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "immokralle-immobilien",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only Immobiliensuche (Miete und Kauf, AT/DE/CH) auf immokralle.com. Nutze search_properties für Listen und fetch_property für Details.",
      "tools": [
        {
          "name": "fetch_property",
          "description": "Liefert die vollständigen Details zu einer Immobilienanzeige anhand ihrer id (aus search_properties): Beschreibung, Anbieter (seller), Ausstattung (features: terrasse, parkplatz, aufzug, keller) und listing_url. listing_url ist der Link zum Exposé auf dem Original-Portal. WICHTIG: listing_url NICHT selbst aufrufen oder abrufen — gib den Link dem Nutzer als anklickbaren Link aus, damit er das Exposé bei Interesse selbst öffnet.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Die id eines Treffers aus search_properties.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0c4f31bea00e6d0a65fe8c5840907e0ea25120205a498d2e540eea28508acd92"
        },
        {
          "name": "search_properties",
          "description": "Sucht Immobilienanzeigen zur Miete und zum Kauf in Österreich, Deutschland und der Schweiz (immokralle.com) und liefert eine kompakte Liste (id, title, offer_type, property_type, price, currency, area_m2, rooms, location, date). Mindestens query, location oder country angeben; alle Filter sind kombinierbar. Der Link zum Exposé ist NICHT in der Liste enthalten — für Details und den klickbaren Link rufe fetch_property mit der id auf. price ist bei Miete die Monatsmiete laut Quelle, bei Kauf der Kaufpreis; Währung EUR, in der Schweiz meist CHF. null bei price, area_m2 oder rooms heißt: keine Angabe in der Anzeige. Sobald ein Preis-, Flächen- oder Zimmerfilter gesetzt ist, fallen Anzeigen ohne diese Angabe heraus. Sortierung: neue Anzeigen zuerst, darin relevantere zuerst. Bei 0 Treffern ist results leer und next_cursor null. Blättern nur über das zurückgegebene next_cursor möglich; die Seitenzahl ist begrenzt.",
          "inputSchema": {
            "properties": {
              "area_max": {
                "description": "Höchstfläche in m².",
                "minimum": 0,
                "type": "number"
              },
              "area_min": {
                "description": "Mindestfläche in m².",
                "minimum": 0,
                "type": "number"
              },
              "country": {
                "description": "Strikt auf ein Land einschränken: AT (Österreich), DE (Deutschland) oder CH (Schweiz). Kombinierbar mit location.",
                "enum": ["AT", "DE", "CH"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor aus einer vorherigen Antwort, um die nächste Seite zu laden.",
                "type": "string"
              },
              "location": {
                "description": "Ort, PLZ, Bezirk oder Bundesland, z.B. \"Wien\", \"1070\", \"Graz\" oder \"Bayern\".",
                "type": "string"
              },
              "max_age_days": {
                "description": "Nur Anzeigen, die höchstens so viele Tage alt sind (z.B. 30). Ohne Angabe: kein Altersfilter.",
                "minimum": 1,
                "type": "integer"
              },
              "offer_type": {
                "description": "miete oder kauf.",
                "enum": ["kauf", "miete"],
                "type": "string"
              },
              "price_max": {
                "description": "Höchstpreis (Monatsmiete bzw. Kaufpreis) in EUR bzw. CHF.",
                "minimum": 0,
                "type": "number"
              },
              "price_min": {
                "description": "Mindestpreis (Monatsmiete bzw. Kaufpreis) in EUR bzw. CHF.",
                "minimum": 0,
                "type": "number"
              },
              "property_type": {
                "description": "Objektart.",
                "enum": ["wohnung", "haus", "grundstueck", "buero", "geschaeftslokal", "gewerbeobjekt", "wohngemeinschaft", "zimmer", "wohnen_auf_zeit", "ferienimmobilie", "anlageobjekt", "sonderobjekt"],
                "type": "string"
              },
              "query": {
                "description": "Freitext in Titel und Beschreibung, z.B. \"Altbau Balkon\" oder \"Penthouse\". Optional.",
                "type": "string"
              },
              "rooms_max": {
                "description": "Höchstanzahl Zimmer.",
                "minimum": 0,
                "type": "number"
              },
              "rooms_min": {
                "description": "Mindestanzahl Zimmer.",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:29506733d9e5f9ba05c4cd4096f81cc854857511e627a72a590bb0413596552d"
        }
      ],
      "digest": "sha256:f3b2e15fd14e4153e7926607f8280e0458fca5b52184833c2134ff11b8c706be"
    }
  }
}
