      "serverInfo": {
        "name": "lexopti-docs",
        "title": "LexOpti developer documentation",
        "version": "1.0.0",
        "websiteUrl": "https://developers.lexopti.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Documentation of the LexOpti public API, its TypeScript SDK and its embedded components, in English and French. Search first (search_docs), then read a page or one of its sections (get_page), or an API operation with its SDK example (get_api_operation). It holds no customer data.",
      "tools": [
        {
          "name": "get_api_operation",
          "title": "Read an API operation",
          "description": "Reads one operation of the LexOpti API: method and path, parameters, request body schema, responses and errors, and its TypeScript SDK example. An operation without French version answers in English, with fallback: true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the documentation: en (default) or fr.",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "operationId": {
                "description": "The operation, as the API reference names it (checks.create).",
                "enum": ["alerts.get", "alerts.list", "alerts.update", "cases.create", "cases.deleteExternalRef", "cases.deletePartyExternalRef", "cases.get", "cases.getClassification", "cases.getReport", "cases.launchChecks", "cases.list", "cases.listDocuments", "cases.preview", "cases.setExternalRef", "cases.setPartyExternalRef", "checks.create", "checks.get", "checks.list", "clients.create", "clients.deleteExternalRef", "clients.get", "clients.getClassification", "clients.getPreliminaryScreening", "clients.list", "clients.requestPreliminaryScreening", "clients.setExternalRef", "clients.update", "deepLinks.create", "embedSessions.create", "enrolments.cancel", "enrolments.create", "enrolments.list", "events.list", "firms.create", "firms.createClaimLink", "firms.get", "members.list", "organization.get", "sandboxTriggers.create", "usage.get", "webhookEndpoints.create", "webhookEndpoints.delete", "webhookEndpoints.get", "webhookEndpoints.list", "webhookEndpoints.listDeliveries", "webhookEndpoints.replayDelivery", "webhookEndpoints.rotateSecret", "webhookEndpoints.test", "webhookEndpoints.update"],
                "type": "string"
              }
            },
            "required": ["operationId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "description": {
                "type": "string"
              },
              "fallback": {
                "type": "boolean"
              },
              "lang": {
                "enum": ["en", "fr"],
                "type": "string"
              },
              "markdown": {
                "type": "string"
              },
              "method": {
                "type": "string"
              },
              "operationId": {
                "type": "string"
              },
              "path": {
                "type": "string"
              },
              "sdkExample": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["description", "fallback", "lang", "markdown", "method", "operationId", "path", "sdkExample", "summary", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an API operation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df65a511333ab7a8779f9bd2373608f4d1fa9a796bc63fe6002e9e743339a834"
        },
        {
          "name": "get_page",
          "title": "Read a documentation page",
          "description": "Reads a page of the documentation as Markdown, or one of its sections (by its heading). A page without French version answers in English, with fallback: true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the documentation: en (default) or fr.",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "section": {
                "description": "A heading of the page (as list_pages or search_docs gave it).",
                "maxLength": 200,
                "type": "string"
              },
              "slug": {
                "description": "The page, as list_pages names it.",
                "enum": ["ai/connect", "ai/mcp", "ai/server", "api/alerts-get", "api/alerts-list", "api/alerts-update", "api/cases-create", "api/cases-deleteexternalref", "api/cases-deletepartyexternalref", "api/cases-get", "api/cases-getclassification", "api/cases-getreport", "api/cases-launchchecks", "api/cases-list", "api/cases-listdocuments", "api/cases-preview", "api/cases-setexternalref", "api/cases-setpartyexternalref", "api/checks-create", "api/checks-get", "api/checks-list", "api/clients-create", "api/clients-deleteexternalref", "api/clients-get", "api/clients-getclassification", "api/clients-getpreliminaryscreening", "api/clients-list", "api/clients-requestpreliminaryscreening", "api/clients-setexternalref", "api/clients-update", "api/deeplinks-create", "api/embedsessions-create", "api/enrolments-cancel", "api/enrolments-create", "api/enrolments-list", "api/events-list", "api/firms-create", "api/firms-createclaimlink", "api/firms-get", "api/members-list", "api/organization-get", "api/sandboxtriggers-create", "api/usage-get", "api/webhookendpoints-create", "api/webhookendpoints-delete", "api/webhookendpoints-get", "api/webhookendpoints-list", "api/webhookendpoints-listdeliveries", "api/webhookendpoints-replaydelivery", "api/webhookendpoints-rotatesecret", "api/webhookendpoints-test", "api/webhookendpoints-update", "authentication", "changelog", "concepts", "developer-account", "embedding", "errors", "events", "glossary", "identities", "index", "native-apps", "partner-journey", "partner-programme", "php", "quickstart", "requests", "sandbox", "sdk", "sdk/reference", "security", "terms", "versioning", "webhooks"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "fallback": {
                "type": "boolean"
              },
              "lang": {
                "enum": ["en", "fr"],
                "type": "string"
              },
              "markdown": {
                "type": "string"
              },
              "section": {
                "type": ["string", "null"]
              },
              "sections": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "slug": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["fallback", "lang", "markdown", "section", "sections", "slug", "title", "truncated", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a documentation page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b277049df706451fcfa06dc4f5242648f9ea43b10d5c87a929f98fec8eadf5d6"
        },
        {
          "name": "list_pages",
          "title": "List the documentation pages",
          "description": "Lists every page of the documentation with its slug, title and description.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the documentation: en (default) or fr.",
                "enum": ["en", "fr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "pages": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["description", "slug", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["pages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the documentation pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c62af83d01f271b1fa70754b0dbab913991b54fcb8d3f1cb61ff64908495eeb"
        },
        {
          "name": "search_docs",
          "title": "Search the documentation",
          "description": "Searches the LexOpti developer documentation (guides, SDK, API operations). Returns the best sections with their URL and a snippet.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the documentation: en (default) or fr.",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many results, 1 to 10 (5 by default).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fallback": {
                      "description": "An English page answering a French search: it has no French version.",
                      "type": "boolean"
                    },
                    "section": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["fallback", "section", "slug", "snippet", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f500fc9883bd943a96db7c3dc96dabd792ae51d62a770af5fec928a40b94f3ab"
        }
      ],
      "digest": "sha256:38e46925b59ac678707dfc89da8852ca790179344b81a27aa3bf8211088d8da1"
    }
