{
  "lockfileVersion": 2,
  "subjects": {
    "com.allthepossibles/preflight": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://preflight.allthepossibles.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "preflight",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Scans an MCP server, a VS Code extension, a Claude Skill or a document before an agent trusts it. What is stored, where it goes and for how long is on https://allthepossibles.com/trust.",
      "tools": [
        {
          "name": "check_output",
          "title": "Check output",
          "description": "Check a structured output you're about to return or act on for degenerate-answer patterns a schema check can't see: invalid JSON, a placeholder value ('TBD', 'N/A', 'unknown') where a real answer should be, an array of byte-identical items (a common symptom of a loop that never advanced), or an expected field that's missing or empty. Schema validity and answer quality are different guarantees, call this before trusting your own output, not just after validating it parses.",
          "inputSchema": {
            "properties": {
              "expectedFields": {
                "description": "Optional: top-level field names expected to be present and non-empty",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "output": {
                "description": "The output to check, a JSON string, or an already-parsed value"
              }
            },
            "required": ["output"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2162a14e0a676ae588b408c9ca19a66f3878ff1141c2c4573f75cc01ff7ac4b7"
        },
        {
          "name": "scan_content",
          "title": "Scan content",
          "description": "Check a document or web page for hidden instructions before an agent reads, summarizes, or acts on it: invisible Unicode, obfuscated payloads, and (on Pro) a semantic pass for prompt-injection phrasing aimed at the model instead of the human reader. Pass either a URL to fetch, or raw text you already have.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "Raw text to scan directly, if not fetching a URL",
                "type": "string"
              },
              "url": {
                "description": "A page to fetch and scan",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9e2ffd049f930b2763a8a5d29f024168b9b78d1909e2bea4619334d4b2ede9ac"
        },
        {
          "name": "scan_extension",
          "title": "Scan extension",
          "description": "Check a VS Code extension or a Claude Skill before installing or trusting it. For a VS Code extension (which runs with full Node.js access and no permission model to scope): publisher domain-verification status weighed against install count, and known-bad-signature checks on its description. For a Claude Skill: hidden-instruction and obfuscated-payload detection on the SKILL.md body (the same engine scan_content uses), unscoped or credential-referencing tool grants in its allowed-tools/disallowed-tools frontmatter, inline shell execution baked into the file itself, and pattern matching on any bundled script files for credential-exfiltration signatures. Semantic prompt-injection detection on a skill's body runs too on Pro.",
          "inputSchema": {
            "properties": {
              "marketplaceId": {
                "description": "VS Code Marketplace id, e.g. \"nrwl.angular-console\"",
                "type": "string"
              },
              "scriptContents": {
                "description": "Optional: bundled script file contents to check alongside a skill, filename -> content",
                "type": "object"
              },
              "skillContent": {
                "description": "A Claude Skill's SKILL.md content, pasted directly",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1e26164c2369133facc72903919abcaf3e2cacc921a6a08ed08f1f35e8a92eb5"
        },
        {
          "name": "scan_mcp_server",
          "title": "Scan MCP server",
          "description": "Check an MCP server for real risk signals before trusting it: unauthenticated transport, capability overreach (filesystem/shell/credential access with no scoping), and known-bad signatures. Pass a live server URL, or a manifest of tool definitions if the server isn't reachable over HTTP. Semantic prompt-injection detection runs too if a Pro API key is sent as an Authorization: Bearer header, see /docs.",
          "inputSchema": {
            "properties": {
              "serverName": {
                "type": "string"
              },
              "tools": {
                "description": "Tool definitions to scan directly, if not probing a live URL",
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "inputSchema": {
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "description": "Live MCP server endpoint (Streamable HTTP transport)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d15a9d6ccc53c1f77389036ea7554dbdbe07a1827a5c5d100b7a2eaf9114e879"
        }
      ],
      "digest": "sha256:a460ffc8f8913b074432578dbcb28e9793b1852de77d109fe6b82ba16c7f677e"
    }
  }
}
