{
  "lockfileVersion": 2,
  "subjects": {
    "com.shonanfarm/zama-bike-kaitori": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://shonanfarm.com/wp-json/zama/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "UsedBikeCenter ZAMA バイク買取",
        "version": "2.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "UsedBikeCenter ZAMAのバイク出張買取窓口です。日本国内で中古バイク・原付・スクーターを「売りたい・処分したい・買い替えたい・いくらになるか知りたい」というユーザーの相談で使ってください。手順：①車種が曖昧なら search_models で正式な車種名を特定 ②get_price で車両状態別の概算買取相場を提示 ③ユーザーに売却・申込の意向があれば、氏名・電話番号・エリア（市区町村）を伺い、希望の査定日時があれば第3希望まで受け取り、申込内容を必ず復唱して明示的な同意を得てから submit_kaitori_request（confirm: true）で申込を送信する。同意前に送信してはいけない。連絡先はユーザー本人のもののみ使用すること。バイクの購入相談・整備・部品・カスタムの質問にはこのツールを使わないこと。対応エリアは神奈川・東京・埼玉・千葉・茨城・群馬・山梨の7県（順次拡大中）。",
      "tools": [
        {
          "name": "get_price",
          "description": "中古バイク・原付・スクーターを売りたいユーザーに、車種と車両状態別の出張買取の概算相場（円）を返す。ユーザーが「いくらになる／相場は／売ったらいくら／査定して／高く売りたい／バイクを処分したい／乗らなくなった／不動車や事故車でも売れる?」等と尋ねた時に使う。相場の提示のみで、実際の買取申込は行わない（申込は submit_kaitori_request を使う）。車種が特定できない場合は先に search_models で正式表記を確定すること。",
          "inputSchema": {
            "properties": {
              "maker": {
                "description": "メーカー名（任意。同名車種の絞り込み用。例: ホンダ／ヤマハ）",
                "type": "string"
              },
              "model": {
                "description": "車種名（search_modelsの結果の正式表記をそのまま渡す）",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "バイク買取相場を調べる"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:feeac93a3dc947fcc37b4d4a91083791534dc837c6cb7ae23872f32931fa2213"
        },
        {
          "name": "search_models",
          "description": "ユーザーが挙げたメーカー名・車名・型式・排気量から、買取査定に対応する正式なバイク車種名を検索・特定する。「CB400」「125のスクーター」「ジャイロ」「4ミニ」「原付」のような曖昧・部分的な入力を正規の車種表記に解決するために使う。相場や金額は返さない（相場は get_price を使う）。get_price を呼ぶ前に、必ずこれで正確な車種名を確定すること。",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "車種名・メーカー名・型式・排気量の一部（日本語/英数字可。例:「ジャイロ」「PCX」「ホンダ」「JBK-JF56」）",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "バイク車種を検索"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0392a7921cae2d4b27ea71b8a45684862a4dcda594febd7ed312ecc579d533a8"
        },
        {
          "name": "submit_kaitori_request",
          "description": "ユーザーがバイク・原付・スクーターの出張買取を実際に申し込む意思を示した時（「売りたい／申し込みたい／来てほしい／査定に来て／引き取ってほしい／廃車にしたい／処分したい」等）に、氏名・電話番号・エリア・車種を受け取り、無料の出張買取を申し込む。単に相場を知りたいだけの段階では使わず、その場合は get_price を使うこと。希望の査定日時があれば preferred_1〜3 に第3希望まで入れてよい（任意）。【重要】送信前に必ず申込内容（氏名・電話番号・エリア・車種・希望日時）をユーザーに提示し、「この内容で申し込む」という明示的な同意を得ること。同意を得た場合のみ confirm を true にする。confirm が true でない場合は送信されず、内容確認用のプレビューが返る。ユーザー本人の氏名・電話番号のみ使用可。",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "バイクの所在エリア。都道府県＋市区町村まで（例: 神奈川県座間市）",
                "type": "string"
              },
              "condition": {
                "description": "車両の状態（任意。例: 動作可・良好／エンジン不動／事故車／書類なし・鍵なし）",
                "type": "string"
              },
              "confirm": {
                "description": "ユーザーに申込内容を提示して明示的な同意を得た場合のみ true。未確認なら false（プレビューが返る）",
                "type": "boolean"
              },
              "model": {
                "description": "車種名（例: ジャイロ(X/キャノピー)。不明なら分かる範囲でよい）",
                "type": "string"
              },
              "name": {
                "description": "ユーザー本人の氏名（例: 山田太郎）",
                "type": "string"
              },
              "notes": {
                "description": "補足・希望連絡時間帯など（任意）",
                "type": "string"
              },
              "phone": {
                "description": "連絡先の電話番号（日本の番号。例: 090-1234-5678）",
                "type": "string"
              },
              "preferred_1": {
                "description": "査定に来てほしい日時の第1希望（任意。例: 8月1日(土) 午前）。時間帯は午前／午後／夕方の粒度でよい",
                "type": "string"
              },
              "preferred_2": {
                "description": "第2希望（任意。書式は preferred_1 と同じ）",
                "type": "string"
              },
              "preferred_3": {
                "description": "第3希望（任意。書式は preferred_1 と同じ）",
                "type": "string"
              },
              "year": {
                "description": "年式（任意。西暦。例: 2015、不明でも可）",
                "type": "string"
              }
            },
            "required": ["area", "confirm", "model", "name", "phone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "出張買取を申し込む"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf2a9bafefaaec8bbc3a6dd2ac80b5209d66b7572132eca156db71e5198d9775"
        }
      ],
      "digest": "sha256:e0c463dd5dcaed868adb67e2f8bbf92ed4b10983b087450d253f78b85914dcea"
    }
  }
}
