          "digest": "sha256:23060323ece88b7236cd7ad992b633a788c57cb18cd55fe8d7f169a7858f618e"
        },
        {
          "name": "what_changed",
          "title": "What changed since last week (Watch)",
          "description": "OperStack Watch subscribers, with their key. What moved between the last two weekly checks: how many answers named the subscriber in ChatGPT and Perplexity, the share of answers against each competitor, and the buyer questions where they were named or dropped.",
          "inputSchema": {
            "properties": {
