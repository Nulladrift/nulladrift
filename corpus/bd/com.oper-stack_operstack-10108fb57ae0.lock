        {
          "name": "who_instead",
          "title": "Who ChatGPT names instead of us (Watch)",
          "description": "OperStack Watch subscribers, with their key. For each of the 10 buyer questions at the last weekly check: whether ChatGPT (and Perplexity) named the subscriber, and which businesses they named instead. Then the sites these answers were built from and where to get mentioned.",
          "inputSchema": {
