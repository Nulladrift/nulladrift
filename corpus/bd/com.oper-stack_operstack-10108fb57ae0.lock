{
  "lockfileVersion": 2,
  "subjects": {
    "com.oper-stack/operstack": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://oper-stack.com/api/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "operstack",
        "title": "OperStack",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Measures whether AI assistants can read, understand and quote a website, and reads the free OperStack visit counter. Every number comes from public signals or from the owner's own counter; those tools need no account. OperStack Watch subscribers who added their key also get their weekly report: whether ChatGPT and Perplexity name them, who they name instead, what changed and the fix of the week (my_visibility, who_instead, what_changed, fix_of_the_week, check_rival, my_questions).",
      "tools": [
        {
          "name": "ai_visits",
          "title": "Read your own AI visit counter",
          "description": "Reports how many visits each AI assistant sent to a site that runs the free OperStack counter. Needs the private token from the counter link, which only the site owner has. Returns visit counts per assistant, not individual visitors.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "How many days back to report. Default 90.",
                "type": "number"
              },
              "token": {
                "description": "The private token from your counter link (the part after t=)",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e0e61adbe754c6d23fa1ff0846f6f36e484cc249cf10b32c2bab7ff2152d428"
        },
        {
          "name": "audit_site",
          "title": "Score a site for AI visibility",
          "description": "Scores any public site out of 100 on the five things an answer engine needs before it will quote a page: whether AI crawlers are allowed in, whether there is a map for agents (llms.txt), whether the entity is clear from schema, whether there is anything quotable, and whether pages carry dates and sources. Use it when someone asks whether ChatGPT or another assistant can read and quote a site. Reads up to 10 public pages. A site that turns away automated readers cannot be scored.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the findings. Default en. Use ru when the site or the person is Russian.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "url": {
                "description": "A public site address, for example example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aa98bc2af4f7b1633b2849d919328c63ff67d4042dde34b35cfa748f7f34576a"
        },
        {
          "name": "check_counter_installed",
          "title": "Is the visit counter actually on the site",
          "description": "Looks at a site page and says whether the OperStack visit counter line is really there, including the case where it is there carrying a different key. Use it when a counter reports nothing and the owner does not know why.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The site to look at",
                "type": "string"
              },
              "key": {
                "description": "The site key from the snippet, starting osv_",
                "type": "string"
              }
            },
            "required": ["domain", "key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0b403665bbe5c6b05a8063a195b6bd003dc05c01806f751bf164bbbe635406da"
        },
        {
          "name": "check_llms_txt",
          "title": "Check the map a site offers to machines",
          "description": "Reads a site llms.txt, the file that tells an assistant which pages matter, and follows its links to see whether they still lead anywhere. Use it when someone asks about llms.txt or whether their map for AI assistants works.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "A public site address",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:316a7a5533e45e820173125d0aca50c864a64f7ac2256d7020562c2c59808292"
        },
        {
          "name": "check_rival",
          "title": "Score a competitor by the same rules (Watch)",
          "description": "OperStack Watch subscribers, with their key. Scores a competitor site out of 100 on the same rules as the OperStack free check and the Watch email, and puts it next to the subscriber's own score from the last weekly check.",
          "inputSchema": {
            "properties": {
              "site": {
                "description": "Only if you watch more than one site: which one, for example example.com.",
                "type": "string"
              },
              "url": {
                "description": "The competitor site, for example rival.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a83369c0764b488c5e95f0583b416ff027416752286a036ab8e978b62d8c0b16"
        },
        {
          "name": "compare_sites",
          "title": "Compare sites on the same scale",
          "description": "Runs the same AI-visibility scoring on two to four sites and returns them side by side, so a score means something. Use it to see where a site is losing answers to a rival, area by area. A site that turns away automated readers is reported as unreadable.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the findings. Default en.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "urls": {
                "description": "Two to four public site addresses",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:163656c38350a6a719cdf80dd957dcf8447ac0ceb31e0bb929d11792e7cfd725"
        },
        {
          "name": "fix_of_the_week",
          "title": "This week's fix, ready to paste (Watch)",
          "description": "OperStack Watch subscribers, with their key. The fix of the week from the last Watch email: the buyer question it answers, who ChatGPT named instead, what to change, and the text to put on the site, word for word as in the email.",
          "inputSchema": {
            "properties": {
              "site": {
                "description": "Only if you watch more than one site: which one, for example example.com.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a4c4e4b655db08038379670550d6f8852db13ccfd294452738403951924918f"
        },
        {
          "name": "my_questions",
          "title": "See or change our 10 buyer questions (Watch)",
          "description": "OperStack Watch subscribers, with their key. Shows the 10 buyer questions Watch asks ChatGPT and Perplexity every week. Can also replace one question (number and new text) or all ten. Only change questions when the person asked for it. Changes apply from the next weekly check, and history starts again for a changed question.",
          "inputSchema": {
            "properties": {
              "number": {
                "description": "To replace one question: its number, 1 to 10.",
                "type": "number"
              },
              "question": {
                "description": "To replace one question: the new question, at least 5 words.",
                "type": "string"
              },
              "questions": {
                "description": "To replace all ten: exactly 10 different questions.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "site": {
                "description": "Only if you watch more than one site: which one, for example example.com.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6ca01f980574da5f4cf5b6c495b15c903a1835c7a2d595cbc229796d2cb4ba9b"
        },
        {
          "name": "my_visibility",
          "title": "Does ChatGPT name us this week (Watch)",
          "description": "OperStack Watch subscribers, with their key. Whether ChatGPT (and Perplexity, when it answered) named the subscriber in answers to their 10 buyer questions at the last weekly check, the trend week by week, and the share of answers against the competitors named. The same numbers as that week's Watch email.",
          "inputSchema": {
            "properties": {
              "site": {
                "description": "Only if you watch more than one site: which one, for example example.com.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
