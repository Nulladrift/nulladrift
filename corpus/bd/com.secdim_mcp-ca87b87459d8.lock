    "com.secdim/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.secdim.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "SecDim MCP",
        "version": "1.27.2"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "\nSecDim MCP server gives access to two complementary SecDim products:\n- SecDim Play: hands-on secure coding, appsec, devsecops, ai security and web3 security\n  challenges (labs) where developers find and fix real vulnerabilities and earn score/points.\n- SecDim Learn: tutorial-based courses (text, video and hands-on lab topics) on secure coding,\n  secure design, devsecops, cloud security and more, often complementary or prerequisite to\n  SecDim Play challenges.\n\nTo build a personalized learning pathway:\n1. Ask the user 4 brief questions: languages/frameworks they use daily,\n   their role (backend/frontend/DevOps/etc.), what they want to achieve\n   (verify AI generated fixes, fix a specific vulnerability, OWASP Top 10 coverage, certification prep, etc.)\n   and how much time per week they can dedicate to learning (1, 2-4 hours per week, 1-2 days).\n2. If they have a SecDim account, call get_secdim_profile to see their actual\n   challenge history and demonstrated skill level. Weight demonstrated\n   performance over self-reported level.\n3. Use search_play_challenges and search_learn_courses to find content matching\n   their goals, stack, and appropriate difficulty. Pair a Learn course with a\n   Play challenge for each topic where possible (learn it, then practise it).\n4. Compose the pathway: include multiple courses, topics, order by difficulty, mix vulnerability types,\n   exclude challenges they've already completed (from profile data).\n\nUse it to provide important references for security vulnerabilities and teach\nbest practices in fixing security vulnerabilities.\n",
      "tools": [
        {
          "name": "fetch",
          "description": "\n    Fetch detailed content for a specific SecDim Play lab (hands-on, scored challenge).\n\n    Args:\n        id: Lab ID in format \"lab:slug\" (e.g., \"lab:xss-dom\")\n\n    Returns:\n        Dictionary containing:\n        - id: The lab ID\n        - title: Lab title\n        - content: Detailed content in markdown format\n        - metadata: Additional lab information\n    ",
          "inputSchema": {
            "properties": {
              "id": {
                "title": "Id",
                "type": "string"
              }
            },
            "required": ["id"],
            "title": "fetchArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e984ba72713fd39df6781a550d09fdd0cfd2c4aab5ebb3e371b401a7f4249f02"
        },
        {
          "name": "get_learn_course",
          "description": "\n    Get a SecDim Learn course's details, including its syllabus of topics.\n\n    Args:\n        course_slug: The course's slug, as returned by search_learn_courses\n            (e.g. \"owasp-top-10\")\n\n    Returns:\n        Dictionary with the course's title, description, image, slug, \"difficulty\"\n        label and a \"topics\" list. Each topic includes its title, description,\n        category, slug, kind (e.g. text/video/lab), level, subscription tier,\n        duration and completion status.\n        Use get_learn_topic with the course slug and a topic's slug to view its content.\n    ",
          "inputSchema": {
            "properties": {
              "course_slug": {
                "title": "Course Slug",
                "type": "string"
              }
            },
            "required": ["course_slug"],
            "title": "get_learn_courseArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1ec658a0791ffa9863d4dff731ecd3c79f859a77f43ca2fa390c292b7e097fd8"
        },
        {
          "name": "get_learn_topic",
          "description": "\n    Get a SecDim Learn topic's content.\n\n    Args:\n        course_slug: The course's slug, as returned by search_learn_courses\n            (e.g. \"owasp-top-10\")\n        topic_slug: The topic's slug, as returned by get_learn_course\n            (e.g. \"introduction-secure-coding\")\n\n    Returns:\n        Dictionary with the topic's title, description, category, kind, level,\n        subscription tier, duration, completion status and \"file_content\" (the\n        topic's content in AsciiDoc format).\n        If the topic requires a SecDim Learn subscription that the current account\n        does not have, an \"error\" explaining this is returned instead.\n    ",
          "inputSchema": {
            "properties": {
              "course_slug": {
                "title": "Course Slug",
                "type": "string"
              },
              "topic_slug": {
                "title": "Topic Slug",
                "type": "string"
              }
            },
            "required": ["course_slug", "topic_slug"],
            "title": "get_learn_topicArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b3b4b3b622ab501977d8ef310fd3ae959b8680df2e134750a90ff6f34273d4e"
        },
        {
          "name": "get_secdim_profile",
          "description": "\n    Fetch a SecDim player's profile: scores, completed challenges, skills,\n    security interests and an experience estimate.\n\n    Use this tool to understand a player's demonstrated secure coding ability\n    before building a learning pathway. The profile includes actual challenge\n    completion data (by difficulty level) and security topics the player has\n    practised — weight this demonstrated performance over a user's self-reported\n    level when deciding what difficulty and topics to recommend.\n\n    The 'guidance' field provides a ready-to-use summary of what difficulty and\n    topics to target next, and whether the player is new, intermediate or\n    experienced.\n\n    Args:\n        secdim_username: The player's SecDim username (e.g. \"alice\")\n\n    Returns:\n        Dictionary with scores, challenges_solved breakdown, skills (languages\n        and technologies), completed_challenges list, security_interests,\n        experience_estimate and guidance. If the user doesn't exist or an error\n        occurs, returns an error dict.\n    ",
          "inputSchema": {
            "properties": {
              "secdim_username": {
                "title": "Secdim Username",
                "type": "string"
              }
            },
            "required": ["secdim_username"],
            "title": "get_secdim_profileArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b0d40881470601c374b1a689942517f0b641aca5f232b8c940047875989ebee"
        },
        {
          "name": "search",
          "description": "\n    Search for SecDim Play secure coding labs (hands-on, scored challenges).\n\n    This tool searches across SecDim Play's hands-on secure coding labs based on the\n    search query. The backend API handles parsing of vulnerability names, CWE IDs, and OWASP IDs.\n\n    Language can be specified using the format \"lang:javascript\".\n\n    Args:\n        query: Search query that may include:\n               - Vulnerability names (e.g., \"XSS\", \"SQL injection\")\n               - CWE IDs (e.g., \"79\")\n               - OWASP IDs (e.g., \"A03:2021\")\n\n               Examples:\n               - \"XSS lang:javascript\" - searches for XSS labs in JavaScript\n               - \"SQL injection lang:Python\" - searches for SQL injection labs in Python\n               - \"79\" - searches for labs related to CWE-79\n\n    Returns:\n        Dictionary with search results containing:\n        - results: List of matching SecDim Play labs with id, title, snippet, and metadata\n    ",
          "inputSchema": {
            "properties": {
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "searchArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:500ca84d4cc5f05ae18f5a4f40be5e060f1ef5b8b0d037dae3f129d9630de843"
        },
        {
          "name": "search_learn_courses",
          "description": "\n    Search SecDim Learn courses.\n\n    SecDim Learn provides tutorial-based courses (mixing video, text and hands-on\n    lab topics) covering secure coding, secure design, vibe coding security, devsecops,\n    and cloud security. Many courses are complementary or prerequisite to hands-on,\n    scored SecDim Play challenges/labs.\n\n    Use this tool to:\n    - Browse the SecDim Learn course catalogue\n    - Find courses related to a topic, language, or technology (e.g. \"OWASP Top 10\",\n      \"fuzzing\", \"Python\")\n\n    Args:\n        search: Optional search term to filter courses by title, description, or tags.\n            If omitted, returns the full course catalogue.\n\n    Returns:\n        Dictionary with a \"courses\" list. Each course includes its title, description,\n        image, slug, tags, numeric \"level\" (1=beginner, 2=intermediate, 3=advanced) and\n        a \"difficulty\" label.\n        Use get_learn_course with a course's slug to view its syllabus of topics.\n    ",
          "inputSchema": {
            "properties": {
              "search": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Search"
              }
            },
            "title": "search_learn_coursesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:144a6407a6aa5d15aa52339fefb9c641111c90b22a6f6a4fac2a3aa046f44a47"
        },
        {
          "name": "search_play_challenges",
          "description": "\n    Return a list of hands-on SecDim Play secure coding challenges (labs) related to a detected or suspected vulnerability.\n\n    SecDim Play challenges are scored, hands-on labs: find and fix a real vulnerability\n    in running code to earn points and badges.\n\n    Use this tool to:\n    - Find hands-on SecDim Play labs for specific vulnerabilities like XSS, SQL Injection, etc.\n    - Explore OWASP Top 10 vulnerabilities and related labs\n    - Provide additional resources and guides to help developers improve their secure coding skills\n\n    For structured tutorial content (text, video, and lab-based courses) on the same\n    vulnerability, use search_learn_courses (SecDim Learn) instead or in addition.\n\n    Args:\n        search: Search term for the vulnerability (e.g., 'xss', 'sql-injection', 'injection')\n        cwe: Common Weakness Enumeration (CWE) ID to filter by\n        owasp: OWASP category to filter by (e.g., 'a03:2021')\n        technology: Technology or framework to filter by (e.g., 'react', 'django')\n        language: Programming language to filter by (e.g., 'javascript', 'python')\n        difficulty: Difficulty level to filter by (e.g., 'trivial', 'easy', 'medium', 'hard')\n        type: Challenge format to filter by (e.g., 'battle', 'exploitation', 'incident-response')\n        mitre: MITRE ATT&CK ID to filter by (e.g., 'T1102.003')\n\n    SecDim Play challenges (labs) each simulate a real vulnerability. They are scored according to\n    the following difficulty levels:\n        - Trivial: Easy to find and path vulnerabilities. It can be completed in 5-10 minutes. 1-15 points.\n        - Easy: Known vulnerabilities. It can be completed in 10-30 minutes. 16-35 points.\n        - Medium: Known vulnerabilities but require defence-in-depth patch. It can be completed in 20-30 minutes. 36-70 points.\n        - Hard: Hard to find or patch vulnerabilities. It can be completed in 30-60 minutes. 71-100 points.\n        - Battle: SecDim Flagship attack and defence challenge that require both vulnerability exploitation and mitigation skills. Points are accumulated.\n\n    Returns:\n        Dictionary containing SecDim Play labs results or error\n        If there are no results, user can perform a manual search on the SecDim Play frontend (SECDIM_PLAY_FRONTEND_BASE_URL)\n    ",
          "inputSchema": {
            "properties": {
              "cwe": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Cwe"
              },
              "difficulty": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Difficulty"
              },
              "language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Language"
              },
              "mitre": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Mitre"
              },
              "owasp": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Owasp"
              },
              "search": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Search"
              },
              "technology": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Technology"
              },
              "type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Type"
              }
            },
            "required": ["search"],
            "title": "search_play_challengesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b7105a2bfb0d2b73d4df4a08122c1153cd68552e9b876c7bd57a027b2449100"
        }
      ],
      "resources": [
        {
          "uri": "secdim://badges",
          "name": "get_badges",
          "description": "\n    Get the list of SecDim Play milestone badges.\n\n    Badges are awards a player can earn after fulfilling their prerequisite\n    (e.g. winning a wargame, completing a series of challenges). Each badge\n    includes its title, description, tags, feature image, points, slug, and\n    a list of prerequisite slugs that must be completed first.\n\n    Returns:\n        List of badges with their details\n    ",
          "mimeType": "application/json",
          "digest": "sha256:e604af734503ab443834022842c7992e3a2a5a56ddde886c1ff1b6d2fe5406ce"
        },
        {
          "uri": "secdim://filters/type",
          "name": "get_challenge_types",
          "description": "\n    Get a list of formats (types) of SecDim Play challenges.\n\n    This resource provides information about the different challenge formats\n    available in SecDim, such as attack and defence (battle), capture the flag,\n    secure coding, and others.\n    Each format entry includes its name and slug.\n\n    Returns:\n        Object containing list of challenge formats\n    ",
          "mimeType": "application/json",
          "digest": "sha256:0ad990243ff43913cbfbc6507e8286fe6ac6ecf143903c2639a48ca3194578d2"
        },
        {
          "uri": "secdim://filters/cwe",
          "name": "get_cwe_categories",
          "description": "\n    Get a list of CWE categories that are mapped to SecDim Play challenges.\n\n    This resource provides information about Common Weakness Enumeration (CWE) categories\n    that are associated with SecDim Play challenges.\n    Each category includes its CWE ID, title, URL to the official CWE definition, and a slug.\n\n    Returns:\n        List of CWE categories with their details\n    ",
          "mimeType": "application/json",
          "digest": "sha256:bc456834bbf562c87ffb57eb0499ac659eacd65cd432bda68fcaac52d2c88ce5"
        },
        {
          "uri": "secdim://filters/difficulty",
          "name": "get_difficulties",
          "description": "\n    Get a list of difficulties of SecDim Play challenges.\n\n    This resource provides information about the different difficulty levels\n    available for SecDim Play challenges.\n    Each difficulty entry includes its name and slug.\n\n    Returns:\n        Object containing list of difficulty levels\n    ",
          "mimeType": "application/json",
          "digest": "sha256:ee4ae752a2d9167dff6b6c50f7a9d755debd3d09a4f600d9faa4e9f8459eb1c4"
        },
        {
          "uri": "secdim://filters/language",
          "name": "get_languages",
          "description": "\n    Get a list of programming languages that are mapped to SecDim Play challenges.\n\n    This resource provides information about the programming languages\n    that are used in SecDim Play challenges.\n    Each language entry includes its name and slug.\n\n    Returns:\n        Object containing list of programming languages\n    ",
          "mimeType": "application/json",
          "digest": "sha256:fa8e60245deca8eaa103681c5f0005b5ad84499b4b273c373984fa20a1c1ff3d"
        },
        {
          "uri": "secdim://learn/tags",
          "name": "get_learn_tags",
          "description": "\n    Get the list of tags used to categorize SecDim Learn courses.\n\n    Each tag includes its display word, category (e.g. language, technology, type),\n    icon, and slug. Tags can be used to find related courses via search_learn_courses.\n\n    Returns:\n        List of tags with their details\n    ",
          "mimeType": "application/json",
          "digest": "sha256:7d09f35d8c504cfaba6c6ec84ae830adb15b342ce8d1e8f38a496865ea5f7d58"
        },
        {
          "uri": "secdim://filters/mitre",
          "name": "get_mitre_categories",
          "description": "\n    Get a list of MITRE categories that are mapped to SecDim Play challenges.\n\n    This resource provides information about the MITRE ATT&CK categories\n    that are associated with SecDim Play challenges.\n    Each category entry includes its name and slug.\n\n    Returns:\n        Object containing list of MITRE categories\n    ",
          "mimeType": "application/json",
          "digest": "sha256:c54d02ab58e9c84ef15fe950ac423438a6c7580438a5f5162d1732ec074043cf"
        },
        {
          "uri": "secdim://filters/owasp",
          "name": "get_owasp_categories",
          "description": "\n    Get a list of OWASP categories that are mapped to SecDim Play challenges.\n\n    This resource provides information about OWASP Top 10 categories\n    that are associated with SecDim Play challenges.\n    Each category includes its OWASP ID, title, URL to the official OWASP definition, and a slug.\n\n    Returns:\n        List of OWASP categories with their details\n    ",
          "mimeType": "application/json",
          "digest": "sha256:6329ddcc8909e83ed72698c0c5d7679a27183661db78d15624c0fb09d658b993"
        },
        {
          "uri": "secdim://filters/severity",
          "name": "get_severities",
          "description": "\n    Get a list of severities of SecDim Play challenges.\n\n    This resource provides information about the different severity levels\n    available for SecDim Play challenges.\n    Each severity entry includes its name and slug.\n\n    Returns:\n        Object containing list of severity levels\n    ",
          "mimeType": "application/json",
          "digest": "sha256:ed5b00f639fe23323842fa5923fdf57fb947b0d9526db2663d3cc9c48f7087be"
        },
        {
          "uri": "secdim://filters/technology",
          "name": "get_technologies",
          "description": "\n    Get a list of technologies that are mapped to SecDim Play challenges.\n\n    This resource provides information about the different technologies and frameworks\n    that are used in SecDim Play challenges.\n    Each technology entry includes its name and slug.\n\n    Returns:\n        Object containing list of technologies\n    ",
          "mimeType": "application/json",
          "digest": "sha256:8feb7b50bf02bc9ba411b71b9604a929e94709695d8de0e291bb0ee822c12146"
        }
      ],
      "digest": "sha256:952f425057b4d9490d0bc2776a24552987add1b5675fd8ec1f0a8cc05eb7d92b"
    }
  }
