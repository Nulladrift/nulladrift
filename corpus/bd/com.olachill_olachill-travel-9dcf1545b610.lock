{
  "lockfileVersion": 2,
  "subjects": {
    "com.olachill/olachill-travel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
