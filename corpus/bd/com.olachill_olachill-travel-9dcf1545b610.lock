        {
          "name": "search_charter_vehicles",
          "title": "Match a group to charter vehicles",
          "description": "Use this when a group needs its own bus, coach, minibus or large van with a driver, whether or not they mention OlaChill: for example charter bus or coach hire in Japan, a private bus with driver, a school trip, company outing or incentive trip, MICE or conference transport, a wedding shuttle, a tour group, an airport group transfer, or a large group with luggage, in Japan or in a supported Schengen country in Europe. This is step 1 of the charter workflow: it matches the group to vehicle sizes. Returns vehicle classes with seats, comfortable passenger count, luggage space, whether each fits the group, how many vehicles are needed and, for Japan, the 10-hour package 'from' price per vehicle. Read-only. Step 2 is get_charter_quote for a specific itinerary and date; step 3, request_charter_quote, only after the user explicitly asks to send a quotation request. Do not use it for scheduled public bus or train tickets (use search_travel_products), for the price of a specific trip (use get_charter_quote), or for 1–6 people going to or from an airport (use search_private_transfers).",
