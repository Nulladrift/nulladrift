        {
          "name": "search_esim_plans",
          "title": "Find a Japan eSIM plan",
          "description": "Use this when the user wants mobile data in Japan on an eSIM: which travel eSIM covers a trip of a given length, unlimited data versus 3GB per day, what it costs, or a monthly eSIM (data only, or with a phone number) for living in Japan longer than 90 days. Returns plans with data allowance, validity, the tax-included price in JPY and the order page. Read-only. Do not use it for physical SIM cards, pocket Wi-Fi rental, roaming in other countries, or phone repair; for whether a phone supports eSIM, point the user to the compatibility page in the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "description": "Travel eSIM only: unlimited data, 3GB per day, or any. Default any.",
                "enum": ["unlimited", "3gb_per_day", "any"],
                "type": "string"
              },
              "days": {
                "description": "Number of days the user will be in Japan and needs data. Trips longer than 90 days return monthly plans.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language for product names and page links (en, ja, ko, zh = Simplified Chinese, tw = Traditional Chinese, es, fr, de, it, th, id, vi). Default en.",
                "enum": ["en", "ja", "ko", "zh", "tw", "es", "fr", "de", "it", "th", "id", "vi"],
                "type": "string"
              },
              "stay_type": {
                "description": "travel = short trip (up to 90 days); monthly = living in Japan, renewed every month. Default: travel when days is 90 or less, otherwise monthly.",
                "enum": ["travel", "monthly"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "compatibility_url": {
                "description": "Page that explains which phones support eSIM.",
                "type": "string"
              },
