        {
          "name": "request_charter_quote",
          "title": "Send a charter quote request",
          "description": "Use this only when the user explicitly asks OlaChill to check availability and send a quotation for a charter coach, minibus or van, after you have shown an estimate from get_charter_quote and collected: region (and country for Europe), pickup, destination, travel date, passengers, and the traveller's own name and email (plus a phone number for Japan). This sends the request to OlaChill's charter desk and emails the traveller a copy; for Japan, vetted bus operators are invited to offer a price without seeing the traveller's contact details. It creates a request record and returns its reference and status. It does not book, reserve or charge anything. Do not call it while the user is still comparing or only asked for a price, never guess or invent contact details, and set user_confirmed to true only after the user agreed to send this exact request. Repeating the same Japan request within 45 minutes returns the existing reference.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company, school or organisation, if the user mentioned one.",
                "maxLength": 120,
                "type": "string"
              },
              "contact_email": {
                "description": "Traveller's email exactly as they gave it; the quotation is sent here.",
                "format": "email",
                "maxLength": 160,
                "type": "string"
              },
              "contact_name": {
                "description": "Traveller's full name exactly as they gave it.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "contact_phone": {
                "description": "Traveller's phone with country code. Required for Japan requests.",
                "maxLength": 40,
                "type": "string"
              },
              "country": {
                "description": "Required when region is europe.",
                "enum": ["france", "italy", "germany", "switzerland", "spain", "netherlands", "austria", "czech-republic", "portugal", "belgium", "poland", "hungary", "greece", "croatia", "denmark", "sweden", "norway", "finland", "iceland", "estonia", "latvia", "lithuania", "luxembourg", "malta", "slovakia", "slovenia", "romania", "bulgaria"],
                "type": "string"
              },
              "date": {
                "description": "Travel date as YYYY-MM-DD (Japan time for Japan trips).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Main destination as the user described it.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "end_date": {
                "description": "Last day for multi-day hire as YYYY-MM-DD (Japan time for Japan trips).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "large_bags": {
                "description": "Number of large suitcases.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "locale": {
                "description": "Language for product names and page links (en, ja, ko, zh = Simplified Chinese, tw = Traditional Chinese, es, fr, de, it, th, id, vi). Default en.",
                "enum": ["en", "ja", "ko", "zh", "tw", "es", "fr", "de", "it", "th", "id", "vi"],
                "type": "string"
              },
              "notes": {
                "description": "Itinerary stops, timing or special needs the user asked to pass on. No payment details.",
                "maxLength": 1000,
                "type": "string"
              },
              "passengers": {
                "description": "Number of travellers.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "pickup": {
                "description": "Pickup place as the user described it.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "pickup_prefecture": {
                "description": "Japan only: prefecture of the pickup, e.g. Tokyo, Osaka, Kyoto, Chiba. Helps OlaChill invite local operators.",
                "maxLength": 40,
                "type": "string"
              },
              "pickup_time": {
                "description": "Pickup time HH:MM, 24-hour, local time.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "region": {
                "description": "japan, or europe for Schengen countries.",
                "enum": ["japan", "europe"],
                "type": "string"
              },
              "user_confirmed": {
                "const": true,
                "description": "Must be true: the user has reviewed the trip details and asked to send this request.",
                "type": "boolean"
              },
              "vehicle_count": {
                "description": "Number of vehicles, from get_charter_quote.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "vehicle_type": {
                "description": "vehicle_type from get_charter_quote.",
                "type": "string"
              }
            },
            "required": ["contact_email", "contact_name", "date", "destination", "passengers", "pickup", "region", "user_confirmed"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "confirmation_email_sent": {
                "type": "boolean"
              },
              "duplicate": {
                "type": "boolean"
              },
              "error": {
                "description": "Present only when the call failed; a short reason the user can act on.",
                "type": "string"
              },
