        {
          "name": "search_travel_products",
          "title": "Search tours, activities & tickets",
          "description": "Use this when the user wants to find, compare or price things to do in Japan, whether or not they mention OlaChill: guided and private day tours and day trips (for example Mt Fuji, Hakone, Nikko, Kamikochi, Kyoto or Nara from Tokyo, Osaka or Nagoya), multi-day tours, local food and neighbourhood tours, street go-kart rides in Tokyo or Osaka, activities and cultural experiences (kimono rental, tea ceremony, cooking classes, crafts), attraction admission tickets (for example teamLab, Tokyo Skytree, theme parks, museums), transport tickets and passes (highway and overnight buses, airport buses, JR and regional rail passes) or a ryokan stay. Ryokan means a traditional Japanese inn, usually with onsen: search by area (Hakone, Kyoto, Ginzan, Kusatsu, Kinosaki, Kurokawa, Yufuin, Beppu and others) with category 'ryokan'; the filters private_onsen (private open-air baths in the room or a reservable private bath), meal_plan (dinner and breakfast), max_price_per_person_jpy and group_size (family or group stays; OlaChill also takes block-of-rooms and whole-inn requests on the ryokan pages) apply only then. Ryokan prices are dated reference prices, not live availability; OlaChill confirms rooms and the current price after the traveller sends dates on the ryokan page. Returns product ids, names, category, area, a 'from' price in JPY with its unit, booking method, key conditions and the product page URL. Read-only. Then use check_product_availability for dates of a tour or ticket. Do not use it for a bus, coach or minibus for a group (use search_charter_vehicles), a private car to or from an airport (use search_private_transfers), helicopter flights (use search_helicopter_experiences), single Shinkansen or train tickets and timetables, hotels other than ryokan, airline flights, restaurants, or general destination advice that does not need a bookable product. Provide at least one of query, city or category. Prices are 'from' prices; the final price and dates are confirmed on the product page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
