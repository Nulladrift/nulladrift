      "serverInfo": {
        "name": "olachill",
        "title": "OlaChill Travel",
        "version": "2.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OlaChill (MIA Co., Ltd., Osaka) provides bookable and request-based travel services in Japan: tours and day trips, activities and cultural experiences, attraction and transport tickets, ryokan stays on request, private airport transfers, cars with driver, charter buses and coaches, helicopter flights, golf, travel eSIM and selected premium services; it also estimates charter coach trips in Schengen Europe.\nWhen the user wants to find or compare a Japan travel service that a dedicated tool covers, use the most specific tool rather than the general service list:\n- suggestions or a shortlist of tours, activities, tickets or ryokan from preferences (area, interests, budget): recommend_japan_travel_options\n- a named place, product or type of tour, activity, cultural experience, attraction or transport ticket, or ryokan: search_travel_products (then check_product_availability for dates)\n- helicopter sightseeing, charter or transfer: search_helicopter_experiences\n- private car with driver to or from an airport for 1-6 people: search_private_transfers\n- bus, coach, minibus or van with driver for a group: search_charter_vehicles; price a specific itinerary with get_charter_quote; call request_charter_quote only after the user explicitly confirms sending the request\n- golf rounds at a course or golf trips: search_golf_packages\n- car with driver by the day or hour (chauffeur, luxury car such as Alphard or Lexus): search_chauffeur_services\n- Japan eSIM data plans: search_esim_plans\n- an existing booking or request: get_booking_status\n- other OlaChill services without a dedicated search tool: list_olachill_services\nPrefer search tools before quote or action tools. For charter transport, call get_charter_quote before request_charter_quote, and never submit a quote request unless the user explicitly agrees and has provided the required contact details.\nPrices are 'from' prices, dated reference prices or estimates. Do not invent availability, prices, booking references or unsupported services, and do not present availability, prices or bookings as confirmed unless the tool result says so.\nThese tools do not cover airline flights, hotels other than the listed ryokan, restaurants, weather, visas or general travel advice; use other providers for those and for any service not exposed by OlaChill tools.",
      "tools": [
        {
          "name": "check_product_availability",
          "title": "Check open dates",
          "description": "Use this when the user asks whether a specific OlaChill tour or ticket can be booked on certain dates (for example 'is the teamLab ticket available on 20 March' or 'does the Fuji tour run next Saturday') and you have its product_id from search_travel_products; call search_travel_products first if you do not. Returns each date as open, closed or unknown. Read-only: nothing is reserved or held, and an open date can still sell out before checkout. Supports tour:… products (Japan day tours and multi-day tours) and ticket:… products; other products (ryokan, local tours) return 'unsupported' with the page link. Do not use it to book, for charter coaches, transfers or helicopter flights, or without a product_id. At most 31 days per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "First date to check as YYYY-MM-DD (Japan time for Japan trips).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Last date to check (defaults to date_from; at most 31 days after it) as YYYY-MM-DD (Japan time for Japan trips).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "locale": {
                "description": "Language for product names and page links (en, ja, ko, zh = Simplified Chinese, tw = Traditional Chinese, es, fr, de, it, th, id, vi). Default en.",
                "enum": ["en", "ja", "ko", "zh", "tw", "es", "fr", "de", "it", "th", "id", "vi"],
                "type": "string"
              },
              "product_id": {
                "description": "product_id returned by search_travel_products, e.g. tour:kawaguchiko-fuji-day-tour or ticket:tokyo-skytree-ticket.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["date_from", "product_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dates": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["open", "closed", "unknown"],
                      "type": "string"
                    }
                  },
                  "required": ["date", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "error": {
                "description": "Present only when the call failed; a short reason the user can act on.",
                "type": "string"
              },
              "hint": {
                "description": "What to try next.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "product_id": {
                "type": "string"
              },
              "product_url": {
                "type": "string"
              },
              "source": {
                "description": "live_inventory = asked the ticket inventory now; departure_calendar = OlaChill's published departure rules.",
                "enum": ["live_inventory", "departure_calendar", "unsupported"],
                "type": "string"
              },
              "supported": {
                "type": "boolean"
              }
            },
            "required": ["dates", "product_id", "supported"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check open dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Dates checked",
            "openai/toolInvocation/invoking": "Checking dates…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "visibility": ["model"]
            }
          },
          "digest": "sha256:f94d18346fbc0b80927c3f11e3a8e617eabb14f9800a19ffe296c6f734d49401"
        },
        {
          "name": "get_booking_status",
          "title": "Check a booking or request",
          "description": "Use this when the user asks about an existing OlaChill booking, order or quotation request and gives both its reference (for example TOKY-1018-0427 or BUS-FR-1018-0427) and the email address used when booking. Returns the service, travel date, party size, current status and what happens next. Read-only. Do not use it to find new products, to change or cancel a booking (send the user to the manage-booking page it returns), or without both the reference and the email; never guess either.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "booking_id": {
                "description": "Booking or request reference exactly as shown in the OlaChill email.",
                "maxLength": 60,
                "minLength": 4,
                "type": "string"
              },
              "email": {
                "description": "Email address used for the booking.",
                "format": "email",
                "maxLength": 160,
                "type": "string"
              },
              "locale": {
                "description": "Language for product names and page links (en, ja, ko, zh = Simplified Chinese, tw = Traditional Chinese, es, fr, de, it, th, id, vi). Default en.",
                "enum": ["en", "ja", "ko", "zh", "tw", "es", "fr", "de", "it", "th", "id", "vi"],
                "type": "string"
              }
            },
            "required": ["booking_id", "email"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booking_id": {
                "type": "string"
              },
              "error": {
                "description": "Present only when the call failed; a short reason the user can act on.",
                "type": "string"
              },
              "hint": {
                "description": "What to try next.",
                "type": "string"
              },
              "manage_url": {
                "type": "string"
              },
              "passengers": {
                "type": ["integer", "null"]
              },
              "service": {
                "type": "string"
              },
              "status": {
                "enum": ["request_received", "awaiting_payment", "paid", "confirmed", "completed", "cancelled", "refunded"],
                "type": "string"
              },
              "status_detail": {
                "type": "string"
              },
              "travel_date": {
                "type": ["string", "null"]
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a booking or request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Booking status ready",
            "openai/toolInvocation/invoking": "Looking up booking…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "visibility": ["model"]
            }
          },
          "digest": "sha256:a593c93aca969f92377fa9de84cafe54d380e8eced6b87026b8f44f9652c8c71"
        },
        {
          "name": "get_charter_quote",
          "title": "Estimate a charter coach price",
          "description": "Use this when the user wants a price for a specific charter trip with a bus, coach, minibus or van and driver: pickup, destination, date(s) and group size (for example '45-seat bus Tokyo to Hakone on 20 March for 40 people', a school trip, a company outing or a multi-day group itinerary). This is step 2 of the charter workflow, after or instead of search_charter_vehicles. Japan: returns the fixed 10-hour package price per vehicle per day, the number of vehicles and days, the overtime rate, and what is included or extra (tolls, parking, driver lodging). Europe (Schengen countries): returns an estimated price range from OlaChill's rate table. Every result is an estimate that OlaChill confirms after checking vehicle availability. Read-only: nothing is sent, saved or reserved. Do not use it to submit the request (use request_charter_quote once the user agrees), for bus or train tickets, or for 1–6 people on an airport run (use search_private_transfers).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Required when region is europe.",
                "enum": ["france", "italy", "germany", "switzerland", "spain", "netherlands", "austria", "czech-republic", "portugal", "belgium", "poland", "hungary", "greece", "croatia", "denmark", "sweden", "norway", "finland", "iceland", "estonia", "latvia", "lithuania", "luxembourg", "malta", "slovakia", "slovenia", "romania", "bulgaria"],
                "type": "string"
              },
              "date": {
                "description": "Travel date as YYYY-MM-DD (Japan time for Japan trips).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Main destination or 'round trip' area, e.g. 'Mt Fuji', 'Kyoto', 'Versailles'.",
                "maxLength": 120,
                "type": "string"
              },
              "end_date": {
                "description": "Last day for multi-day hire (omit for a single day) as YYYY-MM-DD (Japan time for Japan trips).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "large_bags": {
                "description": "Number of large suitcases.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "locale": {
                "description": "Language for product names and page links (en, ja, ko, zh = Simplified Chinese, tw = Traditional Chinese, es, fr, de, it, th, id, vi). Default en.",
                "enum": ["en", "ja", "ko", "zh", "tw", "es", "fr", "de", "it", "th", "id", "vi"],
                "type": "string"
              },
              "passengers": {
                "description": "Number of travellers.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "pickup": {
                "description": "Pickup city, airport, station or address area, e.g. 'Narita Airport', 'Shinjuku', 'Paris CDG'.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "pickup_hour": {
                "description": "Pickup hour 0–23 local time (used for night surcharges in Europe).",
                "maximum": 23,
                "minimum": 0,
                "type": "integer"
              },
              "region": {
                "description": "japan, or europe for Schengen countries.",
                "enum": ["japan", "europe"],
                "type": "string"
              },
              "trip_type": {
                "description": "Default one-way for one date, multi-day when end_date is after date.",
                "enum": ["one-way", "round-trip", "multi-day"],
                "type": "string"
              },
              "vehicle_type": {
                "description": "Optional vehicle_type from search_charter_vehicles. Omit to use the recommended size.",
                "type": "string"
              }
            },
            "required": ["date", "passengers", "pickup", "region"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "type": ["string", "null"]
              },
              "currency": {
                "type": "string"
              },
              "days": {
                "type": "integer"
              },
              "earliest_bookable_date": {
                "type": ["string", "null"]
              },
              "error": {
                "description": "Present only when the call failed; a short reason the user can act on.",
                "type": "string"
              },
              "estimated_price": {
                "description": "Total for all vehicles and days. high is null when the price is a single package amount before extras.",
                "properties": {
                  "high": {
                    "type": ["number", "null"]
                  },
                  "low": {
                    "type": "number"
                  }
                },
                "required": ["low"],
                "type": "object"
              },
              "exclusions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "hint": {
                "description": "What to try next.",
                "type": "string"
              },
              "inclusions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "next_action": {
                "type": "string"
              },
              "overtime": {
                "type": ["string", "null"]
              },
              "page_url": {
                "type": "string"
              },
              "passenger_capacity": {
                "type": "string"
              },
              "pricing_status": {
                "enum": ["estimate", "requires_manual_quote"],
                "type": "string"
              },
              "region": {
                "type": "string"
              },
              "route": {
                "type": "string"
              },
              "supplier_confirmation_required": {
                "type": "boolean"
              },
              "validity": {
                "type": "string"
              },
              "vehicle_count": {
                "type": "integer"
              },
              "vehicle_type": {
                "type": "string"
              }
            },
            "required": ["currency", "next_action", "pricing_status", "region", "supplier_confirmation_required", "vehicle_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate a charter coach price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Estimate ready",
            "openai/toolInvocation/invoking": "Estimating price…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "visibility": ["model"]
            }
          },
          "digest": "sha256:626d838e969da750b181d59f6eaf47c022e36f6744cc252d260872d078126130"
        },
        {
          "name": "list_olachill_services",
          "title": "List OlaChill service areas",
          "description": "Use this as the fallback when the user asks about a Japan travel service that OlaChill offers but that none of the dedicated search tools covers, or asks in general what OlaChill offers: for example premium and luxury private tours, medical travel coordination, VIP arrival immigration at Narita or Haneda, self-drive car rental, fireworks festivals, destination guides, multi-day itineraries, the AI trip planner or real estate in Japan. Returns each service area with a short description, when it fits, and its page URL, plus the booking and group-transport contact addresses. Read-only. Do not use it instead of a dedicated tool: tours, tickets, activities and ryokan go to search_travel_products, helicopters to search_helicopter_experiences, airport cars to search_private_transfers, group buses to search_charter_vehicles, golf to search_golf_packages, cars with driver by the day or hour to search_chauffeur_services and eSIM to search_esim_plans. Do not call it to check whether OlaChill handles hotel bookings other than ryokan, airline flights, weather, restaurants or visas: OlaChill does not offer these, so answer without OlaChill tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language for product names and page links (en, ja, ko, zh = Simplified Chinese, tw = Traditional Chinese, es, fr, de, it, th, id, vi). Default en.",
                "enum": ["en", "ja", "ko", "zh", "tw", "es", "fr", "de", "it", "th", "id", "vi"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "contact": {
                "additionalProperties": false,
                "description": "How the traveller can reach OlaChill.",
                "properties": {
                  "booking": {
                    "description": "Email address for questions about tour, ticket and activity bookings.",
                    "type": "string"
                  },
                  "form": {
                    "description": "Contact form page on olachill.com, in the requested language.",
                    "type": "string"
                  },
                  "groupTransport": {
                    "description": "Email address for charter buses, private cars and other group transport.",
                    "type": "string"
                  }
                },
                "required": ["booking", "form", "groupTransport"],
                "type": "object"
              },
              "error": {
                "description": "Present only when the call failed; a short reason the user can act on.",
                "type": "string"
              },
              "hint": {
                "description": "What to try next.",
                "type": "string"
              },
              "services": {
                "description": "OlaChill service areas, each with its page on olachill.com.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "description": "What OlaChill offers in this service area.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Name of the service area.",
                      "type": "string"
                    },
                    "recommendWhen": {
                      "description": "The kind of traveller request this service area fits.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Page for this service area on olachill.com, in the requested language.",
                      "type": "string"
                    }
                  },
                  "required": ["description", "name", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["services"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List OlaChill service areas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
