        {
          "name": "recommend_japan_travel_options",
          "title": "Recommend Japan travel options",
          "description": "Use this when the user asks for recommendations, suggestions, a shortlist, 'what should we do', or 'which option fits us' among bookable Japan tours, activities, cultural experiences, attraction or transport tickets, and ryokan, based on preferences such as area, interests, budget, private onsen or meal plan. It ranks only OlaChill catalogue items against the supplied criteria and returns explicit match reasons, considerations, the published 'from' price and product URL. Read-only. Use search_travel_products instead when the user names a specific product, attraction or route and mainly wants an exact inventory lookup. Do not use it for helicopter flights, private airport transfers, charter vehicles, airline flights, hotels other than ryokan, restaurants, weather, visas or general destination advice without a request for bookable options. Prices and availability can change; the product page has the final details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional product type to narrow the shortlist: tour, activity, cultural_experience, attraction_ticket, transport_ticket or ryokan.",
                "enum": ["tour", "activity", "cultural_experience", "attraction_ticket", "transport_ticket", "ryokan"],
                "type": "string"
              },
              "city": {
                "description": "City or region in Japan to focus on, e.g. Tokyo, Kyoto, Hakone, Hokkaido. Any language.",
                "maxLength": 60,
                "type": "string"
              },
              "group_size": {
                "description": "Ryokan only: party size. For 10 or more guests, only inns with published group facilities qualify.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "interests": {
                "description": "Short traveller interests or trip preferences, e.g. food, culture, family, anime, autumn colors, luxury, honeymoon, skiing. Use short phrases, not the full conversation.",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "limit": {
                "description": "Maximum number of results (1–8, default 5).",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language for product names and page links (en, ja, ko, zh = Simplified Chinese, tw = Traditional Chinese, es, fr, de, it, th, id, vi). Default en.",
                "enum": ["en", "ja", "ko", "zh", "tw", "es", "fr", "de", "it", "th", "id", "vi"],
                "type": "string"
              },
              "max_price_per_person_jpy": {
                "description": "Optional budget ceiling in JPY per person. Applied when the catalogue price has a comparable per-person basis; other price units remain eligible and are flagged.",
                "maximum": 1000000,
                "minimum": 1000,
                "type": "integer"
              },
              "meal_plan": {
                "description": "Ryokan only: dinner_breakfast, breakfast or room_only.",
                "enum": ["dinner_breakfast", "breakfast", "room_only"],
                "type": "string"
              },
              "private_onsen": {
                "description": "Ryokan only: true to require a room open-air bath or a reservable private bath.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "description": "Present only when the call failed; a short reason the user can act on.",
                "type": "string"
              },
              "hint": {
                "description": "What to try next.",
                "type": "string"
              },
              "note": {
                "description": "Scope note explaining how the shortlist was ranked.",
                "type": "string"
              },
              "recommendations": {
                "items": {
                  "properties": {
                    "area": {
                      "description": "Ryokan only: onsen area or region.",
                      "type": ["string", "null"]
                    },
                    "availability_status": {
                      "enum": ["on_sale", "on_request", "closed"],
                      "type": "string"
                    },
                    "booking_method": {
                      "description": "online_checkout = pay on the product page; online_request = OlaChill confirms by email first.",
                      "enum": ["online_checkout", "online_request"],
                      "type": "string"
                    },
                    "category": {
                      "enum": ["tour", "activity", "cultural_experience", "attraction_ticket", "transport_ticket", "ryokan"],
                      "type": "string"
                    },
                    "considerations": {
                      "description": "Important limitations or follow-up checks for this option.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "destination": {
                      "description": "City or region in Japan.",
                      "type": ["string", "null"]
                    },
                    "duration": {
                      "type": ["string", "null"]
                    },
                    "important_conditions": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "key_features": {
                      "description": "Ryokan only: up to four verified features.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "match_reasons": {
                      "description": "Concrete catalogue signals that matched the traveller's supplied criteria.",
                      "items": {
                        "type": "string"
                      },
