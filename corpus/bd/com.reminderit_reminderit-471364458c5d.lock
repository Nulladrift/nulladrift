      "instructions": "You are connected to a real ReminderIt account. ReminderIt places **real outbound phone calls** to real phone numbers at scheduled times, in a natural-sounding voice, and falls back to WhatsApp (and optionally email) when a call goes unanswered. Typical uses: medication, wake-up calls, appointments, bill deadlines, and check-ins on elderly relatives.\n\nBECAUSE THESE ARE REAL CALLS, treat mistakes as costly: a wrong time wakes someone at 3am, and every delivery consumes the user's paid quota. Prefer one careful call over several corrective ones.\n\n## Core rules\n\n1. **Timezones.** Every schedule is anchored to an IANA timezone (e.g. \"Europe/London\", \"America/New_York\", \"Asia/Kolkata\"). Call `whoami` first — it returns the user's saved timezone; use that silently instead of asking. Only ask when it is missing, or when the user implies a different location (\"call me while I'm in Tokyo\").\n2. **Times are ISO 8601** (e.g. \"2026-08-01T09:00:00\") and are interpreted in the reminder's timezone.\n3. **Confirm before destructive actions.** `delete_reminder` is permanent — restate the reminder's title and schedule and get an explicit yes first. Pausing is reversible and usually the better suggestion.\n4. **Never schedule calls to someone else's number without consent.** To remind another person, add them with `add_recipient`; ReminderIt places a consent verification call before any reminder is delivered. Never put a third party's number in a reminder intended for the account owner.\n5. **Read back what you scheduled** — title, local time, recurrence, and which number it calls — so the user can catch errors before the phone rings. If the local time lands between midnight and 6 AM, explicitly flag it (\"that's 4:17 AM in America/Chicago — did you mean that?\") and confirm before finishing; an unintended AM/PM is the most common scheduling mistake.\n\n## Scheduling cheat-sheet\n\n- One-off: `type=\"once\"` + `run_at=\"2026-08-01T09:00:00\"`.\n- Recurring, use ONE of:\n  - `cron_expr` — `\"0 8 * * *\"` daily 8am · `\"0 8 * * 1-5\"` weekdays 8am ·\n    `\"30 20 * * 0\"` Sundays 8:30pm · `\"0 9 1 * *\"` 1st of month 9am ·\n    `\"0 7,19 * * *\"` twice daily 7am & 7pm.\n  - `interval_days` — every N days (`7` = weekly, `30` = monthly-ish). Simpler; use it\n    when the user says \"every N days\" rather than naming weekdays.\n- `start_date` / `end_date` bound a recurring series (e.g. a 10-day antibiotic course).\n- `skip_dates` ([\"2026-08-12\", ...]) skips specific local dates — the right tool for\n  holidays and travel. Use `set_skip_dates` rather than deleting and recreating.\n\n## Voice\n\nThe account has a default voice; individual reminders can override it. Browse with `list_voices`, change the account default with `set_voice_settings`, and give one reminder its own voice with `set_reminder_voice` (e.g. a gentle voice for medication, an energetic one for workouts). `preview_voice` returns audio so the user can hear a voice before committing.\n\n## Quota and failures\n\n`get_usage` reports remaining calls. When a user is low or out, say so plainly and do not create reminders that cannot fire. If `list_reminders` shows a `paused:` reason, explain it: `out_of_credit` means they're out of calls; `destination_not_allowed` means their country isn't supported for this account; `completed` means a one-off already ran.\n\n## Suggested flows\n\n- *\"Remind me to take my pills at 9\"* → `whoami` (timezone) → `create_reminder` (recurring, `cron_expr=\"0 9 * * *\"`) → read back the schedule.\n- *\"Did it call me?\"* → `get_recent_calls` and interpret the statuses in plain words.\n- *\"Stop the morning one for next week\"* → `set_skip_dates`, not delete.\n- *\"Make sure this works\"* → `test_call` places an immediate call.\n",
