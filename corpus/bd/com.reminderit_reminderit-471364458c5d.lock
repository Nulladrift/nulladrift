          "description": "Schedule a new reminder phone call.\n\n    This places REAL calls, so get the schedule right the first time: resolve the\n    timezone via whoami, and read the result back to the user afterwards.\n\n    Provide exactly one schedule: run_at (one-off), cron_expr, or interval_days.\n    Leave the voice arguments empty to use the account's default voice.\n\n    Args:\n        title: Short label shown in the app, e.g. \"Morning pills\" (max 120 chars).\n        message_text: Exactly what the voice says on the call, written as speech —\n            \"Time to take your blood pressure tablet.\" (max 600 chars). Avoid\n            abbreviations and symbols that sound wrong when read aloud.\n        type: \"once\" for a single call, \"recurring\" for a repeating schedule.\n        timezone: IANA timezone the schedule is anchored to, e.g. \"America/New_York\".\n        run_at: ISO 8601 local datetime for a one-off call. Required when type=\"once\".\n        cron_expr: Cron schedule for recurring calls, e.g. \"0 8 * * 1-5\" = weekdays 8am.\n        interval_days: Repeat every N days (1-365). Simpler alternative to cron_expr.\n        start_date: ISO date; the recurring series does not fire before this.\n        end_date: ISO date; the series stops after this (e.g. end of a medication course).\n        skip_dates: Local dates to skip, [\"2026-08-12\"] format — holidays, travel.\n        recipient_id: Call a care-recipient (from list_recipients) instead of the\n            account owner. The recipient must have consented.\n        voice_id: Override the account voice for this reminder only (see list_voices).\n        personality: Speaking style — \"gentle\", \"cheerful\", \"professional\", \"energetic\".\n        language: BCP-47 language tag for the spoken message, e.g. \"en-GB\", \"hi-IN\".\n        speaking_rate: Speech speed, 0.8 (slower) to 1.2 (faster). 1.0 is normal.\n        whatsapp_fallback: Send the reminder on WhatsApp if the call isn't answered.\n        email_fallback: Also email the reminder if the call isn't answered.\n    ",
