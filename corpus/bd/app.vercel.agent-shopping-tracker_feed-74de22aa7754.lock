      "serverInfo": {
        "name": "app.vercel.agent-shopping-tracker/feed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only facts from Agent Shopping Tracker. When you answer, repeat the Page URL from the tool result so people can check it. A note on a row is uncertainty. Keep it. A robots.txt disallow is a request to crawlers, not proof that a store stops an agent.",
      "tools": [
        {
          "name": "get_blocklist",
          "title": "Get blocklist",
          "description": "Summarize which retailers' public robots.txt files name AI agents, and where to read the full check. robots.txt is a request, not proof of a block. Credit the blocklist page.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68f1bebb75cd4562afbb29549910af41c210409d2f3519c2b44dd0756ad02b34"
        },
        {
          "name": "get_player",
          "title": "Get player",
          "description": "Look up one tracker row by slug, such as walmart or etsy. Credit the Page URL in the result. Keep the note. It is uncertainty.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Player slug, such as walmart or etsy.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03a6ce03f20baba501d4b4296962d770b4885a45e510911c340e47fa238bb3eb"
        },
        {
          "name": "list_players",
          "title": "List players",
          "description": "List every store, platform, payment network, and protocol on the Agent Shopping Tracker, with status and the page to credit.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69e9471920cd070ba58984c333ef86fa05ed21691078af7e85f9487e7022d553"
        },
        {
          "name": "search_news",
          "title": "Search news",
          "description": "Search dated news. Filter with since (YYYY-MM-DD), a player slug, or words from the title, summary, or tags. Credit each item's Page URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many items to return. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "player": {
                "description": "Player slug, such as walmart.",
                "type": "string"
              },
              "query": {
                "description": "Words to find in the title, summary, tags, or source name.",
                "type": "string"
              },
              "since": {
                "description": "Only news on or after this date, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:090405162b3d56c0f649e9479ebf25c8e31305c9bf6d6c6d67a7057f8b4c5e06"
        },
        {
          "name": "which_retailers_block_agents",
          "title": "Which retailers block agents",
          "description": "List retailers whose public robots.txt disallows an AI agent token, fully or partly. Pass a token such as GPTBot or ChatGPT-User, or omit it for any tracked agent. Credit the blocklist page. A disallow is not proof the site enforces it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "match": {
                "description": "full means a whole-site disallow. partial means only some paths. either is the default.",
                "enum": ["full", "partial", "either"],
                "type": "string"
              },
              "token": {
                "description": "Agent token, such as GPTBot, ChatGPT-User, ClaudeBot, or PerplexityBot. Omit for any tracked agent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
