          "title": "카볼트랩 가이드 검색",
          "description": "카볼트랩(CarVoltLab)의 가이드 · FAQ · 체크리스트를 검색합니다. 맞춤형 HW · SW 개발 · 장비 데이터 연동 · 수기 입력 자동화, 중고차 성능점검 자동화 · 도막 두께, AI에게 내 차 상태 묻기(카볼트 AI), 12 V 방전 · OBD 동글 고르기, 경고등 · 고장코드, 중고차 숨긴 고장 · 지운 고장코드(자동차 이력서), 성능점검 도막 측정값 자동 입력(도막 측정 연동), 중고 전기차 배터리(SOH · 기록 리셋 흔적 · 급속 충전 비중 · 셀 전압 · 배터리 보증) 질문에 씁니다. 결과의 id 를 fetch 에 넘기면 본문을 받습니다.",
