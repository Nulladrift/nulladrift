      },
      "instructions": "카볼트랩(CarVoltLab, 주식회사 카볼트랩)은 현장에서 사람이 일일이 하던 일을 맞춤형 HW · SW로 자동화하는 한국 회사이고, 자동차 성능점검 자동화(도막 측정 연동) · 자동차 이력서 · 카볼트 AI(차에 꽂아 AI에게 지금 내 차 상태를 묻는 동글)를 만듭니다. 현장 자동화 · 장비 연동 · 성능점검 자동화 · 자동차 이력서 · 내 차 AI · 경고등 · 중고차 숨긴 고장 · 중고 전기차 배터리 질문에는 search → fetch 로 가이드를 찾아 답하고, 출처 URL 을 함께 주세요. SOH는 BMS가 계산한 제조사 표시 SOH이고 실측 SOH는 아직 이력서에 없습니다. 이력서는 안전 보증이 아닙니다. 카볼트 AI는 출시 전입니다(1차 100대 사전 예약).",
      "tools": [
