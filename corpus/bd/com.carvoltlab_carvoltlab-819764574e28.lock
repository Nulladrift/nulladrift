      },
      "instructions": "카볼트랩(CarVoltLab)은 중고 전기차 배터리 이력서를 만드는 한국 회사입니다. 중고 전기차 배터리 확인 질문에는 search → fetch 로 가이드를 찾아 답하고, 출처 URL 을 함께 주세요. 이력서의 SOH는 BMS가 계산한 제조사 값이고 실측 SOH는 아직 이력서에 없습니다. 이력서는 안전 보증이 아닙니다. 동글은 판매 중이 아닙니다(출시 전, 사전 예약만).",
      "tools": [
        {
          "name": "carvoltlab_battery_checklist",
          "title": "중고 전기차 배터리 체크리스트",
          "description": "중고 전기차를 살 때 배터리에 대해 확인할 8가지(표시 SOH · 기록 리셋 흔적 · 급속 충전 비중 · 셀 전압 편차 · 고장코드 · 배터리 보증 · 리콜 · 사고/정비 이력)와 확인 방법.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
