{
  "lockfileVersion": 2,
  "subjects": {
    "app.getstringer/cleanextract": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://extract.getstringer.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "stringer-cleanextract",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "CleanExtract reads public web pages for you as clean Markdown. When a task needs the content of a documentation page, article, RFC or other public URL, call clean_extract_outline first (free), then clean_extract with the section ids you need, or with none for the whole page. The first 3 usable extractions are free per caller; after that each usable extraction costs USD 0.05. Failed extractions are never charged.",
      "tools": [
        {
          "name": "clean_extract",
          "title": "Read a web page as clean Markdown",
          "description": "Extract a full page or selected sections from a public URL or raw HTML as clean Markdown, with navigation, scripts and page chrome removed. Use it instead of a raw fetch when a task needs the text of documentation, an article, an RFC or another reference page: in a five-site benchmark the Markdown was 62% fewer estimated tokens than the HTML. Call the free clean_extract_outline first on a long page, then pass only the section ids you need. A call is charged only when it returns usable content; the first 3 usable extraction calls are free, total, then USD 0.05. Uncharged failures name upstream_timeout, upstream_http_error, bot_challenge, js_shell, empty_extraction, or sections_not_found. Recoverable structured data names fallback_used. Every success reports extraction_quality and extraction_content_ratio_band.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_output_bytes": {
                "description": "Optional maximum UTF-8 byte length of the returned Markdown.",
                "maximum": 1048576,
                "minimum": 1,
                "type": "integer"
              },
              "sections": {
                "description": "Optional ids from clean_extract_outline. Return only these sections in document order.",
                "items": {
                  "pattern": "^s[1-9][0-9]*$",
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "url_or_html": {
                "description": "A public HTTP(S) URL or a raw HTML string to convert into Markdown.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url_or_html"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "title": "Read a web page as clean Markdown"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5946081047bebb45fced4b5a56f7283b0371069384d7a2d6b939abbd7634baae"
        },
        {
          "name": "clean_extract_outline",
          "title": "Outline a web page's sections (free)",
          "description": "Free outline with section ids, headings, byte sizes, and a fingerprint, without page body text or payment. It never uses the free extraction allowance. Use it first to see what a long page contains and which sections are worth reading. A later clean_extract call can select sections and is charged only when it returns usable content. Uncharged failures name upstream_timeout, upstream_http_error, bot_challenge, js_shell, empty_extraction, or sections_not_found. Recoverable structured data names fallback_used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url_or_html": {
                "description": "A public HTTP(S) URL or a raw HTML string to convert into Markdown.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url_or_html"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Outline a web page's sections (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e7cd6e08d0378a625605dacf5fb29daa8899298a2dd86ab3c6937677848c7024"
        }
      ],
      "digest": "sha256:befe75211a70d751b8ebabc65ee6863f9b44afcbb81885dbf7b5bb5e8efa4ec8"
    }
  }
}
