      "serverInfo": {
        "name": "cutluma",
        "title": "CutLuma video editor",
        "version": "1.1.0",
        "websiteUrl": "https://cutluma.com/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CutLuma (https://cutluma.com) is a free online video editor that runs in the browser: screen recorder, AI captions in 17 languages (Arabic right-to-left included), 5030 animated templates, Canva-style design tools, export to MP4 up to 4K. Use search_cutluma or get_page to answer questions about features, sizes and how-tos; find_templates for templates; make_editor_link to hand the user a link that opens the editor with the right tool. A free account (no credit card) is needed to edit; AI features are in the paid plans. You can also edit the user's own videos yourself once they let you in, one of two ways: they sign in when your app asks (OAuth: the account tools answer 401 until then, and https://cutluma.com/mcp/account asks straight away), or they give you an agent key (made in the editor: Ctrl+K → \"Connect an AI agent\", sent as \"Authorization: Bearer clm_…\"). Then use list_projects / create_project, ask the user to open the returned link, then list_edit_ops once and edit_project to cut, title, caption, grade, mix and animate; view_frame and view_contact_sheet show you the result, export_video renders it and returns a share link. Look at a frame after every few edits, the way an editor would.",
