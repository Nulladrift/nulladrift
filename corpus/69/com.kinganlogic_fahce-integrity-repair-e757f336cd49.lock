                "pattern": "^[A-Za-z0-9_-]{8,128}$",
                "type": "string"
              },
              "request": {
                "additionalProperties": false,
                "description": "REST body only; maximum 524288 UTF-8 bytes for the complete serialized body. Field limits also apply.",
                "properties": {
                  "candidate_output": {
                    "description": "The exact candidate output to diagnose or verify. Never use payment evidence as semantic evidence.",
                    "maxLength": 200000,
                    "minLength": 1,
                    "type": "string"
                  },
                  "evidence": {
                    "description": "Caller-supplied records; sources are not authenticated or fetched. An empty array supplies no corroboration.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "claim_bearing": {
                          "description": "True marks candidate claims, not corroboration. False or omission does not override candidate-source labels.",
