                      "id": "deployment_log",
                      "kind": "log",
                      "source_label": "caller-supplied deployment log",
                      "text": "Deployment failed."
                    }
                  ],
                  "schema": "FAHCE_MACHINE_REQUEST_V1"
                }
              }
            ],
            "properties": {
              "idempotency_key": {
                "description": "REST retry key; reuse only for identical operation, input, and authorization.",
