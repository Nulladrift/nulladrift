                        },
                        "id": {
                          "description": "Unique evidence identifier within this request.",
                          "pattern": "^[A-Za-z0-9_-]{1,64}$",
                          "type": "string"
                        },
                        "kind": {
                          "description": "Record format category, not a trust level.",
                          "enum": ["log", "paste", "document", "description"]
                        },
                        "source_label": {
                          "description": "Source attribution; candidate/output labels mark untrusted claims, not independent proof.",
                          "maxLength": 160,
                          "type": "string"
                        },
                        "text": {
                          "description": "Record content to review; never payment authorization as semantic proof.",
                          "maxLength": 200000,
                          "type": "string"
                        }
                      },
                      "required": ["id", "kind", "source_label", "text"],
                      "type": "object"
                    },
                    "maxItems": 12,
                    "type": "array"
                  },
                  "expected_output": {
                    "description": "Optional format/constraint and repair-target context for all operations, including Diagnose. Recognized directives (e.g. Return JSON) can affect diagnosis. Factual text is not compared for string equality or trusted as evidence; supply independent records.",
                    "maxLength": 200000,
                    "type": "string"
                  },
                  "schema": {
                    "const": "FAHCE_MACHINE_REQUEST_V1",
                    "description": "Request contract identifier; use this exact value."
                  }
                },
                "required": ["candidate_output", "evidence", "schema"],
                "type": "object",
                "x-fahce-request-bytes": 524288
              }
