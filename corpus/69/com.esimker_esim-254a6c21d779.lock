        {
          "name": "create_wallet",
          "description": "Mint a prepaid wallet with no account behind it and get its secret ONCE:\n        `code` (32 hex characters) and the same secret as a 12-word `phrase`. Save the\n        code before doing anything else and send it as `Authorization: Bearer <code>`\n        on every wallet call; there is no recovery and no identity to prove. The\n        balance is spent on eSIMs (retail price, cashback on every purchase) and never\n        paid back out. accept_terms must be true (https://esimker.com/terms). Then\n        create_deposit to fund it. Rate-limited and geo-blocked like checkout.",
          "inputSchema": {
            "properties": {
              "accept_terms": {
                "title": "Accept Terms",
                "type": "boolean"
              }
            },
            "required": ["accept_terms"],
            "title": "create_walletArguments",
