          "description": "An order by its token. status goes pending (unpaid) → paid → provisioning →\n        ready; also expired, underpaid, failed_provisioning, gift_waiting, and\n        payment_held — the payment processor's compliance check stopped the payment and\n        holds the money: nothing is issued, the person must not pay again and should\n        write to support. When ready,\n        esim.activation_code is the LPA string (render it as a QR code), with iccid,\n        smdp and matching_id. After payment poll every ~10 s; delivery usually takes\n        under a minute.",
