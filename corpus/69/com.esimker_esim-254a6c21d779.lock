      "instructions": "esimker sells prepaid travel data eSIMs: data only, no phone numbers, no SMS, no voice. Prices are USD strings, from $1.00. No account is needed: an order is addressed by a secret token, a wallet by a secret code.\n\nTwo ways to buy:\n1. For a person who pays: search_destinations → get_plans → create_checkout → hand checkout_url to the person → get_order(token) until status is ready.\n2. Autonomously from a prepaid wallet: create_wallet once and save its code → send it as `Authorization: Bearer <code>` on every wallet call → create_deposit and pay the address it returns → get_deposit until paid → purchase_esim(plan_id, client_ref) → get_order(token) until ready.\n\nRules:\n- Confirm the destination, the plan and the price with the person before create_checkout or purchase_esim. An installed eSIM cannot be refunded; a wallet balance is spent on eSIMs and never paid back out.\n- The wallet code, the order token and the activation code are secrets: keep the code where you keep credentials, show order_url to the buyer only, never log or repeat them elsewhere. A lost wallet code cannot be recovered.\n- Reuse client_ref when retrying purchase_esim; never create a second checkout while one is open.\n- daily_unlimited plans are priced per day: pass period_num (1–365, default 7), the amount is price × days.\n- Regional plans list the countries they cover in location_codes.\n- A 403 means the caller's jurisdiction is embargoed: tell the person, do not retry.",
      "tools": [
        {
          "name": "create_checkout",
          "description": "Create an order for a person to pay. Returns token, checkout_url (the\n        gateway's page: hand it to the person) and order_url (the order page in `lang`,\n        with the QR code once paid: show it to the buyer only, the token is a secret).\n        Confirm the plan and the price first: every call creates a new unpaid order,\n        so do not retry while a checkout is open. `email` (optional) also gets the eSIM\n        by mail. `period_num` (1–365) only for daily_unlimited plans. `topup_iccid`\n        with a plan_id from list_topups tops up an existing eSIM. A 403 means the\n        caller's jurisdiction is embargoed. To pay from a wallet use purchase_esim.",
          "inputSchema": {
            "properties": {
              "email": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Email"
              },
              "lang": {
                "default": "en",
                "title": "Lang",
                "type": "string"
              },
              "payment_method": {
                "default": "crypto",
                "enum": ["crypto", "card"],
