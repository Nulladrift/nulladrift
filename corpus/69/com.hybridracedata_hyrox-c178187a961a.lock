{
  "lockfileVersion": 2,
  "subjects": {
    "com.hybridracedata/hyrox": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hybridracedata.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "hybrid-race-data",
        "title": "Hybrid Race Data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hybrid Race Data (https://hybridracedata.com) is an independent HYROX results database (every public result since 2018, new races within minutes of the official results). Not affiliated with HYROX. Always cite the \"url\" field of each answer. Ticket availability and sold-out alerts: Race Radar (https://raceradar.fit).",
      "tools": [
        {
          "name": "get_athlete",
          "title": "Athlete profile",
          "description": "An athlete's HYROX race history: every result with time, place, age-group place, division and partners, plus Hybrid Rating.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Athlete slug from search",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24b86e5b29daaa2a15fd4f951d774a2ae64466fc3c33eea2351885049c629db3"
        },
        {
          "name": "get_event",
          "title": "Race weekend",
          "description": "A HYROX race weekend: dates, venue, divisions with finishers, winners, median and top-10% times, course speed.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Event id, e.g. 'london-2026' (from search or list_events)",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b416f9681b0d0ff1cdedd91ec772bced164908f6700306779d16fa26823e2081"
        },
        {
          "name": "get_race_results",
          "title": "Division leaderboard",
          "description": "Finishers of one division at one event, in finishing order, with optional name search and age group.",
          "inputSchema": {
            "properties": {
              "age_group": {
                "description": "e.g. '30-34' (optional)",
                "type": "string"
              },
              "division": {
                "description": "Race slug from get_event, e.g. 'men-open', 'women-pro', 'doubles-mixed'",
                "type": "string"
              },
              "event_id": {
                "type": "string"
              },
              "limit": {
                "description": "Default 25, max 100",
                "type": "number"
              },
              "offset": {
                "type": "number"
              },
              "query": {
                "description": "Name filter (optional)",
                "type": "string"
              }
            },
            "required": ["division", "event_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:120f932da3b460a830edecd60ad9cc1d4b73b3914dc56d7c34382ac0ce774cd5"
        },
        {
          "name": "get_result",
          "title": "One race result with splits",
          "description": "Full splits of one result (8 runs, 8 stations, Roxzone), place after each segment and rank per segment.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Result id from get_athlete or get_race_results",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6eb0de3927bdd701e5820230d8353b7eee47f8387566889108d4c7687c28e253"
        },
        {
          "name": "list_events",
          "title": "List race weekends",
          "description": "Recent or upcoming HYROX race weekends, optionally filtered by city or country.",
          "inputSchema": {
            "properties": {
              "filter": {
                "description": "City or country name (optional)",
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 20",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2121b17cf7d532880d65e0385de526e7c40f5737cb8613637c04bff458d149b6"
        },
        {
          "name": "search",
          "title": "Search athletes and races",
          "description": "Find HYROX athletes by name or race weekends by city. Returns slugs/ids for the other tools.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Athlete name or city, e.g. 'Hunter McIntyre' or 'London 2026'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9907abc980351cdce129edcdc7509a595f2e4dd4caa897e5e7e7f78803bd1577"
        },
        {
          "name": "split_plan",
          "title": "Splits for a target time",
          "description": "Run and station splits that real Open athletes used to finish around a target time.",
          "inputSchema": {
            "properties": {
              "sex": {
                "description": "men | women (default men)",
                "type": "string"
              },
              "target": {
                "description": "Target finish, e.g. '1:30:00' or '90' (minutes)",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4465c9c24c340474af46a2ef8bd8526478acd5daf1c405b73cf401fedbd06a87"
        },
        {
          "name": "time_benchmarks",
          "title": "What is a good HYROX time?",
          "description": "Median, top-25%, top-10% and fastest finish and station times for a division (last two seasons), optionally for an age group, and where a given time ranks.",
          "inputSchema": {
            "properties": {
              "age_group": {
                "description": "e.g. '40-44' (optional)",
                "type": "string"
              },
              "division": {
                "description": "open | pro | doubles | pro doubles (default open)",
                "type": "string"
              },
              "sex": {
                "description": "men | women | mixed (default men)",
                "type": "string"
              },
              "time": {
                "description": "A finish time like '1:24:30' to place in the field (optional)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d5c1b5da9788b3d2b524e2c84084a838f0287f6b3cd276f8eef8fa5bffdf312a"
        },
        {
          "name": "upcoming_races",
          "title": "Upcoming races and ticket status",
          "description": "Upcoming HYROX race weekends with dates, venue and ticket status (on sale / sold out / not yet on sale), with a link to set a ticket alert on Race Radar.",
          "inputSchema": {
            "properties": {
              "filter": {
                "description": "City, country or continent (optional)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:633ae021a610f7a27f44ceef801e3b56a63f3e0e92aa22034c4cf79f72ac6db8"
        }
      ],
      "digest": "sha256:00f8db2962a5840cac6bd4db2f452333479994e32adf84f8c396b39b45c67f79"
    }
  }
}
