        {
          "name": "pricepaid_tuition_fees",
          "title": "University tuition fees",
          "description": "Use this when a user asks what a university or college charges students per year (tuition or registration fees for a bachelor's or master's degree) in Australia (country AU), Canada (country CA), Europe (country BE, BG, CZ, DK, DE, EE, IE, GR, ES, FR, HR, IT, CY, LV, LT, LU, HU, MT, NL, AT, PL, PT, RO, SI, SK, FI, SE, AL, BA, CH, IS, LI, ME, MK, NO, RS, TR) or Taiwan (country TW), or how fees compare between countries or between home and international students. Returns the official statutory fee levels published for a country and academic year: the most common annual fee, the minimum and the maximum, in national currency with a euro equivalent. These are posted fee levels set by law or by universities, not what any one student paid and not a range built from sales: there is no sample size. How fresh: Australia: annual rates, indexed each 1 January (2026 and 2027 amounts are published); every answer states its calendar year; Canada: annual: one value per academic year (2026/2027 was published on 16 September 2026); every answer names its academic year; Europe: academic year 2023/24 (Eurydice release of September 2025); updated about once a year; Taiwan: annual: one value per academic year (the Ministry updates the file every October for the new year); every answer names its academic year. Fees are before grants, loans and fee waivers. Do not use for the price of one named course or university, living costs or rent, school fees, or countries that are not listed.",
