S dollars per thousand cubic feet (Natural Gas Monthly). EIA gives gas per Mcf, not per kWh, so the two cannot be compared directly. Business US: electricity = average commercial-sector price (answered in US dollars per kWh, also in cents; the industrial-sector price is in the extras); gas = average commercial natural gas price in US dollars per thousand cubic feet (Mcf). EIA gives gas per Mcf, not per kWh, so the two cannot be compared directly.",
