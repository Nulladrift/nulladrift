        {
          "name": "pricepaid_commercial_property",
          "title": "Commercial property and land sale prices actually paid",
          "description": "Use this when a user asks what shops, offices, workshops, warehouses or other commercial premises actually sold for, or what a plot of non-farm land (a building plot) sold for, per square metre, in a town or postcode, in Denmark (country DK), France (country FR), Hong Kong (country HK), Japan (country JP), Poland (shops and offices in the big cities) (country PL), Sweden (country SE), Singapore (country SG), Taiwan (country TW) or New York City (country US). Returns the median price per square metre, a typical range (10th–90th percentile), the number of sales, the period covered, a confidence label, and the official source and licence, from government sale records (prices paid, not asking prices). How fresh: Denmark: quarterly, published about three months after the quarter ends (the latest quarter is marked preliminary; figures become final 13 months after the quarter). Each answer states its quarter.; France: twice a year, with a delay of several months; Hong Kong: yearly, published about 5 months after the year ends (2025 figures published June 2026); Japan: annual: the 1 January valuation published each March (the 2026 edition is out). Every answer states the edition year; Poland (shops and offices in the big cities): the register is filled from notarial deeds with a delay of several months; the answer names the newest sale it holds.; Sweden: yearly; sales during 2025, published 5 June 2026; Singapore: a historic file: awards from 1992 to mid-2016 only, last updated by the publisher on 6 June 2024. Every answer states its period; Taiwan: every 10 days. A sale appears one to two months after the deal; answers cover whole calendar months ending at least 30 days before the newest deal; New York City: monthly, around the 15th, with sales recorded through the end of the prior month. Do not use for homes, farmland, rents, asking prices or listings, the value of one particular building, or other countries.",
