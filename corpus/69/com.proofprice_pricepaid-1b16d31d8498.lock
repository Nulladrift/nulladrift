        {
          "name": "pricepaid_wholesale_fresh_food_prices",
          "title": "Wholesale prices of live animals, fish, eggs and fresh food",
          "description": "Use this when a user asks what the wholesale price of live pigs, cattle or chickens, fish, eggs or other fresh food is today in Australia (country AU), Canada (country CA), Germany (country DE), France (country FR), England and Wales (country GB), Hong Kong (country HK), Malaysia (country MY), Taiwan (country TW) or United States (country US), or how it moved on the previous day. Returns the newest daily average reference wholesale price that the government publishes for the food type, per kilogram or per egg, with the day it applies to, the change on the previous published day, the recent days, the official source and licence. This is a posted reference price reported by wholesalers (price_type posted_price), not a paid price and not a range built from sales, so the range fields are null and there is no sample size. How fresh: Australia: daily on trading days (MLA updates at midnight AEST); every answer states the trading day it describes; Canada: weekly (a Friday date); our copy is refreshed daily and each answer states the week its quotes apply to; Germany: weekly (calendar week); each answer states the week its price applies to; France: daily on market days (each market line carries its own date); each answer states the dates its quotes apply to; England and Wales: about every two weeks (a Monday date); each answer states the date its price applies to; Hong Kong: daily on working days, published by the AFCD when necessary; each answer states the day its price applies to; Malaysia: monthly, not live: when checked on 28 October 2026 the newest month DOSM publishes was December 2025 (its 'last updated' date is not the data period); our copy is refreshed daily and every answer names its month; Taiwan: daily, trading days only; about 10 trading days are available at a time; United States: weekly, published on Monday for the week just ended; every answer states the report date. Do not use for supermarket or shop prices, for the price one farm received, for restaurant prices, for futures prices, or for other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "AU = Australia (Meat & Livestock Australia: daily weighted average saleyard auction prices for cattle and sheep, national indicators, not monthly); CA = Canada (AAFC weekly wholesale asking prices of fresh fruit and vegetables at Calgary, Edmonton, Vancouver and Winnipeg, quoted not paid); DE = Germany (BLE weekly national wholesale-market quotations for fruit and vegetables, quoted not paid); FR = France (FranceAgriMer RNM quotes of fruit and vegetables at producer markets, dispatch, import and wholesale, EUR excluding VAT per kg, quoted not paid, daily); GB = England and Wales (DEFRA average wholesale prices of home-grown fruit and vegetables at the Birmingham, Bristol, Manchester and London markets, quoted not paid, about every two weeks); HK = Hong Kong (AFCD daily average reference wholesale prices of fresh food, posted by wholesalers, not paid prices); MY = Malaysia (Department of Statistics Malaysia: monthly average fish and seafood prices per kg at landing, wholesale and retail, official statistic, not a live price); TW = Taiwan (daily trading prices at the wholesale fish markets, with a range from the market averages); US = United States (USDA AMS: weekly average price packers paid for fed steers and heifers, negotiated cash purchases, national, not monthly)",
                "enum": ["AU", "CA", "DE", "FR", "GB", "HK", "MY", "TW", "US"],
                "type": "string"
              },
              "level": {
                "description": "Malaysia fish only: ex_vessel (the price fishers get at first sale at landing; default), wholesale or retail.",
                "type": "string"
              },
              "market": {
                "description": "CA only: one wholesale centre (Calgary, Edmonton, Vancouver or Winnipeg). Leave out for all centres together. AAFC does not quote every centre every week (the latest file has only Calgary and Winnipeg); an unquoted centre answers with the list of centres that are quoted.",
                "type": "string"
              },
              "product": {
                "description": "The food in plain words, e.g. 'live pig', 'chicken', 'eggs', 'grass carp', 'tomato'. The list for each country is in the tool notes. Australia: cattle or sheep in everyday words, e.g. cattle, western young cattle, restocker steers, feeder steers, steers, dairy cows, light lamb, lamb, heavy lamb, merino lamb, restocker lamb, mutton, restocker heifers, cows. Prices are Australian dollars: cents per kg (carcase or live weight, the answer says which) or dollars per head for the online indicators. The answer is for the newest trading day, not a month. CA: fresh fruit and vegetables such as apples, bananas, grapes, avocados, carrots, cabbage, cucumbers, celery, broccoli, cauliflower, beets, garlic, ginger, blueberries and Chinese vegetables. The answer is the median CAD per kg of the week's wholesale asking quotes with the 10th to 90th percentile and the number of quotes; add market=Calgary, Edmonton, Vancouver or Winnipeg for one centre. DE: fruit and vegetables on the German wholesale markets, in English or German: apples, pears, cucumbers, tomatoes, peppers, grapes, kiwis, plums, lemons, zucchini, oranges, mandarins, onions, aubergines, strawberries, cauliflower, carrots, peaches, nectarines, bananas, lettuce, leeks, brussels sprouts and more (no potatoes). A variety such as 'elstar' also works. The answer is the median of that week's national quotations in EUR per kg, with the cheapest and dearest quotation and the change on the previous week. FR: fruit and vegetables, English or French names: carrot, tomato, potato, onion, leek, cabbage, cauliflower, courgette, lettuce, apple, pear, orange, strawberry, peach, grape and about 60 more. The answer is the median of the quoted average prices per kg across the market lines of the last 7 days (retail, organic and bunch lines left out), with the lowest and highest quote and the markets. GB: home-grown fruit and vegetables: apples (gala, bramley, cox...), pears, plums, strawberries, raspberries, blackberries, blueberries, cherries, gooseberries, currants, carrots, onions, leeks, cauliflower, cabbage, calabrese, lettuce, tomatoes, cucumbers, courgettes, capsicum, beans, peas, beetroot, parsnips, swede, turnip, sprouts, celery, rhubarb, kale and more (no potatoes). An item with several varieties gives the mean of the varieties and lists each; add the variety (for example 'gala apples') for one price. Prices are GBP per kg, per head, per twin pack or per stem; the answer names the unit and the date. HK: live pig, live cattle, live chicken (local or mainland), eggs (mainland, USA, Germany), marine fish (golden thread, yellow croaker, mackerel, hairtail...), freshwater fish (grass carp, big head, mud carp) and vegetables (tomato, potato, broccoli, spinach, cabbage, Chinese kale, celery...). Prices are HK$ per kg (converted from per catty) or HK$ per egg; the answer names the unit and the day. Malaysia: a fish or seafood in English or Malay, e.g. mackerel, kembong, tenggiri, pomfret, bawal_putih, prawn, udang_harimau, squid, sotong_katak, crab, siakap, kerapu, bilis. About 150 kinds are published; a word that fits several (mackerel, prawn) returns the list to choose from. Prices are in ringgit per kg. TW: fish and seafood by English or Taiwanese name, in NT$ per kg from the wholesale fish markets: tilapia, milkfish, asian seabass, threadfin, hairtail, swordtip squid, cuttlefish, small squid, clam, oyster, white shrimp, tiger prawn, salmon, grass carp, bighead carp, grouper, pearl grouper, white pomfret, black pomfret, spanish mackerel, mackerel, sweetfish, yellow croaker, milkfish belly. Frozen products are left out. The answer is a range (median, 10th to 90th percentile) over the newest three trading days. United States: fed cattle in everyday words, e.g. cattle, steers, heifers, dressed steers, dressed heifers. Prices are US dollars per hundredweight (100 lb), live or dressed weight as the answer says. The answer is for the newest weekly report, not a month.",
                "type": "string"
              }
            },
