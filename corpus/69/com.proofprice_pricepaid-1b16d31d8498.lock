        {
          "name": "pricepaid_energy_prices",
          "title": "Household electricity and gas prices",
          "description": "Use this when a user asks what households pay for electricity or natural gas per kWh in Flanders, Belgium (supplier offers), Brazil, Switzerland, Colombia (four utility areas), the EU, Norway and Iceland, Finland, Great Britain, the Netherlands, Norway, New Zealand, Sweden, Singapore, Singapore (gas), Taiwan (gas), Taiwan or the United States, how that compares with another country, or how it changed since the previous period. Returns the official average price per kWh for a standard household consumption band, for the latest period published, with the same band excluding VAT and excluding all taxes, every band, the previous period and the change, and the official source and licence. This is a published average (price_type official_statistic), not a range built from sales, so the range fields are null and there is no sample size. How fresh: Flanders, Belgium (supplier offers): monthly (the regulator refreshes the workbook around the middle of each month); each answer states the month it is for; Brazil: updated whenever ANEEL homologates a tariff adjustment (each distributor adjusts once a year); each answer states the validity period of the tariff; Switzerland: yearly: ElCom publishes next year's tariffs in autumn; each answer states the tariff year; Colombia (four utility areas): the dataset on datos.gov.co was last modified 15 July 2026 and its newest month is September 2025; each answer states its month; the EU, Norway and Iceland: updated twice a year (half-yearly figures); each answer states its reference period, and the newest half-year Eurostat holds for the country is returned; Finland: monthly (about three months after the month ends); each answer states its reference month; Great Britain: quarterly (the cap is reset on 1 January, 1 April, 1 July and 1 October); each answer states the quarter it is for; the Netherlands: half-yearly (new figures end of March and end of September; the last two half-years are provisional); each answer states its reference half-year; Norway: quarterly (about six weeks after the quarter ends); each answer states its quarter; New Zealand: monthly file; the newest month is about four to five months behind today. Each answer states its month.; Sweden: half-yearly (new half-year about three months after it ends); each answer states its reference half-year; Singapore: annual: the newest full calendar year (2025 was published in 2025-10); each answer states the year; Singapore (gas): annual: the newest full calendar year (2025 was published in 2026-05); each answer states the year; Taiwan (gas): changes when CPC revises its list: natural gas from 2026-11-01, LPG from 2026-04-02 at the time of writing; each answer states its effective date; Taiwan: updated when Taipower changes its tariff; each answer states the date the table took effect; the United States: monthly: EIA adds a month to each table about two months after it ends (electricity in the last week of the month, natural gas at the month's end); our copy is refreshed daily and each answer states its month. BUSINESS prices: set sector=business to get what businesses (non-household consumers: shops, offices, factories) pay instead, for the EU, Norway, Iceland and EU candidate countries (business), the United Kingdom (business) or the United States (business). The answer is the official average price paid by businesses in an annual-consumption band (consumption_band; the country notes list the bands), excluding VAT unless taxes says otherwise, with the other bands, the previous period and the change. It is an official average, not a quote or a tariff, and sector=business needs a country that has business figures. Business freshness: the EU, Norway, Iceland and EU candidate countries (business): updated twice a year (half-yearly figures); each answer states its reference period, and the newest half-year Eurostat holds for the country is returned; the United Kingdom (business): quarterly (DESNZ updates the tables at the end of March, June, September and December, about three months after the quarter ends); each answer states its quarter, and the newest quarter is provisional; the United States (business): monthly: EIA adds a month to each table about two months after it ends (electricity in the last week of the month, natural gas at the month's end); each answer states its month. Where a country offers it, supplier_offers=true returns the median of the supplier offers posted on the regulator's comparison tool (posted offers, not paid prices; the country notes say where). Do not use for one supplier's quote for a particular home or company, for wholesale exchange prices, for petrol and diesel, or for other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
