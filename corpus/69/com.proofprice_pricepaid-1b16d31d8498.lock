r m², not a price paid. BG HR CY CZ DE EE ES HU IS IT LV LT LU MT PL RO SI SK: ignored; Eurostat publishes one national index per country (PL: a town is answered by the Polish price register instead). The answer is an index (2015 = 100), not a price in euros. FI: a municipality ('Helsinki' or 'Helsingfors', 'Espoo', 'Tampere', 'Oulu', 'Hämeenlinna'), a region ('Uusimaa', 'Pirkanmaa'), 'Greater Helsinki', with or without ä ö å. Omit for Finland as a whole. Larger cities, regions and the country have quarterly figures (with the official price-index changes); other municipalities have the latest yearly figure. FR: town, e.g. 'Bordeaux', or use postcode. GB: the Royal Mail POSTAL TOWN as the Land Registry files it, e.g. 'Bristol'. It can be wider than the council area: 'Bristol' also takes in Bradley Stoke and Filton (South Gloucestershire), and every London sale is filed under 'London', so a London borough such as 'Camden' is not a town. For a council area or London borough use district. Give town or district. GB Scotland / Northern Ireland: 'Scotland', 'Northern Ireland' or a council area ('Edinburgh', 'Glasgow', 'Aberdeen', 'Fife', 'Highland', 'Belfast', 'Derry', 'Lisburn and Castlereagh'). Answered with the official monthly UK House Price Index average, not a list of sales. HK: a public housing estate such as 'Shan King' or a district; leave out for all Tenants Purchase Scheme estates. Discounted public-flat sales, not private market prices. HK: leave out for the all-Hong Kong estimate from Land Registry price bands. A public housing estate or district such as 'Shan King' gives discounted Tenants Purchase Scheme sales instead (not market prices). HU: 'Budapest', a statistical region ('Pest', 'Central Transdanubia', 'Western Transdanubia', 'Southern Transdanubia', 'Northern Hungary', 'Northern Great Plain', 'Southern Great Plain') or a county or big city that names one ('Debrecen', 'Győr', 'Pécs', 'Szeged'), or 'Hungary'. A town is answered at the level of its region