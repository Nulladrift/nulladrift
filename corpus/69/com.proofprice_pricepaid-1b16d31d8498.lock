                "description": "commercial = shops, offices, workshops and other commercial or industrial premises (default); land = building plots and other non-farm land sold without a building. DK: commercial (default) = business properties plus industrial properties and warehouses, as an average price PER PROPERTY. land is not available (only a count of building sites is published, no price). FR: commercial (default) or land. Alsace-Moselle and Mayotte are not covered. HK: commercial (default) = private offices, retail premises and flatted factories; land is not available. Use premises to choose which. JP: land (default, all benchmark plots) or commercial (plots in commercial or industrial zones). Values are official appraisals, not sales. PL: commercial only (shops, services, offices). land is refused: the register prices bundles of plots, not single plots. SE: commercial (default) = sold industrial real estate (factories, petrol stations and workshops, warehouses). land is not available for Sweden. SG: land only (state-owned development sites sold by tender; price per m² of gross floor area). Leave out or use land. TW: commercial (default; shops, offices, factories, per m² of building) or land (building plots without a building, per m² of land). US: commercial (default; offices, stores, lofts, factories, garages, warehouses) or land (commercial vacant land).",
                "enum": ["commercial", "land"],
                "type": "string"
              },
              "town": {
                "description": "Town or city. DK: a province ('Fyn', 'Østjylland', 'Nordsjælland'), a region ('Hovedstaden', 'Syddanmark') or a town/municipality ('København', 'Aarhus', 'Odense'), with or without æ ø å. Statistics Denmark publishes by province, so a town is answered with the province it lies in (and the answer says which). Omit for Denmark as a whole. FR: town, e.g. 'Bordeaux', or use postcode. HK: required. Offices: a district (Central, Sheung Wan, Wan Chai, Causeway Bay, North Point, Quarry Bay, Tsim Sha Tsui, Mong Kok, Kwun Tong). Retail or factories: a region ('Hong Kong' for Hong Kong Island, 'Kowloon', 'New Territories'). JP: a Tokyo ward in English (Shibuya, Minato, Chiyoda, Setagaya...) or Japanese, a prefecture name (Osaka, Aichi), or a Japanese municipality name together with the prefecture parameter. One prefecture per question. PL: a city, required (Warsaw, Krakow, Lodz, Wroclaw, Poznan, Gdansk, Gdynia, Szczecin, Lublin, Katowice, Bydgoszcz, Bialystok, Rzeszow, Torun, Kielce, Olsztyn, Opole, Radom, Czestochowa); Polish or English spelling. Small cities hold few commercial sales; with fewer than 5 no figure is given. SE: a county ('Skåne', 'Stockholm', 'Västra Götaland', 'Östergötland'); leave out for the whole of Sweden. Counties, not towns. SG: a URA planning area, e.g. Bedok, Downtown Core, Geylang, Woodlands, Queenstown, River Valley. Leave out for all of Singapore. At least 5 sites must match. TW: a city or county in English or Chinese ('Taipei', 'New Taipei', 'Taichung', 'Kaohsiung', '臺北市'), or a district with its city (\"Zhongshan, Taipei\", '臺北市中山區'). Omit for all of Taiwan. US: a New York City borough ('Manhattan', 'Brooklyn') or neighborhood ('Midtown East', 'SoHo'); omit for the whole city, or use postcode.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
