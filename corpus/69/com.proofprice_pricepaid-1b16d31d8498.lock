age. IE: national averages only; a region is ignored and the answer says so. LV: national averages only; a region is ignored and the answer says so. MX: a state ('Jalisco', 'Nuevo Leon', 'Ciudad de Mexico', 'Yucatan', 'CDMX'); leave out for the national figure. A state needs 5 or more shops pricing the product. MY: a state ('Selangor', 'Johor', 'Sabah', 'Penang', 'Kuala Lumpur'); leave out for the national figure. A state needs 5 or more shops pricing the item. NZ: national averages only; a region is ignored and the answer says so. SG: national averages only; a region is ignored and the answer says so. TW: national averages only; a region is ignored and the answer says so. TW: not used; every figure is for Taichung City as a whole. FEWS NET countries: leave out. Figures are a spread across the country's markets. WFP countries: leave out. Figures are a spread across the country's surveyed markets. US: leave out for the U.S. city average, or give northeast, midwest, south or west (a US state maps to its region). BLS publishes no state or city averages for food. UY: a department ('Montevideo', 'Canelones', 'Maldonado', 'Salto', 'Colonia'); leave out for the national figure. A department needs 5 or more shops pricing the product. ZA: national all-urban averages only; a region is ignored and the answer says so.",
