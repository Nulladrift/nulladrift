        {
          "name": "pricepaid_wholesale_power_prices",
          "title": "Wholesale (day-ahead) electricity prices",
          "description": "Use this when a user asks what electricity costs on the wholesale (day-ahead power exchange) market in Australia, Australia (gas), Switzerland, Germany, Spain and Portugal, Austria, Belgium, Czechia, Denmark, France, northern Italy, the Netherlands, south-west Norway and Poland, Great Britain, Japan, Romania or California (United States): the recent median, the typical range across hours, the cheapest and dearest hour, the latest hour and how many hours had negative prices. Prices are in euro per MWh (1 MWh = 1000 kWh; the answer also gives cents per kWh). Built from the hourly auction prices of the recent days, with the official source and licence. How fresh: Australia: AEMO publishes one price file per trading day (04:00 to 04:00 NEM time) early the next morning; ProofPrice reads the files of the last days on each request (cached up to 30 minutes); Australia (gas): AEMO rewrites the STTM ex post file each morning (about 10:30 Sydney time) with the last 7 gas days; ProofPrice reads it on each request (cached up to 30 minutes); Switzerland: monthly, a few weeks after month end; each answer states the month it is for; Germany: hourly prices, published the day before delivery (around 13:00 Central European Time); ProofPrice reads them on each request (cached up to 30 minutes); Spain and Portugal and Austria, Belgium, Czechia, Denmark, France, northern Italy, the Netherlands, south-west Norway and Poland: prices are published the day before delivery (around 13:00 Central European Time); ProofPrice reads them on each request (cached up to 30 minutes); Great Britain: half-hourly prices appear within hours of each trading period and are read on each request (cached up to 30 minutes); Japan: JEPX rewrites its file every day; ProofPrice copies it once a day and answers with the newest complete delivery day it holds (usually yesterday, Japan time); Romania: the next day's prices are published around 13:00 CET each day; read on each request (cached up to 30 minutes); California (United States): the next day's prices are published around 13:00 Pacific each day; read on each request (cached up to 30 minutes). Wholesale prices are not what households or businesses pay on their bills. Do not use for retail tariffs, for petrol and diesel, or for other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "commodity": {
                "description": "electricity (default) or gas. gas returns wholesale natural-gas hub prices where a country has them (see the country notes); prices are per GJ or MWh as the answer states. CH: electricity only (no gas). RO: electricity only. US: electricity only (California).",
                "enum": ["electricity", "gas"],
                "type": "string"
              },
              "country": {
                "description": "AU = Australia (National Electricity Market, five regions; prices in Australian dollars per MWh, not euro); AU = Australia (with commodity=gas: AEMO Short Term Trading Market hubs Adelaide, Brisbane, Sydney; prices in Australian dollars per GJ); CH = Switzerland (BFE monthly reference market price for renewable power, CHF per MWh excluding VAT; an official statistic, not hourly day-ahead); DE = Germany (Germany/Luxembourg bidding zone, SMARD day-ahead hourly auction prices); Day-ahead wholesale power for ES = Spain and PT = Portugal (Iberian market, OMIE); Day-ahead wholesale power for AT = Austria, BE = Belgium, CZ = Czechia, DK = Denmark, FR = France, IT = Italy, NL = the Netherlands, NO = Norway, PL = Poland (Germany is DE, served separately); Spot wholesale power for GB = Great Britain (Elexon market index, in pounds per MWh); JP = Japan (JEPX day-ahead spot market, half-hourly, in yen per kWh); Day-ahead wholesale power for RO = Romania (OPCOM exchange, 15-minute prices in euro per MWh); US = California only (CAISO day-ahead market, hourly prices at three trading hubs, in US dollars per MWh, not euro)",
                "enum": ["AU", "CH", "DE", "ES", "PT", "AT", "BE", "CZ", "DK", "FR", "IT", "NL", "NO", "PL", "GB", "JP", "RO", "US"],
                "type": "string"
              },
              "hub": {
                "description": "AU gas only: STTM hub ADL (Adelaide), BRI (Brisbane) or SYD (Sydney, default); short names like NSW, QLD or SA also work.",
                "type": "string"
              },
              "lookback_days": {
                "description": "How many recent days of hourly prices to include. Default 7, at most 14. AU: 1 to 7 trading days of five-minute prices (default 3); each five-minute interval counts as one record. Prices are in Australian dollars (AUD) per MWh. AU gas: 1 to 7 gas days (default 7); each hub gas day counts as one record, so ask for at least 5. Prices are in Australian dollars (AUD) per GJ. CH: ignored; the answer is the newest month, with the last 12 months in extra.last_12_months. DE: 1 to 14 days of hourly prices (default 7); each hour counts as one record. ES/PT: 1 to 14 days of hourly average prices (default 7); each hour counts as one record. AT/BE/CZ/DK/FR/IT/NL/NO/PL: 1 to 14 days of hourly average prices (default 7); each hour counts as one record. GB: 1 to 14 days of half-hourly prices (default 7); each half-hour with traded volume counts as one record. JP: 1 to 14. The headline figure is always the newest complete delivery day (48 half-hours); lookback_days adds the daily medians of the earlier days we hold under extra.daily. RO: 1 to 14 days of 15-minute prices (default 7), plus the next day once published (about 13:00 CET); each 15-minute interval counts as one record. US: 1 to 14 days of hourly prices (default 7), plus tomorrow once published (about 13:00 Pacific); each delivery hour counts as one record. Prices are in US dollars (USD) per MWh, not euro.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Which wholesale market. Only day-ahead (the next-day hourly auction) is available. AU: spot only (AEMO's five-minute regional price), not day-ahead; leave it out. AU gas: daily hub price (STTM ex post), not day-ahead; leave it out. CH: a monthly reference price set by BFE, not the day-ahead auction; leave it out. DE: day-ahead only (the hourly auction held the day before delivery). ES/PT: day-ahead only (the auction held the day before delivery). AT/BE/CZ/DK/FR/IT/NL/NO/PL: day-ahead only (the auction held the day before delivery). GB: the half-hourly spot market index (traded prices); the day-ahead option is not used. Prices are in pounds, not euro. JP: day-ahead only (the spot market cleared the day before delivery). Prices are in yen per kWh, not euro per MWh. RO: the OPCOM day-ahead market (15-minute intervals). Only day-ahead is available. US: day-ahead only (CAISO's hourly day-ahead market price); leave it out.",
                "enum": ["day-ahead"],
                "type": "string"
              },
              "region": {
                "description": "AU only: NEM region NSW1 (New South Wales incl. ACT, default), QLD1, SA1, TAS1 or VIC1; short names like NSW, VIC or Queensland also work.",
                "type": "string"
