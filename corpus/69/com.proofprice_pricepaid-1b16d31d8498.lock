                "description": "How many recent months to include. Default 12. AT: ignored; STATISTIK AUSTRIA publishes one figure per calendar year (the latest is returned). AU: not used; the ABS publishes one mean price per quarter. AU (Adelaide suburbs): not used; one median per quarter (the newest is returned). BE: ignored; Statbel publishes quarters, half-years and years, and the latest period with a figure for the place is returned. BR (Fortaleza): rounded to the nearest of 3, 6, 12 or 24. BR (Recife): rounded to the nearest of 3, 6, 12 or 24. BR (Rio de Janeiro): rounded to the nearest of 3, 6, 12 or 24. BR: rounded to the nearest of 3, 6, 12 or 24. CA: up to 4 gives the latest 3 months, more gives the latest 12 months. By default the latest 3 months, widening to 12 when a place is quiet. The figure is an average of declared values, not a median. CH: not used; the figure is for the latest year published. CH: not used; the figure is for the latest year published. CH: not used; the figure is for the latest year published. CO: the data is yearly: 1 to 12 gives the newest year with sales, 13 to 24 two years, 25 to 36 three years. CZ: ignored; the figure is annual (newest full calendar year). DE: ignored; the values are fixed once a year at 1 January. DK: not used; Statistics Denmark publishes one average per quarter. ES: ignored; the ministry publishes one average per quarter (the latest is returned, with the previous quarter and the year earlier). BG HR CY CZ DE EE ES HU IS IT LV LT LU MT PL RO SI SK: ignored; the newest quarter with a figure is returned, with the change over the previous quarter and over a year. FI: not used; Statistics Finland publishes one average per quarter (postcodes, cities) or year (municipalities). GB Scotland / Northern Ireland: ignored; the newest published month is returned. HK: rounded to the nearest of 12, 24 or 60. HK: 1 to 36 whole recent months that the Land Registry has published. Default 12. HU: ignored; KSH publishes one figure per calendar year (the latest is returned). IE: rounded to the nearest of 3, 6, 12, 24 or 36. LV: ignored; VZD publishes calendar years (the latest full year is returned). NL: ignored; CBS publishes one average per calendar year (the latest is returned). NO: not used; Statistics Norway publishes one figure per quarter and the answer gives the latest quarter plus the previous one and a year earlier. NZ: 1 gives the month, 2 to 6 the 3-month figure, 7 or more (and the default 12) the 12-month rolling figure. Small areas often have no monthly price, so the answer falls back to a wider window and says so. PL: 1 to 6 months of 30 days up to today; default 3, widened automatically to 6 then 12 months when a city has fewer than 5 recent sales (the register lags; the answer says so). Large cities are read as a sample of up to 300 records per 30 days (the answer says so). PT: ignored; INE publishes one median per quarter, covering the 12 months to the quarter's end (the latest is returned). QA: 1 to 36 months back from the newest sale in the bulletin (not from today). SE: not used; Statistics Sweden publishes one figure per year (municipalities, flats) or quarter (counties). TW: 12 or 24 whole calendar months; up to 18 gives 12 (24 if a place has too few sales in 12), more gives 24. The window ends at the last month that is at least 30 days old. US (Allegheny County, PA): rounded to the nearest of 3, 6, 12 or 24 (ZIP codes: 12 or 24). US (Maricopa County, AZ): rounded to the nearest of 3, 6, 12 or 24 (ZIP codes: 12 or 24). US, Washington DC: 1 to 36 months back from the latest sale in the tables. US (Detroit, MI): 1 to 36 months back from the latest sale in the table. US: 1 to 36 months back from the latest sale in the file (New York City: up to 12).",
