        {
          "name": "pricepaid_medicine_prices",
          "title": "Official pharmacy prices of medicines",
          "description": "Use this when a user asks what a medicine costs in a pharmacy, or how much of the price the health insurance reimburses, in Brazil (country BR), Czech Republic (country CZ), Spain (country ES), Finland (country FI), France (country FR), England (NHS) (country GB), Italy (country IT), Japan (country JP), New Zealand (country NZ), Poland (country PL), Portugal (country PT), Sweden (country SE), Türkiye (country TR), Taiwan (country TW) or the United States (country US). Returns the median and typical range (10th–90th percentile) of the legally fixed price per box across all pack sizes and strengths sold under that medicine name, the number of packs, the period, a confidence label, and the official source and licence. These are regulated (posted) prices, not market transactions, and only for reimbursable medicines. Do not use for over-the-counter products with free prices or for other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "basis": {
                "description": "US only: leave out for the pharmacy's acquisition cost (NADAC, weekly); 'medicare_spend' for what Medicare Part D spent per dosage unit (CMS, yearly, before rebates); 'part_b_asp' for Medicare Part B's payment limit for doctor-administered drugs such as injections (CMS, quarterly; medicine = generic name or HCPCS code); 'medicaid' for what State Medicaid programmes reimbursed per unit (CMS, quarterly); 'mfp' for Medicare's negotiated maximum fair price for a 30-day supply (CMS, about 40 selected drugs).",
                "type": "string"
              },
              "country": {
                "description": "BR = Brazil (unit prices that public buyers awarded in medicine tenders on the PNCP; not pharmacy prices); CZ = Czech Republic (SUKL list of reimbursed medicines: legally fixed maximum consumer price per pack, CZK incl. VAT); ES = Spain (Ministerio de Sanidad Nomenclator: legally fixed public prices of medicines billed to the national health service); FI = Finland (Kela quarterly list of notified sales prices of interchangeable medicines, EUR incl. VAT); FR = France (public medicines database: legally fixed prices of reimbursable medicines); GB = England (NHS Prescription Cost Analysis: the basic price the NHS reimburses for the drug, per tablet/capsule/ml, not a patient price; England only); IT = Italy (AIFA transparency list: public prices of reimbursable off-patent class A medicines); JP = Japan (MHLW National Health Insurance drug price list: official reimbursement prices in yen); NZ = New Zealand (PHARMAC Pharmaceutical Schedule: list prices of subsidised community medicines, NZD); PL = Poland (Ministry of Health list of reimbursed pharmacy medicines: official maximum retail price per pack, PLN incl. VAT); PT = Portugal (SNS Portal da Transparência: average retail value per pack of medicines dispensed, mainland, no per-medicine detail); SE = Sweden (TLV list of substitutable medicines: regulated pharmacy retail prices, SEK); TR = Türkiye (TITCK reference-based list, reference ex-factory prices in EUR per pack, by brand); TW = Taiwan (NHIA National Health Insurance drug payment prices in New Taiwan dollars); US = United States (basis=part_b_asp gives Medicare Part B's payment limit for doctor-administered drugs such as injections and biologics, quarterly); US with basis=mfp = the price Medicare negotiated with the drugmaker for a 30-day supply (CMS maximum fair price, about 40 selected drugs); US = United States (NADAC pharmacy acquisition cost by default; basis=medicare_spend gives what Medicare Part D spent per tablet or dose, yearly); US with basis=medicaid = what State Medicaid programmes reimbursed pharmacies per tablet or dose (CMS, newest quarter); US = United States (NADAC: the average price retail pharmacies pay to acquire a drug, weekly, per tablet/capsule/mL/gram; not the patient's counter price)",
                "enum": ["BR", "CZ", "ES", "FI", "FR", "GB", "IT", "JP", "NZ", "PL", "PT", "SE", "TR", "TW", "US"],
