      "instructions": "Tools that return real prices actually paid, from official records, as a range with sample size, period, confidence and source. Cite the source and attribution line when you use a figure.",
      "tools": [
        {
          "name": "pricepaid_airfare_prices",
          "title": "Airfares paid",
          "description": "Use this when a user asks what people actually pay for a flight between two cities or airports (for example JFK to LAX, or Chicago to Miami), or what the average airfare out of a city is, in Australia (domestic routes) (country AU) or the United States (domestic flights within the contiguous 48 states) (country US). Returns the official average fare per passenger each way, in the currency the answer states, for the latest quarter published, with (where the source publishes them) the passengers per day behind it, the share of the largest carrier, the change on a year earlier and the last few quarters, plus the official source and licence. This is a published quarterly average of fares paid (price_type official_statistic), not a range built from tickets, so the range fields are null and there is no sample size; how fresh: Australia (domestic routes): monthly; the newest month is usually the one just ended; the United States (domestic flights within the contiguous 48 states): quarterly, published about five to six months after the quarter ends (the first quarter of 2026 was published in September 2026); every answer states its quarter. Do not use for today's fare, a specific date, airline or cabin, a booking or price alert, international flights, routes outside the places named above, hotels, or other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "AU = Australia (domestic routes between about 70 city pairs; cheapest advertised return fare, not a fare paid); US = United States, contiguous 48 states (domestic flights only; Alaska, Hawaii and territories are not covered)",
                "enum": ["AU", "US"],
                "type": "string"
              },
              "from": {
                "description": "Where the flight starts: an airport code (JFK, LAX) or a city (Chicago, 'Portland, OR'). Required. AU: city or airport code (Sydney, SYD, 'Gold Coast', OOL). Required, and AU also needs 'to'. US: airport code (JFK, ORD) or city ('Chicago', 'Portland, OR', 'New York'). Airports in one metro area share one city market for city-level questions.",
                "minLength": 2,
                "type": "string"
              },
              "quarters": {
                "description": "How many recent quarters to include in the trend (default 4, at most 20). The headline figure is always the latest quarter. AU: the range covers this many quarters of monthly fares (default 4 = 12 months; at least 2 are needed for a range). AU publishes one cheapest advertised return fare per route per month: advertised, not paid, so the price type is posted_price. US: the trend lists this many quarters, newest first. DOT publishes about five to six months after a quarter ends.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Where it ends: an airport code or a city. Leave out to get the average fare over the busiest routes out of the 'from' city. AU: city or airport code. Required for AU (the answer is for one route, either direction). US: airport code or city. Two airports give the airport-pair average where DOT publishes it; otherwise (and for cities) the city-pair average.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "from"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "description": "A price answer: a range or an official statistic with sample size, period, confidence, source and licence.",
            "properties": {
              "answer_id": {
                "description": "Audit trail: a stable id (hash of source id, normalised query, data period and method_version). The same question on the same data gives the same id; keep it with the reasoning that used the figure.",
                "type": "string"
              },
              "as_of": {
                "description": "When the answer was produced (ISO 8601); the snapshot date when the official source was down and the answer comes from our copy.",
                "type": "string"
              },
              "confidence": {
                "description": "high = 50+ records, medium = 15–49, low = 5–14.",
                "enum": ["high", "medium", "low", "insufficient"],
                "type": "string"
              },
              "data_age_days": {
                "description": "Whole days between data_as_of and retrieved_at; null when data_as_of is null.",
                "type": ["number", "null"]
              },
              "data_as_of": {
                "description": "ISO date (YYYY-MM-DD) of the newest data point behind the figure; null when unknown.",
                "type": ["string", "null"]
              },
              "evidence": {
                "additionalProperties": {},
                "description": "Audit trail: what kind of evidence the figure is.",
                "properties": {
                  "label": {
                    "description": "Short name of the kind of evidence, e.g. 'Recorded sale prices', 'Official published average', 'Official published index', 'Posted shelf or pump price', 'Posted or listed price', 'Contract award value', 'Regulated reimbursement price'.",
                    "type": "string"
                  },
                  "meaning": {
                    "description": "One sentence on what this kind of evidence does and does not establish.",
                    "type": "string"
                  },
                  "type": {
                    "description": "Same as price_type.",
                    "type": "string"
                  }
                },
                "required": ["label", "meaning", "type"],
                "type": "object"
              },
              "extra": {
                "additionalProperties": {},
                "description": "Source-specific details (for example cheapest stations). extra.stale is true when the answer comes from our copy of the source.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "method": {
                "type": "string"
              },
              "method_url": {
                "type": "string"
              },
              "method_version": {
                "description": "Audit trail: version of the way this source turns raw data into an answer (per source, default '1').",
                "type": "string"
              },
              "notice": {
                "description": "Information, not a valuation or offer. Also says when the answer is our copy because the official source did not respond.",
                "type": "string"
              },
              "period": {
                "additionalProperties": {},
                "description": "The period the records cover (ISO dates), or the date of the snapshot when the answer comes from our copy.",
                "properties": {
                  "from": {
                    "type": ["string", "null"]
                  },
                  "to": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              },
              "price": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "description": "The price. Null when there is not enough data to publish a figure (fewer than 5 records) or nothing matched.",
                    "properties": {
                      "currency": {
                        "description": "ISO 4217 currency code, e.g. EUR.",
                        "type": "string"
                      },
                      "max": {
                        "type": ["number", "null"]
                      },
                      "measure": {
                        "description": "What value is: median for ranges built from records; average or median for official statistics.",
                        "enum": ["median", "average"],
                        "type": "string"
                      },
                      "median": {
                        "type": ["number", "null"]
                      },
                      "min": {
                        "type": ["number", "null"]
                      },
                      "typical_high": {
                        "description": "90th percentile; null for official statistics that give no range.",
                        "type": ["number", "null"]
                      },
                      "typical_low": {
                        "description": "10th percentile; null for official statistics that give no range.",
                        "type": ["number", "null"]
                      },
                      "unit": {
                        "description": "What the price is per, e.g. 'per litre', 'per home', 'per kWh'.",
                        "type": "string"
                      },
                      "value": {
                        "description": "The headline figure. For ranges built from records it equals median.",
                        "type": "number"
                      }
                    },
                    "required": ["currency", "unit", "value"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "price_type": {
                "description": "transaction, posted_pump_price, posted_price, contract_price, reimbursement_price or official_statistic.",
                "type": "string"
              },
              "query": {
                "additionalProperties": {},
                "description": "The request as understood, echoed back.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "reliability": {
                "description": "How far to trust the figure as a distribution of real prices. official_with_count = a published official figure with a record count; official_median_no_count = a published average or median with no record count (confidence 'high' there means the publisher is official, not that a count was checked); record_level = 15+ records we hold; thin = 5–14 records; stale = our copy because the official source did not respond; insufficient_data = no figure published.",
                "enum": ["official_with_count", "official_median_no_count", "record_level", "thin", "stale", "insufficient_data"],
                "type": "string"
              },
              "retrieved_at": {
                "description": "Audit trail: when ProofPrice produced this answer (ISO 8601). For an answer from our own copy this is now, while as_of is the snapshot date.",
                "type": "string"
              },
              "sample_size": {
                "description": "Number of records behind the figure; null when the publisher does not say.",
                "type": ["number", "null"]
              },
              "source": {
                "additionalProperties": {},
                "description": "Where the figure comes from, under which licence, and the attribution line to show.",
                "properties": {
                  "attribution": {
                    "description": "The attribution line to show with the figure.",
                    "type": "string"
                  },
                  "id": {
                    "description": "Source id, e.g. es-fuel.",
                    "type": "string"
                  },
                  "licence": {
                    "type": "string"
                  },
                  "licence_url": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "publisher": {
                    "description": "Who publishes the data.",
                    "type": "string"
                  },
                  "url": {
                    "description": "The publisher's page for this data.",
                    "type": "string"
                  }
                },
                "required": ["attribution", "id", "licence", "licence_url", "name", "publisher", "url"],
                "type": "object"
              },
              "statistic": {
                "additionalProperties": {},
                "description": "Official statistics only: what kind of figure it is and the period the publisher states it for.",
                "properties": {
                  "measure": {
                    "enum": ["median", "average"],
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "reference_period": {
                    "type": "string"
                  }
                },
                "required": ["measure", "reference_period"],
                "type": "object"
              },
              "status": {
                "description": "ok = a figure is returned; insufficient_data = fewer than 5 matching records; no_matches = nothing matched.",
                "enum": ["ok", "insufficient_data", "no_matches"],
                "type": "string"
              },
              "suggestions": {
                "description": "Short plain things to try next: widen the period or area, ask for an itemised quote. May be empty.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "description": "One plain sentence an AI can quote.",
                "type": "string"
              }
            },
            "required": ["notice", "query", "source", "status", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Airfares paid"
