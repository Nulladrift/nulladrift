        {
          "name": "pricepaid_check_price",
          "title": "Check a price before you pay",
          "description": "Use this before paying: when a user or agent has a proposed price for something (a rent, a home, a litre of fuel, a medicine, a contract) and wants to know whether it is typical against recorded official evidence. Give the category (border-prices, broadband, cars, childcare, commercial-property, construction, contracts, diet-costs, energy, farm-gate-prices, farm-prices, flights, fuel, groceries, health-insurance, home-sales, home-upgrades, hotels, insurance, land-prices, medical, medicines, price-levels, producer-prices, rent, state-property-rents, supplementary-health-insurance, surplus-auctions, transport-fares, tuition, wholesale-fresh-food, wholesale-markets and wholesale-power), the country, the same parameters that category's own tool takes, and the price. It runs the category's normal answer and returns a verdict: within, above or below the typical range (10th–90th percentile of recorded prices) when the evidence is a set of records; about, above or below the average when the evidence is one official average or median (within 5% counts as about average, and it says plainly this is an average, not a distribution); or cannot_judge, with the reason, when the currency or unit differs (ProofPrice never converts), there are too few records or nothing matched. It also returns where the price sits (for example '27% above the median and above the 90th percentile'), the reasons and cautions (posted prices are not paid prices, old periods), what is missing, one quotable sentence, and the full evidence answer with source, licence and audit-trail fields to keep with the reasoning. Do not use it to value one specific item or address, as financial or legal advice, or to compare prices in different currencies or units. After 20 free calls a day per caller this tool costs USD 0.10 per answered call, paid with x402 (USDC); a 402 reply lists how. Nothing is charged for \"not enough records\" or errors.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "category": {
                "description": "Which kind of price: border-prices, broadband, cars, childcare, commercial-property, construction, contracts, diet-costs, energy, farm-gate-prices, farm-prices, flights, fuel, groceries, health-insurance, home-sales, home-upgrades…",
                "type": "string"
              },
              "country": {
                "description": "ISO country code of the place (for example IE, GB, FR). Which countries a category covers: see pricepaid_coverage.",
                "type": "string"
              },
              "currency": {
                "description": "ISO 4217 currency code of the price (for example EUR). Defaults to the evidence currency. A different currency gives cannot_judge: ProofPrice never converts.",
                "type": "string"
              },
              "includes": {
                "description": "What the price includes or excludes, as free text (for example 'VAT included, delivery excluded'). Echoed back as a caution; it is not used to adjust the figure.",
                "type": "string"
              },
              "negotiate": {
                "description": "Optional. Which side of the table you are on. Adds a negotiation block: the median and 10th/90th percentile as numbers to quote, the gap to the median, which side the evidence favours (leverage none/some/strong) and quotable evidence…",
                "enum": ["buyer", "seller"],
                "type": "string"
              },
              "price": {
                "description": "The price to check, as a number above zero (for example 2400 or 1.95), in the unit and currency below.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "unit": {
                "description": "What the price is per, for example 'per month', 'per litre', 'per home'. Defaults to the evidence unit. A different unit gives cannot_judge.",
                "type": "string"
              }
            },
            "required": ["category", "country", "price"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "description": "Verdict on a proposed price against recorded evidence.",
            "properties": {
              "answer": {
                "additionalProperties": {},
                "description": "The full evidence answer, as the category tool returns it.",
                "properties": {},
                "type": "object"
              },
              "missing": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reasons": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              },
              "verdict": {
                "enum": ["within_typical_range", "above_typical_range", "below_typical_range", "about_average", "above_average", "below_average", "cannot_judge"],
                "type": "string"
              }
            },
            "required": ["missing", "reasons", "summary", "verdict"],
            "type": "object"
          },
