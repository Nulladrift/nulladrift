 BORIS.NRW guideline values per m2, a valuation statistic derived from registered purchase prices); DK = Denmark (official average price per property from Statistics Denmark, by province and region; an official statistic, not individual sales); ES = Spain (official average APPRAISED value per m² of free housing from mortgage valuations, quarterly, by region, province and municipality over 25,000 inhabitants; appraisals, not recorded sale prices); Eurostat house price index (2015 = 100, an official index, NOT a price in money) for: BG = Bulgaria, HR = Croatia, CY = Cyprus, CZ = Czechia, DE = Germany, EE = Estonia, ES = Spain, HU = Hungary, IS = Iceland, IT = Italy, LV = Latvia, LT = Lithuania, LU = Luxembourg, MT = Malta, PL = Poland, RO = Romania, SK = Slovakia, SI = Slovenia; FI = Finland (official average price per m² of old dwellings in housing companies from Statistics Finland, by municipality, region or postcode; an official statistic, not individual sales); FR = France (DVF); GB = England & Wales (HM Land Registry); GB = England & Wales (HM Land Registry sales); Scotland and Northern Ireland (official UK House Price Index average); HK = Hong Kong (public rental flats sold to sitting tenants at a government discount, not market prices); HK = Hong Kong (all registered residential sales by price band, estimated median; a public housing estate as town gives the Housing Authority's discounted flat sales instead); HU = Hungary (official KSH average price per m² of used and new dwellings, annual, by region and settlement type; with no town the Eurostat house price index answers); IE = Ireland (Property Price Register); LV = Latvia (houses: VZD median price per house per town or parish, calendar year, by floor-area band; apartments are answered without property_type); LV = Latvia (VZD median apartment price per town and parish, calendar year; with no town the Eurostat house price index answers); NL = Netherlands (official CBS average sale price per municipality, annual); NO = Norway (official average price per m² from Statistics Norway, by municipality or county; an official statistic, not individual sales); NZ = New Zealand (official median sale prices of residential sales by area, monthly); PL = Poland (national Real Estate Price Register: notarised flat sales in the 19 biggest cities); PT = Portugal (official INE median sale price per m², quarterly, by region and municipality); QA = Qatar (villas, houses and residential buildings; registered sales; the bulletin's newest sale is Dec 2025); SE = Sweden (official average purchase price from Statistics Sweden, by municipality or county; an official statistic, not individual sales); SG = Singapore HDB resale flats; TW = Taiwan (Ministry of the Interior actual price registration: every registered sale, summarised by city or county and district); US = United States, partial: Connecticut, New York City, Cook County IL, Washington DC, Maricopa County AZ and Allegheny County PA (Pittsburgh area) only; not nationwide; US = United States, partial: Connecticut, New York City, Cook County IL, Washington DC and Maricopa County AZ (Phoenix area) only; not nationwide; US = United States, partial: Connecticut, New York City, Cook County IL and Washington DC by town; the whole country for new houses (Census Bureau national median); US = United States, partial: Connecticut, New York City, Cook County IL and Washington DC only; not nationwide; US = United States, partial: Connecticut, New York City, Cook County IL, Washington DC, Maricopa County AZ, Allegheny County PA and Detroit MI only; not nationwide; US = United States, partial: Connecticut, New York City and Cook County IL (Chicago area) only; not nationwide",
