                "description": "Tax level of the price. 'all' = all taxes and levies included (what a household pays, default); 'excl_vat' = excluding VAT and other recoverable taxes; 'none' = excluding all taxes and levies. BE with supplier_offers=true: not used. The offers are always excluding VAT, grid fees, taxes and levies. BR: not used. ANEEL tariffs are always before taxes (ICMS, PIS/COFINS) and flag surcharges. CH: one published total (energy + grid use + charges + federal aid fee); leave taxes out. CO: not used; the figure is the regulated unit cost (CU) before taxes, subsidies and contributions. Business, EU/NO/IS/candidates: default 'excl_vat' (excluding VAT and other recoverable taxes and levies: what a business really bears); 'all' = all taxes and levies including VAT; 'none' = excluding all taxes and levies. Finland: all = with electricity tax and VAT (default); none = energy plus distribution only, calculated by ProofPrice from Statistics Finland's parts. Business GB: DESNZ prices never include VAT. Default 'excl_vat' = excluding VAT, including the Climate Change Levy (table 3.4.2); 'none' = also excluding the Climate Change Levy (table 3.4.1); 'all' gives the same figure as 'excl_vat' and the answer says so. GB: not used. Gas figures include 5% VAT; electricity has no VAT from 1 October 2026 to 31 March 2027 (Ofgem's own wording). Netherlands: all = CBS's price with VAT and taxes (default); excl_vat = without VAT, taxes in; none = without VAT and taxes. All three are published by CBS. Norway: all = including VAT (default); none or excl_vat = excluding taxes. SSB publishes only these two levels. NZ: prices always include GST (15%); only 'all' (or leaving it out) works. Sweden: all = SCB's total with electricity tax and VAT (default); excl_vat and none are calculated by ProofPrice from SCB's published parts. SG: not used; the figure excludes GST. SG: not used; the figure excludes GST. TW gas: not used; prices are before the 5% business tax. TW: not used; the figure is the published tariff before any tax or surcharge. US: not used (EIA publishes one average per state). Business US: not used (EIA publishes one average per state).",
