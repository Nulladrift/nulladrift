ally several weeks behind; South Africa: monthly, about three weeks after the end of the month; collected into our price library every day, each answer states its reference month. This is a published national (or regional) average, not a range of individual transactions, so the range fields can be null. Do not use for the price at a particular supermarket or online shop, loyalty-card or special-offer prices, restaurant meals, petrol or diesel, or for other countries.",
