              "cpv": {
                "description": "Optional official product code, to be exact, where the source uses one (the country notes say which code system), e.g. the CPV code 30213100 for portable computers; a prefix such as 3021 covers the whole group. AR: not used; COMPR.AR has its own product groups, put the group in what. AU: a UNSPSC code or prefix of 2 to 8 digits (43211503 = notebook computers, 4321 = computers), not a CPV code. BR: optional Compras.gov.br product-family code as 'pdm:310' instead of a word. BR: not used. Alberta: not used. Toronto: not used. CA federal: not used. CA: not used. Quebec: not used. CO: not used. CZ: not used; the register has no product codes. DE: a CPV code of 2 digits (a division) or 4 to 8 digits (read as the 4-digit group, e.g. 3021); used instead of the words in what. ES: a CPV code of 2 digits (a division, e.g. 45 construction) or 4 to 8 digits (read as the 4-digit group, e.g. 3021); used instead of the words in what (what is still required, say anything such as 'works'). EU and EEA: an 8-digit CPV code (30213100) or a shorter prefix (3021) for a whole group; a lot counts when its own main product code is in that group. FR: a CPV code of 2 digits (a division) or 4 to 8 digits (read as the 4-digit group, e.g. 3021); used instead of the words in what. GB: a CPV code of 2 digits (a division) or 4 to 8 digits (read as the 4-digit group, e.g. 3021); used instead of the words in what. IE: a CPV code of 2 digits (a division) or 4 to 8 digits (read as the 4-digit group, e.g. 4523); used instead of the words in what. NG: not used; put the purchase theme in what. NZ: not used (New Zealand notices carry no CPV codes). PL: a CPV code of 2 digits (a division) or 4 to 8 digits (read as the 4-digit group, e.g. 3021); used instead of the words in what. PT: a CPV code of 2 digits (a division) or 4 to 8 digits (read as the 4-digit group, e.g. 3021); used instead of the words in what. SG: not used (Singapore tenders carry no CPV codes). TH: not used. UA: a product code of 2 digits (a division) or 4 to 8 digits (read as the 4-digit group, e.g. 3021); used instead of the words in what. Chicago: not used. US hourly labour rates: optional GSA schedule SIN as 'sin:541330ENG'. US: a product or service code (PSC, e.g. 7010 or psc:7010) or a NAICS code (e.g. 334111 or naics:334111) instead of the keyword; there are no CPV codes in the US. ZA: not used.",
                "type": "string"
