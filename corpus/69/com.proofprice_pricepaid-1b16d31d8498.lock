        {
          "name": "pricepaid_medical_prices",
          "title": "Doctor and hospital prices paid",
          "description": "Use this when a user asks what a medical service or hospital stay costs, or what was actually paid for it, for example an office visit, an MRI, a colonoscopy, physical therapy, a knee replacement or a pneumonia stay, in Norway (state tariff fees for doctors, psychologists, dentists, physiotherapists) (country NO), Sweden (dental care reference prices) (country SE), Singapore (hospital bills for medical conditions) (country SG), the United States (Medicare fees for medical equipment) (country US) or the United States (what Medicare paid doctors and hospitals) (country US). Returns the official average amount the public health insurer allowed per service (doctors' services, in an office or a facility) or paid per hospital stay (by hospital-stay group), nationally or for one state where the source publishes it, with the number of services or discharges behind it, the share the insurer itself paid, the national average for comparison and the data year, plus the official source and licence. These are public-insurance rates (price_type official_statistic): what the insurer allowed or paid, NOT private-insurance negotiated prices or cash prices, which are usually higher, and not a quote. A published average, so the range fields are null. Facility figures are the doctor's fee only; the hospital's or surgery centre's fee is separate. How fresh: Norway (state tariff fees for doctors, psychologists, dentists, physiotherapists): helsedirektoratet publishes new tariff files about twice a year; we read the page and use the newest file for each field; Sweden (dental care reference prices): TLV publishes a new tariff file once or twice a year; we read the page and use the file in force today; Singapore (hospital bills for medical conditions): annual benchmark file (data year 2023, file last updated 15 May 2026); every answer states its data year; the United States (Medicare fees for medical equipment): quarterly (January, April, July, October); the release is stated in every answer; the United States (what Medicare paid doctors and hospitals): annual: one calendar year at a time (the 2024 data year was released in 2026); every answer states its data year. Do not use for a quote or what a specific hospital or doctor charges, private-insurance or out-of-pocket costs, drug or prescription prices, dental or vision plans, or other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "basis": {
                "description": "US only: dmepos = Medicare's fee schedule for medical equipment and supplies (wheelchairs, CPAP, oxygen, walkers, test strips). Leave out for doctor and hospital prices.",
                "type": "string"
              },
              "country": {
                "description": "NO = Norway (state tariff fees for doctors, psychologists, dentists and physiotherapists under the Helfo scheme, NOK; posted tariffs, not paid prices); SE = Sweden (dental care: TLV reference prices for the state dental support, SEK; posted reference prices, not paid prices); SG = Singapore (Ministry of Health: median and middle-half hospital bills for medical conditions, Singapore Citizens, 2023); US = United States (basis=dmepos gives Medicare's fee-schedule amount for medical equipment and supplies such as wheelchairs, CPAP and oxygen, quarterly); US = United States (what Medicare paid, nationally or by state)",
                "enum": ["NO", "SE", "SG", "US"],
                "type": "string"
              },
              "service": {
                "description": "The medical service: plain words ('office visit', 'MRI lower back', 'knee replacement'), a billing code or a hospital-stay group code, as the country notes list them. Required. NO: a service in plain words ('consultation', 'cataract operation', 'ECG', 'psychologist', 'physiotherapy', 'dentist check-up'; Norwegian words work too: 'konsultasjon', 'katarakt') or a tariff code such as 'S2ad' (GP consultation) or 'K01a' (cataract operation). Name the profession (doctor, psychologist, dentist, physiotherapist) to search only that tariff; doctors come first otherwise. Hospital stays have no Norwegian data here. SE: a dental treatment in plain words ('crown', 'root canal', 'implant', 'filling', 'check-up', 'scaling', 'denture'; Swedish words work too: 'krona', 'rotfyllning') or a TLV treatment number ('800' = permanent crown, '501' = root canal, one canal). Sweden has dental care only here: for doctor or hospital prices Sweden has no data. Singapore: a medical condition in plain words ('stroke', 'dementia', 'delirium', 'spinal cord conditions') or an MOH DRG code ('B70A'). Surgery and doctor visits are not covered. US with basis=dmepos: an HCPCS equipment code ('E0601' CPAP, 'E1390' oxygen concentrator, 'K0001' standard wheelchair, 'E0143' walker, add a modifier like 'E0601 RR' for rental) or plain words from the CMS descriptor ('wheelchair', 'oxygen concentrator'). Codes starting A, E, K or L are treated as equipment even without basis. US: plain words ('office visit', 'MRI lower back', 'colonoscopy', 'physical therapy', 'knee replacement', 'pneumonia'), a billing code (HCPCS/CPT such as 99213 or G0121) or an MS-DRG hospital-stay code ('DRG 470').",
                "minLength": 2,
                "type": "string"
              },
              "setting": {
                "description": "office = a doctor's office (whole service); facility = hospital outpatient or surgery centre (doctor's fee only); inpatient = a hospital stay. Leave out to use the usual setting for the service. NO: not used, leave out. SE: not used, leave out. Singapore: only inpatient (a hospital stay); leave out. US: office (a doctor's office; the whole service), facility (a hospital outpatient department or surgery centre; the doctor's fee only) or inpatient (a hospital stay, by MS-DRG). Leave out to use the usual setting for the service.",
                "enum": ["office", "facility", "inpatient"],
                "type": "string"
              },
              "state": {
                "description": "A state or territory, where the source publishes one (the country notes say how to write it). Leave out for the national average. NO: not used, leave out. SE: not used, leave out. Singapore: the ward class, because Singapore has no states: c = public subsidised Ward C (default), b2 = public subsidised Ward B2, b1 = public unsubsidised Ward B1, a = public unsubsidised Ward A, private = private hospital. US equipment: a state as a two-letter code or name (TX, Texas). Leave out for the median across states with the cheapest and dearest state. US: a state or territory as a two-letter code or name (TX, Texas). Leave out for the national average.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "service"],
            "type": "object"
          },
