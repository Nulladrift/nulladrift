          "description": "Use this when a user asks what insurance actually costs the people who hold it, for example what homeowners pay per year for flood insurance in a ZIP code or state, in the United States (federal flood insurance) (country US). Returns the median yearly charge with the typical range (10th to 90th percentile) across real policies, the number of policies behind it, the period, a confidence label, and the official source and licence. Only aggregates are returned, never one policy, and never fewer than 5 policies. Read the method in the answer: some premiums are set partly by public rules, so they are real charges but not a free-market quote. How fresh: updated about monthly (data as of 2026-09-08 when checked); every answer states the period it covers. Do not use for a personal quote, for insurance that is not covered by a source here, for the value or replacement cost of a home, or for other countries.",
