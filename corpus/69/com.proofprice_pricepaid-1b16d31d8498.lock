iddle East, Latin America) (country ZW), the United States (country US), Uruguay (consumer ministry shelf prices) (country UY) or South Africa (country ZA), or how that price has changed over the last year. Returns the official average or median shop price that the national statistics office publishes for a standard item, built from the shelf prices its price collectors record in shops for the consumer price index (shelf prices observed by price collectors, not receipts and not what one shopper paid; some offices also use retailers' scanner data), with the exact item definition (for example 'Full-fat milk, per 2 litres'), the unit, the reference month, the change on a year earlier where the office publishes comparable figures (an answer carries none where the office advises against comparing months), the official source and licence. Each country defines its own standard items, so the item definition in the answer matters and related definitions are listed. How fresh: United Arab Emirates: monthly (the page states its own 'Last Updated' date); Argentina (Precios Claros supermarket shelf prices): daily files, one per weekday; we read the newest; Austria and New Zealand: monthly, in the middle of the following month; collected into our price library every day, each answer states its reference month; Bulgaria: annual: the 2025 figures are the newest published (checked 10 November 2026); Canada: monthly, not live: Statistics Canada publishes each month's averages about five weeks after the month ends (August 2026 was released on 7 October 2026), and every answer states its reference month; Switzerland: monthly: BLW adds the newest month during the following month, and the answer names the month it covers; Chile (ODEPA shelf prices): weekly (newest completed week); Czechia: monthly: newest month published 10 November 2026 (October 2026), about 10 days after the month ends; France: monthly items in the middle of the following month, annual items in January; collected into 