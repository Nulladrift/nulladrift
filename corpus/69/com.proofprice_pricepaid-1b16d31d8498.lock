        {
          "name": "pricepaid_contract_prices",
          "title": "Government contract prices (what public buyers paid)",
          "description": "Use this when a user asks what governments, councils, hospitals or other public buyers actually paid for something (laptops, school meals, road resurfacing, office cleaning, electricity, ambulances, waste collection and similar purchases) in Argentina (public contracts, COMPR.AR), Australia (federal contracts, AusTender), Brazil (furniture bought by public bodies), Brazil (public contracts, PNCP), Alberta (sole-source service contracts), Toronto (City of Toronto awarded contracts), Canada (federal contracts over CA$10,000, proactive disclosure), Canada (federal contracts, CanadaBuys), Quebec (public contracts, SEAO), Colombia (public contracts, SECOP II), Czech Republic (public contracts, Registr smluv), Germany (public contracts, Bekanntmachungsservice), Spain (public contracts, PLACSP), EU and EEA states (TED), France (public contracts, DECP), the United Kingdom (Contracts Finder), Ireland (public contracts, eTenders), Nigeria (federal public contracts, NOCOPO), New Zealand (GETS), Poland (public contracts, e-Zamowienia), Portugal (public contracts, Portal BASE), Singapore (GeBIZ), Thailand (Bangkok city contracts), Ukraine (public contracts, Prozorro), Chicago (city contract awards), the United States (federal labour rates), the United States (federal contracts) or South Africa (public contracts, eTenders). Returns, from official contract award notices, the median awarded value per contract, a typical range (10th–90th percentile), the number of awards, the period covered, a confidence label, and the official source and licence. Important: the figures are TOTAL values per contract (lot), not unit prices, unless the answer states a unit price (only when the notices give a quantity and unit). Nothing is returned for fewer than 5 awards, and individual suppliers are never named. How fresh: Argentina (public contracts, COMPR.AR): twice a year: the publisher refreshes the file about every six months, so the newest awards can be months old; Australia (federal contracts, AusTender): continuous: buyers publish award notices after a contract is awarded; Brazil (furniture bought by public bodies): updated by the publisher as purchases are registered; Brazil (public contracts, PNCP): daily: the PNCP publishes contracts as buyers register them and our copy is collected once a day; Alberta (sole-source service contracts): quarterly: the Government of Alberta adds new sole-source contracts each quarter; our copy is collected once a day; Toronto (City of Toronto awarded contracts): daily file from Open Data Toronto, copied by the collector each night; the newest award in it can be weeks old; Canada (federal contracts over CA$10,000, proactive disclosure): quarterly: departments report each fiscal quarter and the publisher refreshes the file every three months, read by us daily; Canada (federal contracts, CanadaBuys): daily: CanadaBuys refreshes the award notice files every day and our copy is collected once a day; Quebec (public contracts, SEAO): weekly: Données Québec publishes new SEAO files every Monday; our copy is collected once a day; Colombia (public contracts, SECOP II): daily: Colombia Compra Eficiente refreshes the open dataset about daily and our copy is collected once a day; Czech Republic (public contracts, Registr smluv): daily: the register is updated continuously and our copy is collected once a day; Germany (public contracts, Bekanntmachungsservice): daily: the notice service publishes each day's notices and our copy is collected once a day; Spain (public contracts, PLACSP): daily: PLACSP adds awards through the day and our copy is collected once a day, covering the newest one to two days of awards; EU and EEA states (TED): daily on working days: notices appear on TED within days of the buyer sending them; France (public contracts, DECP): daily: the consolidated monthly files are refreshed about daily and our copy is collected once a day; the United Kingdom (Contracts Finder): daily: buyers publish award notices every working day and our copy is collected once a day; Ireland (public contracts, eTenders): quarterly: the publisher refreshes the file every quarter and our copy is collected once a day; Nigeria (federal public contracts, NOCOPO): monthly refresh of the registry copy, but the portal itself has recorded almost no new awards since November 2024, so the newest figures are about two years old; New Zealand (GETS): quarterly; awards up to the end of the last quarter; Poland (public contracts, e-Zamowienia): daily: notices are published every working day and our copy is collected once a day; Portugal (public contracts, Portal BASE): weekly: IMPIC refreshes the yearly files about weekly and our copy is collected once a day; Singapore (GeBIZ): yearly; Thailand (Bangkok city contracts): the Open Contracting Partnership refreshes the BMA file about every two weeks and our copy is collected once a day; Ukraine (public contracts, Prozorro): daily: Prozorro updates continuously; our copy is collected once a day from the newest contracts; Chicago (city contract awards): updated daily by the City of Chicago; the United States (federal labour rates): rebuilt every night by GSA; the United States (federal contracts): daily: agencies report contract actions within days and USAspending refreshes nightly; South Africa (public contracts, eTenders): monthly: the Open Contracting Partnership refreshes the eTenders bulk file about once a month and our copy is collected once a day. Do not use for what consumers or private companies pay, for tenders that are still open (those carry estimates, not prices paid), for the contracts of one named supplier, for asking prices, or for other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "buyer_area": {
                "description": "Optional region or city to narrow to, see the country notes below. AR: not used; all national public bodies are summarised together. AU: part of a federal agency's name ('Defence', 'Health', 'Parliamentary Services'); contracts have no delivery place. BR: two-letter state code of the buying body ('SP', 'RJ', 'DF'). BR: optional two-letter state code of the buyer (SP, RJ, MG, DF...); left out = all of Brazil. A state with fewer than 5 contracts for the purchase gets no figure. Alberta: write Alberta to get Alberta government departments; these are contracts awarded without competition. Toronto: write Toronto to get contracts awarded by the City of Toronto; all divisions are summarised together. CA: federal = the Treasury Board proactive disclosure of federal contracts over CA$10,000 (this source). Quebec = SEAO, Alberta = sole-source list; leave it out for CanadaBuys award notices. CA: not used; all federal buyers are summarised together. Quebec: write Quebec to get Quebec public buyers (ministries, school service centres, cities, municipalities); all of Quebec is summarised together. CO: not used; all public buyers are summarised together. CZ: not used; all Czech public bodies are summarised together. DE: not used; all German public buyers are summarised together. ES: not used; all Spanish public buyers are summarised together. EU and EEA: the buyer's city, as written on the notice (e.g. 'Lyon', 'München'). FR: not used; all French public buyers are summarised together. GB: not used; all UK public buyers are summarised together. IE: not used; all Irish public buyers are summarised together. NG: not used; all federal public bodies are summarised together. NZ: part of the posting agency's name ('Auckland Council', 'Waka Kotahi', 'Health'); needs at least 5 awards. PL: not used; all Polish public buyers are summarised together. PT: not used; all Portuguese public buyers are summarised together. SG: part of an agency name ('National Library Board', 'Health Sciences Authority'). TH: not used; all Bangkok Metropolitan Administration buyers are summarised together. UA: not used; all Ukrainian public buyers are summarised together. Chicago: write Chicago to get City of Chicago awards (original awards of US$1,000 or more). US: a state name or code ('Virginia', 'VA'); filters by where the work is done. ZA: not used; all public buyers are summarised together.",
                "type": "string"
