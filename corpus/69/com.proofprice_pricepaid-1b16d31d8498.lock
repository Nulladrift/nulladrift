                "type": "string"
              },
              "prefecture": {
                "description": "JP only: prefecture, English (Tokyo, Osaka, Hokkaido), Japanese (東京都) or 2-digit JIS code (13). Needed unless town is a Tokyo ward.",
                "type": "string"
