        {
          "name": "pricepaid_auction_prices",
          "title": "Public auction prices (winning bids on surplus goods)",
          "description": "Use this when a user asks what used, surplus or seized goods (vehicles, heavy equipment, electronics, office furniture, tools and similar) went for at public auction in Canada (federal surplus), France (state auctions), Hong Kong (government auctions), Ukraine (Prozorro.Sale public asset sales), the United States (federal surplus) or Seattle (City fleet sales). Returns the median final bid on sold lots, a typical range (10th–90th percentile), the number of lots, the period, and the source and licence. How fresh: Canada (federal surplus): half-yearly files; the newest sale in the latest file can be several months old; France (state auctions): yearly file: calendar 2024 (published 20 Feb 2026); the 2025 file is expected around Feb 2027; Hong Kong (government auctions): a new pair of files after each auction, about every two weeks; Ukraine (Prozorro.Sale public asset sales): daily collection of the newest 60 days of signed sale contracts; the United States (federal surplus): monthly file, covers the last six months of auctions; Seattle (City fleet sales): updated irregularly after each auction batch (newest sale 15 Oct 2026 when checked). These are winning bid levels on lots marked sold (before any buyer premium, not confirmed receipts) for used goods, not retail prices. Nothing is returned for fewer than 5 lots, and no seller or lot is named. Do not use for new goods, shop prices or other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "US only: 'Seattle' answers from City of Seattle sold fleet vehicles and equipment (actual auction sale prices). Leave out for US federal (GSA) surplus.",
                "type": "string"
              },
              "country": {
                "description": "CA = Canada (Government of Canada surplus sold through GCSurplus); FR = France; HK = Hong Kong (Government Logistics Department auctions of surplus and confiscated goods); UA = Ukraine (state, municipal and bankrupt-estate assets sold on Prozorro.Sale); US = United States; US = United States (federal surplus; add city=Seattle for City of Seattle sold fleet vehicles)",
                "enum": ["CA", "FR", "HK", "UA", "US"],
                "type": "string"
              },
              "months": {
                "description": "How many recent months of auctions to include. Default 12. CA: rounded to the nearest of 6, 12 or 24. HK: rounded to 12 or 24. UA: not used; each figure covers contracts signed in the newest 60 days.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Optional region to narrow to, see the country notes below. CA: province or territory, name or two-letter code ('ON', 'Quebec'). Omit for all of Canada. FR: the auction house city (CAV) such as 'Lyon', 'Marseille' or 'Toulouse'. The data is the 2024 file of French state auctions (seized, impounded and court sales). HK: not used (whole territory). UA: region (oblast) name such as Kyiv city, Vinnytsia, Volyn, Dnipropetrovsk, Donetsk; 'Kyiv' alone means the city, 'Kyiv oblast' the region. Omit for all of Ukraine. US: two-letter state or territory code ('TX'). The auctions are US federal surplus and seized goods.",
                "type": "string"
              },
              "what": {
                "description": "Lot type: a group name or words from the lot title, such as 'vehicles', 'heavy equipment', 'office furniture' or 'forklift'. CA: one of vehicles, heavy-equipment, electronics, office-furniture, boats, tools-machinery, or a word such as 'truck', 'laptop', 'forklift', 'desk'. FR: 'cars', 'vans', 'motorbikes', 'bicycles', 'computers', 'furniture', 'jewellery', 'wine', or words from the brand, model or description ('renault clio'). HK: one of private-cars, goods-vehicles, motorcycles, containers, or a word such as 'car', 'van', 'motorcycle', 'container'. UA: one of vehicles, machinery, electronics, furniture, real-estate, land, farm-produce, other, any, or a word such as 'truck', 'building', 'land', 'grain'. 'any' covers every concluded sale. US with city=Seattle: words from the item, such as 'van', 'pickup truck', 'scooter', 'patrol', 'ford'.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "what"],
            "type": "object"
          },
