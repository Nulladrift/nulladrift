ne national price per week; any place is answered with the Malaysia price and the answer says so. Netherlands: not used (national average only). Norway: not used (national average only). NZ: not used. MBIE publishes one national price per week; any place is answered with the New Zealand average and the answer says so. PT: municipality (concelho), e.g. 'Cascais' or 'Sintra'; with fewer than 5 stations its district is answered, labelled. Without postcode, area or town the national figure is returned. SG: not used. One national price per month; any place is answered with the Singapore average and the answer says so. TH: not used. EPPO publishes one national price per month; any place is answered with the Thailand average and the answer says so. TW: not used. CPC posts one island-wide price; any place is answered with the Taiwan price and the answer says so. US: one of the ten cities EIA publishes (Boston, Chicago, Cleveland, Denver, Houston, Los Angeles, Miami, New York City, San Francisco, Seattle), gasoline only; otherwise the national average is returned and the answer says so. US heating oil and propane: not used (national average only). Uruguay: not used (national maximum price only).",
