; ALL works for electricity only. Eurostat codes such as MWH500-1999 or GJ10000-99999 also work. A small shop or office is typically IA or IB (electricity) and I1 (gas); a factory IC to IE. Finland, annual consumption: DA = under 1,000 kWh a year; DB = 1,000 to 2,499 kWh a year; DC = 2,500 to 4,999 kWh a year; DD = 5,000 to 15,000 kWh a year; DE = over 15,000 kWh a year; default DC. Business GB, annual consumption of the business, by DESNZ size band name or by the matching Eurostat letter. Electricity: Very Small (IA) = under 20 MWh a year; Small (IB) = 20 to 499 MWh a year; Small/Medium (IC) = 500 to 1,999 MWh a year; Medium (ID) = 2,000 to 19,999 MWh a year; Large (IE) = 20,000 to 69,999 MWh a year; Very Large (IF) = 70,000 to 150,000 MWh a year; Extra Large (IG) = over 150,000 MWh a year. Gas: Very Small (I1) = under 278 MWh a year; Small (I2) = 278 to 2,777 MWh a year; Medium (I3) = 2,778 to 27,777 MWh a year; Large (I4) = 27,778 to 277,777 MWh a year; Very Large (I5) = 277,778 to 1,111,112 MWh a year (no band above Very Large, so Eurostat I6 has no UK figure). Average = all bands together. Default: Small/Medium for electricity (= Eurostat IC) and Medium for gas (= I3). GB: not used (the cap is a unit rate and a standing charge, not a price by consumption band). Netherlands, annual consumption. Electricity: DA = under 1 MWh (1,000 kWh) a year; DB = 1 to 2.5 MWh (1,000 to 2,499 kWh) a year; DC = 2.5 to 5 MWh (2,500 to 4,999 kWh) a year; most households; DD = 5 to 15 MWh (5,000 to 14,999 kWh) a year; DE = 15 MWh (15,000 kWh) a year or more; default DC. Gas: D1 = under 569 m3 (under 20 GJ) a year; D2 = 569 to 5,687 m3 (20 to 200 GJ) a year; most households; D3 = 5,687 m3 (200 GJ) a year or more; default D2. Norway: not used; SSB publishes no consumption bands. Use contract instead. NZ: 'standard' (default, standard household user) or 'low' (low user). Sweden, annual consumption: DA = under 1,000 kWh a year; DB = 1,000 to 2,499 kWh a year; DC = 2,500 to 4,999 kWh a year; DD = 5,000 to 14,999 kWh a year; DE = 15,000 kWh a year or more; default DC. SG: one flat domestic tariff; leave out. SG gas: general (default), bulk_a or bulk_b (the publisher's three tariffs). TW gas: 'household' (default, CPC direct household customers), 'industrial', 'utility', 'cogeneration', 'power' (natural gas, per m3) or 'lpg' (household-use LPG list price to dealers, per kg). TW: monthly use: 'standard' (default, 330 kWh), 'low' (120 kWh), 'high' (700 kWh) or a number of kWh a month (1 to 5000). US: not used (EIA publishes one average for all residential customers in a state). Business US: not used (EIA publishes one commercial average per state, no consumption bands).",
                "type": "string"
              },
              "contract": {
                "description": "Norway only: type of electricity contract: total = all households together (default); fixed = fixed-price contracts; spot = contracts tied to the spot price; variable = variable-price contracts. Default total.",
                "type": "string"
