        {
          "name": "pricepaid_construction_costs",
          "title": "Building cost per square metre",
          "description": "Use this when a user asks what it costs to build a home or other building per square metre in Brazil (country BR), how much of that is materials and how much is labour, or how states or regions compare. Returns the official average cost per square metre for the latest month published, split into materials and labour, with the previous month, the official source and licence. This is a published survey average of unit costs (price_type official_statistic), not a range built from invoices or sales, so the range fields are null and there is no sample size. How fresh: monthly; the latest month on 16 Oct 2026 was September 2026. Do not use for the price of a finished home, for a builder's quote, for renovation work, or for countries that are not listed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "State or region, where the publisher splits by place (the country notes say how). Leave out for the national figure. BR: state name or two-letter code ('São Paulo', 'SP', 'Bahia', 'RJ'); leave out for the national figure (Brasil). States: RO = Rondônia, AC = Acre, AM = Amazonas, RR = Roraima, PA = Pará, AP = Amapá, TO = Tocantins, MA = Maranhão, PI = Piauí, CE = Ceará, RN = Rio Grande do Norte, PB = Paraíba, PE = Pernambuco, AL = Alagoas, SE = Sergipe, BA = Bahia, MG = Minas Gerais, ES = Espírito Santo, RJ = Rio de Janeiro, SP = São Paulo, PR = Paraná, SC = Santa Catarina, RS = Rio Grande do Sul, MS = Mato Grosso do Sul, MT = Mato Grosso, GO = Goiás, DF = Distrito Federal.",
                "type": "string"
              },
              "component": {
                "description": "Which part of the cost: total (default), material (building materials) or labour (wages). BR: total (default) = average cost per m2; material = materials part; labour = labour part. All in BRL per m2, monthly.",
                "enum": ["total", "material", "labour"],
                "type": "string"
              },
              "country": {
                "description": "BR = Brazil (all 27 states plus the national figure; IBGE SINAPI average cost per m2)",
                "enum": ["BR"],
                "type": "string"
              }
