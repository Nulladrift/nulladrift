              "town": {
                "description": "Town name. AU (Queensland only): suburb name, e.g. 'Mount Gravatt'. Small suburbs may have fewer than 5 stations. AU (Western Australia only): suburb name, e.g. 'Rockingham'. Small suburbs may have fewer than 5 stations; use a postcode, 'Perth' or 'WA' then. BR: municipality, e.g. 'São Paulo' or 'Curitiba'; add area when the name exists in several states. Ontario: one of Windsor, London, Peterborough, St. Catharines, Sudbury, Sault Ste. Marie, North Bay, Timmins, Kenora, Parry Sound, Toronto East, Toronto West, or Ontario / Southern Ontario / Northern Ontario for the averages. Ottawa, Thunder Bay and Toronto (city) are answered from Statistics Canada. Canada: one of the 18 cities Statistics Canada tracks (St. John's, Charlottetown and Summerside, Halifax, Saint John, Québec, Montréal, Ottawa-Gatineau, Toronto, Thunder Bay, Winnipeg, Regina, Saskatoon, Edmonton, Calgary, Vancouver, Victoria, Whitehorse, Yellowknife), or 'Canada' for the national average (regular unleaded only). Leave town and area out for the national average. CO: municipality, for example 'Medellin' or 'Cali'. Needs at least 5 reporting stations. Costa Rica: not used (national price only). CZ: not used. One national price per week; any place is answered with the Czech average and the answer says so. ES: town name, e.g. 'Valencia' or 'Marbella' (a town with fewer than 5 stations for the fuel is answered for its province, labelled). EU Weekly Oil Bulletin countries: not used (national average only). Finland: not used (national average only). GB: not used (national average only). HK: not used. Prices are for the whole territory; any place is answered with the Hong Kong figure and the answer says so. IT: comune name, e.g. 'Bologna'. LU: not used. One national price per month; any place is answered with the Luxembourg average and the answer says so. Montenegro: not used (national price only). MX: not used for cities; a state name given here works like area. MY: not used. One national price per week; any place is answered with the Malaysia price and the answer says so. Netherlands: not used (national average only). Norway: not used (national average only). NZ: not used. MBIE publishes one national price per week; any place is answered with the New Zealand average and the answer says so. PT: municipality (concelho), e.g. 'Cascais' or 'Sintra'; with fewer than 5 stations its district is answered, labelled. Without postcode, area or town the national figure is returned. SG: not used. One national price per month; any place is answered with the Singapore average and the answer says so. TH: not used. EPPO publishes one national price per month; any place is answered with the Thailand average and the answer says so. TW: not used. CPC posts one island-wide price; any place is answered with the Taiwan price and the answer says so. US: one of the ten cities EIA publishes (Boston, Chicago, Cleveland, Denver, Houston, Los Angeles, Miami, New York City, San Francisco, Seattle), gasoline only; otherwise the national average is returned and the answer says so. US heating oil and propane: not used (national average only). Uruguay: not used (national maximum price only).",
                "type": "string"
              }
