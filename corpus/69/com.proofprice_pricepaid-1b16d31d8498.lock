              },
              "postcode": {
                "description": "Postcode, for a precise area. AT: only Vienna postcodes (1010 to 1230) are matched, to the Vienna district; elsewhere give the town or district as town. AU: a 4-digit postcode ('2150'), answered with the state or territory it lies in (the ABS has no postcode figures). AU (Adelaide suburbs): not used here; name the suburb in town. BE: not supported (Statbel publishes by municipality); give the municipality as town. BR (Fortaleza): a CEP starting 60 or 61 routes here, but figures are by neighbourhood; give the neighbourhood as town. BR (Recife): a CEP starting 50, 51 or 52 routes here, but figures are by neighbourhood; give the neighbourhood as town. BR (Rio de Janeiro): a CEP starting 20 to 23 routes here, but figures are by neighbourhood; give the neighbourhood as town. BR: not supported; give the neighbourhood as town. CA: not supported; BC publishes by municipality, so give the municipality as town. CH: not used; give the municipality in town. CH: not used; give a district or quarter of Zürich in town. CO: not supported; the data is by municipality, so give the municipality as town. CZ: not supported (national average only). DE: not supported; give the town as town. DK: not supported (Statistics Denmark publishes by province and region); give town instead. ES: not supported (the ministry publishes by region, province and municipality); give the place as town. BG HR CY CZ DE EE ES HU IS IT LV LT LU MT PL RO SI SK: not supported (national index only). FI: a five-digit postcode (for example 00100): the latest yearly figure for that postal code area. Flats are published by number of rooms, so the answer is the room size with most transactions and the others are listed. FR: 5-digit postcode, e.g. '69003'; use instead of town for a precise area. HK: not supported; give the estate as town. HK: not supported. HU: not supported (KSH publishes regions, not postcodes). LV: not supported (VZD publishes towns and parishes). NL: not supported (CBS publishes by municipality); give the municipality as town. NO: not supported (Statistics Norway publishes by municipality); give town instead. NZ: not supported; the publisher gives figures by area, so give the area as town. PL: not supported; give the city as town. PT: not supported (INE publishes by region and municipality); give the municipality as town. SE: not supported (Statistics Sweden publishes by municipality); give town instead. TW: not supported (the register has no postcodes); give the city, county or district as town. US (Allegheny County, PA): a 5-digit ZIP code (15001 to 15290) with enough sales; 12 or 24 month windows only. US (Maricopa County, AZ): a 5-digit Arizona ZIP code (85xxx) with enough sales; 12 or 24 month windows only. US (Detroit, MI): optional ZIP code 48201 to 48288 with at least 5 sales in the window. US: 5-digit ZIP code, New York City only (Connecticut and Cook County have no ZIP in the public file).",
                "type": "string"
              },
              "postcode_district": {
                "description": "GB only: postcode district such as 'BS8' to narrow the area.",
                "type": "string"
              },
              "property_type": {
                "description": "Kind of home. Default 'any'. AT: house or apartment (flats). The figure is the price per m² of living area. With no type given the headline is the flat figure and both medians are in extra.by_type. There is no figure for both together. Villa, detached, semi-detached and terraced get the all-houses figure, labelled as such (extra.widened_from). AU: not split by the ABS; the figure covers all residential dwellings (houses and attached dwellings together). Any value is accepted and noted. AU (Adelaide suburbs): houses only. BE: house (all houses, not apartments), apartment, or detached / villa (houses with 4 or more facades), semi-detached or terraced (houses with 2 or 3 facades). Statbel has no figure for houses and apartments together, so without a type you get both medians in the summary and no single price. BR (Fortaleza): any, apartment or house. BR (Recife): any, apartment or house. BR (Rio de Janeiro): any, apartment or house. BR: any, apartment or house. CA: only 'any' (or leave out); BC does not split the value by house, condo or other kind. CH canton Zürich: house (single-family house) or flat (condominium). Default flat. CH: flat (freehold condominium) only; houses are not in this table. CH: flat (condominium) only; houses are not in these tables. CO: any (default), urban or rural (the registry's zone of the property). Land, flats and houses are mixed in each. CZ: flat (default) or house (family house). Leave out for flats. Prices are CZK per square metre. DE: apartment (default when left out), house (detached one- and two-family) or terraced (terraced and semi-detached). The figure is the guideline value per m2 of living area for a standard property (a valuation statistic derived from purchase prices), resales only. DK: house (one-family houses), flat (owner-occupied flats). Without a type, the group with more sales in that place is answered and the other is in extra. Detached and terraced are not published separately. ES: the tables cover free housing as a whole; only 'any' has an answer. BG HR CY CZ DE EE ES HU IS IT LV LT LU MT PL RO SI SK: ignored; the index covers all dwellings (new and existing) bought by households. FI: flat (flats in blocks of flats), terraced (terraced houses, which also include detached houses with shares in a housing company). Without a type, all building types. House and detached are not covered. FR: house or apartment. GB: detached, semi-detached, terraced or flat-maisonette. GB Scotland / Northern Ireland: any, detached, semi-detached, terraced or flat-maisonette. HK: flats only (any). HK: all homes together (any). HU: 'existing' (used dwellings, the default) or 'new' (newly built). The figure is an average price per m² of living space. IE: any, new or second-hand (new homes are usually recorded without VAT). LV: 'house' gives the VZD house statistics (price per house in EUR); leave out for apartments. LV: apartments only ('flat', the default). NL: CBS does not split this figure by home type; only 'any' (all existing owner-occupied homes) has an answer. NO: any (all dwellings, default), house or detached (detached houses), terraced (row houses), flat (multi-dwelling buildings). Official price per m² of existing dwellings. NZ: leave out or 'any'. The publisher gives one figure for all residential sales (houses, apartments and other dwellings together). PL: only flats are in the register extract we read, so leave out or use apartment (flat, any also work). house is refused. PT: INE splits by number of bedrooms, not by house or apartment; only 'any' has an answer (the answer includes the split by bedrooms). QA: any (default), villa (villas and houses) or building (whole residential buildings). SE: house (one- and two-dwelling buildings; the default for any), flat (tenant-owned flats, median price, county or metropolitan area only). Villas, terraced and semi-detached houses are not split, so detached and terraced return no figure. TW: apartment (high-rise, mid-rise and walk-up flats together), house (透天厝), high-rise (住宅大樓, 11+ floors with a lift), mid-rise (華廈, up to 10 floors with a lift) or walk-up (公寓, up to 5 floors, no lift). Default any = all homes. US (Allegheny County, PA): not available, the County table has no property type (all parcel types are mixed). US (Maricopa County, AZ): any (default), house (single-family) or condo (condominium and townhouse). US, Washington DC: any (default), house (houses and rowhouses) or condo. US (Detroit, MI): not available (houses and condos are mixed); leave out. US: any (default), house (one- to three-family houses and townhomes), condo, or coop (New York City only).",
                "enum": ["house", "apartment", "villa", "detached", "semi-detached", "terraced", "flat", "urban", "rural", "flat-maisonette", "any", "existing", "new", "second-hand", "building", "high-rise", "mid-rise", "walk-up", "condo", "coop"],
                "type": "string"
              },
              "room_count": {
                "description": "CH Basel-Landschaft only: number of rooms 1, 2, 3, 4 or 5 (5 or more). Leave out for all condominiums.",
                "type": "string"
              },
              "rooms": {
                "description": "LV only: number of rooms of the apartment, 1 to 4. Without it the size with the most deals is returned and the other sizes are listed.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "settlement": {
                "description": "HU only: type of settlement inside a region: all (default), county_seat, towns or villages. Budapest has one figure.",
                "type": "string"
              },
              "state": {
                "description": "US only: 'CT' (Connecticut), 'NY' (New York City), 'IL' (Cook County) or 'DC' (Washington, DC). Usually inferred from the place; set it when a name exists in two of them.",
                "type": "string"
              },
              "town": {
                "description": "Town or city. AT: a municipality among the 100 largest ('Wien' / 'Vienna', 'Graz', 'Linz', 'Salzburg', 'Innsbruck'), a district ('Wien 2' for Leopoldstadt, 'Bezirk Baden', 'Kitzbühel'), or a Bundesland ('Tirol', 'Niederösterreich' / 'Lower Austria'). Omit for Austria. Official annual medians per m², not a list of sales. AU: a state or territory ('Victoria', 'NSW', 'Queensland', 'Tasmania', 'ACT'), or a city or town that lies in one ('Melbourne', 'Parramatta', 'Perth'). The ABS publishes by state and territory only, so a city is answered with its state (and the answer says so). Omit for Australia as a whole. AU (Adelaide suburbs): a metropolitan Adelaide suburb such as Norwood, Glenelg, Marion or Prospect. Houses only, by suburb (no postcode figures). BE: a municipality in Dutch, French or English ('Antwerpen' / 'Antwerp' / 'Anvers', 'Gent' / 'Ghent', 'Brussel' / 'Bruxelles' / 'Brussels', 'Liège'), or a province ('province of Namur') or region ('Flanders', 'Wallonia', 'Brussels Capital Region'). Omit for Belgium. Official Statbel medians, not a list of sales. BR (Fortaleza): a Fortaleza neighbourhood (bairro) such as 'Aldeota', 'Meireles' or 'Papicu', or 'Fortaleza' for the whole city. Other Brazilian cities are not available here. BR (Recife): a Recife neighbourhood (bairro) such as 'Boa Viagem', 'Pina' or 'Casa Forte', or 'Recife' for the whole city. Other Brazilian cities are not available here. BR (Rio de Janeiro): a Rio de Janeiro neighbourhood (bairro) such as 'Copacabana', 'Ipanema', 'Tijuca' or 'Barra da Tijuca', or 'Rio de Janeiro' for the whole city. Other Brazilian cities are not available here. BR: a Porto Alegre neighbourhood (bairro) such as 'Moinhos de Vento' or 'Petropolis'; leave out for the whole city. Other Brazilian cities are not available. CA (British Columbia): a municipality, rural area or regional district, e.g. Kelowna, Victoria, Surrey, 'Prince George', 'Quesnel Rural', 'Greater Vancouver'. Omit for the whole province. Other provinces are not covered. CH canton Zürich: a municipality (Winterthur, Uster, Dübendorf, Horgen, Küsnacht ...), a market region (Seegemeinden, Agglomerationsgemeinden, Landgemeinden), or Kanton Zürich for the whole canton. Houses in the city of Zürich: Zürich. CH: Zürich for the whole city, a district ('Kreis 7', 'Kreis 11') or a statistical quarter (Altstetten, Oerlikon, Seefeld, Enge). Other Swiss towns are not covered. CH: for Basel-Landschaft give a district (Arlesheim, Laufen, Liestal, Sissach, Waldenburg) or a main municipality such as Muttenz or Pratteln (its district average is shown). For the city of Zürich give Zürich. CO: a municipality ('Medellín', 'Bogotá', 'Cali', 'Barranquilla'; accents optional). If two municipalities share a name write 'Name, Department'. Leave out for all of Colombia. CZ: ignored; CZSO publishes one national figure per year (Prague and the regions are not available here). The answer says so. DE: a town in North Rhine-Westphalia only ('Köln' / 'Cologne', 'Düsseldorf', 'Dortmund', 'Essen', 'Münster', 'Bielefeld', 'Bonn', 'Aachen'). Without a town the answer is Germany's national Eurostat house price index (an index, not a price in money). Berlin, Munich, Hamburg and the other states are not covered by the per-m2 guideline values. DK: a municipality or town ('København' or 'Copenhagen', 'Aarhus' or 'Århus', 'Odense', 'Aalborg'), a province ('Fyn', 'Østjylland', 'Nordsjælland') or a region ('Hovedstaden', 'Syddanmark'), with or without æ ø å. Statistics Denmark publishes by province, so a municipality is answered with the province it lies in (and the answer says which). Omit for Denmark as a whole. ES: a province or region ('Madrid', 'Barcelona', 'Málaga', 'Valencia', 'Baleares', 'Cataluña'...), or a municipality over 25,000 inhabitants ('Marbella', 'Getafe', 'Alcalá de Henares, Madrid'). Use town='Spain' for the national average (omitting town gives the house price index instead). Official average APPRAISED value per m², not a price paid. BG HR CY CZ DE EE ES HU IS IT LV LT LU MT PL RO SI SK: ignored; Eurostat publishes one national index per country (PL: a town is answered by the Polish price register instead). The answer is an index (2015 = 100), not a price in euros. FI: a municipality ('Helsinki' or 'Helsingfors', 'Espoo', 'Tampere', 'Oulu', 'Hämeenlinna'), a region ('Uusimaa', 'Pirkanmaa'), 'Greater Helsinki', with or without ä ö å. Omit for Finland as a whole. Larger cities, regions and the country have quarterly figures (with the official price-index changes); other municipalities have the latest yearly figure. FR: town, e.g. 'Bordeaux', or use postcode. GB: the Royal Mail POSTAL TOWN as the Land Registry files it, e.g. 'Bristol'. It can be wider than the council area: 'Bristol' also takes in Bradley Stoke and Filton (South Gloucestershire), and every London sale is filed under 'London', so a London borough such as 'Camden' is not a town. For a council area or London borough use district. Give town or district. GB Scotland / Northern Ireland: 'Scotland', 'Northern Ireland' or a council area ('Edinburgh', 'Glasgow', 'Aberdeen', 'Fife', 'Highland', 'Belfast', 'Derry', 'Lisburn and Castlereagh'). Answered with the official monthly UK House Price Index average, not a list of sales. HK: a public housing estate such as 'Shan King' or a district; leave out for all Tenants Purchase Scheme estates. Discounted public-flat sales, not private market prices. HK: leave out for the all-Hong Kong estimate from Land Registry price bands. A public housing estate or district such as 'Shan King' gives discounted Tenants Purchase Scheme sales instead (not market prices). HU: 'Budapest', a statistical region ('Pest', 'Central Transdanubia', 'Western Transdanubia', 'Southern Transdanubia', 'Northern Hungary', 'Northern Great Plain', 'Southern Great Plain') or a county or big city that names one ('Debrecen', 'Győr', 'Pécs', 'Szeged'), or 'Hungary'. A town is answered at the level of its region. Without a town the Eurostat price index answers instead. IE: a county ('Cork') or Dublin postal district ('Dublin 6'; district=Dublin 6 and postcode_district=D06 also work). Omit for all of Ireland. LV houses (property_type=house): a town (Riga, Jurmala, Adazi, Saulkrasti ...), a rural parish such as 'Carnikavas pagasts', or a municipality such as 'Adazu novads' (answers for its towns). LV: a town (Riga, Jurmala, Liepaja, Daugavpils, Valmiera ...), a rural parish such as 'Bebru pagasts', or a municipality such as 'Valmieras novads' (answers for its towns). Without a town the Eurostat price index answers instead. NL: a municipality ('Amsterdam', 'Den Haag' / 'The Hague' / 's-Gravenhage, 'Utrecht') or a province ('Noord-Holland'). Omit for the national average. Official CBS annual average, not a list of sales. NO: a municipality ('Oslo', 'Bergen', 'Tromsø' or 'Tromso', 'Stavanger') or a county ('Rogaland', 'Vestland'), Norwegian or Sami spelling, with or without æ ø å. Omit for the whole country. Answers are Statistics Norway's published average price per m² (NOK) with the number of sales, not a list of sales. NZ: a city or territorial authority ('Wellington', 'Christchurch', 'Hamilton', 'Queenstown-Lakes', 'Far North'), an Auckland local board ('Howick', 'Albert-Eden'), a region ('Canterbury', 'Otago', 'Wellington region'), or leave out for New Zealand. A name that is both a city and a region (Wellington, Auckland) gives the city; add 'region' for the region. Macrons are optional ('Taupo'). PL: a city, required (Warsaw, Krakow, Lodz, Wroclaw, Poznan, Gdansk, Gdynia, Szczecin, Lublin, Katowice, Bydgoszcz, Bialystok, Rzeszow, Torun, Kielce, Olsztyn, Opole, Radom, Czestochowa); Polish or English spelling. Flats only. A city county is read as a whole; districts are not available. PT: a municipality INE publishes ('Lisboa' / 'Lisbon', 'Porto' / 'Oporto', 'Cascais', 'Faro', 'Funchal' ... 58 in all) or a region ('Algarve', 'Grande Lisboa', 'Madeira', 'Açores'). Omit for Portugal as a whole. Official INE median per m² of the last 12 months of sales, not a list of sales. QA: a municipality (Doha, Al Rayyan, Al Wakra, Al Khor and Al Thakhira, Umm Slal, Al Daayen, Al Shamal, Al Shahniya) or a district name; leave out for all of Qatar. SE: a municipality ('Stockholm', 'Göteborg' or 'Gothenburg', 'Malmö' or 'Malmo', 'Uppsala'), a county ('Skåne', 'Stockholms län') or a metropolitan area ('Greater Gothenburg'), with or without å ä ö. Omit for Sweden as a whole. Answers are Statistics Sweden's published average purchase price (SEK per home) with the number of sales, not a list of sales. SG: required, one of the 26 HDB towns, e.g. 'Tampines', 'Ang Mo Kio', 'Bukit Merah', 'Kallang/Whampoa', 'Central Area' (case, hyphens and ', Singapore' are forgiven; 'Kallang' and 'CBD' are understood). TW: a city or county in English or Chinese ('Taipei' / '台北市' / '臺北市', 'New Taipei', 'Taichung', 'Kaohsiung', 'Tainan', 'Taoyuan', 'Hsinchu City', 'Hsinchu County'), or a district with its city (\"Da'an, Taipei\", '臺北市大安區', 'Banqiao, New Taipei'). Omit for all of Taiwan. A district name used in several cities ('Zhongzheng', 'Dongqu') needs the city too. US (Allegheny County, PA): a municipality such as 'Pittsburgh', 'Penn Hills', 'Mt Lebanon', 'Ross' or 'Bethel Park' (add ', PA' if the name exists elsewhere); leave out for the whole county. US (Maricopa County, AZ): a city such as 'Phoenix', 'Scottsdale', 'Mesa', 'Tempe', 'Chandler' or 'Gilbert' (add ', AZ' if the name exists elsewhere); leave out for the whole county. US: for the national median price of NEW houses sold (Census Bureau) leave town out and set property_type to new (or write town 'United States'); a place name is answered by the town sources. US: for Washington DC write 'Washington, DC' (a bare 'Washington' means the town in Connecticut). US (Detroit, MI): write 'Detroit, MI'. Whole city; neighbourhoods are not available. US: a Connecticut town ('Hartford'), a New York City borough or neighborhood ('Brooklyn', 'Williamsburg'), 'Chicago', 'Cook County' or a Cook County assessment township ('Evanston', 'Oak Park'). Add the state if a name exists in two places ('Hartford, CT'). Required unless postcode is a New York City ZIP.",
                "minLength": 2,
                "type": "string"
              }
