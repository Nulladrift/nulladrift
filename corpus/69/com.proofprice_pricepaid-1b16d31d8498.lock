        {
          "name": "pricepaid_border_prices",
          "title": "Border prices: customs unit values per kilogram",
          "description": "Use this when a user asks what traded goods are worth at the border, per kilogram, as declared to customs: for example what a country pays per kg to import wheat, diesel, cheese or timber, or earns per kg exporting whisky or steel, in the EU member states listed (country FR), the EU member states listed (country DE), the EU member states listed (country ES), the EU member states listed (country IT), the EU member states listed (country NL), the EU member states listed (country BE), the EU member states listed (country IE), the EU member states listed (country PL), the EU member states listed (country PT), the EU member states listed (country DK), the EU member states listed (country SE) or the United Kingdom (country GB), optionally from or to one partner country. Returns the customs value divided by the net weight (a value-weighted average per kg in the reporting country's currency), a range between the 10th and 90th percentile of the individual customs lines weighted by weight, the months it covers, the biggest partner countries and the official source and licence. This is a customs unit value (price_type official_statistic) built from declared trade values and weights, not a shelf price, not a wholesale quote and not a receipt, so there is no sample size. How fresh: the EU member states listed: monthly: Eurostat publishes each month's trade statistics about 2.5 months after the month ends; our figures are read live and each answer states its months; the United Kingdom: monthly: HMRC publishes each month's trade statistics about six weeks after the month ends; our figures are read live and each answer states its months. Do not use for what a shopper pays in a shop, for a single contract or shipment, for futures or spot quotes, for services, or for countries that are not listed.",
