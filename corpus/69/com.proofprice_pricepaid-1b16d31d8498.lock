        {
          "name": "pricepaid_home_upgrade_prices",
          "title": "Home upgrade costs (heat pumps, solar, insulation, windows)",
          "description": "Use this when a user asks what a home upgrade costs in France (historical survey) (country FR), England and Wales (heat pumps) (country GB), Great Britain (country GB) or Ireland (country IE): a heat pump, solar panels (solar PV), loft/attic or wall insulation, or new windows. Returns an official statistic: the cost that installers or owners declared when a grant or tax claim was made (a median or average the publisher states for a period), with the period, the publisher's own wording of what the figure includes, the official source and licence. These are declared installed costs at grant or claim, not receipts, not quotes and not what one home paid; price_type is official_statistic, so the range fields can be null and the sample size is given only where the publisher states it. Each source covers only some measures: where a measure is not published the answer says so (status no_matches) instead of guessing. How fresh: France (historical survey): historical: one survey, works mostly 2011-2018, data unchanged since 2020 (not updated); England and Wales (heat pumps): monthly (the cost tables are updated each quarter, in January, April, July and October; the latest quarter ends about three months earlier); Great Britain: yearly (published each May for the financial year just ended; April to March); Ireland: irregular; the local-authority table currently ends with 2018/19. Some countries publish only a general renovation figure that is not split by type of work (the country notes say so). Do not use for a quote on a particular home, for installer prices or offers, for running costs or savings, or for other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Place, only where the publisher splits by place (the country notes say how). Leave out for the national figure. FR: a département (Gironde, Rhône, Côtes-d'Armor...) or a region code (BRE, ARA, NAQ...); leave out for all of France. A place with fewer than 5 jobs gives insufficient_data. GB: national figures only; an area is ignored and the answer says so. IE: a county (Kerry, Cork, Dublin, Galway...) or a local authority (Fingal, DLR, Cork City...); leave out for all of Ireland.",
                "type": "string"
              },
              "country": {
                "description": "FR = France (ADEME survey of invoiced renovation jobs, mostly 2011-2018: HISTORICAL, not current prices; excl. VAT); GB = England and Wales for heat pumps (Boiler Upgrade Scheme statistics) and Great Britain for solar panels; GB = Great Britain (solar PV: DESNZ declared installed cost per kW from MCS certificates; heat pumps: Boiler Upgrade Scheme statistics; England and Wales for heat pumps, Great Britain for solar); IE = Ireland (Revenue Home Renovation Incentive: declared value of renovation works by county; not split by type of work; SEAI figures are not included yet)",
                "enum": ["FR", "GB", "IE"],
                "type": "string"
              },
              "dwelling_type": {
                "description": "Type of dwelling or job, only where the publisher splits by it (the country notes say which values). Leave out for the publisher's main figure. FR attic_insulation: loft (default), rafters, sarking or all. FR wall_insulation: external, internal or all (default). Other measures: ignored. GB solar_pv: leave out for all small installations (median); or domestic, non-domestic, retrofit (domestic, existing home) or new build (domestic): these are means. GB heat_pump: not published, ignored. IE: not published, ignored.",
                "type": "string"
              },
