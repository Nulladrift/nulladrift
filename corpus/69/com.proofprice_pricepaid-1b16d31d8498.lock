          "name": "pricepaid_hotel_prices",
          "title": "Hotel room prices",
          "description": "Use this when a user asks what a hotel room costs per night, on average, in a country, region, province or city in Ontario, Canada (country CA), Spain (country ES), Finland (country FI), Hong Kong (country HK), Ireland (country IE), Norway (country NO) or Singapore (country SG), or how hotel prices changed on a year earlier. Returns the official average daily rate: the average price actually charged per occupied hotel room per night, published monthly by the national statistics office from its hotel survey, with the month, the change on the same month a year earlier where published, the official source and licence. This is a published average over all hotels in the area, not a range of individual bookings and not a quote for a date, so the range fields are null and there is no sample size. How fresh: Ontario, Canada, Finland and Norway: monthly, published about five weeks after the month ends; every answer states its month; Spain: monthly, published about six weeks after the month ends; every answer states its month. Monthly history back to 2008; Hong Kong: monthly, 2 to 3 months behind. A rolling five years; Ireland: annual, published about a year after the survey year; every answer states its year; Singapore: annual, published about 8 months after the year ends (2025 appeared in September 2026). Do not use for the price of one named hotel, a booking for particular dates, holiday rentals or hostels, or for countries that are not listed.",
