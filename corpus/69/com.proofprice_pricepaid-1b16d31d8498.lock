                "description": "How many recent months of awards to include. Default 24. AR: not used; each figure covers awards dated in the newest 12 months. AU: not used; the newest 21 days of notices are read. BR: 1 to 60 months of purchases, by purchase date (default 24). BR: not used; each figure covers the contracts published in the last 7 days. Alberta: not used; each figure covers contracts starting in the newest 24 months. Toronto: not used; each figure covers awards dated in the newest 24 months. CA federal: not used; the figure covers the newest 24 months of contract dates in the file. CA: not used; each figure covers the newest 24 months of awards. Quebec: not used; each figure covers awards dated in the newest 12 months. CO: not used; each figure covers the newest 12 months of signed contracts. CZ: not used; each figure covers contracts published in the newest weeks (the answer gives the dates). DE: not used; each figure covers contracts concluded in the newest 6 months. ES: not used; each figure covers awards dated in the newest one to two days. EU and EEA: up to 60; only the newest 1,000 matching notices are read, so a very common purchase covers a shorter period than asked (the answer says so). FR: not used; each figure covers contracts notified in the newest 12 months. GB: not used; each figure covers the notices published in the newest two weeks (the answer gives the dates). IE: not used; each figure covers the newest 24 months of awards. NG: not used; each figure covers the 24 months up to the newest month with at least 20 signed contracts (late 2024). NZ: not used; the newest 24 months of awards are always shown. PL: not used; each figure covers the notices published in the newest weeks (the answer gives the dates). PT: not used; each figure covers contracts signed in the newest 12 months. SG: 1 to 60 months by award date; the dataset covers FY2021 onwards and is updated about yearly. TH: not used; each figure covers the newest 24 months of contracts. UA: not used; each figure covers contracts signed in the newest 90 days, from a daily sample of the newest contracts. Chicago: not used; each figure covers awards approved in the newest 24 months. US: 1 to 60 months of new awards, read in up to 12 slices. ZA: not used; each figure covers the newest 24 months of signed contracts.",
