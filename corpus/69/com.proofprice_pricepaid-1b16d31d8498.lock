                "description": "What was bought, in plain words: 'laptops', 'school meals', 'road resurfacing', 'office cleaning', 'electricity', 'ambulances', 'waste collection'. Common purchases are matched to official product codes; anything else is searched as free text in the award notices. AR: 'all' or a COMPR.AR product group (rubro), in Spanish or English for the common ones ('informatica' or 'computers', 'alimentos' or 'food', 'limpieza' or 'cleaning'). An unknown word lists the groups. AU: a word or phrase searched in the contract title and description (common purchases such as 'laptops' or 'catering' also use their UNSPSC code). Federal agencies only. BR: office or school furniture in plain words ('filing cabinet', 'office chair', 'desk', 'school desk', 'whiteboard', 'safe', 'armchair'; Portuguese words such as 'cadeira' also work). Other goods are not covered. The figure is a UNIT price. BR: a common purchase in plain words, English or Portuguese ('school meals', 'merenda escolar', 'security guard services', 'cleaning services', 'laptops', 'ambulances', 'printers', 'diesel'). Recognised from Portuguese words in the contract description; other wording is not searched. Alberta: optional (left out = all); what=all for every sole-source service contract, or a common service in plain words ('consultancy', 'legal services', 'IT services', 'software', 'translation services'). Toronto: 'all', or one of 'construction services', 'goods and services', 'professional services' (the City's own three categories), or a common purchase such as 'laptops' (usually too few awards for a figure). CA with buyer_area=federal: the government's own kind of purchase ('translation services', 'management consulting', 'security services'), or all, goods, services, construction. Words are matched against the description of the spending; a kind with fewer than 5 contracts has no figure. CA: a common purchase in plain words ('translation services', 'legal services', 'catering', 'consultancy', 'IT services', 'laptops', 'security guards'). Recognised from the words in the notice title; other wording is not searched. Quebec: a common purchase in plain words, in French or English ('laptops', 'ordinateurs portables', 'catering', 'road resurfacing', 'building cleaning'). CO: a common purchase in plain words ('catering', 'security guard services', 'office cleaning', 'laptops', 'ambulances', 'printers', 'photocopiers'). Recognised from the Spanish words in the contract description; other wording is not searched. CZ: a common purchase in plain words ('laptops', 'waste collection', 'office cleaning', 'electricity', 'legal services', 'security guards'). Recognised from Czech words in the contract subject, so a match is approximate. DE: a common purchase in plain words, in German or English ('laptops', 'schulessen', 'road resurfacing', 'office cleaning', 'ambulances'). Recognised from the lot's CPV product code. ES: optional (left out or 'all' = every award in the window); a common purchase in plain words, in Spanish or English ('portatiles', 'laptops', 'road resurfacing', 'limpieza de oficinas', 'ambulances'). Recognised from the award's CPV product code. Only the newest one to two days of awards are summarised, so use a broad CPV division (45 = construction) for a figure. EU and EEA: common purchases are matched to CPV product codes (laptops, desktop computers, school meals, road resurfacing, office cleaning, electricity, natural gas, ambulances, waste collection and about 30 more, in English and the main EU languages); anything else is a free-text search of the award notices, best in the buyer country's language. FR: a common purchase in plain words, in French or English ('ordinateurs portables', 'laptops', 'restauration scolaire', 'road resurfacing', 'office cleaning', 'ambulances'). Recognised from the contract's CPV product code. GB: a common purchase in plain words ('software', 'IT services', 'consultancy', 'legal services', 'insurance'; very thin purchases such as laptops may have fewer than 5 awards in two weeks and return no figure). Recognised from the notice's main CPV product code. IE: optional (left out or 'all' = every award in the window); a common purchase in plain words ('catering', 'school meals', 'software', 'consultancy', 'legal services', 'cars'; a purchase with fewer than 5 Irish awards in the window has no figure). Recognised from the award's main CPV product code. NG: 'all' or a purchase theme matched from the contract title: vehicles, fuel, ict, medical, roads, buildings, rehabilitation, water, power, furniture, security, schools, agriculture, consultancy (common words such as 'vehicles', 'roads', 'laptops' or 'diesel' work). An unknown word lists the themes. NZ: optional (left out = all awards); a common purchase in plain words ('buses', 'laptops', 'cleaning', 'road resurfacing'; a purchase with fewer than 5 awards in 24 months gets no figure) or 'all'; read from the price library, not searched live. PL: a common purchase in plain words ('laptops', 'road resurfacing', 'office cleaning', 'school meals', 'ambulances'). Recognised from the notice's CPV product code. PT: a common purchase in plain words, in Portuguese or English ('computadores portateis', 'laptops', 'road resurfacing', 'office cleaning', 'ambulances'). Recognised from the contract's CPV product code. SG: a word or phrase searched in the tender description ('cleaning', 'laptops', 'security services'); common purchases use a tuned keyword. TH: a common purchase in plain words ('school meals', 'building cleaning', 'school cleaning', 'security guard services', 'laptops'). Recognised from Thai words in the contract title; other purchases are not searched. UA: a common purchase in plain words ('electricity', 'pharmaceuticals', 'legal services', 'IT services', 'insurance' (common purchases with too few contracts in the daily sample return no_matches)). Recognised from the contract's product code (DK 021, based on the CPV). Chicago: what=all for every city award, or a common purchase in plain words ('consultancy', 'legal services', 'IT services', 'software', 'office cleaning'). US hourly labour rates: say the job and 'hourly rate', e.g. 'software engineer hourly rate'. The figure is a federal contract CEILING rate per hour, not a price paid. US: a phrase searched in the federal award descriptions (common purchases such as 'laptops' use a tuned keyword; 'road resurfacing' uses the road-repair product code Z2LB). Several words must appear together, so shorter is better. ZA: a common purchase in plain words ('security guard services', 'building cleaning', 'catering', 'laptops', 'office furniture', 'photocopiers'). Recognised from the words in the contract description; other wording is not searched.",
                "minLength": 2,
                "type": "string"
              }
            },
