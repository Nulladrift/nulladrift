              "profile": {
                "description": "Reference person, see the country notes, e.g. 'age 60', 'single', 'couple', 'couple 2 children', 'lowest income'. Default: single (the survey's reference insured). France: age 20 / 40 / 60 / 65 / 75 / 85 (individual contracts), single (default), couple, couple 1 child, couple 2 children, couple 3 children, any age (group contracts), lowest income, highest income, cheapest area, dearest area.",
                "minLength": 2,
                "type": "string"
              },
              "year": {
                "description": "Survey year (the survey is run every two years). Default: the newest. France: survey year 2019, 2021 or 2023 (default: newest).",
