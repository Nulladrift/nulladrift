 cattle indicative price) show the usual one and list the others in extra.other_series. Fruit and vegetables are only quoted in season. FI: pig, beef, young bull, heifer, cow, calf, lamb, chicken, eggs, barn eggs, free range eggs, organic eggs, cage eggs, milk (Luke's own monthly producer prices, EUR per 100 kg; milk per litre). Other products are answered from the European Commission portal. FR: rapeseed, sunflower, soybean, peas, faba beans, flax, lupin, lentils, sorghum, spelt, rice, buckwheat (FranceAgriMer's quarterly national average paid to producers, euro per tonne, cumulative since the start of the July-June campaign). Wheat, durum, barley, maize, rye, oats and triticale for France are answered from the European Commission portal. PL: wheat, rye, barley, triticale, oats, maize, potatoes, cattle, pigs, poultry, milk (GUS's own monthly procurement prices in zloty excluding VAT: cereals and potatoes per dt = 100 kg, animals per kg live weight, milk per hl). Other products (fruit, vegetables, eggs, dairy products ...) are answered from the European Commission portal.",
