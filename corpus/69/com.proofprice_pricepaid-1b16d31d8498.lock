      "instructions": "Tools that return real prices actually paid, from official records, as a range with sample size, period, confidence and source. Cite the source and attribution line when you use a figure.",
      "tools": [
        {
          "name": "pricepaid_airfare_prices",
          "title": "Airfares paid",
          "description": "Use this when a user asks what people actually pay for a flight between two cities or airports (for example JFK to LAX, or Chicago to Miami), or what the average airfare out of a city is, in Australia (domestic routes) (country AU) or the United States (domestic flights within the contiguous 48 states) (country US). Returns the official average fare per passenger each way, in the currency the answer states, for the latest quarter published, with (where the source publishes them) the passengers per day behind it, the share of the largest carrier, the change on a year earlier and the last few quarters, plus the official source and licence. This is a published quarterly average of fares paid (price_type official_statistic), not a range built from tickets, so the range fields are null and there is no sample size; how fresh: Australia (domestic routes): monthly; the newest month is usually the one just ended; the United States (domestic flights within the contiguous 48 states): quarterly, published about five to six months after the quarter ends (the first quarter of 2026 was published in September 2026); every answer states its quarter. Do not use for today's fare, a specific date, airline or cabin, a booking or price alert, international flights, routes outside the places named above, hotels, or other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "AU = Australia (domestic routes between about 70 city pairs; cheapest advertised return fare, not a fare paid); US = United States, contiguous 48 states (domestic flights only; Alaska, Hawaii and territories are not covered)",
                "enum": ["AU", "US"],
                "type": "string"
              },
              "from": {
                "description": "Where the flight starts: an airport code (JFK, LAX) or a city (Chicago, 'Portland, OR'). Required. AU: city or airport code (Sydney, SYD, 'Gold Coast', OOL). Required, and AU also needs 'to'. US: airport code (JFK, ORD) or city…",
                "minLength": 2,
                "type": "string"
              },
              "quarters": {
                "description": "How many recent quarters to include in the trend (default 4, at most 20). The headline figure is always the latest quarter. AU: the range covers this many quarters of monthly fares (default 4 = 12 months; at least 2 are needed for a…",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Where it ends: an airport code or a city. Leave out to get the average fare over the busiest routes out of the 'from' city. AU: city or airport code. Required for AU (the answer is for one route, either direction). US: airport code or…",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "from"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "description": "Price range from real records: price, sample_size, period, confidence, source and licence.",
            "properties": {
              "confidence": {
                "description": "high, medium, low or insufficient.",
                "type": "string"
              },
              "period": {
                "additionalProperties": {},
                "properties": {
                  "from": {
                    "type": ["string", "null"]
                  },
                  "to": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              },
              "price": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {
                      "currency": {
                        "type": "string"
                      },
                      "typical_high": {
                        "type": ["number", "null"]
                      },
                      "typical_low": {
                        "type": ["number", "null"]
                      },
                      "unit": {
                        "type": "string"
                      },
                      "value": {
                        "type": "number"
                      }
                    },
                    "required": ["currency", "unit", "value"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "sample_size": {
                "type": ["number", "null"]
              },
              "source": {
                "additionalProperties": {},
                "properties": {
                  "attribution": {
                    "type": "string"
                  },
                  "licence": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["attribution", "licence", "name"],
                "type": "object"
              },
              "status": {
                "enum": ["ok", "insufficient_data", "no_matches"],
                "type": "string"
              },
              "summary": {
                "description": "One sentence an AI can quote.",
                "type": "string"
              }
            },
            "required": ["status", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Airfares paid"
          },
          "behavior": {
