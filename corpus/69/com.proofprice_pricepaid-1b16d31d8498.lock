              "item": {
                "description": "Everyday item in plain words, e.g. 'milk', 'white bread', 'eggs', 'butter', 'coffee', 'bananas', 'beer'. Each country measures its own standard pack or cut; the answer names it and lists other definitions. AE: one of the Ministry's 18 essential goods in English ('eggs', 'milk', 'rice', 'sugar', 'flour', 'chicken', 'bread', 'yogurt', 'chickpeas', 'lentils', 'canola oil', 'sunflower oil'). The answer is the median and range of the posted shelf prices across about 13 outlets, per kg, per litre or per piece (egg), and names the commodity and related ones. No region option. AR: a packaged everyday product in English or Spanish ('milk', 'sugar', 'rice', 'yerba mate', 'cooking oil', 'pasta', 'flour', 'butter', 'coffee', 'leche', 'azucar', 'arroz', 'aceite', 'fideos'). Chains name products in Spanish with the pack size, so the answer names the exact product and pack and lists related ones. About 100 products priced in the most shops are held; loose fruit, vegetables and meat are not. AT: STATISTIK AUSTRIA's standard items, e.g. milk, eggs, butter, bread, rice, flour, pasta, potatoes, apples, bananas, tomatoes, chicken breast, minced meat, gouda, coffee, olive oil; German names (Milch, Eier, Butter, Semmel) are not needed, use English words. BG: NSI's main foods, e.g. milk (litre), bread (white, kg), eggs (per egg), butter, white cheese, yellow cheese, chicken (poultry meat), pork, potatoes, apples, bananas, tomatoes, sugar, flour, rice, coffee, beer (litre), wine (litre), sunflower oil. Canada: Statistics Canada's 110 standard products, each in one standard size, e.g. milk, 1 litre milk, 4 litre milk, soy milk, nut milk, cream, butter, margarine, cheese, yogurt, eggs, ground beef, steak, sirloin. Milk is published per 1, 2 and 4 litres (2 litres by default); the answer names the exact product and lists the other sizes. CH: fruit, vegetables and potatoes only, e.g. tomatoes, apples, bananas, carrots, potatoes, cucumbers, lemons, strawberries, lettuce, mushrooms. Add 'organic' for the organic product. Milk, bread, meat and other groceries are not covered. CL: an everyday food in English or Spanish ('milk', 'eggs', 'bread', 'marraqueta', 'tomato', 'potato', 'chicken', 'leche', 'huevo', 'palta'). ODEPA names products in Spanish with a unit, so the answer names the exact product and unit and lists related ones. The 150 products found at the most monitored points are held. CZ: CZSO's defined products, e.g. milk (litre), bread (kg), eggs (per 10), butter (kg), cheese (Edam, kg), chicken (kg), pork (kg), beef (kg), potatoes, apples, bananas, tomatoes, sugar, flour, rice, coffee, beer (0.5 l bottle), wine, vodka, sunflower/vegetable oil. FR: INSEE's standard fresh items, e.g. apples, potatoes, carrots, beef (T-bone steak), monkfish, sole, shrimps; yearly figures for beef fillet and rump, pork roast, rabbit, oysters (dozen), lemons, oranges, green beans. French words work too (pommes, crevettes, huîtres). GB: ONS's product types, each in one pack size, e.g. eggs (free-range, pack of 12), milk (whole, 4 pints), semi-skimmed milk (2 pints), bread (sliced white, 800 g), butter (250 g), cheese (cheddar, per kg), chicken (whole, per kg), beef mince (per kg), bananas, apples, potatoes (per kg), rice, pasta, instant coffee, tea bags, sugar, lager, wine. HK: a grocery category in English ('milk', 'eggs', 'rice', 'bread', 'honey', 'peanut butter', 'instant noodles', 'cooking oil', 'beer'). The answer is the median and range of shelf prices of the products in that category (brands and pack sizes differ), per kg or per litre where the pack size is known, otherwise per pack; it names the category and lists related ones. HU: KSH's standard products, e.g. milk (1 l), bread (white, 1 kg), eggs (10), butter, cheese (1 kg), chicken (1 kg), pork, potatoes, apples, bananas, tomatoes, sugar, flour, rice, coffee, beer (1 l), wine (1 l), vodka. ID: a staple food in English or Indonesian: rice (beras), chicken (ayam), beef (sapi), eggs (telur), shallots, garlic, red chilli (cabai), bird's-eye chilli (cabai rawit), cooking oil (minyak goreng), sugar (gula). Varieties such as medium rice, curly chilli or premium sugar are listed in the answer. Prices are rupiah per kg. IE: the CSO's standard items, e.g. milk (full-fat, 2 litres), white bread (800 g sliced pan), eggs (large, half dozen), butter (per lb), cheese (Irish cheddar), chicken (whole bird), bananas, potatoes, sugar, tea bags, beer (can of lager), wine (75 cl), whiskey, pint of stout or lager (bar). The CSO has no coffee, mince or cereal. IL: one of a fixed basket in English ('milk', 'eggs', 'bread', 'wholemeal bread', 'rice', 'flour', 'canola oil', 'sunflower oil', 'tomatoes', 'cucumbers', 'potatoes', 'bananas', 'chicken breast', 'cottage cheese', 'butter'). The answer is the median and range of Shufersal's posted shelf prices across its stores, per kg, per litre or per egg, and names the product group. One chain only. No region option. LV: the CSB's standard items, e.g. milk (1 l), bread (wheat, 1 kg; also rye bread), eggs (10), butter (1 kg), cheese (1 kg), chicken (1 kg), potatoes, apples, bananas, sugar, coffee, tea bags, beer (1 l), wine (1 l), vodka. MX: an everyday product in English or Spanish ('milk', 'eggs', 'tortilla', 'rice', 'beans', 'sugar', 'cooking oil', 'leche', 'huevo', 'frijol'). Profeco names products in Spanish with a pack size, so the answer names the exact product and pack and lists related ones. The 120 products priced in the most shops are held. MY: an everyday item in English or Malay ('chicken', 'eggs', 'rice', 'cooking oil', 'sugar', 'milk', 'onion', 'cabbage', 'ayam', 'telur'). DOSM names items in Malay with the pack size, so the answer names the exact item and lists related ones. Staples (chicken, eggs, rice, oil, flour, fish, fruit, vegetables, milk) and about 40 other well-covered items are held. NZ: Stats NZ's standard items, e.g. milk (2 l), eggs (dozen), butter (500 g), white bread (600 g), cheese (1 kg), 