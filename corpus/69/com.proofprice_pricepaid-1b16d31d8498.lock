        {
          "name": "pricepaid_farm_gate_prices",
          "title": "Farm-gate prices received by farmers (monthly)",
          "description": "Use this when a user asks what farmers received, per month, for a crop or animal product (wheat, barley, oats, canola, soybeans, corn, potatoes, cattle, hogs, lambs, chickens, turkeys, milk, eggs) in a region of Brazil, Canada, the United Kingdom or Japan, or how that price compares with the month before or a year earlier. Returns the newest monthly price the statistics office publishes for the product and region, in the unit the office uses (per tonne, per hundredweight, per dozen, per kilolitre), the month it applies to, the change on the previous month and a year earlier, the last 12 months, the same product in other regions, and the official source and licence. This is a published monthly average price received by farmers (price_type official_statistic), not a range built from sales, so the range fields are null and there is no sample size. How fresh: Brazil: quarterly; the newest quarter on 7 Nov 2026 was Q2 2026 (published about four months after the quarter ends); Canada: monthly, not live: Statistics Canada publishes each month's averages about six weeks after the month ends (August 2026 was released on 9 October 2026), and every answer states its reference month; Canada: annual, not live: DFO publishes the year just ended about ten months later (the file read on 4 November 2026 runs to 2024), and every answer states its year; the United Kingdom: monthly, not live: Defra publishes each month's figure about four weeks after the month ends (September 2026 was published on 29 October 2026), and every answer states its reference month; the United Kingdom: monthly, not live: the MMO publishes each month's figures about the 30th of the following month (September 2026 was published on 30 October 2026); the latest month is provisional and every answer states its month; Japan: monthly, not live: MAFF publishes each month's preliminary (速報) figures in the following weeks; every answer states its month. Early in a crop year (September, October) only part of the varieties have a price yet.. Always read the month in the answer. Do not use for supermarket or shop prices, for wholesale market quotes, for the price of a particular farm, field or animal, for farmland, for fuel or energy, for futures prices, or for EU member states.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "BR = Brazil (IBGE Quarterly Milk Survey: average price dairies paid milk producers per litre, Brazil and the 27 states, quarterly official statistic, not a live price); CA = Canada (Statistics Canada: monthly average prices received by farmers, by province, official statistic, not a live price); CA = Canada (Fisheries and Oceans Canada: annual average landed value of sea fish and shellfish, official statistic, not a live price); GB = United Kingdom (Defra: monthly average price farmers received for milk, official statistic, not a shop price); GB = United Kingdom (MMO: monthly landed price paid to fishers for sea fish and shellfish, official statistic, not a shop price); JP = Japan (MAFF: monthly negotiated trade prices of rice between collecting organisations and wholesalers, by prefecture and variety, official statistic, not a live price)",
                "enum": ["BR", "CA", "GB", "JP"],
                "type": "string"
              },
              "product": {
                "description": "The crop or animal product, e.g. 'wheat', 'barley', 'oats', 'canola', 'soybeans', 'corn', 'potatoes', 'cattle', 'hogs', 'lambs', 'chickens', 'milk', 'eggs'. The full list is in the tool notes. Brazil: only raw milk ('milk' or 'leite'). IBGE's price is reais per litre paid by dairies to producers, per quarter. Canada: a crop or animal product in everyday words, e.g. wheat, milling wheat, feed wheat, durum, oats, barley, feed barley, malt barley, soybeans, corn, flaxseed, canola, rye, lentils, dry peas, canary seed, potatoes, seed potatoes, table potatoes, processing potatoes, cattle, cows, steers, heifers, calves, lambs, feeder cattle, feeder steers, feeder heifers, feeder calves. Prices are in Canadian dollars in Statistics Canada's own unit for each series (per metric tonne for grains and oilseeds, per hundredweight for cattle, hogs and potatoes, per kilolitre for milk, per dozen for eggs); the answer names the unit. Canada, sea fish and shellfish (annual landed value per kg paid to fishers, from Fisheries and Oceans Canada): lobster, snow crab, other crabs, shrimp, scallop, clams, sea urchin, sea cucumber, other shellfish, salmon, herring, mackerel, capelin, alewife, eel, elvers, tuna, swordfish, shark, silversides, other pelagics, cod, haddock, halibut. Crops and livestock (wheat, milk, hogs ...) are answered by Statistics Canada. United Kingdom: only 'milk' (the monthly price UK dairy farmers received, in pence per litre; the answer gives pounds per litre and the pence figure). United Kingdom, sea fish and shellfish (monthly landed price per kg paid to fishers, from the Marine Management Organisation): cod, haddock, plaice, sole, lemon sole, hake, whiting, saithe, pollack, ling, monkfish, megrim, turbot, brill, halibut, bass, bream, mullet, gurnard, dogfish, skate, witch, sand eels, other demersal, or the groups demersal, pelagic, shellfish and all fish. Milk is answered by Defra. Japan: 'rice' for the all-brand average, or a variety such as 'koshihikari', 'akitakomachi', 'hitomebore', 'hinohikari', 'nanatsuboshi', 'yumepirika', 'tsuyahime', 'sasanishiki', 'haenuki' (or its Japanese name, e.g. コシヒカリ). Only rice is covered. Prices are yen per 60 kg of brown rice, tax included.",
                "type": "string"
              },
              "region": {
                "description": "Region inside the country, as the statistics office publishes it (for example a province or state). Some countries publish no national figure, so the answer then asks for a region. Brazil: optional; leave out for the national figure, or give a state by name or two-letter code (for example São Paulo or SP, Minas Gerais, Paraná, Rio Grande do Sul, Goiás). States: Rondônia, Acre, Amazonas, Roraima, Pará, Amapá, Tocantins, Maranhão, Piauí, Ceará, Rio Grande do Norte, Paraíba, Pernambuco, Alagoas, Sergipe, Bahia, Minas Gerais, Espírito Santo, Rio de Janeiro, São Paulo, Paraná, Santa Catarina, Rio Grande do Sul, Mato Grosso do Sul, Mato Grosso, Goiás, Distrito Federal. IBGE withholds a state's figure in a quarter when too few dairies report it. Canada: a province is required (Ontario, Quebec, Saskatchewan, Alberta, Manitoba, British Columbia, Nova Scotia, New Brunswick, Prince Edward Island, Newfoundland and Labrador). Statistics Canada publishes no Canada total in this table. A city such as Saskatoon is answered with its province. Not every product is published for every province. Canada sea fish: optional. Leave out for Canada as a whole, or give Atlantic, British Columbia, Nova Scotia, New Brunswick, Prince Edward Island, Newfoundland and Labrador or Quebec. (Crops and livestock need a province.) United Kingdom: not needed. Defra publishes one figure for the whole UK, so a nation such as 'Scotland' is answered with the UK average and a note. United Kingdom sea fish: not needed. The MMO publishes one figure for all UK vessels and ports, so a region is answered with the UK figure and a note. Japan: optional prefecture (Niigata, Akita, Hokkaido, Kumamoto ... or 新潟). Without it the answer is the national figure. Prefectures with no price yet for the month are not shown.",
                "type": "string"
              }
            },
            "required": ["country", "product"],
            "type": "object"
          },
