          "name": "pricepaid_farm_prices",
          "title": "Farm and wholesale food prices",
          "description": "Use this when a user asks what farmers or wholesalers get for a food commodity (wheat, barley, maize, beef, pigs, lamb, chicken, eggs, milk, butter and other dairy products, olive oil, fruit and vegetables) in Austria, EU member states, Finland, France or Poland, how that price compares with last week, last month or a year ago, or how high it is against the last 12 months. Returns the latest official price for the country and product, per tonne or per 100 kg and per kg, for the week (milk: month) it applies to, the stage of the supply chain it is quoted at (farm gate, ex-silo, carcass, ex-packaging station), the change from the previous period and from a year earlier, the last 12 months, the other series the portal holds, and the official source and licence. This is a published price (price_type official_statistic), not a range built from trades, so the range fields are null and there is no sample size. How fresh: Austria: monthly; the September 2026 sheet was published on 4 Nov 2026 (about five weeks after the month); EU member states: weekly for most products (raw milk monthly), updated as Member States report, usually within days (raw milk about two weeks after the month ends). Each answer states its week or month and flags quotes that are older than usual (fruit and vegetables are only quoted in season); Finland: monthly; the newest month in the tables on 23 Oct 2026 was August 2026 (published about two months later); France: quarterly, not live: the newest file read on 8 November 2026 runs to 30 June 2026 (campaign 2025/26); every answer states its campaign and quarter; Poland: monthly; the September 2026 tables were published on 22 Oct 2026 (about three weeks after the month). Always read the period in the answer: an old quote is flagged and given lower confidence. Do not use for supermarket or shop prices, for the price of a particular farm, field, animal or meal, for farmland, for fuel or energy, for futures or stock-market prices, or for other countries.",
          "inputSchema": {
