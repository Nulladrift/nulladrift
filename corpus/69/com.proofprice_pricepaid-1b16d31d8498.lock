          "description": "Use this when a user asks what rent tenants actually pay or have agreed for a home in a town, area or postcode, how much it costs to rent a flat, house or room there, or how rents compare, in South Australia, Australia (country AU), Tasmania, Australia (country AU), New South Wales, Australia (country AU), Queensland, Australia (country AU), Canada (country CA), Switzerland (country CH), Germany (country DE), Catalonia, Spain (country ES), Finland (country FI), France (country FR), England and Wales (country GB), Hong Kong (country HK), Ireland (country IE), Norway (country NO), New Zealand (country NZ), Portugal (country PT), Sweden (country SE), Singapore public housing (country SG), Taiwan (country TW) or United States (country US). These are rents actually agreed or paid, taken from official records and statistics: registered tenancies, rental bond lodgements, approved rentals, or official rent statistics built from administrative records of tenancies. Where the source holds individual rents the answer is a median with a typical range (10th–90th percentile) and the number of rents; where the source publishes an average or median (price_type official_statistic) the range fields are null and there is no sample size. Every answer states its unit (rent per month or per week, in the local currency), the period covered, a confidence label, and the official source and licence. How fresh: South Australia, Australia: quarterly; a quarter's report is posted about six weeks after it ends (April-June 2026 was posted on 11 Aug 2026); Tasmania, Australia: monthly; a month's file appears about two to three weeks after the month ends; New South Wales, Australia: monthly; a month's lodgements are published in the first days of the next month; Queensland, Australia: quarterly; the RTA updates the workbook in April, July, October and January (the September quarter was published on 15 Oct 2026); Canada: annual: the October survey is released in the months after it (the October 2025 figures were released on 17 December 2025), and every answer states its survey month; Switzerland: yearly; the latest year published is 2024 (published in early 2026); Germany: static: the census date is 15 May 2022 (published 2024); the answer states that date and is not updated; Catalonia, Spain: quarterly, a few weeks after each quarter ends; the daily collector keeps a copy for history and outages; Finland: quarterly; the newest quarter in the table on 22 Oct 2026 was 2026Q3; France: annual; the 2025 results were published in October 2026; England and Wales: monthly; each release adds a month about six weeks after it ends (the ONS labels these official statistics in development); Hong Kong: monthly, about 6 weeks after the month ends; the newest three months are provisional; Ireland: quarterly; a quarter is published about five months after it ends; Norway: annual; the 2025 survey was published on 22 December 2025; New Zealand: monthly; the files run about two months behind (the October 2026 files end in August 2026) and the latest month can still change; Portugal: quarterly, published about three months after the quarter ends (the 2nd Quarter 2026 figures were released on 29 September 2026); each answer states its quarter; Sweden: annual; the 2026 survey (rents at the start of 2026) was published on 2 October 2026; Sweden: annual; rents at 31 December 2025, published on 2 October 2026; Singapore public housing: monthly; the previous month's approvals appear in the first days of the next month; Taiwan: the Ministry publishes every 10 days (the 1st, 11th and 21st); a tenancy appears about one to two months after the contract date. Our collector re-reads the releases daily, and answers cover whole calendar months ending at least 30 days before the newest contract in the register; United States: yearly (new 5-year release each December); the release read on 3 Nov 2026 was 2020-2024. Do not use for asking rents or listings, holiday lets, c