        {
          "name": "pricepaid_fuel_prices_now",
          "title": "Live fuel prices at the pump",
          "description": "Use this when a user asks the current price of petrol, diesel, E10, E85, LPG or CNG near a place in Queensland, Western Australia, Brazil, Ontario, Canada, Colombia, Costa Rica, Czechia, Spain, the EU (national averages), Finland, France, the United Kingdom (national averages), Hong Kong, Italy, Luxembourg, Montenegro, Mexico, Malaysia, the Netherlands, Norway, New Zealand, Portugal (mainland), Singapore, Thailand, Taiwan, the United States or Uruguay, or where fuel is cheapest there. Returns the median and typical range of pump prices across stations in the area, the three cheapest stations, and the official source and licence. How fresh: Queensland: monthly file, published about a month after the month ends (the newest data is usually 5 to 8 weeks old); Western Australia: daily: the current month's file is extended each day with the previous day's prices; our copy is taken once a day and every answer states the day it is for; Brazil: ANP publishes the survey as one file per month, so the newest survey week is usually one to four weeks old. Our copy is refreshed daily, and every answer states the survey week it describes; Ontario: weekly (Mondays, before the end of the business day; the next working day after a holiday); Canada: monthly, not live: Statistics Canada publishes each month's averages about two weeks after the month ends (August 2026 was released on 14 September 2026), and every answer states its reference month; Colombia: one figure per station per month, published at the start of the month; the answer states the month; Costa Rica: updated when ARESEP fixes a new tariff (about once a month, sometimes more often); every answer states the date the price applies from; Czechia: weekly, with the ISO week named in every answer; history from 2016; Spain: several times a day; the EU (national averages): weekly: Monday prices, published that week; Finland: monthly, about three months after the month ends (table updated 24 September 2026 with June 2026); every answer states the month it is for; France: about every 10 minutes; the United Kingdom (national averages): weekly: one national figure each week, usually available the same week; Hong Kong: updated by the Consumer Council as and when prices change; the file carries no date, so the date shown is the day ProofPrice fetched it; Italy: daily (prices at 08:00 of the extraction day); Luxembourg: monthly; the month is named in every answer; Montenegro: new prices are published about every week (usually Tuesday); every answer states the date the price applies from; Mexico: the feeds are current prices reported by the stations and carry no timestamps; our copy is taken once a day and every answer shows the day of that copy; Malaysia: weekly, on Thursdays; the Netherlands: weekly publication of daily averages: new days appear each Thursday, up to the Monday of that week; every answer states the day it is for; Norway: monthly; the newest month is normally published in the first weeks of the next month (table updated 21 October 2026 with September 2026); every answer states the month it is for; New Zealand: weekly (Fridays), using the previous week's data; the newest weeks are marked Provisional by MBIE and revised; Portugal (mainland): operators must report a price change before it applies; each station carries its own last-update date; Singapore: monthly, about three weeks after the month ends, with the month named in every answer; Thailand: monthly national retail prices; the file is updated by EPPO when a new month is added (check the period in each answer); Taiwan: changes usually on Mondays; the next week's list price is published the day before; the United States: weekly: EIA dates each figure to the Monday it describes and publishes it a day or two later (a day later after a federal holiday); our copy of EIA's history files is refreshed daily and every answer states its week; the United States: weekly in the heating season (October to March, published Wednesdays); EIA collects no heating oil or propane prices from April to September, so in summer the newest week is from March. Our copy of EIA's files is refreshed daily and every answer states its week; Uruguay: monthly: the price in force in each month; a month without a quotation is marked S/C by ANCAP. Do not use for other countries or for historical prices.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Wider area when no postcode. AU (Queensland only): 'Brisbane' (postcodes 4000 to 4179) or 'QLD' (the whole state). A suburb name also works. AU (Western Australia only): 'Perth' (the Metro region), 'WA' (the whole state), a FuelWatch region such as 'Peel' or 'South West', or a suburb name. BR: state as a two-letter code or name ('SP', 'Minas Gerais'); leave empty for all Brazil. Ontario: same as town (a market, or Ontario / Southern Ontario / Northern Ontario). Canada: same as town (a city, or 'Canada'). Provinces are not published. CO: department, for example 'Antioquia', 'Cundinamarca', 'Valle del Cauca'. Empty = the whole country. Costa Rica: not used (national price only). CZ: not used (national price only). ES: province code ('28') or province name ('Madrid', 'Sevilla', 'Girona'). EU Weekly Oil Bulletin countries: not used (national average only). Finland: not used (national average only). FR: department code or name ('69', '2A', 'Gironde', 'Rhône') or a region name ('Bretagne', 'Île-de-France', 'Occitanie', 'PACA'): a region answers from our daily copy, labelled. GB: not used (national average only). HK: not used (territory-wide figure only). IT: province code ('MI', 'RM') or province name ('Milano', 'Roma', 'Rome'); any other name is tried as a comune. LU: not used (national price only). Montenegro: not used (national price only). MX: state name or code ('Ciudad de México', 'CDMX', 'Jalisco', 'NLE'); leave empty for all Mexico. Only states are available. MY: not used (national price only). Netherlands: not used (national average only). Norway: not used (national average only). NZ: not used (national price only). PT: district name or number: 'Lisboa' (11), 'Porto' (13), 'Faro' (08) ... 18 mainland districts. SG: not used (national price only). TH: not used (national price only). TW: not used (island-wide price only). US: a state ('TX', 'California') or PADD region ('Gulf Coast', 'PADD 1B', 'West Coast'); leave empty for the national average. EIA publishes gasoline for CA, CO, FL, MA, MN, NY, OH, TX and WA, diesel only for California plus the nation and PADD regions. Any other place gets the national average, and the answer says so (with its region as context). US heating oil and propane: not used (national average only). Uruguay: not used (national maximum price only).",
                "type": "string"
              },
              "country": {
                "description": "AU = Australia, Queensland only (monthly station prices reported to the Queensland Government); AU = Australia, Western Australia only (FuelWatch daily station prices); BR = Brazil (ANP weekly survey: regular petrol and diesel S10); CA = Canada (Ontario markets only here: Ministry of Energy weekly average pump price in CAD per litre; other Canadian places come from Statistics Canada); CA = Canada (Statistics Canada: monthly average retail price by city, official statistic, not a live pump price); CO = Colombia (compressed natural gas only, monthly station prices from SICOM; no gasoline or diesel); CR = Costa Rica (regulator ARESEP: national maximum price, not a station price); CZ = Czechia (Czech Statistical Office weekly national average pump price in koruna; an official statistic, not a station price); ES = Spain; EU Weekly Oil Bulletin, national average pump prices: IE = Ireland, AT = Austria, DE = Germany, NL = the Netherlands, BE = Belgium, PT = Portugal, PL = Poland, DK = Denmark, SE = Sweden, FI = Finland, LU = Luxembourg, GR = Greece, CZ = Czechia, SK = Slovakia, SI = Slovenia, HR = Croatia, HU = Hungary, RO = Romania, BG = Bulgaria, EE = Estonia, LV = Latvia, LT = Lithuania, CY = Cyprus, MT = Malta; FI = Finland (Statistics Finland: monthly national average pump price, official statistic, not a live pump price); FR = France; GB = United Kingdom (DESNZ weekly national average pump prices of unleaded petrol and diesel); HK = Hong Kong (posted pump prices of five oil companies, Consumer Council; posted prices, not station prices); IT = Italy; LU = Luxembourg (monthly national average E10 petrol price in euro, all taxes included; an official statistic, not a station price). Diesel, petrol95 and lpg come from the weekly EU Oil Bulletin.; ME = Montenegro (government maximum price, not a station price); MX = Mexico (by state); MY = Malaysia (weekly government-set national price; an official published price, not a station price); NL = Netherlands (CBS: daily national average pump price, official statistic, a few days behind); NO = Norway (Statistics Norway: monthly national average pump price, official statistic, not a live pump price); NZ = New Zealand (MBIE weekly national average retail price; an official statistic, not a station price); PT = Portugal (mainland); SG = Singapore (Department of Statistics monthly national average pump price; an official statistic, not a station price); TH = Thailand (EPPO monthly national average retail price; an official statistic, not a station price); TW = Taiwan (posted island-wide list price of CPC Corporation; a posted price, not a station price); US = United States (U.S. Energy Information Administration: weekly average retail gasoline and diesel prices in US$ per gallon for the nation, PADD regions, 9 states and 10 cities); US = United States (EIA: weekly national average residential heating oil and propane prices in US$ per gallon, October to March); UY = Uruguay (ANCAP: monthly maximum pump price set by decree, national, IVA included; not a station price)",
                "enum": ["AU", "BR", "CA", "CO", "CR", "CZ", "ES", "IE", "AT", "DE", "NL", "BE", "PT", "PL", "DK", "SE", "FI", "LU", "GR", "SK", "SI", "HR", "HU", "RO", "BG", "EE", "LV", "LT", "CY", "MT", "FR", "GB", "HK", "IT", "ME", "MX", "MY", "NO", "NZ", "SG", "TH", "TW", "US", "UY"],
                "type": "string"
              },
              "fuel": {
                "description": "petrol95 = unleaded 95; methane = CNG (priced per kg). Queensland: diesel, petrol95 (= standard Unleaded, 91 RON), petrol98, e10, e85 or lpg. Western Australia: diesel, petrol95 (= standard unleaded ULP, 91 RON), petrol98, lpg or e85. Brazil: petrol95 = regular petrol (gasolina comum, not RON 95) or diesel (= diesel S10). Other fuels are not covered. Ontario: petrol95 = regular unleaded, petrol98 = premium unleaded, diesel, propane, methane = compressed natural gas (per litre of gasoline equivalent). E10, E85, LPG and heating oil are not published. Canada: petrol95 = regular unleaded gasoline (87 AKI, about 91 RON), petrol98 = premium unleaded, diesel; self-service stations. E10, E85, LPG and CNG are not published. CO: only methane (vehicular natural gas, GNCV), in COP per cubic metre (not per kg). Gasoline and diesel are not available. Costa Rica: petrol95 (Gasolina RON 95) or diesel (automotive, 50 ppm), the regulated maximum price in colones per litre with IVA. Gasolina RON 91 is given in the answer as extra information. CZ: diesel, petrol95 or lpg, as the weekly national average per litre in Czech koruna (CZSO). E10, E85, CNG and petrol 98 are not published. For the euro figure or the price net of tax (tax=without) the EU Oil Bulletin answers. EU Weekly Oil Bulletin countries: petrol95 (Euro-super 95), diesel (automotive gas oil) or lpg, as a national average per litre in euro with all taxes; heating gas oil is in the extra fields. Other fuels are not published. Finland: petrol95 (95 E10 unleaded) or diesel, as a national monthly average per litre in euro with VAT and duties. Premium petrol, E85, LPG, CNG, heating oil and renewable diesel are not served. France: petrol95 means SP95 only (about a quarter of French 95-octane stations, and the dearer fuel). Most stations sell E10 instead, which is a separate item and already available: ask for fuel=e10 for the common 95-octane petrol. Also diesel, petrol98 (SP98), e85 and lpg. GB: petrol95 (unleaded petrol, ULSP) or diesel (ULSD) only, as a national average in pounds per litre; other fuels are not published. HK: diesel, petrol95 (the Consumer Council's standard petrol) or petrol98 (premium petrol), in HKD per litre; the answer is the median of five companies' posted prices. Italy: diesel, petrol95, lpg, methane only. LU: e10 = monthly national average E10 price per litre incl. taxes (Ministry of the Economy, prices from STATEC). diesel, petrol95, lpg and heating_oil: the EU Weekly Oil Bulletin answers. Montenegro: petrol95 (Eurosuper 95) or diesel (Eurodiesel), the government maximum retail price in euro per litre with taxes. Eurosuper 98 and heating oil are given in the answer as extra information. Mexico: petrol95 = regular petrol (gasolina regular, Magna), petrol98 = premium petrol, or diesel. Mexican grades are not 95 or 98 RON. MY: diesel, petrol95 (RON95, unsubsidised rate) or petrol98 (answered with RON97). Subsidised BUDI95/SKPS/SKDS prices are in extra.subsidised_myr_per_litre. Netherlands: petrol95 (Euro95), diesel or lpg, as a national daily average per litre in euro with VAT and excise. Premium petrol, E10, E85 and natural gas are not published. Norway: petrol95 (95-octane unleaded) or diesel, as a national monthly average per litre in NOK with taxes. Premium petrol, E10, E85, LPG and CNG are not published. NZ: diesel, or petrol95 (MBIE's Premium Petrol 95R; petrol98 gets the same series). Regular petrol 91 is returned in extra.other_fuels. PT: petrol95 (Gasolina simples 95), petrol98, diesel (Gasóleo simples), lpg (GPL Auto) or methane (CNG, per kg). SG: diesel, petrol95, petrol98 (92-octane petrol is in extra.other_fuels) or lpg (per kg). TH: petrol95 (ULG 95; petrol98 gets the same series), diesel (HSD B7) or lpg (automotive LPG per litre). Gasoline 91 and kerosene are in extra.other_products. TW: diesel (premium diesel), petrol95 (95 unleaded) or petrol98 (98 unleaded), in NT$ per litre with VAT and excise. 92 unleaded and 95E3 gasohol are in the extra fields. US: petrol95 = regular gasoline, petrol98 = premium gasoline, diesel = on-highway diesel (all types). For midgrade gasoline use petrol95 with gasoline_grade=midgrade. Prices are weekly averages in US dollars per gallon, taxes included (US$ per litre is in extra). EIA publishes no E10, E85, LPG or CNG prices. US heating: heating_oil = residential No. 2 heating oil, propane = residential propane, as a national weekly average in US dollars per gallon (per litre in extra). Collected only October to March, so in summer the newest week is from March. For gasoline and diesel use petrol95 or diesel. Uruguay: petrol95 (Super 95) or diesel (gasoil 10-S), as the regulated maximum price per litre in Uruguayan pesos with IVA; premium 97 and gasoil 50-S are in the extra fields. Other fuels are not published.",
                "enum": ["diesel", "petrol95", "petrol98", "e10", "e85", "lpg", "methane", "heating_oil", "propane"],
                "type": "string"
              },
              "gasoline_grade": {
                "description": "US only: the gasoline grade EIA publishes. Overrides the grade implied by fuel (petrol95 = regular, petrol98 = premium); use midgrade here with fuel=petrol95. Not for diesel.",
                "enum": ["regular", "midgrade", "premium"],
                "type": "string"
              },
              "postcode": {
                "description": "Postcode of the place. AU (Queensland only): 4-digit postcode starting with 4, e.g. '4122'. Most single postcodes have fewer than 5 stations of one fuel; use area 'Brisbane' or 'QLD' then. AU (Western Australia only): 4-digit postcode starting with 6, e.g. '6000'. BR: not used (the survey is published by state and municipality). Ontario: not used. Canada: not used. CO: not used. Costa Rica: not used; one national price is returned and says so. CZ: not used (national price only). ES: 5-digit postcode, e.g. '28001'. EU Weekly Oil Bulletin countries: not used; the bulletin publishes one national average per country, so the national figure is returned and says so. Finland: not used; Statistics Finland publishes one national average, so the national figure is returned and says so. FR: 5-digit postcode, e.g. '75015'. GB: not used; DESNZ publishes one UK average, so the national figure is returned and says so. HK: not used (territory-wide figure only). LU: not used (national price only). Montenegro: not used; one national price is returned and says so. MX: not used. MY: not used (national price only). Netherlands: not used; CBS publishes one national average, so the national figure is returned and says so. Norway: not used; SSB publishes one national average, so the national figure is returned and says so. NZ: not used (national price only). PT: postcode such as '1000-001' or just the first 4 digits '1000'; with fewer than 5 stations the district is answered, labelled. SG: not used (national price only). TH: not used (national price only). TW: not used (island-wide price only). US: not used (EIA publishes no ZIP-code prices). US heating oil and propane: not used (national average only). Uruguay: not used; ANCAP publishes one national price, so the national figure is returned and says so.",
                "type": "string"
