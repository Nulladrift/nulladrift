        {
          "name": "pricepaid_wholesale_fresh_food_prices",
          "title": "Wholesale prices of live animals, fish, eggs and fresh food",
          "description": "Use this when a user asks what the wholesale price of live pigs, cattle or chickens, fish, eggs or other fresh food is today in Australia (country AU), Canada (country CA), Germany (country DE), France (country FR), England and Wales (country GB), Hong Kong (country HK), Malaysia (country MY), Taiwan (country TW) or United States (country US), or how it moved on the previous day. Returns the newest daily average reference wholesale price that the government publishes for the food type, per kilogram or per egg, with the day it applies to, the change on the previous published day, the recent days, the official source and licence. This is a posted reference price reported by wholesalers (price_type posted_price), not a paid price and not a range built from sales, so the range fields are null and there is no sample size. How fresh: Australia: daily on trading days (MLA updates at midnight AEST); every answer states the trading day it describes; Canada: weekly (a Friday date); our copy is refreshed daily and each answer states the week its quotes apply to; Germany: weekly (calendar week); each answer states the week its price applies to; France: daily on market days (each market line carries its own date); each answer states the dates its quotes apply to; England and Wales: about every two weeks (a Monday date); each answer states the date its price applies to; Hong Kong: daily on working days, published by the AFCD when necessary; each answer states the day its price applies to; Malaysia: monthly, not live: when checked on 28 October 2026 the newest month DOSM publishes was December 2025 (its 'last updated' date is not the data period); our copy is refreshed daily and every answer names its month; Taiwan: daily, trading days only; about 10 trading days are available at a time; United States: weekly, published on Monday for the week just ended; every answer states the report date. Do not use for supermarket or shop prices, for the price one farm