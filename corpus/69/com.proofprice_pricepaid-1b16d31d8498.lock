              "town": {
                "description": "Town, city or local area. AU (South Australia): a suburb name, e.g. Glenelg, Norwood or Mount Barker; or a four-digit 5xxx postcode. AU (Tasmania): 'Tasmania' for the whole state, or a suburb or town such as Hobart, Launceston, Devonport or Glenorchy; a postcode is more precise. A suburb name covers that suburb only (Hobart is the city centre, not Greater Hobart). AU: use 'NSW' for the whole state; otherwise give a postcode (NSW rents are published by postcode). AU (Queensland): give a four-digit postcode; the RTA publishes by postcode, so a place name has no answer. CA: required. A town or city of 10,000 people or more, e.g. Toronto, Montréal (or Montreal), Vancouver, Calgary, Edmonton, Ottawa, Winnipeg, Halifax. Add the province to be exact ('London, Ontario'). CH: a canton (Zürich, Bern, Geneva, Vaud, Ticino or a code such as ZH, GE), or leave out for Switzerland as a whole. Towns and postcodes are not published. DE: required. One of about 90 German cities, e.g. Berlin, Hamburg, München (Munich), Köln (Cologne), Frankfurt am Main, Stuttgart, Düsseldorf, Leipzig, Dresden. ES: required; a Catalan municipality, e.g. 'Barcelona', 'Sabadell', 'Girona' (Spanish or Catalan spelling). FI: optional: 'Helsinki', 'Espoo', 'Vantaa', 'Tampere', 'Turku', 'Oulu', 'Greater Helsinki', a region such as 'Uusimaa' or 'Pirkanmaa', or a district such as 'Helsinki 2'. Leave out for Finland as a whole. FR: required. An observed agglomeration: 'Paris' (the city), 'Ile-de-France' (Paris agglomeration), 'Marseille', 'Toulouse', 'Nantes', 'Rennes', 'Strasbourg', 'Bordeaux', 'Montpellier' (about 50 areas; Lyon and Lille are not observed). A name that is not observed returns the full list. GB: required. A local authority (Manchester, Leeds, Camden, Cardiff), an English region (London, North West) or England / Wales. Towns and postcodes are not published; Bristol, Hull etc. match their council area. HK: required. A region: 'Hong Kong' (Hong Kong Island), 'Kowloon' or 'New Territories'; a known district such as Mong Kok, Central or Sha Tin gives its region's figure. IE: required. A county ('Dublin', 'Cork'), a town ('Swords, Dublin', 'Galway City') or a Dublin district ('Dublin 6'). NO: required. A price zone: 'Norway' (whole country), 'Oslo', 'Akershus', 'Bergen', 'Trondheim', 'Stavanger', 'large towns', 'medium towns' or 'small towns'. NZ: required. A territorial authority or city ('Wellington', 'Auckland', 'Christchurch', 'Hamilton', 'Dunedin', 'Queenstown-Lakes'), a region ('Canterbury', 'Wellington Region') or 'New Zealand' for the whole country. A name that is both a city and a region (Wellington) gives the city. PT: any municipality ('Lisboa' / 'Lisbon', 'Porto', 'Cascais', 'Faro', 'Funchal', 'Coimbra' ... all 308) or a region ('Algarve', 'Grande Lisboa', 'Madeira', 'Açores'). Omit for Portugal as a whole. Official INE median monthly rent per m² of new leases of the last 12 months (not per home). SE: optional region group: 'Sweden' (default), 'Greater Stockholm', 'Greater Gothenburg', 'Greater Malmo', 'large municipalities' or 'small municipalities'. SE with new_build=true: optional region group: 'Sweden' (default), 'Greater Stockholm', 'Greater Gothenburg', 'Greater Malmo', 'large municipalities' or 'small municipalities'. SG: required, an HDB town such as 'Tampines', 'Bedok' or 'Toa Payoh'. TW: a city or county in English or Chinese ('Taipei' / '台北市' / '臺北市', 'New Taipei', 'Taichung', 'Kaohsiung', 'Tainan', 'Taoyuan', 'Hsinchu City', 'Hsinchu County'), or a district with its city (\"Da'an, Taipei\", '臺北市大安區', 'Banqiao, New Taipei'). Omit for all of Taiwan. A district name used in several cities ('Zhongzheng', 'Dongqu') needs the city too. US: optional: a city with its state ('Seattle', 'Portland, OR', 'Austin, Texas'), a county ('King County, Washington'), a metro area ('Boston') or a state ('Texas'). Cities of 50,000+ people only. Leave out for the whole United States. A name shared by several places lists them so