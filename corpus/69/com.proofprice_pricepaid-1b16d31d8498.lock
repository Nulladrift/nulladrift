e tables cover free housing as a whole; only 'any' has an answer. BG HR CY CZ DE EE ES HU IS IT LV LT LU MT PL RO SI SK: ignored; the index covers all dwellings (new and existing) bought by households. FI: flat (flats in blocks of flats), terraced (terraced houses, which also include detached houses with shares in a housing company). Without a type, all building types. House and detached are not covered. FR: house or apartment. GB: detached, semi-detached, terraced or flat-maisonette. GB Scotland / Northern Ireland: any, detached, semi-detached, terraced or flat-maisonette. HK: flats only (any). HK: all homes together (any). HU: 'existing' (used dwellings, the default) or 'new' (newly built). The figure is an average price per m² of living space. IE: any, new or second-hand (new homes are usually recorded without VAT). LV: 'house' gives the VZD house statistics (price per house in EUR); leave out for apartments. LV: apartments only ('flat', the default). NL: CBS does not split this figure by home type; only 'any' (all existing owner-occupied homes) has an answer. NO: any (all dwellings, default), house or detached (detached houses), terraced (row houses), flat (multi-dwelling buildings). Official price per m² of existing dwellings. NZ: leave out or 'any'. The publisher gives one figure for all residential sales (houses, apartments and other dwellings together). PL: only flats are in the register extract we read, so leave out or use apartment (flat, any also work). house is refused. PT: INE splits by number of bedrooms, not by house or apartment; only 'any' has an answer (the answer includes the split by bedrooms). QA: any (default), villa (villas and houses) or building (whole residential buildings). SE: house (one- and two-dwelling buildings; the default for any), flat (tenant-owned flats, median price, county or metropolitan area only). Villas, terraced and semi-detached houses are not split, so detached and terraced return no figure. TW: apartment (high-rise, mid