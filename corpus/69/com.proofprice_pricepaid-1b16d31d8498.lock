lishes most items per pound. UY: an everyday product in English or Spanish ('rice', 'sugar', 'eggs', 'chicken', 'bananas', 'cooking oil', 'toilet paper', 'arroz', 'azucar', 'pollo'). The ministry names each product with a pack size, so the answer names the exact product and pack and lists related ones. The 160 products priced in the most shops are held. Fresh milk is not in the file (only dulce de leche, butter and yogurt). ZA: Stats SA's standard items and pack sizes, e.g. milk (1 l), eggs (18), white bread (700 g), butter (500 g), white rice (1 kg), sugar (1 kg), maize meal (5 kg), cooking oil (750 ml), whole chicken (per kg), beef mince, bananas, potatoes, tomatoes, coffee, beer.",
