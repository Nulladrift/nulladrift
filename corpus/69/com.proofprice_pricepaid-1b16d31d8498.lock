        {
          "name": "pricepaid_transport_fares",
          "title": "Public transport fares (posted fare tables)",
          "description": "Use this when a user asks what a public transport journey costs under the published fare table, for example a metro ride of a given distance for an adult, senior or student, in Sydney and NSW (Opal) (country AU), Prague (country CZ), Spain high-speed rail (country ES), Paris region (country FR), London (Underground) (country GB), Hong Kong (MTR) (country HK), Ireland (taxi maximum fares) (country IE), Singapore (country SG), Singapore buses (country SG), Taiwan (Taipei Metro) (country TW) or Taiwan Railway (country TW). Returns the posted fare for the journey with the fare group, distance band and time band, the period, and the official source and licence. These are posted fares set by the operator or regulator, the same for everyone in a fare group, not amounts paid by individuals and not a ticket or a quote; there is no sample size and no range. How fresh: Sydney and NSW (Opal): updated when fares change (yearly, around 1 July); the table read 3 Nov 2026 carried the fares effective from 29 June 2026; Prague: the feed is rebuilt daily by the publisher; fares change only when the tariff changes; Spain high-speed rail: monthly series, published quarterly by CNMC (newest month read on 31 Oct 2026: June 2026); Paris region: updated by the publisher when fares change (the list read 29 Oct 2026 had been modified on 28 Oct 2026); London (Underground): updated by TfL when fares change (the annual change takes effect in March; the table read on 9 Nov 2026 runs 1 Nov 2026 to 1 Nov 2027); Hong Kong (MTR): updated by the MTR Corporation when fares change; the file read on 5 Nov 2026 was last modified 2 Apr 2026; Ireland (taxi maximum fares): fixed by statutory instrument; in operation from 1 December 2024 and unchanged until the National Transport Authority makes a new Order; Singapore: updated when fares change (yearly fare review; the table read 29 Oct 2026 carried the fares effective from 27 Dec 2025); Singapore buses: updated when fares change (yearly fare review; the table read 5 Nov 2026 carried the fares effective from 27 Dec 2025); Taiwan (Taipei Metro): irregular: updated by the operator when fares change; the file name carries its date; Taiwan Railway: irregular: updated by the operator when fares change (the dataset page shows 'last modified'); collected into our price library every day. Do not use for taxis or ride-hailing, flights, fuel, a personal quote or passes, or for countries that are not listed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "AU = Australia (New South Wales only: Opal card fares for Sydney, Newcastle, Central Coast, Illawarra and the Blue Mountains from Transport for NSW, AUD, a posted tariff); CZ = Czechia (Prague and the PID region only: the posted adult single ticket from the PID open fare table, CZK, a posted tariff); ES = Spain (high-speed rail from Madrid to Barcelona, Valencia, Alicante, Málaga or Sevilla: CNMC's monthly average posted web fare per operator, EUR; a posted fare, not tickets sold); FR = France (Île-de-France only: the Paris region single ticket and Navigo-type passes from the Île-de-France Mobilités tariff list, EUR, a posted tariff); GB = London Underground only (Transport for London posted adult fares between 20 central and main stations, GBP; buses, DLR, Elizabeth line, National Rail and the rest of Britain are not included); HK = Hong Kong (MTR train fares between two stations from the MTR Corporation's open data, HKD, a posted tariff; Airport Express, Light Rail and MTR Bus not included); IE = Ireland (taxi MAXIMUM metered fare for a journey distance, from the National Transport Authority's Order S.I. 479/2024, EUR, a regulated ceiling not an amount paid; no train, bus or Luas fares); SG = Singapore (MRT and LRT card fares per ride from the Public Transport Council fare table, SGD, a posted tariff; bus fares not included); SG = Singapore (trunk bus card and cash fares per ride from the Public Transport Council fare table, SGD, a posted tariff; add service=bus); TW = Taiwan (Taipei Metro fares between two stations from the operator's open data, TWD, a posted tariff; other lines and operators not included); TW = Taiwan (Taipei Metro fares by default; add tw_operator=tra for Taiwan Railway fares between 22 main-city stations; TWD, posted tariffs)",
                "enum": ["AU", "CZ", "ES", "FR", "GB", "HK", "IE", "SG", "TW"],
                "type": "string"
              },
              "destination_station": {
                "description": "TW only (required): the Taipei Metro station you end at, by English name such as 'Taipei 101' or 'Songshan Airport', or Chinese name such as 西門.",
                "type": "string"
              },
              "distance_km": {
                "description": "Journey distance in kilometres (default 5). The fare is looked up in the published distance band. Australia (NSW Opal): trip distance in km (default 5); the fare is read from the published band (train 0-10, 10-20, 20-35, 35-65, 65+ km; bus, light rail 0-3, 3-8, 8+ km; ferry 0-9, 9+ km). Czechia (Prague): not used, one ticket price covers any distance inside the tariff zones. Spain (rail): not used, the fare is per route; give route instead. France (Île-de-France): not used, the single ticket costs the same for any distance in the region. London (Underground): not used; the fare depends on the two stations, so give tfl_from and tfl_to. Hong Kong (MTR): not used; the fare depends on the two stations, so give from_station and to_station. Ireland (taxi): the journey distance in km (default 5); the maximum metered fare is worked out from the statutory tariff. Singapore: ride distance in km (default 5); the fare is read from the published 1 km band. Singapore bus: ride distance in km (default 5); the fare is read from the published band. Taiwan (Taipei Metro): not used; the fare depends on the two stations, so give origin_station and destination_station.",
                "minimum": 0,
                "type": "number"
              },
              "fare_type": {
                "description": "Fare group (default adult). The groups available depend on the country notes. Australia (NSW Opal): adult (default); student = the Child/Youth Opal fare; senior = the Senior/Pensioner concession fare (capped at AUD 2.50 a day). workfare and disability are not available. Czechia (Prague): only adult (default); the open fare table has no reduced fares. Spain (rail): not used, CNMC publishes one average fare per route and operator; leave out. France (Île-de-France): adult = single ticket Métro-Train-RER (default); student = annual Imagine R student pass. Seniors and disabled people get percentage discounts, not a fixed fare. London (Underground): adult only (default); child, student and concession fares are not available. Hong Kong (MTR): adult (default), senior = the elderly concession fare, or disability = the concession fare for persons with a disability. student and workfare are not available. Ireland (taxi): not used; the maximum fare is the same for every passenger. Leave out. Singapore: adult (default), senior, student, workfare or disability. Singapore bus: adult (default), senior, student, workfare or disability. Taiwan (Taipei Metro): adult (default, the full fare), or senior / disability (both give the one concession fare for senior, Love and companion card holders and children in Taipei and New Taipei). student and workfare are not available.",
                "enum": ["adult", "senior", "student", "workfare", "disability"],
                "type": "string"
              },
              "from_station": {
                "description": "HK only (required): the MTR station you start at, by English name such as 'Central' or 'Tsim Sha Tsui'.",
                "type": "string"
              },
              "mode": {
                "description": "AU (NSW Opal) only: train (default), bus, light_rail or ferry.",
                "type": "string"
              },
              "operator": {
                "description": "Spain (rail) only: total = all operators together (default), renfe-ave, renfe-avlo, iryo or ouigo. An operator CNMC did not see on that route in the newest month gives an error listing those it did.",
                "type": "string"
              },
              "origin_station": {
                "description": "TW only (required): the Taipei Metro station you start at, by English name such as 'Taipei Main Station' or 'Tamsui', or Chinese name such as 台北車站.",
                "type": "string"
              },
              "passenger": {
                "description": "TW Taiwan Railway only: adult (default) or child.",
                "type": "string"
              },
              "payment": {
                "description": "SG bus only: card (default) or cash.",
                "type": "string"
              },
              "route": {
                "description": "Spain (rail) only: Madrid-Barcelona (default), Madrid-Valencia, Madrid-Alicante, Madrid-Málaga or Madrid-Sevilla, or just the destination (Barcelona, Seville...).",
                "type": "string"
              },
              "service": {
                "description": "SG only: bus = trunk bus fares; leave out for MRT and LRT fares.",
                "type": "string"
              },
              "taxi_rate": {
                "description": "IE only: standard (08:00-20:00 Mon-Sat, default), premium (20:00-08:00, Sundays and public holidays) or special (Sat/Sun 00:00-04:00, Christmas and New Year).",
                "type": "string"
              },
              "tfl_from": {
                "description": "GB only (required): the London Underground station you start at, by name such as \"King's Cross\", \"Victoria\", \"Oxford Circus\" or \"Heathrow Terminal 5\" (20 central and main stations).",
                "type": "string"
              },
              "tfl_ticket": {
                "description": "GB only: payg (Oyster or contactless pay as you go, default) or cash (single paper ticket).",
                "type": "string"
              },
              "tfl_time": {
                "description": "GB only: peak (default, Mon-Fri 06:30-09:30 and 16:00-19:00) or off-peak. Ignored for cash and for journeys with one all-day fare.",
                "type": "string"
              },
              "tfl_to": {
                "description": "GB only (required): the London Underground station you end at, by name such as \"Waterloo\" or \"Bank\".",
                "type": "string"
              },
              "ticket": {
                "description": "HK only: octopus (default, the Octopus card fare) or single (single-journey ticket; adult and senior only).",
                "type": "string"
              },
              "to_station": {
                "description": "HK only (required): the MTR station you end at, by English name such as 'Mong Kok' or 'Tung Chung'.",
                "type": "string"
              },
              "travel_time": {
                "description": "early = the discounted band before the morning peak where a country has one; other = all other times (default). Australia (NSW Opal): other = peak, the full fare (default); early = off-peak (30% cheaper on train, bus and light rail; ferries have no off-peak discount). Czechia (Prague): no early band; leave out. Spain (rail): not used, CNMC averages over departure times and purchase days; leave out. France (Île-de-France): no early band; leave out. London (Underground): not used; use tfl_time (peak or off-peak) instead. Hong Kong (MTR): not used; MTR fares do not change with the time of day in this table. Ireland (taxi): not used; use taxi_rate (standard, premium or special) to say when you travel. Singapore: early = before 7.45am on weekdays (discounted fares), other = all other times (default). Singapore bus: not used, trunk bus fares have no early-morning discount. Taiwan (Taipei Metro): not used; this fare table does not change with the time of day.",
                "enum": ["early", "other"],
                "type": "string"
              },
              "tw_operator": {
                "description": "TW only: tra = Taiwan Railway (then origin_station and destination_station are stations such as Taipei, Taichung, Tainan, Kaohsiung, Hualien); leave out for Taipei Metro.",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
