a BZP); PT = Portugal (public contracts, Portal BASE); SG = Singapore (GeBIZ tenders); TH = Thailand, Bangkok city administration only (Bangkok Metropolitan Administration contracts); UA = Ukraine (signed public contracts, Prozorro); US = United States (buyer_area=Chicago here: City of Chicago contract awards; federal contracts come from USAspending); US = United States, federal schedule contracts' hourly labour ceiling rates (GSA CALC+); US = United States, federal agencies' contracts only (not state or local governments); ZA = South Africa (signed public contracts on the National Treasury eTenders portal)",
                "enum": ["AR", "AU", "BR", "CA", "CO", "CZ", "DE", "ES", "AT", "BE", "BG", "HR", "CY", "DK", "EE", "FI", "FR", "GR", "HU", "IE", "IT", "LV", "LT", "LU", "MT", "NL", "PL", "PT", "RO", "SK", "SI", "SE", "IS", "LI", "NO", "GB", "NG", "NZ", "SG", "TH", "UA", "US", "ZA"],
                "type": "string"
