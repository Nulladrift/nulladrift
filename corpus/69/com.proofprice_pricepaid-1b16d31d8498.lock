              "service": {
                "description": "Self-service or attended service, where a country prices them differently. Ontario: not used (the survey does not split self and full service). Canada: self only. Full-service prices stopped in 2013. CO: not used. Costa Rica: not used. EU Weekly Oil Bulletin countries: not used. Finland: not used. GB: not used. HK: not used. IT: self-service (default) or attended service, which costs more. Montenegro: not used. MY: not used. Netherlands: not used. Norway: not used. NZ: not used. TH: not used. TW: not used. US: not used. US heating oil and propane: not used. Uruguay: not used.",
