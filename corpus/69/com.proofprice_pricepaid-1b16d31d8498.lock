                "enum": ["DK", "FR", "HK", "JP", "PL", "SE", "SG", "TW", "US"],
                "type": "string"
              },
              "grade": {
                "description": "HK offices only: A (default), B or C, the RVD office grade.",
                "type": "string"
              },
              "months": {
                "description": "How many recent months to include. Default 24. DK: not used; Statistics Denmark publishes one average per quarter. HK: ignored; the figures are yearly (newest year with a usable figure). JP: ignored; the figures are annual (1 January valuation, newest edition). PL: 1 to 24 months, default 12 (commercial sales are few). The register lags by months, so the answer period ends at the newest sale held. SE: ignored; the figures are yearly (latest year with at least 5 sales). SG: look-back in months from the newest award in the file (July 2016), e.g. 120. Leave out for the whole file (1993 to 2016). TW: 12 or 24 whole calendar months; up to 18 gives 12 (24 if a place has too few sales in 12), more gives 24. US: up to 12 months (the city's file holds the last 12).",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
