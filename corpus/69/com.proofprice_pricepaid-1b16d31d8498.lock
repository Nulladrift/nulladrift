          "description": "Use this when a user asks what electricity costs on the wholesale (day-ahead power exchange) market in Australia, Australia (gas), Switzerland, Germany, Spain and Portugal, Austria, Belgium, Czechia, Denmark, France, northern Italy, the Netherlands, south-west Norway and Poland, Great Britain, Japan, Romania or California (United States): the recent median, the typical range across hours, the cheapest and dearest hour, the latest hour and how many hours had negative prices. Prices are in euro per MWh (1 MWh = 1000 kWh; the answer also gives cents per kWh). Built from the hourly auction prices of the recent days, with the official source and licence. How fresh: Australia: AEMO publishes one price file per trading day (04:00 to 04:00 NEM time) early the next morning; ProofPrice reads the files of the last days on each request (cached up to 30 minutes); Australia (gas): AEMO rewrites the STTM ex post file each morning (about 10:30 Sydney time) with the last 7 gas days; ProofPrice reads it on each request (cached up to 30 minutes); Switzerland: monthly, a few weeks after month end; each answer states the month it is for; Germany: hourly prices, published the day before delivery (around 13:00 Central European Time); ProofPrice reads them on each request (cached up to 30 minutes); Spain and Portugal and Austria, Belgium, Czechia, Denmark, France, northern Italy, the Netherlands, south-west Norway and Poland: prices are published the day before delivery (around 13:00 Central European Time); ProofPrice reads them on each request (cached up to 30 minutes); Great Britain: half-hourly prices appear within hours of each trading period and are read on each request (cached up to 30 minutes); Japan: JEPX rewrites its file every day; ProofPrice copies it once a day and answers with the newest complete delivery day it holds (usually yesterday, Japan time); Romania: the next day's prices are published around 13:00 CET each day; read on each request (cached up to 30 minutes); California (United States): the next day's prices are published around 13:00 Pacific each day; read on each request (cached up to 30 minutes). Wholesale prices are not what households or businesses pay on their bills. Do not use for retail tariffs, for petrol and diesel, or for other countries.",
