          "description": "Use this when a user asks what childcare costs parents: the price of a nursery, daycare, childminder or after-school place for a baby, toddler, preschool or school-age child in a county, region, state or city, or how childcare prices compare, in Canada (country CA), Denmark (country DK), England (country GB), Ireland (country IE), Norway (country NO), Singapore childcare centres (country SG) or the United States (country US). These are official surveys and statistics of the fees providers charge parents (or what households report paying), not adverts or listings, and they are before public subsidies or funded hours unless the answer says otherwise. Each answer is an official average or median (price_type official_statistic): the range fields are null, and there is a sample size only where the publisher gives one. Every answer states its unit (for example US dollars per week, or pounds per hour), the year it describes, a confidence label, and the official source and licence. How fresh: Canada: april 2024 survey (published 2025, a single survey year); Denmark: annual; the 2026 rates were published on 8 April 2026. Each answer states its year.; England: calendar year 2025 (survey fieldwork May to July 2025, published 11 December 2025; next release December 2026); Ireland: 2016 only (CSO has not repeated the table); regional, not county; ten years old; Norway: annual (January figures); the 2026 figures were published on 30 April 2026; Singapore childcare centres: rolling: each centre updates its own listing; the newest update is shown with the answer; the United States: county prices for 2022 (the latest year the Department of Labor has published; the database lags by several years). Some of this data is several years old: always read the period in the answer. Do not use for the cost of a specific nursery, advertised fees or waiting-list prices, the value of government subsidies, tuition for schools or universities, babysitting or nanny wages, 