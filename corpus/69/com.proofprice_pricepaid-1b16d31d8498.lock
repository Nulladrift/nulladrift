          "name": "pricepaid_grocery_prices",
          "title": "Grocery and everyday prices",
          "description": "Use this when a user asks what an everyday grocery item (milk, bread, eggs, butter, cheese, chicken, bananas, potatoes, sugar, tea, coffee, beer, wine...) costs in the shops in United Arab Emirates (country AE), Argentina (Precios Claros supermarket shelf prices) (country AR), Austria (country AT), Bulgaria (country BG), Canada (country CA), Switzerland (country CH), Chile (ODEPA shelf prices) (country CL), Czechia (country CZ), France (country FR), the United Kingdom (country GB), Hong Kong (country HK), Hungary (country HU), Indonesia (country ID), Ireland (country IE), Israel (country IL), Latvia (country LV), Mexico (Profeco shelf prices) (country MX), Malaysia (shop shelf prices, DOSM PriceCatcher) (country MY), New Zealand (country NZ), Singapore (country SG), Taiwan (country TW), Taiwan (Taichung City markets) (country TW), countries FEWS NET monitors (Kenya, Central America, Colombia, southern Africa) (country AO, BW, CO, GT, HN, KE, MG, NA, NI, SV, SZ, TJ, ZM), countries WFP surveys (Africa, Asia, Middle East, Latin America) (country AF, AM, BD, BF, BI, BJ, BO, CD, CF, CI, CM, DJ, ET, GM, GN, GW, HT, ID, IN, IQ, JO, KG, LA, LB, LR, LS, ML, MM, MR, MW, MZ, NE, NG, NP, PH, PK, RW, SD, SL, SN, SO, SS, TD, TG, TL, TZ, UA, UG, YE, ZW), the United States (country US), Uruguay (consumer ministry shelf prices) (country UY) or South Africa (country ZA), or how that price has changed over the last year. Returns the official average or median shop price that the national statistics office publishes for a standard item, built from the shelf prices its price collectors record in shops for the consumer price index (shelf prices observed by price collectors, not receipts and not what one shopper paid; some offices also use retailers' scanner data), with the exact item definition (for example 'Full-fat milk, per 2 litres'), the unit, the reference month, the change on a year earlier where the office publishes comparable figures (an answer carries none where the office advises against comparing months), the official source and licence. Each country defines its own standard items, so the item definition in the answer matters and related definitions are listed. How fresh: United Arab Emirates: monthly (the page states its own 'Last Updated' date); Argentina (Precios Claros supermarket shelf prices): daily files, one per weekday; we read the newest; Austria and New Zealand: monthly, in the middle of the following month; collected into our price library every day, each answer states its reference month; Bulgaria: annual: the 2025 figures are the newest published (checked 10 November 2026); Canada: monthly, not live: Statistics Canada publishes each month's averages about five weeks after the month ends (August 2026 was released on 7 October 2026), and every answer states its reference month; Switzerland: monthly: BLW adds the newest month during the following month, and the answer names the month it covers; Chile (ODEPA shelf prices): weekly (newest completed week); Czechia: monthly: newest month published 10 November 2026 (October 2026), about 10 days after the month ends; France: monthly items in the middle of the following month, annual items in January; collected into our price library every day, each answer states its reference month or year and INSEE's last-update date; the United Kingdom: monthly: ONS publishes each month's file about three to four weeks after the month ends (August 2026 appeared in late September); our copy is refreshed daily and each answer states its reference month; Hong Kong and Taiwan (Taichung City markets): daily; Hungary: monthly: the September 2026 prices were published on 7 October 2026 (about one week after the month ends); Indonesia: daily, one to two days behind; every answer names the day; Ireland: monthly, published with the Consumer Price Index (usually the second week of the following month); each answer states its reference month; Israel: daily (every store file is rebuilt overnight; our collector reads them once a day); Latvia: monthly, usually in the second week of the following month; each answer states its reference month; Mexico (Profeco shelf prices): monthly, about 7 weeks behind; Malaysia (shop shelf prices, DOSM PriceCatcher): DOSM refreshes the monthly file daily; our copy is refreshed daily and each answer names the newest price date; Singapore: monthly, about three weeks after the month ends, with the month named in every answer; Taiwan: daily (the retail figure changes about every third day); each answer states its date; countries FEWS NET monitors (Kenya, Central America, Colombia, southern Africa): monthly; the newest month for a country is usually 1 to 3 months old and the answer says which month; countries WFP surveys (Africa, Asia, Middle East, Latin America): WFP files are updated about monthly (HDX file last modified 2026-10-12); the newest observation in a country is often 1 to 5 months old; our copy is refreshed daily; the United States: monthly: BLS releases the new month about the 10th to 14th of the following month; our copy is refreshed daily and each answer states its reference month; Uruguay (consumer ministry shelf prices): daily file; the newest day in it is usually several weeks behind; South Africa: monthly, about three weeks after the end of the month; collected into our price library every day, each answer states its reference month. This is a published national (or regional) average, not a range of individual transactions, so the range fields can be null. Do not use for the price at a particular supermarket or online shop, loyalty-card or special-offer prices, restaurant meals, petrol or diesel, or for other countries.",
