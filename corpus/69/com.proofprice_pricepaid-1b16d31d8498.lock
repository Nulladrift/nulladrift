l); NO = Norway (official average price per m² from Statistics Norway, by municipality or county; an official statistic, not individual sales); NZ = New Zealand (official median sale prices of residential sales by area, monthly); PL = Poland (national Real Estate Price Register: notarised flat sales in the 19 biggest cities); PT = Portugal (official INE median sale price per m², quarterly, by region and municipality); QA = Qatar (villas, houses and residential buildings; registered sales; the bulletin's newest sale is Dec 2025); SE = Sweden (official average purchase price from Statistics Sweden, by municipality or county; an official statistic, not individual sales); SG = Singapore HDB resale flats; TW = Taiwan (Ministry of the Interior actual price registration: every registered sale, summarised by city or county and district); US = United States, partial: Connecticut, New York City, Cook County IL, Washington DC, Maricopa County AZ and Allegheny County PA (Pittsburgh area) only; not nationwide; US = United States, partial: Connecticut, New York City, Cook County IL, Washington DC and Maricopa County AZ (Phoenix area) only; not nationwide; US = United States, partial: Connecticut, New York City, Cook County IL and Washington DC by town; the whole country for new houses (Census Bureau national median); US = United States, partial: Connecticut, New York City, Cook County IL and Washington DC only; not nationwide; US = United States, partial: Connecticut, New York City, Cook County IL, Washington DC, Maricopa County AZ, Allegheny County PA and Detroit MI only; not nationwide; US = United States, partial: Connecticut, New York City and Cook County IL (Chicago area) only; not nationwide",
