          "description": "Use this when a user asks what traders paid for vegetables or fruit (cabbage, tomatoes, cucumbers, onions, bananas, pineapples, guavas, melons, grapes...) at the wholesale produce markets of Argentina (country AR), Chile (country CL) or Taiwan (country TW), or what the price range at the wholesale market was this week. Returns a range built from the market's own daily trading records (median, 10th to 90th percentile, lowest and highest, number of records) for the newest few days, per kilogram, with the volume traded, the markets included and the official source and licence. A record is the average price of one variety at one market on one day. How fresh: Argentina: daily on working days, published in monthly ZIP files; the newest day is usually the previous working day; Chile: daily on working days, newest day is usually the previous working day; Taiwan: daily, trading days only (a closed market publishes nothing). These are wholesale prices between traders, not what a shopper pays and not what a farmer receives. Do not use for supermarket or shop prices, for the price one farm received, for flowers, meat or fish, for futures prices, or for other countries.",
