              "medicine": {
                "description": "Medicine brand or active-substance name, e.g. 'doliprane' or 'paracetamol'. Only the first word is used. BR: Portuguese active ingredient (first match wins): 'dipirona', 'amoxicilina', 'insulina', 'ibuprofeno', 'paracetamol'; a few English names work ('aspirin', 'metformin'). Answers the most-awarded presentation (strength and form shown) per unit, with other presentations listed. Public tender award prices, not pharmacy prices. CZ: Czech brand name, first word ('metformin', 'atorvastatin', 'ventolin') or an ATC code ('A10BA02' metformin, 'C10AA05' atorvastatin, or a group like 'C10AA'). No active-substance search. Needs 5+ packs on the list. ES: Spanish active-ingredient or brand name, first word used ('paracetamol', 'ibuprofeno', 'omeprazol', 'dolocatil'). Needs 5+ packs on sale under that name. FI: active substance or brand, first word used ('paracetamol' or Finnish 'parasetamoli', 'ibuprofen', 'atorvastatin', 'burana'). Needs 5+ interchangeable packs under that name. Interchangeable medicines only; notified prices incl. VAT, not what patients paid. FR: brand or active substance, first word used ('doliprane', 'paracetamol', 'amoxicilline'). Needs 5+ priced packs under that name. GB: generic or brand name, optionally with strength and form ('omeprazole', 'atorvastatin 20mg', 'Lipitor', 'paracetamol tablets'). NHS names follow the British National Formulary (the common American names are mapped). Returns the NHS net ingredient cost per unit and per 28-unit supply. IT: Italian active-substance or brand name, first word used ('paracetamolo', 'amoxicillina', 'glucobay'). Needs 5+ packs under that name. Off-patent reimbursable (class A) medicines only. JP: the active ingredient, in English ('paracetamol', 'amlodipine', 'metformin') or Japanese ('アムロジピン'); first word used. Not brand names. Needs 5+ listed products. Official reimbursement price per tablet, capsule, gram, millilitre or vial, not what a patient paid. NZ: English chemical or brand name, first word used ('paracetamol', 'amoxicillin', 'panadol'). Needs 5+ subsidised packs under that name. Subsidised community medicines only; list prices, not what patients paid. PL: active substance ('metformin', 'atorvastatin', 'rosuvastatin') or Polish brand name, first word. Needs 5+ packs on the list. PT: only an average over all packs: medicine=all (all medicines) or medicine=generics (generic medicines). No single-medicine prices. SE: substance or brand name, first word used ('paracetamol', 'quetiapine', 'alvedon'); common English names are mapped to Swedish. Needs 5+ packs under that name. Substitutable medicines only; posted prices, not what patients paid. TR: Turkish brand name, first word used ('zyprexa', 'abilify', 'zyrtec'). Needs 5+ listed packs under that brand. Reference ex-factory prices in EUR, not pharmacy prices. TW: the active ingredient in English ('amlodipine', 'metformin', 'acetaminophen') or an ATC code ('C08CA01'); first word used. Not brand names. Needs 5+ listed items. Official payment price per tablet, capsule or other listed item, not what a patient paid. US with basis=part_b_asp: the generic name as CMS describes the drug ('pembrolizumab', 'bevacizumab', 'ranibizumab', 'denosumab') or the HCPCS code (J9271). Brand names are not in the file. Returns Medicare's payment limit per billing dosage (for example per 1 mg). US with basis=mfp: a brand or generic name of a drug selected for Medicare price negotiation ('Eliquis', 'apixaban', 'Stelara', 'Ozempic', 'Ibrance'). Returns the negotiated maximum fair price for a 30-day supply in force today. US with basis=medicare_spend: a brand or generic name as CMS lists it ('Lipitor', 'atorvastatin', 'Eliquis', 'metformin'); strength is ignored. Returns Medicare Part D's average spending per dosage unit in the newest data year. US with basis=medicaid: a brand or generic name ('Lipitor', 'atorvastatin', 'Eliquis', 'metformin'); strength is ignored. Returns the average Medicaid reimbursement per dosage unit in the newest quarter. US: generic or brand name, optionally with strength and form ('atorvastatin', 'atorvastatin 20mg', 'metformin 500 mg tablet', 'Lipitor'). NADAC uses American generic names ('acetaminophen' for paracetamol, 'albuterol' for salbutamol; the common British names are mapped). Returns the per-unit cost to the pharmacy.",
                "type": "string"
              }
