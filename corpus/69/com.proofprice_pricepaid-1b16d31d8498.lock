        {
          "name": "pricepaid_border_prices",
          "title": "Border prices: customs unit values per kilogram",
          "description": "Use this when a user asks what traded goods are worth at the border, per kilogram, as declared to customs: for example what a country pays per kg to import wheat, diesel, cheese or timber, or earns per kg exporting whisky or steel, in the EU member states listed (country FR, DE, ES, IT, NL, BE, IE, PL, PT, DK, SE) or the United Kingdom (country GB), optionally from or to one partner country. Returns the customs value divided by the net weight (a value-weighted average per kg in the reporting country's currency), a range between the 10th and 90th percentile of the individual customs lines weighted by weight, the months it covers, the biggest partner countries and the official source and licence. This is a customs unit value (price_type official_statistic) built from declared trade values and weights, not a shelf price, not a wholesale quote and not a receipt, so there is no sample size. How fresh: the EU member states listed: monthly: Eurostat publishes each month's trade statistics about 2.5 months after the month ends; our figures are read live and each answer states its months; the United Kingdom: monthly: HMRC publishes each month's trade statistics about six weeks after the month ends; our figures are read live and each answer states its months. Do not use for what a shopper pays in a shop, for a single contract or shipment, for futures or spot quotes, for services, or for countries that are not listed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "FR, DE, ES, IT, NL, BE, IE, PL, PT, DK, SE = EU member states (Eurostat Comext: customs value per kilogram of goods imported or exported, by customs commodity code and partner country, monthly); GB = United Kingdom (HMRC Overseas Trade Statistics: customs…",
                "enum": ["FR", "DE", "ES", "IT", "NL", "BE", "IE", "PL", "PT", "DK", "SE", "GB"],
                "type": "string"
              },
              "direction": {
                "description": "Goods coming in (imports, default) or going out (exports). EU: imports (default) or exports of the country asked about, trade with all other countries. GB: imports (default) or exports, as the UK reports them (EU and non-EU trade combined).",
                "enum": ["imports", "exports"],
                "type": "string"
              },
              "months": {
                "description": "How many months to include, ending with the period. Default 1. More months smooth out lumpy shipments. EU: months to include, 1 to 12 (default 1). GB: months to include, 1 to 12 (default 1).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "partner": {
                "description": "Optional partner country (ISO code such as 'DE' or 'US', or its name): where the goods came from (imports) or went to (exports). Leave out for all partners. EU: optional partner country, as a 2-letter ISO code (DE, US, CN, BR ...) or…",
                "type": "string"
              },
              "period": {
                "description": "Optional last month to include, as YYYY-MM. Default: the newest month the customs authority has published. EU: the last month to include (YYYY-MM). Eurostat publishes about 2.5 months after the month ends; default is the newest published…",
                "type": "string"
              },
              "product": {
                "description": "The goods: an everyday word such as 'wheat', 'diesel', 'cheese', 'timber', 'steel', 'whisky', or a customs commodity code (HS/CN) of 4 to 8 digits such as '1001' or '271019'. EU: an everyday word (diesel, petrol, crude oil, natural gas…",
                "type": "string"
              }
            },
            "required": ["country", "product"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "description": "Price range from real records: price, sample_size, period, confidence, source and licence.",
            "properties": {
              "confidence": {
                "description": "high, medium, low or insufficient.",
                "type": "string"
              },
              "period": {
                "additionalProperties": {},
                "properties": {
                  "from": {
                    "type": ["string", "null"]
                  },
                  "to": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              },
