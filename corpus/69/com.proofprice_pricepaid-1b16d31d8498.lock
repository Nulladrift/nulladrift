        {
          "name": "pricepaid_rent_prices",
          "title": "Rents paid",
          "description": "Use this when a user asks what rent tenants actually pay or have agreed for a home in a town, area or postcode, how much it costs to rent a flat, house or room there, or how rents compare, in South Australia, Australia (country AU), Tasmania, Australia (country AU), New South Wales, Australia (country AU), Queensland, Australia (country AU), Canada (country CA), Switzerland (country CH), Germany (country DE), Catalonia, Spain (country ES), Finland (country FI), France (country FR), England and Wales (country GB), Hong Kong (country HK), Ireland (country IE), Norway (country NO), New Zealand (country NZ), Portugal (country PT), Sweden (country SE), Singapore public housing (country SG), Taiwan (country TW) or United States (country US). These are rents actually agreed or paid, taken from official records and statistics: registered tenancies, rental bond lodgements, approved rentals, or official rent statistics built from administrative records of tenancies. Where the source holds individual rents the answer is a median with a typical range (10th–90th percentile) and the number of rents; where the source publishes an average or median (price_type official_statistic) the range fields are null and there is no sample size. Every answer states its unit (rent per month or per week, in the local currency), the period covered, a confidence label, and the official source and licence. How fresh: South Australia, Australia: quarterly; a quarter's report is posted about six weeks after it ends (April-June 2026 was posted on 11 Aug 2026); Tasmania, Australia: monthly; a month's file appears about two to three weeks after the month ends; New South Wales, Australia: monthly; a month's lodgements are published in the first days of the next month; Queensland, Australia: quarterly; the RTA updates the workbook in April, July, October and January (the September quarter was published on 15 Oct 2026); Canada: annual: the October survey is released in the months after it (the October 2025 figures were released on 17 December 2025), and every answer states its survey month; Switzerland: yearly; the latest year published is 2024 (published in early 2026); Germany: static: the census date is 15 May 2022 (published 2024); the answer states that date and is not updated; Catalonia, Spain: quarterly, a few weeks after each quarter ends; the daily collector keeps a copy for history and outages; Finland: quarterly; the newest quarter in the table on 22 Oct 2026 was 2026Q3; France: annual; the 2025 results were published in October 2026; England and Wales: monthly; each release adds a month about six weeks after it ends (the ONS labels these official statistics in development); Hong Kong: monthly, about 6 weeks after the month ends; the newest three months are provisional; Ireland: quarterly; a quarter is published about five months after it ends; Norway: annual; the 2025 survey was published on 22 December 2025; New Zealand: monthly; the files run about two months behind (the October 2026 files end in August 2026) and the latest month can still change; Portugal: quarterly, published about three months after the quarter ends (the 2nd Quarter 2026 figures were released on 29 September 2026); each answer states its quarter; Sweden: annual; the 2026 survey (rents at the start of 2026) was published on 2 October 2026; Sweden: annual; rents at 31 December 2025, published on 2 October 2026; Singapore public housing: monthly; the previous month's approvals appear in the first days of the next month; Taiwan: the Ministry publishes every 10 days (the 1st, 11th and 21st); a tenancy appears about one to two months after the contract date. Our collector re-reads the releases daily, and answers cover whole calendar months ending at least 30 days before the newest contract in the register; United States: yearly (new 5-year release each December); the release read on 3 Nov 2026 was 2020-2024. Do not use for asking rents or listings, holiday lets, commercial rent, rent for a specific address, home sale prices, or other countries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bedrooms": {
                "description": "Number of bedrooms (0 = studio). Leave out for all sizes. AU (South Australia): 1, 2, 3 or 4 (4 means four or more); studios (0) are not published. AU (Tasmania): 0 (studio), 1, 2, 3 or 4 (4 means four or more). AU: 0 (studio), 1, 2, 3 or 4 (4 means four or more). AU (Queensland): flats 1-3, houses 2-4, townhouses 2-3. With no type and no bedrooms the answer is the most common dwelling in the postcode. CA: 0 (bachelor), 1, 2 or 3 (three or more). Leave out for two bedrooms, CMHC's usual headline size; the answer lists every size. CH: not split by rooms or bedrooms in this table; leave out. DE: not supported (all sizes together); leave out. ES: not used. FI: optional: the number of ROOMS the Finnish way (a living room counts): 1, 2 or 3 (3 means three or more). Leave out for all sizes. FR: 0 (studio) to 3 or more; leave out for all sizes. France counts rooms including the living room, so 1 bedroom = 2 rooms (T2). GB: 1, 2, 3 or 4 (4 means four or more); leave out for all sizes. Studios are not published. Not together with property_type. HK: ignored; the RVD groups flats by saleable area. Use flat_class (A under 40 m², B 40–69.9, C 70–99.9, D 100–159.9, E 160+). Default B. IE: 1, 2, 3 or 4 (4 means four or more); leave out for all sizes. Studios are not published. NO: not used; use rooms instead (Norway counts rooms). NZ: not applied. MBIE publishes bedroom splits only by unnamed Statistics NZ area codes, not by place name; the answer says so. PT: not supported (INE does not split by bedrooms). SE: required; give the number of ROOMS (Sweden counts rooms, not bedrooms): 1, 2, 3 or 4 (4 means four or more). SE with new_build=true: optional number of ROOMS (1, 2, 3 or 4 = four or more); leave out for all new-build flats together. SG: ignored; HDB counts rooms, not bedrooms. Use flat_type ('4-ROOM'). TW: 0 (studio or open-plan) to 4; 5 means five or more. Leave out for all sizes. Not for rooms. US: not used (all sizes).",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "country": {
                "description": "AU = Australia, South Australia only here (Private Rent Report, by suburb or postcode; New South Wales and Queensland have their own sources); AU = Australia, Tasmania only here (rental bond lodgements); New South Wales, Queensland and South Australia have their own sources; AU = Australia, New South Wales only (rental bonds); AU = Australia, Queensland only (RTA rental bond statistics; New South Wales has its own source); CA = Canada (CMHC Rental Market Survey, average rents of purpose-built rental units, official statistic); CH = Switzerland (BFS: average net rent of tenant and co-operative homes by canton and length of tenancy; yearly); DE = Germany (Zensus 2022 average net cold rent per m2 around the city centre, census of May 2022, official statistic); ES = Spain (Catalonia only: INCASOL registered lease deposits); FI = Finland (official average rent per m² of market-rate rented flats from Statistics Finland, by town, region or district); FR = France (observed rents in about 50 agglomerations, local rent observatories); GB = England and Wales (ONS average private rents; Scotland and Northern Ireland are not covered); HK = Hong Kong (Rating and Valuation Department, average rents of private domestic flats by class and region, official statistic); IE = Ireland (registered tenancies, Residential Tenancies Board); NO = Norway (Statistics Norway rental market survey); NZ = New Zealand (rental bond data from MBIE Tenancy Services; weekly rent in NZD); PT = Portugal (official INE median rent per m² per month of new leases, quarterly, by region and all 308 municipalities); SE = Sweden (Statistics Sweden rent survey); SE = Sweden (Statistics Sweden rent survey; with new_build=true, rents of newly built rented flats); SG = Singapore HDB public-housing flats; TW = Taiwan (Ministry of the Interior actual price registration of rentals: every declared residential tenancy, summarised by city or county and district); US = United States (official median gross rent from the Census Bureau's American Community Survey, for the country, states, counties, metro areas and cities of 50,000+ people)",
                "enum": ["AU", "CA", "CH", "DE", "ES", "FI", "FR", "GB", "HK", "IE", "NO", "NZ", "PT", "SE", "SG", "TW", "US"],
                "type": "string"
              },
              "flat_class": {
                "description": "HK only: RVD flat class by saleable area, A (under 40 m²), B (40–69.9), C (70–99.9), D (100–159.9) or E (160 and over). Default B.",
                "type": "string"
              },
              "flat_type": {
                "description": "SG only: HDB flat type, one of 1-ROOM, 2-ROOM, 3-ROOM, 4-ROOM, 5-ROOM, EXECUTIVE ('4 ROOM' also works). Leave out for all types.",
                "type": "string"
              },
              "house_type": {
                "description": "Kind of house, for sources that publish houses by type (needed with property_type house there). CA: not used (houses are not published). DE: not used. GB: detached, semi-detached or terraced; required with property_type house. HK: not used. IE: detached, semi-detached or terraced; required with property_type house. NZ: not applied (see property_type). TW: not available (the register does not say detached / semi-detached / terraced); use property_type house.",
                "enum": ["detached", "semi-detached", "terraced"],
                "type": "string"
              },
              "months": {
                "description": "How many recent months to include, for sources that hold individual rents. Ignored by sources that publish one figure per quarter or month. AU (South Australia): ignored; the report gives one median per quarter (the latest is returned). AU (Tasmania): 3 or 12 (up to 4 uses the latest 3 months, longer uses 12). By default the latest 3 months, widening to 12 when an area is quiet. AU: 3 or 12 (anything up to 4 uses the latest 3 months, longer uses 12). By default the latest 3 months, widening to 12 when a postcode is quiet. AU (Queensland): ignored; the RTA publishes one median per quarter (the latest is returned). CA: ignored; the figure is for the newest October survey. CH: ignored; the figure is for the latest year published. DE: ignored; the figure is the census of 15 May 2022. ES: ignored; the figure is for the latest published quarter. FI: ignored; the figure is for the newest quarter with at least 5 observations. FR: ignored; the figure is for the latest year published. GB: ignored; the figure is for the latest month published. HK: ignored; the answer is the newest usable month, with the last 12 months in extra. IE: ignored; the figure is for the latest quarter published. NO: ignored; the figure is for the latest year published. NZ: ignored; the figure is for the latest month MBIE has published (about two months behind). PT: ignored; INE publishes one median per quarter, covering the 12 months to the quarter's end (the latest is returned). SE: ignored; the figure is for the latest year published. SG: window of recent months, 1 to 36. Default 12. TW: 12 or 24 whole calendar months; up to 18 gives 12 (24 if a place has too few tenancies in 12), more gives 24. The window ends at the last month that is at least 30 days old. US: ignored; the figure is the latest 5-year estimate.",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "new_build": {
                "description": "SE only: true = rents of newly built rented flats (built from 2022) instead of the all-flats rent survey.",
                "type": "boolean"
              },
              "postcode": {
                "description": "Postcode, for a precise area. AU (South Australia): a four-digit postcode, e.g. 5000 (Adelaide), 5067 (Norwood), 5045 (Glenelg), 5290 (Mount Gambier). AU (Tasmania): a four-digit postcode starting with 7, e.g. 7000 (Hobart), 7250 (Launceston), 7310 (Devonport), 7010 (Glenorchy). AU: a four-digit NSW postcode, e.g. 2000 (Sydney CBD), 2150 (Parramatta), 2500 (Wollongong). AU (Queensland): a four-digit postcode, e.g. 4000 (Brisbane city), 4217 (Surfers Paradise), 4870 (Cairns), 4350 (Toowoomba). NSW postcodes (2xxx) are answered by the NSW source. CA: not used; give a town. CH: not used (rents are published by canton); give the canton in town. DE: not supported; give the city as town. ES: not used. FI: not used. FR: not used; give the agglomeration as town. GB: not used (rents are published by local authority); give the area name in town. HK: not used (Hong Kong has no postcodes); give a region. IE: not used (Eircodes are not published); give a town. NO: not used; give a price zone as town. NZ: not used; rents are published by territorial authority and region. PT: not supported (INE publishes by region and municipality); give the municipality as town. SE: not used. SG: not used; give an HDB town. TW: not supported (the register has no postcodes); give the city, county or district as town. US: not used.",
                "type": "string"
              },
              "property_type": {
                "description": "Kind of home: apartment (same as flat), house or room. Default 'any'. AU (South Australia): apartment (flat or unit), house or any. Rooms are not published. AU (Tasmania): apartment (unit or flat), house (includes townhouses and semi-detached) or any. Rooms are not published. AU: apartment (flat or unit), house (includes terraces, townhouses and semi-detached) or any. Rooms are not published. AU (Queensland): apartment (flat), house or any. Townhouses are published separately and appear in extra.other_dwellings; rooms are not published. CA: apartment (or flat) means apartment buildings of three or more units; leave out for rows and apartments of three or more units. Houses and rooms are not published. CH: not split by property type; leave out. DE: leave out. The census figure covers all rented dwellings together (flats and houses). ES: not used (all homes together). FI: not used (rented flats). FR: apartment (flat), house or leave out for all homes. Single rooms are not published. GB: apartment (flat) or house; leave out for all homes. For house, also give house_type. Rooms are not published. Not together with bedrooms. HK: ignored; private domestic flats only. Use flat_class for the size. IE: apartment (flat) or house; leave out for all homes. For house, also give house_type. Rooms are not published. NO: not used (the survey does not split by home type). NZ: not applied. The published place files do not split by dwelling type; the answer covers all new private tenancies and says so. PT: INE publishes one figure for all dwellings; only 'any' has an answer. SE: not used (flats in rented buildings). SG: ignored; every record is an HDB flat. Use flat_type for the size. TW: any (whole homes and self-contained studios), apartment, house (透天厝) or room (a room let separately in a shared home: 分租套房, 分租雅房; kept apart from every other figure). US: not used (all rented homes).",
