          "title": "Cost of a healthy diet per person per day",
          "description": "Use this when a user asks how much it costs to eat healthily in a country, for example the cost of the cheapest healthy diet per person per day, how that cost changed on a year earlier, or how much of it goes on fruit, vegetables, animal-source foods, legumes and nuts, oils and fats or starchy staples, in about 68 countries worldwide (World Bank estimates) (country IE, GB, FR, ES, PT, IT, DE, NL, BE, AT, PL, DK, SE, NO, FI, GR, LU, CH, IS, CZ, HU, RO, SK, SI, EE, LV, LT, CY, MT, TR, UA, US, CA, MX, BR, AR, CL, CO, PE, AU, NZ, SG, JP, KR, TW, HK, CN, IN, ID, TH, VN, MY, PH, PK, BD, LK, AE, SA, IL, EG, MA, ZA, NG, KE, GH, TZ, UG, ET). Returns the World Bank's modelled cost of a least-cost healthy diet, built from the food prices collected for the International Comparison Program: the figure in the country's own currency and in international (PPP) dollars, the year, the change on the previous year, the years since 2017, and the official source and licence. This is a modelled national estimate (price_type official_statistic), not a shop receipt, not what one household paid and not a range, so the range fields are null and there is no sample size. How fresh: roughly yearly: version 5.0 was last updated on 2026-07-21 and holds 2017 to 2025; every answer states its year. Do not use for the price of a particular food or shop, restaurant meals, a family's real food bill, or for countries that are not listed.",
