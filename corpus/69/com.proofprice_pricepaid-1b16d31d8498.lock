od ('Brooklyn', 'Williamsburg'), 'Chicago', 'Cook County' or a Cook County assessment township ('Evanston', 'Oak Park'). Add the state if a name exists in two places ('Hartford, CT'). Required unless postcode is a New York City ZIP.",
