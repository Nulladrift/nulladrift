culture: national average daily rice prices, retail, wholesale and paddy); TW = Taiwan (Taichung City markets only); Countries as ISO codes: AO = Angola, BW = Botswana, CO = Colombia, GT = Guatemala, HN = Honduras, KE = Kenya, MG = Madagascar, NA = Namibia, NI = Nicaragua, SV = El Salvador, SZ = Eswatini, TJ = Tajikistan, ZM = Zambia. FEWS NET market prices of staple foods; a country or food with no recent prices from 5 or more markets answers 'no matches'.; Countries as ISO codes: AF = Afghanistan, AM = Armenia, BD = Bangladesh, BF = Burkina Faso, BI = Burundi, BJ = Benin, BO = Bolivia, CD = Democratic Republic of the Congo, CF = Central African Republic, CI = Cote d'Ivoire, CM = Cameroon, DJ = Djibouti, ET = Ethiopia, GM = Gambia, GN = Guinea, GW = Guinea-Bissau, HT = Haiti, ID = Indonesia, IN = India, IQ = Iraq, JO = Jordan, KG = Kyrgyzstan, LA = Laos, LB = Lebanon, LR = Liberia, LS = Lesotho, ML = Mali, MM = Myanmar, MR = Mauritania, MW = Malawi, MZ = Mozambique, NE = Niger, NG = Nigeria, NP = Nepal, PH = Philippines, PK = Pakistan, RW = Rwanda, SD = Sudan, SL = Sierra Leone, SN = Senegal, SO = Somalia, SS = South Sudan, TD = Chad, TG = Togo, TL = Timor-Leste, TZ = Tanzania, UA = Ukraine, UG = Uganda, YE = Yemen, ZW = Zimbabwe. World Food Programme market surveys of staple foods; a country with no recent survey of 5 or more markets answers 'no matches'.; US = United States (Bureau of Labor Statistics: average retail prices of about 45 standard food and drink items, monthly, national and four regions); UY = Uruguay (Defensa del Consumidor shelf prices reported by shops, UYU with IVA; newest data is usually several weeks old); ZA = South Africa (Stats SA: monthly average retail prices in rand of everyday goods, all urban areas)",
