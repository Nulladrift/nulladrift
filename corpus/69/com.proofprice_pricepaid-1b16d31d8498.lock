          "description": "Use this when a user asks what supplementary (top-up, complementary) health insurance costs per month on average, for a reference person such as someone aged 60, a single adult or a couple with children, in France (country FR). Returns the average monthly premium that the official survey of insurers publishes for that profile and contract type, the survey year, a confidence label, and the official source and licence. These are survey averages across insurers (no record count is published), not a personal quote, not a price list and not an amount one person paid. How fresh: biennial: the survey years 2019, 2021 and 2023 are published (newest 2023); each answer states its survey year. Do not use for compulsory basic health cover, for a personal quote, or for countries that are not listed.",
