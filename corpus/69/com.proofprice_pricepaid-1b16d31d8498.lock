              "trading_hub": {
                "description": "US only: CAISO trading hub NP15 (northern California, default), SP15 (southern) or ZP26 (central); north, south and central also work.",
                "type": "string"
              },
              "zone": {
                "description": "Bidding zone, only where a country has more than one: DK = DK1 (west, default) or DK2 (east). IT answers northern Italy (IT-North), NO south-west Norway (NO2); other countries have one zone.",
                "type": "string"
              }
