          "description": "Use this when a user asks the current price of petrol, diesel, E10, E85, LPG or CNG near a place in Queensland, Western Australia, Brazil, Ontario, Canada, Colombia, Costa Rica, Czechia, Spain, the EU (national averages), Finland, France, the United Kingdom (national averages), Hong Kong, Italy, Luxembourg, Montenegro, Mexico, Malaysia, the Netherlands, Norway, New Zealand, Portugal (mainland), Singapore, Thailand, Taiwan, the United States or Uruguay, or where fuel is cheapest there. Returns the median and typical range of pump prices across stations in the area, the three cheapest stations, and the official source and licence. How fresh: Queensland: monthly file, published about a month after the month ends (the newest data is usually 5 to 8 weeks old); Western Australia: daily: the current month's file is extended each day with the previous day's prices; our copy is taken once a day and every answer states the day it is for; Brazil: ANP publishes the survey as one file per month, so the newest survey week is usually one to four weeks old. Our copy is refreshed daily, and every answer states the survey week it describes; Ontario: weekly (Mondays, before the end of the business day; the next working day after a holiday); Canada: monthly, not live: Statistics Canada publishes each month's averages about two weeks after the month ends (August 2026 was released on 14 September 2026), and every answer states its reference month; Colombia: one figure per station per month, published at the start of the month; the answer states the month; Costa Rica: updated when ARESEP fixes a new tariff (about once a month, sometimes more often); every answer states the date the price applies from; Czechia: weekly, with the ISO week named in every answer; history from 2016; Spain: several times a day; the EU (national averages): weekly: Monday prices, published that week; Finland: monthly, about three months after the month ends (table updated 24 September 202