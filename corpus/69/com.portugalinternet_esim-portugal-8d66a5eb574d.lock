      },
      "instructions": "Portugal Internet sells a truly unlimited data eSIM for travellers to Portugal (mainland, Madeira and the Azores), priced by trip length. To help a traveller buy one: get_esim_portugal_plans for the tiers, then quote_esim_portugal with their first and last day for the live price and a booking link with the dates chosen; give them the link. You cannot complete payment: the traveller pays at checkout. Quote only prices these tools return.",
      "tools": [
        {
          "name": "get_esim_portugal_plans",
          "title": "Portugal eSIM prices",
          "description": "The Portugal Internet eSIM for travellers to Portugal (mainland, Madeira, Azores): truly unlimited data, priced by trip length. Returns the price tiers and what the eSIM includes. quote_esim_portugal gives the exact price for given dates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
