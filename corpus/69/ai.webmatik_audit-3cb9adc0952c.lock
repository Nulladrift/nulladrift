      "serverInfo": {
        "name": "Webmatik",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Webmatik audits websites across 8 categories (SEO, performance, AI readiness/GEO, conversion, retention, UI/UX, accessibility, security). Use run_audit to start (requires an API key from https://webmatik.ai/account), then poll get_audit until status=completed.",
      "tools": [
        {
          "name": "get_audit",
          "description": "Fetch a Webmatik audit by id. While background analysis (AI vision, AI search visibility) is still running the response says so — poll every ~15s until status is \"completed\". Returns scores per category, failed checks, and the prioritized recommendations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apiKey": {
                "description": "Webmatik API key (wmk_...). Optional if sent as Authorization: Bearer header.",
                "type": "string"
              },
              "auditId": {
                "description": "Audit id returned by run_audit",
                "type": "string"
              }
            },
            "required": ["auditId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:29b583435cca669462b975c41eff90f5201749131a30f7985ef012468035b2a9"
        },
        {
          "name": "run_audit",
          "description": "Start a full Webmatik growth audit of a website: SEO, performance (Core Web Vitals), AI readiness (GEO), conversion, retention, UI/UX, accessibility, and security — 70+ checks with a 0–100 Growth Score and a prioritized action plan. The audit takes 60–180 seconds; this returns an auditId immediately — poll get_audit for the result. Requires a Webmatik API key (get one at https://webmatik.ai/account, Starter/Growth plans).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apiKey": {
                "description": "Webmatik API key (wmk_...). Optional if sent as Authorization: Bearer header.",
                "type": "string"
              },
              "url": {
                "description": "Website URL to audit, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d2ca625f35ec8c122a71612718f8fc7f3d7f873c7643bd2a18fcc8bdab6d734e"
        }
      ],
