{
  "lockfileVersion": 2,
  "subjects": {
    "com.studiotvai/llm-vram": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://studiotvai.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "studiotv-llm-vram",
        "title": "StudioTV LLM VRAM Calculator",
        "version": "1.0.0",
        "websiteUrl": "https://studiotvai.com/llm-vram-calculator"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Answers whether an open LLM fits on a GPU, with the same engine as https://studiotvai.com/llm-vram-calculator. Give the calculator_url to the user so they can adjust the setup.",
      "tools": [
        {
          "name": "estimate_vram",
          "title": "Does this LLM fit on this GPU?",
          "description": "GPU memory, number of GPUs, speed and rental cost to run an open LLM. Works for the models listed at https://studiotvai.com/api/models.json and any Hugging Face model id or link. Uses the real KV cache of each architecture (sliding window, hybrid linear attention, MLA).",
          "inputSchema": {
            "properties": {
              "concurrent_requests": {
                "description": "Requests served at the same time, each with its own KV cache. Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "context": {
                "description": "Tokens per request (prompt + output). Default 8192.",
                "minimum": 1,
                "type": "integer"
              },
              "engine": {
                "description": "Serving engine. Default: vllm on data-center GPUs, llamacpp elsewhere.",
                "enum": ["vllm", "sglang", "trtllm", "llamacpp", "transformers"],
                "type": "string"
              },
              "gpu": {
                "description": "GPU id or name, e.g. \"rtx-4090\", \"H100\", \"mac-m4-max-128\". Default h100. List: https://studiotvai.com/api/gpus.json",
                "type": "string"
              },
              "gpu_count": {
                "description": "Number of GPUs, or \"auto\" (default) for the fewest that fit.",
                "type": ["integer", "string"]
              },
              "kv_cache": {
                "description": "KV cache precision. Default bf16. nvfp4: vLLM only, NVIDIA GPUs, models with standard attention (otherwise bf16 is used).",
                "enum": ["bf16", "fp8", "nvfp4", "q8_0", "q4_0"],
                "type": "string"
              },
              "model": {
                "description": "Model name or id (\"Llama 3.3 70B\", \"qwen3.8-27b\"), Hugging Face id (\"Qwen/Qwen3-32B\") or link.",
                "type": "string"
              },
              "weights": {
                "description": "Weight format. Default: the official checkpoint (native) or BF16.",
                "enum": ["native", "bf16", "fp8", "int8", "nvfp4", "mxfp4", "int4", "q8_0", "q6_k", "q5_k_m", "q4_k_m", "q3_k_m", "q2_k", "iq2_xxs", "fp32"],
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9b6353f43c7b6a9ffe4d57efa071fa5b90395c9f63037c439de648054e5cbb8f"
        },
        {
          "name": "gpu_prices",
          "title": "GPU rental prices",
          "description": "Cheapest on-demand price per GPU-hour from AWS, Google Cloud, Azure, RunPod, Vast.ai, Oracle Cloud, OVHcloud, Scaleway, Verda, Akash and UpCloud, checked every hour.",
          "inputSchema": {
            "properties": {
              "gpu": {
                "description": "GPU id or name. Omit for every GPU.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a318243cffc48f0ab574b8eb7227fc807563e008e166e9717fd38ad7c0fe3f41"
        },
        {
          "name": "models_that_fit",
          "title": "Which LLMs fit on this GPU?",
          "description": "Every listed open model that fits on the given GPU(s), largest first, with the most faithful weight format that fits.",
          "inputSchema": {
            "properties": {
              "concurrent_requests": {
                "description": "Requests served at the same time, each with its own KV cache. Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "context": {
                "description": "Tokens per request (prompt + output). Default 8192.",
                "minimum": 1,
                "type": "integer"
              },
              "engine": {
                "description": "Serving engine. Default: vllm on data-center GPUs, llamacpp elsewhere.",
                "enum": ["vllm", "sglang", "trtllm", "llamacpp", "transformers"],
                "type": "string"
              },
              "gpu": {
                "description": "GPU id or name, e.g. \"rtx-4090\".",
                "type": "string"
              },
              "gpu_count": {
                "description": "Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "kv_cache": {
                "description": "KV cache precision. Default bf16. nvfp4: vLLM only, NVIDIA GPUs, models with standard attention (otherwise bf16 is used).",
                "enum": ["bf16", "fp8", "nvfp4", "q8_0", "q4_0"],
                "type": "string"
              },
              "weights": {
                "description": "Weight format. Default: the official checkpoint (native) or BF16.",
                "enum": ["native", "bf16", "fp8", "int8", "nvfp4", "mxfp4", "int4", "q8_0", "q6_k", "q5_k_m", "q4_k_m", "q3_k_m", "q2_k", "iq2_xxs", "fp32"],
                "type": "string"
              }
            },
            "required": ["gpu"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4840b673bf5b7a3c3c407bd324dd6cfe080e98daae86fec44d372f701b1f1dd0"
        }
      ],
      "digest": "sha256:4422dead7cccc061a9789513970e8aeae1a6cb9e57baf622cfbb520751a51f50"
    }
  }
}
