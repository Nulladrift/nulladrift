        {
          "name": "stack",
          "title": "Choose a stack for an agent",
          "description": "For an agent that has to work with named systems (Linear, GitHub, Postgres…): what to connect for each, and which model to call. Give `systems`, `target` (local or cloud) and the `harness` the agent runs in; add `model.providers` to get a model too. Each system's choice is its owner's own MCP server or command-line tool, or none, picked by fixed rules from public records and not reviewed; `warnings` say what to read first, and `config.mcp_json` is a config to start from, with placeholders for every value the user supplies. A name that matches no system comes back in `unknown_systems`. Counts as one call. The answer depends on these goals; have the ones that matter in hand from the plan, the repository or the user before calling: cost (`optimize`, `max_price`, `budget`, `calls_per_user_month`); maker_origin (`origin`, `origin_strict`); users_in (`users_in`); data_kind (`needs`); scale (`scale`); accounts (`providers`, `infra.vendors`); clients (`clients`). On `stack`, the app's goals go by their own names at the top (`data_kind`, `users_in`, `scale`, `clients`), a model's parameters in `model.constraints` and providers in `model.providers`; infrastructure vendors are `infra.vendors`. The stack's own top-level `needs` are what the agent does (`web_search`, `web_reading`, `browser`), never a model's.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actions": {
                "description": "What the agent does; default [\"read\"]. untrusted_input (it reads text from outside) together with write or code_execution is warned about.",
                "items": {
                  "enum": ["read", "write", "code_execution", "untrusted_input"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "building": {
                "description": "What is being built, as skill tags. An owner's skills whose read carries more of them come first; a platform's owner's general skills are offered only when their read carries one. A skill not yet read keeps its place by date.",
                "items": {
                  "enum": ["api", "auth", "automation", "billing", "browser", "charts", "ci", "cli", "cloud", "code-review", "containers", "databases", "debugging", "deployment", "docs", "email", "evals", "files", "frontend", "git", "images", "infrastructure", "kubernetes", "logging", "mcp", "migration", "ml", "mobile", "monitoring", "networking", "notebooks", "payments", "pdf", "performance", "presentations", "prompts", "refactoring", "scraping", "search", "serverless", "spreadsheets", "sql", "storage", "troubleshooting", "video", "web"],
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "clients": {
                "description": "Where the app runs for its users. A system read only on a device (Apple Health on iOS, Health Connect on Android) with none of its devices here is warned about (`on_device_only`).",
                "items": {
                  "enum": ["web", "ios", "android", "desktop", "server"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "data_kind": {
                "description": "The goal data_kind. health, financial or hipaa adds zdr and no_training to the model's needs (when `model` is given), as /v1/resolve takes them; none adds nothing.",
                "enum": ["none", "health", "financial", "hipaa"],
                "type": "string"
              },
              "harness": {
                "description": "The client the agent runs in, by id (the 400 for an unknown one lists them). It decides what is possible: a local server needs one that can start it, skills one that loads them. Left out, a client that can do all of it is assumed, and `assumptions` says so.",
                "maxLength": 100,
                "pattern": "\\S",
                "type": "string"
              },
              "infra": {
                "additionalProperties": false,
                "description": "Infrastructure the agent runs on. Only read when `actions` or `needs` imply some.",
                "properties": {
                  "usage": {
                    "additionalProperties": false,
                    "description": "A month of what the agent will use. With it, each product is priced as a month's bill on its cheapest plan; without it, for a stated reference job at listed rates, which the answer names. Nothing is assumed about your usage.",
                    "properties": {
                      "busy_share": {
                        "description": "The share of that time its processors compute, 0 to 1; 1 when left out.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "memory_gib": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "pages": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "results_per_search": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "runs": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "searches": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "seconds": {
                        "description": "How long a sandbox or a browser exists in a month, in all: seconds on the wall clock. Given with `vcpus` and `memory_gib` for an agent that runs code, it is the sandbox's: a browser's hours are then not stated, and it is priced for its reference job.",
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "transfer_gib": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "vcpus": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "vendors": {
                    "description": "The infrastructure vendors you have accounts with, by name, e.g. [\"Vercel\", \"e2b\"]. A product is chosen only among these, by price alone; with none named, products are listed and none is chosen. A vendor's name is every product of that vendor's; a product's own id, written exactly, is that product alone. A name that matches nothing comes back in `unknown_infra_vendors`.",
                    "items": {
                      "maxLength": 100,
                      "pattern": "\\S",
                      "type": "string"
                    },
                    "maxItems": 12,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "model": {
                "additionalProperties": false,
                "description": "The providers to choose the agent's model on, as /v1/resolve would. Left out, no model is chosen and the rest is still answered.",
                "properties": {
                  "constraints": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "Any /v1/resolve query parameter except providers, as strings, and except shape, strategy, roles, length, synthesis, origin_mix, providers_distinct: a stack has one model. With neither task nor purpose, the purpose is agent-with-tools.",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "providers": {
                    "description": "Provider names, in order of preference for ties.",
                    "items": {
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["providers"],
                "type": "object"
              },
              "needs": {
                "description": "What the agent needs beyond its systems: web_search, web_reading (fetching pages as text), browser. Each adds a part to `infrastructure`, as `code_execution` in `actions` adds a sandbox.",
                "items": {
                  "enum": ["web_search", "web_reading", "browser"],
                  "type": "string"
                },
                "type": "array"
              },
              "prefer": {
                "description": "For a local agent and a system with a curated command-line tool: cli (default) chooses the tool, server its owner's server when there is one.",
                "enum": ["cli", "server"],
                "type": "string"
              },
              "scale": {
                "description": "What stage the app is at: prototype (for yourself), launch (to the public) or live. With launch or live, a system that admits only a few users before its vendor reviews the app is warned about (`approval_needed`).",
                "enum": ["prototype", "launch", "live"],
                "type": "string"
              },
              "systems": {
                "description": "Required. The systems the agent works with, by id, name or alias, e.g. [\"Linear\", \"github\", \"postgres\"]. Each is matched exactly (case and punctuation aside) against the curated list; one that matches nothing comes back in `unknown_systems` and the rest are answered.",
                "items": {
                  "maxLength": 100,
                  "pattern": "\\S",
                  "type": "string"
                },
                "maxItems": 24,
                "minItems": 1,
                "type": "array"
              },
              "target": {
                "description": "Required. Where the agent runs. local: on a person's machine, with a shell, so a system's command-line tool can be the choice. cloud: only a remote server qualifies.",
                "enum": ["local", "cloud"],
                "type": "string"
              },
              "tenancy": {
                "description": "single (default): the agent acts for one user or team. multi: it serves several tenants, so a server that takes one fixed key is warned about.",
                "enum": ["single", "multi"],
                "type": "string"
              },
              "users": {
                "description": "How many users the app has or expects, when known: `approval_needed` then compares it with each vendor's number.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "integer"
              },
              "users_in": {
                "description": "The goal users_in: where the app's users are (worldwide, eu: the EU among them, us: the US only). Recorded and listed in `assumed` when left out; no rule reads it yet, so it never changes the answer and is never asked.",
                "enum": ["worldwide", "eu", "us"],
                "type": "string"
              }
            },
            "required": ["systems", "target"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72a50ba54d581da8689535e1edadfee7ccd5c591e409ea135e7ac09e5bd15f1d"
        }
      ],
      "prompts": [
        {
          "name": "plan_app",
          "title": "Plan an app with Rhumb",
          "description": "The planning checklist, the goals and the rules for asking, for an agent that has the server and not the skill.",
          "digest": "sha256:536741fff92e6e05adbcc4ae9e6dac6830a11b9b38e9ed20e26b87a1362d5554"
        }
      ],
      "digest": "sha256:52e2d0b7ed6632732d33f01000cd075aacf4be4fbb2df5320fcd20bcca875432"
    }
