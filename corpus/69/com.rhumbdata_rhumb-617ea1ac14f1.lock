        {
          "name": "plan",
          "title": "Plan from a description",
          "description": "Reads a description of the work (a prompt, tags, attachment types and sizes) into a need, then resolves it as `resolve` does. Use `resolve` when you can state the task or purpose yourself; use this when you only have the user's words. Counts as more than one call. The answer depends on these goals; have the ones that matter in hand from the plan, the repository or the user before calling: cost (`optimize`, `max_price`, `budget`, `calls_per_user_month`); depth (`optimize`, `quality_margin`, `min_quality`, `budget`, `shape`, `needs`); maker_origin (`origin`, `origin_strict`); data_region (`regions`); languages (`languages`); data_kind (`needs`); accounts (`providers`). Send them as strings in `constraints`; only `providers` and `shape` go at the top level.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attachments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bytes": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "pages": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "seconds": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "type": {
                      "description": "MIME type, e.g. image/jpeg. Only type and size are sent, never the file.",
                      "type": "string"
                    }
                  },
                  "required": ["bytes", "type"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "constraints": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Any /v1/resolve query parameter except providers, as strings; these win over the reading. When these and the recognised tags settle the task or purpose and the budget, give needs (even empty), no tag is unrecognised, and no shape is left to the reading, the prompt is not read: the reading is empty and decision.model is local.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "decision": {
                "additionalProperties": false,
                "properties": {
                  "allow_remote": {
                    "description": "false keeps the prompt on the server: the local classifier only. When the account turns on \"Keep prompts on Rhumb's server\" in Settings, every request reads this way.",
                    "type": "boolean"
                  },
                  "model": {
                    "description": "openai (default) or local; jev is for internal accounts only.",
                    "enum": ["openai", "local", "jev"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "device": {
                "additionalProperties": false,
                "description": "The device's memory, GPU memory and free disk in GB, for local runtimes: facts that become max_memory_gb, max_vram_gb and max_disk_gb unless constraints set them.",
                "properties": {
                  "disk_gb": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "memory_gb": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "vram_gb": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "prompt": {
                "description": "The request to read. Sent only to the decision model you choose; never stored or logged.",
                "type": "string"
              },
              "providers": {
                "description": "Required. Provider names, in order of preference for ties.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "shape": {
                "description": "As in /v1/resolve, or auto: a team purpose's team and an escalation purpose's ladder; else a team when the reading says several models would help (ensemble_helps), an escalation when the request gives length, else single.",
                "enum": ["single", "team", "escalation", "auto"],
                "type": "string"
              },
              "tags": {
                "description": "Free tags, e.g. [\"vision\", \"read receipts\", \"usa\", \"medium\"].",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e344a807ee1d585c7e0bd9048f83d1f7e77509922995d06a7a8135ed57a5e113"
        },
        {
          "name": "platform",
          "title": "Choose where an app's agent runs",
          "description": "Where an app's agent runs: give `requires` (baa, gpu, private_network, edge, long_running, websockets, scheduled_jobs, large_uploads) with `longest_turn_seconds` and `largest_upload_mb` where they apply, and the goals you have. The answer is `major` (a platform is warranted: a requirement no curated runtime meets, a model provider it hosts, or an account held; name its `system` in a `stack` call next) or `generic` (any host meeting `host_must` will do, with the runtimes that meet it priced for a stated job). Every host ruled out comes with its own page's words; a host whose pages do not state a fact is neither ruled in nor out. A choice is made only when the rules settle it; otherwise it is the user's. Counts as one call. The answer depends on these goals; have the ones that matter in hand from the plan, the repository or the user before calling: users_in (`users_in`); data_region (`data_region`); data_kind (`data_kind`); scale (`scale`); accounts (`accounts`, `providers`); clients (`clients`). On `platform`, a goal is sent by its own name (`data_kind`, `data_region`, `users_in`, `scale`, `clients`, `accounts`) with the values that call lists, and the model providers as `providers`; `needs`, `regions` and `infra.vendors` are not its parameters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accounts": {
                "description": "The goal accounts: platforms (gcp, aws, azure, cloudflare), infrastructure products or vendors the user holds an account with. A platform held is warranted; a choice among several is made only among those held.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "clients": {
                "description": "The goal clients: where the app runs for its users.",
                "items": {
                  "enum": ["web", "ios", "android", "desktop", "server"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "data_kind": {
                "description": "The goal data_kind. hipaa (for a covered entity) requires a business associate agreement; any but none, with ios among clients, adds Apple's disclosure rule.",
                "enum": ["none", "health", "financial", "hipaa"],
                "type": "string"
              },
              "data_region": {
                "description": "The goal data_region. No host's region is curated yet, so it is warned of, never filtered on.",
                "enum": ["eu", "us"],
                "type": "string"
              },
              "largest_upload_mb": {
                "description": "The largest file one request carries, in MB: a host whose request body is smaller is ruled out, and the answer warns to upload by a signed address.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "longest_turn_seconds": {
                "description": "The longest one request or run may take, in seconds: a host that stops one sooner is ruled out.",
                "exclusiveMinimum": 0,
                "maximum": 86400,
                "type": "integer"
              },
              "providers": {
                "description": "The model providers the app calls, as sent to /v1/resolve. A platform that hosts one is warranted.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "requires": {
                "description": "What the app needs of a host. long_running needs longest_turn_seconds and large_uploads needs largest_upload_mb; either number given alone adds its requirement.",
                "items": {
                  "enum": ["baa", "gpu", "private_network", "edge", "long_running", "websockets", "scheduled_jobs", "large_uploads"],
                  "type": "string"
                },
                "type": "array"
              },
              "scale": {
                "description": "The goal scale. With launch or live, a free tier that stops serving when idle is warned of.",
                "enum": ["prototype", "launch", "live"],
                "type": "string"
              },
              "users_in": {
                "description": "The goal users_in: where the app's users are (worldwide, eu: the EU among them, us: the US only). Recorded and listed in `assumed` when left out; no rule reads it yet, so it never changes the answer and is never asked.",
                "enum": ["worldwide", "eu", "us"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:53d334d91c749a5bd68681b4c34b857812f735e784b21341a169f8cf759778cc"
        },
        {
          "name": "resolve",
          "title": "Resolve a model",
          "description": "Which model to call for a need, on the providers the user has accounts with: the provider's own model id, its price, capabilities and the reason. Give `providers` and a `task` or a `purpose`; add `needs`, `budget`, `origin` and other constraints to narrow it. `shape` asks for a team or an escalation ladder instead of one model. Counts as one call. An answer of `no_candidate` names what ruled every model out and the nearest miss. The answer depends on these goals; have the ones that matter in hand from the plan, the repository or the user before calling: cost (`optimize`, `max_price`, `budget`, `calls_per_user_month`); depth (`optimize`, `quality_margin`, `min_quality`, `budget`, `shape`, `needs`); maker_origin (`origin`, `origin_strict`); data_region (`regions`); languages (`languages`); data_kind (`needs`); accounts (`providers`). Send them as query parameters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allow_closed": {
                "description": "Allow models the provider has closed to new accounts. Send true only if your account used them before (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "allow_preview": {
                "description": "Allow preview models (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "allow_trial": {
                "description": "Allow trial offerings, which aren't for production (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "audio_seconds": {
                "description": "Audio seconds per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "budget": {
                "description": "Thirds of the market's prices for the task.",
                "enum": ["cheap", "medium", "premium"],
                "type": "string"
              },
              "cached_input_tokens": {
                "description": "Input tokens served from the provider's cache.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "calls_per_user_month": {
                "description": "How many calls one user makes in a month. With it, the chosen model's price carries per_user_month and the sum behind it; without it, nothing monthly is returned.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "currency": {
                "description": "Adds the typical call converted to this currency, e.g. EUR.",
                "type": "string"
              },
              "exclude": {
                "description": "Model ids, vendors, or provider:model pairs to leave out. Comma-separated.",
                "type": "string"
              },
              "hours": {
                "description": "UTC hours you make your calls in, every day, as HH-HH ranges: 09-17, or 22-06 past midnight, or 00-24. A price with cheaper hours then ranks on its average over these hours instead of over a flat week. Comma-separated.",
                "type": "string"
              },
              "images": {
                "description": "Input images per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "input_tokens": {
                "description": "Expected input tokens per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "languages": {
                "description": "Languages your users write in, as language tags: \"en\", \"de\", \"pt-BR\". With one other than English, the non-English quality signal leads for a purpose that lists it; when the answer could not be compared on it, it warns language_signal_unavailable. Comma-separated.",
                "type": "string"
              },
              "length": {
                "description": "Escalation steps, 1–5 (default 3).",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "license": {
                "description": "Accepted open-weight licenses. Comma-separated.",
                "type": "string"
              },
              "max_disk_gb": {
                "description": "Local runtimes: free disk in GB for the weights.",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "max_memory_gb": {
                "description": "Local runtimes: the device's memory in GB (10^9 bytes). A local offering fits when its weights, KV cache at the request's min_context (8,192 tokens when smaller) and runtime overhead fit. Cloud offerings are not limited.",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "max_price": {
                "description": "Hard cap on the typical call, in USD, e.g. 0.002, at the day's highest rate.",
                "type": "string"
              },
              "max_vram_gb": {
                "description": "Local runtimes: GPU memory in GB, for a full offload. On Apple silicon send the GPU's share of unified memory (macOS allows about 2/3 by default, 3/4 above 36 GB) and the total as max_memory_gb.",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "min_context": {
                "description": "Minimum context window in tokens.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "min_quality": {
                "description": "Minimum quality score, 0–1.",
                "type": "string"
              },
              "needs": {
                "description": "Required capabilities, optionally with a level: \"input.pdf:native\". Comma-separated.",
                "type": "string"
              },
              "optimize": {
                "description": "cost (default), quality or value.",
                "enum": ["cost", "quality", "value"],
                "type": "string"
              },
              "origin": {
                "description": "Model maker countries or groups: \"us\", \"eu\", \"not:cn\". Comma-separated.",
                "type": "string"
              },
              "origin_mix": {
                "description": "Team origin rules: \"eu:>=1\", \"cn:<=0\", \"us:=2\". Comma-separated.",
                "type": "string"
              },
              "origin_strict": {
                "description": "Also require a fine-tune's base model maker to match.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "output_images": {
                "description": "Generated images per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "output_tokens": {
                "description": "Expected output tokens per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "pages": {
                "description": "PDF pages per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "prompt_tokens": {
                "description": "Prompt size, for long-prompt price tiers.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "provider_terms": {
                "description": "Your terms per provider: \"openrouter:byok\", \"gemini:free_tier\", \"openai:discount:0.2\". Comma-separated.",
                "type": "string"
              },
              "providers": {
                "description": "Required. Provider names you have accounts with, in order of preference for ties. Never keys. Comma-separated.",
                "type": "string"
              },
              "providers_distinct": {
                "description": "Every team member, or escalation step, on a different provider.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "purpose": {
                "description": "A purpose preset id or alias, e.g. read-receipts.",
                "type": "string"
              },
              "quality_margin": {
                "description": "For optimize=cost: how far below the best score still counts (default 0.05).",
                "type": "string"
              },
              "regions": {
                "description": "Where data may be served, as region codes or their prefixes: \"eu\", \"us\", \"us-east\". It filters only when at least half the offerings on your providers state a region; below that, nothing is removed and the answer warns region_not_filtered. An offering that states no region is kept, with region_unstated. Comma-separated.",
                "type": "string"
              },
              "released_after": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "resolution": {
                "description": "Image resolution key, e.g. \"1k\".",
                "type": "string"
              },
              "roles": {
                "description": "Team roles: \"name:count\" pairs, comma-separated (lead:1,workers:4), or a JSON object of role name to { count, task, needs, min_quality, optimize, distinct_vendor_from, distinct_family, judges }. Overrides and extends the strategy's roles.",
                "type": "string"
              },
              "service_tier": {
                "enum": ["standard", "batch", "flex", "priority"],
                "type": "string"
              },
              "shape": {
                "description": "single (default, or the purpose's), team (with strategy or roles) or escalation (a ladder of length steps, or one model then a team with strategy or roles).",
                "enum": ["single", "team", "escalation"],
                "type": "string"
              },
              "strategy": {
                "description": "A team strategy preset: its roles and their rules.",
                "enum": ["debate", "red-team", "competitive", "hierarchical", "expert-panel", "collaborative"],
                "type": "string"
              },
              "synthesis": {
                "description": "Add a synthesizer role to the team.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "task": {
                "description": "A task, e.g. text.chat. Required unless purpose is given.",
                "type": "string"
              },
              "video_seconds": {
                "description": "Video seconds per call.",
                "pattern": "^\\d+$",
                "type": "string"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
