{
  "lockfileVersion": 2,
  "subjects": {
    "com.rhumbdata/rhumb": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rhumbdata.com/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rhumb",
        "title": "Rhumb",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Rhumb answers which model to use on the providers the user has accounts with. Call `resolve` with those providers and a task or purpose before choosing a model for the user's code; never guess a provider's model id or price. Send provider names only, never the user's provider keys, prompts' contents or files.",
      "tools": [
        {
          "name": "get_model",
          "title": "Get one model",
          "description": "One model by id (`vendor/model`, e.g. `anthropic/claude-sonnet-4.5`): every provider's offering with its price history, capabilities, limits and dates, and the model's quality scores. Counts as one call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "at": {
                "description": "ISO date or time: return the price revision in force then.",
                "type": "string"
              },
              "id": {
                "description": "The model's id, `vendor/model`, or an alias of it.",
                "type": "string"
              },
              "provider": {
                "description": "Only this provider's offering.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7f0c55eeaac1284d11b399d00027b53e5f057f8297c86656958391489185457"
        },
        {
          "name": "get_vocabulary",
          "title": "Get the vocabulary",
          "description": "Every name the other tools accept: tasks, capabilities and their levels, providers, origin groups, budgets and team strategies. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6593596ada77d1044acbe3bf2445c189e5dc49574a008637f3193fc36515105"
        },
        {
          "name": "list_models",
          "title": "List models",
          "description": "The catalog's models with each provider's offering, price, capabilities and quality scores, filtered by task, providers and needs. Returns 20 models unless `limit` says otherwise; page with `offset`. Counts as one call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_hidden": {
                "description": "Include offerings that are never recommended (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "include_retired": {
                "description": "Include retired offerings (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "limit": {
                "description": "Page size, 1–500 (default 20).",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "needs": {
                "description": "Only offerings with these capabilities. Comma-separated.",
                "type": "string"
              },
              "offset": {
                "description": "Models to skip (default 0).",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "providers": {
                "description": "Only offerings on these providers. Comma-separated.",
                "type": "string"
              },
              "task": {
                "description": "Only models for this task.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a93506b0a3b773f285b2f070d49d3abe802233853853e4b5496dee558956896a"
        },
        {
          "name": "list_purposes",
          "title": "List purposes",
          "description": "The purpose presets `resolve` accepts: named jobs such as reading receipts or a coding agent, each with the task, needs and budget it stands for. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd505a438697cbf668604a15dfd7b876f0c5769dc914ef402ffc980b88438408"
        },
        {
          "name": "plan",
          "title": "Plan from a description",
          "description": "Reads a description of the work (a prompt, tags, attachment types and sizes) into a need, then resolves it as `resolve` does. Use `resolve` when you can state the task or purpose yourself; use this when you only have the user's words. Counts as more than one call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attachments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bytes": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "pages": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "seconds": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "type": {
                      "description": "MIME type, e.g. image/jpeg. Only type and size are sent, never the file.",
                      "type": "string"
                    }
                  },
                  "required": ["bytes", "type"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "constraints": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Any /v1/resolve query parameter except providers, as strings; these win over the reading. When these and the recognised tags settle the task or purpose and the budget, give needs (even empty), no tag is unrecognised, and no shape is left to the reading, the prompt is not read: the reading is empty and decision.model is local.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "decision": {
                "additionalProperties": false,
                "properties": {
                  "allow_remote": {
                    "description": "false keeps the prompt on the server: the local classifier only. When the account turns on \"Keep prompts on Rhumb's server\" in Settings, every request reads this way.",
                    "type": "boolean"
                  },
                  "model": {
                    "description": "openai (default) or local; jev is for internal accounts only.",
                    "enum": ["openai", "local", "jev"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "device": {
                "additionalProperties": false,
                "description": "The device's memory, GPU memory and free disk in GB, for local runtimes: facts that become max_memory_gb, max_vram_gb and max_disk_gb unless constraints set them.",
                "properties": {
                  "disk_gb": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "memory_gb": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "vram_gb": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "prompt": {
                "description": "The request to read. Sent only to the decision model you choose; never stored or logged.",
                "type": "string"
              },
              "providers": {
                "description": "Required. Provider names, in order of preference for ties.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "shape": {
                "description": "As in /v1/resolve, or auto: a team purpose's team and an escalation purpose's ladder; else a team when the reading says several models would help (ensemble_helps), an escalation when the request gives length, else single.",
                "enum": ["single", "team", "escalation", "auto"],
                "type": "string"
              },
              "tags": {
                "description": "Free tags, e.g. [\"vision\", \"read receipts\", \"usa\", \"medium\"].",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d683f7121c34b1103162970136038241512efb1d915f75a5911342ee0d8cf467"
        },
        {
          "name": "resolve",
          "title": "Resolve a model",
          "description": "Which model to call for a need, on the providers the user has accounts with: the provider's own model id, its price, capabilities and the reason. Give `providers` and a `task` or a `purpose`; add `needs`, `budget`, `origin` and other constraints to narrow it. `shape` asks for a team or an escalation ladder instead of one model. Counts as one call. An answer of `no_candidate` names what ruled every model out and the nearest miss.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allow_closed": {
                "description": "Allow models the provider has closed to new accounts. Send true only if your account used them before (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "allow_preview": {
                "description": "Allow preview models (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "allow_trial": {
                "description": "Allow trial offerings, which aren't for production (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "audio_seconds": {
                "description": "Audio seconds per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "budget": {
                "description": "Thirds of the market's prices for the task.",
                "enum": ["cheap", "medium", "premium"],
                "type": "string"
              },
              "cached_input_tokens": {
                "description": "Input tokens served from the provider's cache.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "currency": {
                "description": "Adds the typical call converted to this currency, e.g. EUR.",
                "type": "string"
              },
              "exclude": {
                "description": "Model ids, vendors, or provider:model pairs to leave out. Comma-separated.",
                "type": "string"
              },
              "hours": {
                "description": "UTC hours you make your calls in, every day, as HH-HH ranges: 09-17, or 22-06 past midnight, or 00-24. A price with cheaper hours then ranks on its average over these hours instead of over a flat week. Comma-separated.",
                "type": "string"
              },
              "images": {
                "description": "Input images per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "input_tokens": {
                "description": "Expected input tokens per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "length": {
                "description": "Escalation steps, 1–5 (default 3).",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "license": {
                "description": "Accepted open-weight licenses. Comma-separated.",
                "type": "string"
              },
              "max_disk_gb": {
                "description": "Local runtimes: free disk in GB for the weights.",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "max_memory_gb": {
                "description": "Local runtimes: the device's memory in GB (10^9 bytes). A local offering fits when its weights, KV cache at the request's min_context (8,192 tokens when smaller) and runtime overhead fit. Cloud offerings are not limited.",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "max_price": {
                "description": "Hard cap on the typical call, in USD, e.g. 0.002, at the day's highest rate.",
                "type": "string"
              },
              "max_vram_gb": {
                "description": "Local runtimes: GPU memory in GB, for a full offload. On Apple silicon send the GPU's share of unified memory (macOS allows about 2/3 by default, 3/4 above 36 GB) and the total as max_memory_gb.",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "min_context": {
                "description": "Minimum context window in tokens.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "min_quality": {
                "description": "Minimum quality score, 0–1.",
                "type": "string"
              },
              "needs": {
                "description": "Required capabilities, optionally with a level: \"input.pdf:native\". Comma-separated.",
                "type": "string"
              },
              "optimize": {
                "description": "cost (default), quality or value.",
                "enum": ["cost", "quality", "value"],
                "type": "string"
              },
              "origin": {
                "description": "Model maker countries or groups: \"us\", \"eu\", \"not:cn\". Comma-separated.",
                "type": "string"
              },
              "origin_mix": {
                "description": "Team origin rules: \"eu:>=1\", \"cn:<=0\", \"us:=2\". Comma-separated.",
                "type": "string"
              },
              "origin_strict": {
                "description": "Also require a fine-tune's base model maker to match.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "output_images": {
                "description": "Generated images per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "output_tokens": {
                "description": "Expected output tokens per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "pages": {
                "description": "PDF pages per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "prompt_tokens": {
                "description": "Prompt size, for long-prompt price tiers.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "provider_terms": {
                "description": "Your terms per provider: \"openrouter:byok\", \"gemini:free_tier\", \"openai:discount:0.2\". Comma-separated.",
                "type": "string"
              },
              "providers": {
                "description": "Required. Provider names you have accounts with, in order of preference for ties. Never keys. Comma-separated.",
                "type": "string"
              },
              "providers_distinct": {
                "description": "Every team member, or escalation step, on a different provider.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "purpose": {
                "description": "A purpose preset id or alias, e.g. read-receipts.",
                "type": "string"
              },
              "quality_margin": {
                "description": "For optimize=cost: how far below the best score still counts (default 0.05).",
                "type": "string"
              },
              "released_after": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "resolution": {
                "description": "Image resolution key, e.g. \"1k\".",
                "type": "string"
              },
              "roles": {
                "description": "Team roles: \"name:count\" pairs, comma-separated (lead:1,workers:4), or a JSON object of role name to { count, task, needs, min_quality, optimize, distinct_vendor_from, distinct_family, judges }. Overrides and extends the strategy's roles.",
                "type": "string"
              },
              "service_tier": {
                "enum": ["standard", "batch", "flex", "priority"],
                "type": "string"
              },
              "shape": {
                "description": "single (default, or the purpose's), team (with strategy or roles) or escalation (a ladder of length steps, or one model then a team with strategy or roles).",
                "enum": ["single", "team", "escalation"],
                "type": "string"
              },
              "strategy": {
                "description": "A team strategy preset: its roles and their rules.",
                "enum": ["debate", "red-team", "competitive", "hierarchical", "expert-panel", "collaborative"],
                "type": "string"
              },
              "synthesis": {
                "description": "Add a synthesizer role to the team.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "task": {
                "description": "A task, e.g. text.chat. Required unless purpose is given.",
                "type": "string"
              },
              "video_seconds": {
                "description": "Video seconds per call.",
                "pattern": "^\\d+$",
                "type": "string"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:77f4f957ba36b1873d87b43ca32cbf837f3f558c8646f444fb021a03ceabe856"
        }
      ],
      "digest": "sha256:ddeb1f472abb2e7af58f3ce266aefccedaa59b40ace2fa7e7f8e9d3d9420202a"
    }
  }
}
