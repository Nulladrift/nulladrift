{
  "lockfileVersion": 2,
  "subjects": {
    "com.rhumbdata/rhumb": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rhumbdata.com/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rhumb",
        "title": "Rhumb",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Rhumb answers which model to use on the providers the user has accounts with. Call `resolve` with those providers and a task or purpose before choosing a model for the user's code; never guess a provider's model id or price. For an agent that has to work with named systems, call `stack` with the systems, where the agent runs and its harness: it answers each system's own MCP server or command-line tool by fixed rules over public records, unreviewed, with warnings to show the user. When its answer has `watch_url`, offer that address to the user as a link (they can be emailed when the stack changes); do not open it, and never say a watch was set. Send provider and system names only, never the user's provider or system keys, prompts' contents or files.",
      "tools": [
        {
          "name": "get_model",
          "title": "Get one model",
          "description": "One model by id (`vendor/model`, e.g. `anthropic/claude-sonnet-4.5`): every provider's offering with its price history, capabilities, limits and dates, and the model's quality scores. Counts as one call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "at": {
                "description": "ISO date or time: return the price revision in force then.",
                "type": "string"
              },
              "id": {
                "description": "The model's id, `vendor/model`, or an alias of it.",
                "type": "string"
              },
              "provider": {
                "description": "Only this provider's offering.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7f0c55eeaac1284d11b399d00027b53e5f057f8297c86656958391489185457"
        },
        {
          "name": "get_vocabulary",
          "title": "Get the vocabulary",
          "description": "Every name the other tools accept: tasks, capabilities and their levels, providers, origin groups, budgets and team strategies. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6593596ada77d1044acbe3bf2445c189e5dc49574a008637f3193fc36515105"
        },
        {
          "name": "list_models",
          "title": "List models",
          "description": "The catalog's models with each provider's offering, price, capabilities and quality scores, filtered by task, providers and needs. Returns 20 models unless `limit` says otherwise; page with `offset`. Counts as one call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_hidden": {
                "description": "Include offerings that are never recommended (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "include_retired": {
                "description": "Include retired offerings (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "limit": {
                "description": "Page size, 1–500 (default 20).",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "needs": {
                "description": "Only offerings with these capabilities. Comma-separated.",
                "type": "string"
              },
              "offset": {
                "description": "Models to skip (default 0).",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "providers": {
                "description": "Only offerings on these providers. Comma-separated.",
                "type": "string"
              },
              "task": {
                "description": "Only models for this task.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a93506b0a3b773f285b2f070d49d3abe802233853853e4b5496dee558956896a"
        },
        {
          "name": "list_purposes",
          "title": "List purposes",
          "description": "The purpose presets `resolve` accepts: named jobs such as reading receipts or a coding agent, each with the task, needs and budget it stands for. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd505a438697cbf668604a15dfd7b876f0c5769dc914ef402ffc980b88438408"
        },
        {
          "name": "plan",
          "title": "Plan from a description",
          "description": "Reads a description of the work (a prompt, tags, attachment types and sizes) into a need, then resolves it as `resolve` does. Use `resolve` when you can state the task or purpose yourself; use this when you only have the user's words. Counts as more than one call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attachments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bytes": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "pages": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "seconds": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "type": {
                      "description": "MIME type, e.g. image/jpeg. Only type and size are sent, never the file.",
                      "type": "string"
                    }
                  },
                  "required": ["bytes", "type"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "constraints": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Any /v1/resolve query parameter except providers, as strings; these win over the reading. When these and the recognised tags settle the task or purpose and the budget, give needs (even empty), no tag is unrecognised, and no shape is left to the reading, the prompt is not read: the reading is empty and decision.model is local.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "decision": {
                "additionalProperties": false,
                "properties": {
                  "allow_remote": {
                    "description": "false keeps the prompt on the server: the local classifier only. When the account turns on \"Keep prompts on Rhumb's server\" in Settings, every request reads this way.",
                    "type": "boolean"
                  },
                  "model": {
                    "description": "openai (default) or local; jev is for internal accounts only.",
                    "enum": ["openai", "local", "jev"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "device": {
                "additionalProperties": false,
                "description": "The device's memory, GPU memory and free disk in GB, for local runtimes: facts that become max_memory_gb, max_vram_gb and max_disk_gb unless constraints set them.",
                "properties": {
                  "disk_gb": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "memory_gb": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "vram_gb": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "prompt": {
                "description": "The request to read. Sent only to the decision model you choose; never stored or logged.",
                "type": "string"
              },
              "providers": {
                "description": "Required. Provider names, in order of preference for ties.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "shape": {
                "description": "As in /v1/resolve, or auto: a team purpose's team and an escalation purpose's ladder; else a team when the reading says several models would help (ensemble_helps), an escalation when the request gives length, else single.",
                "enum": ["single", "team", "escalation", "auto"],
                "type": "string"
              },
              "tags": {
                "description": "Free tags, e.g. [\"vision\", \"read receipts\", \"usa\", \"medium\"].",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d683f7121c34b1103162970136038241512efb1d915f75a5911342ee0d8cf467"
        },
        {
          "name": "resolve",
          "title": "Resolve a model",
          "description": "Which model to call for a need, on the providers the user has accounts with: the provider's own model id, its price, capabilities and the reason. Give `providers` and a `task` or a `purpose`; add `needs`, `budget`, `origin` and other constraints to narrow it. `shape` asks for a team or an escalation ladder instead of one model. Counts as one call. An answer of `no_candidate` names what ruled every model out and the nearest miss.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allow_closed": {
                "description": "Allow models the provider has closed to new accounts. Send true only if your account used them before (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "allow_preview": {
                "description": "Allow preview models (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "allow_trial": {
                "description": "Allow trial offerings, which aren't for production (default false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "audio_seconds": {
                "description": "Audio seconds per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "budget": {
                "description": "Thirds of the market's prices for the task.",
                "enum": ["cheap", "medium", "premium"],
                "type": "string"
              },
              "cached_input_tokens": {
                "description": "Input tokens served from the provider's cache.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "currency": {
                "description": "Adds the typical call converted to this currency, e.g. EUR.",
                "type": "string"
              },
              "exclude": {
                "description": "Model ids, vendors, or provider:model pairs to leave out. Comma-separated.",
                "type": "string"
              },
              "hours": {
                "description": "UTC hours you make your calls in, every day, as HH-HH ranges: 09-17, or 22-06 past midnight, or 00-24. A price with cheaper hours then ranks on its average over these hours instead of over a flat week. Comma-separated.",
                "type": "string"
              },
              "images": {
                "description": "Input images per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "input_tokens": {
                "description": "Expected input tokens per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "length": {
                "description": "Escalation steps, 1–5 (default 3).",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "license": {
                "description": "Accepted open-weight licenses. Comma-separated.",
                "type": "string"
              },
              "max_disk_gb": {
                "description": "Local runtimes: free disk in GB for the weights.",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "max_memory_gb": {
                "description": "Local runtimes: the device's memory in GB (10^9 bytes). A local offering fits when its weights, KV cache at the request's min_context (8,192 tokens when smaller) and runtime overhead fit. Cloud offerings are not limited.",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "max_price": {
                "description": "Hard cap on the typical call, in USD, e.g. 0.002, at the day's highest rate.",
                "type": "string"
              },
              "max_vram_gb": {
                "description": "Local runtimes: GPU memory in GB, for a full offload. On Apple silicon send the GPU's share of unified memory (macOS allows about 2/3 by default, 3/4 above 36 GB) and the total as max_memory_gb.",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "min_context": {
                "description": "Minimum context window in tokens.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "min_quality": {
                "description": "Minimum quality score, 0–1.",
                "type": "string"
              },
              "needs": {
                "description": "Required capabilities, optionally with a level: \"input.pdf:native\". Comma-separated.",
                "type": "string"
              },
              "optimize": {
                "description": "cost (default), quality or value.",
                "enum": ["cost", "quality", "value"],
                "type": "string"
              },
              "origin": {
                "description": "Model maker countries or groups: \"us\", \"eu\", \"not:cn\". Comma-separated.",
                "type": "string"
              },
              "origin_mix": {
                "description": "Team origin rules: \"eu:>=1\", \"cn:<=0\", \"us:=2\". Comma-separated.",
                "type": "string"
              },
              "origin_strict": {
                "description": "Also require a fine-tune's base model maker to match.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "output_images": {
                "description": "Generated images per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "output_tokens": {
                "description": "Expected output tokens per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "pages": {
                "description": "PDF pages per call.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "prompt_tokens": {
                "description": "Prompt size, for long-prompt price tiers.",
                "pattern": "^\\d+$",
                "type": "string"
              },
              "provider_terms": {
                "description": "Your terms per provider: \"openrouter:byok\", \"gemini:free_tier\", \"openai:discount:0.2\". Comma-separated.",
                "type": "string"
              },
              "providers": {
                "description": "Required. Provider names you have accounts with, in order of preference for ties. Never keys. Comma-separated.",
                "type": "string"
              },
              "providers_distinct": {
                "description": "Every team member, or escalation step, on a different provider.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "purpose": {
                "description": "A purpose preset id or alias, e.g. read-receipts.",
                "type": "string"
              },
              "quality_margin": {
                "description": "For optimize=cost: how far below the best score still counts (default 0.05).",
                "type": "string"
              },
              "released_after": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "resolution": {
                "description": "Image resolution key, e.g. \"1k\".",
                "type": "string"
              },
              "roles": {
                "description": "Team roles: \"name:count\" pairs, comma-separated (lead:1,workers:4), or a JSON object of role name to { count, task, needs, min_quality, optimize, distinct_vendor_from, distinct_family, judges }. Overrides and extends the strategy's roles.",
                "type": "string"
              },
              "service_tier": {
                "enum": ["standard", "batch", "flex", "priority"],
                "type": "string"
              },
              "shape": {
                "description": "single (default, or the purpose's), team (with strategy or roles) or escalation (a ladder of length steps, or one model then a team with strategy or roles).",
                "enum": ["single", "team", "escalation"],
                "type": "string"
              },
              "strategy": {
                "description": "A team strategy preset: its roles and their rules.",
                "enum": ["debate", "red-team", "competitive", "hierarchical", "expert-panel", "collaborative"],
                "type": "string"
              },
              "synthesis": {
                "description": "Add a synthesizer role to the team.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "task": {
                "description": "A task, e.g. text.chat. Required unless purpose is given.",
                "type": "string"
              },
              "video_seconds": {
                "description": "Video seconds per call.",
                "pattern": "^\\d+$",
                "type": "string"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:77f4f957ba36b1873d87b43ca32cbf837f3f558c8646f444fb021a03ceabe856"
        },
        {
          "name": "stack",
          "title": "Choose a stack for an agent",
          "description": "For an agent that has to work with named systems (Linear, GitHub, Postgres…): what to connect for each, and which model to call. Give `systems`, `target` (local or cloud) and the `harness` the agent runs in; add `model.providers` to get a model too. Each system's choice is its owner's own MCP server or command-line tool, or none, picked by fixed rules from public records and not reviewed; `warnings` say what to read first, and `config.mcp_json` is a config to start from, with placeholders for every value the user supplies. A name that matches no system comes back in `unknown_systems`. Counts as one call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actions": {
                "description": "What the agent does; default [\"read\"]. untrusted_input (it reads text from outside) together with write or code_execution is warned about.",
                "items": {
                  "enum": ["read", "write", "code_execution", "untrusted_input"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "harness": {
                "description": "The client the agent runs in, by id (the 400 for an unknown one lists them). It decides what is possible: a local server needs one that can start it, skills one that loads them. Left out, a client that can do all of it is assumed, and `assumptions` says so.",
                "maxLength": 100,
                "pattern": "\\S",
                "type": "string"
              },
              "infra": {
                "additionalProperties": false,
                "description": "Infrastructure the agent runs on. Only read when `actions` or `needs` imply some.",
                "properties": {
                  "usage": {
                    "additionalProperties": false,
                    "description": "A month of what the agent will use. With it, each product is priced as a month's bill on its cheapest plan; without it, for a stated reference job at listed rates, which the answer names. Nothing is assumed about your usage.",
                    "properties": {
                      "busy_share": {
                        "description": "The share of that time its processors compute, 0 to 1; 1 when left out.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "memory_gib": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "pages": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "results_per_search": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "runs": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "searches": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "seconds": {
                        "description": "How long a sandbox or a browser exists in a month, in all: seconds on the wall clock. Given with `vcpus` and `memory_gib` for an agent that runs code, it is the sandbox's: a browser's hours are then not stated, and it is priced for its reference job.",
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "transfer_gib": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "vcpus": {
                        "maximum": 1000000000000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "vendors": {
                    "description": "The infrastructure vendors you have accounts with, by name, e.g. [\"Vercel\", \"e2b\"]. A product is chosen only among these, by price alone; with none named, products are listed and none is chosen. A vendor's name is every product of that vendor's; a product's own id, written exactly, is that product alone. A name that matches nothing comes back in `unknown_infra_vendors`.",
                    "items": {
                      "maxLength": 100,
                      "pattern": "\\S",
                      "type": "string"
                    },
                    "maxItems": 12,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "model": {
                "additionalProperties": false,
                "description": "The providers to choose the agent's model on, as /v1/resolve would. Left out, no model is chosen and the rest is still answered.",
                "properties": {
                  "constraints": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "Any /v1/resolve query parameter except providers, as strings, and except shape, strategy, roles, length, synthesis, origin_mix, providers_distinct: a stack has one model. With neither task nor purpose, the purpose is agent-with-tools.",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "providers": {
                    "description": "Provider names, in order of preference for ties.",
                    "items": {
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["providers"],
                "type": "object"
              },
              "needs": {
                "description": "What the agent needs beyond its systems: web_search, web_reading (fetching pages as text), browser. Each adds a part to `infrastructure`, as `code_execution` in `actions` adds a sandbox.",
                "items": {
                  "enum": ["web_search", "web_reading", "browser"],
                  "type": "string"
                },
                "type": "array"
              },
              "prefer": {
                "description": "For a local agent and a system with a curated command-line tool: cli (default) chooses the tool, server its owner's server when there is one.",
                "enum": ["cli", "server"],
                "type": "string"
              },
              "systems": {
                "description": "Required. The systems the agent works with, by id, name or alias, e.g. [\"Linear\", \"github\", \"postgres\"]. Each is matched exactly (case and punctuation aside) against the curated list; one that matches nothing comes back in `unknown_systems` and the rest are answered.",
                "items": {
                  "maxLength": 100,
                  "pattern": "\\S",
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "target": {
                "description": "Required. Where the agent runs. local: on a person's machine, with a shell, so a system's command-line tool can be the choice. cloud: only a remote server qualifies.",
                "enum": ["local", "cloud"],
                "type": "string"
              },
              "tenancy": {
                "description": "single (default): the agent acts for one user or team. multi: it serves several tenants, so a server that takes one fixed key is warned about.",
                "enum": ["single", "multi"],
                "type": "string"
              }
            },
            "required": ["systems", "target"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:064fd5d5aad24356e23b325ecf6355a9a6f6bd2af82cd049114347f3a6103360"
        }
      ],
      "digest": "sha256:4c5dea425a956c496244098c8cd06dad16c26f6e4ab97b0df2961890781289a5"
    }
  }
}
