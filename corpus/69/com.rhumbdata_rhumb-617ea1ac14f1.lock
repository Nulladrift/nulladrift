      "instructions": "Rhumb answers which model to use on the providers the user has accounts with. Call `resolve` with those providers and a task or purpose before choosing a model for the user's code; never guess a provider's model id or price. For an agent that has to work with named systems, call `stack` with the systems, where the agent runs and its harness: it answers each system's own MCP server or command-line tool by fixed rules over public records, unreviewed, with warnings to show the user. When its answer has `watch_url`, offer that address to the user as a link (they can be emailed when the stack changes); do not open it, and never say a watch was set. Send provider and system names only, never the user's provider or system keys, prompts' contents or files. While the user's agent plans an app, Rhumb is a helper at its decisions, not the planner: every answer depends on goals (cost, depth, maker_origin, users_in, data_region, languages, data_kind, scale, accounts, clients), which each tool's description names with the parameters they are sent as. Ask only the goals the next call depends on, one at a time, and at most five in a planning session; state the rest as assumptions when showing the answer. Look first: the plan or spec already written, then the repository (dependency, environment variable and config file names, never values), then the conversation. Ask the user only what none of these answers. Rhumb keeps no latency data, so speed is never asked.",
      "tools": [
        {
          "name": "get_model",
          "title": "Get one model",
          "description": "One model by id (`vendor/model`, e.g. `anthropic/claude-sonnet-4.5`): every provider's offering with its price history, capabilities, limits and dates, and the model's quality scores. Counts as one call.",
