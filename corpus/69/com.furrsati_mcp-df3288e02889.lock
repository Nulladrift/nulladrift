                      "type": "boolean"
                    },
                    "level": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "levelEvidence": {
                      "anyOf": [
                        {
