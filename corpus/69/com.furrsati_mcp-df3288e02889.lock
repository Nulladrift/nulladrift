                "type": ["number", "null"]
              },
              "bio": {
                "type": ["string", "null"]
              },
              "categories": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "category": {
                "type": ["string", "null"]
              },
              "completedJobs": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hourlyRateUsd": {
                "type": ["number", "null"]
              },
              "id": {
                "type": "string"
              },
              "idVerified": {
                "type": "boolean"
              },
              "isFoundingFreelancer": {
                "type": "boolean"
              },
              "level": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "levelEvidence": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "earned": {
                        "type": "boolean"
                      },
                      "level": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "signals": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "key": {
                              "type": "string"
                            },
                            "status": {
                              "type": "string"
                            },
                            "unit": {
                              "type": "string"
                            },
                            "value": {
                              "type": ["number", "boolean", "string"]
                            }
                          },
                          "required": ["key", "status", "unit"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "status": {
                        "type": "string"
                      }
                    },
                    "required": ["earned", "level", "signals", "status"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
