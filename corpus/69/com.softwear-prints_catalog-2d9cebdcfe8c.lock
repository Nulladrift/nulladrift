{
  "lockfileVersion": 2,
  "subjects": {
    "com.softwear-prints/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.softwear-prints.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "softwear-prints",
        "title": "Softwear Prints",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Returns the details of one product: description, properties such as material and certifications, colours, sizes, unit price (net and gross), EAN and stock per variant, and the minimum quantities and production time for decoration.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "color": {
                "description": "Limit the variant list to one colour name, e.g. 'Navy'.",
                "maxLength": 60,
                "type": "string"
              },
              "language": {
                "default": "de",
                "description": "Language of names and texts in the result.",
                "enum": ["de", "en", "fr", "es", "nl", "it", "pl", "dk"],
                "type": "string"
              },
              "product": {
                "description": "Product slug or id as returned by search_products.",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._-]+$",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9474c20915969212571838a361c7fe0f21c929b058dcae54f2bb8cc18dcefea9"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Returns the category tree of the Softwear Prints catalogue with product counts and links. The slugs can be used as the category filter of search_products.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "default": "de",
                "description": "Language of category names in the result.",
                "enum": ["de", "en", "fr", "es", "nl", "it", "pl", "dk"],
                "type": "string"
              },
              "parent": {
                "description": "Slug or id of a category to list only its subcategories. Omit for the whole tree.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5453e12a0306d74c0387c9f3b80af629da2fc685df1a96cf9dd5bace0ba60be6"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Searches the Softwear Prints catalogue of textiles and promotional items that can be printed or embroidered. Supports free text and filters for category, brand, colour, size, target group, material, certification and price. Returns name, brand, article number, unit price (net and gross), colours and a link to the product page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "Brand names, e.g. ['HAKRO'].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "category": {
                "description": "Category slug or id as returned by list_categories.",
                "maxLength": 120,
                "type": "string"
              },
              "certification": {
                "description": "Certifications, e.g. ['Oeko-Tex 100'].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "color": {
                "description": "Colour names in German or English, e.g. ['navy'] or ['rot'].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "gender": {
                "description": "Target group, e.g. ['Damen'], ['Herren'], ['Kinder'], ['Unisex'].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "language": {
                "default": "de",
                "description": "Language of product names in the result.",
                "enum": ["de", "en", "fr", "es", "nl", "it", "pl", "dk"],
                "type": "string"
              },
              "material": {
                "description": "Material names, e.g. ['Baumwolle'].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "page": {
                "default": 1,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 5,
                "description": "Products per page. With a colour filter a page can hold more or fewer products.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "price_basis": {
                "default": "gross",
                "description": "Whether price_min and price_max include German VAT (gross) or not (net).",
                "enum": ["gross", "net"],
                "type": "string"
              },
              "price_max": {
                "description": "Maximum unit price in EUR.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "price_min": {
                "description": "Minimum unit price in EUR.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "query": {
                "description": "Free-text search, e.g. 'polo shirt organic cotton'.",
                "maxLength": 120,
                "type": "string"
              },
              "size": {
                "description": "Sizes, e.g. ['XL', '3XL'].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "sort": {
                "default": "relevance",
                "enum": ["relevance", "price_asc", "price_desc", "newest"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1382a03403f3ae930b34c18a158219001eb07e27210d53836c82fbe15f5980a"
        },
        {
          "name": "start_own_shop",
          "title": "Start your own shop",
          "description": "Explains the Softwear Prints online shop plans (free, Professional, Enterprise) with prices and returns a link to set up an own shop on softwear-prints.com (staff shop, club or team shop, school, merchandise or event shop), prefilled with the organisation name and type. The user completes the setup and the account on the website; this tool sends nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "billing": {
                "description": "Billing period to preselect for paid plans.",
                "enum": ["monthly", "yearly"],
                "type": "string"
              },
              "organisation": {
                "description": "Name of the shop or organisation, used to prefill the shop name. Optional.",
                "maxLength": 60,
                "pattern": "^[^\\r\\n<>]*$",
                "type": "string"
              },
              "organisation_type": {
                "description": "Kind of organisation, used to prefill the setup: company, staff_shop, club, fire_brigade, school, university, public_authority, brand, artist, merchandise or region_tourism. Optional.",
                "enum": ["company", "staff_shop", "club", "fire_brigade", "school", "university", "public_authority", "brand", "artist", "merchandise", "region_tourism"],
                "type": "string"
              },
              "plan": {
                "description": "Plan to preselect. Without it the setup starts with the free plan; the user can change it there.",
                "enum": ["free", "professional", "enterprise"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Start your own shop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b56474d00f3dcadfec5080497db1e807478a382574210f989fcca809c78bdfd2"
        }
      ],
      "digest": "sha256:8fef119740adb5b07889b0310206638f2920a1c0a6ca42eb86aa7b5b786f41ea"
    }
  }
}
