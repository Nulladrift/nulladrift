            "properties": {
              "commit": {
                "description": "Optional commit SHA or reference the change landed in",
                "type": "string"
              },
              "deployed_url": {
                "description": "Optional URL where the change is now live",
                "type": "string"
              },
              "fix_ids": {
                "description": "The fix_ids you wrote in and deployed (from geoa_pending_fixes)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rolled_back": {
                "description": "Optional {fix_id: reason} for changes you reverted instead of keeping",
