          "name": "get_agent_exposure_scanner",
          "description": "About the FEDLIN Agent Exposure Scanner, a local, read-only tool (not yet released) that will show where AI agents on your machine can reach sensitive data and secrets. Returns its release status and where to get help in the meantime.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
