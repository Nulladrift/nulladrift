      "tools": [
        {
          "name": "get_agent_exposure_scanner",
          "description": "Get the free FEDLIN Agent Exposure Scanner: a local, read-only tool that finds where AI agents on your machine can reach sensitive data (health and personal identifiers) and secrets. Returns install and run instructions. The scan runs entirely on your machine; nothing sensitive leaves it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b4d2473ce6710b77163d7a8b130438a4bb4969335b47e1d3b889501409b5b4aa"
        },
        {
          "name": "scan_domain_trust",
          "description": "Audit a domain's DNS, TLS, certificates, and email authentication (SPF/DKIM/DMARC/DNSSEC).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "A bare public hostname to scan, for example example.com. No scheme, path, or port; IP literals and internal hostnames are rejected.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2fd22d802eb4419cf8f0429c795d3d49e5b885491e48df13eff509ebbe9f98b2"
        },
        {
          "name": "scan_post_quantum",
          "description": "Check whether a domain's TLS is using post-quantum (hybrid ML-KEM) key exchange. Verdicts come from the open-source FEDLIN PQC Toolkit's published ruleset, under the civilian (NIST) or nss (CNSA 2.0) profile.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "A bare public hostname to scan, for example example.com. No scheme, path, or port; IP literals and internal hostnames are rejected.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "profile": {
                "description": "Verdict profile: civilian (NIST FIPS 203/204/205 and IR 8547, the default) or nss (national security systems, CNSA 2.0).",
                "enum": ["civilian", "nss"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a7babd911659409e49a22c71764e66d198640aafe4cc966f2e38e14d47f71e0"
        },
        {
          "name": "scan_security_headers",
          "description": "Grade a domain's HTTP security headers (HSTS, CSP, and more).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
