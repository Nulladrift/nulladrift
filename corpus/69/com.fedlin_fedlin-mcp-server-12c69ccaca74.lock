        },
        {
          "name": "scan_domain_trust",
          "description": "Audit a domain's DNS, TLS, certificates, and email authentication (SPF/DKIM/DMARC/DNSSEC).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "A bare public hostname to scan, for example example.com. No scheme, path, or port; IP literals and internal hostnames are rejected.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
