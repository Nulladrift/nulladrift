                "type": "string"
              },
              "from_city": {
                "description": "出发城市或车站中文名，如 \"青岛\"、\"北京南\"",
                "type": "string"
              },
              "to_city": {
                "description": "到达城市或车站中文名，如 \"北京\"、\"上海虹桥\"",
