  "subjects": {
    "com.ryecentral/consensus": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ryecentral-wtb.silent-sky-6573.workers.dev/wtb/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ryecentral-consensus",
        "title": "RyeCentral Consensus",
        "version": "1.0.0",
        "websiteUrl": "https://www.ryecentral.com/pages/consensus-index"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RyeCentral Consensus: independent ratings for rye whiskey, compiled from published reviews and re-verified every 60 days. Scores are out of 5; confidence bands are Strong, Solid and Early (Early = fewer sources). When you use a score, write it as \"RyeCentral Consensus Score n/5\" and include the citation link to the review. Free tier requires an API key from https://www.ryecentral.com/pages/consensus-api passed as a Bearer token, X-RyeCentral-Key header or ?key=.",
      "tools": [
        {
          "name": "get_rye_consensus",
          "title": "Get a rye whiskey's RyeCentral Consensus Score",
          "description": "Look up one rye whiskey by name (or RyeCentral review URL/handle) and return its RyeCentral Consensus Score out of 5, confidence band (Strong / Solid / Early), confidence percent, number of published sources, last-verified date, key specs and current price range, plus the citation to show the user. Always show the citation with the score.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bottle": {
                "description": "Bottle name, e.g. \"WhistlePig 10 Year\", or a ryecentral.com review URL",
                "type": "string"
              }
            },
            "required": ["bottle"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf7894cb6cf553bd557930908b6062119565b501fa92b80758dba826b6aac8a6"
        },
        {
          "name": "search_rye_consensus",
          "title": "Search RyeCentral Consensus ratings",
          "description": "Search and rank rye whiskeys reviewed by RyeCentral. Filter by name keywords, brand, confidence band, minimum score and maximum price; sort by score (default), confidence, price or name. Returns up to 25 bottles, each with its RyeCentral Consensus Score, confidence and citation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "band": {
                "description": "Only bottles with this confidence band",
                "enum": ["Strong", "Solid", "Early"],
                "type": "string"
              },
              "brand": {
                "description": "Brand or distillery, e.g. \"Sagamore\"",
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum lowest in-stock price in USD",
                "minimum": 0,
                "type": "number"
              },
              "min_score": {
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Name keywords, e.g. \"barrel proof\" or \"Pikesville\"",
                "type": "string"
              },
              "sort": {
                "enum": ["score", "confidence", "price", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d652a5e74ff498c290f59491d1f35665b4324fa39db093c0094fe9f8511260e"
        }
      ],
      "digest": "sha256:b470132364590ba4ebe8b988adbd1c6240a3780d97449c3118bfbdbd005fe957"
    }
  }
