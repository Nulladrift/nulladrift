{
  "lockfileVersion": 2,
  "subjects": {
    "com.marginglow/signal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.marginglow.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "marginglow-signal",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MarginGlow provides specialist, evidence-based business opportunity intelligence for specific small businesses. Use the analysis tool when the user wants practical revenue, margin, cost, conversion, Google visibility or operational opportunities for a named business with a public website. The tool consumes one complimentary or paid Signal credit and never accesses private business accounts.",
      "tools": [
        {
          "name": "analyse_small_business_opportunities",
          "title": "Analyse small-business opportunities",
          "description": "Use this when a user wants practical, evidence-based ways for a specific small business to increase revenue, improve margins, reduce costs, strengthen Google visibility, improve conversion or prioritise growth actions. Requires the business name and public website. Returns structured evidence, ranked opportunities, confidence, commercial impact and first actions. Consumes one complimentary or paid MarginGlow AI Signal credit. Do not use for generic business definitions, investment advice, regulated advice or analysis that requires private financial data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "businessName": {
                "description": "The public name of the specific small business to analyse.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "country": {
                "description": "The business country, when known. Example: Ireland.",
                "maxLength": 80,
                "type": "string"
              },
              "objective": {
                "description": "The user's specific commercial goal, such as more weekday bookings, stronger margins or improved Google visibility.",
                "maxLength": 500,
                "type": "string"
              },
              "website": {
                "description": "The public HTTP or HTTPS website of the business.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["businessName", "website"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "signal": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "transaction": {
                "additionalProperties": false,
                "properties": {
                  "agentId": {
                    "type": "string"
                  },
                  "agentName": {
                    "type": "string"
                  },
                  "allowanceType": {
                    "enum": ["complimentary", "paid"],
                    "type": "string"
                  },
                  "complimentarySignalsRemaining": {
                    "type": "number"
                  },
                  "id": {
                    "type": "string"
                  },
                  "paidSignalsRemaining": {
                    "type": "number"
                  },
                  "replayed": {
                    "type": "boolean"
                  }
                },
                "required": ["agentId", "agentName", "allowanceType", "complimentarySignalsRemaining", "id", "paidSignalsRemaining", "replayed"],
                "type": "object"
              },
              "usage": {
                "additionalProperties": false,
                "properties": {
                  "estimatedAiFootprintKg": {
                    "type": "number"
                  },
                  "totalTokenCount": {
                    "type": "number"
                  }
                },
                "required": ["estimatedAiFootprintKg", "totalTokenCount"],
                "type": "object"
              }
            },
            "required": ["signal", "transaction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a173f39b074e516e4f4d8a25e84af4fd563b201702f0b142e4103948228e1837"
        },
        {
          "name": "check_marginglow_signal_access",
          "title": "Check MarginGlow AI Signal access",
          "description": "Checks the authenticated agent's complimentary and paid MarginGlow AI Signal balances, whether an analysis can run, which allowance will be used next and the latest successfully credited Stripe purchase. This is read-only and does not consume a Signal.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "access": {
                "additionalProperties": false,
                "properties": {
                  "canAnalyse": {
                    "type": "boolean"
                  },
                  "nextAllowanceType": {
                    "anyOf": [
                      {
                        "enum": ["complimentary", "paid"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "status": {
                    "enum": ["ready", "credit_required"],
                    "type": "string"
                  }
                },
                "required": ["canAnalyse", "nextAllowanceType", "status"],
                "type": "object"
              },
              "agent": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["id", "name"],
                "type": "object"
              },
              "balance": {
                "additionalProperties": false,
                "properties": {
                  "complimentarySignalsRemaining": {
                    "type": "number"
                  },
                  "paidSignalsRemaining": {
                    "type": "number"
                  },
                  "totalSignalsRemaining": {
                    "type": "number"
                  }
                },
                "required": ["complimentarySignalsRemaining", "paidSignalsRemaining", "totalSignalsRemaining"],
                "type": "object"
              },
              "latestPurchase": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "amount": {
                        "additionalProperties": false,
                        "properties": {
                          "currency": {
                            "type": "string"
                          },
                          "value": {
                            "type": "number"
                          }
                        },
                        "required": ["currency", "value"],
                        "type": "object"
                      },
                      "appliedAt": {
                        "type": "string"
                      },
                      "checkoutSessionId": {
                        "type": "string"
                      },
                      "creditsGranted": {
                        "type": "number"
                      },
                      "paymentStatus": {
                        "type": "string"
                      },
                      "vat": {
                        "additionalProperties": false,
                        "properties": {
                          "currency": {
                            "type": "string"
                          },
                          "value": {
                            "type": "number"
                          }
                        },
                        "required": ["currency", "value"],
                        "type": "object"
                      }
                    },
                    "required": ["amount", "appliedAt", "checkoutSessionId", "creditsGranted", "paymentStatus", "vat"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "product": {
                "const": "MarginGlow AI Signal",
                "type": "string"
              }
            },
            "required": ["access", "agent", "balance", "latestPurchase", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3910f73ff348d003c9b2b8a75428a59eb8e19ee537bc9869cf1ed3acb3d4cf5f"
        },
        {
          "name": "purchase_marginglow_signal",
          "title": "Purchase a MarginGlow AI Signal",
          "description": "Creates a secure Stripe payment link for one MarginGlow AI Signal costing EUR 2, inclusive of applicable tax. Use this when analyse_small_business_opportunities reports that no Signal credits remain. A payment-capable agent may follow the payment instructions automatically when supported. Otherwise, give the secure checkout URL to the user. After payment, retry the original analysis request with the same agent API key and Idempotency-Key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c43db9fe5677d8b4f57db438cc2ef1a90e24b4e57b4c997ff6371e1506ee1823"
        }
      ],
