      "instructions": "장보기 — 미리 계산해 둔 주간 식단·장바구니(마켓컬리)를 읽어 온다. 계산하지 않는다. 먼저 사용자에게 인원(1~5)·1인 1끼 예산(원)·이번 주 끼니 수(1~7)를 묻고, 세 값을 모두 들은 뒤 get_plan 을 부른다. 묻지 않은 칸에 기본값을 넣지 마라. 예산은 3000·5000·7000 중 가까운 단계(중간값은 낮은 쪽)로 서버가 보낸다 — budget_bucket 과 requested_budget 을 둘 다 사용자에게 알려라. 범위 확인은 list_options. include_recipes=true 는 사용자가 조리법을 물을 때만 쓴다. 알레르기·제외 재료는 반영되지 않았다. 결제는 사용자가 직접 한다.",
      "tools": [
        {
          "name": "get_plan",
          "title": "이번 주 식단·장바구니 가져오기",
          "description": "미리 계산해 둔 이번 주 저녁 식단과 마켓컬리 장바구니(plan.json)를 돌려준다. 서버는 계산하지 않고 발행본 파일 하나를 읽는다. people = 인원(1~5), budget_per_meal = 1인 1끼 예산(원 — 3000·5000·7000 중 가까운 단계로 맞추고, 중간값은 낮은 단계), meals = 이번 주 끼니 수(1~7). 범위 밖 값은 고치지 않고 error 를 돌려준다. include_recipes = true 면 그 주 조리법을 함께 돌려준다(기본 false).",
          "inputSchema": {
            "properties": {
