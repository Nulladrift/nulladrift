                    "maxProperties": 30,
                    "title": "Specifications",
                    "type": "object"
                  }
                },
                "required": ["name"],
                "title": "PublicProduct",
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "consent": {
                "$ref": "#/$defs/Consent"
              },
              "idempotency_key": {
                "maxLength": 100,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_-]+$",
                "title": "Idempotency Key",
                "type": "string"
              },
              "profile": {
                "$ref": "#/$defs/DraftPayload"
              },
              "referral_source": {
                "default": "UNKNOWN",
                "enum": ["DIRECT", "GOOGLE", "BING", "EMAIL_CAMPAIGN", "LINKEDIN", "PARTNER", "REFERRAL", "CHATGPT", "CODEX", "MCP", "A2A", "OTHER_AGENT", "UNKNOWN"],
                "title": "Referral Source",
                "type": "string"
              }
            },
            "required": ["consent", "idempotency_key", "profile"],
            "title": "DraftCreate",
            "type": "object"
