        {
          "name": "create_manufacturer_draft",
          "description": "Submit an explicitly consented private unverified manufacturer draft. Requires real company confirmation before authority and independent review/publication permission before search visibility.",
          "inputSchema": {
            "$defs": {
              "Consent": {
                "additionalProperties": false,
                "properties": {
                  "explicitly_authorized": {
                    "const": true,
                    "title": "Explicitly Authorized",
                    "type": "boolean"
                  },
                  "purpose": {
                    "enum": ["MANUFACTURER_DRAFT", "MANUFACTURER_INTEREST"],
                    "title": "Purpose",
                    "type": "string"
                  },
                  "statement": {
                    "maxLength": 1000,
                    "minLength": 10,
                    "title": "Statement",
                    "type": "string"
                  }
                },
                "required": ["explicitly_authorized", "purpose", "statement"],
                "title": "Consent",
                "type": "object"
              },
              "DraftPayload": {
                "additionalProperties": false,
                "properties": {
                  "catalogue": {
                    "anyOf": [
                      {
                        "maxLength": 2000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Catalogue"
                  },
                  "certifications": {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 20,
                    "title": "Certifications",
                    "type": "array"
                  },
                  "commercial_information": {
                    "anyOf": [
                      {
                        "maxLength": 3000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Commercial Information"
                  },
                  "company_name": {
                    "$ref": "#/$defs/MultilingualText"
                  },
                  "country": {
                    "pattern": "^[A-Z]{2}$|^UNKNOWN$",
                    "title": "Country",
                    "type": "string"
                  },
                  "export_markets": {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 30,
                    "title": "Export Markets",
                    "type": "array"
                  },
                  "price_list": {
                    "anyOf": [
                      {
                        "maxLength": 2000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Price List"
                  },
                  "products": {
                    "items": {
                      "$ref": "#/$defs/PublicProduct"
                    },
                    "maxItems": 30,
                    "title": "Products",
                    "type": "array"
                  },
                  "public_contacts": {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 10,
                    "title": "Public Contacts",
                    "type": "array"
                  },
                  "website": {
                    "anyOf": [
                      {
                        "maxLength": 500,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Website"
                  }
                },
                "required": ["company_name", "country"],
                "title": "DraftPayload",
                "type": "object"
              },
              "MultilingualText": {
                "additionalProperties": false,
                "properties": {
                  "canonical": {
                    "anyOf": [
                      {
                        "maxLength": 3000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Canonical"
                  },
                  "canonical_authority": {
                    "default": "UNKNOWN",
                    "enum": ["CUSTOMER_DECLARED", "SEMANTIC_PROPOSAL", "UNKNOWN"],
                    "title": "Canonical Authority",
                    "type": "string"
                  },
                  "language": {
                    "default": "und",
                    "pattern": "^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$|^und$",
                    "title": "Language",
                    "type": "string"
                  },
                  "original": {
                    "maxLength": 3000,
                    "minLength": 1,
                    "title": "Original",
                    "type": "string"
                  },
                  "translated_views": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "maxProperties": 30,
                    "title": "Translated Views",
                    "type": "object"
                  }
                },
                "required": ["original"],
                "title": "MultilingualText",
                "type": "object"
              },
              "PublicProduct": {
                "additionalProperties": false,
                "properties": {
                  "canonical_concept_id": {
                    "anyOf": [
                      {
                        "pattern": "^[a-z0-9][a-z0-9._:-]{0,99}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Canonical Concept Id"
                  },
                  "capacity": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Capacity"
                  },
                  "certifications": {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 15,
                    "title": "Certifications",
                    "type": "array"
                  },
                  "export_markets": {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 30,
                    "title": "Export Markets",
                    "type": "array"
                  },
                  "hs_cn_code": {
                    "anyOf": [
                      {
                        "pattern": "^[0-9]{4,10}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Hs Cn Code"
                  },
                  "moq": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Moq"
                  },
                  "name": {
                    "$ref": "#/$defs/MultilingualText"
