      "instructions": "ccpcrate resolves the Canadian CCPC corporate rate stack (engine 0.0.1, rules 0.2.7): federal Part I with the SBD and its passive-income / taxable-capital grinds, GRR, refundable Part I, Part IV, ERDTOH / NERDTOH continuity and dividend refund, GRIP, CDA and loss continuity for holdcos, and the provincial layer (Québec CO-771 with the hours test, Ontario / New Brunswick without the passive grind, the other provinces through line 428). Every printed line is rounded half-up to the dollar; the engine never assumes a required input away — read the warnings. Amounts are in dollars. Give groupAaiiPriorYear (line 417) whenever a business limit is claimed, and Québec hours 07a / 07b for the CO-771 layer. Each result has a human-readable summary (text) and the full machine-readable object (structuredContent). ccpcrate_explain and ccpcrate_rules are free; ccpcrate_resolve: Paid: 0.25 USD per call in USDC over x402 (Base); without a payment the call returns the x402 payment requirements.",
      "tools": [
        {
          "name": "ccpcrate_explain",
          "title": "Explain a resolution",
          "description": "Free diagnostic pass over the same input as ccpcrate_resolve: which layers run, the defaults the engine would apply, every warning with its meaning (grind binding, provincial asymmetries, missing inputs), the rule rows in force for the year with sources and verification status, the open verifications, and what the paid computation would return. Contains no computed amounts — the numbers are in ccpcrate_resolve.",
