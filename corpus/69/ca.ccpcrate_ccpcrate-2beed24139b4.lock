{
  "lockfileVersion": 2,
  "subjects": {
    "ca.ccpcrate/ccpcrate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ccpcrate.ca/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ccpcrate",
        "version": "0.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ccpcrate resolves the Canadian CCPC corporate rate stack (engine 0.0.1, rules 0.3.2): federal Part I with the SBD and its passive-income / taxable-capital grinds, GRR, refundable Part I, Part IV, ERDTOH / NERDTOH continuity and dividend refund, GRIP, CDA and loss continuity for holdcos, and the provincial layer (Québec CO-771 with the hours test, Ontario / New Brunswick without the passive grind, the other provinces through line 428). Every printed line is rounded half-up to the dollar; the engine never assumes a required input away — read the warnings. Amounts are in dollars. Give groupAaiiPriorYear (line 417) whenever a business limit is claimed, and Québec hours 07a / 07b for the CO-771 layer. ccpcrate_compensation answers the owner-manager's question on top of it: for a given income before remuneration, what a salary, a dividend or a mix costs in corporate tax, payroll contributions and personal tax (federal T1 with Ontario's ON428 or Québec's TP-1), and what the owner keeps. Each result has a human-readable summary (text) and the full machine-readable object (structuredContent). ccpcrate_explain and ccpcrate_rules are free; ccpcrate_resolve: Free during the launch period; the planned price is 0.25 USDC per call. ccpcrate_group: Free during the launch period; the planned price is 0.25 USDC for the group and its first 2 computed members, 0.05 per additional member, never more than 1. ccpcrate_compensation: Free during the launch period; the planned price is 0.25 USDC for up to 5 scenarios, 0.5 for a sweep or a longer list.",
      "tools": [
        {
          "name": "ccpcrate_compensation",
          "title": "Salary or dividends for an owner-manager",
          "description": "For a corporation's income before its owner's remuneration, compute what each way of taking it out costs and leaves: a salary, a dividend, or a mix. Per scenario it runs the payroll contributions and employer levies on the salary, the corporate return on what is left with the dividend paid out of it (designated eligible up to the GRIP, with the dividend refund), and the owner's personal return (federal T1 with Ontario's ON428 or Québec's TP-1). Give scenarios, or none for a sweep of the salary from nothing to the most the income can pay. Returns the totals, the cash in the owner's hands, what stays in the corporation, the cheapest scenario, and with detail \"full\" the lines of the three layers. Ontario and Québec, 2025 and 2026. The reasonableness of a salary, income splitting and the minimum tax are not assessed, and the result says so. Free during the launch period; the planned price is 0.25 USDC for up to 5 scenarios, 0.5 for a sweep or a longer list.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "calendarYear": {
                "description": "Calendar year of the salary, the dividend and the owner's return. 2025 or 2026",
                "maximum": 2026,
                "minimum": 2025,
                "type": "integer"
              },
              "corporation": {
                "description": "The corporation's context, as in ccpcrate_resolve: groupAaiiPriorYear (line 417, required whenever a business limit is claimed), businessLimitAllocated, rdtohOpening, gripOpening, aggregateInvestmentIncome, and for Québec qc.hours07aCurrentYear / hours07bGroupPriorYear. Its income, dividends and province are set by this tool",
                "properties": {
                  "aggregateInvestmentIncome": {
                    "description": "T2 line 440: aggregate investment income (s.129(4))",
                    "minimum": 0,
                    "type": "number"
                  },
                  "allowableCapitalLosses": {
                    "description": "Sch 6: allowable capital losses of the year",
                    "minimum": 0,
                    "type": "number"
                  },
                  "businessLimitAllocated": {
                    "description": "Business limit allocated to this corporation (Sch 23 line 410 if associated, else the statutory limit). 0 = allocation zero",
                    "minimum": 0,
                    "type": "number"
                  },
                  "capitalGainsDividends": {
                    "description": "Capital-gains dividends received (full amount; half to CDA)",
                    "minimum": 0,
                    "type": "number"
                  },
                  "cdaOpening": {
                    "description": "Capital dividend account opening balance (returns cda_closing)",
                    "minimum": 0,
                    "type": "number"
                  },
                  "dividendsPaidOfWhichConnected": {
                    "description": "How much OF the dividends paid above went to connected corporations — a portion of dividendsPaidEligible + dividendsPaidNonEligible, never an amount on top of them. Raises the cascade warning on the payer side. In a ccpcrate_group call the recipients' own dividendsReceivedConnected amounts govern the 186(1)(b) share; this field is then cross-checked against them",
                    "minimum": 0,
                    "type": "number"
                  },
                  "dividendsReceivedConnected": {
                    "description": "Dividends from connected corporations (s.186(4)) — Part IV only through the payer's refund",
                    "items": {
                      "properties": {
                        "amount": {
                          "description": "Taxable dividend received from the connected corporation",
                          "minimum": 0,
                          "type": "number"
                        },
                        "cascadeShare": {
                          "description": "Precomputed share of the payer's refund, when already known (overrides the two fields above)",
                          "minimum": 0,
                          "type": "number"
                        },
                        "payerDividendRefund": {
                          "description": "The payer's dividend refund for the year it paid the dividend (s.186(1)(b)); 0 = no refund → no cascade; omitted = unknown → cascade withheld with a warning",
                          "minimum": 0,
                          "type": "number"
                        },
                        "payerId": {
                          "description": "Id of the paying corporation when it is a member of the same ccpcrate_group call: its refund and total dividends paid are then taken from its own computation",
                          "minLength": 1,
                          "type": "string"
                        },
                        "payerTotalDividendsPaid": {
                          "description": "Total taxable dividends the payer paid that year (denominator of the recipient's share)",
                          "exclusiveMinimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["amount"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "dividendsReceivedPortfolioEligible": {
                    "description": "Eligible taxable dividends from non-connected payers (Part IV → ERDTOH)",
                    "minimum": 0,
                    "type": "number"
                  },
                  "dividendsReceivedPortfolioNonEligible": {
                    "description": "Non-eligible taxable dividends from non-connected payers (Part IV → NERDTOH)",
                    "minimum": 0,
                    "type": "number"
                  },
                  "foreignBusinessTaxCredit": {
                    "description": "T2 line 636: foreign business income tax credit",
                    "minimum": 0,
                    "type": "number"
                  },
                  "foreignInvestmentIncome": {
                    "description": "T2 line 445: foreign investment income",
                    "minimum": 0,
                    "type": "number"
                  },
                  "foreignNonBusinessTaxCredit": {
                    "description": "T2 line 632: foreign non-business income tax credit",
                    "minimum": 0,
                    "type": "number"
                  },
                  "gripOpening": {
                    "description": "GRIP carried into the year: Schedule 53 line 100 less the eligible dividends paid in the previous year (line 300 net of 310). Returns the GRIP at the end of the year, against which this year's eligible dividends are tested, and what is left to carry forward",
                    "minimum": 0,
                    "type": "number"
                  },
                  "groupAaiiPriorYear": {
                    "description": "T2 line 417: Σ Sch 7 line 745 of the associated group for taxation years ending in the preceding calendar year. REQUIRED whenever a business limit is claimed",
                    "minimum": 0,
                    "type": "number"
                  },
                  "lossesByYearOfOrigin": {
                    "additionalProperties": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "description": "Sch 4 Part 6: opening balances by year of origin, e.g. {\"2011\": 263564}",
                    "propertyNames": {
                      "pattern": "^\\d{4}$",
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "netIncomeAccounting": {
                    "description": "Holdco: net income per financial statements",
                    "type": "number"
                  },
                  "netIncomeForTax": {
                    "description": "Holdco: net income for tax purposes (Sch 1 result) — overrides the derivation",
                    "type": "number"
                  },
                  "nonCapitalLossesClaimedAgainstPartI": {
                    "description": "Non-capital losses claimed against Part I income",
                    "minimum": 0,
                    "type": "number"
                  },
                  "nonCapitalLossesClaimedAgainstPartIV": {
                    "description": "Non-capital / farm losses claimed against Part IV (s.186(1)(c),(d)) — the loss amount",
                    "minimum": 0,
                    "type": "number"
                  },
                  "nonCapitalLossesOpening": {
                    "description": "Sch 4: non-capital loss pool at the start of the year",
                    "minimum": 0,
                    "type": "number"
                  },
                  "otherPropertyIncome": {
                    "description": "Holdco: property income other than dividends and capital-gains dividends",
                    "minimum": 0,
                    "type": "number"
                  },
                  "propertyExpenses": {
                    "description": "Holdco: deductible property expenses of the year (total)",
                    "minimum": 0,
                    "type": "number"
                  },
                  "provincialProportion": {
                    "description": "Share of taxable income allocated to the province (Reg. 402). Default 1",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "qc": {
                    "description": "Québec inputs (CO-771)",
                    "properties": {
                      "capitalVerseGroupPriorYear": {
                        "description": "Capital versé of the associated group, prior year (CO-17 line 426a)",
                        "minimum": 0,
                        "type": "number"
                      },
                      "hours07aCurrentYear": {
                        "description": "CO-771 line 07a: remunerated hours, current year (required with 07b for the CO-771 layer)",
                        "minimum": 0,
                        "type": "number"
                      },
                      "hours07bGroupPriorYear": {
                        "description": "CO-771 line 07b: remunerated hours, associated group, prior year",
                        "minimum": 0,
                        "type": "number"
                      },
                      "instalmentsPaid": {
                        "description": "Acomptes provisionnels paid (CO-17 line 440) — enables the balance lines",
                        "minimum": 0,
                        "type": "number"
                      },
                      "plafondGroupAllocated": {
                        "description": "CO-771 plafond allocated to this corporation (defaults to businessLimitAllocated)",
                        "minimum": 0,
                        "type": "number"
                      },
                      "taxableIncomeQc": {
                        "description": "CO-17 taxable income when it differs from federal",
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "rdtohOpening": {
                    "description": "Opening ERDTOH / NERDTOH in T2 terms. Omitted = 0 with a warning when it matters",
                    "properties": {
                      "erdtohLine520": {
                        "description": "Prior year's closing ERDTOH, T2 line 530 (printed before that year's refund)",
                        "minimum": 0,
                        "type": "number"
                      },
                      "erdtohRefundPrev": {
                        "description": "Prior year's dividend refund out of ERDTOH (line 570)",
                        "minimum": 0,
                        "type": "number"
                      },
                      "nerdtohLine535": {
                        "description": "Prior year's closing NERDTOH, T2 line 545",
                        "minimum": 0,
                        "type": "number"
                      },
                      "nerdtohRefundPrev": {
                        "description": "Prior year's dividend refund out of NERDTOH (line 575)",
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "taxYear": {
                    "description": "The corporation's taxation year. Default: the calendar year. A different year is computed and flagged",
                    "properties": {
                      "end": {
                        "description": "Last day of the taxation year",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "start": {
                        "description": "First day of the taxation year",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      }
                    },
                    "required": ["end", "start"],
                    "type": "object"
                  },
                  "taxableCapitalGains": {
                    "description": "Sch 6: taxable capital gains (the included half)",
                    "minimum": 0,
                    "type": "number"
                  },
                  "taxableCapitalGroupPriorYear": {
                    "description": "T2 line 415: taxable capital employed in Canada of the group, prior year. Omit when under 10 M",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "detail": {
                "description": "How much each scenario returns: \"full\" adds the lines of the three layers (payroll, corporation, personal return); \"totals\" keeps the totals and facts. Default: full for listed scenarios, totals for a sweep",
                "enum": ["totals", "full"],
                "type": "string"
              },
              "eiInsurable": {
                "description": "Whether the owner's employment is insurable under the EI Act. Default false: a shareholder controlling more than 40 % of the voting shares is not",
                "type": "boolean"
              },
              "incomeBeforeRemuneration": {
                "description": "The corporation's active business income for the year BEFORE the owner's salary and the employer's contributions and levies on it",
                "minimum": 0,
                "type": "number"
              },
              "on": {
                "description": "Ontario options",
                "properties": {
                  "ehtExemptionAvailable": {
                    "description": "Whether the employer may claim the Employer Health Tax exemption. Default true",
                    "type": "boolean"
                  },
                  "spouseAdjustedNetIncome": {
                    "description": "Adjusted net income of the spouse or common-law partner, for the LIFT credit. Omitted = computed as a single individual",
                    "minimum": 0,
                    "type": "number"
                  },
                  "taxReductionDependants": {
                    "description": "Dependent children and impaired dependants, for the Ontario tax reduction. Default 0",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "otherPayroll": {
                "description": "Remuneration the employer pays to its other employees in the year. Sets the Québec health services fund rate and the Ontario employer health tax exemption. Default 0",
                "minimum": 0,
                "type": "number"
              },
              "otherPersonalIncome": {
                "description": "The owner's other income of the year, taxed in full (interest, pension). It fills the brackets with the salary and dividend",
                "minimum": 0,
                "type": "number"
              },
              "province": {
                "description": "Province of the corporation and of the owner's residence. Ontario or Québec in this release",
                "enum": ["ON", "QC"],
                "type": "string"
              },
              "qc": {
                "description": "Québec options",
                "properties": {
                  "cnesst": {
                    "description": "CNESST premium. Omitted = not computed, and said",
                    "properties": {
                      "maxInsurable": {
                        "description": "Maximum annual insurable salary. Default: the labour-standards maximum of the year, with a warning",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "ratePer100": {
                        "description": "CNESST premium rate of the employer's classification unit, dollars per 100 dollars of insurable salary",
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["ratePer100"],
                    "type": "object"
                  },
                  "fssRateClass": {
                    "description": "Employer health services fund rate class. Default general",
                    "enum": ["general", "primary_manufacturing"],
                    "type": "string"
                  },
                  "privateDrugPlan": {
                    "description": "Whether the owner is covered by a group drug plan all year. false charges the public plan's premium (TP-1 line 447). Omitted = not charged, with a warning",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "scenarios": {
                "description": "The salary / dividend combinations to compute. Omit for a sweep of the salary from 0 to the most the income can pay, each with the remainder as a dividend",
                "examples": [
                  [
                    {
                      "salary": 0
                    },
                    {
                      "salary": 100000
                    },
                    {
                      "salary": 195569.9
                    }
                  ],
                  [
                    {
                      "dividend": 40000,
                      "salary": 80000
                    }
                  ]
                ],
                "items": {
                  "properties": {
                    "dividend": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        {
                          "const": "remainder",
                          "type": "string"
                        }
                      ],
                      "description": "Taxable dividend paid to the owner, in whole dollars, or \"remainder\" for everything the year leaves after tax, the dividend refund included. Default \"remainder\""
                    },
                    "salary": {
                      "description": "Gross salary paid to the owner in the calendar year",
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["salary"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "sweepStep": {
                "description": "Step of the salary sweep when no scenarios are given. Default 5,000",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["calendarYear", "incomeBeforeRemuneration", "province"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68c4fbf8a202ccff8a3cd31c0ca7ace909e080f02415380414e2e388ff8e61cf"
