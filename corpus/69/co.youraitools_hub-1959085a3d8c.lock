        {
          "name": "check_signature",
          "title": "SignCheck: Check before signing",
          "description": "Call BEFORE your agent signs or sends anything from a wallet. Decodes a transaction, EIP-712 typed data (Permit, Permit2, EIP-3009 USDC authorizations, Seaport orders), an EIP-7702 delegation or an x402 payment (402 terms + payload) into plain English and returns SAFE / CAUTION / DANGER with risk flags (unlimited approvals, setApprovalForAll, fake USDC domains, x402 overpay or wrong payTo, OFAC SDN counterparties). Free preview tier (offline); paid check adds on-chain facts and an eth_call simulation.\nNot for: token due diligence (use check_token) or address screening alone (use screen_address).\n\n[SignCheck via YourAITools MCP Hub] Free tier: same as SignCheck's own MCP server (call without payment and without tier). Paid: lite $0.005 / check $0.015 per call, with a credits key (Authorization: Bearer yatc_...) or x402 (USDC; the hub returns the payment terms). Failed tool calls aren't charged: credits are refunded automatically and x402 payments only settle on success.",
          "inputSchema": {
            "properties": {
              "authorization": {
                "description": "EIP-7702 authorization {address (delegate contract), chainId, nonce}",
                "properties": {
                  "address": {
                    "type": "string"
                  },
                  "chainId": {
                    "type": "integer"
                  },
                  "nonce": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "chain": {
                "description": "base (default), ethereum, base-sepolia or a chain id",
                "examples": ["base"],
                "type": "string"
              },
              "payment_payload": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "description": "The x402 payment payload the agent is about to send.",
                    "properties": {
                      "network": {
                        "type": "string"
                      },
                      "payload": {
                        "properties": {
                          "signature": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "scheme": {
                        "type": "string"
                      },
                      "x402Version": {
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  }
                ],
                "description": "x402 payment you are about to send: PAYMENT-SIGNATURE / X-PAYMENT (base64) or JSON"
              },
              "payment_required": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "description": "The x402 402 response body or decoded PAYMENT-REQUIRED header.",
                    "properties": {
                      "accepts": {
                        "items": {
                          "properties": {
                            "network": {
                              "type": "string"
                            },
                            "payTo": {
                              "type": "string"
                            },
                            "scheme": {
                              "type": "string"
                            }
                          },
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "x402Version": {
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  }
                ],
                "description": "x402 402 terms: the PAYMENT-REQUIRED header (base64) or JSON {accepts:[…]}"
              },
              "tier": {
                "description": "Paid tier: lite $0.005, check $0.015. Omit tier (with no credits key or x402 payment) to use the free tier.",
                "enum": ["lite", "check"],
                "type": "string"
