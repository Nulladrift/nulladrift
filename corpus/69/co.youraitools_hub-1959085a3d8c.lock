      "instructions": "All YourAITools agent tools in one MCP server. 38 of 45 tools have a free tier: call them without payment to use that tool's own free tier (the others are paid only; their descriptions say No free tier). For paid calls either send a prepaid credits key (HTTP header Authorization: Bearer yatc_... or X-Credits-Key; buy at https://api.youraitools.co/credits/ by card or USDC) or pay per call with x402: a paid call without payment returns isError with the x402 PaymentRequired terms; retry with params._meta[\"x402/payment\"]. Optional `tier` picks a paid tier. Failed tool calls aren't charged: credits are refunded automatically and x402 payments only settle on success.",
      "tools": [
        {
          "name": "audit_tools",
          "title": "ToolFit: Audit an agent tool list",
          "description": "Check the tool definitions an agent loads, before they cost tokens or fail: estimated tokens per tool, schema errors per provider (OpenAI, Anthropic, Gemini, Bedrock, MCP; add openai_strict for strict mode) with JSON paths and fixed definitions, tool pairs models will confuse with fix hints, basic poisoning patterns, a grade and a pin (set_id) for diff_tools. Pass \"tools\" (array in any common format) or \"url\" (public remote MCP server; tools are listed, never called). level \"lite\" returns the summary only. Free: 20 calls/day per IP (shared with diff_tools), then $0.003 lite / $0.01 full via x402 or credits.\n\n[ToolFit via YourAITools MCP Hub] Free tier: same as ToolFit's own MCP server (call without payment and without tier). Paid: full $0.01 / lite $0.003 per call, with a credits key (Authorization: Bearer yatc_...) or x402 (USDC; the hub returns the payment terms). Failed tool calls aren't charged: credits are refunded automatically and x402 payments only settle on success.",
          "inputSchema": {
            "properties": {
              "level": {
                "description": "lite = summary only; full (default) = every issue, fixed definitions, pair hints",
                "enum": ["lite", "full"],
                "examples": ["lite"],
                "type": "string"
              },
              "providers": {
                "description": "Providers to check (default openai, anthropic, gemini, bedrock, mcp; add openai_strict for Structured Outputs strict mode). GET: comma list.",
                "items": {
                  "enum": ["openai", "openai_strict", "anthropic", "gemini", "bedrock", "mcp"],
                  "type": "string"
                },
                "type": "array"
              },
              "tier": {
                "description": "Paid tier: full $0.01, lite $0.003. Omit tier (with no credits key or x402 payment) to use the free tier.",
                "enum": ["full", "lite"],
                "type": "string"
              },
              "tools": {
                "description": "Tool definitions: MCP tools/list entries, OpenAI {type:\"function\",function:{...}}, Anthropic {name,description,input_schema}, Gemini functionDeclarations or Bedrock toolSpec. Max 500.",
                "items": {
                  "description": "A tool definition: name, description and inputSchema (MCP tools/list or OpenAI/Anthropic shape).",
