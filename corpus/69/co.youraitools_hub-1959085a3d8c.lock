        {
          "name": "check_perp_order",
          "title": "PerpCheck: Hyperliquid pre-trade order check",
          "description": "Checks a Hyperliquid perp order BEFORE your agent sends it: would the exchange reject it, and what does it cost and risk? Give coin, side and size (coins) or notional (USD); optional limit price, leverage, margin cross/isolated, reduceOnly. Returns REJECT_LIKELY / CAUTION / OK, issues[] with fix values (size decimals, tick, $10 minimum, leverage tier, OI cap, delisted), liquidation estimate, taker impact, funding carry. Free: 30 calls/day per IP.\nNot for: placing, signing or cancelling orders (read-only, no keys, no custody) or other exchanges. Not financial advice.\n\n[PerpCheck via YourAITools MCP Hub] Free tier: same as PerpCheck's own MCP server (call without payment and without tier). Paid: lite $0.003 / full $0.01 per call, with a credits key (Authorization: Bearer yatc_...) or x402 (USDC; the hub returns the payment terms). Failed tool calls aren't charged: credits are refunded automatically and x402 payments only settle on success.",
