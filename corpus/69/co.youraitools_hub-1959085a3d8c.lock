        {
          "name": "audit_website",
          "title": "AgentReady: AI-agent readiness audit",
          "description": "AI-agent readiness audit of a website: score 0-100, grade and verdict across agent access (robots.txt rules for AI bots, bot challenges), readable content (raw HTML, markdown), discovery (llms.txt, sitemap, JSON-LD, meta/OG), agent interfaces (OpenAPI, MCP, A2A agent card, x402) and speed/HTTPS. Free preview tier: score, grade and category scores. The paid x402 endpoints /v1/lite ($0.005) and /v1/audit ($0.03) add the findings, prioritized fixes and ready-to-paste snippets (llms.txt draft, robots.txt lines, JSON-LD).\n\n[AgentReady via YourAITools MCP Hub] Free tier: same as AgentReady's own MCP server (call without payment and without tier). Paid: lite $0.005 / audit $0.03 per call, with a credits key (Authorization: Bearer yatc_...) or x402 (USDC; the hub returns the payment terms). Failed tool calls aren't charged: credits are refunded automatically and x402 payments only settle on success.",
          "inputSchema": {
            "properties": {
              "tier": {
                "description": "Paid tier: lite $0.005, audit $0.03. Omit tier (with no credits key or x402 payment) to use the free tier.",
