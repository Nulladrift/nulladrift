        {
          "name": "check_counterparty",
          "title": "CounterpartyCheck: Pre-payment counterparty check",
          "description": "Pre-payment counterparty check: before paying, approving or interacting with an EVM (Base, Ethereum, Polygon, Arbitrum One) or Solana address, get ok / caution / block. Free preview tier: verdict, confidence, address kind and flag counts. The paid x402 endpoints /v1/lite ($0.005), /v1/quick ($0.015) and /v1/full ($0.05) add the reasons and evidence (OFAC SDN, scam lists, x402 directory, verification, deployer, names, cross-chain, age, exposure). Informational safety check, not legal or financial advice.\n\n[CounterpartyCheck via YourAITools MCP Hub] Free tier: same as CounterpartyCheck's own MCP server (call without payment and without tier). Paid: lite $0.005 / quick $0.015 / full $0.05 per call, with a credits key (Authorization: Bearer yatc_...) or x402 (USDC; the hub returns the payment terms). Failed tool calls aren't charged: credits are refunded automatically and x402 payments only settle on success.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Counterparty address: EVM 0x + 40 hex, or a Solana base58 address",
                "examples": ["0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"],
                "type": "string"
              },
              "chain": {
                "description": "Chain of the payment (default base; a base58 address implies solana)",
