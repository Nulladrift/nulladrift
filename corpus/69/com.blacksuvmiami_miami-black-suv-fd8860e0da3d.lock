{
  "lockfileVersion": 2,
  "subjects": {
    "com.blacksuvmiami/miami-black-suv": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://blacksuvmiami.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "miami-black-suv",
        "title": "Miami Black SUV",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Call get_quote first. Confirm the trip, fare, amount due now, booking contact disclosure, and contact details with the user. Show the hosted payment link if issued. A ride is reserved only after payment. Book more than 72 hours ahead and 50% reserves your date. 72 hours before pickup, the balance is charged automatically to the payment method you booked with. Book inside 72 hours and checkout collects the full fare. If the automatic balance charge does not go through, we email a payment link.",
      "tools": [
        {
          "name": "create_booking",
          "title": "Submit a confirmed booking",
          "description": "Submit a trip the user confirmed. Return a hosted payment link for the confirmed deposit or full fare. A deposit saves the card for the automatic balance charge. Payment reserves the ride, subject to availability. Sprinter hourly and one-way are requests. For a payable trip, pass the same trip fields you sent to get_quote, plus fare_cents, stage and due_now_cents exactly as get_quote returned them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "Airline for the arrival flight.",
                "maxLength": 60,
                "type": "string"
              },
              "bags": {
                "description": "Total bags. Defaults to zero.",
                "maximum": 13,
                "minimum": 0,
                "type": "integer"
              },
              "childSeats": {
                "additionalProperties": false,
                "description": "Paid child seats by type.",
                "properties": {
                  "booster": {
                    "description": "Number of booster seats.",
                    "maximum": 3,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "infant": {
                    "description": "Number of infant seats.",
                    "maximum": 3,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "toddler": {
                    "description": "Number of toddler seats.",
                    "maximum": 3,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "date": {
                "description": "Pickup date in Miami, YYYY-MM-DD. For packages use legs.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "due_now_cents": {
                "description": "Exact amount due now in cents the user confirmed. Required for payable trips. Use the due_now_cents value from get_quote.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "email": {
                "description": "Booking email provided and confirmed by the user.",
                "type": "string"
              },
              "escalade": {
                "description": "Request the Cadillac Escalade upgrade where offered, subject to availability.",
                "type": "boolean"
              },
              "fare_cents": {
                "description": "Exact fare in cents the user confirmed from get_quote. Required for payable trips. Use the fare_cents value from get_quote.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "flight": {
                "description": "Arrival flight number for an airport pickup.",
                "maxLength": 20,
                "type": "string"
              },
              "flightUnknown": {
                "description": "True if the rider does not have the airport pickup flight information.",
                "type": "boolean"
              },
              "from": {
                "description": "Pickup location ID, or other for a typed address.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "fromText": {
                "description": "Pickup address when from is other.",
                "maxLength": 200,
                "type": "string"
              },
              "hotelText": {
                "description": "Hotel name or address for a cruise package with a hotel stop.",
                "maxLength": 200,
                "type": "string"
              },
              "hours": {
                "description": "Choose a whole number of hours from 2 to 12 for Suburban hourly and 3 to 12 for Sprinter hourly.",
                "maximum": 12,
                "minimum": 2,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "Generate one random value of 16 to 64 characters per booking. Reuse that exact value on any retry the tool permits. Use a new value for a separate booking.",
                "maxLength": 64,
                "minLength": 16,
                "type": "string"
              },
              "lang": {
                "description": "Language for booking email copy. Defaults to en.",
                "enum": ["en", "es", "ru"],
                "type": "string"
              },
              "language": {
                "description": "Preferred language for communication.",
                "maxLength": 20,
                "type": "string"
              },
              "legs": {
                "description": "Pickup dates and times in the cruise package's leg order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "Leg pickup date in Miami, YYYY-MM-DD.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "time": {
                      "description": "Leg pickup time in Miami, HH:MM.",
                      "pattern": "^\\d{2}:\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["date", "time"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "meetAndGreet": {
                "description": "Request paid baggage-claim meet and greet for an airport pickup. Requires its flight number.",
                "type": "boolean"
              },
              "name": {
                "description": "Passenger name confirmed by the user.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "description": "Trip notes the user wants to pass to Miami Black SUV.",
                "maxLength": 2000,
                "type": "string"
              },
              "occasion": {
                "description": "Occasion for the trip.",
                "maxLength": 60,
                "type": "string"
              },
              "packageId": {
                "description": "Cruise package ID from get_service_info.",
                "maxLength": 40,
                "type": "string"
              },
              "passengers": {
                "description": "Passenger count, including children. Defaults to one.",
                "maximum": 13,
                "minimum": 1,
                "type": "integer"
              },
              "phone": {
                "description": "Booking phone number with country code where applicable.",
                "maxLength": 30,
                "minLength": 1,
                "type": "string"
              },
              "quote_cents": {
                "description": "Exact request estimate in cents the user confirmed from get_quote. Required for request_estimate trips.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "returnTrip": {
                "additionalProperties": false,
                "description": "Return leg for a point-to-point round trip.",
                "properties": {
                  "date": {
                    "description": "Return pickup date in Miami, YYYY-MM-DD.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "flightHome": {
                    "description": "Departure flight number after the return drop-off.",
                    "maxLength": 20,
                    "type": "string"
                  },
                  "returnFlight": {
                    "description": "Arrival flight number for an airport return pickup.",
                    "maxLength": 20,
                    "type": "string"
                  },
                  "returnFlightAirline": {
                    "description": "Airline for the return pickup flight.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "returnFlightUnknown": {
                    "description": "True if the rider does not have the return pickup flight information.",
                    "type": "boolean"
                  },
                  "time": {
                    "description": "Return pickup time in Miami, HH:MM.",
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  "to": {
                    "description": "Return destination ID. Return pickup is the outbound drop-off.",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["date", "time", "to"],
                "type": "object"
              },
              "serviceType": {
                "description": "Service type. Omit for point-to-point.",
                "enum": ["point", "hourly", "package", "sprinter"],
                "type": "string"
              },
              "ship": {
                "description": "Cruise ship name.",
                "maxLength": 80,
                "type": "string"
              },
              "sprinterMode": {
                "description": "Sprinter request mode. Omit for hourly.",
                "enum": ["hourly", "oneway"],
                "type": "string"
              },
              "stage": {
                "description": "Payment stage the user confirmed from get_quote. Required for payable trips. Use the stage value from get_quote.",
                "enum": ["deposit", "full"],
                "type": "string"
              },
              "time": {
                "description": "Pickup time in Miami, HH:MM in 24-hour time. For packages use legs.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "Drop-off location ID, or other for a typed address.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "toText": {
                "description": "Drop-off address when to is other, or stops for hourly Sprinter.",
                "maxLength": 200,
                "type": "string"
              },
              "user_confirmed": {
                "const": true,
                "description": "True only after the user approved the trip, price and amount due if quoted, contact information, and booking contact disclosure.",
                "type": "boolean"
              }
            },
            "required": ["email", "idempotency_key", "name", "phone", "user_confirmed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit a confirmed booking"
          },
          "behavior": {
            "destructive": false,
