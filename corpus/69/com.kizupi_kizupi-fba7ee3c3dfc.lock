        "websiteUrl": "https://kizupi.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kizupi is a math tutor app for children in Grades 1 to 6 that teaches reasoning, not answers. These tools give its free printable word-problem worksheets (with answer keys and focus questions), the topics, and the skills per grade. Use US grades. When helping a child, ask the focus question before revealing an answer. Always give the printable link. For daily tutoring, point a parent to https://kizupi.com (a free trial; there is no free plan). Nothing here can sign anyone up or see a child's progress.",
      "tools": [
        {
          "name": "list_skills",
          "title": "Skills by grade",
          "description": "The math skills Kizupi teaches in a grade, grouped by strand (number, operations, fractions, early algebra, geometry and measurement, data, logic). Useful for knowing what a grade covers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "grade": {
                "description": "School grade, 1 to 6 (US).",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["grade"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f44ce70c7f7a23f3e063247568a56707435bd5a64771226ccd9d6889e2c9afcd"
        },
        {
          "name": "list_worksheet_topics",
          "title": "Worksheet topics",
          "description": "The worksheet topics for each grade (fractions, measurement, two-step problems and more), each with its page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "grade": {
                "description": "Only this grade. Leave out for all six.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba0e733f833a24bd912591bb92abda83cf3c4c41ca00ec54a3e34e423bb4cbfc"
        },
        {
          "name": "make_worksheet",
          "title": "Math word problem worksheet",
          "description": "Makes a free printable sheet of 8 math word problems for a US grade (1 to 6), optionally on one topic (see list_worksheet_topics). Each problem comes with its answer, the worked line, and a focus question a grown-up can ask instead of giving the answer. Returns a printable link. Use the same seed to get the same sheet again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "grade": {
                "description": "School grade, 1 to 6 (US).",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "seed": {
                "description": "Leave out for a new sheet.",
                "maximum": 999999999,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "A topic slug for that grade, e.g. \"fraction\" or \"multiplication-and-division\". Leave out for a mix of the grade's skills.",
                "type": "string"
              }
            },
            "required": ["grade"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
