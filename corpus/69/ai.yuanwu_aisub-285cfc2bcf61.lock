              "locale": {
                "default": "en",
                "description": "Language for region and plan names: en (default) or zh.",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "pack": {
                "default": "all",
                "description": "all (default), unit for single-credit prices, or a pack quantity such as 1000.",
                "pattern": "^(?:all|unit|[1-9]\\d{0,30})$",
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
