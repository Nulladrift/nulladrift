                    "pattern": "^app_[1-9]\\d{5,14}$",
                    "type": "string"
                  }
                ],
                "default": "chatgpt",
                "description": "Product key returned by list_catalog, including dynamically registered app_<apple-id> products."
              },
              "region": {
                "description": "Optional filter by region code or name.",
                "maxLength": 100,
                "type": "string"
