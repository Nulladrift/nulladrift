      "instructions": "AISub (https://aisub.yuanwu.ai) tracks published AI subscription prices by country and region, including website and App Store sources. Available products and periods depend on reviewed data.\nStart with compare_prices for rankings across regions or get_region_prices for one country; call list_catalog when you need plan keys or region codes.\nReference prices prefer the tax-inclusive amount and use the tax-exclusive amount only when it is strictly lower. tax=unknown means the source does not state whether tax is included; it does not mean tax-free. Actual charges, including tax, are confirmed at checkout.\nApp Store yearly amounts are full-year totals. Billing periods are explicit only when stated in the source; same-item monthly/yearly amount pairs may be inferred and retain both pieces of evidence. Unlabeled single amounts follow the global period policy; monthly defaults remain inferred, while manual assignments have their own provenance. Unknown observations can be queried with interval=unknown and are not subscription quotes.\nChatGPT Business and Business 5x are priced per seat: the monthly amount is the per-seat monthly price, and the yearly amount is the per-seat monthly equivalent when paying yearly (full-year reference = yearly monthly equivalent × 12).\nEvery price response states when the quotes and the exchange rates were last updated (UTC). Quote these times and link the source URL when answering. A listed price does not prove that a user can buy the plan in that region.",
      "tools": [
        {
          "name": "compare_credits",
          "title": "Compare credit pack prices",
          "description": "Compare credit pack prices (extra usage credits sold on top of a subscription, such as ChatGPT credits) across regions, normalised to the price per 100 credits in one currency. Answers questions like \"where are ChatGPT credits cheapest?\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "channel": {
                "description": "Sales channel: web (regional website prices) or app_store (iOS). Defaults to web for ChatGPT and app_store for other products.",
                "enum": ["web", "app_store"],
                "type": "string"
              },
              "currency": {
                "description": "ISO 4217 currency for converted reference prices, e.g. USD, CNY, EUR. Defaults to USD for en and CNY for zh.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "item": {
                "default": "all",
                "description": "An item key from availableItems, or all.",
                "pattern": "^[a-zA-Z0-9_:-]{1,80}$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language for region and plan names: en (default) or zh.",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "pack": {
                "default": "all",
                "description": "all (default), unit for single-credit prices, or a pack quantity such as 1000.",
                "pattern": "^(?:all|unit|[1-9]\\d{0,30})$",
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "product": {
                "anyOf": [
                  {
                    "enum": ["chatgpt", "claude", "gemini", "perplexity", "grok"],
                    "type": "string"
                  },
                  {
                    "pattern": "^app_[1-9]\\d{5,14}$",
                    "type": "string"
                  }
                ],
                "default": "chatgpt",
                "description": "Product key returned by list_catalog, including dynamically registered app_<apple-id> products."
              },
              "region": {
                "description": "Optional filter by region code or name.",
                "maxLength": 100,
                "type": "string"
              },
              "sort": {
                "default": "price_asc",
                "description": "price_asc: cheapest per 100 credits first (default); price_desc; region: alphabetical.",
                "enum": ["price_asc", "price_desc", "region"],
                "type": "string"
