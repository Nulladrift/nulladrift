                "description": "ISO 4217 currency for converted reference prices, e.g. USD, CNY, EUR. Defaults to USD for en and CNY for zh.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "interval": {
                "anyOf": [
                  {
                    "pattern": "^(?:month|year|(?:day|week)_(?:[1-9]\\d{0,3}|10000)|(?:month|year)_(?:[2-9]|[1-9]\\d{1,3}|10000))$",
                    "type": "string"
