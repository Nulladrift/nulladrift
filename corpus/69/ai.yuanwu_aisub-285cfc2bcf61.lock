      "serverInfo": {
        "name": "aisub",
        "title": "AISub AI subscription prices",
        "version": "1.0.0",
        "websiteUrl": "https://aisub.yuanwu.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AISub (https://aisub.yuanwu.ai) tracks published AI subscription prices by country and region, including website and App Store sources. Available products and periods depend on reviewed data. Claude website reference prices use get_reference_prices and have no country.\nStart with compare_prices for rankings across regions or get_region_prices for one country; call list_catalog when you need plan keys or region codes.\nReference prices prefer the tax-inclusive amount and use the tax-exclusive amount only when it is strictly lower. tax=unknown means the source does not state whether tax is included; it does not mean tax-free. Actual charges, including tax, are confirmed at checkout.\nApp Store yearly amounts are full-year totals. Billing periods are explicit only when stated in the source; same-item monthly/yearly amount pairs may be inferred and retain both pieces of evidence. Unlabeled single amounts remain unknown.\nChatGPT Business and Business 5x are priced per seat: the monthly amount is the per-seat monthly price, and the yearly amount is the per-seat monthly equivalent when paying yearly (full-year reference = yearly monthly equivalent × 12).\nEvery price response states when the quotes and the exchange rates were last updated (UTC). Quote these times and link the source URL when answering. A listed price does not prove that a user can buy the plan in that region.",
      "tools": [
        {
          "name": "compare_credits",
          "title": "Compare credit pack prices",
          "description": "Compare credit pack prices (extra usage credits sold on top of a subscription, such as ChatGPT credits) across regions, normalised to the price per 100 credits in one currency. Answers questions like \"where are ChatGPT credits cheapest?\".",
