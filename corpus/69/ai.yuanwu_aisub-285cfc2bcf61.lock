          "description": "Rank the price of one subscription plan (e.g. ChatGPT Plus, Claude Pro, Google AI Pro) across countries and regions, converted to one currency. Answers questions like \"where is ChatGPT Plus cheapest?\" or \"how much is Claude Pro in Turkey?\". Calendar-month periods provide monthly references; day/week periods keep their declared period. Conditional or complex offers do not enter general rankings. Each response includes when the prices and exchange rates were last updated.",
