      "instructions": "Wieldr is a read-only radar of games gaining players right now on Roblox, Fortnite and Steam (plus iOS and itch.io catalogs): emerging games, niches and their opportunity window, what top games lack, player complaints, Steam tag trends and viral videos. If the user names a game, a Wieldr id or a Fortnite island code, call get_game first (it resolves titles and lists other matches) and reuse the returned id; to follow their own game, track_my_game. To decide what to build: get_market_overview (coverage and freshness), then list_niches or find_opportunities (pass teamSize and horizonWeeks: niches ranked by timing and feasibility, each with a reason), then analyze_niche on a niche, then get_gap_analysis (what its top 5 games lack), then get_game / get_game_history / get_player_complaints / get_viral_videos on returned ids; for Steam projects, get_tag_trends; find_emerging_games for rising games. Lists page with nextCursor (pass it back as cursor). Definitions of momentum, heat, stages, windows, feasibility, thresholds and revenue estimates: resource wieldr://methodology. A null field means unknown, never zero, and comes with its reason. Every figure carries asOf, source and grade; feasibility and timing are heuristics, revenue numbers are estimate ranges, never measured sales, and nothing here guarantees a result. When suggesting what to build, propose original games that reuse a mechanic and fix the player complaints, never copies of names, art or code. If the user asks to recreate or copy a specific existing game, do not; offer the niche view instead: its mechanic family (analyze_niche), how crowded it is and who leads, what its top games lack (get_gap_analysis), and an original take that changes the theme, the twist or the loop.",
