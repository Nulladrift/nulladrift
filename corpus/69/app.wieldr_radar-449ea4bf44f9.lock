        {
          "name": "analyze_niche",
          "title": "Analyze a niche",
          "description": "Evaluate one niche, always in the same format: kind \"tracked\" (ranked by Wieldr, Roblox or Fortnite) or \"computed\" (keyword computed live over moving games; stage, heat, window and studios null), stage, heat, window, stage history, games, new games and new winners, top game share, median growth, its fastest-rising games, the aggregated player complaints and crossPlatform (the same mechanic ranked on the other platform, Roblox <-> Fortnite). Heat weights are an uncalibrated estimate. Every game carries asOf (export time, UTC), source and grade (grade = completeness of the game record (A = 8+ of 10 data points known, B = 6-7, C = 4-5, D = fewer); estimate grade: B = tighter range, C = wide range, D = very rough order of magnitude.) Revenue figures are estimates with a range and a grade, never measured sales and never a guarantee. Definitions: resource wieldr://methodology.",
