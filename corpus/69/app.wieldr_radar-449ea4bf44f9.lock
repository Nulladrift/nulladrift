                "description": "Niche label, key or keyword: a ranked Roblox or Fortnite niche (e.g. \"Ragdoll\", \"Tycoon\", from list_niches), a genre (e.g. \"Simulation\") or a word in game titles (e.g. \"brainrot\").",
                "type": "string"
