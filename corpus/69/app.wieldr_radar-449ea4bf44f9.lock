        {
          "name": "find_emerging_games",
          "title": "Find emerging games",
          "description": "Find games that are gaining players or reviews right now (Roblox, Steam, Fortnite; iOS and itch.io have no momentum reading yet). Filter by platform, genre, title keyword, players online, age, positive share, niche stage; exclude ids already seen; page with nextCursor. Sort values are the field they sort by: momentum (default), growth24hPct, playersNow, acceleration, newest (smallest ageDays). By default small Steam games are hidden (50+ reviews in 7 days and 50+ players online when measured): includeSmall=true shows them. Start here for \"what is rising\" questions, then call get_game on an id. Every game carries asOf (export time, UTC), source and grade (grade = completeness of the game record (A = 8+ of 10 data points known, B = 6-7, C = 4-5, D = fewer); estimate grade: B = tighter range, C = wide range, D = very rough order of magnitude.) Revenue figures are estimates with a range and a grade, never measured sales and never a guarantee. Definitions: resource wieldr://methodology.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "nextCursor from the previous call, to get the next page. Omit for the first page.",
                "type": "string"
              },
              "excludeIds": {
                "description": "Wieldr ids to leave out (e.g. games already suggested).",
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "genre": {
                "description": "Exact genre, e.g. \"Simulation\", \"Tycoon\", \"Action\".",
                "type": "string"
              },
              "includeSmall": {
                "description": "true = also return small Steam games under the default floor.",
                "type": "boolean"
              },
              "keyword": {
                "description": "Word in the title or genre, e.g. \"brainrot\".",
                "type": "string"
              },
              "limit": {
                "description": "How many results per page (default 10, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "maxAgeDays": {
                "description": "Only games released at most this many days ago.",
                "minimum": 0,
                "type": "integer"
              },
              "maxPlayers": {
                "description": "Maximum players online now (find small games before they are crowded).",
                "minimum": 0,
                "type": "integer"
              },
              "minPlayers": {
                "description": "Minimum players online now.",
                "minimum": 0,
                "type": "integer"
              },
              "minPositivePct": {
                "description": "Minimum share of positive reviews or votes (0-100); games with an unknown share are left out.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "nicheStage": {
                "description": "Only games in a ranked Roblox or Fortnite niche at this stage (see list_niches).",
                "enum": ["forming", "heating", "crowded", "dominated", "established"],
                "type": "string"
              },
              "onlyAnomalies": {
                "description": "Only games flagged as a velocity anomaly.",
                "type": "boolean"
              },
              "platform": {
                "description": "steam, roblox, ios, itch (itch.io) or fortnite. Omit for all platforms.",
                "enum": ["steam", "roblox", "ios", "itch", "fortnite"],
                "type": "string"
              },
              "sort": {
                "description": "Field to sort by, descending (newest = youngest first). Default momentum.",
                "enum": ["momentum", "growth24hPct", "playersNow", "acceleration", "newest"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "description": "Export time, UTC (ISO 8601).",
                "type": "string"
              },
