      },
      "instructions": "ASIN402: live Amazon product data for AI agents (11 marketplaces). No wallet? product_preview gives a few free basic lookups a day. Paid tools cost a few cents in USDC on Base via x402: an unpaid call returns a payment quote; an x402 MCP client (e.g. @x402/mcp) pays and repeats the call. Failed calls are never charged. Try free_sample first to see the output. Start with check_deal, sell_score or fba_profit for one ASIN; find_products + get_products for research. Docs: https://asin402.com/llms.txt",
      "tools": [
        {
          "name": "best_sellers",
          "title": "Amazon best sellers for a category",
          "description": "Ordered best-seller ASINs for a category ID (find IDs with search_categories). About $0.007.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category ID",
                "type": "string"
              },
              "domain": {
                "description": "Amazon marketplace, default us",
                "enum": ["us", "uk", "de", "fr", "jp", "ca", "it", "es", "in", "mx", "br"],
                "type": "string"
              },
              "limit": {
                "description": "Top N (default 100)",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
