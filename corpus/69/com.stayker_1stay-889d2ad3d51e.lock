        {
          "name": "resend_confirmation",
          "title": "Resend Confirmation",
          "description": "Resend a hotel reservation confirmation email. Use either the confirmation number from a successful lookup_booking call, or the guest's full name and email address when they do not know their confirmation number, card last four, or check-in date. The email contains the hotel confirmation number the guest can then use with lookup_booking or cancel_booking. Recovery requests never reveal whether a reservation matched. The confirmation is sent only to the email address already on the booking record; there is no recipient override. Email changes are handled at https://stayker.com/service.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirmation_number": {
                "description": "Hotel confirmation number. Use this after a verified lookup.",
                "type": "string"
              },
              "email": {
                "description": "Guest email address. Used only to find a match; confirmation is sent only to the email address already on file.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "first_name": {
                "description": "Guest first name. Required with last_name and email when the confirmation number is unavailable.",
                "type": "string"
              },
              "last_name": {
                "description": "Guest last name. Required with first_name and email when the confirmation number is unavailable.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Resend Confirmation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b0a5299125c0d4210d814a494af48c4a85e3d94f4ecba64cb89c56084aac3b6"
        },
        {
