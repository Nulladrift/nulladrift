          "name": "lookup_booking",
          "title": "Find Reservation",
          "description": "Look up a reservation by verifying the guest's identity. Returns the confirmation number and booking summary in conversation.\n\nRequires the guest's full name plus either the hotel confirmation number, or the booking email together with the last 4 digits of the card used to book. An email address alone is not enough. An optional check-in date can narrow repeat stays.",
