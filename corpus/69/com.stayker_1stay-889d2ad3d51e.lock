        {
          "name": "get_booking",
          "title": "View Booking Details",
          "description": "Look up a reservation exclusively by the hotel confirmation number shown in the guest's confirmation email. Internal Stayker booking IDs are never accepted or disclosed by MCP. Returns full booking details including hotel, dates, guest info, rate, and status.\n\nAnonymous access requires a verification_token issued by lookup_booking and scoped to a single booking. Without a valid token, no booking data is returned. Developers authenticated with their own API key do not need a token; their access is scoped to their own bookings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirmation_number": {
                "description": "Hotel confirmation number shown in the guest's confirmation email",
                "type": "string"
              },
              "verification_token": {
                "description": "Booking-scoped verification token required for anonymous access. Developer API key-authenticated access does not require it.",
                "type": "string"
              }
            },
            "required": ["confirmation_number"],
            "type": "object"
          },
          "outputSchema": {
