        {
          "name": "cancel_booking",
          "title": "Cancel Booking",
          "description": "Prepare a hotel cancellation for completion on a secure 1Stay page. Verifies the guest's first name, last name, and hotel confirmation number, then returns the hotel policy classification and any cancellation deadline recorded with the reservation, plus a short-lived cancellation_url. 1Stay does not estimate a refund, credit, penalty, or hotel charge. Calling this tool never cancels the reservation. The guest must review the terms and select Cancel reservation on the secure page. A later verified booking-status lookup reporting status cancelled is the authoritative confirmation that the reservation was cancelled.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirmation_number": {
                "description": "Hotel confirmation number",
                "type": "string"
              },
              "first_name": {
                "description": "Guest first name on the reservation",
                "type": "string"
              },
              "last_name": {
                "description": "Guest last name on the reservation",
                "type": "string"
              }
            },
            "required": ["confirmation_number", "first_name", "last_name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "booking": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "cancellation": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cancellation_url": {
                "format": "uri",
                "type": "string"
              },
              "cancellation_url_expires_at": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "status": {
                "enum": ["ACTION_REQUIRED", "already_cancelled"],
                "type": "string"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Cancel Booking"
          },
          "behavior": {
