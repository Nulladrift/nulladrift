      "serverInfo": {
        "name": "1stay",
        "version": "1.0.0",
        "description": "1Stay — Hotel booking for AI conversations. Search 250,000+ properties worldwide across major brands (Marriott, Hilton, IHG, Hyatt, Wyndham, Best Western, Choice) and independent/boutique hotels. Get live rates, room details, and cancellation policies. Book with a secure checkout link — guest pays the hotel directly and receives the hotel's own confirmation number. Loyalty points apply to every booking. Displayed totals include taxes and any applicable, itemized 1Stay Booking Fee."
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "book_hotel",
          "title": "Book Hotel",
          "description": "Book exactly one hotel room. The first 1Stay release does not support multi-room searches or reservations. Returns a secure checkout URL. This tool accepts no guest identity or payment fields. Name, email, phone, and payment details are collected on the secure checkout page.\n\nGuest pays the hotel directly. Their credit card statement shows the hotel name, not 1Stay. Hotel's own confirmation number. Loyalty points apply automatically. The displayed total includes taxes and any applicable, itemized 1Stay Booking Fee.\n\nRequires a rate_code from get_hotel_details, valid approximately 15 minutes. Expired codes are rejected.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "check_in": {
                "description": "Check-in date in YYYY-MM-DD format (e.g. 2026-05-06)",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date in YYYY-MM-DD format (e.g. 2026-05-07)",
                "type": "string"
              },
              "external_reference_id": {
                "description": "Caller-defined unique reference ID for idempotency and retrieval",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests, 1-10",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "hotel_id": {
                "description": "Hotel ID from search or details",
                "type": "string"
              },
              "rate_code": {
                "description": "Valid, unexpired rate code for the selected hotel, dates, and room",
                "type": "string"
              }
            },
            "required": ["check_in", "check_out", "guests", "hotel_id", "rate_code"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "avg_nightly_rate": {
                "type": "number"
              },
