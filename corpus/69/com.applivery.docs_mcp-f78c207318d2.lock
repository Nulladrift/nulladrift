{
  "lockfileVersion": 2,
  "subjects": {
    "com.applivery.docs/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://docs.applivery.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "applivery-docs",
        "title": "Applivery Documentation",
        "version": "2.4.0"
      },
      "capabilities": {
        "completions": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only access to the public Applivery documentation (https://docs.applivery.com).\nTypical workflow: call list_doc_sections once for orientation, search_docs to find pages, then get_doc_page to read one.\nFor REST API endpoints, get_api_endpoint returns the machine-readable OpenAPI definition (method, path, parameters, schemas) of an API reference page — use it when constructing or validating actual API requests.\nDoc pages are also MCP resources: search_docs results include resource_link items whose URI is the canonical page URL, readable via resources/read.\nEvery search result and section carries a docType: 'guides' (product documentation and how-tos for admins and end users) or 'api' (REST API reference for developers).\nWhen answering a non-developer question, prefer 'guides' results. If only the API reference covers the topic, say the capability is available via the Applivery API and link the page — do not present endpoint details as product UI instructions.\nAll content is public; no authentication is needed.",
      "tools": [
        {
          "name": "get_api_endpoint",
          "title": "Get an Applivery API endpoint definition",
          "description": "Get the machine-readable OpenAPI definition of one Applivery REST API endpoint: method, path, baseUrl, security, parameters, requestBody and responses — fully dereferenced, no $refs. Pass the `url` or `slug` of an API reference page; find those with search_docs using docType 'api'. Use this instead of get_doc_page when you need to construct or validate an actual API request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "description": "Locale for the slug, e.g. 'en' (default en).",
                "type": "string"
              },
              "slug": {
                "description": "Path after the locale, e.g. 'api/android/web-apps/delete-web-app'. Used with locale when url is not given.",
                "type": "string"
              },
              "url": {
                "description": "A docs.applivery.com API reference page URL, e.g. from a search_docs result with docType 'api'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "baseUrl": {
                "type": "string"
              },
              "method": {
                "description": "HTTP method, uppercase.",
                "type": "string"
              },
              "parameters": {
                "description": "OpenAPI parameter objects (dereferenced)."
              },
              "path": {
                "description": "Endpoint path template.",
                "type": "string"
              },
              "requestBody": {
                "description": "OpenAPI requestBody object (dereferenced)."
              },
              "responses": {
                "description": "OpenAPI responses object (dereferenced)."
              },
              "security": {
                "description": "OpenAPI security requirements."
              },
              "url": {
                "description": "Canonical .md URL the definition was read from.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:407276f48f7cb17ef882a11378d0bcd64d3cad223139dc5f6f34826a50755f7c"
        },
        {
          "name": "get_doc_page",
          "title": "Read an Applivery documentation page",
          "description": "Fetch the full Markdown content of a documentation page. Pass either `url` (typically a URL returned by search_docs) or `slug` plus `locale`. Returns clean Markdown; very long pages are truncated at `maxChars` with a note.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "description": "Locale for the slug, e.g. 'en' (default en).",
                "type": "string"
              },
              "maxChars": {
                "description": "Truncate the page after this many characters (default 80000). Raise it if a page arrives truncated.",
                "maximum": 200000,
                "minimum": 1000,
                "type": "integer"
              },
              "slug": {
                "description": "Path after the locale, e.g. 'device-management/getting-started'. Used with locale when url is not given.",
                "type": "string"
              },
              "url": {
                "description": "A docs.applivery.com page URL, typically copied from a search_docs result.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5267cca59f7a9cb1e215104ea6a030f3edf6e3fcb6b3a70b302bb9f1411031c8"
        },
        {
          "name": "list_doc_sections",
          "title": "List Applivery documentation sections",
          "description": "List the top-level documentation sections and landing pages from the site's curated index (llms.txt). Use for orientation, then drill in with search_docs or get_doc_page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "section": {
                "description": "Optional filter on section name or title.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "sections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "docType": {
                      "description": "'guides' = product documentation and how-tos for admins and end users; 'api' = REST API reference for developers.",
                      "enum": ["guides", "api"],
                      "type": "string"
                    },
                    "section": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["docType", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["sections", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:66a2ddac87e49ed07da52a86c661c36440d0d9cbe8a7c5f0e5197c1a6d37bb0f"
        },
        {
          "name": "search_docs",
          "title": "Search Applivery documentation",
          "description": "Search the Applivery documentation by keyword or phrase. Returns matching pages with title, canonical URL, a highlighted snippet, docType ('guides' or 'api'), platform, breadcrumb and in-page headings. Use this first to discover pages, then read one with get_doc_page. For non-developer questions prefer docType 'guides'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "docType": {
                "description": "Filter by corpus: 'guides' (product documentation, for admins and end users) or 'api' (REST API reference, for developers). Omit to search both.",
                "enum": ["guides", "api"],
                "type": "string"
              },
              "excludeSection": {
                "description": "Exclude a documentation section from results.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results, 1 to 12 (default 8).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language filter, e.g. 'en' or 'es'. Omit to search all languages.",
                "type": "string"
              },
              "platform": {
                "description": "Filter by platform, e.g. 'Apple', 'Android', 'Windows', 'Cross-platform'.",
                "type": "string"
              },
              "query": {
                "description": "Search keywords or phrase.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "section": {
                "description": "Restrict results to a documentation section.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "counts": {
                "additionalProperties": {
                  "type": "number"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "breadcrumb": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "href": {
                            "type": "string"
                          },
                          "label": {
                            "type": "string"
                          }
                        },
                        "required": ["label"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "docType": {
                      "description": "'guides' = product documentation and how-tos for admins and end users; 'api' = REST API reference for developers.",
                      "enum": ["guides", "api"],
                      "type": "string"
                    },
                    "headings": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "id": {
                            "type": "string"
                          },
                          "level": {
                            "type": "number"
                          },
                          "text": {
                            "type": "string"
                          }
                        },
                        "required": ["id", "level", "text"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "platform": {
                      "type": "string"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Canonical docs.applivery.com page URL.",
                      "type": "string"
                    }
                  },
                  "required": ["docType", "snippet", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "suggestions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["results", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f838d0c5f47d038a5731e23b5c7975831c775081cb3f39cdff71fe1b03e24954"
        }
      ],
      "resources": [
        {
          "uri": "https://docs.applivery.com/llms.txt",
          "name": "docs-index",
          "title": "Applivery documentation index",
          "description": "Curated index of documentation sections and priority pages (llms.txt).",
          "mimeType": "text/plain",
          "digest": "sha256:2120f390e51250b2ece8b576168c4d690cd8076f39e9e911cf5fc4d5e6be6760"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "https://docs.applivery.com/{locale}/{+slug}",
          "name": "doc-page",
          "title": "Applivery documentation page",
          "description": "A documentation page as clean Markdown. The URI is the canonical page URL — search_docs results reference these as resource links.",
          "mimeType": "text/markdown",
          "digest": "sha256:8e946a4bf9fcaf6e153658d68f008dfb32b2e6386623ca3d15b72a9e512a9f47"
        }
      ],
      "prompts": [
        {
          "name": "api_request",
          "title": "Build an Applivery API request",
          "description": "Find the right REST endpoint and construct a working API request for a task.",
          "arguments": [
            {
              "name": "task",
              "description": "What to do via the API, e.g. 'delete a web app' or 'list Android devices'.",
              "required": true
            }
          ],
          "digest": "sha256:399801c4e8b369c22d878ab471aa76018d67f3a8217698570fed0602058f1fc1"
        },
        {
          "name": "ask_docs",
          "title": "Ask the Applivery docs",
          "description": "Answer a question from the Applivery documentation, with canonical citations.",
          "arguments": [
            {
              "name": "question",
              "description": "The question to answer from the documentation.",
              "required": true
            },
            {
              "name": "platform",
              "description": "Optional platform filter: Apple, Android, Windows, Cross-platform.",
              "required": false
            }
          ],
          "digest": "sha256:91962cabd960c99751c025734189fe5401f05f272d0e51d4ff25b0208d17ae3d"
        }
      ],
      "digest": "sha256:fa944bd170896bbbb3ae819c02f542a186bf5ddd5608f020a301b01faee0e619"
    }
  }
}
