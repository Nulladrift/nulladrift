            "properties": {
              "country": {
                "description": "Optional ISO country code for currency",
                "type": "string"
              },
              "email": {
                "description": "Customer email for the invoice, status link and report",
                "type": "string"
              },
              "package": {
                "description": "One of: starter, standard, deep",
                "type": "string"
              }
            },
            "required": ["email", "package"],
            "type": "object"
          },
