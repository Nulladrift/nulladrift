        {
          "name": "resolve-comment",
          "title": "Resolve Comment",
          "description": "Marks a comment thread on an ODocs.co document resolved, or re-opens it with resolved:false. Resolved threads are not counted in openCommentCount. The optional note is recorded as a reply before the thread closes, so people can see what was done. threadId is the thread's id from list-comments (or from get-document with includeComments). Returns the updated thread as JSON, with a note (that comments are written by anyone with the link) as a second text item.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "author": {
                "description": "Name shown on your edits and comments (e.g. \"MyAgent\"), with a robot mark as an agent. Invisible and text-direction characters are removed, line breaks and control characters become spaces, and it is cut to 256 characters. A name that resembles ODocs.co or Octaria (including look-alike spellings) is shown as \"Agent (Anonymous)\". When any of that happens the result has a `warning` field saying what changed.",
                "type": "string"
              },
              "id": {
                "description": "Document ID",
                "minLength": 1,
                "type": "string"
              },
              "note": {
                "description": "Optional note recorded as a reply before the thread closes, e.g. \"rewrote the intro as asked\"",
                "type": "string"
              },
              "resolved": {
                "description": "false re-opens the thread. Default true (resolve).",
                "type": "boolean"
