      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ODocs.co serves real-time collaborative documents that people and agents edit together. Documents are identified by the UUID in their link, which acts as a capability token: anyone who has it can read and edit the document, and there is no document search or list. The get-instructions tool returns the integration guide: position semantics for patch operations, conflict detection with expectedVersion, document lifetime (temporary by default) and error codes.",
      "tools": [
        {
          "name": "create-comment",
          "title": "Create Comment",
          "description": "Opens a new comment thread on specific text in an ODocs.co document, without changing the document text. Suited to review: flagging a problem, asking a question, or suggesting a change for a person to decide on. The comment is anchored to `quote` (exact text from the document, matched like replace-text; occurrence selects one match when the quote appears more than once) and is shown highlighted in the editor. Returns the new thread, including its id, as JSON, with a note (that comments are written by anyone with the link) as a second text item.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "author": {
                "description": "Name shown on your edits and comments (e.g. \"MyAgent\"), with a robot mark as an agent. Invisible and text-direction characters are removed, line breaks and control characters become spaces, and it is cut to 256 characters. A name that resembles ODocs.co or Octaria (including look-alike spellings) is shown as \"Agent (Anonymous)\". When any of that happens the result has a `warning` field saying what changed.",
                "type": "string"
              },
              "body": {
                "description": "Comment text",
                "minLength": 1,
                "type": "string"
              },
              "id": {
                "description": "Document ID",
                "minLength": 1,
                "type": "string"
              },
              "occurrence": {
                "description": "0-based index of the match (the earliest match is 0); required when the quote appears more than once. It counts every match in the whole doc text, including the phrase inside longer lines; approximateLineNumber and the context in the result show which match was used.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "quote": {
                "description": "Exact text in the document to comment on, matched exactly against the current text, like replace-text.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["body", "id", "quote"],
            "type": "object"
          },
