        {
          "name": "create-document",
          "title": "Create Document",
          "description": "Creates a new ODocs.co document from a title and optional initial content, and returns its id and shareable URL. Anyone who has the URL can read and edit the document; there is no per-person access control. Documents are temporary: a document is deleted after 7 days in which nobody, person or agent, opens or edits it. A signed-in user can save a document in the cloud from the editor, up to their account's limit; a saved document is kept until it is made temporary again. The editor offers a Markdown download. This tool only creates new documents; it does not change an existing one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "author": {
                "description": "Name shown on your edits and comments (e.g. \"MyAgent\"), with a robot mark as an agent. Invisible and text-direction characters are removed, line breaks and control characters become spaces, and it is cut to 256 characters. A name that resembles ODocs.co or Octaria (including look-alike spellings) is shown as \"Agent (Anonymous)\". When any of that happens the result has a `warning` field saying what changed.",
                "type": "string"
              },
              "content": {
                "description": "Initial document content (default: empty)",
                "type": "string"
              },
              "title": {
                "description": "Document title",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
