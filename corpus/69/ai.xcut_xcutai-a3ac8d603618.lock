{
  "lockfileVersion": 2,
  "subjects": {
    "ai.xcut/xcutai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.xcut.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "xcutai",
        "title": "XcutAI",
        "version": "1.0.0",
        "websiteUrl": "https://xcut.ai"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "XCut AI is a social-media content research and writing workspace for Instagram, TikTok, YouTube, Facebook and the Meta Ad Library. Use its tools whenever the user works on social media or marketing content: what is going viral or trending in a niche, which of a creator's or competitor's posts performed best, a post's transcript or why it worked, hooks, captions, bios, titles, scripts for Reels, TikTok, Shorts or YouTube, carousels, ad copy, content plans and calendars, and how a platform's algorithm or hashtags work. Hooks, playbooks and quick tools work without an account; tools that use the user's canvases, brand memory, imports or credits ask the user to sign in to XCut AI. With no canvas named, imports and writing go to the user's \"From AI apps\" canvas, so do not ask which canvas. Do not use XCut AI for general web or news search, or for writing unrelated to social media or marketing. XCut AI never publishes to social media.",
      "tools": [
        {
          "name": "xcut_add_note",
          "title": "Add a note to a canvas",
          "description": "Use this when the user wants a script, hook list, plan or other text saved to XcutAI. Accepts Markdown; with no canvas named it goes to the user's \"From AI apps\" canvas. Free. Do not use for calendar posts (use xcut_add_to_calendar).",
          "inputSchema": {
            "properties": {
              "canvas_id": {
                "anyOf": [
                  {
                    "pattern": "^[0-9a-fA-F-]{36}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. Leave it out unless the user names a canvas: XcutAI then uses their \"From AI apps\" canvas. Ids come from xcut_list_canvases.",
                "title": "Canvas Id"
              },
              "text": {
                "description": "Markdown text.",
                "maxLength": 100000,
                "minLength": 1,
                "title": "Text",
                "type": "string"
              },
              "title": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional note title, e.g. \"Week 1 scripts\".",
                "title": "Title"
              }
            },
            "required": ["text"],
            "title": "xcut_add_noteArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a note to a canvas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["xcut.read", "xcut.write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8fbe373081ef5fb48d42aa750d8f62cacbb4312b9871fe3779e828a1a3075312"
        },
        {
          "name": "xcut_add_to_calendar",
          "title": "Add a post to the calendar",
          "description": "Use this when the user wants a planned post saved to their XcutAI content calendar: title, platform, type, date, and optionally caption and hashtags. Saved as a draft unless a status is given. Free. Do not use to publish: XcutAI never posts to social media.",
          "inputSchema": {
            "properties": {
              "canvas_id": {
                "anyOf": [
                  {
                    "pattern": "^[0-9a-fA-F-]{36}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Canvas (UUID) the post belongs to. Optional.",
                "title": "Canvas Id"
              },
              "caption": {
                "anyOf": [
                  {
                    "maxLength": 20000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Full caption or script text, if written.",
                "title": "Caption"
              },
              "hashtags": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Hashtags without spaces, e.g. [\"#skincare\", \"#retinol\"]. Up to 30.",
                "title": "Hashtags"
              },
              "platform": {
                "description": "Where it will be posted: instagram, facebook, tiktok, youtube or meta (Meta ads).",
                "enum": ["instagram", "facebook", "tiktok", "youtube", "meta"],
                "title": "Platform",
                "type": "string"
              },
              "post_type": {
                "default": "post",
                "description": "Format: post, image, video, carousel, reel, story, idea, script or ad. Default post.",
                "enum": ["post", "image", "video", "carousel", "reel", "story", "idea", "script", "ad"],
                "title": "Post Type",
                "type": "string"
              },
              "scheduled_at": {
                "description": "ISO date or date-time.",
                "maxLength": 64,
                "minLength": 4,
                "title": "Scheduled At",
                "type": "string"
              },
              "status": {
                "default": "draft",
                "description": "draft, in_review, approved, scheduled or published. Default draft. Setting it never publishes anything.",
                "enum": ["draft", "in_review", "approved", "scheduled", "published"],
                "title": "Status",
                "type": "string"
              },
              "title": {
                "description": "Short working title, e.g. \"3 myths about retinol\".",
                "maxLength": 300,
                "minLength": 1,
                "title": "Title",
                "type": "string"
              }
            },
            "required": ["platform", "scheduled_at", "title"],
            "title": "xcut_add_to_calendarArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a post to the calendar"
