        {
          "name": "xcut_find_hooks",
          "title": "Find proven hooks",
          "description": "Use this when the user wants hooks, opening lines or first sentences for a post, Reel, TikTok, Short, YouTube video or ad. Returns proven hook templates matched to the topic, from XcutAI's library of about 1,000 hooks taken from posts that performed, each with slots for the user's subject. The library and topic search are in English. Free; no sign-in. Do not use for formats, script structures or platform facts (use xcut_get_playbook) or for a finished caption (use xcut_write_caption).",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "enum": ["EDUCATIONAL", "COMPARISON", "MYTH BUSTING", "STORYTELLING", "RANDOM", "AUTHORITY", "DAY IN THE LIFE"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional hook family to restrict to.",
                "title": "Category"
              },
              "limit": {
                "default": 8,
                "description": "How many templates (default 8).",
                "maximum": 15,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "topic": {
                "description": "What the post is about, in English. e.g. 'pricing mistakes for small bakeries'",
                "maxLength": 200,
                "minLength": 2,
                "title": "Topic",
                "type": "string"
              }
            },
            "required": ["topic"],
            "title": "xcut_find_hooksArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find proven hooks"
