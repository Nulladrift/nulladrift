        {
          "name": "xcut_get_account",
          "title": "Get account and credits",
          "description": "Use this when the user asks about their XcutAI plan, credit balance, monthly allowance, next refill date or trial, or before starting an import or analysis that costs credits. Free. Do not use for usage history (that is in XcutAI Settings, not available here).",
          "inputSchema": {
            "properties": {},
