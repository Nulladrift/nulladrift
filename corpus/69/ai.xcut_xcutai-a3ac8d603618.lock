        {
          "name": "xcut_find_outliers",
          "title": "Find a profile's outlier posts",
          "description": "Use this when the user asks which of a creator's, competitor's or their own posts performed best or beat the account's normal, or what works for an account before writing. Scores the latest 20, 30, 50 or 100 posts against that account's own median and says by how much each beat it. About 3-4 credits for 30 posts on Instagram or TikTok, none on YouTube, more on Facebook. Longer runs return a `job_id` for xcut_get_job. Do not use for a full metrics table (use xcut_profile_analytics) or for a topic across many accounts (use xcut_search_viral).",
          "inputSchema": {
            "properties": {
              "canvas_id": {
                "anyOf": [
                  {
                    "pattern": "^[0-9a-fA-F-]{36}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Canvas (UUID) that owns the thumbnails. Optional. The results are returned here, not placed on the canvas.",
                "title": "Canvas Id"
              },
              "platform": {
                "description": "instagram, tiktok, youtube or facebook.",
                "enum": ["instagram", "tiktok", "youtube", "facebook"],
                "title": "Platform",
                "type": "string"
              },
              "posts": {
                "default": 30,
                "description": "How many recent posts to analyse: 20, 30, 50 or 100. Default 30.",
                "enum": [20, 30, 50, 100],
                "title": "Posts",
                "type": "integer"
              },
              "profile": {
                "description": "Profile link or @handle.",
                "maxLength": 500,
                "minLength": 1,
                "title": "Profile",
                "type": "string"
              }
            },
            "required": ["platform", "profile"],
            "title": "xcut_find_outliersArguments",
            "type": "object"
          },
