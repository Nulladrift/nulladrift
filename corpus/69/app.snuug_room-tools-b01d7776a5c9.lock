              "door_position": {
                "default": "middle",
                "description": "Where the door is on that wall, standing in the doorway looking in: left, middle or right.",
                "enum": ["left", "middle", "right"],
                "type": "string"
              },
              "door_wall": {
                "default": "bottom",
                "description": "The wall the door is on, as drawn on the plan: bottom, left, top or right.",
                "enum": ["bottom", "left", "top", "right"],
                "type": "string"
              },
              "facing": {
                "default": "N",
                "description": "For the compass method: the way you face as you walk in, N, NE, E, SE, S, SW, W or NW.",
