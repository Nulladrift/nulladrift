        {
          "name": "bagua_map",
          "title": "Bagua map for a room",
          "description": "Use when someone asks how to use a feng shui bagua map in a room or a home, which area of a room is wealth or relationships, or where their door falls on the bagua. It reports what the tradition says; feng shui is a tradition, not a science.",
