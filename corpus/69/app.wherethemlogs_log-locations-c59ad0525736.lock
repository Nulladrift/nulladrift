{
  "lockfileVersion": 2,
  "subjects": {
    "app.wherethemlogs/log-locations": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://wherethemlogs.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "wherethemlogs",
        "title": "Where Them Logs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Where application log files live on Windows, macOS and Linux. Paths are verbatim: environment variables such as %LOCALAPPDATA%, ~ and $XDG_STATE_HOME are not expanded.",
      "tools": [
        {
          "name": "get_app_log_locations",
          "title": "Get one app's log locations",
          "description": "Every log location for one app, by the slug that search_log_locations returns.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1e7a11b2eef7881d3c7f417f35c0126083b969fbae8154da96d3a493b1d55c2f"
        },
        {
          "name": "search_log_locations",
          "title": "Search log locations",
          "description": "Find where an application writes its log files. Matches app names and aliases (for example 'teams', 'zoom', 'docker') and the names of files listed under a path (for example 'AppWorkload.log'), not vendor names. Returns each app's log paths by platform.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Only paths on this platform",
                "enum": ["windows", "macos", "linux"],
                "type": "string"
              },
              "query": {
                "description": "App name or alias",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f34c4977cb9b96be278388c5158761f2ee873bb9018af18bc85b4129a2cecc28"
        }
      ],
      "digest": "sha256:75857b18b9abe0f4cdf6ab834e2afeb82e9dd44c4ff1c14d2aef3eef38a753bf"
    }
  }
}
