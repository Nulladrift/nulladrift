        {
          "name": "rent_ceilings_for_unit",
          "title": "All rent ceilings for one unit",
          "description": "Every rent ceiling for one unit in one answer: HUD Fair Market Rent, which is free and needs no key; the tax-credit (LIHTC) rent limit, on PRO and up; and the local housing agency's voucher payment standard, on ULTRA and up. Each paid part counts as 1 call of your plan, so this tool uses 1 call on PRO and 2 on ULTRA or MEGA. Parts your plan doesn't include are skipped and not charged. Paid parts are available on: PRO ($29/month, 5,000 calls), ULTRA ($99/month, 50,000 calls), MEGA ($299/month, 250,000 calls). The paid parts need your own Glazed Data API key in the x-api-key header (create one at https://glazeddata.com/rent-limits/pricing/).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bedroom_count": {
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "fips": {
