        {
          "name": "rent_ceilings_for_unit",
          "title": "All rent ceilings for one unit",
          "description": "Every rent ceiling for one unit in one answer: HUD Fair Market Rent; the tax-credit (LIHTC) rent limit, on PRO and up; and the local housing agency's voucher payment standard, on ULTRA and up. Without a key you get the Fair Market Rent only, free. With your key, each part your plan or a call pack covers counts as 1 call, even if it finds no figures: 1 call on BASIC (2 with a call pack), 2 on PRO, 3 on ULTRA or MEGA; 1 fewer at 5 bedrooms, which has no Fair Market Rent. A call pack covers the Fair Market Rent and tax-credit parts: on BASIC it pays for the tax-credit part at once; on a plan that includes a part, your monthly calls are used first, then the pack. Parts neither your plan nor a pack covers are refused and not charged. Paid parts are available on: PRO (or a higher plan). The paid parts need a Glazed Data plan; in Claude Code or Cursor, send your API key in the x-api-key header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bedroom_count": {
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "fips": {
                "description": "Optional HUD area or county code, when a ZIP spans several areas",
                "type": "string"
              },
              "zip_code": {
                "description": "5-digit US ZIP code",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["bedroom_count", "zip_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "All rent ceilings for one unit"
