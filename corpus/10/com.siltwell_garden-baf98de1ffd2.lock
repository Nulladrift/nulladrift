        {
          "name": "set_care_schedule",
          "title": "Set a care schedule",
          "description": "Create a recurring care schedule (water/fertilize/custom). Scope it to a plant (its active planting), a bed, or the whole garden. Recurrence is EITHER everyDays (e.g. 3) OR weekdays (e.g. ['monday','thursday']). Use when the user wants a repeating watering/feeding reminder. Optionally end it on a date (endsOn) or after N completions (endsAfter); use at most one.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Optional, e.g. '2 L'.",
                "type": "string"
              },
              "bed": {
                "description": "Scope to this bed (optional; ignored if plant is given).",
                "type": "string"
              },
              "endsAfter": {
                "description": "Optional: stop after this many completions. Use at most one of endsOn / endsAfter.",
                "type": "number"
              },
              "endsOn": {
                "description": "Optional last date YYYY-MM-DD (inclusive); no task after it. Use at most one of endsOn / endsAfter.",
                "type": "string"
              },
              "everyDays": {
                "description": "Repeat every N days (1–365). Use this OR weekdays.",
                "type": "number"
              },
              "garden": {
                "description": "Garden name; defaults to the user's first garden.",
                "type": "string"
              },
              "label": {
                "description": "Optional label (mainly for custom).",
                "type": "string"
              },
              "plant": {
                "description": "Scope to this plant's active planting (optional).",
                "type": "string"
              },
              "startDate": {
                "description": "First due date YYYY-MM-DD; default today.",
                "type": "string"
              },
              "type": {
                "description": "Default water.",
                "enum": ["water", "fertilize", "custom"],
                "type": "string"
              },
              "weekdays": {
                "description": "Repeat on these weekdays, e.g. ['monday','thursday']. Use this OR everyDays.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
