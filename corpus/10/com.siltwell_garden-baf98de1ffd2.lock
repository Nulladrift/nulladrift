      "capabilities": {
        "tools": {}
      },
      "instructions": "Siltwell tracks the user's garden: beds, plantings, events (watering, pests, ...), harvests, hyperlocal weather and soil sensors, hardiness zone and frost dates. Use the read tools to answer questions about the user's own garden and the write tools when the user reports something they did. The lookup tools answer frost dates, planting windows, season length and this week's frost risk for any place, with or without a Siltwell account.",
      "tools": [
        {
          "name": "add_planned_planting",
          "title": "Plan a planting",
          "description": "Queue a future planting for a bed as part of a succession plan — it is NOT yet sown (use add_planting for something the user already planted). Use when the user wants to plan ahead, e.g. \"plan to plant more carrots in Bed 2 on August 15\".",
          "inputSchema": {
            "properties": {
              "bed": {
                "description": "The bed's name.",
                "type": "string"
              },
              "cropSlug": {
                "description": "Optional catalog crop slug.",
                "type": "string"
              },
              "displayName": {
                "description": "What to call this planting, e.g. 'Fall Carrots'.",
                "type": "string"
              },
              "garden": {
                "description": "Garden name; defaults to the user's first garden.",
                "type": "string"
              },
              "method": {
                "description": "Default direct_seed.",
                "enum": ["direct_seed", "indoor_start", "transplanted_seedling"],
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "quantity": {
                "type": "number"
              },
              "targetDate": {
                "description": "Planned planting date, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["bed", "displayName", "targetDate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Plan a planting"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:77276bf2d204bf42715232d45afb20002c6ff56acf640f59e23c3fc169888f9b"
        },
        {
          "name": "add_planting",
          "title": "Add a planting",
          "description": "Record that the user planted/sowed something: creates the plant in their catalog if new and the planting in the named bed. Passing variety replaces the variety stored on an existing plant with the same name.",
          "inputSchema": {
            "properties": {
              "bed": {
                "type": "string"
              },
              "garden": {
                "description": "Garden name; defaults to the user's first garden.",
                "type": "string"
              },
              "method": {
                "description": "Default direct_seed.",
                "enum": ["direct_seed", "indoor_start", "transplanted_seedling"],
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "plant": {
                "type": "string"
              },
              "quantity": {
                "type": "number"
              },
              "sownAt": {
                "description": "ISO date; default today.",
                "type": "string"
              },
              "transplantedAt": {
                "description": "ISO date the seedling went into the bed (indoor starts).",
                "type": "string"
              },
              "variety": {
                "description": "Variety/cultivar, e.g. \"Sremski F1\". Stored on the plant; replaces the variety of an existing plant with the same name.",
                "type": "string"
              }
            },
            "required": ["bed", "plant"],
            "type": "object"
          },
          "annotations": {
