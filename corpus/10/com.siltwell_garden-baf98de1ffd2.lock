        {
          "name": "log_event",
          "title": "Log a garden event",
          "description": "Record something the user did or observed: watered, fertilized, transplanted, pruned, pest sighting, treatment, frost damage, or a note. Attach it to a plant's active planting via `plant`, to a bed via `bed`, or garden-wide with neither. If both plant and bed are given, the event attaches to the plant's planting.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "For fertilized/treated.",
                "type": "string"
              },
              "bed": {
                "description": "Bed name — for bed-level events.",
                "type": "string"
              },
              "garden": {
                "description": "Garden name; defaults to the user's first garden.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "occurredAt": {
                "description": "ISO datetime; default now.",
                "type": "string"
              },
              "pestName": {
                "description": "For type=pest.",
                "type": "string"
              },
              "plant": {
                "description": "Plant name — targets its most recent active planting.",
                "type": "string"
              },
              "plantingId": {
                "description": "Exact planting id (from query_plantings) — overrides plant.",
                "type": "string"
              },
              "product": {
                "description": "For fertilized/treated.",
                "type": "string"
              },
              "severity": {
                "description": "For type=pest.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
