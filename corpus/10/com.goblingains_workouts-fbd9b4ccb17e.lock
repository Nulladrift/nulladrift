      },
      "instructions": "Goblin Gains makes conditioning workouts (CrossFit, Hyrox, engine work) from\nits own generator, without AI. Use these tools instead of writing workouts yourself.\n\nWhich tool:\n- suggest_workouts: workouts for an ask (minutes, equipment, movements, an archetype from\n  list_archetypes), close to proven library workouts.\n- vary_workout: variations of one library workout by name (\"Fran\"), in its format or another.\n- generate_workouts: brand-new workouts unlike any in the library, for one person.\n\nBefore generating: when the user names equipment, call list_equipment and pass its keys or\nplain names, with \"1 dumbbell\" when there is only one. Movements the user wants or bans go\nthrough find_movements first. Say who trains (sex, people) when the user said so.\n\nShow each workout as returned, its save link too: the link saves it in the Goblin Gains app.\nWhen the user says a workout is wrong, bad or good, send it with report_workout.",
      "tools": [
        {
          "name": "find_movements",
          "title": "Find movements",
          "description": "Movement slugs whose name holds `query` (e.g. \"row\", \"sled\"), for\n    suggest_workouts' include and exclude, machines and runs first.",
          "inputSchema": {
            "properties": {
              "kind": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Keep one movement kind only, one of strength, olympic, plyo, cyclic, carry, mobility (cyclic: row, ski, bike, run); all when omitted. Example: \"cyclic\".",
                "title": "Kind"
              },
              "query": {
                "description": "Text the movement name holds, any case. Example: \"sled\".",
                "maxLength": 100,
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "find_movementsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "find_movementsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9110136ffac5786e7a2c93f01337b1118cd4156d6981756cdb457ab13781c99d"
        },
        {
          "name": "generate_workouts",
          "title": "Generate new workouts",
          "description": "New workouts unlike any in the library, from our generator (no AI),\n    as text: evolved from the library's workouts and movements (more lines,\n    fewer, other formats) into kinds it does not hold. For one person.\n    Nothing is saved; other ones each call. suggest_workouts and\n    vary_workout stay close to library workouts instead.\n\n    A shortfall says what blocked it.",
          "inputSchema": {
            "properties": {
              "bodyweight": {
                "default": true,
                "description": "False also leaves out movements needing no equipment (burpees, runs), so only the listed equipment is used. Example: false.",
                "title": "Bodyweight",
                "type": "boolean"
              },
              "count": {
                "default": 3,
                "description": "How many workouts, at most 5. Example: 3.",
                "maximum": 5,
                "minimum": 1,
                "title": "Count",
                "type": "integer"
              },
              "equipment": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What the athletes have, as list_equipment keys or names (\"echo-bike\" or \"echo\", \"row erg\", \"ski erg\"), one item per entry. Say \"1 dumbbell\" or \"1 kettlebell\" when there is only one: movements needing a pair (farmers carry, dumbbell bench press) are left out. Other counts are ignored (\"1 echo\" is the echo bike): say how many train in people. Movements needing anything else (a bench press needs a bench) are left out; runs need \"running\" in the list. A name matching several keys or none is an error naming them. Example: [\"1 dumbbell\", \"box\", \"ski-erg\"]. Omitted is a full gym.",
                "title": "Equipment"
              },
              "exclude": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Movement slugs or names (from find_movements) every workout must leave out. Example: [\"burpees\"].",
                "title": "Exclude"
              },
              "format": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this format: for_time, amrap, emom, intervals. Any when omitted. Example: \"amrap\".",
                "title": "Format"
              },
              "include": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Movement slugs or names (from find_movements) every workout must hold; fewer come back the more are named. Example: [\"wallballs\"].",
                "title": "Include"
              },
              "minutes_max": {
                "anyOf": [
                  {
                    "maximum": 240,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longest estimated workout length, in minutes. Example: 25.",
                "title": "Minutes Max"
              },
              "minutes_min": {
                "anyOf": [
                  {
                    "maximum": 240,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Shortest estimated workout length, in minutes. Example: 10.",
                "title": "Minutes Min"
              },
              "sex": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Who trains, for the weights and machine doses: \"men\", \"women\", or \"mixed\" (a man and a woman together: each at their own; Hyrox stations at the mixed doubles race load). Omitted when the user did not say: every line reads both, men's/women's (\"9/6 kg\", \"12/10 kcal\"). Anything but men gets only workouts with a women's weight on every loaded line. Example: \"women\".",
                "title": "Sex"
              },
              "show_scores": {
                "default": true,
                "description": "True adds a line of scores under each workout: feasibility (0-100, can it be done as written), difficulty (0-100, the chance of not finishing inside the cap), and against the workout it was made from: stimulus (0-1, CrossFit's stimulus kept, with the levers changed), work (x the seed's), mix shift (how far the work moved between movement patterns), design (0-1) and, for Hyrox workouts, race fidelity (0-1). Example: false.",
                "title": "Show Scores",
                "type": "boolean"
              }
            },
            "title": "generate_workoutsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "generate_workoutsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
