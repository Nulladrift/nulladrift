        {
          "name": "report_workout",
          "title": "Report a workout",
          "description": "A user's verdict on a workout from these tools: a mistake (wrong\n    equipment, a weight, a dose that cannot fit), or a workout they found bad\n    or good. Stores the user's words for Goblin Gains, nothing else about the\n    user.",
          "inputSchema": {
            "properties": {
              "note": {
                "description": "What the user said about the workout, in their words. Example: \"Farmers carry needs two dumbbells; I said I have one.\"",
                "maxLength": 2000,
                "minLength": 1,
                "title": "Note",
                "type": "string"
              },
              "verdict": {
                "description": "One of mistake, bad, good: \"mistake\" (something in it is wrong), \"bad\" (it works but is a poor workout), \"good\". Example: \"mistake\".",
                "maxLength": 100,
                "title": "Verdict",
                "type": "string"
              },
              "workout": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The workout's save link from suggest_workouts, vary_workout or generate_workouts, or its id; omitted for the tools as a whole. Example: \"https://app.goblingains.com/w/<id>\".",
                "title": "Workout"
              }
            },
            "required": ["note", "verdict"],
            "title": "report_workoutArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "report_workoutOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7a5349b13d64f4549dd2c3f46a0fd81257a6c88801e1e017407f806b2787b15d"
        },
        {
          "name": "suggest_workouts",
          "title": "Suggest workouts",
          "description": "New workouts from our generator, as text. Ask this instead of writing\n    workouts yourself. Nothing is saved.\n\n    Example, two people with an echo bike, rower and ski erg, 40-60 min:\n    suggest_workouts(count=5, people=2, minutes_min=40, minutes_max=60,\n    equipment=[\"echo-bike\", \"row-ergometer\", \"ski-erg\"], bodyweight=False)\n\n    A shortfall says what blocked it.",
          "inputSchema": {
            "properties": {
              "archetype": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A key or name from list_archetypes; any when omitted. Example: \"A5\" or \"chipper\".",
                "title": "Archetype"
              },
              "bodyweight": {
                "default": true,
                "description": "False also leaves out movements needing no equipment (burpees, runs), so only the listed equipment is used. Example: false.",
                "title": "Bodyweight",
                "type": "boolean"
              },
              "cap_minutes": {
                "anyOf": [
                  {
                    "maximum": 240,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A time cap the workout must fit, in whole minutes. Example: 30.",
                "title": "Cap Minutes"
              },
              "count": {
                "default": 3,
                "description": "How many workouts, at most 5; from 3 on, a mix of archetypes (at most 2 of one unless nothing else fits). Example: 3.",
                "maximum": 5,
                "minimum": 1,
                "title": "Count",
                "type": "integer"
              },
              "equipment": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What the athletes have, as list_equipment keys or names (\"echo-bike\" or \"echo\", \"row erg\", \"ski erg\"), one item per entry. Say \"1 dumbbell\" or \"1 kettlebell\" when there is only one: movements needing a pair (farmers carry, dumbbell bench press) are left out. Other counts are ignored (\"1 echo\" is the echo bike): say how many train in people. Movements needing anything else (a bench press needs a bench) are left out; runs need \"running\" in the list. A name matching several keys or none is an error naming them. Example: [\"1 dumbbell\", \"box\", \"ski-erg\"]. Omitted is a full gym.",
                "title": "Equipment"
              },
              "exclude": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Movement slugs or names (from find_movements) every workout must leave out. Example: [\"burpees\"].",
                "title": "Exclude"
              },
              "include": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Movement slugs or names (from find_movements) every workout must hold. Example: [\"wallballs\", \"sled-push\"].",
                "title": "Include"
              },
              "minutes_max": {
                "anyOf": [
                  {
                    "maximum": 240,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longest estimated workout length, in minutes. Example: 60.",
                "title": "Minutes Max"
              },
              "minutes_min": {
                "anyOf": [
                  {
                    "maximum": 240,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Shortest estimated workout length, in minutes. Example: 40.",
                "title": "Minutes Min"
              },
              "only": {
                "default": false,
                "description": "True: the workouts hold the included movements and nothing else (each may repeat). Needs include. Example: true.",
                "title": "Only",
                "type": "boolean"
              },
              "partner": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "True: only partner workouts (two people share the work: turns at a station, or each on a station at once, then swap). False: none. Omitted: either. Example: true.",
                "title": "Partner"
              },
              "people": {
                "default": 1,
                "description": "How many train together with one of each machine. Above 1, only workouts they can share come back: partner workouts (taking turns on a station), or EMOMs/intervals with a different machine on every line and at least one line per person (start apart, rotate). Example: 2.",
                "maximum": 20,
                "minimum": 1,
                "title": "People",
                "type": "integer"
              },
              "sex": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Who trains, for the weights and machine doses: \"men\", \"women\", or \"mixed\" (a man and a woman together: each at their own; Hyrox stations at the mixed doubles race load). Omitted when the user did not say: every line reads both, men's/women's (\"9/6 kg\", \"12/10 kcal\"). Anything but men gets only workouts with a women's weight on every loaded line. Example: \"women\".",
                "title": "Sex"
              },
              "show_scores": {
                "default": true,
                "description": "True adds a line of scores under each workout: feasibility (0-100, can it be done as written), difficulty (0-100, the chance of not finishing inside the cap), and against the workout it was made from: stimulus (0-1, CrossFit's stimulus kept, with the levers changed), work (x the seed's), mix shift (how far the work moved between movement patterns), design (0-1) and, for Hyrox workouts, race fidelity (0-1). Example: false.",
                "title": "Show Scores",
                "type": "boolean"
              },
              "temperature": {
                "default": 0,
                "description": "0 to 1. 0: the same ask always brings the same workouts. Above 0: other ones each call, the higher the further from the library workouts they vary (0.3 close variations, 1 far ones). Example: 0.3.",
                "title": "Temperature",
                "type": "number"
              }
            },
            "title": "suggest_workoutsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "suggest_workoutsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
