{
  "lockfileVersion": 2,
  "subjects": {
    "com.goblingains/workouts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.goblingains.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "goblin-workouts",
        "version": "1.30.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Goblin Gains makes conditioning workouts (CrossFit, Hyrox, engine work) from\nits own generator, without AI. Use these tools instead of writing workouts yourself.\n\nWhich tool:\n- generate_workouts: new workouts for an ask (style, minutes, equipment, movements, people),\n  or a named one (\"Diane\") as written.\n- list_archetypes: the workout types and what each is.\n\nBefore generating: when the user names equipment, call list_equipment and pass its keys or\nplain names, with \"1 dumbbell\" when there is only one. Movements the user wants or bans go\nthrough find_movements first. Say who trains (sex, people) when the user said so.\n\nShow each workout as returned, its save link too: the link saves it in the Goblin Gains app.\nWhen the user says a workout is wrong, bad or good, send it with report_workout.\n\nThe user's own records, with their key in the connector:\n- get_running_paces: their paces and HR zones, recent and planned runs. Use it when they ask\n  how fast or in which zone to run.\nWhere it says a number is missing, ask the user; do not estimate it.",
      "tools": [
        {
          "name": "find_movements",
          "title": "Find movements",
          "description": "Movement slugs whose name holds `query` (e.g. \"row\", \"sled\"), for\n    generate_workouts' include and exclude, machines and runs first.",
          "inputSchema": {
            "properties": {
              "kind": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Keep one movement kind only, one of strength, olympic, plyo, cyclic, carry, mobility (cyclic: row, ski, bike, run); all when omitted. Example: \"cyclic\".",
                "title": "Kind"
              },
              "query": {
                "description": "Text the movement name holds, any case. Example: \"sled\".",
                "maxLength": 100,
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "find_movementsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "find_movementsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c413bc9081c1967a50b0b014d4f1714f679f93363aec4fefaf4ecc2847224d37"
        },
        {
          "name": "generate_workouts",
          "title": "Generate new workouts",
          "description": "New workouts from our generator (no AI), as text: built from patterns\n    counted in thousands of real workouts, for a training style, minutes,\n    kit and who trains. Nothing is saved; other ones each call.\n\n    Example, two people with an echo bike, rower and ski erg, 40-60 min:\n    generate_workouts(count=5, people=2, partner=True, minutes_min=40,\n    minutes_max=60, equipment=[\"echo-bike\", \"row-ergometer\", \"ski-erg\"])\n\n    A shortfall says what blocked it.",
          "inputSchema": {
            "properties": {
              "bodyweight": {
                "default": true,
                "description": "False also leaves out movements needing no equipment (burpees, runs), so only the listed equipment is used. Example: false.",
                "title": "Bodyweight",
                "type": "boolean"
              },
              "cap_minutes": {
                "anyOf": [
                  {
                    "maximum": 240,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A time cap the workout must fit, in whole minutes: no printed cap passes it. Words in intent such as \"time cap 30\" set it too. Example: 30.",
                "title": "Cap Minutes"
              },
              "count": {
                "default": 3,
                "description": "How many workouts, at most 5. Example: 3.",
                "maximum": 5,
                "minimum": 1,
                "title": "Count",
                "type": "integer"
              },
              "equipment": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What the athletes have, as list_equipment keys or names (\"echo-bike\" or \"echo\", \"row erg\", \"ski erg\"), one item per entry. Say \"1 dumbbell\" or \"1 kettlebell\" when there is only one: movements needing a pair (farmers carry, dumbbell bench press) are left out. Other counts are ignored (\"1 echo\" is the echo bike): say how many train in people. Movements needing anything else (a bench press needs a bench) are left out; runs need \"running\" in the list. A name matching several keys or none is an error naming them. Example: [\"1 dumbbell\", \"box\", \"ski-erg\"]. Omitted is a full gym.",
                "title": "Equipment"
              },
              "exclude": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Movement slugs or names (from find_movements) every workout must leave out. Example: [\"burpees\"].",
                "title": "Exclude"
              },
              "format": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this format: for_time, amrap, emom, intervals. Any when omitted. Example: \"amrap\".",
                "title": "Format"
              },
              "include": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Movement slugs or names (from find_movements) every workout must hold; fewer come back the more are named. Example: [\"wallballs\"].",
                "title": "Include"
              },
              "intent": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What the workout is for, in words: an intent (recovery, aerobic, long, threshold, vo2max, speed, test, compromised, strength-endurance, technique, partner) or a workout type (\"fartlek\", \"tempo\", \"hero wod\"). Several words keep what they share. Any when omitted. Example: \"recovery\".",
                "title": "Intent"
              },
              "level": {
                "anyOf": [
                  {
                    "maximum": 3,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Level 1 to 3, 3 the toughest. 1 scaled: dumbbells, kettlebells and sandbags a size lighter, barbells 0.7x Rx, easier skills (ring rows for pull-ups). 2 Rx and Hyrox Open. 3: a size heavier, barbells 1.25x Rx, Hyrox Pro, harder skills (chest-to-bar for pull-ups, legless rope climbs). Words in intent such as \"pro\", \"open\", \"rx\" or \"scaled\" set it too; 2 when none. Example: 3.",
                "title": "Level"
              },
              "minutes_max": {
                "anyOf": [
                  {
                    "maximum": 240,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longest estimated workout length, in minutes. Example: 25.",
                "title": "Minutes Max"
              },
              "minutes_min": {
                "anyOf": [
                  {
                    "maximum": 240,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Shortest estimated workout length, in minutes. Example: 10.",
                "title": "Minutes Min"
              },
              "partner": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "True: only partner workouts (two people share the work). False: none. Omitted: either when people is above 1, else none. Example: true.",
                "title": "Partner"
              },
              "people": {
                "default": 1,
                "description": "How many train together with one of each machine. Above 1, only workouts they can share come back: partner workouts (taking turns on a station), workouts on no machine (side by side), or EMOMs/intervals with a different machine on every line and at least one line per person (start apart, rotate). Example: 2.",
                "maximum": 20,
                "minimum": 1,
                "title": "People",
                "type": "integer"
              },
              "region": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this body region: \"lower\" (legs, hips, cardio), \"upper\" (push, pull, core, ski and row) or \"core\" (core, cardio). Words in intent such as \"leg workout\", \"upper body\" or \"core\" set it too. Example: \"lower\".",
                "title": "Region"
              },
              "rounds": {
                "anyOf": [
                  {
                    "maximum": 100,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Exactly this many rounds: a for-time or interval workout repeated that often, an EMOM that many turns through its stations; never an AMRAP or a workout in parts. Words in intent such as \"5 rounds\" set it too. Example: 5.",
                "title": "Rounds"
              },
              "sex": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Who trains, for the weights and machine doses: \"men\", \"women\", or \"mixed\" (a man and a woman together: each at their own; Hyrox stations at the mixed doubles race load). Omitted when the user did not say: every line reads both, men's/women's (\"9/6 kg\", \"12/10 kcal\"). Anything but men gets only workouts with a women's weight on every loaded line. Example: \"women\".",
                "title": "Sex"
              },
              "show_scores": {
                "default": false,
                "description": "True adds a line of scores under each workout: can do it (%, the share of gym-goers who finish it as written), hard (0-100, how close the median gym-goer gets to their limit) and load (minutes x effort), and against the workout it was made from: stimulus (0-1, CrossFit's stimulus kept, with the levers changed), work (x the seed's), mix shift (how far the work moved between movement patterns), design (0-1) and, for Hyrox workouts, race fidelity (0-1). Off unless asked. Example: true.",
                "title": "Show Scores",
                "type": "boolean"
              },
              "style": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this training style: running, hyrox, hybrid or crossfit. Any when omitted. Example: \"hyrox\".",
                "title": "Style"
              },
              "zone_max": {
                "anyOf": [
                  {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Every zone the work names at most this, 1-5. Example: 4.",
                "title": "Zone Max"
              },
              "zone_min": {
                "anyOf": [
                  {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Every zone the work names at least this, 1-5; a workout naming no zone is left out. Words in intent such as \"zones 2-4\" set it too. Example: 2.",
                "title": "Zone Min"
              }
            },
            "title": "generate_workoutsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "generate_workoutsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ab4a60204d740833a77fbabcaddb3adf7e4f0c15302a0db66c8ff3bbff429e0"
        },
        {
          "name": "get_running_paces",
          "title": "Get my running paces",
          "description": "How fast the athlete should run, from their own Goblin Gains records:\n    with `zone`, the pace their steady runs held at that zone's heart rate\n    first; then pace by HR zone from their steady runs, HR zones, critical\n    speed and its source, the formula pace zones and training paces, the\n    work and recovery bouts of recent interval runs, recent and planned runs,\n    readiness. Needs the athlete's key.",
          "inputSchema": {
            "properties": {
              "minutes": {
                "anyOf": [
                  {
                    "maximum": 600,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "How long that run is. Example: 60 for \"an hour\".",
                "title": "Minutes"
              },
              "zone": {
                "anyOf": [
                  {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The HR zone of the run the athlete asks about, 1-5; omitted for all zones. Example: 2 for \"a zone 2 run\".",
                "title": "Zone"
              }
            },
            "title": "get_running_pacesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_running_pacesOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2eaf2e5a2f31ddf81dcd23b43b4edf997b45c0caf8564738d05b72e2fa5452c"
        },
        {
          "name": "list_archetypes",
          "title": "List workout types",
          "description": "The workout archetypes the generator makes, one per line: key, name,\n    formats, minutes, line count, and the session slots it serves.",
          "inputSchema": {
            "properties": {
              "style": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Keep only one style's archetypes: crossfit, hyrox or hybrid; all when omitted. Example: \"hyrox\".",
                "title": "Style"
              }
            },
            "title": "list_archetypesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "list_archetypesOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea9fa0423c137784e1fd763991272d57665d89b47b1f398ed5fde2f32208039a"
        },
        {
          "name": "list_equipment",
          "title": "List equipment",
          "description": "The equipment generate_workouts' `equipment` takes, one per line:\n    key: name, with \"(machine)\" on ergometers (rower, ski erg, bikes).\n    Keys, names and common names (\"echo\", \"row erg\", \"DB\", \"kb\") all work.",
          "inputSchema": {
            "properties": {},
            "title": "list_equipmentArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "list_equipmentOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3828a717fbf7b2371160b0b271544659e2eff1d3490637df3799cfa94ff7dc2d"
        },
        {
          "name": "report_workout",
          "title": "Report a workout",
          "description": "A user's verdict on a workout from these tools: a mistake (wrong\n    equipment, a weight, a dose that cannot fit), or a workout they found bad\n    or good. Stores the user's words for Goblin Gains, nothing else about the\n    user.",
          "inputSchema": {
            "properties": {
              "note": {
                "description": "What the user said about the workout, in their words. Example: \"Farmers carry needs two dumbbells; I said I have one.\"",
                "maxLength": 2000,
                "minLength": 1,
                "title": "Note",
                "type": "string"
              },
              "verdict": {
                "description": "One of mistake, bad, good: \"mistake\" (something in it is wrong), \"bad\" (it works but is a poor workout), \"good\". Example: \"mistake\".",
                "maxLength": 100,
                "title": "Verdict",
                "type": "string"
              },
              "workout": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The workout's save link from generate_workouts, or its id; omitted for the tools as a whole. Example: \"https://app.goblingains.com/w/<id>\".",
                "title": "Workout"
              }
            },
            "required": ["note", "verdict"],
            "title": "report_workoutArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "report_workoutOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7d20f04bd5865ef5203505603fce0493a75e630035c4f43045006f12a83682ce"
        }
      ],
      "digest": "sha256:c05f836135e74ed240862905e6cf5d079e96269a5de36facd464f98f96010b89"
    }
  }
}
