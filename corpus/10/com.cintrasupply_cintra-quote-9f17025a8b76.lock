{
  "lockfileVersion": 2,
  "subjects": {
    "com.cintrasupply/cintra-quote": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.cintrasupply.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cintra-supply",
        "title": "Cintra Supply",
        "version": "2.1.1"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Cintra Supply is a US wholesale distributor of industrial and operational supplies that quotes multi-category orders in minutes. Start with get_supplier_capabilities, then submit_rfq and poll get_quote.",
      "tools": [
        {
          "name": "accept_quote",
          "title": "Accept a quote, creating an order",
          "description": "Accepts a 'ready' quote and returns an order_id. When online payment is enabled it also returns a secure payment link the buyer completes; otherwise Cintra Supply emails the invoice to the buyer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "const": true,
                "description": "Must be true only after the buyer has reviewed the quote total and authorized the purchase",
                "type": "boolean"
              },
              "rfq_id": {
                "description": "The rfq_id of a quote whose status is 'ready'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirm", "rfq_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:abc15c504c0181040e4edac9ab8492e7aa20a347e700d30d860ab7087e24cd8a"
        },
        {
          "name": "get_order",
          "title": "Get order status by order_id",
          "description": "Returns an accepted order's status: awaiting payment, paid, or awaiting an emailed invoice; with amount and any payment link. Fulfillment updates are added to the record as they occur.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "description": "The order_id returned by accept_quote",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0de6de6f59ecf9222a8de936f532fc8f7998a2e4eb4b349d00e06c28c73ea751"
        },
        {
          "name": "get_quote",
          "title": "Retrieve a quote by rfq_id",
          "description": "Returns the current state of a quote. status is 'pending' while it is being priced, 'ready' once priced (with total and line pricing), 'accepted' once ordered, or 'expired'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "rfq_id": {
                "description": "The rfq_id returned by submit_rfq",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["rfq_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4a70955c297764a1198544ee3946abe7ad79a9b76efa3cf625c4d4041d2aa994"
        },
        {
          "name": "get_supplier_capabilities",
          "title": "What Cintra Supply supplies and how to request a quote",
          "description": "Returns Cintra Supply's supported categories, accepted inputs, and the quote-to-order flow available over this server.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9429eff708a1d82293dddd98cc51e097db69ee362acef22b4ffb7f19f2aa8934"
        },
        {
          "name": "submit_rfq",
          "title": "Submit a request for quote",
          "description": "Submits a parts list for a wholesale quote and returns an rfq_id. Poll get_quote(rfq_id) until status is 'ready'; the priced quote is also emailed to buyer_email. Non-binding; no charge occurs at this step.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "account_number": {
                "description": "Existing Cintra Supply account_number from a prior request, to be recognized as a repeat customer",
                "maxLength": 80,
                "type": "string"
              },
              "buyer_email": {
                "description": "Email to receive the quote and order records",
                "format": "email",
                "type": "string"
              },
              "company": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "contact_name": {
                "maxLength": 200,
                "type": "string"
              },
              "context": {
                "description": "Project, application, or delivery context",
                "maxLength": 2000,
                "type": "string"
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "alternates_allowed": {
                      "default": false,
                      "description": "Whether Cintra Supply may propose clearly labeled alternatives",
                      "type": "boolean"
                    },
                    "description": {
                      "description": "Product description or specification",
                      "maxLength": 1000,
                      "minLength": 2,
                      "type": "string"
                    },
                    "manufacturer": {
                      "description": "Requested manufacturer, when specified",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "notes": {
                      "maxLength": 1000,
                      "type": "string"
                    },
                    "part_number": {
                      "description": "Manufacturer part number, SKU, NSN, or catalog number",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Requested quantity",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "unit": {
                      "description": "Unit of measure, such as each, case, box, ft, or roll",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["description", "quantity", "unit"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "needed_by": {
                "maxLength": 40,
                "type": "string"
              },
              "ship_to_zip": {
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["buyer_email", "lines"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:262c870ab3b780083b28acebb98a44be4b0fcb3e94e0832f3714c1f8f41695ed"
        }
      ],
      "resources": [
        {
          "uri": "https://www.cintrasupply.com/company.json",
          "name": "cintra-company-profile",
          "title": "Cintra Supply company profile",
          "description": "Official machine-readable company, capability, category, contact, and quote information.",
          "mimeType": "application/json",
