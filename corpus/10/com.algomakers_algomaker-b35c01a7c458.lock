        {
          "name": "algomaker_instalar",
          "description": "O passo a passo para instalar o MOTOR do AlgoMaker nesta máquina (Windows, Mac ou Linux), em comandos que o próprio agente roda. NÃO EXISTE APLICATIVO PARA BAIXAR nem instalador: o motor vem pelo `uv`, e a tela é o painel que ele serve no navegador, em 127.0.0.1. Inclui o detalhe que quase todo mundo esquece: depois de registrar o conector é preciso FECHAR E ABRIR o Claude, porque ele só lê essa lista quando inicia. [EN] Install steps for the AlgoMaker quantitative trading engine on this machine. Engine only, no desktop app to download; the UI is a local web panel.",
