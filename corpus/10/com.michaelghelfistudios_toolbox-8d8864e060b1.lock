        {
          "name": "search_encyclopedia",
          "title": "Search the encyclopedias",
          "description": "Find metals, minerals, ingredients and materials, potions, gems, the milieux, animals, plants and creatures of Biomes and the reference pages of Hearth, Passage and Bearer by name (case- and accent-insensitive; exact names first, then prefixes, then substrings, aliases included). Returns each hit with its kind, id, one-line summary and page url; call get_entry for the full data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Restrict to some catalogues, comma-separated (e.g. \"metal,mineral\").",
                "type": "string"
              },
              "lang": {
                "description": "Language of the texts: en (default), fr, or all for both.",
                "enum": ["en", "fr", "all"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "The name or part of it.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
