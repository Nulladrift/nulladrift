      "instructions": "Reference data of the MGS Toolbox (Michael Ghelfi Studios) for tabletop role-playing games: the Metal Encyclopedia (metals), the Crystal Encyclopedia (minerals), Rerum Natura (alchemical ingredients and materials), the Crafting Table (potions, gems, crafting rules), Biomes (milieux, animals, plants, creatures), the reference pages of Hearth (medieval and fantasy cities), Passage (1920s travel) and Bearer (interwar papers), and the MGS Audio catalogue (music, ambiences, sound effects). Texts exist in English and French (lang parameter).\nUse these tools instead of answering from memory whenever a user asks about one of these catalogues. Every entry and track carries a \"url\": cite it when you show the entry, and tell the user where the data comes from (Michael Ghelfi Studios). The audio tools return metadata only: to listen, send the user to the track's url. Filter values are stable codes (list_facets and audio_taxonomy give the vocabularies).",
