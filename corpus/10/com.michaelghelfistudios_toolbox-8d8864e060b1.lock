        {
          "name": "list_entries",
          "title": "List / filter a catalogue",
          "description": "A page of one catalogue, filtered. Use it to answer \"which minerals are cubic and gem-quality?\", \"legendary metals of the medieval era\", \"swamp ingredients with a fire essence\". Combine with q for a name search inside the filter.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "filters": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Field filters as {name: \"value\" | \"value1,value2\"} (any-of, case-insensitive). Names per catalogue: metal → category, era, rarity, fictional, tag; mineral → type, system, rarity, gem_quality, color, magic, planar_origin, origin; ingredient → category, rarity, realm, biome, landform, structure, qualifier, essence, creature_type, part; potion → essence; gem → color, rarity, temporary; milieu → realm, group; animal → kind, size, danger, activity, domestic and the place filters; plant → kind and the place filters; monster → type, size, cr, danger and the place filters; hearth_page, passage_page, bearer_page → none (search by name with q). list_facets gives the values.",
                "type": "object"
              },
              "kind": {
                "description": "Which catalogue: metal, mineral, ingredient, potion, gem, milieu, animal, plant, monster, hearth_page, passage_page, bearer_page.",
                "enum": ["metal", "mineral", "ingredient", "potion", "gem", "milieu", "animal", "plant", "monster", "hearth_page", "passage_page", "bearer_page"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the texts: en (default), fr, or all for both.",
                "enum": ["en", "fr", "all"],
                "type": "string"
              },
              "limit": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "type": "string"
              }
            },
            "required": ["kind"],
