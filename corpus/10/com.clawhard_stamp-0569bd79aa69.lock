        "name": "com.clawhard/stamp",
        "title": "Stamp",
        "version": "1.0.0",
        "description": "Stamp checks a domain's email authentication from live DNS: SPF with the 10-lookup limit, DMARC, DKIM keys and MX. It says whether you meet the Gmail, Yahoo and Outlook sender rules and gives you the exact DNS records to fix what is wrong. No account.",
        "websiteUrl": "https://stamp.clawhard.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stamp: Stamp checks a domain's email authentication from live DNS: SPF with the 10-lookup limit, DMARC, DKIM keys and MX. It says whether you meet the Gmail, Yahoo and Outlook sender rules and gives you the exact DNS records to fix what is wrong. No account. Use it when the user asks why their email goes to spam, whether SPF, DKIM, DMARC or MX are set up right for a domain, whether they meet the Gmail, Yahoo and Outlook sender rules, or before they publish an SPF, DMARC or DKIM record. Tools: stamp_check_email_domain (Check a domain's email authentication (SPF, DKIM, DMARC, MX) from live DNS); stamp_check_dns_record (Check an SPF, DMARC or DKIM record before publishing it). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "stamp_check_dns_record",
          "title": "Check an SPF, DMARC or DKIM record before publishing it",
          "description": "Use when you or the user are about to publish or edit an SPF, DMARC or DKIM TXT record, for example after writing a new SPF record that adds a sending service, or when the user pastes a record and asks \"is this right?\". Detects the record type. SPF: syntax per RFC 7208, every include and redirect followed live in DNS and counted against the 10-lookup limit, void lookups, loops, the final all; returns a lookup tree. DMARC: RFC 7489 tags and values (p, sp, pct, rua/ruf, adkim/aspf, fo). DKIM: key type and RSA key size read from the key, revoked (empty p=) or truncated keys. Returns valid true/false, errors, warnings and where to publish it. Pass domain so a/mx terms without a value can be resolved.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Optional: the domain the record is for, so SPF a and mx terms can be checked.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "record": {
                "description": "The TXT record value, e.g. \"v=spf1 include:_spf.google.com ~all\" or \"v=DMARC1; p=none; rua=mailto:dmarc@mycompany.com\". Quoted chunks (\"...\" \"...\") are joined.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["record"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check an SPF, DMARC or DKIM record before publishing it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/stamp/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/stamp/result"
          },
          "digest": "sha256:0238dda60eeae23bc821b6b9de8ceb5bb32f0df7315968b3a92571a1b80efde6"
        },
        {
          "name": "stamp_check_email_domain",
          "title": "Check a domain's email authentication (SPF, DKIM, DMARC, MX) from live DNS",
          "description": "Use when the user asks why their email goes to spam, whether their domain is set up to send email, or before they launch a newsletter, cold outreach, transactional email or a new sending service, e.g. \"why are my emails going to spam?\", \"is my SPF/DKIM/DMARC right?\", \"do I meet Gmail and Yahoo's sender requirements?\" or \"I added SendGrid, did I break SPF?\". Reads public DNS (DNS-over-HTTPS) and checks: SPF (exactly one record, every include followed and DNS lookups counted per RFC 7208 against the limit of 10, void lookups, loops, +all/?all, ptr), DMARC (RFC 7489 syntax, policy, pct, alignment, inherited from the parent domain, and whether an external report address authorized it), DKIM (17 common selectors plus any you pass; key type and RSA key size read from the key, revoked or broken keys), and MX (provider, null MX). Returns a grade A-F, a verdict, each check with status pass/warn/fail/info, whether the Gmail, Yahoo and Outlook.com sender rules are met, and copy-ready DNS records to fix problems (e.g. one merged SPF record, a starter DMARC record). DNS cannot list DKIM selectors, so when none of the common selectors is found the result says so and a known selector (the s= value in a DKIM-Signature header) can be passed in. Accepts a domain, an email address or a URL. Results are cached for 5 minutes; pass fresh=true right after the user changes DNS.",
          "inputSchema": {
            "properties": {
              "dkim_selectors": {
                "description": "Extra DKIM selectors to try besides the common ones, e.g. [\"mxvault\"]. Find it as s= in a DKIM-Signature header or in the provider's setup page.",
                "items": {
                  "maxLength": 63,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "domain": {
                "description": "The sending domain, e.g. mycompany.com. An email address (you@mycompany.com) or a URL also works.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "fresh": {
                "description": "true to skip the 5-minute cache, e.g. right after a DNS change.",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a domain's email authentication (SPF, DKIM, DMARC, MX) from live DNS"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
