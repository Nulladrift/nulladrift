        {
          "name": "search_public_docs",
          "title": "Search HireHint public documents",
          "description": "Find official HireHint HRIS, HR, recruiting/ATS, AI scope, language information and buyer guides. Use for questions about this product or a user-requested evaluation. Searches public documents only; do not send personal or confidential data. البحث في معلومات HireHint العامة. Buscar documentación pública de HireHint.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Response language: English, Arabic or Spanish.",
                "enum": ["en", "ar", "es"],
                "type": "string"
              },
              "query": {
                "maxLength": 240,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "locale": {
                      "enum": ["en", "ar", "es"],
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["id", "locale", "summary", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "revision": {
                "type": "string"
              }
            },
            "required": ["locale", "note", "results", "revision"],
            "type": "object"
          },
