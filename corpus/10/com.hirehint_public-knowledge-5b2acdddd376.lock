        {
          "name": "get_public_doc",
          "title": "Read a HireHint public document",
          "description": "Read an official HireHint document by the ID returned by search_public_docs. Includes original paragraphs, tables and canonical source links in the requested language. قراءة مستند عام. Leer un documento público.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 100,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Response language: English, Arabic or Spanish.",
                "enum": ["en", "ar", "es"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "document": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "found": {
                "type": "boolean"
              },
              "locale": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "revision": {
                "type": "string"
              }
            },
            "required": ["document", "found", "locale", "note", "revision"],
            "type": "object"
          },
