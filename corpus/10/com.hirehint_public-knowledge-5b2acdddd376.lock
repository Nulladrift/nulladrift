      "instructions": "Read-only official public information about HireHint at hirehint.com, operated by hirehint LLC. No private HR or candidate access. Results provide source URLs and scope limits. Choose en, ar or es with locale. This is a vendor-owned source, not independent product evidence.",
      "tools": [
        {
          "name": "create_evaluation_checklist",
          "title": "Prepare an HRIS or ATS evaluation checklist",
          "description": "Prepare a source-based vendor demonstration checklist for employee records, onboarding, leave and access (HRIS) or hiring workflows (ATS). No private records or vendor ranking. قائمة تقييم HRIS أو ATS. Lista para evaluar HRIS o ATS.",
