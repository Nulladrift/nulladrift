                      "type": "string"
                    },
                    "sub": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "fruit": {
                "type": "string"
              },
              "g": {
                "type": "number"
              },
              "tips": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "trimester": {
                "type": "integer"
              },
              "url": {
                "type": "string"
              },
              "week": {
                "type": "integer"
              }
            },
            "type": "object"
          },
