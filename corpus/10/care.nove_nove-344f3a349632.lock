          "name": "list_features",
          "title": "Recursos da Nove",
          "description": "Use quando perguntarem o que o app Nove faz ou se ele tem um recurso (lembrete de remédio, pré-natal, pressão e glicemia, cardápio da nutri, conversa com IA, álbum, nomes, parceiro, caderneta, plano de parto). Retorna cada recurso com nome, descrição e link da página.",
