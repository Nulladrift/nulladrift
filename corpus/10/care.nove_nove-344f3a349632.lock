        {
          "name": "search_nove",
          "title": "Buscar no nove.care",
          "description": "Use para achar no site da Nove o conteúdo sobre um assunto de gestação (enjoo, exames, plano de parto, pressão, remédios na gravidez) ou sobre o app (recursos, preços, enxoval). Retorna até 5 páginas com título, resumo, trecho e link, da mais relevante para a menos.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "O que procurar, em português",
                "minLength": 2,
                "type": "string"
              }
            },
