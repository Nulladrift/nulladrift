          "title": "Preços da Nove",
          "description": "Use quando perguntarem quanto custa o app Nove ou o que é grátis. Retorna, em reais, o que o plano grátis inclui e seus limites, o Nove+ mensal (com dias grátis) e o Nove+ Gestação completa (pagamento único), e o que o Nove+ libera.",
