{
  "lockfileVersion": 2,
  "subjects": {
    "care.nove/nove": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nove.care/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nove",
        "title": "Nove: gestação semana a semana",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ferramentas só de leitura do nove.care, em português do Brasil. Conteúdo geral de gestação, não diagnóstico: diante de sinal de alerta, oriente procurar a maternidade ou a equipe de saúde.",
      "tools": [
        {
          "name": "calculate_due_date",
          "title": "Data provável do parto",
          "description": "Use quando quiserem saber a data provável do parto (DPP) ou de quantas semanas estão. Informe a última menstruação (lmp), ou um ultrassom (data mais semanas e dias do laudo), ou a DPP que a médica passou. Retorna a DPP, as semanas e dias de hoje, o trimestre e o link da semana. Regra de Naegele (DUM + 280 dias).",
          "inputSchema": {
            "properties": {
              "due_date": {
                "description": "Data provável do parto já conhecida (AAAA-MM-DD)",
                "type": "string"
              },
              "lmp": {
                "description": "Primeiro dia da última menstruação (AAAA-MM-DD)",
                "type": "string"
              },
              "ultrasound_date": {
                "description": "Data do ultrassom (AAAA-MM-DD)",
                "type": "string"
              },
              "ultrasound_days": {
                "description": "Dias no laudo do ultrassom (0 a 6)",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "ultrasound_weeks": {
                "description": "Semanas no laudo do ultrassom",
                "maximum": 42,
                "minimum": 4,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "days": {
                "type": "integer"
              },
              "due_date": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "method": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "today": {
                "type": "string"
              },
              "trimester": {
                "type": "integer"
              },
              "week_page": {
                "type": "string"
              },
              "weeks": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e936496624419475df1bb9676b8f6c1a5fbde6ea5c694d824910f6b189b7b47"
        },
        {
          "name": "get_pregnancy_week",
          "title": "Semana da gestação",
          "description": "Use quando perguntarem sobre uma semana específica da gravidez (4 a 40). Retorna o tamanho do bebê comparado a uma fruta (cm e g), o desenvolvimento do bebê, o que muda no corpo, dicas, perguntas para a consulta, os exames da fase e o link da página. Conteúdo geral em português, com base na Caderneta da Gestante 2026; não é diagnóstico.",
          "inputSchema": {
            "properties": {
              "week": {
                "description": "Semana da gestação, de 4 a 40",
                "maximum": 40,
                "minimum": 4,
                "type": "integer"
              }
            },
            "required": ["week"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ask": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
