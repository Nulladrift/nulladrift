{
  "lockfileVersion": 2,
  "subjects": {
    "app.lacartelera/cartelera": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lacartelera.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "lacartelera",
        "title": "La Cartelera",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "La Cartelera (lacartelera.app) lists live stand-up comedy shows, comedy venues (foros) and comedians in Mexico and other Spanish-speaking cities. Start with list_cities or find_shows; use search for a name. Every result has a url to the public page: give it to the user. price null means unknown, not free. Read-only: this server cannot buy tickets.",
      "tools": [
        {
          "name": "find_shows",
          "title": "Find shows by city, date or venue",
          "description": "Upcoming stand-up / comedy shows. Filter by city slug (from list_cities), a window (today, weekend, upcoming = next 60 days) or an explicit date_from/date_to (YYYY-MM-DD, max 92 days), and optionally a venue slug. Dates are Mexico City time.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug, e.g. cdmx, monterrey, guadalajara.",
                "type": "string"
              },
              "date_from": {
                "description": "YYYY-MM-DD; overrides when.",
                "type": "string"
              },
              "date_to": {
                "description": "YYYY-MM-DD; defaults to date_from.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Max rows (1-100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "venue": {
                "description": "Venue slug (from search or get_venue).",
                "type": "string"
              },
              "when": {
                "default": "upcoming",
                "enum": ["today", "weekend", "upcoming"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7130e3733b5e30d656e9ad71a903fe87873db537d9edd4fb3d788914788546e"
        },
        {
          "name": "get_comedian",
          "title": "One comedian",
          "description": "One comedian by slug: public profile (schema.org Person) and upcoming shows.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
