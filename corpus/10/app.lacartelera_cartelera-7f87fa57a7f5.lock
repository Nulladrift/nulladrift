{
  "lockfileVersion": 2,
  "subjects": {
    "app.lacartelera/cartelera": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lacartelera.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "lacartelera",
        "title": "La Cartelera",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "La Cartelera (lacartelera.app) lists live stand-up comedy shows, comedy venues (foros) and comedians in Mexico and other Spanish-speaking cities. Start with list_cities or find_shows; use search for a name. Every result has a url to the public page: give it to the user. price null means unknown, not free. This server cannot buy tickets. It can post a show for review with submit_event: the show lands in a moderation queue and is published only after an editor approves it.",
      "tools": [
        {
          "name": "find_shows",
          "title": "Find shows by city, date or venue",
          "description": "Upcoming stand-up / comedy shows. Filter by city slug (from list_cities), a window (today, weekend, upcoming = next 60 days) or an explicit date_from/date_to (YYYY-MM-DD, max 92 days), and optionally a venue slug. Dates are Mexico City time.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug, e.g. cdmx, monterrey, guadalajara.",
                "type": "string"
              },
              "date_from": {
                "description": "YYYY-MM-DD; overrides when.",
                "type": "string"
              },
              "date_to": {
                "description": "YYYY-MM-DD; defaults to date_from.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Max rows (1-100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "venue": {
                "description": "Venue slug (from search or get_venue).",
                "type": "string"
              },
              "when": {
                "default": "upcoming",
                "enum": ["today", "weekend", "upcoming"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7130e3733b5e30d656e9ad71a903fe87873db537d9edd4fb3d788914788546e"
        },
        {
          "name": "get_comedian",
          "title": "One comedian",
          "description": "One comedian by slug: public profile (schema.org Person) and upcoming shows.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da364d55cacf07d1e87bcee4d58f6d8cafc0cec5c281893fa2258f990467f342"
        },
        {
          "name": "get_show",
          "title": "One show",
          "description": "One show by slug, as the schema.org ComedyEvent its public page publishes (date, venue, lineup, offer).",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:720805251c843704ebc694dd4b476e6b821602ebebf480ed290269d25fe0bb05"
        },
        {
          "name": "get_venue",
          "title": "One venue",
          "description": "One comedy venue (foro) by slug: address, city, zone, links and its upcoming shows.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ae22b91fcf85f974f938ebcb37a17cbb4d53e1a91b71aa799ace18d8964ea94"
        },
        {
          "name": "list_cities",
          "title": "Cities with upcoming shows",
          "description": "Cities that have upcoming comedy shows, with the slug to pass to find_shows and the count.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c5e3272c5549c45b2b88561824cc76f0f795e3500c1cbc5b638923dced12b87"
        },
        {
          "name": "search",
          "title": "Search shows, comedians and venues",
          "description": "Search by name across upcoming shows (next 60 days), comedians and venues. Query of 2+ characters.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Max rows per group (1-100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Text, e.g. a comedian, venue or show name.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f0ad446c5423213dd89f00a3ca2d2eea319c21a8b4810ad02cd60ba9ca6d6aa"
        },
        {
          "name": "submit_event",
          "title": "Post a show for review",
          "description": "Send a show to La Cartelera's moderation queue. The row is created with status 'pending' and an editor reviews it before it appears on the site — nothing is published by this call. title and date are required; everything else is optional. Use it when someone tells you about a show that is not listed yet.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category, e.g. stand-up, Comedy.",
                "maxLength": 120,
                "type": "string"
              },
              "city": {
                "description": "City, e.g. CDMX, Guadalajara.",
                "maxLength": 120,
                "type": "string"
              },
              "date": {
                "description": "Date of the show, YYYY-MM-DD.",
                "maxLength": 10,
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "description": {
                "description": "Short description of the show.",
                "maxLength": 2000,
                "type": "string"
              },
              "external_link": {
                "description": "https:// link with more info (ticket page, Instagram).",
                "maxLength": 500,
                "pattern": "^https?://",
                "type": "string"
              },
              "price": {
                "description": "Ticket price in MXN. Omit when unknown.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "submitter_email": {
                "description": "Email of the person sending this.",
                "maxLength": 120,
                "type": "string"
              },
              "submitter_name": {
                "description": "Name of the person sending this.",
                "maxLength": 120,
                "type": "string"
              },
              "time": {
                "description": "Start time, HH:MM (24h).",
                "maxLength": 5,
                "pattern": "^[0-9]{2}:[0-9]{2}$",
                "type": "string"
              },
              "title": {
                "description": "Name of the show.",
                "maxLength": 200,
                "type": "string"
              },
              "venue_name": {
                "description": "Venue or forum name.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["date", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:51d2965444b5390e3ff4f8131eb6c6e8c26942718010dbe95e2134afb0168507"
        }
      ],
      "digest": "sha256:9de7bd86ec485ae3d4991f3b43cdf5b06dbd0a176cba5009b7e77ec5f26936ed"
    }
  }
}
