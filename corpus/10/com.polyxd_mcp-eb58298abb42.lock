        {
          "name": "polyxd_validate",
          "title": "Validate a Polyxd document",
          "description": "Checks a Polyxd UI document against the spec: the schema, ids and references, bindings against the data, actions, and the rules for generated screens. Returns every issue with its JSON Pointer, the component it is in, and a hint saying what to change. Call it after writing or changing a document, and fix every error before showing it.",
          "inputSchema": {
            "properties": {
              "data": {
                "additionalProperties": true,
                "description": "The values the screen shows, bound by {\"path\": \"/pointer\"}. Replaces the document's own \"data\" when given.",
                "type": "object"
              },
              "document": {
                "additionalProperties": true,
                "description": "A Polyxd UI document: {specVersion, surface, root, components, data?}. polyxd_guide explains the format.",
                "type": "object"
              }
            },
            "required": ["document"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "errors": {
                "description": "How many errors. Fix every one before showing the document.",
                "minimum": 0,
                "type": "integer"
              },
              "issues": {
                "description": "Every error and warning, each at its JSON Pointer with a hint. Empty when the document is clean.",
                "items": {
                  "additionalProperties": false,
                  "description": "One problem in the document.",
                  "properties": {
                    "component": {
                      "additionalProperties": false,
                      "description": "The component the pointer is inside, when it is inside one.",
                      "properties": {
                        "id": {
                          "description": "The component's id.",
                          "type": "string"
                        },
                        "type": {
                          "description": "The component's type (its \"component\" value), e.g. \"TextInput\".",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "hint": {
                      "description": "What to change to fix it, when there is a known fix.",
                      "type": "string"
                    },
                    "message": {
                      "description": "What is wrong.",
                      "type": "string"
                    },
                    "pointer": {
                      "description": "JSON Pointer to the problem in the document, e.g. \"/components/2/label\".",
                      "type": "string"
                    },
                    "severity": {
                      "description": "\"error\" must be fixed before the document is shown; \"warning\" is advice.",
                      "enum": ["error", "warning"],
                      "type": "string"
                    }
                  },
                  "required": ["message", "pointer", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "valid": {
                "description": "True when the document has no errors and can be shown. Warnings do not make it invalid.",
                "type": "boolean"
              },
              "warnings": {
                "description": "How many warnings. Advice; they do not stop the document being shown.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["errors", "issues", "valid", "warnings"],
            "type": "object"
          },
          "annotations": {
