        {
          "name": "polyxd_verify",
          "title": "Verify a Polyxd document",
          "description": "Runs the Polyxd verifier's document checks: the spec validator, the pattern the surface declares, readable and distinct labels, one primary action per view, at most six inputs per view, entity-first flows, confirmations, and, when you pass one, a Design Direction's rules and voice. Returns a compact report. Example directions by name: calm-finance, playful-personal.",
          "inputSchema": {
            "properties": {
              "data": {
                "additionalProperties": true,
                "description": "The values the screen shows, bound by {\"path\": \"/pointer\"}. Replaces the document's own \"data\" when given.",
                "type": "object"
              },
              "direction": {
                "description": "A Design Direction to hold the document to: the direction object, or the name of an example direction.",
                "oneOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": true,
                    "type": "object"
                  }
                ]
              },
              "document": {
                "additionalProperties": true,
                "description": "A Polyxd UI document: {specVersion, surface, root, components, data?}. polyxd_guide explains the format.",
                "type": "object"
              },
              "registry": {
                "additionalProperties": true,
                "description": "A capability registry ({capabilities: [...]}) to check the document's actions against. Leave out when there is none.",
                "type": "object"
              }
            },
            "required": ["document"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "direction": {
                "description": "The name of the Design Direction the document was held to, when one was given and it has a name.",
                "type": "string"
              },
              "errors": {
                "description": "How many errors. Fix every one before showing the document.",
                "minimum": 0,
                "type": "integer"
              },
              "findings": {
                "description": "Every check that failed. Empty when the document passes with no warnings.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "check": {
                      "description": "The check that failed, e.g. \"spec\", \"data:missing-path\", \"pattern:<id>\", \"rule:<id>\", \"capability\" or \"load:inputs-per-view\".",
                      "type": "string"
                    },
                    "hint": {
                      "description": "What to change to fix it, when there is a known fix.",
                      "type": "string"
                    },
                    "message": {
                      "description": "What failed; findings from the spec validator start with the JSON Pointer, as \"<pointer>: <message>\".",
                      "type": "string"
                    },
                    "severity": {
                      "description": "\"error\" must be fixed before the document is shown; \"warning\" is advice.",
                      "enum": ["error", "warning"],
                      "type": "string"
                    }
                  },
                  "required": ["check", "message", "severity"],
                  "type": "object"
                },
