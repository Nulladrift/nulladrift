        {
          "name": "polyxd_show",
          "title": "Show a Polyxd screen",
          "description": "Validates a Polyxd UI document and shows it to the user as an interactive screen, drawn by the Polyxd renderer in the design-system pack you choose (default material3). Shows nothing if the document has errors; fix them first with polyxd_validate. When the user presses an action in the screen, you receive a chat message from the user naming the action and its context; that only tells you their choice, and nothing has been submitted or paid. Packs: material3, antd, bootstrap, carbon, chakra, fluent, govuk, mantine, polaris, primer, radix, shadcn, spectrum, brutalist, civic, editorial, finance, glass, health, mono, neon, pastel, sketch, terminal, wireframe.",
          "inputSchema": {
            "properties": {
              "data": {
                "additionalProperties": true,
                "description": "The values the screen shows, bound by {\"path\": \"/pointer\"}. Replaces the document's own \"data\" when given.",
                "type": "object"
              },
              "document": {
                "additionalProperties": true,
                "description": "A Polyxd UI document: {specVersion, surface, root, components, data?}. polyxd_guide explains the format.",
                "type": "object"
              },
              "mode": {
                "description": "Light or dark. Leave out to follow the host's theme.",
                "enum": ["light", "dark"],
                "type": "string"
              },
              "pack": {
                "description": "The design-system pack to draw the screen in, by id: material3, antd, bootstrap, carbon, chakra, fluent, govuk, mantine, polaris, primer, radix, shadcn, spectrum, brutalist, civic, editorial, finance, glass, health, mono, neon, pastel, sketch, terminal, wireframe. Names like \"Carbon\" or \"shadcn/ui\" work too. Pass it whenever the user names a design system. Default material3.",
                "type": "string"
              }
            },
            "required": ["document"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "shown is true with the document, pack and spec version when the screen was shown; false with the issues when it was not (that result is also an error).",
            "oneOf": [
              {
                "properties": {
                  "shown": {
                    "const": true
                  }
                },
                "required": ["document", "pack", "packName", "specVersion"]
              },
              {
                "properties": {
                  "shown": {
                    "const": false
                  }
                },
                "required": ["issues"]
              }
            ],
            "properties": {
              "document": {
                "additionalProperties": true,
                "description": "The Polyxd UI document as shown, with the separately passed data merged in as its \"data\". The MCP App renders it.",
                "type": "object"
              },
              "issues": {
                "description": "When not shown: the document's errors and warnings, each at its JSON Pointer with a hint.",
                "items": {
                  "additionalProperties": false,
                  "description": "One problem in the document.",
                  "properties": {
                    "component": {
                      "additionalProperties": false,
                      "description": "The component the pointer is inside, when it is inside one.",
                      "properties": {
                        "id": {
                          "description": "The component's id.",
                          "type": "string"
                        },
                        "type": {
                          "description": "The component's type (its \"component\" value), e.g. \"TextInput\".",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "hint": {
                      "description": "What to change to fix it, when there is a known fix.",
                      "type": "string"
                    },
                    "message": {
                      "description": "What is wrong.",
                      "type": "string"
                    },
                    "pointer": {
                      "description": "JSON Pointer to the problem in the document, e.g. \"/components/2/label\".",
                      "type": "string"
                    },
                    "severity": {
                      "description": "\"error\" must be fixed before the document is shown; \"warning\" is advice.",
                      "enum": ["error", "warning"],
                      "type": "string"
                    }
                  },
                  "required": ["message", "pointer", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "mode": {
                "description": "Light or dark, when one was asked for. Absent: the screen follows the host's theme.",
                "enum": ["light", "dark"],
                "type": "string"
              },
              "pack": {
                "description": "The design-system pack the screen is drawn in.",
                "enum": ["material3", "antd", "bootstrap", "carbon", "chakra", "fluent", "govuk", "mantine", "polaris", "primer", "radix", "shadcn", "spectrum", "brutalist", "civic", "editorial", "finance", "glass", "health", "mono", "neon", "pastel", "sketch", "terminal", "wireframe"],
                "type": "string"
              },
              "packName": {
                "description": "The pack's display name, e.g. \"Material 3\".",
                "type": "string"
              },
              "shown": {
                "description": "Whether the screen was shown to the user. False when the document has errors.",
                "type": "boolean"
              },
              "specVersion": {
                "description": "The version of the Polyxd spec this server implements, e.g. \"0.3.0\". Documents set it as their \"specVersion\".",
                "type": "string"
              }
            },
            "required": ["shown"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
