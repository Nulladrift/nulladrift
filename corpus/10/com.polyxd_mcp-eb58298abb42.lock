      },
      "serverInfo": {
        "name": "polyxd",
        "title": "Polyxd",
        "version": "0.4.6",
        "websiteUrl": "https://polyxd.com/docs/mcp/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Polyxd turns a small JSON document of meaning into a real screen in a design system. You write the document; this server checks it and shows it to the user. Call polyxd_guide once before writing your first document, polyxd_validate until it is valid, then polyxd_show. For questions about Polyxd itself (installing a renderer, the verifier, the runtime, Studio, anything in the docs), call polyxd_docs and cite the URLs it returns rather than answering from memory. Actions the user takes in a shown screen come back to you as chat messages. A button press only tells you what the user chose: it submits, pays or saves nothing, so never say it did.",
      "tools": [
        {
          "name": "polyxd_components",
          "title": "List Polyxd components",
          "description": "Lists the semantic components a Polyxd document can use, with a one-line summary each. Pass \"name\" for one component's full definition: every prop and its type, which are required, when to use it and when not to, and how it renders.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "A component name, e.g. \"Choice\", for its full definition.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "\"component\" when a name was given; \"components\" otherwise.",
            "oneOf": [
              {
                "required": ["component"]
              },
              {
                "required": ["components"]
              }
            ],
            "properties": {
              "component": {
                "additionalProperties": true,
                "description": "One component's full definition.",
                "properties": {
                  "accessibility": {
                    "additionalProperties": true,
                    "description": "Its accessible role and requirements.",
                    "type": "object"
                  },
                  "agent": {
                    "description": "How an agent operating the rendered screen should use it.",
                    "type": "string"
                  },
                  "category": {
                    "description": "The component's kind: action, shell, structure, content, input, flow, layout, feedback.",
                    "type": "string"
                  },
                  "name": {
                    "description": "The component's type name, the value of \"component\" in a document, e.g. \"Choice\".",
                    "type": "string"
                  },
                  "props": {
                    "additionalProperties": true,
                    "description": "Every prop, by name, as a JSON Schema. $refs point into the spec's common definitions (DynamicString, Binding, Options and so on).",
                    "type": "object"
                  },
                  "rendering": {
                    "description": "How renderers draw it.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "required": {
                    "description": "The props a document must set.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "shell": {
                    "description": "True for shell components, which frame a product's screens: authored once per product, never generated.",
                    "type": "boolean"
                  },
                  "summary": {
                    "description": "What the component is for, in one line.",
                    "type": "string"
                  },
                  "whenNotToUse": {
                    "description": "When not to, and what to use instead.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "whenToUse": {
                    "description": "When to use this component.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["category", "name", "props", "required", "summary", "whenNotToUse", "whenToUse"],
                "type": "object"
              },
              "components": {
                "description": "Every component, in the spec's order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "description": "The component's kind: action, shell, structure, content, input, flow, layout, feedback.",
                      "type": "string"
                    },
                    "name": {
                      "description": "The component's type name. Pass it back as \"name\" for the full definition.",
                      "type": "string"
                    },
                    "shell": {
                      "description": "True for shell components: authored once per product, never generated. Use the others in generated screens.",
                      "type": "boolean"
                    },
                    "summary": {
                      "description": "What the component is for, in one line.",
                      "type": "string"
                    }
                  },
                  "required": ["category", "name", "shell", "summary"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Polyxd components"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8af3731acde384ff814f73426617ff77b292c899d4284f585fd44db771bf87fb"
