        {
          "name": "polyxd_docs",
          "title": "Search the Polyxd docs",
          "description": "Searches the polyxd.com docs, as of this server's version: installing and using the React and Web Components renderers, the spec, the verifier and its CLI, the runtime, the generation server, design systems and packs, Design Directions, analytics events, Studio, the MCP server and the roadmap. Pass \"query\" for the sections that best match, \"page\" for one whole page, or nothing for the list of pages. Cite the URLs it returns. For writing a document, use polyxd_guide.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "A page's slug, title or URL, e.g. \"quickstart\", for the whole page.",
                "type": "string"
              },
              "query": {
                "description": "A question or topic, e.g. \"run the verifier in CI\" or \"Web Components renderer\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "page": {
                "description": "The page asked for with \"page\".",
                "properties": {
                  "description": {
                    "description": "A one-line summary of the page.",
                    "type": "string"
                  },
                  "markdown": {
                    "description": "The whole page as Markdown, links made absolute.",
                    "type": "string"
                  },
                  "slug": {
                    "description": "The page's path under /docs/, \"\" for the docs home.",
                    "type": "string"
                  },
                  "title": {
                    "description": "The page's title.",
                    "type": "string"
                  },
                  "url": {
                    "description": "The page on polyxd.com, to cite.",
                    "type": "string"
                  }
                },
                "required": ["markdown", "slug", "title", "url"],
                "type": "object"
              },
              "pages": {
                "description": "Every docs page, when neither \"query\" nor \"page\" is given.",
                "items": {
                  "properties": {
                    "description": {
                      "description": "A one-line summary of the page.",
                      "type": "string"
                    },
                    "section": {
                      "description": "The docs section it sits in, e.g. \"Start\" or \"Guides\".",
                      "type": "string"
                    },
                    "slug": {
                      "description": "The page's path under /docs/, for \"page\".",
                      "type": "string"
                    },
                    "title": {
                      "description": "The page's title.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The page on polyxd.com, to cite.",
                      "type": "string"
                    }
                  },
                  "required": ["slug", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "sections": {
                "description": "The sections that best match \"query\", best first.",
                "items": {
                  "properties": {
                    "heading": {
                      "description": "The section's heading.",
                      "type": "string"
                    },
                    "page": {
                      "description": "The page's slug, for \"page\".",
                      "type": "string"
                    },
                    "text": {
                      "description": "The section's Markdown.",
                      "type": "string"
                    },
                    "title": {
                      "description": "The page's title.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The section on polyxd.com, to cite.",
                      "type": "string"
                    }
                  },
                  "required": ["heading", "page", "text", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Polyxd docs"
          },
          "behavior": {
