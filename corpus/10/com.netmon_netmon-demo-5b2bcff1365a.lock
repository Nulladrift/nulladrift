        {
          "name": "syslog_facets",
          "description": "Top-N value counts for ONE syslog field over a window — 'what are the top actions/reasons on this FortiGate in the last 2 hours' in a single call, instead of pulling rows and counting them yourself. Wraps GET /api/syslog/facets (permission: logs); tag-scoped server-side.\n\ngroup_by takes one of two kinds of field:\n\n  COLUMN (indexed, may run fleet-wide — device_id optional):\n    facility, severity, source\n\n  MESSAGE FIELD (parsed out of the message text at read time — device_id REQUIRED):\n    action, reason, devname, type, subtype, level, logdesc, msg,\n    service, policyid, srccountry, dstcountry, srcintf, dstintf,\n    user, group, status, app, appcat, vpntunnel, eventtype, proto\n\nMessage fields have no index and cannot get one — they are pulled out of free text — so every message pivot is a sequential scan of the window (~37x the per-row cost of a column pivot). device_id is mandatory for them and the server rejects a fleet-wide message pivot outright.\n\n`devname` and `source` are DIFFERENT keys and are deliberately not merged: `source` is the column syslog arrived with (a relay may have rewritten it to its own name), `devname` is what the device wrote about itself inside the message. Ask for the one you mean.\n\nWindow: `hours` (1-168, default 24) OR `start_time`+`end_time` (ISO-8601 UTC); a window wider than 168h is refused either way. `limit` is the top-N cut (1-50, default 20).\n\nReading the result: `facets` is the top-N; `other` is everything below the cut, so facets + other sums to `matched_rows`. `rows_without_field` counts rows in the window where the field is absent entirely — a large value is normal (a FortiGate emits many message types) and is NOT a failure.\n\nErrors are structured, and two of them are instructions:\n  error='window_too_large' — the row pre-check refused before scanning. Lower `hours` (halve it and retry) or add/narrow device_id. `rows_in_window` and `max_rows` tell you how far over you are. Do NOT retry the same window.\n  error='query_timeout' — the scan passed the 10s server budget. Same remedy: narrow the window, or pivot a column instead.\n\nExample: syslog_facets({group_by: \"action\", device_id: 372, hours: 2})",
          "inputSchema": {
            "properties": {
              "device_id": {
                "description": "Device id to pivot within. Required for every message-field group_by; optional for facility/severity/source.",
                "type": "integer"
              },
              "end_time": {
                "description": "ISO-8601 UTC. Must be paired with start_time.",
                "type": "string"
              },
              "group_by": {
                "description": "Field to pivot on. Columns: facility, severity, source (device_id optional). Message fields: action, reason, devname, type, subtype, level, logdesc, msg, service, policyid, srccountry, dstcountry, srcintf, dstintf, user, group, status, app, appcat, vpntunnel, eventtype, proto (device_id REQUIRED).",
                "enum": ["facility", "severity", "source", "action", "reason", "devname", "type", "subtype", "level", "logdesc", "msg", "service", "policyid", "srccountry", "dstcountry", "srcintf", "dstintf", "user", "group", "status", "app", "appcat", "vpntunnel", "eventtype", "proto"],
                "type": "string"
              },
              "hours": {
                "description": "Lookback window in hours (1-168). Default 24.",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Top-N cut (1-50). Default 20; the rest is folded into `other`.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "start_time": {
                "description": "ISO-8601 UTC (e.g. 2026-04-23T10:00:00Z). Must be paired with end_time.",
                "type": "string"
              }
            },
            "required": ["group_by"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Syslog Facet Breakdown"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28b91ffa7bbd06fadf10f3016e9d3c183f0289b1ffbd630a948bc36fea855ef5"
        },
        {
          "name": "syslog_search",
          "description": "Search syslog messages from network devices. Wraps GET /api/syslog/list (permission: logs); tag-scoped server-side.\n\nFilters (all optional): device_id, severity (name or int 0-7), facility (int 0-23), source (exact host/IP), message (substring).\n\nWindow: `hours` (1-168, default 24) OR `start_time`+`end_time` (ISO-8601 UTC). `limit` defaults to 50 (max 500). The response's `total` is the full match count — if it exceeds `limit`, narrow the window or add severity/message filters rather than bumping limit unboundedly.\n\nExample: syslog_search({severity: \"error\", hours: 2, limit: 20})",
          "inputSchema": {
            "properties": {
              "device_id": {
