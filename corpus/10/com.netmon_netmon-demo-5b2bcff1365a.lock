        {
          "name": "alerts_history",
          "description": "Authoritative 'what fired and when' stream — wraps the `alert_history` table (one row per incident, both legacy and modern) and `alert_outlet_log` (per-dispatch ledger keyed by history_id).\n\nDefault mode: lists incidents newest-first. Each row is one incident with opened_at / last_event_at / resolved_at framing the lifecycle, plus aggregated outlet_types[], dispatch_count, and failed_count. `status` is computed from resolved_at: 'open' if null, 'resolved' otherwise.\n\nDrill-down mode: pass `incident_id` (the `alert_history.id`, NOT `alert_id`) to switch the call to /api/alert-history/{id}/log and return the per-outlet dispatch ledger for that one incident. Use this for 'did the email actually go' / 'what did the webhook payload look like' / 'which outlets failed' follow-ups.\n\nFilters (default mode, all client-side, AND-combined): status (open|resolved|all, default all), severity (int or array — scheme is 1-5, lower=worse), device_id, source (legacy|modern|all), hours (1-168, default 24, applied against last_event_at), search (substring on alert_label/subject).\n\nImportant caps: the upstream endpoint returns at most 500 rows ordered by last_event_at DESC. We can't reach older rows than that. `meta.upstream_cap` reports this so the LLM can warn the user when results may be truncated. `severity_label` is added server-side so the LLM doesn't memorize the scale.\n\nPagination is over the post-filter result. Tag-scope is enforced by Laravel — tag-restricted users see only incidents for devices in their slug set.\n\nPermission: alerts. Examples:\n  alerts_history({status: 'open', severity: [1,2], hours: 1})\n  alerts_history({device_id: 42, hours: 24})\n  alerts_history({incident_id: 9182})  // dispatch ledger",
          "inputSchema": {
            "properties": {
              "device_id": {
                "description": "Restrict to one device id.",
                "type": "integer"
              },
              "end_time": {
                "description": "ISO-8601 UTC; pairs with start_time.",
                "type": "string"
              },
              "hours": {
                "description": "Lookback window applied against last_event_at (default 24).",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              },
              "incident_id": {
                "description": "If set, switches to per-incident dispatch-ledger mode (returns alert_outlet_log rows). This is alert_history.id, NOT alert_id.",
                "type": "integer"
              },
              "page": {
                "description": "1-indexed page number (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Rows per page (default 50, max 200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Case-insensitive substring on alert_label / subject.",
                "type": "string"
              },
              "severity": {
                "description": "Severity int or array of ints (1-5, lower=worse)."
              },
              "source": {
                "description": "Filter by source axis. Default 'all'.",
                "enum": ["legacy", "modern", "all"],
                "type": "string"
              },
              "start_time": {
                "description": "ISO-8601 UTC; pairs with end_time.",
                "type": "string"
              },
              "status": {
                "description": "Filter by lifecycle state. Default 'all'.",
                "enum": ["open", "resolved", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Alert Incident History"
          },
          "behavior": {
