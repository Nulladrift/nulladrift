      "instructions": "This is the public Netmon demo server. It answers with a recorded snapshot of a\nfictional 90-device network across three sites, not a live appliance, so results\nare stable and no argument can reach real infrastructure. Tools that would probe\nthe network on a real appliance (ping, traceroute, port_map, snmp_walk_run) replay\na recorded probe of the demo fleet.\n\nDevice ids worth starting from: 273 (Brain, the firewall), 272 (Pinky, a Windows\nagent host), 8 (Yakko, a switch), 10 (Dot, a NAS), 17 (Wakko, a hypervisor).\nTry overwatch_summary first, then device_get, syslog_search or eve_search.\n\nA real appliance serves these same tools over OAuth 2.1 at https://<appliance>/mcp.\nSee https://netmon.com/mcp-server/.",
      "tools": [
        {
          "name": "agent_disk_usage",
          "description": "Path-scoped folder-tree disk usage report from a Netmon agent — the 'D: drive is at 95%, what's eating it?' question. Wraps POST /api/getFolderUsageFromPath which RPCs into the agent's GETFOLDERUSAGEPATH command and returns the immediate-children size breakdown for the given path.\n\nRequired parameters: device_id (the agent-enrolled device) and path (a Windows path on that device, e.g. \"D:\\\\\" or \"C:\\\\Users\"). Backslashes must be escaped in JSON strings — the LLM should pass \"D:\\\\\" not \"D:\\\".\n\nDrill-down pattern: start at the drive root, identify the largest child, recurse with that child as the new path. The agent does not produce a recursive tree in one shot — that's a deliberate latency cap.\n\nRead-only by design. The agent's write paths (DELETEFILE, DELETEFOLDER, EXECUTEPS) are on the permanent deny-list at the top of tool_handler.cpp and not wrapped — even a future operator with the broadest possible PAT must not be able to drive deletions or shell exec from an LLM.\n\nLatency: BLOCKING; the upstream endpoint has a 120s timeout. Large folders may take real wall-clock time.\n\nPermission: devices. Windows-only — depends on agent enrollment (see CLAUDE.md agent enrollment section). Linux/macOS hosts have no agent-side equivalent of GETFOLDERUSAGEPATH.\n\nExample: agent_disk_usage({device_id: 42, path: \"D:\\\\Users\"})",
          "inputSchema": {
            "properties": {
              "device_id": {
                "description": "Agent-enrolled device id.",
                "type": "integer"
              },
              "path": {
                "description": "Windows path on the device, e.g. \"D:\\\\\" or \"C:\\\\Users\". Backslashes must be JSON-escaped.",
                "type": "string"
              }
            },
            "required": ["device_id", "path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Browse Agent Disk Usage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d78e9aa663fe1290d8ae40c48dc2f4cabcb4769e3e214a89ed8e0235d34cca02"
        },
        {
          "name": "agent_processes",
          "description": "List running processes on an agent-managed device — live read via the agent tunnel. Wraps POST /api/getDeviceProcesses (permission: devices).\n\nReturns rows as reported by GETPS: (process id, name, parent, memory, etc. — exact shape depends on the agent version).\n\nCommon diagnostic patterns: pair with agent_services to answer 'is the SQL Server service running but stuck?'; correlate top memory/cpu processes with eventlog_search criticals.\n\nRead-only by design — the process-kill endpoint (KILLPS) is deliberately NOT exposed via mcpmond. Server-side timeout is 60s; expect 400 if the device is offline or not enrolled.\n\nExample: agent_processes({device_id: 42})",
