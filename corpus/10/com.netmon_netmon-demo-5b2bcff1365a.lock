        {
          "name": "top_bandwidth",
          "description": "Top NetFlow conversations over the last N minutes — the 'who's eating bandwidth right now?' question. Wraps GET /api/getTopBandwidth/{mins}, the same query that powers the dashboard live widget.\n\nUse this for short-window 'right now' inquiries. For longer windows (hours-to-days) or filtered top-talkers, use netflow_search instead — that tool has the rich filter set; this one is the live snapshot.\n\nServer-side cap: top 20 conversations by in-window bytes descending. We don't expose `top_n` — the upstream endpoint hardcodes the limit and there's no value in lying about that to the LLM.\n\nEach row: {src_host, src_id, src_ip, dst_host, dst_id, dst_ip, bytes, bps}. Hostnames come from the _dns view (PTR + custom overrides); src_id/dst_id are populated when the IP matches a monitored device. bytes is the conversation's in-window share (pro-rated), and bps is averaged across the window — not a live rate.\n\nPermission: vne. Examples:\n  top_bandwidth({minutes: 5})\n  top_bandwidth({minutes: 60})",
          "inputSchema": {
            "properties": {
              "minutes": {
                "description": "Lookback window in minutes (1-1440 / 24h). Default 5. Matched by OVERLAP across the raw and aggregated flow tables with bytes pro-rated to the window, so long lookbacks are honest — not capped by the ~15-minute raw horizon.",
                "maximum": 1440,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Top Bandwidth Talkers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f629954cbfbd5516b789d7e4c3589fa7c67800f77fa451522b97359ab9c362dd"
        },
        {
          "name": "traceroute",
          "description": "Traceroute to a target from the Netmon server. Wraps POST /api/getTracerouteInfo/{target} (permission: tools).\n\nThe probe runs ON the netmon server — hops reflect the path FROM netmon TO the target, not from wherever mcpmond is running. Server runs `traceroute --mtu -m 10 -q 2 -w 1` so you get up to 10 hops with MTU discovery; longer paths get truncated. PTR lookups happen server-side.\n\nReturns rows of {hop, address, latency (ms or null on timeout), hostname, mtu (or null)}.\n\nExample: traceroute({target: \"1.1.1.1\"})",
          "inputSchema": {
            "properties": {
              "target": {
                "description": "IP address or hostname to trace.",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Run Traceroute"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:976b69fc7e001dc60d0b32005da0a813cabe3c44ec8582705f7ad70cb99b32c6"
