        {
          "name": "arp_table",
          "description": "Lists hosts observed on the local LAN(s) via the ARP table — the 'what devices have we seen recently?' question. Wraps POST /api/getArpTable, which collapses arptable + _dns into one row per IP with hostname + monitored-device id resolution attached.\n\nDistinct from `arp_lookup` (single-IP MAC resolution at the current moment): this is the historical view over the last N hours. Use it for 'who's on the LAN today' / 'is there a new device' / 'where did this IP last appear' questions.\n\nEach row: {id, ip, mac, timestamp, hostname, device_id}. device_id is non-null when the IP corresponds to a monitored Netmon device; hostname comes from _dns (PTR + custom overrides). Rows are deduped by IP — only the latest seen entry per IP within the window is returned.\n\nPermission: devices. Tag-scoping is NOT applied here — ARP is subnet-level, not device-level, so it doesn't have a tag anchor. Operators see the whole LAN regardless of tag scope.\n\nExamples:\n  arp_table({})                       // last 24h, no filter\n  arp_table({hours: 1, search: \"10.0.0\"})\n  arp_table({search: \"laptop\"})",
          "inputSchema": {
            "properties": {
              "hours": {
                "description": "Lookback hours (1-168). Default 24.",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Substring (server-side ILIKE) on ip / mac / hostname. Empty matches all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get ARP Table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55d6a003914c1119c742bfa4d6f2711fedffc5e4485b1468c9cdabd479c35011"
        },
        {
          "name": "capture_get",
          "description": "Read-only single-capture detail. Wraps GET /api/captures/{id}. If the capture is still active (status=starting|running) the upstream endpoint refreshes status from netmond's IPC before responding, so packets/bytes counters are live.\n\nReturns the same row shape as capture_list rows, plus freshly-refreshed counters when applicable.\n\nRead-only is deliberate. capture_stop / capture_delete / capture_download are NOT wrapped. The chunks endpoint (GET /api/captures/{id}/chunks) is also not wrapped — pcapng bytes are an extcap-shaped payload, not an LLM-shaped one.\n\nPermission: capture. Example:\n  capture_get({id: 17})",
