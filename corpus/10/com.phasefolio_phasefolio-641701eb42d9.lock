        {
          "name": "get_methodology",
          "description": "Fetch a PhaseFolio methodology section's full content (rNPV model, backtest, PoS calibration, IRA framework, development paths, deal-term modelling, holding valuation, clinical stage normalization, evidence standards, network benchmarks, COGS benchmark, SG&A benchmark, tax benchmark, SEC EDGAR deal-term extraction). Designed for citation: each section has a stable URL and a methodology version identifier you can reference in analysis output.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "section": {
                "description": "Which methodology section to fetch. 'rnpv' covers the core risk-adjusted NPV calculation: cumulative PoS, midpoint-discounted risk-adjusted development costs, the S-curve ramp/plateau/LOE revenue lifecycle net of COGS/SG&A/tax, WACC discounting, the rNPV and Unadjusted-NPV equations, Monte Carlo / expected NPV, and one-at-a-time sensitivity; 'backtest' covers the validation methodology and AUC/CI numbers; 'pos-calibration' covers the indication × modality × biomarker matrix, expanded modality normalization into the eight benchmark baselines, the scored multipliers including the model 2.6.0 biomarker_quality drug-specific multiplier (oncology solid tumor, Phase II/III), the Phase 1 ORR extracted-but-not-scored signal with its Phase 0 governance disclosure, and the non-scored drug-specific risk flags; 'ira-framework' covers the Year-9/Year-13 MFP cliff modeling and the separate IRA classification for expanded modalities such as RNA Therapeutics, Protein Degrader, Radioligand, Oncolytic Virus, and Cancer Vaccine; 'development-paths' covers development-path tiers, automatic-effect policy, and the no path-based PoS/default-multiplier rule; 'deal-term-modelling' covers how licensing deal terms map onto a scenario's deal structure (term-model mapping v1): what is modelled, not modelled and refused, the territory restriction and the approximations it names, milestone timing at stage ends, the cost-share rule, and the non-USD conversion-rate refusal; 'holding-valuation' covers how a Workspace holding is valued (scenario, share of asset value, look-through estimate, cost, not valued): each method's inputs, reason codes and completeness, the totals rules (never added across bases or currencies, estimates left out by default) and what the look-through estimate ignores; 'stage-normalization' covers exact clinical labels, work packages, canonical PoS gates, and the no label-only PoS modifier rule for Phase 1b/2a/2b, adaptive, pivotal, expansion, platform, bridging, and related labels; 'evidence-standards' covers source tiers and freshness rules; 'network-benchmarks' covers anonymization and cohort cuts; 'cogs-benchmark' covers the per-modality COGS% default bands and price-sensitivity methodology; 'sga-benchmark' covers the per-commercial-model SG&A% default bands (orphan/specialty/primary-care); 'tax-benchmark' covers the US-statutory-21% default tax rate, effective-rate reality, and the NOL cap; 'sec-deal-terms' is the retirement notice for the SEC EDGAR deal-term source (retired 2026-09-27), with its frozen versions.",
                "enum": ["rnpv", "backtest", "pos-calibration", "ira-framework", "development-paths", "deal-term-modelling", "holding-valuation", "stage-normalization", "evidence-standards", "network-benchmarks", "cogs-benchmark", "sga-benchmark", "tax-benchmark", "sec-deal-terms"],
                "type": "string"
              }
            },
            "required": ["section"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Canonical PhaseFolio envelope. Substantive payload is in `data`.",
            "properties": {
              "data": {
                "additionalProperties": {},
                "properties": {
                  "citation_url": {
                    "description": "Public canonical URL — cite this in analysis output.",
                    "type": "string"
                  },
                  "last_updated": {
                    "description": "ISO 8601 date of the last meaningful edit.",
                    "type": "string"
                  },
                  "section_id": {
                    "description": "Stable section identifier — reuse as the citation key.",
                    "enum": ["rnpv", "backtest", "pos-calibration", "ira-framework", "development-paths", "deal-term-modelling", "holding-valuation", "evidence-standards", "network-benchmarks", "cogs-benchmark", "sga-benchmark", "tax-benchmark", "sec-deal-terms"],
                    "type": "string"
                  },
                  "summary": {
                    "description": "Short summary suitable for inline quoting (≤500 chars).",
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "version": {
                    "description": "Versioned identifier for this section's content, e.g. 'methodology@2026-04'.",
                    "type": "string"
                  }
                },
                "required": ["citation_url", "section_id", "summary", "title", "version"],
                "type": "object"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Methodology Section"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7746efa68579d6c52328767e571fa5605642e3e012f8eef6831b65170ef8d98f"
        },
