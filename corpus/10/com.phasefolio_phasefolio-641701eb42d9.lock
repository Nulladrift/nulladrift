        {
          "name": "query_benchmarks",
          "description": "Query PhaseFolio benchmark availability. Source-backed PoS benchmarks are available separately; network cost distributions and duration percentiles are planned but currently return coming_soon with null estimates rather than PhaseFolio's manual planning defaults.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "indication": {
                "description": "Indication name (e.g. 'NSCLC', 'Rheumatoid Arthritis', 'Atopic Dermatitis'). Free-form; the model fuzz-matches to the canonical indication taxonomy.",
                "type": "string"
              },
              "metric": {
                "description": "Which benchmark family to request. Cost and duration network benchmarks are currently coming_soon and return no estimate; manual wizard defaults are not returned as benchmarks.",
                "enum": ["pos", "cost", "duration", "all"],
                "type": "string"
              },
              "modality": {
                "description": "Optional modality filter ('Antibody', 'Small Molecule', 'Cell Therapy', 'Gene Therapy', etc.). Omit to return cross-modality stats.",
                "type": "string"
              }
            },
            "required": ["indication", "metric"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Canonical PhaseFolio envelope. Substantive payload is in `data`.",
            "properties": {
              "data": {
                "additionalProperties": false,
                "description": "L1 (no-auth) returns a versioned headline set; L3 (bearer) will return granular slices once enough orgs are on the network.",
                "properties": {
                  "available_metrics": {
                    "description": "Network benchmark metric families with published numeric estimates.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "coming_soon": {
                    "description": "Set when this metric family hasn't published yet; explains when it will.",
                    "type": "string"
                  },
                  "headlines": {
                    "description": "Headline aggregates returned at the public tier.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "metric": {
                          "description": "Metric name, e.g. 'Phase II RA trial cost (median, USD M)'.",
                          "type": "string"
                        },
                        "n": {
                          "anyOf": [
                            {
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Sample size behind the value; null when status='coming_soon'."
                        },
                        "status": {
                          "description": "Status, e.g. 'live' or 'coming_soon'.",
                          "type": "string"
                        },
                        "value": {
                          "anyOf": [
                            {
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Numeric value; null when status='coming_soon'."
                        }
                      },
                      "required": ["metric", "n", "status", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "methodology_url": {
                    "description": "Path to the methodology section that explains how these were computed.",
                    "type": "string"
                  },
                  "note": {
                    "description": "Plain-language benchmark-availability and provenance note.",
                    "type": "string"
                  },
                  "planning_defaults_excluded": {
                    "description": "True when manual PhaseFolio planning defaults are intentionally excluded.",
                    "type": "boolean"
                  },
                  "version": {
                    "description": "Stable version identifier of this benchmark snapshot, e.g. 'preview-2026-04'.",
                    "type": "string"
                  }
                },
                "required": ["available_metrics", "methodology_url", "note", "planning_defaults_excluded", "version"],
                "type": "object"
              }
            },
            "required": ["data"],
            "type": "object"
