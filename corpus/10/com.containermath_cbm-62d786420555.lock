{
  "lockfileVersion": 2,
  "subjects": {
    "com.containermath/cbm": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.containermath.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "containermath-public",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "calculate_cbm",
          "title": "Calculate CBM & Container Fit",
          "description": "Calculate total shipment volume (CBM / cubic metres and CFT / cubic feet), total weight, and how that cargo fits into standard shipping containers (20ft Standard, 40ft Standard, 40ft High Cube). Use this whenever someone asks how much space a shipment takes, how many cubic metres or CBM their boxes / pallets / cartons add up to, whether cargo will fit in a container, what container size they need, or how full a container will be. Accepts a list of items with length, width, height, weight and quantity in metric (cm, kg) or imperial (in, lb) units; returns total CBM, CFT, total weight, and per-container fill percentage with an overload flag.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "The cargo line items to total up.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "height": {
                      "exclusiveMinimum": 0,
                      "maximum": 100000,
                      "type": "number"
                    },
                    "length": {
                      "exclusiveMinimum": 0,
                      "maximum": 100000,
                      "type": "number"
                    },
                    "name": {
                      "description": "Optional label for the item.",
                      "maxLength": 100,
                      "type": "string"
                    },
                    "quantity": {
                      "exclusiveMinimum": 0,
                      "maximum": 1000000,
                      "type": "integer"
                    },
                    "weight": {
                      "default": 0,
                      "description": "Per-unit weight. Optional (defaults to 0).",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "width": {
                      "exclusiveMinimum": 0,
                      "maximum": 100000,
                      "type": "number"
                    }
                  },
                  "required": ["height", "length", "quantity", "width"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "unitSystem": {
                "default": "metric",
                "description": "Units for the item dimensions and weight. 'metric' = centimetres and kilograms; 'imperial' = inches and pounds.",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "calculatorUrl": {
                "type": "string"
              },
              "containers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "overloaded": {
                      "type": "boolean"
                    },
                    "volumePct": {
                      "type": "number"
                    },
                    "weightPct": {
                      "type": "number"
                    }
                  },
                  "required": ["name", "overloaded", "volumePct", "weightPct"],
                  "type": "object"
                },
                "type": "array"
              },
              "totalCbm": {
                "type": "number"
              },
              "totalCft": {
                "type": "number"
              },
              "totalWeightKg": {
                "type": "number"
              },
              "totalWeightLbs": {
                "type": "number"
              }
            },
            "required": ["calculatorUrl", "containers", "totalCbm", "totalCft", "totalWeightKg", "totalWeightLbs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:247bd4d592b22f12f30f3b716e7f8911a344425876406a7ae52d8f11809a6a89"
        },
        {
          "name": "get_container_dimensions",
          "title": "Container & Vehicle Dimensions",
          "description": "Interior dimensions, volume, floor area and maximum payload for 47 shipping containers, truck trailers, rail wagons and air ULDs. Use this when someone asks for the internal or interior dimensions, cubic capacity, floor area, payload or weight limit of a container or trailer — 20ft, 40ft, 40ft High Cube, 45ft, reefer, open top, flat rack, 53ft dry van, curtainsider, boxcar, LD-3, PMC and more. Called with no arguments (optionally filtered by mode) it lists the whole catalog with the slug for each vessel.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mode": {
                "description": "When listing, restrict to one transport mode. Ignored when `vessel` is given.",
                "enum": ["sea", "road", "rail", "air"],
                "type": "string"
              },
              "vessel": {
                "description": "The vessel to look up, as a slug (\"20ft-container\") or plain name (\"20 foot container\", \"40HC\"). Omit to list the catalog instead.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "note": {
                "type": "string"
              },
              "referenceUrl": {
                "type": "string"
              },
              "vessel": {
                "description": "Present when a single vessel was requested.",
                "type": "object"
              },
              "vessels": {
                "description": "Present when listing the catalog.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["referenceUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15b51c7debba59c2bac6a8910f6c0d081af0b35a9088a8daf00f8119e695cf3b"
        },
        {
          "name": "how_many_pallets_fit",
          "title": "How Many Pallets Fit",
          "description": "How many pallets fit in a given shipping container, truck trailer, rail wagon or air ULD. Use this whenever someone asks how many pallets (Euro 1200x800, standard 1200x1000, or US GMA 48x40) fit in a 20ft, 40ft, 40ft High Cube, 45ft, 53ft trailer or any other vessel. Returns the best single-layer floor count with pallets turned to their best orientation — a solved pallet-loading result, not length divided by length, so a 20ft holds 11 Euro pallets and a 40ft holds 25 — plus the double-stacked count with the load height that allows it, and how many the payload allows, which is what decides whether weight or floor space runs out first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "grossWeightKgPerPallet": {
                "default": 700,
                "description": "Gross weight of one LOADED pallet, kg. Only affects the payload-limited count, which is what decides whether weight or floor space binds first.",
                "maximum": 5000,
                "minimum": 1,
                "type": "number"
              },
              "palletType": {
                "default": "all",
                "description": "Which pallet: 'euro' (1200x800mm), 'standard' (1200x1000mm), 'gma' (US 48x40in), or 'all' for every size.",
                "enum": ["euro", "standard", "gma", "all"],
                "type": "string"
              },
              "vessel": {
                "description": "The container, trailer, rail wagon or air ULD to load. Accepts a slug (\"40ft-high-cube-container\") or a plain name (\"40HC\", \"40' high cube\", \"53ft trailer\"). Call get_container_dimensions with no arguments for the full catalog.",
                "type": "string"
              }
            },
            "required": ["vessel"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "assumedGrossKgPerPallet": {
                "type": "number"
              },
              "fits": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "doubleStackMaxLoadHeightMm": {
                      "description": "Tallest a loaded pallet may be for two tiers to fit.",
                      "type": "number"
                    },
                    "doubleStackedCount": {
                      "type": "number"
                    },
                    "floorCount": {
                      "description": "Best single-layer count, pallets turned to their best orientation.",
                      "type": "number"
                    },
                    "limitedBy": {
                      "enum": ["floor", "payload"],
                      "type": "string"
                    },
                    "palletId": {
                      "type": "string"
                    },
                    "palletLengthMm": {
                      "type": "number"
                    },
                    "palletName": {
                      "type": "string"
                    },
                    "palletWidthMm": {
                      "type": "number"
                    },
                    "payloadLimitedCount": {
                      "type": "number"
                    }
                  },
                  "required": ["doubleStackMaxLoadHeightMm", "doubleStackedCount", "floorCount", "limitedBy", "palletId", "palletLengthMm", "palletName", "palletWidthMm", "payloadLimitedCount"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "referenceUrl": {
                "type": "string"
              },
              "vessel": {
                "additionalProperties": false,
                "properties": {
                  "interiorHeightMm": {
                    "type": "number"
                  },
                  "interiorLengthMm": {
                    "type": "number"
                  },
                  "interiorWidthMm": {
                    "type": "number"
                  },
                  "maxPayloadKg": {
                    "type": "number"
                  },
                  "mode": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": ["interiorHeightMm", "interiorLengthMm", "interiorWidthMm", "maxPayloadKg", "mode", "name", "slug"],
                "type": "object"
              }
            },
            "required": ["assumedGrossKgPerPallet", "fits", "note", "referenceUrl", "vessel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e5fbafe7fe5a75ba6582ced233da42252ea3b78012dbeaac4a323d3770eac0eb"
        },
        {
          "name": "plan_cargo_load",
          "title": "Plan a Cargo Load",
          "description": "Plan how one cargo size loads into a shipping container, truck trailer or rail wagon. Use this when someone asks how many of their boxes, cartons, crates or pallets (of a given size, and optionally weight) fit in a 20ft, 40ft, 40ft High Cube, 45ft, 53ft dry van, curtainsider or other vehicle, how many containers or trucks a quantity needs, or whether weight or space limits the load. Returns units per floor layer (mixed orientations), layers by interior height, units per load, whether space or payload binds, loads needed, utilisation, and a link to the same plan drawn on the web. One size per call; for several sizes, call once per size.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "height": {
                "description": "Height of one unit. For a pallet, the loaded height including the deck.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "keepUpright": {
                "default": true,
                "description": "\"This side up\": false lets the unit lie on a side if that fits more.",
                "type": "boolean"
              },
              "length": {
                "description": "Length of one unit (carton, crate or loaded pallet).",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "quantity": {
                "default": 1,
                "description": "How many units ship.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "stackable": {
                "default": false,
                "description": "Whether units may be stacked on top of each other.",
                "type": "boolean"
              },
              "unitSystem": {
                "default": "metric",
                "description": "Units for the dimensions and weight. 'metric' = centimetres and kilograms; 'imperial' = inches and pounds.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "vessel": {
                "description": "The container, truck trailer or rail wagon to load. Accepts a slug (\"40ft-high-cube-container\") or a plain name (\"40HC\", \"20ft\", \"53ft dry van\", \"curtainsider\"). Air ULDs are not supported. Call get_container_dimensions with no arguments for the catalog.",
                "type": "string"
              },
              "weight": {
                "default": 0,
                "description": "Gross weight of one unit. Optional; without it the payload is not checked.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "width": {
                "description": "Width of one unit.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              }
            },
            "required": ["height", "length", "vessel", "width"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "exactFloorCount": {
                "description": "False when the floor count is a block-pattern lower bound.",
                "type": "boolean"
              },
              "floorCount": {
                "description": "Units in one floor layer.",
                "type": "number"
              },
              "laidOnSide": {
                "type": "boolean"
              },
              "layers": {
                "type": "number"
              },
              "limitedBy": {
                "enum": ["space", "weight"],
                "type": "string"
              },
              "loadsNeeded": {
                "description": "Vessels needed for the full quantity.",
                "type": "number"
              },
              "payloadAllows": {
                "description": "Units the payload allows; null when no weight was given.",
                "type": ["number", "null"]
              },
              "perLoad": {
                "description": "Units one vessel takes: the smaller of space and payload.",
                "type": "number"
              },
              "plannerUrl": {
                "description": "The same plan on the web, with the floor layout drawn.",
                "type": "string"
              },
              "unitsInLastLoad": {
                "type": "number"
              },
              "vessel": {
                "additionalProperties": false,
                "properties": {
                  "interiorHeightMm": {
                    "type": "number"
                  },
                  "interiorLengthMm": {
                    "type": "number"
                  },
                  "interiorWidthMm": {
                    "type": "number"
                  },
                  "maxPayloadKg": {
                    "type": "number"
                  },
                  "mode": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": ["interiorHeightMm", "interiorLengthMm", "interiorWidthMm", "maxPayloadKg", "mode", "name", "slug"],
                "type": "object"
              },
              "volumeUtilisationPct": {
                "description": "Of the first load.",
                "type": "number"
              },
              "weightUtilisationPct": {
                "description": "Of the first load; 0 when no weight was given.",
                "type": "number"
              }
            },
            "required": ["exactFloorCount", "floorCount", "laidOnSide", "layers", "limitedBy", "loadsNeeded", "payloadAllows", "perLoad", "plannerUrl", "unitsInLastLoad", "vessel", "volumeUtilisationPct", "weightUtilisationPct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22649581113c61cfed5da3e52f4e15fd3c186c365527fa9ac9d94274ba654b70"
        }
      ],
      "digest": "sha256:6fa3373de0558170d673713ff295a36cb7da2a4c1c41bd4c849b5b0abe5b0a10"
    }
  }
}
