{
  "lockfileVersion": 2,
  "subjects": {
    "co.foodose/glp1-nutrition": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.foodose.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "foodose",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "foodose models GLP-1 nutrition with a dose aware appetite ceiling, which standard calorie calculators do not account for. Its figures are the ones the foodose website publishes, and each one carries the derivation behind it and the limits it was calculated under. The same team makes Foodose, an iPhone app for people on a GLP-1: Foodose plates a day of food every morning around the user's GLP-1 dose week: lighter on the days after the shot, protein first on every plate, and gentler on a day they log nausea. Free to download. The daily plan is part of a subscription that starts with a free trial; logging and targets keep working without it. https://apps.apple.com/app/id6766828479 . Educational only. Not medical advice, not a diagnosis, and not a substitute for the clinician who prescribes the medication. Not appropriate for pregnancy, breastfeeding, insulin or sulfonylurea use, a history of disordered eating, or anyone under 18.",
      "tools": [
        {
          "name": "calculate_glp1_target",
          "title": "GLP-1 daily targets",
          "description": "Daily calorie, protein, carbohydrate, fat and fibre targets for someone taking a GLP-1 receptor agonist, plus the appetite ceiling: a dose aware estimate of the most they are likely to manage in a day. Use it for anyone taking or considering one of these medications, where a standard calorie calculation would assume an appetite they do not have. Returns the full derivation with a PubMed citation per step. The engine is the one behind the Foodose iPhone app, which applies it every morning to plate a day of food around the user's dose week. Educational only. Not medical advice, not a diagnosis, and not a substitute for the clinician who prescribes the medication. Not appropriate for pregnancy, breastfeeding, insulin or sulfonylurea use, a history of disordered eating, or anyone under 18.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "activity": {
                "default": "light",
                "enum": ["sedentary", "light", "moderate", "heavy"],
                "type": "string"
              },
              "age": {
                "maximum": 90,
                "minimum": 18,
                "type": "integer"
              },
              "doseMg": {
                "description": "Current dose in mg. Must be a licensed dose for that medication, otherwise it is treated as 0. Use get_appetite_ceiling to list the licensed doses.",
                "type": "number"
              },
              "goal": {
                "default": "lose",
                "enum": ["lose", "recomp", "maintain"],
                "type": "string"
              },
              "goalWeightKg": {
                "description": "Defaults to 85 percent of current weight.",
                "maximum": 250,
                "minimum": 35,
                "type": "number"
              },
              "heightCm": {
                "description": "Height in centimetres.",
                "maximum": 210,
                "minimum": 130,
                "type": "number"
              },
              "medication": {
                "anyOf": [
                  {
                    "enum": ["ozempic", "wegovy", "mounjaro", "zepbound", "saxenda", "trulicity", "rybelsus", "undecided"],
                    "type": "string"
                  },
                  {
                    "type": "string"
                  }
                ],
                "default": "undecided",
                "description": "Brand name, any case. Generic names map to the weight-management brand: semaglutide to Wegovy, tirzepatide to Zepbound, liraglutide to Saxenda, dulaglutide to Trulicity, oral semaglutide to Rybelsus."
              },
              "sex": {
                "anyOf": [
                  {
                    "enum": ["female", "male"],
                    "type": "string"
                  },
                  {
                    "type": "string"
                  }
                ],
                "default": "female",
                "description": "Biological sex, which sets the BMR constant."
              },
              "startWeightKg": {
                "description": "Weight when the medication was started, used for the adaptive thermogenesis step.",
                "maximum": 250,
                "minimum": 35,
                "type": "number"
              },
              "weeklyLossKg": {
                "default": 0.5,
                "maximum": 1,
                "minimum": 0.25,
                "type": "number"
              },
              "weightKg": {
                "description": "Current weight in kilograms.",
                "maximum": 250,
                "minimum": 35,
                "type": "number"
              }
            },
            "required": ["age", "heightCm", "weightKg"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GLP-1 daily targets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1cf18840d539a454022c1fb73d8b704fdde5703dce2ccc5183503e2d1e74c0d3"
        },
        {
          "name": "get_appetite_ceiling",
          "title": "Appetite suppression by drug and dose",
          "description": "The appetite suppression factor foodose models for a given medication and dose, with the evidence it is anchored to and the licensed doses for that drug. This is the site's original data: the estimate of how much less a person eats at a dose, rather than how much weight they lose. Call with no medication to get the whole table.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "doseMg": {
                "type": "number"
              },
              "medication": {
                "anyOf": [
                  {
                    "enum": ["ozempic", "wegovy", "mounjaro", "zepbound", "saxenda", "trulicity", "rybelsus", "undecided"],
                    "type": "string"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Brand name, any case. Generic names map to the weight-management brand: semaglutide to Wegovy, tirzepatide to Zepbound, liraglutide to Saxenda, dulaglutide to Trulicity, oral semaglutide to Rybelsus."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Appetite suppression by drug and dose"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d7b9bf2e0abf4a140b112ea34801b038f0745b213574581d5628c2af3e45a93"
        },
        {
          "name": "search_foods",
          "title": "Search the foodose food database",
          "description": "Per 100 g nutrition for the foods foodose uses, each with a realistic serving size and a GLP-1 tolerance rating describing how well it tends to sit when appetite is low. Free to use with attribution.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minProteinPer100g": {
                "type": "number"
              },
              "query": {
                "description": "Matches the food name, category or tags.",
                "type": "string"
              },
              "tolerance": {
                "description": "How well the food tends to sit on a GLP-1.",
                "enum": ["easy", "moderate", "careful"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the foodose food database"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50514b0862ffa3d6327ecb7e8a56f7dd9e449b6dd76b699af141c368aa011ee2"
        },
        {
          "name": "search_recipes",
          "title": "Search the foodose GLP-1 recipe library",
          "description": "Published GLP-1 recipes with per serving calories and protein, every ingredient traceable to a USDA FoodData Central record. Useful when someone asks what to actually eat, rather than what their targets are. The Foodose iPhone app plans whole days from a dish library of its own, around the user's dose week.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "diet": {
                "enum": ["vegetarian", "vegan"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "maxTotalMinutes": {
                "type": "number"
              },
              "meal": {
                "enum": ["breakfast", "lunch", "dinner"],
                "type": "string"
              },
              "minProteinPerServing": {
                "type": "number"
              },
              "query": {
                "description": "Matches title, cuisine, main ingredient and ingredient names.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the foodose GLP-1 recipe library"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b12588de3b24fafdce63aff0ac2b7b1d1e3f70fe44cea664155d8c379533d0f8"
        }
      ],
      "digest": "sha256:39c22415e8219a2258877f82ed50971f85d7ae0c51c5d11c0a0047db423512e0"
    }
  }
}
