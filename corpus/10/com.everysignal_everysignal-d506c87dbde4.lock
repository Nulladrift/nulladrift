        {
          "name": "analyze_competitors",
          "title": "Competitor comparison",
          "description": "Your company next to up to 5 named competitors: positioning, offers, funnel, ads and tracking stack, side by side, from fresh public scans and our own records of those companies, with what to change first. Compares against: fresh public scans of each company, plus our records only where that company is the subject. Returns a verdict, a score, ranked fixes and at most 3 short reference quotes with record ids; the library itself is never returned. Uses 150 credits ($15.00) plus 100 ($10.00) per competitor, refunded if it fails. Runs 5-20 minutes and returns a job id.",
