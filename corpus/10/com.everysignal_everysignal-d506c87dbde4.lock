      },
      "instructions": "Every Signal compares YOUR marketing with a library of teardowns of real companies and measured conversion rates. Use the analyze tools on your own asset or a named company: analyze_copy, analyze_email, analyze_landing_page, analyze_funnel, analyze_ads, analyze_ad_stack, analyze_growth, analyze_company, analyze_competitors, and compare_benchmark for one rate. Not sure which? Call plan with the goal and/or URL first (free). Questions about the library: ask (3 credits, cited). Each returns a verdict, a score, fixes and record ids; the library itself is never returned. intelligence_index lists what the library covers. kb_* tools return brief outlines, short excerpts and benchmark bands (capped per day). Figures carry an evidence tag: verified, estimate, inferred or rumour.",
      "tools": [
        {
          "name": "analyze_ad_stack",
          "title": "Ad and tracking stack analysis",
          "description": "Scans a site's analytics, ad pixels and attribution tools (or takes your list) and compares them with the stacks of the leaders in your sector: what they all run that you lack, and what you can drop. Compares against: tracking_stack records of the sector's leaders: analytics, ad pixels, attribution, email, payments. Returns a verdict, a score, ranked fixes and at most 3 short reference quotes with record ids; the library itself is never returned. Uses 50 credits ($5.00), refunded if it fails. Runs 1-5 minutes and returns a job id.",
          "inputSchema": {
            "properties": {
              "sector": {
                "description": "KB sector key if known",
                "type": "string"
              },
              "trackers": {
                "description": "Or your tools as a list (no scan)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "Public URL or domain to scan",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ad and tracking stack analysis"
          },
