      "instructions": "Every Signal audits marketing against teardowns of real companies and measured conversion rates. audit_work and the analyze, audit and report tools return findings with knowledge-base record ids; kb_* tools return sector briefs, playbooks, real copy and measured rates. Figures carry an evidence tag: verified, estimate, inferred or rumour.",
      "tools": [
        {
          "name": "analyze_ads",
          "title": "Ad creative analysis",
          "description": "Scores up to 10 ad creatives (public image URLs and/or ad text), or a brand's live Meta ads, against real companies' ad patterns. Returns fixes per creative and new hooks. Uses 150 credits ($15). Runs 1-6 minutes and returns a job id.",
          "inputSchema": {
            "properties": {
              "ad_texts": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "brand": {
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "goal": {
                "type": "string"
              },
              "image_urls": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sector": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ad creative analysis"
          },
