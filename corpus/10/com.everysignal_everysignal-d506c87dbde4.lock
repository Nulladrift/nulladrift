        },
        {
          "name": "analyze_landing_page",
          "title": "Landing page analysis",
          "description": "Analyzes one public page: tech stack and pixels, copy, speed and funnel signals, compared with how real companies in its sector sell. Returns ranked fixes and a hero rewrite. Uses 100 credits ($10). Runs 3-6 minutes and returns a job id.",
