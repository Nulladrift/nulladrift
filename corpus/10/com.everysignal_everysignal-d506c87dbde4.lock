        {
          "name": "analyze_funnel",
          "title": "Funnel analysis",
          "description": "Your funnel, from landing page to signup to paywall or checkout, compared step by step with how real companies in your sector convert, with conversion-rate bands and ranked fixes. Compares against: conversion_funnel, subscription_funnel and free-trial records of the sector, plus conversion-rate bands (aggregates). Returns a verdict, a score, ranked fixes and at most 3 short reference quotes with record ids; the library itself is never returned. Uses 50 credits ($5.00), refunded if it fails. Returns the result within about 55 seconds, or a job id if it takes longer.",
