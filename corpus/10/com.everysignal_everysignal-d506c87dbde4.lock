        {
          "name": "analyze_copy",
          "title": "Copy analysis",
          "description": "Send copy, a landing page, an email, an ad or a funnel your AI wrote. Get an evidence-based critique scored against Every Signal teardowns and measured conversion rates, a rewrite, and the record ids behind every claim. Compares against: hooks, angles and claims, homepage and lander copy, and the sector playbook. Returns a verdict, a score, ranked fixes and at most 3 short reference quotes with record ids; the library itself is never returned. Uses 30 credits ($3.00), refunded if it fails. Returns the result within about 55 seconds, or a job id if it takes longer. (Old name: audit_work.)",
          "inputSchema": {
            "properties": {
              "audience": {
                "type": "string"
              },
              "content": {
                "description": "The text to analyze (or give url)",
                "type": "string"
              },
              "goal": {
