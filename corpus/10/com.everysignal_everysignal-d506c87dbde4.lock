            "properties": {
              "contribute": {
                "description": "Add your step rates anonymously to the benchmarks (opt-in; rounded; sample 100+)",
                "type": "boolean"
              },
              "goal": {
                "type": "string"
              },
              "model": {
                "enum": ["subscription", "free_trial", "freemium", "lead", "ecommerce", "app", "other"],
                "type": "string"
              },
              "sector": {
                "description": "KB sector key if known",
                "type": "string"
              },
              "steps": {
                "description": "Steps in order (landing page, signup, paywall or checkout ...), each a string like 'Pricing page https://acme.com/pricing 12% n=1200 2026-10' or {name, url, rate, n, date}. Rates, sample size and month are optional; steps with a rate also get your percentile against the public aggregate.",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "date": {
                          "description": "YYYY-MM",
                          "type": "string"
