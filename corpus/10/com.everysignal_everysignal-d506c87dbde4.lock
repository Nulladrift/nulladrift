        {
          "name": "audit_work",
          "title": "Audit my AI's work",
          "description": "Audits a piece of marketing (copy, landing page, email, ad, funnel or paywall, as text or a public URL) against Every Signal's teardowns of real companies and measured conversion rates. Returns a verdict, a 0-100 score, findings with the knowledge-base record ids behind them, concrete fixes and a rewrite. Uses 30 credits ($3.00), refunded if it fails. Returns the result within about 55 seconds, or a job id if it takes longer.",
          "inputSchema": {
            "properties": {
              "audience": {
                "type": "string"
              },
              "content": {
                "description": "The text to audit (or give url)",
                "type": "string"
              },
              "goal": {
                "description": "What it must achieve",
                "type": "string"
              },
              "sector": {
                "description": "KB sector key if known (kb_sectors lists them)",
                "type": "string"
              },
              "type": {
                "enum": ["copy", "landing_page", "email", "ad", "funnel", "paywall", "other"],
                "type": "string"
              },
              "url": {
                "description": "Public URL of the page to audit (or give content)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
