  "subjects": {
    "ai.arabickeyboard/name-calligraphy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://arabickeyboard.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "arabic-name-calligraphy",
        "title": "Arabic Name Calligraphy",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use write_name_in_arabic whenever the user wants a name written in Arabic or Arabic calligraphy. Show the Arabic spelling from the tool, do not invent another one. If a part is marked 'by-sound', say the spelling is an approximation and suggest checking with a native speaker before a tattoo.",
      "tools": [
        {
          "name": "write_name_in_arabic",
          "title": "Write a name in Arabic calligraphy",
          "description": "Writes a first name or full name in Arabic script and shows it in six Arabic calligraphy styles (Naskh, Ruqʿah, Kufi, Modern, Bold display, Ornamental) with a PNG download. Use when the user wants their name, or someone else's name, written or drawn in Arabic, Arabic calligraphy, or Arabic letters — for example for a tattoo, gift, card, or wall art. Handles Arabic names (Mohamed, Fatima), French and English names (Charles, Kevin, Chloé) and compound names. Returns the Arabic spelling, the vowelled form, other accepted spellings, the meaning when the name is in the name list, and whether a spelling is written by sound. The result is shown in a widget with the six styles, so keep the reply short and do not reproduce the calligraphy styles in text. Not for translating sentences or general Arabic text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "'fr' when the user writes in French or the name should be read with French pronunciation (Charles → شارل); otherwise 'en'.",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "name": {
                "description": "The name to write, in Latin letters as the user spells it (e.g. 'Sarah', 'Jean-Pierre', 'Mohamed Ali').",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternatives": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "arabic": {
                "type": "string"
              },
              "input": {
                "type": "string"
              },
              "lang": {
                "type": "string"
              },
              "letters": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "match": {
                "enum": ["found", "mixed", "by-sound", "arabic-input", "empty"],
                "type": "string"
              },
              "parts": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "toolUrl": {
                "type": "string"
              },
              "vowelled": {
                "type": "string"
              }
            },
            "required": ["alternatives", "arabic", "input", "lang", "letters", "match", "parts", "toolUrl", "vowelled"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Write a name in Arabic calligraphy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/name-calligraphy-v3.html",
            "openai/toolInvocation/invoked": "Name written in Arabic",
            "openai/toolInvocation/invoking": "Writing the name in Arabic…",
            "ui": {
              "resourceUri": "ui://widget/name-calligraphy-v3.html"
            }
          },
          "digest": "sha256:30a2b8f643db0a6254bde9a44def68daa3094fd9abe7546eee9be05e1fab52a0"
        }
