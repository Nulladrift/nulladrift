        {
          "name": "get_document",
          "title": "Get document",
          "description": "Get one public document card, with its schema.org node, by the id that search_documents returns. A document that does not exist or is not published for this website returns the same not-found answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The document id.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "available": {
                "description": "False when the documents cannot be read now (reasonCode says why); true for every other answer, one with no documents included.",
                "type": "boolean"
              },
              "items": {
                "description": "The documents, each as a card.",
                "items": {
                  "properties": {
                    "card": {
                      "description": "The document's DocumentCard v1: its id, title, summary, file, preview image, page and contact addresses and the rest of the contract (ADR-002). Its id is the id that get_document and get_document_carousel take.",
                      "type": "object"
                    },
                    "links": {
                      "description": "The card's page and contact addresses with the campaign parameters of this surface.",
                      "type": "object"
                    },
                    "matchedFields": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "schemaOrg": {
                      "description": "The card's schema.org node.",
                      "type": "object"
                    },
                    "semanticConfidence": {
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["card", "schemaOrg"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "description": "Why there are no documents, in plain words, when there are none.",
                "type": "string"
              },
              "reasonCode": {
                "description": "A stable code that says why the documents cannot be read, and an empty string when they can.",
                "type": "string"
              },
              "schemaVersion": {
                "description": "The version of the shape of this answer: 1.",
                "type": "integer"
              }
            },
            "required": ["available", "items", "reasonCode", "schemaVersion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57171429ca3075bcab9d9a66a86fdb705aaa8490860401afe6034773fb0d5899"
        },
        {
          "name": "get_document_carousel",
          "title": "Show documents as cards",
          "description": "Use this when a person wants to see documents that search_documents or get_document returned: it shows up to three of them as a carousel of cards, each with the document's title, summary, size, number of pages and preview image, a button that opens the PDF and a link to contact the organisation. Pass the id of each document to show, taken from the id of its card, at most three. A document that is not published for this website is left out, and when none can be shown the answer is the one get_document gives for a document that is not found. Do not use it to find documents: call search_documents for that. A client that does not show cards receives the same answer as text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "description": "The id of each document to show, as search_documents and get_document give it: at most three.",
