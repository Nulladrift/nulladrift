        {
          "name": "get_contact_card",
          "title": "Show contact options as a card",
          "description": "Use this when a person asks how to get in touch with this organisation and would like to see it as a card: it shows the same facts as get_contact_options, which are the address of its contact page, the enquiry routes that page offers, and the email address, telephone number and office hours the site publishes, with a button that opens the contact page. A fact the site does not publish is left out, and hours and routes are stated as the site publishes them, not as a promise of availability or of a response time. Takes no arguments, accepts no personal data and sends nothing: the person completes any enquiry on the contact page themselves. A client that does not show cards receives the same answer as text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "citationGuidance": {
                "type": "string"
              },
              "citationRenderInstruction": {
                "type": "string"
              },
              "contactPage": {
                "properties": {
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "description": "The address of the contact page, the address a person is handed to.",
                    "type": "string"
                  }
                },
                "required": ["url"],
                "type": "object"
              },
              "email": {
                "type": "string"
              },
              "enquiryRoutes": {
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "name": {
                "description": "The name of the organisation.",
                "type": "string"
              },
              "officeHours": {
                "items": {
                  "properties": {
                    "closes": {
                      "type": "string"
                    },
                    "days": {
                      "type": "string"
                    },
                    "opens": {
                      "type": "string"
                    }
                  },
                  "required": ["closes", "days", "opens"],
                  "type": "object"
                },
                "type": "array"
              },
              "schemaVersion": {
                "description": "The version of the shape of this answer: 1.",
                "type": "integer"
              },
              "sourceLinks": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "sourceLinksMarkdown": {
                "type": "string"
              },
              "sources": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "telephone": {
                "type": "string"
              }
            },
            "required": ["schemaVersion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show contact options as a card"
          },
          "behavior": {
