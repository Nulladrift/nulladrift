{
  "lockfileVersion": 2,
  "subjects": {
    "com.proxmint/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://proxmint.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "proxmint",
        "title": "Proxmint",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Proxmint sells residential, premium residential, datacenter and 4G/5G mobile proxies billed per GB: prepaid packs, no subscription, bandwidth that never expires. get_pricing needs no key; get_account, get_usage, generate_proxies, check_connection and fetch_url read the caller's account, read-only, once they sign in or send an API key. Nothing here can buy, pay or change settings. To read a page as a visitor from a given country would, use fetch_url: it goes out through the caller's own proxy and uses their bandwidth. Location targeting and sticky sessions are carried in the proxy username, and generate_proxies builds it. Docs: https://proxmint.com/docs/mcp",
      "tools": [
        {
          "name": "check_connection",
          "title": "Check connection",
          "description": "Send one request through a product's proxy and report the exit IP, the country Cloudflare sees it in, and the time taken. Uses a few kilobytes of the product's bandwidth.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166 alpha-2 country code, e.g. us. Leave every location field empty to use the targeting saved in the dashboard.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "product": {
                "description": "Proxy product",
                "enum": ["datacenter", "residential", "premium-residential", "mobile"],
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check connection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a72f66bb36da72dc855cd1bbc83ab4dac431d9562a65f71d4fa3e04164674409"
        },
        {
          "name": "fetch_url",
          "title": "Fetch a page",
          "description": "Fetch one web page through a product's proxy, so the request leaves from that product's IPs and targeting: status, final URL (up to 5 redirects), title, and the page as readable text or raw HTML, cut at 50,000 characters. Each call gets a new exit IP. Uses the product's bandwidth for the bytes transferred; binary files are not read.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166 alpha-2 country code, e.g. us. Leave every location field empty to use the targeting saved in the dashboard.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "format": {
                "default": "text",
                "description": "text: readable text, with scripts, styles and tags removed. html: the raw markup",
                "enum": ["text", "html"],
                "type": "string"
              },
              "product": {
                "description": "Proxy product",
                "enum": ["datacenter", "residential", "premium-residential", "mobile"],
                "type": "string"
              },
              "url": {
                "description": "The page to fetch: an http or https URL",
                "maxLength": 2048,
                "pattern": "^https?:\\/\\/\\S+$",
                "type": "string"
              }
            },
            "required": ["product", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fetch a page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ede0aa32dd784cf04871bdbceaa4ac8ea0c51765f589f04e93d6ce7c471194e0"
        },
        {
          "name": "generate_proxies",
          "title": "Generate proxy lines",
          "description": "Build proxy lines for one product, with optional location targeting and sticky sessions. Rotating lines get a new IP on every request; each sticky line keeps one IP for sticky_minutes (1-120). The lines include the proxy password.",
          "inputSchema": {
            "properties": {
              "asn": {
                "description": "Carrier or ISP network number (ASN), digits only. Needs country.",
                "pattern": "^\\d{1,10}$",
                "type": "string"
              },
              "city": {
                "description": "City, e.g. newyork. Needs country.",
                "maxLength": 40,
                "type": "string"
              },
              "count": {
                "default": 1,
                "description": "Number of sticky lines, each with its own IP (rotating returns one line)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "country": {
                "description": "ISO 3166 alpha-2 country code, e.g. us. Leave every location field empty to use the targeting saved in the dashboard.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "format": {
                "default": "url",
                "description": "url: protocol://user:pass@host:port. host:port:user:pass: the colon format many tools import",
                "enum": ["url", "host:port:user:pass"],
                "type": "string"
              },
              "product": {
                "description": "Proxy product",
                "enum": ["datacenter", "residential", "premium-residential", "mobile"],
                "type": "string"
              },
              "protocol": {
                "default": "http",
                "description": "http (also carries HTTPS) or socks5",
                "enum": ["http", "socks5"],
                "type": "string"
              },
              "session": {
                "default": "rotating",
                "description": "rotating: a new IP on every request. sticky: each line keeps one IP for sticky_minutes",
                "enum": ["rotating", "sticky"],
                "type": "string"
              },
              "state": {
                "description": "State or region, e.g. california. Needs country.",
                "maxLength": 40,
                "type": "string"
              },
              "sticky_minutes": {
                "default": 30,
                "description": "How long each sticky line keeps its IP",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "zip": {
                "description": "ZIP or postal code. Needs country.",
                "pattern": "^[A-Za-z0-9 -]{3,12}$",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate proxy lines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8efb8c5fe834d62849c5cb0dceca024b12d39f5da5d3df36cac1ce5ffcc45a3"
        },
        {
          "name": "get_account",
          "title": "Account",
          "description": "Wallet balance and every product on the account, with its status, bandwidth used and left, and the proxy host, ports and username. The proxy password is left out.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b88448ad8ac197278dcfd55606c8f3af1553a0bdcf6745d7a3fc460993be14c"
        },
        {
          "name": "get_pricing",
          "title": "Pack prices",
          "description": "Regular Proxmint pack prices for each proxy product: pack size, price and price per GB. Packs are prepaid and never expire. No sign-in needed.",
          "inputSchema": {
            "properties": {
              "product": {
                "description": "Only this product",
                "enum": ["datacenter", "residential", "premium-residential", "mobile"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pack prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7aa473f51f099037bc03bdcc85ca93c9cd31c63858ca4443e376773edc4257e"
        },
        {
          "name": "get_usage",
          "title": "Usage",
          "description": "Bandwidth and requests per product per UTC day, oldest first, with totals per product. Days with no traffic are left out.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "description": "Days back from today, today included (1-90)",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Usage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7774d92e85a4f777a91f3878edc4a2dda69a545e7a79a7717c55d4ec438a6b6"
        }
      ],
      "digest": "sha256:9234d9935bc87a5568ec2c2b24ecb0c9749c76716a2d20eec89f9647afe7f43e"
    }
  }
}
