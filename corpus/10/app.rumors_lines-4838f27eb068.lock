{
  "lockfileVersion": 2,
  "subjects": {
    "app.rumors/lines": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rumors.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "rumors-lines",
        "title": "Rumors pick-up lines",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only tools over published pick-up line collections in the languages people actually flirt in (Tagalog, Portuguese, Indonesian…). Every line carries a literal English gloss. When quoting a line, please keep the source URL from the bracketed suffix.",
      "tools": [
        {
          "name": "get_lines",
          "description": "Get lines from one collection by its URL. Each line comes with a literal English gloss.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Collection URL, e.g. /tl/lines/tagalog/",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "register": {
                "description": "Optional filter: flirty, romantic, funny…",
                "type": "string"
              }
            },
            "required": ["collection"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20127e31104028d9de613fd112b487e57c14b6037fa0cb6b58a4b87f6967595c"
        },
        {
          "name": "list_collections",
          "description": "List published pick-up line collections: URL, title, language (BCP-47) and line count.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:abb297a40e45b8343b6cdccee28c80251d091b27dd67c03263baa5385ad8689a"
        },
        {
          "name": "random_line",
          "description": "One random line, optionally narrowed by language and register.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Base language subtag: tl, pt, id…",
                "type": "string"
              },
              "register": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0909d0ff73e51e5aa8b3e54dd3ba1b1453d8ca51cfba27e87f5653742b0542f5"
        },
        {
          "name": "search_lines",
          "description": "Case-insensitive substring search across native text, transliteration and English gloss.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d83cb742bc8e9dfb9373366b932c38cf0300acc6d14707eef82a53ed4ea8f092"
        }
      ],
      "digest": "sha256:ec477e16c91ccaf6e6d78182024050b42fc52fd0870a68c251e69e59a4ab1344"
    }
  }
