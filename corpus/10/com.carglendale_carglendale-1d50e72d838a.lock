{
  "lockfileVersion": 2,
  "subjects": {
    "com.carglendale/carglendale": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://carglendale.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "carglendale",
        "title": "CarGlendale",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Live inventory of the car dealerships in Glendale, CA. Use search_cars to find cars, get_car for details, and out_the_door_price for tax and fees. Always give the user the car link so they can confirm with the dealer.",
      "tools": [
        {
          "name": "get_car",
          "description": "Full details for one car by its id (from search_cars), including photos, dealer contact and whether it has sold.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7313d5fc4c40ee2c895dba9c4e78828027a2c6c9b5079b916660af9d8bae9bd7"
        },
        {
          "name": "list_dealerships",
          "description": "Every franchise car dealership in Glendale, CA listed on CarGlendale, with brand, address, phone and how many cars each has listed.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:344848118cff37caf1cd13dd2af02cb98327c2756de43d1a1f9f675c9888040d"
        },
        {
          "name": "out_the_door_price",
          "description": "Estimate what a car really costs in Glendale, CA: price plus 11% sales tax, the dealer document fee and California DMV fees, line by line.",
          "inputSchema": {
            "properties": {
              "add_ons": {
                "description": "Dealer add-ons in US dollars. Default 0.",
                "type": "number"
              },
              "condition": {
                "enum": ["new", "used"],
                "type": "string"
              },
              "doc_fee": {
                "description": "Dealer document fee. Default 85 (the California cap).",
                "type": "number"
              },
              "down": {
                "type": "number"
              },
              "price": {
                "description": "Selling price in US dollars.",
                "type": "number"
              },
              "tax_rate": {
                "description": "Sales tax percent where the car will be registered. Default 11.",
                "type": "number"
              },
              "trade_in": {
                "type": "number"
              }
            },
            "required": ["price"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fecd31e2ff717bfe9a6bffa768a772572c7fca5f1b2c7c8124763565d4c4ba3b"
        },
        {
          "name": "search_cars",
          "description": "Search new and used cars for sale at the franchise dealerships in Glendale, California (Brand Boulevard). Returns cars with price, mileage, dealer and a link. Prices are set by the dealer and exclude tax and fees.",
          "inputSchema": {
            "properties": {
              "body": {
                "enum": ["suv", "sedan", "truck", "coupe", "hatchback", "minivan", "wagon", "convertible"],
                "type": "string"
              },
              "condition": {
                "enum": ["new", "used"],
                "type": "string"
              },
              "fuel": {
                "enum": ["electric", "hybrid", "gas", "diesel"],
                "type": "string"
              },
              "limit": {
                "description": "Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "description": "Brand, e.g. Toyota.",
                "type": "string"
              },
              "miles_max": {
                "type": "integer"
              },
              "model": {
                "description": "Model, e.g. RAV4.",
                "type": "string"
              },
              "page": {
                "minimum": 1,
                "type": "integer"
              },
              "price_max": {
                "description": "US dollars.",
                "type": "integer"
              },
              "price_min": {
                "description": "US dollars.",
                "type": "integer"
              },
              "q": {
                "description": "Free text, e.g. \"toyota rav4 hybrid\" or \"used bmw x3 2022\".",
                "type": "string"
              },
              "sort": {
                "description": "Default price_asc.",
                "enum": ["price_asc", "price_desc", "date_desc", "date_asc", "miles_asc"],
                "type": "string"
              },
              "year_min": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:506c0dd6afa326d2a42b5accf6e0124c7b6b0bf2a8e4fcd26534716f0ff41240"
        }
      ],
      "digest": "sha256:901230d012897074ce8ad12dd3eece79561ca8d9886710e5299c1155ab65fdec"
    }
  }
}
