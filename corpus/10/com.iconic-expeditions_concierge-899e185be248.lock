      "tools": [
        {
          "name": "add_activity",
          "title": "Add Activity to Day",
          "description": "Add an activity to a specific day and time slot (morning/afternoon/evening). Optionally link to a content item using its type and id. Requires a bearer token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "day_id": {
                "description": "The day UUID to add the activity to",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "duration_minutes": {
                "maximum": 9007199254740991,
                "minimum": 5,
                "type": "integer"
              },
              "itinerary_id": {
                "description": "Parent itinerary UUID",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "slot": {
                "enum": ["morning", "afternoon", "evening"],
                "type": "string"
              },
              "title": {
                "description": "Short title for the activity",
                "minLength": 1,
                "type": "string"
              },
              "wp_content_id": {
                "description": "Source content id",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "wp_content_type": {
                "description": "Content type to link",
                "enum": ["itinerary", "activity", "destination", "post"],
                "type": "string"
              }
            },
            "required": ["day_id", "itinerary_id", "slot", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:127d0d6ca02985b621869f1bb0d21ae1dec2445d65d2c96b24ee9f7b99c5d349"
        },
