        {
          "name": "set_itinerary_dossier",
          "title": "Write an Itinerary's Dossier",
          "description": "Write the planning layer above an itinerary's day-by-day. Every block is optional — send only the ones you mean to write. Each block you DO send REPLACES that block entirely, so restate it in full: a partial legs list silently deletes the rest of the legs. Requires a bearer token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "booking_order": {
                "description": "What to book, in the order it has to happen",
                "items": {
                  "properties": {
                    "detail": {
                      "description": "Why it sits at this point in the order",
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["detail", "title"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "choices": {
                "description": "Either/ors deliberately left open for the traveller",
                "items": {
                  "properties": {
                    "options": {
                      "items": {
                        "properties": {
                          "body": {
                            "description": "What this option is actually like, and who should choose it",
                            "minLength": 1,
                            "type": "string"
                          },
                          "label": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "subtitle": {
                            "type": "string"
                          }
                        },
                        "required": ["body", "label"],
                        "type": "object"
                      },
                      "minItems": 2,
                      "type": "array"
                    },
                    "title": {
                      "description": "'Pick your coast'",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["options", "title"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "cost_model": {
                "description": "Per-person breakdown lines, amounts per comfort tier, and any per-line choices",
                "properties": {
                  "currency": {
                    "description": "ISO 4217, lowercase — 'usd'",
                    "maxLength": 3,
                    "minLength": 3,
                    "type": "string"
                  },
                  "length_options": {
                    "description": "Shorter or longer variants offered to the reader, in nights",
                    "items": {
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "lines": {
                    "items": {
                      "properties": {
                        "key": {
                          "description": "Short stable key used by tiers and option groups — 'land', 'permits', 'park_fees', 'flights'",
                          "minLength": 1,
                          "type": "string"
                        },
                        "label": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "scales_with_length": {
                          "description": "True for nightly costs (camps, park fees), false for per-trip costs (permits, internal flights)",
                          "type": "boolean"
                        }
                      },
                      "required": ["key", "label", "scales_with_length"],
                      "type": "object"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "notes": {
                    "description": "What the figures exclude and how firm they are",
                    "type": "string"
                  },
                  "option_groups": {
                    "items": {
                      "properties": {
                        "label": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "line_key": {
                          "description": "Which cost line this choice overrides",
                          "minLength": 1,
                          "type": "string"
                        },
                        "options": {
                          "items": {
                            "properties": {
                              "amount": {
                                "description": "Per person, in minor units — 620000 for $6,200",
                                "maximum": 9007199254740991,
                                "minimum": 0,
                                "type": "integer"
                              },
                              "is_default": {
                                "type": "boolean"
                              },
                              "label": {
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["amount", "label"],
                            "type": "object"
                          },
                          "minItems": 2,
                          "type": "array"
                        }
                      },
                      "required": ["label", "line_key", "options"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "reference_nights": {
                    "description": "The trip length the amounts are quoted at",
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "tiers": {
                    "items": {
                      "properties": {
                        "amounts": {
                          "description": "One entry per cost line",
                          "items": {
                            "properties": {
                              "amount": {
                                "description": "Per person, in minor units — 620000 for $6,200",
                                "maximum": 9007199254740991,
                                "minimum": 0,
                                "type": "integer"
                              },
                              "line_key": {
                                "type": "string"
                              }
                            },
                            "required": ["amount", "line_key"],
                            "type": "object"
                          },
                          "minItems": 1,
                          "type": "array"
                        },
                        "label": {
                          "description": "'Lean', 'Mid-range', 'Luxury'",
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["amounts", "label"],
                      "type": "object"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["currency", "lines", "reference_nights", "tiers"],
                "type": "object"
              },
              "countries": {
                "description": "How many countries the route crosses",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "field_notes": {
                "description": "Visas, certificates, luggage limits, kit",
                "items": {
                  "properties": {
                    "body": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "heading": {
                      "description": "'Visas', 'Yellow fever', 'Luggage'",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["body", "heading"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "itinerary_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "legs": {
                "description": "The route's chapters. Every day must belong to exactly one leg, and legs must not overlap.",
                "items": {
                  "properties": {
                    "end_day": {
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "start_day": {
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "summary": {
                      "description": "A sentence or two on what these nights are for",
                      "type": "string"
                    },
                    "title": {
                      "description": "Where this stretch is, in a word or two",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["end_day", "start_day", "title"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "seasonality": {
                "description": "One row per thing the trip is timed around, scored 0-3 across all twelve months, plus a verdict per month worth arguing about",
                "properties": {
                  "months": {
                    "items": {
                      "properties": {
                        "month": {
                          "maximum": 12,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "rank": {
                          "enum": ["primary", "alternative", "workable", "avoid"],
                          "type": "string"
                        },
                        "tags": {
                          "description": "Short labels: 'Peak crossings', 'Books out first', 'Avoid'",
                          "items": {
                            "type": "string"
                          },
                          "maxItems": 4,
                          "type": "array"
                        },
                        "verdict": {
                          "description": "Why this month is or isn't the one, in two or three sentences",
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["month", "rank", "tags", "verdict"],
                      "type": "object"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "recommended_month": {
                    "description": "The month this plan is actually built around",
                    "maximum": 12,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "rows": {
                    "items": {
                      "properties": {
                        "label": {
                          "description": "What is being scored — a wildlife event, a trail condition, a sea state",
                          "minLength": 1,
                          "type": "string"
                        },
                        "scores": {
                          "description": "January first. 0 = avoid, 1 = poor, 2 = workable, 3 = peak",
                          "items": {
                            "maximum": 3,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "maxItems": 12,
                          "minItems": 12,
                          "type": "array"
                        }
                      },
                      "required": ["label", "scores"],
                      "type": "object"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["months", "recommended_month", "rows"],
                "type": "object"
              }
            },
            "required": ["itinerary_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
