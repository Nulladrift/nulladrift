        {
          "name": "generate_itinerary_from_places",
          "title": "Generate Itinerary from Places",
          "description": "Give at least 3 places plus optional traveller preferences and let the AI concierge build a full, bespoke day-by-day itinerary. It mines Iconic Expeditions content for real detail and synthesizes an ORIGINAL plan tailored to the guest (never a copy of a published itinerary). Attributed to the Iconic Expeditions account and made public. Returns immediately with the itinerary id + share link; poll get_itinerary for progress (generation_status: pending -> building -> complete). Requires a bearer token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "Language for day titles, notes, and activity text: 'en' (English), 'ru' (Russian), or 'zh' (Chinese). Defaults to English.",
                "enum": ["en", "ru", "zh"],
                "type": "string"
              },
              "num_days": {
                "description": "Number of days for the trip",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "places": {
                "description": "At least 3 place names, e.g. ['Victoria Falls', 'Hwange', 'Mana Pools']",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "minItems": 3,
                "type": "array"
              },
              "preferences": {
                "description": "Traveller preferences that should shape the plan: pace, interests, budget, travel style",
                "type": "string"
              },
              "title": {
                "description": "Itinerary title, e.g. 'Highlights of Zimbabwe'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["num_days", "places", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2fce9cfa73a851c9bb56e58bbcd12659d4ef74f7e956c488559518b65d2a965f"
        },
