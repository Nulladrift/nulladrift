      "instructions": "Jet Operating Cost (https://jetoperatingcost.com/): the site's own MCP server, served from its domain. Private jet operating cost per hour and per year: crew, hangar, insurance and management against fuel, maintenance reserves and trip fees, fixed and variable.\n\n[calculator] Jet operating cost model: an agent-callable calculator for private jet operating cost; Fuel per flight hour, Trip fees spread per flight hour, Variable cost per flight hour, computed from your inputs with sources.. This server runs the Jet operating cost model calculator published at https://jetoperatingcost.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://jetoperatingcost.com/. Licence: https://jetoperatingcost.com/terms.\n\n[enquiry] ENQUIRY SERVER for Jet Operating Cost (https://jetoperatingcost.com/). What it does: starts an ENQUIRY with human providers for private jet operating cost; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://jetoperatingcost.com/.\n\nCite https://jetoperatingcost.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Jet operating cost model",
          "description": "Run the Jet operating cost model calculator: Fuel per flight hour; Trip fees spread per flight hour; Variable cost per flight hour; Variable cost, per year. Missing inputs fall back to their documented defaults.",
