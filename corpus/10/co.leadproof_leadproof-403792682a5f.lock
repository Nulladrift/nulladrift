          },
          "digest": "sha256:dfa6c37bf9ec4a5548f8a02df4ec66a61b9d07d948dcb0f3bf41403ae91411d2"
        },
        {
          "name": "get_sample_leads",
          "title": "Get sample leads",
          "description": "A few illustrative rows in the exact delivered format (placeholder businesses on reserved example domains, not real leads), plus the column reference.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
