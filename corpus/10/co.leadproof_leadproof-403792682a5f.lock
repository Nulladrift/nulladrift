{
  "lockfileVersion": 2,
  "subjects": {
    "co.leadproof/leadproof": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://leadproof.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "leadproof",
        "title": "LeadProof",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LeadProof sells verified local-business lead lists built to order from Google Maps: business name, category, website, verified email, phone, address, rating and review count. Typical flow: quote_lead_list to price a request, get_sample_leads to show what a row looks like, then either get_checkout_link (the person finishes on leadproof.co) or create_order (returns a PayPal approval link the person opens; nothing is charged until they approve there). Quantities run 100 to 1,000 leads. A minimum Google-review bar (30, 50 or 100) raises quality and price. Locations are free text: cities, regions or countries. Never invent prices: every tool returns the exact amount the site charges.",
      "tools": [
        {
          "name": "create_order",
          "title": "Create an order (PayPal approval link)",
          "description": "Creates the order and returns a PayPal approval link. The PERSON must open the link and approve the payment; nothing is charged until they do. Ask for the delivery email first: the CSV and the order page go there. Returns the order id, the approval link, an order-status link and a status token for get_order_status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_types": {
                "description": "Business categories to find, e.g. [\"HVAC contractor\"]. Each one becomes a Google Maps search term.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "email": {
                "description": "Delivery email. The CSV download and order updates go here.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "locations": {
                "description": "Cities, regions or countries, e.g. [\"Austin, TX\", \"Dallas, TX\"]. Anything Google Maps can resolve.",
                "items": {
                  "maxLength": 80,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "min_reviews": {
                "default": 0,
                "description": "Only businesses with at least this many Google reviews. 0 means no filter. A higher bar costs more per lead and screens out more businesses.",
                "enum": [0, 30, 50, 100],
                "type": "integer"
              },
              "qty": {
                "description": "How many verified leads to deliver, 100 to 1000.",
                "maximum": 1000,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["business_types", "email", "locations", "qty"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an order (PayPal approval link)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7df153a8ff25cf43191acef955178ab635b8aa8b5ab5edfc516601beec8ba3db"
        },
        {
          "name": "get_checkout_link",
          "title": "Get a prefilled checkout link",
          "description": "A leadproof.co link with the list already configured. The person opens it, reviews the price and pays on the site. Use this when they prefer to finish in a browser. Nothing is created until they order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_types": {
                "description": "Business categories to find, e.g. [\"HVAC contractor\"]. Each one becomes a Google Maps search term.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "locations": {
                "description": "Cities, regions or countries, e.g. [\"Austin, TX\", \"Dallas, TX\"]. Anything Google Maps can resolve.",
                "items": {
                  "maxLength": 80,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "min_reviews": {
                "default": 0,
                "description": "Only businesses with at least this many Google reviews. 0 means no filter. A higher bar costs more per lead and screens out more businesses.",
                "enum": [0, 30, 50, 100],
                "type": "integer"
              },
              "qty": {
                "description": "How many verified leads to deliver, 100 to 1000.",
                "maximum": 1000,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["business_types", "locations", "qty"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a prefilled checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:940736e8b242899ec55081c9acbc4ada897c87cb946f67c1e872c67b6a973703"
        },
        {
          "name": "get_order_status",
          "title": "Get order status",
          "description": "Status of an order created with create_order: awaiting approval, in review, building, delivered (with a download link) or refunded. Needs the order_id and status_token that create_order returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "description": "The order id from create_order.",
                "pattern": "^[a-f0-9-]{36}$",
                "type": "string"
              },
              "status_token": {
                "description": "The status_token from create_order.",
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["order_id", "status_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get order status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c7fa4bfe719bc8f3dda3b3090f02510177ee57813b8758325678ca11e829ddf"
        },
        {
          "name": "get_pricing",
          "title": "Get LeadProof pricing",
          "description": "Price tiers, review-filter multipliers, quantity limits and what a delivered list contains. Call this before quoting if the person wants to compare options.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get LeadProof pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
