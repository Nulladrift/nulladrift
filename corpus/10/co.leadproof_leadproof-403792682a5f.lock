          "title": "Quote a lead list",
          "description": "Exact price for a lead list: business types, locations, quantity and optional minimum-review bar. Returns the amount the site charges, what is included and delivery terms. Nothing is created.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
