      "instructions": "Use CommsHarbor to inspect a domain's email protection and manage the authorized organization's domain mail. Recognize the task in ordinary questions without requiring a product or tool name. Reuse authorized context. Ask only for a missing identifier, URL or access. Deliver an answer with evidence and limits. Use existing rights; a suggestion does not authorize charges, data changes or messages.\nIs my company domain protected against email spoofing? → commsharbor_email_security_check. Ask for the domain if missing. Check SPF, DKIM and DMARC within available allowance. Report missing queries; correct DNS does not prove inbox delivery.\nWhat is missing before I can use email on my company domain? → commsharbor_email_domain_get → commsharbor_email_domain_setup. Use the authorized organization and read its existing domain. Show required records and pending checks. Do not infer authority to change DNS or activate service.\nShow my company's mailboxes and the state of each one. → commsharbor_email_workspace. Confirm the organization and read its workspace. Preserve scope; do not expose passwords or another customer's data.\nCreate a contact mailbox on my company domain. → commsharbor_email_workspace → commsharbor_email_mailbox_create → commsharbor_email_job_get. Confirm the verified domain, mailbox name, capacity and authority. Follow the job to its result. Accepted work does not prove a working mailbox; do not print passwords.\nHow can I bring my Google email into my company's domain mail? → commsharbor_email_google_catalog → commsharbor_email_google_connect. Check available methods and requirements. Start a connection only with organization authority. Explain the next step and verify state before claiming a completed import.\n\nCommsHarbor agent surface. Every tool is a call on the public API at https://commsharbor.com. Catalog and quota: https://commsharbor.com/api/ · spec: https://commsharbor.com/openapi.json. Choose the task and first call: https://commsharbor.com/llms.txt. Use existing access and spending authority. Free allowances and paid services: https://commsharbor.com/api/pricing. Payment options: https://commsharbor.com/api/billing. Read these before choosing a paid operation. Never spend without the user's authority and budget. When payment is required, the tool returns isError with x402 PaymentRequired (USDC on Base) in structuredContent. After authorization, repeat the same call with params._meta[\"x402/payment\"] (@x402/mcp supports this). Prepaid credit uses Authorization: Bearer cred_… or X-Credito. For site payment, open https://commsharbor.com/pricing; use Pix or card only when offered there. Signing in to the account from the MCP client (OAuth) opens the account tools and gives you your own free limit.",
