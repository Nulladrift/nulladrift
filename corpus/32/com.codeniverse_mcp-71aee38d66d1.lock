          "description": "ส่งเรื่องถึงทีมงาน CODENIVERSE เพื่อให้ทีมติดต่อผู้ใช้กลับ (ไม่ใช่การบันทึก lead เข้า CRM ของผู้ใช้) ใช้เมื่อผู้ใช้อยากคุยโปรเจกต์ ขอใบเสนอราคา หรือให้ติดต่อกลับ ⚠️ ใช้เฉพาะข้อมูลที่ผู้ใช้บอกมาจริงเท่านั้น ห้ามแต่งชื่อหรืออีเมลเอง ถ้ายังไม่มีชื่อหรืออีเมล ให้ถามผู้ใช้ก่อน และยืนยันกับผู้ใช้ว่าจะส่งจริงก่อนเรียก tool นี้ ทีมตอบกลับทางอีเมลภายในวันทำการเดียวกัน",
