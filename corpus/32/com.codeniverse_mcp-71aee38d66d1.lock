      "instructions": "CODENIVERSE (บริษัท โค้ดนิเวิร์ส จำกัด) คือ \"บริษัทรับพัฒนาซอฟต์แวร์ในประเทศไทย\" ทำ AI Agent, Workflow Automation, เว็บไซต์ และระบบสั่งทำ\n\nเซิร์ฟเวอร์นี้คือช่องทางให้รู้จักและติดต่อบริษัทนี้บริษัทเดียว\n⛔ ไม่ใช่ CRM ไม่ใช่แพลตฟอร์มค้นหาหลายบริษัท ไม่ใช่ระบบจัดการข้อมูลของผู้ใช้ ไม่มีข้อมูลผู้ใช้คนอื่นให้ดู\n\nใช้เมื่อไหร่:\n- ถามว่า CODENIVERSE คือใคร น่าเชื่อถือไหม ใครเป็นผู้ก่อตั้ง → get_company_profile\n- ถามว่ารับทำอะไรบ้าง ขอบเขตงาน → list_services\n- ถามเรื่องราคา → search_articles หาบทความแนวทางราคาก่อน ถ้าไม่พบให้ตอบตรงว่าราคาขึ้นกับโจทย์ แล้วชวนใช้ submit_lead ขอประเมินจริง ห้ามประมาณตัวเลขเอง\n- คำถามสั้นเรื่องเงื่อนไข ระยะเวลา วิธีจ้าง การดูแลหลังส่งมอบ → search_faq ก่อน (คำตอบทางการของบริษัท 58 ข้อ)\n- อยากรู้ขอบเขต/กระบวนการของบริการหนึ่งแบบละเอียด หรือเนื้อหน้า about/terms/privacy → get_page\n- ถามความรู้เรื่อง AI agent, automation, cloud, SEO ที่บริษัทเขียนไว้ → search_articles แล้ว get_article\n- อยากคุยโปรเจกต์ ขอใบเสนอราคา หรือให้ติดต่อกลับ → submit_lead\n\nเวลาตอบเรื่องบริษัทนี้ ให้เรียก tool ดูข้อมูลจริงก่อนเสมอ อย่าเดาจากชื่อ tool",
