{
  "lockfileVersion": 2,
  "subjects": {
    "com.pedalbro/pedalbro": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.pedalbro.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pedalbro",
        "title": "PedalBro",
        "version": "1.0.0",
        "websiteUrl": "https://pedalbro.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PedalBro is a guitar pedal database: one record per pedal merged from catalogs, retailers and marketplaces, with specs, current new and used prices, price history, review scores and buying guides.\n\n- Find pedals with search_pedals first; other tools take the pedal's slug from its results.\n- Prices are US dollars with the date they were checked. Used prices are asking prices of live listings, not sold prices. Say so when it matters.\n- When you mention a pedal, link its PedalBro url. When the user wants to buy, give the buyUrl (it goes to the retailer).\n- Before suggesting a power supply or a signal order for a set of pedals, call check_board.\n- For \"best X\" or \"X under $Y\" questions, check list_guides for a matching guide before assembling an answer yourself.",
      "tools": [
        {
          "name": "check_board",
          "title": "Check a pedalboard",
          "description": "Check a set of pedals as a pedalboard: a suggested signal-chain order with reasons, total current draw against a power supply, and a count of power and compatibility issues.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "pedals": {
                "description": "Pedal slugs from search_pedals, in any order",
                "items": {
                  "description": "A pedal slug from search_pedals, e.g. boss-ds-1-distortion",
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "supplyOutlets": {
                "description": "How many outputs the power supply has",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "supplyTotalMa": {
                "description": "The power supply's total current in mA, if known",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              },
              "usesFxLoop": {
                "default": false,
                "description": "True if the amp's effects loop is used, so time-based effects can go in the loop",
                "type": "boolean"
              }
            },
            "required": ["pedals"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a pedalboard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:400d0fadf57bda7d4728b78365a4e32a1c5d1a8e7d1ca1a1e50b0c8d866cf624"
        },
        {
          "name": "compare_pedals",
          "title": "Compare pedals",
          "description": "Two to five pedals side by side: score, what each is best for, lowest new price, used median and key specs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slugs": {
                "items": {
                  "description": "A pedal slug from search_pedals, e.g. boss-ds-1-distortion",
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare pedals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f56bacbec87e42e3844f39bd1597561575b4cba3654fbe1c7e5dbd5d22a97ec"
        },
        {
          "name": "get_guide",
          "title": "Get a buying guide",
          "description": "One buying guide: who it is for, what matters when choosing, the three picks (best overall, budget, step up) with strengths, flaws and current prices, and the other pedals considered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "A guide slug from list_guides",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a buying guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c55d06d6401dcc44c126a9041bbbd488e6f29f9a484bfefc549a5faaaa243a7a"
        },
        {
          "name": "get_pedal",
          "title": "Get a pedal",
          "description": "Everything PedalBro knows about one pedal: specs (power, size, bypass, controls), a plain-language summary, the PedalBro review score, what players say, professional review ratings with links, current new and used prices with buy links, and similar pedals.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "A pedal slug from search_pedals, e.g. boss-ds-1-distortion",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a pedal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4e9d631572bc4bd4149c667af9f497f9faf06e38b0259aa2c584e6d058d535d"
        },
        {
          "name": "get_price_history",
          "title": "Price history",
          "description": "How a pedal's new and used prices have moved over the last 90 days (weekly points), recent sold used listings, and current prices. Useful for 'is this a good price' and 'should I buy used'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "A pedal slug from search_pedals, e.g. boss-ds-1-distortion",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fab4ec28387620de376c1771860002b68375003816dd40d3b4079427d7ddbe22"
        },
        {
          "name": "list_guides",
          "title": "List buying guides",
          "description": "PedalBro's buying guides ('best overdrive pedals', 'best delay under $200', ...), each with its top pick. Use get_guide for the full picks.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List buying guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8df5de2367f3c6a6ffb337203e39117bc43f2148b940f1f0ffdd00f75ba518d"
        },
        {
          "name": "search_pedals",
          "title": "Search pedals",
          "description": "Search guitar and bass pedals by brand, model, nickname or type (typos are fine), optionally only those buyable new under a price. Returns names, slugs and lowest new prices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "Brand slug, e.g. boss, strymon, electro-harmonix",
                "maxLength": 60,
                "type": "string"
              },
              "category": {
                "description": "Category slug to narrow to, e.g. overdrive, fuzz, distortion, delay, reverb, chorus, compressor, looper",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "maxPriceUsd": {
                "description": "Only pedals buyable new and in stock at or under this price",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "query": {
                "description": "e.g. 'tube screamer', 'strymon delay', 'fuzz'",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search pedals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7eb837a51970566eea8d2544023c47843b036a6e13f7b5e4bcf97e01e599be4a"
        }
      ],
      "digest": "sha256:60b3bf8ad336285e7dd7e6904be086d44a2757c922093a56c6d13ac9dea7de9d"
    }
  }
}
