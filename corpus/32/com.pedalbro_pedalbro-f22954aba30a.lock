        },
        {
          "name": "get_price_history",
          "title": "Price history",
          "description": "How a pedal's new and used prices have moved over the last 90 days (weekly points), recent sold used listings, and current prices. Useful for 'is this a good price' and 'should I buy used'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "A pedal slug from search_pedals, e.g. boss-ds-1-distortion",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
