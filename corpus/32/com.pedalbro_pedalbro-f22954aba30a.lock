        },
        {
          "name": "search_pedals",
          "title": "Search pedals",
          "description": "Search guitar and bass pedals by brand, model, nickname or type (typos are fine), optionally only those buyable new under a price. Returns names, slugs and lowest new prices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "Brand slug, e.g. boss, strymon, electro-harmonix",
                "maxLength": 60,
                "type": "string"
              },
              "category": {
                "description": "Category slug to narrow to, e.g. overdrive, fuzz, distortion, delay, reverb, chorus, compressor, looper",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "maxPriceUsd": {
                "description": "Only pedals buyable new and in stock at or under this price",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "query": {
                "description": "e.g. 'tube screamer', 'strymon delay', 'fuzz'",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search pedals"
          },
