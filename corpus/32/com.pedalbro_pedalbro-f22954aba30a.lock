{
  "lockfileVersion": 2,
  "subjects": {
    "com.pedalbro/pedalbro": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.pedalbro.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pedalbro",
        "title": "PedalBro",
        "version": "1.0.0",
        "websiteUrl": "https://pedalbro.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PedalBro is a guitar pedal database: one record per pedal merged from catalogs, retailers and marketplaces, with specs, current new and used prices, price history, review scores and buying guides.\n\n- Find pedals with search_pedals first; other tools take the pedal's slug from its results.\n- Prices are US dollars with the date they were checked. Used prices are asking prices of live listings, not sold prices. Say so when it matters.\n- When you mention a pedal, link its PedalBro url. When the user wants to buy, give the buyUrl (it goes to the retailer).\n- Before suggesting a power supply or a signal order for a set of pedals, call check_board.\n- For \"best X\" or \"X under $Y\" questions, check list_guides for a matching guide before assembling an answer yourself.",
      "tools": [
        {
          "name": "check_board",
          "title": "Check a pedalboard",
          "description": "Check a set of pedals as a pedalboard: a suggested signal-chain order with reasons, total current draw against a power supply, and a count of power and compatibility issues.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "pedals": {
                "description": "Pedal slugs from search_pedals, in any order",
                "items": {
                  "description": "A pedal slug from search_pedals, e.g. boss-ds-1-distortion",
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "supplyOutlets": {
                "description": "How many outputs the power supply has",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "supplyTotalMa": {
                "description": "The power supply's total current in mA, if known",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              },
              "usesFxLoop": {
                "default": false,
                "description": "True if the amp's effects loop is used, so time-based effects can go in the loop",
                "type": "boolean"
              }
            },
            "required": ["pedals"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a pedalboard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7c35e7f43527715f3392948f5a868c7b4b984d2ac7016b686f5b2c5ac7b2e420"
        },
        {
          "name": "compare_pedals",
          "title": "Compare pedals",
          "description": "Two to five pedals side by side: score, what each is best for, lowest new price, used median and key specs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slugs": {
                "items": {
                  "description": "A pedal slug from search_pedals, e.g. boss-ds-1-distortion",
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare pedals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:889a8d5ea868c37321dcbfa50aaa390f93ad00981d58b37fc3e14ca003713f00"
        },
        {
          "name": "get_guide",
          "title": "Get a buying guide",
          "description": "One buying guide: who it is for, what matters when choosing, the three picks (best overall, budget, step up) with strengths, flaws and current prices, and the other pedals considered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "A guide slug from list_guides",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a buying guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:08fa7ac37d507a68cc244d263693f63407aa02349d6db7dd8ff0d30e18e5d130"
        },
        {
          "name": "get_pedal",
          "title": "Get a pedal",
          "description": "Everything PedalBro knows about one pedal: specs (power, size, bypass, controls), a plain-language summary, the PedalBro review score, what players say, professional review ratings with links, current new and used prices with buy links, and similar pedals.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "A pedal slug from search_pedals, e.g. boss-ds-1-distortion",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a pedal"
          },
          "behavior": {
            "destructive": false,
