          },
          "digest": "sha256:732db453c0d4fa0d7d08a30a8fc832c8dfd55cf667676976b27bed643f03b544"
        },
        {
          "name": "list_guides",
          "title": "List buying guides",
          "description": "PedalBro's buying guides ('best overdrive pedals', 'best delay under $200', ...), each with its top pick. Use get_guide for the full picks.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
