{
  "lockfileVersion": 2,
  "subjects": {
    "com.rangercheck/security-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rangercheck.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rangercheck",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "scan_security",
          "description": "Run a free front-end security check on any website and get a letter grade (A to F) plus specific findings. Answers questions like 'is example.com leaking API keys or secrets in its front-end code', 'does this site expose a Stripe/AWS/OpenAI key or a publicly readable database', or 'how is this website's client-side security'. Reads only what the site serves publicly; never logs in or changes anything.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The website to check: a domain like example.com or a full URL like https://example.com",
                "maxLength": 255,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:db25ebefba3cbb0f19a0d08243169c33eb678e63ad9ad7de099a7aaf72c957e6"
        }
      ],
      "digest": "sha256:f2fa2a00963bff73deadeba7d1f8cc0cef9cbf26d50e6724bc5271f1cb9d3ddb"
    }
  }
}
