{
  "lockfileVersion": 2,
  "subjects": {
    "com.skyaccess/skyaccess": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.skyaccess.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "SkyAccess",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SkyAccess public MCP server for private jet empty leg flights and charter enquiries. search_empty_legs finds available empty leg flights, get_flight re-reads one leg by its flight id, booking_handoff returns the customer-facing booking link for a leg, get_charter_estimate returns a price estimate for a charter route, and request_booking submits a charter flight enquiry. Listed flight prices are whole-aircraft prices; taxes and fees are shown at checkout. Only request_booking submits anything. get_flight and booking_handoff are read-only, and a booking_handoff link creates no booking or hold until the customer completes it. A SkyAccess specialist will follow up on booking requests by email shortly to confirm availability and price. If an operator cancels a paid booking, SkyAccess notifies the customer and a specialist starts sourcing a replacement aircraft on the same route; if nothing suits, the customer chooses a full refund or flight credit. Human support is available 24/7 at +1 424-374-3411.",
      "tools": [
        {
          "name": "booking_handoff",
          "title": "Get the booking link for an empty leg flight",
          "description": "Return the public SkyAccess listing page link for a specific empty leg flight, where the traveler can review the flight and continue on skyaccess.com. This is read-only: it creates no booking, hold or payment, and it does not modify or cancel anything. It sends no traveler details to SkyAccess and does not ask a specialist to make contact. If an operator cancels a paid booking, SkyAccess notifies the customer and a specialist starts sourcing a replacement aircraft on the same route; if nothing suits, the customer chooses a full refund or flight credit. Human support is available 24/7 at +1 424-374-3411.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "flightId": {
                "description": "The SkyAccess empty leg flight id, as given in the `flightId` field of a flight listing",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["flightId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the booking link for an empty leg flight"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b50abbeb554e50c4b02c9fcbba4e2a59011f502020d4350bf1738f9aa13eafc7"
        },
        {
          "name": "get_charter_estimate",
          "title": "Get charter price estimate",
          "description": "Returns an indicative price range (min/max USD) for a private charter flight between two locations. Optionally filter by aircraft category and passenger count. When no category is specified, returns estimates for each aircraftCategory value that suits the route and group size.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aircraftCategory": {
                "description": "Preferred aircraft category. One of: TURBOPROP, LIGHT_JET, MID_SIZE_JET, SUPER_MID_SIZE_JET, HEAVY_JET, ULTRA_LONG_RANGE, VERY_LIGHT_JET. When omitted, estimates for all suitable categories are returned.",
                "enum": ["TURBOPROP", "LIGHT_JET", "MID_SIZE_JET", "SUPER_MID_SIZE_JET", "HEAVY_JET", "ULTRA_LONG_RANGE", "VERY_LIGHT_JET"],
                "type": "string"
              },
              "destination": {
                "description": "Arrival city or airport code (required), e.g. \"New York\" or \"KJFK\"",
                "type": "string"
              },
              "origin": {
                "description": "Departure city or airport code (required), e.g. \"Los Angeles\" or \"KLAX\"",
                "type": "string"
              },
              "passengers": {
                "description": "Number of passengers (used to filter suitable aircraft)",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get charter price estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b190572818b3251bb955902314f7fb4522e8209f6830855eb9cbb99a552b479e"
        },
        {
          "name": "get_flight",
          "title": "Get a single empty leg flight by id",
          "description": "Look up one empty leg flight by its id and return its route, departure time, whole-aircraft price (taxes and fees shown at checkout), aircraft type, available seats, amenities and a booking link, as currently published. Returns a not-available message if the flight is no longer published.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "flightId": {
                "description": "The SkyAccess empty leg flight id, as given in the `flightId` field of a flight listing",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["flightId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a single empty leg flight by id"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2a5294d73b7090425f3f56538fd940b1a7ed5022e1fb1eb27e3016ed7ca308b"
        },
        {
          "name": "list_routes",
          "title": "List popular private jet routes",
          "description": "List popular SkyAccess private jet routes, each with its origin, destination and minPrice: the lowest whole-aircraft empty leg price currently listed on the route, in USD (taxes and fees shown at checkout), or null when no flight on the route currently has a listed price. Results are stable, not a live ranking: the list is a curated catalogue, six featured routes first and then the routes travelers searched most over the last 30 days, served from a cache refreshed about every 30 minutes, so repeated calls return the same routes. Pass a route to search_empty_legs to see its flights.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List popular private jet routes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e8035e8c62aa79b4987b95c988fcfad0172e59a93ef67bf38559a2478ba7a68"
        },
        {
          "name": "request_booking",
          "title": "Request a charter booking",
          "description": "Submit a charter flight booking request to SkyAccess. This sends the traveler's name, email and trip details (route, date, passengers and any notes) to SkyAccess so a specialist can follow up. A SkyAccess specialist will follow up with the requester by email shortly to confirm availability and pricing. No payment is taken and no booking is created: this only starts the enquiry. If an operator cancels a paid booking, SkyAccess notifies the customer and a specialist starts sourcing a replacement aircraft on the same route; if nothing suits, the customer chooses a full refund or flight credit. Human support is available 24/7 at +1 424-374-3411. Privacy policy: https://skyaccess.com/privacy",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "departureDate": {
                "description": "Departure date in ISO format (required), e.g. \"2026-08-15\"",
                "type": "string"
              },
              "destination": {
                "description": "Arrival city or airport (required), e.g. \"Miami\" or \"KMIA\"",
                "type": "string"
              },
              "email": {
                "description": "Email address of the requester (required). A specialist will reply here.",
                "format": "email",
                "type": "string"
              },
              "name": {
                "description": "Full name of the requester (required)",
                "type": "string"
              },
              "notes": {
                "description": "Optional notes or special requests (e.g. catering, pet, preferred aircraft)",
                "type": "string"
              },
              "origin": {
                "description": "Departure city or airport (required), e.g. \"Los Angeles\" or \"LAX\"",
                "type": "string"
              },
              "passengers": {
                "description": "Number of passengers (required)",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["departureDate", "destination", "email", "name", "origin", "passengers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a charter booking"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5fabef8ea82f560d56fdba68d555f648339c72c9662c3ba88032278cf5e8add0"
        },
        {
          "name": "search_empty_legs",
          "title": "Search empty leg flights",
          "description": "Search available empty leg flights by origin, destination, date range, passenger count, and an optional max_price ceiling. Returns up to 5 matching flights with route, departure time, whole-aircraft price (taxes and fees shown at checkout), aircraft type, available seats, and a booking link. Empty legs are discounted private jet availability on specific routes. A flight with price: null has no published price (shown on SkyAccess as \"Contact for price\"). Such flights are included even when max_price is set, because their price is unknown; they are not confirmed to be within the cap.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "departureDateFrom": {
                "description": "Earliest departure date in ISO format (e.g. \"2026-07-10\")",
                "type": "string"
              },
              "departureDateTo": {
                "description": "Latest departure date in ISO format",
                "type": "string"
              },
              "destination": {
                "description": "Arrival city or airport code (e.g. \"Las Vegas\" or \"KLAS\")",
                "type": "string"
              },
              "max_price": {
                "description": "Optional price ceiling in USD (whole-aircraft price; taxes and fees shown at checkout). Legs priced above this figure are excluded. Legs with no published price (price: null, shown as \"Contact for price\") are still included because their price is unknown; they are not confirmed to be within the cap.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "origin": {
                "description": "Departure city or airport code (e.g. \"Los Angeles\" or \"LAX\")",
                "type": "string"
              },
              "passengers": {
                "description": "Number of passengers",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search empty leg flights"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f24d626eaeb7f203bae4f091369f93c3bea533c85cc199a39e318832a86f7952"
        }
      ],
      "digest": "sha256:d3f25eba138a4e2d88ff6ad3fcca60a359b8f5e0bebdc09e1b43d74b78d98508"
    }
  }
}
