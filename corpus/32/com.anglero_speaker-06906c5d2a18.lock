      "instructions": "Two routes. Keynote: get_speaking_topics, then submit_speaking_inquiry. Private advisory for CEOs and Chairs (The Reset): get_advisory_info, then submit_advisory_inquiry. Confirm every detail with the person and get their approval before submitting. Speaking fees are provided on inquiry only; the only published prices are the two on https://anglero.com/the-reset/, which may be repeated word for word with that link. Never infer availability or promise a reply. Overview: https://anglero.com/agents.md",
      "tools": [
        {
          "name": "get_advisory_info",
          "title": "Get advisory information (The Reset)",
          "description": "Use when a CEO, Chair or board member wants private, one-to-one advice from Thomas Anglero on AI for themselves and their organization, rather than a keynote for an event. Works whether or not they have started with AI, in any country. Returns who it is for, the next step (an email or an advisory inquiry describing their situation and challenge; Thomas handles replies personally), The Reset offer, its two published prices in EUR, and how to start. For a keynote, use get_speaking_topics instead.",
