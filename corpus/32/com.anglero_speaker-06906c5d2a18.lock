            "readOnly": true
          },
          "digest": "sha256:560ac74371a78a475a0e485c98437f8fee369ffd866742d17214bf8fd5a95a10"
        },
        {
          "name": "submit_advisory_inquiry",
          "title": "Submit an advisory inquiry",
          "description": "Send a private advisory inquiry to Thomas Anglero on behalf of a CEO, Chair or board member who wants one-to-one advice on AI (The Reset), not a keynote. Before calling: read get_advisory_info, show the person every detail you will send, and send only after they approve (human_approved true) and agree to be contacted (consent true). Records the inquiry in the same pipeline as the website form. Thomas reads each inquiry and handles replies personally. Do not promise a reply, a reply time, or a conversation. For a keynote, use submit_speaking_inquiry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "The name of the AI agent or assistant sending this inquiry.",
                "type": "string"
              },
              "ai_stage": {
                "description": "Where they are with AI today.",
                "enum": ["Not started", "Exploring", "Running pilots", "In production in parts", "Scaling across the company"],
                "type": "string"
              },
              "challenge": {
                "description": "In their own words, what they want to solve or decide. At least 300 characters: their situation, what they have already tried, and the outcome they want.",
                "minLength": 300,
                "type": "string"
              },
              "company": {
                "description": "Their company or organization.",
                "type": "string"
              },
              "company_size": {
                "description": "Number of employees.",
                "enum": ["Under 50", "50 to 249", "250 to 999", "1,000 or more"],
                "type": "string"
              },
              "company_website": {
                "description": "Optional. The company website, as a full address starting with https://.",
                "type": "string"
              },
              "consent": {
                "description": "Must be true. Set true only if the person agrees that Thomas Anglero may contact them by email about this inquiry (privacy policy: https://anglero.com/privacy-policy/).",
                "type": "boolean"
              },
              "country": {
                "description": "Country where they are based.",
                "type": "string"
              },
              "email": {
                "description": "Their email address. Thomas handles replies personally.",
                "type": "string"
              },
              "human_approved": {
                "description": "Must be true. Set true only after the person has seen and approved the exact details being sent.",
                "type": "boolean"
              },
              "linkedin": {
                "description": "Optional. Their LinkedIn profile address.",
                "type": "string"
              },
              "name": {
                "description": "Full name of the person seeking advice.",
                "type": "string"
              },
              "role": {
                "description": "Their role, for example CEO, Chair, or board member.",
                "type": "string"
              },
              "website": {
                "description": "Leave blank. Anti-spam field.",
                "type": "string"
              }
            },
            "required": ["agent_name", "ai_stage", "challenge", "company", "company_size", "consent", "country", "email", "human_approved", "name", "role"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24dd8f07b8a390a3f37d55c31fec53c3355fde679beced4d54d17e13327dc0df"
        },
        {
          "name": "submit_speaking_inquiry",
          "title": "Submit a speaking inquiry",
          "description": "Send a speaking inquiry to Thomas Anglero. Fold every detail into the message in natural language: what Thomas should speak about, event location, expected audience size, your role, and budget if any. Give the format when it is known. Writes into the same pipeline as the website form: it records the inquiry and sends the confirmation and notification emails. Thomas replies promptly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The company or organization the inquiry is on behalf of.",
                "type": "string"
              },
              "email": {
                "description": "Contact email address.",
                "type": "string"
              },
              "event_date": {
                "description": "Event date, for example \"February 17, 2027\". If the date is not yet fixed, give the intended month or timeframe.",
                "type": "string"
              },
              "format": {
                "description": "Optional. How the keynote will be delivered.",
                "enum": ["in_person", "virtual", "hybrid", "not_sure"],
                "type": "string"
              },
              "message": {
                "description": "A short free-text description of the event. Fold everything relevant into this one field in natural language: what you would like Thomas to speak about, event location, expected audience size, your role at the company, and budget if you have one. Thomas reads this and replies with availability and a tailored proposal.",
                "type": "string"
              },
              "name": {
                "description": "Full name of the person making the inquiry.",
                "type": "string"
              },
              "phone": {
                "description": "Contact phone number, including country code if the event is outside Norway.",
                "type": "string"
              },
              "website": {
                "description": "Leave blank. Anti-spam field.",
                "type": "string"
              }
            },
            "required": ["company", "email", "event_date", "message", "name", "phone"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f70c8716b24e67e8f3c20c8aa6116b36376c66e49d88df7201699b5cc6ab1b49"
        }
      ],
