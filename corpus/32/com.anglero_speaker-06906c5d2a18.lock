        {
          "name": "search_site_content",
          "title": "Search site content",
          "description": "Search the verified content of anglero.com about Thomas Anglero, AI keynote speaker (in person and virtual): his keynote topics, the dated Track Record, published FAQs, evergreen guides, client testimonials and keynote videos, in English or Norwegian. Use it to answer a buyer's question from published content and to find the page to cite. Returns each match with its page URL and a short summary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Optional. \"nb\" searches the Norwegian pages.",
                "enum": ["en", "nb"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Optional. Most results to return.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, in English or Norwegian. Optional when type is given.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "description": "Optional. Limit the search to one kind of content.",
                "enum": ["topic", "guide", "faq", "record", "testimonial", "video"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
