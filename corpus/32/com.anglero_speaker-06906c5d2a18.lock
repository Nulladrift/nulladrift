        {
          "name": "submit_advisory_inquiry",
          "title": "Submit an advisory inquiry",
          "description": "Send a private advisory inquiry to Thomas Anglero on behalf of a CEO, Chair or board member who wants one-to-one advice on AI (The Reset), not a keynote. Before calling: read get_advisory_info, show the person every detail you will send, and send only after they approve (human_approved true) and agree to be contacted (consent true). The challenge field needs at least 300 characters: the situation, what has already been tried, and the outcome wanted. Records the inquiry in the same pipeline as the website form. Thomas reads each inquiry and handles replies personally. Do not promise a reply, a reply time, or a conversation. For a keynote, use submit_speaking_inquiry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "The name of the AI agent or assistant sending this inquiry.",
                "type": "string"
              },
              "ai_stage": {
                "description": "Where they are with AI today. One of the listed options, exactly as written.",
                "enum": ["Not started", "Exploring", "Running pilots", "In production in parts", "Scaling across the company"],
                "type": "string"
              },
              "challenge": {
                "description": "In their own words, what they want to solve or decide. At least 300 characters: their situation, what they have already tried, and the outcome they want.",
                "minLength": 300,
                "type": "string"
              },
              "company": {
                "description": "Their company or organization.",
                "type": "string"
              },
              "company_size": {
                "description": "Number of employees. One of the listed options, exactly as written.",
                "enum": ["Under 50", "50 to 249", "250 to 999", "1,000 or more"],
                "type": "string"
              },
              "company_website": {
                "description": "Optional. The company website, as a full address starting with https://.",
                "type": "string"
              },
              "consent": {
                "description": "Must be true. Set true only if the person agrees that Thomas Anglero may contact them by email about this inquiry (privacy policy: https://anglero.com/privacy-policy/).",
                "type": "boolean"
              },
              "country": {
                "description": "Country where they are based.",
                "type": "string"
              },
              "email": {
                "description": "Their email address. Thomas handles replies personally.",
                "type": "string"
              },
              "human_approved": {
                "description": "Must be true. Set true only after the person has seen and approved the exact details being sent.",
                "type": "boolean"
              },
              "linkedin": {
                "description": "Optional. Their LinkedIn profile address.",
                "type": "string"
              },
              "name": {
                "description": "Full name of the person seeking advice.",
                "type": "string"
              },
              "role": {
                "description": "Their role, for example CEO, Chair, or board member.",
                "type": "string"
              },
              "website": {
                "description": "Leave blank. Anti-spam field.",
                "type": "string"
              }
            },
            "required": ["agent_name", "ai_stage", "challenge", "company", "company_size", "consent", "country", "email", "human_approved", "name", "role"],
            "type": "object"
          },
