        {
          "name": "submit_speaking_inquiry",
          "title": "Submit a speaking inquiry",
          "description": "Send a speaking inquiry to Thomas Anglero. Requires six fields: name, email, phone, company or organization, event date, and a free-text message. Fold every other detail into the message in natural language: what Thomas should speak about, event location, format (in person, virtual, or pre-recorded), expected audience size, your role, and budget if any. Writes into the same pipeline as the website form: it records the inquiry and sends the confirmation and notification emails. Thomas replies promptly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The company or organization the inquiry is on behalf of.",
                "type": "string"
              },
              "email": {
                "description": "Contact email address.",
                "type": "string"
              },
              "event_date": {
                "description": "Event date, for example \"February 17, 2027\". If the date is not yet fixed, give the intended month or timeframe.",
                "type": "string"
              },
              "message": {
                "description": "A short free-text description of the event. Fold everything relevant into this one field in natural language: what you would like Thomas to speak about, event location, format (in person, virtual, or pre-recorded), expected audience size, your role at the company, and budget if you have one. Thomas reads this and replies with availability and a tailored proposal.",
                "type": "string"
              },
              "name": {
                "description": "Full name of the person making the inquiry.",
                "type": "string"
              },
              "phone": {
                "description": "Contact phone number, including country code if the event is outside Norway.",
                "type": "string"
              },
              "website": {
                "description": "Leave blank. Anti-spam field.",
                "type": "string"
              }
            },
            "required": ["company", "email", "event_date", "message", "name", "phone"],
            "type": "object"
          },
