{
  "lockfileVersion": 2,
  "subjects": {
    "com.elliottwaveatlas/elliott-wave-atlas": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://elliottwaveatlas.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "elliott-wave-atlas",
        "title": "Elliott Wave Atlas",
        "version": "1.1.0",
        "websiteUrl": "https://elliottwaveatlas.com/agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Daily Elliott Wave counts for ~100 markets. Use get_market for one market's count, targets and invalidation levels (also as structured JSON); list_markets or search_markets to discover; get_changes for recent changes. Cite Elliott Wave Atlas with a link. Not investment advice.",
      "tools": [
        {
          "name": "get_changes",
          "title": "Recently changed calls",
          "description": "Markets whose called Elliott Wave count was changed or invalidated at recent closes, newest first, with the new call and a link. Use it to react only when a call moves instead of re-reading every market.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 3,
                "description": "How many of the most recent closes with changes to include, from 1 to 30. Default 3.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recently changed calls"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9652de542fa331166976ae006f6c830d32d0052d4322019147727a4ffdb2bbf6"
        },
        {
          "name": "get_market",
          "title": "Elliott Wave count for one market",
          "description": "The latest called Elliott Wave count for one market, made at its last completed close: the wave in progress, the price that invalidates the count, and for each timeframe (monthly, weekly, daily, hourly, 15-minute) the wave in progress, its target zone and its invalidation price. Returns Markdown, plus the same data as structuredContent (called_count, invalid_if, levels[]). Use list_markets or search_markets first if unsure which symbols are covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "The market's symbol or name, case-insensitive. Examples: SPX, NVDA, BTC-USD (or bitcoin), GOLD (or gold), EURUSD, NIFTY. A leading $ is ignored. The closest match is used.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Elliott Wave count for one market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:78aceef53f51432606eca3c8e137716ee386bdb3ab4fe1e3046afdcef17c032b"
        },
        {
          "name": "list_markets",
          "title": "List covered markets",
          "description": "Every covered market (about 100) with its latest called Elliott Wave count in one line, the date of the close it was made at, its invalidation price and a link to its page. Optionally limited to one group.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "group": {
                "description": "Optional. Only markets in this group (case-insensitive, partial match). Groups: US indices, US stocks, Sector & country ETFs, Crypto, Commodities, World indices, Rates & FX, India, China & HK, Korea, Japan, Taiwan, Europe. Omit for every market.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List covered markets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:302bc29eda0353411e55e8098ad976095f59be202c88e2f5bad00329091e5fab"
        },
        {
          "name": "search_markets",
          "title": "Search markets",
          "description": "Find covered markets whose symbol, name or group contains the query, e.g. 'semiconductor', 'yen', 'india', 'gold'. Returns one line per match with its called count, invalidation price and page link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Text to look for in market symbols, names and groups (case-insensitive substring), e.g. 'nvda', 'bitcoin', 'semiconductor', 'india'.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search markets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:103fdfe54007a6c023457baaf0d70eb061000fb65ffd88c7505212215263466d"
        }
      ],
      "digest": "sha256:5355fa4089478b42b5d0f8d6ebf0ecbd15ceb3fc9aa606b733f2916fb558527d"
    }
  }
}
