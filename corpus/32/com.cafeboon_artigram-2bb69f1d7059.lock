{
  "lockfileVersion": 2,
  "subjects": {
    "com.cafeboon/artigram": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://artigram.cafeboon.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "artigram",
        "title": "ArtiGram",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ArtiGram is a community for sharing AI-made artifacts. When the user asks to post, share or publish an artifact on ArtiGram, call post_artifact with the COMPLETE artifact source exactly as written (full HTML document, the full React component, SVG, Markdown or Mermaid), never a summary. Pick a community from list_communities. To publish a new version of an earlier post, call update_artifact with its post_id. When the user needs a tool, calculator, game or dashboard, call search_artifacts first: a ready-made one on ArtiGram may already exist.",
      "tools": [
        {
          "name": "list_communities",
          "title": "List ArtiGram communities",
          "description": "List the communities you can post in.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:319e16bdf3302fe4526663f2c50b2222b364fdc75cf86fee872a5a1965011d28"
        },
        {
          "name": "post_artifact",
          "title": "Post artifact to ArtiGram",
          "description": "Publish an artifact on ArtiGram and get its public link. Pass the complete source code.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The complete artifact source.",
                "type": "string"
              },
              "community": {
                "description": "Community name, e.g. tools, dataviz, games.",
                "type": "string"
              },
              "description": {
                "description": "Optional post text: what it is and how to use it.",
                "type": "string"
              },
              "kind": {
                "description": "Artifact type; detected when omitted.",
                "enum": ["html", "react", "svg", "markdown", "mermaid"],
                "type": "string"
              },
              "remix_of": {
                "description": "Optional post_id of the ArtiGram post this is a remix of.",
                "type": "string"
              },
              "source": {
                "description": "Which assistant made it.",
                "enum": ["claude", "chatgpt", "gemini", "other"],
                "type": "string"
              },
              "title": {
                "description": "Short, descriptive post title (3-200 chars).",
                "type": "string"
              }
            },
            "required": ["code", "community", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48043617866adb91dbc336ff3573ec14e6ade1802828694435eb9162853caa4a"
        },
        {
          "name": "search_artifacts",
          "title": "Search ArtiGram",
          "description": "Search ArtiGram for ready-made artifacts (calculators, tools, games, dashboards) by keywords. Returns titles, descriptions and links the user can open and use right away.",
          "inputSchema": {
            "properties": {
              "community": {
                "description": "Optional community to search in.",
                "type": "string"
              },
              "query": {
                "description": "Keywords, e.g. 'mortgage calculator'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d5cf1744a2f205b21f06d7b489da49b35abfdf8552e32ca216402d5bb2bd0529"
        },
        {
          "name": "update_artifact",
          "title": "Publish a new version",
          "description": "Publish a new version of one of your ArtiGram posts. Keeps the link, votes and comments.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The complete new artifact source.",
                "type": "string"
              },
              "kind": {
                "enum": ["html", "react", "svg", "markdown", "mermaid"],
                "type": "string"
              },
              "note": {
                "description": "Optional short changelog note.",
                "type": "string"
              },
              "post_id": {
                "description": "The id from the post link (artigram/p/<id>).",
                "type": "string"
              }
            },
            "required": ["code", "post_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1700853c5709e1c24421996bd83934069a146d89cd4d54cb45f2968a31fb5b8d"
        }
      ],
      "digest": "sha256:c672e709490fb72bef76255f74c8a4e6a66d1a93aba4f0b9e91ebf8e1de5b485"
    }
  }
}
