        {
          "name": "solicitar_estimado",
          "title": "Solicitar estimado / Request an estimate",
          "description": "ES: Envía una solicitud de estimado REAL a un negocio de servicios (contractor: pisos, plomería, pintura, limpieza…) — el negocio recibe notificación y puede llamar al cliente al teléfono dado. / EN: Sends a REAL estimate request to a services business (contractor: flooring, plumbing, painting, cleaning…) — the business is notified and may call the customer at the given phone.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "descripcion": {
                "description": "Qué trabajo necesita el cliente / What work the customer needs",
                "maxLength": 2000,
                "minLength": 5,
                "type": "string"
              },
              "direccion": {
                "description": "Dirección donde se haría el trabajo / Job address",
                "maxLength": 300,
                "minLength": 5,
                "type": "string"
              },
              "fechaPreferida": {
                "description": "Fecha preferida YYYY-MM-DD / Preferred date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "nombre": {
                "description": "Nombre del cliente / Customer name",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "servicio": {
                "description": "Servicio de interés (como sale en ver_negocio) / Service of interest",
