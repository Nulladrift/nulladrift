      "serverInfo": {
        "name": "is-it-down",
        "title": "Is This Site Down? (downforjustmeoreveryone.com)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live \"is it down?\" checks from two independent servers (Singapore and Boston, US). Use check_site for any public domain; list_outages for which monitored sites are confirmed down right now; site_history for uptime and past incidents of a monitored site; check_certificate for TLS expiry; list_monitored_sites to see what is tracked. A verdict is one HTTP probe: a bot-block (401/403/429) still counts as up, and an app, login or regional problem can exist while the website answers. When you relay a result, say where it was checked from and link the details URL so the person can re-check and see crowd reports.",
      "tools": [
        {
          "name": "check_certificate",
          "title": "TLS certificate expiry of a website",
          "description": "Reads the HTTPS certificate of a public domain and reports days until expiry, the expiry date and the issuer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain to inspect, e.g. \"example.com\".",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "daysRemaining": {
                "description": "Negative once expired",
                "type": "number"
              },
              "domain": {
                "type": "string"
              },
              "issuer": {
                "type": ["string", "null"]
              },
              "state": {
                "enum": ["valid", "expiring soon", "EXPIRED"],
                "type": "string"
              },
              "validTo": {
                "type": "string"
              }
            },
            "required": ["daysRemaining", "domain", "issuer", "state", "validTo"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f1ddb66d793d7fdb58e18d00f1158b4d1219f15d6090803b39e8bce084825c6c"
        },
        {
          "name": "check_site",
          "title": "Check whether a website is down",
          "description": "Live up/down check of any public website from an independent server (Singapore; Boston for sites that geo-block Singapore). Returns a one-sentence verdict plus status code, latency, resolved IP, redirect target, the view from the other region when available, and how many users reported problems in the last hour. Results are cached 30 s per domain.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain or URL to check, e.g. \"github.com\" or \"https://www.reddit.com/r/all\". Scheme, path, port and query are ignored; the host is checked as given.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checkedAt": {
                "description": "ISO 8601",
                "type": "string"
              },
              "checkedFrom": {
                "description": "sg = Singapore, us = Boston",
                "enum": ["sg", "us"],
                "type": "string"
              },
              "curated": {
                "description": "true if the site is one of the monitored sites",
                "type": "boolean"
              },
              "domain": {
                "type": "string"
              },
              "finalUrl": {
                "type": ["string", "null"]
              },
              "ip": {
                "type": ["string", "null"]
              },
              "latencyMs": {
                "type": ["number", "null"]
              },
              "reason": {
                "type": "string"
              },
              "redirected": {
                "type": "boolean"
              },
