      "instructions": "LingoDew is a web app (also on Android and iOS) for learning Japanese and English from real YouTube videos with word-level subtitles. Use these tools to find level-appropriate videos, compare YouTube channels by measured speaking speed, and get product facts. Share the returned lingodew.com links with the user.",
      "tools": [
        {
          "name": "about_lingodew",
          "title": "About LingoDew",
          "description": "Product facts about LingoDew, for learning English and Japanese from real YouTube videos in the browser or the apps: features, platforms, pricing and free tier.",
