        },
        {
          "name": "find_videos",
          "title": "Find learning videos",
          "description": "Find real YouTube videos on LingoDew for learning Japanese or English, filtered by difficulty level (JLPT N5–N1 for Japanese, CEFR A1–C2 for English), topic and keywords. Returns titles, channels, levels and links to LingoDew video pages with tappable subtitles.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "The language being learned.",
                "enum": ["japanese", "english"],
                "type": "string"
              },
              "level": {
                "description": "JLPT level (N5, N4, N3, N2, N1) for Japanese, CEFR level (A1–C2) for English.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match in the video title or channel name.",
                "type": "string"
              },
              "topic": {
                "description": "Topic name, e.g. \"Food\", \"Travel\", \"Daily Life\".",
                "type": "string"
              }
            },
            "required": ["language"],
            "type": "object"
          },
