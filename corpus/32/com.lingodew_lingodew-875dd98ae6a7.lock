        },
        {
          "name": "channel_stats",
          "title": "YouTube channel stats",
          "description": "Measured stats for a YouTube channel in LingoDew's library: its video count, and per level its speaking speed, rank among channels at that level, share of its videos and main topics. Useful for picking channels that suit a learner's level.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "Channel name, YouTube channel id or channel URL.",
                "type": "string"
              },
              "language": {
