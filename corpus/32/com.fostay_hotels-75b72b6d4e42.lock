{
  "lockfileVersion": 2,
  "subjects": {
    "com.fostay/hotels": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fostay.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fostay",
        "version": "2.2.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Fostay is an agent-bookable hotel store for Dubai, Abu Dhabi, Goa, Sydney, Melbourne, Auckland, Singapore, Madrid and Barcelona: live all-in prices (AED for the UAE, INR for Goa, AUD, NZD, SGD or EUR for the other cities, or another active currency via the currency option; in the UAE taxes are included, in Goa GST is counted and any part the hotel collects at check-in is itemised) and a demand calendar of dates when UAE hotels sell out. Booking flow: search_stays → get_live_rates (pick an offer_id) → confirm guest name + email with your user → prepare_booking (holds the rate, returns a payment_url) → the human pays in one tap on fostay.com → booking_status to verify. The price quoted is the price charged, in the currency quoted. Never guess guest details; always confirm the final price from prepare_booking before sending the human to pay. Check demand_calendar before recommending UAE dates.",
      "tools": [
        {
          "name": "booking_status",
          "title": "Check a Fostay booking's status",
          "description": "Verify a completed booking: confirmation status, hotel confirmation code, stay and price. Requires the Fostay booking id AND the guest email it was booked under (both are in the guest's confirmation). Use after the human pays via a prepare_booking link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "booking_id": {
                "description": "Fostay booking id, e.g. uzYG5ZTt9",
                "maxLength": 40,
                "minLength": 4,
                "type": "string"
              },
              "guest_email": {
                "description": "Guest email on the booking",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              }
            },
            "required": ["booking_id", "guest_email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:524cb6f31884d56aa431e741821d3448ccce081e5514da7c86ce5b3ee96c0eb3"
        },
        {
          "name": "demand_calendar",
          "title": "UAE hotel demand calendar",
          "description": "Fostay's editorial demand calendar (UAE only — Dubai and Abu Dhabi; Goa has no event calendar yet): the upcoming date windows where Dubai and Abu Dhabi hotels predictably spike or sell out (GITEX, F1, NYE, Eid, school breaks...), each with a suggested book-by deadline. Use it to warn users about expensive dates or find event stays.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "Filter by city (default: both)",
                "enum": ["Dubai", "Abu Dhabi"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e5d1a29aaf12eb342e8b8281ea13a77564f6e3fff2a6fe5a5ef1501f6727c5ce"
        },
        {
          "name": "event_stays",
          "title": "Hotels for a major event, ranked by distance to the venue",
          "description": "Where to stay for a major UAE event, in one call: hotels grouped by distance to the venue (at the venue, nearby, rest of the city), each with live all-in prices for the event's own dates, whether rooms were found, refundability and a link that opens the hotel on those dates. Use it for questions like 'best hotels for the Abu Dhabi Grand Prix / F1', 'where to stay near Yas Marina Circuit' or 'is the F1 weekend sold out'. Currently supports: abu-dhabi-f1-2026, abu-dhabi-f1-2027 (the Abu Dhabi Grand Prix at Yas Marina Circuit: 3-7 December 2026 and 9-13 December 2027). Also returns Fostay's editorial advice for the event and when to book. To book a hotel, pass its hotel_id and an offer from get_live_rates to prepare_booking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Adults for the live prices (default 2)",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "currency": {
                "description": "Currency to quote in (AED, INR, EUR, AUD, SGD, NZD). Defaults to the hotel's home currency: INR for Goa, AED for Dubai and Abu Dhabi, AUD for Sydney and Melbourne, NZD for Auckland, SGD for Singapore, EUR for Madrid and Barcelona. The price quoted is the price charged.",
                "enum": ["AED", "INR", "EUR", "AUD", "SGD", "NZD"],
                "type": "string"
              },
              "event": {
                "description": "Event to rank hotels for (default: the next one still ahead)",
                "enum": ["abu-dhabi-f1-2026", "abu-dhabi-f1-2027"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://fostay/stays.html",
            "openai/toolInvocation/invoked": "Hotels for the event",
            "openai/toolInvocation/invoking": "Checking hotels near the venue…",
            "ui": {
              "resourceUri": "ui://fostay/stays.html"
            }
          },
          "digest": "sha256:c7207a4c6b96eeda72a8a99b6e252adda695a75baa88426ba2db0c70f09a8a4e"
        },
        {
          "name": "get_live_rates",
          "title": "Live room rates for a hotel",
          "description": "Live bookable room offers for one hotel and stay dates: total all-in price (in the hotel's home currency: INR for Goa, AED for Dubai and Abu Dhabi, AUD, NZD, SGD or EUR for the other cities, or the currency you pass), board (breakfast etc.), refundability and exact free-cancellation deadlines. For Goa, total_all_in counts GST, and any part the hotel collects at check-in is itemised separately (collected_by_hotel_at_checkin). The booking_url takes a human straight to this hotel on fostay.com to complete the booking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Adult guests (default 2)",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "Check-in date, YYYY-MM-DD",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date, YYYY-MM-DD",
                "type": "string"
              },
              "children": {
                "description": "Children's ages at check-in, e.g. [7, 9]. IMPORTANT for families: child-inclusive rates price kids' breakfast and extras upfront — always pass ages when children travel.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 4,
                "type": "array"
              },
              "currency": {
                "description": "Currency to quote in (AED, INR, EUR, AUD, SGD, NZD). Defaults to the hotel's home currency: INR for Goa, AED for Dubai and Abu Dhabi, AUD for Sydney and Melbourne, NZD for Auckland, SGD for Singapore, EUR for Madrid and Barcelona. The price quoted is the price charged.",
                "enum": ["AED", "INR", "EUR", "AUD", "SGD", "NZD"],
                "type": "string"
              },
              "hotel_id": {
                "description": "Hotel id from search_stays (e.g. lp6556acf7)",
                "maxLength": 40,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["checkin", "checkout", "hotel_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://fostay/rates.html",
            "openai/toolInvocation/invoked": "Live all-in rates",
            "openai/toolInvocation/invoking": "Checking live rates…",
            "ui": {
              "resourceUri": "ui://fostay/rates.html"
            }
          },
          "digest": "sha256:fe261cbf22edd5eb3912a1177ca61438450e368b13fd94c99ea10b4df6efc139"
        },
        {
          "name": "prepare_booking",
          "title": "Hold a rate and get a payment link",
          "description": "Books everything except the payment: holds the chosen offer (real prebook — the price is locked while the hold lasts), registers the guest details, and returns a payment_url. The human opens that link, sees the exact stay summary, and pays in one step — the agent never handles card details. Confirm the guest's name and email with the user before calling. If the held price differs from what you quoted, this returns the final price and any change warnings — tell the user before sending them to pay.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent_name": {
                "description": "Your client name for attribution, e.g. 'claude' or 'chatgpt'",
                "maxLength": 40,
                "type": "string"
              },
              "guest_email": {
                "description": "Guest's email — booking confirmation goes here",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "guest_first_name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "guest_last_name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "guest_phone": {
                "maxLength": 32,
                "type": "string"
              },
              "offer_id": {
                "description": "offer_id from get_live_rates",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["guest_email", "guest_first_name", "guest_last_name", "offer_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://fostay/handoff.html",
            "openai/toolInvocation/invoked": "Rate held — ready to pay",
            "openai/toolInvocation/invoking": "Holding this rate…",
            "ui": {
              "resourceUri": "ui://fostay/handoff.html"
            }
          },
          "digest": "sha256:29de10c38f12faba636c42b856899e4add904dbfbfdb59371ce2c20b626ef16a"
        },
        {
          "name": "search_stays",
          "title": "Search hotels in Dubai, Abu Dhabi, Goa, Sydney, Melbourne, Auckland, Singapore, Madrid or Barcelona (Fostay)",
          "description": "Search hotels in Dubai, Abu Dhabi, Goa, Sydney, Melbourne, Auckland, Singapore, Madrid or Barcelona. For Sydney, Melbourne, Auckland, Singapore, Madrid and Barcelona, returns the city's best guest-rated 4–5★ hotels (any hotel when searched by name), with live all-in prices when checkin and checkout are given (in the city's own currency: AUD, NZD, SGD or EUR, or another Fostay can charge), a fostay_url that opens each hotel on those dates, the city's areas, and links to Fostay's pages for it (where to stay by area, hotels with harbour views or a pool, venues). For Dubai and Abu Dhabi, returns Fostay's hand-curated edit first (8 flagship stays with editorial verdicts), then catalog matches (~2,000 bookable hotels). For Goa, returns the best-reviewed hotels and resorts (hostels and homestays only when searched by name), optionally narrowed to one area. For Dubai and Abu Dhabi, pass checkin and checkout to get live all-in prices for the shortlist in the same call (from_total_all_in, from_per_night, refundable, rooms_available), a fostay_url that opens each hotel on those exact dates, and any major event (F1, GITEX, National Day, NYE...) those dates fall in. Without dates, use get_live_rates for prices. For the Abu Dhabi Grand Prix call event_stays instead: it ranks hotels by distance to the circuit. Results include a fostay_url where a human can view photos, live rates and book.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Adults for the live prices (default 2)",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "area": {
                "description": "Goa only: narrow to one area — candolim-calangute-baga (Candolim, Calangute & Baga); anjuna-vagator (Anjuna, Vagator & Assagao); morjim-mandrem-arambol (Morjim, Mandrem, Arambol & Siolim); panaji-old-goa (Panaji & Old Goa); south-goa-beaches (Colva, Benaulim, Varca & Cavelossim); palolem-agonda (Palolem & Agonda)",
                "enum": ["candolim-calangute-baga", "anjuna-vagator", "morjim-mandrem-arambol", "panaji-old-goa", "south-goa-beaches", "palolem-agonda"],
                "type": "string"
              },
              "checkin": {
                "description": "Not for Goa: check-in date YYYY-MM-DD. With checkout, the results carry live prices for the stay.",
                "type": "string"
              },
              "checkout": {
                "description": "Not for Goa: check-out date YYYY-MM-DD (pass with checkin).",
                "type": "string"
              },
              "city": {
                "description": "City or destination to search",
                "enum": ["Dubai", "Abu Dhabi", "Goa", "Madrid", "Barcelona", "Sydney", "Melbourne", "Singapore", "Auckland"],
                "type": "string"
              },
              "currency": {
                "description": "Currency to quote in (AED, INR, EUR, AUD, SGD, NZD). Defaults to the hotel's home currency: INR for Goa, AED for Dubai and Abu Dhabi, AUD for Sydney and Melbourne, NZD for Auckland, SGD for Singapore, EUR for Madrid and Barcelona. The price quoted is the price charged.",
                "enum": ["AED", "INR", "EUR", "AUD", "SGD", "NZD"],
                "type": "string"
              },
              "limit": {
                "description": "Max catalog results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_rating": {
                "description": "Minimum guest rating on a 10 scale, e.g. 8",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Optional hotel-name filter, e.g. 'Atlantis' or 'Rove'",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://fostay/stays.html",
            "openai/toolInvocation/invoked": "Here's what Fostay has",
            "openai/toolInvocation/invoking": "Searching Fostay's stays…",
            "ui": {
              "resourceUri": "ui://fostay/stays.html"
            }
          },
          "digest": "sha256:bc1400924a6ce14d4ce75250d5f87f2c587036d0cb4b7f56c308fa9c9c249cc9"
        },
        {
          "name": "when_to_go",
          "title": "Best-value upcoming weekends",
          "description": "Prices upcoming weekends (Fri–Sun, 2 nights) to find the cheapest times to stay. Pass hotel_id for one hotel across ~8 weekends, or just a city to compare Fostay's curated stays (Dubai, Abu Dhabi) or top-rated Goa hotels across the next ~6 weekends. Cheapest options first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "Used when hotel_id is omitted",
                "enum": ["Dubai", "Abu Dhabi", "Goa"],
                "type": "string"
              },
              "currency": {
                "description": "Currency to quote in (AED, INR, EUR, AUD, SGD, NZD). Defaults to the hotel's home currency: INR for Goa, AED for Dubai and Abu Dhabi, AUD for Sydney and Melbourne, NZD for Auckland, SGD for Singapore, EUR for Madrid and Barcelona. The price quoted is the price charged.",
                "enum": ["AED", "INR", "EUR", "AUD", "SGD", "NZD"],
                "type": "string"
              },
              "hotel_id": {
                "description": "Optional hotel id from search_stays",
                "maxLength": 40,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f5d856933a37d1f470ec232a96c0e3c3f07f90df71d6ecf964ed740c6fb76877"
        }
      ],
