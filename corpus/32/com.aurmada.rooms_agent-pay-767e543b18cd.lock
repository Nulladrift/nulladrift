                "description": "YYYY-MM",
                "type": "string"
              },
              "room_id": {
                "description": "Room id from create_room",
                "type": "string"
              }
            },
            "required": ["room_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2c56934105420a9a3b464700ab5f6bc585463a240476959d9388a3ddbf79f150"
        }
      ],
