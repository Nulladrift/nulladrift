      "serverInfo": {
        "name": "rooms-agent-pay",
        "title": "Rooms Agent Pay (sandbox)",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Rooms Agent Pay, PayPal SANDBOX (no real money). create_room -> human pays pay_url -> hire_specialist / approve_hire -> room_status. Unspent budget stays as room credit; close_room keeps it; request_refund asks for it back within the refund window.",
      "tools": [
        {
          "name": "approve_hire",
          "description": "Approve a hire that is over the approval line; it then runs and is paid from the room balance after verification.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hire_id": {
                "type": "string"
              },
              "owner_key": {
                "description": "Owner key returned by create_room (keep it private)",
                "type": "string"
              },
              "room_id": {
                "description": "Room id from create_room",
                "type": "string"
              }
            },
            "required": ["hire_id", "owner_key", "room_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f29ee9666f1cc5941e52fc3dbdd970686ccadbe17fad057db1c75cac2bad848"
        },
        {
          "name": "close_room",
          "description": "Close the current mission. The unspent balance stays in the room as credit for next time (no automatic refund).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "owner_key": {
                "description": "Owner key returned by create_room (keep it private)",
                "type": "string"
              },
              "room_id": {
                "description": "Room id from create_room",
                "type": "string"
              }
            },
            "required": ["owner_key", "room_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf8e031f6f63a211ba2cb81977bb4162b635512fb1f75e21b9d2074f2f7f0dd3"
        },
        {
          "name": "create_room",
          "description": "Open a Rooms Agent Pay room for a goal with a budget (USD) and an approval line. Returns one ready-to-pay link the human opens to fund it with PayPal or a card (SANDBOX: no real money). Unspent budget stays in the room as credit for the next hire.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "approval_line": {
                "description": "Hires above this USD amount wait for the owner's OK",
                "type": "number"
              },
              "cap": {
                "description": "Budget in USD to put in the room (minimum applies, e.g. 25)",
                "type": "number"
              },
              "email": {
                "description": "Funder email (optional; first room's fee is waived for a new email)",
                "type": "string"
              },
              "goal": {
                "description": "What the room should get done",
                "type": "string"
              }
            },
            "required": ["cap", "goal"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:23889cead01fe3ee4c59fa2a57a8cf76efc4f77308b567de99aec09b81f567df"
        },
        {
          "name": "decline_hire",
          "description": "Decline a hire that is waiting for approval. No money moves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hire_id": {
                "type": "string"
              },
              "owner_key": {
                "description": "Owner key returned by create_room (keep it private)",
                "type": "string"
              },
              "room_id": {
                "description": "Room id from create_room",
                "type": "string"
              }
            },
            "required": ["hire_id", "owner_key", "room_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:812a52fa6e89f2cffba34b2e518aac51413d491ff252e456fc9a68e880aacbed"
        },
        {
          "name": "hire_specialist",
          "description": "Hire a house specialist (research, copy or design) for a brief, paid from the room balance. Runs immediately and settles after verification, unless the price is over the approval line (then it waits for approve_hire).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "Exactly what to deliver",
                "type": "string"
              },
              "max_price": {
                "description": "Max USD for this hire",
                "type": "number"
              },
              "owner_key": {
                "description": "Owner key returned by create_room (keep it private)",
                "type": "string"
              },
              "room_id": {
                "description": "Room id from create_room",
                "type": "string"
              }
            },
            "required": ["brief", "owner_key", "room_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f3beb6fbe7f4a5a7d80f671182fbc78c9871c7935416fa694057c283a99882d"
        },
        {
          "name": "request_refund",
          "description": "Owner asks for the refundable balance back (within the refund window of funding, minus the PayPal processing fee). Reviewed and approved manually by Rooms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "owner_key": {
                "description": "Owner key returned by create_room (keep it private)",
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "room_id": {
                "description": "Room id from create_room",
                "type": "string"
              }
            },
            "required": ["owner_key", "room_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c219b0d94df646718bd783a8fe687ab44edd83b8021cdb77adcad4d27fe7e92"
        },
        {
          "name": "room_status",
          "description": "Room balance, spent, fees, refundable amount, hires and the latest transcript lines.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "room_id": {
                "description": "Room id from create_room",
                "type": "string"
              }
            },
            "required": ["room_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b263114e2be416878d886d8a7cc0e44507b0b285ee6d051b2d86e8e3903e4ca"
        },
        {
          "name": "sandbox_fund_with_test_card",
          "description": "SANDBOX ONLY: fund the room headlessly with a PayPal sandbox test card (for automated tests). Disabled in live mode.",
          "inputSchema": {
