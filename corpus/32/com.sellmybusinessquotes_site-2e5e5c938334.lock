        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to Sell My Business Quotes (two steps; not a purchase)",
          "description": "Submits an enquiry to Sell My Business Quotes: NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token; show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before the Sell My Business Quotes team sees it. Consent means the person has read and agreed to: \"By submitting you agree your enquiry goes to Ellul Solutions Ltd (company 17364530), the business brokerage behind Sell My Business Quotes, which may contact you about it. With your agreement it may introduce you to buyers, brokers or advisers for the sale or purchase of a whole business. It introduces only: it does not give investment advice, negotiate a share sale for you, hold money or arrange finance.\"",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "the person's answers, keyed by field key",
                "type": "object"
              },
              "confirmation": {
                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: By submitting you agree your enquiry goes to Ellul Solutions Ltd (company 17364530), the business brokerage behind Sell My Business Quotes, which may contact you about it. With your agreement it may introduce you to buyers, brokers or advisers for the sale or purchase of a whole business. It introduces only: it does not give investment advice, negotiate a share sale for you, hold money or arrange finance.",
                "type": "boolean"
              }
            },
            "required": ["answers", "consent"],
            "type": "object"
          },
