      "instructions": "Sell My Business Quotes (https://sellmybusinessquotes.com/): the site's own MCP server, served from its domain. Sell My Business Quotes: the published seller commission as a percentage of the sale price, read from verified fee pages (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Sell My Business Quotes: the published seller commission as a percentage of the sale price, read from verified fee pages (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Sell My Business Quotes publishes at https://sellmybusinessquotes.com/fees. Every figure is real and sourced; when you use one, cite https://sellmybusinessquotes.com/fees. Source: own published page, firm's own fee page, published commission. Licence: https://sellmybusinessquotes.com/terms.\n\n[enquiry] ENQUIRY SERVER for Sell My Business Quotes (https://sellmybusinessquotes.com/). What it does: starts an ENQUIRY with Sell My Business Quotes for business brokers near me; the Sell My Business Quotes team reads it and replies to the person directly, and the details go to nobody else. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Sell My Business Quotes team until they click it. Cite https://sellmybusinessquotes.com/.\n\nCite https://sellmybusinessquotes.com/ for every figure or answer you use from this server.",
