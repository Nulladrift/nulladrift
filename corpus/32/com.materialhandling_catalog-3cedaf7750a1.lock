{
  "lockfileVersion": 2,
  "subjects": {
    "com.materialhandling/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://materialhandling-7c6.pages.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "materialhandling",
        "title": "MaterialHandling.com Store",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MaterialHandling.com — US industrial & warehouse equipment (38,000+ products: lift tables, pallet jacks, dock equipment, casters, hoists, carts, shelving). Search products, get full specs and pricing, fetch live freight rates to a US ZIP, and create real quote requests handled by human sales specialists. Phone: (847) 278-2311.",
      "tools": [
        {
          "name": "create_quote_request",
          "description": "Create a real quote request in the MaterialHandling.com sales system. A human equipment specialist prices it (volume pricing + freight) and emails the finished quote, usually within one business day. Use when the customer wants formal/volume pricing. Requires the customer's real name and email — always confirm these with the customer before calling. Returns the quote number. Rate-limited to 5/hour.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company name (optional)",
                "type": "string"
              },
              "email": {
                "description": "Customer email (the finished quote is sent here)",
                "type": "string"
              },
              "items": {
                "description": "Requested products",
                "items": {
                  "properties": {
                    "qty": {
                      "description": "Quantity (default 1)",
                      "type": "number"
                    },
                    "sku": {
                      "description": "SKU/MPN, or descriptive text if SKU unknown",
                      "type": "string"
                    }
                  },
                  "required": ["sku"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "description": "Notes for the sales team (destination ZIP, timeline, requirements)",
                "type": "string"
              },
              "name": {
                "description": "Customer full name",
                "type": "string"
              },
              "phone": {
                "description": "Phone number (optional)",
                "type": "string"
              }
            },
            "required": ["email", "items", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce62c8d97976c0e8a116b33c78bd1e755bcf679546fbc3ae106de4876c369216"
        },
        {
          "name": "get_categories",
          "description": "The product category tree with live product counts. Category paths can be browsed on the website at https://materialhandling.com/{path}/.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a74b49d3293346c9eb020487b27e9e701f345f4694d3900c53d45f5a5084d1fa"
        },
        {
          "name": "get_freight_estimate",
          "description": "Live LTL freight rates to a US ZIP code for one or more products — real carrier pricing (the same engine the website checkout uses). Returns carrier, service, transit days and price. Rate-limited to 10 calls/hour. Items that qualify for parcel (UPS) shipping or that need a custom quote are flagged.",
          "inputSchema": {
            "properties": {
              "items": {
                "description": "Products to ship",
                "items": {
                  "properties": {
                    "qty": {
                      "description": "Quantity (default 1)",
                      "type": "number"
                    },
                    "sku": {
                      "description": "Product SKU or MPN",
                      "type": "string"
                    }
                  },
                  "required": ["sku"],
                  "type": "object"
                },
                "type": "array"
              },
              "liftgate": {
                "description": "Liftgate at delivery (no dock)",
                "type": "boolean"
              },
              "residential": {
                "description": "Residential delivery address",
                "type": "boolean"
              },
              "zip": {
                "description": "Destination US ZIP code (5 digits)",
                "type": "string"
              }
            },
            "required": ["items", "zip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4bec9627b72e58bae5f0d2e4b13be396ffd36cbd9469757568b3ac0de9ca3cc0"
        },
        {
          "name": "get_product",
          "description": "Full detail for one product by SKU, model number (MPN) or product slug: pricing (incl. volume tiers), stock status, lead time in business days, full manufacturer specifications, images and product page URL.",
          "inputSchema": {
            "properties": {
              "sku": {
                "description": "SKU, MPN or product slug",
                "type": "string"
              }
            },
            "required": ["sku"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a7760e7fb60fa4c49654e689e2a7955561d6026c5c9610c75776f2114923eaf1"
        },
        {
          "name": "search_products",
          "description": "Search the MaterialHandling.com catalog (38,000+ industrial products: lift tables, pallet jacks, casters, dock equipment, hoists, cranes, carts, shelving and more from Vestil, Valley Craft and other brands). Returns name, SKU, price, availability, lead time (business days) and product URL. Use get_product for full specs.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results, 1-25 (default 10)",
                "type": "number"
              },
              "query": {
                "description": "Search terms, e.g. \"electric lift table 2000 lbs\" or a SKU/model number",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9905118afcbdf3f079faba3f287ecf671e0a6030acd36050374fe19f46fc2253"
        }
      ],
      "digest": "sha256:f6291c9868a6fb3a6ca5fdc4b5e741c0841f7e6065a8c6a20131805349e5aa5a"
    }
  }
}
