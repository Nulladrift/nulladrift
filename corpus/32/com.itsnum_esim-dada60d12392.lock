{
  "lockfileVersion": 2,
  "subjects": {
    "com.itsnum/esim": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.itsnum.com/api/esim/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "num-esim",
        "title": "NUM Travel eSIM",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Find a data eSIM with esim_find_plans, and ask the person before esim_start_checkout. Give the person the checkout link. They open it, confirm their phone number in NUM, then pay on Stripe. The install code is shown to the person on their own order page and emailed to them, so you will never receive it. Never say an eSIM is bought until esim_order_status says it is ready.",
      "tools": [
        {
          "name": "esim_find_plans",
          "title": "Find eSIM plans",
          "description": "Find NUM data eSIM plans for a country, city, airport code or region, with one recommended plan for the trip. Read only. Prices are in US dollars. Plans are data only, with no phone number.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Length of the trip in days. Defaults to 14.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "destination": {
                "description": "A country, city, airport code or region, such as Japan, Bali, BKK or Europe.",
                "type": "string"
              },
              "use": {
                "description": "How the phone will be used. light: maps and messages. regular: social and photos. heavy: video and hotspot.",
                "enum": ["light", "regular", "heavy"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3ee320bc2e8d9f9fab608cc4f4955079b1b30c43a50dc12bef38a456446ce06"
        },
        {
          "name": "esim_order_status",
          "title": "Check eSIM order",
          "description": "Check an order started with esim_start_checkout: waiting for verification, waiting for payment, paid, or ready in NUM. Never returns an install code.",
          "inputSchema": {
            "properties": {
              "order_ref": {
                "description": "The order_ref from esim_start_checkout.",
                "type": "string"
              }
            },
            "required": ["order_ref"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3a0c6b0508ff4965de0d48be94f78a0f4c557b878316583b431d40e4a6e831b"
        },
        {
          "name": "esim_start_checkout",
          "title": "Start eSIM checkout",
          "description": "Start an order for a plan from esim_find_plans and get a checkout link for the person. Nothing is charged here. The person must open the link, confirm their phone number in NUM, and pay on Stripe themselves. Ask the person before calling this.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "The same destination used to find the plan.",
                "type": "string"
              },
              "plan_id": {
                "description": "A plan id from esim_find_plans.",
                "type": "string"
              }
            },
            "required": ["destination", "plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:02470be1a59aa94ee35146816e3eb876e958b030533775d0e7861726727337cd"
        }
      ],
      "digest": "sha256:17298a513af643c41e6377b55e88d51f9969ad93a09a5dc614f902c6c90555a8"
    }
  }
}
