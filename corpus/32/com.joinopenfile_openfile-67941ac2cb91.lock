        {
          "name": "plan_task",
          "title": "Plan task",
          "description": "The questions behind anything a person does here, with the options for each, the rules, and what only the person can do: form a company, check on an order, add-ons, file a trademark, check a name, check on a filing, office action replies, statements of use, extensions, Section 8 and 15, renewals, assignments, owner updates. task: a key or the person's words; leave it out for the list. Changes nothing.",
          "inputSchema": {
