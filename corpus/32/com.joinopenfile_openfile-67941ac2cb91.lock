        {
          "name": "create_application",
          "title": "Create application",
          "description": "Saves a draft trademark application and returns review_url for the owner, who checks it and signs. Nothing goes to the attorney or the USPTO until they do. Every field is optional; issues lists what's left. The response holds the token that later calls need.",
          "inputSchema": {
            "properties": {
              "basis": {
                "description": "`use`: already selling under the mark. `itu`: planning to, with a real intent.",
                "enum": ["use", "itu"],
                "type": "string"
              },
              "classes": {
                "description": "The classes to file in, 1 to 10.",
                "items": {
                  "properties": {
                    "number": {
                      "description": "Nice class number, 1 to 45.",
                      "maximum": 45,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "wording": {
                      "description": "Goods and services wording, with every `[blank]` filled in.",
                      "maxLength": 2000,
                      "type": "string"
                    }
                  },
                  "required": ["number", "wording"],
                  "type": "object"
                },
                "type": "array"
              },
              "description": {
                "description": "What's sold under the mark, in the person's words.",
                "maxLength": 2000,
                "type": "string"
              },
              "first_use": {
                "description": "With `use`: first used anywhere, as `YYYY-MM` or `YYYY-MM-DD`.",
                "type": "string"
              },
              "first_use_in_commerce": {
                "description": "With `use`: first sold across state lines, as `YYYY-MM` or `YYYY-MM-DD`.",
                "type": "string"
              },
              "kind": {
                "description": "What the mark is. A logo is filed as words first.",
                "enum": ["name", "slogan", "logo"],
                "type": "string"
              },
              "mark": {
                "description": "The name, slogan or wording to protect, exactly as the person wants it.",
                "maxLength": 120,
                "type": "string"
