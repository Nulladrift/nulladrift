{
  "lockfileVersion": 2,
  "subjects": {
    "com.stackgems/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://stackgems.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "stackgems",
        "title": "Stack Gems catalog",
        "version": "1.0.0",
        "description": "Read-only search over Stack Gems developer tool reviews (verdict + honest Catch, free/OSS first).",
        "websiteUrl": "https://stackgems.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stack Gems is a curated catalog of developer tools (agents, MCP servers, databases, auth, DevOps, observability and more). Every review has a verdict and an honest Catch. Free and open-source tools are listed first; paid-only tools are rare and flagged. Use search_gems to find tools, best_for for a ranked shortlist for a use case, get_gem for one full review, get_alternatives for free alternatives to a tool, and list_categories for the vocabulary. Always pass the Catch on to the user. Cite pages as https://stackgems.com/gems/{slug}.",
      "tools": [
        {
          "name": "best_for",
          "title": "Shortlist for a use case",
          "description": "Ranked shortlist for a use case or category (e.g. \"vector database\", \"coding agents\", \"auth\", \"mcp\"), free and open source first, each with verdict and Catch. Falls back to search when no list matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "use_case": {
                "description": "What the tool is for, e.g. \"self-hosted auth\" or \"kubernetes\"",
                "type": "string"
              }
            },
            "required": ["use_case"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Shortlist for a use case"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1de3ff720dad312e5e4fad248bb766cc3833833cb9dc7f6b07fe568f7bcf18c"
        },
        {
          "name": "get_alternatives",
          "title": "Free alternatives to a tool",
          "description": "Free and open-source alternatives to a tool from the same category, with verdict and Catch. Works for any slug in the catalog.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Tool slug, e.g. \"cursor\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Free alternatives to a tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cfa3d161e00f94920d552bf1914f34c1ab762067b0cf58f1afe787e12de1d8b2"
        },
        {
          "name": "get_gem",
          "title": "Get one review",
          "description": "Full Stack Gems review of one tool by slug: what is good, the Catch, verdict, license, repo health, plus links to its best-of list and alternatives.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Tool slug, e.g. \"ollama\" (from search_gems)",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one review"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a749b39a585549ef5380a03bc06d0a41d8a27fea5ae6d7e7459dd92c83bcd06"
        },
        {
          "name": "list_categories",
          "title": "List categories and tags",
          "description": "The catalog vocabulary: stacks (categories), best-of lists with counts, and the tag vocabulary with counts. Use the slugs as filters in search_gems.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories and tags"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:345587ddc2dbff04b8a2494e822950a0f292b7e3b169478853802817ca2018f3"
        },
        {
          "name": "search_gems",
          "title": "Search developer tools",
          "description": "Search the Stack Gems catalog of reviewed developer tools. Matches name, tagline, verdict, Catch, subcategory and tags. Filters combine with AND. Returns verdict and the first sentence of the Catch for each hit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["agents", "nextjs", "python", "shopify", "databases", "devops", "design", "observability", "rust", "payments", "comms", "notifications", "libraries"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "pricing": {
                "enum": ["free", "freemium", "paid", "open-source", "source-available"],
                "type": "string"
              },
              "query": {
                "description": "Free text, e.g. \"postgres backup\" or \"browser automation\"",
                "type": "string"
              },
              "sort": {
                "default": "curated",
                "description": "curated = free/OSS first",
                "enum": ["curated", "catalog", "new", "stars", "trending", "name"],
                "type": "string"
              },
              "subcategory": {
                "description": "Subcategory slug or label, e.g. \"coding-agents\"",
                "type": "string"
              },
              "tag": {
                "description": "Comma list of tags, all must match (see list_categories), e.g. \"mcp,self-host\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search developer tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6e048a18f77686568bfd525d06374b9566a48ec94d62642f2fc08ce48a5d6f54"
        }
      ],
      "digest": "sha256:7f9a706a46964555e886928b4dcbbaab5849844fbfa9c34c9e21e7e9f6587ec2"
    }
  }
}
