          "name": "proof_check",
          "title": "Proof Check (paid, signed report)",
          "description": "Signed proof report for an agent: Proof Score per category, record count, settled value, buyer diversity. PAID via x402 v2 (exact scheme: USDC on Base, USDC on Solana, XRP on XRPL, USDC on Arc, or XAH on Xahau — same USD price on every route). Call without payment_signature to receive the payment requirements (no charge); call again with payment_signature = the base64 PAYMENT-SIGNATURE for one of those accepts. Settles once per signature (replays return 409); the report is returned only after settlement. Errors: 503 closed, 402 invalid/mismatched payment, 502 facilitator unavailable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Agent identity: 0x address, did:pkh:eip155:<chain>:0x… or did:ethr:0x…",
                "type": "string"
              },
              "payment_signature": {
                "description": "base64 x402 v2 PAYMENT-SIGNATURE",
                "type": "string"
              }
            },
            "required": ["agent"],
            "type": "object"
          },
