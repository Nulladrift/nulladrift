  "subjects": {
    "com.apiskins/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.apiskins.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "apiskins",
        "title": "API Skins",
        "version": "1.0.0",
        "websiteUrl": "https://apiskins.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CS2 skin market data from API Skins: the cheapest listing of each item on every tracked marketplace, the best buy orders, sales summaries, what each item is, and any Steam inventory. Items are named by their exact Steam market_hash_name, like \"AK-47 | Redline (Field-Tested)\". When unsure of a name, call find_items first. Prices are in US dollars. Every tool call but find_items counts as one request toward the key's 30-day limit. Every plan, the free one too, answers every tool for every marketplace; plans differ in how many requests they allow: https://apiskins.com/pricing.",
      "tools": [
        {
          "name": "find_items",
          "title": "Find items",
          "description": "Search CS2 items by name and get their exact market_hash_names, which every other tool takes. Every word must appear in the name; punctuation is ignored.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many names to answer, 20 when left out",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words of the name, like \"redline field tested\" or \"karambit doppler\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find items"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:264558edd132899719e118c81280a408003de2558426309ee0a510febcfc302c"
        },
        {
          "name": "get_buy_orders",
          "title": "Best buy orders",
          "description": "The highest buy order of each item on each marketplace that has buy orders, in US dollars: what the item sells for right now without waiting for a buyer.",
          "inputSchema": {
            "properties": {
              "market_hash_names": {
                "description": "Exact Steam market_hash_names, 1 to 100, like \"AK-47 | Redline (Field-Tested)\"",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "providers": {
                "description": "Only these marketplaces; all of them when left out",
                "items": {
                  "enum": ["dmarket", "market_csgo", "steam"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["market_hash_names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best buy orders"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cfaf8bae5727f7880cd2aa388e31540c2f061446a53e07d466e6cde5a4bd0586"
        },
        {
          "name": "get_inventory",
          "title": "Steam inventory",
          "description": "Every CS2 item in a Steam inventory: market_hash_name, asset ID, class ID, instance ID, inspect link, and what the inspect link holds: float (paint_wear), pattern (paint_seed), paint_index, def_index, quality, rarity, StatTrak™ kills, name tag, stickers and charms. Give a steam_id (SteamID64) for a public inventory, or a trade_url for any inventory, private ones too. Price the items with get_offers.",
          "inputSchema": {
            "properties": {
              "steam_id": {
                "description": "The owner's SteamID64, like 76561198000000000 (public inventories only)",
                "type": "string"
              },
              "trade_url": {
                "description": "A Steam trade URL, https://steamcommunity.com/tradeoffer/new/?partner=...&token=... (private inventories too)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Steam inventory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7cc5d66fce052848f9624dd61dafd0ae9829eeec2ff222e6d0b8e9f23b9fcf82"
        },
        {
          "name": "get_items",
          "title": "Item details",
          "description": "What each item is: type, weapon, pattern, wear and float range, quality (StatTrak™, Souvenir...), rarity, collections, cases, picture.",
          "inputSchema": {
            "properties": {
              "market_hash_names": {
                "description": "Exact Steam market_hash_names, 1 to 100, like \"AK-47 | Redline (Field-Tested)\"",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["market_hash_names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Item details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0c88b6f8985a1e76ea9ae6b4d158790be4cb98743591eac6f6009467fc95d40"
        },
        {
          "name": "get_offers",
          "title": "Cheapest listings",
          "description": "The cheapest listing (lowest sell offer) of each item on every marketplace that lists it, in US dollars. Use it to price items or find where they are cheapest.",
          "inputSchema": {
            "properties": {
              "market_hash_names": {
                "description": "Exact Steam market_hash_names, 1 to 100, like \"AK-47 | Redline (Field-Tested)\"",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "providers": {
                "description": "Only these marketplaces; all of them when left out",
                "items": {
                  "enum": ["cs_float", "buff_163", "youpin", "dmarket", "skinport", "cs_money", "market_csgo", "buff_market", "waxpeer", "lis_skins", "skin_baron", "halo_skins", "white_market", "shadow_pay", "skins", "skin_swap", "cs_deals", "loot_farm", "cs_trade", "tradeit", "mannco_store", "dupe_fi", "skin_lab", "skin_pay", "steam", "sih"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["market_hash_names"],
            "type": "object"
          },
          "annotations": {
