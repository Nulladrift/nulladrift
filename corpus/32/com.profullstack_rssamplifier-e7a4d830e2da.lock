        {
          "name": "list_authors",
          "title": "List the people behind the feeds",
          "description": "The directory's authors and where else they publish — their own sites, Mastodon and Bluesky accounts, GitHub, links pages. Every link was published by the author on their own site as a rel=\"me\" claim, an h-card or JSON-LD; nothing is scraped from a platform or bought. Filter with network to find only people reachable a given way (email, fediverse, bluesky, github, website, linktree), or query to search names. Role mailboxes like info@ are never returned: they are dropped at extraction, so an address here belongs to a person.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Default 50.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "minConfidence": {
                "description": "How sure the attribution must be, 0 to 1. Default 0.6, which is what the site itself publishes. Lower it for the long tail, and expect some of it to be wrong.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "network": {
                "description": "Only people with a link on this network, e.g. \"email\" or \"fediverse\".",
                "type": "string"
              },
              "offset": {
                "description": "Default 0.",
                "minimum": 0,
                "type": "integer"
