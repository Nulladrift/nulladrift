        {
          "name": "get_topic",
          "title": "Feeds covering a topic",
          "description": "Every feed filed under one topic. The keyword is normalised, so \"Home Lab\", \"home lab\" and \"home-lab\" all reach the same topic and you can pass a phrase you read anywhere. Each feed says whether it landed here from the publisher's own tag or from a phrase counted across its writing. A comma-separated list (\"business, saas, crypto\", up to 10) returns the union: every feed filed under any of them, each once, with `topics` naming the known ones and `unknown` the rest.",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "The topic, in any spelling — or several, separated by commas.",
                "type": "string"
              },
              "limit": {
                "description": "Default 100.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
