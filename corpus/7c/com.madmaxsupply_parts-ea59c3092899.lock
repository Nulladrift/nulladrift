{
  "lockfileVersion": 2,
  "subjects": {
    "com.madmaxsupply/parts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.madmaxsupply.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "madmaxsupply-parts",
        "title": "MadMax Trade Supply parts",
        "version": "1.0.0",
        "websiteUrl": "https://www.madmaxsupply.com/agents/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Find in-stock replacement filters, alarms, batteries and parts at MadMax Trade Supply (a reseller in Edina, MN) and hand the buyer a pre-filled cart link. Prices are in USD, include any sales tax we're required to collect (no tax is added at checkout), vary slightly by ship-to state, and include contiguous-US shipping on most items. Always let the buyer review and pay on the checkout page; these tools never charge a card.",
      "tools": [
        {
          "name": "check_fit",
          "title": "What fits",
          "description": "Find the replacement we carry for an OEM part number (e.g. WF3CB, XWF, Aprilaire 35, LT700P), a nominal air filter size (e.g. 20x25x4) or a system/model name. Matching is based on our product titles.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "OEM part number, filter size, or model/system name",
                "type": "string"
              },
              "ship_to_state": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4cf9e1f045cb7cee45d36005c2e83726f9022a49b84b30e98bd08ad8d3c8fc38"
        },
        {
          "name": "create_checkout_link",
          "title": "Create checkout link",
          "description": "Build a pre-filled madmaxsupply.com cart link for the buyer. Does NOT place an order or charge anything: the buyer opens the link, enters the address and pays on Stripe-hosted checkout. Optional auto_ship_months (1, 2, 3, 6 or 12) sets up Subscribe & auto-ship on eligible items.",
          "inputSchema": {
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "auto_ship_months": {
                      "default": 0,
                      "enum": [0, 1, 2, 3, 6, 12],
                      "type": "integer"
                    },
                    "quantity": {
                      "default": 1,
                      "maximum": 99,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sku": {
                      "type": "string"
                    }
                  },
                  "required": ["sku"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "ship_to_state": {
                "type": "string"
              },
              "ship_to_zip": {
                "description": "Optional 5-digit ship-to ZIP; some regions add a shipping surcharge at checkout.",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6d8776e2c571997650524607ebfa66e077907efffc86272b78d3ed7be807043"
        },
        {
          "name": "get_product",
          "title": "Get product",
          "description": "Full details for one SKU: price for the ship-to state, shipping, return window, auto-ship options, part numbers it replaces, and an add-to-cart URL.",
          "inputSchema": {
            "properties": {
              "ship_to_state": {
                "type": "string"
              },
              "ship_to_zip": {
                "description": "Optional 5-digit ship-to ZIP; some regions add a shipping surcharge at checkout.",
                "type": "string"
              },
              "sku": {
                "description": "MadMax SKU, e.g. MM-RF-891B5F",
                "type": "string"
              }
            },
            "required": ["sku"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ae0c1ce732d233599ced9595553ac5febb1818b65eca7555007898fc6a2ee49"
        },
        {
          "name": "get_store_policies",
          "title": "Store policies",
          "description": "Shipping, sales tax, payment, returns, subscriptions and contact details for MadMax Trade Supply.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d5c6966b74b147e4412a7d84bbae7bf118e0b6ac5f94e8f58ae713ba8e87ee0"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Product categories with their slugs and page URLs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b877a557428990ef69587ce594e751415478652ebc900f8ca7a6edb8d3a306ec"
        },
        {
          "name": "search_parts",
          "title": "Search parts",
          "description": "Search MadMax Trade Supply's in-stock catalog (refrigerator and water filters, HVAC air filters, humidifier pads, sump and septic alarms/parts, radon mitigation parts, batteries, LED bulbs, pool and spa filters) by keyword, OEM part number, filter size (e.g. 16x25x1) or brand. Returns live USD prices for the ship-to state.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category slug (see list_categories)",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "type": "number"
              },
              "query": {
                "description": "Keywords, OEM part number, or filter size",
                "type": "string"
              },
              "ship_to_state": {
                "description": "2-letter US state/territory code; prices vary slightly by state. Default MN.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e800b6c88c1a900fd04d957cee5392b3171185b6a450b9aa90127ffdaa59f0e1"
        },
        {
          "name": "submit_feedback",
          "title": "Report a missing part or blocker",
          "description": "Tell MadMax Trade Supply about a part you couldn't find, a fit question, a checkout problem or wrong data. A person reviews every report; nothing is sent back automatically and no order is placed. Leave contact_email only if the shopper wants a reply.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "Your agent or app name",
                "maxLength": 80,
                "type": "string"
              },
              "contact_email": {
                "description": "Optional, only with the shopper's consent",
                "maxLength": 200,
                "type": "string"
              },
              "message": {
                "description": "What was needed or what went wrong",
                "maxLength": 2000,
                "type": "string"
              },
              "part_number": {
                "description": "OEM part or model number searched for",
                "maxLength": 80,
                "type": "string"
              },
              "query": {
                "description": "The search you ran",
                "maxLength": 200,
                "type": "string"
              },
              "sku": {
                "type": "string"
              },
              "type": {
                "enum": ["missing_part", "fit_question", "checkout_blocked", "data_issue", "other"],
                "type": "string"
              }
            },
            "required": ["message", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:67761897bc27ff2c46fceea76eb16853811a3186a4d74d97351371980f98f437"
        }
      ],
      "digest": "sha256:f97cd63b765e3a1e2a8df22e28c86857938abec473a6b92fb8eb243b61877976"
    }
  }
