        "name": "OLX",
        "title": "OLX MCP",
        "version": "1.0.0",
        "description": "OLX.pl classifieds in every category: property, cars, electronics, jobs, free items; offer details.",
        "websiteUrl": "https://mcps.wondel.ai/servers/olx/",
