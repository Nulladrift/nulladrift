      "serverInfo": {
        "name": "just-signal",
        "title": "Just Signal",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Just Signal: sentience-driven macro intelligence at https://www.ou-reports.com. Four tools only read: get_stock_quote (live Day-0 prices), list_reports (browse the library), get_scorecard (audit past signals) and get_panel_grade (the Chophouse doneness grade plus 11 emulated-lens votes on a ticker). One tool writes: publish_report grounds and PUBLISHES a briefing to the public library, so call it only when the user wants to publish. The library standard is exactly 5 trends, each with a lead \"Name (TICKER)\" plus 4 instruments, 15 or more distinct tickers in all. Targets are percentages like \"+18%\" or multiples like \"2.5x\", NEVER dollars: the server computes dollars from the live Day-0 price. Publishing the same content twice returns the existing URL. Research output only, never financial advice.",
      "tools": [
        {
          "name": "get_panel_grade",
          "title": "Get the Chophouse panel grade",
          "description": "The Investment Panel's read on one ticker: its Chophouse doneness grade (RAW to CHARRED, how much value is already cooked in) plus every seat's vote across 11 emulated investor lenses, with the registry verdict for context. The panel advises, the reader decides. Says so if the ticker is not plated yet. Read-only.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "US-listed ticker symbol, for example NVDA.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the Chophouse panel grade"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed66f8abce30808a48e2c2beb842a8fb59b4a26eb9a0ecd71658569f7fac6003"
        },
        {
          "name": "get_scorecard",
          "title": "Get the Signal Scorecard",
          "description": "Audit past signals: projected versus actual return for every ticker in the registry, graded AHEAD, TRACKING or BEHIND, pro-rated by elapsed time against the daily snapshot close. Read-only, takes no arguments.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the Signal Scorecard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6188aa20e6ecc5beb5a94dc766a6d5702b099c6847559ccc0537afeda9fb681"
        },
        {
          "name": "get_stock_quote",
          "title": "Get live stock quote",
          "description": "Live stock or ETF quote (price and percent change) through Just Signal's market-data relay. Use it to establish a ticker's Day-0 baseline price before writing projections. Read-only.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "US-listed ticker symbol, for example NVDA, TSLA or BRK.B. 1 to 10 characters.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get live stock quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ed846e4bd8e4ffc21d2509c6130ef9108c56ff2da76a0bedf53f2d99521d5158"
        },
        {
          "name": "list_reports",
          "title": "List published reports",
          "description": "List recent Just Signal reports from the public library, newest first, with their URLs. Read-only.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many reports to return, 1 to 50. Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List published reports"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3fc9847ce13a32aba7367547f9e1f0c11493a10785f15562848fcf58f77cc87"
        },
        {
          "name": "publish_report",
          "title": "Publish a Just Signal briefing",
          "description": "Ground, render and PUBLISH a Just Signal briefing to the public library at ou-reports.com. This writes a public web page: call it only when the user wants to publish. The server grounds each lead ticker's live Day-0 price, computes exact dollar targets from your percentage projections, renders the report and stores it. LIBRARY STANDARD: exactly 5 trends, each with a lead vehicle as \"Name (TICKER)\" plus 4 instruments (the sector leader, a sector ETF, a picks-and-shovels supplier, a contrarian or hedge), 15 or more distinct real US-listed tickers in all. A thinner briefing is stored but flagged and not featured. Targets MUST be percentages (\"+18%\") or multiples (\"2.5x\"), never dollars. Publishing identical content again returns the existing URL. Tokenless publishing is open to the community and limited to 3 per connection per UTC day; it needs at least 3 trends with real analysis and one lead that resolves to a live quote. Returns \"Published: <URL>\". Research only, never financial advice.",
          "inputSchema": {
            "properties": {
              "briefingTitle": {
                "description": "The headline, 6 to 160 characters. Plain words, digits and ordinary punctuation only. Catchy but honest.",
                "type": "string"
              },
              "durationSeconds": {
                "description": "Optional. Seconds you spent researching and writing, shown as the Time-Out Timer stamp. Defaults to 0.",
                "type": "number"
              },
              "executiveSummary": {
                "description": "The opening summary in plain prose, 200 to 300 words: what is happening, why now, and what the five trends have in common.",
                "type": "string"
              },
              "sectors": {
                "description": "Short plain topic label of 2 to 4 keywords, for example \"grid-scale energy storage\". It becomes the report filename.",
                "type": "string"
              },
              "token": {
                "description": "Optional owner token. Leave it out for community publishing; it only bypasses the daily rate limits.",
                "type": "string"
              },
              "trends": {
                "description": "The trends. The library standard is exactly 5, each with 4 instruments; fewer than 3 is refused for tokenless publishing.",
                "items": {
                  "properties": {
                    "assetOrSector": {
                      "description": "The lead vehicle as \"Name (TICKER)\", for example \"NVIDIA Corp (NVDA)\". Use \"Name (PRIVATE)\" when there is no public ticker; that trend shows a relative basis and is not graded.",
                      "type": "string"
                    },
                    "category": {
                      "description": "Short category label, for example \"Semiconductors\". Defaults to sectors.",
                      "type": "string"
                    },
                    "hook": {
                      "description": "One or two sentences on why this trend matters now.",
                      "type": "string"
                    },
                    "instruments": {
                      "description": "Additional vehicles for this trend. The library standard is exactly 4: the sector leader, a sector ETF, a picks-and-shovels supplier, and a contrarian or hedge. Each is rendered as a linked chip and registered in the ticker registry.",
                      "items": {
                        "properties": {
                          "access": {
                            "description": "PUBLIC unless the vehicle is genuinely accredited-only.",
                            "type": "string"
                          },
                          "name": {
                            "description": "Instrument name, for example \"VanEck Semiconductor ETF\".",
                            "type": "string"
                          },
                          "ticker": {
                            "description": "US-listed ticker, for example SMH. Omit for a private vehicle.",
                            "type": "string"
                          },
                          "type": {
                            "description": "Stock, ETF, REIT or Fund.",
                            "type": "string"
                          }
                        },
                        "required": ["name"],
                        "type": "object"
                      },
                      "maxItems": 6,
                      "type": "array"
                    },
                    "keyRisks": {
                      "description": "The main risks to the thesis, 3 short strings is the standard.",
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 8,
                      "type": "array"
                    },
                    "narrative": {
                      "description": "The forward outlook in plain prose.",
                      "type": "string"
                    },
                    "qualitativeAnalysis": {
                      "description": "3 to 4 sentences of analysis naming 2 or 3 related public companies with their tickers in parentheses.",
                      "type": "string"
                    },
                    "quantitativeAnalysis": {
                      "description": "The real, current figures behind the trend.",
                      "type": "string"
                    },
                    "signal": {
                      "description": "Direction of the call. Defaults to neutral.",
                      "enum": ["bullish", "bearish", "neutral"],
                      "type": "string"
                    },
                    "target10Y": {
                      "description": "10-year projection, same format as target1Y.",
                      "type": "string"
                    },
                    "target1Y": {
                      "description": "1-year projection from Day 0 as a percentage (\"+18%\", \"-12%\") or a multiple (\"2.5x\"). Never a dollar figure. \"relative\" when there is no ticker.",
                      "type": "string"
                    },
                    "target5Y": {
                      "description": "5-year projection, same format as target1Y.",
                      "type": "string"
                    },
                    "title": {
                      "description": "Trend headline, up to 160 characters.",
                      "type": "string"
                    }
                  },
                  "required": ["assetOrSector", "target10Y", "target1Y", "target5Y", "title"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["briefingTitle", "executiveSummary", "sectors", "trends"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish a Just Signal briefing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e86d960299f35406ba411cd54baa747ed2523d4e296b4644b1fa8d2cba1a7637"
        }
      ],
      "digest": "sha256:b5478f2cb9c1234c955997d1c40acbbd8d5c3517eedea62bceafcc9a218a8b6b"
    }
  }
