{
  "lockfileVersion": 2,
  "subjects": {
    "com.ou-reports/just-signal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.ou-reports.com/api/mcp.php"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "just-signal",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Just Signal: sentience-driven macro intelligence at https://ou-reports.com. Use get_stock_quote for live Day-0 prices, publish_report to ground+publish a 5-trend briefing (targets as percentages like \"+18%\" or multiples like \"2.5x\", NEVER dollars; the server computes dollars from the live Day-0 price), list_reports to browse, get_scorecard to audit past signals, and get_panel_grade for the Chophouse doneness grade + 11 emulated-lens votes on any ticker.",
      "tools": [
        {
          "name": "get_panel_grade",
          "description": "The Investment Panel's read on one ticker: its Chophouse doneness grade (RAW..CHARRED, how much value is already cooked in) plus every seat's vote across 11 emulated investor lenses, with the registry verdict for context. The panel advises, the reader decides. Says so if the ticker is not plated yet.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "US ticker, e.g. NVDA",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f3690ae2a57f5221626fa04807c28f66c2b26c22da592e1990356097c44b7774"
        },
        {
          "name": "get_scorecard",
          "description": "Audit past signals: projected vs actual return for every grounded ticker, graded AHEAD / TRACKING / BEHIND, pro-rated by elapsed time.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d5e977e4d3e61b439f75ecf0ef50952ddb44700f1886b453b0b50b1affa00960"
        },
        {
          "name": "get_stock_quote",
          "description": "Live stock/ETF quote (price + % change) via Just Signal's market-data relay. Establishes a ticker's Day-0 baseline before projecting.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "US ticker, e.g. NVDA",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b7daac719b23a302a62e5187347b6ff26d99b1b785f10e98e6882e5baabfa059"
        },
        {
          "name": "list_reports",
          "description": "List recent Just Signal reports from the public library (newest first).",
          "inputSchema": {
            "properties": {
              "limit": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:acdb17dbcd8c688b8a310e9cba063927b90ef8bd3ecc7ac9767f161e7bd94a23"
        },
        {
          "name": "publish_report",
          "description": "Ground, render, and PUBLISH a Just Signal briefing to the public library. Grounds each ticker's live Day-0 price and computes exact dollar targets from your % projections. Targets MUST be percentages (\"+18%\") or multiples (\"2.5x\"), never dollars. assetOrSector: \"Name (TICKER)\" or \"(PRIVATE)\" for relative basis. Open to community contributions: the server itself renders every report, and tokenless publishing is rate-limited per day.",
          "inputSchema": {
            "properties": {
              "briefingTitle": {
                "type": "string"
              },
              "durationSeconds": {
                "type": "number"
              },
              "executiveSummary": {
                "type": "string"
              },
              "sectors": {
                "description": "Short topic label — becomes the report filename keywords",
                "type": "string"
              },
              "token": {
                "description": "Optional owner token; bypasses the daily community rate limits",
                "type": "string"
              },
              "trends": {
                "items": {
                  "properties": {
                    "assetOrSector": {
                      "type": "string"
                    },
                    "category": {
                      "type": "string"
                    },
                    "hook": {
                      "type": "string"
                    },
                    "instruments": {
                      "description": "Optional 3-4 additional vehicles for this trend (ETF, leader, picks-and-shovels, contrarian) - richness parity with app-published briefings",
                      "items": {
                        "properties": {
                          "access": {
                            "description": "PUBLIC unless genuinely accredited-only",
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "ticker": {
                            "type": "string"
                          },
                          "type": {
                            "description": "e.g. Stock, ETF, REIT, Fund",
                            "type": "string"
                          }
                        },
                        "required": ["name"],
                        "type": "object"
                      },
                      "maxItems": 6,
                      "type": "array"
                    },
                    "keyRisks": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "narrative": {
                      "type": "string"
                    },
                    "qualitativeAnalysis": {
                      "type": "string"
                    },
                    "quantitativeAnalysis": {
                      "type": "string"
                    },
                    "signal": {
                      "enum": ["bullish", "bearish", "neutral"],
                      "type": "string"
                    },
                    "target10Y": {
                      "type": "string"
                    },
                    "target1Y": {
                      "type": "string"
                    },
                    "target5Y": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["assetOrSector", "target10Y", "target1Y", "target5Y", "title"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["briefingTitle", "executiveSummary", "sectors", "trends"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3532a860499fed33f78f237560ea2cbb2fd7ddd9ba247ad113e9b148ddd8a22c"
        }
      ],
      "digest": "sha256:29ed055d451ba47fab5cb277b1a3ffdfc1e07f04374c8c29bcb86c1db4acb7c9"
    }
  }
}
