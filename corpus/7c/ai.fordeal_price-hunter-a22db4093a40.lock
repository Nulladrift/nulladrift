        },
        {
          "name": "send_cooperation_inquiry",
          "title": "Write to Fordeal about cooperation (partners, media, creators)",
          "description": "The cooperation forms (docs/texty/formulare.md 2–4) without the website. `kind` partner (an affiliate network, a feed provider or a technical integration: organization, website, markets as ISO codes, cooperation_type affiliate | feed | integration | other, message = the offer and its terms), media (name, organization = the newsroom, message = the topic or the information needed, optional deadline YYYY-MM-DD and links) or creator (name or channel, website = the main channel, topic = the content's topic and audience, message = the idea, optional links: other channels, media kit). A shop that wants to be compared uses register_shop instead. A person reads every message; the sender gets a confirmation of receipt (not an approval) and the operator one notice. The same message twice within a day answers the first id with duplicate true. Public, no key; five messages a minute per caller. 503 not_available until migration 0065 is applied.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cooperation_type": {
                "description": "What a partner offers (required for a partner).",
                "enum": ["affiliate", "feed", "integration", "other"],
                "type": "string"
              },
              "deadline": {
                "description": "The day the media need an answer by (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "email": {
                "description": "Where the confirmation and the answer go; never shown.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "ip_hash": {
                "description": "sha-256 of the sender's address with a daily salt (the website computes it); counts the per-visitor limit. Never stored as an address.",
                "maxLength": 64,
                "type": "string"
              },
              "kind": {
                "description": "Who writes: partner | media | creator.",
                "enum": ["partner", "media", "creator"],
                "type": "string"
              },
              "links": {
                "description": "Documentation, a feed, the article, other channels or a media kit (links as text).",
                "maxLength": 1000,
                "type": "string"
              },
              "locale": {
                "description": "Language of the confirmation (cs, sk, en; others get English).",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "markets": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 2,
                      "minLength": 2,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "maxLength": 80,
                    "type": "string"
                  }
                ],
                "description": "Markets the offer is about, ISO codes (partner, required): an array or a comma-separated string."
              },
              "message": {
                "description": "The offer and its terms (partner), the topic or the information needed (media), the idea (creator).",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "name": {
                "description": "The contact person (partner, media) or the name of the channel (creator).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "nickname": {
                "description": "Leave empty (spam trap: a filled value is discarded quietly).",
                "maxLength": 200,
                "type": "string"
              },
              "organization": {
                "description": "The company or network (partner, required), the newsroom or medium (media, required).",
                "maxLength": 200,
                "type": "string"
              },
              "topic": {
                "description": "The creator's topic and audience (required for a creator).",
                "maxLength": 1000,
                "type": "string"
              },
              "website": {
                "description": "The partner's website or the creator's main channel (required for both).",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["email", "kind", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Write to Fordeal about cooperation (partners, media, creators)"
          },
          "behavior": {
            "destructive": false,
