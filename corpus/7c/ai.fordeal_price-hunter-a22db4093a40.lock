              "deliver_to_country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. \"CZ\". Optional: normally derived from the address.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "locale": {
                "description": "Language of the alert mails. Default: the person's, then the country's.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "product_slug": {
                "description": "The product's slug (search_products, find_best_price).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "target_total": {
                "description": "Mail when the total falls to or under this amount, in the currency of deliver_to_country. Default: today's total.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              }
            },
            "required": ["product_slug"],
            "type": "object"
          },
          "annotations": {
