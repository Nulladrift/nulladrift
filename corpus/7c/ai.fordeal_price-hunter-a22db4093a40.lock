                "maxLength": 64,
                "type": "string"
              },
              "website": {
                "description": "Leave empty (spam trap).",
                "maxLength": 0,
                "type": "string"
              }
            },
            "required": ["kind", "message", "product_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
