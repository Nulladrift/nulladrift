                "type": "string"
              },
              "ip_hash": {
                "description": "sha-256 of the reporter's address with a daily salt (the website computes it); the per-visitor limit of five reports a minute counts by it. Never stored.",
                "maxLength": 64,
                "type": "string"
              },
              "kind": {
                "description": "What is wrong: the price, the variant or product, the category the product is filed under, the shop or link, or something else.",
