        {
          "name": "report_illegal_content",
          "title": "Report illegal content (DSA Art. 16)",
          "description": "A notice under Article 16 of the Digital Services Act that content on fordeal.ai is illegal (a user review, product information, an offer, an image or anything else). Give `content_kind` review | product_info | offer | image | other, the `page_url` of the content (and the `product_slug` when it is on a product page), an `explanation` of why the content is illegal (20–4000 characters), the notifier's `name` and `email`, and `good_faith: true` confirming the notice is accurate and complete to the best of the notifier's knowledge. A person reviews every notice; the e-mail gets a confirmation of receipt at once and the decision later. For a wrong price or variant use report_issue instead. Public, no key; the anonymous rate limit applies.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content_kind": {
                "description": "What content the notice is about.",
                "enum": ["review", "product_info", "offer", "image", "other"],
                "type": "string"
              },
              "email": {
                "description": "The notifier's e-mail: the confirmation of receipt and the decision go there.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "explanation": {
                "description": "Why the content is illegal (Art. 16(2)(a)).",
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              },
              "good_faith": {
                "const": true,
                "description": "Confirms the bona fide belief that the information is accurate and complete (Art. 16(2)(d)).",
                "type": "boolean"
              },
              "ip_hash": {
                "description": "sha-256 of the notifier's address with a daily salt (the website computes it); counts the per-visitor limit.",
                "maxLength": 64,
                "type": "string"
              },
              "locale": {
                "description": "Language of the confirmation.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "name": {
                "description": "The notifier's name (Art. 16(2)(c)).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "page_url": {
                "description": "The exact page of the content (Art. 16(2)(b)).",
                "maxLength": 500,
                "type": "string"
              },
              "product_slug": {
                "description": "Product slug when the content is on a product page.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "website": {
                "description": "Leave empty (spam trap).",
                "maxLength": 0,
                "type": "string"
              }
            },
            "required": ["content_kind", "email", "explanation", "good_faith", "name"],
            "type": "object"
