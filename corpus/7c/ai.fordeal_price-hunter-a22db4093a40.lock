        {
          "name": "check_shop_feed",
          "title": "Check a shop's product feed and preview its offers",
          "description": "Before or instead of registering: reads one product feed and answers whether Fordeal can use it. Give the feed's public address in `feed_url` (read through the SSRF guard: public hosts only, FordealBot, robots.txt respected, 20 s cap) or the file itself in `feed_content` (XML or CSV text, at most 8 MB) or `feed_base64` (a gzip-packed file; ZIP is refused), plus the shop's delivery `country` and, with a file, its `domain`. The answer: health ok | warn | fail, counts (items, skipped, with EAN, price, picture, availability, shipping, category), coded issues (no_items, items_skipped, feed_unreadable, price_zero, currency_mismatch, url_not_shop_host, duplicate_item_id, encoding_suspect, price_outlier, missing_ean, availability_unknown, shipping_missing, image_missing, category_missing, stale_feed) with the first affected items by the shop's own id and name, `blocking` = the error codes to fix first, `validation` = the required-field check (title, price, URL, EAN) in Czech sentences for Heureka, Zboží, Google and CSV feeds, and `preview.shown` = the first items as the comparison would show them (goods price, shipping to the country from the feed, total, stock, picture, what each lacks). Nothing is stored and nothing is mailed. A feed that cannot be read answers health fail with `read_error` {code, message, fix}. Next: register_shop with the same feed. Public; ten checks a minute per caller.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "The shop's delivery country (ISO code from GET /api/v1/deals/countries): its currency and the shipping the total uses.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "domain": {
                "description": "The shop's host, e.g. www.obchod.cz; required with a file, the feed's host by default.",
                "maxLength": 120,
                "minLength": 4,
                "type": "string"
              },
              "feed_base64": {
                "description": "The feed file's bytes as base64, for a gzip-packed file (.xml.gz). ZIP is refused.",
                "maxLength": 11184815,
                "type": "string"
              },
              "feed_content": {
                "description": "The feed file as text (XML or CSV), at most 8 MB. Over MCP the whole request is limited to 2 MB; send bigger files to POST /api/v1/shops/feed-check.",
                "maxLength": 8388608,
                "type": "string"
              },
              "feed_url": {
                "description": "The feed's public address (Heureka, Zboží, Google Merchant, Ceneo, Idealo, Árukereső XML or CSV). Either this or a file.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              },
              "filename": {
                "description": "The file's name, echoed back.",
                "maxLength": 200,
                "type": "string"
              },
              "format": {
                "description": "The feed format when known; detected from the content otherwise.",
                "enum": ["heureka", "zbozi", "google", "csv", "ceneo", "idealo", "arukereso", "glami", "awin"],
                "type": "string"
              },
              "preview_items": {
                "description": "How many items the preview shows (default 6, at most 24).",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a shop's product feed and preview its offers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d92eca0f34339831ae5cc35d0532420674b78fa6d22609570a1062fc5c7045b3"
        },
        {
          "name": "compare_digital",
          "title": "Compare digital services by price per month",
          "description": "Prices of digital services for a buyer's country, cheapest first, from the providers' official price lists (each row has source_url and verified_on) converted to the buyer's currency by the Czech National Bank rate (fx_date). Categories: ai-chat (ChatGPT, Claude, Gemini, Copilot, Perplexity, Grok, Mistral Vibe, GitHub Copilot, Cursor, Jasper, DeepL… subscriptions), ai-api (price per 1M input and output tokens of the main models: OpenAI, Anthropic, Google, Mistral, xAI, DeepSeek, AI21, Amazon Nova), ai-creative (Midjourney, Runway, Kling, Leonardo, Canva, Firefly, ElevenLabs, Suno… per month, per picture or second of video when stated), streaming, music, vpn, cloud, office (Microsoft 365, Google Workspace, Zoho, Notion, Slack, Zoom… personal, family and business per user; business prices usually exclude VAT), creative (Adobe Creative Cloud, Canva, Figma, CapCut, DaVinci Resolve Studio… monthly, yearly or a one-time purchase: such a row has oneTimeLocal instead of a monthly price), passwords (1Password, Bitwarden, Dashlane). `usage` turns the list into a cost of that use: for ai-api messages_per_month (+ input_tokens and output_tokens per message, default 1 500 and 600) (+ cache_share 0–1 and batch) gives usage_cost a month, usage_breakdown (input, cached input, output; whether the long-prompt band or the batch discount applied) and break_even_messages (below it the API is cheaper than the provider's cheapest paid chat plan); for ai-creative images_per_month and video_seconds_per_month. A null price means the official page did not show one; it is never guessed. Each row carries data_location from the provider's own privacy policy (controller, storedIn country codes, inChina, authoritiesClause, quote, url, checked), null when we have not read it. Where the same plan is also sold inside the app (inAppPrices: the App Store's price for the buyer's country, with VAT, verifiedOn and sourceUrl), inApp compares a month on the web (the price list's price, plus the country's VAT when the list excludes it: web.vatAdded) with a month in the app, both in the buyer's currency: cheaper (web | app | same) and difference a month; inAppYearly does the same for yearly billing. Say both prices and which is cheaper; a plan without inApp has no store price read (never assume the app costs the same). Every row carries price, the one amount to show (the same as fordeal.ai shows): price.monthly and price.yearly (12 × monthly; yearlyWhenYearly = 12 × the month paid yearly) in the buyer currency with the buyer country VAT added where the price list excludes it (price.vat: included | by_law | added | excluded | unknown, price.vatRate), price.billing, price.channel (web) and price.rateDate; rows are ranked by price.monthly. promo (an open promotion) has monthlyLocal as converted and monthlyLocalGross on the same VAT basis as price: show the gross one, then price.monthly after it, both with the VAT word of price.vat. kind says who can buy the plan: regular (anyone), student (verified students or educators), business (companies and teams) or promo (only under the offer terms); never present a non-regular plan as the generic cheapest without saying who is eligible.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "batch": {
                "description": "Flat form of usage.batch (true / false).",
                "enum": ["true", "false"],
                "type": "string"
              },
              "cache_share": {
                "description": "Flat form of usage.cache_share.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "category": {
                "description": "ai-chat | ai-api | ai-creative | streaming | music | vpn | cloud | office | creative | passwords",
                "enum": ["ai-chat", "ai-api", "ai-creative", "streaming", "music", "vpn", "cloud", "office", "creative", "passwords"],
                "type": "string"
              },
              "currency": {
                "description": "Override the currency (e.g. EUR for a Czech buyer).",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "deliver_to_country": {
                "description": "The buyer's country; decides the currency and the local prices (CZ prices for CZ). Default: the first compared country.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "images_per_month": {
                "description": "Flat form of usage.images_per_month.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "input_tokens": {
                "description": "Flat form of usage.input_tokens.",
                "maximum": 2000000,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "BCP 47 locale for human-readable strings, e.g. \"en\", \"cs\", \"sk\". Defaults to the country's default locale.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "messages_per_month": {
                "description": "Flat form of usage.messages_per_month (REST query strings).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "output_tokens": {
                "description": "Flat form of usage.output_tokens.",
                "maximum": 200000,
                "minimum": 1,
                "type": "integer"
              },
              "purpose": {
                "description": "ai-chat: what the buyer needs it for. coding = plans whose page states an agent or coding tool, images / voice / video = plans whose page states that feature, writing = every plan. A feature the page does not state is 'not stated', not 'no'.",
                "enum": ["writing", "coding", "images", "voice", "video"],
                "type": "string"
              },
              "tier": {
                "description": "Only plans of this tier: free | basic | pro | max (AI subscriptions and picture/video tools), basic | standard | premium (streaming, music, VPN, cloud). Compare plans only within one tier.",
                "enum": ["free", "basic", "standard", "pro", "premium", "max"],
