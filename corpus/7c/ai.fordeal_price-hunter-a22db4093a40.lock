        {
          "name": "api_price_breakdown",
          "title": "Cost split of AI API models",
          "description": "What a month of AI API use costs per bill item for every model we compare (or one provider / chosen models): fresh input, input read from the cache, input written into the cache, output, and the total, per request and per month in the price list's currency (USD) and in the buyer's currency by the Czech National Bank rate (fx_date), each item's whole-percent share, every other item the price list names (batch discount and whether it applied, the dearer long-prompt band and whether the request is in it, the context window, cache_write_not_stated when the price list names no write price and writes were billed as ordinary input), what is included, and the official source_url with verified_on. Default scenario: 1 000 requests a month, 1 500 input and 600 output tokens each, 40 % of the input read from the cache and 10 % written; every field can be changed. Nothing is estimated beyond the stated prices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "batch": {
                "description": "Batch processing at the provider's batch discount, where it offers one.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "cache_share": {
                "description": "Share of the input read from the cache (0-1). Default 0.4.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "cache_write_share": {
                "description": "Share of the input written into the cache (0-1, with cache_share at most 1). Default 0.1.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "Override the local currency.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "deliver_to_country": {
                "description": "The buyer's country; decides the local currency.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "input_tokens": {
                "description": "Input tokens of one request. Default 1 500.",
                "maximum": 2000000,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "BCP 47 locale for human-readable strings, e.g. \"en\", \"cs\", \"sk\". Defaults to the country's default locale.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "messages_per_month": {
                "description": "Requests a month. Default 1 000.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "models": {
                "description": "Comma-separated plan ids from /digital/plans (category ai-api), e.g. claude-sonnet-5-5.",
                "maxLength": 400,
                "type": "string"
              },
              "output_tokens": {
                "description": "Output tokens of one request. Default 600.",
                "maximum": 200000,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "description": "Only this provider's models (Anthropic, OpenAI, Google, DeepSeek, Mistral, xAI, AI21 Labs, Amazon...), case-insensitive.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cost split of AI API models"
