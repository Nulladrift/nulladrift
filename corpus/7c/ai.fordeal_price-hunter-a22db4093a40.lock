        },
        {
          "name": "watch_energy_fixation",
          "title": "Watch the end of a fixed energy price (e-mail before it ends)",
          "description": "A household gives its e-mail and the last day of its fixed electricity or gas price (fixation_end YYYY-MM-DD, today to 5 years ahead); optionally the distributor area, today's supplier (supplier_id from energy_suppliers) or product (current_offer_id from compare_energy products) and the consumption. Double opt-in: the e-mail first gets a confirmation link and nothing else is sent before the person clicks it (an agent cannot confirm for the person). A confirmed watch gets one e-mail 45 days before the end with the offers cheaper for its need (from the official price lists; an estimate). Every mail has a cancel link. Unconfirmed watches are deleted after 7 days, every watch 30 days after its end date. No account, no contract, no commission. At most 5 watches per e-mail. Ask the person for consent before passing their e-mail.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "commodity": {
                "enum": ["electricity", "gas"],
                "type": "string"
              },
              "country": {
                "description": "CZ (default)",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "current_offer_id": {
                "maxLength": 120,
                "type": "string"
              },
              "distributor": {
                "description": "cez-distribuce | egd | pre-distribuce | gasnet | gas-distribution | ppd: without it the alert is a reminder without prices.",
                "maxLength": 40,
                "type": "string"
              },
              "email": {
                "description": "The person's e-mail (they confirm it themselves).",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "fixation_end": {
                "description": "Last day of the fixed price, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ip_hash": {
                "description": "sha-256 of the visitor's address with a daily salt (the website computes it).",
                "maxLength": 80,
                "type": "string"
              },
              "locale": {
                "description": "Language of the e-mails: cs | sk | en.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "mwh": {
                "description": "Yearly consumption MWh (high tariff or all).",
                "maximum": 63,
                "minimum": 0.1,
                "type": "number"
              },
              "nt_mwh": {
                "maximum": 63,
                "minimum": 0,
                "type": "number"
              },
              "rate": {
                "description": "Electricity rate, default D02d.",
                "maxLength": 5,
                "type": "string"
              },
              "supplier_id": {
                "maxLength": 60,
                "type": "string"
              },
              "website": {
                "description": "Leave empty (spam trap).",
                "maxLength": 0,
                "type": "string"
              }
            },
            "required": ["commodity", "email", "fixation_end"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Watch the end of a fixed energy price (e-mail before it ends)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0b515f0d8e85a95958cc9ae49b44f2aec5e7f1a6014b79775b7aedff167769d8"
        },
        {
          "name": "watch_product_price",
          "title": "Watch the total price of a product without an account (e-mail, double opt-in)",
          "description": "No account (UX-72): the person gives an e-mail and Fordeal mails them when the recommended total for `deliver_to_country` (goods + shipping, the product page's meaning) falls under `target_total` (default: today's total, i.e. any real drop by the currency's step), never twice for one price and at most once a day. Double opt-in: the address first gets only a confirmation link; nothing else is sent before the person clicks it (an agent cannot confirm for the person). Every alert has pause and cancel links that work without signing in (GET/POST /api/v1/price-watches/link). Unconfirmed watches are deleted after 7 days, confirmed ones 365 days after the confirmation. One watch per address and product, at most 20 per address; the answer is the same whether the address is known or not. Ask the person for consent before passing their e-mail. A signed-in person can use set_price_watch instead (no confirmation needed).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "deliver_to_country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. \"CZ\". Optional: normally derived from the address.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "email": {
                "description": "The person's e-mail (they confirm it themselves).",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "ip_hash": {
                "description": "sha-256 of the visitor's address with a daily salt (the website computes it).",
                "maxLength": 80,
                "type": "string"
              },
              "locale": {
                "description": "Language of the mails. Default: the country's.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "product_slug": {
                "description": "The product's slug (search_products, find_best_price).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "target_total": {
                "description": "Mail when the total falls to or under this amount, in the currency of deliver_to_country. Default: today's total.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "website": {
                "description": "Leave empty (spam trap).",
                "maxLength": 0,
                "type": "string"
              }
            },
            "required": ["email", "product_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Watch the total price of a product without an account (e-mail, double opt-in)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ba74da1d3888fdcd19c567a2fc04796f62f6be1e4c8f2294ba2964c107f343b0"
        }
