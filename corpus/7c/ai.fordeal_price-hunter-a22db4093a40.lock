        {
          "name": "register_shop",
          "title": "Register a shop for the comparison",
          "description": "One call registers a shop (P01): name, domain, delivery country, contact e-mail, the feed (its address in `feed_url`, or the file in `feed_content` / `feed_base64`), how commission is paid and the accepted partner terms version. An address is read at once through the SSRF guard (public hosts only, 422 url_rejected otherwise) with a 12 s cap; a file is decoded (at most 8 MB, gzip allowed, ZIP refused: 422 upload_zip_unsupported, 413 upload_too_large) and only its sha-256 and size are kept. Either way the feed is diagnosed (P04) and the 202 answer carries `feed.health` ok | warn | fail with the top three issues; the full report is stored on the request, `feed_source` says url or upload. One open request per domain: a second call updates it and answers the same id with `duplicate: true`; a declined domain may register again. The contact gets the `shop_registration_received` mail (its language: `locale`, else the country's default) with the confirmation link and the status page; the operator gets one notice. `verification.ownership` carries the token for the meta tag or file proof (verify_shop_domain). A shop on the ČOI / SOI risk list is refused (403). A registration never lists a shop by itself: the operator decides. A shop registered with a file only is listed as still being added until it sends a feed address. Follow it with get_shop_registration. Six calls a minute per caller.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accept_terms": {
                "description": "true = the contact accepts the partner terms of the given version.",
                "type": "boolean"
              },
              "affiliate": {
                "description": "How commission is paid: \"own\" = forDeal's own programme (5 % of the net order value, partner portal), a network name the country lists (ehub, cj, awin, dognet, …), \"other\", or \"none\".",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "country": {
                "description": "Delivery country of the shop, ISO 3166-1 alpha-2 from GET /api/v1/deals/countries.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "domain": {
                "description": "The shop's domain or URL, e.g. www.obchod.cz.",
                "maxLength": 120,
                "minLength": 4,
                "type": "string"
              },
              "email": {
                "description": "Contact e-mail of the shop; it receives the confirmation link and the decision. Never shown.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "feed_base64": {
                "description": "The feed file's bytes as base64, for a gzip-packed file (.xml.gz, .csv.gz). ZIP is refused: unpack it first.",
                "maxLength": 11184815,
                "type": "string"
              },
              "feed_content": {
                "description": "The feed as a file instead of an address: the XML or CSV text itself (at most 8 MB). Checked once and dropped; only its sha-256 and size are kept. Regular price updates still need a feed_url later.",
                "maxLength": 8388608,
                "type": "string"
              },
              "feed_filename": {
                "description": "The uploaded file's name, kept with its fingerprint.",
                "maxLength": 200,
                "type": "string"
              },
              "feed_url": {
                "description": "The product feed (Heureka, Zboží, Google Merchant, Ceneo, Idealo, Árukereső XML or CSV). Read at once; the answer carries the diagnostics report. Public hosts only. Either this or a file.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              },
              "locale": {
                "description": "Language of the mails (cs, sk, en, …); the country's default language when absent.",
                "maxLength": 5,
                "minLength": 2,
                "type": "string"
              },
              "note": {
                "maxLength": 500,
                "type": "string"
              },
              "shop_name": {
                "description": "The shop's name as it should appear in the comparison.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "terms_version": {
                "description": "The partner terms version being accepted; today 2026-10-09 (the terms are at /partner/smlouva).",
                "maxLength": 20,
                "minLength": 4,
                "type": "string"
              },
              "website": {
                "description": "Leave empty (spam trap: a filled value is discarded quietly).",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["accept_terms", "affiliate", "country", "domain", "email", "shop_name", "terms_version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Register a shop for the comparison"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:95258285709079650094d58e368a14df98ad4963a914f227a46a0d8f4a873154"
