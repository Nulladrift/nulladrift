      "instructions": "Fordeal answers one question: where to buy a product cheapest today in Czechia or Slovakia (more countries coming), by the real product price with the shipping shown separately for every offer, and whether the shop can be trusted.\nCall find_best_price with the product (text, model, EAN or a product URL) and deliver_to_country. A broad text (lego, ps5, sluchátka) returns up to 5 `candidates` and a `hint` instead of a card: narrow the query or call get_product with a candidate slug. Otherwise read verdict, headline, best.total (goods = product price, shipping, total), best.shop.trust and best.captured_at; send the buyer to best.url.\nShops on a consumer-protection risk list are never shown, unrated shops are never the recommendation, and every price carries its capture time. Ranking is by product price and trust only (sort=total counts shipping); the commission disclosure in every answer is mandatory to show.\nHolding a product id (product.slug, the stable id)? get_product answers the same card without reading a query; product_variants lists the other capacities, colours and sizes, each with its id, so the buyer gets the exact variant. When find_best_price answers match close, switch with product_variants.\nprice_history gives the daily lowest price for up to a year; daily_deals lists the biggest drops of the last 24 hours. No API key is needed for any of the three at the anonymous rate limit.\ncompare_digital compares digital services (AI subscriptions, AI API token prices with a monthly cost for a given usage, AI picture and video tools, streaming, music, VPN, cloud) by price per month in the buyer's currency, from official price lists with source_url and verified_on.\ncompare_internet compares home internet provider summaries by country, technology, advertised speed, listed price and commitment; it includes address-check links and source URLs. Address availability and an exact offer must still be confirmed by the provider.\ncompare_mobile compares sourced CZ and SK mobile tariffs from docs/data/mobilni-tarify.json; choose a country, filter by allowance or operator, and use source_url and verified_on to check each result.\nA shop that wants to be compared: check_shop_feed (the feed by address or as a file; report and a preview, nothing stored), then register_shop, verify_shop_domain and get_shop_registration until the operator decides. Partners, media and creators write with send_cooperation_inquiry; anyone else writes to Fordeal with send_contact_message (topic general, support, cooperation or privacy).",
      "tools": [
        {
          "name": "add_to_list",
          "title": "Add a product or a digital plan to a named list",
          "description": "Adds a product (`product_slug`) or a digital service plan (`digital_id`, a plan id of compare_digital / compare_mobile, e.g. claude-pro) to one of the signed-in person's lists with an optional private note; send exactly one of the two. For a product its total for `deliver_to_country` today is kept as saved_total (for \"the price changed since you saved it\"); a plan keeps no saved price. Adding it again only changes the note. At most 200 items per list. Another person's list answers not_found.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "deliver_to_country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. \"CZ\". Optional: normally derived from the address.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "digital_id": {
                "description": "A plan id of compare_digital / compare_mobile rows (e.g. claude-pro).",
                "pattern": "^[a-z0-9][a-z0-9._-]{0,119}$",
                "type": "string"
              },
              "list_id": {
                "description": "The list's id from list_my_lists.",
                "maxLength": 64,
                "minLength": 8,
                "type": "string"
              },
              "locale": {
                "description": "BCP 47 locale for human-readable strings, e.g. \"en\", \"cs\", \"sk\". Defaults to the country's default locale.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "note": {
                "anyOf": [
                  {
                    "maxLength": 280,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "A private note to the product (at most 280 characters); never shown on the share link."
              },
              "product_slug": {
                "description": "The product's slug (search_products, find_best_price).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["list_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a product or a digital plan to a named list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
