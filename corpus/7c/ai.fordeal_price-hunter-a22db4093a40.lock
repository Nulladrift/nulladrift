        {
          "name": "find_best_price",
          "title": "Find the best price for a product",
          "description": "Where to buy a product cheapest today: offers ranked by the real product price (converted to the buyer's currency with a dated rate), the shipping to the buyer's country shown as its own value on every offer, and whether the shop can be trusted. `sort=total` (or include_shipping=true) orders by goods + shipping instead. `query` is free text (\"washing machine under 12 000, 60 cm\"), a model name, an EAN, or a product URL from any e-shop. A BROAD query (a brand, a category word or a line name without a model: \"lego\", \"ps5\", \"sluchátka\") has no single best product, so it returns no card: `broad_query` true, `match` \"broad\", up to 5 `candidates` (slug, name, product price `goods`, `shipping`, `total`, `shops`, `shop`, `url`, `captured_at`, ranked by relevance), `total_matches` and a `hint` to narrow the query (add a model, size, capacity or set number) or call get_product with a candidate slug. A specific query returns one card: `match` (exact | close: close means the nearest product is another variant than the query names, e.g. iPhone 16 Plus for \"iPhone 16 256 GB\"; `match_note` says how, `warnings` opens with it and `reasons` carries close_match; never present a close card as the asked-for item), verdict (buy_now | wait | buy_alternative | no_offer) with a headline and explanation in `locale`, the recommended offer `best` (shop, trust label verified | rated | unknown, rating 0-1, rating_url = the public page of the source that rating comes from or null, total.goods = the product price and total.shipping in the deliver-to currency, total.total = their sum, FX date, capture time), `cheapest_total` (the offer with the lowest total including shipping), three alternatives (cheapest domestic, cheapest cross-border, best rated), every shown offer with its blockers and `price_status` (verified = goods + stated shipping, the sum the buyer pays; estimate = the shop states only its lowest \"from\" shipping rate; incomplete = shipping to the country unknown or import duties open, a lower bound that is never the cheapest), a 90-day price history, and `commission_disclosure`. Every offer carries `labels` (lowest_price = the lowest product price; recommended = `best` when it is dearer than that, never call it the cheapest; lowest_verified_total = the cheapest total with a stated, not \"from\", shipping, among FRESH offers only; a marketplace offer's shipping is always approximate), `shipping_is_estimate` (a \"from\" or unknown shipping, the total then a lower bound, or the shop's general shipping rule: an estimate for this item), `shipping_verified` (true only for shipping captured for the offer; from the shop's general rule it is an estimate) and `price_verified` (false when the price is older than 36 hours: say \"previously verified, the price may be out of date\"; separate from `shipping_verified`), `marketplace.seller_known` / `ships_from_known` (false: say the seller or dispatch country is not stated) and `saving_is_estimate` (its `savings_vs_best` rests on such a shipping: say estimated, never a certain saving). Rules: a shop on a consumer-protection risk list is never shown; a shop without a rating is never `best`; an offer with unknown shipping or a price older than 36 hours is never `best`. Cross-border offers carry `cross_border` (EU warranty, returns, support languages). Send the buyer to `best.url` (Fordeal's click URL, which forwards to the shop) and tell them the product price, the shipping and the capture time. Next: price_history for the trend, or find_best_price again with verified_only=true.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "budget": {
                "description": "Budget in the deliver-to currency; a total above it turns the verdict into buy_alternative.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "deep": {
                "description": "Let the model weigh the verdict and write the explanation (adds seconds). Default false: stored prices and the rules answer in under 2 s; `refresh_pending` true means the shops are being asked again in the background.",
                "type": "boolean"
              },
              "deliver_to_country": {
                "description": "Where the buyer wants delivery (ISO 3166-1 alpha-2). Default: the first compared country.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "include_shipping": {
                "description": "Same as sort=total: count shipping in the order (the website's \"Zahrnout dopravu\"). Default false.",
                "type": "boolean"
              },
              "locale": {
                "description": "BCP 47 locale for human-readable strings, e.g. \"en\", \"cs\", \"sk\". Defaults to the country's default locale.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "query": {
                "description": "Product name, model, EAN, or a product URL.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              },
              "sort": {
                "description": "Order of `offers` and the price `best` is chosen by: product = lowest product price (the default; every offer still carries its shipping and total), total = lowest total with shipping to `deliver_to_country`. The card says which in `sort`; `cheapest_total` is the lowest total either way.",
                "enum": ["product", "total"],
                "type": "string"
              },
              "verified_only": {
                "description": "Only shops with a customer rating.",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find the best price for a product"
          },
          "behavior": {
