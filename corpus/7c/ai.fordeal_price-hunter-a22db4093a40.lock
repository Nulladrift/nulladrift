        {
          "name": "search_products",
          "title": "Search and filter compared products",
          "description": "The website's category and search grid for an agent: products with the product price of their shown offer (`lowest_goods`, in the `deliver_to_country` currency; its shipping `lowest_shipping` and the total `lowest_total` beside it, with capture time and `price_status` verified | estimate | incomplete), number of shops, best shop and trust label. Give `query` (free text, every word must match; 8 to 14 digits are an EAN, matched exactly) and/or `category` (a slug from GET /api/v1/deals/categories, e.g. letni-pneumatiky, mobilni-telefony), or neither to browse the whole catalogue (the website's /produkty page), or `slugs` (product slugs) to compare named products side by side; then any filters: price_min/price_max, brand, shops, shop_country (e.g. DE for offers from Germany), in_stock, on_sale, free_shipping, min_shop_rating, min_product_rating, attr (key:value pairs); sort price (lowest product price first, the default), price_desc, total (lowest total with shipping, opt-in; or include_shipping=true), total_desc, discount, shops, popular, rating, score, name. Answers at most `limit` products (default 20) from `offset`; `total_matches` counts every match, and `facets: true` adds the brands, shops, price range and attribute values with counts over the whole filtered list. With `query`, `query_match` says how the list answers it (all = every word found; partial = some words were dropped or matched only by typo tolerance; fallback = no product has the words, the list is the closest category's; none = nothing matches) and every product carries `match` (exact | close = another variant | partial = the name lacks some query words, `match_note` names them | fallback = not a match); never present a partial or fallback product as the asked-for item. Next: find_best_price with a product name for the full card with every offer, or price_history with `slug`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "attr": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 50,
                    "type": "array"
                  }
                ],
                "description": "Attribute filter as `key:value` pairs (comma-separated in a query string, or repeated). The same key twice means any of its values; different keys must all match. Keys and values are those of `facets.attributes` (stored attributes plus storage_gb, ram_gb, diagonal and tyre_size read from the name; in phones, laptops, TVs, washing machines and headphones also network, cpu, gpu, resolution, panel, refresh_hz, tv_os, load_kg, spin_rpm, energy_class, top_loading, washer_dryer, wireless, anc and gaming), e.g. attr=storage_gb:256 GB,storage_gb:512 GB,ram_gb:8 GB."
              },
              "brand": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 100,
                    "type": "array"
                  }
                ],
                "description": "Brand or brands, matched case-insensitively against the exact brand name. MCP: an array of names (each item is one whole name, commas kept, e.g. [\"Euromedia Group, a.s.\", \"Grada\"]). Query string: repeat the parameter for exact names (`brand=Euromedia Group, a.s.&brand=Grada`; each value is one whole name, commas kept), or give one comma-separated value (`brand=Apple,Samsung`) where a comma inside a name is written `\\,` and a backslash `\\\\` (`brand=Euromedia Group\\, a.s.,Grada`). A single comma-separated value also matches as one whole name, so `brand=Euromedia Group, a.s.` finds that brand (and any brand named exactly `Euromedia Group` or `a.s.`)."
              },
              "category": {
                "description": "Category slug (leaf, main category or group).",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "deliver_to_country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. \"CZ\". Optional: normally derived from the address.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "facet_attributes": {
                "description": "false = facets without `attributes` (the whole catalogue without a category has about 1 800 attribute keys; the website's /produkty asks without them).",
                "type": "boolean"
              },
              "facets": {
                "description": "true = also answer `facets` over the WHOLE filtered list, not just this page: brands, shops and shop countries with counts, the price range (min/max total), in_stock/on_sale/free_shipping counts and attribute values with counts. Each facet is counted over the products that pass every other filter, so the counts say what picking that value would give. With `facets` (or `attr`) every product's `attributes` also carries the derived keys (storage_gb, ram_gb, diagonal, tyre_size, and the top categories' parameters read from the name). `facets.categories` counts the leaf categories of the filtered list, `facets.price_p99` is the total 99 % of products stay under (a slider's upper end), `facets.price_p05` the total 95 % of products are at or above (a robust lower end; one wrong 0 price does not move it).",
                "type": "boolean"
              },
              "free_shipping": {
                "description": "Only products with free delivery at the shown offer.",
                "type": "boolean"
              },
              "in_stock": {
                "description": "Only products whose shown offer is in stock.",
                "type": "boolean"
              },
              "include_shipping": {
                "description": "Order by the total with shipping to `deliver_to_country` instead of the product price (sort=total). Default false.",
                "type": "boolean"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "BCP 47 locale for human-readable strings, e.g. \"en\", \"cs\", \"sk\". Defaults to the country's default locale.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "min_product_rating": {
                "description": "Lowest rating of the product itself, 0..1: the shops' own customer reviews and forDeal reviews (0.9 = 90 %).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "min_shop_rating": {
                "description": "Lowest rating of the shown shop, 0..1 (0.9 = 90 % / 4.5 stars).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "description": "Rows to skip before `limit` (paging). `total` in the answer is the number of matching products before offset and limit, so offset + count < total means there is another page.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "on_sale": {
                "description": "Only products with a shop discount or a measured drop.",
                "type": "boolean"
              },
              "price_max": {
                "description": "Highest product price in the deliver-to currency (shipping not counted).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "price_min": {
                "description": "Lowest product price in the deliver-to currency (the shown offer's goods price, shipping not counted).",
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "description": "Short name of `query` (the same search; `query` wins when both are given).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "query": {
                "description": "Free text; every word must appear in the product name. 8 to 14 digits are an EAN (exact match on the product's or an offer's barcode).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "shop_country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ],
                "description": "Country codes of the shops (e.g. DE to see offers from Germany)."
              },
              "shops": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ],
                "description": "Shop slugs (e.g. datart-cz); a product passes when one of them prices it."
              },
              "slugs": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  }
                ],
                "description": "Product slugs (comma-separated or an array): only these products, every filter still applies. The website's product comparison (/produkty/porovnat?p=a,b,c) compares up to 4."
              },
              "sort": {
                "description": "relevance = best match first (the default with `query`; the answer card names the first row), price = lowest product price first (the default without `query`; shipping is shown per product, not counted), price_desc = most expensive product price, total = lowest total with shipping first (opt-in, the same as include_shipping=true), total_desc = highest total with shipping, discount = biggest discount, shops = most shops, popular = most searched and clicked, rating = best rated product (shops' and forDeal reviews, fewer reviews count less), score = forDeal score 0–100 (popularity, shops, price vs. 30 days, shop rating, product rating; each product carries `score.parts`), goods = older name of price, name = alphabetical.",
                "enum": ["relevance", "price", "price_desc", "total", "total_desc", "discount", "shops", "popular", "rating", "score", "name", "goods", "newest"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search and filter compared products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58e680e5beda9103e6b8ea0f6a4e8185b6b3645ceb7fa2899d8a5f11b7f359f0"
        },
        {
          "name": "send_contact_message",
          "title": "Write a message to Fordeal (the contact form)",
          "description": "The /kontakt form without the website: `name`, `email` (where the answer goes), `topic` general | support | cooperation | privacy and `message` (10 to 4 000 characters). The message goes as one notice to hello@fordeal.ai with the sender as Reply-To; a person answers by e-mail. The sender gets no automatic e-mail (the answer here is the confirmation of receipt, with `id`). The same message twice on one day answers the same id with `duplicate: true`. A shop that wants to be compared uses register_shop; a partner, the media or a creator may use send_cooperation_inquiry for a structured request. Public, no key; five messages a minute per caller.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Where the answer goes; never shown, never mailed by the form itself.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "ip_hash": {
                "description": "sha-256 of the sender's address with a daily salt (the website computes it); counts the per-visitor limit. Never stored.",
                "maxLength": 64,
                "type": "string"
              },
              "locale": {
                "description": "Language of the page the person wrote from (cs, sk, en, …).",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "message": {
                "description": "The message itself, 10 to 4 000 characters.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "name": {
                "description": "Who writes (a name or how to address the person).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "nickname": {
                "description": "Leave empty (spam trap: a filled value is discarded quietly).",
                "maxLength": 200,
                "type": "string"
              },
              "topic": {
                "description": "general = a question about Fordeal, a price or a shop; support = a problem with the website or the account; cooperation = partners, media, creators (shops register on /obchody); privacy = a request about personal data (GDPR: access, erasure, objection).",
                "enum": ["general", "support", "cooperation", "privacy"],
                "type": "string"
              }
            },
            "required": ["email", "message", "name", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Write a message to Fordeal (the contact form)"
          },
          "behavior": {
