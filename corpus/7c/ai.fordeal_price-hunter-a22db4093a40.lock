                "minLength": 3,
                "type": "string"
              },
              "days": {
                "description": "Window in days. Default 365.",
                "maximum": 365,
                "minimum": 7,
                "type": "integer"
              },
              "deliver_to_country": {
                "description": "Country whose shown price is the last point (today). Default: the country of the currency.",
