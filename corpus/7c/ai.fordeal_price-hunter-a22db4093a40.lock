                  },
                  "video_seconds_per_month": {
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "video_seconds_per_month": {
                "description": "Flat form of usage.video_seconds_per_month.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["category"],
