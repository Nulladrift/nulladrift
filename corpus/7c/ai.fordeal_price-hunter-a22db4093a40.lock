      "instructions": "Fordeal answers one question: where to buy a product cheapest today in Czechia or Slovakia (more countries coming), by the real product price with the shipping shown separately for every offer, and whether the shop can be trusted.\nStart with product {action:\"find\", query, country}: query is text, model, EAN or a product URL, country the delivery country. Read verdict, headline, best.total (goods = product price, shipping, total), best.shop.trust and best.captured_at; send the buyer to best.url. A broad query returns up to 5 `candidates` and a `hint`: narrow it, or call product {action:\"get\", product:<slug>}.\nRules: prices are product prices in the buyer's currency (foreign prices converted with a dated rate); shipping and total are separate values on each offer (sort=total counts shipping); every price has captured_at; shops on a consumer-protection risk list are never shown and unrated shops are never the recommendation; a cross-border offer carries its warranty, returns and support-language facts; show the commission_disclosure of every answer. Ranking never depends on commission.\nOther tools: search, deals, digital (AI, streaming, VPN... by monthly price), telecom, energy, insurance (information only), shops (compared shops; a shop joins with check_feed, register, verify_domain, status), price_watch, contact. Actions on a person's own data (price_watch list/set/update/delete, favorites, comparisons, lists, my_account, shops mine/statistics) need that person's access token.\nEvery tool takes an `action`; its description names them. Full arguments and examples: help {topic:\"<tool>\"} or the resource fordeal://docs/<tool>; the rules in long form: help {topic:\"overview\"}. Old tool names (find_best_price, get_product, compare_digital ...) still work but are deprecated. No key is needed at the anonymous rate limit.",
