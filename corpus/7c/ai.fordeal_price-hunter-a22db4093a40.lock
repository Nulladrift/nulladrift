                "minLength": 8,
                "type": "string"
              },
              "locale": {
                "description": "BCP 47 locale for human-readable strings, e.g. \"en\", \"cs\", \"sk\". Defaults to the country's default locale.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "name": {
                "description": "The list's name, e.g. Narozeniny (1 to 80 characters).",
