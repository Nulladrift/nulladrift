                "type": "string"
              },
              "locale": {
                "description": "Language of the answer.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "message": {
                "description": "What you saw, e.g. the price on the shop's page and when.",
                "maxLength": 1000,
                "minLength": 5,
                "type": "string"
              },
              "offer_id": {
                "description": "The offer the report is about (offer_id in the card).",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
