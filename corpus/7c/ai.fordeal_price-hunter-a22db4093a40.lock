        {
          "name": "price_history",
          "title": "Price history of a product",
          "description": "Daily lowest price of a product across compared shops for up to 365 days (the last point, today, is the product price the product page shows as its main price), plus every current offer with its capture time. `product` is the slug from find_best_price (`product.slug`) or a product id. Use it to say whether today's price is a low, and how much it moved. `price_verdict` {level low|usual|high|short_history|stale, percentile, days, basis} rates the latest price against the last 90 days of our own captured daily lows (no judgement under 14 days; never a discount claim; is_lowest wins: the lowest price of the period is never recently_cheaper; recently_cheaper = more than 8 % above the 30-day low); `advice` (lowest | low | recently_cheaper | usual | high | short | sparse | stale) is the one key derived from it, and find_best_price carries the same object, the same advice and a verdict that never contradicts it (wait only with recently_cheaper, or in the sale season above a lower price of the period). Next: find_best_price for the current recommendation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "currency": {
                "description": "Currency of the points. Default: the currency of the first offer.",
