        {
          "name": "resolve_country",
          "title": "Resolve country",
          "description": "Turns a country name, alias or code (English, Japanese, Chinese) into ISO codes: matches[] {iso2, iso3, name, score}, best first, max 5, empty if none. Call it first when you only have a name: get_country_facts, check_entry_requirements, get_trip_brief and the other tools take ISO codes. Exact, prefix (3+ chars) or substring (4+) match, ignoring case and punctuation; no spelling correction. Names only (CLDR): no sources or confidence.\nParameters: pass query as the user wrote it; if nothing matches, retry with the official or local name. lang only localizes the returned names. Examples: {\"query\":\"日本\"}, {\"query\":\"South Korea\",\"lang\":\"ja\"}.\nRead-only; free and keyless, no quota.",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language for localized names (BCP 47). Supported: en, ja, zh-Hans, zh-Hant; aliases such as zh, zh-CN, zh-TW and zh-HK are mapped, and anything else falls back to English. Only names are localized; verbatim official quotes stay in their original language.",
                "examples": ["en", "ja", "zh-Hans", "zh-Hant"],
                "type": "string"
              },
              "query": {
                "description": "Country name, alias or code, in English, Japanese or Chinese. Case-, space- and punctuation-insensitive (a leading \"the\" is ignored); matches exactly, by prefix (3+ characters) or by substring (4+ characters); not a spelling corrector.",
                "examples": ["Japan", "日本", "UK", "Côte d'Ivoire"],
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "properties": {
                  "matches": {
                    "description": "Up to 5 matches, best first. Empty when nothing matches.",
                    "items": {
                      "properties": {
                        "iso2": {
                          "type": "string"
                        },
                        "iso3": {
                          "type": "string"
                        },
                        "matched": {
                          "description": "The name or code that matched.",
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "score": {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["iso2", "score"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "query": {
                    "type": "string"
                  }
                },
                "required": ["matches", "query"],
                "title": "Result",
                "type": "object"
              },
              {
                "description": "Only on error results (isError: true): RFC 9457 problem, e.g. unknown country, no data, key required, rate limited, sanctions block.",
                "properties": {
                  "detail": {
                    "type": "string"
                  },
                  "status": {
                    "type": "integer"
                  },
                  "title": {
                    "type": "string"
                  },
                  "type": {
                    "type": "string"
                  }
                },
                "required": ["status", "title", "type"],
                "title": "Error (problem details)",
                "type": "object"
              },
              {
                "description": "Only on error results (isError: true): x402 v2 payment requirements. Pay and retry with _meta[\"x402/payment\"].",
