        {
          "name": "get_trip_brief",
          "title": "Trip brief",
          "description": "Whole-trip brief for 1-5 destinations: per destination, in order, entry (as check_entry_requirements, if passport given), power verdict from home_country, currency, emergency numbers, driving side, tipping and holidays between from and to. Use it to summarise a trip; for one fact use check_entry_requirements, check_power_compatibility, get_emergency_numbers, get_tipping_norms or get_public_holidays, and get_country_facts for one country without dates. No passport: entry null, no advisory. If one destination's entry can't be answered (outside pilot, no data, same country) it is {unavailable: reason} and the rest still returns. power is null at home or without plug data; a category without data is {}. An unknown home or destination code, over 5 destinations or a bad date range fails the call. Each fact is cited: sources[] (url, license), last_verified, confidence. Show the advisory.\nParameters: passport = nationality (optional); home_country = where traveller and devices come from; destinations in travel order, home only if it is a stop; from/to = whole trip, inclusive. Example: {\"passport\":\"US\",\"home_country\":\"US\",\"destinations\":[\"JP\",\"KR\"],\"from\":\"2026-12-28\",\"to\":\"2027-01-05\"}.\nRead-only; free API key or x402, charged per call, not per destination (https://citedtravel.com/pricing/); errors RFC 9457.",
          "inputSchema": {
            "properties": {
              "destinations": {
                "description": "Destination countries, in travel order.",
                "examples": [
                  ["JP", "KR"]
                ],
                "items": {
                  "description": "Destination country as an ISO 3166-1 alpha-2 or alpha-3 code, case-insensitive (e.g. JP, jp or JPN). Names are not accepted: resolve them with resolve_country first.",
                  "examples": ["JP", "GB", "USA"],
                  "pattern": "^[A-Za-z]{2,3}$",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "from": {
                "description": "Trip start (inclusive). Calendar date, YYYY-MM-DD.",
                "examples": ["2026-12-28"],
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "home_country": {
                "description": "Country the traveller starts from; used for the adapter/converter verdict as an ISO 3166-1 alpha-2 or alpha-3 code, case-insensitive (e.g. JP, jp or JPN). Names are not accepted: resolve them with resolve_country first.",
                "examples": ["JP", "GB", "USA"],
                "pattern": "^[A-Za-z]{2,3}$",
                "type": "string"
              },
