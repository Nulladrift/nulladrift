      "instructions": "CitedTravel: cited, confidence-scored travel facts. All tools are read-only with no side effects; the same input gives the same answer until the dataset is updated.\nProvenance: every fact carries sources[] (publisher, url, license, verbatim quote or source value), cross_checks, last_verified, next_review_due and confidence {score 0-1, level, reasons}. Relay citations to users and show the attribution[] strings when you display data.\nEntry requirements are decision support only: always show the advisory and the official links.\nAuth and cost (plans: https://citedtravel.com/pricing/): resolve_country is free and never counts against a quota. The static fact tools work without a key (per-IP rate limit); with an API key (Authorization: Bearer) they count against the key's monthly quota. check_entry_requirements and get_trip_brief need a free API key (https://citedtravel.com/docs/#keys) or an x402 payment; each call counts as one entry lookup, and a trip brief is one call however many destinations it has.\nx402: when a key is missing or a limit is reached, the error result carries an x402 v2 payment request in structuredContent. Pay it and retry the same call with the payment payload in _meta[\"x402/payment\"]; one payment covers one call, and the settlement receipt comes back in _meta[\"x402/payment-response\"]. Paid access is refused from sanctioned locations and wallets.\nLimits: a per-minute limit applies to every caller, plus monthly quotas for keys; going over returns a rate-limited error (status 429).\nErrors: tool errors are isError results with text content and an RFC 9457 problem {type, title, status, detail} in structuredContent (unknown country, no data, bad date range, key required, rate limited); unknown tools and malformed requests are JSON-RPC errors.\nLanguage: pass lang (en, ja, zh-Hans, zh-Hant; zh, zh-CN, zh-TW map automatically) for localized names; verbatim official quotes stay in their original language.",
      "tools": [
        {
          "name": "check_entry_requirements",
          "title": "Entry requirements (pilot)",
          "description": "Visa/entry information for a short tourist stay, for a pilot set of passports, from official government sources, with verbatim quotes, official links and a mandatory advisory. Decision support only: never a go/no-go verdict. Returns status (visa_free, visa_free_with_requirements, visa_on_arrival, eta_required, evisa_required, visa_required, unclear), max_stay_days, additional_requirements[], quotes[] (authoritative), official_links, advisory, sources[], confidence, last_verified. One passport, one destination; for a full trip use get_trip_brief, which embeds this per destination. Coverage: pilot passports (the error for others lists them), tourism only. Based on the passport country's official travel advice; the destination's own rules are covered only as far as the official pages quoted in quotes[]. Transit, other visa types and special cases are not covered: point users to official_links, and always show the advisory.\nParameters: passport is the nationality of the passport used (dual nationals: one call each); destination is the country entered, not transit stops. Example: {\"passport\":\"GB\",\"destination\":\"JP\"}.\nRead-only; free API key or x402 per call (https://citedtravel.com/pricing/); errors RFC 9457.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Destination country; must differ from passport as an ISO 3166-1 alpha-2 or alpha-3 code, case-insensitive (e.g. JP, jp or JPN). Names are not accepted: resolve them with resolve_country first.",
                "examples": ["JP", "GB", "USA"],
                "pattern": "^[A-Za-z]{2,3}$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language for localized names (BCP 47). Supported: en, ja, zh-Hans, zh-Hant; aliases such as zh, zh-CN, zh-TW and zh-HK are mapped, and anything else falls back to English. Only names are localized; verbatim official quotes stay in their original language.",
                "examples": ["en", "ja", "zh-Hans", "zh-Hant"],
                "type": "string"
              },
              "passport": {
                "description": "Passport (nationality) country as an ISO 3166-1 alpha-2 or alpha-3 code, case-insensitive (e.g. JP, jp or JPN). Names are not accepted: resolve them with resolve_country first.",
                "examples": ["JP", "GB", "USA"],
                "pattern": "^[A-Za-z]{2,3}$",
                "type": "string"
              },
              "purpose": {
                "default": "tourism",
                "description": "Trip purpose. Only short tourist stays are covered (\"tourism\"; \"tourism_short_stay\" is an accepted alias); anything else returns an error.",
                "enum": ["tourism", "tourism_short_stay"],
                "examples": ["tourism"],
                "type": "string"
              }
            },
            "required": ["destination", "passport"],
            "type": "object"
          },
