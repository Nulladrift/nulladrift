          "name": "get_emergency_numbers",
          "title": "Emergency numbers",
          "description": "Emergency numbers for one country: data.numbers.value {police, ambulance, fire, general, all_numbers}. A role without its own number is null: then use general, else all_numbers (in 58 countries only all_numbers is filled). Use it when only these numbers are needed; get_country_facts for several facts, get_trip_brief for a whole trip. No data for the country is a not-found error. Each fact is cited: sources[] (url, license), last_verified, confidence.\nParameters: country is where the call will be made (the traveller's location, not home); alpha-2 works best. Example: {\"country\":\"JP\"}.\nRead-only; keyless (free key or x402 lifts limits: https://citedtravel.com/pricing/); errors RFC 9457.",
