        {
          "name": "get_country_facts",
          "title": "Country facts",
          "description": "Several cited facts for one country in one call: power, currency, emergency numbers, driving side, this year's public holidays, tipping (data.<category>.<field>; a category without data is {}). Use it for a country overview. For one topic use get_emergency_numbers, get_tipping_norms, get_public_holidays (any dates) or check_power_compatibility (adapter verdict); for a whole trip get_trip_brief; for visas check_entry_requirements. Each fact is cited: sources[] (url, license), last_verified, confidence.\nParameters: alpha-2 country codes work best (alpha-3 too; names via resolve_country). Request only the categories you need to keep the answer small. Examples: {\"country\":\"JP\"}, {\"country\":\"FRA\",\"categories\":[\"power\",\"currency\"]}.\nRead-only; keyless (free key or x402 lifts limits: https://citedtravel.com/pricing/); errors RFC 9457.",
          "inputSchema": {
            "properties": {
              "categories": {
                "description": "Categories to return; omit for all six.",
                "examples": [
                  ["power", "currency"]
                ],
                "items": {
                  "enum": ["power", "currency", "emergency", "driving", "holidays", "tipping"],
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
