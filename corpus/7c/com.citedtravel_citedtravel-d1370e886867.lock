        {
          "name": "list_recent_changes",
          "title": "Recent changes",
          "description": "Dataset change feed, newest first: data[] {changed_on, fact_id, country, category, change: added | updated | removed, old_value, new_value, source_url}. Use it to refresh caches or alert users when a fact changes, then fetch the current cited value (sources, license, confidence) with the matching tool, e.g. get_country_facts or check_entry_requirements. Entry rows: country is the destination, fact_id is entry:<passport>-><destination>.\nParameters: set since to the last changed_on you processed (inclusive: that day repeats). Filter by category and/or country; exactly limit rows means older ones were cut, so raise limit or narrow. Examples: {\"since\":\"2026-10-01\"}, {\"since\":\"2026-10-01\",\"category\":\"entry\",\"country\":\"JP\"}.\nRead-only; keyless (free key or x402 lifts limits: https://citedtravel.com/pricing/); errors RFC 9457.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Only changes in this category (entry = visa/entry pilot). Omit for all.",
                "enum": ["power", "currency", "emergency", "driving", "holidays", "tipping", "entry"],
                "examples": ["entry"],
                "type": "string"
              },
              "country": {
                "description": "Only changes for this country (for entry facts, the destination) as an ISO 3166-1 alpha-2 or alpha-3 code, case-insensitive (e.g. JP, jp or JPN). Names are not accepted: resolve them with resolve_country first.",
                "examples": ["JP", "GB", "USA"],
                "pattern": "^[A-Za-z]{2,3}$",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Maximum rows, newest first. Default 100; values are clamped to 1-500 (numeric strings are accepted).",
                "examples": [50],
                "type": ["integer", "string"]
              },
              "since": {
                "description": "Return changes on or after this date. Calendar date, YYYY-MM-DD.",
                "examples": ["2026-10-01"],
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "properties": {
                  "data": {
                    "description": "Changes, newest first.",
                    "items": {
                      "properties": {
                        "category": {
                          "type": "string"
                        },
                        "change": {
                          "enum": ["added", "updated", "removed"],
                          "type": "string"
                        },
                        "changed_on": {
                          "description": "YYYY-MM-DD.",
                          "type": "string"
                        },
                        "country": {
                          "type": "string"
                        },
                        "dataset_version": {
                          "type": "string"
                        },
                        "fact_id": {
                          "type": "string"
                        },
                        "new_value": {
                          "description": "New value (null when removed)."
                        },
                        "old_value": {
                          "description": "Previous value (null when added)."
                        },
                        "seq": {
                          "type": "integer"
                        },
                        "source_url": {
                          "description": "Main source of the fact. Fetch the fact with the matching tool for full citations and confidence.",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["category", "change", "changed_on", "country", "fact_id"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "dataset_version": {
                    "description": "Version of the dataset that answered.",
                    "type": "string"
                  },
                  "since": {
                    "type": "string"
                  }
                },
                "required": ["data", "since"],
                "title": "Result",
                "type": "object"
              },
              {
                "description": "Only on error results (isError: true): RFC 9457 problem, e.g. unknown country, no data, key required, rate limited, sanctions block.",
                "properties": {
