{
  "lockfileVersion": 2,
  "subjects": {
    "com.kashifaudit/audit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kashifaudit.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kashif-website-audit",
        "title": "Kashif — website audit",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use scan_website to score a business’s online presence out of 100 and list the top issues. It needs the website URL and an email so the Kashif team can follow up. The score it returns is a quick automated pass; for the full report, run a scan at kashifaudit.com. If scan_website answers with status \"processing\", wait about 30 seconds and call get_scan_result with the scanId it returned (repeat every 30 seconds or so until the status is \"ready\" or \"failed\").",
      "tools": [
        {
          "name": "get_scan_result",
          "title": "Collect the result of a website scan",
          "description": "Collect the result of a scan that scan_website started but had not finished when it answered. Call scan_website first; if its status is \"processing\", wait a little (about 30 seconds) and call this with the scanId it returned. Returns the same result as scan_website: \"processing\" (ask again shortly), \"ready\" (the 0-100 score and top issues) or \"failed\". It only reads: it never starts a scan. A scanId stops working 7 days after it was issued.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "scanId": {
                "description": "The scanId that scan_website returned with status \"processing\".",
                "maxLength": 300,
                "type": "string"
              },
              "waitSeconds": {
                "description": "Optional: how many seconds to wait for a scan that is still running before answering (0-20, default 0 = answer now).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["scanId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "findings": {
                "description": "The top issues to fix first, most urgent first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "issue": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["critical", "major", "minor"],
                      "type": "string"
                    }
                  },
                  "required": ["issue", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "Plain-language context about the score.",
                "type": "string"
              },
              "scanId": {
                "description": "Present while status is \"processing\": pass it to get_scan_result to collect the finished result.",
                "type": "string"
              },
              "score": {
                "anyOf": [
                  {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "0-100 online-presence score, or null until the quick pass finishes."
              },
              "status": {
                "description": "\"ready\" = quick score below; \"processing\" = still running, collect it with get_scan_result; \"failed\" = site could not be checked.",
                "enum": ["ready", "processing", "failed"],
                "type": "string"
              },
              "website": {
                "description": "The website that was scanned.",
                "type": "string"
              },
              "whatsapp": {
                "description": "A WhatsApp link to reach the Kashif team about this business.",
                "type": "string"
              }
            },
            "required": ["findings", "note", "score", "status", "website", "whatsapp"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Collect the result of a website scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:04c8bb1e5a4769fbfa06435d52d96e36fe9595863a51d765597d42275f836b87"
        },
        {
          "name": "scan_website",
          "title": "Score a business’s online presence",
          "description": "Score how well a business shows up online, out of 100, and name what is hurting it most. Give it a website (and an email, so the Kashif team can follow up) and it runs Kashif's audit of the business's online presence: whether customers can find them in search, whether AI assistants can read them, how fast the site feels on a phone and the first impression it makes, how trustworthy it looks, and how easy the business is to reach (WhatsApp, phone, a contact form). Returns a 0-100 score with the top issues to fix first. Use it whenever someone asks to audit, check, review, grade or improve a company's website or online presence. This starts a live scan and creates a lead for the Kashif team, who may follow up by email. If the result comes back with status \"processing\", the scan is still running: wait about 30 seconds, then call get_scan_result with the scanId it returned to collect the score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Your email, so the Kashif team can follow up. Required — this is a lead for the team.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "language": {
                "description": "Report language: \"en\" (default) or \"ar\" for Arabic.",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "name": {
                "description": "Optional: the person or business name, used to label the lead.",
                "maxLength": 120,
                "type": "string"
              },
              "url": {
                "description": "The business’s website, e.g. example.com or https://example.com.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["email", "url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "findings": {
                "description": "The top issues to fix first, most urgent first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "issue": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["critical", "major", "minor"],
                      "type": "string"
                    }
                  },
                  "required": ["issue", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "Plain-language context about the score.",
                "type": "string"
              },
              "scanId": {
                "description": "Present while status is \"processing\": pass it to get_scan_result to collect the finished result.",
                "type": "string"
              },
              "score": {
                "anyOf": [
                  {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "0-100 online-presence score, or null until the quick pass finishes."
              },
              "status": {
                "description": "\"ready\" = quick score below; \"processing\" = still running, collect it with get_scan_result; \"failed\" = site could not be checked.",
                "enum": ["ready", "processing", "failed"],
                "type": "string"
              },
              "website": {
                "description": "The website that was scanned.",
                "type": "string"
              },
              "whatsapp": {
                "description": "A WhatsApp link to reach the Kashif team about this business.",
                "type": "string"
              }
            },
            "required": ["findings", "note", "score", "status", "website", "whatsapp"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Score a business’s online presence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:44c5fd1775feaa6216d38742c6e3cf3cdf846104a515c45cfb3c532d44a5bda2"
        }
      ],
      "digest": "sha256:a3e2d6fc814dd65cde547c367aecc82b58c3676b7839386ce25bd23393d2ab6f"
    }
  }
}
