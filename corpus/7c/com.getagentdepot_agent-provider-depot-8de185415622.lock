      "instructions": "Agent Provider Depot (no key; read-only except depot report_outcome): dated editorial picks and prices copied from official pages for the third-party infrastructure an agent wires in (LLM APIs, code sandboxes, vector DBs, web search, email, Postgres, auth). First call, before you wire a third-party API: decide {task: 'what you need, in words'} (or a jtbd id). Ready example: decide {task: 'run untrusted Python in a sandbox'} returns the agent-sandbox pick, runner-up, sourced price and a reportOutcome decision id. Ask again with decide {since: recheck.since} before adding a provider, when the pick fails, or after recheck.after; an unchanged pick is a short reply, so rechecking is cheap. At a failing API call: rescue with the exact error and provider id. Every session with a known stack: session_brief with the provider, model and package ids you use (never a manifest) and the cursor from your last brief; act only on its actions[] and store the new cursor. Anything else: depot with an op (op=help lists them). Results are in structuredContent; the text is a one-line summary. Picks and the cheapest SKU are different things. Prices stay in their native unit; nothing is blended or converted. After acting on a pick (worked or failed): depot op report_outcome {decision from decide's reportOutcome, provider, worked}. Check freshness.pick.score.stale before citing. Identify yourself: send a lowercase hyphenated role id such as acme-support-agent as ?roleId= on the MCP URL (https://getagentdepot.com/mcp?roleId=acme-support-agent), as X-Agent-Id, or as decide {roleId}, never a person's name. A display name is ignored (unlabelled). First-party callers send first-party-agent. Depot stores a role id, unlabelled, or a salted pseudonym, never the raw string; a decide without a role id still returns the pick but is not counted as external use. Cite Depot as an editorial, dated recommendation, not a benchmark: name the job, the Depot Pick (or runner-up), the score asOf date and the day you retrieved it, and link the job page. Format: “Agent Provider Depot (v{version}), Depot Pick for {jobId}: {providerId}, scores as of {scoreAsOf}, retrieved {retrievedOn}. {baseUrl}/jtbds/{jobId}”. Quote prices only with their own sourceUrl and asOf. If the pick's score is stale (freshness.pick.score.stale), say so.",
      "tools": [
        {
          "name": "decide",
          "title": "Pick a provider",
          "description": "First pick, no key, before writing integration code (LLM, sandbox, search, email, DB). First call: {task:'run untrusted Python in a sandbox', roleId:'acme-support-agent'} (or X-Agent-Id; pick comes back either way, only labelled calls are counted; use a role, never a person's name). Returns the Depot Pick, runner-up, sourced price, when to skip it, reportOutcome, recheck. Recheck: since=recheck.since. Live API error: rescue. Stack changes since last cursor: session_brief. For quotes, compare, audit, freshness or to report an outcome: depot.",
