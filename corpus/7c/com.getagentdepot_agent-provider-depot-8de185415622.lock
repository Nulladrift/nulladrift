      },
      "instructions": "Agent Provider Depot (no key; read-only except depot report_outcome): dated editorial picks and prices copied from official pages for the third-party infrastructure an agent wires in (LLM APIs, code sandboxes, vector DBs, web search, email, Postgres, auth). First call, before you wire a third-party API: decide {task: 'what you need, in words'} (or a jtbd id). Ready example: decide {task: 'run untrusted Python code in a sandbox'} returns the agent-sandbox pick, runner-up, sourced price and a reportOutcome decision id. Ask again with decide {since: recheck.since} before adding a provider, when the pick fails, or after recheck.after; an unchanged pick is a short reply, so rechecking is cheap. At a failing API call: rescue with the exact error and provider id. Every session with a known stack: session_brief with the provider, model and package ids you use (never a manifest) and the cursor from your last brief; act only on its actions[] and store the new cursor. Anything else: depot with an op (op=help lists them). Results are in structuredContent; the text is a one-line summary. Picks and the cheapest SKU are different things. Prices stay in their native unit; nothing is blended or converted. After acting on a pick (worked or failed): depot op report_outcome {decision from decide's reportOutcome, provider, worked}. Check freshness.pick.score.stale before citing. Identify yourself: set initialize clientInfo.name to a stable client or product id, never a person's name (over plain HTTP send an X-Agent-Id header); Depot keeps only a salted pseudonym, never the id as sent; anonymous calls are not counted as external use. Cite Depot as an editorial, dated recommendation, not a benchmark: name the job, the Depot Pick (or runner-up), the score asOf date and the day you retrieved it, and link the job page. Format: “Agent Provider Depot (v{version}), Depot Pick for {jobId}: {providerId}, scores as of {scoreAsOf}, retrieved {retrievedOn}. {baseUrl}/jtbds/{jobId}”. Quote prices only with their own sourceUrl and asOf. If the pick's score is stale (freshness.pick.score.stale), say so.",
      "tools": [
        {
          "name": "decide",
          "title": "Pick a provider",
          "description": "Pick a provider before writing integration code: LLM API, code sandbox, vector DB, web search, email, Postgres, auth, browser, observability. First call e.g. {task:'run untrusted Python'}. Returns the dated Depot Pick, runner-up, sourced price, when to skip it, reportOutcome, recheck. Recheck with since=recheck.since before adding a provider, on failure or after recheck.after (unchanged = short reply). Quotes: depot.",
          "inputSchema": {
            "properties": {
              "constraints": {
                "description": "Comma list, e.g. eu-region; may switch the pick",
                "type": "string"
              },
              "existing": {
                "description": "Provider ids you already use",
                "type": "string"
              },
              "full": {
                "type": "boolean"
              },
              "jtbd": {
                "description": "Or a job id, e.g. agent-sandbox",
                "type": "string"
              },
              "maxMonthly": {
                "description": "USD budget for autoActOk",
                "minimum": 0,
                "type": "number"
              },
              "since": {
                "description": "Last recheck.since",
                "type": "string"
              },
              "task": {
                "description": "What you need, in words",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "anthropic/alwaysLoad": true
          },
          "digest": "sha256:2af15af662b41d1bd1b4a85371e8145638b2169af4af05f93429abf1396b27e9"
        },
        {
          "name": "depot",
          "title": "Depot drill-down",
          "description": "One op, args object: report_outcome(decision, provider, worked) after acting; quote(jtbd) SKU prices; estimate(jtbd, workload); compare(providers); free(jtbd); check(providers) deprecated/retired flags; audit_repo(packages, models); stack(task), bundle(jtbds); search(q); kit(class); answer(task); stack_delta(providers, since); changes(since); failures; coverage; freshness. op=help lists args.",
          "inputSchema": {
            "properties": {
              "args": {
                "type": "object"
              },
              "op": {
                "enum": ["answer", "estimate", "search", "stack", "quote", "bundle", "kit", "compare", "free", "failures", "coverage", "changes", "check", "freshness", "audit_repo", "stack_delta", "report_outcome", "help"],
                "type": "string"
              }
            },
            "required": ["op"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2c0fde1167cd2cf8bb8686684475130119429b6fb6bd05cb73d607bff4daa442"
        },
        {
          "name": "rescue",
          "title": "Rescue a failing API call",
          "description": "Diagnose a failing third-party API call before you retry or swap: paste the exact error (429, 402, 529 overloaded, insufficient_quota, model_not_found, deprecated SDK) and provider id. Returns cause, fix and fallback route, or checks to run. Not for picking (decide).",
          "inputSchema": {
            "properties": {
              "jtbd": {
                "description": "Job id",
                "type": "string"
              },
              "provider": {
                "description": "Provider id that failed",
                "type": "string"
              },
              "q": {
                "description": "Error text, status or SKU",
                "type": "string"
              },
              "sku": {
                "description": "Model or SKU id",
                "type": "string"
              },
              "status": {
                "description": "HTTP status, e.g. 429",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3f1d664d7bff60811542f7a8bbfa303c62066fb146ee9808f47d6cf34bb3d9a"
        },
        {
          "name": "session_brief",
          "title": "Every-session brief",
          "description": "Session start, if your code calls third-party APIs: what changed for your stack since your last call (retired models, price, package, pick changes). Send provider, model, package ids (never a manifest) and your last cursor. Returns clear|changed|attention, ≤3 sourced actions, a new cursor. New choice: decide. Live error: rescue.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "From your last brief",
                "type": "string"
              },
              "models": {
                "description": "Model ids you call",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "packages": {
                "description": "id or id@version",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "policies": {
                "properties": {
                  "maxMonthlyUsd": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "requireVerifiedOutcome": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "providers": {
                "description": "e.g. anthropic, neon",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "stackFingerprint": {
                "description": "sha256:<64 hex>, hashed locally",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
