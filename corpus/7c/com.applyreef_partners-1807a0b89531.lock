        {
          "name": "join_partner_program",
          "title": "Join the ApplyReef partner program (instant)",
          "description": "Instantly makes the person an ApplyReef partner (free to join): 25% of every payment from customers they refer (15% if they join under a recruiter with via, and the recruiter then earns a 15% override), renewals included, paid in their choice of crypto once each payment has cleared in Stripe and passed a 60-day hold. Creates their tracked link right away and returns a partner token you can use in this chat (pass it as token to my_link, set_payout_wallet, draft_promo, my_stats...). Also emails their private partner page and private connector URL. Use this for the standard program; use contact_us for custom terms.",
