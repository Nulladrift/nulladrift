      },
      "instructions": "Calculate ecommerce unit economics, format campaign links, and discover Ecomwith public resources. Calculations use user-supplied estimates, not account data. Ask for missing currency or costs; represent unknown inputs as null, never invented zeros or a default currency. A needs_input result contains questions, not an estimate: ask those questions and do not display a zero-cost baseline. Search returns metadata only. Weekly reports expose guest excerpts only; retain publication dates and source verification labels. No advertising, account, payment, publishing or website-fetch actions are available.",
      "tools": [
        {
          "name": "build_campaign_utm",
          "title": "Build a campaign UTM link",
          "description": "Format one HTTP(S) campaign URL with source, medium and campaign, plus optional content and term. Trims and lowercases UTM values and replaces whitespace with underscores. Returns naming warnings. Never visits the URL, sends a message, saves a campaign or changes tracking settings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "campaign": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "content": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "medium": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "source": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "term": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Destination URL. This tool formats it locally and never fetches it.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["campaign", "medium", "source", "url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "fetched": {
                "const": false,
                "type": "boolean"
              },
              "namingWarnings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "field": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "field"],
                  "type": "object"
                },
                "type": "array"
              },
              "normalization": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["fetched", "namingWarnings", "normalization", "url"],
            "type": "object"
