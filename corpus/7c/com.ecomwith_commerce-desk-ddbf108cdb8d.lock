                      },
                      "price": {
                        "description": "Revenue per order after discounts, excluding collected taxes.",
                        "exclusiveMinimum": 0,
                        "maximum": 1000000000,
                        "type": "number"
                      },
                      "productCost": {
                        "description": "Product cost per order, including any allocated costs you want to model.",
                        "maximum": 1000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "refundRate": {
                        "description": "Revenue reserved for refunds as a percentage; this is a simplified reserve.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "number"
                      },
                      "shippingCost": {
                        "description": "Net shipping and fulfillment cost per order.",
                        "maximum": 1000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      "targetProfit": {
                        "description": "Desired contribution per order after advertising. Supply 0 for break-even only.",
                        "maximum": 1000000000,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["currency", "paymentFeeRate", "price", "productCost", "refundRate", "shippingCost", "targetProfit"],
                    "type": "object"
                  },
                  "metrics": {
                    "additionalProperties": false,
                    "properties": {
                      "breakEvenRoas": {
                        "anyOf": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "contributionBeforeAds": {
                        "type": "number"
