                    "item": {
                      "enum": ["sofa", "loveseat", "chair", "coffee", "tv", "bookcase", "kingbed", "queenbed", "twinbed", "dresser", "nightstand", "crib", "table", "dchair", "hutch", "fridge", "washer", "dryer", "freezer", "desk", "ochair", "piano", "treadmill", "weights", "bike", "mower", "grill", "patio", "tools", "boxsm", "boxmd", "boxlg", "wardrobe"],
