                "description": "Optional: the actual furniture, appliances and boxes, when the person lists them. Replaces the typical home. Ids: sofa (Sofa), loveseat (Loveseat or sectional piece), chair (Armchair or recliner), coffee (Coffee or side table), tv (TV and stand), bookcase (Bookcase or cabinet), kingbed (King bed), queenbed (Queen or full bed), twinbed (Twin bed or bunk), dresser (Dresser or chest), nightstand (Nightstand), crib (Crib), table (Dining table), dchair (Dining chair), hutch (China cabinet or hutch), fridge (Fridge), washer (Washer), dryer (Dryer), freezer (Chest freezer), desk (Desk), ochair (Office chair), piano (Upright piano), treadmill (Treadmill or bike machine), weights (Weight bench and weights), bike (Bicycle), mower (Lawn mower), grill (Grill), patio (Patio set), tools (Tool chest or workbench), boxsm (Small boxes (books)), boxmd (Medium boxes), boxlg (Large boxes), wardrobe (Wardrobe boxes).",
