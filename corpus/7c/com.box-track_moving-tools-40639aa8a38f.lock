        {
          "name": "show_home_inventory",
          "title": "Show a home inventory",
          "description": "Use when someone wants a home or household inventory (for insurance, a move or a storage unit) from photos of their rooms, shelves or boxes, or from a description. You identify each item and estimate what it would cost to replace; this tool shows the list room by room with counts and totals, and offers to keep it in BoxTrack, a home inventory app that keeps a photo and value for each thing. Group small things (\"about 40 books\"). Only list what you can actually see or were told.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "ISO currency code for the values, default USD",
                "type": "string"
              },
              "rooms": {
                "description": "Rooms, closets, bins or boxes, each with its items",
                "items": {
                  "properties": {
                    "items": {
                      "items": {
                        "properties": {
                          "name": {
                            "description": "What it is, with brand and model when known",
                            "type": "string"
                          },
                          "note": {
                            "description": "Optional: serial number, condition, where it sits",
                            "type": "string"
                          },
                          "quantity": {
                            "description": "How many, default 1",
                            "type": "number"
                          },
                          "value": {
                            "description": "Estimated replacement value for one, in the currency",
                            "type": "number"
                          }
                        },
                        "required": ["name"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "description": "Room or place, like \"Living room\" or \"Garage shelf\"",
                      "type": "string"
                    }
                  },
                  "required": ["items", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "title": {
                "description": "A short name for the list, like \"Apartment inventory\"",
                "type": "string"
              }
            },
            "required": ["rooms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
