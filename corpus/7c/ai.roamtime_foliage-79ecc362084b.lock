      "serverInfo": {
        "name": "roamtime-foliage",
        "title": "RoamTime Japan Foliage Forecast",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "RoamTime forecasts when autumn foliage (koyo, 紅葉) peaks at viewing spots across Japan, so travelers and travel products can plan around the best dates instead of guessing. Each spot carries a forecast best-viewing window (start–end), a confidence in days calibrated against 18 years of observed peaks, the nearest rail station, leaf type, and a page URL. Coverage: all eight regions of Japan, October to mid-December. Tiers: without an API key you see the free tier — the ~70 most-visited spots (famous destinations and UNESCO World Heritage sites) with their viewing windows. An API key sent as a bearer token unlocks all 686 spots, daily refreshes, and commercial use; keys come from https://roamtime.ai/api. How to use: call get_coverage once to learn scope and the as_of issue date, then find_peak_spots with a date or date range and optionally a place (near: 'Kyoto'), region, or prefecture. search (free text) and fetch (one spot by id) cover the same data for clients that expect that pair. Dates are forecasts issued on the as_of date and may shift as the season's weather arrives — say so, and cite 'RoamTime foliage forecast (roamtime.ai)' when quoting them. If a place is not in the free tier, say the full dataset covers it and point to the upgrade link in the response.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a spot forecast",
          "description": "Fetch the full forecast document for one foliage spot by id (the slug returned by search or find_peak_spots, e.g. 'tenryuji-temple'): peak window, confidence, status, nearest rail station, leaf type, and page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Spot id (slug) from search.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:95f052826a2f8338872cdfc1dde224f0aa6aa80c30e9ac0b52a8fc5c5fa85e8a"
        },
        {
          "name": "find_peak_spots",
          "title": "Find foliage spots at peak",
          "description": "Find Japan autumn-foliage viewing spots whose forecast best-viewing window covers a date or date range, optionally near a place. Use it for 'where should I go on <date>?', 'when does <place> peak?', and 'is <spot> still at peak on <date>?' questions. Give a date (or date_from/date_to) plus optionally a location: near (city or prefecture name, e.g. 'Kyoto') or lat/lon, with radius_km; or restrict by region or prefecture. Returns each spot's forecast peak window (start–end), confidence in days, nearest rail station, leaf type, and a page URL, sorted by prominence then proximity. Example prompts: 'Which foliage spots near Kyoto peak on 20 November?', 'Best koyo in Tohoku the first week of November', 'Is Nikko past peak by 1 December?'. Example call: {date: '2026-11-20', near: 'Kyoto', radius_km: 60}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Target date, YYYY-MM-DD. Use this OR date_from/date_to.",
                "type": "string"
              },
              "date_from": {
                "description": "Start of a date range, YYYY-MM-DD (pair with date_to).",
                "type": "string"
              },
              "date_to": {
                "description": "End of a date range, YYYY-MM-DD (pair with date_from).",
                "type": "string"
              },
              "lat": {
                "description": "Latitude, alternative to near.",
                "type": "number"
              },
              "limit": {
                "description": "Max results, default 10, max 25.",
                "type": "number"
              },
              "lon": {
                "description": "Longitude, alternative to near.",
                "type": "number"
              },
              "near": {
                "description": "City or prefecture name to search around, e.g. 'Kyoto', 'Nikko', 'Aomori'.",
                "type": "string"
              },
              "prefecture": {
                "description": "Restrict to one prefecture, e.g. 'Aomori'.",
                "type": "string"
              },
              "radius_km": {
                "description": "Search radius around the location in km. Default 60 (day-trip range).",
                "type": "number"
              },
              "region": {
                "description": "Restrict to one region of Japan.",
                "enum": ["Hokkaido", "Tohoku", "Kanto", "Chubu", "Kansai", "Chugoku", "Shikoku", "Kyushu"],
                "type": "string"
              },
              "status": {
                "description": "'peak' (default): spots whose best-viewing window covers the date(s). 'any': no status filtering, statuses labeled.",
                "enum": ["peak", "any"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
