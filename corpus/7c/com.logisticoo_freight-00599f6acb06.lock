      },
      "transport": {
        "type": "http",
        "url": "https://www.logisticoo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "logisticoo-agent",
        "title": "Logisticoo GmbH — Transport & Spedition",
        "version": "0.5.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "estimate_transport_price",
          "title": "Richtpreis Straßentransport / Indicative road freight price",
          "description": "Non-binding indicative price range (EUR net) for one dedicated vehicle between two locations in Europe — same formula as the calculator on the operator's website. No booking is made. Location needs country plus city (or German postal code). Returns status: estimated | needs_information (answer the questions and call again) | manual_quote_required | unsupported. Never present the result as a fixed price.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dangerous_goods": {
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "destination": {
                "properties": {
                  "city": {
                    "description": "City name (German or English), e.g. Berlin, Warsaw",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "country": {
                    "description": "ISO 3166-1 alpha-2, e.g. DE, PL, FR",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "5-digit postal code for DE (used for the estimate); other countries: passed on to the team",
                    "maxLength": 10,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["country"],
                "type": "object"
              },
              "dimensions_cm": {
                "description": "Largest single piece",
                "properties": {
                  "height_cm": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000,
                    "type": "number"
                  },
                  "length_cm": {
                    "exclusiveMinimum": 0,
                    "maximum": 10000,
                    "type": "number"
                  },
                  "width_cm": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "loading_meters": {
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "origin": {
                "properties": {
                  "city": {
                    "description": "City name (German or English), e.g. Berlin, Warsaw",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "country": {
                    "description": "ISO 3166-1 alpha-2, e.g. DE, PL, FR",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "5-digit postal code for DE (used for the estimate); other countries: passed on to the team",
                    "maxLength": 10,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["country"],
                "type": "object"
              },
              "oversize": {
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "pallets": {
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "integer"
              },
              "pickup_date": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "temperature_controlled": {
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "vehicle": {
                "description": "sprinter (van ≤1.2 t/3 pallets), lkw75 (7.5 t truck ≤3 t/10 pallets), lkw12 (12 t truck ≤6 t/14 pallets), ftl (semi-trailer ≤24 t/33 pallets/13.6 LDM). Every estimate is for one dedicated vehicle (Komplettladung); its size follows the shipment, so pass weight_kg and pallets when known. Set ftl only if a semi-trailer is explicitly requested. Omit to pick the smallest fitting class by cargo size.",
                "enum": ["sprinter", "lkw75", "lkw12", "ftl"],
                "type": "string"
              },
              "weight_kg": {
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:78ba08dbf982bd433a5aad3b29acbeb11e5cb671169871babfc66ee086f1c0f4"
        },
        {
          "name": "get_service_profile",
          "title": "Leistungsprofil / Service profile",
          "description": "Returns what this road freight forwarder offers: services, served countries, vehicle classes with capacities, how indicative prices are calculated, what needs a manual quote, how to submit an inquiry, contact and legal links. Call this first. DE: Leistungen, Länder, Fahrzeugklassen, Preisregeln, Anfrageweg, Kontakt.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:757c83c92bae4d8bf789c4e2336049ce60b274573b2b4be51d5eafeef043efc2"
        },
        {
          "name": "preview_inquiry",
          "title": "Anfrage-Vorschau / Preview transport inquiry",
          "description": "Step 1 of 2 for a real transport inquiry to the operator's sales team (they reply by e-mail with a quote). Validates the data and returns exactly what will be sent, a privacy notice and a preview_token (15 min). Nothing is sent yet. Show the summary AND privacy_notice to the user and get explicit confirmation before calling submit_inquiry. Only use contact details the user provided for this purpose.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cargo_description": {
                "description": "What is shipped (goods, packaging), max 500 chars",
                "maxLength": 500,
                "type": "string"
              },
              "contact": {
                "description": "The requesting person's business contact — required",
                "properties": {
                  "company": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "email": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["company", "email", "name"],
                "type": "object"
              },
              "dangerous_goods": {
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "delivery_by": {
                "description": "Latest delivery date YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "properties": {
                  "city": {
                    "description": "City name (German or English), e.g. Berlin, Warsaw",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "country": {
                    "description": "ISO 3166-1 alpha-2, e.g. DE, PL, FR",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "5-digit postal code for DE (used for the estimate); other countries: passed on to the team",
                    "maxLength": 10,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["country"],
                "type": "object"
              },
              "dimensions_cm": {
                "description": "Largest single piece",
                "properties": {
                  "height_cm": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000,
                    "type": "number"
                  },
                  "length_cm": {
                    "exclusiveMinimum": 0,
                    "maximum": 10000,
                    "type": "number"
                  },
                  "width_cm": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "loading_meters": {
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "message": {
                "description": "Additional notes for the sales team, max 1000 chars",
                "maxLength": 1000,
                "type": "string"
              },
              "origin": {
                "properties": {
                  "city": {
                    "description": "City name (German or English), e.g. Berlin, Warsaw",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "country": {
                    "description": "ISO 3166-1 alpha-2, e.g. DE, PL, FR",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "5-digit postal code for DE (used for the estimate); other countries: passed on to the team",
                    "maxLength": 10,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["country"],
                "type": "object"
              },
              "oversize": {
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "pallets": {
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "integer"
              },
              "pickup_date": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "temperature_controlled": {
                "enum": ["yes", "no", "unknown"],
                "type": "string"
              },
              "vehicle": {
                "description": "sprinter (van ≤1.2 t/3 pallets), lkw75 (7.5 t truck ≤3 t/10 pallets), lkw12 (12 t truck ≤6 t/14 pallets), ftl (semi-trailer ≤24 t/33 pallets/13.6 LDM). Every estimate is for one dedicated vehicle (Komplettladung); its size follows the shipment, so pass weight_kg and pallets when known. Set ftl only if a semi-trailer is explicitly requested. Omit to pick the smallest fitting class by cargo size.",
                "enum": ["sprinter", "lkw75", "lkw12", "ftl"],
                "type": "string"
              },
              "weight_kg": {
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              }
            },
            "required": ["contact", "destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4842b87c483b4e11471474d87cef6217d1c4f1a02a18b345bf38cd148bdc66f1"
        },
        {
          "name": "submit_inquiry",
          "title": "Anfrage absenden / Submit transport inquiry",
          "description": "Step 2 of 2: sends the previewed inquiry to the operator's sales team. Only call after the user explicitly confirmed the summary and privacy notice. Use a new random idempotency_key per inquiry and reuse it when retrying the same inquiry. Status accepted means we received it; it is NOT a booking and NOT a binding price — a person replies by e-mail.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "idempotency_key": {
                "description": "Random key, e.g. a UUID; same key for retries",
                "pattern": "^[A-Za-z0-9_-]{8,100}$",
                "type": "string"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "preview_token": {
                "maxLength": 20000,
                "minLength": 10,
                "type": "string"
              },
              "user_confirmed": {
                "const": true,
                "description": "true = the user explicitly confirmed summary and privacy notice",
                "type": "boolean"
              }
            },
            "required": ["idempotency_key", "preview_token", "user_confirmed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd0bdd50c0d6c36eec06f709d5abd8f8949226ff7778a3d699d71d28f5ce026a"
        }
      ],
      "digest": "sha256:bea1e8be2585159a3dc3b6de291c42ec4b0d5dd452e20a1d79b667f61ac4d9dd"
    }
  }
}
