                            },
                            "type": "array"
                          },
                          "vi": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          }
                        },
                        "required": ["en", "vi"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The app's own step-by-step wording, when the catalog has it."
