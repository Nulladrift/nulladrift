                  "age_bands": {
                    "description": "Age bands (3-4, 5-6, 7-9) the activity is made for.",
                    "items": {
                      "enum": ["3-4", "5-6", "7-9"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "amount_per_band": {
                    "anyOf": [
                      {
                        "additionalProperties": {
                          "additionalProperties": false,
                          "properties": {
                            "reps": {
                              "type": "number"
                            },
                            "seconds": {
                              "type": "number"
                            }
                          },
                          "type": "object"
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "area": {
                    "type": "string"
                  },
                  "area_title": {
                    "$ref": "#/properties/activity/properties/title"
                  },
                  "how_to": {
                    "$ref": "#/properties/activity/properties/title"
                  },
                  "id": {
                    "description": "Stable activity id, usable with get_activity and how_to_teach.",
                    "type": "string"
                  },
                  "minutes": {
                    "description": "Typical minutes for one go.",
                    "type": "integer"
                  },
                  "minutes_basis": {
                    "description": "computed = from reps x tempo; app-stated = a number the app states; estimate = a planning estimate, not a measurement.",
                    "enum": ["computed", "app-stated", "estimate"],
                    "type": "string"
                  },
                  "needs_grown_up": {
                    "description": "True when the app's own notes ask a grown-up to be nearby or to join in.",
