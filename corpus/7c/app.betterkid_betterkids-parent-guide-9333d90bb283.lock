        {
          "name": "list_activities",
          "title": "Find BetterKids activities for an age",
          "description": "Find BetterKids activities that fit a child's age, a skill and the minutes you have. Searches the app's real content catalog (232 activities across 14 areas: Hero Training, Leo's Piano, Nature Explorer, World Explorer, Little Swimmer, Little Dojo, Jobs, Car Explorer, math, mazes, coding and English words). Send age_years OR age_months (the app covers ages 3-9), optionally skill, area, minutes (the most minutes one go may take) and needs_grown_up. Each result has an id, English and Vietnamese titles, age bands, skill tags, typical minutes (with whether it is computed, stated by the app or an estimate), a one-line how-to and whether the app's notes ask a grown-up to be nearby. Read-only, no account, no network calls. Never include a child's name or any personal detail.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age_months": {
                "description": "Child's age in months (12-216). Provide age_months OR age_years, not both. The app's content covers 36-119 months (ages 3-9).",
                "maximum": 216,
                "minimum": 12,
                "type": "integer"
              },
              "age_years": {
                "description": "Child's age in whole years (1-18). Provide age_years OR age_months, not both. The app's content covers ages 3-9.",
                "maximum": 18,
                "minimum": 1,
                "type": "integer"
              },
              "area": {
                "description": "Filter by app area, for example piano, nature, hero-training, maze.",
                "enum": ["hero-training", "swim", "piano", "jobs", "nature", "vehicles", "world", "dojo", "math", "maze", "coding", "words", "daily", "learn-english"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of results (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minutes": {
                "description": "Only activities that take at most this many minutes per go.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "needs_grown_up": {
                "description": "true = only activities where the app's notes ask a grown-up to be nearby; false = only those that do not.",
                "type": "boolean"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many results, for paging.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "skill": {
                "description": "Filter by skill tag (see list_topics for the list).",
                "enum": ["movement", "balance", "flexibility", "music", "numbers", "english", "stories", "riddles", "coding", "mazes", "animals", "vehicles", "jobs", "world", "water-safety", "kindness", "memory"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "activities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "age_bands": {
                      "description": "Age bands (3-4, 5-6, 7-9) the activity is made for.",
                      "items": {
                        "$ref": "#/properties/band/anyOf/0"
                      },
                      "type": "array"
                    },
                    "area": {
                      "type": "string"
                    },
                    "area_title": {
                      "$ref": "#/properties/activities/items/properties/title"
                    },
                    "how_to": {
                      "$ref": "#/properties/activities/items/properties/title"
                    },
                    "id": {
                      "description": "Stable activity id, usable with get_activity and how_to_teach.",
                      "type": "string"
                    },
                    "minutes": {
                      "description": "Typical minutes for one go.",
                      "type": "integer"
                    },
                    "minutes_basis": {
                      "description": "computed = from reps x tempo; app-stated = a number the app states; estimate = a planning estimate, not a measurement.",
                      "enum": ["computed", "app-stated", "estimate"],
