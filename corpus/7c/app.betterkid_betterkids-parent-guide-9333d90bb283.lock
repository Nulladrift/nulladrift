      },
      "instructions": "BetterKids Parent Guide: read-only answers about the BetterKids kids learning app (iOS, Mac, Android APK, web; content for ages 3-9), taken from the app's real content catalog (232 activities, English and Vietnamese). Tools: list_topics (areas, skills, age bands), list_activities (filter by age, skill, minutes), get_activity, how_to_teach (the app's own steps), suggest_daily_plan, age_guide, app_info (where to get the app) and safety_facts (privacy and safety statements with sources). No account, no sign-in, no child data: never send a child's name or any personal detail, send only an age and topics. Nothing is stored. The catalog makes no developmental or educational-outcome claims. Privacy policy of this connector: https://betterkid.app/mcp/privacy. The app's own privacy policy: https://betterkid.app/privacy.",
      "tools": [
        {
          "name": "age_guide",
          "title": "What each age band gets in BetterKids",
          "description": "Describe what each age band (3-4, 5-6, 7-9) gets in the app, from the real content: for example the daily activity for ages 3-4, repeat blocks in Code Quest from 5-6, one-way roads and traffic lights in mazes at 7-9. Returns counts of activities per area and sourced statements. These are facts about the app's content, not developmental milestones or advice. Send band, age_years or age_months, or nothing for all three. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age_months": {
                "description": "Child's age in months (12-216). Provide age_months OR age_years, not both. The app's content covers 36-119 months (ages 3-9).",
                "maximum": 216,
                "minimum": 12,
                "type": "integer"
              },
              "age_years": {
                "description": "Child's age in whole years (1-18). Provide age_years OR age_months, not both. The app's content covers ages 3-9.",
                "maximum": 18,
                "minimum": 1,
                "type": "integer"
              },
              "band": {
                "description": "One age band (3-4, 5-6 or 7-9). Omit to get all three.",
                "enum": ["3-4", "5-6", "7-9"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bands": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "activities_by_area": {
                      "additionalProperties": {
                        "type": "integer"
                      },
                      "type": "object"
                    },
                    "activity_count": {
                      "type": "integer"
                    },
                    "band": {
                      "enum": ["3-4", "5-6", "7-9"],
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "what_changes_in_the_app": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "evidence": {
                            "type": "string"
                          },
                          "statement": {
                            "type": "string"
                          }
                        },
                        "required": ["evidence", "statement"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["activities_by_area", "activity_count", "band", "label", "what_changes_in_the_app"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["bands", "notes"],
            "type": "object"
