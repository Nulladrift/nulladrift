            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Activity id from list_activities, for example hero.frog-jumps or piano-song.hot-cross-buns.",
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9.-]*$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
