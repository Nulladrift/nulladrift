        {
          "name": "suggest_daily_plan",
          "title": "Suggest a short daily play plan",
          "description": "Suggest a short play-and-learn plan for one day from the app's catalog: send the child's age in months (36-119 for ages 3-9), up to 8 interests such as \"animals\" or \"piano\" (English or Vietnamese) and the minutes available. Returns an ordered list of activities that fit the minutes, with a reason for each; the same inputs always give the same plan and `day` (1-7) varies it across a week. It starts where the app itself starts the day and flags activities where the app asks a grown-up to be nearby. A suggestion, not a prescription, with no developmental claims. Read-only; interests are matched against the catalog and never echoed or stored. Never send a child's name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age_months": {
                "description": "Child's age in months (12-216); the app's content covers 36-119 months (ages 3-9). Never send a name.",
                "maximum": 216,
                "minimum": 12,
                "type": "integer"
              },
              "day": {
                "default": 1,
                "description": "Day of the week 1-7. Changes which equally good activities are picked, so a week of plans varies. The same inputs always give the same plan.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "interests": {
                "default": [],
                "description": "Up to 8 short interests such as \"animals\", \"piano\", \"maze\", \"cars\" (English or Vietnamese). Words that match no area are ignored. Never include names or personal details.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "minutes": {
                "default": 20,
                "description": "Total minutes available (5-120, default 20).",
                "maximum": 120,
                "minimum": 5,
                "type": "integer"
              }
            },
            "required": ["age_months"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "band": {
                "anyOf": [
                  {
                    "enum": ["3-4", "5-6", "7-9"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "grown_up_note": {
                "type": ["string", "null"]
              },
              "ignored_interest_count": {
                "type": "integer"
              },
              "matched_interests": {
                "description": "Catalog topics your interests matched (ids only; your words are not echoed).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "plan": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "activity": {
                      "additionalProperties": false,
                      "properties": {
