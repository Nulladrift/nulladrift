          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age_months": {
                "description": "Child's age in months (12-216). Provide age_months OR age_years, not both. The app's content covers 36-119 months (ages 3-9).",
                "maximum": 216,
                "minimum": 12,
                "type": "integer"
              },
              "age_years": {
                "description": "Child's age in whole years (1-18). Provide age_years OR age_months, not both. The app's content covers ages 3-9.",
                "maximum": 18,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 4,
                "description": "Maximum number of matching activities (default 4).",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "An activity id (hero.frog-jumps), an area id (piano), a skill (balance) or a plain topic (\"jump rope\", \"doctor\", \"twinkle\", \"swimming\"). Never a name.",
                "maxLength": 80,
                "minLength": 2,
