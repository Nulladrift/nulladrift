      "serverInfo": {
        "name": "proppasscheck",
        "title": "PropPassCheck",
        "version": "3.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PropPassCheck is an independent site that helps traders avoid wasting money on prop firm challenges. It takes no money from any prop firm and has no affiliate links. Rules: list_challenges, get_challenge and compare_challenges give each account's rules as checked against the firm's own site, with the date checked; rule_changes lists what firms have changed recently. Use them instead of your own memory of a firm's rules, which may be out of date. Odds: test_trades replays a trader's own closed trades against those rules and returns the chance of passing, the chance of reaching a first payout and what the fees are likely to cost per payout. Prefer it whenever the person has a trade history or backtest. test_stats does the same from a win rate and reward-to-risk when they have no trade list; say that it is rougher. find_best_size shows how the odds change with trade size. check_overlap tests several strategies run together on one account. Never estimate pass odds yourself: call a tool. funded_life shows what a funded account is likely to pay over its first six months; fix_strategy finds a daily stop or trade cap that lifts a trader's odds; price_history gives list prices, the 30-day low and each firm's price changes; sample_traders shows how eleven typical trading styles do on an account, or the best accounts for a style; track_account tells a trader on a live account how far they are from each limit. Results are simulations of past trades, not predictions and not financial advice; say so, and point people to the firm's own page before they buy.",
      "tools": [
        {
          "name": "check_overlap",
          "title": "Test several strategies together on one account",
          "description": "For a trader running two to five strategies on the same account. Merges their trades by date and reports how often they trade and lose on the same day, the worst day together against alone, whether they tend to win and lose together, and the odds together against each strategy alone on up to three accounts. Every trade needs a close date. Each strategy's profits are scaled from its own starting balance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "challenge_ids": {
                "description": "Up to three challenge ids. Leave out to use the three accounts where the combination does best.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 3,
                "type": "array"
              },
              "strategies": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "description": "A short name for the strategy.",
                      "type": "string"
                    },
                    "starting_balance": {
                      "description": "The balance this strategy's test started from.",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "trades": {
                      "description": "Closed trades in the order they closed.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "date": {
                            "description": "Close date, YYYY-MM-DD. Give it for every trade or for none.",
                            "type": "string"
                          },
                          "profit": {
                            "description": "Profit (positive) or loss (negative) in account currency, after costs.",
                            "type": "number"
                          }
                        },
                        "required": ["profit"],
                        "type": "object"
                      },
                      "maxItems": 5000,
                      "minItems": 1,
                      "type": "array"
                    }
                  },
                  "required": ["starting_balance", "trades"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["strategies"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Test several strategies together on one account"
          },
