        {
          "name": "test_trades",
          "title": "Test a trader's own trades against challenge rules",
          "description": "Replays a list of closed trades 1,000 times against prop firm challenge rules and returns, per account: the chance of passing, the chance of reaching a first payout, the usual number of trading days, why failed attempts failed, the average number of attempts, and the likely fees per first payout with the funded profit needed to win them back. Give every closed trade's profit or loss in money and the starting balance of the test. Include each trade's close date when known, so busy and quiet days are kept as they happened. Name up to 10 challenge ids, or a firm, or leave both out to rank every account. Needs real closed trades, not figures made up from a win rate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "challenge_ids": {
                "description": "Up to 10 PropPassCheck account ids.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "firm": {
                "description": "Or: part of a firm name, to test that firm's accounts. Leave both out to rank every account.",
                "type": "string"
              },
              "scale": {
                "description": "Trade size multiplier to test, default 1 (as traded).",
                "maximum": 10,
                "minimum": 0.05,
                "type": "number"
              },
              "starting_balance": {
                "description": "Account balance the trades started from, in the same currency as the profits.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "trades": {
                "description": "Closed trades in the order they closed.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "Close date, YYYY-MM-DD. Give it for every trade or for none.",
                      "type": "string"
                    },
                    "profit": {
                      "description": "Profit (positive) or loss (negative) in account currency, after costs.",
                      "type": "number"
                    }
                  },
                  "required": ["profit"],
                  "type": "object"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              },
              "trades_per_day": {
                "description": "Only used when the trades have no dates. Default 2.",
                "maximum": 30,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["starting_balance", "trades"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Test a trader's own trades against challenge rules"
