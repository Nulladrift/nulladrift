        {
          "name": "list_challenges",
          "title": "Find prop firm challenges",
          "description": "Lists the prop firm accounts PropPassCheck tracks (evaluation challenges and instant funding), each with its id, targets, loss limits, price and the date the rules were last checked. Filter by firm, account type, market, drawdown type, price and the rules a trading style needs (no daily loss limit, no consistency rule, weekend holding, news trading).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "drawdown": {
                "description": "static: the maximum loss never moves. trailing: it follows the account up (including ones that lock at the start).",
                "enum": ["static", "trailing"],
                "type": "string"
              },
              "firm": {
                "description": "Part of a firm name, for example \"FTMO\". Leave out for all firms.",
                "type": "string"
              },
              "market": {
                "description": "Forex and CFD firms, or futures firms.",
                "enum": ["forex", "futures"],
                "type": "string"
              },
              "max_price": {
                "description": "Only accounts with a recorded fee at or below this, in dollars.",
                "type": "number"
              },
              "news_trading": {
                "description": "Leave out accounts recorded as restricting trading around news.",
                "type": "boolean"
              },
              "no_consistency_rule": {
                "description": "Only accounts with no best-day consistency rule.",
                "type": "boolean"
              },
              "no_daily_limit": {
                "description": "Only accounts with no daily loss limit.",
                "type": "boolean"
              },
              "type": {
                "description": "Account type.",
                "enum": ["instant", "1-step", "2-step", "3-step"],
                "type": "string"
              },
              "weekend_holding": {
                "description": "Leave out accounts recorded as not allowing trades held over the weekend.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
