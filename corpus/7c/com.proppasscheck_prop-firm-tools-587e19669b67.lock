        {
          "name": "find_best_size",
          "title": "Find the trade size with the best odds",
          "description": "Runs the same trades (or headline numbers) at eight trade sizes, from a quarter to three times, against up to three accounts, and shows the pass and first-payout chance at each with the best size marked. Answers \"should I risk less or more per trade on this challenge?\". Give trades with starting_balance, or the four headline numbers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "challenge_ids": {
                "description": "One to three challenge ids.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "reward_to_risk": {
                "description": "Average win divided by average loss, for example 2 for a 1:2 strategy.",
                "maximum": 20,
                "minimum": 0.1,
                "type": "number"
              },
              "risk_per_trade": {
                "description": "Percentage of the account lost on a losing trade, for example 1.",
                "maximum": 10,
                "minimum": 0.05,
                "type": "number"
              },
              "starting_balance": {
                "description": "Needed with trades.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "trades": {
                "description": "Closed trades in the order they closed.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "Close date, YYYY-MM-DD. Give it for every trade or for none.",
                      "type": "string"
                    },
                    "profit": {
                      "description": "Profit (positive) or loss (negative) in account currency, after costs.",
                      "type": "number"
                    }
                  },
                  "required": ["profit"],
                  "type": "object"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              },
              "trades_per_day": {
                "description": "Average trades per trading day, for example 1.5.",
                "maximum": 30,
                "minimum": 0.1,
                "type": "number"
              },
              "win_rate": {
