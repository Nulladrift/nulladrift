      },
      "transport": {
        "type": "http",
        "url": "https://appealgo.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "appealgo",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AppealGo helps UK drivers appeal parking tickets, council PCNs, private parking charges, bus lane, ULEZ and Clean Air Zone notices. Use the guide, contravention-code and deadline tools for information. With an API key, check_notice scans a notice and file_appeal files the appeal in the driver's own name. Never fabricate notice details, outcomes or success rates: report what the tools return, and say that outcomes are decided by the issuer or an independent tribunal.",
      "tools": [
        {
          "name": "calculate_deadlines",
          "title": "Calculate PCN and parking charge deadlines",
          "description": "Given the notice type and the date on the notice, returns the discount deadline, the challenge/representations deadline, when escalation can start, and (if you pass a rejection date) the tribunal or POPLA/IAS deadline. Statutory defaults; the notice is authoritative.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "event_date": {
                "description": "yyyy-mm-dd, the parking date if different (private ANPR/windscreen)",
                "type": "string"
              },
              "notice_date": {
                "description": "yyyy-mm-dd, the date on the notice",
                "type": "string"
              },
              "notice_to_owner_date": {
                "type": "string"
              },
              "notice_type": {
                "description": "council_parking = Council parking PCN (windscreen or handed to you); council_postal = Council PCN by post (CCTV parking, bus lane or moving traffic outside London); london_moving = London bus lane, yellow box or banned turn (borough or TfL red route); tfl_charge = ULEZ, LEZ or Congestion Charge PCN (TfL); clean_air_zone = Clean Air Zone PCN (Birmingham, Bristol, Bath, Bradford, Portsmouth, Sheffield, Tyneside); private_anpr = Private parking charge by post (ANPR camera); private_windscreen = Private parking charge left on the windscreen",
                "enum": ["council_parking", "council_postal", "london_moving", "tfl_charge", "clean_air_zone", "private_anpr", "private_windscreen"],
                "type": "string"
              },
              "rejection_date": {
                "description": "yyyy-mm-dd on the Notice of Rejection, if you have one",
                "type": "string"
              }
            },
            "required": ["notice_date", "notice_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:289a7662e2456be58a163b27c31179ee18d2d3f92a6aeafe5923b030ec1ad4a0"
        },
        {
          "name": "check_notice",
          "title": "Scan a parking ticket / PCN and get the grounds + draft appeal",
          "description": "Upload a photo or PDF of a UK parking ticket, council PCN, private parking charge, bus lane, ULEZ or Clean Air Zone notice. AppealGo reads it, identifies the issuer and contravention, finds the grounds to challenge it and drafts the appeal. Checking is free (fair-use cap per key per day); filing costs £7.99 or is covered by a plan, up to its appeal allowance. Provide image_url OR image_base64. Takes 20–90 seconds. Never invent notice details: report exactly what this tool returns.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content_type": {
                "description": "image/jpeg, image/png, image/heic or application/pdf (for image_base64)",
                "type": "string"
              },
              "file_name": {
                "type": "string"
              },
              "force": {
                "description": "Scan even if this account already appealed the same notice",
                "type": "boolean"
              },
              "image_base64": {
                "description": "Base64 of the photo/PDF (data: URLs accepted)",
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of the photo/PDF",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6397c26bd86666949b93854ea0274ead408e8eda15fa350d8b1502dee37f5d81"
        },
        {
          "name": "explain_contravention_code",
          "title": "Explain a PCN contravention code",
          "description": "What a two-digit council PCN contravention code means (e.g. 01, 12, 30, 34, 62), its penalty band, and the grounds that usually beat it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "description": "The code on the PCN, e.g. '12' or '31J'",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25642777293e47afb58876a8c94bf6321931158c78c8b3253cc24c6d8ba15919"
        },
        {
          "name": "file_appeal",
          "title": "File the appeal with the issuer",
          "description": "Files the drafted appeal for a notice in the account holder's own name. This sends a real appeal to a real council or parking operator and cannot be undone, so confirm with the user first. If the notice is unpaid and not covered by a plan, returns a Stripe checkout_url (£7.99 standard); once paid, AppealGo files it automatically. Name and postal address are required (saved on the profile, or pass them here). Always show the user the checkout_url rather than claiming the appeal was filed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "Full postal address including postcode",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "name": {
                "description": "Full name the appeal is filed under",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25bd239a97383f65d5e58755f159b6568e4309f1205f026bc7059504b95cc122"
        },
        {
          "name": "get_guide",
          "title": "Read a guide",
          "description": "Returns a full AppealGo guide as Markdown, with its sources.",
