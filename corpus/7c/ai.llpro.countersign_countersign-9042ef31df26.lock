{
  "lockfileVersion": 2,
  "subjects": {
    "ai.llpro.countersign/countersign": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://countersign.llpro.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "countersign",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "agent_readiness_audit",
          "description": "Use when you or your user want a site or a code repo ready for agent traffic. Send a domain (example.com) or a public GitHub repo (https://github.com/owner/repo). Returns a 0-100 readiness score and each item checked, found or missing, why it matters and how to fix it. Site: /llms.txt, A2A agent card, MCP server card or endpoint, a payment path for agents (HTTP 402 / x402), robots.txt rules for agents and AI crawlers, sitemap, OpenAPI. Repo: llms.txt, AGENTS.md, MCP registry server.json, agent card, README connect section. Read-only GET requests (at most 12), public addresses only, nothing stored about the site, signed result. First audit each day free; then $0.10 an audit (prepaid credit key or x402), charged only while it passes today's known-answer test. Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "A website to audit, e.g. example.com (a full https URL is accepted; only the host name is used).",
                "maxLength": 253,
                "type": "string"
              },
              "repo": {
                "description": "Or a public GitHub repo: https://github.com/owner/repo (send domain OR repo, not both).",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit a site or repo for agent readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4df096ce57589e7e1983e61db266a39347dfcd83ded25fcc314c80eae3278f47"
        },
        {
          "name": "countersign_log",
          "title": "Read the public stamp log",
          "description": "Read the public, append-only log of Countersign stamps: entries after a sequence number, in order, plus the head hash, entry count and public key so you can check signatures yourself. Use it when you audit stamps in bulk, mirror the log, or want to see where a stamp sits in the chain. Free, read-only; private stamps show only a hash of each finding's detail.",
          "inputSchema": {
            "properties": {
              "after": {
                "description": "Return entries with a sequence number above this (default 0 = from the first entry)",
                "type": "integer"
              },
              "limit": {
                "description": "Entries per call, 1 to 200 (default 20)",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read the public stamp log"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:39d2ef5411ade1e1494e06030729b22ae7cd1943c68699a1883774bcdb0d3092"
        },
        {
          "name": "countersign_stamp",
          "title": "Check work and get a signed stamp",
          "description": "Use when you need a signed check, by code that did not make the work, of work you or another agent produced (an invoice or purchase order total, a report, calculation, summary, filing draft or code) before relying on it or handing it on. Countersign re-computes arithmetic, looks up quotes and values in the cited sources, opens links and parses code, then returns a signed stamp (pass, fail or inconclusive) saying exactly what is wrong, with time and method. The stamp is kept in a public log. No AI model decides the result. It never checks work it produced. Free daily quota; credit keys from $1 at llpro.ai/pay/credit; x402 accepted. Send the key as Authorization: Bearer <llk_ key>. We charge only while this tool passes today's known-answer test; in testing it answers free.",
          "inputSchema": {
            "properties": {
              "claims": {
                "description": "Optional explicit items: {type:'arithmetic', expression, claimed} or {type:'quote', source_url, quote} or {type:'value', source_url, value}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "context": {
                "description": "Optional, self-declared and shown on the stamp as such (never changes the verdict): within_scope (true/false), approval_required (true/false), approved_by (who approved), model_version.",
                "properties": {
                  "approval_required": {
                    "type": "boolean"
                  },
                  "approved_by": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "model_version": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "within_scope": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "kind": {
                "enum": ["report", "calculation", "summary", "filing_draft", "code", "other"],
                "type": "string"
              },
              "language": {
                "description": "For code: python or json get a syntax check",
                "type": "string"
              },
              "output": {
                "description": "The work to check, as text (max 100000 chars). Equations written as '12 * 4 = 48' are re-computed.",
                "type": "string"
              },
              "private": {
                "description": "Default true: the public log shows only a salted hash of each finding's detail (only you get the salt, so you can reveal a finding to an auditor) (your producer agent_id and the pass/fail counts stay visible) and you still get the full detail. Send false to publish the findings in the public log.",
                "type": "boolean"
              },
              "producer": {
                "description": "Who made the work: {agent_id, model}. Required; used for the independence rule.",
                "properties": {
                  "agent_id": {
                    "type": "string"
                  },
                  "model": {
                    "type": "string"
                  }
                },
                "required": ["agent_id"],
                "type": "object"
              },
              "sources": {
                "description": "Optional cited sources: {url, quote?}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["output", "producer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check work and get a signed stamp"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22e6acedc05496309d6420cebc3a8523770b0152fa41a4aebc6b9d2072b8b90f"
        },
        {
          "name": "countersign_verify",
          "title": "Verify a stamp",
          "description": "Confirm that a Countersign stamp someone shows you is real before you trust it. Use it when another agent hands you work with a stamp id: give the id, and optionally the exact work text to prove the stamp covers that text and nothing else. Returns the logged stamp, whether its signature is valid and, with the text, whether it matches. It checks the log's copy, not the copy you were shown: compare the returned verdict and output_sha256 with that copy. Free, read-only; it does not re-check the work itself (countersign_stamp does that).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Stamp id: the id field returned by countersign_stamp",
                "type": "string"
              },
              "output": {
                "description": "Optional: the exact work text the stamp should cover; its sha256 is compared with the stamp",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a stamp"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:95c1a63fc573e2273fb4a6778aaf9aebd747ae58320d24a1a0be4ce8908a6bae"
        },
        {
          "name": "feedback_submit",
          "title": "Send feedback to LLPRO",
          "description": "Tell LLPRO what failed, what was missing or what would improve this service. Read daily by the service owner and turned into a fix or an answer; shipped ideas are credited on https://llpro.ai/changelog and earn a contributor mark on Agent Record. Not for support requests that need a reply: write support@llpro.ai for those. Do not send secrets.",
          "inputSchema": {
            "properties": {
              "credit": {
                "description": "Default true: credit your agent id on the changelog if the idea ships. Send false to opt out.",
                "type": "boolean"
              },
              "message": {
                "description": "Anything else, in your own words.",
                "type": "string"
              },
              "rating": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "tool": {
                "description": "Which tool or endpoint this is about.",
                "type": "string"
              },
              "what_failed": {
                "description": "What did not work, and the call that failed (tool, arguments, what you expected).",
                "type": "string"
              },
              "what_missing": {
                "description": "What you needed and could not get.",
                "type": "string"
              },
              "what_would_improve": {
                "description": "One concrete change that would make this better.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send feedback to LLPRO"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:85aff0465104fb90836c05f0f59e9dc3c26a6b60bfb8a8b7726e4ce9234c6b7f"
        },
        {
          "name": "launchpad_progress",
          "title": "Report progress on a plan",
          "description": "Report where you are on a Launchpad plan and get the next step, an on-track check and, if you are stuck, a way round. Needs the launch_id and token from launchpad.start.",
          "inputSchema": {
            "properties": {
              "launch_id": {
                "type": "string"
              },
              "reason": {
                "description": "Only with status stuck.",
                "enum": ["no_access", "unclear", "error", "blocked_by_owner", "other"],
                "type": "string"
              },
              "status": {
                "enum": ["started", "done", "stuck", "skipped", "waiting_owner"],
                "type": "string"
              },
              "step": {
                "description": "A step id from your plan. Leave out to ask where you are.",
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["launch_id", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report progress on a plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:07ccea9d64fdb472259d535e6ea71a2d2d4cc68451b09d82978791898435b990"
        },
        {
          "name": "launchpad_start",
          "title": "Plan a goal with several steps",
          "description": "Stuck? Start here. Give your goal and any limits; get back a concrete plan (LLPRO tools first, then registries and the open web), the first task to run, and a token to report progress. Free. The goal is read for keywords only and is never stored. Anything that spends, signs, sends, shares, connects or deletes is marked as needing your owner's approval.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "A stable name for you. Used only to count return visits.",
                "maxLength": 64,
                "type": "string"
              },
              "constraints": {
                "description": "Optional limits. They only ever make the plan stricter.",
                "properties": {
                  "ask_before_every_action": {
                    "type": "boolean"
                  },
                  "budget_usd": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "deadline_minutes": {
                    "minimum": 5,
                    "type": "integer"
                  },
                  "no_send": {
                    "type": "boolean"
                  },
                  "no_share": {
                    "type": "boolean"
                  },
                  "no_spend": {
                    "type": "boolean"
                  },
                  "no_web": {
                    "type": "boolean"
                  },
                  "place": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "playbook": {
                    "enum": ["research", "selling", "hiring", "bookkeeping", "outreach", "support"],
                    "type": "string"
                  },
                  "side": {
                    "enum": ["employer", "seeker"],
                    "type": "string"
                  },
                  "tools_allowed": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "tools_blocked": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "goal": {
                "description": "What you are trying to get done, in a sentence or two.",
                "maxLength": 600,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Plan a goal with several steps"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c7a08553f056ec2efb6317c63f15a620dbd15d144c52aed54594d3fe0c3a6e3d"
        }
      ],
      "digest": "sha256:0700e91d8b1690f6365056fd0f4f45a24b694ac05d674fc2297ad3739bb1732c"
    }
  }
}
