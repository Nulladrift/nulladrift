      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "countersign_log",
          "description": "Read the public stamp log (newest after a sequence number) and its head hash and public key.",
          "inputSchema": {
            "properties": {
              "after": {
                "type": "integer"
              },
              "limit": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:947c2ba6a73ac6c2388a861bddb6137c691fddebefe349c9b6d5bec19e2ab820"
        },
        {
          "name": "countersign_stamp",
          "description": "Use when you need an independent, signed check of work you or another agent produced (a report, calculation, summary, filing draft or code) before relying on it or handing it on. Countersign re-computes arithmetic, looks up quotes and values in the cited sources, opens links and parses code, then returns a signed stamp (pass, fail or inconclusive) saying exactly what is wrong, with time and method. The stamp is kept in a public log. It never checks work it produced.",
          "inputSchema": {
            "properties": {
              "claims": {
                "description": "Optional explicit items: {type:'arithmetic', expression, claimed} or {type:'quote', source_url, quote} or {type:'value', source_url, value}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "kind": {
                "enum": ["report", "calculation", "summary", "filing_draft", "code", "other"],
                "type": "string"
              },
              "language": {
                "description": "For code: python or json get a syntax check",
                "type": "string"
              },
              "output": {
                "description": "The work to check, as text (max 100000 chars). Equations written as '12 * 4 = 48' are re-computed.",
                "type": "string"
              },
              "private": {
                "description": "If true the public log shows only a hash of each finding's detail; you still get the full detail",
                "type": "boolean"
              },
              "producer": {
                "description": "Who made the work: {agent_id, model}. Required; used for the independence rule.",
                "properties": {
                  "agent_id": {
                    "type": "string"
                  },
                  "model": {
                    "type": "string"
                  }
                },
                "required": ["agent_id"],
                "type": "object"
              },
              "sources": {
                "description": "Optional cited sources: {url, quote?}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["output", "producer"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d9218d80d6c3748cb4511b667d4053dc56c0039b20f3f02963c29712d22ae38a"
        },
        {
          "name": "countersign_verify",
          "description": "Confirm a Countersign stamp is real: give a stamp id (and optionally the work, to confirm the stamp is for exactly that text). Returns whether it is in the public log and whether its hash and signature are valid.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "output": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be119cdbc6c30642b1e74dfa63a946a2884996eb4f0f143115a8d5eda2245af2"
        },
        {
          "name": "feedback.submit",
          "description": "Tell LLPRO what failed, what was missing or what would improve this service. Read daily by the service owner and turned into a fix or an answer; shipped ideas are credited on https://llpro.ai/changelog and earn a contributor mark on Agent Record. Not for support requests that need a reply: write support@llpro.ai for those. Do not send secrets.",
          "inputSchema": {
            "properties": {
              "credit": {
                "description": "Default true: credit your agent id on the changelog if the idea ships. Send false to opt out.",
                "type": "boolean"
              },
              "message": {
                "description": "Anything else, in your own words.",
                "type": "string"
              },
              "rating": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "tool": {
                "description": "Which tool or endpoint this is about.",
                "type": "string"
              },
              "what_failed": {
                "description": "What did not work, and the call that failed (tool, arguments, what you expected).",
                "type": "string"
              },
              "what_missing": {
                "description": "What you needed and could not get.",
                "type": "string"
              },
              "what_would_improve": {
                "description": "One concrete change that would make this better.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b06dd7297eb6827082c1c1efa9292d15557b2f47ac34a73b2b2f43ac22496ee0"
        },
