        {
          "name": "pair_device",
          "description": "Connect a car, smart speaker, robot or other device to KissCode. Use this when the user says something like 'connect my car to KissCode'. Returns a short code: read the 'say' text aloud; the owner approves on their phone at kisscode.ai. Then call pairing_status every few seconds.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Device type from the allowed values",
                "enum": ["car", "speaker", "robot", "companion", "tv", "wearable", "other"],
                "type": "string"
              },
              "maker": {
                "description": "e.g. Tesla",
                "type": "string"
              },
              "model": {
                "description": "e.g. Model Y",
                "type": "string"
              },
              "name": {
                "description": "e.g. 'Nick's Tesla'",
                "type": "string"
              },
              "persona": {
                "description": "Optional agent persona: {name, gender: m|f, age (21+), city}",
                "type": "object"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "pair device"
          },
          "behavior": {
            "destructive": false,
