          "title": "Search MCP servers and agent skills",
          "description": "Search Kitbay's directory of MCP servers and agent skills by text, or browse by tool, category or AI client. Returns facts per listing (official, can change data, needs credentials, licence, last activity) and its Kitbay page. Needs a query, tool, category or client.",
          "inputSchema": {
