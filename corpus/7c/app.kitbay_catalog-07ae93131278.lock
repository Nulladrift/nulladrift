              "client": {
                "description": "AI client slug, e.g. \"claude-code\", \"cursor\"",
                "maxLength": 50,
                "type": "string"
              },
              "cursor": {
                "description": "nextCursor from the previous page",
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "description": "Results per page, 1-25 (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "needsCredentials": {
                "description": "Whether it needs an API key or sign-in",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "official": {
                "description": "true: only listings the tool's vendor publishes",
