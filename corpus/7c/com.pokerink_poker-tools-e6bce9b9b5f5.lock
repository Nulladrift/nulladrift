        "type": "http",
        "url": "https://pokerink.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pokerink-poker-tools",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "analyze_hand",
          "description": "Read one Texas Hold'em hand on a 3-5 card board: the made hand (category and label) plus every draw with its out count.",
          "inputSchema": {
            "properties": {
              "board": {
                "description": "3-5 community cards, e.g. \"9h 8h 2c\"",
                "type": "string"
              },
              "hand": {
                "description": "Two cards, e.g. \"Jh Th\"",
                "type": "string"
              }
            },
            "required": ["board", "hand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b96ac8e0e5837fac3c683489760ec124aae46c3c6ef7e23118a832df84603ad4"
        },
        {
          "name": "calculate_equity",
          "description": "Texas Hold'em or Pot Limit Omaha equity for 2-4 specific hands on 0-5 community cards, returning win, tie, and total equity percentages per hand. Hold'em enumerates every remaining board runout (no simulation). Omaha (game: \"omaha\", four-card hands, best two play) is exact on every postflop street and scores a deterministic 200,000-board sample preflop (±0.2 percentage points, same input always reproduces).",
          "inputSchema": {
            "properties": {
              "board": {
                "description": "0-5 community cards, e.g. \"9h8h2c\". Omit for preflop.",
                "type": "string"
              },
              "game": {
                "description": "Game type; defaults to \"holdem\". \"omaha\" requires exactly 4 cards per hand.",
                "enum": ["holdem", "omaha"],
                "type": "string"
              },
              "hands": {
                "items": {
                  "description": "Two cards for hold'em, e.g. \"AhKs\" or \"10d 7c\"; four for omaha, e.g. \"AsAhKsKh\"",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["hands"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02566ac29ba1eb32d701f68c8ec67d63b94692188cdfcb54e77a7f31df78777e"
        },
        {
          "name": "calculate_pot_odds",
          "description": "Decide whether calling a bet is profitable. Returns the pot odds, the equity needed to break even, and — given an out count — the exact chance of hitting and a call/fold verdict. Use this instead of doing the arithmetic: the break-even share is call divided by (pot + bet + call), so a pot-sized bet needs 33.3% and a half-pot bet 25%, and computing it as bet/(pot+bet) overstates both. The chance of hitting is counted exactly over the unseen cards, not approximated by the Rule of 2 and 4, which overstates by nearly 6 points on a 15-out draw. Pair it with analyze_hand, which returns the out count for a hand.",
          "inputSchema": {
            "properties": {
              "bet": {
                "description": "The bet you have to call.",
                "type": "number"
              },
              "implied_extra": {
                "description": "Extra you expect to win on later streets if you hit. Optional, defaults to 0; it lowers the equity required.",
                "type": "number"
              },
              "outs": {
                "description": "Cards that complete your hand. Optional — omit to get the price alone, with no verdict. analyze_hand reports this as total_outs.",
                "type": "integer"
              },
              "pot": {
                "description": "Pot size before the bet, in any consistent unit.",
                "type": "number"
              },
              "street": {
                "description": "Required with outs: \"flop\" when two cards are still to come, \"turn\" when one is.",
                "enum": ["flop", "turn"],
                "type": "string"
              }
            },
            "required": ["bet", "pot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:00c5f965b46139900cb38e4c40de57e57a7e1bbcac07d95fc945476e249b110a"
        }
      ],
      "digest": "sha256:daacb0a694ada3bd73e084394cc6f70b82e7e1d0a51bfe85b4435a43c01a3a11"
    }
  }
}
