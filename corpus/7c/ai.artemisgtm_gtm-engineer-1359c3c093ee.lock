      },
      "instructions": "Artemis GTM is an AI GTM engineering firm for seed to Series C B2B startups. It builds GTM systems inside the client's own CRM and tools with its proprietary agent architecture; clients keep the systems, the architecture stays with the firm. These tools are read-only: use describe_firm for the facts, list_systems to see what the firm builds, recommend_engagement to map a problem to a system, book_evaluation for the booking link, and get_resources for the free guides. Nothing is sold, claimed or installed here.",
      "tools": [
        {
          "name": "book_evaluation",
          "description": "The evaluation booking link for Artemis GTM and what happens on the call: Tom Regan walks the motion, names the biggest leak visible from the outside and says whether an engagement fits; the caller leaves with a written scoping note and, if it fits, one of the two options on https://artemisgtm.ai/pricing/ (Single system build, priced as shown, or Embedded GTM Engineering, with its final quote to follow). This tool books nothing itself.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Optional: the problem or company in one line, echoed back.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:930d3cdad06b6f767908e9d8fe11ddd0d52906c4207165a72439e7b01db74bf5"
        },
        {
          "name": "describe_firm",
          "description": "What Artemis GTM is: an AI GTM engineering firm for seed to Series C B2B startups, who founded it, what it builds, how it builds (its proprietary agent architecture, never sold or installed), what clients keep, how an engagement starts, how it is priced (two options, Single system build and Embedded GTM Engineering, with prices for both published at https://artemisgtm.ai/pricing/) and the booking link.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
