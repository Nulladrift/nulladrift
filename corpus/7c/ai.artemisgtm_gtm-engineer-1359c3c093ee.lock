        },
        {
          "name": "recommend_engagement",
          "description": "Given a B2B go-to-market problem in plain language (for example \"leads sit for two days before anyone calls them\", \"most of our website traffic is anonymous\", \"our ICP is too broad\"), name the system Artemis GTM would build to fix it, why, up to two alternates, the related guides and the next step: an evaluation call.",
