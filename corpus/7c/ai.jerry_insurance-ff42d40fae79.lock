          "name": "jerry_update_application",
          "title": "Update application",
          "description": "Save application facts the customer gave, in their own words. Every field is optional and merges into what's saved, so send only facts that are new or changed.\n- Items with an id update that driver, car or home; items without one are added. included puts an item on the quote or leaves it off.\n- Add a car by vin, by licensePlate and licensePlateState, or by year, make and model. Send year, make and model only when there's no VIN or plate, since those set them. A final price needs the VIN.\n- Answer any other requirement in answers, by its path. A fact that has its own field here comes back rejected as typed_field if it's sent in answers.\n- coverage and history.currentMonthlyPremiumCents are optional and never block quotes. Send them only when the customer asks for a coverage level or specific coverages, or says what they pay now.\n- Drivers and cars Jerry found are in the status's suggested list, each with an id that starts with suggested:. Once the customer confirms one, send that id in drivers or vehicles with included: true.\nReturns the status, with suggested. rejected lists values to correct with the customer, and clarify lists values to choose from. The rest of the write is saved either way.",
