        },
        {
          "name": "list_patterns",
          "title": "List all patterns",
          "description": "List the whole Slop Patterns taxonomy: code, id, name and one-liner for every documented AI design anti-pattern.",
          "inputSchema": {
            "properties": {
              "track": {
                "description": "Optional filter.",
                "enum": ["surface", "behavioral"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List all patterns"
          },
          "behavior": {
            "destructive": false,
