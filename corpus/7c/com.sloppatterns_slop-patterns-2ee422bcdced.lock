        {
          "name": "check_design",
          "title": "Check UI code for AI design patterns",
          "description": "Check a snippet of CSS, HTML or JSX against the Slop Patterns library and return every AI design anti-pattern it matches, with the fix for each. Covers the 101 documented patterns that have a mechanical tell. Useful for reviewing generated UI code.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The CSS, HTML or JSX to check. Paste it whole; partial snippets work but full files are more accurate.",
                "type": "string"
              },
              "shareStats": {
                "description": "Optional, defaults to false. If true, contribute an anonymous count of WHICH rule codes fired to the public monthly figures at https://sloppatterns.com/#stats. Never sends your code, your URL, or any identifier.",
                "type": "boolean"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check UI code for AI design patterns"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf22b21f390f73f90f64d6bfebadb84c608141a2df862c2a86ec4e257a5894a5"
        },
        {
          "name": "get_pattern",
          "title": "Get one pattern",
          "description": "Get one full pattern entry by id or code (e.g. \"a1\" or \"the-unchosen-gradient\"): what it looks like, why the tools produce it, who it hurts, the fix, sources.",
