          },
          "digest": "sha256:31a1d69ffdeae75fd9552aa8a3d6fa3911406a9afd8baf7069c288985ce45711"
        },
        {
          "name": "report_pattern",
          "title": "Report a new pattern",
          "description": "Report an AI design anti-pattern that is NOT yet in the library, for a design failure seen repeatedly that a search of the library does not find. Reports are reviewed by a human before anything is published, and published entries credit the reporter.",
          "inputSchema": {
            "properties": {
              "credit": {
                "description": "Name or handle to credit if this is published. Optional.",
                "type": "string"
              },
              "description": {
                "description": "What it looks like and why it is a failure. Two or three sentences.",
                "type": "string"
              },
              "example": {
                "description": "A short code or copy snippet showing it. Optional. Do not include anything proprietary.",
                "type": "string"
              },
              "name": {
                "description": "A short memorable name for the pattern, e.g. \"Skeleton That Never Resolves\".",
                "type": "string"
              },
              "whereSeen": {
                "description": "Product name or URL where you saw it. Optional but makes the report far more useful.",
                "type": "string"
              }
            },
            "required": ["description", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Report a new pattern"
          },
          "behavior": {
            "destructive": false,
