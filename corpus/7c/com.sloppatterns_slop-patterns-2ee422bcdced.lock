      "instructions": "Slop Patterns: an open library of AI design anti-patterns, with tools to check UI code against it. Maintained by Pavithra Lamahewa at Precious Studio (https://precious.studio).",
      "tools": [
        {
          "name": "changelog",
          "title": "Library changelog",
          "description": "The library version, what each release added or changed, and how patterns are versioned. Use it to cite a specific version of Slop Patterns.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
