{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/handoff": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://handoff.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "handoff-watch",
        "title": "Handoff Watch",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stalled-handoff watcher for AI agents. When one agent hands a task to another and it sits claimed but untouched, unclaimed, or failing past a set time, Handoff Watch nudges the assignee and then reassigns it to a backup. Works alongside Offhand's shared task list and never against it. Free watch-only mode reports would_nudge; Pro at $9 a month acts. Free 500 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "nudge_log",
          "description": "List the latest nudges and reassigns (Pro) or would-nudges (free) for one board or all boards on your key.",
          "inputSchema": {
            "properties": {
              "board": {
                "description": "A stable name for this task list, e.g. \"offhand\" or \"team-ops\". Cooldowns and the escalation ladder are tracked per board.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9981286c542091e3ffbc35ec8c2bab0045a463e1a22d7a662466d33e6cc78c04"
        },
        {
          "name": "scan_handoffs",
          "description": "Pass the tasks your agents handed each other (e.g. the result of Offhand list_todos) and get back which are stalled or failing and what to do. A task is stalled when it is claimed (in_progress) or handed over but untouched for stall_minutes, and failing when it is blocked or has failed fail_limit times. Ladder: nudge the assignee, nudge again, then reassign to a backup agent (or ask the person). Pro acts: records each nudge with a cooldown so nobody is pinged twice, and POSTs the nudge to the agent's webhook if you give one. Free watch-only takes no action and returns would_nudge / would_reassign. It never changes a task in Offhand itself and never takes a task another agent holds; reassigning returns an Offhand add_task call for your agent to make.",
          "inputSchema": {
            "properties": {
              "backup_agent": {
                "description": "Default agent to hand stalled work to.",
                "type": "string"
              },
              "board": {
                "description": "A stable name for this task list, e.g. \"offhand\" or \"team-ops\". Cooldowns and the escalation ladder are tracked per board.",
                "type": "string"
              },
              "fail_limit": {
                "description": "Failures before a task counts as failing. Default 2.",
                "type": "integer"
              },
              "nudges_before_reassign": {
                "description": "Nudges before suggesting a reassign. Default 2.",
                "type": "integer"
              },
              "stall_minutes": {
                "description": "Minutes without activity before a task counts as stalled. Default 60.",
                "type": "integer"
              },
              "tasks": {
                "description": "Up to 200 tasks.",
                "items": {
                  "properties": {
                    "assignedTo": {
                      "description": "Agent the task was handed to (alias: assignee).",
                      "type": "string"
                    },
                    "backup": {
                      "description": "Agent that may take it over (optional).",
                      "type": "string"
                    },
                    "failures": {
                      "description": "Failed attempts so far (optional).",
                      "type": "integer"
                    },
                    "id": {
                      "type": "string"
                    },
                    "idle_minutes": {
                      "description": "Instead of updatedAt: minutes since the last activity.",
                      "type": "number"
                    },
                    "status": {
                      "description": "Offhand status: open, in_progress, blocked, done, need_review (also accepts todo, claimed, failed).",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "updatedAt": {
                      "description": "ISO time of the last status change or note (alias: updated_at).",
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "type": "array"
              },
              "webhooks": {
                "description": "Optional map of agent name to an https URL that wakes it (Pro posts nudges there).",
                "type": "object"
              }
            },
            "required": ["tasks"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4462c05b1282ffbefb87b17fe2b84c09629798ff4bc5f05a5146a93b973e0af5"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $9/month upgrade link. Free tier: 500 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9976e3342e295e0be5a023bb57d60324ebd7c104df1c76e8d7effcdadec38b20"
        },
        {
          "name": "weekly_report",
          "description": "Draft a plain-English report of the last 7 days: stalled tasks found, nudges and reassigns made (Pro) or that would have been made (free). Read-only; sends nothing.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c74021626ff8169dc4649016a2b8f6d7126321096fe6b3106355a43d0f612861"
        }
      ],
      "digest": "sha256:88fd2cd8f8806bf0f7d5f8f1f0a3e25f491761baf148e485fed74ac051d10e6b"
    }
  }
}
