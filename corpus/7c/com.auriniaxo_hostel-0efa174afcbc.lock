                    "amount_paid": {
                      "type": "number"
                    },
                    "amount_refunded": {
                      "type": "number"
                    },
                    "booking_id": {
                      "type": "integer"
                    },
                    "check_in": {
                      "type": "string"
                    },
                    "check_out": {
                      "type": "string"
                    },
                    "currency": {
                      "type": "string"
                    },
                    "door_code": {
                      "type": ["string", "null"]
