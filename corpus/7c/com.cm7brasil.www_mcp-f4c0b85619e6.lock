      "instructions": "Use search_content para encontrar páginas e get_content para lê-las em Markdown. Com login (OAuth), chame get_my_permissions para ver o que sua role permite; create_post/update_post editam seus posts (com categorias, tags e imagem destacada) e wp_rest_request alcança o resto do WordPress e dos plugins. Nada é excluído pelo MCP. Site: https://www.cm7brasil.com/",
      "tools": [
        {
          "name": "create_draft",
          "title": "Criar rascunho",
          "description": "Cria um post como rascunho no editor de blocos. Escreva o conteúdo em Markdown: títulos, listas, citações, código, tabelas, imagens e links viram blocos. Aceita categorias, tags e imagem destacada. Exige token OAuth com escopo \"write\"; só atua nos posts do próprio usuário e nunca exclui.",
          "inputSchema": {
            "properties": {
              "categories": {
                "description": "Categorias por ID ou nome (substitui as atuais). Nomes que não existem são criados se o usuário puder gerenciar categorias.",
                "items": {
                  "type": ["integer", "string"]
                },
                "type": "array"
              },
              "content": {
                "description": "Corpo em Markdown (CommonMark/GFM), convertido em blocos. Não repita o título. Com format=html aceita HTML ou blocos serializados (<!-- wp:... -->), como content_blocks de get_my_post.",
                "type": "string"
              },
              "excerpt": {
                "description": "Resumo em texto simples.",
                "type": "string"
              },
              "featured_image": {
                "description": "Imagem: informe media_id (item da biblioteca), url (o site baixa a imagem) ou data (base64, aceita data URI) com filename.",
                "properties": {
                  "alt": {
                    "description": "Texto alternativo.",
                    "type": "string"
                  },
                  "data": {
                    "description": "Arquivo em base64 ou data URI (data:image/png;base64,...).",
                    "type": "string"
                  },
                  "filename": {
                    "description": "Nome do arquivo com extensão (ex.: capa.jpg). Obrigatório com data.",
                    "type": "string"
                  },
                  "media_id": {
                    "type": "integer"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "format": {
                "default": "markdown",
                "enum": ["markdown", "html", "auto"],
                "type": "string"
