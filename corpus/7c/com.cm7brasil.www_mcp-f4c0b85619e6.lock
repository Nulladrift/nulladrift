      },
      "serverInfo": {
        "name": "portal-cm7-mcp",
        "title": "Portal CM7",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_content para encontrar páginas e get_content para lê-las em Markdown. Site: https://www.cm7brasil.com/",
      "tools": [
        {
          "name": "get_content",
          "title": "Ler conteúdo",
          "description": "Retorna o conteúdo completo de uma página ou post em Markdown, por ID ou URL.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "integer"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0aeb071dfec44d51c62795b78cff5b9c815fadfa3223a53142c11c7cb1a3c6ac"
        },
        {
          "name": "get_site_info",
          "title": "Informações do site",
          "description": "Retorna nome, descrição, idioma e recursos para agentes deste site.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7075513e7e5920f6c0e271a46076b981bda56998d4baa12b08928af98f4d435e"
        },
        {
          "name": "list_recent",
          "title": "Conteúdo recente",
          "description": "Lista os itens publicados mais recentes.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "type": "integer"
              },
              "type": {
                "default": "post",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8bf0b569ffcd19a370cb2ac3e276b08d4844654c29a9905670d55d14fc030286"
        },
        {
          "name": "search_content",
          "title": "Buscar conteúdo",
          "description": "Busca páginas e posts publicados no site. Retorna título, URL, data e resumo.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Termos de busca.",
                "type": "string"
              },
              "type": {
                "description": "Tipo de conteúdo opcional (post, page…).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
