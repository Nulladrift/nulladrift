        {
          "name": "wp_rest_request",
          "title": "Chamar a API REST",
          "description": "Executa uma chamada à API REST do WordPress como o usuário do token: tudo que a role dele permite (posts, páginas, mídia, usuários, comentários, menus, blocos reutilizáveis, configurações, plugins, temas, formulários…). O próprio WordPress verifica as permissões de cada rota. Exclusões não existem: DELETE, force e status trash são recusados. Conteúdo de outros autores é somente leitura. GET funciona com escopo read; os demais métodos exigem escopo write.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "Corpo JSON para POST/PUT/PATCH.",
                "type": "object"
              },
              "method": {
                "default": "GET",
                "enum": ["GET", "POST", "PUT", "PATCH"],
                "type": "string"
              },
              "path": {
                "description": "Rota, ex.: /wp/v2/users ou /wp/v2/settings.",
                "type": "string"
              },
              "query": {
                "description": "Parâmetros de URL (ex.: {\"per_page\":20,\"context\":\"edit\",\"_fields\":\"id,title\"}).",
                "type": "object"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
