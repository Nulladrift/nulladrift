{
  "lockfileVersion": 2,
  "subjects": {
    "com.miami44/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://miami44.com/functions/publicMcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "miami44-directory",
        "title": "Miami44 public directory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Miami44 lists Miami businesses, each with its own site. Start with list_miami_businesses or find_miami_business, then read one with get_business_site. For what is on in Miami, use list_miami_events. Everything here is public and read only. Details on a site whose owner is not verified come from public sources and say so; confirm them with the business. To send a business a question or a request for a person, use the signed-in Miami44 server.",
      "tools": [
        {
          "name": "find_miami_business",
          "title": "Find a Miami business",
          "description": "Search Miami44's business sites by name. Returns each match's name, link name (slug) and site URL.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Part of the business name, for example 'casaplanta'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a Miami business"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ff47861aa8ea523a480010adefcfb3ab09c0a4654a4afbd7f63befcffc11f91"
        },
        {
          "name": "get_business_site",
          "title": "Get a Miami business site",
          "description": "Read one Miami business's site as plain text: what it is, where it is, what visitors can do with its official links, whether a verified owner runs it, and its sources. Details are public information and may be out of date.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The business's link name from list_miami_businesses or find_miami_business",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Miami business site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b1d241092ff93509646c64a77d54dfdb111fa539529e2adef8c87910f38e61e"
        },
        {
          "name": "list_miami_businesses",
          "title": "List Miami businesses",
          "description": "List Miami44's business sites, optionally narrowed by words, neighborhood (for example 'Wynwood') or category (for example 'restaurant'). Returns each business's name, link name (slug), site URL, category, neighborhood and whether a verified owner runs it. The reply gives total, has_more and next_offset; pass offset to read the next page.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Exact category, for example restaurant, bar, gallery",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Most results to return in one page",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "neighborhood": {
                "description": "Exact neighborhood name",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "How many results to skip; use next_offset from the previous reply",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words to match in the name, category or neighborhood",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Miami businesses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22f307342b1b5aac9b5204694bf06f55c4b74eaba7f4992143334c63b9d1df2b"
        },
        {
          "name": "list_miami_events",
          "title": "List upcoming Miami events",
          "description": "List upcoming Miami events on Miami44, soonest first with editor's picks on top. Narrow by words, neighborhood (for example 'Wynwood'), kind (music, nightlife, art, film, food, outdoors, family, sports, builders, talks, wellness, civic) and how many days ahead. Each event gives the time in Miami, venue, tickets, highlights, its Miami44 page, and who posted it: a venue's verified owner, or Miami44 from the official listing.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 7,
                "description": "How many days ahead to look",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "kind": {
                "description": "Kind of outing",
                "enum": ["music", "nightlife", "art", "film", "food", "outdoors", "family", "sports", "builders", "talks", "wellness", "civic", "other"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Most events to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "neighborhood": {
                "description": "Exact neighborhood name",
                "type": "string"
              },
              "query": {
                "description": "Words to match in the title, venue or details",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List upcoming Miami events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92114cf68eb3ffac0a14cd8549887829caef65032ece29771828ec0f3908ceaa"
        }
      ],
      "digest": "sha256:c251f6b1583a01d5ab05f3c2d005b85772ba577b800b1738c28cf6190bae0419"
    }
  }
}
