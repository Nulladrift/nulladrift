                "description": "Type of subscription. Use notification for real-time webhooks or digest for daily summaries. Defaults to notification.",
                "title": "Subscription Type",
                "type": "string"
              }
            },
            "required": ["action"],
            "title": "manage_subscriptionsArguments",
            "type": "object"
          },
          "outputSchema": {
