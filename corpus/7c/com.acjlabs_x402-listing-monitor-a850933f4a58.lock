{
  "lockfileVersion": 2,
  "subjects": {
    "com.acjlabs/x402-listing-monitor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://x402-listing-monitor.acjlabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "x402-listing-monitor",
        "version": "0.1.0",
        "description": "Checks x402 Bazaar resource listings against the public discovery catalog and flags drops.",
        "websiteUrl": "https://acjlabs.com/products"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_listing_health",
          "description": "Checks whether a seller's x402 Bazaar resources are currently listed under the given payTo address in the public discovery catalog. Flags each resource as listed or missing — the same per-seller diff the registered poller runs on a schedule, run once on demand for a payTo/resources pair whether or not it has been registered with this service.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "payTo": {
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "resources": {
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["payTo", "resources"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a3bc910f7327ac28fbdb243684e0480355671aacec3ced8d9384bb8def35eef0"
        }
      ],
      "digest": "sha256:7a50ed719904db54ab5900a83511a21b3297e3550f32534718499ae2e083a674"
    }
  }
}
