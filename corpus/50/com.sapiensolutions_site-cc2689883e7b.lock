        {
          "name": "request_inquiry",
          "title": "Request an inquiry",
          "description": "Send us an inquiry. It reaches the people who do the work, by email. Needs a name, an email or a phone, and what they need.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Your company, if any, under 120 characters.",
                "type": "string"
              },
              "email": {
                "description": "An email address we can reply to. Give an email, a phone, or both.",
                "type": "string"
              },
              "line": {
                "description": "The line of work, if known: one of automation, policy-and-training, software-and-integrations, it-and-infrastructure.",
                "type": "string"
              },
              "name": {
                "description": "Your name, 2 to 80 characters.",
                "type": "string"
              },
              "need": {
                "description": "What your business does and what is not working, in your own words. No technical brief needed. Anything you already have helps: a process document, a screenshot, the spreadsheet that runs the thing. We will ask for it anyway.",
                "type": "string"
              },
              "phone": {
                "description": "A phone number, 7 to 20 digits. Give an email, a phone, or both.",
                "type": "string"
              }
            },
            "required": ["name", "need"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "next_step": {
                "type": "string"
              },
              "reference": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["next_step", "reference", "summary"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5b70d7785cc6f4d03dd2b7505b386f3f3315622e2228c988d38b5588a74e1098"
        },
        {
          "name": "service_area",
          "title": "Service area",
          "description": "Whether we work on site or remotely for a place, per line of work. Give a town, county, state or address.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "location": {
                "description": "A town, county, state, ZIP code or street address.",
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "outputSchema": {
