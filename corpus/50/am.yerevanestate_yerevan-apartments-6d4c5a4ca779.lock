        },
        {
          "name": "search",
          "title": "Search (ChatGPT connector)",
          "description": "[Premium] Free-text search over current Yerevan listings, e.g. '2 rooms Arabkir under 120000'. Returns ids for `fetch`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
