        {
          "name": "get_area_stats",
          "title": "Prices around a point",
          "description": "Live asking-price stats for all listings within radiusM (default 500 m) of a point: median $/m², p25–p75, new vs resale, days on market, price cuts, plus the main streets in the circle. Use for 'how much near X' after geocoding X. Цены вокруг точки.",
