          "name": "get_market_overview",
          "title": "Yerevan market overview",
          "description": "Average asking price per m² (USD) for Yerevan and each of its 12 districts, change since Sep 2025, number of listings, and deals per district in the last full year. Цены на квартиры в Ереване по районам.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
