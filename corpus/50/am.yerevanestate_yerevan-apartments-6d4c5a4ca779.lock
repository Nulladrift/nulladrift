        },
        {
          "name": "search_listings",
          "title": "Search current listings",
          "description": "[Premium] Find apartments currently listed for sale or rent (seen in the last 14 days) by district, street or block, distance from a point, rooms, price, area, new build and renovation. Returns up to 20 with price, $/m², street and an id for get_listing. Найти квартиры в продаже или аренде.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "district": {
                "description": "District: name in English, Russian or Armenian (e.g. Arabkir, Арабкир, Արաբկիր) or number 2–13",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "listingType": {
                "default": "sale",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "maxPrice": {
                "description": "USD (sale total or monthly rent)",
                "type": "number"
              },
              "maxSqm": {
                "type": "number"
              },
              "minPrice": {
                "description": "USD (sale total or monthly rent)",
                "type": "number"
              },
              "minSqm": {
                "type": "number"
              },
              "near": {
                "description": "Only listings within radiusM metres of this point",
                "properties": {
                  "lat": {
                    "type": "number"
                  },
                  "lng": {
                    "type": "number"
                  },
                  "radiusM": {
                    "default": 500,
                    "maximum": 3000,
                    "minimum": 100,
                    "type": "number"
                  }
                },
                "required": ["lat", "lng"],
                "type": "object"
              },
              "newConstruction": {
                "enum": ["yes", "no"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "renovation": {
                "description": "Renovation state",
                "enum": ["renovated", "partial renovation", "no renovation"],
                "type": "string"
              },
              "rooms": {
                "enum": ["1", "2", "3", "4+"],
                "type": "string"
              },
              "sort": {
                "default": "price_asc",
                "enum": ["price_asc", "price_desc", "ppsm_asc", "newest"],
                "type": "string"
              },
              "street": {
                "description": "Street or block name in Armenian, English or Russian, old names and typos are fine (e.g. Komitas, Կոմիտաս, Комитаса, Davtashen 1st Block)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
