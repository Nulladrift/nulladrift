{
  "lockfileVersion": 2,
  "subjects": {
    "am.yerevanestate/yerevan-apartments": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.yerevanestate.am/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "yerevanestate",
        "title": "YerevanEstate — Yerevan apartment market",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data on Yerevan apartment prices from sale and rent listings and government deal counts. Call get_market_overview first for context. Always cite month, n and that prices are asking prices. Read the methodology resource before interpreting numbers. All statistics are free. Tools marked [Premium] return individual listings and need a Premium key (this connection is FREE: those tools return only a count and a link to https://www.yerevanestate.am/ai#premium).",
      "tools": [
        {
          "name": "estimate_address",
          "title": "Price at an exact address + what's nearby",
          "description": "Price for a flat at an exact Yerevan address (e.g. 'Komitas 42', 'Комитаса 42', 'Կոմիտաս 42'): finds the building, estimates sale price (per m² and total) and monthly rent with a model trained on all listings (location down to the street segment, floor, renovation, building, metro, parks, schools, kindergartens), shows which factors push the price up or down, the building's floors/material, the street's median price, and distances to metro, schools, kindergartens, parks, playgrounds, shops, pharmacies, hospitals. Free. Цена по точному адресу и что рядом.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "street + house number, any language",
                "type": "string"
              },
              "ceiling": {
                "description": "ceiling height, m",
                "maximum": 5,
                "minimum": 2,
                "type": "number"
              },
              "elevator": {
                "type": "boolean"
              },
              "floor": {
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "floors": {
                "description": "floors in the building, if known (else taken from the building data)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "furniture": {
                "description": "rent: furnished",
                "type": "boolean"
              },
              "listingType": {
                "default": "both",
                "enum": ["sale", "rent", "both"],
                "type": "string"
              },
              "material": {
                "enum": ["Monolith", "Stone", "Panels", "Bricks", "Cassette"],
                "type": "string"
              },
              "newBuild": {
                "type": "boolean"
              },
              "renovation": {
                "enum": ["none", "old", "partial", "cosmetic", "major", "euro", "designer"],
                "type": "string"
              },
              "rooms": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "sqm": {
                "description": "area m² (default 60)",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4783b17137cd513603d63fda73e43d7d2823bc5ccf65d4491c24b10ba3e104a3"
        },
        {
          "name": "estimate_price",
          "title": "Estimate an apartment price or rent",
          "description": "Fair price range for a Yerevan apartment from comparable listings: median, 25th–75th percentile and, if a price is given, a verdict (below / in / above market) plus up to 5 similar listings. Sale: total for the given m². Rent: per month. Оценка квартиры: дорого или нет.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "constructionType": {
                "description": "Building material",
                "enum": ["Monolith", "Stone", "Panels", "Bricks"],
                "type": "string"
              },
              "district": {
                "description": "District: name in English, Russian or Armenian (e.g. Arabkir, Арабкир, Արաբկիր) or number 2–13",
                "type": "string"
              },
              "furniture": {
                "description": "Furniture (required for rent)",
                "enum": ["With", "Without"],
                "type": "string"
              },
              "listingType": {
                "default": "sale",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "newConstruction": {
                "description": "Yes = new build, No = secondary market",
                "enum": ["Yes", "No"],
                "type": "string"
              },
              "price": {
                "description": "Asking price to judge, USD (sale total or monthly rent)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "renovationType": {
                "description": "Renovation state",
                "enum": ["renovated", "partial renovation", "no renovation"],
                "type": "string"
              },
              "rooms": {
                "description": "Rooms (required for rent)",
                "enum": ["1", "2", "3", "4+"],
                "type": "string"
              },
              "sqm": {
                "description": "Area in m² (sale)",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["constructionType", "district", "newConstruction", "renovationType"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5d47203bcf8ac4b4ca52e1bbf9ca4edfb4155e2c2bfe4dafee264c77abbafa94"
        },
        {
          "name": "fetch",
          "title": "Fetch (ChatGPT connector)",
          "description": "[Premium] Fetch one listing by id returned from `search`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
