        {
          "name": "get_price_drops",
          "title": "Listings whose price just dropped",
          "description": "[Premium] Live listings whose asking price went down: current price vs the highest price in the last `days` days (default 30), biggest drops first. Filter by district, street, rooms. Квартиры, которые подешевели.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "default": 30,
                "maximum": 120,
                "minimum": 7,
                "type": "integer"
              },
              "district": {
                "description": "District: name in English, Russian or Armenian (e.g. Arabkir, Арабкир, Արաբկիր) or number 2–13",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "listingType": {
                "default": "sale",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "minDropPct": {
                "default": 5,
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "rooms": {
                "enum": ["1", "2", "3", "4+"],
                "type": "string"
              },
              "street": {
                "description": "Street or block name in any language",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cbf3c4985bce77d000f24a239801fde79c10032b2e6e91a23106e5ce84103dc7"
        },
        {
          "name": "get_price_history",
          "title": "Monthly price history for a segment",
          "description": "Monthly average asking price per m² (USD and AMD) and listing counts for one segment: district × material × new/secondary × renovation. Use district 'Yerevan' or 1 for the whole city.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "constructionType": {
                "description": "Building material",
                "enum": ["Monolith", "Stone", "Panels", "Bricks"],
                "type": "string"
              },
              "district": {
                "description": "District name/number, or 'Yerevan' / 1 for the city",
                "type": "string"
              },
