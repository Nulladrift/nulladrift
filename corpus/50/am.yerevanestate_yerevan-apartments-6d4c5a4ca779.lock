          "name": "get_rental_yields",
          "title": "Rental yield by district",
          "description": "Gross rental yield per district for one apartment type: median yield %, typical range, median monthly rent, median purchase price, payback years, sample size. Где выгоднее сдавать квартиру.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "constructionType": {
                "default": "Stone",
