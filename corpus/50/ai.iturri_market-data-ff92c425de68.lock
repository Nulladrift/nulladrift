      "instructions": "Data and tooling only — never trading signals or advice. Free: describe_catalog, plus the verdict tools audit_my_data / lookahead_check / survivorship_check (they judge YOUR data against the verified archive). Other tools are x402-priced — retry with payment in _meta[\"x402/payment\"] after a PaymentRequired result. Subscriptions: buy via POST /api/subscribe (x402), then send 'Authorization: Bearer <token>' on /mcp requests — metered tools become free; build_bundle pack SKUs stay pay-per-sale.",
