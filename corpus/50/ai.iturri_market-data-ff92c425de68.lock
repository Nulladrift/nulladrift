        {
          "name": "audit_my_data",
          "description": "FREE: submit YOUR OHLCV bars and get an accuracy verdict against the verified archive — score, worst windows, systematic-offset findings. Tells you what's wrong, not the corrected values (that's get_bars).",
          "inputSchema": {
            "properties": {
              "bars": {
                "description": "columnar arrays: t (epoch s or ISO) required; o/h/l/c optional",
                "properties": {
                  "c": {
                    "type": "array"
                  },
                  "h": {
                    "type": "array"
                  },
                  "l": {
                    "type": "array"
                  },
                  "o": {
                    "type": "array"
                  },
                  "t": {
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "symbol": {
                "type": "string"
              },
              "tf": {
                "type": "string"
              }
            },
            "required": ["bars", "symbol", "tf"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:047b429bfc2deaf6014307ea667147b40818288d7fc5c032a2bbbee3b5487738"
