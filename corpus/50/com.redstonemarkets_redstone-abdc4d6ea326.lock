        {
          "name": "screen_securities",
          "title": "Screen stocks and ETFs by performance and risk",
          "description": "Use this when the user wants a ranked list of US stocks or ETFs by a performance, risk or dividend yield metric, optionally within a sector or ETF category (e.g. \"lowest volatility dividend ETFs\", \"highest yielding bond ETFs\", \"highest Sharpe tech stocks this year\", \"energy stocks with the smallest drawdown\"). Covers about 2,900 US-listed stocks and about 1,200 US ETFs, end-of-day. Not for fundamentals (P/E, revenue), news or buy recommendations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "filters": {
                "description": "Optional bounds in each metric's own units, e.g. {metric: 'beta1y', max: 1}. maxDrawdown1yPct is negative, so a drawdown smaller than 20% is {metric: 'maxDrawdown1yPct', min: -20}",
                "items": {
                  "properties": {
                    "max": {
                      "type": "number"
                    },
                    "metric": {
                      "enum": ["return1dPct", "returnYtdPct", "return1yPct", "return5yAnnualizedPct", "maxDrawdown1yPct", "sharpe1y", "sortino1y", "beta1y", "alpha1yPct", "volatility1yPct", "dividendYieldPct"],
                      "type": "string"
                    },
                    "min": {
                      "type": "number"
                    }
                  },
                  "required": ["metric"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "order": {
                "default": "desc",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "sector": {
                "description": "Case-insensitive match on a stock's GICS sector (e.g. Information Technology, Health Care, Energy, Financials) or an ETF's category (e.g. Dividend, Bonds, Treasury, Large Cap Growth, Emerging Markets, Gold)",
                "maxLength": 40,
                "type": "string"
              },
              "sortBy": {
                "default": "return1yPct",
                "description": "Metric to rank by. For lowest risk, sort volatility1yPct ascending, maxDrawdown1yPct descending (closest to 0) or beta1y ascending",
                "enum": ["return1dPct", "returnYtdPct", "return1yPct", "return5yAnnualizedPct", "maxDrawdown1yPct", "sharpe1y", "sortino1y", "beta1y", "alpha1yPct", "volatility1yPct", "dividendYieldPct"],
                "type": "string"
              },
              "type": {
                "default": "all",
                "description": "Limit to stocks, ETFs, or both",
                "enum": ["stock", "etf", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
