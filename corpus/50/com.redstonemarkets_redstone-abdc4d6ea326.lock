                      "type": ["number", "null"]
                    },
                    "maxDrawdown1yPct": {
                      "description": "Worst peak-to-trough fall over the past year (negative)",
                      "type": ["number", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "price": {
                      "description": "Latest close in USD",
                      "type": ["number", "null"]
                    },
                    "return1dPct": {
                      "type": ["number", "null"]
                    },
                    "return1yPct": {
                      "type": ["number", "null"]
                    },
                    "return5yAnnualizedPct": {
                      "type": ["number", "null"]
                    },
                    "returnYtdPct": {
                      "type": ["number", "null"]
                    },
                    "sector": {
                      "description": "GICS sector for stocks, category for ETFs",
                      "type": ["string", "null"]
                    },
                    "sharpe1y": {
                      "type": ["number", "null"]
                    },
                    "sortino1y": {
                      "type": ["number", "null"]
                    },
                    "statsSince": {
                      "description": "YYYY-MM-DD, set only when there is less than a year of history: the 1Y figures (return, drawdown, volatility, Sharpe, Sortino, beta, alpha, yield) then run from this first close, and so does the YTD return if it falls this year. Screens on those metrics leave such securities out",
                      "type": ["string", "null"]
                    },
                    "ticker": {
                      "type": "string"
