      "instructions": "Redstone (redstonemarkets.com) has end-of-day (not real-time) analytics for about 2,900 US-listed stocks (the Russell 1000, the largest foreign companies and every other stock trading $5M+ a day) and about 1,200 US ETFs: YTD, 1-year and 5-year annualized returns, past-year risk (max drawdown, volatility, Sharpe, Sortino, beta and alpha vs SPY), dividend yield, correlations, backtests of hypothetical weighted portfolios, screening, and the public portfolios Redstone's users shared and its model portfolios. Returns are total returns in percent: split-adjusted, with dividends reinvested on the ex-date. Present results as historical data, not investment advice or predictions. Link the Redstone page each result includes.",
      "tools": [
        {
          "name": "backtest_portfolio",
          "title": "Backtest a stock and ETF portfolio",
          "description": "Use this when the user describes a portfolio of US stocks and ETFs with weights (e.g. \"60% VTI, 40% BND\", \"equal parts AAPL, MSFT, NVDA\") and wants to know how it would have done or how risky it is: returns over YTD, 1 year and 5 years (rebalanced quarterly), max drawdown, volatility, Sharpe, beta vs SPY, dividend yield and the correlation between holdings, charted against SPY, with a link that opens it on Redstone to save. 2 to 20 holdings. Not for live brokerage accounts, trading or allocation advice.",
