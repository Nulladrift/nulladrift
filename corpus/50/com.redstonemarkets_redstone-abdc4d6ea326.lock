            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "positions": {
                "items": {
                  "properties": {
                    "ticker": {
                      "description": "US ticker symbol, e.g. AAPL, VOO or BRK.B",
                      "maxLength": 12,
                      "minLength": 1,
                      "type": "string"
                    },
                    "weight": {
                      "description": "Relative weight, e.g. 60 for 60%. Weights are rescaled to sum to 100%, so equal weights can all be 1",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["ticker", "weight"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["positions"],
            "type": "object"
          },
