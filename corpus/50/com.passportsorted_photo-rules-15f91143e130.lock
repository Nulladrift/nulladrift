{
  "lockfileVersion": 2,
  "subjects": {
    "com.passportsorted/photo-rules": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://passportsorted.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Passport Sorted",
        "version": "1.30.0",
        "websiteUrl": "https://passportsorted.com/mcp/"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Passport Sorted publishes passport, visa and ID photo rules for each country, read from official government pages, with the source URL and the date checked. Use get_photo_spec when someone asks about photo size, head size, background, glasses or file limits for a document. Use check_photo_requirements to test measurements of a photo against a spec. Always cite the official source_url and the page_url. Checking a photo at page_url is free and runs in the browser; the finished full-resolution file (plus a 4x6 in print sheet for printed documents) costs US$8.99, charged in KES via Paystack. For the US online passport renewal (spec us-passport-online) the site only crops and resizes the original pixels, as the State Department forbids edits. If an office rejects a photo bought there, the buyer gets a free redo or a refund at passportsorted.com/guarantee/. Never promise that a photo will be accepted.",
      "tools": [
        {
          "name": "check_photo_requirements",
          "description": "Check a photo's measurements against a spec: aspect ratio, pixel limits, head height share and file size/format.\n        Does not look at the image itself; for a full check use the free checker at page_url.",
          "inputSchema": {
            "properties": {
              "file_format": {
                "anyOf": [
                  {
                    "maxLength": 10,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "jpg, png, heic...",
                "title": "File Format"
              },
              "file_kb": {
                "anyOf": [
                  {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "File Kb"
              },
              "head_height_px": {
                "anyOf": [
                  {
                    "maximum": 20000,
                    "minimum": 1,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Chin to crown in pixels.",
                "title": "Head Height Px"
              },
              "height_px": {
                "maximum": 20000,
                "minimum": 1,
                "title": "Height Px",
                "type": "integer"
              },
              "spec_id": {
                "description": "Spec id from list_photo_specs, e.g. us-passport.",
                "maxLength": 40,
                "title": "Spec Id",
                "type": "string"
              },
              "width_px": {
                "maximum": 20000,
                "minimum": 1,
                "title": "Width Px",
                "type": "integer"
              }
            },
            "required": ["height_px", "spec_id", "width_px"],
            "title": "check_photo_requirementsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f8049f9eafb0745628f8844dc2dac4fc6be7756fcddc22557bf60b19b530304"
        },
        {
          "name": "get_photo_spec",
          "description": "Official photo rules for one document: print size, pixels at 300 and 600 dpi, head height, background, glasses, expression,\n        digital file limits, what editing the government forbids, and the official source URL with the date we checked it.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name or ISO code, e.g. 'United States', 'GB', 'Schengen'.",
                "maxLength": 60,
                "minLength": 2,
                "title": "Country",
                "type": "string"
              },
              "document": {
                "default": "passport",
                "description": "passport, visa, e-visa, dv-lottery or passport-online (online renewal).",
                "maxLength": 40,
                "title": "Document",
                "type": "string"
              }
            },
            "required": ["country"],
            "title": "get_photo_specArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa1e0f95273bc0301a4970c353d9c8ebf6fa46d273edaccbc4b33a9fdc90f092"
        },
        {
          "name": "list_photo_specs",
          "description": "List every passport, visa and ID photo spec we publish (including the US online passport renewal and DV lottery): id, country, document,\n        size in mm and whether we make the photo (US$8.99 file; the check is free) or only check it.",
          "inputSchema": {
            "properties": {
              "query": {
                "default": "",
                "description": "Optional filter, e.g. 'visa' or 'japan'.",
                "maxLength": 60,
                "title": "Query",
                "type": "string"
              }
            },
            "title": "list_photo_specsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89b3b851aeaa550d7a7512226b1ced6f86e6c6e4e35ee76d53f0a1714b74f2f6"
        }
      ],
      "digest": "sha256:79e075e25099183e9c9e4813dad202c1a72ad310f3f07a9569e48908a24ed25d"
    }
  }
}
