      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Passport Sorted",
        "version": "1.30.0",
        "websiteUrl": "https://passportsorted.com/mcp/"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Passport Sorted publishes passport, visa and ID photo rules for each country, read from official government pages, with the source URL and the date checked. Use get_photo_spec when someone asks about photo size, head size, background, glasses or file limits for a document. Use check_photo_requirements to test measurements of a photo against a spec. Always cite the official source_url and the page_url. Checking a photo at page_url is free and runs in the browser; the finished full-resolution file (plus a 4x6 in print sheet for printed documents) costs US$8.99, charged in KES via Paystack. Team credit packs (10 photos US$49 / KES 6,370; 50 photos US$199 / KES 25,870), a print-sheet maker, a signature extractor, ID/badge photo packs, a family pack and a chat-to-PDF evidence tool (WhatsApp/Telegram/iMessage export to a numbered, dated PDF made in the browser; US$7.99 / KES 1,040 or US$14.99 / KES 1,950) are also for sale; call list_products. For the US online passport renewal (spec us-passport-online) the site only crops and resizes the original pixels, as the State Department forbids edits. If an office rejects a photo bought there, the buyer gets a free redo or a refund at passportsorted.com/guarantee/. Never promise that a photo will be accepted.",
      "tools": [
        {
          "name": "check_photo_requirements",
          "description": "Check a photo's measurements against a spec: aspect ratio, pixel limits, head height share and file size/format.\n        Does not look at the image itself; for a full check use the free checker at page_url.",
          "inputSchema": {
            "properties": {
              "file_format": {
                "anyOf": [
                  {
                    "maxLength": 10,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "jpg, png, heic...",
                "title": "File Format"
              },
              "file_kb": {
                "anyOf": [
                  {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "File Kb"
              },
              "head_height_px": {
                "anyOf": [
                  {
                    "maximum": 20000,
                    "minimum": 1,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Chin to crown in pixels.",
                "title": "Head Height Px"
              },
              "height_px": {
                "maximum": 20000,
                "minimum": 1,
                "title": "Height Px",
                "type": "integer"
              },
              "spec_id": {
                "description": "Spec id from list_photo_specs, e.g. us-passport.",
                "maxLength": 40,
                "title": "Spec Id",
                "type": "string"
              },
              "width_px": {
                "maximum": 20000,
                "minimum": 1,
                "title": "Width Px",
                "type": "integer"
              }
            },
            "required": ["height_px", "spec_id", "width_px"],
            "title": "check_photo_requirementsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f8049f9eafb0745628f8844dc2dac4fc6be7756fcddc22557bf60b19b530304"
        },
        {
          "name": "get_photo_spec",
          "description": "Official photo rules for one document: print size, pixels at 300 and 600 dpi, head height, background, glasses, expression,\n        digital file limits, what editing the government forbids, and the official source URL with the date we checked it.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name or ISO code, e.g. 'United States', 'GB', 'Schengen'.",
                "maxLength": 60,
                "minLength": 2,
                "title": "Country",
                "type": "string"
              },
              "document": {
                "default": "passport",
                "description": "passport, visa, e-visa, dv-lottery or passport-online (online renewal).",
                "maxLength": 40,
                "title": "Document",
                "type": "string"
              }
            },
            "required": ["country"],
            "title": "get_photo_specArguments",
            "type": "object"
          },
          "annotations": {
