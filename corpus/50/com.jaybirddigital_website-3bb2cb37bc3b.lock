          },
          "digest": "sha256:52e106b6b1a9c88d42d2feaf2fef35e3d165cb6f2d94c402c83b96bceff6417d"
        },
        {
          "name": "read_website_file",
          "title": "Read a website file",
          "description": "Returns one saved file from a website with its path, encoding and content: pages, stylesheets and scripts as utf8 text, pictures and fonts as base64. It changes nothing. A path that is not saved fails with no_such_file; list_website_files shows which paths exist.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "path": {
                "description": "The file's path from the website's root, exactly as it was saved, such as index.html, about.html or images/shop.jpg. list_website_files shows every path.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["path", "websiteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a website file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["site:read", "site:edit", "site:preview", "site:publish", "site:list"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:07826dad6591ce69189f513c259d74ec8b2e59c82c98b6bd8ac2b7ed512f6e66"
        },
        {
          "name": "save_website_files",
          "title": "Save website files",
          "description": "Adds or replaces files on a website and checks every page against the rules start_website returned. Files not sent stay as they are; delete_website_file removes one. Returns the viewUrl, keepUrl, pages, passed, and problems naming each rule a page breaks; the person can keep the website once passed is true. A website holds up to 40 files and 12 MB, with pages up to 300 KB and other files up to 2 MB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "files": {
                "description": "1 to 40 files to add or replace. A file whose path is already saved is overwritten.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "description": "The file's text, or base64 for a picture or font.",
                      "type": "string"
                    },
                    "encoding": {
                      "description": "base64 for pictures and fonts. Text is utf8.",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "The file's path from the website's root: lower-case, up to four folders deep, such as index.html, about.html, styles.css or images/shop.jpg. index.html is the home page, and the address /about serves about.html.",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["files", "websiteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Save website files"
          },
          "behavior": {
            "destructive": true,
