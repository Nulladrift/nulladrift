              },
              {
                "scopes": ["site:read", "site:edit", "site:preview", "site:publish", "site:list"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7e0f32237381ff7d73e9b71f33b34a2a524163adb17c207a34c138e486de1ded"
        },
        {
          "name": "start_website",
          "title": "Start a website",
          "description": "Creates a new, empty website and returns its websiteId, the editKey for changing it, the viewUrl where it can be seen, the keepUrl where the person keeps it, and the rules and size limits its files must meet. Each call makes a separate website; to change one already started, save to its websiteId instead. No account is needed: a draft lasts 7 days unless the person keeps it, and with an account connected it joins that account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "about": {
                "description": "Optional: what the person said the website is for, in their words.",
                "maxLength": 400,
                "type": "string"
              },
              "businessName": {
                "description": "The website's name as the person gave it, such as their business's name. It is shown in the website's address.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["businessName"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a website"
          },
