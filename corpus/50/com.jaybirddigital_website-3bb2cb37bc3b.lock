              {
                "scopes": ["site:read", "site:edit", "site:preview", "site:publish", "site:list"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d186a22e5fe2e26d34e3b2365f4dc81b872a512ac20298d95380d16a1a604775"
        },
        {
          "name": "list_website_files",
          "title": "List website files",
          "description": "Lists every file saved on a website, with each path and its size in bytes, beside the viewUrl, keepUrl, pages, passed and any problems. It changes nothing. The paths are the ones read_website_file and delete_website_file take.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["websiteId"],
            "type": "object"
          },
          "annotations": {
