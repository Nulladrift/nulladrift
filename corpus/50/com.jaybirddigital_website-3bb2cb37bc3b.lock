        {
          "name": "get_picture_upload_link",
          "title": "Get a picture upload link",
          "description": "Makes a link where the person adds their own photos to a website from their phone or computer, so the photos never pass through the conversation. Give them uploadUrl: it takes up to 10 photos of up to 20 MB each and works for 24 hours. Each photo is saved as images/<its file name>, made smaller to suit a web page. When the person says they are done, list_website_files shows the saved paths to use as the src of an <img> in the pages. Making the link changes nothing on the website. For photos already passed to you as files, save_website_pictures saves them directly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
