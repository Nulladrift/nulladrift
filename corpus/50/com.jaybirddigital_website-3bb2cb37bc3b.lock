              {
                "scopes": ["site:read", "site:edit", "site:preview", "site:publish", "site:list"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:e574cf1599304330ec99c6f1446966ec619128c18ed3a4b6bede733b22b9356b"
        },
        {
          "name": "search_domains",
          "title": "Search for a domain name",
          "description": "Asks a domain registrar, live, which names can be registered, and returns up to about a dozen, each with its name, whether it is available and whether it is premium. Availability can change at any moment. Nothing is bought or held; a name is bought from the website's keep page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A whole domain name such as sweetcrumbs.com, or a word to build names from such as sweetcrumbs.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search for a domain name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
