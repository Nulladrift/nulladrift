        {
          "name": "get_picture_upload_link",
          "title": "Get a picture upload link",
          "description": "Makes a link where the person adds their own photos to a website from their phone or computer, so the photos never pass through the conversation. Give them uploadUrl: it works for 24 hours and takes photos of up to 20 MB each. Every place a page keeps for a photo (an <img> whose src is photos/<name>.jpg with no file saved there yet) is listed on it by its alt, and the photo the person chooses is saved at that place and shows on the website at once. They can add up to 10 other photos too, each saved as images/<its file name>; when they say they are done, list_website_files shows those paths to use as the src of an <img> in the pages. In an app that shows a tool's own interface, the answer comes with a box in the chat where the person chooses their photos; the link does the same in any app. Making the link changes nothing on the website. For photos already passed to you as files, save_website_pictures saves them directly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["websiteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
