        "name": "jaybird-website",
        "title": "Jaybird Digital",
        "version": "1.3.3"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Starts a website for the person you are helping, with no account. Call start_website, write the pages following the rules it returns, and save them with save_website_files; change part of a page later with edit_website_file rather than sending it whole again. If you can run commands with internet access, write the website in a folder of its own instead and send the whole folder, photos included, as one zip to the siteZip address start_website returns, from inside that folder (cd <website folder> && zip -r ../site.zip . && curl -T ../site.zip \"<siteZip.url>\"; everything in the folder is sent, so it holds only the website's files); it is checked and saved as save_website_files saves, with the same report. A page that should show the person's photos needs them first: give the person the photoLink start_website returns (get_picture_upload_link makes another) and wait until they say they have added them, or save pictures you hold as files with save_website_pictures. Photos pasted or attached in this chat are for you to look at, not files you can pass to these tools: ask the person to add the same photos at the photoLink, which takes a minute on their phone. Never send a photo as base64, and never point an <img> at a picture that is not saved. Before you say the website is ready, run check_website_on_phone and fix what it finds. Show the person the viewUrl. The keepUrl is where they can keep the website.",
      "tools": [
        {
          "name": "check_website_on_phone",
          "title": "Check a website on a phone",
          "description": "Opens a website's pages in a real browser at a phone's size (390 by 844, as an iPhone) and says, page by page, what a phone visitor would hit: sideways scrolling and what is too wide, pictures that do not load, text under 12px, links and buttons under 24px to tap, a missing or zoom-blocking viewport line, bars that cover the screen, and a main heading pushed below the first screen. Each page gets fine and findings in plain words. It changes nothing. Checks every page up to 5 (or the pages named), a few seconds each, up to 40 pages a day per website. With picture true it also returns a screenshot of the first page checked, for an app that can look at images. Fix what it finds with edit_website_file or save_website_files, then check those pages again. Fails with check_limit when the day's checks are used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "pages": {
                "description": "Optional: up to 5 saved pages to check, such as [\"index.html\", \"menu.html\"]. Leave it out to check every page, home page first, up to 5.",
                "items": {
                  "description": "A saved page such as index.html or about.html.",
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "picture": {
                "description": "true to also get a screenshot of the first page checked, as a phone shows it. Leave it out if your app cannot look at images.",
                "type": "boolean"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["websiteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a website on a phone"
