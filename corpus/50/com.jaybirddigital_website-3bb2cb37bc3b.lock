      "serverInfo": {
        "name": "jaybird-website",
        "title": "Jaybird Digital",
        "version": "1.3.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Starts a website for the person you are helping, with no account. Call start_website, write the pages following the rules it returns, and save them with save_website_files. Show the person the viewUrl. The keepUrl is where they can keep the website.",
      "tools": [
        {
          "name": "delete_website",
          "title": "Delete a website",
          "description": "Permanently deletes a whole website: every file, its address and its keep link. It cannot be undone. To remove one file instead, use delete_website_file. A website with a plan is refused with has_a_plan; the person removes it from their dashboard.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["websiteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Delete a website"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["site:read", "site:edit", "site:preview", "site:publish", "site:list"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:62633a38faac2310711ea03d7dc131d481858e49225e3c53a45d1260f251c3df"
        },
        {
          "name": "delete_website_file",
          "title": "Delete a website file",
          "description": "Removes one saved file from a website, then checks the remaining pages against the rules start_website returned, and returns the same report as save_website_files. Other files stay. A path that is not saved fails with no_such_file. Removing index.html leaves the website with no home page until one is saved. To delete the whole website, use delete_website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "path": {
                "description": "The file's path from the website's root, exactly as it was saved, such as index.html, about.html or images/shop.jpg. list_website_files shows every path.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["path", "websiteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Delete a website file"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
