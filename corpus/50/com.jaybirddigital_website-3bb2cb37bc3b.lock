        {
          "name": "save_website_files",
          "title": "Save website files",
          "description": "Adds or replaces files on a website and checks every page against the rules start_website returned. Files not sent stay as they are; delete_website_file removes one, and edit_website_file changes part of one. Never send a photo here as base64: one photo is hundreds of thousands of characters, slow and costly to write; for a photo the person will add, write <img src=\"photos/<name>.jpg\" alt=\"what belongs there\"> and give them the photoLink start_website returned: they fill that place themselves and it shows at once. save_website_pictures saves pictures you hold as files or at an https address. If you can run commands with internet access, write the website in a folder and send it all at once, photos included, to siteZip instead of typing every file here. Returns the viewUrl, keepUrl, pages, passed, and problems naming each rule a page breaks, with photoPlaces (each place kept for a photo and whether it is filled) and a photoLink while any is waiting; the person can keep the website once passed is true. A website holds up to 40 files and 12 MB, with pages up to 300 KB and other files up to 2 MB, and can be saved 500 times. A website hosted as written on a plan holds up to 150 files and 32 MB, with other files up to 8 MB, and can be saved any number of times; list_website_files gives the limits of the website at hand.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkOnPhone": {
                "description": "true to also check every page on a phone once this is saved, in the same call, as check_website_on_phone does. Send it with your last change before you say the website is ready.",
                "type": "boolean"
              },
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "files": {
                "description": "1 to 40 files to add or replace, or up to 150 on a website hosted as written on a plan. A file whose path is already saved is overwritten.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "description": "The file's text, or base64 for a small picture you made (an icon) or a font. Not for photos: see photoLink and save_website_pictures.",
                      "type": "string"
                    },
                    "encoding": {
                      "description": "base64 for pictures and fonts. Text is utf8.",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "The file's path from the website's root: lower-case, up to four folders deep, such as index.html, about.html, styles.css or images/shop.jpg. index.html is the home page, and the address /about serves about.html.",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "maxItems": 150,
                "minItems": 1,
                "type": "array"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["files", "websiteId"],
            "type": "object"
          },
