        {
          "name": "delete_website",
          "title": "Delete a website",
          "description": "Permanently deletes a whole website: every file, its address and its keep link. It cannot be undone. Call it only when the person has asked, in their own words, for the website to be deleted; never to start over, since save_website_files and edit_website_file change a website in place. To remove one file instead, use delete_website_file. A website with a plan is refused with has_a_plan; the person removes it from their dashboard.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["websiteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
