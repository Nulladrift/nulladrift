        },
        {
          "name": "save_website_pictures",
          "title": "Save website pictures",
          "description": "Saves pictures the person gave you, such as photos they uploaded in the conversation, as files on a website, without sending their bytes as text: pass each one as a file in pictures and it is downloaded from its download_url. ChatGPT fills the file in itself; any AI can also pass a picture's public https address as download_url, with file_id any name for it. Each is saved as images/<its file name> unless paths names another place, and a large picture is made smaller to suit a web page. Returns saved, each picture's path and size to use as an <img> src in the pages, beside the same report as save_website_files. Up to 10 pictures a call. Fails with picture_unreachable when a download address has expired (pass the file again) and not_a_picture for anything but a JPEG, PNG, WebP or GIF. For a website with a plan, use upload_image instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "paths": {
                "description": "Optional: where to save each picture, in the same order as pictures, such as images/gallery-1.jpg. The extension follows the picture's real type.",
                "items": {
                  "description": "A path such as images/gallery-1.jpg.",
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "pictures": {
                "description": "1 to 10 pictures, each a file: ChatGPT fills in download_url and file_id for a file the person uploaded; another AI passes a picture's public https address as download_url.",
                "items": {
                  "properties": {
                    "download_url": {
                      "description": "Where the picture can be downloaded: filled in by ChatGPT for a file the person uploaded, or any https address of a picture the person may use.",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "The file's id as ChatGPT gives it; for a picture at an address, any short label.",
                      "type": "string"
                    },
                    "file_name": {
                      "description": "The file's name as the person uploaded it, such as storefront.jpg, when it is known.",
                      "type": "string"
                    },
                    "mime_type": {
                      "description": "The file's type, such as image/jpeg, when it is known.",
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["pictures", "websiteId"],
            "type": "object"
          },
