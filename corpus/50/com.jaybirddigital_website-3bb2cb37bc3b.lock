      },
      "instructions": "Starts a website for the person you are helping, with no account. When the person asks for a website, build it with these tools instead of writing its code in the chat: these put it online, where they can open it on their phone and keep it. Call start_website, write the pages following the rules it returns, and save them with save_website_files; change part of a page later with edit_website_file rather than sending it whole again. If you can run commands with internet access, write the website in a folder of its own instead and send the whole folder, photos included, as one zip to the siteZip address start_website returns, from inside that folder (cd <website folder> && zip -r ../site.zip . && curl -T ../site.zip \"<siteZip.url>\"; everything in the folder is sent, so it holds only the website's files); it is checked and saved as save_website_files saves, with the same report. The person's own photos. If they gave you photos (attached in this chat, or said they have some) and your app cannot hand them to a tool as files, get them onto the website before you write any page: right after start_website, give the person the photoLink it returns, ask them to add their photos there, and wait until they say they have. list_website_files then shows the saved paths, read_website_file shows you each photo with its width and height, and you build the pages around the real photos. If your app can hand the photos to a tool as files, save them with save_website_pictures instead and use the paths it returns. For a photo they do not have ready yet, keep a place: write <img src=\"photos/<name>.jpg\" alt=\"what belongs there\"> with width and height, sized in CSS with object-fit: cover so any photo fits. A place shows a soft placeholder, the person fills it later at the same link, where each place is listed by its alt, and the photo shows on the website the moment they add it, with nothing more for you to do. Never send a photo as base64, and never point an <img> at a picture that is neither saved nor a place under photos/. Before you say the website is ready, check it on a phone: send checkOnPhone true with your last save or edit (or run check_website_on_phone), and fix what it finds. Show the person the viewUrl, and in the same reply give them the photoLink if any place is waiting for a photo, without waiting to be asked. The keepUrl is where they can keep the website.",
      "tools": [
        {
          "name": "check_website_on_phone",
          "title": "Check a website on a phone",
          "description": "Opens a website's pages in a real browser at a phone's size (390 by 844, as an iPhone) and says, page by page, what a phone visitor would hit: sideways scrolling and what is too wide, pictures that do not load, text under 12px, links and buttons under 24px to tap, a missing or zoom-blocking viewport line, bars that cover the screen, and a main heading pushed below the first screen. Each page gets fine and findings in plain words. It changes nothing. Checks every page up to 5 (or the pages named), a few seconds each, up to 40 pages a day per website. With picture true it also returns a screenshot of the first page checked, for an app that can look at images. Fix what it finds with edit_website_file or save_website_files, then check those pages again. Fails with check_limit when the day's checks are used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "pages": {
                "description": "Optional: up to 5 saved pages to check, such as [\"index.html\", \"menu.html\"]. Leave it out to check every page, home page first, up to 5.",
                "items": {
                  "description": "A saved page such as index.html or about.html.",
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "picture": {
                "description": "true to also get a screenshot of the first page checked, as a phone shows it. Leave it out if your app cannot look at images.",
                "type": "boolean"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["websiteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a website on a phone"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
