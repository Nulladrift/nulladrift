        {
          "name": "edit_website_file",
          "title": "Edit a website file",
          "description": "Changes part of one saved page, stylesheet or script in place: each edit replaces its find text with its replace text, so a fix sends only the text it changes instead of the whole file. Copy find exactly from the file (read_website_file shows it); it must appear once, or set all to change every one. Edits apply in order, and if any fails nothing is saved. Every page is then checked against the rules, and it returns the same report as save_website_files with edited. Fails with not_in_file when a find text is not there, found_more_than_once when it is there several times, and not_text for a picture or font. To add a file or replace a whole one, use save_website_files.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkOnPhone": {
                "description": "true to also check every page on a phone once this is saved, in the same call, as check_website_on_phone does. Send it with your last change before you say the website is ready.",
                "type": "boolean"
              },
              "editKey": {
                "description": "The editKey start_website returned, which proves the website is the caller's. Leave it out for a website in the connected account.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "edits": {
                "description": "1 to 20 changes to the file, applied in order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "all": {
                      "description": "true to change every place find appears. Leave it out to change one, which must be the only one.",
                      "type": "boolean"
                    },
                    "find": {
                      "description": "The exact text to change, copied from the file, with enough around it to appear only once.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "replace": {
                      "description": "What the text becomes. Empty removes it.",
                      "type": "string"
                    }
                  },
                  "required": ["find", "replace"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "path": {
                "description": "The file's path from the website's root, exactly as it was saved, such as index.html, about.html or images/shop.jpg. list_website_files shows every path.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "websiteId": {
                "description": "The websiteId start_website returned, or one list_sites shows.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["edits", "path", "websiteId"],
            "type": "object"
          },
          "annotations": {
