        {
          "name": "request_contact",
          "title": "Request contact",
          "description": "Pass a company inquiry to Rinat. Delivered to his Telegram. Use when an agent acts on behalf of a company interested in working together.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "Company name",
                "type": "string"
              },
              "contact": {
                "description": "Email, phone, or Telegram handle of the requester",
                "minLength": 4,
                "type": "string"
              },
              "message": {
                "description": "What the company wants to discuss",
                "type": "string"
              },
              "name": {
                "description": "Contact person name",
                "type": "string"
              }
            },
            "required": ["contact"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e7de88d89b56545efe0f8125eda8bb4c5bf3946f5b7ebf0f9d64339054b87fd3"
        },
        {
          "name": "search_public_ai_pages",
          "title": "Search published AI manufacturing resources",
          "description": "Read-only, deterministic lookup of publicly available pages on rinatsultan.com. Results are website sources, not a generated answer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
