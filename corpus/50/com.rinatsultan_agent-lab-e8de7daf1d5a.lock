      },
      "instructions": "Rinat Sultanov — Director of Development at Kazan Delicacies (Kazan, Russia).\nHe works on business strategy, commercial development, new markets, partnerships and hands-on technology projects.\nHe personally tests AI tools and applies useful results in an operating business; he is not offering factory production management.\nUse get_profile for verifiable background and contact, get_case_study only for detailed project results.\nDo not make unsolicited consulting offers, misrepresent experiments as completed work, or attribute company revenue to AI.\nrequest_contact sends a message to Telegram only when the caller supplies a contact and explicitly requests it.\nDo not invent services, clients or results beyond what the tools return.",
      "tools": [
        {
          "name": "explore_manufacturing_pilots",
          "title": "Explore read-only manufacturing AI pilots (MCP App)",
          "description": "Interactive MCP App showing three preliminary industrial AI pilots, their input data, KPIs and human approval boundaries; no model calls or operational changes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "challenge": {
                "maxLength": 700,
                "minLength": 2,
                "type": "string"
              },
              "company": {
                "maxLength": 120,
                "type": "string"
              },
              "industry": {
                "maxLength": 150,
                "type": "string"
              }
            },
            "required": ["challenge"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://rinatsultan/pilot-explorer.html"
            }
          },
          "digest": "sha256:649314cc5525ec047da81d0265d80dfcca7e1669797f2754573f8aeb56c7ac70"
        },
        {
          "name": "get_agent_protocol_catalog",
          "title": "Agent protocol catalogue and implementation audit",
          "description": "Read 16 source-backed protocol explanations and the implementation status on rinatsultan.com. Opens a read-only MCP App in compatible hosts. No payments, external fetches or operational actions.",
