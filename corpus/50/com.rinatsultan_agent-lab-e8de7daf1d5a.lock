        },
        {
          "name": "simulate_production_plan",
          "title": "Учебный план выпуска: заказы, партии и ограничения",
          "description": "Synthetic read-only single-line production scenario. Reconciles demand, FEFO-eligible stock, 50 kg batches, raw input and shift minutes; explains unmet demand. Not a real factory plan, forecast or authorization.",
