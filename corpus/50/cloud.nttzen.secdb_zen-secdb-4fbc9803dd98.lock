        {
          "name": "cvss_explain",
          "description": "Calculate the score of any CVSS vector string and explain it in natural language.\n\n## What this tool does\nTakes a CVSS vector string, not tied to a specific CVE, and returns its version, base score, severity, and a\nhuman-readable explanation.\n\n## When to use this tool\nUse this tool when the user:\n- provides a CVSS vector and asks what it means\n- wants to see how the score changes when a metric changes\n- has adjusted a vector for their own environment\n\nFor the official CVSS of a CVE, use `vulnerability_score`.\n\n## Inputs\n- **vector_string**: CVSS vector string, e.g. `CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H`.\n\n## Outputs\n- `cvss_version`\n- `cvss_base_score`\n- `cvss_base_severity`\n- `cvss_vector_string`\n- `cvss_explain`: human-readable explanation of the vector\n\n## LLM usage guidelines\n- Never calculate CVSS scores by hand: use this tool.\n",
          "inputSchema": {
            "properties": {
              "vector_string": {
                "description": "CVSS vector string",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["vector_string"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cvss_base_score": {
