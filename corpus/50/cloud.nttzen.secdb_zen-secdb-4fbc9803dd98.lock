        {
          "name": "vulnerability_info",
          "description": "Get detailed information about a specific CVE.\n\n## What this tool does\nRetrieves the full vulnerability record for a CVE from SecDB, including:\n- official description and summary\n- CVSS metrics (all versions available)\n- current EPSS score and percentile (if present)\n- CISA KEV details (if listed)\n- affected products\n- vendor/security advisories\n- weakness classification (CWE)\n- number of known Metasploit modules and Exploit-DB entries\n\n## When to use this tool\nUse this tool when the user asks:\n- \"Give me details about CVE-XYZ.\"\n- \"Which products are affected by this vulnerability?\"\n- \"Show me advisories or references for this CVE.\"\n- \"Explain what this vulnerability is and how serious it is.\"\n\nThis tool is ideal for **deep inspection of a single vulnerability**.\nFor multiple CVEs, call the tool once per CVE.\n\n## Inputs\n- **cve_id**: valid CVE identifier (`CVE-YYYY-NNNNN`).\n\n## Outputs\n- **cve_id**, **url**, **title**, **description**, **cna**, **status**, **published**, **modified**, **aliases**\n- **cwe**: each with `id`, `name`, and `url`\n- **cvss**: one entry for each CVSS version available, with `version`, `score`, `severity`, and `vector`\n- **epss**: `score` and `percentile` (both as percentages) and `date`, or `null`\n- **exploits**: number of known `metasploit` modules and `exploitdb` entries\n- **kev**: `listed`, `in_cisa`, `in_eu`, `date` (first listing), `ransomware`, and `cisa` (`vendor`, `product`, `description`, `required_action`, `notes`, `added_date`, `due_date`, or `null`)\n- **affected_products**: each with `vendor`, `product`, `part`, `title`, and `url`, without versions\n- **advisories**: each with `id`, `source`, `severity`, and `url`. Use `advisory_info` for the details of an advisory\n\n## LLM usage guidelines\n- Always prefer this tool when the user needs factual information about a specific CVE.\n- If multiple CVEs are mentioned, call the tool once per CVE.\n- Combine with:\n  - **`vulnerability_score`** - to get the CVSS vector explained in natural language\n  - **`vulnerability_exploits`** - to list the known exploits and PoCs\n  - **`vulnerability_history`** - to get the timeline of events\n  - **`vulnerability_attack`** - to get the CAPEC attack patterns and ATT&CK techniques related to the weaknesses\n  - **`sightings_search`** - to check real-world exploitation, PoCs, plugins, advisories\n  - **`ssvc_calculator`** - to compute prioritization based on the vulnerability data\n- Do not hallucinate product lists, advisories, or details—use what the tool returns.\n",
