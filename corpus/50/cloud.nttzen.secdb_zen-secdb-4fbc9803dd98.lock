        {
          "name": "attack_info",
          "description": "Get information about a MITRE ATT&CK technique and the weaknesses and vulnerabilities linked to it through CAPEC.\n\n## What this tool does\nReturns the name, description, tactics and platforms of an ATT&CK technique (Enterprise, Mobile or ICS), its parent\ntechnique or sub-techniques, the CAPEC attack patterns mapped to it, the weaknesses (CWE) exploited by those attack\npatterns, and the number of CVEs with those weaknesses. A parent technique also includes what is mapped to its\nsub-techniques.\n\n## When to use this tool\nUse this tool when the user asks:\n- \"What is T1574?\"\n- \"Which weaknesses or attack patterns are related to this technique?\"\n- \"How many vulnerabilities could be linked to this technique?\"\n\n## Inputs\n- **technique_id**: ATT&CK technique identifier (`T1574`, `T1574.010`, `1574.010` or `T1574/010`).\n\n## Outputs\n- `id`, `name` (with the parent technique name for a sub-technique), `domain`, `description`\n- `tactics`: each with `id` and `name`\n- `platforms`: list of platforms\n- `parent_id`, `subtechniques` (each with `id` and `name`)\n- `deprecated`, `revoked`, `revoked_by` (the technique that replaces a revoked one)\n- `capec`: attack patterns, each with `id`, `name`, `direct` and `via`\n- `weaknesses`: CWE, each with `id`, `name`, `direct` and `via`\n- `cve_count`: number of CVEs with these weaknesses\n- `url`: link to the technique on SecDB, `mitre_url`: link to the technique on attack.mitre.org\n\n## LLM usage guidelines\n- `direct` is `true` when CAPEC maps the attack pattern to this technique; `via` lists the sub-techniques it comes from.\n- The link to CVEs is derived from the weaknesses: a CVE in `cve_count` is not known to be exploited with this technique. Say so when you report it.\n- If `revoked` is `true` and `revoked_by` is set, call this tool again with `revoked_by` for the current technique.\n- For the CVEs themselves, search on SecDB from `url` (Vulnerabilities tab), or use `cwe_info` and `vulnerability_search` with the weaknesses.\n",
          "inputSchema": {
            "properties": {
              "technique_id": {
                "description": "ATT&CK technique identifier (T1574, T1574.010, 1574.010 or T1574/010)",
                "pattern": "^[Tt]?[0-9]{4}([./][0-9]{3})?$",
                "type": "string"
              }
            },
            "required": ["technique_id"],
            "type": "object"
          },
          "outputSchema": {
