        {
          "name": "vulnerability_history",
          "description": "Get the timeline of events for a specific CVE.\n\n## What this tool does\nReturns the dated events known to SecDB for a CVE, most recent first:\n- **published**: publication of the CVE\n- **nvd**: NVD changes (CVSS, CPE, CWE, references, description)\n- **advisory**: security advisories that mention the CVE\n- **nasl**: NASL detection plugins that cover the CVE\n- **cisa-kev**, **eu-kev**: addition to a Known Exploited Vulnerabilities catalog\n- **poc**: public proof-of-concept repositories on GitHub\n- **exploitdb**: Exploit-DB entries\n- **alias**: public disclosure under a known name\n\nEvery event carries the date of the event itself, not the date it reached SecDB. Sources without a date are not included. EPSS changes are not included: use `epss_timeseries`.\n\n## When to use this tool\nUse this tool when the user asks:\n- \"What changed on CVE-XYZ since last week?\"\n- \"When was this CVE added to KEV?\"\n- \"When did the first PoC or detection plugin appear?\"\n\nFor the current state of a CVE, use `vulnerability_info`.\n\n## Inputs\n- **cve_id**: valid CVE identifier (`CVE-YYYY-NNNNN`).\n- **types**: only return these event types (default: all).\n- **since**: only return events from this date, included (`YYYY-MM-DD`).\n\n## Outputs\n- **cve_id**: CVE identifier.\n- **returned**: number of events returned.\n- **counts**: number of events for each type. It follows `since` but not `types`, so it also shows what `types` left out.\n- **events**: each with `type`, `timestamp`, and `change`. The fields of `change` depend on the type:\n  - **published**: none\n  - **nvd**: `source`, `event`, `action`, `type`, `old`, `new`\n  - **advisory**: `advisory_type`, `advisory_id`, `advisory_severity`, `advisory_title`\n  - **nasl**: `plugin_id`, `plugin_vendor`, `plugin_name`\n  - **cisa-kev**: `vulnerability_name`, `due_date`\n  - **eu-kev**: `vulnerability_name`, `patched_since`\n  - **poc**: `name`, `description`, `url`\n  - **exploitdb**: `id`, `description`, `file`\n  - **alias**: `alias`\n\n## LLM usage guidelines\n- The response is not paginated and can be very large for well-known CVEs, mostly because of `poc` and `nasl` events: use `types` and `since` to request only what you need.\n- An event dated before `since` can still be new to SecDB: do not use this tool to prove that nothing changed.\n- Do not guess dates or events: use what the tool returns.\n",
          "inputSchema": {
            "properties": {
              "cve_id": {
                "description": "CVE identification (CVE-YYYY-NNNNN)",
                "pattern": "^[Cc][Vv][Ee]-[0-9]{4}-[0-9]{4,}$",
                "type": "string"
              },
              "since": {
                "description": "Only events from this date, included (YYYY-MM-DD)",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "types": {
                "description": "Event types to return (default: all)",
                "items": {
                  "enum": ["published", "nvd", "advisory", "nasl", "cisa-kev", "eu-kev", "poc", "exploitdb", "alias"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["cve_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "counts": {
                "additionalProperties": {
                  "type": "integer"
                },
                "description": "Events for each type",
                "type": "object"
              },
              "cve_id": {
                "description": "CVE identification",
                "type": "string"
              },
              "events": {
                "description": "Events, most recent first",
                "items": {
                  "properties": {
                    "change": {
                      "description": "Details of the event, depending on its type",
                      "type": "object"
                    },
                    "timestamp": {
                      "description": "Date of the event",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["published", "nvd", "advisory", "nasl", "cisa-kev", "eu-kev", "poc", "exploitdb", "alias"],
                      "type": "string"
                    }
                  },
                  "required": ["change", "timestamp", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "description": "Events returned",
                "type": "integer"
              }
            },
            "required": ["counts", "cve_id", "events", "returned"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CVE history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfc991d97e1b5a803c9c59c90ea45dfd539ef9646a9c851cfde46e4b11beefc3"
