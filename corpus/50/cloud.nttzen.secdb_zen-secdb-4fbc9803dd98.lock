        {
          "name": "epss_timeseries",
          "description": "Get the historical EPSS time series for a specific CVE.\n\n## What this tool does\nReturns the historical EPSS score, percentile, and model version available for a CVE across time, ordered by date.\nUseful for analyzing how exploitability likelihood has evolved over time.\n\n## When to use this tool\nUse this tool when the user asks about:\n- EPSS trend over time\n- how exploitability probability changed\n- whether EPSS spiked or dropped\n- historical comparison of risk\n\nIf the user only wants the current EPSS score, use `vulnerability_score` instead.\n\n## Inputs\n- **cve_id**: valid CVE identifier (`CVE-YYYY-NNNNN`).\n- **days**: optional number of days of history to return, counting back from today (default 365, maximum 3650).\n\n## Outputs\n- **series**: array of objects, each containing:\n  - `date`: measurement date in ISO format\n  - `score`: EPSS score, as a percentage (`94.36` means 94.36%)\n  - `percentile`: EPSS percentile, as a percentage\n  - `model`: EPSS model version\n\n## LLM usage guidelines\n- Never guess EPSS values-use this tool for all EPSS time-series questions.\n- If `cve_id` is malformed or incomplete, ask the user to correct it before calling.\n- If the user mentions multiple CVEs, call the tool once per CVE as needed.\n- Request a longer `days` window only when the user needs it: a full history is very large.\n- If no historical data is available, the tool returns an empty series: state that no EPSS history was found.\n",
          "inputSchema": {
            "properties": {
              "cve_id": {
                "description": "CVE identification (CVE-YYYY-NNNNN)",
                "pattern": "^[Cc][Vv][Ee]-[0-9]{4}-[0-9]{4,}$",
                "type": "string"
              },
              "days": {
                "default": 365,
                "description": "Days of history to return, counting back from today",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
