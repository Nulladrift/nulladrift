        {
          "name": "cwe_info",
          "description": "Get information about a specific weakness (CWE), its related attack patterns (CAPEC) and ATT&CK techniques.\n\n## What this tool does\nReturns the name and description of a CWE, its type, the related CAPEC attack patterns, the ATT&CK techniques mapped\nto those attack patterns, and the number of CVEs\nlinked to it, with how many of them are in the CISA KEV and EU KEV catalogs.\n\n## When to use this tool\nUse this tool when the user asks:\n- \"What is CWE-79?\"\n- \"Which attack patterns are related to this weakness?\"\n- \"Which ATT&CK techniques are related to this weakness?\"\n- \"How often is this weakness exploited in the wild?\"\n\n## Inputs\n- **cwe_id**: CWE identifier (`CWE-79` or `79`).\n\n## Outputs\n- `id`, `name`, `type`, `description`\n- `capec`: related attack patterns, each with `id` and `name`\n- `attack`: ATT&CK techniques mapped to these attack patterns (active techniques only), each with `id`, `name` and\n  `via` (the CAPEC it comes from)\n- `cve_count`: number of CVEs linked to this CWE\n- `cisa_kev_count`: how many of these CVEs are in the CISA KEV catalog\n- `eu_kev_count`: how many of these CVEs are in the EU KEV catalog\n- `kev_count`: how many of these CVEs are in at least one of the two catalogs\n- `url`: link to the CWE on SecDB\n\n## LLM usage guidelines\n- Do not explain a CWE from memory when the user needs the official definition: use this tool.\n- Do not add `cisa_kev_count` and `eu_kev_count`: a CVE can be in both catalogs. Use `kev_count` for the total.\n- Use `attack_info` for the details of an ATT&CK technique.\n",
          "inputSchema": {
            "properties": {
              "cwe_id": {
                "description": "CWE identifier (CWE-79 or 79)",
                "pattern": "^([Cc][Ww][Ee]-)?[0-9]+$",
                "type": "string"
              }
            },
            "required": ["cwe_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attack": {
                "items": {
                  "properties": {
                    "id": {
                      "description": "ATT&CK technique identifier",
                      "type": "string"
                    },
                    "name": {
                      "description": "Technique name",
                      "type": "string"
                    },
                    "via": {
                      "description": "CAPEC it comes from",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "capec": {
                "items": {
                  "properties": {
                    "id": {
                      "description": "CAPEC identifier",
                      "type": "string"
                    },
                    "name": {
                      "description": "Attack pattern name",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "cisa_kev_count": {
