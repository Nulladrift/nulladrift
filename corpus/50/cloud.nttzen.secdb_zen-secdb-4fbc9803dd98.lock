        {
          "name": "kev_check",
          "description": "Check whether one or more CVEs are listed in the CISA KEV or EU KEV catalogs of known exploited vulnerabilities.\n\n## What this tool does\nFor each CVE, returns whether it is in a KEV catalog and, if so, the dates, the known use in ransomware campaigns,\nand the threat actors reported by the EU catalog.\n\n## When to use this tool\nUse this tool when the user asks:\n- \"Is this CVE in CISA KEV?\"\n- \"Which of these CVEs are known to be exploited?\"\n- to prioritize a list of CVEs\n\nFor a single CVE, this is lighter than `vulnerability_info`. To find the entries of a catalog by date, vendor, or product, use `kev_list`.\n\n## Inputs\n- **cve_ids**: list of CVE identifiers (`CVE-YYYY-NNNNN`), up to 100.\n\n## Outputs\n- **results**: one object for each CVE, containing:\n  - `cve_id`\n  - `in_kev`: whether the CVE is in at least one KEV catalog\n  - when `in_kev` is true: `in_cisa`, `in_eu`, `vendor`, `product`, `vulnerability_name`, `ransomware`, `cisa_added_date`, `cisa_due_date`, `eu_reported_date`, `euvd_id`, `eu_exploitation_type`, `eu_threat_actors_exploiting`\n\n## LLM usage guidelines\n- Send all the CVEs in one call instead of calling the tool once per CVE.\n- `in_kev: false` means that the CVE is not in these catalogs, not that it is not exploited: use `sightings_search` for other evidence.\n- `in_kev: false` does not confirm that the CVE exists: use `vulnerability_score` or `vulnerability_info` to check it.\n",
          "inputSchema": {
            "properties": {
              "cve_ids": {
                "description": "CVE identifiers (CVE-YYYY-NNNNN)",
                "items": {
                  "pattern": "^[Cc][Vv][Ee]-[0-9]{4}-[0-9]{4,}$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["cve_ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "cve_id": {
                      "description": "CVE identifier",
                      "type": "string"
                    },
                    "in_kev": {
                      "description": "Whether the CVE is in at least one KEV catalog",
                      "type": "boolean"
                    }
                  },
                  "required": ["cve_id", "in_kev"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check KEV catalogs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
