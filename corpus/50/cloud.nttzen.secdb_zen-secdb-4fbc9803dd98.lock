        {
          "name": "kev_list",
          "description": "List the entries of the CISA KEV and EU KEV catalogs of known exploited vulnerabilities, most recent first.\n\n## What this tool does\nReturns the CVEs in the catalogs, filtered by listing date, catalog, vendor, product, and known use in ransomware campaigns.\n\n## When to use this tool\nUse this tool when the user asks:\n- \"What was added to KEV this week?\"\n- \"Which Fortinet vulnerabilities are known to be exploited?\"\n- \"Which KEV entries are used in ransomware campaigns?\"\n\nTo check CVEs that you already know, use `kev_check`.\n\n## Inputs\n- **since**: only return entries listed since then: a period (`P7D`, `P1W`, `P3M`, `P1Y`) or a date (`2026-10-01`, included).\n- **catalog**: `cisa` or `eu` (default: both). It also selects the date used by `since` and by the order of the results.\n- **vendor**: part of the vendor name, for example `fortinet`.\n- **product**: part of the product name, for example `fortios`.\n- **ransomware**: `true` to only return entries with known use in ransomware campaigns, `false` for the others.\n- **limit**: maximum number of entries to return (default 25, maximum 100).\n- **page**: page of results to return (default 1).\n\n## Outputs\n- **total_results**, **total_pages**, **current_page**\n- **entries**: each with `cve_id`, `in_cisa`, `in_eu`, `vendor`, `product`, `vulnerability_name`, `ransomware`, `first_listed_date`, `first_listed_by`, `cisa_added_date`, `cisa_due_date`, `eu_reported_date`\n\n## LLM usage guidelines\n- Without `catalog`, `since` uses `first_listed_date`: a CVE already in CISA KEV that has just been added to EU KEV does not appear. To see the recent entries of a catalog, set `catalog`.\n- When `total_results` is greater than the returned entries, say so before drawing conclusions.\n- An empty list does not mean that nothing is exploited: the catalogs only contain confirmed cases. Use `sightings_search` for other evidence.\n- For the score of the CVEs, use `vulnerability_score`.\n",
          "inputSchema": {
            "properties": {
              "catalog": {
                "description": "Catalog (default: both)",
                "enum": ["cisa", "eu"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Maximum entries",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page of results",
                "minimum": 1,
                "type": "integer"
              },
              "product": {
                "description": "Part of the product name",
                "minLength": 1,
                "type": "string"
              },
              "ransomware": {
                "description": "Filter by known use in ransomware campaigns",
                "type": "boolean"
              },
              "since": {
                "description": "Only entries listed since then: a period (P7D, P1W, P3M, P1Y) or a date (YYYY-MM-DD)",
                "pattern": "^(P[0-9]+[DWMY]|[0-9]{4}-[0-9]{2}-[0-9]{2})$",
                "type": "string"
              },
              "vendor": {
                "description": "Part of the vendor name",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "current_page": {
                "description": "Page returned",
                "type": "integer"
              },
              "entries": {
                "description": "Entries, most recent first",
                "items": {
                  "properties": {
                    "cisa_added_date": {
                      "description": "Addition to CISA KEV",
                      "type": ["string", "null"]
                    },
                    "cisa_due_date": {
                      "description": "CISA remediation due date",
                      "type": ["string", "null"]
                    },
                    "cve_id": {
                      "description": "CVE identifier",
                      "type": "string"
                    },
                    "eu_reported_date": {
                      "description": "Report in EU KEV",
                      "type": ["string", "null"]
                    },
                    "first_listed_by": {
                      "description": "cisa, eu, or both",
                      "type": ["string", "null"]
                    },
                    "first_listed_date": {
                      "description": "First listing in a catalog",
                      "type": ["string", "null"]
                    },
                    "in_cisa": {
                      "description": "In the CISA KEV catalog",
                      "type": "boolean"
                    },
                    "in_eu": {
                      "description": "In the EU KEV catalog",
                      "type": "boolean"
                    },
                    "product": {
                      "description": "Product",
                      "type": ["string", "null"]
                    },
                    "ransomware": {
                      "description": "Known use in ransomware campaigns",
                      "type": "boolean"
                    },
                    "vendor": {
                      "description": "Vendor",
                      "type": ["string", "null"]
                    },
                    "vulnerability_name": {
                      "description": "Vulnerability name",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["cve_id", "in_cisa", "in_eu", "ransomware"],
                  "type": "object"
                },
                "type": "array"
              },
              "total_pages": {
                "description": "Pages of results",
                "type": "integer"
              },
              "total_results": {
                "description": "Entries matching the filters",
