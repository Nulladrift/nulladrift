        {
          "name": "vulnerability_score",
          "description": "Get CVSS and current EPSS score for one CVE, or for a list of CVEs in a single call.\n\n## What this tool does\nReturns a full risk snapshot for a CVE, including:\n- CVSS version\n- CVSS base score\n- CVSS severity\n- CVSS vector string\n- human-readable explanation of the CVSS vector\n- current EPSS score\n\nThe field **`cvss_explain`** provides a natural-language interpretation of the CVSS vector (attack conditions, privileges, user interaction, impact breakdown).\n\nExample:\nFor `CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H`, the explanation may read:\n*\"The vulnerability can be exploited remotely over the network with low complexity,\nwithout authentication and without user interaction. Exploitation may lead to high\nimpact on confidentiality, high impact on integrity, and high impact on availability.\"*\n\n## When to use this tool\nUse this tool when the user asks:\n- \"What is the CVSS/EPSS of this CVE?\"\n- \"Explain the CVSS vector of this vulnerability.\"\n- \"What is the severity and why?\"\n- \"Give me the risk profile for this CVE.\"\n\nFor EPSS historical trends, use `epss_timeseries`.\n\n## Inputs\nSend one of these:\n- **cve_id**: valid CVE identifier (`CVE-YYYY-NNNNN`).\n- **cve_ids**: list of up to 100 CVE identifiers.\n\n## Outputs\nWith `cve_ids`:\n- `results`: one item for each CVE found, with `cve_id` and the fields below except `cvss_explain`\n- `not_found`: the CVEs that SecDB does not know\n\nWith `cve_id`:\n- `cvss_version`\n- `cvss_base_score`\n- `cvss_base_severity`\n- `cvss_vector_string`\n- `cvss_explain` - human-readable explanation of the CVSS vector\n- `epss_score` - as a percentage (`94.36` means 94.36%)\n\nAny of these fields is `null` when SecDB has no such data for the CVE (for example a CVE not yet analyzed or scored).\n\n## LLM usage guidelines\n- Never guess CVSS or EPSS values—always call this tool.\n- If a field is `null`, say that the value is not available.\n- Use the `cvss_explain` field directly when the user wants an interpretation of the vector string.\n- If multiple CVEs are referenced, send them all in `cve_ids`. To explain a vector from the results, use `cvss_explain`.\n- Combine this tool with `sightings_search` or `ssvc_calculator` for more complete risk assessments.\n",
          "inputSchema": {
            "properties": {
              "cve_id": {
                "description": "CVE identification (CVE-YYYY-NNNNN)",
                "pattern": "^[Cc][Vv][Ee]-[0-9]{4}-[0-9]{4,}$",
                "type": "string"
              },
              "cve_ids": {
                "description": "CVE identifiers, to get the scores of many CVEs in one call",
                "items": {
                  "pattern": "^[Cc][Vv][Ee]-[0-9]{4}-[0-9]{4,}$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cvss_base_score": {
                "description": "CVSS base score",
                "type": ["string", "null"]
              },
              "cvss_base_severity": {
                "description": "CVSS base severity",
                "type": ["string", "null"]
              },
              "cvss_explain": {
                "description": "Explain CVSS",
                "type": ["string", "null"]
              },
              "cvss_vector_string": {
                "description": "CVSS vector string",
                "type": ["string", "null"]
              },
              "cvss_version": {
                "description": "CVSS version",
                "type": ["string", "null"]
              },
              "epss_score": {
                "description": "EPSS score (%)",
                "type": ["string", "null"]
              },
              "not_found": {
