        {
          "name": "cpe_search",
          "description": "Find the CPE vendor and product names that SecDB uses for a product, with the number of CVEs of each one.\n\n## What this tool does\nSearches the vendor and product names in the CPE configurations of the CVEs, marked as vulnerable. Every result can be passed to `product_vulnerabilities`. Results go from the most to the least CVEs.\n\n## When to use this tool\nUse this tool when the user asks:\n- \"What is the CPE name of Apache HTTP Server?\"\n- \"Which Fortinet products have known CVEs?\"\n\nUse it before `product_vulnerabilities` when the exact names are not known. For open source dependencies, use `purl_audit`.\n\n## Inputs\n- **query**: words to search in the vendor and product names, for example `apache http server`. Every word must match the vendor or the product.\n- **vendor**: exact CPE vendor name, to search only its products.\n- **part**: `a` (application), `o` (operating system), or `h` (hardware).\n- **limit**: maximum number of results to return (default 25, maximum 100).\n- **page**: page of results to return (default 1).\n\n## Outputs\n- **total_results**, **total_pages**, **current_page**\n- **results**: each with `vendor`, `product`, `parts`, `cve_count`\n- **note**: present when nothing matches\n\n## LLM usage guidelines\n- When several products match, show them to the user or use the closest one and say which one you chose. Do not merge them.\n- `cve_count` shows how many CVEs have the name, not how relevant it is.\n- No result does not mean that the product has no CVEs: try fewer or different words, or `vulnerability_search`.\n",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "Maximum results",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page of results",
                "minimum": 1,
                "type": "integer"
              },
              "part": {
                "description": "a, o, or h",
                "enum": ["a", "o", "h"],
                "type": "string"
              },
              "query": {
                "description": "Words to search in vendor and product names",
                "minLength": 2,
                "type": "string"
              },
              "vendor": {
                "description": "Exact CPE vendor name",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "current_page": {
                "description": "Page returned",
                "type": "integer"
              },
              "note": {
                "description": "Present when nothing matches",
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "cve_count": {
                      "description": "CVEs with this name, marked as vulnerable",
                      "type": "integer"
                    },
                    "parts": {
                      "description": "CPE parts",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "product": {
                      "description": "CPE product name",
                      "type": "string"
                    },
                    "vendor": {
                      "description": "CPE vendor name",
                      "type": "string"
                    }
                  },
                  "required": ["cve_count", "parts", "product", "vendor"],
                  "type": "object"
                },
                "type": "array"
              },
              "total_pages": {
                "description": "Pages of results",
                "type": "integer"
              },
              "total_results": {
                "description": "Vendor and product names found",
                "type": "integer"
              }
            },
            "required": ["current_page", "results", "total_pages", "total_results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search CPE names"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
