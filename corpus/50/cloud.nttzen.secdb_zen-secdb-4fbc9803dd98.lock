                    "percentile": {
                      "description": "Percentile (%)",
                      "type": ["string", "null"]
                    },
                    "score": {
                      "description": "Score (%)",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
