        {
          "name": "package_info",
          "description": "List the security advisories known for a package, with the affected and fixed versions.\n\n## What this tool does\nReturns the advisories of a package across all its versions, most recent first. This covers more ecosystems than `purl_audit`, for example `github`, `cpan`, `apache`, and `freebsd`.\n\n## When to use this tool\nUse this tool when the user asks:\n- \"Which vulnerabilities has this package had?\"\n- \"Which version fixes this vulnerability?\"\n- \"Which version should I upgrade to?\"\n\nTo check whether a specific version is vulnerable, use `purl_audit` or `linux_audit`: this tool does not evaluate versions.\n\n## Inputs\n- **purl**: Package URL. The version is ignored. For Linux packages, add the `distro` qualifier to limit the results to one release, for example `pkg:deb/ubuntu/curl?distro=noble`.\n- **limit**: maximum number of advisories to return (default 25, maximum 100).\n- **page**: page of results to return (default 1).\n\n## Outputs\n- **total_results**, **total_pages**, **current_page**: advisories for the package across all pages\n- **advisories**: each with `advisory_id`, `title`, `severity`, `published`, `cves`, `status`, `affected`, `fixed_versions`\n  - **affected**: version ranges, each with `versions` and, for Linux packages, `distro`\n  - **fixed_versions**: each with `version` and, for Linux packages, `distro`. A version is either reported as fixed by the advisory or the exclusive upper bound of an affected range\n\n## LLM usage guidelines\n- When `total_results` is 0, say that SecDB has no advisories for this package name, not that the package is safe. Names must match exactly.\n- To recommend an upgrade, consider all the advisories and check the resulting version with `purl_audit` when its ecosystem is supported.\n- `status` can include `malicious`: tell the user to remove the package instead of upgrading it.\n- If `fixed_versions` is empty, say that no fix is known. Do not guess a version.\n",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "Maximum advisories",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page of results",
                "minimum": 1,
                "type": "integer"
              },
              "purl": {
                "description": "Package URL (PURL)",
                "pattern": "^pkg:",
                "type": "string"
              }
            },
            "required": ["purl"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "advisories": {
                "description": "Advisories, with the affected and fixed versions",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "current_page": {
                "description": "Page returned",
                "type": "integer"
              },
              "total_pages": {
                "description": "Pages of results",
                "type": "integer"
              },
              "total_results": {
                "description": "Total advisories for the package",
                "type": "integer"
              }
            },
            "required": ["advisories", "current_page", "total_pages", "total_results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Package advisories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1db195b5109c2da3564d6a8586951c340d90ffb9daa0569ec1e39f2be5f62d74"
        },
        {
          "name": "product_vulnerabilities",
          "description": "List the CVEs of a product by its CPE vendor and product names, with the affected version ranges.\n\n## What this tool does\nReturns the CVEs whose CPE configuration marks the product as vulnerable, most recent first. Use it for assets that have no Package URL, such as appliances, operating systems, and commercial software.\n\n## When to use this tool\nUse this tool when the user asks:\n- \"Which CVEs affect FortiOS?\"\n- \"What are the latest vulnerabilities of this product?\"\n- \"Is this product version affected by a known CVE?\"\n\nFor open source dependencies, use `purl_audit`. If the CPE names are not known, use `cpe_search` first.\n\n## Inputs\n- **vendor**: CPE vendor name, for example `fortinet`.\n- **product**: CPE product name, for example `fortios`.\n- **limit**: maximum number of CVEs to return (default 25, maximum 100).\n- **page**: page of results to return (default 1).\n\n## Outputs\n- **total_results**, **total_pages**, **current_page**: CVEs for the product across all pages\n- **cves**: each with `cve_id`, `published`, `severity`, `score`, `description`, `affected_versions`\n- **note**: present when no CVE matches\n\n## LLM usage guidelines\n- This tool does not filter by version: compare the user's version with `affected_versions`, and say that the comparison is yours. An entry of `all` means that the configuration has no version limits.\n- When `total_results` is greater than the returned CVEs, say so before drawing conclusions about a version.\n- When `total_results` is 0, do not say that the product is safe: the vendor or product name may differ from the CPE one. Use `cpe_search` to find it.\n",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "Maximum CVEs",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page of results",
                "minimum": 1,
                "type": "integer"
              },
              "product": {
                "description": "CPE product name",
                "minLength": 1,
                "type": "string"
              },
              "vendor": {
                "description": "CPE vendor name",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product", "vendor"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "current_page": {
                "description": "Page returned",
                "type": "integer"
              },
              "cves": {
                "description": "CVEs with the affected versions",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "Present when no CVE matches",
                "type": "string"
              },
              "total_pages": {
                "description": "Pages of results",
                "type": "integer"
              },
              "total_results": {
                "description": "Total CVEs for the product",
                "type": "integer"
              }
            },
            "required": ["current_page", "cves", "total_pages", "total_results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
