        {
          "name": "vulnerability_exploits",
          "description": "List the known exploits, proofs of concept, and detection templates for a specific CVE.\n\n## What this tool does\nReturns the exploit maturity of a CVE and the related public material known to SecDB:\n- Metasploit modules\n- Exploit-DB entries\n- Nuclei templates\n- proofs of concept published on GitHub\n\n## When to use this tool\nUse this tool when the user asks:\n- \"Is there a public exploit for this CVE?\"\n- \"Is there a Metasploit module or a Nuclei template for this vulnerability?\"\n- \"How mature is the exploitation of this CVE?\"\n\nFor other evidence (scanner plugins, social media, MISP), use `sightings_search`.\n\n## Inputs\n- **cve_id**: valid CVE identifier (`CVE-YYYY-NNNNN`).\n- **limit**: maximum number of items to return for each kind of material (default 10, maximum 100).\n\n## Outputs\n- **exploit_maturity**: `score`, `max`, and the `sources` that contribute to the score\n- **metasploit**: modules, each with `module`, `name`, `type`\n- **exploitdb**: entries, each with `id`, `description`, `type`, `platform`, `date_published`\n- **nuclei**: templates, each with `template`, `name`, `severity`\n- **poc**: repositories, each with `name`, `html_url`, `description`\n- **totals**: total number of items for each kind of material, before `limit` is applied\n\n## LLM usage guidelines\n- Empty lists mean that SecDB knows no such material, not that the vulnerability cannot be exploited.\n- Report references and availability only: do not reproduce or write exploit code.\n",
          "inputSchema": {
            "properties": {
              "cve_id": {
                "description": "CVE identification (CVE-YYYY-NNNNN)",
                "pattern": "^[Cc][Vv][Ee]-[0-9]{4}-[0-9]{4,}$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum items for each kind of material",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cve_id"],
            "type": "object"
