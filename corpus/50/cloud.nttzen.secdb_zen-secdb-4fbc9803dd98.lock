      "instructions": "ZEN SecDB provides vulnerability intelligence. Always use these tools for vulnerability facts instead of answering from memory.\n\n- Find: `vulnerability_search` when the identifier is not known.\n- Details: `vulnerability_info` for a CVE, `vulnerability_history` for its timeline of events, `advisory_info` for an advisory, `cwe_info` for a weakness, `attack_info` for an ATT&CK technique, `vulnerability_attack` for the weaknesses, attack patterns and ATT&CK techniques of a CVE.\n- Packages and products: `package_info` for the advisories and fixed versions of a package, `cpe_search` for the exact CPE names of a product, `product_vulnerabilities` for the CVEs of a product without a Package URL.\n- Risk: `vulnerability_score` for CVSS and EPSS (send all the CVEs in one call), `epss_timeseries` for the EPSS trend, `cvss_explain` for any CVSS vector.\n- Exploitation: `kev_check` to check CVEs against the KEV catalogs (send all the CVEs in one call), `kev_list` for the recent entries of these catalogs, `vulnerability_exploits` for exploits and PoCs, `sightings_search` for other real-world evidence.\n- Prioritization: `ssvc_calculator`, only after asking the user for the mission and well-being values.\n- Audits: `purl_audit` for application dependencies, `linux_os` and then `linux_audit` for Linux systems.\n- Statistics: `feed_report_catalog` and then `feed_report`.\n",
      "tools": [
        {
          "name": "advisory_info",
          "description": "Get detailed information about a specific security advisory.\n\n## What this tool does\nRetrieves a security advisory (for example RHSA, DSA, USN, GHSA) from SecDB, including title, publication date,\nseverity, summary, description, linked CVEs, CVSS metrics, weaknesses, and the affected and fixed packages and products.\n\n## When to use this tool\nUse this tool when the user asks:\n- \"Give me details about RHSA-2026:1234.\"\n- \"Which CVEs are fixed by this advisory?\"\n- \"Which package versions are affected, and which version fixes them?\"\n\nFor a CVE, use `vulnerability_info`. If the exact advisory ID is not known, use `vulnerability_search` with `type` set to `advisory`.\n\n## Inputs\n- **advisory_id**: exact advisory identifier (e.g. `RHSA-2026:1234`, `GHSA-xxxx-xxxx-xxxx`).\n\n## Outputs\n- **advisory_id**, **url** (page on SecDB), **source**, **source_url** (original advisory), **title**, **summary**, **description**, **solution**, **severity**, **published**, **modified**, **rights**\n- **cves**: identifiers of the linked CVEs. Use `vulnerability_info`, `vulnerability_score`, or `kev_check` for their details\n- **cvss**: each with `cve_id`, `version`, `score`, `severity`, and `vector`. An entry with a null `cve_id` refers to the whole advisory; the others refer to that CVE\n- **cwe**: each with `id`, `name`, and `url`\n- **packages**: each with `purl`, `status` (for example `affected` or `fixed`), `vers` (versions as a VERS range, for example `vers:maven/>=2.0.0|<2.0.11`), and `remediation`. It is `null` when the packages could not be read, which does not mean that no package is affected\n- **products**: each with `vendor`, `product`, `version`, `fixed_in`, `status`, `text`, `cpe22`, and `cpe23`\n- **tags**, **impacts**\n\nFields that SecDB does not have for the advisory are `null` or empty.\n\n## LLM usage guidelines\n- Do not guess advisory IDs: use the IDs returned by other tools or provided by the user.\n- If the advisory is not found, try `vulnerability_search` before saying that it does not exist.\n- An advisory can list packages of other projects that include the vulnerable code: check `purl` before saying that a package is affected.\n- Some advisories list thousands of packages or products, so the response can be very large.\n",
