                      "description": "CAPEC identifier",
                      "type": "string"
                    },
                    "name": {
                      "description": "Attack pattern name",
                      "type": "string"
                    },
                    "via": {
                      "description": "Sub-techniques it comes from",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "cve_count": {
                "description": "CVEs with the weaknesses of this technique",
                "type": "integer"
              },
              "deprecated": {
                "description": "Deprecated by MITRE",
                "type": "boolean"
              },
              "description": {
                "description": "Description",
                "type": ["string", "null"]
              },
              "domain": {
                "description": "enterprise-attack, mobile-attack or ics-attack",
                "type": "string"
              },
              "id": {
                "description": "ATT&CK technique identifier",
                "type": "string"
              },
              "mitre_url": {
                "description": "Link to the technique on attack.mitre.org",
                "type": ["string", "null"]
