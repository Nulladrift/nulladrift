              }
            },
            "required": ["cvss_base_score", "cvss_base_severity", "cvss_explain", "cvss_vector_string", "cvss_version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
