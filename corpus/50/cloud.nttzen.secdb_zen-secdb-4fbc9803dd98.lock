        {
          "name": "purl_audit",
          "description": "Perform a software package vulnerability audit using SecDB.\n\n## What this tool does\nAnalyzes a list of software packages identified by PURL (Package URL) and returns\nvulnerability information plus a Markdown summary. The audit results are based\nexclusively on the package list provided.\n\n## When to use this tool\nUse this tool when the user wants to determine:\n- whether application dependencies contain known vulnerabilities\n- whether a project is affected by security advisories\n- which packages require patching or upgrading\n\n## Supported ecosystems\n- **npm**      - Node.js packages  (e.g. pkg:npm/lodash@4.17.21)\n- **maven**    - Java/JVM packages (e.g. pkg:maven/org.apache.logging.log4j/log4j-core@2.14.1)\n- **pypi**     - Python packages   (e.g. pkg:pypi/django@4.2.0)\n- **gem**      - Ruby gems         (e.g. pkg:gem/rails@7.0.0)\n- **cargo**    - Rust crates       (e.g. pkg:cargo/openssl-src@111.10)\n- **nuget**    - .NET packages     (e.g. pkg:nuget/Newtonsoft.Json@13.0.1)\n- **golang**   - Go modules        (e.g. pkg:golang/github.com/gin-gonic/gin@1.9.1)\n- **composer** - PHP packages      (e.g. pkg:composer/symfony/symfony@6.4.0)\n- **pub**      - Dart packages     (e.g. pkg:pub/dio@5.4.0)\n- **swift**    - Swift packages    (e.g. pkg:swift/github.com/apple/swift-nio@2.65.0)\n- **hex**      - Erlang and Elixir packages (e.g. pkg:hex/phoenix@1.7.0)\n\n## Inputs\n- **purls**: list of Package URLs, one per entry.\n  Generate them from your project manifest files:\n  - Node.js: package.json / package-lock.json\n  - Python: requirements.txt / Pipfile.lock / pyproject.toml\n  - Ruby: Gemfile.lock\n  - Go: go.mod / go.sum\n  - Rust: Cargo.lock\n  - PHP: composer.lock\n  - Java: pom.xml / build.gradle\n  - .NET: *.csproj / packages.lock.json\n\n## Outputs\n- **report**: structured JSON objects describing the advisories affecting the audited packages. Packages without known vulnerabilities are not listed.\n- **summary**: Markdown summary including vulnerable packages, total CVEs, and severity breakdown.\n- **audited**: number of PURLs that were checked.\n- **ignored**: PURLs that were not checked because they are malformed or from an unsupported ecosystem.\n\n## LLM usage guidelines\n- Never guess whether a package is vulnerable — always call this tool.\n- Only submit PURLs from the supported ecosystems listed above; others are returned in `ignored`.\n- Tell the user about any `ignored` PURL: they were not checked, so they are not known to be safe.\n- The `summary` is already Markdown and can be shown directly.\n- Use `report` when deeper technical analysis is required.\n",
          "inputSchema": {
            "properties": {
              "purls": {
                "description": "List of Package URLs (PURL) to audit",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["purls"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "audited": {
                "description": "Number of PURLs checked",
                "type": "integer"
              },
              "ignored": {
                "description": "PURLs not checked (malformed or unsupported ecosystem)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "report": {
                "items": {
                  "description": "structured objects describing the advisories affecting the audited packages",
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "description": "Markdown summary including vulnerable packages, total CVEs, and severity breakdown",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Audit packages (PURL)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca87e754e0bbf446607451f8bf224f4fe4e8b086a5ee689ad91aa040bf8b6571"
        },
        {
          "name": "sightings_search",
          "description": "Search real-world vulnerability sightings in SecDB.\n\n## What this tool does\nRetrieves information about where and how a vulnerability appears in the real world, including:\n- Exploit-DB references and PoCs\n- Scanner plugins (Nessus, OpenVAS/Greenbone)\n- Vendor advisories\n- Social/media references (Reddit, Mastodon, Bluesky)\n- MISP threat-intel sightings\n\n## When to use this tool\nUse this tool when the user asks:\n- \"Is this CVE exploited in the wild?\"\n- \"Is there a PoC or exploit available?\"\n- \"Does Nessus or OpenVAS have a plugin for this CVE?\"\n- \"Is this vulnerability being discussed online?\"\n- \"Show me all advisories/exploits for this CVE/product.\"\n\n## Inputs\nAny of the following may be used:\n- **cve_id**: search by specific CVE\n- **query**: full-text search (name, product, advisory ID, exploit reference, etc.)\n- **category**: filter sightings by type (e.g., `exploit`, `nasl`, `advisory`, `scanner`, `poc`, `social`, `misp`)\n- **status**: filter by sighting state (`exploited`, `mitigated`, `seen`, `confirmed`, etc.)\n- **since**: only return sightings created since then: a period (`P7D`, `P1W`, `P3M`, `P1Y`) or a date (`2026-10-01`, included)\n- **limit**: maximum number of sightings to return (default 25, maximum 100)\n- **page**: page of results to return (default 1)\n\n## Outputs\n- **sightings**: array of sightings, most recent first, typically containing:\n  - `cve_id`\n  - `status`\n  - `category`\n  - `reference`\n  - `details` (object with additional structured data)\n- **total_results**, **total_pages**, **current_page**: use them to decide whether to ask for another `page`\n\n## LLM usage guidelines\n- Use `cve_id` when the question targets a specific vulnerability.\n- Use `query` for broad or exploratory searches.\n- Only use valid enum values for `category` and `status`.\n- Use this tool instead of assuming exploitation, PoCs, or plugin availability.\n- Use `page` only when the user needs more than the first results.\n- For Metasploit modules, use `vulnerability_exploits`.\n",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Sighting category (scanner, exploit, advisory, nasl, etc.)",
                "enum": ["advisory", "nasl", "exploit", "misp", "scanner", "poc", "social"],
                "type": "string"
              },
              "cve_id": {
                "description": "CVE identification (CVE-YYYY-NNNN)",
                "pattern": "^[Cc][Vv][Ee]-[0-9]{4}-[0-9]{4,}$",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Maximum results",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page of results",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Full-text-search for vulnerability name, CVE ID or Advisory ID, categories, etc.",
                "type": "string"
              },
              "since": {
                "description": "Only sightings created since then: a period (P7D, P1W, P3M, P1Y) or a date (YYYY-MM-DD)",
                "pattern": "^(P[0-9]+[DWMY]|[0-9]{4}-[0-9]{2}-[0-9]{2})$",
                "type": "string"
              },
              "status": {
                "description": "Sighting status",
                "enum": ["seen", "confirmed", "exploited", "patched", "not-exploited", "not-confirmed", "not-patched", "exploitable", "mentioned", "mitigated"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "current_page": {
                "description": "Page returned",
                "type": "integer"
              },
              "sightings": {
                "description": "Sightings found",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "total_pages": {
                "description": "Pages of results available",
                "type": "integer"
              },
              "total_results": {
                "description": "Sightings found across all pages",
                "type": "integer"
              }
            },
            "required": ["current_page", "sightings", "total_pages", "total_results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search sightings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93306d66e288e08f2566ca3a8c5f4bda4dd5f3dcdd0e05a93e95c5db6815b1ac"
        },
        {
          "name": "ssvc_calculator",
          "description": "Compute CISA SSVC (Stakeholder-Specific Vulnerability Categorization) for a CVE.\n\n## What this tool does\nCalculates the SSVC decision (Track, Track*, Attend, Act) using:\n- exploitation status\n- technical impact\n- automatable exploitation\n- mission prevalence (user-provided)\n- public well-being impact (user-provided)\n\nThis reflects CISA's official SSVC prioritization model.\n\n## When to use this tool\nUse this tool when the user asks about:\n- how urgently a CVE should be remediated\n- CISA SSVC priority or risk category\n- a structured decision model for remediation\n\n## Inputs\n- **cve_id**: the vulnerability to evaluate (`CVE-YYYY-NNNNN`)\n- **mission_prevalence**: `M`, `S`, or `E` (must be provided by the user)\n- **public_well_being_impact**: `M`, `A`, or `I` (must be provided by the user)\n\n## Outputs\n- `decision`: one of **Track**, **Track\\***, **Attend**, **Act**\n- `exploitation`\n- `technical_impact`\n- `automatable`\n- `mission_prevalence`\n- `public_well_being_impact`\n- `mission_and_well_being_impact_value`\n- `vector_string`\n- `summary`: Markdown explanation of the outcome\n\n## LLM usage guidelines\n- Always ask the user for **mission_prevalence** (M/S/E) and **public_well_being_impact** (M/A/I) before calling.\n- Never guess these values—SSVC depends on user context.\n- Use the `summary` to explain clearly why the decision was returned.\n- Combine with `vulnerability_score` or `sightings_search` if the user needs additional context.\n",
          "inputSchema": {
            "properties": {
              "cve_id": {
                "description": "CVE ID",
                "pattern": "^[Cc][Vv][Ee]-[0-9]{4}-[0-9]{4,}$",
                "type": "string"
              },
              "mission_prevalence": {
                "description": "# Mission Prevalence\n\nA mission essential function (MEF) is a function directly related to\naccomplishing the organization's mission as set forth in its statutory or\nexecutive charter. Identifying MEFs is part of business continuity planning\nor crisis planning. In contrast to non-essential functions, an organization\nmust perform a [MEF] during a disruption to normal operations. The mission\nis the reason an organization exists, and MEFs are how that mission is\nrealized. Non- essential functions support the smooth delivery or success\nof MEFs rather than directly supporting the mission.\n\n## Possible values\n\n- \"M\" or \"Minimal\"\n\nNeither support nor essential apply. The vulnerable component may be used\nwithin the entities, but it is not used as a mission-essential component,\nnor does it provide impactful support to mission-essential functions.\n\n- \"S\" or \"Support\"\n\nThe vulnerable component only supports MEFs for two or more entities.\n\n- \"E\" or \"Essential\"\n\nThe vulnerable component directly provides capabilities that constitute at\nleast one MEF for at least one entity; component failure may (but does not\nnecessarily) lead to overall mission failure.\n\n## Instructions for LLM\n\nAsk the user for the \"Mission Prevalence\" value before calling the tool.\n",
                "enum": ["M", "S", "E", "Minimal", "Support", "Essential"],
                "type": "string"
              },
              "public_well_being_impact": {
                "description": "# Public Well-being Impact\n\n## Possible values\n\n- \"M\" or \"Minimal\"\n\n**Type of Harm -> All**, The effect is below the threshold for all aspects\ndescribed in material.\n\n- \"A\" or \"Material\"\n\n**Type of Harm -> Physical harm**, Does one or more of the following:\n\n- Causes physical distress or injury to system users.\n- Introduces occupational safety hazards.\n- Reduces and/or results in failure of cyber-physical system safety margins.\n\n**Type of Harm -> Environment**, Major externalities (property damage,\nenvironmental damage, etc.) are imposed on other parties.\n\n**Type of Harm -> Financial**, Financial losses likely lead to bankruptcy of\nmultiple persons.\n\n**Type of Harm -> Psychological**, Widespread emotional or psychological harm,\nsufficient to necessitate counseling or therapy, impact populations of people.\n\n- \"I\" or \"Irreversible\"\n\n**Type of Harm -> Physical harm**, One or both of the following are true:\n\n- Multiple fatalities are likely.\n- The cyber-physical system, of which the vulnerable component is a part, is\nlikely lost or destroyed.\n\n**Type of Harm -> Environment**, Extreme or serious externalities (immediate\npublic health threat, environmental damage leading to small ecosystem collapse,\netc.) are imposed on other parties.\n\n**Type of Harm -> Financial**, Social systems (elections, financial grid, etc.)\nsupported by the software are destabilized and potentially collapse.\n\n**Type of Harm -> Psychological**, N/A\n\n\n## Instructions for LLM\n\nAsk the user for the \"Public Well-being Impact\" value before calling the tool.\n",
                "enum": ["M", "A", "I", "Minimal", "Material", "Irreversible"],
                "type": "string"
              }
            },
            "required": ["cve_id", "mission_prevalence", "public_well_being_impact"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "automatable": {
                "description": "Automatable",
                "type": "string"
              },
              "decision": {
                "description": "Decision",
                "type": "string"
              },
              "exploitation": {
                "description": "State of Exploitation (Evidence of Active Exploitation of a Vulnerability)",
                "type": "string"
              },
              "mission_and_well_being_impact_value": {
                "description": "Mission and Well-Being Impact Value",
                "type": "string"
              },
              "mission_prevalence": {
                "description": "Mission Prevalence (Impact on Mission Essential Functions of Relevant Entities)",
                "type": "string"
              },
              "public_well_being_impact": {
                "description": "Public Well-being Impact",
                "type": "string"
              },
              "summary": {
                "description": "Summary",
                "type": "string"
              },
              "technical_impact": {
                "description": "Technical Impact (Technical Impact of Exploiting the Vulnerability)",
                "type": "string"
              },
              "vector_string": {
                "description": "SSVC Vector String",
                "type": "string"
              }
            },
            "required": ["automatable", "decision", "exploitation", "mission_and_well_being_impact_value", "mission_prevalence", "public_well_being_impact", "technical_impact", "vector_string"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "SSVC decision"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ce896e9e4b2a4fbe3144e0928f2c266b79552f2130821718a2d8b027c1a7d41"
        },
        {
          "name": "vulnerability_attack",
          "description": "Get the weaknesses (CWE), attack patterns (CAPEC) and MITRE ATT&CK techniques linked to a specific CVE.\n\n## What this tool does\nFollows the chain CVE → CWE → CAPEC → ATT&CK: returns the weaknesses of the CVE, the CAPEC attack patterns that\nexploit them, the ATT&CK techniques mapped to those attack patterns (active techniques only), and a summary of the\nATT&CK tactics involved.\n\n## When to use this tool\nUse this tool when the user asks:\n- \"Which ATT&CK techniques are related to CVE-XYZ?\"\n- \"Which tactics could an attacker use with this vulnerability?\"\n- \"Which attack patterns exploit the weaknesses of this CVE?\"\n\n## Inputs\n- **cve_id**: valid CVE identifier (`CVE-YYYY-NNNNN`).\n\n## Outputs\n- `cve_id`, `url`: link to the CVE on SecDB\n- `cwe`: weaknesses, each with `id`, `name` and `url`\n- `capec`: attack patterns, each with `id`, `name`, `via` (the CWE it comes from) and `url`\n- `attack`: ATT&CK techniques, each with `id`, `name`, `tactics` (`id` and `name`), `via` (the CAPEC it comes from),\n  `url` and `mitre_url`\n- `tactics`: ATT&CK tactics, each with `id`, `name` and `technique_count`\n\n## LLM usage guidelines\n- The link is derived from the weaknesses of the CVE: it does not mean that the vulnerability is exploited with these techniques. Say \"related to\" or \"could be linked to\", never \"exploited via\".\n- Empty lists are normal: many weaknesses have no CAPEC attack pattern and many attack patterns have no ATT&CK technique.\n- For real-world exploitation use `kev_check`, `vulnerability_exploits` and `sightings_search`.\n- For the details of a technique or a weakness use `attack_info` or `cwe_info`.\n",
          "inputSchema": {
            "properties": {
              "cve_id": {
                "description": "CVE identification (CVE-YYYY-NNNNN)",
                "pattern": "^[Cc][Vv][Ee]-[0-9]{4}-[0-9]{4,}$",
                "type": "string"
              }
            },
            "required": ["cve_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attack": {
                "items": {
                  "properties": {
                    "id": {
                      "description": "Identifier",
                      "type": "string"
                    },
                    "mitre_url": {
                      "description": "Link on attack.mitre.org",
                      "type": "string"
                    },
                    "name": {
                      "description": "Name",
                      "type": "string"
                    },
                    "tactics": {
                      "items": {
                        "properties": {
                          "id": {
                            "description": "Identifier",
                            "type": "string"
                          },
                          "name": {
                            "description": "Name",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "url": {
                      "description": "Link on SecDB",
                      "type": "string"
                    },
                    "via": {
                      "description": "Attack patterns it comes from",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
