        {
          "name": "vulnerability_search",
          "description": "Perform a full-text vulnerability search in SecDB.\n\n## What this tool does\nSearches across:\n- CVE entries\n- Security advisories\n- Exploit references\n- Product and vendor vulnerability data\n\n## Searchable fields (Lucene syntax supported):\n- type: result type - cve, cwe, attack (ATT&CK techniques), advisory, nasl, exploitdb\n- id: exact identifier, without wildcards (e.g. id:CVE-2021-44228)\n- title: resource title or name\n- summary: short summary\n- description: full description text\n- alias: known vulnerability names (e.g. alias:log4shell)\n- severity: critical, high, medium, low\n- kev: true/false — CISA KEV catalog membership\n- status: NVD status (CVE only) e.g. analyzed, modified\n- published: publication date (e.g. published:>=\"2026-01-01T00:00:00Z\")\n- modified: last modification date (e.g. modified:>=\"2026-01-01T00:00:00Z\")\n- cve: related CVE ID (e.g. cve:CVE-2026-44827)\n- cwe: related CWE ID (e.g. cwe:CWE-79)\n- tag: advisory tag, or ATT&CK tactic of a technique (e.g. tag:persistence)\n- attack_vector: network, adjacent, local, physical\n- cvss_score: CVSS base score (e.g. cvss_score:>=7)\n\nDefault operator is AND. Use OR for alternatives, quotes for exact phrases, * for wildcards.\n\nFor ranges use `>`, `>=`, `<`, and `<=`, repeating the field for both ends. Dates need a quoted date and time in UTC.\n\n## Examples:\n- \"apache struts rce\" → RCE vulnerabilities in Apache Struts\n- \"id:CVE-2026-44827\" → exact CVE lookup\n- \"type:advisory AND severity:critical\" → critical advisories\n- \"alias:log4shell\" → Log4Shell by alias\n- \"cve:CVE-2026-44827 AND type:exploitdb\" → ExploitDB entries for a CVE\n- \"cvss_score:>=9 AND kev:true\" → critical KEV CVEs\n- \"type:attack AND tag:credential-access\" → ATT&CK techniques of the Credential Access tactic\n- \"type:cve AND published:>=\\\"2026-10-01T00:00:00Z\\\" AND published:<=\\\"2026-10-31T23:59:59Z\\\"\" → CVEs published in October 2026\n\n## When to use this tool\nUse this tool when the user asks:\n- to look up a CVE, advisory, exploit, or product\n- \"show vulnerabilities for X\"\n- \"search for advisories about Y\"\n- exploratory or broad vulnerability discovery\n\n## Inputs\n- **query**: free-text search term (CVE ID, advisory ID, product name, exploit name, vendor, keyword, etc.)\n- **limit**: maximum number of results to return (default 10, maximum 50)\n- **page**: page of results to return (default 1)\n- **type**: only return results of this type (`cve`, `cwe`, `attack`, `advisory`, `nasl`, `exploitdb`)\n- **sort**: `relevance` (default) or `date` (most recently modified first)\n- **since**: only return results modified since then: a period (`P7D`, `P1W`, `P3M`, `P1Y`) or a date (`2026-10-01`, included)\n\n## Outputs\n- **results**: search hits, each with `type`, `id`, `title`, `description` (shortened), `severity`, `cvss_score`, `kev` (CVEs only), `source`, `published`, `modified`, and `url`\n- **facets**: number of records found for each `type` and `severity`\n- **total_results**, **total_pages**, **current_page**: use them to decide whether to ask for another `page`\n- **search_url**: link to continue the search on SecDB\n\n## LLM usage guidelines\n- Use this tool instead of assuming whether a CVE/advisory/exploit exists.\n- If `total_results` is `null`, the query is not valid: fix its syntax. It does not mean that nothing was found.\n- Results are short: for the full record use `vulnerability_info`, `advisory_info`, `cwe_info`, or `attack_info` with the `id` of the result.\n- Combine with `vulnerability_score`, `epss_timeseries`, or `sightings_search` for deeper analysis.\n",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum results",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page of results",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "CVE ID, vulnerability name, Advisory ID, Exploit, etc.",
                "minLength": 3,
                "type": "string"
              },
              "since": {
                "description": "Only results modified since then: a period (P7D, P1W, P3M, P1Y) or a date (YYYY-MM-DD)",
                "pattern": "^(P[0-9]+[DWMY]|[0-9]{4}-[0-9]{2}-[0-9]{2})$",
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "description": "Sort order",
                "enum": ["relevance", "date"],
                "type": "string"
              },
              "type": {
                "description": "Result type",
                "enum": ["cve", "cwe", "attack", "advisory", "nasl", "exploitdb"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "current_page": {
                "description": "Page returned",
                "type": "integer"
              },
              "facets": {
                "additionalProperties": {
                  "additionalProperties": {
                    "type": "integer"
                  },
                  "type": "object"
                },
                "description": "Records found for each type and severity",
                "type": "object"
              },
              "results": {
                "description": "Search hits",
                "items": {
                  "properties": {
                    "cvss_score": {
                      "description": "CVSS base score",
                      "type": ["number", "null"]
                    },
                    "description": {
                      "description": "Shortened description",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Identifier",
                      "type": "string"
                    },
                    "kev": {
                      "description": "In the CISA KEV catalog (CVEs only)",
                      "type": ["boolean", "null"]
                    },
                    "modified": {
                      "description": "Last modification date",
                      "type": ["string", "null"]
                    },
                    "published": {
                      "description": "Publication date",
                      "type": ["string", "null"]
                    },
                    "severity": {
                      "description": "Severity",
                      "type": ["string", "null"]
                    },
                    "source": {
                      "description": "CNA or advisory source",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "description": "Title",
                      "type": ["string", "null"]
                    },
                    "type": {
                      "description": "Result type",
                      "type": "string"
                    },
                    "url": {
                      "description": "Page on SecDB",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "kev", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "search_url": {
                "description": "Link to continue the search on SecDB",
                "type": "string"
              },
              "total_pages": {
                "description": "Pages of results available",
                "type": ["integer", "null"]
              },
              "total_results": {
                "description": "Records found",
                "type": ["integer", "null"]
              }
            },
            "required": ["current_page", "facets", "results", "search_url", "total_pages", "total_results"],
            "type": "object"
          },
