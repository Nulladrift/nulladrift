        },
        {
          "name": "search_products",
          "title": "오늘산지 상품 검색",
          "description": "판매 중인 상품을 검색합니다. 검색어(상품명·원재료·산지·생산자)와 카테고리·최대 가격·무료배송 조건으로 거를 수 있습니다. 검색어가 없으면 추천순 목록입니다.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "카테고리 slug (list_categories 참고)",
                "pattern": "^[a-z0-9-]{1,120}$",
                "type": "string"
              },
              "freeShippingOnly": {
                "description": "무료배송 상품만",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "maxPrice": {
                "description": "최대 가격(원)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "query": {
                "description": "검색어 (예: 청국장, 국산콩, 천안)",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
