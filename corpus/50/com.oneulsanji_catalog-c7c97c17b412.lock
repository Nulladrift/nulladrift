            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6012f4d2bb7eb378720cb4be5560efe861e90fce10949d1967f3c81efd2374b7"
        },
        {
          "name": "get_store_info",
          "title": "오늘산지 스토어 안내",
          "description": "스토어 소개, 배송·교환·반품 기본 정책, 고객센터, 자주 묻는 질문.",
          "inputSchema": {
