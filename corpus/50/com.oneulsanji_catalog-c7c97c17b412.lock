      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "오늘산지(https://oneulsanji.com) 상품·가이드 조회용 읽기 전용 서버입니다. 가격과 품질을 보고 골라 소개하는 산지 셀렉트 마켓. 전국 산지와 지역 생산자의 먹거리를 MD가 직접 선별합니다.\n가격·재고·배송비는 조회 시점의 스토어 값입니다. 사용자에게 안내할 때 상품 url 을 출처로 함께 제시하고, 최종 확인은 상품 페이지에서 하도록 안내해 주세요.\nfacts 에 없는 항목(보관법·효능 등)은 추측하지 말고 '상품 페이지 또는 판매자 문의로 확인'이라고 안내해 주세요. 건강 효능 정보는 제공하지 않습니다.\nRead-only catalog of a Korean farm-produce select shop. Prices are KRW integers. Always cite the product url.",
      "tools": [
        {
          "name": "get_product",
          "title": "오늘산지 상품 상세",
          "description": "상품 하나의 상세 정보: 가격, 구성·중량, 원산지·원재료 등 표시사항(facts), 배송·교환·반품 조건, 특징, 추천 대상, 먹는 법, FAQ, 관련 가이드.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "product": {
                "description": "상품 slug 또는 상품 페이지 주소",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
