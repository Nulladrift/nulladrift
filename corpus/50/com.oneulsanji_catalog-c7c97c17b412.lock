        {
          "name": "list_categories",
          "title": "오늘산지 카테고리",
          "description": "판매 중인 상품이 있는 카테고리 목록(이름·slug·설명·상품 수·주소).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
