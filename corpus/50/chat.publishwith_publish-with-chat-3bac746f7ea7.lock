        {
          "name": "get_site_guidance",
          "title": "Get website building guidance",
          "description": "Returns reference material about building a good website for a non-technical customer: the facts worth gathering, what each kind of page usually contains, what a static site can and cannot do, and the quality standards the readiness report checks. Without site_type it returns the general standards and the list of website types. With site_type (small-business, tradesperson, photography, food-business, portfolio, landing-page, other) it returns the checklist for that type. With topic domain-setup it returns the guide for connecting a domain the customer already owns. Read-only.",
