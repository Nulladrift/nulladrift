      "serverInfo": {
        "name": "publish-with-chat",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Publish with chat turns a conversation into a live website. The customer is usually not technical: use plain language and act like a friendly web designer.\n\nSuggested way of working:\n1. Find out what the website is for. Ask two or three questions at a time, not a long form. Accept rough answers and offer to write the wording.\n2. Pick the closest website type (small business, tradesperson, photography, food business, portfolio, landing page) and call get_site_guidance with site_type to read the matching checklist before building.\n3. Use only facts the customer gave. Missing addresses, phone numbers, opening hours, prices, testimonials and qualifications are asked for or left out, never invented.\n4. Build the site as static HTML, CSS and JavaScript. Every page needs a title, meta description, one h1, a viewport tag, alt text and working links. Say honestly what a static site cannot do: it has no database, no accounts, no payments and no booking system of its own. A contact form can post to the built-in form address (see get_site_guidance); a form must never post nowhere. Never use cookies or browser storage (document.cookie, localStorage, sessionStorage, IndexedDB): they do not work on a publishedwith.chat address, and the upload is refused if the code is there. That includes cookie banners that save a choice. They are only allowed once the owner has connected their own domain.\n5. Pass site_type when creating the preview. The reply includes a readiness report: critical items are fixed before the preview is shared, other items are explained simply.\n6. Share the preview, invite changes, and give the owner link only when the customer is happy.",
      "tools": [
        {
          "name": "create_publish_session",
          "title": "Start a website upload",
          "description": "Starts a new website upload session and returns a session_id and its expiry time. Files are added to the session separately and become a previewable site when the session is finalized. Original image files are stored as given, without resizing. Sites are static pages (HTML, CSS and JavaScript that runs in the visitor's browser): they have no shopping basket or ordering process, no customer accounts or log-in, no database and no server code, so a request for those cannot be met by this tool. Cookies and browser storage (document.cookie, localStorage, sessionStorage) are not available either, and files that use them are refused.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a website upload"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:302f079ad8f7a629c665d662a6e1b44503858d81f5cc21ad86944be64914f5da"
        },
        {
          "name": "create_site_from_files",
          "title": "Create a website from text files",
          "description": "Creates a new website from a list of text files in a single call: starts a session, saves the files and finalizes. Returns a preview link, the link the owner uses to create an account and publish, and a readiness report (score, critical items, unsupported features) tailored by the optional site_type. Only text files (and very small base64 files) can be included in this call; larger images and other binaries are added to a session separately. Sites are static pages (HTML, CSS and JavaScript that runs in the visitor's browser): they have no shopping basket or ordering process, no customer accounts or log-in, no database and no server code, so a request for those cannot be met by this tool. Cookies and browser storage (document.cookie, localStorage, sessionStorage) are not available either, and files that use them are refused.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "files": {
                "description": "The files to save (text files; base64 only for tiny binaries)",
                "items": {
                  "properties": {
                    "content": {
                      "maxLength": 7000000,
                      "type": "string"
                    },
                    "encoding": {
                      "default": "utf8",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path, e.g. index.html or css/style.css",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "owner_email": {
                "description": "Only if the user asked to be emailed the preview and owner link: their email address",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "site_name": {
                "description": "Business or site name, e.g. Blue Drop Plumbing",
                "maxLength": 100,
                "type": "string"
              },
              "site_type": {
                "description": "The closest website type (small-business, tradesperson, photography, food-business, portfolio, landing-page, other). Used to tailor the readiness report",
                "enum": ["small-business", "tradesperson", "photography", "food-business", "portfolio", "landing-page", "other"],
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a website from text files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ea29a18b29dde4ace0b7b1f3fe2917f0482fdf67e30221c9432a9aaaa935051c"
        },
        {
          "name": "finalize_upload",
          "title": "Check the site and create a preview",
          "description": "Checks the uploaded site and creates a temporary preview URL (valid for 48 hours) plus a link the site owner uses to create an account and publish. The response lists errors (these block the preview) and warnings (broken links, missing pages, placeholder text). Optional site_name sets the site's name and web address. Optional site_type tailors the readiness report in the reply: a 0 to 100 score from automated checks (SEO, mobile, contact, content, accessibility, functionality, performance), critical items such as a form that goes nowhere, features a static site cannot provide, and what could not be checked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "owner_email": {
                "description": "Only if the user asked to be emailed the preview and owner link: their email address",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "session_id": {
                "type": "string"
              },
              "site_name": {
                "description": "Business or site name, e.g. Blue Drop Plumbing",
                "maxLength": 100,
                "type": "string"
              },
              "site_type": {
                "description": "The closest website type (small-business, tradesperson, photography, food-business, portfolio, landing-page, other). Used to tailor the readiness report",
                "enum": ["small-business", "tradesperson", "photography", "food-business", "portfolio", "landing-page", "other"],
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
