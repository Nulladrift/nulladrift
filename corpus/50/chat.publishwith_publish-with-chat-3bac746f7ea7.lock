      "instructions": "Publish with chat publishes and hosts websites made with AI. The person has usually made something already, in this chat or elsewhere, and wants it online. They are usually not technical: use plain language, and say \"publish\" or \"go live\" rather than \"deploy\".\n\nSuggested way of working:\n1. If a website already exists, publish it as it is: the files made in this chat, files or a .zip the person attached (import_attached_file), or a large folder through an upload link (request_upload_link). A React or Vite app is published from its built folder (usually dist). Change only what the person asks for, and tell them in plain words about anything the readiness report flags.\n2. If nothing exists yet, it can be made first. Find out what the website is for, two or three questions at a time, and offer to write the wording. Pick the closest website type (small business, tradesperson, photography, food business, portfolio, landing page) and call get_site_guidance with site_type to read the matching checklist before building. The guidance covers design, answering the questions buyers ask, and search basics.\n3. Use only facts the customer gave. Missing addresses, phone numbers, opening hours, prices, testimonials and qualifications are asked for or left out, never invented.\n4. Build the site as static HTML, CSS and JavaScript. Every page needs a title, meta description, one h1, a viewport tag, alt text and working links. Say honestly what a static site cannot do: it has no database, no accounts, no payments and no booking system of its own. A contact form can post to the built-in form address (see get_site_guidance); a form must never post nowhere. Never use cookies or browser storage (document.cookie, localStorage, sessionStorage, IndexedDB): they do not work on a publishedwith.chat address, and the upload is refused if the code is there. That includes cookie banners that save a choice. They are only allowed once the owner has connected their own domain.\n5. Pass site_type when creating the preview. The reply includes a readiness report: critical items are fixed before the preview is shared, other items are explained simply.\n6. Share the preview, invite changes, and give the owner link only when the customer is happy.",
      "tools": [
        {
          "name": "create_publish_session",
          "title": "Start a website upload",
          "description": "Starts a new website upload session and returns a session_id and its expiry time. Files are added to the session separately and become a previewable site when the session is finalized. Original image files are stored as given, without resizing. Sites are static pages (HTML, CSS and JavaScript that runs in the visitor's browser): they have no shopping basket or ordering process, no customer accounts or log-in, no database and no server code, so a request for those cannot be met by this tool. Cookies and browser storage (document.cookie, localStorage, sessionStorage) are not available either, and files that use them are refused.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a website upload"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:302f079ad8f7a629c665d662a6e1b44503858d81f5cc21ad86944be64914f5da"
        },
        {
          "name": "create_site_from_files",
          "title": "Create a website from text files",
          "description": "Creates a new website from a list of text files in a single call: starts a session, saves the files and finalizes. Returns a preview link, the link the owner uses to create an account and publish, and a readiness report (score, critical items, unsupported features) tailored by the optional site_type. Only text files (and very small base64 files) can be included in this call; larger images and other binaries are added to a session separately. Sites are static pages (HTML, CSS and JavaScript that runs in the visitor's browser): they have no shopping basket or ordering process, no customer accounts or log-in, no database and no server code, so a request for those cannot be met by this tool. Cookies and browser storage (document.cookie, localStorage, sessionStorage) are not available either, and files that use them are refused.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "files": {
                "description": "The files to save (text files; base64 only for tiny binaries)",
                "items": {
                  "properties": {
                    "content": {
                      "description": "The file's contents: plain text for utf8, or base64 text for a tiny binary file",
                      "maxLength": 7000000,
                      "type": "string"
                    },
                    "encoding": {
                      "default": "utf8",
                      "description": "How content is encoded: utf8 for text files (default), base64 for tiny binary files only",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path, e.g. index.html or css/style.css",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "owner_email": {
                "description": "Only if the user asked to be emailed the preview and owner link: their email address",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "site_name": {
                "description": "Business or site name, e.g. Blue Drop Plumbing",
                "maxLength": 100,
                "type": "string"
              },
              "site_type": {
                "description": "The closest website type (small-business, tradesperson, photography, food-business, portfolio, landing-page, other). Used to tailor the readiness report",
                "enum": ["small-business", "tradesperson", "photography", "food-business", "portfolio", "landing-page", "other"],
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a website from text files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
