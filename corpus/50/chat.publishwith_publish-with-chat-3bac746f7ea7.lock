        {
          "name": "upload_file_chunk",
          "title": "Upload a file in pieces",
          "description": "Saves a binary file into an open session in pieces, for files that can only be supplied as text. The file's base64 text is split into consecutive pieces of at most 12000 characters, each sent with chunk_index 0..total_chunks-1 (any order). When the last piece arrives the file is assembled and saved. Suited to small files only (roughly 100 KB).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chunk_index": {
                "description": "Position of this piece, starting at 0",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "data": {
                "description": "This piece of the file's base64 text, at most 12000 characters",
                "maxLength": 12000,
                "type": "string"
              },
              "path": {
                "description": "Relative path the assembled file is saved to, e.g. images/logo.png",
                "type": "string"
              },
              "session_id": {
                "description": "The session_id returned when the upload or update session was started",
                "type": "string"
              },
              "total_chunks": {
                "description": "Total number of pieces the file was split into",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["chunk_index", "data", "path", "session_id", "total_chunks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Upload a file in pieces"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
