        {
          "name": "update_site_files",
          "title": "Change a website in one step",
          "description": "Changes one of the signed-in customer's existing sites in a single call: starts an update session (a copy of the live files), saves the given files over it, and finalizes a new version. Only changed or new files need to be given. With publish true the new version is made live straight away if the account allows it; otherwise it stays a preview. Sites are static pages (HTML, CSS and JavaScript that runs in the visitor's browser): they have no shopping basket or ordering process, no customer accounts or log-in, no database and no server code, so a request for those cannot be met by this tool. Cookies and browser storage (document.cookie, localStorage, sessionStorage) are not available either, and files that use them are refused.",
