        {
          "name": "update_site_files",
          "title": "Change a website in one step",
          "description": "Changes one of the signed-in customer's existing sites in a single call: starts an update session (a copy of the live files), saves the given files over it, and finalizes a new version. Only changed or new files need to be given. With publish true the new version is made live straight away if the account allows it; otherwise it stays a preview. Sites are static pages (HTML, CSS and JavaScript that runs in the visitor's browser): they have no shopping basket or ordering process, no customer accounts or log-in, no database and no server code, so a request for those cannot be met by this tool. Cookies and browser storage (document.cookie, localStorage, sessionStorage) are not available either, and files that use them are refused.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "files": {
                "description": "The files to save (text files; base64 only for tiny binaries)",
                "items": {
                  "properties": {
                    "content": {
                      "description": "The file's contents: plain text for utf8, or base64 text for a tiny binary file",
                      "maxLength": 7000000,
                      "type": "string"
                    },
                    "encoding": {
                      "default": "utf8",
                      "description": "How content is encoded: utf8 for text files (default), base64 for tiny binary files only",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path, e.g. index.html or css/style.css",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "publish": {
                "default": false,
                "description": "Make the new version live now",
                "type": "boolean"
              },
              "site_id": {
                "description": "The id of the site, as shown in the customer's list of sites",
                "type": "string"
              },
              "site_type": {
                "description": "The closest website type (small-business, tradesperson, photography, food-business, portfolio, landing-page, other). Used to tailor the readiness report",
                "enum": ["small-business", "tradesperson", "photography", "food-business", "portfolio", "landing-page", "other"],
                "type": "string"
              }
            },
            "required": ["files", "site_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
