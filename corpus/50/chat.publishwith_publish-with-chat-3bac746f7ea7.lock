          "title": "Check the site and create a preview",
          "description": "Checks the uploaded site and creates a temporary preview URL (valid for 48 hours) plus a link the site owner uses to create an account and publish. The response lists errors (these block the preview) and warnings (broken links, missing pages, placeholder text). Optional site_name sets the site's name and web address. Optional site_type tailors the readiness report in the reply: a 0 to 100 score from automated checks (SEO, mobile, contact, content, accessibility, functionality, performance), critical items such as a form that goes nowhere, features a static site cannot provide, and what could not be checked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "owner_email": {
                "description": "Only if the user asked to be emailed the preview and owner link: their email address",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "session_id": {
                "description": "The session_id returned when the upload or update session was started",
                "type": "string"
              },
              "site_name": {
                "description": "Business or site name, e.g. Blue Drop Plumbing",
                "maxLength": 100,
                "type": "string"
              },
              "site_type": {
                "description": "The closest website type (small-business, tradesperson, photography, food-business, portfolio, landing-page, other). Used to tailor the readiness report",
                "enum": ["small-business", "tradesperson", "photography", "food-business", "portfolio", "landing-page", "other"],
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
