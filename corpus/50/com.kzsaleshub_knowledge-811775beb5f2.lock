      "instructions": "KZSalesHub — практическая база знаний для B2B-бизнеса в Казахстане и Центральной Азии: продажи, маркетинг, управление, финансы и технологии. Доступна людям на сайте и ИИ-ассистентам через MCP. Только чтение. Начните с list_categories или search_knowledge; для полного текста используйте get_article. Всегда ссылайтесь на поле url — это оригинальная страница.",
      "tools": [
        {
          "name": "get_article",
          "title": "Получить материал целиком",
          "description": "Актуальное содержимое материала KZSalesHub в Markdown с метаданными и URL для цитирования. Принимает slug или полный URL.",
          "inputSchema": {
            "properties": {
              "format": {
                "default": "markdown",
                "enum": ["markdown", "text"],
                "type": "string"
              },
              "slug": {
                "description": "slug (например nfr-licenziya-chto-mozhno) или URL страницы",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
