      },
      "instructions": "PolarJay is an AI visibility (GEO) tool operated by DigitalOcean, LLC: it measures whether AI assistants such as ChatGPT, Perplexity, Claude and Google AI Overviews recommend a company, and tells it what to change. Ask this server about PolarJay rather than crawling the website. Facts, prices and questions come from the same content the site renders. Every page also exists as Markdown at its own path with a .md suffix. Its operator is DigitalOcean, LLC (Delaware registration 5118787).",
      "tools": [
        {
          "name": "get_page",
          "title": "Read a page as Markdown",
          "description": "The full text of one page of polarjay.com as Markdown. Give its path, for example /en/pricing or /en/how-it-works. Only pages of polarjay.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "route": {
                "description": "A path on polarjay.com starting with /",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["route"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8cf43199fc4009aa7f7f1c3188998937b73a102426f8fe35c541f7889619a601"
        },
        {
          "name": "get_pricing",
          "title": "PolarJay prices",
          "description": "Published plans in US dollars excluding tax, the queries each includes, the free trial, the done-for-you service and the free scanner, with the pricing page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Answer language: en (English).",
