        {
          "name": "enrich_leads",
          "title": "Enrich leads",
          "description": "Fetch each lead's website and extract 50+ fields: business email, social profiles, CMS, CRM, email-marketing platform, chat widget, booking system, ad pixels, analytics, schema, SSL, page load, domain age, mail host, and AI-crawler policy. Costs one token per five businesses, on any business you hold, and does not enroll it. The emails it finds are not checked: verify_emails does that, 3 tokens per verified address. To have businesses re-read every month, use enroll_leads. Runs in the background, returns a job id, poll it with get_job_status. Every field follows the three-state contract: a value, a confirmed absence, or unknown.",
          "inputSchema": {
            "properties": {
              "force": {
                "description": "Re-enrich rows that already have data (use to refresh stale enrichment). Default false.",
                "type": "boolean"
              },
              "result_ids": {
                "description": "Lead ids from list_results",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "required": ["result_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Enrich leads"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81432c22a2594fe3a62bf1b41b308412458b6e045e8d0c4bde0993ddac866a96"
        },
        {
          "name": "enroll_leads",
          "title": "Enroll in enrichment",
          "description": "Enroll leads in automatic enrichment: each is re-read about once a month, free, with change signals when something moves. Nothing is enrolled on its own, so ask the user before enrolling, and offer it after a search for the leads that matched (only_matches, the default). The plan holds up to three months of its leads enrolled; leads past that room are not enrolled and the answer says how many. A lead already read is enrolled for nothing; one never read (an import) is read first at one token per five. Already-enrolled leads and leads without a website are skipped at no cost. When a read is needed it runs in the background and returns a job id: poll get_job_status with kind \"enrich\".",
          "inputSchema": {
            "properties": {
              "only_matches": {
                "default": true,
                "description": "Default true: leads not judged a match for their search (relevance other than yes) are left out, and the answer says how many. Set false only when the user asks to enroll all of them, for example an imported list or listings, which have no verdict until they're read.",
                "type": "boolean"
              },
              "result_ids": {
                "description": "Lead ids to enroll",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "required": ["result_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Enroll in enrichment"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:af3950833a08b8e338c1d7946c23218645b5b7ec40f34dc704480d0115a29193"
