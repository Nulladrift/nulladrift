        {
          "name": "find_contacts",
          "title": "Find named contacts",
          "description": "Two paid steps on one job. With owner_only true: where a lead names its owner (its own site, or a public registry), guess the owner's own address (at most 3 guesses, no web search) and check it at the mailbox, 10 tokens for each address that comes back verified and nothing otherwise, so the most it can cost is 10 tokens per lead id sent; leads with no owner named are skipped free. Works on every plan, Free included. Without it (paid plans only; a Free account gets a 403 that says so): search the open web for the people behind the business (owner, founder, director), then resolve and verify their addresses, 25 tokens for each contact whose address comes back verified (10 for the owner the lead names) and nothing for a name without one; the run holds 25 tokens per lead id sent and never charges past it. Separate from enrichment, which names the owner where a business's own site does, with no address checked. This is what reaches local business owners who are not in any LinkedIn-derived contact database. Returns a job id, poll with get_job_status. Outcomes per lead: verified (SMTP-confirmed), published (the address is printed on the company's own site but the domain is catch-all so SMTP cannot confirm it), catch_all (person named, no address obtainable), or searched (no name found).",
          "inputSchema": {
            "properties": {
              "owner_only": {
                "default": false,
                "description": "true = only the owner's own email, for leads that name their owner: 10 tokens per address that comes back verified.",
                "type": "boolean"
              },
              "result_ids": {
                "description": "Lead ids to search. Only leads with a website and no personal email yet are eligible; ineligible ids are skipped and not charged.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "required": ["result_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Find named contacts"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ded96ec78d516fd18cb865f9ab06036e5a07b5b536bdebef51c659afd7d13a5e"
        },
