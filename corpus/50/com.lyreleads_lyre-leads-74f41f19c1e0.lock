      "instructions": "Lyre Leads MCP. Build a list of real businesses from Google Maps, enrich each from its live website, check it really is the trade that was searched for, and find and verify a named contact's email.\n\nWhich search: preview_search is a free sample (one page, nothing saved, no emails) for a user who asks for a preview or has not connected an account. When the user asks to search, find or list businesses, use search_leads (one city, answered at once) or search_areas (whole cities, a background job), even for a single page.\n\nNo account is needed for preview_search, find_areas, estimate_area_search and estimate_list. Every other tool works on the user's own account. In Claude, ChatGPT and other clients that support it, calling one starts sign-in (Google or email; a free account is 500 leads a month with no card). Scripts can instead send \"Authorization: Bearer lyre_...\" with a key from lyreleads.com/account, on any plan. Plans are bought on the website, not through these tools.\n\nAfter a search, each new business is enriched from its own website in the background, about two minutes for 20: the emails it publishes are found (shown as found, not checked), its owner is named where its own site names one (in any country) or, for a US healthcare business, where the national register of healthcare providers does, and it is judged against the search. All of that is included in the search. Verifying an email is a separate step (verify_emails, 3 tokens per address that comes back verified), and so are the owner's own email and finding other named people (find_contacts). Read it with list_results (after search_leads, pass the search_id and wait_seconds 40) or get_search_results (after search_areas). Show the user the business email and its state, the named contact, the software and the relevance verdict, not only the Maps listing, and give them the database_url, which opens these leads on the website with the enrichment visible in the jobs tracker. The summary in those answers counts the whole search, not only the page, so answer from it and show a few leads as examples; the full list is in the Database. Read further pages only when the user asks to see more.\n\nPrices are in tokens: one new lead costs one token, a listing (detail \"listing\": the Google Maps details only, website not read) costs one token per 5 new listings, a verified email costs 3 tokens (charged only when the address comes back verified), the owner's own email costs 10 tokens (find_contacts with owner_only, charged only when it comes back verified), and a contact from contact discovery costs 25 tokens (charged only when their address comes back verified; 10 for the owner a lead names). Contact discovery is on the paid plans; on Free, the owner's email and verification work, and list_results says which to offer. Verification (verify_emails), the owner's email and contact discovery (find_contacts) are the separate, paid steps: offer them only for leads that matched the search, as one question with the most they can cost (3 tokens per lead with an email, 10 or 25 tokens per lead sent), and run them only if the user says yes. The owner's email guesses the address of the owner a lead already names and checks it, no web search; contact discovery searches the open web for an owner or other named people and verifies the addresses it finds as part of the run. Leads judged not to be the kind of business searched for (relevance \"no\") should not get contact discovery or verification unless the user asks; show the user a few of them. Nothing is enrolled in automatic enrichment (a free monthly re-read) on its own: after a search, offer to enroll the matches with enroll_leads (matches only is its default), free within the plan's room.\n\nField definitions and coverage limits, for the user or for you when a field is unclear: https://lyreleads.com/for-agents\n\nFour facts about the data:\n1. When the user asks what we can find them, call estimate_list (free): it returns the exact cost in tokens and every data point each business arrives with. Do NOT answer that question with count_saved_leads. Lyre Leads generates leads on demand, so what an account currently holds is not a measure of what is available, and reporting a small stored count as \"what Lyre Leads has\" is simply wrong.\n2. We are not a contact database. There is no fixed index to filter. The searches go and look at Google Maps live, which is why coverage depends on how many keyword variants and places you search, and on searching them with search_areas (a grid over the whole area) rather than search_leads (one centre, a fraction of a city).\n3. Blank never means zero. Every enrichment field is three-state: a value, a confirmed absence, or unknown. Read enrichment_status before concluding anything from an empty field.\n4. Email states are more than two: found but not checked (no verification status yet: the normal state after a search), verified, published, catch_all, unknown/invalid. Only \"verified\" is SMTP-confirmed. Never present a found address or a catch_all as verified.\n\nTypical flow: find_areas to pin down the places, estimate_area_search (free), search_areas, poll get_job_status with kind \"search\" until finished, then get_search_results with filters {\"relevanceYes\": true} to drop the results that are not the trade that was searched for, count_saved_leads to size what is left, and find_contacts on the ones worth reaching.",
      "tools": [
        {
          "name": "count_saved_leads",
          "title": "Count saved leads",
          "description": "FREE and exact. Counts leads THIS ACCOUNT has already searched and saved, matching any combination of filters, with a breakdown of how many are enriched, have an email, have a contact email, or have been relevance-checked. Use it to size a job over data the account already owns before spending: \"how many of my saved roofers have no CRM and a verified email\". CRITICAL: this is NOT an inventory of what Lyre Leads can find, and a small result here means the account has not searched much yet, nothing more. Never report this number to a user as the amount of data available, and never use it to answer \"how many X do you have\" — call estimate_list for that.",
          "inputSchema": {
            "properties": {
              "ai_crawler_access": {
                "description": "One of: open, partial, blocked, unknown. \"blocked\" = the site is invisible to AI search engines.",
                "type": "string"
              },
              "city": {
                "description": "Substring match on city",
                "type": "string"
              },
              "country": {
                "description": "Substring match on country",
                "type": "string"
              },
              "email_verification_status": {
                "description": "One of: verified, catch_all, unknown, invalid",
                "type": "string"
              },
              "enrichment_status": {
                "description": "One of: enriched, pending, unverifiable, no_website, failed",
                "type": "string"
              },
              "enrolled": {
                "description": "true = enrolled in automatic enrichment: re-read about monthly at no charge. Nothing is enrolled on its own. false = not enrolled; enroll_leads enrolls it, free within the plan's room.",
                "type": "boolean"
              },
              "has_cms": {
                "description": "true = a CMS was detected. false = enriched and none detected (custom/hand-built site).",
                "type": "boolean"
              },
              "has_contact_email": {
                "description": "true = a named contact address is on file.",
                "type": "boolean"
              },
              "has_crm": {
                "description": "true = a CRM was detected. false = enriched and none detected. This is the classic \"they have no CRM, sell them one\" filter.",
                "type": "boolean"
              },
              "has_email": {
                "description": "true = has a business email. false = enriched and confirmed to have none (excludes never-checked rows).",
                "type": "boolean"
              },
              "has_website": {
                "description": "true = has a website. false = enriched and confirmed to have none.",
                "type": "boolean"
              },
              "max_rating": {
                "description": "Maximum Google star rating. Use with min_reviews to find well-reviewed but poorly-rated businesses.",
                "type": "number"
              },
              "max_reviews": {
                "description": "Maximum Google review count",
                "type": "integer"
              },
              "min_rating": {
                "description": "Minimum Google star rating",
                "type": "number"
              },
              "min_reviews": {
                "description": "Minimum Google review count",
                "type": "integer"
              },
              "query": {
                "description": "Substring match on the search keyword that found the lead, e.g. \"roofing\"",
                "type": "string"
              },
              "relevance": {
                "description": "One of: yes, no, unclear. Did a model reading the business website judge it to be the kind of business this row's own search query asked for? Runs inside enrichment at no extra cost, and every verdict carries a verbatim quote from the page in relevance_evidence. Absent means never judged, which is not the same as \"no\". Filter on \"yes\" to drop the results Google Maps returned that are not the trade you searched for.",
                "type": "string"
              },
              "search_id": {
                "description": "Restrict to one batch from search_leads",
                "type": "string"
              },
              "type": {
                "description": "Substring match on the Google Maps business category, e.g. \"Dentist\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Count saved leads"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
