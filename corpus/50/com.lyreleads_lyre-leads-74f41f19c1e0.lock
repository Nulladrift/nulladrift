        {
          "name": "verify_emails",
          "title": "Verify emails",
          "description": "SMTP-verify the business emails on saved leads through MillionVerifier. Costs 3 tokens for each address that comes back verified and nothing for any other answer; an address already verified for that lead within 90 days is not checked or charged again, and the run stops cleanly if the balance runs out. Ask the user first, with the most it can cost (3 tokens per lead with an email), and prefer leads that matched the search. Runs in the background and returns a job id: poll get_job_status with kind \"verify\" until status is completed, then read the summary. Each address ends in one of four honest states: verified, catch_all (the domain accepts everything, so deliverability cannot be proven), unknown, or invalid. Never treat catch_all as verified.",
