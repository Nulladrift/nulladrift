  "subjects": {
    "com.communitymentions/communitymentions": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://communitymentions.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "communitymentions",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CommunityMentions tracks which Reddit communities AI answers (OpenAI models, Perplexity, Gemini) cite: 35,381 citations across 80,500 answers, as of 2026-11-08. find_subreddits matches a product or niche description to the subreddits where it fits, with their AI citations; get_subreddit gives one subreddit's numbers and its most-cited threads. Results link to communitymentions.com.",
      "tools": [
        {
          "name": "find_subreddits",
          "title": "Find subreddits for a product",
          "description": "Use this when someone asks which subreddits or Reddit communities fit a product, brand or niche, or where on Reddit AI answers look for recommendations in a category. Takes a short description such as \"AI writing tool for marketers\" and returns up to 10 matching subreddits, closest match first, with how often AI answers cited each, members and a link to each subreddit's data page. Only subreddits in CommunityMentions' data (cited 50+ times or with 50+ verified comments placed) are included; health, legal-help and adult communities are left out.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "What the product or niche is, in a few words",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "data_as_of": {
                "type": "string"
              },
              "matched_on": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "matches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ai_answers_citing": {
                      "type": ["number", "null"]
                    },
                    "ai_citations": {
                      "type": ["number", "null"]
                    },
                    "category": {
                      "type": "string"
                    },
                    "members": {
                      "type": ["number", "null"]
                    },
                    "page_url": {
                      "type": "string"
                    },
                    "subreddit": {
                      "type": "string"
                    },
                    "threads_cited": {
                      "type": ["number", "null"]
                    },
                    "verified_comments_placed": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["ai_answers_citing", "ai_citations", "category", "members", "page_url", "subreddit", "threads_cited", "verified_comments_placed"],
                  "type": "object"
                },
                "type": "array"
              },
              "median_ai_citations": {
                "type": "number"
              },
              "no_close_match": {
                "type": "boolean"
              }
            },
            "required": ["data_as_of", "matched_on", "matches", "median_ai_citations", "no_close_match"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find subreddits for a product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a4981f65913ad30cb543c1e0434f9a1973b15f1af5f2d142c5aad6946c2ed4fa"
        },
        {
          "name": "get_subreddit",
          "title": "Get a subreddit's AI-citation data",
          "description": "Use this when someone asks how often AI answers cite a specific subreddit, which of its threads get cited, or whether it matters for being recommended by ChatGPT, Perplexity or Gemini. Takes a subreddit name such as \"SaaS\" or \"r/marketing\" and returns its AI citations by engine, the kinds of questions those answers were about, its most-cited threads and its member count.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "subreddit": {
                "description": "A subreddit name, with or without r/",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["subreddit"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "found": {
                "type": "boolean"
              },
              "subreddit": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "ai_answers_citing": {
                        "type": ["number", "null"]
                      },
                      "ai_citations": {
                        "type": ["number", "null"]
                      },
                      "category": {
                        "type": "string"
                      },
                      "citations_by_engine": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "gemini": {
                                "type": ["number", "null"]
                              },
                              "openai_models": {
                                "type": ["number", "null"]
                              },
                              "perplexity": {
                                "type": ["number", "null"]
                              }
                            },
                            "required": ["gemini", "openai_models", "perplexity"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "cited_from": {
                        "type": ["string", "null"]
                      },
                      "cited_to": {
                        "type": ["string", "null"]
                      },
                      "citing_answers_by_question_type": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "comparing_products": {
                                "type": ["number", "null"]
                              },
                              "describing_a_problem": {
                                "type": ["number", "null"]
                              },
                              "looking_to_buy": {
                                "type": ["number", "null"]
                              }
                            },
                            "required": ["comparing_products", "describing_a_problem", "looking_to_buy"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "members": {
                        "type": ["number", "null"]
                      },
                      "most_cited_threads": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "ai_citations": {
                              "type": "number"
                            },
                            "title": {
                              "type": "string"
                            },
                            "url": {
                              "type": "string"
                            }
                          },
                          "required": ["ai_citations", "title", "url"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "page_url": {
                        "type": "string"
                      },
                      "rank_by_ai_citations": {
                        "type": ["number", "null"]
                      },
                      "subreddit": {
                        "type": "string"
                      },
                      "threads_cited": {
                        "type": ["number", "null"]
                      },
                      "verified_comments_placed": {
                        "type": ["number", "null"]
                      }
                    },
                    "required": ["ai_answers_citing", "ai_citations", "category", "citations_by_engine", "cited_from", "cited_to", "citing_answers_by_question_type", "members", "most_cited_threads", "page_url", "rank_by_ai_citations", "subreddit", "threads_cited", "verified_comments_placed"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "suggestions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ai_answers_citing": {
                      "$ref": "#/properties/subreddit/anyOf/0/properties/ai_answers_citing"
                    },
                    "ai_citations": {
                      "$ref": "#/properties/subreddit/anyOf/0/properties/ai_citations"
                    },
                    "category": {
                      "$ref": "#/properties/subreddit/anyOf/0/properties/category"
                    },
                    "members": {
                      "$ref": "#/properties/subreddit/anyOf/0/properties/members"
                    },
                    "page_url": {
                      "$ref": "#/properties/subreddit/anyOf/0/properties/page_url"
                    },
                    "subreddit": {
                      "$ref": "#/properties/subreddit/anyOf/0/properties/subreddit"
                    },
                    "threads_cited": {
                      "$ref": "#/properties/subreddit/anyOf/0/properties/threads_cited"
                    },
                    "verified_comments_placed": {
                      "$ref": "#/properties/subreddit/anyOf/0/properties/verified_comments_placed"
                    }
                  },
                  "required": ["ai_answers_citing", "ai_citations", "category", "members", "page_url", "subreddit", "threads_cited", "verified_comments_placed"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["found", "subreddit", "suggestions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a subreddit's AI-citation data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb4331cde58d4cd143e8f03ac1d280e6ca3cd2fcf551e0f78c6ba4d79e0a17ad"
        }
      ],
      "digest": "sha256:8f43064f6b2b3ebd110edf2efcf3e8b25d62de984e591f36b175c6c7a5e58f9c"
    }
  }
