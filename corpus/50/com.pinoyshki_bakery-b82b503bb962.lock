                },
                "type": "array"
              },
              "delivery_allowed": {
                "type": ["boolean", "null"]
              },
              "earliest_date": {
                "type": ["string", "null"]
              },
              "lane_label": {
                "type": "string"
              },
              "lines": {
                "items": {
                  "properties": {
                    "cake": {
                      "description": "The cake's flavor, message and design, in words, or empty.",
                      "type": "string"
                    },
                    "combo": {
                      "description": "The line's combo upgrade, in words, or empty.",
                      "type": "string"
                    },
                    "if_unavailable": {
                      "description": "The line's backup choice on Toast, in words.",
                      "type": "string"
                    },
                    "line_cents": {
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "photo": {
                      "type": ["string", "null"]
                    },
                    "price_cents": {
                      "type": ["integer", "null"]
                    },
                    "quantity": {
                      "type": "integer"
                    },
                    "size_label": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "quantity"],
                  "type": "object"
                },
                "type": "array"
              },
              "ok": {
                "description": "True when the order is allowed as asked.",
                "type": "boolean"
              },
              "pays_on": {
                "type": "string"
              },
              "problems": {
                "items": {
                  "properties": {
                    "code": {
                      "type": ["string", "null"]
                    },
                    "message": {
                      "type": "string"
                    },
                    "soft": {
                      "description": "True when something is still needed (a date, a time) rather than broken.",
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "staff_tip_cents": {
                "description": "The tip for the bakery staff, 0 when none.",
                "type": "integer"
              },
              "subtotal_cents": {
                "description": "Before tax, with the staff tip; the checkout page shows the final total.",
                "type": "integer"
              },
              "tip_offer": {
                "description": "Toast orders: the staff tip choices in whole dollars and the suggested one.",
                "type": "object"
              },
              "title": {
                "type": "string"
              },
              "today": {
                "description": "Today's date in Seattle, like 'Thursday, September 24'.",
                "type": "string"
              },
              "url": {
                "description": "The link the customer opens to pay. Give it to them as-is.",
                "type": "string"
              },
              "view": {
                "enum": ["checkout", "quote"]
              },
              "when": {
                "type": "string"
              }
            },
            "required": ["lines", "ok", "subtotal_cents", "view"],
            "then": {
              "required": ["url"]
            },
            "type": "object"
          },
