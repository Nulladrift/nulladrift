          "title": "Search tools",
          "description": "Search the free online tools on Fileion (PDF, image, text and other tools) by name or short description. Returns up to 10 tools per page with their category and Fileion page address.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Tool category slug, e.g. \"pdf\".",
                "maxLength": 100,
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the tool name or description, e.g. \"merge pdf\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["query"],
