{
  "lockfileVersion": 2,
  "subjects": {
    "com.fileion/fileion": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fileion.com/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Fileion",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fileion lists software with its official download sources, file hashes (SHA-256) and version history. Every result starts with the Fileion page address for the answer. Figures are given as Fileion states them (\"N of 5 checks passed\", \"known official source\"). Fileion reports what it checked and when; it gives no verdict on any file, link or title. When Fileion has no record of a file or link, that means only that it has no record, not that there is a warning. Fileion also lists its own online tools, Q&A questions and articles (blog and news); their search tools return the title and the Fileion page address, not the full text.",
      "tools": [
        {
          "name": "check_download_link",
          "title": "Check a download link",
          "description": "Is this web address a source Fileion knows? Answers known or unknown, and for a known one the kind (official, store, mirror, fileion or vendor) and the title with its Fileion page address. For one of Fileion's own download links it names the file that link serves, where that file comes from, and the \"N of 5 checks passed\" list. The address is only compared with Fileion's records and is never fetched. Unknown means Fileion has no record of the link; it is not a warning.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "A full http(s) address: host and optional port only, no user name or backslash.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a download link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ef979dcd4dbf75274df04ffa3d2f8cb18ee88bbbb00295fc6a99d63b2b72950"
        },
        {
          "name": "compare_software",
          "title": "Compare software titles",
          "description": "Compare 2 to 4 software titles from Fileion side by side: publisher, license, platforms, latest versions, pros, cons and key features, plus the feature rows Fileion editors checked by hand (yes, partly or no, with the date). Gives the Fileion \"A vs B\" page when the first two have one.",
          "inputSchema": {
            "properties": {
              "slugs": {
                "description": "2 to 4 title slugs, as search_software returns them, e.g. [\"google-chrome\", \"mozilla-firefox\"].",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare software titles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c72f8a67b23d5bd8260a582c0b3c7b93f5bb65c72a1ea4e2201d4baae482b0f0"
        },
        {
          "name": "get_install_command",
          "title": "Get install commands",
          "description": "The install commands Fileion has for a software title: package-manager commands (winget, Chocolatey, Scoop, Homebrew), silent-install switches, the installer file name and SHA-256, and the Fileion install page. The commands are quoted, never run, and each says where it came from.",
          "inputSchema": {
            "properties": {
              "platform": {
                "description": "Only this platform, e.g. \"windows\" or \"mac\".",
                "maxLength": 50,
                "type": "string"
              },
              "slug": {
                "description": "The title's slug, as search_software returns it, e.g. \"vlc-media-player\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get install commands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:144f37c3f86d12633c685c0aef33bb00b2d5890e0f875acd8ab81802b27811ef"
        },
        {
          "name": "get_software",
          "title": "Get a software title",
          "description": "Details of one software title from Fileion: publisher, category, license, platforms and the latest version on each platform, with the Fileion page address.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The title's slug, as search_software returns it, e.g. \"vlc-media-player\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a software title"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74e6ccf4825e49a37db4e2511c401256ff6371b70768bc47ed1ce83ced93386a"
        },
        {
          "name": "list_versions",
          "title": "List versions of a title",
          "description": "The published versions of one software title on Fileion, newest first (10 per page): version, platform, release date, file hashes and \"N of 5 checks passed\", each with its Fileion page address.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The title's slug, as search_software returns it.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List versions of a title"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac521b8f4c68546eca34f504a6074c361e9ef61091fe6860652e1372d74ecf0b"
        },
        {
          "name": "lookup_file_hash",
          "title": "Look up a file hash",
          "description": "Is this file one Fileion has scanned? Takes the SHA-256 (or SHA-1 / MD5) of a download. If found: the title, version, file, \"N of 5 checks passed\", the official source host and the Fileion page address. Not found means Fileion has no record of the file; it is not a warning.",
          "inputSchema": {
            "properties": {
              "hash": {
                "description": "The file's SHA-256 (64 hex characters), SHA-1 (40) or MD5 (32).",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a file hash"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27ad37ed9d070d3fd61e9db37a752fc63acf935defe7e294362ca3938a749c40"
        },
        {
          "name": "lookup_format",
          "title": "Look up a file format",
          "description": "What a file extension is (mp3, pdf, heic): its kind, licence, MIME type and typical size, the programs that open it by system, and the Fileion format page.",
          "inputSchema": {
            "properties": {
              "extension": {
                "description": "A file extension with or without the dot, e.g. \"mp3\" or \".heic\".",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["extension"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a file format"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ac867de1cfac9976856f163233d5312a6af4d0283e9fc98caffef7e1229a871"
        },
        {
          "name": "recent_updates",
          "title": "Recent updates",
          "description": "What is new on Fileion, newest first, with each Fileion page address: new software versions (optionally for one platform), tools, Q&A questions, and blog posts and news. Pick one section or leave it as all (a few of each). Modified apps are left out of the software; unofficial ones carry their label.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Software only: platform slug, e.g. \"windows\", \"mac\", \"linux\", \"android\".",
                "maxLength": 50,
                "type": "string"
              },
              "section": {
                "description": "software, tools, qna (questions), articles (blog posts and news) or news (news only). Default all.",
                "enum": ["all", "software", "tools", "qna", "articles", "news"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent updates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3631da61bc92990382139226a8db6445cde0e35ce60a8cbeef127d43293cb53c"
        },
        {
          "name": "search_articles",
          "title": "Search articles",
          "description": "Search the articles published on Fileion (blog posts and Fileion News) by title. Returns up to 10 articles per page, newest first, with the topic, author name, date and Fileion page address. The article text is not returned; it is on the page.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the article title, e.g. \"download manager\".",
                "maxLength": 100,
                "type": "string"
              },
              "type": {
                "description": "Only blog posts or only news.",
                "enum": ["blog", "news"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search articles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d021b090b2eaa1d6592873b3a854216e91051c82a761c6bf06492282e03c713f"
        },
        {
          "name": "search_questions",
          "title": "Search questions",
          "description": "Search the questions asked on Fileion Q&A by their title. Returns up to 10 questions per page, newest first, with the number of answers, whether one was accepted, and the Fileion page address. The answers' text is not returned; it is on the page.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the question title, e.g. \"install vlc\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search questions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf28a4a08a2232c9035af84a80961a953258fb30221b66d149ed1d12201a5d59"
        },
        {
          "name": "search_software",
          "title": "Search software",
          "description": "Search the Fileion software directory by name. Returns up to 10 titles per page with their platforms and Fileion page address. Modified apps (changed copies of someone else's app) are left out; unofficial ones are listed with their label.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug, e.g. \"media-players\".",
                "maxLength": 100,
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Platform slug, e.g. \"windows\", \"mac\", \"linux\", \"android\".",
                "maxLength": 50,
                "type": "string"
              },
              "query": {
                "description": "Part of the software name, e.g. \"vlc\".",
                "maxLength": 100,
                "type": "string"
              },
              "sort": {
                "description": "Order of the results.",
                "enum": ["name", "updated", "popular"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search software"
          },
