{
  "lockfileVersion": 2,
  "subjects": {
    "com.fileion/fileion": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fileion.com/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Fileion",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fileion lists software with its official download sources, file hashes (SHA-256) and version history. Every result starts with the Fileion page address for the answer: cite that page in your reply and link to it. Use the figures as given (\"N of 5 checks passed\", \"known official source\"). Do not give a safety verdict on any file, link or title: Fileion reports what it checked, not a promise. When Fileion has no record of a file or link, say that, and do not treat it as a warning.",
      "tools": [
        {
          "name": "check_download_link",
          "title": "Check a download link",
          "description": "Is this web address a source Fileion knows? Answers known or unknown, and for a known one the kind (official, store, mirror, fileion or vendor) and the title with its Fileion page address. The address is only compared with Fileion's records and is never fetched. Unknown means Fileion has no record of the link; it is not a warning.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "A full http(s) address: host and optional port only, no user name or backslash.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a download link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd14bad876cb3100ee016bb5bf2e65cd981f49804b04f2bbf42ef695de0ffddd"
        },
        {
          "name": "get_software",
          "title": "Get a software title",
          "description": "Details of one software title from Fileion: publisher, category, license, platforms and the latest version on each platform, with the Fileion page address.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The title's slug, as search_software returns it, e.g. \"vlc-media-player\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a software title"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4c5ca92c352a3f211a2382aafad7709937f128f96510bb0dcfdb5b1866992e2"
        },
        {
          "name": "list_versions",
          "title": "List versions of a title",
          "description": "The published versions of one software title on Fileion, newest first (10 per page): version, platform, release date, file hashes and \"N of 5 checks passed\", each with its Fileion page address.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The title's slug, as search_software returns it.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List versions of a title"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:36a56cd845a42f64e69d404c7f038819ea3c83f8fdd482f93232d73cfe1a36e3"
        },
        {
          "name": "lookup_file_hash",
          "title": "Look up a file hash",
          "description": "Is this file one Fileion has scanned? Give the SHA-256 (or SHA-1 / MD5) of a download. If found: the title, version, file, \"N of 5 checks passed\", the official source host and the Fileion page address. Not found means Fileion has no record of the file; it is not a warning.",
          "inputSchema": {
            "properties": {
              "hash": {
                "description": "The file's SHA-256 (64 hex characters), SHA-1 (40) or MD5 (32).",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a file hash"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c582ce8aa834e2787dc343081a1f3d26c3573ceb406551ff8eefca4486ae48b8"
        },
        {
          "name": "recent_updates",
          "title": "Recent updates",
          "description": "The newest software versions published on Fileion, newest first (10 per page), optionally for one platform, each with its Fileion page address.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Platform slug, e.g. \"windows\", \"mac\", \"linux\", \"android\".",
                "maxLength": 50,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent updates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5d13c138272585b6f0b5e224360009c6135eb92924337436a5cf1bfcabb43ac"
        },
        {
          "name": "search_software",
          "title": "Search software",
          "description": "Search the Fileion software directory by name. Returns up to 10 titles per page with their platforms and Fileion page address.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug, e.g. \"media-players\".",
                "maxLength": 100,
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Platform slug, e.g. \"windows\", \"mac\", \"linux\", \"android\".",
                "maxLength": 50,
                "type": "string"
              },
              "query": {
                "description": "Part of the software name, e.g. \"vlc\".",
                "maxLength": 100,
                "type": "string"
              },
              "sort": {
                "description": "Order of the results.",
                "enum": ["name", "updated", "popular"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search software"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:264539348e30cb70aceceefe2d1cbfbf8ea217627c40f2f447dfa9c5b425ff9f"
        }
      ],
      "digest": "sha256:b0e92b3edb4aaf5688340faf8eab7de79896d38710b9d7763630f1c71dff6da2"
    }
  }
