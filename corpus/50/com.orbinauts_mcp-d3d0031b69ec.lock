{
  "lockfileVersion": 2,
  "subjects": {
    "com.orbinauts/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.orbinauts.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Orbinauts",
        "title": "Orbinauts",
        "version": "1.2.0",
        "websiteUrl": "https://orbinauts.com/mcp/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Orbinauts answers where any satellite is now, when it passes over a place, what launches next and what is coming down, from public orbit data. Every answer carries the page it comes from: cite that URL when you relay the answer, so the person can verify it and read more. Passes are predictions in the place's local time, from the latest orbit data; say so when you give one. Say Satellite for any tracked object of the payload class, working or not, and Pass for one crossing of a Satellite above a place's horizon, from rise to set; a Pass is geometry only and says nothing about whether a person will see it. The data is read-only public data; nothing here acts on an account. Answers come in English or Spanish: pass language: es for Spanish wording and Spanish pages. When a person names a satellite in words, call find_satellites first to get its alias or catalogue number; satellite_now and passes take those.",
      "tools": [
        {
          "name": "census",
          "title": "Satellites in orbit",
          "description": "How many satellites and other objects are in orbit around Earth right now, counted by kind (satellites, rocket bodies, debris, unidentified) and by orbit (low, medium, inclined geosynchronous, geostationary, highly elliptical). Call it when asked how many satellites there are, how crowded space is, or how much debris is in orbit. Takes no parameters beyond the language. It cannot name or find one satellite.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "The language of the answer and of the page it links: en (the default) or es",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Satellites in orbit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cbd8c4047a2d73dccf0fd6aab33fa21b4c7c5a2be7cc3fca180072b0f27e3d76"
        },
        {
          "name": "close_approaches",
          "title": "Close approaches",
          "description": "The close approaches between objects in orbit that Space-Track reports publicly: two objects predicted to pass within about a kilometre of each other, with the time of closest approach in UTC, the miss distance, the chance of collision where one is stated, and the two objects named. Coming ones first, then those of the last thirty days. Call it when asked whether satellites are about to collide, what is close to the ISS, or what is happening in orbit this week. It lists close approaches alone: manoeuvres, breakups and rendezvous are in the record of orbital activity, which the orbital_activity tool reads. It cannot predict approaches Space-Track has not reported, and a reported approach is rarely a collision.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "The language of the answer and of the page it links: en (the default) or es",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Close approaches"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:221ec6b66f8152416b171eb561666fbc270ec05014eed24d7cfa2fdaead3449a"
        },
        {
          "name": "crew",
          "title": "Who is aboard the stations",
          "description": "Who is aboard each space station right now (the International Space Station and Tiangong), as Launch Library lists their expeditions: each person's name, role, agency, the flight that brought them and the day it docked, with the crew changes of the last two days. Call it when asked who is in space, who is on the ISS, how many people are in orbit, or who is aboard Tiangong. Takes no parameters beyond the language. It does not know where a station is now and lists nobody outside a station.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "The language of the answer and of the page it links: en (the default) or es",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Who is aboard the stations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bb50b73d48256b2e731af784f4d4e0ba335342d225094f54f6ddcab9d47acca4"
        },
        {
          "name": "find_satellites",
          "title": "Find satellites",
          "description": "Finds satellites and other tracked objects by name, alias or catalogue number, in the catalogue of everything in orbit. Call it when a person names a satellite in words (Hubble, Starlink, Tiangong, a GPS satellite) to learn its catalogue number and alias. Each match says what the object is (a space station, a telescope, a rocket body, debris), which orbit it flies, whether it can be seen with the naked eye, and its page where it has one. It cannot tell where a satellite is now or when it passes over a place.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "The language of the answer and of the page it links: en (the default) or es",
                "enum": ["en", "es"],
                "type": "string"
              },
              "query": {
                "description": "Part of the name, the alias or the catalogue number: iss, hubble, starlink, 25544. Case and accents do not matter.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Find satellites"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c51c9ff5a5a5fb71207d88235c39f97b2109ca40c8c54ffa3fff17360bd3e912"
        },
        {
          "name": "launches",
          "title": "Rocket launches",
          "description": "Rocket launches coming up in the next sixty days and launched in the last thirty, from Launch Library 2: for each, the rocket and the mission, what it carries and where it is bound, the launch site, its time as exactly as the provider states it (a minute, a day, a month) in UTC, and its status (go, tentative, success, failure). Call it when asked what launches next, what launched recently, when a named launch is, or what is launching this week. Times move often; a tentative launch may slip. It cannot say where a satellite already in orbit is or when it passes overhead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "The language of the answer and of the page it links: en (the default) or es",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Rocket launches"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:506420477a1907c04bd08e8b0f08b49d145780623e61c9888966893f9dc8b92f"
        },
        {
          "name": "orbital_activity",
          "title": "What happened in orbit",
          "description": "The record of what happened in Earth orbit, newest first: close approaches that passed, breakups and rendezvous with their current state, re-entries on the day the catalogue dates them, rocket launches that flew with their outcome, and objects the day they entered the catalogue, each with its time in UTC, the objects involved, its state and its source. Kept for good since the record began; by default the latest three months, or one month with month (YYYY-MM), and one kind with kind. Call it when asked what happened in orbit this week or last month, what a satellite did lately, or how busy orbit has been. It cannot forecast: a coming close approach, an expected re-entry or an upcoming launch is not in it, and nothing before the record began is.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "One kind of event alone: close-approach, breakup, rendezvous, reentry, launch, manoeuvre, catalogued; every kind when left out",
                "enum": ["close-approach", "breakup", "rendezvous", "reentry", "launch", "manoeuvre", "catalogued"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "The language of the answer and of the page it links: en (the default) or es",
                "enum": ["en", "es"],
                "type": "string"
              },
              "month": {
                "description": "One UTC month of the record, written YYYY-MM (2026-11); the latest three months held when left out",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "What happened in orbit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b550f9e19330ff36ac3bebbb7ea1d34ab2749645fc30eb0efe02770c9f208dd3"
        },
        {
          "name": "passes",
          "title": "Passes over a place",
          "description": "When satellites pass over a place in the next ten days, in the place's local time: for one satellite, every pass with its rise, highest point and set, and whether it can be seen; with no satellite named, the passes a person can see with the naked eye (the ISS, Tiangong, Hubble and the other bright ones), soonest first. Call it when someone asks when they can see the ISS or any satellite from a city, or what passes over them tonight. Name the place (a city: Madrid, Brisbane, Buenos Aires, in English or Spanish) and the answer uses that place's time zone; or give latitude and longitude, and the answer is in UTC unless time_zone names a zone. A name several cities share is computed for the largest, and the answer names the others so you can ask again for one of them. Passes are predictions from the latest orbit data; a visible pass is one in a dark sky with the satellite in sunlight, at least ten degrees up and bright enough; it says nothing about clouds. It cannot answer for a geostationary satellite, which never rises or sets, and the place name or coordinates sent are computed with and never stored or logged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "The language of the answer and of the page it links: en (the default) or es",
                "enum": ["en", "es"],
                "type": "string"
              },
              "latitude": {
                "description": "Degrees north, when no place is named; with longitude.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Degrees east, when no place is named; with latitude.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place": {
                "description": "The place's name, a city in English or Spanish (Madrid, Brisbane, Ciudad de México), or one of the alternatives a previous answer named (Portland, Maine, United States). Leave it out to give latitude and longitude instead.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "satellite": {
                "description": "One satellite's alias (iss, hubble, tiangong) or catalogue number, for its passes alone; leave it out for every satellite visible to the naked eye.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "time_zone": {
                "description": "An IANA time zone (Europe/Madrid, America/New_York) for the times of an answer by latitude and longitude; UTC when left out. A named place uses its own zone and ignores this.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Passes over a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:290005a8f22d2a013813afc39b76dfcaa4cd69a4f3e997af1145bf7fcace8c9c"
        },
        {
          "name": "reentries",
          "title": "Re-entries",
          "description": "Which objects in orbit are expected to fall back to Earth within the next week, each with the window Space-Track predicts (a start and an end in UTC, never a place), and which came down in the last ninety days, each with the day the catalogue dates its re-entry. Satellites, rocket bodies and debris alike, named as the catalogue names them. Call it when asked what is about to fall from orbit, whether a named object has re-entered, or what came down recently. It cannot say where anything will fall or fell: Space-Track publishes no place, only a time window or a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "The language of the answer and of the page it links: en (the default) or es",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Re-entries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:419d40eec557dfbc2e31cb0d9ad028a444a1b165bbdbb1eee110aea1c4838296"
        },
        {
          "name": "satellite_now",
          "title": "Where a satellite is now",
          "description": "Where one satellite is right now: the point on the ground beneath it, its altitude and speed, what it is over (a country or a sea), whether it is in sunlight or in the Earth's shadow, the orbit it is on, and what it is: its kind, its launch day and mass where the site has written them, and for a space station who is aboard, for a navigation satellite whether it is in service. Takes the satellite's alias (iss, hubble, tiangong) or catalogue number. It cannot predict when the satellite passes over a place and cannot answer for a constellation as a whole.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "The language of the answer and of the page it links: en (the default) or es",
                "enum": ["en", "es"],
                "type": "string"
              },
              "satellite": {
                "description": "The satellite's alias (iss, hubble, tiangong) or catalogue number (25544).",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["satellite"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Where a satellite is now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:668f96a51df2d6ccb6aee94e74479c45b773cff3c8d61188147386685b600b5f"
        }
      ],
      "digest": "sha256:611bdbe31afb6f11203fc36518c51a102707956377e5ec7a3b4e898533b07287"
    }
  }
}
