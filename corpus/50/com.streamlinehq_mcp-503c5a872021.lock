                  "required": ["categoryName", "categorySlug", "hasPremiumAccess", "hash", "imagePreviewUrl", "isFree", "name", "setName", "setSlug", "setWebUrl", "subcategoryName", "subcategorySlug", "webUrl"],
                  "type": "object"
                },
                "type": "array"
