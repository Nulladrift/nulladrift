                  }
                },
                "required": ["hasMore", "nextOffset", "offset", "total"],
                "type": "object"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "categoryName": {
                      "type": "string"
                    },
