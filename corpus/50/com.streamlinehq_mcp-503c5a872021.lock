        {
          "name": "get_family_extra_details",
          "title": "Get full family details",
          "description": "Use this when comparing Families for a project needs more detail than `search_families` returned. Not needed once a Family is chosen. Next: `get_all_sets_from_family`. Returns full semantic text for a family (bundle) in four sections: fit & recommendations, brand & cultural identity, visual & technical specs, and pairing & compatibility. Also returns the family license. Use when you need richer metadata to choose between family groups after `search_families` or `get_all_families` or when comparing multiple families. Pass the exact familySlug from those results; do not invent slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "familySlug": {
                "description": "slug of the family from `search_families` or `get_all_families`.",
