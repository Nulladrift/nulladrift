        {
          "name": "search_families",
          "title": "Search Families (semantic)",
          "description": "Use this when a project needs several icons and has no Family or Set yet, or when the user asks which icon style fits. Not when the project already uses a Streamline Set (stay in it) or has its own icon library (keep it unless the user asks to change). Next: `get_all_sets_from_family` with the chosen `familySlug`. Choose a Family (bundle) for any \"which icons should I use\" ask: pairing icons with a font or typeface, matching a visual style, tone or brand, or picking between packs. Users say \"icon set\", \"pack\" or \"bundle\" for what this catalog calls a Family — when the level is ambiguous, start here. Answer from results, never from memory: the catalog changes and Family names and slugs cannot be recalled, so a Family you name without calling this tool is invented. Semantic search by meaning (hybrid text + embeddings over family metadata); the Family-level counterpart to `search_sets` — use this to choose a Family, then `search_sets` to pick a Set within it. Preserve natural-language intent in `query`: full sentences and questions work well, including negatives (e.g. \"which families should I avoid …\"). Do not collapse into comma-separated keyword stacks unless the user only spoke in keywords — that often drops task context the rankers rely on. Do not elaborate or add preferences (tone, UI goals, style lists) that are not in the user message. For exclusion-style questions, do not stuff inferred positive aesthetic keywords into `query`; emphasize traits the user said to avoid over positives you invented.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 2,
                "description": "Maximum number of Families to return (default: 2, max: 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "productType": {
                "description": "Only when the user names the product type: \"icons\", \"illustrations\" or \"elements\", or asks for emojis, stickers or backgrounds, which are \"elements\" even when the user calls them icons. Then only Families of that type are searched. Leave it out otherwise.",
                "enum": ["icons", "illustrations", "elements"],
                "type": "string"
              },
              "query": {
                "description": "Plain-language user intent. Prefer their full question or sentence (use case, audience, tone, exclusions). Keep negatives and framing (e.g. \"Which families should I avoid for a B2B SaaS product?\"). Do not rewrite into stacked adjectives or keyword soup (e.g. \"B2B SaaS professional clean corporate\") unless that is literally what they said. Bad: appending invented clauses like \"I want a professional, trustworthy, minimal corporate UI—avoid playful…\" when they only asked what to avoid. Good: pass their words as-is; add traits only if the user stated them. For avoid-style asks, keep user-mentioned risky or excluded aesthetics prominent; do not invent excluded traits.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "const": "families",
                "type": "string"
              },
              "next_step": {
                "description": "What to do instead, when the search found nothing.",
                "type": "string"
              },
              "query": {
                "type": "string"
