        {
          "name": "search_assets",
          "title": "Search assets",
          "description": "Use this when a project needs icons, illustrations or elements, such as a landing page, app screen or component being built, rather than drawing SVG or using emoji, or when the user asks for an icon by concept or name. For several icons, choose one Set first and pass its `slug` as `setSlug`. Not for choosing a style (`search_families`), and not when the work adds no icons or the project keeps its own. Next: `download_multiple_assets` for several icons, `download_asset` for one. Search icons, illustrations, or elements. With a non-empty `setSlug`, search within that Set. Else with a non-empty `familySlug`, search within that Family (bundle). Otherwise global search — requires `productType`. Answer from results, never from memory: asset names, slugs and hashes cannot be recalled, so any icon you name without calling this tool is invented. For a multi-icon request (\"save, edit, delete, user\"), return every requested icon from ONE Family so the group reads as a system; if one is missing there, take the closest match inside that Family rather than mixing Families. Line suits default and inactive states, Solid or Bold active ones. Commit to a count rather than padding: 1–5 icons for a specific concept, up to 10 when the user is exploring. When the user names specific assets (\"House 3, Hyperloop\"), pass them all as a comma-separated `query` with `exactNames: true` and the `setSlug` or `familySlug` they belong to, in one call; set `limit` to cover every match, since one name can match several assets.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "exactNames": {
                "default": false,
                "description": "When true, `query` is a comma-separated list of exact asset names (e.g. \"House 3, Hyperloop\"), matched case-insensitively, up to 50 names. Requires `setSlug` or `familySlug`. Use when the user names specific assets.",
                "type": "boolean"
              },
              "familySlug": {
                "description": "Family (bundle) slug from `search_families` or `get_all_families`. When set (non-empty) and `setSlug` is omitted, search is scoped to this Family.",
                "type": "string"
              },
              "language": {
                "description": "Optional source language of `query`. Options: `en` (English), `fr` (French), `de` (German), `es` (Spanish Spain), `es-MX` (Spanish Latin America), `pt` (Portuguese Brazil).",
                "enum": ["en", "fr", "de", "es", "es-MX", "pt", "pt-PT", "hi", "ko", "ja"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Specifies the maximum number of items to return in the response (default: 20, max: 100).",
                "maximum": 100,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "Specifies the number of items to skip before starting to return results (default: 0).",
                "minimum": 0,
                "type": "number"
              },
              "productTier": {
                "default": "all",
                "description": "Filter for the price tier of the products. Used for global search and Family (bundle) search. E.g., if \"free\", results will only be from free Sets.",
                "enum": ["all", "free", "premium"],
                "type": "string"
              },
              "productType": {
                "description": "Required for global search only (when both `setSlug` and `familySlug` are omitted). Asset type: icons, illustrations, or elements.",
                "enum": ["icons", "illustrations", "elements"],
                "type": "string"
              },
              "query": {
                "description": "Search term. Translate abstract concepts into concrete visual nouns when searching globally. NEVER mix different concepts in the same query. At most 100 characters, or 2000 with `exactNames`.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "setSlug": {
                "description": "Set slug from `search_sets`, `find_sets_by_name`, or `get_all_sets_from_family`. When set (non-empty), search is scoped to this Set (takes precedence over `familySlug`).",
                "type": "string"
              },
              "style": {
                "description": "Filter for the style of the Sets. Global search only; applies when `productType` is \"icons\".",
                "enum": ["line", "solid", "flat", "duo", "hand-drawn", "creative", "gradient", "remix", "neon", "pop", "light", "glyph", "minimal", "outlined", "geometric", "bold", "stroke", "wireframe", "filled"],
                "type": "string"
              },
              "userContext": {
                "description": "User context from the \"get user profile\" tool (`get_user_context`). Always call that tool first if you do not have userContext yet. Do not guess.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query", "userContext"],
            "type": "object"
          },
