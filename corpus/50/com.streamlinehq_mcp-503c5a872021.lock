        {
          "name": "search_sets",
          "title": "Search Sets (semantic)",
          "description": "Use this when the user describes the Set they want in words, or wants a Set inside a known Family, and icons are needed. Not for a name the user typed (`find_sets_by_name`). Next: `search_assets` with the chosen `slug` as `setSlug`. Semantic search for Sets by natural-language query: discovers Sets by meaning, not by substring on the stored name. Optionally scoped with `familySlug` to narrow results to a specific Family. For substring / partial name match on stored names, use `find_sets_by_name` instead — these do different things and must not be confused. Use `get_all_sets_from_family` when you already know the Family and want the full list with no search intent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "familySlug": {
                "description": "When set, only return Sets belonging to this Family. Use the Family slug from `search_families` (`familySlug`) or `get_all_families` (`slug`).",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of Sets to return (default: 20, max: 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
