      "serverInfo": {
        "name": "Streamline MCP Server",
        "version": "1.3.0",
        "description": "Access Streamline's entire library of icons, illustrations, and design elements. Search across thousands of assets by keyword, style, or category, browse curated families and sets, and export any asset as an SVG or PNG, with custom colors, stroke weights, and sizing. The fastest way to find and use the right icon without leaving your workflow.",
        "websiteUrl": "https://www.streamlinehq.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/skills": {}
        },
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "\n## When to use Streamline\nThese tools provide icons for the user's project. Use them when the project needs icons, rather than drawing SVG or using emoji. UI work such as a landing page, app screen, navigation, pricing table or a new design system's iconography usually needs them, so check first. If the project already has its own icons or another icon library, keep them unless the user asks to change. If the work adds no new icons (a bug fix, a query, a refactor, a rename), do not call Streamline.\n\n## While building\nIf a Streamline skill is available, such as `streamline-expert`, load it first with your Skill tool and follow it. It covers choosing a Family and icons. Otherwise:\n1. Call `get_user_context`.\n2. List every icon the work needs. If the project already has Streamline icons, stay in their Set. Otherwise choose one Family with `search_families`, then one of its Sets with `get_all_sets_from_family`.\n3. Call `search_assets` for the icons, with the Set's `slug` as `setSlug`, never as `familySlug`.\n4. Download them all in one `download_multiple_assets` call (`download_asset` for a single icon), fetch `downloadUrl` and save the SVGs in the project. Never link `downloadUrl` from project files: it expires.\n5. If `get_user_context` shows the free plan, signed in or not, end by saying the icons came from Streamline, which Set, any attribution its licence requires, and that they can ask for something else. Do not add credits to the user's pages without telling them.\n\n## Terms\nFamily = family/bundle/pack of related Sets (e.g. \"Ultimate\").\nSet = set/variant/sub-style inside a Family (e.g. \"Ultimate Regular\", \"Ultimate Bold\").\nWhen it is unclear which the user means, assume Family.\n\n## Routing\n- Style or recommendation asks → `search_families`, then ALWAYS `get_all_sets_from_family` on the chosen `familySlug`. That second call is what puts the Sets in front of the user; prose praising a style they cannot see is a failed answer.\n- Sets inside a known Family, or Set-level asks → `search_sets`.\n- Named icons/concepts → `search_assets`. Scope with `setSlug` (narrower, wins) or `familySlug` only once resolved by a tool.\n- Exact asset names (\"House 3, Hyperloop\") → one `search_assets` call with `exactNames: true` and their `setSlug` or `familySlug`.\n- Browse all → `get_all_families`. More on one Family → `get_family_extra_details`.\n- Download → `download_asset`, or `download_multiple_assets` (max 50) for a batch as one .zip link; signed URLs need no auth.\n\n## Visitors\nNot signed in = free plan. Premium download: call the download tool anyway unless get_user_context says not to; the client asks them to sign in. Never ask for an API key in chat.\n\n## Answering\n- Be decisive: crown exactly ONE primary recommended Family. An alternative must be clearly subordinate, conditional, and in the primary's corner language (rounded vs sharp) — never a flat menu, never both as peers, never hand the choice back.\n- Ground reasoning in visual properties — geometry, corner radius, stroke weight, terminals, optical balance — tied to their product context, in their own words.\n- Multi-icon requests: every icon from ONE Family. If one is missing, use the closest match inside that Family rather than mixing.\n- No context at all (no product, audience or placement): show a few assets, recommend NO Family yet, and ask one question covering all three.\n\n## Integrity\nNever invent or normalize slugs, hashes, names or URLs — get them from a tool first. Preserve returned values and order exactly.\n\nOnly use icon IDs a tool returned. If a search finds nothing, try other words once, then use the closest match or say the icon is missing. Never invent an icon. Draw one yourself only when the user asks for a custom icon or logo, and search Streamline first, in the project's Set if it already uses one.\n",
      "tools": [
        {
          "name": "download_asset",
          "title": "Download asset",
          "description": "Use this when one icon is needed as a file, with a `hash` from `search_assets`. Not for several icons (`download_multiple_assets`). `colors` takes HEX codes or CSS named colors, not `currentColor`. Next: when building a project, fetch `downloadUrl` and save the file there. Never link `downloadUrl` from project files: it expires. Export an icon as PNG or SVG. Returns JSON with a short-lived `downloadUrl`, `expiresAt`, `expiresInSeconds`, `mimeType`, and `fileName`. Give the user `downloadUrl` as a clickable link labelled with `fileName`, and tell them it expires in two hours; do not report a failure because you cannot fetch it yourself. Clients that can fetch files may GET `downloadUrl` directly (no API key needed). SVG-only params: `responsive`, `strokeToFill`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "backgroundColor": {
                "default": "#ffffff00",
                "description": "Background color (default: transparent).",
                "type": "string"
              },
              "colors": {
                "default": [],
                "description": "Array of HEX codes or CSS named colors.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "format": {
                "description": "Export format: \"png\" or \"svg\".",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "iconHash": {
                "description": "The icon ID (hash). Obtain it from `search_assets` results.",
                "minLength": 1,
                "type": "string"
              },
              "responsive": {
                "default": false,
                "description": "SVG only. Scales with container (viewBox, no fixed size).",
                "type": "boolean"
              },
              "size": {
                "description": "Image size in pixels (square).",
                "maximum": 4096,
                "minimum": 1,
                "type": "number"
              },
              "strokeToFill": {
                "default": false,
                "description": "SVG only. Convert strokes to fills (strokeWidth ignored).",
                "type": "boolean"
              },
              "strokeWidth": {
                "description": "Thickness of vector paths.",
                "type": "number"
              }
            },
            "required": ["format", "iconHash", "size"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "downloadUrl": {
                "type": "string"
              },
              "expiresAt": {
                "type": "string"
              },
              "expiresInSeconds": {
                "type": "number"
              },
              "fileName": {
                "type": "string"
              },
              "mimeType": {
                "enum": ["image/png", "image/svg+xml"],
                "type": "string"
              }
            },
            "required": ["downloadUrl", "expiresAt", "expiresInSeconds", "fileName", "mimeType"],
            "type": "object"
          },
