      "instructions": "Chamfer: Made-to-print parts and MRO for engineers and buyers with a made-to-print part to quote, and maintenance buyers looking for a specific part or machine. A drawing a shop can quote the first time. Chamfer helps engineers and buyers get made-to-print parts quoted: it assembles an RFQ a machining, molding, sheet metal or PCB assembly shop can price without a round of questions, plans lead time stage by stage against the arrival date, and compares the quotes received on landed cost. It also takes requests for specific MRO parts and machines by manufacturer and part number. Chamfer looks at every request and replies when it can find a shop or seller or get the part quoted; nothing is ordered until the buyer agrees terms. Use list_propositions to see Chamfer's services, describe_proposition for one of them, then submit_request or an operation tool.",
      "tools": [
        {
          "name": "accept_offer",
          "title": "Accept an offer and place the order",
          "description": "Place an order on terms you have inspected and the buyer has authorized you to accept. Requires the exact terms hash and explicit acceptance. Follow inspect_offer later for payment links and verified payment state.",
