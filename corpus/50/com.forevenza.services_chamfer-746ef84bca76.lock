        {
          "name": "interpret_requirement",
          "title": "Describe a need to Chamfer in words",
          "description": "Give Chamfer the buyer's requirement, or a correction or addition to it, in their own words: it is read into a structured requirement (each value says which words it came from), conflicting or unclear facts come back as one question, and words not yet read are kept as written. Pass the requirement (id, token) from the first answer to continue it. Nothing is sent or ordered: send_requirement sends it when the buyer says so. When you already have the fields in structured form, use submit_request instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "requirement": {
                "description": "The requirement to continue",
                "properties": {
                  "id": {
                    "description": "The requirement id from an earlier answer",
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  "token": {
                    "description": "Its private token (also the receipt token of the request it is sent as); keep it private",
                    "pattern": "^[0-9a-f]{48}$",
                    "type": "string"
                  }
                },
                "required": ["id", "token"],
                "type": "object"
              },
              "slug": {
                "description": "The service, from list_propositions",
                "enum": ["contract-manufacturing", "industrial-equipment"],
                "type": "string"
              },
              "timezone": {
                "description": "The buyer's IANA time zone, for reading dates",
                "maxLength": 64,
                "type": "string"
