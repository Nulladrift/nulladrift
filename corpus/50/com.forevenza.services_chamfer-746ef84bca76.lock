            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accept": {
                "const": true,
                "type": "boolean"
              },
              "id": {
                "description": "The request or offer id from your receipt or customer link",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "organization": {
                "maxLength": 160,
                "type": "string"
              },
              "purchase_order": {
                "maxLength": 80,
                "type": "string"
              },
              "terms_sha256": {
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "token": {
                "description": "Private token from your receipt or customer link; keep it for later visits",
                "pattern": "^[0-9a-f]{48}$",
                "type": "string"
              }
            },
            "required": ["accept", "id", "name", "terms_sha256", "token"],
            "type": "object"
          },
