          "name": "create_upload",
          "title": "Create Upload",
          "description": "Prepare a private binary upload. Supply productId from list_products; POST image bytes separately to uploadUrl with the returned headers and credential. No storage is allocated until POST. Reuse an Idempotency-Key for identical bytes/options; GET /api/uploads/{key} recovers a lost response. No base64 or remote image URLs in MCP. Read returned image limits. SDK: /sdk/photo-upload.mjs. Guest checkout needs no sign-in: pass the private guestToken from start_guest_checkout, or use your existing OAuth connection, never both.",
