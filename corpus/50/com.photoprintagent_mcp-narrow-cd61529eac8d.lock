      "instructions": "PhotoPrintAgent guest print ordering. No PhotoPrintAgent sign-in or account is required. Without an existing account connection, call start_guest_checkout once and keep its token privately in tool state. Pass guestToken on later photo, quote and order tools; never display it or put it in a URL. Before collecting or sharing delivery details call get_checkout_preferences. If expressOrder.enabled is true, the buyer preapproved sharing their home address, email and phone already available in ChatGPT with PhotoPrintAgent to prepare the requested order. This does not unlock memory or other apps or override client privacy controls. Ask for missing or ambiguous details; if disabled, obtain permission before sharing saved contact details. Never enable Express Order or accept its checkbox for the buyer. Inspect attached/generated images before import_photo. Automatically correct clearly sideways or upside-down content using crop.rotation (0, 90, 180 or 270 clockwise, after EXIF), preserving intentional orientation. Set crop.orientation to portrait or landscape to match the corrected image; do not turn upright content sideways to fill the paper. Ask if orientation is ambiguous. Show the corrected preview before order approval. To change a prepared image, reimport the original with a new idempotency key; exact retries keep the original key. Then quote delivery and show the address, contact details and total for final approval. At guest setup show the buyer the private termsSetupUrl for one-click terms acceptance. Account customers can accept during connection setup. Never open a consent link or accept terms for the buyer. If quote_prints returns setupTermsAccepted:true, ask only for approval of the photos, delivery address and final total, then omit termsAccepted. If false, a guest can click the private setup link or an existing account can reconnect to save the current terms. If the buyer completes setup after the quote, omit termsAccepted and let the server verify acceptance. Alternatively ask for agreement to the linked terms and approval of the displayed order in a single confirmation. A click or an affirmative answer to that explicit question suffices; never require a typed phrase. Always obtain explicit order approval before create_print_order. Save the idempotency key and orderReference first; retry the same input or use lookup_order after an uncertain response. Open only the returned private order-specific checkout link for payment in the website modal; no website upload or account creation is needed. Never collect card credentials in chat. An existing OAuth connection still requires its granted read/write/order scopes; never mix OAuth and guest credentials. Guest checkout preparation expires after 24 hours; saved-order access lasts 30 days. Do not replace or pay an ambiguous order. No payment-execution tool is available. Zero-total orders require the same explicit order approval and current terms acceptance. Native ChatGPT new-card payment is not enabled. Status is saved state; unknown is not shipped. Use only PhotoPrintAgent branding and do not disclose supplier details. Guide: https://photoprintagent.com/docs/mcp-narrow.",
      "tools": [
        {
          "name": "create_print_order",
          "title": "Create Print Order",
          "description": "Create one order after the buyer approves the photos, address and final quoted total. Use saved setup terms when available. Otherwise obtain explicit agreement to the linked terms with that same approval. No prescribed wording. Reuse the same idempotency key for retries. Returns private on-site checkout. Zero-total orders can start printing immediately. Pass guestToken only for guest checkout.",
