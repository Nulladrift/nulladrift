      "instructions": "PhotoPrintAgent narrow customer connector: browse products, estimate costs, preview existing uploads, save quotes and read saved order status or request support. Upload photos and complete purchases at https://photoprintagent.com. No order creation, payment execution, account administration or AI generation is available here. Saved status can lag processing; unknown is not shipped. Only PhotoPrintAgent product branding and public product codes may appear in customer updates. Never disclose supplier information. A support request is not a completed cancellation or refund.",
      "tools": [
        {
          "name": "estimate_print_price",
          "title": "Estimate Print Price",
          "description": "Estimate configured product and shipping charges using only product, quantity, ZIP and state. No photos or contact details required. Unknown tax or charges remain null; this is not a payable quote.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "productId": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "quantity": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "zip": {
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["productId", "quantity", "state", "zip"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "const": "USD",
                "type": "string"
              },
              "estimate": {
                "const": true,
                "type": "boolean"
              },
              "knownAmount": {
                "type": "number"
              },
              "message": {
                "type": "string"
              },
              "productId": {
                "type": "string"
              },
              "quantity": {
                "type": "number"
              },
              "requiresFinalQuote": {
                "const": true,
                "type": "boolean"
              },
              "shipping": {
                "type": ["number", "null"]
              },
              "subtotal": {
                "type": ["number", "null"]
              },
              "tax": {
                "type": ["number", "null"]
              },
              "total": {
                "type": ["number", "null"]
              },
              "unknownComponents": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["currency", "estimate", "knownAmount", "message", "productId", "quantity", "requiresFinalQuote", "shipping", "subtotal", "tax", "total", "unknownComponents"],
            "type": "object"
          },
