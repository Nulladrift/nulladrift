      "instructions": "PhotoPrintAgent focused print ordering. Import attached/generated chat images with import_photo, preview artwork, quote delivery and save buyer-approved card orders with create_print_order. OAuth mcp:write allows uploads/quotes; mcp:orders requires separate connection consent. Never collect card credentials in chat. New-card payment currently uses the returned secure checkout; native ChatGPT payment requires OpenAI enablement. Status is saved state; unknown is not shipped. Guide: https://photoprintagent.com/docs/mcp-narrow.",
      "tools": [
        {
          "name": "create_print_order",
          "title": "Create Print Order",
          "description": "Create one buyer-approved order from a saved quote. Requires explicit termsAccepted and buyerApproved. Save orderReference and idempotencyKey first; retry identical input with the same key, or recover with lookup_order. Returns private on-site checkout. Zero-total orders submit without payment. Coupon must match the approved quote.",
