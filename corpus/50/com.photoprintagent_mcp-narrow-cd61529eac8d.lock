        {
          "name": "request_order_help",
          "title": "Request Order Help",
          "description": "Create an order-bound support, address-change, cancellation or refund REQUEST. Requires buyer authorization. No cancellation, refund or change is executed or guaranteed. Reuse idempotencyKey when retrying the same request; read progress capability flags first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "idempotencyKey": {
                "pattern": "^[\\w-]{16,100}$",
                "type": "string"
              },
              "message": {
                "maxLength": 2000,
