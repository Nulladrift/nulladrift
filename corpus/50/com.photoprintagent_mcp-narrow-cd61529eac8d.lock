                        "const": 90,
                        "type": "number"
                      },
                      {
                        "const": 180,
                        "type": "number"
                      },
                      {
                        "const": 270,
                        "type": "number"
                      }
                    ],
                    "description": "Clockwise image rotation after EXIF orientation, before cropping. Inspect the image and correct clearly sideways or upside-down content automatically; preserve intentional orientation. Choose portrait/landscape separately to match the corrected image."
                  },
                  "x": {
                    "default": 50,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
