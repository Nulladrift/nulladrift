{
  "lockfileVersion": 2,
  "subjects": {
    "com.desarrollomcp/desarrollomcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://desarrollomcp.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "desarrollomcp",
        "title": "DesarrolloMCP",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Servidor MCP de DesarrolloMCP, curso y blog en español sobre Model Context Protocol. buscar, ver_temario, ver_leccion, ver_planes, listar_articulos y leer_articulo funcionan sin cuenta. mi_cuenta, mi_progreso y leer_leccion necesitan que el alumno inicie sesión: mi_cuenta dice qué nivel tiene, mi_progreso qué lecciones ha completado y cuál le toca, y leer_leccion devuelve el texto completo de una lección a la que tiene acceso, para explicársela o repasarla con él. Cita siempre la URL de cada lección o artículo.",
      "tools": [
        {
          "name": "buscar",
          "title": "Buscar en el curso y el blog",
          "description": "Busca por palabras en las lecciones del curso y en los artículos del blog. Devuelve título, resumen, tipo (articulo o leccion), id (el slug que piden las demás herramientas) y URL de cada resultado, los más relevantes primero. Úsala primero cuando la persona pregunta por un tema y no sabes qué página lo trata. Después, lee el resultado con leer_articulo (artículos) o con ver_leccion / leer_leccion (lecciones). Si no hay resultados, prueba con sinónimos o en inglés, o recorre todo con ver_temario y listar_articulos.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "consulta": {
                "description": "Palabras a buscar, en español o inglés, de 2 a 100 caracteres (p. ej. «oauth», «servidor python», «mcp apps»).",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "limite": {
                "default": 5,
                "description": "Número máximo de resultados, de 1 a 10 (5 por defecto).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "tipo": {
                "default": "todo",
                "description": "Dónde buscar: «todo» (por defecto), «articulo» solo en el blog o «leccion» solo en el curso.",
                "enum": ["todo", "articulo", "leccion"],
                "type": "string"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:4850531cc35f46edf69e2c8b725b2fae661921a084e4ccc85d92e64db6000dd7"
        },
        {
          "name": "leer_articulo",
          "title": "Leer un artículo",
          "description": "Texto completo de un artículo del blog en Markdown, con su título, fecha, URL y las lecciones del curso relacionadas. No necesita cuenta. Úsala cuando ya tienes el slug (de buscar o listar_articulos) y necesitas el contenido para responder o resumir; cita la URL del artículo. Si el slug no existe, búscalo con buscar.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Slug del artículo, hasta 120 caracteres, sin /blog/ (p. ej. «que-es-mcp»). Lo devuelven buscar y listar_articulos.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:3233da6d38adaf08ab919e0299436933f85aa170fb163ba73edca937c9990970"
        },
        {
          "name": "leer_leccion",
          "title": "Leer una lección",
          "description": "Texto completo de una lección del curso, en Markdown, si el alumno tiene acceso (la 01 y el Básico con su cuenta; Avanzado y Experto si los ha comprado). Si no tiene acceso, devuelve la ficha pública y cómo conseguirlo. Necesita iniciar sesión. Úsala para estudiar o explicar una lección concreta con su texto; para saber de qué trata sin cuenta basta ver_leccion. Máximo 60 lecciones al día por alumno desde el servidor MCP; en la web no hay límite.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Slug de la lección, hasta 80 caracteres: «03-ciclo-vida» en el Básico o con el prefijo del nivel, como «avanzado/02-integraciones-apis» (ver_temario los lista).",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["curso:leer"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:5f5fa5bec88d9e6233bc7bd18c0bb8945feb85839f7185882e8881ae054ccf59"
        },
        {
          "name": "listar_articulos",
          "title": "Artículos del blog",
          "description": "Artículos publicados del blog, del más reciente al más antiguo, con slug, fecha, tema, resumen y URL. Se puede filtrar por tema y paginar. Úsala para ver las novedades o todo lo publicado sobre un tema; si buscas algo concreto, usa buscar. Lee después el que interese con leer_articulo. Si hay_mas es true, vuelve a llamarla con desde igual a la posición siguiente.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "desde": {
                "default": 0,
                "description": "Posición desde la que listar, de 0 a 500 (0 por defecto): para la página siguiente, súmale el límite.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "limite": {
                "default": 10,
                "description": "Artículos por página, de 1 a 20 (10 por defecto).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "tema": {
                "description": "Tema del artículo: a2a-agentes, mcp, mcp-apps, servidores, skills, webmcp.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:4e95a1222aa6e3edbd01745297c8405713265b5f033ed60b482485e43785a61c"
        },
        {
          "name": "mi_cuenta",
          "title": "Mi cuenta",
          "description": "Datos de la cuenta del alumno que ha iniciado sesión: email, nivel del curso al que tiene acceso, niveles con acceso, fecha de alta y, si no tiene el nivel más alto, cómo ampliarlo. Necesita iniciar sesión. Úsala para saber qué puede leer la persona antes de recomendarle lecciones o un plan; para lo que lleva hecho, usa mi_progreso, y para los precios, ver_planes. No tiene parámetros.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["curso:leer"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:15f801e4f499b5b6e76b167f0ee471a2f230b8f5d9829ba71e9f1e0e4b28a112"
        },
        {
          "name": "mi_progreso",
          "title": "Mi progreso",
          "description": "Progreso del alumno en el curso: lecciones completadas por nivel, porcentaje, las últimas cinco que terminó y la siguiente que le toca, con su URL. Necesita iniciar sesión. Úsala cuando la persona pregunte por dónde va o qué estudiar ahora; después puedes abrir la siguiente lección con leer_leccion. No tiene parámetros.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["curso:leer"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:afa5a633f85cab45cfc1f0cad300b105cf539685de1ad911324b20250a5f159c"
        },
        {
          "name": "ver_leccion",
          "title": "Ficha de una lección",
          "description": "Ficha pública de una lección: resumen, objetivos, secciones, tiempo de lectura, cómo se accede y URL. No devuelve el cuerpo de la lección. Úsala para explicar qué enseña una lección sin necesidad de cuenta. Para el texto completo, usa leer_leccion (pide iniciar sesión y acceso al nivel) o enlaza la URL. Si el slug no existe, llama a ver_temario para ver los válidos.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Slug de la lección, hasta 80 caracteres: «05-herramientas» en el Básico o con el prefijo del nivel, como «avanzado/02-integraciones-apis» (ver_temario los lista).",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:93ce3d7dd202231e1763becc4e13a470b8461cffcdf04b1648c74ad2ff0534b3"
        },
        {
          "name": "ver_planes",
          "title": "Planes y precios",
          "description": "Niveles del curso con su precio en euros (pago único, sin suscripción), qué incluye cada uno, la garantía de devolución de 14 días y la URL de la página de planes. Úsala cuando la persona pregunte por precios, qué nivel comprar o qué incluye cada uno. Para saber qué tiene ya la persona, usa mi_cuenta. La compra se hace en la web, no desde aquí. No tiene parámetros.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:ce659c71c30078441856d56541d4fd5cb2531f125bb46e54bf28709ae5ff5abf"
        },
        {
          "name": "ver_temario",
          "title": "Temario del curso",
          "description": "Lista las lecciones del curso de MCP (32 en tres niveles: Básico, Avanzado y Experto) con su slug, título, descripción, nivel y cómo se accede a cada una, más el precio y el resumen de cada nivel. Úsala para enseñar el plan de estudios completo o para obtener el slug de una lección; para un tema concreto es mejor buscar. Con el slug, ver_leccion da la ficha pública y leer_leccion el texto completo.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "nivel": {
                "description": "Filtra por nivel: «basico», «avanzado» o «experto». Sin él, devuelve las 26 lecciones.",
                "enum": ["basico", "avanzado", "experto"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:47c634b98bc443793e83ee192c39f2cfa2f52972846ac8cc5f1770c8db7a7241"
        }
      ],
      "digest": "sha256:a9f68e94ac81c3afd5aa2a9637c949713e85618dc13f6b6f05aa7a548c3ab135"
    }
  }
