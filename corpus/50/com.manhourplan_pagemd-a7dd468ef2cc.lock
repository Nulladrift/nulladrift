        {
          "name": "prompt_injection_check",
          "description": "Prompt-injection risk check for agents: GET ?url= scans a public page (visible and hidden text, comments, attributes, meta, JSON-LD) or POST JSON {\"text\"} (max 50 KB) scans raw text. Flags instruction overrides, role/system-prompt spoofing, secret exfiltration asks, tool-call coercion, hidden or unicode-smuggled text, base64 instructions and markdown image exfil links. Returns a 0-100 risk score, low/medium/high verdict and findings. Heuristic; not charged on failure. — $0.002 USDC per call via x402 v2 (Base or Solana).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "Raw text/Markdown/HTML to scan instead of a URL (max 50 KB; best sent as POST JSON body)",
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL of the page to scan (use this or text)",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "advice": {
                "type": "string"
              },
              "counts": {
                "type": "object"
              },
              "final_url": {
                "type": "string"
              },
              "findings": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    },
                    "location": {
                      "type": "string"
                    },
                    "pattern": {
                      "type": "string"
                    },
                    "points": {
                      "type": "integer"
                    },
                    "snippet": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "risk_score": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "source": {
                "enum": ["url", "text"],
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "verdict": {
                "enum": ["low", "medium", "high"],
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
