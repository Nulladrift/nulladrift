          "description": "Page metadata and links: title, description, canonical, OpenGraph image, language, RSS/Atom feeds, plus every internal and external link with its anchor text. Respects robots.txt; not charged on failure. — $0.001 USDC per call via x402 v2 (Base or Solana).",
          "inputSchema": {
