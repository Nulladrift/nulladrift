      },
      "instructions": "PageMD 1.3: free agent_readiness_scan (how ready a public site is for AI agents; 10/IP/UTC day; no payment). Paid tools: read_url (page to Markdown), page_links (metadata + links), domain_intel (DNS + RDAP), security_headers (HTTP security headers score + fixes), prompt_injection_check (prompt-injection risk score for a URL or raw text, $0.002). Paid tools use x402 v2 over MCP: call without payment to get PaymentRequired (isError result with structuredContent.accepts), then retry with params._meta['x402/payment'] = PaymentPayload. USDC on Base or Solana; settled only when the tool succeeds.",
      "tools": [
        {
          "name": "agent_readiness_scan",
          "description": "Free check of how readable and usable a public website is for AI agents: llms.txt, robots.txt AI-crawler rules, sitemap, schema.org JSON-LD, MCP and x402 discovery, OpenAPI, and whether the page is readable without JavaScript. Returns a 0-100 score, a grade, and a fix list. Rate-limited to 10 scans per IP per UTC day. No payment and no API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http(s) URL of the site or page to scan",
                "examples": ["https://example.com"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "docs": "https://manhourplan.com/agent-ready/",
            "http": "https://manhourplan.com/agent-ready/api/scan?url=",
            "paid": false
          },
          "digest": "sha256:badad358572d106c45191fd28577077cbab1d7af46b4fb5191450d4a03445322"
        },
        {
          "name": "domain_intel",
          "description": "Domain intel in one call: DNS A, AAAA, MX, NS, TXT, CNAME and CAA records, SPF and DMARC policy, plus RDAP registrar, creation and expiry dates, age in days and status codes. — $0.002 USDC per call via x402 v2 (Base or Solana).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name, e.g. example.com (a URL is also accepted; its host is used)",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dns": {
                "type": "object"
              },
              "domain": {
                "type": "string"
              },
              "email": {
                "properties": {
                  "dmarc": {
                    "type": ["string", "null"]
                  },
                  "dmarc_policy": {
                    "type": ["string", "null"]
                  },
                  "has_mx": {
                    "type": "boolean"
                  },
                  "spf": {
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "ok": {
                "type": "boolean"
              },
              "rdap": {
                "properties": {
                  "age_days": {
                    "type": ["integer", "null"]
                  },
                  "created": {
                    "type": ["string", "null"]
                  },
                  "days_to_expiry": {
                    "type": ["integer", "null"]
                  },
                  "expires": {
                    "type": ["string", "null"]
                  },
                  "registrar": {
                    "type": ["string", "null"]
                  },
                  "status": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "x402/amount": "2000",
            "x402/endpoint": "https://pagemd-x402.m-zikriz.workers.dev/v1/domain",
            "x402/networks": ["eip155:8453", "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"],
            "x402/paid": true,
            "x402/priceUSD": 0.002
