  "subjects": {
    "com.mathproven/tables-paid": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mathproven.com/api/agents/paid"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "mathproven-reference-tables-paid",
        "title": "Mathproven reference tables (paid)",
        "version": "0.1.4"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "all_tables",
          "title": "Every reference table, every member",
          "description": "Gives every row of every Mathproven reference table of state rules and rates in one answer: for each table, each member's rows in plain words with each row's citation, official source address and the day it was read, the members with no row and why (never a zero), how a date picks rows, and the table's certificate. Use it to load the whole set at once instead of one member at a time. It takes no input. Its answer is large, about 600 KB of JSON, more than some apps take from one tool; read_table or changes_since with a table gives a smaller answer. Each call uses one call of the pack whose key it carries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Every reference table, every member"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18dcdb3e7d527fd7702aee7b332df315cae64be49e0533a031803c904946321d"
        },
        {
          "name": "changes_since",
          "title": "Reference rows read after a date",
          "description": "Gives every row of the Mathproven reference tables (or of one table) that was read on its official source after a date, with the row in plain words, its citation, source address and the day read, and each table's certificate. A row counts as read on the latest day any of its sources was read. Use it to keep a saved copy of the tables up to date. It takes only a date and an optional table name: with a table the answer is that table's rows only; across every table from an early date it is about 600 KB of JSON, more than some apps take from one tool. Each call uses one call of the pack whose key it carries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The day after which rows count, written YYYY-MM-DD: rows read on a later day are given.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "table": {
                "description": "Optional. One table's name, to give only its rows.",
                "enum": ["charity-audit-thresholds-by-state", "charity-registration-renewal-dates-by-state", "fuel-tax-rates-third-quarter-2026", "capital-gains-rate-thresholds", "uncashed-check-dormancy-periods", "unclaimed-property-notice-windows", "prompt-payment-deadlines", "retainage-limits", "economic-nexus-thresholds", "surplus-lines-tax-rates", "surplus-lines-stamping-fees", "trust-record-retention-by-state", "rent-late-fee-limits", "security-deposit-rules"],
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Reference rows read after a date"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a269f74c1064fa5302ea26f9e3da44b737493aee239abd3dfca4280c102f25d4"
        },
        {
          "name": "read_table",
          "title": "Read one member's row of a reference table",
          "description": "Reads one member's row of a Mathproven reference table (a state's figure, for example) for a date: the figures in plain words, each row's citation, official source address and the day it was read, and the table's certificate. A member with no row is answered as not covered, with the reason, never as a zero. Use it when someone asks for a state's rule, rate, threshold, period or deadline that one of the tables holds. It takes only a table name, a member's code and a date: no amounts, names or files. Each call uses one call of the pack whose key it carries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional. The day the answer is for, written YYYY-MM-DD (a policy effective date for the stamping fee table). Without it, today's date (UTC).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "member": {
                "description": "The member's code: a state's two-letter postal code (OH) or DC; for the fuel tax table a member jurisdiction's code, Canadian provinces included (ON); for the capital gains table a filing status (S, MFJ, MFS, HOH) or a tax year and status (2026-MFJ).",
                "maxLength": 8,
                "pattern": "^(?:[A-Za-z]{1,3}|\\d{4}-[A-Za-z]{1,3})$",
                "type": "string"
              },
              "table": {
                "description": "The table's name, as list_tables gives it (for example \"fuel-tax-rates-third-quarter-2026\").",
                "enum": ["charity-audit-thresholds-by-state", "charity-registration-renewal-dates-by-state", "fuel-tax-rates-third-quarter-2026", "capital-gains-rate-thresholds", "uncashed-check-dormancy-periods", "unclaimed-property-notice-windows", "prompt-payment-deadlines", "retainage-limits", "economic-nexus-thresholds", "surplus-lines-tax-rates", "surplus-lines-stamping-fees", "trust-record-retention-by-state", "rent-late-fee-limits", "security-deposit-rules"],
                "type": "string"
              }
            },
            "required": ["member", "table"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one member's row of a reference table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df30aa13912630cc95021c05546a58a65e06b48da3f8c8aab0d931a21502e3b7"
        }
      ],
      "digest": "sha256:2bc24a241ec0b94f8e2f12a227c47bebdbab104cb61e23a525c0ef48325e631b"
    }
  }
