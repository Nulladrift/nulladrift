                "description": "Approval id from a prior needs_confirmation envelope.",
                "type": "string"
              },
              "expiresInDays": {
                "description": "Days until the link dies. Omit = revoke-only.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "flowId": {
                "description": "Flow to share.",
                "type": "string"
              },
              "label": {
                "description": "Who/what this link is for, e.g. 'support pilot'.",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this.",
                "type": "string"
              }
            },
            "required": ["flowId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
