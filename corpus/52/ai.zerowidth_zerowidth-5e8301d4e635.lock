        {
          "name": "napkin_deck_write",
          "title": "Write a whole deck from a markdown outline",
          "description": "Creates a deck from a markdown outline — the SAME dialect `napkin_deck_outline` reads back, so any deck you've read shows the format. Decks are SLIDES for presenting; a prose document ('write this up', 'draft a doc') is napkin_docs_create instead. Rules: `## Heading` starts a slide (heading becomes the slide title and its biggest text block); optional trailing `[layout: title | section | title-body | title-lead | two-column | three-column | comparison | statement | quote | closing | blank]`; body lines fill the layout's remaining text areas in order, split into areas by a line containing only `---`; `- ` bullets are kept as bullets. Slides default to title-body (or title, when bodyless). Layout text areas you don't fill stay as visible prompts for the user. Example:\n\n## Q3 Review [layout: title]\nWhat happened, what's next\n## Revenue [layout: title-body]\n- up 40% QoQ\n- churn flat\n## Bets [layout: two-column]\nDouble down on decks\n---\nSunset legacy plans\n\nAfter writing, cite the deck with `[[board:ID]]` alone on its own line — the user opens it from there.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Deck name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "outline": {
                "description": "The markdown outline (dialect above).",
                "maxLength": 50000,
                "minLength": 1,
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["name", "outline"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
