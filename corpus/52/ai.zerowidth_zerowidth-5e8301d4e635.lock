        {
          "name": "compass_interviews_create",
          "title": "Invite someone to a Compass interview",
          "description": "Mints a stakeholder-interview invite: a no-account guest link where the person talks to an interviewer agent briefed by your focusPrompt, and the transcript flows back into Compass as reviewable draft pages. THE KNOWLEDGE-GAP MOVE: when caliper_flow_performance shows failures clustered on missing company facts (the judge says the flow invented a policy, missed a rule, didn't know who owns something), the fix is usually not a prompt edit — it's asking the human who actually knows. Write a focusPrompt that names the SPECIFIC gaps (cite the eval run id), pick the owner of the relevant workflow as interviewee when the map knows one. When you have their email, send the link with compass_interview_invite next rather than asking the user to forward it; otherwise hand the user the link. May return `needs_confirmation` — tell the user who you want to interview and why, then wait.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "anonymous": {
                "description": "The guest is told it's anonymous and never asked who they are; no name or email is kept, so leave intervieweeName and intervieweeEmail out, and the link isn't emailed from here. Use when the user asks for anonymous interviews.",
                "type": "boolean"
              },
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response, after the user has approved. Omit on the first call.",
                "type": "string"
              },
              "contextPageIds": {
                "description": "Compass page ids the interviewer gets as briefing context (e.g. the workflow page whose flow underperformed).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "focusPrompt": {
                "description": "The interviewer's aim (≤2000 chars), never shown to the guest: why the team is asking, in one sentence; 2–3 things to come away knowing, each describable from experience (who does a step, what happens when it goes wrong, how long it waits, why a check exists), aimed at what the map doesn't know; and what the answers feed. No opinion or preference questions.",
                "type": "string"
              },
              "intervieweeEmail": {
                "description": "Their email, when known — enables compass_interview_invite to send the link directly (with approval).",
                "type": "string"
              },
              "intervieweeName": {
                "description": "Who this invite is for, when known.",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
