        {
          "name": "rooms_start_agent_work",
          "title": "Put agents on something in a room",
          "description": "Starts the assistant and flows in a room working on something together in a sidebar: they take turns without a person between each, and the result comes back to the room's stream. The flows must already be in the room (rooms_add_flow). Use it when someone asks for agents to work something out, or to hand a specialist flow a job. Anyone in the room can read along or stop it. May return needs_confirmation; say what they'll work on and who, and wait for approval.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation envelope.",
                "type": "string"
              },
              "flowIds": {
                "description": "Flows in the room to take part.",
                "items": {
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "goal": {
                "description": "What they should work on, as a clear task.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "includeZv1": {
                "description": "Whether the assistant takes part too (default true).",
                "type": "boolean"
              },
              "maxTurns": {
                "description": "Most turns before they write up (default 8).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "description": "'moderated' (the assistant picks who speaks) or 'in_order'. Default moderated.",
                "enum": ["moderated", "in_order"],
                "type": "string"
              },
              "output": {
                "description": "What to come back with, e.g. 'a one-paragraph recommendation'.",
                "maxLength": 1000,
                "type": "string"
              },
              "roomId": {
                "description": "Room id (from rooms_list).",
                "type": "string"
              },
              "sidebarId": {
                "description": "Work in this open sidebar instead of opening a new one.",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["goal", "roomId"],
            "type": "object"
          },
