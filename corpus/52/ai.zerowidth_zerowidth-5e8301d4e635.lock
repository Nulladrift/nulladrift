        {
          "name": "workbench_kb_add_documents",
          "title": "Add documents to a knowledge base",
          "description": "Adds documents to a knowledge base and starts ingestion (chunk + embed; graph KBs also extract entities; tabular KBs load CSV as tables). Text goes inline (Markdown, plain text, CSV — encoding utf8); binary files (PDF, .docx) go base64-encoded with their mimeType. Up to 50 sources per call, ~10 MB each. Ingestion runs in the BACKGROUND — the result carries a runId; check it with workbench_kb_ingestion_status when the user asks, don't poll. workbench_kb_search works once it finishes. Content from <attached-file> blocks is ideal source material. Check workbench_kb_documents_list first so you don't add a document twice. Embedding spends workspace inference credit, so this sits behind the approval gate: may return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation envelope.",
                "type": "string"
              },
              "kbId": {
                "description": "Knowledge base id (from workbench_kb_list or workbench_kb_create).",
                "type": "string"
              },
              "sources": {
                "description": "Documents to ingest (1-50).",
                "items": {
                  "properties": {
                    "content": {
                      "description": "The document: full text for utf8 sources, base64 bytes for binary ones.",
                      "maxLength": 10000000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "encoding": {
                      "description": "How `content` is encoded. Default utf8; base64 for PDF / docx bytes.",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "mimeType": {
                      "description": "Content type. Default text/markdown for utf8 sources. Required for base64: application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document (.docx), text/csv, …",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "name": {
                      "description": "Document name, e.g. 'refund-policy.md' or 'handbook.pdf'.",
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["content", "name"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "workspace": {
                "description": "Workspace slug override.",
                "type": "string"
              }
            },
            "required": ["kbId", "sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add documents to a knowledge base"
