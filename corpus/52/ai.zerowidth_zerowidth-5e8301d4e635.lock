          "name": "ledger_metrics_get",
          "title": "Read one Ledger metric with its readings",
          "description": "One metric's definition (unit, kind, direction, target, cadence) plus its readings newest first and the open decisions bound to it. Use before answering 'how is X trending?' or before recording a reading against it. `metricId` accepts the id or the snake_case slug from ledger_metrics_list. For an event metric whose readings carry labels, `labels` lists each label and its values, largest total first. Pass `slice` to get the series for part of it (\"new users in DE\"), or `by` to split the series by one label (\"new users by country\"); either returns `series`, summed per `bucket`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bucket": {
                "description": "Series bucket when `slice` or `by` is set. Default week.",
                "enum": ["day", "week", "month"],
                "type": "string"
              },
              "by": {
                "description": "Event metrics only. A label name to split the series by.",
                "type": "string"
              },
              "metricId": {
                "description": "Metric id or slug (from ledger_metrics_list).",
                "type": "string"
              },
              "slice": {
                "additionalProperties": {
                  "items": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "maxItems": 50,
                  "minItems": 1,
                  "type": "array"
                },
                "description": "Event metrics only. Per label, the values to keep: { country: [\"DE\", \"AT\"] } keeps readings from DE or AT; several labels must all match. Names and values come from `labels`.",
                "propertyNames": {
                  "pattern": "^[a-z][a-z0-9_]{0,39}$",
                  "type": "string"
                },
                "type": "object"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["metricId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one Ledger metric with its readings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
