        {
          "name": "caliper_datasets_get",
          "title": "Read a Caliper dataset (items paged)",
          "description": "One dataset with a page of its items — read this BEFORE editing items (caliper_datasets_update_item needs the item id) and before extending coverage, so you don't add cases that already exist. Items come `limit` at a time (default 25) from `offset`; `total` is the full count. Long fields are cut at ~800 characters with a truncation marker. Get the datasetId from caliper_datasets_list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "datasetId": {
                "description": "Dataset id, from caliper_datasets_list.",
                "type": "string"
              },
              "limit": {
                "description": "Items per page, 1-100. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Items to skip. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["datasetId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Caliper dataset (items paged)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
