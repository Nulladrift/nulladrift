        {
          "name": "rooms_search",
          "title": "Search what rooms said",
          "description": "Searches the messages in the rooms the person can see, or in one room, newest first. Each hit is a line with who said it, when, the room, and the message id. Use it when someone asks what a group said about something, when it was decided, or who brought it up, and the answer may be older than what rooms_read shows. To read around a hit, call rooms_read with that room and `before` set to a later message id, or `from` set to a time shortly before the hit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Most hits (default 10).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a short phrase; websearch syntax works (\"exact phrase\", -word, or).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "roomId": {
                "description": "Only this room (id from rooms_list).",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug, for tokens without a default.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search what rooms said"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
