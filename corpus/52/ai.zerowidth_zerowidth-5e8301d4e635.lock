        {
          "name": "napkin_draw",
          "title": "Draw on a Napkin board",
          "description": "Draws shapes, strokes, and labels on a board — diagram on a sketch, annotate a deck slide — and, via `updates` / `deletes`, changes or removes shapes that are already there (ids from napkin_boards_get; the fix for something you drew wrong). For NEW elements never compute absolute board coordinates: with `slide`, coordinates are slide-local — (0, 0) top-left to (960, 540) bottom-right of that slide. Without `slide` (sketches), (0, 0) is the top-left of the existing content — the same area `napkin_boards_view` renders, so place by what you saw there; on an empty board just start at (0, 0). Example — circle a slide's title and margin-note it:\n\n{\"boardId\": \"…\", \"slide\": 2, \"elements\": [\n  {\"type\": \"ellipse\", \"x\": 60, \"y\": 40, \"w\": 400, \"h\": 90, \"color\": \"#dc2626\"},\n  {\"type\": \"arrow\", \"x\": 560, \"y\": 140, \"x2\": 470, \"y2\": 90, \"color\": \"#dc2626\"},\n  {\"type\": \"text\", \"x\": 575, \"y\": 130, \"w\": 260, \"text\": \"tighten this claim\", \"color\": \"#dc2626\"}\n]}\n\nAfter drawing, cite the board with `[[board:ID]]` alone on its own line.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "boardId": {
                "description": "Napkin board id.",
                "type": "string"
              },
              "deletes": {
                "description": "Ids of existing shapes to remove (from napkin_boards_get).",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "elements": {
                "description": "New elements to draw, painted in order.",
                "items": {
                  "properties": {
                    "align": {
                      "description": "text only.",
                      "enum": ["left", "center", "right"],
                      "type": "string"
                    },
                    "bold": {
                      "description": "text only.",
                      "type": "boolean"
                    },
                    "color": {
                      "description": "Stroke / text hex color. Default near-black ink.",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "fill": {
                      "description": "rect/ellipse fill hex (default none); sticky tint.",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "h": {
                      "description": "Height (rect/ellipse/text).",
                      "type": "number"
                    },
                    "points": {
                      "description": "pen only: [x, y] pairs along the stroke (≥ 2).",
                      "items": {
                        "items": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          }
                        ],
                        "type": "array"
                      },
                      "maxItems": 4000,
                      "type": "array"
                    },
                    "size": {
                      "description": "Stroke width / font size. Default 3.5 (≈ pen; text ≈ 17px).",
                      "maximum": 200,
                      "minimum": 0.5,
                      "type": "number"
                    },
                    "text": {
                      "description": "text/sticky content.",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "type": {
                      "description": "What to draw.",
                      "enum": ["pen", "rect", "ellipse", "line", "arrow", "text", "sticky"],
                      "type": "string"
                    },
                    "w": {
                      "description": "Width (rect/ellipse/text).",
                      "type": "number"
                    },
                    "x": {
                      "description": "Top-left x (line/arrow: start x).",
                      "type": "number"
                    },
                    "x2": {
                      "description": "line/arrow: end x.",
                      "type": "number"
                    },
                    "y": {
                      "description": "Top-left y (line/arrow: start y).",
                      "type": "number"
                    },
                    "y2": {
                      "description": "line/arrow: end y.",
                      "type": "number"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "slide": {
                "description": "1-based slide number (decks only) — makes coordinates slide-local.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "updates": {
                "description": "Existing shapes to change — move, resize, retext, restyle. Read napkin_boards_get first for ids and current geometry.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Shape id from napkin_boards_get.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "patch": {
                      "description": "Fields to change on the shape (x, y, w, h, text, spans, style, …) — absolute board coordinates as napkin_boards_get reports them. `spans` replaces the shape's whole span list.",
                      "properties": {
                        "crop": {
                          "anyOf": [
                            {
                              "properties": {
                                "bottom": {
                                  "maximum": 0.95,
                                  "minimum": 0,
                                  "type": "number"
                                },
                                "left": {
                                  "maximum": 0.95,
                                  "minimum": 0,
                                  "type": "number"
                                },
                                "right": {
                                  "maximum": 0.95,
                                  "minimum": 0,
                                  "type": "number"
                                },
                                "top": {
                                  "maximum": 0.95,
                                  "minimum": 0,
                                  "type": "number"
                                }
                              },
                              "required": ["bottom", "left", "right", "top"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "from": {
                          "properties": {
                            "shapeId": {
                              "maxLength": 64,
                              "minLength": 1,
                              "type": "string"
                            },
                            "x": {
                              "type": "number"
                            },
                            "y": {
                              "type": "number"
                            }
                          },
                          "required": ["x", "y"],
                          "type": "object"
                        },
                        "group": {
                          "anyOf": [
                            {
                              "maxLength": 64,
                              "minLength": 1,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "h": {
                          "type": "number"
                        },
                        "imageId": {
                          "maxLength": 64,
                          "minLength": 1,
                          "type": "string"
                        },
                        "layout": {
                          "anyOf": [
                            {
                              "properties": {
                                "accent": {
                                  "maxLength": 60,
                                  "type": "string"
                                },
                                "key": {
                                  "maxLength": 80,
                                  "minLength": 1,
                                  "type": "string"
                                },
