        {
          "name": "napkin_brand_add_files",
          "title": "Add pictures to a brand kit",
          "description": "Adds pictures to a brand kit section — logo versions, product marks, example screenshots, imagery. Each file comes from a public https `url` (fetched by the server) or, for a small file that isn't online, base64 `data` with a `filename`. PNG, JPEG, WebP, GIF and SVG, up to 20 MB each. Every file becomes a workspace file and an asset on the section, appended after the ones already there. Give each a `name` and a `note` saying what it's for; on logo sections set `backdrop` to the hex of the ground it's made for (#ffffff for a dark logo, #000000 for a reversed one), which is how pages pick the right version. Same rule as napkin_brand_draft: you can change any kit except the workspace's brand. Files that fail are reported and the rest still land.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "files": {
                "items": {
                  "properties": {
                    "backdrop": {
                      "description": "Hex of the ground it's made for (logos).",
                      "pattern": "^#[0-9a-fA-F]{6}$",
                      "type": "string"
                    },
                    "data": {
                      "description": "The file as base64, for small files.",
                      "maxLength": 3000000,
                      "type": "string"
                    },
                    "filename": {
                      "description": "File name with extension. Required with `data`.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "name": {
                      "description": "What to call it in the kit.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "note": {
                      "description": "What it's for.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "url": {
                      "description": "A public https address of the file.",
                      "format": "uri",
                      "maxLength": 2000,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "kind": {
                "description": "Only when no section has that title yet: the kind of section to make.",
                "enum": ["overview", "voice", "colors", "typography", "logo", "imagery", "motion", "layout", "examples", "custom"],
                "type": "string"
              },
              "kitId": {
                "description": "The kit to add to (napkin_brand_list).",
                "maxLength": 64,
                "minLength": 1,
