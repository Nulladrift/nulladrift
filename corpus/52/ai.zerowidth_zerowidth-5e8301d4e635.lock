        {
          "name": "napkin_docs_update",
          "title": "Edit a Napkin doc",
          "description": "Edit a Napkin doc. For a change to existing prose use `edits` — a list of exact find/replace pairs, which is the SAFEST option and the one to reach for by default: it leaves everything you did not target untouched, and it fails loudly rather than clobbering a doc somebody else is typing in. `append` adds a section at the end. `body` replaces the WHOLE document and should be a last resort. Also retitle, describe, set visibility, or `archived` (true takes it out of the gallery, false brings it back). Read the doc with napkin_docs_get first — `edits` match the current text exactly. Doc ids come from napkin_docs_list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "append": {
                "description": "Markdown appended to the end (own paragraph).",
                "maxLength": 50000,
                "type": "string"
              },
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "archived": {
                "type": "boolean"
              },
              "body": {
                "description": "Full replacement markdown body. Prefer `edits` — this overwrites everything. Write each paragraph as ONE long line; the editor wraps it for the reader.",
                "maxLength": 200000,
                "type": "string"
              },
              "description": {
                "description": "Short gallery summary.",
                "maxLength": 2000,
                "type": "string"
              },
              "docId": {
                "description": "Doc id from napkin_docs_list.",
                "type": "string"
              },
              "edits": {
                "description": "Targeted find/replace pairs, applied in order. All must match or none are applied.",
                "items": {
                  "properties": {
                    "find": {
                      "description": "Exact text to replace, copied verbatim from the current body. Must appear EXACTLY ONCE — include surrounding words when a phrase repeats.",
                      "maxLength": 20000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "replace": {
                      "description": "What to put there. Empty string deletes.",
                      "maxLength": 20000,
                      "type": "string"
                    }
                  },
                  "required": ["find", "replace"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "visibility": {
                "description": "Who can see it: PRIVATE (only the user), WORKSPACE (every member, the default), or SHARED (specific people, granted afterwards). Say 'make it private' → PRIVATE.",
                "enum": ["PRIVATE", "WORKSPACE", "SHARED"],
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
