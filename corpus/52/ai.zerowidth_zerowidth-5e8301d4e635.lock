        {
          "name": "ledger_metrics_record_reading",
          "title": "Record a metric reading",
          "description": "Record one observation of a tracked metric. `metricId` accepts a metric id OR its snake_case slug from ledger_metrics_list; an unknown one is a not_found error — check ledger_metrics_list, create it with ledger_metrics_create, or pass `createIfMissing: true` to mint a \"measure\" metric at that slug in the same call (an \"event\" metric when the reading carries `labels`). The reading automatically lands as evidence on every open decision whose prediction is bound to this metric — so when a user reports a number (\"triage is down to 12 minutes\"), offer to record it. For event-kind metrics, omit `value` to count one occurrence. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "type": "string"
              },
              "at": {
                "description": "ISO timestamp the reading is for. Defaults to now; set it when backfilling an earlier reading.",
                "type": "string"
              },
              "createIfMissing": {
                "description": "Mint the metric when the slug is unknown. Default false — an unknown slug is an error, so a typo can't quietly start a second series.",
                "type": "boolean"
              },
              "key": {
                "description": "Idempotency key (e.g. \"2026-w32\") — a repeat write with the same key returns the original reading instead of doubling the series. Use for scheduled/recurring recordings. The key is per set of labels, so one key per day can cover every country.",
                "maxLength": 120,
                "type": "string"
              },
              "labels": {
                "additionalProperties": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "description": "Event metrics only. What this count is broken down by, e.g. { country: \"DE\", plan: \"pro\" } — snake_case names, string values. Lets the metric be read and claimed by slice later. Refused on a measure.",
                "propertyNames": {
                  "pattern": "^[a-z][a-z0-9_]{0,39}$",
                  "type": "string"
                },
                "type": "object"
              },
              "metricId": {
                "description": "Metric id or slug (from ledger_metrics_list).",
                "type": "string"
              },
              "note": {
                "description": "Where the number came from, if worth recording.",
                "maxLength": 1000,
                "type": "string"
              },
              "value": {
                "description": "The observed value, in the metric's unit. Omit for event-kind metrics to record one occurrence.",
                "type": "number"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["metricId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Record a metric reading"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:be514c976d51649e0bca911e79aea5aaab029e997091e370e397bcc54d0d2857"
        },
        {
          "name": "ledger_metrics_update",
          "title": "Edit a metric's definition",
          "description": "Corrects a metric's name, unit, description, kind (measure / event), direction (which way is good), target, cadence, icon, level, or the metrics it drives (its place in the metric tree). Readings are untouched. Only what you pass changes. The slug is not editable here — external writers address metrics by slug. Fails with conflict when a rename collides with a live metric. `metricId` is the id from ledger_metrics_list. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation envelope.",
                "type": "string"
              },
              "cadence": {
                "description": "How often a reading is expected.",
                "enum": ["", "daily", "weekly", "monthly", "quarterly"],
                "type": "string"
              },
              "description": {
                "maxLength": 2000,
                "type": "string"
              },
              "direction": {
                "description": "up = higher is better, down = lower is better, none.",
                "enum": ["up", "down", "none"],
                "type": "string"
              },
              "drives": {
                "description": "Ids of the metrics this one moves. Replaces the current set; pass the full list. Loops are refused.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "icon": {
                "anyOf": [
                  {
                    "enum": ["chart-line", "dollar-sign", "banknote", "landmark", "piggy-bank", "wallet", "coins", "receipt", "percent", "badge-percent", "calculator", "chart-pie", "trending-up", "trending-down", "users", "user-plus", "user-minus", "user-check", "contact", "phone", "handshake", "target", "trophy", "magnet", "megaphone", "mail", "search", "globe", "share-2", "mouse-pointer-click", "store", "tag", "calendar", "clock", "timer", "hourglass", "activity", "server", "bug", "rocket", "package", "boxes", "truck", "undo-2", "inbox", "headphones", "life-buoy", "repeat", "list-checks", "clipboard-check", "shield", "shield-alert", "lock", "file-text", "scale", "briefcase", "graduation-cap", "smile", "heart", "star", "message-circle", "cpu", "bot", "wrench", "layers", "link", "crosshair"],
                    "type": "string"
                  },
                  {
                    "const": "",
                    "type": "string"
                  }
                ],
                "description": "The mark the metric wears in every tool: the thing it counts (phone for calls, landmark for profit). \"\" goes back to the catalog's icon."
              },
              "kind": {
                "description": "measure = a value each reading; event = a count of occurrences.",
                "enum": ["measure", "event"],
                "type": "string"
              },
              "level": {
                "anyOf": [
                  {
                    "enum": ["outcome", "driver", "activity"],
                    "type": "string"
                  },
                  {
                    "const": "",
                    "type": "string"
                  }
                ],
                "description": "outcome = what the business is judged on; driver = a number that moves an outcome; activity = daily work. \"\" unplaces it."
              },
              "metricId": {
                "description": "Metric id (from ledger_metrics_list).",
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "target": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Goal value in the metric's unit; null clears."
              },
              "unit": {
                "description": "\"min\", \"%\", \"$\", \"tickets/day\".",
                "maxLength": 50,
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["metricId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Edit a metric's definition"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:351654bcde1731d5be83da9064faa003597aaa5d22f756f6e2fd423c06515c08"
