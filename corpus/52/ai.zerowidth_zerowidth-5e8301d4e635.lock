                              },
                              "slice": {
                                "additionalProperties": {
                                  "items": {
                                    "maxLength": 100,
                                    "minLength": 1,
                                    "type": "string"
                                  },
                                  "maxItems": 50,
                                  "minItems": 1,
                                  "type": "array"
                                },
                                "propertyNames": {
                                  "pattern": "^[a-z][a-z0-9_]{0,39}$",
                                  "type": "string"
                                },
                                "type": "object"
                              },
                              "source": {
                                "enum": ["caliper_eval", "metric", "manual"],
                                "type": "string"
                              },
                              "target": {
                                "type": "number"
                              },
                              "unit": {
                                "maxLength": 50,
                                "type": "string"
