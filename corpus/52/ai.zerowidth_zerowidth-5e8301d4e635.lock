                              "comparator": {
                                "enum": [">=", "<=", ">", "<", "="],
                                "type": "string"
                              },
                              "evalId": {
                                "maxLength": 100,
                                "minLength": 1,
                                "type": "string"
                              },
                              "hold": {
                                "properties": {
                                  "days": {
                                    "default": 28,
