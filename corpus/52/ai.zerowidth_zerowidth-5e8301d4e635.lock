          "description": "Records from a table tab, keyed by field name, with optional where / sort / search / limit (max 500). For counts, sums and joins, napkin_sheets_query runs SQL over tables too (each table is an SQL table with an id column).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "match": {
                "enum": ["all", "any"],
                "type": "string"
              },
              "offset": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "search": {
                "maxLength": 200,
                "type": "string"
              },
              "sheetId": {
                "description": "Sheet id from napkin_sheets_list.",
                "type": "string"
              },
              "sort": {
                "items": {
                  "properties": {
                    "dir": {
                      "enum": ["asc", "desc"],
                      "type": "string"
                    },
                    "field": {
                      "type": "string"
                    }
                  },
                  "required": ["field"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "table": {
                "description": "The table tab's name or id.",
                "type": "string"
              },
              "where": {
                "items": {
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "op": {
                      "description": "is (default), is_not, contains, not_contains, gt, gte, lt, lte, empty, not_empty, any_of, none_of, checked, unchecked",
                      "type": "string"
                    },
                    "value": {}
                  },
                  "required": ["field"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this.",
                "type": "string"
              }
            },
            "required": ["sheetId", "table"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find records in a sheet table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
