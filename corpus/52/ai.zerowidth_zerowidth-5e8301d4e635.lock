              "criteria": {
                "items": {
                  "properties": {
                    "check": {
                      "description": "For kind=check: what the code looks for in the final reply.",
                      "properties": {
                        "caseSensitive": {
                          "type": "boolean"
                        },
                        "type": {
                          "enum": ["contains", "not_contains", "matches", "valid_json", "max_chars", "equals_expected"],
                          "type": "string"
                        },
                        "value": {
                          "description": "Text for contains/not_contains, a regex for matches, a number for max_chars.",
                          "type": "string"
                        }
                      },
                      "required": ["type"],
                      "type": "object"
                    },
                    "description": {
                      "description": "What the judge should look for (max 500 chars).",
                      "type": "string"
                    },
                    "kind": {
                      "description": "scale (default): judged on scaleMin..scaleMax. pass_fail: judged pass or fail. check: decided in code with no judge — set `check`.",
                      "enum": ["scale", "pass_fail", "check"],
                      "type": "string"
                    },
                    "name": {
                      "description": "Criterion name (2-80 chars).",
                      "type": "string"
                    },
                    "scaleMax": {
                      "description": "Default 5.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "scaleMin": {
                      "description": "Default 1. Ignored for pass_fail and check (always 0..1).",
