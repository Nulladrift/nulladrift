        {
          "name": "compass_opportunities_register_expectation",
          "title": "Pre-register an experiment's expectation",
          "description": "The honesty mechanism: write what the experiment is expected to change BEFORE evidence exists. Creates a Ledger decision entry and links it to the opportunity — never backfill an expectation to match an outcome. Bind a metric (ledger_metrics_list) + comparator + target when the expectation is measurable; readings then land on the entry as evidence automatically. One expectation per opportunity — revise by superseding in Ledger. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response, after the user has approved. Omit on the first call.",
                "type": "string"
              },
              "comparator": {
                "enum": [">=", "<=", ">", "<", "="],
                "type": "string"
              },
              "deadline": {
                "description": "ISO date the expectation is due by.",
                "type": "string"
              },
              "expectation": {
                "description": "One sentence — what we expect this to change.",
                "type": "string"
              },
              "fromRollup": {
                "description": "Instead of metricId: measure it off the change's workflow roll-up — a step's (nodeId) or the whole workflow's hands-on time, waiting, labor, or hard cost, per run or per month. Creates a daily-fed metric with the last 30 days rebuilt from the map's history, so the before is on record. Needs a target; comparator defaults to <=.",
                "properties": {
                  "bound": {
                    "default": "mid",
                    "enum": ["low", "high", "mid"],
                    "type": "string"
                  },
                  "currency": {
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  "field": {
                    "enum": ["working", "waiting", "labor", "hardCost"],
                    "type": "string"
                  },
                  "nodeId": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "scope": {
                    "default": "perRun",
                    "enum": ["perRun", "perMonth"],
                    "type": "string"
                  },
                  "variantId": {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["field"],
                "type": "object"
              },
              "metricId": {
                "description": "Ledger metric to bind (requires target). From ledger_metrics_list.",
                "type": "string"
              },
              "opportunityId": {
                "description": "The change's key (e.g. ACME-12) or id, from compass_opportunities_list.",
                "type": "string"
              },
              "target": {
                "description": "Target value, in the metric's unit (hours for time).",
                "type": "number"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["expectation", "opportunityId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
