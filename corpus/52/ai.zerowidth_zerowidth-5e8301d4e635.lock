        {
          "name": "workbench_flows_schedules_update",
          "title": "Pause / resume / re-time a flow schedule",
          "description": "Changes one schedule: `enabled: false` pauses it (configuration kept), `enabled: true` resumes and recomputes the next fire time from now; `interval` / `scheduleTime` / `scheduleTimezone` / `scheduleDayOfWeek` change the cadence; `label`, `delivery`, and `input` can change too. Pass only what changes. Get the scheduleId from workbench_flows_schedules_list. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "delivery": {
                "enum": ["history", "notification", "email"],
                "type": "string"
              },
              "enabled": {
                "description": "false pauses, true resumes.",
                "type": "boolean"
              },
              "flowId": {
                "description": "Flow the schedule belongs to.",
                "type": "string"
              },
              "input": {
                "description": "New fixed input envelope — {\"kind\":\"chat\",\"messages\":[…]} or {\"kind\":\"form\",\"values\":{…}}.",
                "oneOf": [
                  {
                    "properties": {
                      "kind": {
                        "const": "chat",
                        "type": "string"
                      },
                      "messages": {
                        "items": {
                          "additionalProperties": {},
                          "properties": {
                            "content": {
                              "anyOf": [
                                {
                                  "type": "string"
                                },
                                {
                                  "items": {},
                                  "type": "array"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "name": {
                              "type": "string"
                            },
                            "role": {
                              "type": "string"
                            },
                            "tool_call_id": {
                              "type": "string"
                            },
                            "tool_calls": {
                              "items": {
                                "additionalProperties": {},
                                "properties": {
                                  "function": {
                                    "additionalProperties": {},
                                    "properties": {
                                      "arguments": {},
                                      "name": {
                                        "type": "string"
                                      }
                                    },
                                    "type": "object"
                                  },
                                  "id": {
                                    "type": "string"
                                  },
                                  "type": {
                                    "type": "string"
                                  }
                                },
                                "type": "object"
                              },
                              "type": "array"
                            }
                          },
                          "required": ["role"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "values": {
                        "additionalProperties": {},
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      }
                    },
                    "required": ["kind", "messages"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "kind": {
                        "const": "form",
                        "type": "string"
                      },
                      "values": {
                        "additionalProperties": {},
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      }
                    },
                    "required": ["kind", "values"],
                    "type": "object"
                  }
                ]
              },
              "interval": {
                "description": "New cadence: hourly, daily, or weekly.",
                "enum": ["hourly", "daily", "weekly"],
                "type": "string"
              },
              "label": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "recurrence": {
                "anyOf": [
                  {
                    "properties": {
                      "ends": {
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "every": {
                        "default": 1,
                        "maximum": 366,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "freq": {
                        "enum": ["hourly", "daily", "weekly", "monthly", "yearly"],
                        "type": "string"
                      },
                      "hours": {
                        "properties": {
                          "from": {
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                            "type": "string"
                          },
                          "to": {
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                            "type": "string"
                          }
                        },
                        "required": ["from", "to"],
                        "type": "object"
                      },
                      "minutes": {
                        "items": {
                          "maximum": 59,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxItems": 12,
                        "minItems": 1,
                        "type": "array"
                      },
                      "monthDays": {
                        "items": {
                          "maximum": 31,
                          "minimum": -1,
                          "type": "integer"
                        },
                        "maxItems": 31,
                        "minItems": 1,
                        "type": "array"
                      },
                      "months": {
                        "items": {
                          "maximum": 12,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "maxItems": 12,
                        "minItems": 1,
                        "type": "array"
                      },
                      "nthWeekdays": {
                        "items": {
                          "properties": {
                            "nth": {
                              "maximum": 5,
                              "minimum": -1,
                              "type": "integer"
                            },
                            "weekdays": {
                              "items": {
                                "maximum": 6,
                                "minimum": 0,
                                "type": "integer"
                              },
                              "maxItems": 7,
                              "minItems": 1,
                              "type": "array"
                            }
                          },
                          "required": ["nth", "weekdays"],
                          "type": "object"
                        },
                        "maxItems": 5,
                        "minItems": 1,
                        "type": "array"
                      },
                      "skip": {
                        "items": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "maxItems": 100,
                        "type": "array"
                      },
                      "starts": {
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "times": {
                        "items": {
                          "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                          "type": "string"
                        },
                        "maxItems": 24,
                        "minItems": 1,
                        "type": "array"
                      },
                      "timezone": {
                        "maxLength": 64,
                        "minLength": 1,
                        "type": "string"
                      },
                      "weekdays": {
                        "items": {
                          "maximum": 6,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxItems": 7,
                        "minItems": 1,
                        "type": "array"
                      }
                    },
                    "required": ["freq", "timezone"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When it runs, like a calendar event repeats; use it for anything beyond a plain hourly/daily/weekly at one time (then omit interval). {\"freq\":\"hourly\"|\"daily\"|\"weekly\"|\"monthly\"|\"yearly\",\"every\":N,\"times\":[\"HH:MM\"],\"weekdays\":[0=Sun…6=Sat],\"monthDays\":[1…31,-1=last],\"nthWeekdays\":[{\"nth\":1…5|-1,\"weekdays\":[…]}],\"months\":[1…12],\"minutes\":[…],\"hours\":{\"from\",\"to\"},\"timezone\":\"<IANA>\",\"starts\",\"ends\",\"skip\":[\"YYYY-MM-DD\"]}. Examples: weekdays at 8 → {\"freq\":\"weekly\",\"weekdays\":[1,2,3,4,5],\"times\":[\"08:00\"],\"timezone\":\"America/Chicago\"}; the last business day of the month → {\"freq\":\"monthly\",\"nthWeekdays\":[{\"nth\":-1,\"weekdays\":[1,2,3,4,5]}],\"timezone\":\"…\"}; every other Friday → {\"freq\":\"weekly\",\"every\":2,\"weekdays\":[5],\"starts\":\"<a Friday>\",\"timezone\":\"…\"}. null clears it."
              },
              "scheduleDayOfWeek": {
                "anyOf": [
                  {
                    "maximum": 6,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "scheduleId": {
                "description": "Schedule id, from workbench_flows_schedules_list.",
                "type": "string"
              },
              "scheduleTime": {
                "anyOf": [
                  {
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "scheduleTimezone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["flowId", "scheduleId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Pause / resume / re-time a flow schedule"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
