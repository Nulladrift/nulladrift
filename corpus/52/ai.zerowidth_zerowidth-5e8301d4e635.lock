        {
          "name": "routines_create",
          "title": "Create a routine",
          "description": "Create a routine: something you keep doing for the user on a schedule, one turn per run (\"every morning, read these forums, add new questions to the Questions table, and post the count in #support\"). Each run has full workspace context and your machine where the workspace has machines. Use a routine when nobody but you acts on each run. Use a Task instead (workbench_tasks_create) when a person acts on each item before anything else happens, or the work is a process mapped in Compass. Name in writes the tools each run writes with on its own; other writes wait for approval on every run. A site read_webpage can't get needs routines_set_sites after this. Write the instruction in second person, as a directive to you on a future run. To run a specific built Workbench flow on a schedule, use workbench_flows_schedule instead: a routine runs an instruction, not a flow.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "actsFor": {
                "description": "Visibility: \"workspace\" (everyone sees it) or \"personal\" (just the owner). Default workspace.",
                "enum": ["workspace", "personal"],
                "type": "string"
              },
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation envelope.",
                "type": "string"
              },
              "delivery": {
                "description": "Where each run's briefing lands (default notification). \"room\" posts it in a team room for everyone there; pass roomId. The user must be in the room if it's private, and a \"personal\" routine can post only in a private room. Use it when the user names a room (\"…and post it in #claims\") or asks from inside one for the room.",
                "enum": ["notification", "email", "room"],
                "type": "string"
              },
              "instruction": {
                "description": "What to do on each run, as a directive.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "interval": {
                "description": "Plain cadence. Omit when passing recurrence.",
                "enum": ["daily", "weekly"],
                "type": "string"
              },
              "name": {
                "description": "Short display name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "recurrence": {
                "anyOf": [
                  {
                    "properties": {
                      "ends": {
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "every": {
                        "default": 1,
                        "maximum": 366,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "freq": {
                        "enum": ["hourly", "daily", "weekly", "monthly", "yearly"],
                        "type": "string"
                      },
                      "hours": {
                        "properties": {
                          "from": {
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                            "type": "string"
                          },
                          "to": {
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                            "type": "string"
                          }
                        },
                        "required": ["from", "to"],
                        "type": "object"
                      },
                      "minutes": {
                        "items": {
                          "maximum": 59,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxItems": 12,
                        "minItems": 1,
                        "type": "array"
                      },
                      "monthDays": {
                        "items": {
                          "maximum": 31,
                          "minimum": -1,
                          "type": "integer"
                        },
                        "maxItems": 31,
                        "minItems": 1,
                        "type": "array"
                      },
                      "months": {
                        "items": {
                          "maximum": 12,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "maxItems": 12,
                        "minItems": 1,
                        "type": "array"
                      },
                      "nthWeekdays": {
                        "items": {
                          "properties": {
                            "nth": {
                              "maximum": 5,
                              "minimum": -1,
                              "type": "integer"
                            },
                            "weekdays": {
                              "items": {
                                "maximum": 6,
                                "minimum": 0,
                                "type": "integer"
                              },
                              "maxItems": 7,
                              "minItems": 1,
                              "type": "array"
                            }
                          },
                          "required": ["nth", "weekdays"],
                          "type": "object"
                        },
                        "maxItems": 5,
                        "minItems": 1,
                        "type": "array"
                      },
                      "skip": {
                        "items": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "maxItems": 100,
                        "type": "array"
                      },
                      "starts": {
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "times": {
                        "items": {
                          "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                          "type": "string"
                        },
                        "maxItems": 24,
                        "minItems": 1,
                        "type": "array"
                      },
                      "timezone": {
                        "maxLength": 64,
                        "minLength": 1,
                        "type": "string"
                      },
                      "weekdays": {
                        "items": {
                          "maximum": 6,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxItems": 7,
                        "minItems": 1,
                        "type": "array"
                      }
                    },
                    "required": ["freq", "timezone"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When it runs, like a calendar event repeats; use it for anything beyond a plain hourly/daily/weekly at one time (then omit interval). {\"freq\":\"hourly\"|\"daily\"|\"weekly\"|\"monthly\"|\"yearly\",\"every\":N,\"times\":[\"HH:MM\"],\"weekdays\":[0=Sun…6=Sat],\"monthDays\":[1…31,-1=last],\"nthWeekdays\":[{\"nth\":1…5|-1,\"weekdays\":[…]}],\"months\":[1…12],\"minutes\":[…],\"hours\":{\"from\",\"to\"},\"timezone\":\"<IANA>\",\"starts\",\"ends\",\"skip\":[\"YYYY-MM-DD\"]}. Examples: weekdays at 8 → {\"freq\":\"weekly\",\"weekdays\":[1,2,3,4,5],\"times\":[\"08:00\"],\"timezone\":\"America/Chicago\"}; the last business day of the month → {\"freq\":\"monthly\",\"nthWeekdays\":[{\"nth\":-1,\"weekdays\":[1,2,3,4,5]}],\"timezone\":\"…\"}; every other Friday → {\"freq\":\"weekly\",\"every\":2,\"weekdays\":[5],\"starts\":\"<a Friday>\",\"timezone\":\"…\"}. null clears it."
              },
              "roomId": {
                "description": "With delivery \"room\": the room to post in (rooms_list gives ids).",
                "type": "string"
              },
              "scheduleDayOfWeek": {
                "description": "Weekly only: 0=Sunday … 6=Saturday (default Monday).",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "scheduleTime": {
                "description": "Wall-clock \"HH:MM\" anchor (default 09:00).",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "scheduleTimezone": {
                "description": "IANA timezone for the anchor (default UTC).",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              },
              "writes": {
                "description": "Tools each run writes with on its own, without asking: the ones the job needs every time, like [\"napkin_tables_add_records\"]. The person approves this list once, with this call. Any other write waits for approval on every run, and emails, invites, shares, publishing, schedules, deletes and starting other work always wait, even when listed.",
                "items": {
                  "pattern": "^[a-z][a-z0-9_]{1,79}$",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["instruction", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a routine"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f84e6fd7674953c65aa131a215f3065ed5be8a816bfd551cfd3127b0e48af4fd"
