                  {
                    "type": "null"
                  }
                ],
                "description": "What the closing chat should be about; null clears."
              },
              "publish": {
                "const": true,
                "type": "boolean"
              },
              "questions": {
                "description": "Replacement instrument (drafts only): ordered list of { type, prompt, options?, … } — read prism_studies_get for the shape.",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "allowOther": {
                      "type": "boolean"
                    },
                    "anchorLast": {
                      "maximum": 5,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "contextImageUrl": {
                      "maxLength": 1000,
                      "type": "string"
                    },
                    "contextText": {
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "exclusiveLast": {
                      "type": "boolean"
                    },
                    "highLabel": {
                      "type": "string"
                    },
                    "kanoRole": {
                      "enum": ["functional", "dysfunctional"],
                      "type": "string"
                    },
                    "loopId": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "loopItem": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "loopPresentation": {
                      "enum": ["paged", "grid"],
                      "type": "string"
                    },
                    "loopRotate": {
                      "type": "boolean"
                    },
                    "lowLabel": {
                      "type": "string"
                    },
                    "maxSelections": {
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "maxdiffId": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "numberMax": {
                      "type": "number"
                    },
                    "numberMin": {
                      "type": "number"
                    },
                    "options": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "otherLabel": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "placeholder": {
                      "type": "string"
                    },
                    "prefix": {
                      "type": "string"
                    },
                    "probe": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "prompt": {
                      "type": "string"
                    },
                    "qid": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "rotate": {
                      "type": "boolean"
                    },
                    "scaleMax": {
                      "maximum": 20,
                      "minimum": 2,
                      "type": "integer"
                    },
                    "scaleMin": {
                      "maximum": 10,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "screenOutOptions": {
                      "items": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "showIf": {
                      "properties": {
                        "anyOf": {
                          "items": {
                            "maxLength": 200,
                            "type": "string"
                          },
                          "maxItems": 20,
                          "type": "array"
                        },
                        "gte": {
                          "type": "number"
                        },
                        "lte": {
                          "type": "number"
                        },
                        "qid": {
                          "maxLength": 40,
                          "type": "string"
                        }
                      },
                      "required": ["qid"],
                      "type": "object"
                    },
                    "susIndex": {
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "type": {
                      "enum": ["word", "text", "choice", "multi", "rank", "maxdiff", "scale", "number", "completion"],
                      "type": "string"
                    },
                    "vwRole": {
                      "enum": ["too_cheap", "cheap", "expensive", "too_expensive"],
