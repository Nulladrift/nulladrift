                "type": "string"
              },
              "systemPrompt": {
                "description": "The draft's behavior — production-quality first attempt with [STUB: ...] / [FILL IN: ...] markers where reality is missing. Required for structurer and classifier. Leave it out of an agent to get the bare model with no instructions (a 'promptless' agent).",
                "type": "string"
              },
              "variables": {
