        {
          "name": "workspace_setup",
          "title": "Set up folders and rooms for their work",
          "description": "Creates folders for the work someone described, rooms linked to those folders (with your first message in each, the concrete next step), and starting pieces filed inside. Records what the workspace is for, which orders what home offers first. Use it once you know what they're working on, typically near the end of setting a workspace up. Say in one sentence what you're setting up and call it; the approval card lists the folders, rooms, and pieces, so don't list them in words too. Every workspace already has a General room, so don't recreate it. May return needs_confirmation; then wait for approval.\n\nStarting shapes by kind of work (adapt, drop, or combine; name everything after what they told you):\n- process_redesign: a folder per process being changed (\"Claims intake redesign\"). Pieces: a Compass page with pageType WORKFLOW describing how it works today, a Napkin diagram of current and proposed steps, a doc for the change plan. Room: \"<process> redesign\". After setup, offer a Ledger expectation for the metric they want to move.\n- research: a folder per study or question. Pieces: a research-plan doc (question, who, method), a synthesis doc. Room: \"<topic> research\". After setup, offer a Prism field for the question.\n- ai_design: a folder per AI feature. Pieces: a spec doc (what it does, for whom, what good looks like), a Caliper dataset for test cases. Room: the feature's name, with the flow in it once one exists (file an existing flow via existing). After setup, offer to scaffold the flow and a rubric.\n- knowledge: a folder per domain. Pieces: Compass pages for the main topics. Room: \"Ask about <domain>\".\n- exploring: usually nothing beyond their priorities and the General room; offer one small first thing instead.\nPriorities are Compass pages made with compass_pages_create before this, not pieces here; name folders after the work that moves them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation envelope.",
                "type": "string"
              },
              "folders": {
                "items": {
                  "properties": {
                    "existing": {
                      "description": "Things that already exist to file in, e.g. { kind: 'workbench_flow', id }.",
                      "items": {
                        "properties": {
                          "id": {
                            "type": "string"
                          },
                          "kind": {
                            "type": "string"
                          }
                        },
                        "required": ["id", "kind"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "description": "Named after their actual work.",
                      "type": "string"
                    },
                    "pieces": {
                      "items": {
                        "properties": {
                          "body": {
                            "description": "Markdown for a page or doc (a short outline, no filler); diagram text for a diagram; a description for a dataset.",
                            "type": "string"
                          },
                          "kind": {
                            "enum": ["compass_page", "napkin_doc", "napkin_diagram", "napkin_board", "napkin_sheet", "caliper_dataset"],
                            "type": "string"
                          },
                          "pageType": {
                            "description": "Compass page type, e.g. WORKFLOW.",
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          }
                        },
                        "required": ["kind", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "rooms": {
                      "items": {
                        "properties": {
                          "flowIds": {
                            "description": "Published, workspace-shared flows to bring in.",
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "name": {
                            "type": "string"
                          },
                          "opening": {
                            "description": "Your first message in the room: the concrete next step.",
                            "type": "string"
                          },
                          "private": {
                            "description": "Members only. Use it when they describe the work as sensitive or not for everyone yet (leadership, people matters, pricing, anything they call confidential). Default is open to the workspace.",
                            "type": "boolean"
                          }
                        },
                        "required": ["name"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "workKinds": {
                "description": "What the workspace is for, from what they said.",
                "items": {
                  "enum": ["process_redesign", "research", "ai_design", "knowledge", "exploring"],
                  "type": "string"
                },
                "type": "array"
              },
              "workspace": {
                "description": "Workspace slug. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["folders"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set up folders and rooms for their work"
