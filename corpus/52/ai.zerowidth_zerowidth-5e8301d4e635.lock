        {
          "name": "workbench_flows_update",
          "title": "Rename / describe / archive / re-scope a Workbench flow",
          "description": "Changes a flow's name, description, visibility, tags, or archived state — the metadata around the flow, NOT its orchestration (prompts and nodes change through workbench_flows_edit_text). Pass only what changes. Archiving hides the flow from the default gallery but leaves it runnable, scheduled, and shared; pass archived: false to restore. May return `needs_confirmation`.",
