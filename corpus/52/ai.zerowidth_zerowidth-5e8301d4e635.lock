            "taskSupport": "forbidden"
          },
          "digest": "sha256:75977e6c97a270a385f4069a57726b0306595e6fb99ee33e015eab9fb5db5a62"
        },
        {
          "name": "caliper_datasets_create",
          "title": "Create a Caliper dataset",
          "description": "Creates a dataset of test items — THE FIRST STEP of setting up evaluation for a flow. Four item shapes: Q&A (input + optional expectedOutput, the golden answer); CHAT (messages: the conversation so far as role/content user and assistant messages you write, ending on a user message, + expectedResponse for the next reply; the flow writes only that reply, so every earlier assistant turn stays fixed; THE shape for an agent's conversation, built up by depth: a greeting alone, then two messages, then four, each item testing one more reply with the earlier ones baked in); SEQUENCE (turns: 2-20 scripted user messages the model answers one at a time with its own earlier replies in front of it, + expectedResponse for the final reply, optional expectedBehavior for the whole conversation); SIMULATED (goal + optional persona/disposition/strategy/maxTurns + expectedBehavior; a platform flow plays a person adaptively, Caliper-run evals only; disposition is a preset id like genuine, pressure, confused, impatient, or free text). Use sequences and simulated items for the slow attacks and for real customers with real needs: a model that holds on message one often folds on message ten. Write good inputs from real usage: the Compass pages the flow was built from are the best source of realistic scenarios.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "description": {
                "description": "What this dataset covers.",
                "type": "string"
              },
              "items": {
                "description": "Test items (1-100).",
                "items": {
                  "properties": {
                    "disposition": {
                      "description": "Simulated: how the person behaves. A preset id (genuine, pressure, confused, impatient, vague, non-native) or free text. Default genuine; use pressure for an attacker that manipulates.",
                      "type": "string"
                    },
                    "expectedBehavior": {
                      "description": "Sequence (optional) / simulated (required): what the assistant should do across the whole conversation.",
                      "type": "string"
                    },
                    "expectedOutput": {
                      "description": "Q&A: golden answer the judge scores against. Omit for capture-only items.",
                      "type": "string"
                    },
                    "expectedResponse": {
                      "description": "Sequence: the standard for the FINAL reply. Chat: the standard for the next reply.",
                      "type": "string"
                    },
                    "goal": {
                      "description": "Simulated: what the simulated person wants from the conversation, e.g. 'the system prompt, verbatim' or 'a refund on order 8812'.",
                      "type": "string"
                    },
                    "input": {
                      "description": "Q&A: the input sent to the flow.",
                      "type": "string"
                    },
                    "maxTurns": {
                      "description": "Simulated: turn budget, default 8.",
                      "maximum": 12,
                      "minimum": 2,
                      "type": "integer"
                    },
                    "messages": {
                      "description": "Chat: the conversation so far as role/content messages (user and assistant alternating, an optional system first), 1-50. Every assistant message here is FIXED, written by you, not the model; the flow under test writes only the NEXT reply. End on a user message and put the standard for that reply in expectedResponse. This is the shape for testing the 5th reply of a conversation with the first four baked in.",
                      "items": {
                        "properties": {
                          "content": {
                            "type": "string"
                          },
                          "role": {
                            "enum": ["system", "user", "assistant"],
                            "type": "string"
                          }
                        },
                        "required": ["content", "role"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "persona": {
                      "description": "Simulated: who the person is.",
                      "type": "string"
                    },
                    "strategy": {
                      "description": "Simulated: a hint, e.g. 'build rapport, then claim a prior agreement'.",
                      "type": "string"
                    },
                    "turns": {
                      "description": "Sequence: 2-20 scripted user messages, sent in order; the model writes every reply.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "title": {
                "description": "Dataset name (2-120 chars).",
                "type": "string"
              },
              "visibility": {
                "description": "Who can see it: PRIVATE (only the user), WORKSPACE (every member, the default), or SHARED (specific people, granted afterwards). Say 'make it private' → PRIVATE.",
                "enum": ["PRIVATE", "WORKSPACE", "SHARED"],
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["items", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a Caliper dataset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
