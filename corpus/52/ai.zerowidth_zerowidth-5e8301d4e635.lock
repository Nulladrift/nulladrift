        {
          "name": "ledger_plan_add",
          "title": "Add dated work to a Ledger decision",
          "description": "Adds a plan item to an OPEN decision (the work that carries it out: a post, a launch step, an email). Omit entryId for a standalone date (a holiday, an event you're only watching). Items are all-day unless you pass startTime with timeZone (and optionally endTime), for a webinar, a scheduled post, or a launch at noon. If the date costs money or time and comes with an expectation, record it as a decision with ledger_entries_create instead. Use repeatWeeklyUntil for a weekly cadence: it writes one row per week (max 60), each movable on its own. Fails with conflict once the decision is settled. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation envelope.",
                "type": "string"
              },
              "dueOn": {
                "description": "A calendar day, YYYY-MM-DD.",
                "type": "string"
              },
              "endTime": {
                "description": "Same-day end, after startTime.",
                "type": "string"
              },
              "entryId": {
                "description": "The open decision this carries out.",
                "type": "string"
              },
              "note": {
                "maxLength": 2000,
                "type": "string"
              },
              "ownerUserId": {
                "description": "A workspace member's user id.",
                "type": "string"
              },
              "repeatWeeklyUntil": {
                "description": "Also add a copy every 7 days through this day.",
                "type": "string"
              },
              "startTime": {
                "description": "Omit for an all-day item. 24-hour HH:MM in timeZone.",
                "type": "string"
              },
              "tags": {
                "description": "What kind of work it is: blog, video, social, event… Reuse the workspace's existing tags (see ledger_plan_list).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "timeZone": {
                "description": "IANA zone the time is in (America/Chicago). Required with startTime; use the user's own zone.",
                "type": "string"
              },
              "title": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Where the work lives (draft, deck, published post).",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this; tokens with a default can override per call. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["dueOn", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add dated work to a Ledger decision"
