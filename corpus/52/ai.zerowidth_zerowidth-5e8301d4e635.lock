        {
          "name": "prism_studies_update",
          "title": "Edit, publish, open, or close a study",
          "description": "publish: true takes a draft live (one-way — the participant link starts working). closed toggles whether a live study accepts responses. Also edits the study: title, the `questions` instrument (whole replacement — read prism_studies_get first; LOCKED once responses exist, the server refuses with `invalid` and the answer is a new study), `adaptiveFollowUps` (AI probes on curious answers), the closing chat (`endChatEnabled` + `endChatFocus`), `completionRedirectUrl` for a BYO panel (null clears), and `autoAnalyzeTarget` (null = manual only). Study ids come from prism_studies_list_workspace. May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adaptiveFollowUps": {
                "type": "boolean"
              },
              "approvalId": {
                "type": "string"
              },
              "autoAnalyzeTarget": {
                "anyOf": [
                  {
                    "maximum": 1000,
                    "minimum": 2,
                    "type": "integer"
                  },
                  {
                    "type": "null"
