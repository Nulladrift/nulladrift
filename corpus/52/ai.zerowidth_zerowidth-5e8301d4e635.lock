        {
          "name": "workbench_flows_schedule",
          "title": "Schedule a Workbench flow",
          "description": "Set a specific built flow to run automatically on a cadence — the deterministic counterpart to a routine. Each run executes the flow's latest PUBLISHED revision with the fixed `input` envelope and routes the output per `delivery`. USE THIS when the user wants a flow they've built to run on a schedule (\"run my digest flow every morning\"). Do NOT create a routine for this — a routine runs a free-form instruction, not a built flow. The schedule runs the PUBLISHED flow, so the flow must be published (check workbench_flows_revisions_list; publish with workbench_flows_publish if it isn't). `input` is fixed for every run, so the flow itself should fetch anything time-varying at run time. Manage existing schedules with workbench_flows_schedules_list / workbench_flows_schedules_update.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "delivery": {
                "enum": ["history", "notification", "email"],
                "type": "string"
              },
              "flowId": {
                "description": "Flow to schedule (id from workbench_flows_list).",
                "type": "string"
              },
              "input": {
                "description": "Fixed input envelope every run executes with — {\"kind\":\"chat\",\"messages\":[…]} or {\"kind\":\"form\",\"values\":{…}}, the same shape workbench_flows_run takes. Constant across runs.",
                "oneOf": [
                  {
                    "properties": {
                      "kind": {
                        "const": "chat",
                        "type": "string"
                      },
                      "messages": {
                        "items": {
                          "additionalProperties": {},
                          "properties": {
                            "content": {
                              "anyOf": [
                                {
                                  "type": "string"
                                },
                                {
                                  "items": {},
                                  "type": "array"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "name": {
                              "type": "string"
                            },
                            "role": {
                              "type": "string"
                            },
                            "tool_call_id": {
                              "type": "string"
                            },
                            "tool_calls": {
                              "items": {
                                "additionalProperties": {},
                                "properties": {
                                  "function": {
                                    "additionalProperties": {},
                                    "properties": {
                                      "arguments": {},
                                      "name": {
                                        "type": "string"
                                      }
                                    },
                                    "type": "object"
                                  },
                                  "id": {
                                    "type": "string"
                                  },
                                  "type": {
                                    "type": "string"
                                  }
                                },
                                "type": "object"
                              },
                              "type": "array"
                            }
                          },
                          "required": ["role"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "values": {
                        "additionalProperties": {},
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      }
                    },
                    "required": ["kind", "messages"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "kind": {
                        "const": "form",
                        "type": "string"
                      },
                      "values": {
                        "additionalProperties": {},
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      }
                    },
                    "required": ["kind", "values"],
                    "type": "object"
                  }
                ]
              },
              "interval": {
                "description": "Plain cadence: hourly, daily, or weekly. Omit when passing recurrence.",
                "enum": ["hourly", "daily", "weekly"],
                "type": "string"
              },
              "label": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "recurrence": {
                "anyOf": [
                  {
                    "properties": {
                      "ends": {
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "every": {
                        "default": 1,
                        "maximum": 366,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "freq": {
                        "enum": ["hourly", "daily", "weekly", "monthly", "yearly"],
                        "type": "string"
                      },
                      "hours": {
                        "properties": {
                          "from": {
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                            "type": "string"
                          },
                          "to": {
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                            "type": "string"
                          }
                        },
                        "required": ["from", "to"],
                        "type": "object"
                      },
                      "minutes": {
                        "items": {
                          "maximum": 59,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxItems": 12,
                        "minItems": 1,
                        "type": "array"
                      },
                      "monthDays": {
                        "items": {
                          "maximum": 31,
                          "minimum": -1,
                          "type": "integer"
                        },
                        "maxItems": 31,
                        "minItems": 1,
                        "type": "array"
                      },
                      "months": {
                        "items": {
                          "maximum": 12,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "maxItems": 12,
                        "minItems": 1,
                        "type": "array"
                      },
                      "nthWeekdays": {
                        "items": {
                          "properties": {
                            "nth": {
                              "maximum": 5,
                              "minimum": -1,
                              "type": "integer"
                            },
                            "weekdays": {
                              "items": {
                                "maximum": 6,
                                "minimum": 0,
                                "type": "integer"
                              },
                              "maxItems": 7,
                              "minItems": 1,
                              "type": "array"
                            }
                          },
                          "required": ["nth", "weekdays"],
                          "type": "object"
                        },
                        "maxItems": 5,
                        "minItems": 1,
                        "type": "array"
                      },
                      "skip": {
                        "items": {
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "maxItems": 100,
                        "type": "array"
                      },
                      "starts": {
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "times": {
                        "items": {
                          "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                          "type": "string"
                        },
                        "maxItems": 24,
                        "minItems": 1,
                        "type": "array"
                      },
                      "timezone": {
                        "maxLength": 64,
                        "minLength": 1,
                        "type": "string"
                      },
                      "weekdays": {
                        "items": {
                          "maximum": 6,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxItems": 7,
                        "minItems": 1,
                        "type": "array"
                      }
                    },
                    "required": ["freq", "timezone"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When it runs, like a calendar event repeats; use it for anything beyond a plain hourly/daily/weekly at one time (then omit interval). {\"freq\":\"hourly\"|\"daily\"|\"weekly\"|\"monthly\"|\"yearly\",\"every\":N,\"times\":[\"HH:MM\"],\"weekdays\":[0=Sun…6=Sat],\"monthDays\":[1…31,-1=last],\"nthWeekdays\":[{\"nth\":1…5|-1,\"weekdays\":[…]}],\"months\":[1…12],\"minutes\":[…],\"hours\":{\"from\",\"to\"},\"timezone\":\"<IANA>\",\"starts\",\"ends\",\"skip\":[\"YYYY-MM-DD\"]}. Examples: weekdays at 8 → {\"freq\":\"weekly\",\"weekdays\":[1,2,3,4,5],\"times\":[\"08:00\"],\"timezone\":\"America/Chicago\"}; the last business day of the month → {\"freq\":\"monthly\",\"nthWeekdays\":[{\"nth\":-1,\"weekdays\":[1,2,3,4,5]}],\"timezone\":\"…\"}; every other Friday → {\"freq\":\"weekly\",\"every\":2,\"weekdays\":[5],\"starts\":\"<a Friday>\",\"timezone\":\"…\"}. null clears it."
              },
              "scheduleDayOfWeek": {
                "anyOf": [
                  {
                    "maximum": 6,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "scheduleTime": {
                "anyOf": [
                  {
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "scheduleTimezone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "workspace": {
                "description": "Workspace slug. Personal tokens with no default workspace MUST pass this. Ignored for workspace API keys.",
                "type": "string"
              }
            },
            "required": ["flowId", "input"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Schedule a Workbench flow"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
