        {
          "name": "caliper_datasets_update",
          "title": "Rename / re-describe / re-scope a Caliper dataset",
          "description": "Changes a dataset's title, description, or visibility. Pass only what changes; items are untouched (use caliper_datasets_add_items / caliper_datasets_update_item / caliper_datasets_remove_item for those). May return `needs_confirmation`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalId": {
                "description": "Approval id from a prior needs_confirmation response. Omit on the first call.",
                "type": "string"
              },
              "datasetId": {
                "description": "Dataset id, from caliper_datasets_list.",
                "type": "string"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "New description; null clears it."
              },
              "title": {
                "description": "New name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "visibility": {
                "description": "Who can see it: PRIVATE (only the user), WORKSPACE (every member, the default), or SHARED (specific people, granted afterwards). Say 'make it private' → PRIVATE.",
                "enum": ["PRIVATE", "WORKSPACE", "SHARED"],
                "type": "string"
