      },
      "transport": {
        "type": "http",
        "url": "https://www.edgethirteen.com/api/mcp/dcf-calculator"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dcf-calculator",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "compute_dcf",
          "description": "Compute a simplified discounted-cash-flow intrinsic value per share: project free cash flow per share forward at a constant growth rate, discount back at a discount rate, add a Gordon-growth terminal value. Pass fcf/growth/discount/terminal/years directly (these are judgment calls, not looked up). Optionally pass a ticker to auto-fill the current price for a margin-of-safety comparison.",
          "inputSchema": {
            "properties": {
              "discount": {
                "description": "Discount rate, in percent, e.g. 10",
                "type": "number"
              },
              "fcf": {
                "description": "Free cash flow per share",
                "type": "number"
              },
              "growth": {
                "description": "Growth rate for the projection years, in percent, e.g. 8",
                "type": "number"
              },
              "price": {
                "description": "Current price, used instead of a ticker lookup",
                "type": "number"
              },
              "terminal": {
                "description": "Terminal growth rate, in percent, e.g. 2.5",
                "type": "number"
              },
              "ticker": {
                "description": "Optional ticker, used only to fetch the current price",
                "type": "string"
              },
              "years": {
                "description": "Number of projection years, e.g. 10",
                "type": "number"
              }
            },
            "required": ["discount", "fcf", "growth", "terminal", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bd03d2489ce2bbebbdca32b71c14734ce92e0d81afe1989fb7ca3595e75b6dad"
        }
      ],
      "digest": "sha256:850a07354ef636f5bf57a72a47f04a450bdb68b72b2c5de19217125e548dfe44"
    }
  }
}
