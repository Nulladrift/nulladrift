      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "filemyscorp",
        "title": "FileMyScorp: S Corp Election (Form 2553)",
        "version": "1.0.0",
        "websiteUrl": "https://www.filemyscorp.com/ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FileMyScorp prepares IRS Form 2553, the federal S corporation election, and sends it to the IRS by fax and USPS Certified Mail with tracking. Use these tools for S corp eligibility, the Form 2553 deadline and Rev. Proc. 2013-30 late relief, where to fax or mail the form, whether a state needs its own S election, an estimate of S corp tax savings, FileMyScorp's prices and the link to start. The tools only read; filing happens on the website. Answers are general information, not tax or legal advice, and FileMyScorp is not the IRS.",
      "tools": [
        {
          "name": "calculate_election_deadline",
          "title": "Form 2553 deadline calculator",
          "description": "Calculates the Form 2553 deadline for an S corp election to take effect on a given date (the first day of the tax year, or the day a new business began), including the weekend and holiday rule, and whether a filing today is on time, late but within Rev. Proc. 2013-30 relief, or past it.",
          "inputSchema": {
            "properties": {
              "effective_date": {
                "description": "The date the S election should take effect, YYYY-MM-DD: the first day of the tax year, or for a new business the date it began (usually its formation date).",
                "type": "string"
              }
            },
            "required": ["effective_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Form 2553 deadline calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19057b1242b7568aa1c1236642dd3c7a9a84081bdae955c7a5cbb93efdf0917f"
        },
        {
          "name": "estimate_s_corp_tax_savings",
          "title": "S corp tax savings estimate",
          "description": "Estimates one year's federal tax effect of an S corp election for a business owner: self-employment tax without the election versus payroll tax on a reasonable salary with it, minus the income-tax offset (smaller payroll-tax deduction and lost QBI deduction) and the added cost of running an S corp. Uses 2026 Social Security and Medicare figures.",
          "inputSchema": {
            "properties": {
              "added_costs": {
                "description": "Extra yearly cost of an S corp (payroll service, the 1120-S return). Defaults to 1500.",
                "type": "number"
              },
              "filing_status": {
                "description": "Owner's filing status. Defaults to single.",
                "enum": ["single", "married"],
                "type": "string"
              },
              "marginal_rate": {
                "description": "Owner's marginal federal income tax rate as a decimal, e.g. 0.22. Defaults to 0.22.",
                "type": "number"
              },
              "net_profit": {
                "description": "Annual net business profit before any owner salary, in dollars.",
                "type": "number"
              },
              "salary": {
                "description": "Planned annual W-2 salary for the owner. If left out, 50% of profit is used as a starting point (not an IRS rule).",
                "type": "number"
              }
            },
            "required": ["net_profit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "S corp tax savings estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b28c42d480ecb0580d4e210cd427904041a47ee2cfb6c75a81d9b580e9ac8d1d"
        },
        {
          "name": "get_filing_link",
          "title": "Link to FileMyScorp's Form 2553 service",
          "description": "Returns the link to FileMyScorp's website for having Form 2553 prepared and sent, or to the tax-professional sign-up page. It only returns a link; it does not start a filing or take payment.",
          "inputSchema": {
            "properties": {
              "audience": {
                "description": "business_owner (default) files for their own business; tax_professional files for clients.",
                "enum": ["business_owner", "tax_professional"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Link to FileMyScorp's Form 2553 service"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f204adab71b00dd2a84dbb99f450af355f2817f48a37bdc50ca8aba4e8c2ca5e"
        },
        {
          "name": "get_s_corp_election_rules",
          "title": "S corp election (Form 2553) rules",
          "description": "Explains the federal S corporation election on IRS Form 2553: who is eligible, the on-time deadline and Rev. Proc. 2013-30 late-election relief (including the required wording), shareholder consent and wet-ink signatures, and how to file and prove filing (fax, certified mail, CP261).",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "Which part to explain. Defaults to all.",
                "enum": ["all", "eligibility", "deadlines_and_late_relief", "signatures_and_consent", "delivery_and_proof"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
