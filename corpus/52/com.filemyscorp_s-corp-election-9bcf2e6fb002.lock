        },
        {
          "name": "get_state_s_election_rules",
          "title": "Does my state need its own S election?",
          "description": "Whether a US state requires its own S corporation election after federal Form 2553, and any state paperwork or entity-level tax that still applies (New York's Form CT-6, New Jersey, Georgia, DC, Tennessee, New Hampshire and the rest).",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "US state, DC or territory where the business is located, as a two-letter code or name, e.g. 'NY' or 'Texas'.",
                "type": "string"
              }
