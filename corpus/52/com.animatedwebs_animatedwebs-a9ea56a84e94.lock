        {
          "name": "get_component",
          "title": "Get an AnimatedWebs UI component",
          "description": "Returns one AnimatedWebs UI library component by id: description, runtime, interaction, tags, every variant with live URL and thumbnail, import name, shadcn install command, and with include_source true its complete source code (Pro). Use it after search_catalog (kind components) to inspect a component and then add it to a project; use generate_component instead when nothing in the library fits. Details never spend a credit. include_source needs AnimatedWebs Pro (others get an error with the pricing link) and returns code: the renderer and shared files with a per-account watermark, filling about 120,000 characters; files that did not fit have no code and are named in code.omitted, so call again with that path to get one file. New components count toward a fair-use cap (40 per 10 minutes, 150 a day, 500 a week, shared with get_background) that never blocks one already opened today. Unknown ids return an error. Example: {\"id\":\"aurora-hero\",\"include_source\":true}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Component id exactly as returned by search_catalog (kind components), e.g. 'aurora-hero'.",
                "type": "string"
              },
              "include_source": {
                "default": false,
                "description": "true adds code with the source files (Pro only). Default false: public details only.",
                "type": "boolean"
              },
              "path": {
                "description": "One file path from code.files or code.omitted of an earlier call for the same id; returns only that file in code.files. Implies include_source.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "code": {
                "additionalProperties": false,
                "description": "Only with include_source or path",
                "properties": {
                  "assets": {
                    "description": "Asset list from the source bundle"
                  },
                  "exportName": {
                    "type": "string"
                  },
                  "files": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "bytes": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "code": {
                          "description": "Missing when the file did not fit; fetch it with path",
                          "type": "string"
                        },
                        "language": {
                          "type": "string"
                        },
                        "lines": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "path": {
                          "type": "string"
                        },
                        "shared": {
                          "description": "Shared helper used by several components",
                          "type": "boolean"
                        }
                      },
                      "required": ["bytes", "language", "lines", "path", "shared"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "omitted": {
                    "description": "Paths without code in this reply",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "runtime": {
                    "type": "string"
                  }
                },
                "required": ["exportName", "files", "omitted", "runtime"],
                "type": "object"
              },
              "description": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "importName": {
                "type": ["string", "null"]
              },
              "install": {
                "type": ["string", "null"]
              },
              "interaction": {
                "type": ["string", "null"]
              },
              "license": {
                "type": "string"
              },
              "runtime": {
                "type": ["string", "null"]
              },
              "shadcnInstall": {
                "type": "string"
              },
              "shadcnSetup": {
                "type": "string"
              },
              "source": {
                "description": "pro: full source available with AnimatedWebs Pro; none: no source bundle",
                "enum": ["pro", "none"],
                "type": "string"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "thumbnail": {
                "type": ["string", "null"]
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "variants": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "thumbnail": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["description", "id", "thumbnail", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["category", "description", "id", "importName", "install", "interaction", "license", "runtime", "shadcnInstall", "shadcnSetup", "source", "tags", "thumbnail", "title", "url", "variants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
