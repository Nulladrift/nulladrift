      "serverInfo": {
        "name": "animatedwebs",
        "title": "AnimatedWebs",
        "version": "1.4.0",
        "description": "AnimatedWebs: 1,624 animated web templates (websites, sections, backgrounds, components) with AI build prompts, 477 playable live demos, design systems (DESIGN.md, Tailwind tokens, CSS variables) and 15 MCP tools; free accounts get every free template.",
        "websiteUrl": "https://animatedwebs.com",
        "icons": [
          {
            "src": "https://animatedwebs.com/brand/animatedwebs-mark.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://animatedwebs.com/brand/animatedwebs-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
