        {
          "name": "manage_request",
          "title": "Manage my AnimatedWebs template requests",
          "description": "Lists, checks or cancels the signed-in account's own template requests (sent with request_template or the contact form's template-request topic). Use it to follow up on a request instead of sending it again; use request_template to send a new one. action list (default) returns recent requests newest first; action status returns one request by id; action cancel withdraws one request by id, which only works while it is still received (not yet reviewed) and marks it cancelled so the team skips it. Each request has id, createdAt, the first 200 characters and status (received, reviewed or cancelled). Only the account's own requests are visible or cancellable: another account's id answers as not found. list and status change nothing; cancel cannot be undone (send a new request instead). Examples: {\"action\":\"list\",\"limit\":5}, {\"action\":\"cancel\",\"id\":42}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "action": {
                "default": "list",
                "description": "list (default): recent requests. status: one request by id. cancel: withdraw one received request by id.",
                "enum": ["list", "status", "cancel"],
                "type": "string"
              },
              "id": {
                "description": "Request id as returned by request_template or list. Required for status and cancel.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "description": "For list: how many recent requests, 1 to 50 (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "action": {
                "enum": ["list", "status", "cancel"],
                "type": "string"
              },
              "requests": {
                "description": "For status and cancel: the one request, after the change",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "createdAt": {
                      "type": "string"
                    },
                    "id": {
                      "type": "number"
                    },
                    "request": {
                      "description": "First 200 characters",
                      "type": "string"
                    },
                    "status": {
                      "description": "received: in the team's inbox, not reviewed yet; reviewed: handled by the team; cancelled: withdrawn by you",
                      "enum": ["received", "reviewed", "cancelled"],
                      "type": "string"
                    }
                  },
                  "required": ["createdAt", "id", "request", "status"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["action", "requests"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Manage my AnimatedWebs template requests"
