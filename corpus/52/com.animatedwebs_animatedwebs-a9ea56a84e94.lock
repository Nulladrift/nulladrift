        {
          "name": "get_creator",
          "title": "Get an AnimatedWebs creator",
          "description": "Returns one verified AnimatedWebs creator's public profile by handle (name, headline, bio, website, stack, specialties, tier, certificate number, profile URL) and their live templates (title, tagline, kind, access, price in USD, stack, demo and preview URLs). Use it after search_catalog (kind creators); for catalog templates use get_template. Never includes prompts. Read-only. Unknown or unverified handles return an error. Example: {\"handle\":\"ada\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "description": "Creator handle as returned by search_catalog (kind creators); case-insensitive, no leading slash or @, e.g. 'ada'.",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "bio": {
                "type": ["string", "null"]
              },
              "certificate_no": {
                "type": ["string", "null"]
              },
              "display_name": {
                "type": ["string", "null"]
              },
              "handle": {
                "type": "string"
              },
              "headline": {
                "type": ["string", "null"]
              },
              "specialties": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "stack": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "templates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "access": {
                      "type": ["string", "null"]
                    },
                    "demo_url": {
                      "type": ["string", "null"]
                    },
                    "kind": {
                      "type": ["string", "null"]
                    },
                    "preview_url": {
                      "type": ["string", "null"]
                    },
                    "price": {
                      "description": "USD, 0 when free",
                      "type": "number"
                    },
                    "stack": {
                      "anyOf": [
                        {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "tagline": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["access", "demo_url", "kind", "preview_url", "price", "stack", "tagline", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "tier": {
                "type": ["string", "null"]
              },
              "url": {
                "type": "string"
              },
              "website": {
                "type": ["string", "null"]
