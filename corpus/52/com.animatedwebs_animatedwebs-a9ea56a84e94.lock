      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AnimatedWebs MCP. Every tool call needs a signed-in session (OAuth 2.1, protected-resource metadata at /.well-known/oauth-protected-resource) or an API key sent as 'Authorization: Bearer aw_...' from /dashboard/developer; tools/list, prompts/list and resources/list work without sign-in. The server allows 240 requests a minute per client address and answers 429 with retry_after beyond that. Routing: search_catalog finds anything (AnimatedWebs templates, UI components, cinematic backgrounds, style references, creators; kind narrows it, an empty query browses, nextCursor pages); list_categories gives valid category values. Templates: get_template for details, with include_prompt true to build it here, or open_builder to hand it to Lovable, v0 or Bolt. UI components: get_component, with include_source true for code (Pro); generate_component and refine_component create and edit one (daily limit shared). Backgrounds: get_background. Style references: get_style_reference. Creators: get_creator. Account: get_account (plan, limits, include_items for saved, unlocked and generated items, includeDesignConnect for the Design MCP), get_pricing for plans, save_item to save, unsave or list favorites. Missing something: request_template, then manage_request to list, check or cancel requests. Older tool names (search, get_template_prompt, get_component_source, open_in_builder, get_request_status, list_my_items, search_templates, search_components, search_everything, search_backgrounds, search_styles, search_creators, list_component_categories, get_design_workspace) still work but are not listed.",
      "tools": [
        {
          "name": "generate_component",
          "title": "Generate an AnimatedWebs UI component",
          "description": "Writes one new UI component from a text description with AnimatedWebs AI and returns a complete self-contained HTML document (Tailwind CDN, inline JS). Use it when no library component fits; search_catalog (kind components) first to reuse one, and refine_component to change a result. The text block is the HTML preceded by an HTML comment naming the model and the generations left; structuredContent has html, model and generationsLeftToday. Each successful call uses one daily generation (Free 5, Pro 100 per UTC day, shared with refine_component and the tools site); a call where no model ran is not counted. Not idempotent: each call gives different output. If the generator is busy it returns an error; retry after a minute. Example: {\"prompt\":\"a pricing section with three plans and a yearly toggle\",\"style\":\"glass\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "prompt": {
                "description": "What to build, 8 to 1200 characters: content, layout and motion. Example: 'a pricing section with three plans and a yearly toggle'.",
                "maxLength": 1200,
                "minLength": 8,
                "type": "string"
              },
              "style": {
                "default": "luxury",
                "description": "Visual system: luxury (dark, gold accent, serif; default), editorial (warm light page, oxblood accent), glass (navy-black, frosted layers, violet accent) or brutalist (black and white, signal red, hard borders).",
                "enum": ["luxury", "editorial", "glass", "brutalist"],
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "generationsLeftToday": {
                "description": "Generations left for this account today (UTC)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "html": {
                "description": "Complete self-contained HTML document (Tailwind CDN, inline JS)",
                "type": "string"
              },
              "model": {
                "description": "Model that wrote it",
                "type": "string"
              }
            },
            "required": ["generationsLeftToday", "html", "model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate an AnimatedWebs UI component"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "icons": [
            {
              "src": "https://animatedwebs.com/brand/tools/generate-component.svg",
              "mimeType": "image/svg+xml",
              "sizes": ["any"]
            }
          ],
          "digest": "sha256:38b0b9f87de5a1ca45e509c9d5283eb0ab306e8b3fd72e7f2b93064f3577e216"
        },
        {
          "name": "get_account",
          "title": "Get my AnimatedWebs account",
          "description": "Returns the signed-in account's AnimatedWebs plan and today's usage (Pro prompt access or Prompt Pack credits, UI generations and Design AI requests used against the daily limits), links, the Design workspace URL, and on request the account's items. Use it to check whether a Pro prompt, generate_component or refine_component call will succeed, or to pick up earlier work; use get_pricing for plan prices and save_item to change saved items. include_items adds items: saved (templates, components and backgrounds saved with save_item or hearted on animatedwebs.com), unlocked (Pro templates already opened, so fetching their prompt again is free) and generated (prompt, model and date of each AI generation; the HTML itself is not stored). includeDesignConnect adds ready-to-paste setup for the separate AnimatedWebs Design MCP server; it contains a personal bearer token, so never write it to shared files. Counts are per UTC day. Read-only. Example: {\"include_items\":true,\"items\":\"saved\",\"items_limit\":10}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "includeDesignConnect": {
                "default": false,
                "description": "true adds design.connect (Claude Code command, Cursor and VS Code config with a personal bearer token) and design.note. Default false keeps the token out of the reply.",
                "type": "boolean"
              },
              "include_items": {
                "default": false,
                "description": "true adds items (saved, unlocked and generated lists, newest first). Default false.",
                "type": "boolean"
              },
              "items": {
                "default": "all",
                "description": "With include_items: which list to return. all (default), saved, unlocked or generated.",
                "enum": ["all", "saved", "unlocked", "generated"],
                "type": "string"
              },
              "items_limit": {
                "default": 20,
                "description": "With include_items: entries per list, 1 to 50 (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "design": {
                "additionalProperties": false,
                "properties": {
                  "connect": {
                    "additionalProperties": false,
                    "description": "Only with includeDesignConnect",
                    "properties": {
                      "claudeCode": {
                        "description": "Shell command",
                        "type": "string"
                      },
                      "cursor": {
                        "additionalProperties": {},
                        "description": "mcp.json fragment",
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      "vscode": {
                        "additionalProperties": {},
                        "description": "VS Code mcp.json fragment",
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      }
                    },
                    "required": ["claudeCode", "cursor", "vscode"],
                    "type": "object"
                  },
                  "note": {
                    "type": "string"
                  },
                  "workspace": {
                    "description": "Design workspace URL",
                    "type": "string"
                  }
                },
                "required": ["workspace"],
                "type": "object"
              },
              "designAi": {
                "additionalProperties": false,
                "properties": {
                  "dailyLimit": {
                    "type": "number"
                  },
                  "usedToday": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["dailyLimit", "usedToday"],
                "type": "object"
              },
              "items": {
                "additionalProperties": false,
                "description": "Only with include_items",
                "properties": {
                  "generated": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "createdAt": {
                          "type": "string"
                        },
                        "model": {
                          "type": ["string", "null"]
                        },
                        "prompt": {
                          "description": "First 200 characters",
                          "type": "string"
                        },
                        "tool": {
                          "description": "ui (component generator) or design (Design AI)",
                          "type": "string"
                        }
                      },
                      "required": ["createdAt", "model", "prompt", "tool"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "saved": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "id": {
                          "description": "Template slug, component id or background slug",
                          "type": "string"
                        },
                        "savedAt": {
                          "type": "string"
                        },
                        "title": {
                          "description": "null when the item left the catalog",
                          "type": ["string", "null"]
                        },
                        "type": {
                          "enum": ["template", "component", "background"],
                          "type": "string"
                        },
                        "url": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["id", "savedAt", "title", "type", "url"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "unlocked": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "slug": {
                          "type": "string"
                        },
                        "title": {
                          "type": ["string", "null"]
                        },
                        "unlockedAt": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "required": ["slug", "title", "unlockedAt", "url"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "design": {
                    "type": "string"
                  },
                  "pricing": {
                    "type": "string"
                  },
                  "uiLibrary": {
                    "type": "string"
                  }
                },
                "required": ["design", "pricing", "uiLibrary"],
                "type": "object"
              },
              "plan": {
                "description": "Plan id, e.g. free, starter, pro or lifetime",
                "type": "string"
              },
              "prompts": {
                "description": "'unlimited (Pro)' or the credit counts",
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "creditsLeft": {
                        "type": ["number", "null"]
                      },
                      "monthlyUsed": {
                        "type": "number"
                      },
                      "packCredits": {
                        "type": "number"
                      }
                    },
                    "required": ["creditsLeft", "monthlyUsed", "packCredits"],
                    "type": "object"
                  }
                ]
              },
              "tier": {
                "type": "string"
              },
              "uiGenerations": {
                "additionalProperties": false,
                "properties": {
                  "dailyLimit": {
                    "type": "number"
                  },
                  "usedToday": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["dailyLimit", "usedToday"],
                "type": "object"
              }
            },
            "required": ["design", "designAi", "links", "plan", "prompts", "tier", "uiGenerations"],
            "type": "object"
          },
