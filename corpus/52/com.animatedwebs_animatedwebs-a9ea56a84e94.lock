                "description": "Templates only. free: prompts any signed-in account can fetch; pro: needs a Pro or Lifetime plan or a Prompt Pack credit.",
                "enum": ["free", "pro"],
                "type": "string"
              },
              "category": {
                "description": "Templates and components only. Templates: exact category, case-insensitive, from list_categories (kind templates), e.g. 'AI / SaaS'. Components: exact category from list_categories (kind components), e.g. 'Hero', 'Three.js', 'Buttons'. An unknown value returns no results.",
                "type": "string"
              },
              "cursor": {
                "description": "The nextCursor of a previous result, unchanged, sent with the same kind, query and filters. Single kind only (not kind all).",
                "type": "string"
              },
              "kind": {
                "default": "all",
                "description": "Which family to search: templates (AnimatedWebs templates), components (UI library), backgrounds (cinematic video loops), styles (website style references), creators, or all (default) for every family at once.",
                "enum": ["all", "templates", "components", "backgrounds", "styles", "creators"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results per family on this page. Defaults / ceilings: templates and components 10 / 50, backgrounds and styles 20 / 50, creators 10 / 30, kind all 6 / 20 per family. A value above the ceiling is lowered to it.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text. Empty or omitted browses the family in catalog order. Templates and components split it on spaces and match each word as a substring ('webgl particles hero'); backgrounds, styles and creators match the whole text as one substring ('nature', 'stripe', 'webgl').",
                "type": "string"
              },
              "runtime": {
                "description": "Components only. Exact runtime, case-insensitive, e.g. 'react', 'three' or 'css'.",
                "type": "string"
              },
              "technique": {
                "description": "Templates only. A 3D / WebGL technique facet: threejs (three.js scenes), particles (particle fields), shaders (GLSL, raymarching, noise fields), 3d-objects (products to spin, inspect or configure), scroll-3d (scroll-driven 3D camera or scene) or simulators (machines, robots, physics). Same facets as animatedwebs.com/templates/3d.",
                "enum": ["threejs", "particles", "shaders", "3d-objects", "scroll-3d", "simulators"],
                "type": "string"
              },
              "templateKind": {
                "description": "Templates only. website (full page), section (one page section), background (coded motion backdrop) or component.",
                "enum": ["website", "section", "background", "component"],
                "type": "string"
              }
            },
            "type": "object"
          },
