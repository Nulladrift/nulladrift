                "enum": ["free", "pro"],
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "demo": {
                "description": "Live demo URL, null when no demo exists",
                "type": ["string", "null"]
              },
              "description": {
                "type": "string"
              },
              "kind": {
                "enum": ["website", "section", "background", "component"],
                "type": "string"
