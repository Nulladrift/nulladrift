        {
          "name": "fill_transfer_note",
          "title": "Fill in a waste transfer note",
          "description": "Fill in a UK waste transfer note from what the person has said. Returns what the law still needs before signing, a card to correct every detail, and a link that opens the note unsigned on complyonsite.com, where both sides sign and save the PDF. Pass only details the person gave; never invent a name, address or registration number. Call again with the same details plus any new ones. Non-hazardous codes only; a hazardous load uses start_document. Saves, signs and sends nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "codes": {
                "default": [],
                "description": "Non-hazardous EWC codes from ewc_search, up to 5.",
                "items": {
                  "description": "Short human-readable label or stable slug, up to 60 characters.",
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "container": {
                "enum": ["loose", "sacks", "skip", "drum", "other"],
                "type": "string"
              },
              "containerKind": {
                "maxLength": 80,
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD.",
                "maxLength": 10,
                "type": "string"
              },
              "description": {
                "maxLength": 300,
                "type": "string"
              },
              "destination": {
                "description": "Where it goes after collection, for Northern Ireland.",
                "maxLength": 300,
                "type": "string"
              },
              "from": {
                "additionalProperties": false,
                "description": "Who hands the waste over.",
                "properties": {
                  "address": {
                    "description": "Without the postcode.",
                    "maxLength": 300,
                    "type": "string"
                  },
                  "company": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "numbers": {
                    "additionalProperties": false,
                    "properties": {
                      "broker": {
                        "maxLength": 80,
                        "type": "string"
                      },
                      "carrier": {
                        "maxLength": 80,
                        "type": "string"
                      },
                      "exemption": {
                        "maxLength": 80,
                        "type": "string"
                      },
                      "permit": {
                        "maxLength": 80,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "postcode": {
                    "maxLength": 12,
                    "type": "string"
                  },
                  "roles": {
                    "items": {
                      "enum": ["producer", "importer", "transporter", "council", "permit", "exemption", "carrier", "broker"],
                      "type": "string"
                    },
                    "maxItems": 4,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "place": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "postcode": {
                    "maxLength": 12,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "placeSame": {
                "description": "True when handed over at the from address.",
                "type": "boolean"
              },
              "quantity": {
                "description": "For example “1 × 8 yard skip” or “2 tonnes”.",
                "maxLength": 80,
                "type": "string"
              },
              "region": {
                "description": "Omit if unknown: England is assumed and the result says so.",
                "enum": ["gb-eng", "gb-wls", "gb-sct", "gb-nir"],
                "type": "string"
              },
              "sic": {
                "description": "Five-digit SIC 2007 code of the person handing over.",
