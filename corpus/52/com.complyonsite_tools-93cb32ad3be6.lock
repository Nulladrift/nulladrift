      "instructions": "Anonymous read-only tools for people running UK construction and waste work. They cover: List of Waste (EWC) codes for a skip, load or material; waste codes for the US, California, Texas, Australia and Canada; filling in a UK waste transfer note from the details in the conversation, checked against what the note legally needs, with a card to correct it and a link that opens it unsigned; which waste paperwork a movement needs in each UK nation and some other countries; links that open a waste transfer note, hazardous waste consignment note or RAMS ready to fill in, with blank templates and worked examples as PDFs; one person’s daily hand-arm vibration (HAVS) and noise exposure; first-aid cover for a site or workplace; typical vibration and declared noise for types of power tool; retained HSE construction injury statistics; and links to the website tools for work on files or kept records, such as turning a safety data sheet into a workbook, checking a Receipt of Waste workbook or reviewing a RAMS. Each result starts with a plain summary and includes source.url as data; calculator results include a link that opens the same calculation on complyonsite.com. EWC results are candidates rather than waste classifications; exposure estimates do not establish safety; statistics are a retained release rather than a live HSE feed; document links do not create, save, sign, issue or submit records. Only details the person has given go on a note. The server does not provide legal decisions, regulator acceptance, submission to a regulator, live register checks (waste carrier, broker or dealer registration, permits or exemptions; the regulator’s public register answers those), accounts, saved records, maker-model lookup or completed RAMS packs, and it does not read files. Noise action values (80 and 85 dB(A)) compare noise before hearing protection; the 87 dB(A) limit is a separate check at the ear, after protection.",
      "tools": [
        {
          "name": "construction_injury_statistics",
          "title": "Get construction injury statistics",
          "description": "Return a retained HSE series for construction in Great Britain: worker deaths and the rate per 100,000 workers with the long-run trend, kinds of fatal accident such as falls from height, employee deaths, self-reported and RIDDOR-reported injuries, or work-related ill health. Preserves each series’ period, units, provisional or revised status, confidence intervals, source file and publication date. This does not query a live HSE feed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "series": {
                "default": "latest",
                "description": "Dataset series to return; defaults to the latest headline figures.",
                "enum": ["latest", "deaths", "fatal-accident-kinds", "employment", "self-reported-injury", "reported-injuries", "ill-health"],
                "type": "string"
              }
            },
            "type": "object"
          },
