        {
          "name": "havs_daily_exposure",
          "title": "Calculate daily HAVS exposure",
          "description": "Calculate one person’s daily hand-arm vibration (HAVS) exposure from the tools they use and for how long: A(8), HSE points, low/high range, and whether it passes the action value (2.5 m/s² A(8), 100 points) or the limit value (5 m/s², 400 points). For each tool give its own vibration figure in m/s², or an HSE category and variant to use HSE’s typical figure and range. Time means trigger time: the tool running in the person’s hands. Returns a link that opens the same calculation in the HAVS calculator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "tools": {
                "description": "Tools or tasks used by one person during one day; 1 to 20 entries.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "description": "HSE tool category, used for HSE’s typical figure when vibration is omitted. Use other with a vibration value for anything else.",
                      "enum": ["other", "drill", "impact-wrench", "stapler", "angle-grinder", "die-grinder", "straight-grinder", "pedestal-grinder", "cut-off-saw", "reciprocating-saw", "jigsaw", "nibbler", "sander", "polisher", "router", "breaker", "demolition-hammer", "pneumatic-hammer", "chipping-hammer", "stone-hammer", "rock-drill", "scabbler", "needle-scaler", "plate-compactor", "water-jetting-gun", "brushcutter", "chainsaw", "hedge-trimmer", "mower"],
                      "type": "string"
                    },
                    "label": {
                      "description": "Optional task or tool label used in the result.",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "minutes": {
                      "description": "Actual exposure time in minutes, not the whole shift.",
                      "maximum": 1440,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "variant": {
                      "description": "HSE variant, needed when the category has several: drill (standard, hole-saw, core, impact); impact-wrench (small-drive, one-inch-drive); angle-grinder (small, flap-disc, large); sander (random-orbital, orbital); chipping-hammer (weld, stone); needle-scaler (standard, reduced); plate-compactor (standard, reduced); brushcutter (saw-head, strimmer-head).",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "vibration": {
                      "description": "Your own vibration value, m/s². The website rounds this input to two decimal places.",
                      "maximum": 100,
                      "minimum": 0.1,
                      "type": "number"
                    }
                  },
                  "required": ["minutes"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tools"],
            "type": "object"
          },
