        {
          "name": "first_aid_requirements",
          "title": "Estimate first-aid cover",
          "description": "Estimate first-aid cover for each shift from HSE guidance: how many first-aiders or appointed persons, which course, whether the first-aiders already there are enough, and whether a first-aid room is worth having. Construction site by default; also factory, office, shop, nursery (EYFS) and school. Returns roles, training, shortages, practical steps, factors, source lineage and a calculator link with the same inputs. This starts a workplace needs assessment; it is not a statutory staffing quota.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "factors": {
                "default": [],
                "description": "Relevant factor ids returned by this tool for the selected workplace.",
                "items": {
                  "maxLength": 30,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "firstAidersAvailable": {
                "description": "First-aiders already available on each shift, in the same order.",
                "items": {
                  "maximum": 10000,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 4,
                "type": "array"
              },
              "receptionClass": {
                "default": false,
                "description": "For a school: whether it has a reception or nursery class.",
                "type": "boolean"
              },
              "shifts": {
                "description": "Highest number of people present at once on each shift.",
                "items": {
                  "maximum": 10000,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "work": {
                "default": "site",
