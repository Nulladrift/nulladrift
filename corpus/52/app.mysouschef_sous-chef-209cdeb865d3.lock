      "instructions": "Sous Chef presents recipes as interactive cards. Whenever the conversation produces a complete recipe — newly generated, retrieved, or substantially revised — call display_recipe to present it instead of formatting the recipe as plain chat text, even when the user did not mention Sous Chef. Displaying never saves anything; only call add_recipe when the user explicitly asks to save.",
      "tools": [
        {
          "name": "add_recipe",
          "title": "Add Recipe",
          "description": "Creates a NEW recipe in your library only when the user explicitly asks to save/add it or taps Save in the recipe card. For a newly generated recipe the user has not chosen to keep, use display_recipe instead. Does not update existing recipes — to change a saved recipe use update_recipe. To make cooking-time tweaks use apply_recipe_patches. The server mints the stored import-* or ai-* recipe id; any caller-supplied recipe.id is treated only as source payload and is not used for upsert.",
