        }
      },
      "instructions": "HuntPDF PDF tools: merge, split, compress, rotate, watermark, extract pages, page numbers, protect, unlock and convert PDFs (Word, Excel, JPG). Pass files as a public https link (file_url) or small base64. Results are temporary download links.",
      "tools": [
        {
          "name": "add_page_numbers",
          "title": "Add page numbers to PDF",
          "description": "Add page numbers to every page of a PDF. Files are processed on HuntPDF servers and deleted automatically; the download link is temporary.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "file_base64": {
                "description": "The file content as base64 (only for small files, max 10 MB). Use instead of file_url.",
                "type": "string"
              },
              "file_url": {
                "description": "Public https:// link to the file (preferred, up to 150 MB). Must be directly downloadable.",
                "format": "uri",
                "type": "string"
              },
              "filename": {
                "description": "Original file name, e.g. report.pdf",
                "maxLength": 150,
                "type": "string"
              },
              "format": {
                "default": "n",
                "description": "n = \"1\", n-of-m = \"1 of 9\", page-n = \"Page 1\", page-n-of-m = \"Page 1 of 9\"",
                "enum": ["n", "n-of-m", "page-n", "page-n-of-m"],
                "type": "string"
              },
              "position": {
                "default": "bottom-center",
                "enum": ["bottom-center", "bottom-left", "bottom-right", "top-center", "top-left", "top-right"],
                "type": "string"
              },
              "start_at": {
                "description": "First number, default 1",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "download_url": {
                "description": "Link to download the result",
                "type": "string"
              },
              "expires_in_minutes": {
                "description": "The link stops working after this time (or 3 minutes after the first download)",
                "type": "number"
              },
              "file_name": {
                "type": "string"
              },
              "pages": {
                "type": "number"
              }
            },
            "required": ["download_url", "expires_in_minutes", "file_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add page numbers to PDF"
          },
          "behavior": {
            "destructive": false,
