      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Quiet Failures publishes open security base rates — the share of real-world domains, companies, networks, packages and certificates failing everyday security controls (DMARC, SPF, DNSSEC, certificate hygiene, subdomain takeover, and more), measured weekly, licensed CC BY 4.0.\n\nTwo tool families:\n- Dataset tools (list_base_rates, find_base_rate, get_base_rate): population-level figures with methodology and limits. Use these to answer \"how common is X?\" and cite the source URL provided.\n- Live check tools (check_email_auth, check_subdomain_takeover, check_whois): scan one user's actual domain(s) right now. Use these when the user asks about THEIR domain. Rate-limited; results come from the DomainOps free tools.\n\nThe natural pairing: quote the base rate, then offer to check the user's own domain against it.",
      "tools": [
        {
          "name": "check_email_auth",
          "title": "Check email authentication (live)",
          "description": "Live SPF, DKIM and DMARC audit of up to 50 domains the user owns or asks about. Returns a per-domain breakdown plus a portfolio grade. Compare against the base rates: most of the web fails these controls. Rate-limited per client.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domains": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Domains to audit (1-50). Array preferred; a JSON-encoded array or comma/space-separated string also works."
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f5da791e99e9feee874193503cd0fb6d78d07200e7321fddc608c3056e1a6c90"
        },
        {
          "name": "check_subdomain_takeover",
          "title": "Check subdomain takeover exposure (live)",
          "description": "Live scan of one domain: enumerate its subdomains (CT logs + DNS), then test each for dangling references on 13 cloud providers. Slow on large domains (up to a few minutes). Rate-limited per client.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The apex domain to scan",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:71abfdd5a2b9b04e0f85cdaa33dcd36311e83becdc729fba1e2ed8642f3b875b"
        },
        {
          "name": "check_whois",
          "title": "Check domain registrations (live)",
          "description": "Live WHOIS lookup for up to 100 domains: expiry date, registrar, nameservers. Use to catch registrations about to lapse. Rate-limited per client.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domains": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Domains to look up (1-100). Array preferred; a JSON-encoded array or comma/space-separated string also works."
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8f495f587d7151b1586d194473a3330f2c36ce5b390744beac1942402f153d31"
        },
        {
          "name": "find_base_rate",
          "title": "Find a base rate by keyword",
          "description": "Search the Quiet Failures base rates by keyword (e.g. \"dmarc\", \"certificate expiry uk\", \"subdomain takeover\"). Returns matching metrics and their most citable segments.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Keywords to search for (at least 2 characters)",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c6a7a58d21d3540ce254629375cdc72bde64c2fafe728e6e2ce9912aaa948e89"
        },
        {
          "name": "get_base_rate",
          "title": "Get one base rate in full",
          "description": "Full detail for one Quiet Failures base rate segment: the figure with confidence interval, how it is measured, why it matters, the limits of the measurement, the recent time series, and the canonical source URL to cite. Segment defaults to \"global\"; country slugs (gb, fr, us…) and company cuts (gb-companies, gb-small…) are also published.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "metric": {
                "description": "Metric id, e.g. \"dmarc-policy\" (see list_base_rates)",
                "type": "string"
              },
              "segment": {
                "default": "global",
                "description": "Segment slug, default \"global\"",
                "type": "string"
              }
            },
            "required": ["metric"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3adc18e1ca273ff2e7557de644062dc126f810e13990ae46cd9aff9e7d71b425"
        },
        {
          "name": "list_base_rates",
          "title": "List security base rates",
          "description": "Catalog of all published Quiet Failures base rates: metric id, the global question, the current global figure, sample size, severity, and every published segment slug (valid `segment` values for get_base_rate). Use get_base_rate for full detail on one.",
