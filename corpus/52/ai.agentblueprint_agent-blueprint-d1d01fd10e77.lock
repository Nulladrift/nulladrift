{
  "lockfileVersion": 2,
  "subjects": {
    "ai.agentblueprint/agent-blueprint": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentblueprint.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agent-blueprint",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Agent Blueprint tools for people who run AI agents: measured agent costs, a structural check for one-page agent summaries, and an offline access map an agent draws of itself. All tools are read-only and keep nothing.",
      "tools": [
        {
          "name": "check_agent_one_page",
          "title": "Check a one-page agent summary",
          "description": "Checks the structure of a one-page agent summary written from Agent Blueprint's template (https://agentblueprint.ai/agent-one-page-template): the summary and all seven numbered sections present and in order, a stage line, every rule ending in \"Enforced by:\" or \"Not enforced:\", every Open item naming who decides, no template placeholders left, and length within one page. It checks shape only, not whether the answers are right. The text is checked and returned findings only; it is not stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "markdown": {
                "description": "The full one-page summary as Markdown.",
                "maxLength": 60000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["markdown"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6a32655c6700b8cffe1770c9860edc9bfc7e449d944cc407c45b682f534ef73b"
        },
        {
          "name": "estimate_agent_cost",
          "title": "Estimate an agent task's cost",
          "description": "Estimates the tokens and dollar cost of an AI agent task from the measured benchmark job closest to it. For jobs where cost grows with how much the agent reads, give the size of the real input and it scales the reading part while keeping the agent's fixed overhead. Returns a typical and a budget (worst-case) figure per run and, if runs per month are given, per month. Uses the benchmark-day prices unless current prices are passed. The result is an estimate from small test jobs, not a quote.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent": {
                "description": "Which measured agent to base the estimate on.",
                "enum": ["claude", "codex"],
                "type": "string"
              },
              "job": {
                "description": "The closest benchmark job id, from list_benchmark_jobs.",
                "enum": ["sql", "refactor", "bughunt", "analysis", "clean", "feature", "triage200", "replies", "corpus", "longdoc"],
                "type": "string"
              },
              "prices": {
                "description": "Current model prices in US dollars per million tokens. Leave out to use the benchmark-day prices.",
                "properties": {
                  "cached_input_per_million": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "input_per_million": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "output_per_million": {
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["cached_input_per_million", "input_per_million", "output_per_million"],
                "type": "object"
              },
              "runs_per_month": {
                "description": "How many times a month the job runs.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "integer"
              },
              "your_size": {
                "description": "Size of the real input in the job's unit (words, or rows for the clean job). Ignored for jobs that don't scale.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              }
            },
            "required": ["agent", "job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25d7d6b1de8801423be8b9aa7c671035645d780511cd1b8f1aea7467d76a260b"
        },
        {
          "name": "list_benchmark_jobs",
          "title": "List measured agent jobs",
          "description": "Lists the ten everyday jobs in Agent Blueprint's measured agent cost benchmark (2 November 2026): what each job was, how big its input was, and the typical and worst-case tokens and dollar cost measured over five runs each on Claude Code and Codex. Use it to find the benchmark job closest to a task someone wants an agent to do, before estimating that task's cost.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent": {
                "description": "Only show one agent's measurements. Leave out to show both.",
                "enum": ["claude", "codex"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:377b17975a784ad10c9b27517a74c001ec041b495f9ec52eaee93b9050c959ec"
        },
        {
          "name": "render_agent_map",
          "title": "Draw an agent's access map",
          "description": "Turns an agent's own inventory of its connections into Agent Blueprint's one-page access map: a single offline HTML page showing what the agent can read and change, who has to approve, its riskiest powers, and what could be trimmed. The agent supplies the inventory from its own tool list; this tool only draws it. Returns the HTML for the person to save, such as my-agent-blueprint.html. The inventory is not stored. The field guide is at https://agentblueprint.ai/draw.md.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent": {
                "properties": {
                  "model": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "product": {
                    "maxLength": 80,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "checks": {
                "properties": {
                  "commands": {
                    "properties": {
                      "evidence": {
                        "maxLength": 300,
                        "type": "string"
                      },
                      "status": {
                        "enum": ["yes", "none_found", "unsure"],
                        "type": "string"
                      }
                    },
                    "required": ["evidence", "status"],
                    "type": "object"
                  },
                  "delete": {
                    "properties": {
                      "evidence": {
                        "maxLength": 300,
                        "type": "string"
                      },
                      "status": {
                        "enum": ["yes", "none_found", "unsure"],
                        "type": "string"
                      }
                    },
                    "required": ["evidence", "status"],
                    "type": "object"
                  },
                  "messages": {
                    "properties": {
                      "evidence": {
                        "maxLength": 300,
                        "type": "string"
                      },
                      "status": {
                        "enum": ["yes", "none_found", "unsure"],
                        "type": "string"
                      }
                    },
                    "required": ["evidence", "status"],
                    "type": "object"
                  },
                  "money": {
                    "properties": {
                      "evidence": {
                        "maxLength": 300,
                        "type": "string"
                      },
                      "status": {
                        "enum": ["yes", "none_found", "unsure"],
                        "type": "string"
                      }
                    },
                    "required": ["evidence", "status"],
                    "type": "object"
                  },
                  "secrets": {
                    "properties": {
                      "evidence": {
                        "maxLength": 300,
                        "type": "string"
                      },
                      "status": {
                        "enum": ["yes", "none_found", "unsure"],
                        "type": "string"
                      }
                    },
                    "required": ["evidence", "status"],
                    "type": "object"
                  }
                },
                "required": ["commands", "delete", "messages", "money", "secrets"],
                "type": "object"
              },
              "connections": {
                "items": {
                  "properties": {
                    "asks": {
                      "type": ["boolean", "null"]
                    },
                    "basis": {
                      "enum": ["declared", "judged"],
                      "type": "string"
                    },
                    "changes": {
                      "items": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxItems": 300,
                      "type": "array"
                    },
                    "icon": {
                      "enum": ["mail", "chat", "calendar", "code", "files", "terminal", "web", "doc", "data", "money", "plug"],
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "reads": {
                      "items": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxItems": 300,
                      "type": "array"
                    },
                    "risk": {
                      "enum": ["normal", "high"],
                      "type": "string"
                    },
                    "unsure": {
                      "items": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "maxItems": 300,
                      "type": "array"
                    }
                  },
                  "required": ["asks", "basis", "changes", "icon", "name", "reads", "risk", "unsure"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "drawn": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "trim": {
                "items": {
                  "properties": {
                    "kind": {
                      "enum": ["duplicate", "overlap"],
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "tools": {
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "why": {
                      "maxLength": 300,
                      "type": "string"
                    }
                  },
                  "required": ["kind", "name", "tools", "why"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "unseen": {
                "maxLength": 600,
                "type": "string"
              },
              "version": {
                "const": "0.2",
                "type": "string"
              }
            },
            "required": ["agent", "checks", "connections", "drawn", "trim", "unseen", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:043818aea94a45ea265d43a474f91b11d6b81ce2f2ae43b5d55b0dc9a3daaf9f"
        }
      ],
      "digest": "sha256:3fde250dfe6dc20ddc3321f1cdadc89b1216ae778b67044a210f7cb793008a68"
    }
  }
}
