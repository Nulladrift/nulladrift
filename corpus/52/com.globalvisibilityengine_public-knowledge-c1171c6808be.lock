{
  "lockfileVersion": 2,
  "subjects": {
    "com.globalvisibilityengine/public-knowledge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://objects.globalvisibilityengine.com/public-enterprise-exposure/_agent/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "gve-public-knowledge",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to the public, governed knowledge objects published by Global Visibility Engine (GVE) for its client tenants. Every object is the same validated public object served on the GVE public website; nothing here is private or derived from raw company data. Use list_tenants, then list_objects (tenant types, then paginated objects of a type), then get_object or fetch for one object. search is a lexical filter over the public labels and descriptions. Each get_object result states its governed provenance, validation and quality, and the last material change of the public content; freshness of the underlying business knowledge is NOT_PROVEN (a material-change date is not a verification that the knowledge is still current), and a value reported NOT_PROVEN, NOT_AVAILABLE or NOT_PUBLISHED_BY_CONTRACT (freshness, confidence, relations) is genuinely not published by GVE: do not infer it. Fetching an object does not mean GVE or any engine endorses or recommends it.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a search result",
          "description": "Fetches the full public object for an id returned by search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Identifier returned by search.",
                "maxLength": 640,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1638e17995326563e02aaaecd1d030f084e561dc796857ad87a26462f5e3a3a2"
        },
        {
          "name": "get_object",
          "title": "Get one public object",
          "description": "Returns one public governed object exactly as GVE serves it publicly, plus its governance view (provenance, validation, quality, last material change; freshness, confidence and relations are reported as not established or not published).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Object id as listed by list_objects.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "namespace": {
                "pattern": "^[a-z0-9]+(?:_[a-z0-9]+)*$",
                "type": "string"
              },
              "type": {
                "pattern": "^[a-z_]{1,40}$",
                "type": "string"
              }
            },
            "required": ["id", "namespace", "type"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "governance": {
                "type": "object"
              },
              "object": {
                "type": "object"
              }
            },
            "required": ["governance", "object"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fbf68aa487a08eb961dcae8f4df7df612cfb0e3fca158acac677c2a6f6e10214"
        },
        {
          "name": "list_objects",
          "title": "List public objects",
          "description": "Lists the public objects of one tenant. Without type: the tenant's object types and counts. With type: one page (100 per page) of that type's objects.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "namespace": {
                "description": "Tenant namespace from list_tenants.",
                "pattern": "^[a-z0-9]+(?:_[a-z0-9]+)*$",
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "Object type from the tenant's types.",
                "pattern": "^[a-z_]{1,40}$",
                "type": "string"
              }
            },
            "required": ["namespace"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "canonicalPublicUrl": {
                      "type": "string"
                    },
                    "dateModified": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "required": ["canonicalPublicUrl", "id", "label", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "links": {
                "type": "object"
              },
              "namespace": {
                "type": "string"
              },
              "page": {
                "type": "integer"
              },
              "pageCount": {
                "type": "integer"
              },
              "totalObjects": {
                "type": "integer"
              },
              "type": {
                "type": "string"
              },
              "types": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["namespace", "totalObjects"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6a9908d95efeb8b79d5c1a014676832a00335fb400d1cab10917ea6c7d4456c"
        },
        {
          "name": "list_tenants",
          "title": "List public knowledge tenants",
          "description": "Lists the organizations whose public governed knowledge GVE publishes, with the object types and counts each one exposes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "tenants": {
                "items": {
                  "properties": {
                    "canonicalPublicUrl": {
                      "type": "string"
                    },
                    "language": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "namespace": {
                      "type": "string"
                    },
                    "totalObjects": {
                      "type": "integer"
                    },
                    "types": {
                      "items": {
                        "properties": {
                          "count": {
                            "type": "integer"
                          },
                          "pageCount": {
                            "type": "integer"
                          },
                          "type": {
                            "type": "string"
                          }
                        },
                        "required": ["count", "pageCount", "type"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["canonicalPublicUrl", "name", "namespace", "totalObjects", "types"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["tenants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba22ef39b710b56a757bfe37a2ab640c8d4474257162c5369fe50b1ecaf7634c"
        },
        {
          "name": "search",
          "title": "Search public objects",
          "description": "Lexical search over the labels and descriptions of the public objects. Returns identifiers to pass to fetch.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "namespace": {
                "description": "Optional: restrict to one tenant.",
                "pattern": "^[a-z0-9]+(?:_[a-z0-9]+)*$",
                "type": "string"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Optional: restrict to one object type.",
                "pattern": "^[a-z_]{1,40}$",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "namespace": {
                      "type": "string"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:791e2bb8df06c5dccd97fa12d31da70fe1874512c5f35b80c2fcdfca4a978835"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "gve-public://{namespace}/{type}/{id}",
          "name": "public-object",
          "title": "Public governed object",
          "description": "One public governed object with its governance view, identified by tenant namespace, object type and (percent-encoded) object id.",
          "mimeType": "application/json",
          "digest": "sha256:376055c75b4e790e02c5d808a72b2f7a3d8471aaeee45d36b9bbd0fcd23452fe"
        }
      ],
      "digest": "sha256:c8365238cbe4a0674643a0e6c99f61277f40694dcf5a54c7eb5eba923f36e9b1"
    }
  }
}
