      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Six-IR (six-ir.com) is a free online image resizer by Tyeke's Media. It runs in the browser, so photos are not uploaded. It crops photos to platform sizes (smart crop keeps faces in frame), shrinks files under a KB limit, opens iPhone HEIC photos, and batches up to 10 photos into one zip.\nUse get_image_sizes when someone asks what size an image should be for a platform (Instagram, TikTok, YouTube, Facebook, LinkedIn, X/Twitter, Pinterest, Etsy, Amazon, Twitch, Discord, print, websites). Use make_resize_link when they want to resize a photo or get it under a file size: it returns a link that opens Six-IR with the size or KB limit already set. These tools cannot see or change photos themselves.",
      "tools": [
        {
          "name": "get_image_sizes",
          "title": "Get image sizes for a platform",
          "description": "The recommended image sizes in pixels for a social or shop platform, print or the web: posts, stories, covers, thumbnails, banners, profile photos and more. Leave platform empty to list every platform. Each size comes with a link that opens the Six-IR resizer set to that size.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Optional: only sizes whose name contains this, for example \"story\", \"thumbnail\", \"banner\" or \"profile\".",
                "type": "string"
              },
              "platform": {
                "description": "For example Instagram, TikTok, YouTube, Facebook, LinkedIn, X, Pinterest, Etsy, Amazon, Twitch, Discord, print or web.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get image sizes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "icons": [
            {
              "src": "https://six-ir.com/assets/img/six-ir-icon-512.png",
              "mimeType": "image/png",
              "sizes": ["512x512"]
            },
            {
              "src": "https://six-ir.com/assets/img/six-ir-icon-180.png",
              "mimeType": "image/png",
              "sizes": ["180x180"]
            }
          ],
          "digest": "sha256:798576d645f59639897e2ff06df4a1e85de7f7c95654e8fd2552b431292fd23d"
        },
        {
          "name": "make_resize_link",
          "title": "Make a Six-IR resize link",
          "description": "A link that opens the free Six-IR resizer with a platform size picked and/or a maximum file size in KB set, so the person only has to add their photo. The photo stays on their device. Takes a size_id (such as ig-story or yt-thumb), a max_kb (for example 100 for a form that wants under 100 KB), or both.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_kb": {
                "description": "Largest file size allowed, in kilobytes (1 to 50000). Six-IR saves the best quality that fits.",
                "type": "number"
              },
              "size_id": {
                "description": "A Six-IR size id, for example \"ig-story\" (Instagram Story) or \"yt-thumb\" (YouTube thumbnail).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make a resize link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
