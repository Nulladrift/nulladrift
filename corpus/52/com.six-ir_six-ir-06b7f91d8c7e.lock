      "serverInfo": {
        "name": "six-ir",
        "title": "Six-IR image sizes",
        "version": "1.0.0",
        "websiteUrl": "https://six-ir.com",
        "icons": [
          {
            "src": "https://six-ir.com/assets/img/six-ir-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
