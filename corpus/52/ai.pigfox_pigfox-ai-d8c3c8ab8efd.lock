      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "ai.pigfox/pigfox-ai",
        "title": "pigfox.ai SEO and AEO check",
        "version": "1.2.0",
        "websiteUrl": "https://pigfox.ai/api"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "One tool, check_ai_search_readiness, runs pigfox.ai's SEO and AEO check on a website. SEO (search-engine basics): HTTPS, http to https redirect, noindex, mobile viewport, title and meta description lengths, exactly one h1, canonical, language, image alt text, and the homepage's response time and HTML size as measured once from pigfox.ai's server (not a full speed test), scored out of 100 as seo_score. AEO (AI search readiness): what its robots.txt tells 15 AI crawlers, whether it has llms.txt, its title, description, canonical, language, h1 and JSON-LD, and what AI assistants can read (a one-line definition, key facts in text, a recent date), scored out of 100 as score (also aeo_score). combined_score averages the two. Each comes with fixes and copy-paste snippets (robots.txt, llms.txt, JSON-LD, definition, viewport, title, https redirect). report_page_url is a shareable page with every check. Pass a domain such as example.com. Results are cached for 10 minutes; new checks are limited to 6 a minute per client. The scores say whether search engines and AI tools may read the homepage and can tell what it is; they do not predict rankings or citations.",
      "tools": [
        {
          "name": "check_ai_search_readiness",
          "title": "Check SEO and AEO (AI search readiness)",
          "description": "Check a website's SEO basics and its AEO (AI search readiness). SEO: HTTPS, http to https redirect, noindex, viewport, title and description lengths, one h1, canonical, language, image alt text, and response time and HTML size measured from pigfox.ai's server, as seo_score out of 100 with each check's pass, warn or fail. AEO: per-crawler robots.txt access for OAI-SearchBot, ChatGPT-User, GPTBot, Claude-SearchBot, Claude-User, ClaudeBot, PerplexityBot, Perplexity-User, Google-Extended, Applebot-Extended, Amazonbot, DuckAssistBot, Meta-ExternalAgent, CCBot and Bytespider, llms.txt, the homepage's title and description lengths, canonical, language, h1 and JSON-LD types, a one-line definition, key facts in text rather than images, a recent date, as score out of 100 with its band and fixes with the points each is worth; combined_score averages the two; and copy-paste snippets built from the site's own data with [REPLACE: ...] where it says nothing. Fetches only the homepage, robots.txt, llms.txt, a HEAD of llms-full.txt, one sitemap and the headers of http://<site>/.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "site": {
                "description": "The site's domain, such as example.com. A full URL is accepted; only its host is used.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aeo_score": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "api_version": {
                "type": "string"
              },
              "assistant": {
                "type": "object"
              },
              "badge_url": {
                "type": "string"
              },
              "band": {
                "enum": ["ready", "mostly-ready", "needs-work", "not-ready"],
                "type": "string"
              },
              "checked_at": {
                "format": "date-time",
                "type": "string"
              },
              "combined_band": {
                "enum": ["ready", "mostly-ready", "needs-work", "not-ready"],
                "type": "string"
              },
              "combined_grade": {
                "type": "string"
              },
              "combined_score": {
                "description": "SEO and AEO averaged.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "crawlers": {
                "items": {
                  "properties": {
                    "access": {
                      "enum": ["allowed", "blocked", "unknown"],
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["search", "training"],
                      "type": "string"
                    },
                    "owner": {
                      "type": "string"
                    },
                    "purpose": {
                      "type": "string"
                    },
                    "rule": {
                      "type": "string"
                    },
                    "token": {
                      "type": "string"
                    }
                  },
                  "required": ["access", "kind", "owner", "purpose", "token"],
                  "type": "object"
                },
                "type": "array"
              },
              "fixes": {
                "items": {
                  "properties": {
                    "points": {
                      "type": "number"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["points", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "grade": {
                "type": "string"
              },
              "homepage": {
                "type": "object"
              },
              "json_ld_types": {
