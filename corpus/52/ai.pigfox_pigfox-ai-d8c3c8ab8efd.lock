{
  "lockfileVersion": 2,
  "subjects": {
    "ai.pigfox/pigfox-ai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pigfox.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "ai.pigfox/pigfox-ai",
        "title": "pigfox.ai AI search readiness",
        "version": "1.1.0",
        "websiteUrl": "https://pigfox.ai/api"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "One tool, check_ai_search_readiness, checks a website's readiness for AI search the way pigfox.ai does: what its robots.txt tells 15 AI crawlers, whether it has llms.txt, its homepage title, description, canonical, language, h1 and JSON-LD, and what AI assistants can read (a one-line definition, key facts in text, a recent date), scored out of 100 with fixes and copy-paste snippets (robots.txt, llms.txt, JSON-LD, definition). Pass a domain such as example.com. Results are cached for 10 minutes; new checks are limited to 6 a minute per client. The score says whether AI tools may read the homepage and can tell what it is; it does not predict rankings or citations.",
      "tools": [
        {
          "name": "check_ai_search_readiness",
          "title": "Check AI search readiness",
          "description": "Check whether a website is ready for AI search: per-crawler robots.txt access for OAI-SearchBot, ChatGPT-User, GPTBot, Claude-SearchBot, Claude-User, ClaudeBot, PerplexityBot, Perplexity-User, Google-Extended, Applebot-Extended, Amazonbot, DuckAssistBot, Meta-ExternalAgent, CCBot and Bytespider, llms.txt, the homepage's title and description lengths, canonical, language, h1 and JSON-LD types, a one-line definition, key facts in text rather than images, a recent date, a score out of 100, its band, fixes with the points each is worth, and copy-paste snippets built from the site's own data with [REPLACE: ...] where it says nothing. Fetches only the homepage, robots.txt, llms.txt, a HEAD of llms-full.txt and one sitemap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "site": {
                "description": "The site's domain, such as example.com. A full URL is accepted; only its host is used.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "api_version": {
                "type": "string"
              },
              "assistant": {
                "type": "object"
              },
              "badge_url": {
                "type": "string"
              },
              "band": {
                "enum": ["ready", "mostly-ready", "needs-work", "not-ready"],
                "type": "string"
              },
              "checked_at": {
                "format": "date-time",
                "type": "string"
              },
              "crawlers": {
                "items": {
                  "properties": {
                    "access": {
                      "enum": ["allowed", "blocked", "unknown"],
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["search", "training"],
                      "type": "string"
                    },
                    "owner": {
                      "type": "string"
                    },
                    "purpose": {
                      "type": "string"
                    },
                    "rule": {
                      "type": "string"
                    },
                    "token": {
                      "type": "string"
                    }
                  },
                  "required": ["access", "kind", "owner", "purpose", "token"],
                  "type": "object"
                },
                "type": "array"
              },
              "fixes": {
                "items": {
                  "properties": {
                    "points": {
                      "type": "number"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["points", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "grade": {
                "type": "string"
              },
              "homepage": {
                "type": "object"
              },
              "json_ld_types": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "llms_txt": {
                "type": "object"
              },
              "passes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "report_url": {
                "type": "string"
              },
              "robots_txt": {
                "type": "object"
              },
              "score": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "site": {
                "type": "string"
              },
              "sitemap": {
                "type": "object"
              },
              "snippets": {
                "items": {
                  "properties": {
                    "has_placeholders": {
                      "type": "boolean"
                    },
                    "id": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "where": {
                      "type": "string"
                    }
                  },
                  "required": ["has_placeholders", "id", "note", "text", "title", "where"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["badge_url", "band", "checked_at", "crawlers", "fixes", "grade", "homepage", "json_ld_types", "llms_txt", "passes", "report_url", "robots_txt", "score", "site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check AI search readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:40a88066e80503079512c289cdc51d57cd9e2ef4d7303a6fea7deee945ea01a5"
        }
      ],
      "digest": "sha256:bd303c71552f3de16eb54338e81136d376feb71c8680e5b7a81f7c73a7efa1ef"
    }
  }
}
