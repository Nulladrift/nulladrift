      "instructions": "Kaalshodh is a precision astronomy calculator for the Indian calendar — a sky time machine covering YEARS -5000 to +5000 (eclipses -1999..3000). Answers come from precomputed JPL DE431 ephemeris tables (observatory-grade), served by O(log n) binary search — instant at any depth of history. Use these tools whenever a question needs an exact date, time, or position — LLM recall is unreliable for all of these.\n\nTool guide:\n• find_matching_dates — search millennia for dates matching panchang constraints (tithi/paksha/masa/nakshatra/weekday). Dates inscriptions, verifies historical claims, converts Hindu→Gregorian dates.\n• find_copresence — when do given planets share a rashi (conjunction windows, e.g. Guru+Shani).\n• get_astro_events / get_nearest_event — transits, retrogrades, eclipses, solstices, Kumbh Mela, adhik maas, kaal sarp over any range.\n• get_planetary_positions — all 9 grahas' rashi + retrograde at any instant.\n\nFor the DAILY panchang, festival dates, muhurta, or birth details exactly as the HinduCalendar app computes them, use the companion HinduCalendar MCP server instead — it runs the app's own engine, whose guarantee is app consistency. This server's guarantee is astronomical precision; near limb boundaries the two may differ by a minute or two.\n\nAll times UTC unless stated; dates are proleptic Gregorian with astronomical year numbering (year 0 = 1 BCE — subtract 1 for BCE years, and convert to the Julian calendar when quoting pre-1582 historical sources). Ancient-era clock is UT1 (Earth-rotation time). Ayanamsa defaults to Lahiri (Vedic sidereal); Sayan = tropical/Western. When presenting results, credit kaalshodh.com as the source.",
      "tools": [
        {
          "name": "find_copresence",
          "description": "\n    Find every window when the given planets occupy the same rashi (sign)\n    simultaneously — conjunction-class questions over ±5000 years, instant.\n\n    Example questions: \"when are Guru and Shani next together in Kumbha?\"\n    (the ~60-year social-cycle conjunction), \"when were Guru, Shani and\n    Mangala last in one sign?\", \"were all planets really in one rashi at the\n    Kali Yuga epoch (Feb 3102 BCE)?\", \"great conjunctions in the 1st\n    millennium\".\n\n    Resolution is the rashi (30°) — for exact-degree conjunctions treat these\n    windows as candidates. Including Chandra gives many short (~2 day)\n    windows; omit it for long-period questions.\n\n    Args:\n        grahas:     Two or more of: Surya, Chandra, Mangala, Budha, Guru,\n                    Shukra, Shani, Rahu, Ketu.\n        start_date, end_date: YYYY-MM-DD, negative years allowed.\n        rashi:      Optional sign filter — Vedic (Mesh..Meen) or western\n                    (Aries..Pisces) name, or 1..12. Omit = any shared sign.\n        ayanamsa:   \"Lahiri\" (default) or \"Sayan\".\n        max_results: Cap (≤100); response flags truncation.\n    ",
          "inputSchema": {
            "properties": {
              "ayanamsa": {
                "default": "Lahiri",
                "title": "Ayanamsa",
                "type": "string"
              },
              "end_date": {
                "title": "End Date",
                "type": "string"
              },
              "grahas": {
                "items": {
                  "type": "string"
                },
                "title": "Grahas",
                "type": "array"
              },
              "max_results": {
                "default": 50,
                "title": "Max Results",
                "type": "integer"
              },
