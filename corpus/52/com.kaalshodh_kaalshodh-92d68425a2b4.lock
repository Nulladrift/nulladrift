                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Grah"
              },
              "start_date": {
                "title": "Start Date",
                "type": "string"
              }
            },
            "required": ["end_date", "start_date"],
            "title": "get_astro_eventsArguments",
            "type": "object"
