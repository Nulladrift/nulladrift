                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Rashi"
              },
              "start_date": {
                "title": "Start Date",
                "type": "string"
              }
            },
            "required": ["end_date", "grahas", "start_date"],
            "title": "find_copresenceArguments",
            "type": "object"
          },
