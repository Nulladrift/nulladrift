              "required": true
            },
            {
              "name": "depot",
              "description": "Depot address and opening hours.",
              "required": false
            },
            {
              "name": "vans",
              "description": "Number of vans and the capacity of each.",
              "required": false
            }
          ],
          "digest": "sha256:f4a264529a312367ab8727999349f32e4f1207dc90fe1df23dad42844c47b017"
        },
        {
          "name": "plan_routes_from_addresses",
          "title": "Plan routes from a pasted address list",
          "description": "Paste a list of addresses; get the best stop order for one or more vehicles from your depot.",
          "arguments": [
            {
              "name": "addresses",
              "description": "The addresses, one per line.",
              "required": true
            },
            {
              "name": "depot",
              "description": "Where the vehicles start and end. If blank, the first address is used.",
              "required": false
            },
            {
              "name": "vehicles",
              "description": "How many vehicles (default 1).",
              "required": false
            }
          ],
          "digest": "sha256:14e0e0688866189deee8e9b9172b0b6b8bb0209afd2ebe51b0f043adb9e89d6e"
        },
        {
          "name": "planificar_rutas_reparto",
          "title": "Planificar rutas de reparto desde una lista de direcciones",
          "description": "Pega una lista de direcciones y obtén el mejor orden de visita para uno o más vehículos desde tu depósito.",
          "arguments": [
            {
              "name": "direcciones",
              "description": "Las direcciones, una por línea.",
              "required": true
            },
            {
              "name": "deposito",
              "description": "Desde dónde salen y adónde vuelven los vehículos. Si se deja vacío, se usa la primera dirección.",
              "required": false
            },
            {
              "name": "vehiculos",
              "description": "Cuántos vehículos (por defecto 1).",
              "required": false
            }
          ],
          "digest": "sha256:a8fa5b57d57f40bc7f25be81efd4b853cf9d6df943c287e84ab4cd57ec8c8476"
        }
      ],
      "digest": "sha256:ec43ed4c1cb71c0d007d6fa68ba0f2a3e1941686a9f99d00928fffb9beb7f114"
    }
  }
