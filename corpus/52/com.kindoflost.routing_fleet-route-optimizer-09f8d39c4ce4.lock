{
  "lockfileVersion": 2,
  "subjects": {
    "com.kindoflost.routing/fleet-route-optimizer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://routing.kindoflost.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "kindoflost-route-optimizer",
        "title": "Kind of Lost — Fleet Route Optimizer",
        "version": "1.0.1",
        "websiteUrl": "https://routing.kindoflost.com/mcp-server"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Plans delivery or service routes for one or more vehicles from one depot, with Google OR-Tools (guided local search over real road driving times): stop order per vehicle, arrival times, load carried, and any stops that could not be served. Supports time windows, service times, up to three capacity limits per vehicle, and re-optimizing from previous routes. Stops can be street addresses (geocoded) or lat/lon. Typical flow: get_route_example to see the input shape -> build the user's depot, stops and vehicles -> optimize_routes -> if it returns status 'running', call get_route_result with the job_id. Results are the best routes found in the time allowed, not a proof of optimality. Limits: 100 stops, 50 addresses to look up, 25 vehicles per call; one depot, deliveries only, one trip per vehicle. Put every vehicle in ONE optimize_routes call (not one call per driver), and send calls one at a time, never in parallel: this free server solves one problem at a time. If unsure the tool fits, call check_request first. Free, no sign-up; web version at https://routing.kindoflost.com",
      "tools": [
        {
          "name": "check_request",
          "title": "Check if a routing request fits",
          "description": "Say in plain words what the user wants (e.g. 'two depots, 40 pickups and deliveries, 3 vans'). Returns whether this server can do it and, if not, the closest thing it can do. Fast, no solve. Call it first when unsure the tool fits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "The user's routing problem in a sentence or two.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if a routing request fits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b8b9fc49a9486b552a822f45544a379b6d365c4aeb7e2d693cd03907ecbbd69"
        },
        {
          "name": "get_route_example",
          "title": "Get an example routing input",
          "description": "Return the full input of one example, in exactly the shape optimize_routes accepts. Edit it (depot, stops, vehicles, windows) to match the user's situation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "es = Spanish labels.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "name": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an example routing input"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:956c967c74efc2091e6c029b297ac8c0fe885cc110ee2fb4396d3d9e5c3a09e0"
        },
        {
          "name": "get_route_result",
          "title": "Get a route result",
          "description": "Fetch the result of an optimize_routes job that returned status 'running'. Waits up to wait_seconds; call again while status is 'running'. Jobs expire 15 minutes after they finish.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "type": "string"
              },
              "wait_seconds": {
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a route result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f0a82077ad91e588b00693ee0e0d8345e6c0e0a028f46269892fde204446cd0"
        },
        {
          "name": "list_route_examples",
          "title": "List example routing problems",
          "description": "List the built-in example routing problems. Use one to see a realistic input, or solve it as-is to show what the tool does.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List example routing problems"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc009186c25e06da3df27786599f24f8dbec6f30c1736845341284bccbfb5fc2"
        },
        {
          "name": "optimize_routes",
          "title": "Optimize delivery routes",
          "description": "Plan routes for one or more vehicles from one depot and return, per vehicle, the stop order with arrival times and load so far, plus stops that could not be served, totals, Google Maps links and warnings. Uses real road driving times. Solves take 10-60 s (more when many addresses must be looked up). Pass either `example` or the fields below. If the result has status 'running', call get_route_result with its job_id. Minimal example: {\"depot\": {\"address\": \"1600 Pennsylvania Ave NW, Washington, DC 20500\"}, \"stops\": [{\"id\": \"Ana\", \"address\": \"...\"}, {\"id\": \"Bob\", \"lat\": 38.9, \"lon\": -77.03, \"window_open\": \"09:00\", \"window_close\": \"12:00\", \"service_minutes\": 10}], \"vehicles\": 2}. Omitted: capacity = unlimited, no time windows, 1 vehicle, depot = the first stop, stops are dropped only when they cannot be served at all; every default applied is listed in the result's 'assumptions'. Call get_route_example for complete, realistic inputs.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Which geocoder reads the addresses: US (US Census, then OpenStreetMap) or OTHER (OpenStreetMap). Default US.",
                "enum": ["US", "OTHER"],
                "type": "string"
              },
              "depot": {
                "description": "REQUIRED in practice: where every vehicle starts and ends, as an OBJECT with an address or lat+lon (a plain address string is also accepted and used as the address), e.g. {\"address\": \"1 Main St, Springfield, IL 62701\"} or {\"lat\": 41.4993, \"lon\": -81.6944}. If omitted, the first stop is used as the depot (reported in 'assumptions').",
                "properties": {
                  "address": {
                    "description": "Street address to geocode. Include city and ZIP/postcode. Not needed when lat and lon are given (lat/lon is faster and never fails).",
                    "type": "string"
                  },
                  "close": {
                    "description": "Latest return. Clock time 'HH:MM' (24 h), '8:30 AM', or minutes after midnight (480 = 08:00). Default 24:00.",
                    "type": ["string", "number"]
                  },
                  "id": {
                    "type": "string"
                  },
                  "lat": {
                    "description": "Latitude, decimal degrees.",
                    "type": "number"
                  },
                  "lon": {
                    "description": "Longitude, decimal degrees.",
                    "type": "number"
                  },
                  "open": {
                    "description": "Earliest departure. Clock time 'HH:MM' (24 h), '8:30 AM', or minutes after midnight (480 = 08:00). Default 00:00.",
                    "type": ["string", "number"]
                  }
                },
                "type": ["object", "string"]
              },
              "example": {
                "description": "Solve this built-in example instead of passing the fields below.",
                "type": "string"
              },
              "goal": {
                "description": "One sentence, in the user's own words, of what they are trying to do (e.g. 'plan tomorrow's deliveries for 3 vans'). Optional; helps improve the tool.",
                "maxLength": 300,
                "type": "string"
              },
              "parameters": {
                "description": "Optional engine settings: SearchParametersTimeLimit (seconds, default 30, max 60), NoImprovementSeconds (20), RouteTimeLimit (minutes, default 1440), DroppedOrderCost (100000 = serve every stop that can be served), MinuteCost (1), LatePenaltyPerMinute (0 = windows are hard), MaxWaitMinutes (1440), MinimumDriveTime (5).",
                "type": "object"
              },
              "previous_routes": {
                "description": "Re-optimize from existing routes: one list of stop ids (or 1-based stop numbers) per vehicle, in visiting order. The solver starts from these and improves them; new stops are fitted in.",
                "items": {
                  "items": {
                    "type": ["string", "integer"]
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "stops": {
                "description": "The places to visit (not the depot). Each needs an address or lat+lon.",
                "items": {
                  "properties": {
                    "address": {
                      "description": "Street address to geocode. Include city and ZIP/postcode. Not needed when lat and lon are given (lat/lon is faster and never fails).",
                      "type": "string"
                    },
                    "closed_from": {
                      "description": "Start of a period inside the window when the stop cannot be visited (e.g. lunch). Clock time 'HH:MM' (24 h), '8:30 AM', or minutes after midnight (480 = 08:00).",
                      "type": ["string", "number"]
                    },
                    "closed_to": {
                      "description": "End of that period.",
                      "type": ["string", "number"]
                    },
                    "demand": {
                      "description": "Quantity delivered here (boxes, kg...). Counts against vehicle capacity. Default 0.",
                      "type": "number"
                    },
                    "demand2": {
                      "description": "Second quantity (e.g. weight), against capacity2.",
                      "type": "number"
                    },
                    "demand3": {
                      "description": "Third quantity (e.g. pallets), against capacity3.",
                      "type": "number"
                    },
                    "id": {
                      "description": "Your label for the stop (customer name, order no.). Used in results and in previous_routes. Default 'stop N' (1-based).",
                      "type": "string"
                    },
                    "lat": {
                      "description": "Latitude, decimal degrees.",
                      "type": "number"
                    },
                    "lon": {
                      "description": "Longitude, decimal degrees.",
                      "type": "number"
                    },
                    "service_minutes": {
                      "description": "Minutes spent at the stop. Default 0.",
                      "type": "number"
                    },
                    "window_close": {
                      "description": "Latest arrival. Clock time 'HH:MM' (24 h), '8:30 AM', or minutes after midnight (480 = 08:00). Default 24:00. Hard unless parameters.LatePenaltyPerMinute > 0.",
                      "type": ["string", "number"]
                    },
                    "window_open": {
                      "description": "Earliest arrival. Clock time 'HH:MM' (24 h), '8:30 AM', or minutes after midnight (480 = 08:00). Default 00:00.",
                      "type": ["string", "number"]
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "vehicles": {
                "description": "Either a number of identical vehicles (unlimited capacity), or one object per vehicle.",
                "oneOf": [
                  {
                    "maximum": 25,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "items": {
                      "properties": {
                        "capacity": {
                          "description": "Max total demand. Omitted = unlimited.",
                          "type": "number"
                        },
                        "capacity2": {
                          "type": "number"
                        },
                        "capacity3": {
                          "type": "number"
                        },
                        "fixed_cost": {
                          "description": "Cost of using this vehicle at all, in driving minutes. Raise it to use fewer vehicles. Default 0.",
                          "type": "number"
                        },
                        "id": {
                          "description": "Name, e.g. 'Van 1'.",
                          "type": "string"
                        },
                        "max_route_minutes": {
                          "description": "Longest route, depot to depot, waiting included.",
                          "type": "number"
                        },
                        "service_factor": {
                          "description": "Service time multiplier. Default 1.",
                          "type": "number"
                        },
                        "speed_factor": {
                          "description": "Driving time multiplier: 1.2 = 20% slower. Default 1.",
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "maxItems": 25,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "wait_seconds": {
                "description": "How long to wait for the solve inside this call (default 25).",
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Optimize delivery routes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:85a5a2a93afe35daa757ed1a8292b6c1ebb0cbf166186ccb3db2b50a0699bb63"
        }
      ],
      "prompts": [
        {
          "name": "plan_deliveries_time_windows",
