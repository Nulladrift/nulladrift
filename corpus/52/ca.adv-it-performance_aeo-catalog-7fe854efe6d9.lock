      },
      "serverInfo": {
        "name": "adv-it-performance",
        "title": "ADV IT Performance (AEO websites)",
        "version": "1.0.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only ADV IT Performance catalog: AEO website packages and prices (get_offers), an illustrative ROI scenario (calculate_aeo_roi) and the ADV knowledge corpus. Buying and lead forms happen on https://adv-it-performance.ca; these tools never submit anything.",
      "tools": [
        {
          "name": "calculate_aeo_roi",
          "title": "Calculate AEO & Programmatic Landing Page ROI",
          "description": "Calculate projected revenue growth, CAC reduction, and payback timeline from deploying ADV Strategy Pro search-to-sale landing pages.",
          "inputSchema": {
            "properties": {
              "average_deal_size_usd": {
                "description": "Average customer contract value or order size in USD.",
                "type": "number"
              },
              "current_conversion_rate_percent": {
                "description": "Current lead conversion rate percentage (e.g. 1.5). Default is 1.0%.",
                "type": "number"
              },
              "monthly_visitors": {
                "description": "Current monthly website visitors across organic and paid channels.",
                "type": "number"
              }
            },
            "required": ["average_deal_size_usd", "monthly_visitors"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://adv/roi-calculator.html",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:81092945c747245f5fb9d8e04bfcee3688c477bb244430b4adab55e6f8cce30e"
        },
        {
          "name": "get_adv_knowledge",
          "title": "ADV Knowledge: Triples, FAQ, Topics, Links",
          "description": "Read-only. Return ADV's semantic triples, buyer FAQ answers, knowsAbout topics and hub/spoke page links, built from the ADV marketing research corpus; prices and credentials come from the fact registry. Optional section: triples, faq, topics, links or all.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number for paged sections (default 1).",
                "type": "number"
              },
              "section": {
                "description": "triples | faq | topics | facts | links | sources | all (default all).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b4d591c54866ef528c6885ba4d8e77af86ab4f1404855b7910a23132bef9198"
        },
        {
          "name": "get_offers",
          "title": "List ADV Strategy Pro Offers & Prices",
          "description": "Return the current ADV Strategy Pro service tiers with USD prices, billing type and the approved next step for each. Request a tier for full scope and action label. Read-only; sourced from the canonical commerce catalog.",
          "inputSchema": {
            "properties": {
              "tier": {
                "description": "Optional tier id. Omit for a compact list of all tiers; pass an id for that tier's full scope and description.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.google.antigravity/ui": {
              "entrypoints": [
                {
                  "title": "ADV Offers",
                  "type": "aux_pane"
                }
              ]
            },
            "ui": {
              "resourceUri": "ui://adv/offers.html",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:d781ea65a436f162eb75d69e47f31653ac49a1f5e3d3207d625265db6e6c1c27"
        },
        {
          "name": "query_service_offer",
          "title": "Query ADV Service Catalog & Pricing",
          "description": "Query machine-readable pricing, deliverables, turnaround SLA, and checkout endpoints for ADV Strategy Pro packages ($197 Action Plan, $697 Landing Page, $2,497 AEO Website, $4,997 Multi-Service Growth Website).",
          "inputSchema": {
            "properties": {
              "tier": {
                "description": "Product tier or SKU: 'ENTRY' ($197), 'CORE' ($697), 'PRO' ($2,497), 'PREMIUM' ($4,997), 'ALL'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69b1be17131f90885551f35e36034ba063ba54ba3894a1f38b48dd0d353b2417"
        }
      ],
