      },
      "transport": {
        "type": "http",
        "url": "https://akulacyber.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.akulacyber/catalog",
        "title": "AkulaCyber",
        "version": "1.2.0",
        "description": "GL.iNet Comet KVM over IP in Ukraine: catalogue, live prices and stock, Nova Poshta delivery.",
        "websiteUrl": "https://akulacyber.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AkulaCyber (akulacyber.com) is an independent online store in Ukraine for GL.iNet Comet KVM over IP devices and accessories. Prices are in Ukrainian hryvnias (UAH) and include taxes; price and stock come from the store live. Delivery is within Ukraine by Nova Poshta. The buyer orders on the product page on akulacyber.com (cart and checkout); this server is read-only and cannot place orders or take payments; akulacyber_create_cart_link gives a link that opens the cart with chosen products. Pass lang uk, ru or en to match the user.",
      "tools": [
        {
          "name": "akulacyber_compare_kvms",
          "title": "Compare AkulaCyber KVM models",
          "description": "Compare two to six GL.iNet Comet KVM over IP models side by side: one row per fact (computers controlled, video, Ethernet, PoE, Wi-Fi, cellular, HDMI out, screen, power, size, weight) with one value per model in the order given, plus each model's live price in UAH, stock and page URL. Use it when the user weighs KVM models against each other; find candidates first with akulacyber_search_products (category kvm), and use akulacyber_get_product for one product or any accessory. An accessory or unknown product returns an error naming it and listing the KVM slugs. A null value means the model lacks the feature.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "uk",
                "description": "Language of the texts and page URLs in the answer: uk (Ukrainian, the default), ru (Russian) or en (English). Use the language the user writes in.",
                "enum": ["uk", "ru", "en"],
                "type": "string"
              },
              "products": {
                "description": "Two to six KVMs, each a slug or model code as in search results, e.g. [\"gl-rm1\", \"GL-RM1PE\"].",
                "items": {
                  "maxLength": 64,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "const": "UAH",
                "type": "string"
              },
              "models": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "availability": {
                      "enum": ["in_stock", "out_of_stock"],
                      "type": "string"
                    },
                    "image": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "on_sale": {
                      "type": "boolean"
                    },
                    "price_uah": {
                      "type": "number"
                    },
                    "regular_price_uah": {
                      "type": "number"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["availability", "image", "name", "on_sale", "price_uah", "regular_price_uah", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "rows": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "values": {
                      "items": {
                        "type": ["string", "null"]
                      },
                      "type": "array"
                    }
                  },
                  "required": ["label", "values"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["currency", "models", "rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare AkulaCyber KVM models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://akulacyber/catalog"
            },
            "ui/resourceUri": "ui://akulacyber/catalog"
          },
          "digest": "sha256:5a93322522c13be4979aa2700608e0f043ac57a3755f889fe49c9d29749fbe1f"
        },
        {
          "name": "akulacyber_create_cart_link",
          "title": "Create an AkulaCyber cart link",
          "description": "Create a link to the AkulaCyber store cart with the chosen products and quantities already in it, at live prices in UAH, for the user to open, review and check out on the site. Use it when the user is ready to buy or wants several products in one cart; identify products with akulacyber_search_products first, and for a single piece of one product the cart_url of akulacyber_get_product is enough. Nothing is ordered, reserved or paid here. Repeated products are added together (at most 99 each); out-of-stock products are left out and listed in unavailable; an unknown product, or none in stock, returns an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "One to ten products, e.g. [{\"product\": \"gl-rm1\", \"quantity\": 2}, {\"product\": \"gl-atx\"}].",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "product": {
                      "description": "A product slug from search results (gl-rm1), a model or part number (GL-RM1) or a GTIN.",
                      "maxLength": 64,
                      "minLength": 2,
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "description": "Pieces of this product, 1 to 99 (default 1).",
                      "maximum": 99,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["product"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "default": "uk",
                "description": "Language of the texts and page URLs in the answer: uk (Ukrainian, the default), ru (Russian) or en (English). Use the language the user writes in.",
                "enum": ["uk", "ru", "en"],
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "const": "UAH",
                "type": "string"
              },
              "goods_total_uah": {
                "type": "number"
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "line_total_uah": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price_uah": {
                      "type": "number"
                    },
                    "quantity": {
                      "type": "number"
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["line_total_uah", "name", "price_uah", "quantity", "slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "unavailable": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["currency", "goods_total_uah", "lines", "unavailable", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create an AkulaCyber cart link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
