        },
        {
          "name": "akulacyber_estimate_delivery",
          "title": "Estimate AkulaCyber dispatch and delivery",
          "description": "Estimate whether an AkulaCyber order placed now ships today and between which dates Nova Poshta usually delivers it, from the current time in Kyiv and the store's same-day cut-off: 17:30 Monday to Friday, 16:30 on Saturday and Sunday. Use it when the user asks when an order would ship or arrive; for delivery points use akulacyber_find_delivery_points, and for delivery cost and payment methods akulacyber_get_store_policy. Delivery usually takes 1 to 3 days after shipping; dates are YYYY-MM-DD. Public holidays are not known to it, and orders paid by bank transfer ship only once the money arrives.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "uk",
                "description": "Language of the delivery terms text in the answer: uk (the default), ru or en.",
                "enum": ["uk", "ru", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "delivery_terms": {
                "type": "string"
              },
              "delivery_terms_url": {
                "type": "string"
              },
              "now_kyiv": {
                "type": "string"
              },
              "ship_date": {
                "type": "string"
              },
              "ship_date_cutoff": {
                "type": "string"
              },
              "ships_today": {
                "type": "boolean"
              },
              "today_cutoff": {
                "type": "string"
              },
              "usual_delivery_from": {
                "type": "string"
              },
              "usual_delivery_to": {
                "type": "string"
              }
            },
            "required": ["delivery_terms", "delivery_terms_url", "now_kyiv", "ship_date", "ship_date_cutoff", "ships_today", "today_cutoff", "usual_delivery_from", "usual_delivery_to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate AkulaCyber dispatch and delivery"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ea764f7ba0f44a228235c64cce3937e9b1dc44d0c485417db89a1f696a1e19c"
        },
        {
          "name": "akulacyber_find_delivery_points",
          "title": "Find Nova Poshta delivery points",
          "description": "Find Nova Poshta branches and parcel lockers in a Ukrainian city where an AkulaCyber order can be collected, from the directory the checkout uses. Use it when the user asks where to collect an order or which point is near them; for ship and delivery dates use akulacyber_estimate_delivery, and for delivery cost and payment akulacyber_get_store_policy. If the city name matches several places, the result lists them; call again with city_ref. At most 30 points come back; more_points true means there are more, so narrow with query. An unknown city returns an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City or village name in Ukrainian, Russian or English, e.g. \"Київ\", \"Odesa\", \"Lviv\". Give city or city_ref.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "city_ref": {
                "description": "The ref of a city from the cities list of an earlier result, to pick one of several matches.",
                "maxLength": 40,
                "type": "string"
              },
              "lang": {
                "default": "uk",
                "description": "Language of the texts and page URLs in the answer: uk (Ukrainian, the default), ru (Russian) or en (English). Use the language the user writes in.",
                "enum": ["uk", "ru", "en"],
                "type": "string"
              },
              "query": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "type": "string"
                  },
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                ],
                "description": "A branch or locker number (160) or part of the address (a street name) to narrow the list."
              },
              "type": {
                "default": "all",
                "description": "branch for Nova Poshta branches, locker for parcel lockers, all for both (the default).",
                "enum": ["branch", "locker", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "area": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "ref": {
                      "type": "string"
                    }
                  },
                  "required": ["area", "kind", "name", "ref"],
                  "type": "object"
                },
                "type": "array"
              },
              "city": {
                "additionalProperties": false,
                "properties": {
                  "area": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "ref": {
                    "type": "string"
                  }
                },
                "required": ["area", "name", "ref"],
                "type": "object"
              },
              "delivery_terms": {
                "type": "string"
              },
              "delivery_terms_url": {
                "type": "string"
              },
              "more_points": {
                "type": "boolean"
              },
              "points": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "number": {
                      "type": ["number", "null"]
                    },
                    "type": {
                      "enum": ["branch", "locker"],
                      "type": "string"
                    }
                  },
                  "required": ["name", "number", "type"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["delivery_terms", "delivery_terms_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Nova Poshta delivery points"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be56a442e0b3716ef5fb293099af23c7d5788220e77e700dcbe2daaffa2b323b"
        },
        {
          "name": "akulacyber_get_product",
          "title": "Get AkulaCyber product details",
          "description": "Return the full details of one AkulaCyber product, with a photo attached as an image and a cart_url that opens the store cart with one piece of it; price and stock are read live on every call. Use it when the user names one product or after akulacyber_search_products; for two or more KVMs side by side use akulacyber_compare_kvms, and for several products or quantities in one cart akulacyber_create_cart_link. Pass product as the slug from search results, the model or part number, or the GTIN; lang sets the language of the texts and of the page URL. An unknown product returns an error listing every valid slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "uk",
                "description": "Language of the texts and page URLs in the answer: uk (Ukrainian, the default), ru (Russian) or en (English). Use the language the user writes in.",
                "enum": ["uk", "ru", "en"],
                "type": "string"
              },
              "product": {
                "description": "One product: a slug from search results (gl-rm1), a model or part number (GL-RM1, GL-ATXPC) or a 13-digit GTIN; case does not matter.",
                "maxLength": 64,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
