{
  "lockfileVersion": 2,
  "subjects": {
    "app.tnpropertysearch/tn-property": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tnpropertysearch.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "tn-property",
        "title": "Tennessee Property Records",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tennessee property records: parcels, current owners and ownership history. Call dataset_info first to see coverage and which counties have former-owner history. Typical flows: address -> search_properties -> get_property; person or company -> search_owners -> owner_portfolio; point on a map -> property_at; market questions -> property_stats or search_ownership_records; what changed lately -> recent_changes. If a record's last_checked matters, refresh_property re-reads it from the county source. Each property includes app_url, a link that opens it in the map app for the user.",
      "tools": [
        {
          "name": "dataset_info",
          "title": "Dataset overview",
          "description": "Start here. Describes what data exists: totals, every loaded county with parcel and ownership-record counts, how much ownership history each county has, which fields each county populates, data sources, bulk download files, query tips and usage terms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef034eac995490d711631af4e77d4cab471451e827054bbd409dfb9ca987641c"
        },
        {
          "name": "get_property",
          "title": "Property details and owner history",
          "description": "Everything known about one parcel: full parcel record, every ownership record (current and former, with acquisition dates, prices and deed references/links where the county provides them), sale history for Hamilton, and the county Register of Deeds website. Look up by pin, or by apn plus county.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apn": {
                "description": "Assessor parcel number.",
                "type": "string"
              },
              "county": {
                "description": "County, to disambiguate apn.",
                "type": "string"
              },
              "include_geometry": {
                "description": "Include the boundary rings ([lon,lat] pairs).",
                "type": "boolean"
              },
              "pin": {
                "description": "Parcel id as returned by other tools.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:262236d597097cc22dab0825e91510cff7ce7a1d5f16ae5259b97d4e6e6fba09"
        },
        {
          "name": "owner_portfolio",
          "title": "All properties for an owner",
          "description": "Every property an owner (by owner_key) or a mailing address has ever been recorded on, newest first, with whether they still own it, when they acquired it and the recorded price. Includes summary counts. Searching by mailing address groups LLCs and trusts that share a mailbox.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "Limit to county(ies).",
                "type": "string"
              },
              "current_only": {
                "description": "Only properties still owned.",
                "type": "boolean"
              },
              "cursor": {
                "description": "next_cursor from the previous page, to fetch the next page.",
                "type": "string"
              },
              "limit": {
                "description": "Records per page, 1–1000 (default 200).",
                "type": "integer"
              },
              "mailing": {
                "description": "Exact mailing address as stored (from a property or owner record).",
                "type": "string"
              },
              "owner_key": {
                "description": "owner_key from search_owners (an exact name also works; it is normalized).",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11db7fe0c0ac44092b747ff69e08a7b1863cb0d09a27675c2aec1afe679d6ad7"
        },
        {
          "name": "property_at",
          "title": "Property at a point",
          "description": "Which parcel contains a latitude/longitude. Uses the actual parcel boundary, not the nearest centroid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitude.",
                "type": "number"
              },
              "lon": {
                "description": "Longitude.",
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:441c72280f365bbacb62136d6492dd3d0cce76b13e3080c52a40bf1c17003c90"
        },
        {
          "name": "property_stats",
          "title": "Aggregate statistics",
          "description": "Parcel counts, total/average/median appraised value and total acres grouped by county, city, zip, land_use, zoning, owner, mailing or subdivision, statewide or for one county. Use it for 'largest owners in Davidson' or 'value by land use'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "One county (default: statewide).",
                "type": "string"
              },
              "group_by": {
                "description": "Field to group on.",
                "enum": ["county", "city", "zip", "land_use", "zoning", "owner", "mailing", "subdivision"],
                "type": "string"
              },
              "limit": {
                "description": "Groups to return, 1–500 (default 25).",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50245b4c8c9fbf4f4b116f2608424993ff0d71a706fd4303702b60416b33eee8"
        },
        {
          "name": "recent_changes",
          "title": "Recently detected changes",
          "description": "Changes the update jobs detected, newest first: owner_change (with old and new owners), new_parcel, and retired (parcel no longer listed by the county). Filter by county, kind, owner name, date or area.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bbox": {
                "description": "Bounding box 'west,south,east,north'.",
                "type": "string"
              },
              "county": {
                "description": "County(ies).",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page, to fetch the next page.",
                "type": "string"
              },
              "kind": {
                "description": "Kind(s), comma-separated: owner_change, new_parcel, retired.",
                "type": "string"
              },
              "limit": {
                "description": "Results per page, 1–200 (default varies by tool).",
                "type": "integer"
              },
              "near": {
                "description": "Center point 'lat,lon', e.g. '36.1627,-86.7816'.",
                "type": "string"
              },
              "owner": {
                "description": "Old or new owner name words.",
                "type": "string"
              },
              "radius_m": {
                "description": "Radius in meters around `near` (default 500).",
                "type": "number"
              },
              "since": {
                "description": "Detected on or after (YYYY-MM-DD).",
                "type": "string"
              },
              "until": {
                "description": "Detected on or before (YYYY-MM-DD).",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c25b57b1a2d795587b1c9c77f1a3234e10a45d7cae074321caf96eeadecdf23f"
        },
        {
          "name": "refresh_property",
          "title": "Refresh properties from the source",
          "description": "Re-read up to 5 parcels from their official county/state source right now (and, for Davidson, the full owner history), then return what changed. Use when last_checked is too old for the question, or the user says a record is out of date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pins": {
                "description": "Parcel pin(s), comma-separated (max 5).",
                "type": "string"
              }
            },
            "required": ["pins"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee5032345a0c7e08ce46c9005ffbf5b3cfe9b1b03bea200cb96c10567041b191"
        },
        {
          "name": "search_owners",
          "title": "Find owners by name",
          "description": "Find people and companies by name across current AND former ownership records. Each result has an owner_key, how many properties they have ever owned and own now, their counties and first/last acquisition dates. Pass an owner_key to owner_portfolio for the full list.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "Limit to county(ies).",
                "type": "string"
              },
              "current_only": {
                "description": "Only owners who currently hold property.",
                "type": "boolean"
              },
              "limit": {
                "description": "Owners to return, 1–100 (default 20).",
                "type": "integer"
              },
              "name": {
                "description": "Name words in any order, e.g. 'john smith' or 'ryman hospitality'.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6e5aef24f4f2121de60a25eab25e93c48771a4a21fe88c9fee3a253c349cba25"
        },
        {
          "name": "search_ownership_records",
          "title": "Search ownership records / transfers",
          "description": "Ownership records (one row per owner per parcel) for an owner, owner_key, mailing address or pin, or every transfer recorded in one county over up to 3 calendar months. Filter by price, current vs former, and address; sort by date or price. Use it for questions like 'who bought in Davidson in March 2024 over $1M'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Property address words (filters the other results).",
                "type": "string"
              },
              "county": {
                "description": "County (one, for date searches).",
                "type": "string"
              },
              "current": {
                "description": "true = current owners only, false = former owners only.",
                "type": "boolean"
              },
              "cursor": {
                "description": "next_cursor from the previous page, to fetch the next page.",
                "type": "string"
              },
              "date_from": {
                "description": "Acquired on or after, YYYY-MM-DD.",
                "type": "string"
              },
              "date_to": {
                "description": "Acquired on or before, YYYY-MM-DD.",
                "type": "string"
              },
              "limit": {
                "description": "Results per page, 1–200 (default varies by tool).",
                "type": "integer"
              },
              "mailing": {
                "description": "Exact mailing address.",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum recorded price.",
                "type": "number"
              },
              "min_price": {
                "description": "Minimum recorded price.",
                "type": "number"
              },
              "owner": {
                "description": "Owner name words.",
                "type": "string"
              },
              "owner_key": {
                "description": "Exact owner_key.",
                "type": "string"
              },
              "pin": {
                "description": "Parcel pin(s), comma-separated.",
                "type": "string"
              },
              "sort": {
                "description": "date_desc (default), date_asc, price_desc.",
                "enum": ["date_desc", "date_asc", "price_desc"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:044d75d1f6b53681b8084d2de57551b4b15987633a0844fddc405bf0fb578759"
        },
        {
          "name": "search_properties",
          "title": "Search properties",
          "description": "Find parcels by address words, current owner name, or location (near a point or inside a small box), optionally limited to a county, city or ZIP. Returns pin, address, owner, county, location and a link to the parcel in the map app. Paginate with next_cursor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Property address words, any order, e.g. '1313 gallatin'.",
                "type": "string"
              },
              "bbox": {
                "description": "Bounding box 'west,south,east,north' in degrees (under about 5 km across).",
                "type": "string"
              },
              "city": {
                "description": "City name (populated mainly in Davidson).",
                "type": "string"
              },
              "county": {
                "description": "County name, or several comma-separated, e.g. 'Davidson,Williamson'.",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page, to fetch the next page.",
                "type": "string"
              },
              "limit": {
                "description": "Results per page, 1–200 (default varies by tool).",
                "type": "integer"
              },
              "near": {
                "description": "Center point 'lat,lon', e.g. '36.1627,-86.7816'.",
                "type": "string"
              },
              "owner": {
                "description": "Current owner name words, e.g. 'bailey trust'. For former owners use search_owners.",
                "type": "string"
              },
              "q": {
                "description": "Free text matched against the address, or the current owner name.",
                "type": "string"
              },
              "radius_m": {
                "description": "Radius in meters around `near` (default 500, max 2000).",
                "type": "number"
              },
              "sort": {
                "description": "relevance (default with text), distance (default with near), address.",
                "enum": ["relevance", "address", "distance"],
                "type": "string"
              },
              "zip": {
                "description": "ZIP code(s), comma-separated.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57c0900ef0d0c0299281d101223c157df6598a3959b8be2c069dc00b18c194ab"
        },
        {
          "name": "update_status",
          "title": "Data freshness and update jobs",
          "description": "How fresh the data is: when each county was last checked, the most recent update runs with their status and counts, what is in progress, and the schedule.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:881b72b8c3ce11d1c56a4b1dc64dff7add0135d071adb1783cd3a8c39ca24951"
        }
      ],
      "digest": "sha256:2cc24be1798f4a4c82db8e095810318647c9f90b62fb74d992883aed08a480d8"
    }
  }
}
