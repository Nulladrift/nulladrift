                "description": "Keywords, e.g. 'inbox triage'",
                "type": "string"
              },
              "sort": {
                "default": "score",
                "description": "Order when no query is given; needs-testers lists recipes with few reports",
                "enum": ["score", "downloads", "new", "needs-testers"],
                "type": "string"
              },
              "tag": {
                "description": "Single tag, e.g. 'email'",
                "type": "string"
              }
            },
            "type": "object"
