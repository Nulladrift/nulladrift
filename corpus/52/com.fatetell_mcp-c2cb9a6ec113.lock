                    "type": "string"
                  }
                },
                "required": ["element", "polarity", "stem"],
                "type": "object"
              },
              "display_name": {
                "description": "Present when source is saved.",
                "type": "string"
              },
              "engine_version": {
                "description": "FateTell calculation engine version (package version + commit).",
                "type": "string"
              },
              "judgment": {
                "additionalProperties": false,
                "description": "FateTell's Day Master strength and favorable elements under its rule set.",
                "properties": {
                  "branch_overrides": {
                    "additionalProperties": {
                      "$ref": "#/$defs/Term"
                    },
