        {
          "name": "create_saved_chart",
          "title": "Create saved chart",
          "description": "Save a new chart to the connected account from name, gender, birth date (Gregorian or lunar), optional birth time and birthplace; time zone and hemisphere come from the birthplace as in the app. Returns the chart_id.\nUse when the user explicitly asks to save a chart; check list_saved_charts first to avoid duplicates. For another person the user must confirm consent (consent_attested); without it nothing is saved or cast.\nNot for casting without saving (use cast_bazi_chart), reading (use get_saved_chart) or editing existing charts.\nNew charts return no pillars; read them with get_saved_chart.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "birth_date": {
                "description": "Birth date in the local calendar of the birthplace, YYYY-MM-DD: Gregorian by default; with calendar lunar, the Chinese lunar year, month (1-12) and day.",
                "type": "string"
              },
              "birth_time": {
                "description": "Local clock time at the birthplace, HH:mm. Omit if unknown; the chart is then marked as hour uncertain.",
                "type": ["string", "null"]
              },
              "birthplace": {
                "description": "Birthplace name as in the FateTell app, a city optionally with country, 1 to 60 characters. Not stored or logged by this server.",
                "type": "string"
              },
              "calendar": {
                "description": "Default solar (Gregorian). Use lunar when the user gives a Chinese lunar birthday; the server converts it to Gregorian, so do not convert it yourself.",
                "enum": ["solar", "lunar"],
                "type": "string"
              },
              "consent_attested": {
                "description": "Required true when subject is other: the user confirms they have that person's permission.",
                "type": "boolean"
              },
              "display_name": {
                "description": "Name for the chart, 1 to 20 characters, no line breaks or Markdown symbols.",
                "type": "string"
              },
              "gender": {
                "description": "Determines whether the luck pillars run forward or backward.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "lunar_leap_month": {
                "description": "Default false. Only with calendar lunar: true when the birth was in a leap month, e.g. leap 4th month is month 04 with true.",
                "type": "boolean"
              },
              "subject": {
                "description": "Whose chart this is, recorded for audit only. Default other. Every chart saved here is an additional chart; it never becomes the user's own primary chart.",
                "enum": ["self", "other"],
                "type": "string"
              }
            },
            "required": ["birth_date", "birthplace", "display_name", "gender"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "chart_id": {
                "type": "string"
              },
              "chart_ready": {
                "type": "boolean"
              },
              "display_name": {
                "type": "string"
              },
              "engine_version": {
                "description": "FateTell calculation engine version (package version + commit).",
                "type": "string"
              },
              "links": {
                "description": "FateTell web pages for objects in this result, for citation. Only objects already present in the result are linked.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "rel": {
                      "description": "Which FateTell page this is: chart, daily_fortune, luck_pillars or account.",
                      "enum": ["chart", "daily_fortune", "luck_pillars", "account"],
                      "type": "string"
                    },
                    "url": {
                      "description": "Page in the FateTell web app for an object that appears in this result.",
                      "type": "string"
                    }
                  },
                  "required": ["rel", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "matched_existing": {
                "description": "True when a chart with the same name and birth details already exists; that chart is returned and no new one is created.",
                "type": "boolean"
              },
              "moments": {
                "description": "Calendar facts about this date: luck_pillar_change_in (value = months), solar_term_today, annual_clash (year branch clashes the natal year branch), birth_year_return (year pillar equals the natal year pillar), month_clash, energy_extreme (high or low energy), birthday_window (within 7 days of the birthday).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "enum": ["luck_pillar_change_in", "solar_term_today", "annual_clash", "birth_year_return", "month_clash", "energy_extreme", "birthday_window"],
                      "type": "string"
                    },
