        {
          "name": "get_almanac",
          "title": "Get almanac",
          "description": "Return the Chinese almanac for one to 31 consecutive days: Gregorian and lunar dates, solar terms, and the year, month and day pillars. The month pillar is given for both hemispheres.\nUse for questions like \"What is today's day pillar?\", \"When is the next solar term?\", or to get the stems and branches of upcoming days or months for date selection.\nNot for a person's chart or days: use get_saved_chart or cast_bazi_chart for a chart, get_daily_fortune or get_chart_calendar for a saved chart's days. Not for Western astrology.\nDeterministic; no personal data involved.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "description": "Number of consecutive days, 1 to 31. Default 1.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hemisphere": {
                "description": "Which month pillar the text summary leads with. Default north. The structured result always includes both.",
                "enum": ["north", "south"],
                "type": "string"
              },
              "start_date": {
                "description": "First date, YYYY-MM-DD, between 1900-01-01 and 2100-12-31. Default: today in timezone.",
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone name used only to resolve the default start_date. Default UTC.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Term": {
                "additionalProperties": false,
                "description": "A BaZi term as {code, zh, en}.",
                "properties": {
                  "code": {
                    "description": "Stable machine-readable code, e.g. \"hurting_officer\".",
                    "type": "string"
                  },
                  "en": {
                    "description": "English name, e.g. \"Hurting Officer\".",
                    "type": "string"
                  },
                  "zh": {
                    "description": "Chinese term as used by FateTell, e.g. \"伤官\".",
                    "type": "string"
                  }
                },
                "required": ["code", "en", "zh"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "conventions": {
                "additionalProperties": false,
                "description": "Calendar conventions used for this result.",
                "properties": {
                  "hemisphere": {
                    "description": "Hemisphere the text summary follows; both month pillars are always in the structured result.",
                    "enum": ["north", "south"],
                    "type": "string"
                  },
                  "year_boundary": {
                    "description": "The year pillar changes at the exact Start of Spring (Li Chun) instant, not at Lunar New Year.",
                    "enum": ["lichun"],
                    "type": "string"
                  }
                },
                "required": ["hemisphere", "year_boundary"],
                "type": "object"
              },
              "days": {
                "description": "Number of days returned.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "days_list": {
                "description": "Pillars are taken at 12:00 Beijing time; months and years change at the exact solar term instant.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "Gregorian date, YYYY-MM-DD.",
                      "type": "string"
                    },
                    "day_pillar": {
                      "description": "A stem-branch pair in Chinese characters, e.g. \"丙午\".",
                      "type": "string"
                    },
                    "lunar": {
                      "additionalProperties": false,
                      "description": "Chinese lunar date.",
                      "properties": {
                        "day": {
                          "description": "Lunar day, 1-30.",
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "is_leap_month": {
                          "type": "boolean"
                        },
                        "month": {
                          "description": "Lunar month, 1-12.",
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "year_ganzhi": {
                          "description": "Lunar year stem-branch, starting at Lunar New Year.",
                          "type": "string"
                        },
                        "zh": {
                          "description": "Lunar date written in Chinese, e.g. \"八月廿三\".",
                          "type": "string"
                        }
                      },
                      "required": ["day", "is_leap_month", "month", "year_ganzhi", "zh"],
                      "type": "object"
                    },
                    "month_clash": {
                      "additionalProperties": false,
                      "description": "Whether the day branch clashes with each month branch.",
                      "properties": {
                        "north": {
                          "type": "boolean"
                        },
                        "south": {
                          "type": "boolean"
                        }
                      },
                      "required": ["north", "south"],
                      "type": "object"
                    },
                    "month_pillar": {
                      "additionalProperties": false,
                      "description": "Month pillar for northern and southern-hemisphere charts; the southern one is adjusted per FateTell cross-region rules.",
                      "properties": {
                        "north": {
                          "description": "A stem-branch pair in Chinese characters, e.g. \"丙午\".",
                          "type": "string"
                        },
                        "south": {
                          "description": "A stem-branch pair in Chinese characters, e.g. \"丙午\".",
                          "type": "string"
                        }
                      },
                      "required": ["north", "south"],
                      "type": "object"
                    },
                    "solar_term": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "at": {
                              "description": "Instant of the solar term, ISO 8601 in Beijing time (+08:00).",
                              "type": "string"
                            },
                            "name": {
                              "$ref": "#/$defs/Term"
                            }
                          },
                          "required": ["at", "name"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Solar term starting on this date (Beijing time), or null."
                    },
                    "weekday": {
                      "enum": ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"],
                      "type": "string"
                    },
                    "year_pillar": {
                      "description": "Year pillar, changing at the Start of Spring.",
                      "type": "string"
                    }
                  },
                  "required": ["date", "day_pillar", "lunar", "month_clash", "month_pillar", "solar_term", "weekday", "year_pillar"],
                  "type": "object"
                },
                "type": "array"
              },
              "engine_version": {
                "description": "FateTell calculation engine version (package version + commit).",
                "type": "string"
              },
              "next_start_date": {
                "description": "When truncated, the start_date that continues the range.",
                "type": "string"
              },
              "notes": {
                "description": "Codes for facts that qualify this result: hour_assumed (no birth time, 12:00 used), true_solar_skipped_no_longitude, southern_month_adjusted, palace_formula_lunar_javascript (life and body palaces follow the lunar-javascript formula), legacy_v0_chart, judgment_unavailable, chart_pending, truncated, lunar_converted (the birth date was given in the lunar calendar and converted to Gregorian).",
                "items": {
                  "enum": ["hour_assumed", "true_solar_skipped_no_longitude", "southern_month_adjusted", "palace_formula_lunar_javascript", "legacy_v0_chart", "judgment_unavailable", "chart_pending", "truncated", "lunar_converted"],
                  "type": "string"
                },
                "type": "array"
              },
              "paipan_version": {
                "description": "Chart rule version. Charts computed now are always v1 (FateTell cross-region rules).",
                "enum": ["v1", "v0"],
                "type": "string"
              },
              "start_date": {
                "description": "First date returned, YYYY-MM-DD.",
                "type": "string"
              },
              "truncated": {
                "description": "True when fewer days than requested were returned to stay within the size limit.",
                "type": "boolean"
              },
              "tzdata_version": {
                "description": "IANA time zone database version used by the server.",
                "type": "string"
              }
            },
            "required": ["conventions", "days", "days_list", "engine_version", "notes", "paipan_version", "start_date", "truncated", "tzdata_version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get almanac"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
