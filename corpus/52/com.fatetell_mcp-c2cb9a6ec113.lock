{
  "lockfileVersion": 2,
  "subjects": {
    "com.fatetell/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fatetell.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fatetell",
        "title": "FateTell",
        "version": "0.1.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Saved charts first: for \"my chart\" or a saved profile call list_saved_charts, then get_saved_chart; never re-cast a saved chart from birth data. cast_bazi_chart is for births not saved. get_almanac needs no chart and no birth data (stems and branches, solar terms, lunar date; up to 31 days per call). get_daily_fortune (one day) and get_chart_calendar (many days) need a chart_id or \"self\". Calls are rate limited; a rate_limited error says when it resets; identical calls within 24 hours are not counted.",
      "tools": [
        {
          "name": "cast_bazi_chart",
          "title": "Cast BaZi chart",
          "description": "Compute a BaZi chart from birth data: pillars with Ten Gods, hidden stems, Na Yin, Day Master, all luck pillars, palaces and today's pillars; southern-hemisphere births use cross-region rules.\nUse for a birth not saved in FateTell, e.g. \"What is my BaZi? Born 1990-05-17 08:30 in Taipei\".\nNot for a saved chart (get_saved_chart already has its pillars, luck pillars and judgment; do not rebuild its birth data for this), Day Master strength (get_bazi_judgment), calendar (get_almanac), Western astrology, or predicting events or years of accident, illness or death.\nDeterministic; nothing stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "birth": {
                "description": "Birth data. No birthplace name or latitude is collected.",
                "properties": {
                  "calendar": {
                    "description": "Default solar (Gregorian). Use lunar when the user gives a Chinese lunar birthday; the server converts it to Gregorian, so do not convert it yourself.",
                    "enum": ["solar", "lunar"],
                    "type": "string"
                  },
                  "date": {
                    "description": "Birth date in the local calendar of the birthplace, YYYY-MM-DD: Gregorian by default; with calendar lunar, the Chinese lunar year, month (1-12) and day.",
                    "type": "string"
                  },
                  "gender": {
                    "description": "Determines whether the luck pillars run forward or backward.",
                    "enum": ["male", "female"],
                    "type": "string"
                  },
                  "hemisphere": {
                    "description": "Hemisphere of the birthplace. Judge it from the birthplace itself; it cannot be inferred from the time zone (Asia/Jakarta, Africa/Nairobi and America/Belem span the equator).",
                    "enum": ["north", "south"],
                    "type": "string"
                  },
                  "longitude": {
                    "description": "Birthplace longitude, -180 to 180. Only used when use_true_solar_time is true and only when the user supplies it; do not infer it from the birthplace. Never stored or logged.",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "lunar_leap_month": {
                    "description": "Default false. Only with calendar lunar: true when the birth was in a leap month, e.g. leap 4th month is month 04 with true.",
                    "type": "boolean"
                  },
                  "time": {
                    "description": "Local clock time at the birthplace, 24-hour HH:mm. Omit if unknown: the chart then uses 12:00 and reports hour_assumed.",
                    "type": ["string", "null"]
                  },
                  "timezone": {
                    "description": "IANA time zone name of the birthplace, e.g. Asia/Taipei or Australia/Sydney. GMT+8 or UTC+8 style offsets are not accepted.",
                    "type": "string"
                  },
                  "use_true_solar_time": {
                    "description": "Default false. Set true only when the user explicitly asks for true solar time; FateTell's app does not apply it by default. When true and longitude is given, the birth time is corrected to true solar time; without longitude no correction is made and notes include true_solar_skipped_no_longitude.",
                    "type": "boolean"
                  }
                },
                "required": ["date", "gender", "hemisphere", "timezone"],
                "type": "object"
              },
              "include_today": {
                "description": "Default true. When false, today's pillars are omitted (today is null), which keeps the result smaller.",
                "type": "boolean"
              },
              "locale": {
                "description": "Language of the chart card shown to the user, as a BCP 47 tag, normally the language the user is writing in. Only zh-CN, zh-TW and en are supported; any other language falls back to en.",
                "type": "string"
              }
            },
            "required": ["birth"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Pillar": {
                "additionalProperties": false,
                "description": "One of the four pillars with its elements.",
                "properties": {
                  "branch": {
                    "description": "Earthly branch, Chinese character.",
                    "type": "string"
                  },
                  "branch_element": {
                    "$ref": "#/$defs/Term",
                    "description": "Five Element of the branch (main qi)."
                  },
                  "ganzhi": {
                    "description": "A stem-branch pair in Chinese characters, e.g. \"丙午\".",
                    "type": "string"
                  },
                  "hidden_stems": {
                    "description": "Hidden stems of the branch, main qi first, then middle and residual qi.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "element": {
                          "$ref": "#/$defs/Term",
                          "description": "Five Element of the hidden stem."
                        },
                        "stem": {
                          "description": "Hidden stem, Chinese character.",
                          "type": "string"
                        },
                        "ten_god": {
                          "$ref": "#/$defs/Term",
                          "description": "Ten God of the hidden stem relative to the Day Master."
                        }
                      },
                      "required": ["element", "stem", "ten_god"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "life_stage": {
                    "$ref": "#/$defs/Term",
                    "description": "Twelve-stage (Chang Sheng) state of the Day Master's stem on this pillar's branch; yang stems run forward, yin stems backward."
                  },
                  "nayin": {
                    "$ref": "#/$defs/Term",
                    "description": "Na Yin of this stem-branch pair."
                  },
                  "stem": {
                    "description": "Heavenly stem, Chinese character.",
                    "type": "string"
                  },
                  "stem_element": {
                    "$ref": "#/$defs/Term",
                    "description": "Five Element of the stem."
                  },
                  "ten_god": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Term"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Ten God of the stem relative to the Day Master; null for the day pillar (the Day Master itself)."
                  }
                },
                "required": ["branch", "branch_element", "ganzhi", "hidden_stems", "life_stage", "nayin", "stem", "stem_element", "ten_god"],
                "type": "object"
              },
              "Term": {
                "additionalProperties": false,
                "description": "A BaZi term as {code, zh, en}.",
                "properties": {
                  "code": {
                    "description": "Stable machine-readable code, e.g. \"hurting_officer\".",
                    "type": "string"
                  },
                  "en": {
                    "description": "English name, e.g. \"Hurting Officer\".",
                    "type": "string"
                  },
                  "zh": {
                    "description": "Chinese term as used by FateTell, e.g. \"伤官\".",
                    "type": "string"
                  }
                },
                "required": ["code", "en", "zh"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "birth": {
                "additionalProperties": false,
                "description": "Birth data as interpreted.",
                "properties": {
                  "calendar": {
                    "description": "Calendar the birth date was given in.",
                    "enum": ["solar", "lunar"],
                    "type": "string"
                  },
                  "date": {
                    "description": "Gregorian birth date used for the chart; converted from the lunar date when calendar is lunar.",
                    "type": "string"
                  },
                  "gender": {
                    "enum": ["male", "female"],
                    "type": "string"
                  },
                  "hemisphere": {
                    "enum": ["north", "south"],
                    "type": "string"
                  },
                  "hour_assumed": {
                    "description": "True when no birth time was given and 12:00 was used.",
                    "type": "boolean"
                  },
                  "lunar_date": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "The lunar birth date as given; null when the date was given in the Gregorian calendar.",
                        "properties": {
                          "date": {
                            "description": "Lunar birth date as given, YYYY-MM-DD.",
                            "type": "string"
                          },
                          "is_leap_month": {
                            "type": "boolean"
                          },
                          "zh": {
                            "description": "Lunar month and day written in Chinese, e.g. \"四月廿三\" or \"闰二月初一\".",
                            "type": "string"
                          }
                        },
                        "required": ["date", "is_leap_month", "zh"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "moment_used": {
                    "description": "Birth instant used for the chart, ISO 8601 with the original offset.",
                    "type": "string"
                  },
                  "time": {
                    "description": "Birth time as given; null when unknown.",
                    "type": ["string", "null"]
                  },
                  "timezone": {
                    "type": "string"
                  },
                  "true_solar_applied": {
                    "type": "boolean"
                  }
                },
                "required": ["calendar", "date", "gender", "hemisphere", "hour_assumed", "lunar_date", "moment_used", "time", "timezone", "true_solar_applied"],
                "type": "object"
              },
              "conventions": {
                "additionalProperties": false,
                "description": "Chart conventions used for this result.",
                "properties": {
                  "calendar_input": {
                    "anyOf": [
                      {
                        "enum": ["solar", "lunar"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Calendar of the birth date given in this call; null for saved charts, whose input calendar is not recorded."
                  },
                  "hemisphere": {
                    "description": "Hemisphere the chart was computed for.",
                    "enum": ["north", "south"],
                    "type": "string"
                  },
                  "hour_boundary": {
                    "description": "From 23:00 local time (true solar time when applied) the day pillar is the next day and the hour pillar is Zi counted from that next day; there is no early/late Zi split.",
                    "enum": ["day_changes_at_23"],
                    "type": "string"
                  },
                  "month_adjusted": {
                    "description": "Whether the month pillar was adjusted for the southern hemisphere (FateTell cross-region rules, v1 charts only).",
                    "type": "boolean"
                  },
                  "true_solar_applied": {
                    "description": "Whether the birth time was corrected to true solar time.",
                    "type": "boolean"
                  },
                  "year_boundary": {
                    "description": "The year pillar changes at the exact Start of Spring (Li Chun) instant, not at Lunar New Year.",
                    "enum": ["lichun"],
                    "type": "string"
                  }
                },
                "required": ["calendar_input", "hemisphere", "hour_boundary", "month_adjusted", "true_solar_applied", "year_boundary"],
                "type": "object"
              },
              "day_master": {
                "additionalProperties": false,
                "properties": {
                  "element": {
                    "$ref": "#/$defs/Term",
                    "description": "Five Element of the Day Master."
                  },
                  "polarity": {
                    "enum": ["yin", "yang"],
                    "type": "string"
                  },
                  "stem": {
                    "description": "Day stem, Chinese character.",
                    "type": "string"
                  }
                },
                "required": ["element", "polarity", "stem"],
                "type": "object"
              },
              "engine_version": {
                "description": "FateTell calculation engine version (package version + commit).",
                "type": "string"
              },
              "locale": {
                "description": "Chart card language resolved from the locale argument. Absent when no valid locale was given.",
                "enum": ["zh-CN", "zh-TW", "en"],
                "type": "string"
              },
              "luck_pillars": {
                "additionalProperties": false,
                "description": "Luck pillars (Da Yun).",
                "properties": {
                  "direction": {
                    "enum": ["forward", "backward"],
                    "type": "string"
                  },
                  "qiyun_years": {
                    "description": "Years from birth to the first luck pillar, two decimals.",
                    "type": "number"
                  },
                  "start_age": {
                    "description": "Age when the first luck pillar starts, East Asian count.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "start_at": {
                    "description": "Instant the first luck pillar starts, ISO 8601 with the birthplace offset.",
                    "type": "string"
                  },
                  "start_year": {
                    "description": "Gregorian year when the first luck pillar starts.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "steps": {
                    "description": "Eight luck pillars of ten years each.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "end_age": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "end_year": {
                          "description": "Gregorian year this luck pillar ends (start_year + 9).",
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "ganzhi": {
                          "description": "A stem-branch pair in Chinese characters, e.g. \"丙午\".",
                          "type": "string"
                        },
                        "nayin": {
                          "$ref": "#/$defs/Term"
                        },
                        "start_age": {
                          "description": "Age at start, counted in East Asian years (born at age 1, +1 at each Start of Spring).",
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "start_year": {
                          "description": "Gregorian year this luck pillar starts.",
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "stem_ten_god": {
                          "$ref": "#/$defs/Term",
                          "description": "Ten God of the luck pillar stem relative to the Day Master."
                        }
                      },
                      "required": ["end_age", "end_year", "ganzhi", "nayin", "start_age", "start_year", "stem_ten_god"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["direction", "qiyun_years", "start_age", "start_at", "start_year", "steps"],
                "type": "object"
              },
              "month_pillar_raw": {
                "description": "Northern-hemisphere month pillar; equals pillars.month.ganzhi for northern births.",
                "type": "string"
              },
              "notes": {
                "description": "Codes for facts that qualify this result: hour_assumed (no birth time, 12:00 used), true_solar_skipped_no_longitude, southern_month_adjusted, palace_formula_lunar_javascript (life and body palaces follow the lunar-javascript formula), legacy_v0_chart, judgment_unavailable, chart_pending, truncated, lunar_converted (the birth date was given in the lunar calendar and converted to Gregorian).",
                "items": {
                  "enum": ["hour_assumed", "true_solar_skipped_no_longitude", "southern_month_adjusted", "palace_formula_lunar_javascript", "legacy_v0_chart", "judgment_unavailable", "chart_pending", "truncated", "lunar_converted"],
                  "type": "string"
                },
                "type": "array"
              },
              "paipan_version": {
                "description": "Chart rule version. Charts computed now are always v1 (FateTell cross-region rules).",
                "enum": ["v1", "v0"],
                "type": "string"
              },
              "palaces": {
                "additionalProperties": false,
                "description": "Palaces derived from the chart; month-based palaces use the adjusted month pillar.",
                "properties": {
                  "body": {
                    "description": "Body palace (Shen Gong).",
                    "type": "string"
                  },
                  "conception": {
                    "description": "Conception palace (Tai Yuan).",
                    "type": "string"
                  },
                  "life": {
                    "description": "Life palace (Ming Gong).",
                    "type": "string"
                  }
                },
                "required": ["body", "conception", "life"],
                "type": "object"
              },
              "pillars": {
                "additionalProperties": false,
                "properties": {
                  "day": {
                    "$ref": "#/$defs/Pillar"
                  },
                  "hour": {
                    "$ref": "#/$defs/Pillar"
                  },
                  "month": {
                    "$ref": "#/$defs/Pillar"
                  },
                  "year": {
                    "$ref": "#/$defs/Pillar"
                  }
                },
                "required": ["day", "hour", "month", "year"],
                "type": "object"
              },
              "solar_terms": {
                "additionalProperties": false,
                "description": "The month-defining solar terms before and after the birth.",
                "properties": {
                  "next": {
                    "additionalProperties": false,
                    "properties": {
                      "at": {
                        "description": "Instant of the solar term, ISO 8601 in the birthplace offset.",
                        "type": "string"
                      },
                      "name": {
                        "$ref": "#/$defs/Term"
                      }
                    },
                    "required": ["at", "name"],
                    "type": "object"
                  },
                  "previous": {
                    "additionalProperties": false,
                    "properties": {
                      "at": {
                        "description": "Instant of the solar term, ISO 8601 in the birthplace offset.",
                        "type": "string"
                      },
                      "name": {
                        "$ref": "#/$defs/Term"
                      }
                    },
                    "required": ["at", "name"],
                    "type": "object"
                  }
                },
                "required": ["next", "previous"],
                "type": "object"
              },
              "today": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "Today's pillars, taken at 12:00 Beijing time of that date.",
                    "properties": {
                      "date": {
                        "description": "Today in the given time zone, YYYY-MM-DD.",
                        "type": "string"
                      },
                      "day_pillar": {
                        "description": "A stem-branch pair in Chinese characters, e.g. \"丙午\".",
                        "type": "string"
                      },
                      "month_clash": {
                        "description": "Whether the day branch clashes with the month branch.",
                        "type": "boolean"
                      },
                      "month_pillar": {
                        "description": "Month pillar for this chart, adjusted for the southern hemisphere when applicable.",
                        "type": "string"
                      },
                      "month_pillar_raw": {
                        "description": "Unadjusted (northern-hemisphere) month pillar.",
                        "type": "string"
                      },
                      "year_pillar": {
                        "description": "A stem-branch pair in Chinese characters, e.g. \"丙午\".",
                        "type": "string"
                      }
                    },
                    "required": ["date", "day_pillar", "month_clash", "month_pillar", "month_pillar_raw", "year_pillar"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null when include_today is false."
              },
              "tzdata_version": {
                "description": "IANA time zone database version used by the server.",
                "type": "string"
              }
            },
            "required": ["birth", "conventions", "day_master", "engine_version", "luck_pillars", "month_pillar_raw", "notes", "paipan_version", "palaces", "pillars", "solar_terms", "today", "tzdata_version"],
            "type": "object"
          },
