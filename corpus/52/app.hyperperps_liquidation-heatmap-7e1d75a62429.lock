      },
      "instructions": "HyperPerps: live, anonymized Hyperliquid liquidation heatmap. Read-only, free, no key.\nMarkets: BTC, ETH, SOL, HYPE.\nCall get_liquidation_heatmap(symbol) for a snapshot: liquidations, stop_losses and take_profits (each with longs/shorts levels) plus crowd-positioning fields.\nCheck _meta.stale and _meta.age_seconds first; a stale snapshot is not current. A null field means no read this cycle, not zero.\nConventions: Every distance is a signed percent from spot: negative below price, positive above. Directional scalars run -1..+1. Negative = bearish / short lean, positive = bullish / long lean, 0 = balanced.\nDefault view = walls within 5% of price, biggest per side; pass range (percent or 'all') and/or levels (count or 'all') for the full ladder.\nCall get_heatmap_field_definitions for the current meaning of every field.\nHyperliquid data only; anonymized clusters, never per-wallet rows. Not financial advice.",
      "tools": [
        {
          "name": "api_key_challenge",
          "title": "Start API key signup",
          "description": "Returns a message for the wallet to sign (EIP-191 personal_sign); the signed message is exchanged for an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "wallet": {
                "type": "string"
              }
            },
            "required": ["wallet"],
            "type": "object"
          },
