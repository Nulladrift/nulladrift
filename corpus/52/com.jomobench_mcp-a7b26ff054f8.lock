      "serverInfo": {
        "name": "jomobench",
        "title": "JomoBench: fomo fees, the realized fee rate and referral facts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "JomoBench is an independent, unofficial site that measures the fomo trading app (not affiliated with fomo or FOMO Labs Inc.). Tools: fee_quote (fomo's own fee for one spot trade at a given size and route, with or without a referral code, from fomo's published schedule), realized_fee (what fomo spot traders actually paid as a share of volume, measured from DefiLlama data, by month and for the last 30 and 7 days), get_referral_info (what a fomo code does, and JomoBench's honest referral state) and search_site. Say which kind of number you quote: fee_quote is computed from fomo's published schedule; realized_fee is measured. Every valid fomo referral code does the same thing: the 0.50% standard rate becomes 0.45% (a 10% discount on that percentage). It does not change the fixed small-trade fees on Solana or the 0.05% major-token rate, it can only be applied before your first trade, and a recorded referrer cannot be changed. No fomo document describes a bigger discount; \"50%\", \"95%\" or \"100% off\" code pages are wrong. fomo does not have a copy trading feature: following a trader adds their trades to your feed and alerts but never places a trade for you (fomo help centre, updated May 19, 2026). Third-party copy bots exist; none is a fomo feature, and fomo's terms let it restrict accounts used through unapproved tools. Perps are not available to US persons; never suggest a VPN or other workaround. Most small tokens lose most of their value, leverage can wipe out a position quickly, and nothing on JomoBench is a token pick, a price prediction or financial advice.",
      "tools": [
        {
          "name": "fee_quote",
          "title": "fomo spot fee quote",
          "description": "fomo's own fee for ONE spot trade (a buy or a sell) of a given USD size, computed from fomo's published schedule (help centre \"Trading fees on fomo\"). Route: \"solana-low\" (Solana, lowest-fee route: $0.10 under $5, 2% to $47.50, $0.95 flat to $190, then 0.50%), \"solana-other\" (Solana, other routes: 0.50%, $0.95 minimum), \"evm\" (Base, BNB Chain, Monad, Ethereum, Robinhood Chain, Arc, Elysium: 0.50% plus the network fee you pay) or \"major\" (selected major tokens: 0.05%). Chain names work too. Returns the fee in USD, the rate, the rule that applied, and the same trade with and without a referral code. Spot only: on perps fomo charges up to 0.05% of the position size per trade, plus Hyperliquid's fee. Excludes pool fees, price impact, network fees and token taxes. Computed, not measured.",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "description": "Trade size in USD (required), e.g. 25, 100, 1000.",
                "type": "number"
              },
              "code": {
                "description": "True if the account signed up with a referral code (default false). A code only changes the 0.50% rate, to 0.45%.",
                "type": "boolean"
              },
              "round_trip": {
                "description": "Also price selling the same size (buy + sell).",
                "type": "boolean"
              },
              "route": {
                "description": "solana-low (default), solana-other, evm or major; or a chain name such as \"base\" or \"robinhood chain\".",
                "type": "string"
              }
            },
            "required": ["amount_usd"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:613a5870e29aedaa09e17971983556ca68a17e1a2b1bef09ed02f8b1b5c01004"
        },
        {
          "name": "get_referral_info",
          "title": "fomo referral facts and JomoBench's referral state",
          "description": "What a fomo referral code does for the trader (0.50% becomes 0.45%; nothing else changes), when it can be applied, what fomo pays the referrer, and whether JomoBench has a fomo code (today it does not). Pass venue \"fomo\" (default), another app JomoBench links to, or \"all\".",
          "inputSchema": {
            "properties": {
              "venue": {
                "description": "\"fomo\" (default), \"axiom\", \"phantom\", \"hyperliquid\", ... or \"all\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f740159fe4c192cb8f05ccf57b7d948ab4d0fc8b3b60f6be2280ad89c2af04a4"
        },
        {
          "name": "realized_fee",
          "title": "fomo realized spot fee rate (measured)",
          "description": "What fomo spot traders actually paid in fomo fees as a share of spot volume, measured from DefiLlama's fomo Wallet fee and volume data (fees on all chains divided by volume, same days, closed days only), against the 0.50% sticker rate. Returns the last 30 days, the last 7 days, the last complete month and every month since July 2026; pass month (\"YYYY-MM\") for one month.",
          "inputSchema": {
            "properties": {
              "month": {
                "description": "Optional month, \"YYYY-MM\" (from 2026-07).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
