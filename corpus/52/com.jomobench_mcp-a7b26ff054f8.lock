          "digest": "sha256:c00367832c1c7d4c95d71b4d095ea4f3335f7ca6ee07f91cdec6198e08c6da45"
        },
        {
          "name": "search_site",
          "title": "Search JomoBench",
          "description": "Find JomoBench pages (fees, the bench measurements, guides, explainers, comparisons, data, news) for a question or keyword. Returns titles, one-line summaries and URLs; read the page for its dated short answer.",
          "inputSchema": {
            "properties": {
