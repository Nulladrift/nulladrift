      },
      "instructions": "This is the public introduction. Full module data, manifests, schemas and the details of advanced features are available to agents and users with an active paid plan: send your ak_ key (Authorization: Bearer ak_... or X-API-Key) on this same URL. Plans and prices are listed in this document; buy an agent plan: POST /api/v1/agent/subscribe.",
      "tools": [
        {
