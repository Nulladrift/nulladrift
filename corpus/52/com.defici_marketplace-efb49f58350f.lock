          },
          "digest": "sha256:4d66398236c13d5bc21bbed2b68f5ced8324311fff84082e2a5dc6e936d43d7e"
        },
        {
          "name": "buy_plan",
          "description": "Buy (or upgrade) your Defici agent plan with no human: method \"spt\" pays with a Stripe Shared Payment Token your wallet granted to Defici (EUR; for monthly auto-renewal use recurring_interval=month and max_amount >= 2 x price); method \"approved_card\" charges the card your operator approved once (POST /api/v1/billing/operator-approval), inside the monthly cap. Prices EUR/month: starter 3.49, pro 8.99, business 24.49. Pass idempotency_key to make retries safe.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "description": "8-64 chars; same key = same payment",
                "type": "string"
              },
              "method": {
                "enum": ["spt", "approved_card"],
                "type": "string"
              },
              "plan": {
                "enum": ["starter", "pro", "business"],
                "type": "string"
              },
              "shared_payment_token": {
                "description": "spt_... (method spt)",
                "type": "string"
              }
            },
            "required": ["method", "plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Buy a Defici plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4344f5b3b5cd076de39f72a140a74c9af0449510125c70c5b7bdd25f0639e095"
        },
        {
          "name": "get_listing",
          "description": "Fetch full details for a single listing by its UUID. Returns the listing if active, sold, or expired. Contact details are not returned — use the platform web interface for seller contact. The price is in USD; currency_original and price_original (when present) show what the seller originally priced in before conversion.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Listing UUID (e.g. from search_listings results)",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:284c84f1a3dc75f0a92ff5848787213908914e9dc67e557baeafd29c785e485b"
        },
        {
          "name": "get_regions",
          "description": "Return all supported market regions with their id, country, currency, and languages. Use the region id as the market argument in search_listings.",
          "inputSchema": {
