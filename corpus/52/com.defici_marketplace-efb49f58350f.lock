            "readOnly": true
          },
          "digest": "sha256:49306383964844abfa465cea3ff14af139ecee5ec7ddd2151752958fc859f4a0"
        },
        {
          "name": "get_subscription_info",
          "description": "Capability tiers available on Defici, described by what each tier unlocks — not by price (pricing is not finalized yet, so no price figure is returned by this tool). Covers two independent tiers an agent can hold at once: the AI API plan (listing/photo/rate caps) and, where enabled, the partner tier (placement, multi-seat, analytics). Only capabilities that are live today are listed here.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Subscription info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:92ffb7366529af87eb697d92ccf13f38e063be2a1c6c08ff0bd1eab247cf100c"
        },
        {
          "name": "list_categories",
          "description": "Return the complete category taxonomy for Defici.com. Use the category id values as the category argument in search_listings.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e8bf8c059bfb0cee76aaee8fe2219064acaeb99f47140951941fb64719db7552"
        },
        {
          "name": "search_listings",
          "description": "Search active listings on Defici.com global marketplace. Returns paginated results. Contact details are not included — this is a read-only discovery tool. Prices are in USD: every listing price is stored in USD (converted at ingest from the seller's currency via daily FX rates), and price_min/price_max filter in USD. Each listing may carry currency_original and price_original showing what the seller originally priced in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category filter. Use list_categories to get valid IDs (e.g. JOBS, CARS_VEHICLES, PROPERTY_RENT, MOBILES_ELECTRONICS). Human-friendly aliases also accepted (e.g. \"cars\", \"jobs\", \"electronics\").",
                "type": "string"
              },
              "city": {
                "description": "City name filter (partial match, case-insensitive).",
                "type": "string"
              },
              "limit": {
                "description": "Results per page (default: 20, max: 30).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Market/region filter. Use get_regions for valid IDs (e.g. global, dubai, india, lithuania, nigeria). Default: global (all markets).",
                "type": "string"
              },
              "page": {
                "description": "Page number for pagination (default: 1).",
                "minimum": 1,
                "type": "integer"
              },
              "price_max": {
                "description": "Maximum price filter, in USD. All listing prices are stored in USD.",
                "type": "number"
              },
              "price_min": {
                "description": "Minimum price filter, in USD. All listing prices are stored in USD.",
                "type": "number"
              },
              "q": {
                "description": "Free-text search query (matches title and description). Max 200 characters.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9ab59613e7bfca4c7042ac2a78445cf55d192593283c40739a2df3b0bf18f4d2"
        }
      ],
