      "serverInfo": {
        "name": "moatlight",
        "title": "Moatlight",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Moatlight measures whether ChatGPT and Google AI Overview name a business. Public tools need no login. Report tools need the user to sign in with OAuth; the free plan allows one website and one report every 30 days, so start a report only when the user asks. Agent readiness tools need the Early Access pass, which a person must buy in a browser.",
      "tools": [
        {
          "name": "batch_get_reports",
          "title": "Read up to 25 reports in one request",
          "description": "Batch read: send a list of report ids and get each report (or its error) in one answer, instead of one call per report. Each result has its own status, so one unknown id does not fail the rest. Read-only. Needs login with scope reports:read.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "report_ids": {
                "description": "Report ids to read, 1 to 25.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["report_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bfc77b6c73399b43d325afb58f055a3765373ad518374763c0256b4efd483b87"
        },
        {
          "name": "create_report",
          "title": "Start a report for a website",
          "description": "Creates a report draft for a website and starts reading it. Free plan: one website, one report every 30 days. A new draft for a different website deletes the user's unfinished draft for the old one, so ask the user first. Returns 202 Accepted with the report, a job object and a Location header: poll that URL (GET /api/v1/reports/{reportId}) every few seconds until stage is needs_confirmation, then call the start endpoint. Send an Idempotency-Key header so a retry cannot start a second report. Needs login with scope reports:write.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Optional two-letter country. Send with language, or omit both to detect from the site.",
                "type": "string"
              },
              "language": {
                "description": "Optional language for that country.",
                "type": "string"
              },
              "website": {
                "description": "The website to measure, like yourcompany.com. Public sites only.",
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:01ecd8543ca198bcf1a9f4fecdbe38ac4726c6bb6c80a6e401e875e54cb8a1f5"
        },
