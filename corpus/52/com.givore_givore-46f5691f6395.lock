      "instructions": "Search live, public Givore giveaway listings in one Spanish city per call (cities: https://app.givore.com/cities), optionally narrowed to one category, then read one listing by id. Every item is free and collected in person; cite the canonical_url.",
      "tools": [
        {
          "name": "get_listing",
          "title": "Get Listing Tool",
          "description": "Get one live, public Givore giveaway listing by id. Returns {\"status\": \"unavailable\"} once it is claimed, removed or otherwise not public, and for any id that is not a giveaway.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The listing id, as returned by search_listings.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get Listing Tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e9646879368d8925b8cd3f622ee7a9e8db465e7f735fa5670367515da64a3b24"
        },
        {
          "name": "search_listings",
          "title": "Search Listings Tool",
          "description": "Search live, public Givore giveaway listings in one Spanish city, optionally narrowed to one category. Newest first.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional. A published listing-category slug to narrow the search to; omit it to search every listing in the city.",
                "type": "string"
              },
              "city": {
                "description": "One city, by slug or name, e.g. \"valencia\" or \"Málaga\". Must be a city listed at https://app.givore.com/cities.",
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 10. Server-clamped to [1, 20].",
                "type": "integer"
              }
            },
            "required": ["city"],
            "type": "object"
          },
