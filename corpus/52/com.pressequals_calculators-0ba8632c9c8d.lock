{
  "lockfileVersion": 2,
  "subjects": {
    "com.pressequals/calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pressequals.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "press-equals",
        "title": "Press Equals calculators",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Press Equals has 605 tested calculators (money, health, home projects, math, dates, conversions). Use them instead of doing arithmetic yourself: search_calculators to find one, get_calculator to see its inputs, run_calculator to get exact results and the working. Show the user the result's url so they can check or adjust the numbers. Without MCP, the same answers are plain text at https://pressequals.com/api/calc/{slug}?input=value.",
      "tools": [
        {
          "name": "get_calculator",
          "title": "Get calculator inputs",
          "description": "Describes a calculator's inputs: key, label, kind, unit, allowed options, limits and default value.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Calculator slug from search_calculators.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55bda1e9e66304629f36b534c2b2de6c59463044438a6f1d0452c936414c4e66"
        },
        {
          "name": "list_calculators",
          "title": "List calculators",
          "description": "Lists every calculator in a category. Without a category, lists the categories.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category to list.",
                "enum": ["financial", "math", "science", "health", "contractor", "automotive", "converters", "creator", "datetime", "ecommerce", "hobby", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69aa610a506d20ab50b54f0332f9b21c16069203cde9932be9a792b2c08c8005"
        },
        {
          "name": "run_calculator",
          "title": "Run calculator",
          "description": "Runs a calculator and returns its exact results, the step-by-step working where available, and a url that opens the calculator with these inputs. Inputs left out use the defaults from get_calculator.",
          "inputSchema": {
            "properties": {
              "inputs": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Input values by key, e.g. {\"principal\": 20000, \"annualRate\": 7}. Select inputs take one of the listed option values.",
                "type": "object"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7aea65c07f29f8dc05f027e5b12ab5b5847a37e5eb8e1dbe7b1fdebbdc09c043"
        },
        {
          "name": "search_calculators",
          "title": "Search calculators",
          "description": "Finds Press Equals calculators for a topic. Use short keywords (\"mortgage\", \"paint\", \"days between dates\", \"bmi\"); try a synonym if nothing comes back.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Most results to return (default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords for the calculation.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64f262e225f806dcce04caf288580a47c0df78c33055ea6a2a133615e20bc2cb"
        }
      ],
      "digest": "sha256:7aedd2e5fbe3b1701b49e0e68b318b73186204b3f7407e8eec142e0505f7c724"
    }
  }
}
