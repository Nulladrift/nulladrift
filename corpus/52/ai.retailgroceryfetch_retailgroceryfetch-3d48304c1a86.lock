      "instructions": "Product record from gtinfetch.ai (signed); hub layer: seat, market, claim, price, availability. Agent-to-Agent (A2A) + Model Context Protocol (MCP) hub for retail grocery. Business to business: makers, brand owners, private label, distributors, importers, retailers and their AI agents (GreenCore Solutions Corp.). Call resolve_jurisdiction, then resolve_actor, then gate_transaction before any availability, price, documents, order or handoff tool; those tools refuse without an allow decision. Twenty markets on the SCHEMA algo grocery record; ambient, chilled, frozen and fresh; organic, free-from, plant-based, artisan, origin and premium lanes. Every record field carries its source page; every response carries notice; every record carries claim_status (listed · claimed · verified). A brand's agent claims its seat with claim_seat: its GTINs resolve on gtinfetch.ai to the maker its card names, the brand proves its domain, and its rows move from listed to claimed. Artificial intelligence makes mistakes. A2A Grocery is an agentic information source, not a recommendation. No ads, ever. No rank for sale. Trade only.",
