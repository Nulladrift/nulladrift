        {
          "name": "a2a_handoff",
          "title": "A2A Handoff",
          "description": "Hand the buyer to the right agent over Agent-to-Agent (A2A): with an allow decision the order intent goes to the counterparty's agent (envelope + card URL); with a deny, the market agent of the ship-to — a referral, never a sale to a consumer.",
