        {
          "name": "conference-badge-readability-tester",
          "title": "Conference Badge Readability Tester",
          "description": "Estimates whether a name badge is readable at social distance and flags text that will likely feel too small or too crowded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "badge_width_mm": {
                "description": "Must be a finite number between 20 and 300. Values outside the range are invalid.",
                "maximum": 300,
                "minimum": 20,
                "type": "number"
              },
              "company_text": {
                "description": "Text is required. Leading and trailing whitespace are trimmed. Empty after trimming is invalid.",
                "type": "string"
              },
              "font_size_pt": {
                "description": "Must be a finite number between 6 and 72. Non-numeric or out-of-range values are invalid.",
                "maximum": 72,
                "minimum": 6,
                "type": "number"
              },
              "name_text": {
                "description": "Text is required. Leading and trailing whitespace are trimmed. Empty after trimming is invalid.",
                "type": "string"
              },
              "role_text": {
                "description": "Optional text. If provided, it is trimmed. Empty string is treated as blank.",
                "type": "string"
              },
              "viewing_distance_cm": {
                "description": "Must be a finite number between 20 and 500. Values outside the range are invalid.",
                "maximum": 500,
                "minimum": 20,
                "type": "number"
              }
            },
            "required": ["badge_width_mm", "company_text", "font_size_pt", "name_text", "viewing_distance_cm"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "badge_summary": {
                "additionalProperties": true,
                "type": "object"
              },
              "crowding_warnings": {
                "items": {},
                "type": "array"
              },
              "line_break_suggestions": {
                "items": {},
                "type": "array"
              },
              "readability_score": {
                "type": "number"
              },
              "sizing_notes": {
                "items": {},
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd242a697ac885cef28efa177bf0418c9588db8a9b2db822fc82892ca0d1c7e0"
