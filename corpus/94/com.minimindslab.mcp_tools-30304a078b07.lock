        {
          "name": "json-contract-compatibility-checker",
          "title": "JSON Contract Compatibility Checker",
          "description": "Developers need to confirm that a sample API response still matches a contract, including required fields, type expectations, enum constraints, and unexpected shape changes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contract_json": {
                "description": "Must be valid JSON text. The contract must be an object. Supported contract keys are name/title, type, required, properties, items, enum, const, additionalProperties, and nested combinations of those. Missing or invalid JSON must produce a parse error.",
                "type": "string"
              },
              "sample_json": {
                "description": "Must be valid JSON text. The sample must be a JSON object, array, string, number, boolean, or null. Missing or invalid JSON must produce a parse error.",
                "type": "string"
              },
              "show_path_details": {
                "description": "When true, mismatch outputs must include explicit JSONPath-like paths such as $.user.name. When false, the report may summarize issues without omitting the required output lists.",
                "type": "boolean"
              },
              "strict_mode": {
                "description": "When true, extra paths not allowed by the contract are reported as mismatches whenever additionalProperties is false or omitted for object branches that define properties. When false, extra paths are still listed in extra_paths but do not change overall compatibility unless another required rule fails.",
                "type": "boolean"
              }
            },
            "required": ["contract_json", "sample_json", "show_path_details", "strict_mode"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "compatibility_status": {
                "type": "string"
              },
              "enum_violations": {
                "items": {},
                "type": "array"
              },
              "extra_paths": {
                "items": {},
                "type": "array"
              },
              "missing_paths": {
                "items": {},
                "type": "array"
              },
              "type_mismatch_paths": {
                "items": {},
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e239729336cfe4071a68fa382418ac7515e64247fcc1c43d8e7de5fe5dd422d"
        },
        {
          "name": "json-schema-drift-impact-checker",
          "title": "JSON Schema Drift Impact Checker",
          "description": "API and frontend engineers need to know whether a JSON schema change will break real payloads, generated clients, or form bindings before they ship it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "new_json_schema": {
                "description": "Must be valid JSON text representing the proposed schema version. The schema must parse as an object; if parsing fails, show a parse error and stop comparison.",
