        {
          "name": "json-schema-vs-sample-payload-diff-checker",
          "title": "JSON Schema vs Sample Payload Diff Checker",
          "description": "API builders need to see exactly where a sample payload violates a schema or where the schema does not describe real data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "additional_properties_mode": {
                "description": "Controls handling of object properties not declared by the schema. schema_default uses the schema's own additionalProperties / unevaluatedProperties rules where supported by the tool. allow ignores extra-property violations. forbid reports extra-property paths even if the schema is permissive.",
                "enum": ["schema_default", "allow", "forbid"],
                "type": "string"
              },
              "json_schema": {
                "description": "Must be valid JSON text representing a JSON Schema document. If parsing fails, show a schema parse error and skip comparison.",
                "type": "string"
              },
              "sample_json": {
                "description": "Must be valid JSON text representing an instance payload. If parsing fails, show a sample parse error and skip comparison.",
                "type": "string"
              },
              "show_paths": {
                "description": "When true, include JSON Pointer-style instance paths for every mismatch. When false, still compute paths internally but present concise grouped results.",
                "type": "boolean"
              },
              "strict_types": {
                "description": "When true, require exact JSON type matches for object, array, string, number, integer, boolean, and null. Integers must still be numbers with no fractional component. When false, permit only JSON Schema-compatible numeric coercion is not performed; comparison remains type-based but integer and number mismatches are reported with lower severity in the summary only.",
                "type": "boolean"
              }
            },
            "required": ["additional_properties_mode", "json_schema", "sample_json", "show_paths", "strict_types"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "enum_violations": {
                "items": {},
                "type": "array"
              },
              "extra_property_paths": {
                "items": {},
