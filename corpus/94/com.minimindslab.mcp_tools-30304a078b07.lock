        {
          "name": "accessible-name-and-label-regression-diff",
          "title": "Accessible Name and Label Regression Diff",
          "description": "Teams need to know when a code change silently breaks accessible names, labels, or descriptions on interactive elements.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_description": {
                "description": "When true, compare accessible descriptions in addition to accessible names and labels.",
                "type": "boolean"
              },
              "match_by_selector": {
                "description": "When true, element matching prefers stable CSS-like selector identity when available; otherwise fallback matching is used.",
                "type": "boolean"
              },
              "new_dom_snippet": {
                "description": "Required. Must contain a non-empty HTML or DOM fragment. Plain text is treated as literal markup input, not rendered content.",
                "type": "string"
              },
              "old_dom_snippet": {
                "description": "Required. Must contain a non-empty HTML or DOM fragment. Plain text is treated as literal markup input, not rendered content.",
                "type": "string"
              },
              "show_element_paths": {
                "description": "When true, output includes deterministic element path strings for matched and problematic nodes.",
                "type": "boolean"
              }
            },
            "required": ["include_description", "match_by_selector", "new_dom_snippet", "old_dom_snippet", "show_element_paths"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "accessibility_summary": {
                "additionalProperties": true,
                "type": "object"
              },
              "ambiguous_elements": {
                "items": {},
                "type": "array"
              },
              "element_path_report": {
                "additionalProperties": true,
                "type": "object"
              },
              "missing_label_list": {
                "items": {},
                "type": "array"
              },
              "regression_list": {
                "items": {},
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b5c4d70a6a14f508b33f63c981521fb4eb6aaf3fd0f64bfe8d0d0f1528d55d8"
        },
        {
          "name": "api-breaking-change-diff-viewer",
          "title": "API Breaking Change Diff Viewer",
          "description": "Developers need to know whether a new API contract breaks existing clients before they merge or publish it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ignore_additive_changes": {
                "description": "When true, do not include new optional fields, new array members in additive-only contexts, or other non-breaking additions in the visible change lists.",
                "type": "boolean"
              },
              "new_contract_json": {
                "description": "Must be valid JSON text representing the proposed contract version. The tool must reject empty input and invalid JSON with a parse error.",
                "type": "string"
              },
              "old_contract_json": {
                "description": "Must be valid JSON text representing the previous contract version. The tool must reject empty input and invalid JSON with a parse error.",
                "type": "string"
              },
              "show_path_details": {
                "description": "When true, include full normalized JSON paths for every finding. When false, keep messages concise while preserving path references in structured results.",
                "type": "boolean"
              },
              "strict_mode": {
                "description": "When true, treat type changes, removed required fields, removed paths, enum narrowing, and object-to-non-object changes as breaking. When false, still report them but additive changes may be separated more prominently.",
                "type": "boolean"
              }
            },
            "required": ["ignore_additive_changes", "new_contract_json", "old_contract_json", "show_path_details", "strict_mode"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "breaking_changes": {
                "items": {},
                "type": "array"
              },
              "compatibility_status": {
                "type": "string"
              },
              "compatibility_summary": {
                "additionalProperties": true,
                "type": "object"
              },
              "enum_violations": {
                "items": {},
                "type": "array"
              },
              "missing_paths": {
                "items": {},
                "type": "array"
              },
              "non_breaking_changes": {
                "items": {},
                "type": "array"
              },
              "type_mismatch_paths": {
                "items": {},
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d52c4956de378bc90ee4730da8216ea4dc2ba81410abf1e472a8e72a55bdb60"
