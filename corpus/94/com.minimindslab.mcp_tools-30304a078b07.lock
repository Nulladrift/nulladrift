              "strict_mode": {
                "description": "Boolean toggle. When true, treat any added required constraint, narrowed type, removed enum option, reduced allowed array/object shape, or newly forbidden property as breaking.",
                "type": "boolean"
              }
            },
            "required": ["new_json_schema", "old_json_schema", "show_path_details", "strict_mode"],
