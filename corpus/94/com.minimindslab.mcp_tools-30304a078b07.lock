        {
          "name": "api-pagination-and-cursor-consistency-checker",
          "title": "API Pagination and Cursor Consistency Checker",
          "description": "Backend and frontend teams need to confirm that paginated API response samples keep page, offset, and cursor behavior consistent across endpoints and edge cases.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page_size": {
                "description": "Optional. If provided, must be a positive integer. Used to verify per-page item counts and boundary transitions.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "pagination_mode": {
                "description": "Select the intended pagination contract. 'mixed' means samples may contain more than one pagination style and the checker will verify consistency within each style.",
                "enum": ["cursor", "page", "offset", "mixed"],
                "type": "string"
              },
              "response_samples": {
                "description": "Must contain one or more API response samples in JSON text form. Each sample must parse as an object or array. Empty input is invalid.",
                "type": "string"
              },
              "show_item_paths": {
                "description": "When true, output item path references for duplicates, gaps, and boundary findings when they can be inferred from the samples.",
                "type": "boolean"
              },
              "sort_key": {
                "description": "Optional. If provided, must be a non-empty field path such as 'created_at' or 'data.items[].id'. Used as the expected stable ordering key across samples.",
                "type": "string"
              }
            },
            "required": ["pagination_mode", "response_samples"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "consistency_summary": {
                "type": "string"
              },
              "duplicate_item_flags": {
                "items": {},
                "type": "array"
              },
              "missing_cursor_flags": {
                "items": {},
                "type": "array"
              },
              "page_boundary_report": {
                "additionalProperties": true,
                "type": "object"
              },
              "pagination_status": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c80b7fb856f928fdb2f22f5e2fde68eab97d88388162c44c63b3e919097b04ad"
