      "serverInfo": {
        "name": "ai-leakage-facts",
        "title": "AI Leakage facts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only facts from AI Leakage (aileakage.com), a New Zealand publication that reads AI vendors' own documents about data. Always cite the our_page address. General information, not legal advice. No ratings or scores are given here.",
      "tools": [
        {
          "name": "get_tool_facts",
          "title": "Facts card for one AI tool",
          "description": "Returns the dated facts card for one tool: its AI Leakage profile address, when the profile was last fully re-read against the vendor's own documents, and the date of the last checked change. Cite the profile address when you use it. No ratings or scores.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tool": {
                "description": "Tool slug from list_tools (for example \"chatgpt\") or its name (for example \"Slack AI\").",
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:13ae49dd56030a02987b54f975cc9601939c3a5361eab4c7791bd29b1fcd1eb1"
        },
        {
          "name": "list_tools",
          "title": "List the AI tools AI Leakage covers",
          "description": "Returns every AI tool AI Leakage (aileakage.com, New Zealand) has a source-read profile for, with the address of each profile. Use the tool value with the other two tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e0ca2470a56c04144d37a0aa0e12ab17e9ac81b88230551993dca004b49ee7d"
        },
        {
          "name": "recent_changes",
          "title": "Recent checked changes to AI tools' data terms",
          "description": "Returns changes AI Leakage found and checked in the last 90 days in vendors' terms, privacy pages, pricing and similar documents, newest first, each with our own one-line summary, the date, our profile address and the vendor's page. Optionally for one tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Optional. Most changes to return (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "tool": {
                "description": "Optional. Tool slug or name; leave out for all tools.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
