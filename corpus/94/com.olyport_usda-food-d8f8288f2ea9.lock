        {
          "name": "get_agricultural_data",
          "description": "Get USDA NASS QuickStats data on agricultural production by state.\n\n    Returns crop values, production quantities, and farm statistics from the\n    USDA National Agricultural Statistics Service. Useful for understanding\n    local food production capacity in grant narratives.\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'WA', 'IA').\n        commodity: Agricultural commodity to query (e.g. 'CORN', 'SOYBEANS', 'WHEAT',\n                   'CATTLE', 'MILK'). Omit to get a broad survey of crops.\n        year: Year for data (e.g. 2022). Omit to get the most recent available data.\n    ",
          "inputSchema": {
            "properties": {
              "commodity": {
                "default": null,
                "title": "Commodity",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_agricultural_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_agricultural_dataOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24203f31d02ff6cdb9652c459420bd6bd03da1057f3696aaff0fef2bb852f7dd"
        },
        {
          "name": "get_food_environment",
          "description": "Get county-level food access risk profiles using Census ACS data.\n\n    Constructs food access risk profiles by combining vehicle access (B25044),\n    poverty status (B17001), and SNAP participation (B22001). Limited vehicle\n    access combined with high poverty indicates food desert risk. Useful for\n    identifying areas with barriers to food access in grant applications.\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'WA', 'MS') or 2-digit FIPS code.\n        county_fips: Three-digit county FIPS code (e.g. '033' for King County, WA).\n                     Omit to get all counties in the state.\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_food_environmentArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_food_environmentOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c90a65736527f68e38c4ffe0d298965db5cdd2c1d8885db68b55f812f918bd7c"
        },
        {
          "name": "get_food_insecurity_indicators",
          "description": "Get food-related economic indicators as proxies for food insecurity by county.\n\n    Combines SNAP participation rate (B22001), poverty rate (B17001), and\n    median household income (B19013) to build a food insecurity risk profile.\n    Higher SNAP rates, higher poverty, and lower income correlate with greater\n    food insecurity. Useful for grant narratives demonstrating community need.\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'WA', 'MS') or 2-digit FIPS code.\n        county_fips: Three-digit county FIPS code (e.g. '033' for King County, WA).\n                     Omit to get all counties in the state.\n        year: ACS 5-year estimate year (default 2022). Data covers year-4 through year.\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2022,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_food_insecurity_indicatorsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_food_insecurity_indicatorsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:081d16dfbe0386eccaaf12e91f09d3804ea313e5d521201edf6b83bf1c9bc74f"
        },
        {
          "name": "get_snap_participation",
          "description": "Get SNAP/food stamp household participation by county using Census ACS Table B22001.\n\n    Returns the number and percentage of households receiving vs not receiving\n    SNAP/food stamp benefits, broken down by county. Essential for understanding\n    food assistance utilization in grant target areas.\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'WA', 'MS') or 2-digit FIPS code.\n        county_fips: Three-digit county FIPS code (e.g. '033' for King County, WA).\n                     Omit to get all counties in the state.\n        year: ACS 5-year estimate year (default 2022). Data covers year-4 through year.\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2022,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_snap_participationArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_snap_participationOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1c4eff98b2593f5519b7059e876ece0e4516037e544bbb436270913cf8347416"
        }
      ],
