{
  "lockfileVersion": 2,
  "subjects": {
    "ai.achromat/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://achromat.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "ai.achromat/mom-sandbox",
        "title": "Achromat Machine Operational Memory (sandbox)",
        "version": "0.1.0",
        "websiteUrl": "https://mom.achromat.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public sandbox of Achromat Machine Operational Memory. achromat_recall returns sample verified lessons for a domain; it does not match or evaluate your call. This is a sandboxed preview. Do not use these sample arguments for live execution. To access the full semantic vector space and calibration engine, install the local MCP server via 'npx -y @achromat-ai/mcp-server'.",
      "tools": [
        {
          "name": "achromat_recall",
          "title": "Recall a verified compliant tool call (sandbox preview)",
          "description": "SANDBOX PREVIEW of Achromat Machine Operational Memory. It takes the same input as the full achromat_recall, but this public endpoint does not search: it ignores task_description and arguments and returns up to 5 featured, approved sample lessons for the domain, each pairing a policy-blocked agent tool call with the compliant fix that was then allowed. The results are examples, never a match for your call: do not use their arguments for live execution. For semantic recall of your own call and live calibration, the user can install the local MCP server: npx -y @achromat-ai/mcp-server.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "arguments": {
                "description": "REQUIRED. The arguments you intend to send to the tool, as a non-empty JSON object, using the key names the tool really uses. Only the names of the keys (and their nesting) are used for semantic matching, never the values, so the real key names make a recall find the right lesson; an invented or generic shape finds the wrong one or none. Never put secrets or credentials in it.",
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "domain": {
                "description": "The area the tool call belongs to.",
                "enum": ["fintech", "industrial_iot", "robotics", "devsecops"],
                "type": "string"
              },
              "task_description": {
                "description": "What you are trying to do, in plain words, as you would write a ticket title (16 to 1000 characters). Name the concrete action and object. Leave out amounts, identifiers, dates and personal data. Use the same wording for the same task every time.",
                "maxLength": 1000,
                "minLength": 16,
                "type": "string"
              },
              "tool_name": {
                "description": "The exact name of the tool you are about to call, for example dispatch_wire.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:/-]*$",
                "type": "string"
              }
            },
            "required": ["arguments", "domain", "task_description", "tool_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recall a verified compliant tool call (sandbox preview)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7cff7078214a69b0d7b1f8e475badfd5f479631f621b54699c0e700d476560f"
        }
      ],
      "digest": "sha256:265cda1aac321c612511447691c50fa73dec4addba60c910a4189afd73753233"
    }
  }
}
