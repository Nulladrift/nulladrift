{
  "lockfileVersion": 2,
  "subjects": {
    "ai.meetlark/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://meetlark.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "meetlark",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "meetlark_close_poll",
          "description": "Close a poll to stop accepting new votes. Use the admin token from poll creation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adminToken": {
                "description": "The adm_xxx token from poll creation",
                "type": "string"
              }
            },
            "required": ["adminToken"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Poll closed!",
            "openai/toolInvocation/invoking": "Closing poll..."
          },
          "digest": "sha256:841e7eb341540991514e0e231c2fd9121dd597df16268f9a6784e5e48c641fb3"
        },
        {
          "name": "meetlark_create_poll",
          "description": "Create a scheduling poll to find a time that works for a group. Returns an admin URL (keep private) and a participation URL (share with participants). The creator's email must be verified -- if not yet verified, a verification email is sent automatically. Ask the user to check their inbox and click the link, then retry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "creatorEmail": {
                "description": "Email address of the poll creator",
                "type": "string"
              },
              "creatorName": {
                "description": "Name of the poll creator",
                "type": "string"
              },
              "description": {
                "description": "Additional context for participants",
                "type": "string"
              },
              "timeSlots": {
                "description": "Available time slots to vote on",
                "items": {
                  "properties": {
                    "date": {
                      "description": "Date in YYYY-MM-DD format",
                      "type": "string"
                    },
                    "endTime": {
                      "description": "End time in HH:MM format",
                      "type": "string"
                    },
                    "startTime": {
                      "description": "Start time in HH:MM format",
                      "type": "string"
                    }
                  },
                  "required": ["date", "endTime", "startTime"],
                  "type": "object"
                },
                "type": "array"
              },
              "title": {
                "description": "What is this poll for?",
                "type": "string"
              }
            },
            "required": ["creatorEmail", "timeSlots", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Poll created!",
            "openai/toolInvocation/invoking": "Creating scheduling poll..."
          },
          "digest": "sha256:5839c9d2a7771684f5898094e78dd89a679d40ee224f5a9a675cda6ddd27bc9b"
        },
        {
          "name": "meetlark_get_admin_view",
          "description": "Get full poll details including all votes and participants. This is the only way to see who voted and how they voted. Returns poll info, time slots, every participant's votes (yes/maybe/no per slot), participant emails, and admin URLs. Use the admin token from poll creation. Use this to check vote status or results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adminToken": {
                "description": "The adm_xxx token from poll creation",
                "type": "string"
              }
            },
            "required": ["adminToken"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Admin details loaded!",
            "openai/toolInvocation/invoking": "Loading admin view..."
          },
          "digest": "sha256:48ea7617265bd4b1cf76c4e1310224c5ceaa452dd63d074fdd6d1913de9f05e7"
        },
        {
          "name": "meetlark_get_results",
          "description": "Get poll details and available time slots using a participation token. Returns the poll title, description, status, and time slots -- but NOT votes or participant data. This is the view a participant sees before voting. To see who voted and how, use meetlark_get_admin_view instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "participateToken": {
                "description": "The prt_xxx token from the participation URL",
                "type": "string"
              }
            },
            "required": ["participateToken"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Poll details loaded!",
            "openai/toolInvocation/invoking": "Loading poll details..."
          },
          "digest": "sha256:ad9430e5decb3ed33146a901d3f2a89d86064e225527e7caec3c32c102cb413b"
        },
        {
          "name": "meetlark_reopen_poll",
          "description": "Reopen a previously closed poll to accept votes again. Use the admin token from poll creation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adminToken": {
                "description": "The adm_xxx token from poll creation",
                "type": "string"
              }
            },
            "required": ["adminToken"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Poll reopened!",
            "openai/toolInvocation/invoking": "Reopening poll..."
          },
          "digest": "sha256:7f9d671bbcfd9ba61648f721ff2591e93b5564e1a029fd515b7469bee14fc268"
        },
        {
          "name": "meetlark_vote",
          "description": "Cast a vote on a scheduling poll. Each time slot can be voted yes, maybe, or no. Requires participant name and email. Use the participation token from the poll's participate URL. If the email matches a previous voter on this poll, their response is updated instead of creating a duplicate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Participant's email address (required). Used to identify returning voters and send confirmation email.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "name": {
                "description": "Name to display in results",
                "type": "string"
              },
              "participateToken": {
                "description": "The prt_xxx token from the participation URL",
                "type": "string"
              },
              "votes": {
                "description": "Votes for each time slot",
                "items": {
                  "properties": {
                    "timeSlotId": {
                      "description": "Time slot ID",
                      "type": "string"
                    },
                    "value": {
                      "description": "Vote value",
                      "enum": ["yes", "maybe", "no"],
                      "type": "string"
                    }
                  },
                  "required": ["timeSlotId", "value"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["email", "name", "participateToken", "votes"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Vote recorded!",
            "openai/toolInvocation/invoking": "Submitting vote..."
          },
          "digest": "sha256:456ca9485b39cb0c943956d2f3041007779c3235f90394e39125345fcb76db9c"
        }
      ],
      "digest": "sha256:f7e686bdec405717b9bb45e8dfc0e8dec0d84e7d47f95dbaab34a8c09e1f9ac5"
    }
  }
}
