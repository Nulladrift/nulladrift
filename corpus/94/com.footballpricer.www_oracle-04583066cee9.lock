  "subjects": {
    "com.footballpricer.www/oracle": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.footballpricer.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "footballpricer-oracle",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Calibrated Football Probability Oracle. Call get_track_record (free) to verify historical Brier & CLV calibration, list_upcoming_edges to scan matches, get_match_pricing for full fair odds/Kelly JSON, and reprice_live_odds (mode=quote_only for Polymarket/Kalshi shares) for <10ms live EV evaluation.",
      "tools": [
        {
          "name": "get_match_pricing",
          "title": "Get Calibrated Match Pricing",
          "description": "Get compact calibrated probabilities (1X2, Asian Handicap, Goals O/U, BTTS), fair odds, EV%, Fractional Kelly sizing, and stability flags. Costs 5 credits ($0.05) on pre-warmed cache hit, or 50 credits ($0.50) if allowFreshRun=true triggers a cold pipeline run (auto-refunded on failure).",
          "inputSchema": {
            "properties": {
              "allowFreshRun": {
                "default": false,
                "description": "Allow starting an asynchronous cold pricing job (50 credits) on cache miss.",
                "type": "boolean"
              },
              "awayTeam": {
                "description": "Away team name (used if slateId is omitted).",
                "type": "string"
              },
              "homeTeam": {
                "description": "Home team name (used if slateId is omitted).",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Optional idempotency key to prevent duplicate credit charges on retries.",
                "maxLength": 128,
                "type": "string"
              },
              "includeTacticalBrief": {
                "default": false,
                "description": "Include concise tactical analysis and counter-thesis notes.",
                "type": "boolean"
              },
              "league": {
                "description": "Competition name (e.g. 'Premier League', 'UEFA Champions League').",
                "type": "string"
              },
              "matchDate": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "slateId": {
                "description": "Pre-computed slate run ID from list_upcoming_edges.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Get Calibrated Match Pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b5cedca67a8fab5a47d2e836e4d41ab0ea9756fd1b5487eed8aa28607d9e733"
        },
        {
          "name": "get_pricing_job",
          "title": "Poll Cold Pricing Job",
          "description": "Poll an asynchronous cold pricing job started by get_match_pricing. Free (0 credits).",
          "inputSchema": {
            "properties": {
              "includeTacticalBrief": {
                "default": false,
                "description": "Include tactical analysis notes once the job completes.",
                "type": "boolean"
              },
              "jobId": {
                "description": "Job ID returned by get_match_pricing when allowFreshRun=true.",
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Poll Cold Pricing Job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6b8080fc671b37062dc717aa3f55f23eb4e8e8f74fec6b375c41e5b8455295f"
        },
        {
          "name": "get_track_record",
          "title": "Get Historical Track Record",
          "description": "Retrieve FootballPricer historical verified calibration track record (ROI%, CLV%, and Brier Score vs sharp closing market). Public and free (0 credits). Call this first to audit oracle calibration.",
          "inputSchema": {
            "properties": {
              "includeRecentPicks": {
                "default": 10,
                "description": "Number of most recent settled picks to return (0..50).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "league": {
                "description": "Optional league name filter, e.g. 'Premier League'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Historical Track Record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:433b7e11e06596fe1b95c51a3ec485a80970bfae97e076dda5081102afac6a95"
        },
        {
          "name": "list_upcoming_edges",
          "title": "List Upcoming Match Edges",
          "description": "List pre-computed upcoming football matches in EPL, Serie A, La Liga, Bundesliga, Ligue 1, and UCL. Use detail=\"discovery\" (0 credits) to browse fixtures & stability, or detail=\"full\" (1 credit / $0.01) to include top +EV picks and offered odds.",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": "discovery",
                "description": "Use discovery (0 credits) or full (1 credit) to include +EV picks and offered odds.",
                "enum": ["discovery", "full"],
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Optional idempotency key to prevent duplicate credit charges on retries.",
                "maxLength": 128,
                "type": "string"
              },
              "league": {
                "description": "Optional league filter, e.g. 'Premier League' or 'UEFA Champions League'.",
                "type": "string"
              },
              "limit": {
                "default": 30,
                "description": "Maximum number of upcoming matches to return (1..100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "minEvPct": {
                "default": 1,
                "description": "Minimum expected value percentage threshold (default 1.0).",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "onlyActionable": {
                "default": true,
                "description": "When true (default), exclude watchlist and stake-gated matches.",
                "type": "boolean"
              },
              "pass": {
                "description": "1 = Early H-24h, 2 = Confirmed XI H-75m",
                "enum": [1, 2],
                "type": "integer"
              },
              "stabilityFilter": {
                "default": "all",
                "description": "Filter matches by model stability tier.",
                "enum": ["all", "high_only", "high_or_moderate"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Upcoming Match Edges"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d79ad2d384f50750bfff93495fa839a5aea5c1f9dbc5c9df42c15e8861367d27"
        },
        {
          "name": "reprice_live_odds",
          "title": "Reprice Live Market Odds",
          "description": "Deterministic <10ms Dixon-Coles re-pricer (1 credit / $0.01). Default mode=\"quote_only\" evaluates live Polymarket/Kalshi probability shares (0.01..0.99) or decimal odds against fixed model probabilities with slippage & commission without distorting the sharp prior. Use mode=\"reanchor_market\" for sharp closing odds or late injury shocks.",
          "inputSchema": {
            "properties": {
              "awayTeam": {
                "description": "Away team name if resolving without slateId.",
                "type": "string"
              },
              "homeTeam": {
                "description": "Home team name if resolving without slateId.",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Optional idempotency key to prevent duplicate credit charges on retries.",
                "maxLength": 128,
                "type": "string"
              },
              "league": {
                "description": "Competition name if resolving without slateId.",
                "type": "string"
              },
              "matchDate": {
                "description": "Match date (YYYY-MM-DD) if resolving without slateId.",
                "type": "string"
              },
              "mode": {
                "default": "quote_only",
                "description": "quote_only evaluates market quotes cleanly; reanchor_market re-anchors sharp odds and team shocks.",
                "enum": ["quote_only", "reanchor_market"],
                "type": "string"
              },
              "quotes": {
                "description": "Array of 1 to 12 live market quotes to evaluate.",
                "items": {
                  "properties": {
                    "commissionPct": {
                      "default": 0,
                      "description": "Exchange/market fee percentage on net profit (0..15).",
                      "maximum": 15,
                      "minimum": 0,
                      "type": "number"
                    },
                    "format": {
                      "description": "Quote format: decimal odds (>1.01) or probability_share (0.01..0.99).",
                      "enum": ["decimal", "probability_share"],
                      "type": "string"
                    },
                    "marketKey": {
                      "description": "e.g. '1x2_home', 'goals_over_2.5', 'btts_yes', 'ah_home_-0.5'",
                      "type": "string"
                    },
                    "price": {
                      "description": "Decimal (>1.01) or share price (0.01..0.99)",
                      "type": "number"
                    },
                    "slippageBps": {
                      "default": 0,
                      "description": "Estimated execution slippage in basis points (0..1000).",
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["format", "marketKey", "price"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "reanchorSharpOdds": {
                "description": "Optional sharp closing bookmaker decimal odds when mode=reanchor_market.",
                "properties": {
                  "ahAway": {
                    "description": "Sharp decimal away Asian Handicap odds.",
                    "type": "number"
                  },
                  "ahHome": {
                    "description": "Sharp decimal home Asian Handicap odds.",
                    "type": "number"
                  },
                  "ahLine": {
                    "description": "Asian Handicap line (home perspective).",
                    "type": "number"
                  },
                  "oddsAway": {
                    "description": "Sharp decimal away win odds.",
                    "type": "number"
                  },
                  "oddsDraw": {
                    "description": "Sharp decimal draw odds.",
                    "type": "number"
                  },
                  "oddsHome": {
                    "description": "Sharp decimal home win odds.",
                    "type": "number"
                  },
                  "oddsOver": {
                    "description": "Sharp decimal Over 2.5 goals odds.",
                    "type": "number"
                  },
                  "oddsUnder": {
                    "description": "Sharp decimal Under 2.5 goals odds.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "shocks": {
                "description": "Optional expected-goal lambda adjustments (%) for late team news when mode=reanchor_market.",
                "properties": {
                  "awayAtkDeltaPct": {
                    "description": "Away attack strength delta percentage.",
                    "type": "number"
                  },
                  "awayDefDeltaPct": {
                    "description": "Away defense concession delta percentage.",
                    "type": "number"
                  },
                  "homeAtkDeltaPct": {
                    "description": "Home attack strength delta percentage.",
                    "type": "number"
                  },
                  "homeDefDeltaPct": {
                    "description": "Home defense concession delta percentage.",
                    "type": "number"
                  },
                  "tempoDeltaPct": {
                    "description": "Match tempo / total goals delta percentage.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "slateId": {
                "description": "Pre-computed slate run ID to reprice.",
                "type": "string"
              }
            },
            "required": ["quotes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Reprice Live Market Odds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d5a2221b8373be6844ecc58969e45d9d3d5f67ac019f6839ba1b0703e4b6b96"
        }
      ],
      "digest": "sha256:f0138c855384e124950223806ecd0a27de55356928914a2a9f24a7e949f8fa60"
    }
  }
}
