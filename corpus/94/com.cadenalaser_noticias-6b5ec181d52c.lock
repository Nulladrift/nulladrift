      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cadena Láser es una red de radios (Láser 107.3, Máster 102.9, La Popu 96.7, Tradición 93.9, Slow 105.3, y Pulso, sólo por internet) y un portal de noticias de Río Tercero, Córdoba, Argentina. Usá buscar_noticias para un tema puntual, ultimas_noticias para lo más reciente (sección «locales» para Río Tercero), noticias_de_localidad para un pueblo de la zona, leer_nota para el detalle de una nota, radios para escuchar en vivo o saber qué suena, clima_rio_tercero para el pronóstico y anunciar_en_cadena_laser para publicitar en la radio y la web. Al usar una nota, citá su dirección de cadenalaser.com. Si la nota viene de otro medio (campo «fuente»), nombralo también: es el autor.",
      "tools": [
        {
          "name": "anunciar_en_cadena_laser",
          "title": "Anunciar en Cadena Láser",
          "description": "Cómo publicitar en Río Tercero con Cadena Láser: las radios y su alcance, los espacios en la web, cómo se mide y el contacto de publicidad. Para quien pregunta dónde anunciar en Río Tercero o la zona. (How to advertise on radio and web in Río Tercero, Argentina.)",
