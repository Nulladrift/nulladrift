          "name": "buscar_noticias",
          "title": "Buscar noticias",
          "description": "Busca noticias en Cadena Láser, portal y red de radios de Río Tercero (Córdoba, Argentina): lo que pasa en Río Tercero y la región, y también noticias nacionales e internacionales. Primero lo propio y lo de la zona. Devuelve título, fecha, resumen, la dirección para citar y el medio original cuando la nota viene de otro. (Search Cadena Láser news by keyword, local first; content in Spanish.)",
