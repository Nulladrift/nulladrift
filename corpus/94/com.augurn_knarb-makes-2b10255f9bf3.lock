        "name": "knarb-makes",
        "title": "Knarb Makes 3D Printable Kits",
        "version": "1.0.0",
        "websiteUrl": "https://augurn.com/agents"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Search and compare Knarb Makes digital miniature kits for a buyer. Report prices in USD and relevant print and personal-use license limitations. Return purchase links for buyer review. No payment, account access or private downloads are available through this server.",
      "tools": [
        {
          "name": "get_kit",
          "title": "Inspect a kit",
          "description": "Get the exact contents, scale, formats, price, original print photo, known limitations and personal-use license for a released kit. Use an id from search_kits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "productId": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6f4fc82bdb5d2f25efe7cc7e032d47bec5469adc56be122d80792d966805142b"
        },
        {
          "name": "get_purchase_link",
          "title": "Get a kit purchase link",
          "description": "Return a tracked product-page link for the buyer to review and buy, or download a free kit. Does not create an order, charge money, accept terms or provide paid files. Price is before applicable tax.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "productId": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e932fcbf3ecfb4b416ee9aff46e2d0ddd70ced0636e33b0aacb0665bdb424191"
        },
        {
          "name": "search_kits",
          "title": "Search 3D printable kits",
          "description": "Search released miniature, architecture and terrain kits. Words are matched together. Filter for free files or a maximum USD price before tax. Returns current public details and tracked product links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "freeOnly": {
                "default": false,
                "type": "boolean"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "maxPriceUsd": {
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "default": "",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e4f4e285d3fa757b84c12e160cf9fbc1e2940e26c2c9a942288a58e6c5293982"
        }
      ],
