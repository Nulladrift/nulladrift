      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "The Durability Curve is a publication by Harry Floyd about which kinds of work keep their value as AI gets cheaper. This server gives read-only access to its public archive: essays, the claim ledger behind each checked essay, the dated calls printed in The Durability Curve Weekly, the framework every essay is tested against (five laws and two derived principles, each with the question it hands you and what would prove it wrong), the publication's free tools (each with the problem it answers), and its record of AI model releases: when each model came out, its API list price, and whether the lab's free plan includes it.\n\nStart with search. Read a result in full with get_essay, get_claim_ledger or get_weekly_calls. When you quote or summarise, link the page it came from. An essay has two correct addresses: canonical is where it was first published (for some essays that is the Substack post) and url is its page on durabilitycurve.com. Never call the durabilitycurve.com address the canonical one unless the two are the same. For a claim, call, law, tool or model, link its url. The markdown copy is there to be read; a page is what to link.\n\nA long essay can be read in parts: get_essay with part \"outline\" lists its sections with their opening lines, and part \"section\" returns one of them. Use part \"meta\" for an essay's dates, length, access and content hash without its text. An essay marked access \"part paid\" has only its free part public; say so when it matters.\n\nTo list or count (the newest essays, every essay in a series, the essays with a claim ledger, the paid or free essays, the laws, the tools), call search with an empty query and the filters: one call returns the list, and \"total\" gives the count. A law result carries its full public reading, including what would break it and every dated change, so it needs no second call. To filter calls by date, ID, issue or confidence, use get_weekly_calls.\n\nFor a question about an AI model (when it came out, what its API costs, whether the free plan has it, which models a lab released and when), use get_ai_models. Every fact there carries its source and the date it was read: give that date, because prices and plans change, and say when the record has no answer rather than filling one in.\n\nWhen the user shares a passage, a headline or a topic and asks what The Durability Curve has said about it, or whether it has covered it already, call related_to with the text itself. possible_repeat is a word-overlap signal, not a judgement: read the essay it points to before saying the topic was covered.\n\nIf search returns best_match_outside_filter, a filter removed the essay the words point to: tell the user (for example, that essay has no claim ledger) rather than answering with another essay. If search reports none_found, say that nothing in the archive matches, and offer the closest results only as possibly unrelated. If the user names an essay by a title and no essay's title matches it (search reports title_matched: false), say no essay by that title was found and offer the closest results as alternatives. Never present a different essay as the one they named. This server holds The Durability Curve's public essays, their claim ledgers, the weekly calls, the five laws and two derived principles, the free tools, and its record of AI model releases, API prices and free-plan access. It has no subscriber numbers, revenue, stock prices, private notes or anything not published on durabilitycurve.com.\n\nWhen asked whether a claim is true, answer from its ledger row first: its status and what that status means, the source it was checked against, where in the source, and the date it was read. Any view of your own comes after that and is labelled as yours.\n\nThese tools retrieve The Durability Curve's public material. They do not certify that any claim is true. A claim ledger records what a source said and how it was checked; a call records a prediction and the confidence printed with it.",
      "tools": [
        {
          "name": "get_ai_models",
          "title": "Get AI model facts",
          "description": "Get The Durability Curve's record of AI model releases from ten labs (OpenAI, Anthropic, Google, DeepSeek, Meta, xAI, Mistral, Alibaba, Moonshot, Zhipu): when each model came out, with the lab's own announcement as source; for models with a page, the API list prices read at the lab's pricing page on a stated day; for the frontier launches the Access Gap tracks, when ordinary people could first use it, in the app, on the cheapest paid plan and on the free plan, each with its source; and each lab's flagship price and free-plan answer. Search by model or lab name, or filter by lab, release date, frontier status or free-plan access. The record runs to data_through; a newer release is not in it yet. These tools retrieve The Durability Curve's public material. They do not certify that any claim is true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "frontier_only": {
                "default": false,
                "description": "true: only the frontier releases the /chart/ page plots (models anyone could use on the date given).",
                "type": "boolean"
              },
              "lab": {
                "description": "Only this lab, by name or short name: OpenAI, Anthropic, Google, DeepSeek, Meta, xAI, Mistral, Alibaba, Moonshot or Zhipu.",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many models to return, 1 to 50. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "on_free_plan": {
                "description": "true: only models whose lab's free consumer plan includes them; false: only models the free plan is recorded as not including. A model whose free-plan access is unknown, unnamed or restricted is on neither list. Applies to the frontier launches the Access Gap tracks.",
                "type": "boolean"
              },
              "query": {
                "description": "A model or lab name in plain words, e.g. \"Claude Opus 5.5\", \"GPT-6.1\", \"Gemini Flash\" or \"DeepSeek\". Leave empty to list newest first.",
                "maxLength": 120,
                "type": "string"
              },
              "released_after": {
                "description": "YYYY-MM-DD. Only models released after this day.",
                "maxLength": 20,
                "type": "string"
              },
              "released_before": {
                "description": "YYYY-MM-DD. Only models released before this day.",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get AI model facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2512b2b231837c802b1d497fee4a719adeabbf08c6a39841acc2e5b35858a6eb"
        },
        {
          "name": "get_claim_ledger",
          "title": "Get a claim ledger",
          "description": "Get the claim ledger for one essay: each load-bearing claim it makes, the source it was checked against, the quoted words, where in the source they appear, the date the source was read, and a status saying how the claim was checked. The response defines every status. Filter by claim ids or status, or ask for compact rows. Claims removed during checking are listed separately under \"struck\", with the reason; they are not claims the essay makes. Only some essays have a ledger: search results and get_essay link to one when it exists. These tools retrieve The Durability Curve's public material. They do not certify that any claim is true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compact": {
                "default": false,
                "description": "true: each claim as id, status, claim, source, source_url, locator and date_read only (no quoted words or essay sentence).",
                "type": "boolean"
              },
              "ids": {
                "description": "Only these claim IDs, e.g. [\"SL1\", \"SL6\"].",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "slug": {
                "description": "The essay's site or Substack slug (case-insensitive), or its full durabilitycurve.com/blog/ or harryfloyd.substack.com/p/ URL.",
                "maxLength": 200,
                "type": "string"
              },
              "status": {
                "description": "Only claims with this status, by its key or label (e.g. \"VERIFIED\" or \"Verified\"); the response lists every status.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a claim ledger"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88b9c61aee03ddfd62272bad6fbbdf61145faf2749044d52d2235fb2fb135c97"
        },
        {
          "name": "get_essay",
          "title": "Get an essay",
          "description": "Get one Durability Curve essay: by default its full public text as markdown, with its title, dates, canonical field, access, length, sections, tools and a link to its claim ledger when it has one. A long essay can be read in parts: part \"outline\" lists the sections with their opening lines, part \"section\" returns one, and part \"meta\" returns everything but the text. For a part-paid essay only the free part is public, and the text says where it stops. The canonical field is the address to cite. These tools retrieve The Durability Curve's public material. They do not certify that any claim is true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "part": {
                "default": "full",
                "description": "full (default): the whole public text. meta: dates, length, access, sections, tools and a content hash, without the text. outline: each section's heading, length and opening lines. section: one section's text (name it with section).",
                "enum": ["full", "meta", "outline", "section"],
                "type": "string"
              },
              "section": {
                "description": "With part \"section\": the section's number from the outline (0 is the opening, before the first heading) or words from its heading.",
                "maxLength": 200,
                "type": "string"
              },
              "slug": {
                "description": "The essay's site or Substack slug (case-insensitive), or its full durabilitycurve.com/blog/ or harryfloyd.substack.com/p/ URL.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an essay"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:769a3a2b039966ede7b48dc77f5ffeccc97272a4bdc3a8f51dcc8a9a12d0bfc6"
        },
        {
          "name": "get_weekly_calls",
          "title": "Get the weekly calls",
          "description": "Get the calls printed in The Durability Curve Weekly: dated, checkable predictions, each with the confidence printed at the time and the date or event it resolves on. Filter by status, ID, issue, resolution date or printed confidence. The wording is exactly as printed and never changes after publication. outcome is null until a call resolves. counts describe the calls returned; record describes every call. These tools retrieve The Durability Curve's public material. They do not certify that any claim is true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confidence_at_least": {
                "description": "Only calls printed at this confidence or higher, in percent, e.g. 60.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "confidence_at_most": {
                "description": "Only calls printed at this confidence or lower, in percent, e.g. 30.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "id": {
                "description": "One call by its ID, e.g. \"W02-5\".",
                "maxLength": 12,
                "type": "string"
              },
              "issue": {
                "description": "Only the calls printed in this issue of the Weekly.",
                "maximum": 999,
                "minimum": 1,
                "type": "integer"
              },
              "resolves_after": {
                "description": "YYYY-MM-DD. Only calls whose latest resolution date is after this day, earliest first.",
                "maxLength": 20,
                "type": "string"
              },
              "resolves_before": {
                "description": "YYYY-MM-DD. Only calls whose latest resolution date is before this day, earliest first. A call that resolves on an event \"or\" a date counts by that date.",
                "maxLength": 20,
                "type": "string"
              },
              "status": {
                "default": "all",
                "description": "open, resolved or all (default).",
                "enum": ["open", "resolved", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the weekly calls"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9c1d7c1b5af25447fa831f47d10a79340f45e9e1dd42ae0d3a33e9aac49090f"
        },
        {
          "name": "related_to",
          "title": "Find what the archive says about a passage",
          "description": "Compare a passage of text (an article, a headline, a draft, a question) with the whole archive and return what The Durability Curve has already published on it, grouped: essays, ledger claims, weekly calls, laws, free tools and AI models. Each result carries its URL and a share: how much of the passage's distinctive vocabulary it uses. possible_repeat is true when an essay (with its best ledger rows) shares at least 45% of that vocabulary: on the live archive it flagged 13 of 21 paragraphs taken from essays and none of 4 unrelated passages. It is a word-overlap signal, not a judgement: whether a topic is covered is in the essay itself. These tools retrieve The Durability Curve's public material. They do not certify that any claim is true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "per_kind": {
                "description": "How many results of each kind, 1 to 10. Defaults: 5 essays, 5 claims, 3 calls, 2 laws, 2 tools, 3 models.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "text": {
                "description": "The passage, headline, question or topic to compare with the archive, as text. Paste the words themselves: this tool does not open links.",
                "maxLength": 8000,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find what the archive says about a passage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d5befebf2b1b957f4afb28412c17fdd08c8d682e3296a3defafc4eea9bcdb37"
        },
        {
          "name": "search",
          "title": "Search The Durability Curve",
          "description": "Search or list the public archive of The Durability Curve: essays on which kinds of work keep their value as AI gets cheaper, the checked claims in each essay's claim ledger, the dated calls printed in The Durability Curve Weekly, the five laws and two derived principles the essays are tested against, the free tools, and AI model releases. With a query, returns ranked matches, each with its kind (essay, claim, call, law, tool or model), a snippet and a URL (canonical for essay citations); \"title_matched\" says whether any essay title contains every word of the query, and \"none_found\" is true when nothing matches enough of the query (the nearest misses are then under \"closest\", not \"results\"). With an empty query, lists newest first, filtered by kind, series, has_ledger or access, and \"total\" counts every match. Read a match in full with get_essay, get_claim_ledger, get_weekly_calls or get_ai_models. These tools retrieve The Durability Curve's public material. They do not certify that any claim is true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access": {
                "description": "Only essays a reader of durabilitycurve.com gets in full (\"free\") or only in part (\"part paid\": the rest is for paid subscribers).",
                "enum": ["free", "part paid"],
                "type": "string"
              },
              "has_ledger": {
                "description": "true: only essays that have a claim ledger. false: only essays without one.",
                "type": "boolean"
              },
              "kind": {
                "description": "Only this kind of result: essay, claim, call, law (the framework's laws and principles), tool (the free tools) or model (AI model releases). A list (empty query) defaults to essays.",
                "enum": ["essay", "claim", "call", "law", "tool", "model"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many results to return, 1 to 25. Default 5.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "default": "",
                "description": "What to look for, in plain words, e.g. \"agent reliability\", \"memory chip deposits\", a call ID like \"W02-5\" or a model name like \"Claude Opus 5.5\". Leave empty to LIST instead (newest first), with the filters below.",
                "maxLength": 200,
                "type": "string"
              },
              "series": {
                "description": "Only essays (and their claims) in this series, e.g. \"The Blueprint\". Case does not matter.",
                "maxLength": 80,
                "type": "string"
              },
              "sort": {
                "description": "relevance (default for a query) or newest. A list is always newest first.",
                "enum": ["relevance", "newest"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search The Durability Curve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25fa6d31d4ab476be07cf8fc7675282f7080b1eddc53ad8425e0b302e8b451ed"
        }
      ],
      "digest": "sha256:606623af1ef9b9f655ddb075b7345e7adc5c8a6a8b56033fd37a325677d37217"
    }
  }
