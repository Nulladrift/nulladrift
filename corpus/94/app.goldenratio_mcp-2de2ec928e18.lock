{
  "lockfileVersion": 2,
  "subjects": {
    "app.goldenratio/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.goldenratio.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "goldenratio-app",
        "title": "goldenratio.app",
        "version": "0.1.1",
        "websiteUrl": "https://goldenratio.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Golden-ratio design math from goldenratio.app: the Golden Calculator (which spacer combinations balance), the golden spacing scale (rem/px, half and double), the golden grid (w-grp-* widths), the CSS variables, and the tailwindcss-golden-ratio plugin setup. Every value comes from the same code the site runs. Read-only, no auth. Hosted service terms (as-is, no guarantees, acceptable use, data): https://github.com/truefrontier/goldenratio-mcp#hosted-service",
      "tools": [
        {
          "name": "golden_calculator",
          "title": "Golden Calculator",
          "description": "The goldenratio.app Golden Calculator. Stack spacers numbered 1-11 (each is the previous x 1.618) on a left and a right side; returns whether both sides are equal and, if not, every combination of spacers that would make the shorter side match (\"Try\" on the site). The site starts with left = [6, 5, 6], right = [].",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "left": {
                "description": "Spacer numbers stacked on the left, top to bottom, e.g. [6, 5, 6].",
                "items": {
                  "maximum": 11,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 40,
                "type": "array"
              },
              "right": {
                "description": "Spacer numbers stacked on the right.",
                "items": {
                  "maximum": 11,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 40,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d45376d8e97769d586061d4ecb79e616af01fb6237b9b8213b7ec038ff94573"
        },
        {
          "name": "golden_css_variables",
          "title": "Golden CSS variables",
          "description": "The :root block of golden-ratio CSS variables (--golden-ratio-1..11, half-*, double-*, --gr) exactly as goldenratio.app ships it. Use without Tailwind.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "css (default, readable), min (one line, as in the site stylesheet) or json.",
                "enum": ["css", "min", "json"],
                "type": "string"
              },
              "spacer_base": {
                "description": "theme.goldenRatio.spacerBase: the size of spacer 6 (default 1.5, as on goldenratio.app).",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "spacer_unit": {
                "description": "theme.goldenRatio.spacerUnit (default 'rem').",
                "enum": ["rem", "em", "px", "%", "vw", "vh", "ch", "ex", "pt"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8febba93cd80d410b633ed6ba46b9e9ad661c61fec188422fdb1941203cefbb0"
        },
        {
          "name": "golden_grid",
          "title": "Golden grid",
          "description": "The golden grid from goldenratio.app/#/grid: w-grp-1..11, w-grp-half-*, w-grp-double-* percentage widths, the starter .container/.row CSS, every example row from the site with its total width, and an optional check of your own row (does it add up to exactly 100%?).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "container_px": {
                "description": "Also give each width in px for a row this wide.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "include_examples": {
                "description": "Include the site example rows (default true).",
                "type": "boolean"
              },
              "row": {
                "description": "Widths to check as one row, e.g. [\"5\", \"4\"] or [\"half-4\", \"5\", \"half-4\"] (w-grp- prefix optional).",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0a326d344fa60c1588364ef89f9a45558ec3046b0984c29247a0e023ba60e75"
        },
        {
          "name": "golden_ratio_steps",
          "title": "Golden ratio steps",
          "description": "Step any number up or down the golden ratio (x or / 1.61803398875), e.g. to pick a type scale or the next size. What the goldenratio.app Alfred workflow does.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "steps_down": {
                "description": "Steps below the value (default 5).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "steps_up": {
                "description": "Steps above the value (default 5).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "unit": {
                "description": "Unit suffix for the text column, e.g. \"px\".",
                "maxLength": 10,
                "type": "string"
              },
              "value": {
                "description": "Starting value, e.g. 16.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "type": "number"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fddf4581825b6e51b2f269b3557c6a7858a03750ce07dbd57af237b5b163353e"
        },
        {
          "name": "golden_spacing",
          "title": "Golden spacing scale",
          "description": "The golden spacing scale (spacers 1-11 plus half-N and double-N) with exact values, px and CSS variable names, as used by goldenratio.app and the tailwindcss-golden-ratio plugin. With default options it also returns the rounded cheatsheet table from goldenratio.app/#/spacing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "prefix": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "maxLength": 20,
                    "type": "string"
                  }
                ],
                "description": "Plugin prefix option, only changes tailwind_key (true = \"gr-\")."
              },
              "root_font_px": {
                "description": "Root font size for px conversion of rem/em values (default 16).",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "spacer_base": {
                "description": "theme.goldenRatio.spacerBase: the size of spacer 6 (default 1.5, as on goldenratio.app).",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "spacer_unit": {
                "description": "theme.goldenRatio.spacerUnit (default 'rem').",
                "enum": ["rem", "em", "px", "%", "vw", "vh", "ch", "ex", "pt"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93f8fa52212bd0f3a84cfd51f078607789eaf1b8a4528cc2e784115cd6548de7"
        },
        {
          "name": "tailwind_plugin_setup",
          "title": "tailwindcss-golden-ratio setup",
          "description": "How to add the tailwindcss-golden-ratio plugin (the one goldenratio.app uses): install command, tailwind.config.js, options, and the exact theme values it generates (spacing, grp widths, scale, fontSize extras, borderWidth/lineHeight) for the given options.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "prefix": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "maxLength": 20,
                    "type": "string"
                  }
                ],
                "description": "theme.goldenRatio.prefix (true = \"gr-\")."
              },
              "spacer_base": {
                "description": "theme.goldenRatio.spacerBase: the size of spacer 6 (default 1.5, as on goldenratio.app).",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "spacer_unit": {
                "description": "theme.goldenRatio.spacerUnit (default 'rem').",
                "enum": ["rem", "em", "px", "%", "vw", "vh", "ch", "ex", "pt"],
                "type": "string"
              },
              "use_css_vars": {
                "description": "theme.goldenRatio.useCssVars (default true).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:373ccd451ed8c2402ab3bf5a0b90d2a7f5be41be8f638e183ff43d45e03fff20"
        }
      ],
      "digest": "sha256:3466e9ee7eeacffe47c6531292e00e0b5a4b80d143c1eea3fef9929c3ea7e253"
    }
  }
}
