      "serverInfo": {
        "name": "elton",
        "title": "Elton",
        "version": "3.6.0",
        "websiteUrl": "https://elton.app/agent",
        "icons": [
          {
            "src": "https://elton.app/images/logo_512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Elton is an app for charging an electric car and paying for it at most operators in Norway, Sweden and Denmark. These tools find charging stations where Elton works, with the places to eat and food shops nearby, and plan where to stop to charge on a drive. They read Elton's public charging pages: no prices, and no account. Link the user to the stations' pages; starting and paying for a charge happens in the Elton app. Each station's appUrl opens it in the Elton app, and a plan's or a road's appUrl opens the route, with its charging stops, in the app's route planner: offer them as links. freeNow, where a station has it, is how many of its charge points were free at freeNowAt: say it's live and can change before the user gets there. If a tool fails or misses something, ask the user whether to send feedback with send_feedback.",
      "tools": [
        {
          "name": "find_charging_stations",
          "title": "Find charging stations",
          "description": "Find EV charging stations where you can charge and pay with the Elton app, along a road (in driving order, with km, spread along the whole road) or in a town. Each comes with its address and coordinates, its most powerful charger, the places to eat and food shops within a short walk, and a link to its page. Each station's appUrl opens it in the Elton app, and a road's appUrl opens it in the app's route planner. Never prices.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "The country whose roads and stations to use: no (Norway), se (Sweden), dk (Denmark).",
                "enum": ["no", "se", "dk"],
                "type": "string"
              },
              "food": {
                "description": "Only stations with this place to eat or food shop nearby, by name, chain or cuisine, as \"Burger King\", \"Rema 1000\" or \"pizza\".",
                "type": "string"
              },
              "limit": {
                "description": "At most this many stations: 10 if not given, 50 at most.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minKw": {
                "description": "Only stations with a charger of at least this many kW.",
                "type": "number"
              },
              "operator": {
                "description": "Only this operator, as \"Circle K\".",
                "type": "string"
              },
              "place": {
                "description": "A town, as \"Trysil\", or in Norway any place, as \"Beitostølen\": with no town page, the stations within 15 km of it.",
                "type": "string"
              },
              "road": {
                "description": "A road's name, as \"Oslo–Trysil\".",
                "type": "string"
              },
              "withFood": {
                "description": "Only stations with a place to eat or a food shop nearby.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find charging stations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e3e9a8671c441776b6053709f8d063e34ce778bff41d4fbf18b492ad7422621"
        },
        {
          "name": "find_stations_near",
          "title": "Find charging stations nearby",
          "description": "Find EV charging stations where you can charge and pay with the Elton app near an address (Norway, looked up in Kartverket's address register) or a point (lat and lng, any of the three countries), nearest first, with how far each is in a straight line. Each comes with its address, coordinates, most powerful charger, the places to eat and food shops within a short walk, and a link to its page. Each station's appUrl opens it in the Elton app. Never prices.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "An address in Norway, as \"Gladengveien 2, Oslo\", or a place name, as \"Rauland\".",
                "type": "string"
              },
              "country": {
                "description": "The country whose roads and stations to use: no (Norway), se (Sweden), dk (Denmark).",
                "enum": ["no", "se", "dk"],
                "type": "string"
              },
              "food": {
                "description": "Only stations with this place to eat or food shop nearby, by name, chain or cuisine, as \"Burger King\", \"Rema 1000\" or \"pizza\".",
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the point to search round (WGS84), with lng instead of an address.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "At most this many stations: 10 if not given, 50 at most.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude of the point to search round (WGS84).",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "minKw": {
                "description": "Only stations with a charger of at least this many kW.",
                "type": "number"
              },
              "operator": {
                "description": "Only this operator, as \"Circle K\".",
                "type": "string"
              },
              "radiusKm": {
                "description": "How far round, in km in a straight line: 5 if not given, 50 at most.",
                "maximum": 50,
                "minimum": 0.1,
                "type": "number"
              },
              "withFood": {
                "description": "Only stations with a place to eat or a food shop nearby.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find charging stations nearby"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2cf191ac111e23da775985451d0164f76e587a60ecf2ee0731048832011cc5cb"
        },
        {
          "name": "list_charging_roads",
          "title": "List charging roads",
          "description": "List the roads Elton has a charging page for in a country, with where each starts and ends and its length. Use it to find a road before planning a drive.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "The country whose roads and stations to use: no (Norway), se (Sweden), dk (Denmark).",
                "enum": ["no", "se", "dk"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List charging roads"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d130f957337bc86f710107b39f2c32bd1e0ef4a60bc2a508c7db0b074dc4857"
        },
        {
          "name": "plan_charging_route",
          "title": "Plan charging stops",
          "description": "Plan where to stop for fast charging on a drive between two places on a road Elton has a page for. Give the car as car and the temperature as temperatureC whenever the user says them, not a range of your own: Elton knows the car's range and cuts it for cold. When the drive ends at a cabin or anywhere the user can't charge, set noChargerAtDestination, and the plan makes sure the car gets back to a fast charger. Charges to 80% at each stop, as Elton advises, keeps a 20% reserve, and prefers stops with a place to eat or a food shop. A sketch: the Elton app shows which chargers are free. Its appUrl opens the whole drive, with the charging stops, in the Elton app's route planner.",
          "inputSchema": {
            "properties": {
              "arrivePercent": {
                "description": "How full the battery should be on arrival, in percent (the 20% reserve if not given). For a cabin with no charger, set noChargerAtDestination instead.",
                "maximum": 80,
                "minimum": 0,
                "type": "number"
              },
              "car": {
                "description": "The car, as \"Hyundai Ioniq 5\" or \"Tesla Model Y Long Range\": its range and the chargers it can fast-charge at come from Elton's list. Give it whenever the user names the car, rather than rangeKm.",
                "type": "string"
              },
              "country": {
                "description": "The country whose roads and stations to use: no (Norway), se (Sweden), dk (Denmark).",
                "enum": ["no", "se", "dk"],
                "type": "string"
              },
              "food": {
                "description": "Stop to charge where this place to eat or food shop is nearby, where one is in reach, as \"Burger King\".",
                "type": "string"
              },
              "from": {
                "description": "Where the drive starts: a road page's end or a town along it, as \"Oslo\". In Norway also a street address or a place off the road, as the user said it (\"Storgata 1, Hamar\"): the plan starts at the town on a road nearest it, and its asked field says which.",
                "type": "string"
              },
              "noChargerAtDestination": {
                "description": "True when there's no charger where the drive ends, as a cabin, or the user says they can't charge there: the plan arrives with enough to drive back to the fastest charger near the end, with a plan B, within the 80% rule, or says it can't.",
                "type": "boolean"
              },
              "rangeKm": {
                "description": "How far the car goes on a full battery in mild weather, in km: only for a car that isn't in Elton's list, as car is better. Not a winter figure: temperatureC cuts the range for cold, so a winter figure would be cut twice.",
                "type": "number"
              },
              "startPercent": {
                "description": "How full the battery is at the start, in percent (default 100).",
                "type": "number"
              },
              "temperatureC": {
                "description": "The temperature on the drive, in °C. Below +10 the range is cut by an estimate from NAF and Motor's El Prix winter test.",
                "maximum": 40,
                "minimum": -40,
                "type": "number"
              },
              "to": {
                "description": "Where it ends: a road page's end or a town along it, as \"Trysil\" or \"Seljord\". In Norway also a street address, as a cabin's (\"Røvskroken 13, Beitostølen\").",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan charging stops"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30cc15b36eeb56d5d4f731753db610e9598403124081f5b82939f5bb2f038c43"
        },
        {
          "name": "send_feedback",
          "title": "Send feedback",
          "description": "Send Elton's web team feedback on these tools: something that didn't work, a wrong answer, or a tool you missed. Ask the user first, and send only what they want sent. No personal details.",
          "inputSchema": {
            "properties": {
              "message": {
                "description": "The feedback, in the user's words.",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7fdf73426298b679bc20739275fde1e8718c565275339f1f1b5f572e721b2e14"
        }
      ],
      "digest": "sha256:2746efcc06305bbb6e9a3f215fde31721dcb87bf41a824bbfe08788c824fd3a8"
    }
  }
