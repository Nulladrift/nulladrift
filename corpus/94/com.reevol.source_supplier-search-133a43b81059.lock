                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "countries": {
                "description": "Multi-country allow-list. Takes precedence over `country`.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
                "description": "Single canonical country name.",
                "type": "string"
              },
              "employeeRange": {
                "description": "Allowed employee bands.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "excludeCountries": {
                "description": "Country deny-list.",
                "items": {
                  "type": "string"
                },
                "type": "array"
