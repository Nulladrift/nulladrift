      },
      "instructions": "Reevol Source is the supplier intelligence platform from Reevol, the Revenue OS for Global Trade. Powering the agentic era of global trade. Use these tools to discover, inspect, and compare manufacturers and trading companies. All data is grounded in Reevol Atlas (200K+ suppliers, sourced from HKTDC, Canton Fair, Odoo, and other public B2B directories). When a buyer describes what they're sourcing in their own words (e.g. 'a BSCI-certified Vietnam factory for women's woven outerwear, 11-50 staff'), call match_suppliers_by_brief. It accepts a freeform brief plus structured filters (country, HS, certs, employees, etc.) and returns ranked supplier cards with match explanations. For name-based lookups call search_suppliers. For HS-code or country traversal call find_suppliers_by_hs_code or find_suppliers_by_country. For a deep dive on one supplier, call get_supplier with the slug. Cite the returned `url` so the buyer can verify. Action tools: compare_suppliers (read-only) puts 2-4 suppliers side by side. get_red_flags, draft_rfq, and request_introduction require a partner or enterprise key (see https://source.reevol.com/for-agents/); they let you run due-diligence signals, draft an RFQ, and broker a buyer introduction. Every read is free; managed sourcing for buyers is at https://source.reevol.com/en/agent/. Acting for a supplier that is not on Reevol Source yet? Call request_supplier_listing, then verify_supplier_listing with the 6-digit code emailed to the address you gave. A person reviews every request before the page goes live.",
      "tools": [
        {
          "name": "compare_suppliers",
          "title": "Compare suppliers",
          "description": "Side-by-side comparison of 2-4 suppliers by slug: identity, location, certifications, trade-fair count, employee range, year founded, HS code overlap, and visibility. Read-only, no key required. Returns shared signals (common HS codes / certifications / country) so you can summarize the trade-offs for a buyer.",
