          "digest": "sha256:1bbff94e8a14aa159bc720d9cd83d5c434aecec095dace2c3c46d0a45bcbacb9"
        },
        {
          "name": "match_suppliers_by_brief",
          "title": "Match suppliers by buyer brief",
          "description": "Best tool when a buyer describes what they need in their own words. Combines semantic search (Voyage embeddings over supplier industry, HS codes, certifications, trade-fair history, and the EN summary) with structured filters (country, HS codes, certifications, employee range, year founded, business type, export markets). Returns a ranked list of supplier cards, each with a `matchExplanation` summarizing why it surfaced. Example brief: 'BSCI-certified Vietnam factory for women's woven outerwear, MOQ-flexible, 11-50 staff, exports to EU'. Ranking: by relevance first. Among about equally relevant results, suppliers on a paid Reevol plan come first and carry featured: true, and catalog completeness counts for a little. Payment never lifts a supplier above a clearly better match or removes anyone from results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brief": {
                "description": "Freeform description of what the buyer is sourcing.",
                "maxLength": 2000,
                "minLength": 8,
                "type": "string"
              },
              "businessType": {
                "enum": ["manufacturer", "trading_company", "any"],
                "type": "string"
              },
              "certifications": {
