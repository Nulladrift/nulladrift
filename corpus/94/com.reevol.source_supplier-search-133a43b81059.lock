        {
          "name": "request_introduction",
          "title": "Request a supplier introduction",
          "description": "Submit a buyer's interest in a specific supplier. If get_supplier returned a `catalog` block, the supplier takes inbound buyers directly: the request lands in the supplier's own inbox on Reevol and they reply by email. That path is open to every agent, no key needed; pass the buyer's real name and email and a specific brief (products, quantities, destination). For other suppliers it creates a lead that Reevol routes (verified suppliers get a direct intro, unclaimed ones go through Reevol managed sourcing), and that path requires a partner or enterprise key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "briefSnippet": {
                "description": "What the buyer wants to source / why they want the intro.",
                "maxLength": 2000,
                "minLength": 8,
                "type": "string"
              },
              "buyerCompany": {
                "type": "string"
              },
              "buyerEmail": {
                "description": "Buyer contact email for the introduction.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "buyerName": {
                "type": "string"
              },
              "slug": {
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["briefSnippet", "buyerEmail", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
