        {
          "name": "find_suppliers_by_country",
          "title": "Find suppliers by country",
          "description": "List suppliers headquartered in a given country, optionally filtered by industry, certifications, employee range, or business type. Every result matches the filters equally, so the list is ordered by visibility score. Ranking: by relevance first. Among about equally relevant results, suppliers on a paid Reevol plan come first and carry featured: true, and catalog completeness counts for a little. Payment never lifts a supplier above a clearly better match or removes anyone from results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "businessType": {
                "description": "Restrict to manufacturer vs trading company.",
                "enum": ["manufacturer", "trading_company", "any"],
                "type": "string"
              },
              "certifications": {
                "description": "Certification names to require (any-of). E.g. [\"ISO 9001\",\"BSCI\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
                "description": "Canonical country name, e.g. \"China\", \"Vietnam\", \"Turkey\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "employeeRange": {
                "description": "Employee bands to allow. E.g. [\"1-10\",\"11-50\",\"51-200\",\"201-500\",\"500+\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "industry": {
                "description": "Primary industry filter (matches Reevol industry taxonomy).",
                "type": "string"
              },
              "lang": {
                "description": "Locale for the returned URLs. Default en.",
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["country"],
            "type": "object"
          },
