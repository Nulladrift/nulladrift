        {
          "name": "request_supplier_listing",
          "title": "Request a supplier listing on Reevol Source",
          "description": "For agents acting on behalf of a supplier (manufacturer or trading company) that is not on Reevol Source yet. Submits a request to be added; search_suppliers first to make sure the company is not already listed. A 6-digit code is emailed to `email`: read it from that inbox and call verify_supplier_listing. Use the company's own website. A company email is best; an AI-agent mailbox you control (for example *@mail.grokbot.com or *@agentmail.to) is fine as long as the website is the company's own. Free webmail (gmail, qq.com, 163.com, outlook, ...) is not accepted. After verification Reevol reviews the request (an automated check of the website and products, and a person when needed); when the page is live the email gets a \"you are live\" message with the link, and the supplier manages the profile in Reevi (https://reevi.ai).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "companyName": {
                "description": "Company legal or trading name.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "contactName": {
                "description": "Name of the person at the supplier.",
                "maxLength": 200,
                "type": "string"
              },
              "country": {
                "description": "Country of the company, e.g. \"China\".",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "description": "Where the 6-digit code is sent. Company email, or an AI-agent mailbox you can read.",
                "maxLength": 320,
                "minLength": 5,
                "type": "string"
              },
              "hsCodes": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "HS codes, e.g. [\"6802\", \"6810.99\"] or \"6802, 6810\". Up to 10."
              },
              "locale": {
                "description": "Language for the emails to the supplier: en, zh-CN, zh-Hant, ja, ko, vi, th, id, es, pt-BR, fr, de, ar. Default en.",
                "maxLength": 10,
                "type": "string"
              },
              "mainProducts": {
                "description": "Main products, plain text.",
                "maxLength": 1000,
                "type": "string"
              },
              "note": {
                "description": "Anything the reviewer should know, e.g. \"Submitted by an AI agent for the export manager\".",
                "maxLength": 2000,
