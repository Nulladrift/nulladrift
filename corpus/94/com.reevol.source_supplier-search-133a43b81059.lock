        {
          "name": "get_supplier",
          "title": "Get supplier profile",
          "description": "Fetch a full supplier profile by slug: identity, location, HS codes, certifications, trade fairs, export markets, and the AI-generated buyer-facing summary + FAQ. Use after search_suppliers to dig into a specific match. When the supplier publishes a Reevol Catalog, a `catalog` block adds its products, certificates, key facts and catalog URL (plus the catalog's own MCP endpoint), and the supplier can be contacted directly with request_introduction, no key needed. When Reevol has verified the company is a real trading business, `catalog.reevolVerified` lists the checks and states what they do and do not assert; when that key is absent it says nothing about the supplier. `featured: true` means the supplier is on a paid Reevol plan, which affects only its position among about equally relevant results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Locale for the summary + FAQ (en, zh-CN, es, pt-BR, fr, ar). Default en.",
                "type": "string"
              },
              "slug": {
                "description": "Supplier slug, e.g. \"shenzhen-acme-electronics-co-ltd\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
