          },
          "digest": "sha256:587b3cbc97dac41520f9ca3bd5899a74e3fb99885515ae54eea5ef67005baea0"
        },
        {
          "name": "search",
          "title": "Search (connector)",
          "description": "Connector-style search over open senior roles. Returns ids for fetch. Prefer search_roles when you can filter.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search (connector)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6a426838a1aced095e147b0f57b23930236b544812e5fb1ccbc8b28bfd212c9a"
        },
        {
          "name": "search_roles",
          "title": "Search senior roles",
          "description": "Search open senior roles (Manager to C-suite) at the 500 largest US companies by words, seniority band, function, work mode, region, city or state, minimum salary and recency. Returns up to 25 roles a page with title, level, location, posted pay range, date and a link. Use it for \"VP finance roles in Texas\", \"remote director of engineering jobs\", \"what CFO roles are open\". Limitation: no company names; the role page shows them to members.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "band": {
                "description": "Seniority: csuite, svp, vp, director, manager.",
                "items": {
                  "enum": ["csuite", "svp", "vp", "director", "manager"],
                  "type": "string"
                },
                "type": "array"
              },
              "function": {
                "description": "Job functions, e.g. Finance, Technology. Call list_filters for the full list.",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "type": "array"
              },
              "location": {
                "description": "A city or a US state, by name or code, e.g. Chicago, Texas, TX.",
                "maxLength": 60,
                "type": "string"
              },
              "min_comp": {
                "description": "Minimum posted salary in USD.",
                "maximum": 2000000,
                "minimum": 0,
                "type": "integer"
              },
              "mode": {
                "description": "Work mode.",
                "items": {
                  "enum": ["onsite", "hybrid", "remote"],
                  "type": "string"
                },
                "type": "array"
              },
              "page": {
                "description": "Page number, 25 roles a page.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "posted_within_days": {
                "description": "Only roles first seen in the last N days.",
                "maximum": 365,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words to search titles, e.g. \"CFO\" or \"VP supply chain\".",
                "maxLength": 120,
                "type": "string"
              },
              "region": {
                "description": "us = United States only, intl = outside the US.",
                "enum": ["us", "intl"],
                "type": "string"
              },
              "sort": {
                "description": "senior (default), newest, or comp (highest pay first).",
                "enum": ["senior", "newest", "comp"],
                "type": "string"
              },
              "status": {
                "description": "open (default), new (7 days), today (24 hours), filled (last 30 days).",
                "enum": ["open", "new", "today", "filled"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search senior roles"
          },
