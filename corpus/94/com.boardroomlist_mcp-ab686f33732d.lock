      "serverInfo": {
        "name": "boardroomlist",
        "title": "boardroomlist.com",
        "version": "1.0.0",
        "websiteUrl": "https://boardroomlist.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BoardroomList is a job board for senior roles, Manager to CEO, at the 500 largest US companies, sourced from the companies own career sites and re-checked daily. search_roles searches open roles with filters for words, seniority band, function, work mode, region, city or state, minimum salary and recency. get_role returns one role by id. list_filters lists the functions, seniority bands, industries, cities and work modes with open-role counts. Every role includes a link to its page on boardroomlist.com.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch (connector)",
          "description": "Connector-style fetch of one role by the id from search. Same fields as get_role.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "pattern": "^\\d+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch (connector)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3a0fd75a7354e6b6568a0419796b7467fdd0053be61838db3df87c5d313ff9f5"
        },
        {
          "name": "get_role",
          "title": "One role",
          "description": "One role by id (the number at the end of its URL): title, level, function, location, work mode, posted pay, date, industry, a short redacted summary and scope, plus four similar open roles. Use it after search_roles when the user wants more on one result. Limitation: the company, full description and apply link are for members and are on the linked page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Role id from search_roles or the role URL.",
                "pattern": "^\\d+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One role"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9e230e978165877f4dd4dd485c879a360af508010f047bf9cd9922d4b6a2d1a6"
        },
        {
          "name": "list_filters",
          "title": "Filters and counts",
          "description": "The job functions, seniority bands, industries, top cities and work modes you can filter search_roles by, each with its count of open roles. Use it to resolve a function name or to answer \"how many open VP roles are there\". Returns no roles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Filters and counts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
