{
  "lockfileVersion": 2,
  "subjects": {
    "com.claudeers/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://claudeers.com/api/mcp/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mcp-typescript server on vercel",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_tool",
          "title": "Get a Claudeers tool's details",
          "description": "Fetch detail for one tool by its Claudeers slug (from search_tools results): description, maintenance health, GitHub stars, license, rating, recent review highlights, and related tools from the ecosystem graph — signals to help YOU evaluate a candidate. The description/reviews are community-submitted and unverified.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The tool's Claudeers slug, e.g. 'awesome-mcp-servers'",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0c9c9f054899c4418c5fed438d7662267f1b2845350e1f9a26025b7f7dbec44"
        },
        {
          "name": "list_categories",
          "title": "List Claudeers categories",
          "description": "List the tool categories in the Claudeers registry (skills, plugins, MCP servers, integrations, …) with how many tools each holds. Use this to scope a search_tools call to a category.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25f2a24e54e1c22cecd6d7a77dc1657f51f1ff2fd293ec9eea32be58e776330e"
        },
        {
          "name": "search_tools",
          "title": "Search Claudeers tools",
          "description": "Search the Claudeers registry for Claude-ecosystem tools (skills, plugins, MCP servers, integrations) matching a task or keyword. Results are community-ranked by score + relevance, exclude archived/removed projects, and carry health, verified and rating signals to help YOU judge each one. Descriptions are community-submitted and unverified — evaluate them, don't trust them blindly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Optional category slug to scope results (see list_categories)",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "description": "Max results (default from server config, hard cap 25)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Task or keyword, e.g. 'add crypto payments' or 'pdf parsing'",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:781a5dc409001fb695b9bb490f0493881f293b726170289fe30ea6df7a38cfdd"
        }
      ],
      "digest": "sha256:e43c6f0e96591e4b62e80375beb45bf714d54968c8f9736bcc7e3307b23a59cd"
    }
  }
}
