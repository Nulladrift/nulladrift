      "serverInfo": {
        "name": "by-earth-and-ocean-bookings",
        "title": "By Earth and Ocean Noosa tour bookings",
        "version": "dev"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Book tours in Noosa, Australia with By Earth and Ocean: guided and self guided kayak tours to see stingrays in the Noosa Everglades, e-bike and mountain bike tours, and fat bike beach rides; and Bike On bike rentals with delivery. Use list_tours (or list_rentals and check_rental_availability for bike hire), then check_availability for a date. To book, either give the customer the booking_link, or use get_booking_form then create_booking: the booking is unpaid and the customer pays with the payment link. Never ask for card details. Prices are AUD. By Earth and Ocean (tours) and Bike On (bike hire) are sister brands of Element Outdoors in Noosa and share one booking system, so the booking page, payment link and confirmation emails can show the Bike On name even for a tour. Talk about the brand the customer asked about, and if they notice the other name, explain it is the same local business.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check tour availability",
          "description": "Live places and prices for one tour on one date, straight from the booking system. Returns each session that can be booked, places left, total price for the group, the guest types it takes, and a booking link the customer can open to book themselves.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Adults (on kayak tours: anyone 13 and over)",
                "minimum": 0,
                "type": "integer"
              },
              "children": {
                "description": "Children (kayak tours: ages 4 to 12). Bike tours have no child rate.",
                "minimum": 0,
                "type": "integer"
              },
              "date": {
                "description": "YYYY-MM-DD, Noosa time",
                "type": "string"
              },
              "guests": {
                "additionalProperties": {
                  "type": "integer"
                },
                "description": "Optional: exact counts by the guest_types keys that check_availability returns. Overrides adults/children/infants.",
                "type": "object"
              },
              "infants": {
                "description": "Infants and toddlers aged 3 and under (kayak tours)",
                "minimum": 0,
                "type": "integer"
              },
              "tour": {
                "description": "Tour key, as listed by list_tours",
                "type": "string"
              }
            },
            "required": ["date", "tour"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check tour availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1b13e33839be4a5a391349a2b79d236c0786be6cf2c0f3389d66c9392d81e9d"
        },
        {
          "name": "check_rental_availability",
          "title": "Check rental availability",
          "description": "Live availability and price for Bike On rental bikes over a date range, by size item_id, plus the delivery charge if a suburb is given. Each size suits a range of rider heights.",
          "inputSchema": {
            "description": "For Bike On bike rentals instead of a tour.",
            "properties": {
              "bikes": {
                "description": "The bikes to hire, one entry per size",
                "items": {
                  "properties": {
                    "item_id": {
                      "description": "A size item_id from list_rentals",
                      "type": "string"
                    },
                    "qty": {
                      "description": "How many bikes of this size",
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["item_id", "qty"],
                  "type": "object"
                },
                "type": "array"
              },
              "delivery_suburb": {
                "description": "Optional: suburb to deliver to and collect from. Leave out to collect from the shop.",
                "type": "string"
              },
              "end_date": {
                "description": "Last day of hire, YYYY-MM-DD (same as start_date for one day)",
                "type": "string"
              },
              "start_date": {
                "description": "First day of hire, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["bikes", "end_date", "start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check rental availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57377db11a12b858fe9f70b8c649618d59444280d5190b745070990d9a7d7e40"
        },
        {
          "name": "create_booking",
          "title": "Hold a booking (unpaid, 30 minutes)",
          "description": "Book a tour session or Bike On rental for the customer. The booking is made unpaid and holds the places for 30 minutes; the customer must pay with the payment link returned, on our secure booking page (no card details are ever taken here). Unpaid bookings are cancelled automatically. Needs the customer's confirmation of the details and their agreement to the booking terms.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Adults (on kayak tours: anyone 13 and over)",
                "minimum": 0,
                "type": "integer"
              },
              "children": {
                "description": "Children (kayak tours: ages 4 to 12). Bike tours have no child rate.",
                "minimum": 0,
                "type": "integer"
              },
              "customer": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Field values by key from get_booking_form (customer_name, customer_email, customer_phone and any others it requires)",
                "type": "object"
              },
              "customer_agreed_to_terms": {
                "description": "True only if the customer has read and agreed to the booking terms",
                "type": "boolean"
              },
              "customer_confirmed_details": {
                "description": "True only if the customer confirmed tour, date, time, numbers and price",
                "type": "boolean"
              },
              "date": {
                "description": "Tour date, YYYY-MM-DD",
                "type": "string"
              },
              "guests": {
                "additionalProperties": {
                  "type": "integer"
                },
                "description": "Optional: exact counts by the guest_types keys that check_availability returns. Overrides adults/children/infants.",
                "type": "object"
              },
              "infants": {
                "description": "Infants and toddlers aged 3 and under (kayak tours)",
                "minimum": 0,
                "type": "integer"
              },
              "rental": {
                "description": "For Bike On bike rentals instead of a tour.",
                "properties": {
                  "bikes": {
                    "description": "The bikes to hire, one entry per size",
                    "items": {
                      "properties": {
                        "item_id": {
                          "description": "A size item_id from list_rentals",
                          "type": "string"
                        },
                        "qty": {
                          "description": "How many bikes of this size",
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["item_id", "qty"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "delivery_suburb": {
                    "description": "Optional: suburb to deliver to and collect from. Leave out to collect from the shop.",
                    "type": "string"
                  },
                  "end_date": {
                    "description": "Last day of hire, YYYY-MM-DD (same as start_date for one day)",
                    "type": "string"
                  },
                  "start_date": {
                    "description": "First day of hire, YYYY-MM-DD",
                    "type": "string"
                  }
                },
                "required": ["bikes", "end_date", "start_date"],
                "type": "object"
              },
              "session_id": {
                "description": "Tour session (or give rental instead)",
                "type": "string"
              }
            },
            "required": ["customer", "customer_agreed_to_terms", "customer_confirmed_details"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
