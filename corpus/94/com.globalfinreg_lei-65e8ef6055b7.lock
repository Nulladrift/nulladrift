        },
        {
          "name": "lookup_legal_form",
          "title": "Look up legal form",
          "description": "Looks up an entity legal form (ISO 20275 ELF code list) in a country: by ELF code first, otherwise by the legal form's local name, optionally within a region of the country.",
          "inputSchema": {
            "properties": {
              "countryCode": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. DK.",
                "type": "string"
              },
              "elfCode": {
                "default": null,
                "description": "The 4-character ELF code, e.g. H8VP.",
                "type": "string"
              },
              "localName": {
                "default": null,
                "description": "The legal form's local name, e.g. Anpartsselskab.",
                "type": "string"
              },
              "regionCode": {
                "default": null,
                "description": "ISO 3166-2 region code, for countries whose legal forms differ by region.",
                "type": "string"
              }
            },
            "required": ["countryCode"],
            "type": "object"
          },
