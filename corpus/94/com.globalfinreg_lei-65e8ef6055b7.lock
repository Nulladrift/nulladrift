        {
          "name": "order_lei_renewal",
          "title": "Renew an LEI without signing in",
          "description": "Orders the renewal of one LEI that Global FinReg manages, for a user who isn't signed in. Only call it after showing the user the price from get_lei_renewal_offer and getting their explicit agreement. paymentMethod 'card' returns paymentUrl, the payment provider's own page: give it to the user, who pays there without signing in (never ask for card details); the renewal is processed once paid. paymentMethod 'invoice' needs renewalLink: it commits the user to paying, confirms the renewal straight away and returns the invoice PDF to pay by bank transfer.",
          "inputSchema": {
            "properties": {
              "expectedTotal": {
                "description": "The total from get_lei_renewal_offer that the user agreed to. The order is refused if the price has changed.",
                "type": "number"
              },
              "lei": {
                "default": null,
                "description": "The 20-character LEI to renew, e.g. 894500AAX24OVFGAR954. Leave it out when you pass renewalLink.",
                "type": "string"
              },
              "paymentMethod": {
                "description": "'card' (pay online by card) or 'invoice' (pay by bank transfer; only with renewalLink).",
                "type": "string"
              },
              "renewalLink": {
                "default": null,
                "description": "Optional: the renewal link from Global FinReg's renewal reminder email, exactly as the user gives it (https://.../lei/renewal-link?lei=...&t=...). With it the renewal can also be paid by invoice.",
                "type": "string"
              },
              "years": {
                "description": "Renewal period in years: 1, 3 or 5, as offered.",
                "type": "integer"
              }
            },
            "required": ["expectedTotal", "paymentMethod", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Renew an LEI without signing in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:37241d8bb2d20cbe375381d013fd148381a799039ee0686cfd2c9bb8ac0a5146"
        },
        {
          "name": "search_lei_by_company_name",
          "title": "Search LEI by company name",
          "description": "Searches the global LEI register by legal entity name. Returns matching entities with their LEI, country and a link to the entity's GlobalFinReg lookup page.",
          "inputSchema": {
