      "instructions": "The public tools (search_lei_by_company_name, get_lei_record, get_prices, lookup_legal_form, create_user, get_lei_renewal_offer, order_lei_renewal) need no authentication. Without signing in, an LEI that Global FinReg manages can be renewed with get_lei_renewal_offer and order_lei_renewal: from its LEI number (card payment only), or with the renewal link from the user's reminder email (card or invoice); show the user the price and get their agreement before ordering. The account tools act on a Global FinReg user's account and need 'Authorization: Bearer <token>' on the request; /auth.md on this server explains how to get a token on behalf of the user. MCP clients with built-in OAuth sign-in (such as Claude) should connect to /mcp/account instead, which asks the user to sign in. If the user has no account yet, create_user creates one and emails them a link to set a password; register for a token after they have. Prices are in the currency on the user's account: before quoting, ask the user which currency they want to be charged in and change it with set_currency if needed. If a quote adds VAT for an entity in another EU country, its vatNote says so: ask the user for the entity's EU VAT number, check it with verify_vat_number and pass vatCountry and vatNumber to the quote and order tools. To renew an LEI, call get_renewal_quote, show the user the price and get their agreement, then create_renewal_order: 'card' returns a payment link for the user (never ask for card details), 'invoice' returns the invoice PDF. To transfer an LEI to Global FinReg, ask the user whether to sign the power of attorney online, have it emailed or download it, then call start_lei_transfer; for a POA signed by hand, give the user the uploadUrl from the answer (or get_upload_link) to upload the signed file in their browser, and follow progress with check_transfer_status. An LEI that expires within 2 months must be renewed with its transfer. To register a new LEI, ask the user how to deal with the limited POA (sign, email or download, as for a transfer), then call start_lei_registration; when documentsNeeded, or for a limited POA signed by hand, use the uploadUrl in the answer or get_upload_link: never pass a PDF as base64, it is too long to copy exactly. Then call get_registration_quote, show the price, and after the user agrees create_registration_order ('card' or 'invoice', as for a renewal). For a Concordium company identity, ask the user for the link their Concordium wallet opened and call start_concordium_company_verification; let the user choose the fast route (one of their Global FinReg LEIs, complete_concordium_verification_with_lei) or the regular route (set_concordium_company_details, get_concordium_document_upload_link, set_concordium_signatory, then the ID check on the website), and finish with the walletReturnUrl from check_concordium_verification_status. Agents that use the Agentic Commerce Protocol can also buy renewals and new LEI registrations with the ACP checkout at /acp (/.well-known/acp.json, documented in /auth.md). For a corporate group's structure and which of its LEIs have lapsed or expire soon, call get_entity_map (any signed-in user, any LEI) and give the user its mapUrl to see or print the map. A partner (corporate) account also has its own entity map, get_my_entity_map, which it can complete where the LEI register lacks links: place_lei_in_entity_map puts an LEI under a direct parent (and, unless it is one of the organisation's own at Global FinReg, on the user's watchlist when it isn't on it yet), and add_entity_map_placeholder adds an entity that has no LEI yet (with a registration number, it takes the entity's name from its business register). search_business_register and lookup_business_register find a company in its national business register by name or number, e.g. a group entity without an LEI or, for Danish companies, the companies it owns. Public filings: find_sec_filings and get_sec_subsidiaries (SEC EDGAR, incl. the 10-K's list of subsidiaries), find_european_filings (ESEF annual reports by LEI), find_uk_filings (Companies House) and read_public_filing to read one. An entity without an LEI can be a parent (parentPlaceholderId), and build_entity_map adds a whole structure (up to 100 entities) in one call. The parent must already be in the map, so work from the top of the group down, and agree the structure with the user before changing it or removing anything (remove_lei_from_entity_map, remove_entity_map_placeholder). The lookup, price, list, map and download tools are read-only; the account, order, transfer, registration, upload, Concordium, set_currency and entity map placement tools change the user's account.",
      "tools": [
        {
          "name": "create_user",
          "title": "Create a Global FinReg account",
          "description": "Creates a Global FinReg account for a user from their email address, so they can order and manage LEIs. GFR emails the address a link to set a password; you get no access to the account from this tool. After the user has set a password, register for access with /auth.md and use the account tools. If the address already has an account nothing changes, and the answer is the same. Ask the user for their email address, first name and last name, and confirm them with them before calling.",
          "inputSchema": {
            "properties": {
              "currencyCode": {
                "default": "EUR",
                "description": "Currency for prices and invoices, e.g. EUR, DKK, SEK, NOK, USD, GBP. Default EUR.",
                "type": "string"
              },
              "email": {
                "description": "The user's email address. The account and all GFR emails use it.",
                "type": "string"
              },
              "firstName": {
                "description": "The user's first name, as the user gave it. Required.",
                "type": "string"
              },
              "languageCode": {
                "default": "en",
                "description": "Language code for the account, e.g. en, da, nn (Norwegian), sv, de, fr. The welcome email is in en, da, nn or sv, otherwise English. Default en.",
                "type": "string"
              },
              "lastName": {
                "description": "The user's last name, as the user gave it. Required.",
                "type": "string"
              }
            },
            "required": ["email", "firstName", "lastName"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a Global FinReg account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2f74ccda46b616500487dafbe96e142e6a8dbb255e57e73129c176430d35663f"
        },
        {
          "name": "get_lei_record",
          "title": "Get LEI record",
          "description": "Returns the registration record of an LEI from the global LEI register: legal name, legal and headquarters address, jurisdiction, legal form, entity and registration status, registration and renewal dates and the managing LOU.",
          "inputSchema": {
            "properties": {
              "lei": {
                "description": "The 20-character Legal Entity Identifier, e.g. 89450060XX5ILUURV330.",
                "type": "string"
              }
            },
            "required": ["lei"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get LEI record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b72611a81ce05a4b84d37d5f79de933e71d4aed62b17d19242d30f1995a32d85"
        },
        {
          "name": "get_lei_renewal_offer",
          "title": "Get the price to renew an LEI without signing in",
          "description": "Returns what it costs to renew one LEI that Global FinReg manages, for a user who isn't signed in: the legal name, expiry date, the total for 1, 3 and 5 years (net amount, VAT, currency) and the payment methods. Pass the LEI number, or the renewal link from the user's Global FinReg reminder email. With only the LEI number the renewal can be paid by card; with the renewal link also by invoice. status is open (can be ordered), paid, invoice_ordered or unavailable (reason and nextStep say why). For an LEI another provider manages, or a user who wants to see their account, use the account tools instead. Always show the user the price and get their agreement before calling order_lei_renewal.",
          "inputSchema": {
            "properties": {
              "lei": {
                "default": null,
                "description": "The 20-character LEI to renew, e.g. 894500AAX24OVFGAR954. Leave it out when you pass renewalLink.",
                "type": "string"
              },
              "renewalLink": {
                "default": null,
                "description": "Optional: the renewal link from Global FinReg's renewal reminder email, exactly as the user gives it (https://.../lei/renewal-link?lei=...&t=...). With it the renewal can also be paid by invoice.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the price to renew an LEI without signing in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:72055ddc7e68dd7ef47892f6489859cde1a520b49d004d767c75d43426f9a20d"
        },
