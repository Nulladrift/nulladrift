        {
          "name": "place_order",
          "title": "Fazer o pedido",
          "description": "Fecha o pedido com o carrinho da sessão, depois que o cliente aprovou itens, frete e total. Exige verify_email_code, CPF e telefone (set_customer_details) e endereço com número. \"confirm_total\" é o total que você mostrou ao cliente; se mudou, o pedido é recusado com o novo total. \"idempotency_key\" (um UUID novo por pedido) evita pedido duplicado se você repetir a chamada. Pagamento: \"pix\" devolve o PIX copia e cola; \"link\" devolve o link onde o cliente paga no site (PIX ou cartão); \"cartao\" só se o cliente pedir para informar o cartão aqui — prefira \"link\", e nunca repita nem guarde os dados do cartão.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cartao": {
                "additionalProperties": false,
                "description": "Só com pagamento \"cartao\".",
                "properties": {
                  "cpf_titular": {
                    "description": "Padrão: o CPF do cliente.",
                    "maxLength": 20,
                    "type": "string"
                  },
                  "cvv": {
                    "maxLength": 4,
                    "type": "string"
                  },
                  "nome": {
                    "description": "Nome do titular como no cartão.",
                    "maxLength": 100,
                    "type": "string"
                  },
                  "numero": {
                    "maxLength": 25,
                    "type": "string"
                  },
                  "validade": {
                    "description": "MM/AA.",
                    "maxLength": 7,
                    "type": "string"
                  }
                },
                "required": ["cvv", "nome", "numero", "validade"],
                "type": "object"
              },
              "confirm_total": {
                "description": "Total aprovado pelo cliente, em reais, ex.: \"56.00\".",
                "type": ["string", "number"]
              },
              "idempotency_key": {
                "description": "UUID novo por pedido.",
                "maxLength": 36,
                "minLength": 32,
                "type": "string"
              },
              "pagamento": {
                "enum": ["pix", "link", "cartao"],
                "type": "string"
              },
              "parcelas": {
                "description": "Só cartão. Padrão: 1.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "session_token": {
                "description": "O session_token devolvido por start_session.",
                "maxLength": 100,
                "minLength": 1,
