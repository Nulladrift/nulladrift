{
  "lockfileVersion": 2,
  "subjects": {
    "com.scriptmasterlabs/agent-browser": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agent-browser-r7d2.onrender.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-browser",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "browser_act",
          "title": "Act on the current page",
          "description": "Use for: interacting with the page — click, fill, type, select, submit, press. Returns the resulting page title, URL and text so you can verify the action landed. Don't use when: the target element is not on the current page — navigate or snapshot first. This tool can change remote state (it can submit forms). Paid: $0.01 per call via x402 (Base USDC, Solana USDC, or XRPL XRP).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "The interaction to perform on the target element.",
                "enum": ["click", "fill", "type", "select", "submit", "press"],
                "type": "string"
              },
              "selector": {
                "description": "CSS selector of the target element.",
                "type": "string"
              },
              "session_id": {
                "description": "Session ID. Reuse the same ID to keep cookies, login state and page position across calls; a new ID starts a fresh browser.",
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "description": "Value for fill/type/select, or key name for press (default Enter).",
                "type": "string"
              }
            },
            "required": ["action", "selector", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "success": {
                "type": "boolean"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["success", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0c3cc1c3380fcea75d7da8eb5e8119648ab79b6c8a2a8995d29966c11598cda1"
        },
        {
          "name": "browser_close",
          "title": "Close a browser session",
          "description": "Use for: ending a session and freeing its browser. Sessions also expire automatically after 10 idle minutes. Free on every door — closing is never charged. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "description": "Session ID. Reuse the same ID to keep cookies, login state and page position across calls; a new ID starts a fresh browser.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "closed": {
                "type": "boolean"
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["closed", "session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:146e61d377540f7acf3e5327b5a1e1bb38f73c001b02b58209f27e9cb381dd04"
        },
        {
          "name": "browser_extract",
          "title": "Extract data from the current page",
          "description": "Use for: pulling repeated elements (prices, titles, links) from the page a session is on, via a CSS selector, or the full page text when no selector is given. Returns one string per matched element. Don't use when: the page has not been loaded yet — call browser_navigate first. Paid: $0.005 per call via x402 (Base USDC, Solana USDC, or XRPL XRP).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attribute": {
                "description": "Attribute to read instead of text, e.g. href or src.",
                "type": "string"
              },
              "selector": {
                "description": "CSS selector to extract. Omit for full page text.",
                "type": "string"
              },
              "session_id": {
                "description": "Session ID. Reuse the same ID to keep cookies, login state and page position across calls; a new ID starts a fresh browser.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": "number"
              },
              "results": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["count", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eaa679dbace829834317632a06e7831da29b0fa27e019bde277c2e7fec97de3d"
        },
        {
          "name": "browser_navigate",
          "title": "Navigate to a URL",
          "description": "Use for: loading a web page in a real Chromium browser and reading it. Returns the page title, final URL and a clean text extract (up to 8000 chars). Don't use when: you only need raw HTML or an API response — a plain HTTP fetch is cheaper. Errors are structured: NAV_TIMEOUT, NAV_FAILED, INVALID_URL. Paid: $0.005 per call via x402 (Base USDC, Solana USDC, or XRPL XRP).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "description": "Session ID. Reuse the same ID to keep cookies, login state and page position across calls; a new ID starts a fresh browser.",
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Absolute http(s) URL to load.",
                "type": "string"
              },
              "wait_for": {
                "description": "Optional CSS selector to wait for after load (max 10s).",
                "type": "string"
              }
            },
            "required": ["session_id", "url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["session_id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1ca9c9911ecef8616ad5f62b635d44e6e0dde77708a2db0f7ed9cf8ef98e399b"
        },
        {
          "name": "browser_screenshot",
          "title": "Screenshot the current page",
          "description": "Use for: visual verification — layout, images, charts, CAPTCHA presence, or evidence of page state. Returns a PNG image (JPEG if the PNG exceeds 2.5MB). Don't use when: you only need the page's content or structure — browser_extract and browser_snapshot are far cheaper in tokens. Paid: $0.02 per call via x402 (Base USDC, Solana USDC, or XRPL XRP).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "full_page": {
                "description": "Capture the full scrollable page instead of the viewport.",
                "type": "boolean"
              },
              "session_id": {
                "description": "Session ID. Reuse the same ID to keep cookies, login state and page position across calls; a new ID starts a fresh browser.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bytes": {
                "type": "number"
              },
              "mime_type": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["bytes", "mime_type", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0f0c6ff94dfe5a6e2a76196cd5f325b278bc47868591acf1125f9ead0e7fd5ee"
        },
        {
          "name": "browser_snapshot",
          "title": "Accessibility snapshot of the current page",
          "description": "Use for: understanding page structure cheaply and deterministically — returns the accessibility tree (roles, names, states) as compact YAML instead of pixels or raw HTML. This is the lowest-token way to decide what to click or fill next. Don't use when: you need visual layout or images — use browser_screenshot. Paid: $0.005 per call via x402 (Base USDC, Solana USDC, or XRPL XRP).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "description": "Session ID. Reuse the same ID to keep cookies, login state and page position across calls; a new ID starts a fresh browser.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "snapshot": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["snapshot", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dd9f8220fef6a676e397c8b45c7502c3e432763fb3c01066c4de3c37e7c52869"
        }
      ],
      "digest": "sha256:8bbe312ef6f6afe4b66235576d5a0a08cc07996284e0d819b02bf82693f83224"
    }
  }
}
