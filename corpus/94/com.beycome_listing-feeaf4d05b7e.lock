          "digest": "sha256:003c16f01d671efbd9538be2ed573177b77e2a9393a934018fb7f5909e10d3fa"
        },
        {
          "name": "beycome_get_my_listings",
          "title": "Get my listings",
          "description": "Recovery stage — the signed-in user's properties (GET /properties).\n\nToken-scoped RESO list endpoint on the normal api base. Two main uses:\n  - After the user finishes the submit-property page\n    (`beycome_submit_property_link`): find the newly created listing\n    (typically the newest entry), CONFIRM the address with the user, then\n    use its id as ``prop_id`` for `beycome_questionnaire_link`.\n  - As the entry point for a returning user who already has listings (or\n    references \"my listing\" without an id): locate the listing and read its\n    status to pick the next step — paid but questionnaire pending →\n    `beycome_questionnaire_link`; already live → the post-publish tools\n    (`beycome_messages`, `beycome_showings`, `beycome_offers`).",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Bearer access token from beycome_signin_verify, or a previously saved token from your memory for this user.",
                "type": "string"
              }
            },
            "required": ["access_token"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get my listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:87db7a32074216d4bc6c3f5c67662b41d54bf8d21a215af4d023a57880d2e274"
        },
        {
          "name": "beycome_messages",
          "title": "Read buyer/inquiry messages",
          "description": "Post-publish stage — read the owner's buyer/inquiry messages (GET /messages).\n\nRead-only. Requires ``access_token``. Two modes:\n  - Omit ``thread`` → lists the ~20 most recent conversations, newest first,\n    one row per thread (the latest message in each). Useful fields per row:\n    ``address``, ``prop_id``, ``prop_status``, ``msg`` (latest text),\n    ``subject``, ``requested_by`` / ``email`` (the other party), ``thread``,\n    ``read_msg`` (\"0\" = unread), ``attachments``, and ``message_type``\n    (``sender`` if the owner wrote the latest message, else ``receiver``).\n  - Pass ``thread`` → returns that one conversation in full, oldest-first.\n    Use the ``thread`` value from a list row to drill in.\n\nThe list is not paginated here on purpose (the upstream ``page`` param is\noverloaded — it sets both page size and page number — so it is not exposed).\nSoft-deleted messages are dropped after paging, so a page may hold fewer than\n20 rows; that is not an error. The payload is a bare array under ``data``.\n\nA 401 means the token is no longer valid (logged out, or very old) —\nre-authenticate with `beycome_signin_start` then `beycome_signin_verify`.\nTo answer a\nmessage, use `beycome_reply_message`.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Bearer access token from beycome_signin_verify, or a previously saved token from your memory for this user.",
                "type": "string"
              },
              "thread": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Thread id to open one full conversation (the ``thread`` value from a list row). Omit to list the user's recent conversations."
              }
            },
            "required": ["access_token"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read buyer/inquiry messages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:ba365145c1ef6f81fd870b9ad1000ce8952f55d506a8f2409a6ef24f6aa9ed20"
        },
        {
          "name": "beycome_offers",
          "title": "View offers received",
          "description": "Post-publish stage — offers received on the owner's listings (GET /offers).\n\nUsed once a listing is live. Requires ``access_token``. Returns a paginated\nlist (20 per page; pass ``page`` to advance) of every offer across all of the\nsigned-in user's listings — each entry is the full offer record (buyer,\nprice, contingencies, dates, status). Read-only.\n\nThere is no server-side ``prop_id`` filter; to show offers for one listing,\nfilter client-side on each offer's ``prop_id``. Responding to an offer\n(accept / reject / counter) is not exposed here.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Bearer access token from beycome_signin_verify, or a previously saved token from your memory for this user.",
                "type": "string"
              },
              "page": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Page number of the paginated offers list (defaults to page 1)."
              }
            },
            "required": ["access_token"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "View offers received"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:e581fa490ecc1589a452b4df2d6aa6089538f9b98246397d0d7d331e3e308973"
        },
        {
          "name": "beycome_questionnaire_link",
          "title": "Get MLS questionnaire link",
          "description": "Questionnaire stage — mint a pre-authorized link to the MLS questionnaire form (POST /api/mls/questionnaire-link).\n\nRequires a PAID listing (premium active, Flat/Yes) — whether the user just\npaid on the submit-property page (`beycome_submit_property_link`) or\nalready had a paid listing with the questionnaire still pending. Returns a pre-authorized link (expires in 7 days) — this tool\nonly hands back the URL; everything else happens in the browser, with no\nlogin step. Present the URL and tell the user that on the page they will:\n  1. review the pre-filled MLS questionnaire and complete any fields Beycome\n     couldn't pre-fill,\n  2. upload property photos and the required documents,\n  3. review and submit.\nAfter they submit, the listing goes live within about 48 hours, provided all\nthe paperwork clears.\n\nFailure modes to relay plainly: 403 — the token is not the owner's; 422 —\nthe listing is not paid yet, or the questionnaire was already submitted;\n401 — bad/missing token.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Bearer access token from beycome_signin_verify, or a previously saved token from your memory for this user.",
                "type": "string"
              },
              "prop_id": {
                "description": "Property id in beycome.",
                "type": "integer"
              }
            },
            "required": ["access_token", "prop_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Get MLS questionnaire link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:87c143fe2b1908c8a07f3eb1ded76ed65f7a48175a6de4301596091093d878e7"
        },
        {
          "name": "beycome_rental_estimate",
          "title": "Estimate monthly rent",
          "description": "Discovery stage — estimate a property's monthly RENT (POST /gemini-estimate).\n\nNo account or prop_id needed. Pairs with `beycome_estimate`, but this tool\nis SPECIFICALLY for rental estimates: use it ONLY for rental inquiries or\nfor properties that have a unit number. For sale-price estimates, use\n`beycome_estimate`.\n\nReturns ``rentEstimate`` (e.g. \"$2,600\"), ``rentEstimateRange`` (e.g.\n\"$2,400 - $2,800\"), and the ``sources`` the figure was grounded on (source\nURLs are stripped to keep the response small).\n\nCaveat: an unrecognized address still returns ``success: true`` with a\ngeneric market-average rent — check that the source titles actually\nreference the property's address/city before trusting the number; if they\ndon't, treat the result as unavailable and ask the user to verify the\naddress.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Full property address in the form 'Street, City, ST ZIP' (e.g. '501 SW 1st St, Miami, FL 33130'). ZIP is required for reliable results.",
                "minLength": 5,
                "type": "string"
              },
              "unit": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional unit number (for example 304)."
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate monthly rent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:cefbccb198ba46af8c02e39c48e83941eba38dd80f6e1444781a45d29c0cb2f4"
        },
        {
          "name": "beycome_reply_message",
          "title": "Reply to a buyer/inquiry message",
          "description": "Post-publish stage — reply to a buyer/inquiry message (POST /messages/reply).\n\nSends a real message and queues a real email notification to the recipient,\nso the text you send is final — treat this as a live send, not a draft.\n\nALWAYS improve the user's drafted reply before sending: fix grammar,\nspelling, punctuation, capitalization, and formatting, and tighten wording\nfor a clear, professional tone — while preserving their meaning and intent.\nSend the corrected version, never the raw draft. When the user says \"reply\nsaying X\", treat X as a rough draft to polish, not literal text to send\nverbatim.\n\nRequires ``to_user_id`` (the counterparty), ``message``, and ``access_token``.\nFor a threaded reply pass the original ``thread`` verbatim and omit\n``subject`` (the server prefixes \"Re: <original subject>\"). To find\n``to_user_id``, open the conversation with `beycome_messages` and take the\nparticipant id that is not the signed-in owner.\n\nSuccess is 201 with ``data.id`` set to the new message id. Failures come back\nas 400 with a plain message: \"User not found.\" (bad ``to_user_id``), \"You\ncannot send a message to yourself.\" (``to_user_id`` is the sender), or\n\"Invalid parameters\" (e.g. empty/over-long ``message``). A 401 means the\ntoken is no longer valid — re-authenticate with `beycome_signin_start` then\n`beycome_signin_verify`.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Bearer access token from beycome_signin_verify, or a previously saved token from your memory for this user.",
                "type": "string"
              },
              "message": {
                "description": "The reply text to send (max 5000 chars).",
                "maxLength": 5000,
                "type": "string"
              },
              "subject": {
                "anyOf": [
                  {
                    "maxLength": 255,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional subject (max 255). Omit on a thread reply — the server derives \"Re: <original subject>\"."
              },
              "thread": {
                "anyOf": [
                  {
                    "maxLength": 255,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Thread id from the original conversation (a `beycome_messages` row's ``thread``). Pass it verbatim to keep the reply stitched to the thread."
              },
              "to_user_id": {
                "description": "Recipient's beycome user id — the counterparty in the thread (the ``fromuser``/``touser`` from a `beycome_messages` row that is NOT the signed-in owner). Cannot be the sender's own id.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["access_token", "message", "to_user_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Reply to a buyer/inquiry message"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:69344624da612146188c42438d54c5f78f1215db55c6122b00e590373bf05f84"
        },
        {
          "name": "beycome_showings",
          "title": "View showings calendar",
          "description": "Post-publish stage — calendar of showings, open houses, and offer deadlines (GET /calendar/events).\n\nUsed once a listing is live. The API requires the date range, so it defaults\nto today → +90 days when omitted (``from_date`` / ``to_date`` are\n``YYYY-MM-DD``, with ``to_date`` on or after ``from_date``). ``prop_id``\nfilters to one listing; omit it for every listing the user owns.\n\nThe response always mixes ALL event kinds — each event carries a ``type``\nfield (``showing`` / ``open_house`` / ``offer``). There is no server-side\ntype filter; when the user asks for one kind, filter on that field yourself.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Bearer access token from beycome_signin_verify, or a previously saved token from your memory for this user.",
                "type": "string"
              },
              "from_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Start of the calendar range (YYYY-MM-DD). Defaults to today."
              },
              "prop_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional — filter events to one property id; omit for all listings."
              },
              "to_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "End of the calendar range (YYYY-MM-DD). Defaults to 90 days from today."
              }
            },
            "required": ["access_token"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "View showings calendar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:5d1d5f5a9da6e7312f031957ac4d1c0b916f4efbc0821524ba20545d77a393e6"
        },
        {
          "name": "beycome_signin_start",
          "title": "Send one-time sign-in code",
          "description": "Account stage — send a one-time sign-in code (POST /auth/check-email).\n\nbeycome is passwordless — never ask the user for a password. This emails the\nuser a 6-digit code (a second, different code also goes out by SMS; either\none works). Ask the user for the code they received, then exchange it for\nthe access_token with `beycome_signin_verify`.\n\nRead the response body, not the HTTP status — the envelope's ``ok`` mirrors\nthe HTTP status, and auth failures here still return 2xx. Always check\n``data.success``:\n  - ``success: true`` (201, \"Email sent\") — code sent; ask the user for it.\n  - ``success: false`` with \"Email not found.\" (HTTP 200, ``ok: true``) —\n    no account for this email; run `beycome_signup` instead (signup also\n    sends a code).\n  - HTTP 422 (``ok: false``) — the email matched a secondary address; the\n    body still matters: it hints the masked primary login email to use\n    instead.\n\nCodes stay valid for 30 minutes. Re-running this tool sends a fresh code\nand invalidates the old one. Rate-limited (5/min and 100/day per email) —\nnever call it in a loop or as an automatic retry.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "User email address.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send one-time sign-in code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
