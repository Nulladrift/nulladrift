        },
        {
          "name": "beycome_comps",
          "title": "Find sold comparable listings",
          "description": "Discovery stage — sold comparable listings near a location (GET /comps).\n\nNo account or prop_id needed. Supports price / beds / baths / area / lot /\ntype filters. Use during discovery to support pricing alongside\n`beycome_estimate`.\n\nSlow endpoint: a cold query can take up to ~1 minute to respond — this is\nnormal, you can always retry the call if it times out. Photo URL and\nlisting-link fields are stripped from the records to keep the response\nsmall.",
          "inputSchema": {
            "properties": {
              "baths_max": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum baths."
              },
              "baths_min": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum baths."
              },
              "beds_max": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
