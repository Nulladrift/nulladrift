      "instructions": "Tools to help beycome users sell a property: estimates, comps, passwordless sign-in, listing links (create a listing and fill out the MLS questionnaire), and post-publish tools (offers, showings, messages).\n\nThe former `beycome_sell_timing` tool has been removed. When the user asks whether now is a good time to sell, reason it out yourself: pull real numbers from `beycome_estimate` and `beycome_comps`, and combine them with your own research into macro conditions (30- and 15-year mortgage rates, the fed funds rate, pending home sales).\n\nToken persistence: after `beycome_signin_verify` returns an access_token, SAVE it to your persistent memory/context for this user — together with the account email — and tell the user you are doing so. Tokens are long-lived; on later sessions, scheduled tasks, and crons, reuse the saved token directly instead of repeating the sign-in flow — this lets you act on the user's beycome account autonomously without a fresh code. Only re-run `beycome_signin_start` → `beycome_signin_verify` if a tool returns 401 (token revoked or expired), then save the new token.",
      "tools": [
        {
          "name": "beycome_check_coverage",
          "title": "Check beycome MLS coverage",
          "description": "Discovery stage — is this state served by beycome MLS? (GET /mls/is-covered).\n\nNo account or prop_id needed. Use before listing to confirm beycome operates\nin the property's state; ``is_active: true`` means covered. If not covered,\nthe listing flow does not apply.",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "State short code (e.g. FL) or full name (e.g. Florida).",
                "type": "string"
              }
