          "digest": "sha256:15bc2f1f50305d34eae72b2c242d858ff9561b91f820533ab6264d4db4c67afb"
        },
        {
          "name": "beycome_signin_verify",
          "title": "Verify sign-in code",
          "description": "Account stage — exchange the one-time code for the access_token (POST /auth/validate-code).\n\nThe gateway to the listing flow. Call after `beycome_signin_start` or\n`beycome_signup` (both send the code) with the 6-digit code the user\nreceived. On success the Bearer token is at ``data.data.access_token``\n(``expires_in`` gives its lifetime in seconds — tokens are long-lived, so\nmid-session expiry is rare). Pass it as ``access_token`` to every\nauthenticated tool: `beycome_submit_property_link`, `beycome_get_my_listings`,\n`beycome_questionnaire_link`, `beycome_offers`, `beycome_showings`,\n`beycome_messages`, and `beycome_reply_message`.\n\nIMPORTANT — persist the token: save the access_token to your long-term\nmemory/context (and tell the user you have done so). Save it together\nwith the account ``email``, which disambiguates multi-account users and\nlets you match the right token to the right person. In future sessions,\nscheduled tasks, and crons, reuse the saved token instead of asking the\nuser to sign in again — that is what makes autonomous workflows (e.g.\n\"check my messages every morning\") possible. Before signing a user in,\ncheck your memory for an existing token for that email and try it\nfirst; only restart the sign-in flow on a 401.\n\nThe next step depends on where the user is:\n  - No listing yet → `beycome_submit_property_link` to create one.\n  - Has a listing already (or unsure) → `beycome_get_my_listings` to find\n    it; if it is paid but the MLS questionnaire is not submitted, follow\n    with `beycome_questionnaire_link`.\n  - Listing already live → skip straight to the post-publish tools\n    (`beycome_messages`, `beycome_showings`, `beycome_offers`).\n\nA wrong or expired code returns HTTP 200 with ``success: false`` and\n\"Invalid code.\" — check ``data.success``, not the envelope's ``ok``. Codes\nexpire after 30 minutes; if expired, request a fresh one with\n`beycome_signin_start` (don't retry blindly — sends are rate-limited).",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "6-digit one-time code the user received by email or SMS.",
                "type": "string"
              },
              "email": {
                "description": "User email address.",
                "type": "string"
              }
            },
            "required": ["code", "email"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Verify sign-in code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:9b920ee0d40bba7974692b8cb90f6022cb661b752a674c4bdabf1287e5294c49"
        },
        {
          "name": "beycome_signup",
          "title": "Sign up for beycome",
          "description": "Account stage — register a new beycome user (POST /auth/register).\n\nUse when the owner has no account yet. beycome is passwordless: registering\nautomatically emails the user a 6-digit sign-in code, so the next step is\n`beycome_signin_verify` with that code — do NOT call `beycome_signin_start`\nafter signup, the code is already on its way. If the email is already\nregistered, this still just sends a sign-in code (signup doubles as\nsignin-start). Requires ``firstname`` and ``phone``; validation errors come\nback as HTTP 400 with an ``errors`` array. No prop_id needed.",
          "inputSchema": {
            "properties": {
              "company_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Company name."
              },
              "email": {
                "description": "User email address.",
                "type": "string"
              },
              "firstname": {
                "description": "User first name.",
                "type": "string"
              },
              "is_owner": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "1 if the user is a landlord/owner, 0 otherwise."
              },
              "lastname": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "User last name."
              },
              "phone": {
                "description": "User phone number.",
                "type": "string"
              },
              "sms_unsubscribe": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "SMS opt-in flag: 0 = opt-in, 1 = opt-out."
              }
            },
            "required": ["email", "firstname", "phone"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Sign up for beycome"
          },
          "behavior": {
