        },
        {
          "name": "beycome_submit_property_link",
          "title": "Get create-listing link",
          "description": "Listing-creation stage — mint a pre-authorized link to the submit-property page (POST /api/mls/submit-property-link).\n\nCall AFTER signing in (`beycome_signin_verify`). User-scoped — no prop_id\nexists yet. Returns a\npre-authorized link (expires in 7 days) — this tool only hands back the URL;\nthe listing is created in the browser, with no login step. Present the URL\nand tell the user that on the page they will:\n  1. fill out their property's information,\n  2. set a price,\n  3. choose a package and any add-ons,\n  4. pay.\nTell them to return to the chat once payment is complete.\n\nPrefill: the page accepts prefill params baked into the signed URL.\n  - list_address: the full property address. By this stage the user has\n    already told Claude their address (discovery ran on it), so ALWAYS pass\n    list_address so the page opens pre-filled.\n  - package: the page PRESET INDEX (1-4), not a payment reference —\n      1 = Basic $99\n      2 = Enhanced $399\n      3 = Concierge $999\n      4 = Basic + Title $199\n    WARNING: this is the page preset index, NOT an internal payPremiumOpt\n    reference number. Passing a payPremiumOpt reference here is wrong. Only\n    pass package if the user has clearly chosen a tier in chat; otherwise omit\n    it and let them pick on the page.\n\nFailure modes to relay plainly: 401 — bad/unverified token.\n\nThis page is THE way to create a listing — the property is created, priced,\nand paid for there; there is no in-chat alternative. After the user returns,\ncall `beycome_get_my_listings` to recover the new prop_id, then\n`beycome_questionnaire_link`.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Bearer access token from beycome_signin_verify, or a previously saved token from your memory for this user.",
                "type": "string"
              },
              "list_address": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Full property address to prefill the page (the address discussed in chat)."
              },
              "package": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Page preset index 1-4: 1=Basic $99, 2=Enhanced $399, 3=Concierge $999, 4=Basic+Title $199. NOT a payPremiumOpt reference."
              }
            },
            "required": ["access_token"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
