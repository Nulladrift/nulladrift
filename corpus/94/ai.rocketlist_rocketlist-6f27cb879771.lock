        {
          "name": "hiring_stats",
          "title": "Hiring statistics",
          "description": "Aggregate counts over ALL matching public Rocketlist jobs, not a sample: total jobs and companies, the top values by city, country, company, domain (vertical), company stage, work mode (remote/hybrid/on-site), job category and seniority, and published pay with sample sizes. Use it for 'how many', 'which cities/companies hire most', share and pay questions; use search_jobs for the roles themselves.\n\nQuestions the Startup Hiring Map can answer (at most one city or country, optionally domain and remote_only) are counted from the same snapshot as getedge.cc/map, so totals match the map exactly (job location; a multi-city role counts in each city). Other filters use the live catalog; the result's `source` says which.\n\nTakes the same filters as search_jobs except skills, plus:\n- group_by: subset of ['city', 'country', 'company', 'domain', 'stage', 'work_mode', 'category', 'seniority'] (default: all).\n- top: values listed per dimension, 1-50 (default 10).\n\n- query: free-text over job title, company, location and category. Matched as prefix tokens, so 'engineer' also matches 'Engineering'.\n- domain: exact company industry/vertical, e.g. ['Fintech'].\n- city: substring of the job's city or country.\n- remote_only: keep only remote roles.\n- investor: companies backed by these investors, e.g. ['Index Ventures']. Common aliases resolve ('a16z' finds Andreessen Horowitz). Populated for about 83% of hiring companies, so a company with no recorded investors is never returned when this is set.\n- stage: exact company funding stage from ['Pre-Seed', 'Seed', 'Series A', 'Series B', 'Series C', 'Series D', 'Series D+', 'Series E', 'Series F', 'Series G', 'Growth', 'Public', 'Acquired', 'Bootstrapped'], case-insensitive. About 12% of hiring companies have no stage recorded and are excluded when this is set.\n- min_experience_years / max_experience_years: bounds on the years of experience the role requires at minimum. max_experience_years=5 means 'requires 5 years or fewer'. Only about 56% of jobs state a requirement; the rest are excluded when either bound is set.\n- yc_batch: Y Combinator batches, e.g. ['F26'] or ['Fall 2026'] (W/X/S/F + year). Covers the batches in the reviewed cohort list (currently YC Fall 2026).\n- founder_origin: countries the founders come from (where they grew up or studied), by name or ISO code, e.g. ['Germany'] or ['DE']. Company-level, reviewed for the same cohorts as yc_batch; a company matches if any founder does.\n- near: a place, as an address, a street corner ('3rd and Folsom, San Francisco') or 'lat,lng'. Keeps companies whose office (the reviewed street address on getedge.cc/map) is within radius_m metres (default 1000) or walk_minutes on foot (64 m of straight line per minute). Results carry office_address, distance_m and walk_minutes, nearest first.\n- radius_m / walk_minutes: size of the near area; give one.\n",
