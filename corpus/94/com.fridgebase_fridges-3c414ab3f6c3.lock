      },
      "instructions": "FridgeBase comparison (fridgebase.com). Use list_filters to learn the criteria, search_models to find models, compare_models to choose between them. Send the user to each model's address for today's price and reviews. Markets: us = the United States (Amazon.com, in English); fr = France (Amazon.fr, in French). Pick the market from the user's country or language, and ask when it is unclear; filters and slugs belong to one market.",
      "tools": [
        {
          "name": "compare_models",
          "title": "Compare models",
          "description": "Compare 2 to 4 fridges from FridgeBase's comparison (slugs) side by side on the same criteria.",
          "inputSchema": {
            "properties": {
              "market": {
                "default": "us",
                "description": "The market: us = the United States (Amazon.com, in English), fr = France (Amazon.fr, in French). Each market has its own catalog.",
                "enum": ["us", "fr"],
                "type": "string"
              },
              "slugs": {
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["market", "slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare models"
          },
