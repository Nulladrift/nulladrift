      },
      "instructions": "Which PancakeSwap fee tier is actually paying its liquidity providers, on BNB Chain. Start free: call pancakeswap_fee_tiers with {\"address\":\"0x0e09fabb73bd3ade0a17ecc321fd13a19e81ce82\"} (a real public example, read from the chain now; put your own in its place). lp_tier_plan returns the terms of the paid answer, 0.10 USD1 over x402. Read-only: nothing here signs, holds a key or moves funds. The free toolbox for any BSC token, 30 tools: https://brainonbnb.com/mcp",
      "tools": [
        {
          "name": "lp_tier_plan",
          "description": "Which PancakeSwap fee tier is actually paying its liquidity providers, the paid half (0.10 USD1, or half that in $BOBAI, or nothing for a wallet holding 1,000,000 $BOBAI (holder pass over x402: a signature, no transaction — terms in the reply)): A pair on PancakeSwap lives in up to five pools at once — V2 at 0.25% and V3 at 0.01%, 0.05%, 0.25% and 1.00% — and every interface ranks them by the money already parked in them, which is not what they pay. This measures each tier over a live window: turnover, the fees the pool actually paid out, and what your capital would have earned in each, both sides of the pool counted. And it does the sum the way the money actually works: fees go to the liquidity standing where the trade happens, so each tier is also read at the price — the tick book of the pool itself is walked to find what is parked within a couple of percent of it — with your own size in the denominator, because arriving is what dilutes it. On a constant-product pool that is under one percent of the balance, so the tier holding the most money is regularly not the tier you would be competing with least. It names the tiers holding real money that did not trade at all, and states how long the better tier would have to keep paying before a move pays for its own gas. Not annualised: the window travels with every figure. Calling this tool returns the terms; the answer is sold over x402 at https://agent.brainonbnb.com/answer?service=lp_tier_plan (or hired through the ERC-8183 escrow for 0.10 $U).",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "task": {
                "description": "What you want, with the address in it",
                "type": "string"
              }
            },
            "type": "object"
