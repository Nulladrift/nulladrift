{
  "lockfileVersion": 2,
  "subjects": {
    "com.firstlinerestoration/tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://firstlinerestoration.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Firstline Restoration",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free property damage tools by Firstline Restoration. Each tool returns a tailored answer with its source and a link to the tool page and free quote form. General guides, not inspections.",
      "tools": [
        {
          "name": "after_a_fire_checklist",
          "title": "After a fire checklist",
          "description": "A tailored checklist for after a house or building fire: when it is safe to go in, securing the property, food and smoke cautions, and what to record for an insurer.",
          "inputSchema": {
            "properties": {
              "can_stay": {
                "description": "Can you stay in the home?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "cleared": {
                "description": "Has the fire department or your insurer said it is safe to go in?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "items_left": {
                "description": "What was left in the home. Comma separated, optional.",
                "items": {
                  "enum": ["food", "soft", "appliance", "open"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["can_stay", "cleared"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1fbc5dfabf4bcc700c1ce61bf6a4d0a29f3eb0f9226ce7cc8c727300f5bb086d"
        },
        {
          "name": "basement_flooding_subsidy_eligibility",
          "title": "Toronto basement flooding subsidy eligibility",
          "description": "Which items of the City of Toronto Basement Flooding Protection Subsidy Program apply to a home, which program conditions are met or need checking, and what to keep for the application. No dollar figures.",
          "inputSchema": {
            "properties": {
              "debts": {
                "description": "Do you owe the City any taxes or debts?",
                "enum": ["none", "owing", "unsure"],
                "type": "string"
              },
              "downspouts": {
                "description": "Are the eavestrough downspouts disconnected from the City sewer?",
                "enum": ["disconnected", "exempt", "not_disconnected", "unsure"],
                "type": "string"
              },
              "licence": {
                "description": "Does the contractor who did or will do the work hold a valid City of Toronto business licence?",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "location": {
                "description": "Where the property is.",
                "enum": ["toronto", "other"],
                "type": "string"
              },
              "months_since": {
                "description": "Months since the work was finished. Only for work already done. Optional. Unit: months.",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "ownership": {
                "description": "Are you the registered owner?",
                "enum": ["owner", "not_owner"],
                "type": "string"
              },
              "paving": {
                "description": "Do paved areas in the front yard, including parking pads, follow the City zoning by-law?",
                "enum": ["none", "complies", "unsure", "not_complies"],
                "type": "string"
              },
              "property_type": {
                "description": "Type of property.",
                "enum": ["single", "duplex", "triplex", "fourplex", "other"],
                "type": "string"
              },
              "timing": {
                "description": "When was or will the work be done?",
                "enum": ["planned", "done_after", "done_before"],
                "type": "string"
              },
              "work": {
                "description": "Work you have done or plan to do. Comma separated.",
                "items": {
                  "enum": ["plumbing_assessment", "backwater_valve", "sump_pump", "battery_backup", "weeping_tile_severance", "downspout_disconnection"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["debts", "downspouts", "licence", "location", "ownership", "paving", "property_type", "timing", "work"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4883ea797247c7c1647fc418a6081fe051c2b37a3264e771077d5d6f5befda68"
        },
        {
          "name": "dehumidifier_size_calculator",
          "title": "Dehumidifier size calculator",
          "description": "Dehumidifier capacity in pints per day for a room or basement, from its floor area and how damp it is, using the ENERGY STAR sizing table.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Floor area of the space to dry, in the chosen unit.",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              },
              "dampness": {
                "description": "How damp the space is without a dehumidifier.",
                "enum": ["mild", "damp", "wet"],
                "type": "string"
              },
              "unit": {
                "default": "ft2",
                "description": "Unit for area.",
                "enum": ["ft2", "m2"],
                "type": "string"
              }
            },
            "required": ["area", "dampness"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6ff4d385041cadf0873609bccc0041c0b5e8555dd3aaeaba2ce7f4f73b5eaf66"
        },
        {
          "name": "frozen_pipe_checker",
          "title": "Frozen pipe checker",
          "description": "Which City of Toronto frozen pipe risk factors apply, what to do tonight, and how to thaw a pipe safely.",
          "inputSchema": {
            "properties": {
              "occupancy": {
                "description": "Is the home occupied and heated?",
                "enum": ["home", "away"],
                "type": "string"
              },
              "overnight_low": {
                "description": "The overnight low forecast.",
                "enum": ["mild", "cold"],
                "type": "string"
              },
              "pipe_area_warm": {
                "description": "Do the rooms where the pipes run stay above 8 C?",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "pipe_locations": {
                "description": "Where the pipes run. Comma separated, optional.",
                "items": {
                  "enum": ["exterior", "foundation", "meter", "unheated", "cabinet"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["occupancy", "overnight_low", "pipe_area_warm"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2141bb52170f82e4fbf86c1ef50dddfe941ba6189103da82c8b9d0d0fed11af8"
        },
        {
          "name": "indoor_humidity_target_by_outdoor_temp",
          "title": "Indoor humidity target by outdoor temperature",
          "description": "The highest indoor relative humidity that limits window condensation at a given outdoor temperature, with a check against the Health Canada 30 to 50 per cent range.",
          "inputSchema": {
            "properties": {
              "current_rh": {
                "description": "Your current indoor relative humidity reading, in per cent. Optional. Unit: per cent.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "outdoor_temp": {
                "description": "Outdoor air temperature in degrees Celsius (negative for below zero). Unit: C.",
                "maximum": 40,
                "minimum": -50,
                "type": "number"
              }
            },
            "required": ["outdoor_temp"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c9d6e33a57543f0d7075c4ddac3d1eaad290a5dbc7674705b146135b09addf11"
        },
        {
          "name": "insurance_claim_checklist",
          "title": "Insurance claim document checklist",
          "description": "A tailored checklist of the photos, lists, receipts and records to collect after water, fire or storm damage.",
          "inputSchema": {
            "properties": {
              "can_stay": {
                "description": "Can you stay in the home?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "insurer_contacted": {
                "description": "Have you spoken to your insurer yet?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "loss_type": {
                "description": "What happened.",
                "enum": ["water", "fire", "storm"],
                "type": "string"
              }
            },
            "required": ["can_stay", "insurer_contacted", "loss_type"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1a230217bca4199b8dffc95d7c83e02a7460b1697e8695780ac1b328661a8072"
        },
        {
          "name": "mould_size_checker",
          "title": "Mould size checker",
          "description": "Whether mould patches are a small, medium or large area under Health Canada guidance, and when a professional is recommended.",
          "inputSchema": {
            "properties": {
              "flags": {
                "description": "Anything that applies. Comma separated, optional.",
                "items": {
                  "enum": ["hidden", "returned", "contam", "vuln"],
                  "type": "string"
                },
                "type": "array"
              },
              "largest": {
                "description": "Area of the largest single patch, in the chosen unit.",
                "minimum": 0,
                "type": "number"
              },
              "patches": {
                "description": "Number of separate patches.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "total": {
                "description": "Total area of all patches combined, in the chosen unit (raised to the largest patch if smaller).",
                "minimum": 0,
                "type": "number"
              },
              "unit": {
                "default": "m2",
                "description": "Unit for largest and total.",
                "enum": ["m2", "ft2"],
                "type": "string"
              }
            },
            "required": ["largest", "patches", "total"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:954c188d6b3e18e9bbc48566b457702b9b5f91ce873e6c4475ae1105e63c2ea2"
        },
        {
          "name": "sewage_backup_checker",
          "title": "Sewage backup checker",
          "description": "First steps after a sewage backup, health precautions, and which affected items can be cleaned and disinfected or must be thrown away.",
          "inputSchema": {
            "properties": {
              "affected_items": {
                "description": "What the sewage water reached. Comma separated, optional.",
                "items": {
                  "enum": ["carpet", "upholstery", "toys", "books", "food", "drywall", "hard", "hardtoys", "appliance"],
                  "type": "string"
                },
                "type": "array"
              },
              "electrical_hazard": {
                "description": "Is there standing water near outlets, appliances or wiring?",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "home_type": {
                "description": "What kind of home it is.",
                "enum": ["municipal", "private", "tenant"],
                "type": "string"
              },
              "household": {
                "description": "Does anyone at home fall into these groups? Comma separated, optional.",
                "items": {
                  "enum": ["child", "preg", "resp", "well"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["electrical_hazard", "home_type"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:44ec6f01a000e2230e5ff7ab56d61e1415f4cbda3b609ba1e649a04cdddd52f9"
        },
        {
          "name": "smoke_alarm_placement_checker",
          "title": "Smoke alarm placement checker",
          "description": "Where smoke alarms go in an Ontario home and the least number needed, from the storeys, bedrooms and building type, with maintenance duties for owners and tenants.",
          "inputSchema": {
            "properties": {
              "bedrooms": {
                "description": "Number of bedrooms (sleeping rooms) in the home or suite.",
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "building": {
                "description": "Type of building.",
                "enum": ["part9", "larger"],
                "type": "string"
              },
              "shared_egress": {
                "default": "no",
                "description": "Is the house one with a secondary suite, such as a basement apartment, that shares an interior exit or common area?",
                "enum": ["no", "yes"],
                "type": "string"
              },
              "sleeping_storeys": {
                "description": "How many of those storeys have bedrooms.",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "storeys": {
                "description": "Storeys in your home or suite, counting a basement.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "tenure": {
                "default": "owner",
                "description": "Your position.",
                "enum": ["owner", "tenant", "landlord"],
                "type": "string"
              }
            },
            "required": ["bedrooms", "building", "sleeping_storeys", "storeys"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:02ebaa2d5f7d011b09ab2103c82c7413661dd62da0c16c345af266a1419380bd"
        },
        {
          "name": "sump_pump_size_calculator",
          "title": "Sump pump size calculator",
          "description": "Litres per minute of rain that could reach a sump pit from a roof and paved area, using Environment and Climate Change Canada rainfall data for Toronto City or Toronto Pearson.",
          "inputSchema": {
            "properties": {
              "paved_area": {
                "default": 0,
                "description": "Paved area draining toward the pit, in the chosen unit. Optional.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "return_period": {
                "description": "How rare a storm to plan for, in years.",
                "enum": ["5", "10", "25", "50", "100"],
                "type": "string"
              },
              "roof_area": {
                "description": "Roof area (plan view, as seen from above) draining toward the pit, in the chosen unit.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "station": {
                "description": "Which rainfall station is nearer to the property.",
                "enum": ["toronto_city", "toronto_pearson"],
                "type": "string"
              },
              "storm": {
                "description": "Storm length.",
                "enum": ["15min", "30min", "1h", "2h", "6h"],
                "type": "string"
              },
              "unit": {
                "default": "m2",
                "description": "Unit for the areas.",
                "enum": ["m2", "ft2"],
                "type": "string"
              }
            },
            "required": ["return_period", "roof_area", "station", "storm"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d9065bcb9134307bd64031e82d23b9e5c13f520ae1a75a2ba6e8d0ce39c7c411"
        },
        {
          "name": "sump_pump_vs_backwater_valve",
          "title": "Sump pump vs backwater valve",
          "description": "Compare what a sump pump and backwater valve do, and prepare questions for a basement flood assessment.",
          "inputSchema": {
            "properties": {
              "observation": {
                "description": "Where water appeared, or whether you are planning ahead.",
                "enum": ["drain", "foundation", "both", "unsure"],
                "type": "string"
              }
            },
            "required": ["observation"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:001a52d21c9842a10d559a585c3d7d056983d35859ba8191ebc082e05a317f3e"
        },
        {
          "name": "water_damage_checker",
          "title": "Water damage checker",
          "description": "Likely water damage category (1, 2 or 3), the mould risk window, first safety steps and what to record for an insurer.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "How large the affected area is.",
                "enum": ["one", "several", "floor"],
                "type": "string"
              },
              "hours": {
                "description": "How long the water has been there. The page offers 12 (under 24 hours), 36 (24 to 48), 60 (48 to 72) and 96 (over 72); any number of hours works. Unit: hours.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "materials": {
                "description": "What is wet. Comma separated, optional.",
                "items": {
                  "enum": ["drywall", "carpet", "hardwood", "insulation", "ceiling", "cabinets"],
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "description": "Where the water came from.",
                "enum": ["supply", "appliance", "roof", "ground", "sewer", "toilet"],
                "type": "string"
              }
            },
            "required": ["area", "hours", "source"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f5080700eb0b4b47993b8f459fae75f05acbbb7329eeaa1cbc766692a0e3ffe"
        }
      ],
      "digest": "sha256:2c6aceec2ead66ca904553e39c646b624f168780d176f5d47545fbb7ac011843"
    }
  }
}
