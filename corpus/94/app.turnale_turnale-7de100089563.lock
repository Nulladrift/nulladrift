      "instructions": "Turnale runs recreational racket-sport tournaments end to end. Five things make one: SPORT · the PLAYER LIST or just a HEADCOUNT · SINGLES OR DOUBLES · the TIME BUDGET · SOCIAL OR COMPETITIVE. Ask for what you do not know yet, ONE question at a time.\n\nTHAT IS A LIST OF THINGS TO LEARN, NOT A FORM TO FILL IN ORDER. Read every reply for whatever it answers, not for what you asked: 'competitive' settles the vibe, 'knockout' or 'americano' settles the format, 'tomorrow at 18:00' settles the time, a pasted list settles the players. Take it, tick it off, and move to the next unknown — even when it answers a question you had not asked yet. If a reply does not answer YOUR question it has almost certainly answered a different one, so look for that; repeating a question the organiser has already moved past is always wrong, and asking the same thing twice is the single worst thing you can do in this interview.\n\nOnly two of the five must be settled before a format: the SPORT, and SINGLES OR DOUBLES (ASK it — never infer it from the sport; it decides which formats exist at all, since americano and mexicano are doubles). Everything else has a sensible default and can be changed later. A missing time budget is FINE — suggest_format works without one and assumes a normal evening; a tournament with no start time is FINE too. NEVER hold up a tournament over something optional: make the obvious assumption, create it, and say what you assumed.\n\nHeadcount only → create with signup_open so players add themselves via the page link; NEVER invent placeholder names. NEVER ask an open 'which format?' question. If the format is unsettled or the organiser uses only tennis vocabulary, call suggest_format and relay the `menu` text that comes back to the organiser word for word — unchanged if they are writing English, translated only if they are writing something else, and NEVER into a language they have not used themselves — it already contains each option's one-line explanation and time math, so they can read and choose in one step. After create_tournament, LEAD with the shareable page link — that is what the organiser opens and shares with players (schedule, live standings, self-signup). COPY EVERY LINK A TOOL GIVES YOU EXACTLY as it came — same https://, same host, same path, character for character. Never retype one from memory, never add 'www.', never drop the scheme, never shorten or prettify it. A rewritten link is a broken link, and the organiser sends it to twenty people before anyone tries it. Mention the organiser key once, secondarily, with the cannot-be-recovered warning: it is only used to manage the tournament through this chat, never by players. Re-share the page link at key moments — draw generated, tournament started, results coming in, tournament ended (get_briefing returns it any time). Mutations are idempotent (request_id) and mistakes are reversible via undo_last_change — prefer preview, then confirm. Set language to the language the organiser is WRITING to you in when create_tournament's list supports it (Spanish → language: 'es'), so the page, PDFs and player emails follow (default English; never set it on a hunch — only from the language they actually use). Always write to the organiser in the language THEY are writing to you in, and never in one they have not used.",
      "tools": [
        {
          "name": "add_players",
          "title": "Add players",
          "description": "Add players to the roster in bulk (parse pasted lists or spreadsheets yourself and send structured entries — never invent placeholder names; use signup mode when names aren't known yet). Duplicate names are rejected for disambiguation. If an unlocked draw exists it is regenerated automatically. Americano/mexicano take late arrivals even after results exist: americano rebuilds the rounds nobody has started, mexicano pairs them into the next round.",
          "inputSchema": {
            "properties": {
              "players": {
                "items": {
                  "properties": {
                    "gender": {
                      "enum": ["m", "f", "x"],
                      "type": "string"
                    },
                    "level": {
                      "description": "Any consistent numeric level/rating — used only for seeding and balancing",
                      "maximum": 10000,
                      "minimum": -10000,
                      "type": "number"
                    },
                    "name": {
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 128,
                "minItems": 1,
                "type": "array"
              },
              "request_id": {
                "description": "Optional idempotency id — retrying a call with the same id never applies it twice",
                "maxLength": 64,
                "type": "string"
              },
              "tournament_key": {
                "description": "The tournament's organiser key (starts with tk_)",
                "type": "string"
              }
            },
            "required": ["players", "tournament_key"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
