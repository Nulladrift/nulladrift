        {
          "name": "create_tournament",
          "title": "Create tournament",
          "description": "Create a new tournament. Keep setup SHORT: ask the organiser only for sport, players, court count and start time — sensible defaults cover everything else. FORMAT: never ask an open 'which format?' question. If the organiser clearly named one, pass it; otherwise omit format — the call then returns a ready-to-show menu of options (nothing is created) for you to relay so the organiser can read and choose in one reply. Players can be added later with add_players. NEVER invent placeholder or fake player names ('Player 1', made-up names): if the organiser only knows the headcount, create with signup_open: true and signup_cap set to it — players add themselves by name via the page link. If the organiser gives a time budget instead of rounds (e.g. 'we have 2 hours'), derive rounds ≈ total minutes ÷ (match + break minutes) and confirm. If they ask for a format that is not listed, offer to note it with record_feedback. Returns the organiser key (tk_…): relay it with the warning that it cannot be recovered, plus the shareable page link.",
          "inputSchema": {
            "properties": {
              "advance_per_group": {
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "break_minutes": {
                "description": "Changeover between matches/rounds, shown separately from play time (default 0)",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "court_names": {
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 16,
                "type": "array"
              },
              "courts": {
                "description": "Default 2",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "discipline": {
                "description": "Ask the organiser — never infer it from the sport. Americano/mexicano are always doubles. Defaults to singles for the bracket formats when they truly have no preference.",
                "enum": ["singles", "doubles"],
                "type": "string"
              },
              "format": {
                "description": "Tournament format. round_robin: everyone plays everyone. groups_playoff: round-robin groups then a knockout. single_elimination: knockout with byes. americano/mexicano: rotating-partner doubles, points per round (mexicano pairs each round from standings). OMIT when the organiser hasn't clearly chosen — the call then returns a menu of explained options to show them instead of creating anything.",
                "enum": ["round_robin", "groups_playoff", "single_elimination", "americano", "mexicano"],
                "type": "string"
              },
              "gender_balance": {
                "description": "Americano/mexicano: prefer matches where both teams have the same make-up (MM v MM, MW v MW, WW v WW). Default prefer_symmetric. A preference, not a rule — an uneven field cannot supply it, and the draw says so rather than distorting the rotation.",
                "enum": ["prefer_symmetric", "off"],
                "type": "string"
              },
              "group_count": {
                "maximum": 8,
                "minimum": 2,
                "type": "integer"
              },
              "house_rules": {
                "description": "Organiser's house rules, shown on the tournament page (e.g. 'Golden point at deuce')",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "language": {
                "description": "Language of the tournament page, PDFs and player emails (ISO 639-1). Default en; set it to the language the organiser is writing in when it is in this list.",
                "enum": ["en", "bg", "hr", "cs", "da", "nl", "et", "fi", "fr", "de", "el", "hu", "it", "lv", "lt", "nb", "pl", "ro", "sk", "sl", "sv", "uk", "es", "pt", "ar", "bn", "zh", "hi", "id", "ja", "ko", "ru", "tr", "ur", "vi"],
                "type": "string"
              },
              "level_gap_cap": {
                "description": "Opt-in: the largest level gap the organiser wants between opponents, in their own level units. Soft — the draw prefers to respect it and reports when it cannot. Pass 0 to clear.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "level_offset": {
                "description": "by_group only: how much stronger an m is than an f carrying the SAME number, in the organiser's own level units. Default 1 — a starting point to adjust, not a fact. Used for balancing only; never shown on the page or in standings.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "level_scale": {
                "description": "How to read the numbers in `level`. absolute (default): one shared scale, a 3 is a 3 whoever holds it. by_group: men and women were each rated within their own group, so the numbers are not directly comparable — ask the organiser which they did rather than guessing. ignore: the numbers are notes, never used for the draw.",
                "enum": ["absolute", "by_group", "ignore"],
                "type": "string"
              },
              "location": {
                "description": "Venue/location shown to players on the page, e.g. club name + city",
                "maxLength": 160,
                "type": "string"
              },
              "match_duration_minutes": {
                "maximum": 240,
                "minimum": 5,
                "type": "integer"
              },
              "name": {
                "description": "Defaults to '<Sport> tournament 14 Aug 2026 (<location>)' — start date (or today) plus the location when known",
                "maxLength": 120,
                "type": "string"
              },
              "page_results_entry": {
                "description": "Allow anyone with the page link to enter scores courtside. Default TRUE — recreational tournaments run on whoever finishes their match first, and an organiser who has to type every result is the bottleneck. Pass false if the organiser wants to be the only one recording scores; switchable either way at any time via update_settings or the toggle on the page.",
                "type": "boolean"
              },
              "pairs": {
                "description": "Doubles: fixed pairs as [name, name] arrays. Omit to auto-pair.",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "type": "array"
              },
              "players": {
                "items": {
                  "properties": {
                    "gender": {
                      "enum": ["m", "f", "x"],
                      "type": "string"
                    },
                    "level": {
                      "description": "Any consistent numeric level/rating — used only for seeding and balancing",
                      "maximum": 10000,
                      "minimum": -10000,
                      "type": "number"
                    },
                    "name": {
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 128,
                "type": "array"
              },
              "points_per_match": {
                "description": "Americano/mexicano; default 21",
                "maximum": 64,
                "minimum": 4,
                "type": "integer"
              },
              "request_id": {
                "description": "Optional idempotency id — retrying the call with the same id returns the same tournament and key instead of creating a second one. It doubles as the secret that guards that replay, so it must be at least 16 characters of your own random choosing (a UUID is ideal); short or predictable ids are refused before anything is created.",
                "maxLength": 64,
                "type": "string"
              },
              "rounds": {
                "description": "Americano/mexicano; default from player count",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "seeding": {
                "description": "Default random",
                "enum": ["random", "level"],
                "type": "string"
              },
              "signup_cap": {
                "description": "Signup limit; beyond it players join a waitlist",
                "maximum": 128,
                "minimum": 4,
                "type": "integer"
              },
              "signup_open": {
                "description": "Open self-signup: players add themselves on the shared page (name-only or signed in). Offer this when the organiser has no player list yet.",
                "type": "boolean"
              },
              "sport": {
                "description": "Write sport names to the organiser in words — 'table tennis', never the enum spelling 'table_tennis'.",
                "enum": ["tennis", "padel", "pickleball", "badminton", "squash", "table_tennis"],
                "type": "string"
              },
              "start_time": {
                "description": "ISO datetime with offset, e.g. 2026-08-01T18:00:00+03:00. Must be within 365 days from today.",
                "type": "string"
              },
              "third_place_match": {
                "description": "Single elimination; default true",
                "type": "boolean"
              }
            },
            "required": ["sport"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "draw_generated": {
                "type": "boolean"
              },
              "name": {
                "type": "string"
              },
              "page_url": {
                "type": "string"
              },
              "players_added": {
                "type": "number"
              },
              "rounds_text": {
                "description": "Present when a draw was generated — show it to the organiser as-is.",
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "tournament_key": {
                "type": "string"
              }
            },
            "required": ["draw_generated", "name", "page_url", "players_added", "summary", "tournament_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
