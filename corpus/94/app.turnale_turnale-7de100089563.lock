        {
          "name": "get_briefing",
          "title": "Get tournament briefing",
          "description": "Compact full state of the tournament — settings, roster, progress, next matches, standings, page link. Call this first when resuming work in a new conversation with just the key.",
          "inputSchema": {
            "properties": {
              "tournament_key": {
                "description": "The tournament's organiser key (starts with tk_)",
                "type": "string"
              }
            },
            "required": ["tournament_key"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "aside": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "enum": ["fact", "joke"],
                        "type": "string"
                      },
                      "lead": {
                        "type": "string"
                      },
                      "text": {
                        "type": "string"
                      }
                    },
                    "required": ["kind", "lead", "text"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Present ONLY when the tournament is set up, running, and asking nothing of the organiser — for answering 'what else can you do?', or any moment where they are plainly just chatting. NEVER volunteer it: not as a greeting, not after a result, not alongside a report. Say `lead` then `text`, nothing of your own in between. Both are English already: relay them unchanged unless the organiser is writing to you in another language. If they are, translate `lead` — but translate `text` ONLY when kind is 'fact'. A joke goes out in English word for word, whatever language you are speaking, because translating it destroys it."
              },
              "courts": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "discipline": {
                "type": "string"
              },
              "format": {
                "additionalProperties": {},
                "properties": {},
                "type": "object"
              },
              "matches_pending": {
                "type": "number"
              },
              "matches_played": {
                "type": "number"
              },
              "name": {
                "type": "string"
              },
              "next_up": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "court": {
