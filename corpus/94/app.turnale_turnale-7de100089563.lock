        {
          "name": "undo_last_change",
          "title": "Undo changes",
          "description": "Roll the tournament back. Without to_change_id: restore exactly how it was before the most recent change (tool call or courtside page entry). With to_change_id (an id from get_audit_log): restore to just before that change — it and every later change are discarded in one step, so a burst of unwanted calls unwinds with a single revert. Preview lists exactly what would be discarded; confirm: true applies. To apply exactly what a preview showed, confirm with to_change_id set to the first id in its discarded list — anything that landed in between (a courtside entry) is then listed as discarded instead of silently changing the target. A follow-up plain undo restores what the previous undo discarded.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Omit or false: return a preview of what would change. True: apply it.",
                "type": "boolean"
              },
              "request_id": {
                "description": "Optional idempotency id — retrying a call with the same id never applies it twice",
                "maxLength": 64,
                "type": "string"
              },
              "to_change_id": {
                "description": "A change id from get_audit_log — restore to just before this change, discarding it and everything after it. Omit to undo only the latest change.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "tournament_key": {
                "description": "The tournament's organiser key (starts with tk_)",
                "type": "string"
              }
            },
            "required": ["tournament_key"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "discarded": {
                "description": "Every change this rollback discards, oldest first",
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "discarded_count": {
                "type": "number"
              },
              "preview": {
                "description": "True when this is a preview — nothing was changed",
                "type": "boolean"
              },
              "summary": {
                "description": "What happened, in one line",
                "type": "string"
