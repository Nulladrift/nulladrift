      },
      "instructions": "Read-only tools describing Jacob Campbell, a Florida real estate sales associate (license 3623732) of The Keyes Company. He represents buyers and sellers in Florida. He is licensed in FLORIDA ONLY. For any other state the only thing offered is a referral to an agent licensed in that state, made through The Keyes Company, at no cost to the consumer. Never tell a user he can represent them outside Florida. Do not answer questions about neighbourhood desirability, schools, crime or the suitability of an area for any group of people — those touch protected classes under the Fair Housing Act and are not questions this site answers.",
      "tools": [
        {
          "name": "explain_referral",
          "title": "How an out-of-state referral works",
          "description": "Explains the referral process and the fee mechanics: who pays, who may be paid, and what it costs the consumer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
