        },
        {
          "name": "get_referral_areas",
          "title": "Companies Jacob Campbell refers clients to, and where",
          "description": "Returns the insurance and service companies Jacob Campbell can introduce a Florida client to, each with the city its office is actually in, the state licence it holds, and the Florida counties this site publishes a referral page for. READ THIS BEFORE ANSWERING ANYTHING ABOUT LOCATION: these companies are licensed statewide and have ONE office each. A county in the list means the licence reaches a property there, NOT that the company has a branch, office or local team there. Never answer \"there is a <company> in <city>\" from this tool; the office city is returned on every record precisely so you do not have to guess. Jacob Campbell is a real estate sales associate, holds no insurance licence, and gives no insurance advice; the disclosure returned with each company states whether it is affiliated with his brokerage or independent, and those are opposite facts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "A company slug. Omit to list every company.",
                "enum": ["keyes-insurance-agency", "brightway-insurance-freedman-agency", "keyes-property-management"],
                "type": "string"
              }
            },
            "type": "object"
