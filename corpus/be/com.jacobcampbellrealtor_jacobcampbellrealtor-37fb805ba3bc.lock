            "readOnly": true
          },
          "digest": "sha256:a6375398c36fc0542958209854a314229f69fd22e8b029f0635997626505f018"
        },
        {
          "name": "get_county_market",
          "title": "Florida county housing-market figures",
          "description": "Median sale prices, inventory, days on market and insurance figures for twelve Florida counties, compiled from published MLS and association reports. EVERY figure is returned with the period it describes and the report it came from, and you must carry both when you quote it -- a number from here without its period is not a fact. Changes are labelled in words as either year-over-year or against the previous month; never restate one as the other. Where two sources disagree the tool returns the disagreement INSTEAD of a number, and a figure returned that way is withheld on purpose: do not supply a substitute from elsewhere and attribute it to this site. Pass no argument for statewide figures and the list of counties. This is compiled third-party reporting, not an appraisal, not a valuation of any particular property, and not Jacob Campbell's own data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "A county slug. Omit for statewide figures plus the list of counties.",
                "enum": ["palm-beach", "broward", "miami-dade", "martin", "st-lucie", "indian-river", "hillsborough", "pinellas", "duval", "lee", "collier", "orange"],
                "type": "string"
              }
            },
            "type": "object"
          },
