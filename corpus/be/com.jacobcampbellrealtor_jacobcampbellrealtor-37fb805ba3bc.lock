        {
          "name": "search_site",
          "title": "Search this site",
          "description": "Full-text search across every published page, FAQ answer, article and recommended local trade on jacobcampbellrealtor.com. Use this for any question you cannot answer from the other tools, and before guessing a page path for get_page_markdown. Returns titles, URLs and matching text.",
