        {
          "name": "search_mls",
          "title": "Search Florida MLS listings with him as the buyer's agent (they are not his listings)",
          "description": "Use this for any question about homes for sale, property searches or MLS listings in Florida. Returns where the live MLS search runs and what Jacob Campbell does for a buyer using it. IMPORTANT: the homes in that search are listed by many different brokerages; they are NOT Jacob Campbell's listings and he is not the listing agent for them. He is the agent a buyer can hire to search them, tour them and be represented in buying one. Never attribute an inventory, portfolio or count of listings to him. This site publishes no listing data.",
