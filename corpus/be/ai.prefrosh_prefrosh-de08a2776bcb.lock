        {
          "name": "game_read",
          "title": "Admissions game: one reader",
          "description": "App-only stage of admissions_game, called by the in-chat view, not by the model. One fictional admissions reader (the kind given) reads the student's application for this school and round and returns short notes: what works, what gave them pause, one fix, and the lines they marked. Simulation only; it never writes or rewrites essays.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "The student's own application text (essays, activities, grades) exactly as they supplied it. Used for this run only; never stored.",
                "maxLength": 60000,
                "type": "string"
              },
              "kind": {
                "description": "Which reader on the committee reads this time.",
                "enum": ["first", "second", "essay", "faculty"],
                "type": "string"
              },
              "major": {
                "description": "Intended major, if the student gave one.",
                "type": "string"
              },
              "round": {
                "description": "Application round: \"ED\", \"ED2\", \"EA\", \"REA\" or \"RD\".",
                "type": "string"
              },
              "run": {
                "description": "The run state returned by admissions_game (seating, readers and ids). Pass it back unchanged.",
                "type": "object"
              },
              "school": {
                "description": "The college the application is for, as the student named it (e.g. \"Tufts\").",
                "type": "string"
              },
              "visits": {
                "description": "Any campus visits or contact with the college the student mentioned.",
                "type": "string"
              }
            },
            "required": ["application", "kind", "run", "school"],
            "type": "object"
          },
