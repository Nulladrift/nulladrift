      "serverInfo": {
        "name": "prefrosh",
        "title": "prefrosh.ai",
        "version": "1.0.1",
        "websiteUrl": "https://prefrosh.ai"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
