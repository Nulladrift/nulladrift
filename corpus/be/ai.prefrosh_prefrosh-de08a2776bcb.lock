        {
          "name": "my_odds",
          "title": "My admission odds",
          "description": "Estimate a student's admission odds at one or more colleges, by round, with a likely range, from GPA and test scores (plus optional class rank, home state, legacy, first-generation, aid). Same model as prefrosh.ai/chance. Always tell the user this is an estimate from grades and scores only; essays, activities and recommendations can move it a lot. Needs at least a GPA or a test score; ask for them if missing rather than guessing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "act": {
                "description": "Best ACT composite.",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "class_rank": {
                "description": "Class rank bucket, if known (percent of class).",
                "enum": ["top5", "top10", "top25", "top50", "below"],
                "type": "string"
              },
              "first_gen": {
                "description": "First in family to attend a four-year college.",
                "type": "boolean"
              },
              "gpa": {
                "description": "Unweighted GPA, ideally on a 4.0 scale (a 100-point average also works).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "home_state": {
                "description": "Two-letter US state the student lives in (matters for public universities).",
                "type": "string"
              },
              "legacy": {
                "description": "A parent attended this college.",
                "type": "boolean"
              },
              "needs_aid": {
                "description": "Will apply for need-based aid (default true).",
                "type": "boolean"
              },
              "sat": {
                "description": "Best total SAT (superscore is fine).",
                "maximum": 1600,
                "minimum": 400,
                "type": "integer"
              },
              "schools": {
                "description": "College names.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["schools"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "My admission odds"
