      },
      "instructions": "prefrosh.ai is a free college search for high school students. Use school_card for facts about one college, compare for 2-4, my_odds for a student's estimated chances (an estimate from grades and scores only), and admissions_game to run a student's own application past a simulated admissions committee. Cite the prefrosh.ai link each result carries. Never write or rewrite application essays for the student.",
      "tools": [
        {
          "name": "admissions_game",
          "title": "The admissions game",
          "description": "Run the student's application past prefrosh.ai's simulated admissions committee for one college and round: five fictional readers (first, second, essay and faculty readers, and a dean who chairs) read it, argue, vote (accept / waitlist or defer / deny), and give the top 3 fixes. It is a simulation, not a prediction. Takes about a minute; the room plays out in the view. Pass the student's own application text exactly as they gave it (essays, activities, grades, scores) in \"application\"; never write, invent or improve content for them. If they have not shared their application, ask them to paste it first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "application": {
                "description": "The student's application as they gave it: essays, activities, grades, scores, notes. Verbatim.",
                "maxLength": 60000,
                "minLength": 80,
                "type": "string"
              },
              "major": {
                "description": "Intended major, if stated.",
                "type": "string"
              },
              "round": {
                "description": "Application round. Default RD.",
                "enum": ["ED", "EDII", "EA", "REA", "RD"],
                "type": "string"
              },
              "school": {
                "description": "College name.",
                "type": "string"
              },
              "visited_campus": {
                "description": "Campus visits, if the student said.",
                "enum": ["none", "once", "twice"],
                "type": "string"
              }
            },
            "required": ["application", "school"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The admissions game"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://prefrosh/view-v2.html",
            "ui": {
              "resourceUri": "ui://prefrosh/view-v2.html"
            },
            "ui/resourceUri": "ui://prefrosh/view-v2.html"
          },
          "digest": "sha256:34344a5fead9c4ee67d2a7266149d96a49e1e30dd0abfb31b6290b7c335f143d"
        },
        {
          "name": "compare",
          "title": "Compare colleges",
          "description": "Compare 2 to 4 colleges side by side: admit rates by round, SAT/ACT ranges, testing policy, sticker cost, average net price, graduation rate, size and setting. If GPA or scores are given, adds the student's estimated odds (same model as prefrosh.ai/chance).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "act": {
                "description": "Best ACT composite.",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "gpa": {
                "description": "Unweighted GPA, ideally on a 4.0 scale (a 100-point average also works).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "home_state": {
                "description": "Two-letter US state the student lives in (matters for public universities).",
                "type": "string"
              },
              "sat": {
                "description": "Best total SAT (superscore is fine).",
                "maximum": 1600,
                "minimum": 400,
                "type": "integer"
              },
              "schools": {
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["schools"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare colleges"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
