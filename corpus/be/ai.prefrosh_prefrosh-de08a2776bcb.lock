        },
        {
          "name": "game_debrief",
          "title": "Admissions game: the fixes",
          "description": "App-only stage of admissions_game, called by the in-chat view after the vote. The committee chair writes the debrief: the three changes that would most help this application, each pointing to the student's own words. Simulation only; it never writes or rewrites essays.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "The student's own application text (essays, activities, grades) exactly as they supplied it. Used for this run only; never stored.",
                "maxLength": 60000,
                "type": "string"
              },
              "major": {
                "description": "Intended major, if the student gave one.",
                "type": "string"
              },
              "readers": {
                "description": "Every reader's notes from game_read, keyed by reader.",
                "type": "object"
              },
              "round": {
                "description": "Application round: \"ED\", \"ED2\", \"EA\", \"REA\" or \"RD\".",
                "type": "string"
              },
              "run": {
                "description": "The run state returned by admissions_game (seating, readers and ids). Pass it back unchanged.",
                "type": "object"
              },
              "school": {
                "description": "The college the application is for, as the student named it (e.g. \"Tufts\").",
                "type": "string"
              },
              "visits": {
                "description": "Any campus visits or contact with the college the student mentioned.",
                "type": "string"
              }
            },
            "required": ["application", "readers", "run", "school"],
            "type": "object"
          },
          "annotations": {
