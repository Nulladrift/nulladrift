    "ai.wondel/otodom": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/otodom/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Otodom",
        "title": "Otodom MCP",
        "version": "1.0.0",
        "description": "Polish property on Otodom.pl: flats, houses, rooms, plots, commercial to buy or rent; offer details.",
        "websiteUrl": "https://mcps.wondel.ai/servers/otodom/",
        "icons": [
          {
            "src": "https://mcps.wondel.ai/favicon.svg",
            "mimeType": "image/svg+xml"
          },
          {
            "src": "https://mcps.wondel.ai/logo-96-inverse.png",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from Otodom (https://www.otodom.pl) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "otodom_offer",
          "title": "Get one Otodom listing",
          "description": "Full details of one otodom.pl listing (or a developer's project page): price, czynsz (rent_extra) and deposit (PLN), price per m², area and plot area, rooms, floor and the building's floor count, year built, building type and material, heating, ownership, condition, windows, energy certificate, availability date, market, address with district and coordinates, seller type and agency name, amenities/equipment as `features`, every other stated attribute in `details`, the full description and photo URLs. Contact phone numbers are not returned. For a development project, `development` gives its unit count, area range and completion date. Get the slug from otodom_search. Fetched live from otodom.pl (typically 0.3–1 s via direct fetch; ~5–10 s when it falls back to an unblocker). Result: { source, fetchedAt, offer: { id, slug, url, title, status, type, transaction, kind, market, price, rent_extra, deposit, price_per_m2, currency, price_on_request, area_m2, plot_area_m2, rooms, floor, floors_in_building, year_built, building_type, building_material, heating, ownership, condition, windows, energy_certificate, available_from, address, location_id, geo, seller_type, agency_name, agency_url, date_created, date_modified, features, details, description, photos, development? } }. Codes such as heating 'urban' (district heating) or condition 'ready_to_use' are Otodom's own. A removed listing is an error that says so.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "no_cache": {
                "description": "Force a fresh fetch and bypass this server's result cache (5 min). Default false.",
                "type": "boolean"
              },
              "offer": {
                "description": "The listing's slug from otodom_search (ends in -ID<code>, e.g. 'mieszkanie-4-pokojowe-w-mokotowie-z-balkonem-ID4sFig') or its otodom.pl URL (/pl/oferta/… or /pl/inwestycja/…).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["offer"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9cac7f13f2ddaa530294d0330fd6c819f704baa26637f2ebbb05510c8844bf43"
        },
        {
          "name": "otodom_search",
          "title": "Search Otodom real-estate listings (otodom.pl)",
          "description": "Search property listings on otodom.pl, Poland's largest real-estate portal: flats, studios, houses, rooms, plots, commercial premises, warehouses, garages and developers' new projects, for sale or for rent. Filter by place (a city, 'city district', town, village or voivodeship, resolved by Otodom's own location search), price, area, rooms, private-owner vs agency listings and primary/secondary market; sort by newest, price or area. Returns one results page (24 by default) with each listing's price, czynsz, price per m², area, rooms, floor, place, seller type and link; pass a listing's `slug` to otodom_offer for full details. Fetched live from otodom.pl (typically 0.3–1 s via direct fetch; ~5–10 s when it falls back to an unblocker). Result shape: { source, fetchedAt, query, search_url, heading, resolved_location, other_locations?, total_count, page, page_size, total_pages, count, listings: [...], note?, warning? } — the list key is `listings`; `total_count` counts matches across all pages (use `page` for more). Each listing: { id, slug, url, title, kind, price, rent_extra, price_per_m2, currency, price_on_request, area_m2, plot_area_m2, rooms, floor, location, street, district, city, region, location_id, seller_type, agency_name, features, is_promoted, date_created, image, photos_count, description, development? }. Prices are numbers in PLN: for rentals `price` is the monthly rent, and `rent_extra` is the monthly administrative fee (czynsz) paid on top (stated on sales too); `price` is null with price_on_request true when the advertiser hides it. `floor` is 'ground', '1'…'10', '10+', 'basement' or 'attic'. `kind` is 'new_development' for a developer's project (its units' ranges in `development`), else 'listing'; `seller_type` is private | agency | developer. `resolved_location` says which place was searched — check it; `other_locations` lists other matches for the name (pass one's `id` as `location`). An empty match answers count: 0 with a `note` saying why and what to change — that is a successful result, not an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area_max": {
                "description": "Maximum area in m² (the plot's area for type 'plot').",
                "minimum": 0,
                "type": "number"
              },
              "area_min": {
                "description": "Minimum area in m² (the plot's area for type 'plot').",
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "description": "Listings per page; rounded up to a size Otodom serves (24, 36, 48 or 72). Default 24.",
                "maximum": 72,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Where, in Polish spelling as the site uses it: a city ('Warszawa', 'Kraków'), 'city district' ('Warszawa Mokotów', 'Gdańsk Wrzeszcz'), a town or village ('Zakopane'), or a voivodeship ('mazowieckie'). English names ('Warsaw') are not recognised. Also accepts an Otodom location id (slug path) from a previous result's `location_id`/`resolved_location.id`, e.g. 'mazowieckie/warszawa/warszawa/warszawa/mokotow'. Omit to search all of Poland.",
                "minLength": 1,
                "type": "string"
              },
              "market": {
                "description": "Sales only: 'primary' = new-build from a developer (rynek pierwotny), 'secondary' = resale (rynek wtórny). Omit for both.",
                "enum": ["primary", "secondary"],
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh fetch and bypass this server's result cache (5 min). Default false.",
                "type": "boolean"
              },
              "owner_type": {
                "description": "'private' = only listings posted by private owners (bez pośredników), 'agency' = only agencies and developers (sales only — Otodom has no agency-only filter for rentals), 'all' (default).",
                "enum": ["all", "private", "agency"],
                "type": "string"
              },
              "page": {
                "description": "Results page, 1-based. Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "price_max": {
                "description": "Maximum price in PLN (the monthly rent when transaction is 'rent').",
                "minimum": 0,
                "type": "number"
              },
              "price_min": {
                "description": "Minimum price in PLN (the monthly rent when transaction is 'rent').",
                "minimum": 0,
                "type": "number"
              },
              "rooms_max": {
                "description": "Maximum number of rooms — types 'flat' and 'house' only (min = max for exactly N). Otodom's filter stops at '6 or more', so any bound of 6+ means 6 or more.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "rooms_min": {
                "description": "Minimum number of rooms — types 'flat' and 'house' only.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Order: 'relevance' (Otodom's default, promoted listings first), 'newest', 'oldest', 'price_asc', 'price_desc', 'area_asc', 'area_desc'.",
                "enum": ["relevance", "newest", "oldest", "price_asc", "price_desc", "area_asc", "area_desc"],
                "type": "string"
              },
              "transaction": {
                "description": "'sale' = na sprzedaż (buying), 'rent' = na wynajem (renting; prices are monthly).",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "type": {
                "description": "Property type: 'flat' = mieszkanie, 'studio' = kawalerka (one-room flat), 'house' = dom, 'room' = pokój (rent only), 'plot' = działka (land), 'commercial' = lokal użytkowy (office, shop, premises), 'warehouse' = hala/magazyn, 'garage' = garaż/miejsce parkingowe, 'new_development' = a developer's project (inwestycja; sale only).",
                "enum": ["flat", "studio", "house", "room", "plot", "commercial", "warehouse", "garage", "new_development"],
                "type": "string"
              }
            },
            "required": ["transaction", "type"],
            "type": "object"
          },
