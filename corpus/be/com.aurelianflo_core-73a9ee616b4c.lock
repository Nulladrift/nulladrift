        {
          "name": "wallet_screen",
          "title": "Wallet Screen",
          "description": "Screen 1-100 crypto wallet addresses against OFAC sanctions lists (SDN by default). Returns exact matches with sanctioned-entity details, address validation, a proceed-or-review decision and signed provenance. Optional: PDF/DOCX report (output_format) and, for a single EVM, TRON or Bitcoin address, indirect exposure through counterparties (exposure_depth).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "One wallet address to screen. Use this or addresses.",
                "minLength": 10,
                "type": "string"
              },
              "addresses": {
                "description": "1-100 wallet addresses to screen in one call. Use this or address.",
                "items": {
                  "description": "Wallet address to screen.",
                  "minLength": 10,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "asset": {
                "description": "Optional asset or network ticker filter such as ETH, USDC, XBT, TRX, ARB, or BSC.",
                "minLength": 2,
                "type": "string"
              },
              "case_reference": {
                "description": "Optional case reference to file the saved result under.",
                "maxLength": 120,
                "type": "string"
              },
              "chains": {
                "description": "Chains to examine for indirect exposure: EVM chain IDs, \"tron\" or \"bitcoin\". When omitted, the chain follows from the address: 0x... is Ethereum (\"1\"), T... is TRON, a Bitcoin address is Bitcoin. A chain that cannot hold the address is rejected.",
                "items": {
                  "enum": ["1", "10", "100", "137", "8453", "42161", "tron", "bitcoin"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "exposure_depth": {
                "description": "Single EVM, TRON or Bitcoin address only: also check indirect exposure (1 = direct counterparties, 2 = their counterparties). Adds to the price.",
                "enum": [1, 2],
                "type": "number"
              },
              "lists": {
                "description": "Sanctions lists to screen against. Defaults to [\"ofac_sdn\"]. Optional additions: \"ofac_consolidated\" (OFAC's non-SDN lists), \"uk_sanctions\" (UK Sanctions List), \"eu_consolidated\" (EU consolidated financial sanctions list) and \"un_consolidated\" (UN Security Council list). The UK and EU lists name only a few wallet addresses and the UN list none, so those three mostly matter for subject-name screening in compliance_edd_report. Every match names its list. If a requested list cannot be loaded the call fails instead of returning a partial result.",
                "items": {
                  "enum": ["ofac_sdn", "ofac_consolidated", "uk_sanctions", "eu_consolidated", "un_consolidated"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "lookback_days": {
                "description": "Days of transfer history to examine for indirect exposure (default 180).",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "min_amount_usd": {
                "description": "Ignore transfers below this USD value when checking indirect exposure. Transfers without a known price are kept.",
                "minimum": 0,
                "type": "number"
              },
              "output_format": {
                "description": "json (default) for the structured result, or pdf/docx to also get a generated report artifact (adds $0.05).",
                "enum": ["json", "pdf", "docx"],
                "type": "string"
              },
              "save": {
                "description": "Keep this result in your account so it can be retrieved later with saved_results. Needs sign-in or an API key; off by default.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
