                  "additionalProperties": true,
                  "properties": {
                    "address": {
                      "description": "Wallet address these details describe.",
                      "minLength": 10,
                      "type": "string"
                    },
                    "exposure_usd": {
                      "description": "Dollar exposure associated with this wallet.",
                      "type": "number"
                    },
                    "label": {
                      "description": "A name to show for this wallet.",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "relationship_tier": {
                      "description": "Relationship tier for this wallet.",
                      "enum": ["low", "standard", "high", "critical"],
                      "type": "string"
                    }
                  },
                  "required": ["address"],
                  "type": "object"
                },
                "type": "array"
              },
              "addresses": {
                "description": "Wallet addresses to examine, up to 20. Each costs $0.04.",
                "items": {
                  "description": "Wallet address to examine.",
                  "minLength": 10,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
