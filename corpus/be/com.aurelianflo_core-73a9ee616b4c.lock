        {
          "name": "wallet_watchlist_alerts",
          "title": "Watchlist Alert Settings",
          "description": "Change how watchlist alerts reach you: set or clear the alert webhook, and turn email alerts on or off. Setting a webhook returns its signing secret once. Setting a webhook again replaces the webhook and its signing secret with a new one, and the earlier secret stops working, so call it again only when you mean to. An empty webhook_url removes the webhook. To read the current settings (webhook URL and whether email alerts are on), use wallet_watchlist. Scoped to your account: needs sign-in (/mcp/account) or an API key. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email_alerts": {
                "description": "Whether alerts are also emailed to the account's address.",
                "type": "boolean"
              },
              "response_detail": {
                "description": "summary (default) returns a short text summary for the model to read; the full result is always in structuredContent. full returns the whole result as JSON text.",
                "enum": ["summary", "full"],
