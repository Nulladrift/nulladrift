        {
          "name": "sanctions_party_screen",
          "title": "Sanctions Party Screen",
          "description": "Screen 1-100 person, company or vessel names against the OFAC SDN, UK, EU and UN sanctions lists, without needing a wallet. Matching is token-aware and fuzzy, over listed names and aliases. Optional type, country, date of birth and ID number are compared with each candidate's listed record, and every candidate reports which identifiers agree, disagree or were not available, plus its score components, so a discounted candidate can be documented. Each name gets a status: match (score 0.95 or higher), possible (at or above min_score, default 0.88) or no_match, with up to 5 candidates. no_match means no listed party scored at or above the threshold on the lists checked; it does not clear the name. Results carry a screening_id and signed provenance, and are leads for human review. Price without an account: $0.01 per name or alias, at most $0.10 per call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lists": {
                "description": "Lists to check. Defaults to all four: ofac_sdn, uk_sanctions, eu_consolidated and un_consolidated. If a requested list cannot be loaded the call fails instead of returning a partial result.",
                "items": {
                  "enum": ["ofac_sdn", "uk_sanctions", "eu_consolidated", "un_consolidated"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "min_score": {
                "description": "Lowest name score that counts as a candidate. Defaults to 0.88. A score of 0.95 or higher is always a match, so values above 0.95 work as 0.95.",
                "maximum": 1,
                "minimum": 0.5,
                "type": "number"
              },
              "names": {
                "description": "1-100 names to screen in one call. Names and aliases together are at most 100: each alias counts like a name.",
                "items": {
                  "additionalProperties": false,
                  "description": "One name to screen, with optional details that help tell a listed party from a different person or company with a similar name.",
                  "properties": {
                    "aliases": {
                      "description": "Other names this party is known by. Each one is screened too.",
                      "items": {
                        "description": "Another name this party is known by.",
                        "maxLength": 160,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "country": {
                      "description": "Country of residence, nationality or registration, as a name or a two-letter code. Compared with the listed party's countries when the list states them.",
                      "maxLength": 160,
                      "type": "string"
                    },
                    "date_of_birth": {
                      "description": "Date of birth as YYYY, YYYY-MM or YYYY-MM-DD. Compared with the listed party's dates of birth when the list states them.",
                      "pattern": "^\\d{4}(-\\d{2}(-\\d{2})?)?$",
                      "type": "string"
                    },
                    "id_number": {
                      "description": "A passport, national ID or registration number. Compared with the listed party's ID numbers when the list states them.",
                      "maxLength": 160,
                      "type": "string"
                    },
                    "name": {
                      "description": "The person, company or vessel name to screen.",
                      "maxLength": 160,
                      "minLength": 1,
                      "type": "string"
                    },
                    "type": {
                      "description": "What the name belongs to. Compared with the listed party's type when the list states one.",
                      "enum": ["person", "entity", "vessel"],
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "response_detail": {
                "description": "summary (default) returns a short text summary to the model; full returns the full JSON as text. The structured result is the same either way.",
                "enum": ["summary", "full"],
                "type": "string"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "description": "Structured name screening result.",
            "properties": {
              "accepts": {
                "description": "Present when payment is needed: the x402 payment requirements to sign.",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
