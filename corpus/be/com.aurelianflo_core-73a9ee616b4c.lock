        {
          "name": "compliance_exposure_report",
          "title": "Exposure Report",
          "description": "Report each wallet's exposure to sanctioned addresses from evidence: whether it is listed now, and whether its own on-chain transfers in the lookback period were sent to or received from listed addresses (direct counterparties, on Ethereum, TRON or Bitcoin by address type). Each wallet comes back as listed, exposed, none found in what was read, or not established, with the listed parties, transfer counts and what was read. Listed means an exact match on the OFAC SDN list. It does not predict future listings. $0.04 per wallet, up to 20 wallets per call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address_metadata": {
                "description": "Optional details per wallet. They label the rows and break ties in the order; they do not change what is found.",
