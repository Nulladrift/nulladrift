        {
          "name": "compliance_exposure_report",
          "title": "Exposure Report",
          "description": "Report each wallet's exposure to sanctioned addresses from evidence: whether it is listed now, and whether its own on-chain transfers in the lookback period were sent to or received from listed addresses. Every wallet is read, including wallets that are already listed, so a listed wallet still shows its counterparties. Each wallet comes back as listed, exposed, none found in what was read, or not established, with the listed parties, transfer counts and a coverage block that says what was read and whether the read was partial. Use chains to read EVM wallets on Ethereum, Base, Arbitrum, Optimism, Polygon or Gnosis, and depth 2 to also check counterparties of counterparties. Listed means an exact match on the OFAC SDN list. It does not predict future listings. Up to 20 wallets per call. To keep the report in your account, call saved_results_save with its screening_id. Price without an account: $0.04 per wallet at depth 1, or $0.14 per wallet at depth 2 (the same as the indirect exposure add-on on wallet_screen), up to 20 wallets per call. PDF/DOCX output adds $0.05.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address_metadata": {
                "description": "Optional details per wallet. They label the rows and break ties in the order; they do not change what is found.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "address": {
                      "description": "Wallet address these details describe.",
                      "minLength": 10,
                      "type": "string"
                    },
                    "exposure_usd": {
                      "description": "Dollar exposure associated with this wallet.",
                      "type": "number"
                    },
                    "label": {
                      "description": "A name to show for this wallet.",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "relationship_tier": {
                      "description": "Relationship tier for this wallet.",
                      "enum": ["low", "standard", "high", "critical"],
                      "type": "string"
                    }
                  },
                  "required": ["address"],
                  "type": "object"
                },
                "type": "array"
              },
              "addresses": {
                "description": "Wallet addresses to examine, up to 20.",
                "items": {
                  "description": "Wallet address to examine.",
                  "minLength": 10,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "asset": {
                "description": "Optional asset or network ticker filter for the listed-now check, such as ETH, USDC, XBT or TRX. It never hides a listed address: one listed under another asset is still a match, with assetFilterMatched false in the summary. Letters and digits only, 2 to 10 characters.",
                "minLength": 2,
                "pattern": "^[A-Za-z0-9]{2,10}$",
                "type": "string"
              },
              "chains": {
                "description": "Chains to read, as EVM chain IDs (1 Ethereum, 10 Optimism, 100 Gnosis, 137 Polygon, 8453 Base, 42161 Arbitrum), \"tron\" or \"bitcoin\". When omitted, each wallet is read on the chain its address belongs to (a 0x address on Ethereum). Each wallet is read only on the listed chains that can hold its address; a wallet that none of them can hold is reported as not established.",
                "items": {
                  "enum": ["1", "10", "100", "137", "8453", "42161", "tron", "bitcoin"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "depth": {
                "description": "1 (default) reads each wallet's direct counterparties. 2 also follows the largest counterparties to their own counterparties. Depth 2 takes three of an account's daily exposure reads per wallet instead of one, and has a higher price without an account.",
                "enum": [1, 2],
                "type": "number"
              },
              "lookback_days": {
                "description": "How far back to read transfers, in days. Default 180.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "output_format": {
                "description": "json (default) for the structured result, or pdf/docx to also get a generated report artifact.",
                "enum": ["json", "pdf", "docx"],
                "type": "string"
              },
              "response_detail": {
                "description": "summary (default) returns a short text summary for you to read, with the full result in structuredContent. full returns the full JSON as text as well.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "title": {
                "description": "Optional report title.",
                "type": "string"
              }
            },
            "required": ["addresses"],
            "type": "object"
          },
          "outputSchema": {
