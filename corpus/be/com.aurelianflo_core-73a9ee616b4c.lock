                "additionalProperties": true,
                "description": "The provenance object from the result, unchanged. Give it with data, or give screening_id instead.",
                "properties": {},
                "type": "object"
              },
              "screening_id": {
                "description": "The ID of a result stored for your account (a saved result, or one produced in the last 15 minutes). The server checks the stored copy. Needs sign-in or an API key.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
