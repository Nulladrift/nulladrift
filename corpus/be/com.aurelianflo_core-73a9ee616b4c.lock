        {
          "name": "compliance_queue_optimize",
          "title": "Compliance Review Queue Optimizer",
          "description": "Optimize a compliance review queue using current OFAC exact matches, future exposure probabilities, exposure value, relationship tier, recency, and reviewer capacity. Use this when review_items and review_budget are known; use compliance_exposure_forecast for probability-only analysis or compliance_edd_report for a case memo.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "Optional asset or network ticker filter such as ETH, USDC, XBT, TRX, ARB, or BSC.",
