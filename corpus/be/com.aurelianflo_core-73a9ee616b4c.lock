          "description": "Build an enhanced due diligence memo for a subject and its wallets: exact-match OFAC wallet screening, subject-name screening against sanctioned parties, sanctions evidence, and follow-up actions, returned as structured JSON or an inline PDF/DOCX artifact. Wallet addresses are optional: without them the memo covers the subject name only and says no wallets were supplied. Use this for case handoff; use wallet_screen for screening-only results. To keep the memo in your account, call saved_results_save with its screening_id. Price without an account: $0.25 per call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "addresses": {
                "description": "Crypto wallet addresses to screen for OFAC sanctions exposure and include in the enhanced due diligence memo. Optional: leave it out for a memo on the subject name alone, and the memo will say no wallets were supplied.",
                "items": {
                  "description": "Crypto wallet address to screen for OFAC sanctions exposure and include in the enhanced due diligence memo.",
                  "minLength": 10,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "artifact_only": {
                "description": "When output_format is pdf or docx, return a compact artifact-first response without the full memo payload.",
                "type": "boolean"
              },
              "asset": {
                "description": "Optional asset or network ticker filter such as ETH, USDC, XBT, TRX, ARB, or BSC. It never hides a listed address: one listed under another asset is still a match, with assetFilterMatched false in the summary. Letters and digits only, 2 to 10 characters.",
                "minLength": 2,
                "pattern": "^[A-Za-z0-9]{2,10}$",
                "type": "string"
              },
              "case_name": {
                "description": "Optional case or review title shown in the memo.",
                "type": "string"
              },
              "jurisdiction": {
                "description": "Optional jurisdiction or operating region for the case.",
                "type": "string"
              },
              "lists": {
                "description": "Sanctions lists to screen against. Defaults to [\"ofac_sdn\"]. Optional additions: \"ofac_consolidated\" (OFAC's non-SDN lists), \"uk_sanctions\" (UK Sanctions List), \"eu_consolidated\" (EU consolidated financial sanctions list) and \"un_consolidated\" (UN Security Council list). The UK and EU lists name only a few wallet addresses and the UN list none, so those three mostly matter for subject-name screening in compliance_edd_report. Every match names its list. If a requested list cannot be loaded the call fails instead of returning a partial result.",
                "items": {
                  "enum": ["ofac_sdn", "ofac_consolidated", "uk_sanctions", "eu_consolidated", "un_consolidated"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "output_format": {
                "description": "Select json for the structured memo payload or pdf|docx for a generated artifact.",
                "enum": ["json", "pdf", "docx"],
                "type": "string"
              },
              "reference_id": {
                "description": "Optional internal case or review reference.",
                "type": "string"
              },
              "requested_by": {
                "description": "Optional requester, owner, or reviewing team.",
                "type": "string"
              },
              "response_detail": {
                "description": "summary (default) returns a short text summary for the model to read; the full result is always in structuredContent. full returns the whole result as JSON text.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "review_reason": {
                "description": "Optional reason the EDD memo is being prepared.",
                "type": "string"
              },
              "subject_aliases": {
                "description": "Other names the subject is known by; each is also screened against sanctioned party names and aliases.",
                "items": {
                  "maxLength": 160,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "subject_name": {
                "description": "Human-readable subject or counterparty name for the memo.",
                "minLength": 2,
