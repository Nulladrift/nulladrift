        {
          "name": "wallet_payee_check",
          "title": "Wallet Payee Check",
          "description": "Pre-payment check for one wallet address: a short yes/no for an agent or payment flow that is about to send funds. Returns decision block, no_exact_match or invalid_address, whether the address is listed, the listed entity and programs when it is, the OFAC SDN list date and hash, a screening_id and a signature reference. It uses the same exact-match lookup as wallet_screen, so the two never disagree. no_exact_match means the address is not on the list checked; it is not a clearance. Use wallet_screen for several addresses, other lists or a report. Price without an account: $0.005 per call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The wallet address you are about to pay.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "asset": {
                "description": "Optional asset or network ticker such as ETH, USDC, XBT or TRX. It is recorded in the result as requestedAsset and never changes the decision: an address listed under any asset is a block. Letters and digits only, 2 to 10 characters.",
                "minLength": 2,
                "pattern": "^[A-Za-z0-9]{2,10}$",
                "type": "string"
              },
              "response_detail": {
                "description": "summary (default) returns a one or two sentence summary to the model; full returns the full JSON as text. The structured result is the same either way.",
                "enum": ["summary", "full"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "description": "Structured payee check result.",
            "properties": {
              "accepts": {
                "description": "Present when payment is needed: the x402 payment requirements to sign.",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "address": {
                "description": "The address that was checked.",
                "type": "string"
              },
              "assetMatched": {
                "description": "Only when asset was given: true when the list names this address under that asset, false when it does not (a listed address is still a block).",
                "type": "boolean"
              },
              "bucket": {
                "description": "Present when a daily limit was reached: the limit that was reached.",
                "type": "string"
              },
              "checkedAt": {
                "description": "When the check ran (ISO 8601).",
                "type": "string"
              },
              "data": {
                "additionalProperties": {},
                "description": "The signed copy of the result fields, for screening_verify.",
                "type": "object"
              },
              "decision": {
                "description": "block when listed, no_exact_match when not listed, invalid_address when the address is not a recognized format.",
                "enum": ["block", "no_exact_match", "invalid_address"],
                "type": "string"
              },
              "entity": {
                "description": "The listed party, when decision is block.",
                "type": "string"
              },
              "error": {
                "description": "Machine-readable error code when the tool fails.",
                "type": "string"
              },
              "limit": {
                "description": "Present when a daily limit was reached: the daily limit.",
                "type": "number"
              },
              "list": {
                "description": "The list checked: ofac_sdn.",
                "type": "string"
              },
              "listVersion": {
                "additionalProperties": true,
                "description": "Which version of the list was checked.",
                "properties": {
                  "publishedAt": {
                    "description": "Publication date of the list file.",
                    "type": ["string", "null"]
                  },
                  "sha256": {
                    "description": "SHA-256 hash of the list file.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["publishedAt", "sha256"],
                "type": "object"
              },
              "listed": {
                "description": "True when the address is an exact match on the list.",
                "type": "boolean"
              },
              "message": {
                "description": "Human-readable error or status message.",
                "type": "string"
              },
              "notAClearance": {
                "description": "Always true. no_exact_match is not a clearance.",
                "type": "boolean"
              },
              "otherEntities": {
                "description": "How many other listed parties share this address, when more than one does.",
                "type": "integer"
              },
              "payer": {
                "description": "Present when a payment was refused: the paying address.",
                "type": "string"
              },
              "price": {
                "description": "Present when payment is needed: the price of the call without an account.",
                "type": "string"
              },
              "programs": {
                "description": "Sanctions programs the listed party is under, when decision is block.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "provenance": {
                "additionalProperties": {},
                "description": "Signed provenance, for screening_verify.",
                "type": "object"
              },
              "remaining": {
                "description": "Present when a daily limit was reached: how much was left.",
                "type": "number"
              },
              "requestedAsset": {
                "description": "The asset you named, uppercased. It is your own input, recorded as sent. It never changes the decision.",
                "type": "string"
              },
              "resetsAt": {
                "description": "Present when a daily limit was reached: when it resets (ISO 8601).",
                "type": "string"
              },
              "retryAfterSeconds": {
                "description": "Present when the account made too many calls: seconds to wait.",
                "type": "number"
              },
              "screening_id": {
                "description": "Identifier of this signed result.",
                "type": "string"
              },
              "signature": {
                "additionalProperties": true,
                "description": "Reference to the signature in provenance.",
                "properties": {
                  "algorithm": {
                    "type": "string"
                  },
                  "keyId": {
                    "type": "string"
                  },
                  "status": {
                    "description": "signed, not_configured or key_error.",
                    "type": "string"
                  }
                },
                "required": ["status"],
                "type": "object"
              },
              "success": {
                "description": "Whether the check ran.",
                "type": "boolean"
              },
              "support": {
                "description": "Present on some errors: where to get help.",
                "type": "string"
              },
              "used": {
                "description": "Present when a daily limit was reached: how much of it was used today.",
                "type": "number"
              },
              "x402Version": {
                "description": "Present when payment is needed: the x402 protocol version.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Wallet Payee Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "aurelianflo/pricing": {
              "basePriceUsd": 0.005,
              "currency": "USDC",
              "network": "base",
              "note": "$0.005 per call."
            }
          },
