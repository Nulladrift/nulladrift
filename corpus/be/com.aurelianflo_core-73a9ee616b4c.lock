        {
          "name": "wallet_screen",
          "title": "Wallet Screen",
          "description": "Screen 1-100 crypto wallet addresses against OFAC sanctions lists (SDN by default). Returns exact matches with sanctioned-entity details, address validation, a proceed-or-review decision and signed provenance. Optional: PDF/DOCX report (output_format) and, for a single EVM, TRON or Bitcoin address, indirect exposure through counterparties (exposure_depth).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "One wallet address to screen. Use this or addresses.",
                "minLength": 10,
                "type": "string"
              },
              "addresses": {
                "description": "1-100 wallet addresses to screen in one call. Use this or address.",
                "items": {
                  "description": "Wallet address to screen.",
                  "minLength": 10,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "asset": {
                "description": "Optional asset or network ticker filter such as ETH, USDC, XBT, TRX, ARB, or BSC.",
                "minLength": 2,
                "type": "string"
              },
              "case_reference": {
                "description": "Optional case reference to file the saved result under.",
                "maxLength": 120,
                "type": "string"
              },
              "chains": {
                "description": "Chains to examine for indirect exposure: EVM chain IDs, \"tron\" or \"bitcoin\". When omitted, the chain follows from the address: 0x... is Ethereum (\"1\"), T... is TRON, a Bitcoin address is Bitcoin. A chain that cannot hold the address is rejected.",
                "items": {
                  "enum": ["1", "10", "100", "137", "8453", "42161", "tron", "bitcoin"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "exposure_depth": {
