        {
          "name": "wallet_screen",
          "title": "Wallet Screen",
          "description": "Screen 1-100 crypto wallet addresses against OFAC sanctions lists (SDN by default). Returns exact matches with sanctioned-entity details, address validation, a proceed-or-review decision and signed provenance. Every result carries a verdict that names the lists checked, their dates and what to do next. Optional: PDF/DOCX report (output_format) and, for a single EVM, TRON or Bitcoin address, indirect exposure through counterparties (exposure_depth). To keep the result in your account, call saved_results_save with its screening_id. Price without an account: $0.01 per address, at most $0.10 per call (10-100 addresses cost $0.10). PDF/DOCX output adds $0.05. Indirect exposure adds $0.04 (exposure_depth 1) or $0.14 (exposure_depth 2).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "One wallet address to screen. Use this or addresses.",
                "minLength": 10,
                "type": "string"
              },
              "addresses": {
                "description": "1-100 wallet addresses to screen in one call. Use this or address.",
                "items": {
                  "description": "Wallet address to screen.",
                  "minLength": 10,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "asset": {
                "description": "Optional asset or network ticker filter such as ETH, USDC, XBT, TRX, ARB, or BSC. It never hides a listed address: one listed under another asset is still a match, with assetFilterMatched false in the summary. Letters and digits only, 2 to 10 characters.",
                "minLength": 2,
                "pattern": "^[A-Za-z0-9]{2,10}$",
                "type": "string"
              },
              "chains": {
                "description": "Chains to examine for indirect exposure: EVM chain IDs, \"tron\" or \"bitcoin\". When omitted, the chain follows from the address: 0x... is Ethereum (\"1\"), T... is TRON, a Bitcoin address is Bitcoin. A chain that cannot hold the address is rejected.",
                "items": {
                  "enum": ["1", "10", "100", "137", "8453", "42161", "tron", "bitcoin"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "exposure_depth": {
                "description": "Single EVM, TRON or Bitcoin address only: also check indirect exposure (1 = direct counterparties, 2 = their counterparties). For several wallets, other chains, or wallets that are already listed, use compliance_exposure_report, which takes chains and depth.",
                "enum": [1, 2],
                "type": "number"
              },
              "lists": {
                "description": "Sanctions lists to screen against. Defaults to [\"ofac_sdn\"]. Optional additions: \"ofac_consolidated\" (OFAC's non-SDN lists), \"uk_sanctions\" (UK Sanctions List), \"eu_consolidated\" (EU consolidated financial sanctions list) and \"un_consolidated\" (UN Security Council list). The UK and EU lists name only a few wallet addresses and the UN list none, so those three mostly matter for subject-name screening in compliance_edd_report. Every match names its list. If a requested list cannot be loaded the call fails instead of returning a partial result.",
                "items": {
                  "enum": ["ofac_sdn", "ofac_consolidated", "uk_sanctions", "eu_consolidated", "un_consolidated"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "lookback_days": {
                "description": "Days of transfer history to examine for indirect exposure (default 180).",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "min_amount_usd": {
                "description": "Ignore transfers below this USD value when checking indirect exposure. Transfers without a known price are kept.",
                "minimum": 0,
                "type": "number"
              },
              "output_format": {
                "description": "json (default) for the structured result, or pdf/docx to also get a generated report artifact.",
                "enum": ["json", "pdf", "docx"],
                "type": "string"
              },
              "response_detail": {
                "description": "summary (default) returns a short text summary for the model to read; the full result is always in structuredContent. full returns the whole result as JSON text.",
                "enum": ["summary", "full"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "description": "Structured wallet screening result: the signed data (summary, matches, lists checked), signed provenance with the screening_id, and a verdict that states what a no-exact-match result covers. A generated PDF or DOCX arrives under output.artifact, and the signed data is then under screening.",
            "properties": {
              "accepts": {
                "description": "Present when payment is needed: the x402 payment requirements to sign.",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "artifact": {
                "additionalProperties": {},
                "description": "Generated PDF or DOCX, when output_format asked for one. downloadUrl is a private link that works for 15 minutes.",
                "type": "object"
              },
              "artifact_summary": {
                "additionalProperties": {},
                "description": "Delivery and rendering metadata for the generated file.",
                "type": "object"
              },
              "artifacts": {
                "additionalProperties": {},
                "description": "Artifact rendering hints keyed by format.",
                "type": "object"
              },
              "bucket": {
                "description": "Present when a daily limit was reached: the limit that was reached.",
                "type": "string"
              },
              "data": {
                "additionalProperties": true,
                "description": "Signed screening result. For a single address it has summary, validation and matches; for a batch it has summary counts and one entry per address in results.",
                "properties": {
                  "indirectExposure": {
                    "additionalProperties": {},
                    "description": "Indirect exposure through counterparties, when exposure_depth was set.",
                    "type": "object"
                  },
                  "matches": {
                    "description": "Sanctioned-entity matches for a single address.",
                    "items": {
                      "additionalProperties": true,
                      "description": "One sanctioned-entity match.",
                      "properties": {
                        "address": {
                          "description": "The listed address that matched.",
                          "type": "string"
                        },
                        "asset": {
                          "description": "Asset or network label on the list.",
                          "type": ["string", "null"]
                        },
                        "entityName": {
                          "description": "Name of the listed entity.",
                          "type": "string"
                        },
                        "listName": {
                          "description": "The list the match came from.",
                          "type": ["string", "null"]
                        },
                        "listedOn": {
                          "description": "When the entry was listed.",
                          "type": ["string", "null"]
                        },
                        "programs": {
                          "anyOf": [
                            {
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Sanctions programs on the entry."
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "note": {
                    "description": "Scope note and review requirement.",
                    "type": "string"
                  },
                  "query": {
                    "additionalProperties": {},
                    "description": "What was screened.",
                    "type": "object"
                  },
                  "results": {
                    "description": "One result per address, for a batch.",
                    "items": {
                      "additionalProperties": true,
                      "description": "Screening result for one address.",
                      "properties": {
                        "matches": {
                          "description": "Sanctioned-entity matches.",
                          "items": {
                            "$ref": "#/properties/data/properties/matches/items"
                          },
                          "type": "array"
                        },
                        "query": {
                          "additionalProperties": {},
