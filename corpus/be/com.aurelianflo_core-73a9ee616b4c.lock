        {
          "name": "compliance_queue_optimize",
          "title": "Review Queue",
          "description": "Order a backlog of wallets for manual review. Wallets that are on the sanctions list now come first; the rest are ordered by a priority score built from the figures you supply (exposure, relationship tier, recent activity, policy priority), with a line marking where your review capacity runs out. It does not predict future listings. Use compliance_exposure_report for on-chain evidence about specific wallets.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "Optional asset or network ticker filter such as ETH, USDC, XBT, TRX, ARB, or BSC.",
                "minLength": 2,
                "type": "string"
              },
              "case_reference": {
                "description": "Optional case reference to file the saved result under.",
                "maxLength": 120,
                "type": "string"
              },
              "output_format": {
                "description": "json (default) for the structured result, or pdf/docx to also get a generated report artifact (adds $0.05).",
                "enum": ["json", "pdf", "docx"],
                "type": "string"
              },
              "review_budget": {
                "description": "How many wallets can be reviewed in the next review window.",
                "type": "integer"
              },
              "review_items": {
                "description": "Wallets to order, each with the figures the order is built from.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "description": "Wallet address.",
                      "minLength": 10,
                      "type": "string"
                    },
                    "current_queue_position": {
                      "description": "Optional current queue rank, where 1 is first. When every item has one, the result compares the new order with it.",
                      "type": "integer"
                    },
                    "exposure_usd": {
                      "description": "Dollar exposure associated with this wallet.",
                      "type": "number"
                    },
                    "label": {
                      "description": "Optional display label for the wallet.",
                      "type": "string"
                    },
                    "last_activity_days": {
                      "description": "Days since the wallet was last active.",
                      "type": "number"
                    },
                    "policy_priority": {
                      "description": "Optional internal policy priority from 0 to 10.",
                      "type": "number"
                    },
                    "relationship_tier": {
                      "description": "Relationship tier for this wallet.",
                      "enum": ["low", "standard", "high", "critical"],
                      "type": "string"
                    },
                    "transaction_count_30d": {
                      "description": "Transaction count over the trailing 30 days. Accepted for compatibility; not used in the order.",
                      "type": "number"
                    }
                  },
                  "required": ["address", "exposure_usd", "relationship_tier"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "save": {
                "description": "Keep this result in your account so it can be retrieved later with saved_results. Needs sign-in or an API key; off by default.",
                "type": "boolean"
              },
              "tier_weights": {
                "additionalProperties": {
                  "description": "Tier weight override.",
                  "type": "number"
                },
                "description": "Optional overrides for the relationship tier weights.",
                "type": "object"
              },
              "title": {
                "description": "Optional report title.",
                "type": "string"
              }
            },
            "required": ["review_budget", "review_items"],
            "type": "object"
          },
