        {
          "name": "compliance_exposure_forecast",
          "title": "Compliance Exposure Forecast",
          "description": "Forecast future OFAC wallet exposure for a wallet set using stored OFAC snapshot diffs when available, listedOn backfill when honest, or an explicit caller prior; returns current exact-match baseline, metadata-weighted per-wallet risk, and report-shaped output. Use this when current screening is not enough; use wallet_screen for current hit status only.",
