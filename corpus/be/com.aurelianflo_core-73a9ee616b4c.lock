        {
          "name": "wallet_watchlist_events",
          "title": "Watchlist Log",
          "description": "Show the log of what your watchlist did, newest first: each check (when, against which list version, how many addresses), each alert raised (address and listed party), and each delivery attempt (webhook delivered, retry scheduled, dropped, email sent, email failed). Read-only. Keeps the last 300 entries. Scoped to your account: needs sign-in (/mcp/account) or an API key. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many entries to return, newest first (default 25).",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "response_detail": {
                "description": "summary (default) returns a short text answer. full returns the complete JSON as text. The structured result is the same either way.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "since": {
                "description": "Only entries at or after this ISO date or time, such as 2026-11-01.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "accepts": {
                "description": "Present when payment is needed: the x402 payment requirements to sign.",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "bucket": {
                "description": "Present when a daily limit was reached: the limit that was reached.",
                "type": "string"
              },
              "emailAlerts": {
                "description": "Whether email alerts are on.",
                "type": "boolean"
              },
              "error": {
                "description": "Machine-readable error code when the tool fails.",
                "type": "string"
              },
              "events": {
                "description": "Log entries, newest first, at most limit.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "address": {
                      "description": "For alert and delivery: the wallet address, in full.",
                      "type": "string"
                    },
                    "addressesChecked": {
                      "description": "For check: how many watched addresses were checked.",
                      "type": "number"
                    },
                    "alertsRaised": {
                      "description": "For check: how many new alerts this run raised.",
                      "type": "number"
                    },
                    "at": {
                      "description": "When it happened (ISO 8601, UTC).",
                      "type": "string"
                    },
                    "attempt": {
                      "description": "For delivery: attempt number, 1 for the first try.",
                      "type": "number"
                    },
                    "channel": {
                      "description": "For delivery: where it went.",
                      "enum": ["webhook", "email"],
                      "type": "string"
                    },
                    "error": {
                      "description": "For delivery: a short reason when it failed.",
                      "type": "string"
                    },
                    "eventId": {
                      "description": "For alert and delivery: the ID of the event that was sent.",
                      "type": "string"
                    },
                    "eventType": {
                      "description": "For delivery: watchlist.designation, watchlist.test or watchlist.digest.",
                      "type": "string"
                    },
                    "label": {
                      "description": "For alert: the label given to the address.",
                      "type": ["string", "null"]
                    },
                    "listId": {
                      "description": "For alert: the list that names the address.",
                      "type": "string"
                    },
                    "listName": {
                      "description": "For alert: display name of that list.",
                      "type": ["string", "null"]
                    },
                    "listedParties": {
                      "description": "For alert: the names the address is listed under.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "lists": {
                      "description": "For check: the list versions checked.",
                      "items": {
                        "additionalProperties": true,
                        "properties": {
                          "addressCount": {
                            "description": "Number of addresses on the list.",
                            "type": ["number", "null"]
                          },
                          "listId": {
                            "description": "List ID.",
                            "type": "string"
                          },
                          "listName": {
                            "description": "Display name of the list.",
                            "type": ["string", "null"]
                          },
                          "publishedAt": {
                            "description": "Publication date of the list.",
                            "type": ["string", "null"]
                          },
                          "sha256": {
                            "description": "SHA-256 of the downloaded list file.",
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["addressCount", "listId", "listName", "publishedAt", "sha256"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "nextAttemptAt": {
                      "description": "For delivery: when the retry will run.",
                      "type": ["string", "null"]
                    },
                    "outcome": {
                      "description": "For delivery: what happened.",
                      "enum": ["webhook_delivered", "webhook_retry_scheduled", "webhook_dropped", "webhook_failed", "email_sent", "email_failed"],
                      "type": "string"
                    },
                    "programs": {
                      "description": "For alert: the sanctions programs.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "reason": {
                      "description": "For check: scheduled or list_updated.",
                      "type": "string"
                    },
                    "statusCode": {
                      "description": "For delivery: HTTP status the webhook returned.",
                      "type": "number"
                    },
                    "type": {
                      "description": "check: a run of the watchlist. alert: a watched address was listed. delivery: one attempt to deliver a message.",
                      "enum": ["check", "alert", "delivery"],
                      "type": "string"
                    }
                  },
                  "required": ["at", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "lastCheckedAt": {
                "description": "When the watchlist was last checked, or null if it has not been.",
                "type": ["string", "null"]
              },
              "lastListVersion": {
                "anyOf": [
                  {
                    "$ref": "#/properties/events/items/properties/lists/items"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The list version of the last check, or null."
              },
              "limit": {
                "description": "The limit that was applied.",
                "type": "number"
              },
              "matching": {
                "description": "How many retained entries match since.",
                "type": "number"
              },
              "maxRetained": {
                "description": "The most entries the log keeps; older ones are dropped.",
                "type": "number"
              },
              "message": {
                "description": "Human-readable error or status message.",
                "type": "string"
              },
              "note": {
                "description": "Present when the log is empty: why.",
                "type": "string"
              },
              "payer": {
                "description": "Present when a payment was refused: the paying address.",
                "type": "string"
              },
              "price": {
                "description": "Present when payment is needed: the price of the call without an account.",
                "type": "string"
              },
              "remaining": {
                "description": "Present when a daily limit was reached: how much was left.",
                "type": "number"
              },
              "resetsAt": {
                "description": "Present when a daily limit was reached: when it resets (ISO 8601).",
                "type": "string"
              },
              "retained": {
                "description": "How many entries the log holds in total.",
                "type": "number"
              },
              "retryAfterSeconds": {
                "description": "Present when the account made too many calls: seconds to wait.",
                "type": "number"
              },
              "returned": {
                "description": "How many entries are in events.",
                "type": "number"
              },
              "since": {
                "description": "The since filter that was applied (ISO 8601), or null.",
                "type": ["string", "null"]
              },
              "support": {
                "description": "Present on some errors: where to get help.",
                "type": "string"
              },
              "used": {
                "description": "Present when a daily limit was reached: how much of it was used today.",
                "type": "number"
              },
              "watching": {
                "description": "How many addresses the watchlist holds.",
                "type": "number"
              },
              "webhookConfigured": {
                "description": "Whether an alert webhook is set.",
                "type": "boolean"
              },
              "x402Version": {
                "description": "Present when payment is needed: the x402 protocol version.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Watchlist Log"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
