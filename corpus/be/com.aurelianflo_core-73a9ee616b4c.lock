      },
      "instructions": "AurelianFlo screens crypto wallet addresses against OFAC sanctions lists, builds due diligence memos, and keeps results you can verify. A result of no exact match means only that the address was not found on the lists checked, on the date of the list. It does not say the wallet is safe. Two addresses run free for anyone: 0x098B716B8Aaf21512996dC57EB0615e2383E2f96 and 0x000000000000000000000000000000000000dEaD. Call server_capabilities to see what each tool costs without an account, or sign in at https://api.aurelianflo.com/mcp/account to use every tool free within daily limits. Results are signed. Check one with screening_verify, using its screening_id or its data and provenance.",
      "tools": [
        {
          "name": "account_api_key_create",
          "title": "Create API Key",
          "description": "Create an API key for your account. The key is returned once and cannot be shown again, so give it to the user straight away and do not store or repeat it. An account can hold up to 5 active keys. A key gives the same free access as signing in, with the same daily limits. Scoped to your account: needs an email sign-in at /mcp/account. A request made with an API key cannot create keys. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "response_detail": {
                "description": "summary (the default) returns a short text reply. full returns the whole result as JSON text.",
                "enum": ["summary", "full"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "description": "Structured response object returned by the tool in structuredContent.",
            "properties": {
              "accepts": {
                "description": "Present when payment is needed: the x402 payment requirements to sign.",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "artifact": {
                "additionalProperties": false,
                "description": "Inline generated file artifact. downloadUrl is a private link to the same file that works for 15 minutes; after that only contentBase64 remains.",
                "properties": {
                  "contentBase64": {
                    "description": "Base64-encoded artifact content to decode and save locally.",
                    "type": "string"
                  },
                  "downloadExpiresAt": {
                    "description": "When downloadUrl stops working (ISO 8601), 15 minutes after the call.",
                    "type": "string"
                  },
                  "downloadUrl": {
                    "description": "Private download link for this file, valid until downloadExpiresAt. Give it to the user when they ask for the file.",
                    "type": "string"
                  },
                  "name": {
                    "description": "Suggested file name for the artifact.",
                    "type": "string"
                  },
                  "sizeBytes": {
                    "description": "Artifact size in bytes.",
                    "type": "integer"
                  },
                  "type": {
                    "description": "Artifact document type such as pdf or docx.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "artifact_summary": {
                "additionalProperties": true,
                "description": "Delivery and rendering metadata for an inline generated artifact.",
