        {
          "name": "sanctions_list_changes",
          "title": "Sanctions List Changes",
          "description": "List the crypto addresses added to or removed from the OFAC SDN list since a date, with each party's name, programs and asset, and the two list versions compared (publication date, hash, address count). Read-only. Built from the daily list snapshots this server stores, looks back at most 90 days, and states what period the stored history covers. Free, no sign-in needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "Optional asset or network ticker filter such as ETH, USDC, XBT or TRX. Totals and lists then cover that asset only. Letters and digits only, 2 to 10 characters.",
                "minLength": 2,
                "pattern": "^[A-Za-z0-9]{2,10}$",
                "type": "string"
              },
              "lists": {
                "description": "Lists to report on. Defaults to [\"ofac_sdn\"]. Only the OFAC SDN list has stored history; the others are named in unavailableLists.",
                "items": {
                  "enum": ["ofac_sdn", "ofac_consolidated", "uk_sanctions", "eu_consolidated", "un_consolidated"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "response_detail": {
                "description": "summary (default) returns a short text answer. full returns the complete JSON as text. The structured result is the same either way.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "since": {
                "description": "Start date as an ISO date, such as 2026-10-01. Looks back at most 90 days. An earlier date is moved to 90 days back, and the result says so.",
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "accepts": {
                "description": "Present when payment is needed: the x402 payment requirements to sign.",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "added": {
                "description": "Addresses in the newest version and not in the earlier one, at most maxItemsPerSide.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "address": {
                      "description": "The wallet address, in full.",
                      "type": "string"
                    },
                    "addressCaseUnknown": {
                      "description": "True when the address comes from an older snapshot that kept it lower-cased only; match it without regard to case.",
                      "type": "boolean"
                    },
                    "asset": {
                      "description": "Asset or network ticker the list gives for the address.",
                      "type": ["string", "null"]
                    },
                    "entityName": {
                      "description": "Name of the listed party.",
                      "type": ["string", "null"]
                    },
                    "listedOn": {
                      "description": "Date the entry was listed, when the list gives one.",
                      "type": ["string", "null"]
                    },
                    "programs": {
                      "description": "Sanctions programs the party is listed under.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["address", "asset", "entityName", "listedOn", "programs"],
                  "type": "object"
                },
                "type": "array"
              },
              "after": {
                "anyOf": [
                  {
                    "$ref": "#/properties/before/anyOf/0"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The newest list version, or null when there is none."
              },
              "asset": {
                "description": "The asset filter applied, or null.",
                "type": ["string", "null"]
              },
              "before": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "properties": {
                      "addressCount": {
                        "description": "Number of distinct crypto addresses in this list version.",
                        "type": "number"
                      },
                      "hash": {
                        "description": "SHA-256 of the sorted address entries in this snapshot.",
                        "type": ["string", "null"]
                      },
                      "listSha256": {
                        "description": "SHA-256 of the downloaded list file, when it was stored with the snapshot.",
                        "type": ["string", "null"]
                      },
                      "publishedAt": {
                        "description": "Publication date of the list as OFAC states it, when known.",
                        "type": ["string", "null"]
                      },
                      "snapshotDate": {
                        "description": "Date the snapshot is stored under, the list's publication date (YYYY-MM-DD).",
                        "type": "string"
                      }
                    },
                    "required": ["addressCount", "hash", "listSha256", "publishedAt", "snapshotDate"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The list version the comparison starts from, or null when there is none."
              },
              "bucket": {
                "description": "Present when a daily limit was reached: the limit that was reached.",
                "type": "string"
              },
              "coverage": {
                "additionalProperties": true,
                "description": "What period the stored history covers.",
                "properties": {
                  "historyStartsOn": {
                    "description": "Date of the oldest stored list version.",
                    "type": ["string", "null"]
                  },
                  "latestSnapshotOn": {
                    "description": "Date of the newest stored list version.",
                    "type": ["string", "null"]
                  },
                  "snapshotCount": {
                    "description": "Number of stored list versions.",
                    "type": "number"
                  },
                  "status": {
                    "description": "full: history reaches back to the start date. partial: history starts later. none: no usable history.",
                    "enum": ["full", "partial", "none"],
                    "type": "string"
                  }
                },
                "required": ["historyStartsOn", "latestSnapshotOn", "snapshotCount", "status"],
                "type": "object"
              },
              "error": {
                "description": "Machine-readable error code when the tool fails.",
                "type": "string"
              },
              "limit": {
                "description": "Present when a daily limit was reached: the daily limit.",
                "type": "number"
              },
              "list": {
                "description": "The list these changes are from.",
                "type": "string"
              },
              "listName": {
                "description": "Display name of the list.",
                "type": "string"
              },
              "maxItemsPerSide": {
                "description": "The cap on added and on removed.",
                "type": "number"
              },
              "message": {
                "description": "Human-readable error or status message.",
                "type": "string"
              },
              "payer": {
                "description": "Present when a payment was refused: the paying address.",
                "type": "string"
              },
              "price": {
                "description": "Present when payment is needed: the price of the call without an account.",
                "type": "string"
              },
              "remaining": {
                "description": "Present when a daily limit was reached: how much was left.",
                "type": "number"
              },
              "removed": {
