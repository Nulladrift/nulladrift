        {
          "name": "compliance_edd_report",
          "title": "EDD Report",
          "description": "Build a paid enhanced due diligence memo for a subject and its wallets: exact-match OFAC wallet screening, subject-name screening against sanctioned parties, sanctions evidence, and follow-up actions, returned as structured JSON or an inline PDF/DOCX artifact. Use this for case handoff; use wallet_screen for screening-only results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "addresses": {
                "description": "Crypto wallet addresses to screen for OFAC sanctions exposure and include in the enhanced due diligence memo.",
                "items": {
                  "description": "Crypto wallet address to screen for OFAC sanctions exposure and include in the enhanced due diligence memo.",
                  "minLength": 10,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "artifact_only": {
                "description": "When output_format is pdf or docx, return a compact artifact-first response without the full memo payload.",
                "type": "boolean"
              },
              "asset": {
                "description": "Optional asset or network ticker filter such as ETH, USDC, XBT, TRX, ARB, or BSC.",
                "minLength": 2,
                "type": "string"
              },
              "case_name": {
                "description": "Optional case or review title shown in the memo.",
                "type": "string"
              },
              "case_reference": {
                "description": "Optional case reference to file the saved result under.",
                "maxLength": 120,
                "type": "string"
              },
              "jurisdiction": {
                "description": "Optional jurisdiction or operating region for the case.",
                "type": "string"
              },
              "lists": {
                "description": "Sanctions lists to screen against. Defaults to [\"ofac_sdn\"]. Optional additions: \"ofac_consolidated\" (OFAC's non-SDN lists), \"uk_sanctions\" (UK Sanctions List), \"eu_consolidated\" (EU consolidated financial sanctions list) and \"un_consolidated\" (UN Security Council list). The UK and EU lists name only a few wallet addresses and the UN list none, so those three mostly matter for subject-name screening in compliance_edd_report. Every match names its list. If a requested list cannot be loaded the call fails instead of returning a partial result.",
                "items": {
                  "enum": ["ofac_sdn", "ofac_consolidated", "uk_sanctions", "eu_consolidated", "un_consolidated"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "output_format": {
                "description": "Select json for the structured memo payload or pdf|docx for a generated artifact.",
                "enum": ["json", "pdf", "docx"],
                "type": "string"
              },
              "reference_id": {
                "description": "Optional internal case or review reference.",
                "type": "string"
              },
              "requested_by": {
                "description": "Optional requester, owner, or reviewing team.",
                "type": "string"
              },
              "review_reason": {
                "description": "Optional reason the EDD memo is being prepared.",
                "type": "string"
              },
              "save": {
                "description": "Keep this result in your account so it can be retrieved later with saved_results. Needs sign-in or an API key; off by default.",
                "type": "boolean"
              },
              "subject_aliases": {
                "description": "Other names the subject is known by; each is also screened against sanctioned party names and aliases.",
                "items": {
                  "maxLength": 160,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "subject_name": {
                "description": "Human-readable subject or counterparty name for the memo.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["addresses", "output_format", "subject_name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "description": "Structured response object returned by the tool in structuredContent.",
            "properties": {
              "artifact": {
                "additionalProperties": false,
                "description": "Inline generated file artifact. downloadUrl is a private link to the same file that works for 15 minutes; after that only contentBase64 remains.",
                "properties": {
                  "contentBase64": {
                    "description": "Base64-encoded artifact content to decode and save locally.",
                    "type": "string"
                  },
                  "downloadExpiresAt": {
                    "description": "When downloadUrl stops working (ISO 8601), 15 minutes after the call.",
                    "type": "string"
                  },
                  "downloadUrl": {
                    "description": "Private download link for this file, valid until downloadExpiresAt. Give it to the user when they ask for the file.",
                    "type": "string"
                  },
                  "name": {
                    "description": "Suggested file name for the artifact.",
                    "type": "string"
                  },
                  "sizeBytes": {
                    "description": "Artifact size in bytes.",
                    "type": "integer"
                  },
                  "type": {
                    "description": "Artifact document type such as pdf or docx.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "artifact_summary": {
                "additionalProperties": true,
                "description": "Delivery and rendering metadata for an inline generated artifact.",
                "properties": {
                  "delivery": {
                    "additionalProperties": true,
                    "description": "How to retrieve or save the generated artifact.",
                    "properties": {
                      "downloadUrl": {
                        "description": "Hosted download URL when one exists; null when the artifact is inline only.",
                        "type": ["string", "null"]
                      },
                      "note": {
                        "description": "Human-readable delivery note.",
                        "type": "string"
                      },
                      "primary": {
                        "description": "Primary delivery mode, normally base64.",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "documentType": {
                    "description": "Rendered artifact type such as pdf or docx.",
                    "type": "string"
                  },
                  "fileName": {
                    "description": "Suggested file name for the generated artifact.",
                    "type": "string"
                  },
                  "mimeType": {
                    "description": "Artifact MIME type.",
                    "type": "string"
                  },
                  "sizeBytes": {
                    "description": "Artifact size in bytes.",
                    "type": "integer"
                  },
                  "usedFallback": {
                    "description": "Whether fallback rendering was used.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "artifacts": {
                "additionalProperties": {
                  "$ref": "#/properties/data/additionalProperties"
                },
                "description": "Artifact rendering hints keyed by format.",
                "type": "object"
              },
              "data": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "description": "String value.",
                      "type": "string"
                    },
                    {
                      "description": "Numeric value.",
                      "type": "number"
                    },
                    {
                      "description": "Boolean value.",
                      "type": "boolean"
                    },
                    {
                      "description": "Null value.",
                      "type": "null"
                    },
                    {
                      "description": "Array value.",
                      "type": "array"
                    },
                    {
                      "additionalProperties": {},
                      "description": "Object value.",
                      "type": "object"
                    }
                  ],
                  "description": "JSON-compatible value."
                },
                "description": "Primary structured result payload for the tool.",
                "type": "object"
              },
              "error": {
                "description": "Machine-readable error code or message when the tool fails.",
                "type": "string"
              },
              "message": {
                "description": "Human-readable error or status message.",
                "type": "string"
              },
              "output": {
                "additionalProperties": {
                  "$ref": "#/properties/data/additionalProperties"
                },
                "description": "Nested renderer output when a workflow bundles an artifact render.",
                "type": "object"
              },
              "report": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "$ref": "#/properties/data/additionalProperties"
                    },
                    "description": "Report-shaped payload with summary, metrics, tables, or evidence.",
                    "type": "object"
                  },
                  {
                    "description": "Null when no saved report is available.",
                    "type": "null"
                  }
                ],
                "description": "Report-shaped payload when available; null for status-only retrieval responses."
              },
              "source": {
                "anyOf": [
                  {
                    "description": "Source label for the result.",
                    "type": "string"
                  },
                  {
                    "additionalProperties": {
                      "$ref": "#/properties/data/additionalProperties"
                    },
                    "description": "Source route, dataset, or execution metadata for the result.",
                    "type": "object"
                  }
                ],
                "description": "Source label, route, dataset, or execution metadata for the result."
              },
              "success": {
                "description": "Whether the tool completed successfully.",
                "type": "boolean"
              }
            },
            "type": "object"
