                "enum": [1, 2],
                "type": "number"
              },
              "lists": {
                "description": "Sanctions lists to screen against. Defaults to [\"ofac_sdn\"]. Optional additions: \"ofac_consolidated\" (OFAC's non-SDN lists), \"uk_sanctions\" (UK Sanctions List), \"eu_consolidated\" (EU consolidated financial sanctions list) and \"un_consolidated\" (UN Security Council list). The UK and EU lists name only a few wallet addresses and the UN list none, so those three mostly matter for subject-name screening in compliance_edd_report. Every match names its list. If a requested list cannot be loaded the call fails instead of returning a partial result.",
