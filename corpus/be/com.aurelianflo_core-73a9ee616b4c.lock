                                        "enum": ["agrees", "disagrees", "not_available"],
                                        "type": "string"
                                      }
                                    },
                                    "required": ["status"],
                                    "type": "object"
                                  }
                                },
                                "required": ["country", "dateOfBirth", "idNumber", "summary", "type"],
