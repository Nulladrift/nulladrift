        {
          "name": "compliance_queue_optimize",
          "title": "Review Queue",
          "description": "Order a backlog of wallets for manual review. Wallets that are on the sanctions list now come first and show no score; the rest are ordered by a priority score built from the figures you supply (exposure, relationship tier, recent activity, policy priority), and from exposure report rows if you pass them as addresses_from_exposure. Exposure and tier are optional: a figure you leave out is treated as unknown, and the row says so. Each row says why it sits where it does, and a line marks where your review capacity runs out. It does not predict future listings. Use compliance_exposure_report for on-chain evidence about specific wallets. Up to 100 wallets per call, counting review_items and addresses_from_exposure together. To keep the queue in your account, call saved_results_save with its screening_id. Price without an account: $0.05 per call, whatever the number of wallets. PDF/DOCX output adds $0.05.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "addresses_from_exposure": {
                "description": "Optional rows from an exposure report (the wallets array of a compliance_exposure_report result). The queue uses what the report found about each wallet, such as listed counterparties and transfer counts, and adds any wallet that is not already in review_items. A queue holds at most 100 wallets, so review_items and these rows together must not name more than 100 different wallets.",
                "items": {
                  "additionalProperties": true,
                  "description": "One wallet row from an exposure report.",
                  "properties": {
                    "address": {
                      "description": "Wallet address.",
                      "minLength": 10,
                      "type": "string"
                    }
                  },
                  "required": ["address"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "asset": {
                "description": "Optional asset or network ticker filter such as ETH, USDC, XBT, TRX, ARB, or BSC. It never hides a listed address: one listed under another asset is still a match, with assetFilterMatched false in the summary. Letters and digits only, 2 to 10 characters.",
                "minLength": 2,
                "pattern": "^[A-Za-z0-9]{2,10}$",
                "type": "string"
              },
              "output_format": {
                "description": "json (default) for the structured result, or pdf/docx to also get a generated report artifact.",
                "enum": ["json", "pdf", "docx"],
                "type": "string"
              },
              "response_detail": {
                "description": "summary (default) returns a short text summary for you to read, with the full result in structuredContent. full returns the full JSON as text as well.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "review_budget": {
                "description": "How many wallets can be reviewed in the next review window.",
                "type": "integer"
              },
              "review_items": {
                "description": "Wallets to order, up to 100 (together with any extra wallets from addresses_from_exposure), each with the figures the order is built from.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "address": {
                      "description": "Wallet address.",
                      "minLength": 10,
                      "type": "string"
                    },
                    "current_queue_position": {
                      "description": "Optional current queue rank, where 1 is first. When every item has one, the result compares the new order with it.",
                      "type": "integer"
                    },
                    "exposure_usd": {
                      "description": "Dollar exposure associated with this wallet. Leave it out if you do not know it: it is then treated as unknown, not as zero.",
                      "type": "number"
                    },
                    "label": {
                      "description": "Optional display label for the wallet.",
                      "type": "string"
                    },
                    "last_activity_days": {
                      "description": "Days since the wallet was last active.",
                      "type": "number"
                    },
                    "policy_priority": {
                      "description": "Optional internal policy priority from 0 to 10.",
                      "type": "number"
                    },
                    "relationship_tier": {
                      "description": "Relationship tier for this wallet. Leave it out if you do not know it.",
                      "enum": ["low", "standard", "high", "critical"],
                      "type": "string"
                    }
                  },
                  "required": ["address"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "tier_weights": {
                "additionalProperties": {
                  "description": "Tier weight override.",
                  "type": "number"
                },
                "description": "Optional overrides for the relationship tier weights.",
                "type": "object"
              },
              "title": {
                "description": "Optional report title.",
                "type": "string"
