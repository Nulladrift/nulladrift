                "description": "Forecast horizon in days.",
                "type": "integer"
              },
              "iterations": {
                "description": "Forecast trial count.",
                "type": "integer"
              },
              "objective": {
                "description": "Optimization objective.",
                "enum": ["minimize_residual_risk", "maximize_expected_recall", "maximize_caught_hits"],
                "type": "string"
              },
              "output_format": {
                "description": "json (default) for the structured result, or pdf/docx to also get a generated report artifact (adds $0.05).",
