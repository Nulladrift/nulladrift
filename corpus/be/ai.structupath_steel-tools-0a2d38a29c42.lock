      "tools": [
        {
          "name": "steel_bolt_pretension",
          "title": "Bolt Pretension & Turn-of-the-Nut",
          "description": "RCSC minimum pretension for A325/A490 structural bolts by diameter, with the turn-of-the-nut rotation when a bolt length is given. Published nominal values for estimating and orientation, not design guidance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dia": {
                "description": "Bolt diameter in inches — fraction (\"3/4\") or decimal (0.75)",
                "maxLength": 8,
                "minLength": 1,
                "type": "string"
              },
              "length_in": {
                "description": "Optional bolt length in inches, for the turn-of-the-nut rotation",
                "exclusiveMinimum": 0,
                "maximum": 60,
                "type": "number"
              }
            },
            "required": ["dia"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4256e12318df9c458b9ef476b626f84816f220c5a395bc51827fff2796d2f5d"
        },
        {
          "name": "steel_coating_area",
          "title": "Coating / Surface Area",
          "description": "Surface area to coat for an AISC shape: ft² per foot from the cross-section perimeter, piece/lot area with length and qty, optional interior faces for galvanized tubes and gallons at a supplied coverage rate. Published nominal values for estimating and orientation, not design guidance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "coverage_sqft_per_gal": {
                "description": "Optional practical coverage rate from the coating datasheet, to estimate gallons",
                "exclusiveMinimum": 0,
                "maximum": 2000,
                "type": "number"
              },
              "designation": {
                "description": "AISC designation, e.g. W21X50, HSS6X6X3/8, Pipe4STD",
                "maxLength": 32,
                "type": "string"
              },
              "include_inside_faces": {
                "description": "Tubes only: add interior surface, as hot-dip galvanizing coats vented HSS/pipe interiors. Default false (outside only).",
                "type": "boolean"
              },
              "length_ft": {
                "description": "Optional length in feet for a piece/lot area",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "qty": {
                "description": "Optional piece count (default 1) when a length is given",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "integer"
              }
            },
            "required": ["designation"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28944277ec5fc5612882d054633be7323937fd68ab07f47f680752e78d1d118d"
        },
        {
          "name": "steel_connection_reference",
          "title": "Steel Connection Reference",
          "description": "Describe a structural steel connection type (behaviour, use, what goes wrong) by name, alias or slug — or look up a structural bolt grade (A325, A490, A307). Published nominal values for estimating and orientation, not design guidance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name_or_slug": {
                "description": "Connection name, alias or slug (e.g. \"clip angle\", \"base-plate\") or a bolt grade (e.g. \"A490\")",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name_or_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e2e23d89ecaf9e8476895594cd08d3b0e2100e4ef69fd6c59e8505c1e52637df"
        },
        {
          "name": "steel_gauge_thickness",
          "title": "Steel Gauge Thickness",
          "description": "Look up sheet steel gauge thickness (gauges 3-28) in inches and mm with lb/ft², for plain, galvanized or stainless series. Published nominal values for estimating and orientation, not design guidance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "gauge": {
                "description": "Sheet steel gauge number, 3 through 28",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "material": {
                "default": "steel",
                "description": "Gauge series — the same number is a different thickness each",
                "enum": ["steel", "galvanized", "stainless"],
                "type": "string"
              }
            },
            "required": ["gauge"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c1f390eba92fc08838fc352661ec12b2fc5d70277dc7507791c2f3f8af024cb"
        },
        {
          "name": "steel_mtr_check",
          "title": "Mill Test Report Mechanicals Screen",
          "description": "Screen a mill cert's yield and tensile against the specified limits for A992, A572 Gr. 50 or A36 — a screening aid, not acceptance. Published nominal values for estimating and orientation, not design guidance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "grade": {
                "description": "Steel grade: \"A992\", \"A572 Gr. 50\" or \"A36\"",
                "maxLength": 24,
                "minLength": 2,
                "type": "string"
              },
              "tensile_ksi": {
                "description": "Reported tensile, ksi",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "yield_ksi": {
                "description": "Reported yield, ksi",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              }
            },
            "required": ["grade", "tensile_ksi", "yield_ksi"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:837dce985106b491cb1fddddae2d11a9cd1ff342a4336e5fc37dde5ef61faa2a"
        },
        {
          "name": "steel_ncr_generate",
          "title": "NCR Document Generator",
          "description": "Generate a formal Nonconformance Report PDF: identification, description, the violated requirement, containment, root cause (prose or 5-Whys chain), disposition (accept-as-is/repair/rework/reject) with actions, and blank quality-review and sign-off blocks. Flags accept-as-is dispositions whose corrective action describes physical work. The disposition decision belongs to the responsible quality authority. Returns a download link that expires within ~48 hours. Nothing you submit is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company_location": {
                "maxLength": 120,
                "type": "string"
              },
              "company_name": {
                "description": "Contractor raising the NCR — appears in the header",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "containment": {
                "description": "What was done on the spot — quarantine, stop work, tag",
                "maxLength": 1000,
                "type": "string"
              },
              "corrective_action": {
                "description": "Bringing this instance into compliance",
                "maxLength": 2000,
                "type": "string"
              },
              "date": {
                "description": "Date raised",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "description": "What was found, measured against what was required",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "location": {
                "description": "Area, level, grid, or piece mark",
                "maxLength": 200,
                "type": "string"
              },
              "ncr_number": {
                "description": "NCR number from the project register, e.g. \"NCR-008\"",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "preventive_action": {
                "description": "Stopping recurrence — procedure, inspection, supplier",
                "maxLength": 2000,
                "type": "string"
              },
              "project_name": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "project_number": {
                "maxLength": 60,
                "type": "string"
              },
              "raised_by": {
                "description": "Name — role",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "requirement_violated": {
                "description": "The cited requirement — spec section, drawing/detail, or code clause. An NCR without a cited requirement is dispute fuel.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "resolution": {
                "description": "Disposition: accept-as-is (no physical work), repair, rework, or reject",
                "enum": ["accept-as-is", "repair", "rework", "reject"],
                "type": "string"
              },
              "resolution_justification": {
                "description": "Required in practice for accept-as-is — the concession basis",
                "maxLength": 1000,
                "type": "string"
              },
              "root_cause": {
                "maxLength": 2000,
                "type": "string"
              },
              "root_cause_whys": {
                "description": "5-Whys chain, first why to root; overrides root_cause",
                "items": {
                  "maxLength": 300,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "trade_or_supplier": {
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["company_name", "date", "description", "ncr_number", "project_name", "raised_by", "requirement_violated", "resolution"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f6f867cd41b0f1d97b784b390218588496aa7d0588c1f50d96897ec5918ef36b"
        },
        {
          "name": "steel_pdf_markup",
          "title": "Bluebeam PDF Markup Writer",
          "description": "Add real Bluebeam-compatible annotation objects to a drawing PDF — counts, length/area measurements with live scales, RFI clouds, callouts — from a markups JSON you supply plus placement coordinates. Pass the PDF as an https URL or small base64; returns a marked PDF download link that expires within ~48 hours. Markups appear in Bluebeam Revu's Markups List. You decide placement; the tool guarantees the format. Nothing you submit is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "author": {
                "description": "Markups List author column",
                "maxLength": 120,
                "type": "string"
              },
              "coordinate_space": {
                "enum": ["ratio", "pdf"],
                "type": "string"
              },
              "markups": {
                "description": "Markups to place — geometry in ratio (0–1 from top-left) or pdf coordinates",
                "items": {
                  "properties": {
                    "arrow": {
                      "type": "boolean"
                    },
                    "arrow_at": {
                      "prefixItems": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "number"
                        }
                      ],
                      "type": "array"
                    },
                    "at": {
                      "anyOf": [
                        {
                          "prefixItems": [
                            {
                              "type": "number"
                            },
                            {
