                              {
                                "type": "number"
                              },
                              {
                                "type": "number"
                              }
                            ],
                            "type": "array"
                          },
                          "maxItems": 2000,
                          "type": "array"
                        }
                      ]
                    },
                    "author": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "box_h": {
                      "maximum": 10000,
                      "type": "number"
                    },
                    "box_w": {
                      "maximum": 10000,
                      "type": "number"
                    },
                    "bump": {
                      "maximum": 200,
                      "type": "number"
                    },
                    "color": {
                      "description": "Hex color, e.g. #FF0000",
                      "maxLength": 9,
                      "type": "string"
                    },
                    "column_data": {
                      "items": {},
                      "maxItems": 50,
                      "type": "array"
                    },
                    "contents": {
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "coordinate_space": {
                      "enum": ["ratio", "pdf"],
                      "type": "string"
                    },
                    "data": {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "fill": {
                      "maxLength": 9,
                      "type": "string"
                    },
                    "fill_opacity": {
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "font_size": {
                      "maximum": 200,
                      "type": "number"
                    },
                    "label": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "opacity": {
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "page": {
                      "description": "1-based page number",
                      "maximum": 5000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "points": {
                      "items": {
                        "prefixItems": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          }
                        ],
                        "type": "array"
                      },
                      "maxItems": 2000,
                      "type": "array"
                    },
                    "rect": {
                      "description": "[x, y, w, h] in the markup's coordinate space",
                      "prefixItems": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "type": "number"
                        }
                      ],
                      "type": "array"
                    },
                    "scale": {
                      "description": "Per-markup scale, e.g. \"1/4 in = 1 ft\"",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "size": {
                      "maximum": 1000,
                      "type": "number"
                    },
                    "subject": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "tool": {
                      "description": "A steel takeoff preset key, e.g. hss-ea, w-beam-lf, rfi-cloud",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "type": {
                      "description": "Annotation type when not using a preset tool",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "width": {
                      "maximum": 100,
                      "type": "number"
                    }
                  },
                  "required": ["page"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "page_scales": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Per-page scale overrides, keyed by page number string",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "pdf_base64": {
                "description": "Base64 PDF for small files (~3 MB max decoded); prefer pdf_url for drawing sets",
                "maxLength": 4800000,
                "type": "string"
              },
              "pdf_url": {
                "description": "HTTPS URL of the source drawing PDF (fetched server-side, SSRF-guarded)",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              },
              "scale": {
                "description": "Document scale for measurements, e.g. \"1/4 in = 1 ft\" or \"1:100\"",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["markups"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
