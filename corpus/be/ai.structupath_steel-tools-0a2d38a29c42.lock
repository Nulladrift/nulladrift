              }
            },
            "required": ["company_name", "date", "description", "project_name", "rfi_number", "subject", "submitted_by", "submitted_to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7dd36e7eddc978fddfae48babd1a7e5338467222a86d34d8259d3ade15b95000"
        },
        {
          "name": "steel_rfq_generate",
          "title": "RFQ Workbook Generator",
          "description": "Generate a vendor-ready Request for Quotation (.xlsx) from structured takeoff line items — grouped by material, with vendor pricing columns, totals and standard terms. You pass parsed line items and a company name; returns a download link that expires within ~48 hours. Nothing you submit is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company_location": {
                "description": "City, state under the company name, e.g. \"Denver, CO\"",
                "maxLength": 120,
                "type": "string"
              },
              "company_name": {
                "description": "Buyer company on the RFQ header and terms — required",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "date_issued": {
                "description": "Free-form issue date; a blank line is used if omitted",
                "maxLength": 60,
                "type": "string"
              },
              "line_items": {
                "description": "Parsed takeoff line items — the calling agent reads the estimate",
                "items": {
                  "properties": {
                    "category": {
