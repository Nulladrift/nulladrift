          },
          "digest": "sha256:58d133f776c57b081c43c1119c10fcb207817082bcd5d476ca1fa8bf70ffd58f"
        },
        {
          "name": "steel_pipe_schedule",
          "title": "Pipe Schedule Lookup",
          "description": "Steel pipe dimensions by NPS and schedule: OD, wall, inside diameter and lb/ft for schedules 5, 10, 40/STD, 80/XS, 160 and XXS. Omit the schedule to list them all. Published nominal values for estimating and orientation, not design guidance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "nps": {
                "description": "Nominal pipe size, e.g. \"2\", \"1/2\", \"1-1/4\"",
                "maxLength": 8,
                "minLength": 1,
                "type": "string"
              },
              "schedule": {
                "description": "Optional schedule: \"40\", \"80\", \"160\", \"STD\", \"XS\", \"XXS\", \"5\", \"10\"",
                "maxLength": 8,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["nps"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5bc1afc8e4180ead12208ae9a76a97e5c6ec494c3bf790b40cdfdb7899fd1df0"
        },
        {
          "name": "steel_plate_weight",
          "title": "Steel Plate Weight",
          "description": "Compute carbon steel plate weight from thickness (decimal or fraction) and width/length in inches, with optional material cost via price_per_lb. Published nominal values for estimating and orientation, not design guidance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "length_in": {
                "description": "Plate length in INCHES",
                "exclusiveMinimum": 0,
                "maximum": 2000,
                "type": "number"
              },
              "price_per_lb": {
                "description": "Optional material price in $/lb, to include a cost estimate",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "thickness_in": {
                "anyOf": [
                  {
                    "maxLength": 16,
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "Plate thickness in inches — decimal or fraction (\"3/4\", \"1-1/8\")"
              },
              "width_in": {
                "description": "Plate width in INCHES (a 4x8 ft plate is 48 x 96 in)",
                "exclusiveMinimum": 0,
                "maximum": 2000,
                "type": "number"
              }
            },
            "required": ["length_in", "thickness_in", "width_in"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2eb06eb29d59982878b404408377df799114f3b335e8edbca2a7efc746108d59"
        },
        {
          "name": "steel_rfi_generate",
          "title": "RFI Document Generator",
          "description": "Generate a formal Request for Information PDF from structured fields — header, meta grid, subject, description, proposed solution, attachments, and a blank response block for the design team. You do the judgement (one issue per RFI, exact drawing references, a proposed path forward); the tool guarantees the format. Returns a download link that expires within ~48 hours. Nothing you submit is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attachments": {
                "items": {
                  "maxLength": 160,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "company_location": {
                "maxLength": 120,
                "type": "string"
              },
              "company_name": {
                "description": "Contractor issuing the RFI — appears in the header",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "date": {
                "description": "Submission date",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "description": "The issue: specific references, what is missing or conflicting, why it matters. Newlines respected.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "drawing_refs": {
                "description": "Exact drawing numbers with revisions",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "project_name": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "project_number": {
                "maxLength": 60,
                "type": "string"
              },
              "proposed_solution": {
                "description": "Suggested path forward, framed as a proposal",
                "maxLength": 2000,
                "type": "string"
              },
              "reason": {
                "description": "Category: Design Omission, Design Error, Constructability Issue, Scope Clarification, Site Condition, Missing Information, Coordination Conflict — or free text",
                "maxLength": 60,
                "type": "string"
              },
              "response_needed_by": {
                "maxLength": 60,
                "type": "string"
              },
              "rfi_number": {
                "description": "RFI number from the project register, e.g. \"RFI-017\"",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "spec_refs": {
                "items": {
                  "maxLength": 80,
