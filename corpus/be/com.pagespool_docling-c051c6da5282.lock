          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "convert_document",
          "title": "Convert a document to Markdown with Docling",
          "description": "Convert a document up to 25 MB and 200 pages to Markdown with Docling:\nOCR, tables, headings and reading order.\n\nPass the file as base64 in `content_base64`, or as a download link in\n`file`, and its name in `filename`. Returns `task_id` and `task_status`.\nCall `get_conversion` with the `task_id` until `task_status` is `success`\nor `failure`; a long PDF can take several minutes.\n\nCosts 1 credit per PDF page converted (2 with `force_ocr`) and 10 credits\nper other file, refunded if the conversion fails. Requires an API key.\nThe file is deleted when the conversion ends; the result is kept for\n7 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_base64": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The file content, base64-encoded. Up to 25 MB before encoding."
              },
              "file": {
                "default": null,
                "description": "The file as a download link, instead of `content_base64`. In ChatGPT, pass the user's uploaded file here. Other clients can set `download_url` to a public https URL.",
                "properties": {
                  "download_url": {
                    "description": "A public https URL of the file.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "An identifier for the file. ChatGPT sets it; other clients may pass any label, such as the file name.",
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "filename": {
                "description": "The file name with its extension, such as report.pdf. Docling reads PDF, Word, PowerPoint, Excel, HTML, Markdown, CSV and images.",
                "type": "string"
              },
              "force_ocr": {
                "default": false,
                "description": "Replace a PDF's text layer with OCR text. Doubles the price of a PDF.",
                "type": "boolean"
              },
              "page_range": {
                "anyOf": [
                  {
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. [first, last] pages to convert, 1-based."
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Convert a document to Markdown with Docling"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/fileParams": ["file"],
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:af77677681531d45d317cafeb0ff1425f5618d77b7b79dacde8e23ff2631d267"
        },
        {
          "name": "get_conversion",
          "title": "Check a Docling conversion",
          "description": "Check a conversion you started with `convert_document`.\n\nReturns `task_id` and `task_status` (`pending`, `started`, `success` or\n`failure`). On `success` it includes the `markdown` when it is under\n100 KB, otherwise a `result_url` to download the full result with your\nAPI key (free). On `failure` it includes `error`, one sentence with the\nreason. Results are deleted 7 days after submission. Requires an API key.\n\nCredits: free. This tool is not metered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "description": "The task_id returned by convert_document.",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a Docling conversion"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b3cdfb2da70d5b0d7f6cbdbd6086443ad36452f71abddc26cf1c937667389ae9"
        }
      ],
      "digest": "sha256:58ab51c896212eceaf2d29c42fc01767f280170762b945ceaf049ee4bba2deb3"
    }
  }
}
