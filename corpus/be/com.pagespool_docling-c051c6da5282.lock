      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pagespool-docling",
        "version": "1",
        "websiteUrl": "https://pagespool.com/connect#docling"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
