      },
      "instructions": "Growkik Directorios, empresas de México: constructoras (constructioncompanies.com.mx), industria manufacturera y parques industriales (industriadetransformacion.mx), inmobiliarias (inmobiliariasenmexico.mx) y transporte y logística (empresasdetransporte.mx). 75746 empresas del DENUE del INEGI, enriquecidas con su sitio web y Google Maps.\n\nCómo usarlo:\n- Si no sabes qué categoría usar, llama listar_directorios.\n- buscar_empresas filtra por texto, directorio, categoría, estado, municipio y tamaño; contar_empresas da totales para dimensionar un mercado.\n- Muestra al usuario el enlace \"ficha\" de cada empresa: es la fuente.\n- El tamaño es la banda de plantilla del DENUE (personas ocupadas), no ventas.\n- buscar_cerca busca alrededor de un municipio, una empresa, un parque industrial o coordenadas, con la distancia en km.\n- ver_sucursales lista los establecimientos que comparten la razón social de una empresa (plantas, sucursales, bodegas).\n- Datos adicionales por empresa cuando existen: capital extranjero (RNIE), contratos federales desde 2024 (ComprasMX, coincidencia por razón social), certificado ambiental PROFEPA y mes de alta en el DENUE (no es la fecha de fundación). Cada ficha dice la fuente de estos datos; cítala.\n- Este servidor NO entrega teléfonos ni correos. Si el usuario los pide, usa obtener_contactos: dice cuáles empresas los tienen y da el enlace de compra de la descarga de pago. No inventes datos de contacto.\n- Algunas constructoras ya verificadas esperan su publicación semanal: salen con en_el_sitio: false, sin ficha, y todavía no están en la descarga.",
      "tools": [
        {
          "name": "buscar_cerca",
          "title": "Buscar empresas cerca de un lugar",
          "description": "Busca empresas dentro de un radio (km) alrededor de un municipio, una empresa, un parque industrial o unas coordenadas, ordenadas de la más cercana a la más lejana, con la distancia en km. Acepta los mismos filtros que buscar_empresas (texto, directorio, categoría, tamaño, sitio web y los de datos adicionales). El centro de un municipio es la mediana de las coordenadas de sus empresas. No devuelve teléfonos ni correos.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alta_desde": {
                "description": "Solo establecimientos que entraron al DENUE desde ese año o mes, 'AAAA' o 'AAAA-MM'. Es la fecha de alta en el DENUE, no la de fundación.",
                "maxLength": 7,
                "type": "string"
              },
              "capital_extranjero": {
                "description": "Solo empresas con inversión extranjera registrada en el RNIE de la Secretaría de Economía.",
                "type": "boolean"
              },
              "categoria": {
                "description": "Slug o nombre de categoría (ver listar_directorios), p. ej. naves-industriales, automotriz-aeroespacial, agencias-aduanales.",
                "maxLength": 80,
                "type": "string"
              },
              "cerca_de_empresa": {
                "description": "Centro: una empresa, por su id 'directorio:slug' o la URL de su ficha.",
                "maxLength": 300,
                "type": "string"
              },
              "cerca_de_parque": {
                "description": "Centro: un parque industrial, por su id de buscar_parques_industriales.",
                "maxLength": 120,
                "type": "string"
              },
              "certificado_ambiental": {
                "description": "Solo empresas con un certificado ambiental vigente de PROFEPA (Industria Limpia o Calidad Ambiental).",
                "type": "boolean"
              },
              "con_contacto": {
                "description": "Solo empresas que tienen teléfono o correo en la descarga de pago.",
                "type": "boolean"
              },
              "con_sitio_web": {
                "description": "Solo empresas con sitio web.",
                "type": "boolean"
              },
              "directorio": {
                "description": "construccion, industria, inmobiliarias o transporte. Omitir busca en los cuatro.",
                "enum": ["construccion", "industria", "inmobiliarias", "transporte"],
                "type": "string"
              },
              "estado": {
                "description": "Estado del municipio, para distinguir municipios con el mismo nombre.",
                "maxLength": 60,
                "type": "string"
              },
              "lat": {
                "description": "Centro: latitud (con lng).",
                "maximum": 33,
                "minimum": 14,
                "type": "number"
              },
              "lng": {
                "description": "Centro: longitud (con lat).",
                "maximum": -86,
                "minimum": -119,
                "type": "number"
              },
              "municipio": {
                "description": "Centro: municipio o ciudad, p. ej. Apodaca, Celaya, Silao.",
                "maxLength": 80,
                "type": "string"
              },
              "pagina": {
                "description": "Página, desde 1.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "por_pagina": {
                "description": "Resultados por página, máximo 25 (10 por omisión).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "proveedor_gobierno": {
                "description": "Solo empresas con contratos federales desde 2024 en ComprasMX (coincidencia por razón social).",
                "type": "boolean"
              },
              "radio_km": {
                "description": "Radio en km, 20 por omisión, máximo 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "tamano_minimo": {
                "description": "Tamaño mínimo por plantilla DENUE: micro (0-5), pequena (6-30), mediana (31-100), grande (101+).",
                "enum": ["micro", "pequena", "mediana", "grande"],
                "type": "string"
              },
              "texto": {
                "description": "Palabras a buscar, igual que en buscar_empresas.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
