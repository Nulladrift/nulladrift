        {
          "name": "get_catalysts",
          "title": "Next-48h catalyst calendar",
          "description": "Use this when you need to know whether the next hours contain a scheduled high-impact event: US macro releases, FOMC, Treasury auctions, SEC-filed or estimated earnings, and options expiry, each with an impact tier. Free. License: cleared. Attribution required: Sources: BLS, BEA, U.S. Census Bureau, DOL, Federal Reserve Board, U.S. Treasury (TreasuryDirect), SEC EDGAR. This service uses BEA data but is not endorsed or certified by BEA.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "hours": {
                "description": "Look-ahead window in hours (1-168, default 48).",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              },
              "include_estimated": {
                "description": "Include estimated (not yet SEC-confirmed) earnings dates (default true).",
                "type": "boolean"
              },
              "kinds": {
                "description": "Comma-separated filter: macro, fed, treasury_auction, earnings, options_expiry.",
                "type": "string"
              },
              "min_tier": {
                "description": "Lowest impact tier to include.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
