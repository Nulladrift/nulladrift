{
  "lockfileVersion": 2,
  "subjects": {
    "com.singsk/uml-plantuml": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://uml.singsk.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "uml-singsk-plantuml",
        "title": "uml.singsk.com PlantUML",
        "version": "1.1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PlantUML diagram-as-code service. Workflow: list_diagram_types / get_syntax_reference to ground the syntax -> validate_diagram (fix using error.line/hint) -> render_diagram. Tokens use PlantUML's own 64-character alphabet (\"0-9 A-Z a-z - _\") over raw DEFLATE. This is NOT base64 - never encode or decode tokens with a base64 codec; use encode_source / decode_token. Discovery: https://uml.singsk.com/api/ ; OpenAPI: https://uml.singsk.com/api/openapi.json",
      "tools": [
        {
          "name": "decode_token",
          "description": "Recover the PlantUML source from a token or from any PlantUML render URL (the token is extracted automatically). Tokens use PlantUML's own 64-character alphabet (\"0-9 A-Z a-z - _\") over raw DEFLATE. This is NOT base64 - never encode or decode tokens with a base64 codec; use encode_source / decode_token.",
          "inputSchema": {
            "properties": {
              "encoded": {
                "description": "Token or full render URL",
                "type": "string"
              }
            },
            "required": ["encoded"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d0b78d36c558c2d16e0e9e54e069089f25a4e6989715c22816d0e7dc4b0573c"
        },
        {
          "name": "encode_source",
          "description": "Encode PlantUML source into a URL token and ready-to-use share/render URLs (svg + png). The result carries url_ok: GET URLs only work while the token is at most 16000 characters; when url_ok is false do not share the URLs - render with render_diagram instead (it uses the POST API, no size limit up to 5 MB). Tokens use PlantUML's own 64-character alphabet (\"0-9 A-Z a-z - _\") over raw DEFLATE. This is NOT base64 - never encode or decode tokens with a base64 codec; use encode_source / decode_token.",
          "inputSchema": {
            "properties": {
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f65e83fef542b552c98da957798d638ed8be47b4f2dbdeaac63d6cfbaab65156"
        },
        {
          "name": "get_syntax_reference",
          "description": "Get the syntax reference entry for one diagram type: description, a render-verified example, and the help page URL. Use it to ground diagram generation.",
          "inputSchema": {
            "properties": {
              "type": {
                "description": "Type id or label, e.g. \"sequence\", \"class\", \"mindmap\", \"gantt\", \"json\"",
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8b7953bd58dd967e4071bd42c57b411eeb505e5a5dbc291400ce1680125a39d"
        },
        {
          "name": "list_diagram_types",
          "description": "List the 22 supported diagram/reference types with a one-line description and the local syntax reference URL for each. Use it to pick the right @start directive.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:211e90fb27b2caa74a68264765d18e1169b12499fc2ee19963c8e239101b3e3a"
        },
        {
          "name": "render_diagram",
          "description": "Render PlantUML source text to a diagram image. Returns a PNG image block (format \"png\") or the SVG markup as text (format \"svg\", default), plus the shareable render URL. The source is validated first: on a syntax error the result is an error object with line, column, hint and a help link so you can fix the diagram and retry.",
          "inputSchema": {
            "properties": {
              "format": {
                "default": "svg",
                "enum": ["svg", "png"],
                "type": "string"
              },
              "text": {
                "description": "PlantUML source including @startuml ... @enduml (or the matching @start/@end pair)",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f3a48e7d59280e14e67ebc10f04835a18ad3b5c5a29d9eb601314024336f3dc7"
        },
        {
          "name": "validate_diagram",
          "description": "Check PlantUML source without rendering. Returns {ok:true, diagram_type} or {ok:false, error:{code, message, line, column, source_line, hint, diagram_type_detected, help}}. Cheap - call it in a generate -> validate -> fix loop before rendering.",
          "inputSchema": {
            "properties": {
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:45cfe3b22cade0cde624686225c9a8b95e2fb1f2eb93ee28c93d2c45185d35f3"
        }
      ],
      "digest": "sha256:29df515926590c59d7c23911641ceafce06c3108ac003580a29cd3aefbf21471"
    }
  }
}
