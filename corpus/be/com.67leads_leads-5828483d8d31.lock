      "instructions": "67Leads is a warehouse of US local-business leads (trades, clinics, firms) with phone, owner name and mail-server-verified email where found. Counts, parsing, coverage and masked search are free; quote the price with quote_export and get the user's explicit yes before export_leads, which spends credits. Quoting and exporting need the user's 67Leads account (OAuth sign-in or an API key). Report counts exactly as returned; never round or estimate them.",
      "tools": [
        {
          "name": "count_leads",
          "title": "Count leads",
          "description": "Exact count of matching businesses, with how many have a verified email, an owner's name or no website, and the top cities. Free. Use this first to answer 'how many'.",
          "inputSchema": {
            "properties": {
              "active_since_days": {
                "description": "Only businesses with a Google review in the last N days (90 is a good default).",
                "type": "integer"
              },
              "city": {
                "type": "string"
              },
              "company": {
                "description": "Company name contains this text.",
                "type": "string"
              },
              "email_quality": {
                "description": "'valid' = confirmed by the mail server (default); 'valid_or_risky' adds catch-all domains.",
                "enum": ["valid", "valid_or_risky"],
                "type": "string"
              },
              "has_email": {
                "description": "Only rows with an email of email_quality.",
                "type": "boolean"
              },
              "has_owner": {
                "description": "Only rows with an owner's name.",
                "type": "boolean"
              },
              "has_phone": {
                "description": "Default true.",
                "type": "boolean"
              },
              "has_website": {
                "type": "boolean"
              },
              "max_rating": {
                "type": "number"
              },
              "max_reviews": {
                "type": "integer"
              },
              "min_rating": {
                "type": "number"
              },
              "min_reviews": {
                "type": "integer"
              },
              "new_within_days": {
                "description": "Only listings that appeared on Google Maps after their area's first scrape, first seen in the last N days (30 is a good default).",
                "type": "integer"
              },
              "no_analytics": {
                "description": "Only sites whose homepage was read and has no Google Analytics or tag manager.",
                "type": "boolean"
              },
              "no_booking": {
                "description": "Only sites whose homepage was read and shows no online booking.",
                "type": "boolean"
              },
              "no_fb_pixel": {
                "description": "Only sites whose homepage was read and has no Facebook pixel.",
                "type": "boolean"
              },
              "no_website": {
                "description": "Only businesses with no website.",
                "type": "boolean"
              },
              "personal_email": {
                "description": "Exclude info@/office@ style addresses.",
                "type": "boolean"
              },
              "q": {
                "description": "Plain-English search, e.g. 'roofers in Dallas TX with no website'. Explicit fields below override what the sentence says.",
                "type": "string"
              },
              "site_cms": {
                "description": "Site platform, comma-separated: wordpress, wix, squarespace, godaddy, weebly, duda, shopify, webflow, custom, or diy (any DIY site builder).",
                "type": "string"
              },
              "site_dead": {
                "description": "Only businesses whose website is down.",
                "type": "boolean"
              },
              "sms_ready": {
                "description": "Phone present and not toll-free.",
                "type": "boolean"
              },
              "state": {
                "description": "US state, code or name.",
                "type": "string"
              },
              "vertical": {
                "description": "Niche id from list_niches, e.g. 'roofing'.",
                "type": "string"
              }
            },
            "type": "object"
