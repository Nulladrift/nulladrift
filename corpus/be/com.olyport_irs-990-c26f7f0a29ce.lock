      "tools": [
        {
          "name": "get_nonprofit_details",
          "description": "Get detailed information about a nonprofit organization by EIN.\n\n    Returns comprehensive data from the organization's IRS 990 filings\n    including revenue, expenses, assets, executive compensation, and\n    filing history. Use search_nonprofits first to find the EIN.\n\n    Args:\n        ein: Employer Identification Number (e.g. '13-1837418' or '131837418').\n    ",
          "inputSchema": {
            "properties": {
              "ein": {
                "title": "Ein",
                "type": "string"
              }
            },
            "required": ["ein"],
            "title": "get_nonprofit_detailsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_nonprofit_detailsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f3293d6e9214a929d8188634bf54fe45d07092d196e3e76d039ea4ca99de0e6"
        },
        {
          "name": "get_nonprofit_filings",
          "description": "Get the filing history for a nonprofit organization.\n\n    Returns a list of all available IRS 990 filings for the organization,\n    including both filings with parsed data and those without. Useful for\n    tracking financial trends over time.\n\n    Args:\n        ein: Employer Identification Number (e.g. '13-1837418' or '131837418').\n    ",
          "inputSchema": {
            "properties": {
              "ein": {
                "title": "Ein",
                "type": "string"
              }
            },
            "required": ["ein"],
            "title": "get_nonprofit_filingsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_nonprofit_filingsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:87bf2f87854a748298cfb92c519f212a0b31b26705013e3d2c66c2d79677bc79"
        },
        {
          "name": "search_nonprofits",
          "description": "Search for nonprofit organizations by name or keyword.\n\n    Searches the ProPublica Nonprofit Explorer database of IRS 990 filers.\n    Returns organization name, EIN, location, revenue, and tax status.\n\n    Args:\n        query: Search keywords (e.g. 'food bank', 'habitat for humanity').\n        state: Two-letter state abbreviation to filter by (e.g. 'CA', 'TX').\n        ntee_code: NTEE major category code (1-10). 1=Arts, 2=Education,\n            3=Environment, 4=Health, 5=Human Services, 6=International,\n            7=Public Benefit, 8=Religion, 9=Mutual Benefit, 10=Unknown.\n        c_code: IRS subsection code (e.g. 3 for 501(c)(3), 4 for 501(c)(4)).\n        page: Zero-indexed page number (25 results per page).\n    ",
          "inputSchema": {
            "properties": {
              "c_code": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "C Code"
              },
              "ntee_code": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Ntee Code"
              },
              "page": {
                "default": 0,
                "title": "Page",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "State"
              }
            },
            "required": ["query"],
            "title": "search_nonprofitsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_nonprofitsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0041ae0b854e3cd35c34707348c15b17f969b0157c1de9472f3dde7a15eabe2a"
        }
      ],
