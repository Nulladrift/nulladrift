{
  "lockfileVersion": 2,
  "subjects": {
    "com.amberstocks/amber-finance": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://amberstocks.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "amber-finance",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "amber_compare_companies",
          "description": "Compare 2 to 5 public companies side-by-side on Market Cap, True FCF Margin, Stock-Based Compensation %, 4Y share dilution, and Reverse DCF priced-in growth, returning a shareable Amber comparison URL.",
          "inputSchema": {
            "properties": {
              "tickers": {
                "description": "Array of 2 to 5 ticker symbols.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["tickers"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:954d3f8a817ec9c0013f97e21edb6d5317ce78ade51459fe0d687889d606d40f"
        },
        {
          "name": "amber_get_company",
          "description": "Get SEC EDGAR-verified fundamentals for a public US company: True Free Cash Flow (FCF minus Stock-Based Compensation), SBC % of revenue, 4-year share dilution, Reverse DCF implied 10-year revenue growth, balance sheet, recent 10-K/10-Q filing diffs, and Form 4 insider buys. Includes canonical Amber links.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "Stock ticker symbol (e.g. NVDA, AAPL, MSFT, PLTR).",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0fe41765edb7641984f9efe3cdcd92eba36b38a2107df852d7747f9cfca93c4"
        },
        {
          "name": "amber_get_recent_signals",
          "description": "Fetch recent high-signal SEC 10-K/10-Q filing prose diffs, Form 8-K events, and open-market Form 4 insider purchases across the market or for a specific ticker.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max items per category (1-25, default 10).",
                "type": "number"
              },
              "ticker": {
                "description": "Optional ticker to filter by.",
                "type": "string"
              },
              "type": {
                "description": "Signal category (default: all).",
                "enum": ["all", "diffs", "insiders"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13c51e6d1e51a756320646428b404052ade02b437972aaea4cd640c0d071d684"
        },
        {
          "name": "amber_screen_companies",
          "description": "Screen 720+ Nasdaq and NYSE companies by True Free Cash Flow margin, Stock-Based Compensation burden, 4-year net share dilution, Reverse DCF implied growth, sector, or curated Amber discovery lenses (cash-machines, buyback-cannibals, underpriced, rule-of-40, hidden-dilution, insider-buys, material-events).",
          "inputSchema": {
            "properties": {
              "lens": {
                "description": "Optional lens slug.",
                "type": "string"
              },
              "limit": {
                "description": "Max companies to return (default 15).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxDilution": {
                "description": "Maximum 4Y annual share count change % (negative = buybacks).",
                "type": "number"
              },
              "maxImpliedCagr": {
                "description": "Maximum priced-in 10Y revenue CAGR %.",
                "type": "number"
              },
              "maxSbcPct": {
                "description": "Maximum SBC % of revenue.",
                "type": "number"
              },
              "minMarketCapB": {
                "description": "Minimum market cap in billions USD.",
                "type": "number"
              },
              "minTrueFcfMargin": {
                "description": "Minimum True FCF margin %.",
                "type": "number"
              },
              "sector": {
                "description": "Optional sector name or slug (e.g. technology, healthcare).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a86e0d981d9bb751396d5e6e3bec61957759af84e9cb97dd5c3a2fe075e6f4f"
        }
      ],
      "digest": "sha256:c26625a8f6a4deffbdf585e247d20a767189cb32f9aac55b334fb4ec7bae6750"
    }
  }
}
