      },
      "instructions": "Read-only Solar Israel tools for guides, the site calculator, the public company directory, verified facts, and a WhatsApp link to נגה. כלים לקריאה בלבד. Do not send a name, phone, or email. Do not promise a number of quotes. Do not name an installer. The electricity rate is a site assumption, not the official tariff.",
      "tools": [
        {
          "name": "estimate_system",
          "title": "Estimate a system",
          "description": "Estimate a solar system with the site calculator formulas. הערכת מערכת לפי נוסחאות המחשבון באתר. The electricity rate is a site assumption, not the official tariff.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Hebrew city name. Optional.",
                "maxLength": 40,
                "type": "string"
              },
              "direction": {
                "description": "Roof direction. Default south.",
                "enum": ["south", "southeast", "southwest", "east", "west", "east-west", "northeast", "northwest", "north", "flat"],
                "type": "string"
              },
              "monthly_bill_ils": {
                "description": "Monthly bill in ILS. One of kWh or bill is required.",
                "maximum": 200000,
                "minimum": 1,
                "type": "number"
              },
              "monthly_kwh": {
                "description": "Monthly use in kWh. One of kWh or bill is required.",
                "maximum": 200000,
                "minimum": 1,
                "type": "number"
              },
              "residential": {
                "description": "Default true.",
                "type": "boolean"
              },
              "roof_sqm": {
                "description": "Roof area in square meters.",
                "maximum": 5000,
                "minimum": 8,
                "type": "number"
              }
            },
            "required": ["roof_sqm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
