        {
          "name": "create_review",
          "description": "Start a new Cobalt Capture review and get a handle for filling it in. Use this to compile the findings of any site study — a usability pass, a pricing teardown, a positioning audit, a QA run — into one shareable, durable report with real screenshots. Works from any client, chat assistants included: with no browser, add_screenshot(page_url=...) renders the pages for you. Returns a `review` slug and a `claim_token` — pass BOTH back to add_screenshot / add_note to append content. Also returns a `review_url` to share and a `save_url` the human opens (while signed in) to save the review to their account permanently. The review is anonymous and auto-deletes after 30 days unless saved.",
          "inputSchema": {
            "properties": {
              "product_url": {
                "description": "Optional URL of the product/site under review.",
                "type": "string"
              },
              "summary": {
                "description": "Optional overview shown at the top of the review (plain text or markdown). Good place for the overall task, outcome, and headline findings.",
                "type": "string"
              },
              "title": {
                "description": "Title of the review, e.g. 'Onboarding walkthrough — Jupiter Invoice'.",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a review"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0dd99343c277433e1dee86fe65e6bdffb11d1f3d939c5a343be7fc14213a514"
        },
