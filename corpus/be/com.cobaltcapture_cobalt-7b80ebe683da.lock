      "instructions": "Cobalt Capture stores product reviews (screenshots with notes and annotations) at a shareable link. Any MCP client can read or write them.\n\nRead: get_review takes a review URL (/r/<slug> or /s/<slug>) or slug and returns the notes as text plus each annotated screenshot as an image. search and fetch cover only the studies Cobalt has published about well-known products.\n\nWrite: create_review returns a review slug and a claim_token; add_screenshot, add_note, replace_screenshot and update_review take both. update_review sets the summary at the top of the review. An anonymous review is deleted after 30 days unless someone signed in opens its save_url. A review already saved to an account takes the agent token its owner creates on the review page (Export & more, then Hand to your agent) in place of the claim_token.\n\nScreenshots: add_screenshot with page_url renders a public page server-side (desktop or mobile) and returns the image. Pages behind a login need an image_url from the client's own capture.\n\nStudy methods: get_playbook(name) returns a written review method, also offered as MCP prompts and published at https://cobaltcapture.com/developers#playbooks. usability_pass: a first-time user signs up and tries real tasks (needs a browser). flow_pass: one named flow, step by step, with its emails (needs a browser). pricing_teardown: what a buyer would pay (public pages). website_teardown: homepage and marketing pages (public pages). comparison_study: two or three products for one decision (public pages). investigation_pass: a product the user owns, usually with its code. design_pass: how screens look on phones, tablets and desktops (needs a browser).\n\nTest inboxes: create_inbox and check_inbox give temporary addresses for testing the signup flow of a product the user owns or is authorised to test. Each lasts 24 hours.",
      "tools": [
        {
          "name": "add_note",
          "description": "Append a free-standing text note (not tied to a screenshot) to a review created by create_review. Use for context, steps taken, or a summary of findings between screenshots.",
          "inputSchema": {
            "properties": {
              "claim_token": {
                "description": "The claim_token from create_review (authorizes the write). For a review the human has SAVED to their account, pass the agent token they generated on the review page (Export & more → Hand to your agent) here instead.",
                "type": "string"
              },
              "review": {
                "description": "The review slug or URL from create_review.",
                "type": "string"
              },
              "text": {
                "description": "The note text (plain text or markdown).",
                "type": "string"
              }
            },
            "required": ["claim_token", "review", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add a note to a review"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20a1540c37bc940d1a6bedce2c32fdf47c8c5a9c7c5f42e9add30959e619f97d"
        },
        {
          "name": "add_screenshot",
          "description": "Append one screenshot, with an optional title and note, to the end of a review. The image is stored in Cobalt and shown in the review. Three ways to supply it: `page_url`, a public page that Cobalt renders in a headless browser (`viewport` 'desktop' at 1280px or 'mobile' at 390px, `full_page` for the whole scroll, `hide_selectors` for elements to hide; common cookie banners are hidden automatically), which also returns the rendered image; `image_url`, an image already uploaded to https://cobaltcapture.com/api/upload; or `image`, a small base64 image. This tool only appends; it never changes an existing item (replace_screenshot does that).",
          "inputSchema": {
            "properties": {
              "claim_token": {
                "description": "The claim_token from create_review (authorizes the write). For a review the human has SAVED to their account, pass the agent token they generated on the review page (Export & more → Hand to your agent) here instead.",
                "type": "string"
              },
              "comment": {
                "description": "Optional note describing what this screen shows or what's wrong with it.",
                "type": "string"
              },
              "full_page": {
                "description": "With page_url: capture the entire scrollable page instead of the first viewport. Default false. Pages that scroll inside an inner container come back viewport-sized.",
                "type": "boolean"
              },
              "hide_selectors": {
                "description": "With page_url: extra CSS selectors to hide before the shot, e.g. ['#newsletter-modal', '.chat-widget']. Common cookie and consent banners are hidden on every render.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "image": {
                "description": "A small base64-encoded PNG, JPEG or WebP (data: URL prefix accepted). Intended for images under about 100 KB; larger screenshots are better uploaded and passed as image_url.",
                "type": "string"
              },
              "image_url": {
                "description": "An image URL on Cobalt's own image host, as returned by https://cobaltcapture.com/api/upload (multipart field `file`, returns {url, key}) or by the editor's window.cobaltGrab(). External URLs are refused.",
                "type": "string"
              },
              "page_url": {
                "description": "A public http(s) page for Cobalt to render and screenshot server-side. Pages behind a login can't be rendered. Becomes the item's source_url unless one is passed. Takes 10 to 30 seconds; a site that blocks automated browsers returns an error.",
                "type": "string"
              },
              "review": {
                "description": "The review slug or URL from create_review.",
                "type": "string"
              },
              "source_url": {
                "description": "Optional URL of the page the screenshot was taken on.",
                "type": "string"
              },
              "title": {
                "description": "Optional short caption for the screenshot.",
                "type": "string"
              },
              "viewport": {
                "description": "With page_url: 'desktop' (1280x800, default) or 'mobile' (390x844 phone, 2x, touch).",
                "enum": ["desktop", "mobile"],
                "type": "string"
              }
            },
            "required": ["claim_token", "review"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add a screenshot to a review"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:65b1b6c9e2699cdaea2cfdeede4f93c517427263469a8bc46e275931b704a871"
        },
        {
          "name": "check_inbox",
          "description": "Read mail delivered to an inbox from create_inbox, newest first, for example a verification code or confirmation link from the signup email of the product being tested. Requires the inbox_token, so only whoever created the inbox can read it. Returns immediately; mail usually arrives within seconds, so an empty result can be checked again shortly. format=\"html\" returns each message's HTML for reviewing the email's design.",
