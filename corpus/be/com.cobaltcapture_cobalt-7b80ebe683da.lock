      "prompts": [
        {
          "name": "comparison_study",
          "description": "Compare two or three products for one buying decision, delivered as a shareable Cobalt review. Starts with a thinking phase (what decides this category, weighted criteria, the two or three questions that change the weights) with one approval stop, then captures each maker's page, researches every cell with a dated source, and delivers a matrix with an edge on every row, the critical differences, and an overall LEAN with what would flip it. Software or physical goods. Public pages plus web search, no accounts — runs from a chat client too.",
          "arguments": [
            {
              "name": "products",
              "description": "Two or three products, names or URLs, e.g. 'Linear vs Jira vs Asana' or 'Rolex Datejust 36, Omega Aqua Terra 38'",
              "required": true
            },
            {
              "name": "criteria",
              "description": "Optional: what matters to you, in plain words ('pricing, features, whether the company is stable'). Left blank, the study proposes a set for the category and confirms it once.",
              "required": false
            },
            {
              "name": "context",
              "description": "Optional: your situation ('I'm early and don't know where to start', 'team of 12, need SSO', 'enterprise focus').",
              "required": false
            }
          ],
          "digest": "sha256:465ba868fe0177e0a82ac9827da553adb75d35da2e1a1bbcb2c3cd46b470d20b"
        },
        {
          "name": "design_pass",
          "description": "Design pass, delivered as a shareable Cobalt review: what the product looks like on the devices its team doesn't use. Sweeps nine phone, tablet and desktop sizes with menus, dialogs and forms opened; a script in the page nominates uneven padding, near-miss alignment, uneven gaps, wrapped buttons, cut-off and colliding text, sideways scroll, small form fields and unreadable contrast, and the agent confirms each one by eye. Reports problems, not fixes. Best as a companion to a usability or scenario review, so it reaches modals, results and emails; always in its own review. Needs a browser.",
          "arguments": [
            {
              "name": "url",
              "description": "The site to check, e.g. https://example.com",
              "required": true
            },
            {
              "name": "mode",
              "description": "Optional: 'owned' if you have the codebase here, 'external' if not. Left blank, it works this out.",
              "required": false
            },
