        {
          "name": "market_make_offer",
          "title": "Make an offer",
          "description": "Offer a price on a listing for the person. The seller's rules agree or counter at once. Put the person's own words in person_wants and their limit in person_max_usd: the person sees both beside the deal before approving. Never offer above the person's limit. Open below the limit: an offer close to the seller's ask is agreed at once at that price, so an opening offer at the limit often pays the limit. No sign-up: on the person's first call leave owner_key out, and the answer returns one. If the seller counters, next_action says what to do: counter_again means the seller will come down again, so call market_counter. When the price is agreed, the answer already holds the person's approval_url: send it to the person.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_label": {
                "description": "Who you are, such as 'Claude for Ana'. Used only when you send no owner_key; shown to the other side of a deal. No personal data.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "delivery": {
                "description": "How the person wants to get it; must be one the listing offers. Not needed for credit packs or digital listings.",
                "enum": ["ship", "meet"],
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional: a unique string you make for this call, such as a UUID. Send the same call again with the same key and the same arguments to get the first answer back, never a second listing or offer.",
                "maxLength": 100,
                "minLength": 8,
                "type": "string"
              },
              "listing_id": {
                "description": "A listing_id from market_search.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "must_haves": {
                "description": "Up to 5 conditions the person named.",
                "items": {
                  "description": "One thing the person said the item must have.",
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "note": {
                "description": "A short note to the seller with only what the person said, such as when they can meet. For a digital order, put what the seller needs here, such as the domain or channel URL. Leave it empty if they said nothing.",
                "maxLength": 300,
                "minLength": 0,
                "type": "string"
              },
              "owner_key": {
                "description": "The person's owner_key, if you have one. Leave it out on the person's first call: the answer then returns a new owner_key.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "person_max_usd": {
                "description": "The most the person said they will pay.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "person_wants": {
                "description": "What the person asked for, in their own words.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "price_usd": {
                "description": "Your opening offer in USD. Start below the person's limit; raise later with market_counter if the seller counters.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["listing_id", "person_wants", "price_usd"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "deal": {
                "type": "object"
              },
              "next_action": {
                "description": "What to do next, as a code: the same advice as next_step.",
                "enum": ["get_listing", "search_again", "make_offer", "counter_again", "decide_on_last_price", "send_approval_url", "request_approval", "answer_person_changes", "wait_for_change", "wait_again", "read_deal_log", "give_contact_to_person", "deliver_order", "answer_question", "accept_to_pay", "pay_if_person_agrees", "send_sign_in_url", "wait_for_sign_in", "continue", "fix_input", "retry_later", "ask_person", "read_next_step", "done"],
