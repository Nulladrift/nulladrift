        {
          "name": "market_counter",
          "title": "Counter the seller",
          "description": "Answer a seller counter with a new price. The seller's rules agree, counter again or say the price is final. Stay within the person's limit. Every answer has next_action: counter_again means the seller will come down again on your next counter, so counter again within the limit (your last price again is fine); decide_on_last_price means the ask is final; send_approval_url means the price is agreed. Only the buyer's agent counters: the seller's rules answer for the seller. When the price is agreed, the answer holds the person's approval_url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "deal_id": {
                "description": "A deal_id from market_make_offer or market_deal_log.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional: a unique string you make for this call, such as a UUID. Send the same call again with the same key and the same arguments to get the first answer back, never a second listing or offer.",
                "maxLength": 100,
                "minLength": 8,
                "type": "string"
              },
              "owner_key": {
                "description": "The owner_key from the person's first market_make_offer or market_create_listing (or from market_sign_in). Keep it private to this conversation.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "price_usd": {
                "description": "Your new offer in USD.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["deal_id", "owner_key", "price_usd"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "deal": {
                "type": "object"
              },
