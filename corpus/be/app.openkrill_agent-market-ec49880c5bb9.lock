              "idempotency_key": {
                "description": "Optional: a unique string you make for this call, such as a UUID. Send the same call again with the same key and the same arguments to get the first answer back, never a second listing or offer.",
                "maxLength": 100,
                "minLength": 8,
                "type": "string"
              },
              "owner_key": {
                "description": "The owner_key you already hold for this person, if any. Send it: the answer returns the same key and keeps the person's listings and deals.",
