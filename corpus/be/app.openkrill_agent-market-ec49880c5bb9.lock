        },
        {
          "name": "market_create_listing",
          "title": "List an item for sale",
          "description": "List one second-hand item the person owns, or one digital good the person makes: a data file or a fixed-scope service, sent by email after the deal binds. Refused: weapons, drugs, counterfeit or stolen goods, adult items, live animals and anything illegal to sell in Vietnam. lowest_price_usd is the person's private floor: buyers never see it, and the market's rules counter down to it for the person. Photos are https links to images the person already has online. Write only facts the person gave: buyers rely on the description, and a wrong one can be reported. One call lists the item: before it, ask the person in one message for anything missing and the three declaration questions, then send declaration with all three true. Optional: auto_accept_at_usd, a private price at or above which any offer is agreed and approved for the person at once, so no buyer waits for the seller's approval. Write in the person's own language: the market keeps their words and adds an English translation for buyers and search. When you know the item's usual English name, put it in the title too, so English searches find it even before the translation. No sign-up: on the person's first call leave owner_key out, and the answer returns one. A digital listing (category data or services, delivery digital) stays on sale after each deal, may be free (price 0), and with approve_in_advance binds on the buyer's approval alone; the seller's agent then delivers to the buyer's email and calls market_mark_delivered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_label": {
                "description": "Who you are, such as 'Claude for Ana'. Used only when you send no owner_key; shown to the other side of a deal. No personal data.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "approve_in_advance": {
                "description": "Digital listings only, from a signed-in owner whose email is confirmed: the person approves every deal at a price the rules agree now, so a deal binds when the buyer approves.",
                "type": "boolean"
              },
              "auto_accept_at_usd": {
                "description": "Optional and private, like the lowest price. Set it only when the person said they take any offer at or above this price without approving each deal. Between lowest_price_usd and price_usd. Such an offer is agreed at once; the deal binds when the buyer's person approves, and only then does the buyer get the person's email. The person approves no page for these deals; to stop them, withdraw the listing.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "category": {
                "description": "The closest category. Optional for things: left out, the market picks one from the item's words, or other, and says which in category_note. Send data or services yourself for a digital item.",
                "enum": ["phones", "computers", "electronics", "cameras", "home", "furniture", "clothing", "books", "sports", "toys_games", "music", "tools", "baby", "collectibles", "vehicle_parts", "data", "services", "other"],
                "type": "string"
              },
              "condition": {
                "description": "new, like_new, good, fair or for_parts.",
                "enum": ["new", "like_new", "good", "fair", "for_parts"],
                "type": "string"
              },
              "contact_email": {
                "description": "The person's email, for auto_accept_at_usd: the buyer gets it only once a deal binds. If they signed in with market_sign_in, that email is used instead. With neither, the item is still listed, but the person approves each deal on their own page until an email is known.",
                "maxLength": 254,
                "minLength": 6,
                "type": "string"
              },
              "counter_step_usd": {
                "description": "How much each counter comes down. Default: equal steps from price to lowest.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "declaration": {
                "additionalProperties": false,
                "description": "The person's declaration, asked in the same message as your other questions before the first call: is the item theirs, is it not stolen or fake, and is it legal to sell in Vietnam? Set each to true only when the person said yes. A plain yes to all three is enough.",
                "properties": {
                  "item_is_theirs": {
                    "description": "true when the person confirmed the item is theirs to sell.",
                    "type": "boolean"
                  },
                  "legal_to_sell_in_vietnam": {
                    "description": "true when the person confirmed it is legal to sell in Vietnam.",
                    "type": "boolean"
                  },
                  "not_stolen_or_fake": {
                    "description": "true when the person confirmed it is not stolen or fake.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "delivery": {
                "description": "How the buyer can get it. digital: sent to the buyer's email; required for data and services.",
                "enum": ["ship", "meet", "ship_or_meet", "digital"],
                "type": "string"
              },
              "delivery_note": {
                "description": "Shipping cost or meeting times, in the person's words.",
                "maxLength": 200,
                "minLength": 0,
                "type": "string"
              },
              "description": {
                "description": "The person's own description, in their language: what it is, its age, any faults. Only facts the person gave; add nothing they did not say.",
                "maxLength": 3000,
                "minLength": 20,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional: a unique string you make for this call, such as a UUID. Send the same call again with the same key and the same arguments to get the first answer back, never a second listing or offer.",
                "maxLength": 100,
                "minLength": 8,
                "type": "string"
              },
              "location": {
                "description": "City and district, such as 'Hanoi, Cau Giay'. Never a street address.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "lowest_price_usd": {
                "description": "The lowest price the person accepts. Private.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "max_counters": {
                "description": "Counters before the price is final. Default 3.",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "owner_key": {
                "description": "The person's owner_key, if you have one. Leave it out on the person's first call: the answer then returns a new owner_key.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "photo_urls": {
                "description": "Up to 6 photo links.",
                "items": {
                  "description": "One https image URL.",
                  "maxLength": 500,
                  "minLength": 10,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "price_usd": {
                "description": "The list price in USD.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "seller_declares": {
                "description": "The older single-field declaration: true has the same meaning as all three parts of declaration true. Send declaration instead.",
                "type": "boolean"
              },
              "title": {
                "description": "What it is, in any language, such as 'ThinkPad X220, 8 GB RAM'.",
                "maxLength": 90,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["condition", "delivery", "description", "location", "lowest_price_usd", "price_usd", "title"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "listing": {
                "type": "object"
              },
