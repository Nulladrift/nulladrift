                "type": "string"
              },
              "next_cursor": {
                "description": "Send as cursor for the next page; null on the last page.",
                "type": ["string", "null"]
              },
              "next_step": {
                "description": "What to do next, in one or two sentences.",
                "type": "string"
              }
            },
            "required": ["count", "listings", "next_action", "next_step"],
            "type": "object"
