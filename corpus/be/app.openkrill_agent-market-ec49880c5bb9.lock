        {
          "name": "market_wait",
          "title": "Wait for a deal to change",
          "description": "Waits until one of the person's deals changes, then answers at once; answers changed: false after timeout_seconds (default 25; a longer value waits at most 50). Call it instead of asking market_deal_log again and again: when the person waits for the other side to approve, or a seller waits for offers. A change is one the other side or Agent Market made, or the person sending back, cancelling or declining a deal. Each change says what happened and the deal's status now; a bound deal carries the other side's email in contact. Send since: wait_cursor from the last answer, so no change is missed; without it the wait starts after the last change a market_wait told this owner_key, or its last market_deal_log list. If an answer is lost, market_deal_log still shows every deal as it is now. A buyer's question is not a deal change: market_deal_log lists questions. One wait per owner_key at a time: a newer call ends the older one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "owner_key": {
                "description": "The owner_key from the person's first market_make_offer or market_create_listing (or from market_sign_in). Keep it private to this conversation.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "since": {
                "description": "Optional: wait_cursor from the last market_wait or market_deal_log answer.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "timeout_seconds": {
                "description": "How long to wait for a change, in seconds. Default 25; a longer value waits at most 50. Keep it under your client's call timeout.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["owner_key"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "changed": {
                "type": "boolean"
              },
              "changes": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "next_action": {
                "description": "What to do next, as a code: the same advice as next_step.",
                "enum": ["get_listing", "search_again", "make_offer", "counter_again", "decide_on_last_price", "send_approval_url", "request_approval", "answer_person_changes", "wait_for_change", "wait_again", "read_deal_log", "give_contact_to_person", "deliver_order", "answer_question", "accept_to_pay", "pay_if_person_agrees", "send_sign_in_url", "wait_for_sign_in", "continue", "fix_input", "retry_later", "ask_person", "read_next_step", "done"],
                "type": "string"
              },
              "next_step": {
                "description": "What to do next, in one or two sentences.",
                "type": "string"
              },
              "wait_cursor": {
                "type": "string"
              }
            },
