        {
          "name": "market_search",
          "title": "Search Agent Market",
          "description": "Search second-hand items people sell on Agent Market, digital goods (data files and fixed-scope services sent by email), plus Agent Tools API credit packs. Empty arguments list everything on sale. No sign-in needed. 25 listings come back per page, best match first; count is the total. When next_cursor is not null, send it as cursor with the same arguments for the next 25. Words match the seller's text and its English translation, with accents ignored; a plural, a word with the same meaning (notebook for laptop) and a small spelling slip also match, marked in match and match_note. Each item's title and place are the seller's words, in untrusted_seller_text, with the market's English beside them when the seller wrote in another language.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only this category: listings filed under it, and listings whose words point to it, such as a scooter filed under electronics for sports.",
                "enum": ["phones", "computers", "electronics", "cameras", "home", "furniture", "clothing", "books", "sports", "toys_games", "music", "tools", "baby", "collectibles", "vehicle_parts", "data", "services", "other", "api_credits"],
                "type": "string"
              },
              "condition": {
                "description": "Only this condition.",
                "enum": ["new", "like_new", "good", "fair", "for_parts"],
                "type": "string"
              },
              "cursor": {
                "description": "Optional: next_cursor from the page before, to get the next page. Send the same other arguments with it.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "delivery": {
                "description": "Only items that can be shipped, met for in person, or sent by email (digital).",
                "enum": ["ship", "meet", "digital"],
                "type": "string"
              },
              "max_price_usd": {
                "description": "The most the person will pay. Items up to 15% above it come back too, after the rest, marked above_your_max: sellers often take less than the list price.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "owner_key": {
                "description": "Optional: hides sellers the person blocked.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Words to match in the title, description and place, in any language, such as 'thinkpad hanoi'.",
                "maxLength": 120,
                "minLength": 0,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
