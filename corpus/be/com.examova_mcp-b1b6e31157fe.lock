      },
      "instructions": "Examova is an independent professional exam-preparation platform for CIPS Level 4, PMP and PRINCE2 7 Foundation. Start with list_certifications or search_site. Use get_exam_info, list_modules and get_module_info for facts, search_practice_questions to quiz the user with curated public-preview practice questions, search_guides and get_guide for free study articles, get_exam_schedule for CIPS sittings and get_pricing for plans. The complete question bank, study pages and explanations are in Examova Pro and are never returned here. Verify high-stakes certification facts with the official provider, and link the Examova URL you used.",
      "tools": [
        {
          "name": "compare_certifications",
          "title": "Compare Certifications",
          "description": "Compare certifications side by side (provider, edition, exam format and pass mark where the issuer publishes one). Pass slugs, or omit to compare all. Verify high-stakes facts with the issuer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "certifications": {
                "description": "Optional slugs or codes to compare",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "compareUrl": {
                "type": "string"
              },
              "comparison": {
                "items": {
                  "properties": {
                    "assessmentScope": {
                      "type": "string"
                    },
                    "edition": {
                      "type": "string"
                    },
                    "passPercentage": {
                      "type": ["number", "null"]
                    },
                    "provider": {
                      "type": "string"
                    },
                    "questionCount": {
                      "type": ["number", "null"]
                    },
                    "slug": {
                      "type": "string"
                    },
                    "timeMinutes": {
                      "type": ["number", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["slug", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["comparison"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare Certifications"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d7fc2fd67462969bfbaab167ffb306a6b68914faa33ce034778dc97403c3925"
        },
        {
          "name": "get_exam_info",
          "title": "Get Exam Info",
          "description": "Current public exam facts for one certification: edition, exam format (question count, time, pass mark where the issuer publishes a fixed one), PMP domain weights, and links to its module pages. CIPS Level 4 assessments vary by module, so its facts are given per module.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "certification": {
                "description": "Certification slug, code or name, e.g. \"pmp\", \"cips-l4\", \"prince2-foundation\". Call list_certifications for the live list.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["certification"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assessmentScope": {
                "enum": ["certification_wide", "module_specific"],
                "type": "string"
              },
              "certification": {
                "type": "string"
              },
              "domains": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "weightPercent": {
                      "type": "number"
                    }
                  },
                  "required": ["name", "weightPercent"],
                  "type": "object"
                },
                "type": "array"
              },
              "edition": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "moduleUrls": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "passPercentage": {
                "type": ["number", "null"]
              },
              "provider": {
                "type": "string"
              },
              "questionCount": {
                "type": ["number", "null"]
              },
