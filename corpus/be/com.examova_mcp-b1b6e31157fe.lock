        {
          "name": "search_practice_questions",
          "title": "Search Practice Questions",
          "description": "Return curated Examova public-preview practice questions for a certification, optionally filtered by module or keyword. Use it to quiz the user: show the stem and options, let them answer, then reveal correctLabel. Returns the question, options and correct answer letter; full explanations and the complete question bank need an Examova account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "certification": {
                "description": "Certification slug, code or name, e.g. \"pmp\", \"cips-l4\", \"prince2-foundation\". Call list_certifications for the live list.",
                "maxLength": 80,
                "type": "string"
              },
              "keyword": {
                "description": "Optional topic keyword to filter, e.g. \"negotiation\" or \"risk\"",
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "description": "How many questions (1-5, default 3)",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "module": {
                "description": "Optional module code, e.g. \"L4M3\"",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["certification"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "certification": {
                "type": "string"
              },
              "questions": {
                "items": {
                  "properties": {
                    "correctLabel": {
                      "type": "string"
                    },
                    "module": {
