        "name": "com.octurasolutions/site-tools",
        "title": "Octura Solutions Site Tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Deterministic ERP calculators and estimators from Octura Solutions (Odoo implementation/migration/upgrade cost, ROI, TCO, odoo.conf tuning, EDI readiness, sales tax, payroll, inventory math). Every calculator clamps invalid input to safe defaults and returns the normalized input it actually used alongside the result. Content tools answer questions about Odoo and Octura: ask_octura retrieves relevant site pages to cite, compare_odoo_vs returns a head-to-head against any of 60 competitors, and get_odoo_pricing, find_odoo_apps_for and get_partner_profile return pricing, app recommendations and company facts. All tools are read-only.",
      "tools": [
        {
          "name": "ask_octura",
          "title": "Ask Octura (search the site)",
          "description": "Retrieve the most relevant pages from octurasolutions.com (guides, Odoo vs X comparisons, Odoo app pages, pricing, partner info) for an Odoo or ERP question, so you can answer grounded in Octura content and cite the source URLs. Retrieval only; you compose the answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max sources to return (1 to 10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "The user question about Odoo, ERP, or Octura, in natural language.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7cfa2d238da5642221afdd0b282bab7925a954751328099b4bc9c0231c6ceb76"
        },
