          "description": "The card for one film on one board: title, year, runtime, genres, directors, cast, overview, rating, a trailer url and a TMDB poster url when present, its upcoming showtimes nearest first with venue/time/ticket link, and a last-night flag when the run is ending. Returns the 40 nearest showtimes (\"concise\") or up to 200 (\"detailed\"); showtime_count is the total and showtimes_complete says whether the list is whole — scenef_search_showtimes with a date or theater narrows the rest. Read-only: the call itself records nothing. SceneF does not sell, hold or book tickets. Ticket links are https://scenef.com/go/{id} redirects to the theater's own site or the ticket seller it uses (a link to a showtime that is gone lands back on SceneF); whoever follows one, a person or a client, is logged once anonymously (time, the screening with its film and theater, client type, browser family, referring site, link source tag, and whether the showtime was gone; no IP address, cookie or account) and forwarded. Every emitted showtime carries confidence, source tier, reporting sources and verified_at.",
