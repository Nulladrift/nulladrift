      "instructions": "Read-only movie showtimes across 56 regional boards in California, Florida and Hawaii — chains, independents, repertory and drive-ins. Each board-reading tool reads ONE board per call and takes a `region` board id; omitted means \"sf\" (San Francisco), and it is never inferred from where you are. For a city, ZIP or neighborhood call scenef_resolve_board first; when it answers outside_coverage, say SceneF has no board for that place and never present another board's listings as that place's (nearest_lit, when present, names published boards within 100 miles); when it answers unknown, the name is not in SceneF's place table, so ask the person for a nearby city, or call scenef_now with no region and use a board only if its place name plainly covers the place asked about. Call scenef_now with no region for the list of boards — each id comes with the place it names, so sgv reads as the San Gabriel Valley rather than a bare handle. TIMES ARE THE THEATER'S OWN WALL CLOCK, not one city's: the boards keep 4 time zones, and Hawaii keeps no daylight saving time, so it is two or three hours behind Pacific depending on the season. A board's timezone is reported with its data and is the only zone its times mean anything in. A screening belongs to the NIGHT it opens: a 12:15am Saturday show is Friday night. Use ticket and calendar URLs exactly as returned, preserving their region query parameters. SceneF does not sell, hold or book tickets. Ticket links use https://scenef.com/go/{screeningId}: a tool call records nothing; whoever follows one, a person or a client, is logged once anonymously (time, the screening with its film and theater, client type, browser family, referring site, link source tag, and whether the showtime was gone; no IP address, cookie or account) and forwarded to the theater's own site or the ticket seller it uses. Film pages https://scenef.com/film/{slug}, or /film/{slug}/{regionSlug} for a specific board. Start with scenef_now to check freshness, scenef_plan_movie_night for recommendations. Every showtime carries a confidence level, a source tier and a last-verified time, and the running record of SceneF's own verification checks, failures included, is public at https://scenef.com/api/accuracy (add ?region= for a board). Call scenef_accuracy for that record as numbers you can quote. Every returned showtime carries confidence, source_tier, sources, verified_at and freshness. Use freshness to distinguish retained or stale source evidence from a newly generated board; detailed responses include more rows, not stronger evidence. Many showtimes, including most chain theaters and some independents, come from a third-party showtimes data service rather than from the theater itself; they are labeled source_tier licensed-feed and carry the weakest claim on the site.",
      "tools": [
        {
          "name": "scenef_accuracy",
          "title": "The accuracy record",
          "description": "Returns SceneF's verification record: this board's confidence mix, the counts of verification checks confirmed / missing / unreachable over the record's window (window_days in the payload — 30 days at present) with the pass rate and the exact denominator it was computed from, the same per venue with source tier and last-verified time, and the definitions of every level. Checks that could not run — a bot wall, a client-rendered page — are graded unreachable and excluded from the pass rate rather than counted as passes. Quote these numbers directly; they are recomputed on every call. Read-only: the call itself records nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "region": {
                "description": "Which regional board to read: a board id such as \"sf\", \"oahu\" or \"miami\", not a city name (\"Honolulu\" or \"Chicago\" is rejected). Omitted means \"sf\" (San Francisco); it is never inferred from where you are. For a city, ZIP or neighborhood call scenef_resolve_board first; scenef_now with no region lists every id. An unknown region is an error, not a fallback.",
                "maxLength": 120,
                "type": "string"
              },
              "response_format": {
                "description": "Output size. \"concise\" (default) is tight text plus a structured summary. In whats_playing, each film has the total showtime_count, next_showtime, and a showtimes array containing only that next screening; \"detailed\" adds showtime rows with ids, ticket urls and accuracy metadata, about 200 across the answer. film_details and search_showtimes return the 40 nearest showtimes in \"concise\" and up to 200 in \"detailed\". showtime_count is always the total and showtimes_complete says whether the array is all of it; narrow by date or theater for the rest.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "type": "object"
