                "type": "array"
              },
              "input": {
                "type": "string"
              },
              "matched": {
                "enum": ["city", "zip", "neighborhood", "alias"],
                "type": "string"
              },
              "nearest_lit": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "miles": {
                      "type": "number"
                    },
                    "region": {
                      "type": "string"
                    },
