                      "type": "string"
                    }
                  },
                  "required": ["miles", "region", "region_name"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "reason": {
                "enum": ["ambiguous", "outside_coverage", "unknown"],
