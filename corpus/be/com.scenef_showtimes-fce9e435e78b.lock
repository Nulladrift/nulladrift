        {
          "name": "scenef_resolve_board",
          "title": "Find the region for a place",
          "description": "Translate a city, 5-digit ZIP, neighborhood or board alias into the region handle every other tool takes. Returns the board and WHAT matched it. Refuses rather than guessing: an ambiguous name returns candidates (Hollywood names both the Los Angeles board and the Miami board), a name SceneF knows only as a place outside its published boards returns outside_coverage (with any published board within 100 miles), and any other name it cannot place returns unknown with no fallback board. SceneF publishes 56 boards, in California, Florida and Hawaii only. Coordinates are not accepted — this reads names, not locations. It is an exact lookup in SceneF's own place table: no geocoder and no web search. Read-only: the call itself records nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "place": {
                "description": "A city (\"Pasadena\"), a 5-digit ZIP (\"94121\"), a neighborhood (\"the Mission\") or a board alias (\"the East Bay\", \"sf\").",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "region": {
                      "type": "string"
                    },
                    "region_name": {
                      "type": "string"
                    },
