        {
          "name": "scenef_now",
          "title": "Check what is still on tonight",
          "description": "Use this for a quick check of what is still on tonight on one board: how many screenings tonight, the next 5 showtimes with venue/time/film, when the data was generated and which theaters' listings may be out of date. Called with no region it also lists every board id with its place and timezone. Read-only: the call itself records nothing. SceneF does not sell, hold or book tickets. Ticket links are https://scenef.com/go/{id} redirects to the theater's own site or the ticket seller it uses (a link to a showtime that is gone lands back on SceneF); whoever follows one, a person or a client, is logged once anonymously (time, the screening with its film and theater, client type, browser family, referring site, link source tag, and whether the showtime was gone; no IP address, cookie or account) and forwarded. Every emitted showtime carries confidence, source tier, reporting sources and verified_at.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
