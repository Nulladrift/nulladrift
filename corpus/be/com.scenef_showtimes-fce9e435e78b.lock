        {
          "name": "scenef_search_showtimes",
          "title": "Search showtimes by film or theater",
          "description": "Showtimes scoped by FILM or by THEATER on one board — pass at least one. With `film`: where that film is playing (title or slug; fuzzy-matched, ambiguous queries return candidates). With `venues` and no film: everything on at those theaters, each showtime naming its film. Grouped by theater with local times, tags (35mm/qa/sold-out), the night each show belongs to, and a ticket link per showtime. Optional date and time-window filters apply to both. Returns the 40 nearest showtimes (\"concise\") or up to 200 (\"detailed\"); showtime_count is the total and showtimes_complete says whether the list is whole, so narrow by date or theater for the rest. For the whole board with no film or theater in mind, call scenef_whats_playing instead. Read-only: the call itself records nothing. SceneF does not sell, hold or book tickets. Ticket links are https://scenef.com/go/{id} redirects to the theater's own site or the ticket seller it uses (a link to a showtime that is gone lands back on SceneF); whoever follows one, a person or a client, is logged once anonymously (time, the screening with its film and theater, client type, browser family, referring site, link source tag, and whether the showtime was gone; no IP address, cookie or account) and forwarded. Every emitted showtime carries confidence, source tier, reporting sources and verified_at.",
