        {
          "name": "scenef_plan_movie_night",
          "title": "Suggest a movie night",
          "description": "Suggests 2-4 movie-night options on one board from a window and a taste profile — film + specific showtime + theater + why it fits — plus one wildcard: the highest-ranked film outside the stated genres, or the next film down when no genre is stated. time_after/time_before are hard bounds; genres and formats only tilt the ranking, and when one matches nothing in the window the answer opens with a warning (also in warnings[]) saying so. It books, reserves and saves nothing; each option carries ticket and calendar links for the person to follow. Ranking uses only the stated preferences; no theater or film pays for placement. Read-only: the call itself records nothing. SceneF does not sell, hold or book tickets. Ticket links are https://scenef.com/go/{id} redirects to the theater's own site or the ticket seller it uses (a link to a showtime that is gone lands back on SceneF); whoever follows one, a person or a client, is logged once anonymously (time, the screening with its film and theater, client type, browser family, referring site, link source tag, and whether the showtime was gone; no IP address, cookie or account) and forwarded. Every emitted showtime carries confidence, source tier, reporting sources and verified_at.",
