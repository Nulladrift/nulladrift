  "subjects": {
    "ai.apir/verify": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://apir.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "apir-verify",
        "title": "APIR Agent Verification",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "APIR answers three questions about an AI agent you did not build, each as of the moment you ask: is it who it claims to be, what human mandate is on file for it, and what is its record. Call verify_agent when an unfamiliar agent contacts you or your user. Call check_authority before letting one transact, spend or commit on anyone's behalf. Never read VERIFIED as \"safe\": it confirms the credential is genuine and unaltered, not that the agent behaves well. Never read NO_RECORD as suspicious: it means nothing is on file.",
      "tools": [
        {
          "name": "check_authority",
          "title": "Check what an agent is allowed to do",
          "description": "Resolve the human mandate behind an AI agent: which actions a named person actually permitted, any value cap, the expiry, and whether the grant itself is signed. Where authority was delegated agent to agent, the full chain is walked back to the human at the root, and one law is enforced at every hop: authority may only ever narrow. No hop can hold an action, a target or a spending cap wider than the hop above it, and the root must be a human. Use this before letting an agent transact, sign, spend or commit on someone else's behalf. An agent holding a valid credential may still be acting outside its mandate, and those are different questions. The answer is the mandate on file as of checked_at. It is not proof the permission still holds at the moment the action runs: check again at the point of action, and treat a record as proof of what was recorded and when.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Agent name, credential id, or agent UUID.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check what an agent is allowed to do"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd3a7e70a1aa35e3f920c0175190075aa0c0a5e46fa2bb96ede69e041662973b"
        },
        {
          "name": "get_verification_keys",
          "title": "Get APIR public signing keys",
          "description": "Return the Ed25519 public keys APIR publishes, so a signature can be recomputed offline without trusting any APIR response, including this one. Keys are published as a JWKS at apir.ai/.well-known/jwks.json and as did:web:apir.ai. Retired keys stay published so older credentials still verify.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get APIR public signing keys"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76542cc30c110084254482ba8e7d59076d4fb794c4e275a30acde3aba05ca326"
        },
        {
          "name": "verify_agent",
          "title": "Verify an AI agent",
          "description": "Check whether an AI agent carries a real, cryptographically signed credential. Accepts an agent name, a credential id (TP-...), an agent UUID, a domain or a DID. Returns one of seven verdicts: VERIFIED, EXPIRED, REVOKED, SUPERSEDED, UNSIGNED, UNCHECKED or NO_RECORD. IMPORTANT for interpreting the answer: VERIFIED means the Ed25519 signature recomputes against the key published at apir.ai and the credential is unexpired and unrevoked. It confirms WHO issued the credential and that its contents are unaltered. It is NOT a guarantee that the agent behaves well. NO_RECORD is an honest, first-class answer: it means nothing is on file, which is not evidence of wrongdoing and not a warning. It means any claim the agent makes about itself is unverified. Free, unauthenticated, and no account is required.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Agent name, credential id (TP-... or APIR-TP-...), agent UUID, domain, or DID.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify an AI agent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f863c00381e5974045bdfb5e36b4f0ba1723fa3d912686907fb088185270bf4"
        }
      ],
      "digest": "sha256:1041ab392a5348c88c37dab16009d4b503eff6256ed16a62f18e4949ebbf47d8"
    }
  }
}
