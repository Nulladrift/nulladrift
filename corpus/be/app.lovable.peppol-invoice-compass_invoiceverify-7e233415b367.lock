                "maxLength": 5242880,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["format", "xml"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
