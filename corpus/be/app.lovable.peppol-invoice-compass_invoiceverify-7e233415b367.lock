{
  "lockfileVersion": 2,
  "subjects": {
    "app.lovable.peppol-invoice-compass/invoiceverify": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://peppol-invoice-compass.lovable.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "invoiceverify",
        "title": "InvoiceVerify",
        "version": "1.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "EU e-invoicing tools (InvoiceVerify). Without signing in, check_peppol_receivability checks whether one Belgian company can receive Peppol invoices under its two Belgian IDs — 0208 (enterprise number) and 9925 (VAT number) — free, 20 checks per hour. With an InvoiceVerify account (OAuth sign-in): validate UBL / Peppol BIS 3 / XRechnung / CII / Factur-X XML against EN 16931 and Peppol rules, generate or convert compliant invoice XML, read invoices into JSON, check whether a company in any country can receive Peppol invoices (and under which Peppol ID), check lists of up to 25 Belgian companies at once with the risk and fix in Dutch, French or English, explain rules and show usage. Invoice tools use one metered call each; lookups use one call per company. Invoice contents are processed in memory and never stored.",
      "tools": [
        {
          "name": "check_belgian_peppol_list",
          "title": "Check a Belgian client list on Peppol",
          "description": "Check up to 25 Belgian companies (enterprise or VAT numbers) for Peppol receivability under both Belgian IDs — 0208 (enterprise number) and 9925 (VAT number). Returns per company: receivable under both, only 0208, only 9925, neither, or unknown, with the risk and what to fix in Dutch, French or English. Uses one metered call per valid company; unreadable numbers are free. Requires an InvoiceVerify account (OAuth sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "companies": {
                "description": "1 to 25 Belgian enterprise or VAT numbers (strings or {id, name}). Split longer lists into several calls.",
                "items": {
                  "anyOf": [
                    {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    {
                      "properties": {
                        "id": {
                          "description": "Enterprise or VAT number, e.g. BE0403170701 or 0403.170.701",
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        "name": {
                          "description": "Optional client name to echo back",
                          "maxLength": 200,
                          "type": "string"
                        }
                      },
                      "required": ["id"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "description": "Language of the explanations: en (default), nl or fr.",
                "enum": ["en", "nl", "fr"],
                "type": "string"
              }
            },
            "required": ["companies"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:066b02b73f65354acdf5f9e021f1f0864a5e057cb57a3d7c843aab063a11909b"
        },
        {
          "name": "check_peppol_receivability",
          "title": "Check Belgian Peppol receivability (free)",
          "description": "Free, no sign-in needed: check whether one Belgian company can receive Peppol e-invoices under each of its two Belgian Peppol IDs — 0208 (enterprise/KBO-BCE number) and 9925 (VAT number). Returns receivable under both, only 0208, only 9925, neither or unknown, which ID to send to, the access point (service provider) per ID, and the risk and fix in English, Dutch or French. Limited to 20 checks per hour per connection; for client lists use check_belgian_peppol_list (sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Belgian enterprise or VAT number, e.g. BE0403170701, 0403.170.701 or 0403170701.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "description": "Language of the explanation: en (default), nl or fr.",
                "enum": ["en", "nl", "fr"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1e0fb9106788165bdd40f209b589b8d3c6965cc9e7372d3ae884415a04ffcade"
        },
        {
          "name": "convert_invoice",
          "title": "Convert e-invoice format",
          "description": "Convert an existing UBL or CII / Factur-X invoice XML into Peppol BIS 3 UBL, XRechnung UBL, XRechnung CII or Factur-X CII, and validate the result. Uses one metered call. Requires an InvoiceVerify account (OAuth sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "Target format, e.g. 'peppol' or 'xrechnung-ubl'.",
                "enum": ["peppol", "xrechnung-ubl", "xrechnung-cii", "cii"],
                "type": "string"
              },
              "xml": {
                "description": "The source invoice XML.",
                "maxLength": 5242880,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["format", "xml"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2279e17984dc2e9a7f485392af8d5e93c9e911cbfdc139b6e305a1a3f80a4ad"
        },
        {
          "name": "explain_rule",
          "title": "Explain validation rule",
          "description": "Explain an EN 16931, Peppol or XRechnung business rule (e.g. BR-CO-15, PEPPOL-EN16931-R003) in plain English, Dutch or French, with typical causes and fix steps. Free. Requires an InvoiceVerify account (OAuth sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Explanation language. Default 'en'.",
                "enum": ["en", "nl", "fr"],
                "type": "string"
              },
              "rule_id": {
                "description": "Rule ID as reported by validate_invoice, e.g. BR-CO-15.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["rule_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9dcd461a34339aa80063a18fd4107e8b3f5d8a29981a7deb6cf6683fe343e33"
        },
        {
          "name": "generate_invoice",
          "title": "Generate e-invoice XML",
          "description": "Create a Peppol BIS 3 UBL, XRechnung (UBL or CII) or Factur-X/ZUGFeRD CII XML invoice from structured invoice data, with totals and VAT computed and the result validated. Uses one metered call. Requires an InvoiceVerify account (OAuth sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "Output format. Default 'peppol' (Peppol BIS Billing 3.0 UBL).",
                "enum": ["peppol", "xrechnung-ubl", "xrechnung-cii", "cii"],
                "type": "string"
              },
              "invoice": {
                "additionalProperties": {},
                "description": "Invoice data: {number, issueDate (YYYY-MM-DD), dueDate?, currency?, buyerReference?, seller: Party, buyer: Party, payment?: {meansCode, iban, bic}, lines: [{name, quantity, unitPrice, unitCode?, vatCategory? (S,Z,E,AE,K,G,O), vatRate?}]}. Party: {name, vatId?, companyId?, endpointId, endpointScheme (EAS code, e.g. 0208, 9930), street?, city?, postalCode?, country (ISO 2)}. Full schema: InvoiceData in /openapi.json.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["invoice"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ccae4e94e97c644a39fffd8f5d948545e813ac9a819ba468683c1c79ab64c22"
        },
        {
          "name": "get_usage",
          "title": "Show API usage",
          "description": "Show this month's metered calls, the included allowance, remaining call-pack credits and the reset date for the signed-in account. Free. Requires an InvoiceVerify account (OAuth sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:faf3ed437ba9ff742f3ec4b75896b63a2d912c4ad01413d37437dd5fad3e7c62"
        },
        {
          "name": "lookup_peppol_participant",
          "title": "Check Peppol receivability",
          "description": "Check whether a company can receive Peppol e-invoices: give a VAT number, company number (KBO/BCE, KvK, SIREN/SIRET), GLN or Peppol ID and it checks every relevant scheme (e.g. Belgian 0208 and 9925) in the live Peppol SML/SMP, lists supported document types and says which ID to send to. Uses one metered call. Requires an InvoiceVerify account (OAuth sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO country code hint for ambiguous numbers, e.g. 'BE' or 'FR'.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "id": {
                "description": "VAT number (BE0403170701), company number or Peppol ID (0208:0403170701).",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1dcf67ac56f9c1604b104ff06b2b5d021ba12ce15d5b09879c44795ff87655bb"
        },
        {
          "name": "parse_invoice",
          "title": "Read e-invoice into JSON",
          "description": "Read a UBL or CII / Factur-X invoice XML into structured JSON (parties, lines, VAT, totals, payment) for booking or reconciliation. Uses one metered call. Requires an InvoiceVerify account (OAuth sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "xml": {
                "description": "The invoice XML.",
                "maxLength": 5242880,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["xml"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8113f94ab20300bb169ebd35522aa71010244b91e050ed1c47885541a4edb58"
        },
        {
          "name": "validate_invoice",
          "title": "Validate e-invoice",
          "description": "Validate a UBL 2.1, Peppol BIS Billing 3.0, XRechnung or CII / Factur-X XML invoice against EN 16931 and Peppol rules; returns pass/fail with rule IDs, line numbers and fixes. Uses one metered call. Requires an InvoiceVerify account (OAuth sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "profile": {
                "description": "Rule set to apply. 'auto' (default) detects it from the CustomizationID.",
                "enum": ["auto", "peppol", "en16931", "xrechnung"],
                "type": "string"
              },
              "xml": {
                "description": "The complete invoice XML document.",
                "maxLength": 5242880,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["xml"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63a1ff553afa287aec7a057867e0571926dcf07246ee9be7d06939ba8a1d6535"
        }
      ],
      "digest": "sha256:bd9e5a51b2dc979ef58af5719ed558daec81665eddda7f38bd069c608ca5e1c2"
    }
  }
}
