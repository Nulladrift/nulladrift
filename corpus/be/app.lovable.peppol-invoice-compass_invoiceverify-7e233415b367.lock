      "transport": {
        "type": "http",
        "url": "https://peppol-invoice-compass.lovable.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "invoiceverify",
        "title": "InvoiceVerify",
        "version": "1.5.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "EU e-invoicing tools (InvoiceVerify). Without signing in (free, 20 calls per hour shared): check_peppol_receivability checks live whether one Belgian company can receive Peppol invoices under its two Belgian IDs — 0208 (enterprise number) and 9925 (VAT number); search_peppol_directory searches the official Peppol Directory by company name, number or Peppol ID and lists each match's Peppol IDs, country, registration date and BIS Billing 3.0 invoice/credit-note support (listing is optional, so absence is not proof); check_factur_x checks a Factur-X / ZUGFeRD PDF (base64) or its CII XML for France's e-invoicing reform — embedded XML, profile, basic PDF/A-3 attachment metadata and EN 16931 rules (not an official validator); check_si_ubl checks a Dutch SI-UBL 2.0 / NLCIUS (or Peppol BIS) invoice XML against the Dutch BR-NL and Peppol NL-R rules plus EN 16931 (not the official validator). With an InvoiceVerify account (OAuth sign-in): validate UBL / Peppol BIS 3 / XRechnung / SI-UBL 2.0 / CII / Factur-X XML against EN 16931 and Peppol rules, generate or convert compliant invoice XML, read invoices into JSON, check whether a company in any country can receive Peppol invoices (and under which Peppol ID), check lists of up to 25 Belgian companies at once with the risk and fix in Dutch, French or English, explain rules and show usage. Invoice tools use one metered call each; lookups use one call per company. Invoice contents are processed in memory and never stored.",
      "tools": [
        {
          "name": "check_belgian_peppol_list",
          "title": "Check a Belgian client list on Peppol",
          "description": "Check up to 25 Belgian companies (enterprise or VAT numbers) for Peppol receivability under both Belgian IDs — 0208 (enterprise number) and 9925 (VAT number). Returns per company: receivable under both, only 0208, only 9925, neither, or unknown, with the risk and what to fix in Dutch, French or English. Uses one metered call per valid company; unreadable numbers are free. Requires an InvoiceVerify account (OAuth sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "companies": {
                "description": "1 to 25 Belgian enterprise or VAT numbers (strings or {id, name}). Split longer lists into several calls.",
                "items": {
                  "anyOf": [
                    {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    {
                      "properties": {
                        "id": {
                          "description": "Enterprise or VAT number, e.g. BE0403170701 or 0403.170.701",
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        "name": {
                          "description": "Optional client name to echo back",
                          "maxLength": 200,
                          "type": "string"
                        }
                      },
                      "required": ["id"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "description": "Language of the explanations: en (default), nl or fr.",
                "enum": ["en", "nl", "fr"],
                "type": "string"
              }
            },
            "required": ["companies"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:066b02b73f65354acdf5f9e021f1f0864a5e057cb57a3d7c843aab063a11909b"
        },
        {
          "name": "check_factur_x",
          "title": "Check a Factur-X / ZUGFeRD invoice (free)",
          "description": "Free, no sign-in needed: check a Factur-X or ZUGFeRD hybrid invoice for France's e-invoicing reform (and Germany). Send the PDF as base64 (pdf_base64), or only its CII XML (xml). Finds the embedded factur-x.xml / zugferd-invoice.xml, identifies the profile (MINIMUM, BASIC WL, BASIC, EN 16931, EXTENDED) and whether France's reform accepts it, checks the PDF/A-3 attachment and XMP metadata at a basic level, and runs 114 EN 16931 business rules on the XML. Returns pass/warn/fail per check with plain-language fixes. Not an official validator (no full PDF/A-3 conformance, XSD or EXTENDED-CTC-FR rules). The document is not stored. PDFs up to 3 MB. Shares the 20 free calls per hour per connection with check_peppol_receivability and search_peppol_directory.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "Original file name, shown in the report.",
                "maxLength": 200,
                "type": "string"
              },
              "include_xml": {
                "description": "Also return the embedded XML read from the PDF (default false).",
                "type": "boolean"
              },
              "pdf_base64": {
                "description": "The Factur-X / ZUGFeRD PDF, base64-encoded (a data: URL prefix is accepted). Send this or xml.",
                "maxLength": 4194432,
                "minLength": 8,
                "type": "string"
              },
              "xml": {
                "description": "Only the embedded CII XML (factur-x.xml), when there is no PDF. Container checks are then skipped.",
                "maxLength": 2097152,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85feabde75d71ee60b5c58a083a6b4b6df4f710b973c1a95863613743f2c1a5f"
        },
        {
          "name": "check_peppol_receivability",
          "title": "Check Belgian Peppol receivability (free)",
          "description": "Free, no sign-in needed: check whether one Belgian company can receive Peppol e-invoices under each of its two Belgian Peppol IDs — 0208 (enterprise/KBO-BCE number) and 9925 (VAT number). Returns receivable under both, only 0208, only 9925, neither or unknown, which ID to send to, the access point (service provider) per ID, and the risk and fix in English, Dutch or French. Limited to 20 checks per hour per connection; for client lists use check_belgian_peppol_list (sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Belgian enterprise or VAT number, e.g. BE0403170701, 0403.170.701 or 0403170701.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "description": "Language of the explanation: en (default), nl or fr.",
                "enum": ["en", "nl", "fr"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1e0fb9106788165bdd40f209b589b8d3c6965cc9e7372d3ae884415a04ffcade"
        },
        {
          "name": "check_si_ubl",
          "title": "Check a Dutch SI-UBL 2.0 / NLCIUS invoice (free)",
          "description": "Free, no sign-in needed: check a Dutch e-invoice — SI-UBL 2.0 (NLCIUS, the Dutch government and SimplerInvoicing standard), NLCIUS CII or Peppol BIS Billing 3.0 from a Dutch supplier — against 30 SI-UBL 2.0 / NLCIUS rules (BR-NL-*), Peppol's 9 Netherlands rules (NL-R-*) and 103 EN 16931 rules. Returns pass/fail with rule IDs, line numbers and plain-language fixes; KvK/OIN, address, buyer-reference and payment-means problems are named explicitly. Not the official validator (no XML Schema check, not every EN 16931 rule); for a final check: https://test.peppolautoriteit.nl/validate. The invoice is not stored. Shares the 20 free calls per hour per connection with the other free tools (check_peppol_receivability, search_peppol_directory, check_factur_x and check_si_ubl).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "Original file name, shown in the report.",
                "maxLength": 200,
                "type": "string"
              },
              "force_si_ubl": {
                "description": "Apply the SI-UBL 2.0 rules even if the CustomizationID doesn't say SI-UBL 2.0 (default false: detect it).",
                "type": "boolean"
              },
              "xml": {
                "description": "The complete invoice XML (UBL Invoice / CreditNote or CII).",
                "maxLength": 3145728,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["xml"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eca20268874c4cfa60a9ee48cb0466dbe1bc4cea98e540f8e31c5f3030c51221"
        },
