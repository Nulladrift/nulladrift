        },
        {
          "name": "validate_invoice",
          "title": "Validate e-invoice",
          "description": "Validate a UBL 2.1, Peppol BIS Billing 3.0, XRechnung, SI-UBL 2.0 (NLCIUS) or CII / Factur-X XML invoice against EN 16931, Peppol and national CIUS rules; returns pass/fail with rule IDs, line numbers and fixes. Uses one metered call. Requires an InvoiceVerify account (OAuth sign-in).",
