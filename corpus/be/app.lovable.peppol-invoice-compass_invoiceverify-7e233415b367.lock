          },
          "digest": "sha256:c2279e17984dc2e9a7f485392af8d5e93c9e911cbfdc139b6e305a1a3f80a4ad"
        },
        {
          "name": "explain_rule",
          "title": "Explain validation rule",
          "description": "Explain an EN 16931, Peppol or XRechnung business rule (e.g. BR-CO-15, PEPPOL-EN16931-R003) in plain English, Dutch or French, with typical causes and fix steps. Free. Requires an InvoiceVerify account (OAuth sign-in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Explanation language. Default 'en'.",
                "enum": ["en", "nl", "fr"],
                "type": "string"
              },
              "rule_id": {
                "description": "Rule ID as reported by validate_invoice, e.g. BR-CO-15.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["rule_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
