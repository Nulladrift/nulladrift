{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/deep-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/deep-search"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-deep-search",
        "title": "Faceabot deep search",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "deep_search {query, sources?, lang?}: science, world news (100+ languages), Internet Archive, GitHub, Wikipedia and discussions in one call, dated and linked. Official free access only.",
      "tools": [
        {
          "name": "deep_search",
          "title": "Deep search across science, news, archives, code, Wikipedia and discussions",
          "description": "Search one question at once in sources a normal web search misses: science (arXiv, Crossref), world news in 100+ languages of the last 3 months (GDELT), Internet Archive, GitHub, Wikipedia, and what people say (Bluesky, Mastodon, Lemmy, Hacker News, forums). Results grouped by source, dated, with links.\nUse when: you need rich, hard-to-find, sourced information on a subject.\nExample: {\"query\":\"agentic commerce paid placement\",\"sources\":[\"science\",\"news\"],\"lang\":\"en\"}",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Optional 2-letter language for news, Wikipedia and discussions, e.g. fr, ja, ru",
                "type": "string"
              },
              "limit_per_source": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The subject, any language (sources search it as written)",
                "type": "string"
              },
              "sources": {
                "description": "Optional subset; default: all",
                "items": {
                  "enum": ["science", "news", "archives", "code", "wikipedia", "people"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e554c15970b1ca604c39ad64532bc9f10d3c286369274e691bcc690c824ba69d"
        },
        {
          "name": "list_deep_sources",
          "title": "Sources of the deep search",
          "description": "The sources searched by deep_search and what each one covers.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b47aea9afca530826e1734684f9733dc1c53821211dd9f1120ab265557da58e0"
        }
      ],
      "digest": "sha256:39da79835414052a2f6a98a8ab629f8f6e703479d406c4bf78d741d725ca50ec"
    }
  }
}
