                  "relax_when_empty": {
                    "description": "When the AND of every term matches no page, retry requiring only the largest number of your terms that some page does carry, and report it in `relaxed_min_match`. Only ever fires on a result that would otherwise be empty, and never drops below half your terms. Set false to keep a strict all-terms-or-nothing search. Default: true.",
                    "type": "boolean"
