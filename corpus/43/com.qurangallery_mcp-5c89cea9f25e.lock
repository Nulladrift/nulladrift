      "instructions": "Quran Gallery's classical Islamic library: 8,594 works by 3,188 authors from Maktabah al-Shamela — Quran, hadith, tafsir, fiqh, aqeedah and the Arabic language sciences. Every passage is cited to its printed edition, volume and page, with the edition data the library records and a link to the page in the Quran Gallery Maktabah reader, and the main text (matn) is kept separate from the editor's footnotes. No account, sign-in or API key is needed.\n\nSearch classical Islamic texts and cite what you find. Every passage carries a real book, printed edition, volume/page and verbatim Arabic — quote those rather than recalling a reference. Queries must be in ARABIC; a query with no Arabic words is rejected. Start with shamela_search_library, which requires a named scope: the raw shamela_* searches rank by term frequency, so unscoped they surface a poetry anthology above Sahih al-Bukhari. Reach for the raw tools when you need what shamela_search_library cannot do — isnad chains, narrator dossiers, boolean or diacritic-exact search, resolving a printed citation to a page, or reading a page in full. If a result reports matchedIn: \"footnote\", the wording was found in an editor's note, not the main text — say so rather than presenting it as the matn. `search` and `fetch` (listed to every client) are the whole-library pair for deep research. The citation contract is the resource qurangallery://grounding-rules.\n\nقواعد الاستشهاد:\n- لا تنسب نصًّا إلى كتابٍ إلا إذا جاء فعلًا من نتيجة أداة؛ ولا تُكمِل النصوص أو الأسانيد من معرفتك العامة.\n- ميِّز دائمًا بين المتن (body) والحاشية (foot)؛ الحاشية كلام المحقِّق أو المعلِّق لا كلام المصنِّف، فلا تنسبها إليه.\n- عند الاستشهاد استعمل أداة shamela_cite(mode \"citation\")، وصرِّح بحال الترقيم إن كان «بترقيم الشاملة آليًّا» ولا تَعُدَّه ترقيم المطبوع.\n- لا تختلق بيانات نشرٍ (ناشر/طبعة/محقِّق) غير موجودة؛ إذا نقصت فاذكر أنها غير متوفرة.\n- لا تحكم على الأحاديث تصحيحًا أو تضعيفًا، ولا تُصدر فتوى.\n- الحياد الترجيحي: اعرض أقوال المذاهب منسوبةً بأدلتها دون ترجيح إلا أن يطلبه المستخدم، وميّز النقل عن الاستنباط.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a library page",
          "description": "Read one library page whole by the id `search` returned: main text, then its footnotes under their own label (the editor's words, never the author's), with book, author, printed volume/page, edition data and the link to the page in the Quran Gallery Maktabah reader. Use shamela_read instead to read one body part at a time (unit \"page\"), a run of pages (unit \"range\") or a whole chapter (unit \"section\"), and shamela_cite (mode \"printed_page\") to turn a printed volume and page into ids. Not a search. Long pages are cut at 4 body parts of about 4,000 characters (2 without an API key): metadata.complete false, ending with the shamela_read call that continues it. A malformed id, or a page the library does not hold, returns a tool error.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Page id \"{bookId}:{pageId}\", e.g. \"1681:10\" — Shamela internal ids from a `search` result, not printed page numbers. Malformed or unknown ids return a tool error.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "description": "\"{bookId}:{pageId}\", normalised.",
                "type": "string"
              },
              "metadata": {
                "properties": {
                  "author": {
                    "type": "string"
                  },
                  "authorDied": {
                    "description": "Year of death in AH, or null.",
                    "type": ["integer", "null"]
                  },
                  "book": {
                    "type": "string"
                  },
                  "bookId": {
                    "type": "integer"
                  },
                  "complete": {
                    "description": "False when the page was longer than `fetch` reads in one call.",
                    "type": "boolean"
                  },
                  "edition": {
                    "description": "Omitted when the library records none.",
                    "type": "string"
                  },
                  "editor": {
                    "description": "Omitted when the library records none.",
                    "type": "string"
                  },
                  "hasFootnotes": {
                    "type": "boolean"
                  },
                  "pageId": {
                    "type": "integer"
                  },
                  "printedPage": {
                    "description": "Volume and page as the printing paginates it, or null.",
                    "type": ["string", "null"]
                  },
                  "publisher": {
                    "description": "Omitted when the library records none.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "text": {
                "description": "Main text, then the footnotes under their own label (the editor's words). When metadata.complete is false it ends with the shamela_read(unit='page') call that continues it.",
                "type": "string"
              },
              "title": {
                "description": "\"{book} — {author} ({volume}/{page})\".",
                "type": "string"
              },
              "url": {
                "description": "The same page in the Quran Gallery Maktabah reader.",
                "type": "string"
              }
            },
            "type": "object"
          },
