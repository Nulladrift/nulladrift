        },
        {
          "name": "shamela_verify_quote",
          "title": "Check whether a quotation occurs in the library",
          "description": "Checks whether an Arabic quotation occurs in the classical library and where: book, author, printed volume/page, edition, and whether the words are in the main text or in an editor's footnote. Use it on a passage an assistant quoted from memory. Matching ignores diacritics, tatweel and alef forms; exact says whether the page spells the words as given, and differences says how they differ. \"not_found\" means not found in the searched scope (the scope or bookId is named in the answer), not that the quotation is false or appears nowhere. matchedIn \"foot\" is the editor's words, not the author's. It reports where words are printed; it is not a ruling and does not say whether a passage is authentic. Needs at least 3 Arabic words; a shorter or non-Arabic quote returns a tool error naming the fix. Give scope or bookId to narrow it; with neither, the whole library is searched.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bookId": {
                "description": "Optional: search this one book (Shamela's book id, as in a result's bookId). Wins over scope.",
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 5,
                "description": "Maximum matching pages to return (max 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "quote": {
                "description": "The Arabic wording to look for, at least 3 words, as quoted; diacritics are optional.",
                "type": "string"
              },
              "scope": {
                "description": "Optional shelf to search. Ignored when bookId is given. hadith-primary — The eight primary hadith collections, edition-pinned; tafsir-canonical — Canonical tafsir — Ibn Kathir, al-Tabari, Ibn al-Jawzi first; fiqh-hanafi — Hanafi fiqh (+ usul, comparative); fiqh-maliki — Maliki fiqh (+ usul, comparative); fiqh-shafii — Shafi'i fiqh (+ usul, comparative); fiqh-hanbali — Hanbali fiqh (+ usul, comparative); fiqh-comparative — All four schools plus comparative and fatwa collections; aqeedah — Creed and sects; hadith-sciences — Hadith commentary, takhrij and the sciences of hadith; tafsir — The whole tafsir shelf and Quranic sciences; seerah — Prophetic biography, history and biographical dictionaries; lugha — Arabic language, lexicons, grammar and adab",
                "enum": ["hadith-primary", "tafsir-canonical", "fiqh-hanafi", "fiqh-maliki", "fiqh-shafii", "fiqh-hanbali", "fiqh-comparative", "aqeedah", "hadith-sciences", "tafsir", "seerah", "lugha"],
                "type": "string"
              }
            },
            "required": ["quote"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "matches": {
                "description": "Up to `limit` pages, in the library's order; empty when not_found.",
                "items": {
                  "properties": {
                    "author": {
                      "type": "string"
                    },
                    "book": {
                      "type": "string"
                    },
                    "bookId": {
                      "type": "integer"
                    },
                    "differences": {
                      "description": "What normalisation ignored or folded; empty when exact.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "docId": {
                      "description": "\"{bookId}:{pageId}\" — pass it to `fetch`.",
                      "type": "string"
                    },
                    "edition": {
                      "description": "The printing's edition, or null when the library records none.",
                      "type": ["string", "null"]
                    },
                    "exact": {
                      "description": "True when the page's characters equal the quotation's, whitespace aside. False when only the normalised forms match.",
                      "type": "boolean"
                    },
                    "matchedIn": {
                      "description": "foot: the words are in the editor's or commentator's footnote, not the author's text.",
                      "enum": ["body", "foot"],
                      "type": "string"
                    },
                    "pageId": {
                      "type": "integer"
                    },
                    "printedPage": {
                      "description": "Printed page (the part after the slash), or null.",
                      "type": ["string", "null"]
                    },
                    "snippet": {
                      "description": "The page's own text around the words.",
                      "type": "string"
                    },
                    "sourceUrl": {
                      "description": "The same page in the Quran Gallery Maktabah reader.",
                      "type": "string"
                    },
                    "volume": {
                      "description": "Printed volume (the part before the slash), or null.",
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "The caveats to carry with the verdict.",
                "type": "string"
              },
              "searched": {
                "description": "What was searched. Carry it with any not_found.",
                "properties": {
                  "bookId": {
                    "type": "integer"
                  },
                  "ignoredScope": {
                    "description": "A scope that was sent with bookId and set aside.",
                    "type": "string"
                  },
                  "normalisation": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "scope": {
                    "type": "string"
                  },
                  "wholeLibrary": {
                    "description": "True when neither scope nor bookId was given.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "verdict": {
                "description": "found: pages in the searched scope carry the words in this order. not_found: none does, in that scope only; never a statement that the quotation is false.",
                "enum": ["found", "not_found"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1baa1253fcf130764676318edc2546551be66e4ddd9ad9d5904c3d864833d7a"
        }
