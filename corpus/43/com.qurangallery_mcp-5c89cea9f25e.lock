        {
          "name": "shamela_survey_topic",
          "title": "Survey a topic across the library",
          "description": "Count how much the library holds on a term and where: the exact matching-page total plus its distribution by category, Hijri century, book and author (top 15 each). Statistics only, never passages — use shamela_search(match='words') instead to retrieve and read the pages. Run it before searching to size a topic and pick scope.category_ids (map by_category names to ids with shamela_find(kind='category')). mode 'literal' (default, 6–9 ms) counts the word as written; 'morphological' counts every derived form of its root (seconds) and is often far broader. coverage_capped:true means the breakdown is a top-5,000 sample whose counts are floors; total_hits stays exact. No match = total_hits 0; EMPTY_SCOPE when scope matches no book. Example: {term:'الاستصناع', scope:{category_ids:[14,15,16,17]}}; {term:'التيمم', scope:{citable_only:true}}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "mode": {
                "default": "literal",
                "description": "'literal' counts pages carrying the WORD as written (plus the ordinary spelling folds). 'morphological' expands it to every AlKhalil root reading and counts those — which is far broader than most callers expect: «الاستصناع» reports 393,498 pages across 7,405 books morphologically against 1,510 literally, an answer that says every shelf holds the topic. Use 'literal' to size a topic before planning retrieval; use 'morphological' to trace a ROOT through its derivations.",
                "enum": ["literal", "morphological"],
                "type": "string"
              },
              "response_format": {
                "default": "markdown",
                "description": "Format of the human-readable text: 'markdown' (default) for display; 'json' the same data as one JSON code block; 'none' only a one-line pointer, leaving structuredContent as the whole answer. structuredContent is always returned, so a caller that parses it should pass 'none': the character budget counts both channels, and the unread copy otherwise spends most of it. Requires the 'response_format.none' capability (see shamela_get_brief).",
                "enum": ["markdown", "json", "none"],
                "type": "string"
              },
              "scope": {
                "additionalProperties": false,
                "description": "Restrict the profile to specific books, authors, categories, or a Hijri date range. Use shamela_find(kind='category') / shamela_find(kind='name') to find IDs. Omit to profile the whole library installed on this server.",
                "properties": {
                  "author_ids": {
                    "description": "Restrict to books by these authors. Includes co-authored books. Use `shamela_find(kind='name', type='author')` to find IDs.",
                    "items": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "book_ids": {
                    "description": "Restrict to these book IDs. Use `shamela_find(kind='name')` or `shamela_list_downloaded_books` to find IDs. Combine with other scope keys for intersection.",
                    "items": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "book_type": {
                    "description": "Restrict to these kinds of entry (master.db.book.book_type — the same filter row Shamela's own 'اختيار كتاب' window shows). 'transcript' (تفريغات) is a transcribed lecture series, not an authored book, and 'thesis'/'electronic' are likewise not printed works — excluding them sharpens a scholarly search. Of 8,594 entries, 7,334 are 'book'; 1,260 are not.",
                    "items": {
                      "enum": ["book", "journal", "manuscript", "thesis", "electronic", "transcript"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "category_ids": {
                    "description": "Restrict to books in these categories. Categories are flat in master.db (no parent_id, no transitive subtree expansion). Use `shamela_find(kind='category')` to find IDs.",
                    "items": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "citable_only": {
                    "default": false,
                    "description": "Keep only books whose page numbering matches a real printed edition (master.db.book.printed == 1 — Shamela's «يوافق المطبوع»). The other 1,417 entries are paginated by Shamela automatically, so their page numbers are NOT a citable reference to any published edition. Set this true whenever the answer will quote a page number as a citation.",
                    "type": "boolean"
                  },
                  "downloaded_only": {
                    "default": false,
                    "description": "Restrict to books actually downloaded on this user's machine (master.db.book.major_ondisk > 0). Critical for honest research scoping when using `shamela_search(match='words')` — only downloaded books have searchable content.",
                    "type": "boolean"
                  },
                  "madhab": {
                    "description": "Restrict to books of these Sunni schools. master.db has NO madhab field, so this is resolved two ways: a book filed under a school-specific category (الفقه الحنفي/المالكي/الشافعي/الحنبلي) counts directly, and otherwise the MAIN AUTHOR's school is used, inferred from the categories that author's own books are filed under. That second path is what reaches مسائل فقهية and الفقه العام, where Shamela records no school — it raises madhab coverage of the fiqh shelves from 27% to 43%. Books whose school cannot be established are EXCLUDED by this filter, so do not read absence as 'no school said this'; for comparative questions leave madhab unset and scope by category instead.",
                    "items": {
                      "enum": ["hanafi", "maliki", "shafii", "hanbali"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "period_from": {
                    "description": "Hijri year, inclusive lower bound. Matches book.book_date (composition year) OR author.death_number (death year). Pair with period_to.",
                    "maximum": 2000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "period_to": {
                    "description": "Hijri year, inclusive upper bound. Pair with period_from.",
                    "maximum": 2000,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "term": {
                "description": "Arabic word or root to profile (e.g. «الاستصناع»، «صبر»، «رحم»). Under mode='literal' (default) only the word as written is counted; under mode='morphological' it is matched via the AlKhalil analyzer, so all derived forms (صابر، يصبر، اصطبار…) are counted, not just the literal string.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "accuracy_note": {
                "description": "Morphological counts: the analyzer is ~0.80 accurate on classical Arabic, so read them as reach, not exact tallies.",
                "type": "string"
              },
              "books_matched": {
                "type": "integer"
              },
              "by_author": {
                "description": "Top 15 authors.",
                "items": {
                  "$ref": "#/properties/by_category/items"
                },
                "type": "array"
              },
              "by_book": {
                "description": "Top 15 books by matching pages.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "author_name": {
                      "type": ["string", "null"]
                    },
                    "book_date": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "book_id": {
                      "type": "integer"
                    },
                    "book_name": {
                      "type": "string"
                    },
                    "category": {
                      "type": ["string", "null"]
                    },
                    "count": {
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "by_category": {
                "description": "Category names (no ids), top 15. Reflects corpus size as well as topic, never authority: التفسير tops nearly every profile because tafsir is the largest body of text here.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "count": {
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "by_century": {
                "description": "Hijri century, top 15.",
                "items": {
                  "$ref": "#/properties/by_category/items"
                },
                "type": "array"
              },
              "coverage_cap": {
                "type": "integer"
              },
              "coverage_capped": {
                "description": "True when the distribution is a top-coverage_cap sample: bucket counts are floors and shares indicative.",
                "type": "boolean"
              },
              "mode": {
                "description": "literal | morphological.",
                "type": "string"
              },
              "normalized_tokens": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "root": {
                "description": "Same as `term`, for older callers.",
                "type": "string"
              },
              "rows_dropped": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "kept": {
                      "type": "number"
                    },
                    "of": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "scope_count": {
                "description": "Books in scope; -1 when no scope was given.",
                "type": "integer"
              },
              "term": {
                "type": "string"
              },
              "total_counted": {
                "description": "Hits folded into the distribution.",
                "type": "integer"
              },
              "total_hits": {
                "description": "EXACT number of matching pages.",
                "type": "integer"
              },
              "truncated": {
                "type": "boolean"
              },
              "truncation_message": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
