            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee62c74eba329e330a51178afd4fe165e2fac96a458336f87d794bfd5b6e7926"
        },
        {
          "name": "search",
          "title": "Quick generic search of the whole library",
          "description": "Search the whole classical Islamic library (8,594 works, no scope) and get up to 10 pages as {id, title, url}; pass an id to `fetch` to read the page. This is the generic one-argument entry (the standard search/fetch pair); the scoped tools answer research questions better. Use shamela_search_library for a hadith, tafsir or fiqh question: unscoped ranking is by term frequency, so a poetry anthology can outrank Sahih al-Bukhari. Use shamela_search (match \"words\", \"phrase\", \"near\", \"exact\" or \"boolean\") to pin books, categories or a madhhab, match an exact or diacritized phrase, or page further; use shamela_cite (mode \"printed_page\") for printed-page citations. Exact phrase first; only when it finds nothing are the words matched separately. Title flags: [footnote match] = only an editor's footnote; [token match] = words occur apart; [near match] = only some words or their roots. Empty results mean no page carries the words. A query without Arabic words returns a tool error.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Arabic search text, e.g. \"إنما الأعمال بالنيات\"; 2-6 words work best. Quote the wording if known, else name the topic.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "description": "At most 10 pages; empty when no page carries the words.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "\"{bookId}:{pageId}\" — pass it to `fetch`.",
                      "type": "string"
                    },
                    "title": {
                      "description": "\"{book} — {author} ({volume}/{page})\", plus [footnote match], [token match] or [near match] when the match is weaker than the exact phrase in the main text.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The same page in the Quran Gallery Maktabah reader.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0320987590de2b2ae9340df37a41e6e5130ea042f3aa6fa733b12e044cd75851"
        },
        {
          "name": "shamela_cite",
          "title": "Format a citation or resolve a printed page",
          "description": "Citations. mode=citation (default): build one for a book, optionally a page and quoted text — Shamela's copy format, short inline, full with death year, or BibTeX/RIS. Call it whenever you attribute a quote; it needs only the catalogue, plus the installed text for a page's printed number. Read page_resolved, components.auto_numbered and notes[] before presenting.\nmode=printed_page: map a printed citation («vol. 4, p. 405») to the page_ids carrying it — no arithmetic relates the two, and one printed page often spans several ids: read them all, in order, with shamela_read(unit='page'). Resolve the work with shamela_find(kind='work') first; holding a page_id already, skip this. Failures come back as `status`; citable:false = Shamela's own numbering. Error: BOOK_NOT_FOUND.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "book_id": {
                "description": "[mode=citation] The book id, from shamela_find(kind='book'), shamela_find(kind='work') or shamela_find(kind='name'). [mode=printed_page] The book. Resolve a cited title with shamela_find(kind='work') first — and note that different printings of one work paginate differently, so the book_id must be the printing the citation came from.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "mode": {
                "description": "Selects what the call does: citation | printed_page. Default citation.",
                "enum": ["citation", "printed_page"],
                "type": "string"
              },
              "page": {
                "description": "The PRINTED page number as the citation gives it (e.g. 405). Example: {book_id:6910, part:'4', page:405}; {book_id:1681, part:'1', page:6}. (mode=printed_page only.)",
                "minimum": 1,
                "type": "integer"
              },
              "page_id": {
                "description": "Optional page_id. When omitted, the citation references the book without a specific page and page_resolved is null. A page id that is missing, has no printed number, or belongs to a book whose text is not installed here yields a book-level citation with page_resolved:false and a note. Example: {book_id:1681, page_id:10}, or with text:'<quoted passage>', style:'shamela'. (mode=citation only.)",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "part": {
                "description": "The volume/part label as the book uses it, usually a bare number ('4'). Omit when the citation names no volume or the work is single-volume: the search then runs across every part and the response reports which parts matched, so an ambiguous page number is visible rather than silently resolved to the first volume. (mode=printed_page only.)",
                "type": "string"
              },
              "response_format": {
                "description": "Format of the human-readable text: 'markdown' (default) for display; 'json' the same data as one JSON code block; 'none' only a one-line pointer, leaving structuredContent as the whole answer. structuredContent is always returned, so a caller that parses it should pass 'none': the character budget counts both channels, and the unread copy otherwise spends most of it. Requires the 'response_format.none' capability (see shamela_get_brief).",
                "enum": ["markdown", "json", "none"],
                "type": "string"
              },
              "style": {
                "description": "Citation style. 'shamela' replicates Shamela's UI copy-with-citation format (default). 'short' is a one-line inline reference. 'full' is the long form including author death year and book year, with notes listing missing fields (publisher/edition/etc are not in master.db). 'bibtex' and 'ris' are machine-readable exports for Zotero/EndNote/Mendeley (Western digits, Arabic UTF-8, stable cite key shamela<book_id>p<page_id>); they carry only fields master.db has, with the same missing-field notes[]. 'short' reads <author>، <book>، ص <page>. Every style but bibtex/ris uses Arabic-Indic digits. (mode=citation only.)",
                "enum": ["shamela", "short", "full", "bibtex", "ris"],
                "type": "string"
              },
              "text": {
                "description": "Optional quoted text. Used by the 'shamela' style only, which then prints a two-line block: «<book>» (<part>/ <page>):\n«<text>». Other styles ignore it. (mode=citation only.)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "available_parts": {
                "description": "On part_not_found: the part labels the book uses. (mode=printed_page only.)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "book_id": {
                "description": "Catalogue book id. (mode=printed_page only.)",
                "type": ["number", "null"]
              },
              "book_name": {
                "description": "Catalogue title of the book (Arabic). (mode=printed_page only.)",
                "type": ["string", "null"]
              },
              "citable": {
                "description": "False when the numbers are Shamela's own, not a printed edition's. (mode=printed_page only.)",
                "type": ["boolean", "null"]
              },
              "components": {
                "additionalProperties": true,
                "description": "The parts the citation was built from. (mode=citation only.)",
                "properties": {
                  "author_id": {
                    "description": "Main author id.",
                    "type": ["number", "null"]
                  },
                  "author_name": {
                    "description": "Main author name.",
                    "type": ["string", "null"]
                  },
                  "auto_numbered": {
                    "description": "True when page numbers are Shamela's own («بترقيم الشاملة آليا»), not a printed edition's: say so whenever you present the citation, never as a printed page.",
                    "type": ["boolean", "null"]
                  },
                  "book_date": {
                    "description": "Shamela «تاريخ الكتاب», Hijri.",
                    "type": ["number", "null"]
                  },
                  "book_id": {
                    "description": "Catalogue book id.",
                    "type": ["number", "null"]
                  },
                  "book_name": {
                    "description": "Catalogue title of the book (Arabic).",
                    "type": ["string", "null"]
                  },
                  "death_year": {
                    "description": "Author's Hijri death year.",
                    "type": ["number", "null"]
                  },
                  "part": {
                    "description": "Volume label.",
                    "type": ["string", "null"]
                  },
                  "printed_page": {
                    "description": "Printed page label.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "formatted": {
                "description": "The citation text in the requested style. (mode=citation only.)",
                "type": ["string", "null"]
              },
              "matches": {
                "description": "One row per page id. (mode=printed_page only.)",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "page": {
                      "description": "Printed page number.",
                      "type": ["number", "null"]
                    },
                    "page_id": {
                      "description": "Page id.",
                      "type": ["number", "null"]
                    },
                    "part": {
                      "description": "Part label.",
                      "type": ["string", "null"]
                    },
                    "printed_page": {
                      "description": "Label as the page tools render it, e.g. '4/ 405'.",
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "description": "[mode=citation] Missing citation fields and fallbacks; never fill them in. [mode=printed_page] Guidance on reading the result.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "page_ids": {
                "description": "Every page id carrying the printed page, in reading order; read them all. Shamela splits a long printed page across records, so one page routinely has several ids (part '1', page 6 of book 1681 = ids 9, 10, 11 in the fixture). (mode=printed_page only.)",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "page_range": {
                "additionalProperties": true,
                "description": "On page_not_in_part: the printed range that exists in that part. (mode=printed_page only.)",
                "properties": {
                  "max": {
                    "description": "Highest printed page.",
                    "type": ["number", "null"]
                  },
                  "min": {
                    "description": "Lowest printed page.",
                    "type": ["number", "null"]
                  }
                },
                "type": "object"
              },
              "page_resolved": {
                "description": "True when the page and its printed number were found; false when the citation fell back to book level (see notes) and must not be presented as a page reference; null when no page_id was given. (mode=citation only.)",
                "type": ["boolean", "null"]
              },
              "parts_matched": {
                "description": "Distinct parts matched; more than one means the number is ambiguous across volumes. (mode=printed_page only.)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "requested_page": {
                "description": "Printed page requested. (mode=printed_page only.)",
                "type": ["number", "null"]
              },
              "requested_part": {
                "description": "Part label requested; null when omitted. (mode=printed_page only.)",
                "type": ["string", "null"]
              },
              "rows_dropped": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "kept": {
                      "type": "number"
                    },
                    "of": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "'ok', 'book_not_downloaded', 'no_printed_pagination' (Shamela paginates this entry itself: no printed page exists), 'part_not_found' or 'page_not_in_part'. (mode=printed_page only.)",
                "type": ["string", "null"]
              },
              "style": {
                "description": "'shamela', 'short', 'full', 'bibtex' or 'ris'. (mode=citation only.)",
                "type": ["string", "null"]
              },
              "truncated": {
                "type": "boolean"
              },
              "truncation_message": {
                "type": "string"
              }
            },
            "type": "object"
          },
