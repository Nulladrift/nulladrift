        {
          "name": "shamela_get_brief",
          "title": "Server capabilities and search pitfalls",
          "description": "Return this server's machine-readable capability handshake: capabilities, numeric limits, retired tool names with their replacements, and traps (ways a result misleads, each with the response field that proves it fired). Call it first from a programmatic client: inputs are strict, so an argument an older build lacks (e.g. `shape`, response_format:'none') is a hard validation error that fails the whole call, and tools/list cannot reveal argument support — gate each new argument on its capability string. Cache by brief_hash and re-fetch only when it changes. Constants only: needs no library access and does not fail. Example: {} or {response_format:'json'}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "response_format": {
                "default": "markdown",
                "description": "Format of the human-readable text: 'markdown' (default) for display; 'json' the same data as one JSON code block; 'none' only a one-line pointer, leaving structuredContent as the whole answer. structuredContent is always returned, so a caller that parses it should pass 'none': the character budget counts both channels, and the unread copy otherwise spends most of it. Requires the 'response_format.none' capability (see shamela_get_brief).",
                "enum": ["markdown", "json", "none"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "brief_hash": {
                "description": "Digest of every other field; re-fetch only when it changes.",
                "type": "string"
              },
              "capabilities": {
                "description": "Arguments and response fields this build supports; gate new arguments on these.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limits": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Numeric server limits by name.",
                "type": "object"
              },
              "rows_dropped": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "kept": {
                      "type": "number"
                    },
                    "of": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "server_version": {
                "description": "This build's version.",
                "type": "string"
              },
              "tool_aliases": {
                "additionalProperties": {
                  "additionalProperties": true,
                  "properties": {
                    "defaults": {
                      "additionalProperties": {},
                      "type": "object"
                    },
                    "rename": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "since": {
                      "description": "Version that introduced the rename.",
                      "type": "string"
                    },
                    "to": {
                      "description": "Current tool name.",
                      "type": "string"
                    }
                  },
                  "required": ["since", "to"],
                  "type": "object"
                },
                "description": "Retired tool names mapped to their replacement and argument changes.",
                "type": "object"
              },
              "traps": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "act": {
                      "description": "What to do when it fires.",
                      "type": "string"
                    },
                    "detect": {
                      "description": "Response field that proves it fired (relaxed_min_match, zero_hit_terms, paging_ceiling, coverage.sample_is_complete, scope_resolution.dropped, madhab_source, probes[].qualifiers, …): check it, not prose.",
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "risk": {
                      "description": "How a result misleads.",
                      "type": "string"
                    },
                    "tools": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "truncated": {
                "type": "boolean"
              },
              "truncation_message": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
