                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "description": "Rows in `results`. (mode=coverage only.)",
                "type": "integer"
              },
              "rows_dropped": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "kept": {
                      "type": "number"
                    },
                    "of": {
