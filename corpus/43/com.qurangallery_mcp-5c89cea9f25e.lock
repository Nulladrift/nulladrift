        {
          "name": "shamela_lookup_tafsir",
          "title": "Tafsir coverage and texts for an ayah",
          "description": "Tafsir on one verse (aya_id OR surah + aya, else BAD_ARG). mode=coverage (default): which tafsir books cover it, fetching no text — shelves 3 (tafsir) and 4 (Qur'anic sciences; not 5, tajwid and qira'at) crossed with Shamela's curated tafsir index, plus index hits from other shelves (in_tafsir_categories:false). Status per book: indexed_covers (with page_id), indexed_no_entry_for_this_aya, or not_indexed_coverage_unknown — NOT evidence the book is silent.\nmode=texts: the commentary from several books in one call, each attributed (book, author, death year, printed page), read only from pages the index maps to the verse, never a text-search guess. Each source's `note` names the next call when its text continues. Example: {surah:2, aya:255, book_ids:[1503, 639]}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aya": {
                "description": "Verse number within the surah, 1..N; requires `surah`.",
                "minimum": 1,
                "type": "integer"
              },
              "aya_id": {
                "description": "Cumulative verse id, 1..6236 (e.g. 262 = 2:255). Give this OR surah + aya, not both; a reference that disagrees with surah/aya is BAD_ARG.",
                "maximum": 6236,
                "minimum": 1,
                "type": "integer"
              },
              "book_ids": {
                "description": "Restrict to these tafsir books, read in the order given (omit it and the installed indexed books are read earliest author first). Books not present in the curated index for this aya are reported with an explicit status instead of text. Use shamela_lookup_tafsir(mode='coverage') to see which books the index covers. (mode=texts only.)",
                "items": {
                  "exclusiveMinimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "downloaded_only": {
                "description": "If true (default), list only books whose text is installed on this server. false also lists books the curated index maps to this aya whose text is not installed (downloaded:false) — still useful as catalogue references. (mode=coverage only.)",
                "type": "boolean"
              },
              "max_sources": {
                "description": "Maximum number of sources to fetch text for (1-10, default 5). The response-size budget can stop earlier; `remaining_book_ids` lists the sources not read, to pass as book_ids next. (mode=texts only.)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
