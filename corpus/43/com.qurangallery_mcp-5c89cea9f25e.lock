        {
          "name": "shamela_lookup_quran",
          "title": "Search the Quran or get an ayah",
          "description": "Qur'an text. mode=search (default): find verses by Arabic words, typed in إملائي spelling or pasted in Uthmani rasm; words ANDed, results in mushaf order (aya_id 1–6236), not relevance. Zero hits usually means a misspelling: drop a word or use options.wildcards.\nmode=aya: fetch verses you can already cite, by aya_id OR surah + aya (never both or neither: BAD_ARG); `count` gives a run that continues across surahs and stops at the last verse. Each verse in three renderings (body = the spelling search matches, amiri for display). AYA_NOT_FOUND names the valid range.\nCommentary → shamela_lookup_tafsir; the words inside books → shamela_search(match='words').",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aya": {
                "description": "Aya number within the surah, 1..N. Pair with `surah`. (mode=aya only.)",
                "minimum": 1,
                "type": "integer"
              },
              "aya_id": {
                "description": "Cumulative aya id, 1..6236. Mutually exclusive with surah/aya. E.g. 1 = al-Fatiha 1 (the basmala). (mode=aya only.)",
                "maximum": 6236,
                "minimum": 1,
                "type": "integer"
              },
              "count": {
                "description": "How many consecutive verses to return, starting at the one resolved above (1-20, default 1). Use it for a passage — «the last two verses of al-Baqara» is surah=2, aya=285, count=2, and a short surah comes back in one call. The response always reports `surah_ayat`, that surah's total verse count, so you never have to guess how many to ask for. Verses continue across the surah boundary; each carries its own surah/aya. E.g. {surah:112, aya:1, count:4} = all of al-Ikhlas. (mode=aya only.)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Maximum number of results to return (1-100, default 20). (mode=search only.)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "description": "Selects what the call does: search | aya. Default search.",
                "enum": ["search", "aya"],
                "type": "string"
              },
              "offset": {
                "description": "Number of results to skip for pagination. Use with `limit` to page through large result sets. The response includes `has_more` and `next_offset` to drive paging. Default: 0. (mode=search only.)",
                "minimum": 0,
                "type": "integer"
              },
              "options": {
                "additionalProperties": false,
                "description": "Currently only the `wildcards` flag is honored. The Quranic index ships pre-built and zero-config. `*` stands for any letters, `?` for one: {query:'الرحم*', options:{wildcards:true}} finds 57 verses. (mode=search only.)",
                "properties": {
                  "wildcards": {
                    "description": "Interpret `*` (zero-or-more characters) and `?` (exactly-one character) within tokens. Examples: `صيا*` matches صيام/صيامهم, `ص?م` matches صام/صوم/صمم. Leading wildcards (`*ابن`) are slow. Cannot combine with `morphology`. With this OFF, `*` and `?` are treated as ordinary punctuation and split the word, so a stray one no longer zeroes the search. CAVEAT on prefixes: the index folds some words as a WHOLE — «مائة» is stored as «ميه», «داوود» as «داود» — and a wildcard stem is folded without the letters the wildcard replaced, so `مائ*` becomes `ماي*` and reaches مائع/مائدة but NOT مائة. When a prefix search returns less than you expect for a word like these, search the full word without a wildcard instead. Default: false.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "query": {
                "description": "Arabic text of a verse or part of one. Matched against all 6,236 verses in BOTH orthographies — the Egyptian إملائي spelling a user types from memory AND the Uthmani rasm that mushaf apps, quran.com and PDFs copy (ٱ, dagger alef, ﴿﴾, full tashkeel are all handled), so paste the verse exactly as you received it. Every word is ANDed. Single-word queries also match prefixed forms (e.g. «الصبر» matches «بالصبر») AND the same word with «ال» stripped («الملك» is also searched as «ملك»/«للملك»), which widens the answer past the word you typed — the response names those forms in `stem_expanded_to`, tags each hit with the `matched_form` it came in on, and reports in `query_form_hits` how many verses match your word itself. Results come back in mushaf order (aya_id), not by relevance. Hafs from Asim text, pre-built aya/ Lucene index. (mode=search only.)",
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "description": "Format of the human-readable text: 'markdown' (default) for display; 'json' the same data as one JSON code block; 'none' only a one-line pointer, leaving structuredContent as the whole answer. structuredContent is always returned, so a caller that parses it should pass 'none': the character budget counts both channels, and the unread copy otherwise spends most of it. Requires the 'response_format.none' capability (see shamela_get_brief).",
                "enum": ["markdown", "json", "none"],
                "type": "string"
              },
              "surah": {
                "description": "Surah number 1..114. Pair with `aya`. E.g. {surah:55, aya:1} = Ar-Rahman 1. (mode=aya only.)",
                "maximum": 114,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "amiri": {
                "description": "Uthmani-script rendering (Amiri), for display to the reader. (mode=aya only.)",
                "type": ["string", "null"]
              },
              "aya": {
                "description": "Verse number within the surah. (mode=aya only.)",
                "type": "integer"
              },
              "aya_id": {
                "description": "Cumulative verse id, 1..6236. (mode=aya only.)",
                "type": "integer"
              },
              "body": {
                "description": "Standard Egyptian imla'i spelling, Hafs from Asim — the form text search matches. (mode=aya only.)",
                "type": ["string", "null"]
              },
              "has_more": {
                "description": "True when another page exists; call again with `next_offset`. (mode=search only.)",
                "type": "boolean"
              },
              "majma": {
                "description": "KFQPC Mushaf rendering. (mode=aya only.)",
                "type": ["string", "null"]
              },
              "next_offset": {
                "description": "Offset of the next page. Absent on the last page. (mode=search only.)",
                "type": "number"
              },
              "normalized_tokens": {
                "description": "The query after Arabic folding, as actually searched. (mode=search only.)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "offset": {
                "description": "Offset this page started at. (mode=search only.)",
                "type": "number"
              },
              "paging_ceiling": {
                "description": "Deepest offset paging can reach. Present only when the request went past it: narrow the scope instead of paging further. (mode=search only.)",
                "type": "number"
              },
              "query": {
                "description": "The query as received. (mode=search only.)",
                "type": "string"
              },
              "query_form_hits": {
                "description": "Verses matching the word as typed (or its prefixed forms) rather than the stem: «الملك» returns 60 verses, 28 of them this way. (mode=search only.)",
                "type": "number"
              },
              "results": {
                "description": "Verses in mushaf order: aya_id (1-6236), surah, surah_name, aya, body (full verse), snippet_body (<mark>…</mark> around matches), matched_orthography, matched_form (single-word queries: the searched form the verse came in on; one listed in stem_expanded_to means the stem matched, not your word, e.g. مَٰلِكِ in 1:4 for «الملك»). (mode=search only.)",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "description": "[mode=search] Rows in `results` on this call. [mode=aya] Number of verses in `verses`.",
                "type": "number"
              },
              "rows_dropped": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "kept": {
                      "type": "number"
                    },
                    "of": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "stem_expanded_to": {
                "description": "Single-word queries: the extra forms searched beyond the word as typed. (mode=search only.)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "surah": {
                "description": "Surah number, 1..114. (mode=aya only.)",
                "type": "integer"
              },
              "surah_ayat": {
                "description": "Total verses in the first verse's surah, so you can ask for the rest with `count`. (mode=aya only.)",
                "type": "integer"
              },
              "surah_name": {
                "description": "Arabic surah name. (mode=aya only.)",
                "type": "string"
              },
              "terms_truncated": {
                "description": "True when the query had more words than are searched. (mode=search only.)",
                "type": "boolean"
              },
              "total_hits": {
                "description": "Every match in scope, not just the rows returned. (mode=search only.)",
                "type": "number"
              },
              "total_hits_complete": {
                "description": "False when total_hits is a lower bound. (mode=search only.)",
                "type": "boolean"
              },
              "truncated": {
                "type": "boolean"
              },
              "truncation_message": {
                "type": "string"
              },
              "verses": {
                "description": "The requested run in order; the top-level fields repeat verses[0]. (mode=aya only.)",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "amiri": {
                      "$ref": "#/properties/amiri",
                      "description": "Uthmani-script rendering (Amiri), for display to the reader."
