        {
          "name": "shamela_lookup_rijal",
          "title": "Narrators and isnads",
          "description": "Hadith narrators and isnad chains, from Shamela's rijal register and isnad index. `mode`:\n- narrators (default): a narrator by name → narrator_id, most-documented first, then earliest death year. Names collide: confirm the death year before using an id.\n- narrator: one dossier by narrator_id — lineage, death year, tabaqa, Ibn Hajar's and al-Dhahabi's grades, critics' jarh wa-ta'dil verdicts verbatim with source (the only paged part), hadith_notes on audition and irsal; include_network adds isnad-index counts per book and top teachers/students. Quote verdicts as worded; never synthesize a grade.\n- isnad_search: chains by the narrators in them — `contains` (anywhere) or `transmission` [teacher_id, student_id] pairs that must be adjacent (direct audition, the stronger test) — each hit with book, page, hadeeth_key and the chain.\n- isnad: the chain(s) printed on one page (book_id/page_id from a search hit) with names and death years, plus the same hadith's other routes — one thread or many.\nRules: a parameter of another mode is refused. Chains run ascending (Companion first, collector last). Only ten hadith books are isnad-indexed (see scope_book_ids): an empty isnad_search means no such chain in those ten, not in all literature; most pages answer no_isnad_indexed:true with a no_isnad_reason, not an error. Errors: RIJAL_UNAVAILABLE (register not installed), NARRATOR_NOT_FOUND (search the name again), BOOK_NOT_FOUND, PAGE_NOT_FOUND, BOOK_NOT_DOWNLOADED (try shamela_get_details(kind='book') same_group).\nInstead: book authors → shamela_find(kind='author'); a hadith by its text → shamela_lookup_hadith(mode='search').",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "book_id": {
                "description": "Book id from a search hit (e.g. 1681, Sahih al-Bukhari). Chains exist only for the ten isnad-indexed books listed under shamela_lookup_rijal(mode='isnad_search'); other books answer no_isnad_indexed:true. (mode=isnad only.)",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "contains": {
                "description": "Narrator ids that must ALL appear in the chain, at any position and in any order. Use for «which reports pass through both X and Y». Ids from shamela_lookup_rijal(mode='narrators'). BAD_ARG when contains and transmission are both empty. E.g. {contains:[2779], scope_book_ids:[1681]} = Shu'ba's chains in al-Bukhari. (mode=isnad_search only.)",
                "items": {
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "include_network": {
                "description": "Include the transmission network computed from the isnād index: how many chains this narrator carries, in which books, and their most frequent teachers and students. Set false to skip it when you only need the biography. Default: true. (mode=narrator only.)",
                "type": "boolean"
              },
              "include_variants": {
                "description": "Also return the other routes (طرق) of the same ḥadīth from the other indexed books, matched on Shamela's ḥadīth key. This is what shows whether a report rests on one thread or many. Default: true. (mode=isnad only.)",
                "type": "boolean"
              },
              "limit": {
                "description": "[mode=narrators] Maximum narrators to return (1-50, default 10). [mode=narrator] How many CRITICS of al-jarḥ wa-l-taʿdīl to return (1-100, default 10) — the only part of the dossier that is paged. al-Zuhrī has 56 critics and 184 verdicts; they do not fit one response, and `total_critics` says how many there are. (mode=narrators|narrator only.)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_results": {
                "description": "Chains to return per page (1-100, default 20). Chains come in index order. (mode=isnad_search only.)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_variants": {
                "description": "Cap on returned variant routes (1-200, default 20). `variants.truncated` reports when more exist. (mode=isnad only.)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "description": "Selects what the call does: narrators | narrator | isnad_search | isnad. Default narrators.",
                "enum": ["narrators", "narrator", "isnad_search", "isnad"],
                "type": "string"
              },
              "narrator_id": {
                "description": "The narrator id, as returned by shamela_lookup_rijal(mode='narrators') or inside a chain from shamela_lookup_rijal(mode='isnad'). Example: {narrator_id:4677}. (mode=narrator only.)",
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "description": "[mode=narrators] Narrators to skip, for paging. Common names match in the thousands — «محمد بن» matches 4,271 — so page with this or narrow the query. Default: 0. [mode=narrator] Critics to skip, for paging through the verdicts. Follow `next_offset` until `has_more` is false. Default: 0. [mode=isnad_search] Chains to skip, for paging; follow `next_offset` while `has_more` is true. An offset past `paging_ceiling` returns no rows. Default: 0. (mode=narrators|narrator|isnad_search only.)",
                "minimum": 0,
                "type": "integer"
              },
              "page_id": {
                "description": "Shamela page id within that book (not the printed page number), from the same hit. An id the book lacks is PAGE_NOT_FOUND. (mode=isnad only.)",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Part of the narrator's name, in Arabic. Matched against the short name, the full lineage, and the register's الشهرة / اللقب / الكنية / النسب — so «الزهري» and «الأعمش» reach the men known by those nisbas even though neither appears in their recorded name. Folding is the same the page search uses, so «شعبه» finds «شعبة» and tashkeel is ignored. Tokens are ANDed and match anywhere, so «شعبة الحجاج» works even though the name reads «شعبة بن الحجاج». Results are ordered by how much al-jarḥ wa-l-taʿdīl the register holds on each man — the most-discussed «الزهري» first — with the earliest death year breaking ties. The register holds 18,989 narrators, died 2–774 AH. Names collide: check death year AND grade before deciding which «محمد بن إسماعيل» you have. E.g. 'شعبة بن الحجاج'. No hits: shorten or respell it. (mode=narrators only.)",
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "description": "Format of the human-readable text: 'markdown' (default) for display; 'json' the same data as one JSON code block; 'none' only a one-line pointer, leaving structuredContent as the whole answer. structuredContent is always returned, so a caller that parses it should pass 'none': the character budget counts both channels, and the unread copy otherwise spends most of it. Requires the 'response_format.none' capability (see shamela_get_brief).",
                "enum": ["markdown", "json", "none"],
                "type": "string"
              },
              "scope_book_ids": {
                "description": "Restrict to these books. The isnād index covers only ten: صحيح البخاري (1681), صحيح مسلم (711), سنن أبي داود (654), سنن الترمذي (7895), سنن النسائي (829), موطأ مالك (28107), مسند الطيالسي (1456), المنتقى لابن الجارود (627 و13071), وعلل الترمذي (642). 45,220 chains in all. (mode=isnad_search only.)",
                "items": {
                  "exclusiveMinimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "top_n": {
                "description": "How many teachers and how many students to return, most frequent first (1-100, default 15). (mode=narrator only.)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "transmission": {
                "description": "Pairs [teacher_id, student_id] that must appear ADJACENT and in that order — direct transmission, the student having heard from the teacher with nobody in between. This is the question «did X really narrate from Y», and it is strictly stronger than listing both in `contains`. All pairs are ANDed. E.g. [[1580,2779]] = Shu'ba heard from al-Hakam b. Utayba; [[4677,4494]] = Umar to Alqama (20 chains). (mode=isnad_search only.)",
                "items": {
                  "items": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "absent_from_isnad_index": {
                "description": "True when no indexed chain names this narrator; null when not computed. (mode=narrator only.)",
                "type": ["boolean", "null"]
              },
              "book_id": {
                "description": " (mode=isnad only.)",
                "type": "integer"
              },
              "chains": {
                "description": "Chains printed on this page. (mode=isnad only.)",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "book_id": {
                      "type": "integer"
                    },
                    "book_name": {
                      "type": "string"
                    },
                    "chain": {
