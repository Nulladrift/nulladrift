              "scope": {
                "description": "hadith-primary — The eight primary hadith collections, edition-pinned; tafsir-canonical — Canonical tafsir — Ibn Kathir, al-Tabari, Ibn al-Jawzi first; fiqh-hanafi — Hanafi fiqh (+ usul, comparative); fiqh-maliki — Maliki fiqh (+ usul, comparative); fiqh-shafii — Shafi'i fiqh (+ usul, comparative); fiqh-hanbali — Hanbali fiqh (+ usul, comparative); fiqh-comparative — All four schools plus comparative and fatwa collections; aqeedah — Creed and sects; hadith-sciences — Hadith commentary, takhrij and the sciences of hadith; tafsir — The whole tafsir shelf and Quranic sciences; seerah — Prophetic biography, history and biographical dictionaries; lugha — Arabic language, lexicons, grammar and adab",
                "enum": ["hadith-primary", "tafsir-canonical", "fiqh-hanafi", "fiqh-maliki", "fiqh-shafii", "fiqh-hanbali", "fiqh-comparative", "aqeedah", "hadith-sciences", "tafsir", "seerah", "lugha"],
                "type": "string"
              }
            },
            "required": ["query", "scope"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booksSearched": {
                "description": "Books in the searched scope, or null when the library did not say.",
                "type": ["integer", "null"]
              },
              "note": {
