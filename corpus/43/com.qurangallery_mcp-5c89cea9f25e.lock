                      "description": "The passage, verbatim, markup removed; at most 1,600 characters, cut with \"…\".",
                      "type": "string"
                    },
                    "author": {
                      "type": "string"
                    },
                    "authorDied": {
                      "description": "Year of death in AH, or null.",
                      "type": ["integer", "null"]
                    },
                    "book": {
                      "description": "Title including the printing, e.g. \"صحيح البخاري - ط السلطانية\".",
                      "type": "string"
                    },
                    "bookId": {
                      "description": "Shamela's book id.",
                      "type": "integer"
                    },
                    "edition": {
                      "description": "Omitted when the library records none.",
                      "type": "string"
                    },
                    "editor": {
                      "description": "The muhaqqiq; omitted when the library records none.",
                      "type": "string"
                    },
                    "matchQuality": {
                      "description": "How the library matched the page, e.g. \"exact_phrase\".",
                      "type": "string"
                    },
                    "matchedIn": {
                      "description": "Where the words were found. A footnote match is the editor's text, not the author's.",
                      "enum": ["body", "footnote", "both", "unknown"],
