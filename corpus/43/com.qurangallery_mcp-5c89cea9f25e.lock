              },
              "has_more": {
                "description": "True when more rows exist past this page. (mode=narrators|narrator|isnad_search only.)",
                "type": "boolean"
              },
              "jarh_tadil": {
                "description": "This page of critics' verdicts, grouped by critic, each verbatim with book and volume/page (e.g. «تهذيب التهذيب (1/ 101)»). 15,160 of the 18,989 narrators carry verdicts, from 2,821 named critics. (mode=narrator only.)",
                "items": {
