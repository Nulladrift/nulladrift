        {
          "name": "shamela_lookup_hadith",
          "title": "Find a hadith or the books that carry it",
          "description": "Hadith. mode=search (default): find a hadith by its wording and trace its takhrij — searches the hadith shelves (Sunnah collections, commentaries, takhrij, hadith sciences) in matn and footnotes, reads hadith keys off the matching pages and lists every collection indexing the same hadith. No offset; if the full text matches nothing, one word is dropped and named in `relaxed`. Takhrij covers only key_index_books, so few rows is not proof of a weak or rare hadith.\nmode=sources: every book recording one hadith_key, with its page_id, one row per book in index order.\nA downloaded:false book is catalogued but not installed: use another edition (shamela_get_details(kind='book') same_group). Narrator chains → shamela_lookup_rijal(mode='isnad_search'); general text → shamela_search(match='words').",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "downloaded_only": {
                "description": "If true (default), only return books whose text is installed on this server. false also lists catalogue-only editions (downloaded:false); `total` counts both either way. (mode=sources only.)",
                "type": "boolean"
              },
              "hadith_key": {
                "description": "Numeric hadith key (the normalized identifier Shamela uses across collections — e.g. 1234). Different collections of the same hadith share this key. Take it from shamela_lookup_hadith(mode='search'), shamela_read(unit='services'), or the `hadeeth_key` of a chain from shamela_lookup_rijal(mode='isnad') / shamela_lookup_rijal(mode='isnad_search') (a string there; pass it as a number). Read from Shamela's pre-built service/hadeeth.db join, for cross-collection research (Bukhari, Muslim, the Sunan and Musnad references of one hadith); read each page with shamela_read(unit='page'). One row per book, in index order; `total` counts all, `returned` only those installed here unless downloaded_only:false. SERVICE_KEY_NOT_FOUND: no book has the key. Example: {hadith_key:1}. (mode=sources only.)",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "limit": {
                "description": "Maximum number of results to return (1-100, default 20). (mode=search only.)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_pages_scanned": {
                "description": "How many top text matches (by relevance) to scan for hadith service keys. This is the only result window: `matches` never exceeds it whatever `limit` says, and there is no offset. Default: 20. Raise it for a common wording. Key-bearing pages come first, then `limit` cuts. (mode=search only.)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "description": "Selects what the call does: search | sources. Default search.",
                "enum": ["search", "sources"],
                "type": "string"
              },
              "query": {
                "description": "The hadith text (or a distinctive part of it). AND-combines words across matn + footnotes. Hadith keys come from each matching page's service annotations, takhrij from hadeeth.db. E.g. {query:'إنما الأعمال بالنيات'}. (mode=search only.)",
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "description": "Format of the human-readable text: 'markdown' (default) for display; 'json' the same data as one JSON code block; 'none' only a one-line pointer, leaving structuredContent as the whole answer. structuredContent is always returned, so a caller that parses it should pass 'none': the character budget counts both channels, and the unread copy otherwise spends most of it. Requires the 'response_format.none' capability (see shamela_get_brief).",
                "enum": ["markdown", "json", "none"],
                "type": "string"
              },
              "search_all_categories": {
                "description": "Search the ENTIRE library instead of the hadith shelves (كتب السنة، شروح الحديث، التخريج، علوم الحديث). Off by default because unscoped ranking buries the collections under works that merely quote the hadith. Turn on to find who CITES a hadith (e.g. in fiqh or tafsir) rather than who NARRATES it. (mode=search only.)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "books_searched": {
                "description": "Books the text search covered: the hadith shelves (كتب السنة، شروح الحديث، التخريج والأطراف، علوم الحديث), 1,957 here. (mode=search only.)",
                "type": "number"
              },
              "hadith_key": {
                "description": " (mode=sources only.)",
                "type": "integer"
              },
              "index_entries": {
                "description": "Raw index rows behind `total`. (mode=sources only.)",
                "type": "integer"
              },
              "key_index_books": {
                "description": "Books hadeeth.db indexes hadith keys for (ten here); takhrij can only come from these, so a hadith on 1,746 pages can still yield takhrij from ten books. (mode=search only.)",
                "type": "number"
              },
              "matches": {
                "description": "Matching pages, key-bearing first: book_id, book_name, page_id, snippet (often showing the printed takhrij, «رواه البخاري ومسلم»), snippet_source ('matn' | 'footnote'), matched_in, hadith_keys (read from the page's service annotations). (mode=search only.)",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "pages_scanned": {
                "description": "Top matches read for hadith keys (<= max_pages_scanned). (mode=search only.)",
                "type": "number"
              },
              "query": {
                "description": "The query as received. (mode=search only.)",
                "type": "string"
              },
              "relaxed": {
                "additionalProperties": true,
                "description": "Present when the full text matched nothing and one word was dropped. (mode=search only.)",
                "properties": {
                  "dropped_term": {
                    "type": "string"
                  },
                  "searched_query": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "results": {
                "description": "One row per book, in index order, with its first page for the hadith. (mode=sources only.)",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "author_name": {
                      "type": ["string", "null"]
                    },
                    "book_id": {
                      "type": "integer"
                    },
                    "book_name": {
                      "type": "string"
                    },
                    "downloaded": {
                      "description": "True when the book's text is installed on this server.",
                      "type": "boolean"
                    },
                    "page_id": {
                      "description": "Page the index points to in this book.",
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "description": "Rows in `results` after downloaded_only. (mode=sources only.)",
                "type": "integer"
              },
              "rows_dropped": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "kept": {
                      "type": "number"
                    },
                    "of": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "searched": {
                "description": "'hadith_shelves' (default) or 'whole_library' (search_all_categories). (mode=search only.)",
                "type": "string"
              },
              "takhrij": {
                "description": "Cross-collection takhrij per hadith key. Drawn only from key_index_books, so few rows is not proof of a weak or rare hadith. (mode=search only.)",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "books": {
                      "description": "Collections narrating it: book_id, book_name, author_name, page_id, downloaded (false = text not installed on this server).",
                      "items": {
                        "$ref": "#/properties/matches/items"
                      },
                      "type": "array"
                    },
                    "hadith_key": {
                      "description": "Hadith key found on a matched page.",
                      "type": "number"
                    },
                    "index_entries": {
                      "description": "Indexed pages behind this key.",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
