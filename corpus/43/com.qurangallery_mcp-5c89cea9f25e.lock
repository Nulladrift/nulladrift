                        "properties": {
                          "death_year": {
                            "$ref": "#/properties/network/anyOf/0/properties/narrates_from/items/properties/death_year"
                          },
                          "name": {
                            "$ref": "#/properties/network/anyOf/0/properties/narrates_from/items/properties/name"
                          },
                          "narrator_id": {
                            "$ref": "#/properties/network/anyOf/0/properties/narrates_from/items/properties/narrator_id"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "hadeeth_key": {
                      "description": "Shamela hadith key; pass to shamela_lookup_hadith(mode='sources').",
                      "type": ["string", "null"]
                    },
                    "page_id": {
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "chains_truncated": {
                "description": " (mode=isnad only.)",
                "type": "boolean"
              },
              "contains": {
                "description": " (mode=isnad_search only.)",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "death_year": {
                "anyOf": [
                  {
                    "type": "integer"
