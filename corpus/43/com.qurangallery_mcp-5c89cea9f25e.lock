                        {
                          "type": "null"
                        }
                      ],
                      "description": "The page joined onto `text`; a «[— بداية …]» line in `text` marks where it starts."
                    },
                    "continued_printed_page": {
                      "description": "Printed page of the joined page — cite this, not `printed_page`, for text after the marker.",
                      "type": ["string", "null"]
                    },
                    "death_year": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "foot": {
                      "description": "Footnotes — the editor's words, not the author's.",
                      "type": "string"
                    },
                    "next_page_id": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
