{
  "lockfileVersion": 2,
  "subjects": {
    "com.launch529/open-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://launch529.com/api/public/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "launch529",
        "title": "Launch529",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Launch529 has free, open data for families planning and paying for college: US college costs and net prices, state 529 plan fees, ratings and tax benefits, savings estimates, and whether an expense is a qualified 529 expense. Use search_schools to find a school id, list_529_plans to compare plans, and check_expense for what a 529 can pay for. No account is needed. To manage a family's own plan, expenses and people, the person can make an API key at launch529.com/settings/connect.",
      "tools": [
        {
          "name": "check_expense",
          "title": "Check if an expense is qualified",
          "description": "Say whether a college expense is a qualified 529 expense (for example 'laptop', 'off-campus rent', 'gas', 'student health insurance') with the reason, based on IRS Publication 970.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "What the money was spent on",
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if an expense is qualified"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfd780a882ff9c488d870c399d3ec645caba3bd864d70741f1be8c302a95246e"
        },
        {
          "name": "compare_529_plans",
          "title": "Compare 529 plans",
          "description": "Compare two to four 529 plans side by side on fees, ratings, tax benefit, minimums and who can join.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plans": {
                "description": "Plan slugs or names",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["plans"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare 529 plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d4b212b6def5451fd27c8bd0bfe4b3431d602b2c5ac91f0d729509fdc3f3041"
        },
        {
          "name": "estimate_college_cost",
          "title": "Estimate college savings needed",
          "description": "Project what college will cost and what to save. Give a US school id and the year the student starts. Returns the projected cost per year and in total, and the monthly amount that would fully fund it from today, assuming steady returns after the plan's fees.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_return_percent": {
                "description": "Expected yearly return before fees as a percent. Default 6.",
                "type": "number"
              },
              "current_savings": {
                "description": "Already saved, in US dollars. Default 0.",
                "type": "number"
              },
              "housing": {
                "description": "Where the student will live. Default on_campus.",
                "enum": ["on_campus", "off_campus"],
                "type": "string"
              },
              "monthly_contribution": {
                "description": "What is saved each month. Default 0.",
                "type": "number"
              },
              "school_id": {
                "description": "US school id from search_schools",
                "type": "integer"
              },
              "start_year": {
                "description": "First academic year, e.g. 2044 for the 2044-45 year",
                "type": "integer"
              },
              "years": {
                "description": "Years of undergraduate study. Default 4.",
                "type": "integer"
              }
            },
            "required": ["school_id", "start_year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate college savings needed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7df41e436016f39aa93153499c80fb1345735054e19a1df16ff6a55dfee47d0e"
        },
        {
          "name": "get_529_plan",
          "title": "Get a 529 plan",
          "description": "Everything we know about one 529 plan: fees, minimums, investment options, ratings, state tax benefit, restrictions and features. Use the slug from list_529_plans, or the plan's name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan": {
                "description": "A plan slug like 'my529-ut', or part of its name",
                "type": "string"
              }
            },
            "required": ["plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a 529 plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc660520289cb8dc2991d639618c385c44477ca400c7853a2e39fc0f508a40ef"
        },
        {
          "name": "get_school",
          "title": "Get college costs",
          "description": "Details for one US school by id: current sticker price, average net price, net price by family income, cost history since 2005, graduation rate and median earnings. Get the id from search_schools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "school_id": {
                "description": "The school's id from search_schools",
                "type": "integer"
              }
            },
            "required": ["school_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get college costs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ca1e1f6b45094460e047c013edff10b78917b64e7d35f1125e895fadecf405e"
        },
        {
          "name": "list_529_plans",
          "title": "List state 529 plans",
          "description": "List state 529 savings plans, ranked by popularity and ratings, with fees, Morningstar and Saving For College ratings, state tax benefit and whether residents of other states can join. Filter by state, by plans anyone can open, by maximum yearly fee, or by minimum rating.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "direct_sold_only": {
                "description": "Only plans you can open yourself, without an advisor",
                "type": "boolean"
              },
              "limit": {
                "description": "How many to return. Default 10, up to 30.",
                "type": "integer"
              },
              "max_fee_percent": {
                "description": "Highest yearly asset-based fee, in percent, e.g. 0.3",
                "type": "number"
              },
              "open_to_nonresidents": {
                "description": "Only plans that people from any state can open",
                "type": "boolean"
              },
              "state": {
                "description": "Two-letter state code, e.g. 'UT'. Returns that state's plans.",
                "type": "string"
              },
              "top_rated": {
                "description": "Only plans with a Morningstar medal or a 4.5+ Saving For College rating",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List state 529 plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2311af97a979e9f67f1810f4bcd2e63c77e233221d21254a6b73d834d7f73028"
        },
        {
          "name": "search_schools",
          "title": "Search colleges",
          "description": "Find colleges and universities by name, in the US and 529-eligible schools abroad. Returns each school's id, location and annual published costs (tuition, room and board, books). Use get_school with the id for cost history and net price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Part of the school's name, e.g. 'san diego state'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search colleges"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec4ae19bfb54de35dd4ed71bc6021b3e7ecbbf3c41e9d1b8518bdf9be1eb3daa"
        }
      ],
      "digest": "sha256:e168acd3187af464ea47a4b0dcb481820c7748348d477c0dabff30a208154fa9"
    }
  }
}
