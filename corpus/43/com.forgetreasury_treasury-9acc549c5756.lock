      "tools": [
        {
          "name": "claim_forge",
          "description": "[Advanced] Build calldata to claim weekly $FORGE rewards. Proof is fetched from forgetreasury.com/rewards when omitted.",
          "inputSchema": {
            "properties": {
              "agentAddress": {
                "description": "Agent wallet address",
                "type": "string"
              },
              "amount": {
                "description": "FORGE amount to claim (raw wei string). Optional if manifest has allocation.",
                "type": "string"
              },
              "epoch": {
                "description": "Reward epoch number",
                "type": "string"
              },
              "proof": {
                "description": "Merkle proof array (bytes32 hex strings). Optional — auto-fetched from manifest.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["agentAddress", "epoch"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9dba091c56e4568c28731aed8fec936a9322aef22d44168fd75e8c36a7bb584f"
        },
        {
          "name": "deposit",
          "description": "Deposit USDC into a Forge Treasury vault on Base. Returns calldata for the agent wallet to sign. The agent must approve USDC to the vault contract first. Mints yield-bearing fUSDC shares. Conservative deposits Core only (single leg). Balanced returns two legs (50% Core / 50% Middle). Aggressive is not live. Gas: Core 4M, Middle 6M+ on mainnet.",
          "inputSchema": {
            "properties": {
              "agentAddress": {
                "description": "Agent wallet address that will receive vault shares",
                "type": "string"
              },
              "amount": {
                "description": "USDC amount to deposit (human-readable, e.g. \"1000\" for 1000 USDC)",
                "type": "string"
              },
              "profile": {
                "description": "Strategy id (legacy \"profile\" name). conservative → Core vault. balanced → Core + Middle legs (50/50). aggressive → STRATEGY_NOT_LIVE. Defaults to \"conservative\".",
                "enum": ["conservative", "balanced", "aggressive"],
                "type": "string"
              }
            },
            "required": ["agentAddress", "amount"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac519f23dd96d1376cfb11c62c523ce21fa896303bcbcdc8f70af417e270ae0f"
        },
        {
          "name": "get_balance",
          "description": "Get an agent's Forge vault balance: shares held and equivalent USDC value. Read-only, no transaction needed.",
          "inputSchema": {
            "properties": {
              "agentAddress": {
                "description": "Agent wallet address",
                "type": "string"
              }
            },
            "required": ["agentAddress"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d635e67f98c632c85d161a69e54c4814778ce5addba4decb7fe6f7efc4911e61"
        },
        {
          "name": "get_current_apy",
          "description": "Get the blended target APY for a Forge profile: base USDC yield + FORGE boost. Returns structured JSON with profile metadata, target allocation by adapter, and a disclaimer. Format: \"X% USDC + Y% FORGE (blended target)\". APY is a blended target across conservative allocation weights; not a guarantee. Sepolia uses MockYieldAdapter until mainnet adapters are live. Conservative deposits Core only (single leg). Balanced returns two legs (50% Core / 50% Middle). Aggressive is not live. Gas: Core 4M, Middle 6M+ on mainnet.",
          "inputSchema": {
            "properties": {
              "agentAddress": {
                "description": "Optional agent address for personalized boost calculation",
                "type": "string"
              },
              "profile": {
                "description": "Risk profile. MVP: \"conservative\" only. balanced/aggressive return PROFILE_NOT_LIVE. Defaults to \"conservative\".",
                "enum": ["conservative", "balanced", "aggressive"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:95bd11d08c094292acd51fd91c80bc219b19a1bf05c1df9a8512759b12090007"
        },
        {
          "name": "get_forge_rewards",
          "description": "[Advanced] Get claimable $FORGE reward balance for an agent from the weekly emissions distributor.",
          "inputSchema": {
            "properties": {
              "agentAddress": {
                "description": "Agent wallet address",
                "type": "string"
              }
            },
            "required": ["agentAddress"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:139a9dac25c32b1c029f83f4a583637138f4952553b62bbe5b2fd374612f17bc"
        },
        {
          "name": "get_vault_stats",
          "description": "Get live Forge vault TVL on Base (conservative profile in MVP). Read-only.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db8f4815c4644685a811e7c59135ea7e19a71b0dd7fe1d31a2096050900a23e5"
        },
        {
          "name": "list_profiles",
          "description": "List Forge vaults (Core/Middle/Infra) and agent strategies (Conservative/Balanced/Aggressive). Mainnet: Core and Middle vaults live; conservative and balanced strategies live.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f768434814a573e62712177937c797ad49caf92d2e4b6f3cdbfc5833f6b0823"
        },
        {
          "name": "simulate_deposit",
          "description": "Project expected returns for a USDC deposit over 30, 90, and 365 days using the blended target APY. Use for agent reasoning before depositing. APY is a blended target across conservative allocation weights; not a guarantee. Sepolia uses MockYieldAdapter until mainnet adapters are live.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "USDC amount to simulate (e.g. \"10000\")",
                "type": "string"
              },
              "profile": {
                "description": "Risk profile to simulate. MVP: \"conservative\" only. Defaults to \"conservative\". balanced/aggressive return PROFILE_NOT_LIVE.",
                "enum": ["conservative", "balanced", "aggressive"],
                "type": "string"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:08e294640f47c073bd018b80d78d977f30505ed057e59fac2e252e852ed26ba1"
        },
        {
          "name": "withdraw",
          "description": "Withdraw from the Forge Treasury vault by redeeming shares. Returns calldata for the agent wallet. A 15% performance fee may apply on profits above the high water mark.",
          "inputSchema": {
            "properties": {
              "agentAddress": {
                "description": "Agent wallet address (owner of shares)",
                "type": "string"
              },
              "shares": {
                "description": "Vault share amount to redeem (raw uint256 string from get_balance)",
                "type": "string"
              }
            },
            "required": ["agentAddress", "shares"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:77571abcca79a28a9bbbfe6a4e33d9600cfa5cf899b36b089676de743ac58732"
        }
      ],
