      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "spam-i-am",
        "title": "Spam I Am",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Spam I Am checks whether a phone number shows a spam label (such as 'Spam Risk' or 'Scam Likely') on AT&T, Verizon and T-Mobile, using real phones on each carrier. Use it when calls go unanswered or someone says a number came up as spam. Flow: start_check with the number; then the number being checked must call each 'dial' number in the answer (you can't place calls with these tools; use your own calling tools or ask your human); then get_check with wait_seconds until status is 'complete'. Report each carrier separately. The first check on a number is free without a key. Later checks cost money: never pay yourself. Use request_approval to get a link for your human (a refused check's error already includes approve_url: show that), then get_approval to pick up your key. Only check numbers your human controls, and never use results to rotate numbers to evade labels.",
      "tools": [
        {
          "name": "get_approval",
          "title": "Check whether your human approved",
          "description": "Status of an approval request: pending, approved, declined or expired. Once approved, a keyless request returns api_key (shown once): pass it as api_key to the other tools. Set wait_seconds (up to 25) to wait for a decision.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional API key (sia_...), if your connection has none and you got one from get_approval",
                "type": "string"
              },
              "approval_id": {
                "type": "string"
              },
              "token": {
                "description": "The token from request_approval",
                "type": "string"
              },
              "wait_seconds": {
                "maximum": 25,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["approval_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59ad0239160c75a214d816293a86c1e81678b4615e9d734b9bde3ecd49ef399b"
        },
        {
          "name": "get_balance",
          "title": "Balance",
          "description": "Needs a key. The account balance, holds, and this key's spending limit.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional API key (sia_...), if your connection has none and you got one from get_approval",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:314f92af30d1c897a3a9af0100f4a9f5d39e619fcc1cd074e991a0ccaaee7254"
        },
        {
          "name": "get_check",
          "title": "Get a check's results",
          "description": "The check and each carrier's result: status waiting, complete or incomplete; the label shown and caller name; flagged true/false; a screenshot link. Set wait_seconds (up to 25) to wait for results to arrive before answering.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional API key (sia_...), if your connection has none and you got one from get_approval",
                "type": "string"
              },
              "check_id": {
                "type": "string"
              },
              "token": {
                "description": "The token from start_check, for a check started without a key",
                "type": "string"
              },
              "wait_seconds": {
                "maximum": 25,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["check_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b8003cbc036a70c5e2cbf23a3aad039dd96f2f489f8717d809165dc6e8d8db82"
        },
        {
          "name": "get_coverage",
          "title": "Carriers and prices",
          "description": "Which carriers are online now, prices in cents, and the dialing window.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70c206b08c2ddcd1fc6de790312d4efd05f12ee63ddf488943291eaddba29cac"
        },
        {
          "name": "request_approval",
          "title": "Ask your human to approve spending",
          "description": "Get a link (approve_url) for your human to open: they sign in, add funds if needed, set a spending limit and approve. Show them the link, then call get_approval. Use this when a check is refused with free_check_used, insufficient_funds or key_limit.",
          "inputSchema": {
            "properties": {
              "amount_cents": {
                "description": "How much you're asking for",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "api_key": {
                "description": "Optional API key (sia_...), if your connection has none and you got one from get_approval",
                "type": "string"
              },
              "number": {
                "description": "US 10-digit phone number, any format, e.g. '2145550100' or '(214) 555-0100'",
                "type": "string"
              },
              "reason": {
                "description": "Shown to your human, e.g. 'Check our sales line before Monday's campaign'",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b4701ca5040b2e6119026b92b12d1003dfdd0c60d619a09a4a0970710d508c76"
        },
        {
          "name": "start_check",
          "title": "Start a spam label check",
          "description": "Start a check of what AT&T, Verizon and T-Mobile phones show when a number calls. Returns the test line to call ('dial') for each carrier and a check id (and a token for a keyless check: keep it). The number being checked must then call each test line within the window. The first check on a number is free; later ones need a key with funds.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional API key (sia_...), if your connection has none and you got one from get_approval",
                "type": "string"
              },
              "carriers": {
                "description": "Leave out to check every carrier that's online",
                "items": {
                  "enum": ["AT&T", "Verizon", "T-Mobile"],
                  "type": "string"
                },
                "type": "array"
              },
              "number": {
                "description": "US 10-digit phone number, any format, e.g. '2145550100' or '(214) 555-0100'",
                "type": "string"
              },
              "webhook_url": {
                "description": "Optional https address to POST the finished result to",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d1d21309bbe94c57aead2a36bcd4140f02730012605c88433731bd56bc32d629"
        }
      ],
      "digest": "sha256:c8f41fe54576746b2e40435fc6cc71545a135026e5b1ab006c276862f6c3786d"
    }
