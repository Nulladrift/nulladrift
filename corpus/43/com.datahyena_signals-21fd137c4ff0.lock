      "tools": [
        {
          "name": "acquisitions",
          "title": "Find acquisitions",
          "description": "List acquisition and merger events ordered by announcement date, newest first. Filter by payment type, deal amount range, merger flag, or a company that is the acquirer or target. Costs one credit per returned record.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "companyId": {
                "description": "Return only events where this company is the acquirer or target.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "countries": {
                "description": "Headquarters country codes (ISO alpha-2, OR). Pass \"unknown\" to include companies with no country on file.",
                "items": {
                  "enum": ["unknown", "AD", "AE", "AF", "AG", "AI", "AL", "AM", "AO", "AR", "AS", "AT", "AU", "AW", "AX", "AZ", "BA", "BB", "BD", "BE", "BF", "BG", "BH", "BI", "BJ", "BL", "BM", "BN", "BO", "BQ", "BR", "BS", "BT", "BW", "BY", "BZ", "CA", "CD", "CF", "CG", "CH", "CI", "CK", "CL", "CM", "CN", "CO", "CR", "CU", "CV", "CW", "CY", "CZ", "DE", "DJ", "DK", "DM", "DO", "DZ", "EC", "EE", "EG", "EH", "ER", "ES", "ET", "FI", "FJ", "FK", "FM", "FO", "FR", "GA", "GB", "GD", "GE", "GF", "GG", "GH", "GI", "GL", "GM", "GN", "GP", "GQ", "GR", "GT", "GU", "GW", "GY", "HK", "HN", "HR", "HT", "HU", "ID", "IE", "IL", "IM", "IN", "IQ", "IR", "IS", "IT", "JE", "JM", "JO", "JP", "KE", "KG", "KH", "KI", "KM", "KN", "KP", "KR", "KW", "KY", "KZ", "LA", "LB", "LC", "LI", "LK", "LR", "LS", "LT", "LU", "LV", "LY", "MA", "MC", "MD", "ME", "MF", "MG", "MH", "MK", "ML", "MM", "MN", "MO", "MP", "MQ", "MR", "MS", "MT", "MU", "MV", "MW", "MX", "MY", "MZ", "NA", "NC", "NE", "NG", "NI", "NL", "NO", "NP", "NR", "NU", "NZ", "OM", "PA", "PE", "PF", "PG", "PH", "PK", "PL", "PM", "PR", "PS", "PT", "PW", "PY", "QA", "RE", "RO", "RS", "RU", "RW", "SA", "SB", "SC", "SD", "SE", "SG", "SH", "SI", "SK", "SL", "SM", "SN", "SO", "SR", "SS", "ST", "SV", "SX", "SY", "SZ", "TC", "TD", "TG", "TH", "TJ", "TK", "TL", "TM", "TN", "TO", "TR", "TT", "TV", "TW", "TZ", "UA", "UG", "US", "UY", "UZ", "VA", "VC", "VE", "VG", "VI", "VN", "VU", "WF", "WS", "YE", "YT", "ZA", "ZM", "ZW"],
                  "type": "string"
                },
                "type": "array"
              },
              "cursor": {
                "description": "Opaque pagination cursor returned as pagination.nextCursor on the previous page.",
                "type": "string"
              },
              "domain": {
                "description": "Company domain, e.g. stripe.com. Matches the company's primary domain or any domain it redirected from; a full URL works too.",
                "maxLength": 253,
                "type": "string"
              },
              "includeTotal": {
                "description": "Also return pagination.total, the number of records matching these filters across all pages. Costs no credits.",
                "type": "boolean"
              },
              "industryGroups": {
                "description": "Company industry groups (OR). LinkedIn industry labels, matched case-insensitively; older LinkedIn names and short forms like \"software\" map to the current label. Pass \"unknown\" for companies with no industry on file.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "isMerger": {
                "description": "Filter to mergers (true) or acquisitions (false).",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Maximum records to return (1-100). Each returned record costs one credit.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "maxAmountUsd": {
                "description": "Maximum deal amount in USD.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "minAmountUsd": {
                "description": "Minimum deal amount in USD.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "naicsCode": {
                "description": "NAICS 2022 code for the target (acquired) company. Matches the code and everything beneath it, so \"51\" also returns 5132 and 5173. Sector ranges work: \"31-33\" returns all manufacturing. Any 2- to 6-digit code is accepted; codes deeper than we classify (e.g. 541511) match at their deepest classified parent (5415).",
                "type": "string"
              },
              "paymentType": {
                "description": "Payment type filters. Canonical values: cash, stock, mixed, undisclosed.",
                "items": {
                  "enum": ["cash", "stock", "mixed", "undisclosed"],
                  "type": "string"
                },
                "type": "array"
              },
              "since": {
                "description": "Return records announced on or after this date (YYYY-MM-DD) or ISO-8601 timestamp.",
                "type": "string"
              },
              "status": {
                "description": "Deal status filters: announced, completed, or terminated (called off or blocked).",
                "items": {
                  "enum": ["announced", "completed", "terminated"],
                  "type": "string"
                },
                "type": "array"
              },
              "until": {
                "description": "Return records announced on or before this date (YYYY-MM-DD, inclusive) or ISO-8601 timestamp.",
                "type": "string"
              },
              "verticals": {
                "description": "Target company sector filters (OR). Canonical values: ai, fintech, saas, devtools, healthcare, climate, robotics, cybersecurity, logistics, commerce, data, crypto, media, education, marketing, telecom, realestate, hardware, gaming, space.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
