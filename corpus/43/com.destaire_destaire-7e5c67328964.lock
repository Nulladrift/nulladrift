      "instructions": "Déstaire (https://destaire.com) is a curated guide to exceptional hotels and private stays, with travel writing. Start with search_stays (plain words work, with filters for country, destination, collection, amenities, and a nightly budget), then get_stay for one stay's details. Every answer holds the URL of its page on https://destaire.com: give the reader that link. Rates are \"from\" prices shown in euros, checked each week. Déstaire also sells paid city guides, each on its page on https://destaire.com; these tools give a guide's public shop page only, never its contents. With buy_guide, the user can also buy a guide in this conversation.",
      "tools": [
        {
          "name": "buy_guide",
          "title": "Buy a city guide",
          "description": "Buy a city guide for the user, paid inside this conversation. Gives a pay link that takes an MPP payment (a Stripe Shared Payment Token from your wallet, such as Link). Confirm the user's email first: the guide goes to that account, and the purchase is final.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "The user's email address: the guide goes to this Déstaire account.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "slug": {
                "description": "The guide's slug, the last part of its URL.",
                "maxLength": 120,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["email", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "email": {
                "type": "string"
              },
              "guide": {
                "additionalProperties": {},
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "cover": {
                    "anyOf": [
                      {
                        "format": "uri",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["city", "country", "cover", "title", "url"],
