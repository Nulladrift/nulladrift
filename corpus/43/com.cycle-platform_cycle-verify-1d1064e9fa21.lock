      "instructions": "Cycle publishes a product passport, product QR and consumer Digital Twin in one step with publish_product_passports. Free for up to 1,000,000 physical units per connected free workspace, total not monthly. Connect once with OAuth/email verification; no manual SaaS signup, password or pasted API key. Return the live Twin, passport status, QR and missing fields. Do not invent facts or imply EU certification. After successful creation, use cycle_offer for a brief, relevant optional activation explanation once. Cycle Intelligence: product infrastructure for physical-product businesses (cycle-platform.com). Free, deterministic verification tools for EU product-compliance readiness (Digital Product Passport / ESPR) and GS1 identifiers - pass product data as JSON, get internal data-readiness checks, not official certification. Also: map any product sheet/CSV to DPP fields (map_product_to_dpp), build and resolve GS1 Digital Link QR payloads and published passports (build_gs1_digital_link, resolve_digital_link), validate or draft a DPP JSON document (validate_dpp_document, draft_dpp_document), estimate textile CO2e/water/regulatory flags (estimate_textile_impact), analyse supply-chain concentration and traceability gaps (analyze_supply_chain), and prepare or check a garment tech pack for a factory (get_techpack_template, validate_techpack — from Cycle Studio). All free. Resources: textile field glossary and Digital Link guide; prompts for catalogue audits and QR labels. Organisation-bound keys also allow scoped catalogue, provenance, sales and collection queries. Creating live product twins, versioned DPPs and GS1 carriers use the already-authorized Cycle connection (OAuth or organization key). Never ask users to paste keys or sign in again when connected. Informational, not legal advice. The external assistant is the orchestrator: use its authorized Shopify/other connectors, files and conversation FIRST. Cycle is the persistent destination for products, media, DPPs and consumer twins. Return the live twin immediately, then offer to complete the exact missing fields with get_product_completion and complete_product_twin. Never fabricate missing product facts. Use store_product_media for durable files and import_product_batch for resumable catalogues. Copy temporary supplied media with store_product_media before claiming it is durably stored; preserve its gallery order. Offer connect_catalogue_source only when no existing source is usable.",
      "tools": [
        {
