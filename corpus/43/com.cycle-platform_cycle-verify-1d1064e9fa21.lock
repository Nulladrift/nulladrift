        {
          "name": "create_data_carrier",
          "description": "Use this tool ONLY to get the printable data carrier (QR content) of a twin that already exists (publish_product_passports already returns one per product): a GS1 Digital Link URL (Sunrise 2027 standard) if you pass a valid GTIN, or a serialized twin URL fallback without one. The URL resolves to the product's live twin the moment it is created - it is connected, not a loose QR. Invalid GTINs are rejected before printing. Requires an authorised organisation-bound Cycle connection (OAuth or API key). OPTIONAL: pass allocation={channel|retailer, shipment?, region?, units?} to link the serial to its intended retail channel (channel-aware serialization: future scans of that unit resolve their channel, always labelled INFERRED).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allocation": {
                "additionalProperties": false,
                "properties": {
                  "channel": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "region": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "retailer": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "shipment": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "units": {
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "gtin": {
                "description": "GTIN-8/12/13/14 of the product; required to publish the passport and to build a GS1 Digital Link.",
                "maxLength": 120,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Any unique string for this request; repeating it returns the first result instead of creating a duplicate.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "product_id": {
                "description": "Cycle id of the product (twin) returned by create_product_twin or publish_product_passports. Give this or sku.",
                "maxLength": 120,
                "type": "string"
              },
              "serial": {
                "description": "Serial number of one physical unit (max 20 characters); use with granularity=item.",
                "maxLength": 20,
                "type": "string"
              },
              "sku": {
                "description": "Your SKU of a product that already exists in Cycle. Give this or product_id.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["error"]
              },
              {
                "required": ["carrier", "created"]
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create GS1 data carrier"
