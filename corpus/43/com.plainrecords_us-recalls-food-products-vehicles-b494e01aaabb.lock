{
  "lockfileVersion": 2,
  "subjects": {
    "com.plainrecords/us-recalls-food-products-vehicles": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://plainrecords.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "plainrecords",
        "title": "PlainRecords: U.S. recall records as the agencies wrote them",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Look up U.S. product, food, medicine and vehicle recalls, tap water violations by ZIP, FDA drug shortages, recalls by state and FDA foodborne outbreak investigations. Records come from the U.S. FDA, USDA FSIS, CPSC and NHTSA. Recall text is the agency record; where they differ, the agency notice governs. Owner complaints are unverified reports to NHTSA. PlainRecords is independent and not affiliated with any agency or brand. Cite the url.",
      "tools": [
        {
          "name": "brand_recalls",
          "title": "Recall history of a brand",
          "description": "The newest records (up to 25) of a brand or company across FDA, USDA FSIS, CPSC and NHTSA, each with its kind as the agency gives it (Recall, Warning, Allergy Alert ...), with the number of records and the number of recalls among them. Dates as search_recalls names them; a campaign NHTSA removed from its file is a record, not a current recall.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand or company name",
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b561a16001b23b62bebf4214806f25f78d9e3e62f96df9ba32ec3faec0193bf4"
        },
        {
          "name": "drug_shortage",
          "title": "FDA drug shortages for a drug",
          "description": "FDA's drug shortage entries whose generic name contains the words given (up to 15), as FDA lists them: status, availability, reason, dosage form and update date. Not medical advice.",
          "inputSchema": {
            "properties": {
              "drug": {
                "description": "Generic drug name or part of it, e.g. amoxicillin, cisplatin",
                "type": "string"
              }
            },
            "required": ["drug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c40c7cadf6a58be2004dd2c40562b18a6695dc850f8ba9d32e0ba5e9805fd8b"
        },
        {
          "name": "food_outbreaks",
          "title": "FDA foodborne outbreak investigations",
          "description": "FDA's list of foodborne outbreak investigations as FDA posts it (newest first): pathogen, product, case count, status and whether FDA lists a recall, with the link to FDA's advisory.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 15,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d0356080099117b0acf8f127e3f0dda4bafb0f2af38b62907010ffb89f58ed30"
        },
        {
          "name": "recalls_in_state",
          "title": "Recalls whose distribution names a state",
          "description": "FDA (food, medicine, device, veterinary) and USDA FSIS recalls whose distribution text names the state (the newest 20, with the total). Recalls that say only \"nationwide\" name no state and are counted separately; CPSC and NHTSA do not record states.",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "A state name or its two-letter code, e.g. Texas or TX",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49f9647838cd5d370a317c74472999fdab4288e157216c3e4a01e6b1b6b8c607"
        },
        {
          "name": "search_recalls",
          "title": "Search U.S. recalls",
          "description": "Find U.S. recalls and notices from FDA (food, medicine, medical device), USDA FSIS (meat, poultry, egg products), CPSC (consumer product) and NHTSA (vehicle) by product, brand, hazard, lot code or UPC. Newest and best matches first. Canadian, UK and EU notices are not searched. An FDA enforcement record gives recall_initiation_date (the recall's start) and report_date (FDA's enforcement report); other records give date. A campaign NHTSA removed from its file carries removed_from_nhtsa_file.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words such as \"air fryer\", \"peanut butter salmonella\", a lot code or UPC",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:deb43759c8a3e9f64ad6896a6be60bdd2b4ecea16b53d9485cff185d3e77fe08"
        },
        {
          "name": "tap_water",
          "title": "Tap water by ZIP code",
          "description": "The community water systems that EPA's service-area map puts a ZIP code's people in (up to 6, most people first), each with the health-based violations EPA records since three years before its file date, the contaminants or rules, and the page with every violation. These are records of violations, not a test of the water today.",
          "inputSchema": {
            "properties": {
              "zip": {
                "description": "A 5-digit U.S. ZIP code, e.g. 39201",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:226729244cb79e6d29d07672a08f1202212644b10f8e7e5ff901062fc7f7c600"
        },
        {
          "name": "vehicle_recalls",
          "title": "Recalls and complaints for a car model year",
          "description": "NHTSA recalls for a make, model and model year (the newest 30, with the total on record), plus owner complaint counts since 1995 by part. A recall applies only to the vehicles it lists: the owner should check the VIN at nhtsa.gov/recalls.",
          "inputSchema": {
            "properties": {
              "make": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "year": {
                "description": "Model year, e.g. 2019",
                "type": "string"
              }
            },
            "required": ["make", "model", "year"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a40e2cc931bb616ed40dbc4289b6003170fcbe689e023703ef71554b815c0f35"
        }
      ],
      "digest": "sha256:be05948d60a76d06bde2912486bae1578395ce349c1658c49be3654fe3e5366d"
    }
  }
}
