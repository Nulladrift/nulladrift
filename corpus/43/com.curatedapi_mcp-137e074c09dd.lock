        {
          "name": "calc_finance_yield_to_call",
          "title": "Yield to call calculator",
          "description": "The yield of a callable bond if the issuer redeems it on the call date at the call price, found as a proven root of the price equation.\n\nA callable bond can be repaid early at a set price. Yield to call is the yield the buyer earns if that happens: the rate at which the coupons up to the call date and the call price are worth today's price. It is the same equation as yield to maturity (Excel's YIELD) with the call date in place of maturity and the call price in place of the redemption value. Compare it with the yield to maturity; the lower of the two is the yield to worst.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "call_date": {
                "description": "The date the bond can be called.",
                "examples": ["2031-03-15"],
                "format": "date",
                "type": "string"
              },
