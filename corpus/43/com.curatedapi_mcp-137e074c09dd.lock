                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  },
                  "significant_digits": {
                    "description": "Round results to this many significant digits.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "start": {
                "description": "Start date (YYYY-MM-DD) or date-time (2026-03-29T01:30:00+01:00). At most 40 characters.",
                "examples": ["2026-01-01"],
                "maxLength": 40,
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone for date-times without an offset, e.g. America/New_York.",
                "type": "string"
