      "instructions": "Exact calculators: finance (loans, mortgages, interest, NPV, IRR, ROI, regulated APR for US Regulation Z and EU/UK APRC), billing (tiered pricing, proration, stacked discounts), money (ISO 4217 currency and cash rounding, splitting without losing a cent), late-payment interest (UK, EU, Germany, India MSME, US Prompt Payment), Excel-compatible functions (PMT, XIRR, YEARFRAC and more), lease accounting (IFRS 16, ASC 842) and depreciation (MACRS, India), dates, units, math and everyday tools. Results are computed with exact or certified arithmetic and rounded once, as documented per tool. Pass numbers as strings (\"0.1\") to keep every digit. Each result says which calculator version ran, the formula, its references and whether each value is exact or rounded. E-invoice validators (EN 16931, Peppol BIS, XRechnung, Factur-X/ZUGFeRD) run the rule owners' official rules on an invoice and list every rule it breaks.",
      "tools": [
        {
          "name": "calc_accounting_depreciation_india_companies_act",
          "title": "Schedule II depreciation (India)",
          "description": "Book depreciation for Indian companies over the Schedule II useful life, straight line (SLM) or written down value (WDV), pro rata by days.\n\nThe depreciable amount (cost less residual value, 5% of cost unless you choose otherwise) is spread over the useful life. SLM charges the same amount each year; WDV uses the rate 1 − (residual / cost)^(1 / life), which brings the carrying amount to the residual value at the end of the life. The first year is charged pro rata from the date put to use to 31 March, and the last year ends when the useful life does, at exactly the residual value.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cost": {
                "description": "Cost of the asset. Allowed: > 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["100000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "date_put_to_use": {
                "description": "The day the asset was available for use.",
                "examples": ["2026-04-01"],
                "format": "date",
                "type": "string"
              },
              "method": {
                "description": "Depreciation method. Options: slm: straight line; wdv: written down value",
                "enum": ["slm", "wdv"],
                "examples": ["wdv"],
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "residual_percent": {
                "default": "5",
                "description": "Residual value as a percentage of cost. Allowed: >= 0 and < 100. Unit: percent.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "useful_life_years": {
                "description": "Useful life in years (Schedule II Part C, or your own estimate). Allowed: >= 1 and <= 100.",
                "examples": [5],
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "wdv_rate_percent": {
                "description": "WDV only: use this rate instead of the exact one, e.g. a rate rounded to 2 decimals. The last year still brings the carrying amount to the residual value. Allowed: > 0 and <= 100. Unit: percent.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              }
            },
            "required": ["cost", "date_put_to_use", "method", "useful_life_years"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["accounting/depreciation/india-companies-act@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "depreciable_amount": {
                    "description": "Cost less residual value. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "rate_percent": {
                    "description": "Annual rate, in percent (4 decimals).",
                    "type": "string"
                  },
                  "residual_value": {
                    "description": "Residual value. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "schedule": {
                    "description": "Depreciation by financial year (April to March).",
                    "items": {
                      "properties": {
                        "accumulated": {
                          "description": "Accumulated depreciation. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        },
                        "closing_value": {
                          "description": "Carrying amount at the end of the year. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        },
                        "days": {
                          "description": "Days depreciated in the year.",
                          "type": "integer"
                        },
                        "depreciation": {
                          "description": "Depreciation for the year. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        },
                        "end": {
                          "description": "Last day depreciated in the year.",
                          "format": "date",
                          "type": "string"
                        },
                        "start": {
                          "description": "First day depreciated in the year.",
                          "format": "date",
                          "type": "string"
                        },
                        "year": {
                          "description": "Financial year number, from 1.",
                          "type": "integer"
                        }
                      },
                      "required": ["accumulated", "closing_value", "days", "depreciation", "end", "start", "year"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["depreciable_amount", "rate_percent", "residual_value", "schedule"],
                "type": "object"
              },
