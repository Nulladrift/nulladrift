                "description": "Annual coupon rate in percent of face value. Allowed: >= 0 and <= 1000. Unit: percent.",
                "examples": ["5"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "day_count": {
