        },
        {
          "name": "calc_billing_proration",
          "title": "Subscription proration calculator",
          "description": "Credit for unused time and charge for the remaining time when a subscription changes plan mid-period, prorated to the second like Stripe, or by hour, day or week.\n\nWhen a customer changes plan part-way through a billing period, they are credited the unused part of what they paid for the old plan and charged the remaining part of the new one. Both are the full-period amount times the fraction of the period left: (period end − change time) ÷ (period end − period start). By default this is exact to the second, as Stripe and Chargebee prorate; with an hour, day or week granularity the change time first moves to a boundary counted from the period start, like Stripe's custom-interval proration. The credit and the charge are each rounded, and the net is charge minus credit, as on the invoice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "change_at": {
                "description": "When the plan changes (Stripe's proration_date). Must be within the period.",
                "examples": ["2026-04-11T06:00:00Z"],
                "format": "date-time",
                "type": "string"
              },
              "granularity": {
                "default": "exact",
                "description": "Unit of time the proration is counted in. Options: exact: to the second (to the microsecond if the times have one), as Stripe and Chargebee do by default; hour: whole hours from the period start; day: whole days from the period start; week: whole weeks from the period start",
                "enum": ["exact", "hour", "day", "week"],
                "type": "string"
              },
              "new_amount": {
                "description": "What the new plan costs for a full period. 0 when cancelling or removing an item. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["60"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "old_amount": {
                "description": "What the old plan costs for a full period (price × quantity, after discounts). In Stripe's flexible billing mode, use what was actually billed for the period. 0 when adding a new item. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["30"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_up, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_up.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "period_end": {
                "description": "End of the current billing period (the next renewal).",
                "examples": ["2026-05-01T00:00:00Z"],
                "format": "date-time",
                "type": "string"
              },
              "period_start": {
                "description": "Start of the current billing period, ISO 8601 (2026-04-01T00:00:00Z). A time without an offset is read as UTC.",
                "examples": ["2026-04-01T00:00:00Z"],
                "format": "date-time",
                "type": "string"
              },
              "snap": {
                "default": "nearest",
                "description": "With an hour, day or week granularity, which boundary the change time moves to. Options: nearest: the closer boundary; exactly halfway goes to the later one; up: the next boundary: the old plan runs for the whole unit; down: the previous boundary: the new plan applies for the whole unit",
                "enum": ["nearest", "up", "down"],
                "type": "string"
              }
            },
            "required": ["change_at", "new_amount", "old_amount", "period_end", "period_start"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["billing/proration@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "charge": {
                    "description": "Charge for the remaining time on the new plan. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "credit": {
                    "description": "Credit for the unused time on the old plan (a positive number; the invoice shows it as a negative line). Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "effective_change_at": {
                    "description": "The change time used, in UTC: change_at, or the boundary it moved to.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "net": {
                    "description": "charge − credit: what the change adds to the invoice (negative: a credit). Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "period_seconds": {
                    "description": "Length of the billing period in seconds.",
                    "type": "string"
                  },
                  "remaining_fraction": {
                    "description": "Exact fraction of the period left after the change, as a decimal or p/q.",
                    "type": "string"
                  },
                  "remaining_seconds": {
                    "description": "Seconds from the change to the period end.",
                    "type": "string"
                  }
                },
                "required": ["charge", "credit", "effective_change_at", "net", "period_seconds", "remaining_fraction", "remaining_seconds"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Subscription proration calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbe558e20b077d7257badc695b21cc2947f5276b61f5a6aabd561081581f9405"
        },
        {
          "name": "calc_billing_tiered_price",
          "title": "Tiered pricing calculator",
          "description": "Price of a quantity under graduated or volume tiers, with optional flat fees, exactly as Stripe bills tiered prices.\n\nPrices a quantity (seats, API calls, gigabytes) on a tiered price list. With graduated tiers, each unit is charged at the price of the tier it falls in, so 12 units on tiers of 5 are charged 5 at the first price, 5 at the second and 2 at the third. With volume tiers, every unit is charged at the price of the tier the whole quantity lands in. A tier can also have a flat fee: graduated pricing charges the flat fee of every tier it reaches, volume pricing only that of the tier it lands in. The tiers table shows how the total is made up.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_up, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_up.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "pricing_model": {
                "description": "How the tiers apply. Options: graduated: each tier's units at that tier's price, summed (Stripe tiers_mode=graduated); volume: all units at the price of the tier the quantity lands in (Stripe tiers_mode=volume)",
                "enum": ["graduated", "volume"],
                "examples": ["graduated"],
                "type": "string"
              },
              "quantity": {
                "description": "Number of units to price (whole or decimal, for metered usage). Allowed: >= 0 and <= 1000000000000000.",
                "examples": ["12"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "tier_flat_fee": {
                "description": "Flat fee of each tier, one per tier like tier_unit_price (Stripe's flat_amount). Omit it for no flat fees. Up to 100 items. Each item: >= 0 and <= 1000000000000000. Unit: currency.",
                "items": {
                  "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 0,
                "type": "array"
              },
              "tier_unit_price": {
                "description": "Price per unit in each tier, first tier first (any number of decimals, like Stripe's unit_amount_decimal). 1 to 100 items. Each item: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": [
                  ["7", "6.5", "6"]
                ],
                "items": {
                  "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "tier_up_to": {
                "description": "Upper limit of each tier except the last, inclusive and increasing. The first tier covers 0 up to the first limit, the next tier starts just above it, and the last tier has no limit (Stripe's up_to=inf), so give one item fewer than tier_unit_price. Omit it for a single tier. Up to 99 items. Each item: > 0 and <= 1000000000000000.",
                "examples": [
                  ["5", "10"]
                ],
                "items": {
                  "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                  "type": "string"
                },
                "maxItems": 99,
                "minItems": 0,
                "type": "array"
              }
            },
            "required": ["pricing_model", "quantity", "tier_unit_price"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["billing/tiered-price@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "tier": {
                    "description": "The tier the quantity lands in (volume) or the highest tier it reaches (graduated).",
                    "type": "integer"
                  },
                  "tiers": {
                    "description": "Each tier that is charged: one row for volume pricing, every tier reached for graduated pricing.",
                    "items": {
                      "properties": {
                        "above": {
                          "description": "The tier starts above this quantity (exact).",
                          "type": "string"
                        },
                        "amount": {
                          "description": "units × unit_price + flat_fee, rounded. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        },
                        "flat_fee": {
                          "description": "This tier's flat fee, as given.",
                          "type": "string"
                        },
                        "tier": {
                          "description": "Tier number, starting at 1.",
                          "type": "integer"
                        },
                        "unit_price": {
                          "description": "This tier's price per unit, as given.",
                          "type": "string"
                        },
                        "units": {
                          "description": "Units charged at this tier's price (exact).",
                          "type": "string"
                        },
                        "up_to": {
                          "description": "The tier ends at this quantity, inclusive; inf for the last tier.",
                          "type": "string"
                        }
                      },
                      "required": ["above", "amount", "flat_fee", "tier", "unit_price", "units", "up_to"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "total": {
                    "description": "The price of the quantity, rounded once. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  }
                },
                "required": ["tier", "tiers", "total"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tiered pricing calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90969ea1a5d9cc9701f1048d41db4ebaccb917850dd01e6d5b078f1e8ed584b0"
        },
        {
