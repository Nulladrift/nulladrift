                "type": "object"
              },
              "risk_free_rate_percent": {
                "description": "Risk-free interest rate per year in percent, continuously compounded. Allowed: >= -50 and <= 100. Unit: percent.",
                "examples": ["10"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
