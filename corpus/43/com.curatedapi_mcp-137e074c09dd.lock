        {
          "name": "calc_accounting_depreciation_macrs",
          "title": "MACRS depreciation calculator (IRS tables, GDS)",
          "description": "US tax depreciation under MACRS (GDS) with the IRS percentage tables, Section 179 and bonus depreciation.\n\nApplies the Publication 946 Appendix A tables: half-year or mid-quarter for personal property (Tables A-1 to A-5), mid-month for residential rental (A-6, 27.5 years) and nonresidential real property (A-7a, 39 years). Section 179 comes off first, then bonus depreciation on what is left, then MACRS on the rest. Each year is basis × the table percentage, rounded; the last year takes whatever rounding left over, so the years add up exactly to the basis.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "basis": {
                "description": "Depreciable basis: the cost, plus costs to get the property ready, less any business-use reduction. Allowed: > 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["10000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "bonus_percent": {
                "default": "0",
                "description": "Special (bonus) depreciation percentage, e.g. 100 or 40, or 0 if you elect out. Allowed: >= 0 and <= 100. Unit: percent.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "convention": {
                "default": "half_year",
                "description": "Convention for personal property. 27.5- and 39-year property always use mid-month, whatever is passed. Options: half_year: half a year of depreciation in the first year (the usual case); mid_quarter: when more than 40% of the year's basis was placed in service in the last quarter",
                "enum": ["half_year", "mid_quarter"],
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "placed_in_service": {
                "description": "The day the property was placed in service.",
                "examples": ["2026-03-15"],
                "format": "date",
                "type": "string"
              },
              "property_class": {
                "description": "Recovery period (property class). Options: 3: 3-year property (200% declining balance); 5: 5-year property such as cars, computers and office machinery (200% DB); 7: 7-year property such as office furniture and fixtures (200% DB); 10: 10-year property (200% DB); 15: 15-year property such as land improvements (150% DB); 20: 20-year property such as farm buildings (150% DB); 27.5: 27.5-year residential rental property (straight line, mid-month); 39: 39-year nonresidential real property (straight line, mid-month)",
                "enum": ["3", "5", "7", "10", "15", "20", "27.5", "39"],
                "examples": ["5"],
                "type": "string"
              },
              "section_179": {
                "default": "0",
                "description": "Section 179 deduction taken for the property. The dollar limit and business-income limit are not checked. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "tax_year_start_month": {
                "default": 1,
                "description": "Month your tax year starts (1 = calendar year). Short tax years are not supported. Allowed: >= 1 and <= 12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["basis", "placed_in_service", "property_class"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["accounting/depreciation/macrs@1"],
                "type": "string"
              },
