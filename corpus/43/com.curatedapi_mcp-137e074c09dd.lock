          "title": "Excel NOMINAL function: nominal annual rate",
          "description": "The nominal annual rate from an effective rate, as Excel's NOMINAL.\n\nNOMINAL(effect_rate, npery) = npery·((1 + effect_rate)^(1/npery) − 1).",
          "inputSchema": {
