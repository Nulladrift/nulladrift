        {
          "name": "calc_excel_yield",
          "title": "Excel YIELD function: bond yield from price",
          "description": "The yield of a bond paying periodic coupons, from its price, as Excel's YIELD, proven correct to the last digit.\n\nYIELD(settlement, maturity, rate, pr, redemption, frequency, [basis]): the yield at which PRICE gives pr. With one coupon or less left it is Microsoft's closed form; otherwise the root of the PRICE equation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "basis": {
                "default": 0,
                "description": "Day count basis: 0 US (NASD) 30/360; 1 Actual/actual; 2 Actual/360; 3 Actual/365; 4 European 30/360. Allowed: >= 0 and <= 4.",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "frequency": {
                "description": "Coupons per year: 1, 2 or 4. Allowed: >= 1 and <= 4.",
                "examples": [2],
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "maturity": {
                "description": "Maturity date.",
                "examples": ["2017-11-15"],
                "format": "date",
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, significant_digits=15).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
