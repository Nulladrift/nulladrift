                "maxItems": 1000,
                "minItems": 0,
                "type": "array"
              },
              "hours": {
                "default": 0,
                "description": "Hours of elapsed time to add (date-times). Allowed: >= 0 and <= 100000000.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "minutes": {
                "default": 0,
                "description": "Minutes of elapsed time to add (date-times). Allowed: >= 0 and <= 100000000.",
                "maximum": 100000000,
                "minimum": 0,
