          "description": "How much to save each month (or week, or year) to reach a goal, or how long it takes with a given contribution.\n\nSolves the future-value-of-annuity equation either for the regular contribution or for the number of contributions. Interest compounds once per contribution period. The final balance is recomputed exactly with the rounded contribution, so you can see whether it lands on, above or below the goal.",
