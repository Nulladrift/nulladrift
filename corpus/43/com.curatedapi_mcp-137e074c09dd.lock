                "description": "Amount paid per 100 of face value if the bond is called. Allowed: > 0 and <= 1000000.",
                "examples": ["102"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
