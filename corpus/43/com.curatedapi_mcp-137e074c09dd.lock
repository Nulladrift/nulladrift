          "description": "The interest paid in one period of a loan, the same as Excel's IPMT.\n\nIPMT(rate, per, nper, pv, [fv], [type]): the interest in payment number per: the rate times the balance after the previous payment. With type 1 the first payment has no interest, as in Excel.",
