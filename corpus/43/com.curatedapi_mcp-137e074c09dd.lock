        {
          "name": "calc_finance_compound_interest",
          "title": "Compound interest calculator",
          "description": "Future value of a lump sum with annual, monthly, daily or continuous compounding, plus the effective annual rate (APY).\n\nGrows a single deposit at a nominal annual rate compounded m times a year: A = P(1 + r/m)^(m·t), or A = P·e^(r·t) for continuous compounding. Whole numbers of periods are computed exactly; anything else is computed with certified high-precision arithmetic and rounded correctly.",
