          "description": "The fraction of a year between two dates under Excel's five day-count bases, including Excel's own actual/actual rule.\n\nYEARFRAC(start_date, end_date, [basis]). Basis 1 follows Excel exactly: within a year it divides by 365 or 366 (366 when the span includes 29 February); over longer spans it divides by the average length of the calendar years touched. Basis 0 treats the last day of February as the 30th. The order of the dates does not matter.",
