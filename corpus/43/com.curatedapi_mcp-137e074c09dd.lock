                    "description": "How many days had some working time in the span.",
                    "type": "integer"
                  },
                  "deadline": {
                    "description": "The moment the working hours are used up, in the office's time zone.",
                    "type": "string"
                  },
                  "deadline_utc": {
                    "description": "The same moment in UTC.",
                    "type": "string"
                  },
                  "tz_database": {
                    "description": "The time zone data used.",
                    "type": "string"
                  },
                  "weekday": {
                    "description": "The deadline's day of the week.",
                    "type": "string"
                  },
                  "working_hours": {
                    "description": "Working time from start to end, in hours; negative when end is before start. Unit: hours.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "working_minutes": {
                    "description": "The same in minutes. Unit: minutes.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  }
                },
                "required": ["tz_database"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
