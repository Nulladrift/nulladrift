                          "type": "integer"
                        },
                        "years_from_start": {
                          "description": "Time from the drawdown in years, exact (e.g. 1/12 + 3/365 shows as a fraction).",
                          "type": "string"
                        }
                      },
                      "required": ["amount", "payment", "years_from_start"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "total_amount_payable": {
                    "description": "Upfront charges plus all payments. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "total_cost_of_credit": {
