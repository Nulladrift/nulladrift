          "description": "Final price after several percentage and fixed-amount discounts, applied in order like Stripe's stacked coupons, with an optional cap.\n\nApplies a list of discounts to a price, one after another. A percentage discount takes that percentage of the price left after the earlier discounts, so order matters: 20% then 5 off is not the same as 5 off then 20%. This is how Stripe applies several coupons to a subscription. With additive stacking, every percentage is taken from the original price instead, so 20% and 10% make 30% off. Each discount is rounded to the cent when it is applied, the price never goes below 0, and max_total_discount caps the combined discount.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "discounts": {
                "description": "The discounts in the order they apply: a percentage such as \"20%\" or an amount off such as \"5\" (in the subtotal's currency). 1 to 20 items.",
                "examples": [
                  ["20%", "5"]
                ],
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "max_total_discount": {
                "description": "Optional cap on the combined discount, like Stripe's \"percent off up to maximum\" coupon. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_up, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_up.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "stacking": {
                "default": "sequential",
                "description": "How percentage discounts combine. Options: sequential: each discount applies to the price left after the earlier ones (Stripe's stacked coupons); additive: each percentage is taken from the original subtotal",
                "enum": ["sequential", "additive"],
                "type": "string"
              },
              "subtotal": {
                "description": "The price before discounts. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["100"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              }
            },
            "required": ["discounts", "subtotal"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["billing/discounts@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "steps": {
                    "description": "Each discount in order.",
                    "items": {
                      "properties": {
                        "amount_off": {
                          "description": "What this discount took off. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        },
                        "discount": {
                          "description": "The discount as given: a percentage or an amount.",
                          "type": "string"
                        },
                        "price_after": {
                          "description": "The price after this discount. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        },
                        "step": {
                          "description": "Order in which the discount was applied, starting at 1.",
                          "type": "integer"
                        }
                      },
                      "required": ["amount_off", "discount", "price_after", "step"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "total": {
                    "description": "The price after all discounts (never below 0). Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "total_discount": {
                    "description": "subtotal − total. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  }
                },
                "required": ["steps", "total", "total_discount"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stacked discount calculator"
          },
          "behavior": {
