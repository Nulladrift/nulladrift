          "description": "The public holidays of a country or region in a year, worked out from the rules in its law, with the official source.\n\nLists the public holidays of a year for the United States (federal), the United Kingdom (England and Wales, Scotland, Northern Ireland), Germany (nationwide and each of the 16 states), France, the Netherlands, Ireland, Belgium, Austria and Italy. Dates come from the rules themselves: fixed dates, weekday rules such as the last Monday in May, and days counted from Easter. UK substitute days and the day US federal offices close when a holiday falls at a weekend are included. Countries that set some holidays year by year, by decree or by the moon, are not covered, because those dates cannot be worked out ahead.",
