        {
          "name": "calc_finance_irr",
          "title": "Internal rate of return (IRR) calculator",
          "description": "Internal rate of return of periodic cash flows, with every IRR reported when there is more than one.\n\nFinds the discount rate at which the net present value of the cash flows is zero. Unlike spreadsheet IRR(), no starting guess is needed: all IRRs between −100% and the mathematical bound are searched, each one is pinned down with exact arithmetic, and the result is correctly rounded. When the cash flows change sign more than once there can be several IRRs; all are returned and a warning explains.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cash_flows": {
                "description": "Cash flows in time order, one per period. Money paid out is negative, money received is positive. 2 to 600 items. Each item: >= -1000000000000000 and <= 1000000000000000.",
                "examples": [
                  ["-10000", "3000", "4200", "6800"]
                ],
                "items": {
                  "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                  "type": "string"
                },
                "maxItems": 600,
                "minItems": 2,
                "type": "array"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=4).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  },
                  "significant_digits": {
                    "description": "Round results to this many significant digits.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "periods_per_year": {
                "description": "Set to 12 for monthly flows, 4 for quarterly, ... to also get the effective annual IRR. Allowed: >= 1 and <= 365.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cash_flows"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["finance/irr@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "all_irr_percent": {
                    "description": "Every IRR found, lowest first, in percent.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "annual_effective_irr_percent": {
                    "description": "(1 + IRR)^periods_per_year − 1, in percent. Unit: percent.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "irr_is_unique": {
                    "description": "True when there is exactly one IRR.",
                    "type": "boolean"
                  },
                  "irr_percent": {
                    "description": "IRR per period, in percent. Unit: percent.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "sign_changes": {
                    "description": "How many times the cash flows change sign.",
                    "type": "integer"
                  }
                },
                "required": ["all_irr_percent", "irr_is_unique", "irr_percent", "sign_changes"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
