        {
          "name": "calc_health_bmi",
          "title": "BMI calculator",
          "description": "Body mass index for adults from weight and height in metric or imperial units, with the WHO/CDC weight category and the healthy weight range for that height.\n\nComputes BMI = weight (kg) ÷ height (m)² from exact unit definitions, so imperial inputs need no 703 approximation. The category is decided on the exact BMI, so a BMI of 24.96 is 'Healthy weight' even though it displays as 25.0; the response warns when rounding crosses a band boundary like that.",
          "inputSchema": {
