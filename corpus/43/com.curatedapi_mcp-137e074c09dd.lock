        {
          "name": "calc_tax_vat",
          "title": "VAT and GST calculator",
          "description": "VAT or GST on one amount or a whole invoice, added or taken out of tax-inclusive prices, with the per-rate rounding EN 16931 e-invoices require.\n\nWorks out net, tax and gross for one amount or for every line of an invoice. Give amounts without tax to add it, or set amounts_include_tax to take the tax out of prices that already include it. Lines can have different rates. By default the tax is worked out once for each rate on the sum of that rate's lines and rounded to the cent, which is how the European e-invoice standard EN 16931 (and so XRechnung, Peppol and Factur-X) defines the VAT breakdown. The other choice rounds the tax on each line and adds those up, as a till receipt does; the two can differ by a few cents on a long invoice. The rate can be given, or looked up as a country's standard rate, in which case the answer names the official page it came from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amounts": {
                "description": "The amount of each line: one item for a single price. Without tax, or with tax when amounts_include_tax is true. Negative amounts are credits. 1 to 1000 items. Each item: >= -1000000000000000 and <= 1000000000000000. Unit: currency.",
                "examples": [
                  ["4000", "900", "2000"]
                ],
                "items": {
                  "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                  "type": "string"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              },
              "amounts_include_tax": {
                "default": false,
                "description": "true when the amounts already include the tax, to take it out.",
                "type": "boolean"
              },
              "country": {
                "description": "Use this country's standard rate for every line (see tax/vat-rates for the table). Reduced rates depend on what is sold, so give those as rate_percent. Options: AT: Austria: VAT 20%; BE: Belgium: VAT 21%; BG: Bulgaria: VAT 20%; CY: Cyprus: VAT 19%; CZ: Czechia: VAT 21%; DE: Germany: VAT 19%; DK: Denmark: VAT 25%; EE: Estonia: VAT 24%; EL: Greece: VAT 24%; ES: Spain: VAT 21%; FI: Finland: VAT 25.5%; FR: France: VAT 20%; HR: Croatia: VAT 25%; HU: Hungary: VAT 27%; IE: Ireland: VAT 23%; IT: Italy: VAT 22%; LT: Lithuania: VAT 21%; LU: Luxembourg: VAT 17%; LV: Latvia: VAT 21%; MT: Malta: VAT 18%; NL: Netherlands: VAT 21%; PL: Poland: VAT 23%; PT: Portugal: VAT 23%; RO: Romania: VAT 21%; SE: Sweden: VAT 25%; SI: Slovenia: VAT 22%; SK: Slovakia: VAT 23%; GB: United Kingdom: VAT 20%; CH: Switzerland: VAT (MWST) 8.1%; NO: Norway: VAT (MVA) 25%; AU: Australia: GST 10%; NZ: New Zealand: GST 15%; SG: Singapore: GST 9%; IN: India: GST 18%; CA: Canada (GST only): GST 5%; CA-NB: Canada: New Brunswick: HST 15%; CA-NL: Canada: Newfoundland and Labrador: HST 15%; CA-NS: Canada: Nova Scotia: HST 14%; CA-ON: Canada: Ontario: HST 13%; CA-PE: Canada: Prince Edward Island: HST 15%; GR: the same as EL; UK: the same as GB",
                "enum": ["AT", "BE", "BG", "CY", "CZ", "DE", "DK", "EE", "EL", "ES", "FI", "FR", "HR", "HU", "IE", "IT", "LT", "LU", "LV", "MT", "NL", "PL", "PT", "RO", "SE", "SI", "SK", "GB", "CH", "NO", "AU", "NZ", "SG", "IN", "CA", "CA-NB", "CA-NL", "CA-NS", "CA-ON", "CA-PE", "GR", "UK"],
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_up, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_up.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "rate_percent": {
                "description": "One tax rate for every line, in percent (20 for 20%). Allowed: >= 0 and <= 100. Unit: %.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "rates_percent": {
                "description": "The tax rate of each line in percent, one per amount and in the same order. Up to 1000 items. Each item: >= 0 and <= 100. Unit: %.",
                "examples": [
                  ["25", "25", "0"]
                ],
                "items": {
                  "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                  "type": "string"
                },
                "maxItems": 1000,
                "minItems": 0,
                "type": "array"
              },
              "rounding": {
                "default": "per_rate",
                "description": "Where the tax is rounded. Options: per_rate: once for each rate, on the sum of that rate's lines (EN 16931, the usual rule for invoices); per_line: on each line, then added up (till receipts, and invoices that print tax per line)",
                "enum": ["per_rate", "per_line"],
                "type": "string"
              }
            },
            "required": ["amounts"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["tax/vat@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "breakdown": {
                    "description": "One row per tax rate, highest rate first.",
                    "items": {
                      "properties": {
                        "gross": {
                          "description": "Amount with tax: net + tax. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        },
                        "net": {
                          "description": "Amount without tax. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        },
                        "rate_percent": {
                          "description": "The tax rate, as given. Unit: %.",
                          "type": "string"
                        },
                        "tax": {
                          "description": "The tax. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        }
                      },
                      "required": ["gross", "net", "rate_percent", "tax"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "gross_total": {
                    "description": "Total with tax: net_total + tax_total. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "lines": {
                    "description": "One row per line, when rounding is per_line.",
                    "items": {
                      "properties": {
                        "gross": {
                          "description": "Amount with tax: net + tax. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        },
                        "line": {
                          "description": "Line number, starting at 1.",
                          "type": "integer"
                        },
                        "net": {
                          "description": "Amount without tax. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        },
                        "rate_percent": {
                          "description": "The tax rate, as given. Unit: %.",
                          "type": "string"
                        },
                        "tax": {
                          "description": "The tax. Unit: currency.",
                          "pattern": "^-?\\d+(\\.\\d+)?$",
                          "type": "string"
                        }
                      },
                      "required": ["gross", "line", "net", "rate_percent", "tax"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "net_total": {
                    "description": "Total without tax. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "rate_checked_on": {
                    "description": "The day the rate was last compared with that source.",
                    "format": "date",
                    "type": "string"
                  },
                  "rate_source": {
                    "description": "Where the rate comes from, when country was given.",
                    "type": "string"
                  },
                  "rate_source_url": {
                    "description": "The source's address.",
                    "type": "string"
                  },
                  "tax_total": {
                    "description": "Total tax: the sum of the tax of each rate. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  }
                },
                "required": ["breakdown", "gross_total", "net_total", "tax_total"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "VAT and GST calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
