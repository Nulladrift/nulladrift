          "title": "Bond duration and convexity calculator",
          "description": "The price of a coupon bond at a yield, with its Macaulay and modified duration, convexity and DV01, for any settlement date.\n\nPrices a bond that pays periodic coupons by discounting each payment at the yield, and measures how the price reacts when the yield moves. Modified duration is the percentage fall in price for a rise of one percentage point in yield; convexity is the correction for larger moves; DV01 is the change in price, per 100 of face value, for one basis point. Between coupon dates the price is split into the clean price and accrued interest.",
