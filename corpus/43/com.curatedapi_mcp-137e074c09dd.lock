        {
          "name": "calc_payments_late_interest_eu",
          "title": "EU late payment interest calculator (Directive 2011/7)",
          "description": "Statutory interest on a late business invoice under the EU Late Payment Directive: the ECB rate plus at least 8 points, set each half-year, plus €40.\n\nSimple interest at the ECB main refinancing rate plus a margin (at least 8 percentage points). The ECB rate in force on 1 January applies to days from January to June and the rate on 1 July to days from July to December, so a long delay is split into half-years. Also returns the €40 minimum compensation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The unpaid amount (the invoice or debt). Allowed: > 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["10000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "day_count": {
                "default": "actual_365",
                "description": "How a day's share of the year is counted. Options: actual_365: each day is 1/365 of a year, leap years included (the usual practice); actual_actual: each day is 1/365 of a year, or 1/366 in a leap year; actual_360: each day is 1/360 of a year",
                "enum": ["actual_365", "actual_actual", "actual_360"],
                "type": "string"
              },
              "due_date": {
                "description": "The last day the payment was due (interest starts the day after).",
                "examples": ["2026-03-31"],
                "format": "date",
                "type": "string"
              },
              "margin_percent": {
                "default": "8",
                "description": "Points added to the ECB rate: 8 in the directive; some countries add more (Germany 9). Allowed: >= 8 and <= 50. Unit: percent.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "payment_date": {
                "description": "The day the payment was or will be made (counted as a day of interest).",
                "examples": ["2026-06-29"],
                "format": "date",
                "type": "string"
              },
              "reference_rate_percent": {
                "description": "Use this ECB rate (in percent) for every day instead of the published one, for example for a date not yet covered. Allowed: >= -5 and <= 100. Unit: percent.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              }
            },
            "required": ["amount", "due_date", "payment_date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
