        {
          "name": "calc_math_expression",
          "title": "Expression calculator",
          "description": "Evaluate an arithmetic expression exactly, with functions like sqrt, ln, sin and factorial.\n\nEvaluates expressions such as (1/3 + 1/6) * 2^10 or sqrt(2) * sin(45) with no floating-point error: rational arithmetic is exact, and irrational results (roots, logarithms, trig) are computed with certified interval arithmetic and rounded correctly. The interpretation output shows how the expression was read, with every implied parenthesis written out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "angle_unit": {
                "default": "radians",
                "description": "Unit for trig function inputs and inverse-trig outputs. Options: radians: radians; degrees: degrees",
                "enum": ["radians", "degrees"],
                "type": "string"
              },
              "expression": {
                "description": "The expression. Operators: + - * / ^ (or **) and ! (factorial); constants pi and e; functions: abs, acos, asin, atan, cbrt, ceil, cos, cosh, exp, factorial, floor, ln, log, log10, log2, max, min, mod, root, sin, sinh, sqrt, tan, tanh. At most 1000 characters.",
                "examples": ["(1/3 + 1/6) * 2^10"],
                "maxLength": 1000,
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, significant_digits=20).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  },
                  "significant_digits": {
                    "description": "Round results to this many significant digits.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["expression"],
            "type": "object"
          },
          "outputSchema": {
