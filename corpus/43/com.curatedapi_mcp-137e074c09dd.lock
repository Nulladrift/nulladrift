                  "rounded": {
                    "description": "The amount in the currency's minor unit, with every decimal shown (10.50, 1050 for JPY, 1.235 for KWD).",
                    "type": "string"
                  }
                },
                "required": ["currency_name", "decimals", "difference", "minor_units", "rounded"],
