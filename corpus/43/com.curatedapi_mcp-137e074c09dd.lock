        {
          "name": "calc_date_working_days",
          "title": "Working days calculator with public holidays",
          "description": "Working days between two dates, or the date a number of working days away, leaving out weekends and a country's public holidays.\n\nCounts the working days between two dates, or finds the date that lies a number of working days after (or before) a start date. Weekends and the public holidays of the chosen country or region are left out, and you can add your own closing days. The answer lists the holidays it skipped, so the count can be checked by hand.",
          "inputSchema": {
            "additionalProperties": false,
