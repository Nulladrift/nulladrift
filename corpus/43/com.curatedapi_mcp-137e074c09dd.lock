        {
          "name": "calc_finance_refinance_break_even",
          "title": "Refinance break-even calculator",
          "description": "How many months of lower payments it takes to earn back the closing costs of a refinance, and the difference in total cost over the life of the loans.\n\nCompares keeping a loan with replacing it. It works out the payment on what is left of the current loan and on the new loan, the monthly saving, and the break-even point: the first month by which the savings add up to the closing costs. It also totals every remaining payment on each side, because a lower payment over a longer term can still cost more in the end.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "closing_costs": {
                "default": "0",
                "description": "Fees and costs of the refinance. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["5000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "current_balance": {
                "description": "What is still owed. Allowed: > 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["250000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "current_rate_percent": {
                "description": "The current loan's annual rate. Allowed: >= 0 and <= 100. Unit: percent.",
                "examples": ["7"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "finance_closing_costs": {
                "default": false,
                "description": "true when the costs are added to the new loan instead of paid in cash.",
                "type": "boolean"
              },
              "new_rate_percent": {
                "description": "The new loan's annual rate. Allowed: >= 0 and <= 100. Unit: percent.",
                "examples": ["6"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "new_term_months": {
                "description": "The new loan's term in months. Allowed: >= 1 and <= 600.",
                "examples": [300],
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "remaining_months": {
                "description": "Months left on the current loan. Allowed: >= 1 and <= 600.",
                "examples": [300],
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["current_balance", "current_rate_percent", "new_rate_percent", "new_term_months", "remaining_months"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["finance/refinance-break-even@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "break_even_months": {
                    "description": "The first month by which the monthly savings cover the closing costs. Absent when the new payment is not lower.",
                    "type": "integer"
                  },
                  "current_interest_remaining": {
                    "description": "Interest still to pay on the current loan. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "current_payment": {
                    "description": "Monthly payment on the current loan. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "current_total_remaining": {
                    "description": "Every remaining payment on the current loan, added up. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "lifetime_saving": {
                    "description": "current_total_remaining − new_total_cost; negative when the refinance costs more overall. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "monthly_saving": {
                    "description": "current_payment − new_payment. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "new_interest": {
                    "description": "Interest on the new loan. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "new_payment": {
                    "description": "Monthly payment on the new loan. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "new_total_cost": {
                    "description": "Every payment on the new loan, plus the closing costs when paid in cash. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  }
                },
                "required": ["current_interest_remaining", "current_payment", "current_total_remaining", "lifetime_saving", "monthly_saving", "new_interest", "new_payment", "new_total_cost"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Refinance break-even calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:225e5ac298e086d9f943c7b0e6e67268943367c490eb766e4ad6fabb3ae32a3f"
        },
        {
          "name": "calc_finance_rent_vs_buy",
          "title": "Rent or buy calculator",
          "description": "The net cost of renting against buying a home over a number of years, from assumptions you set, with the first year in which buying comes out ahead.\n\nAdds up what each choice costs over the years you plan to stay. Buying costs the down payment, the buying costs, the mortgage payments and the yearly costs of owning, less what is left after selling the home and repaying the loan. Renting costs the rent, less what the down payment and buying costs would have earned if invested instead. Every growth rate is an input, because the answer depends on them and nobody knows them in advance; change them to see how sure the result is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_ownership_cost_percent": {
                "description": "Property tax, insurance and upkeep per year, as a percentage of the home's value. Allowed: >= 0 and <= 100. Unit: percent.",
                "examples": ["2"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "annual_rate_percent": {
                "description": "The mortgage's annual rate. Allowed: >= 0 and <= 100. Unit: percent.",
                "examples": ["6.5"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "buying_costs_percent": {
                "description": "Costs of buying, as a percentage of the price. Allowed: >= 0 and <= 100. Unit: percent.",
                "examples": ["3"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "down_payment": {
                "description": "Cash paid towards the price. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["80000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "home_appreciation_percent": {
                "description": "How much the home's value changes each year; negative for a fall. Allowed: >= -50 and <= 100. Unit: percent.",
                "examples": ["3"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "home_price": {
                "description": "The price of the home. Allowed: > 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["400000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "investment_return_percent": {
                "description": "The yearly return the down payment and buying costs would earn if invested instead. Allowed: >= 0 and <= 100. Unit: percent.",
                "examples": ["5"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "monthly_rent": {
                "description": "Rent per month in the first year. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["2000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "rent_increase_percent": {
                "description": "How much the rent rises each year. Allowed: >= 0 and <= 100. Unit: percent.",
                "examples": ["3"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "selling_costs_percent": {
                "description": "Costs of selling, as a percentage of the sale price. Allowed: >= 0 and <= 100. Unit: percent.",
                "examples": ["6"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
