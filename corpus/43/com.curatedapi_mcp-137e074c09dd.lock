        {
          "name": "calc_date_add",
          "title": "Add or subtract time from a date",
          "description": "Add or subtract years, months, weeks, days, business days or hours to a date or date-time, with month-end and daylight-saving rules spelled out.\n\nCalendar amounts (years, months, weeks, days) move the date on the calendar, keeping the clock time; hours, minutes and seconds are then added as elapsed time. So adding 1 day across a daylight saving change keeps 09:00 at 09:00, while adding 24 hours may not. Month additions that land on a day that does not exist use the month's last day, and the response says so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_days": {
                "description": "Business days to add (alone, with a plain date). Allowed: >= 0 and <= 25000.",
                "maximum": 25000,
                "minimum": 0,
                "type": "integer"
              },
              "days": {
                "default": 0,
                "description": "Days to add. Allowed: >= 0 and <= 4000000.",
                "maximum": 4000000,
                "minimum": 0,
                "type": "integer"
              },
              "holidays": {
                "description": "Dates that are not business days. Up to 1000 items.",
