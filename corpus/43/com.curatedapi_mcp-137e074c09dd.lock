        {
          "name": "calc_payments_late_interest_us_prompt_payment",
          "title": "Prompt Payment Act interest calculator",
          "description": "The interest penalty a US federal agency owes on a late invoice under the Prompt Payment Act: the Treasury rate, compounded every 30 days on a 360-day year.\n\nUses the Prompt Payment rate in effect on the day after the due date for the whole delay. Unpaid interest is added to the principal at the end of each 30-day period, the leftover days earn simple interest on a 360-day year, and interest stops after one year. This is the Treasury formula P(1 + r/12)ⁿ(1 + r·d/360) − P.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The unpaid amount (the invoice or debt). Allowed: > 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["10000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "due_date": {
                "description": "The last day the payment was due (interest starts the day after).",
                "examples": ["2026-03-31"],
                "format": "date",
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
