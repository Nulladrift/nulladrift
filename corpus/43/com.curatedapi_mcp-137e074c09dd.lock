              },
              "day_count": {
                "default": "30/360",
                "description": "How days are counted for accrued interest. Options: 30/360: US (NASD) 30/360; actual/actual: actual days over the actual length of the coupon period; actual/360: actual days over a 360-day year; actual/365: actual days over a 365-day year; 30e/360: European 30/360",
                "enum": ["30/360", "actual/actual", "actual/360", "actual/365", "30e/360"],
