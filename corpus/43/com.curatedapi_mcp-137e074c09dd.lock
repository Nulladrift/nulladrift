        {
          "name": "calc_finance_simple_interest",
          "title": "Simple interest calculator",
          "description": "Simple interest for a number of years or between two dates, with standard day-count conventions (Actual/365, Actual/360, Actual/Actual, 30/360, 30E/360).\n\nInterest that is not compounded: I = P × r × t. Give the time either as a number of years or as a start and end date. With dates, the year fraction t follows a day-count convention from the ISDA 2006 Definitions; the exact fraction used is returned so you can check it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_rate_percent": {
                "description": "Annual interest rate in percent. Allowed: >= 0 and <= 1000. Unit: percent.",
                "examples": ["5"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "day_count": {
                "default": "actual/365",
                "description": "Day-count convention used with dates. Options: actual/365: Actual/365 Fixed: actual days ÷ 365.; actual/360: Actual/360: actual days ÷ 360.; actual/actual: Actual/Actual (ISDA): days in each calendar year ÷ that year's length (365 or 366), summed.; 30/360: 30/360 Bond Basis: months of 30 days, years of 360; D1=31→30, and D2=31→30 when D1 is 30 or 31.; 30e/360: 30E/360 Eurobond Basis: months of 30 days, years of 360; any 31st becomes the 30th.",
                "enum": ["actual/365", "actual/360", "actual/actual", "30/360", "30e/360"],
                "type": "string"
              },
              "end_date": {
                "description": "Day the interest period ends (YYYY-MM-DD); interest accrues up to but not including this day.",
                "examples": ["2026-07-15"],
                "format": "date",
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=2).",
                "properties": {
