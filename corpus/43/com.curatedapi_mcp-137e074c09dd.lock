        {
          "name": "calc_money_allocate",
          "title": "Money splitter",
          "description": "Split an amount by ratios or into equal parts so the shares are whole cents and add up exactly to the amount.\n\nSplits an amount of money between several parts, by ratios (70/30, 1:2:3, percentages) or into equal parts, so that every share is a whole number of the currency's minor unit and the shares add up to the amount exactly: no cent is lost or invented. Rounding each share on its own does not work: 10.00 split three ways rounds to 3.33 three times, which is 9.99. Here each part first gets its exact share rounded down, and the few cents left over are handed out one at a time. Use it for splitting bills, revenue shares, commission, refunds across order lines, or a discount across invoice lines. The currency sets the minor unit: cents for USD and EUR, whole yen for JPY, fils (0.001) for KWD.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The amount to split. A negative amount (a refund) is split the same way and every share is negative. Allowed: >= -1000000000000000 and <= 1000000000000000. Unit: currency.",
                "examples": ["100"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "currency": {
                "description": "ISO 4217 code of the currency, such as USD, EUR, JPY or KWD. It sets the number of decimals (the minor unit): 2 for most currencies, 0 for JPY, 3 for KWD. At most 3 characters.",
                "examples": ["USD"],
                "maxLength": 3,
                "type": "string"
              },
              "method": {
                "default": "largest_remainder",
                "description": "Who gets the minor units left over after every share is rounded down. Options: largest_remainder: the leftover minor units go to the parts whose exact shares were cut the most, earlier parts first on a tie (Hamilton's method); in_order: the leftover minor units go to the first parts, one each, skipping parts with a ratio of 0 (the rule of Dinero.js and Martin Fowler's Money pattern)",
                "enum": ["largest_remainder", "in_order"],
                "type": "string"
              },
              "parts": {
                "description": "Number of equal parts (instead of ratios). Allowed: >= 1 and <= 1000.",
                "examples": [3],
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "ratios": {
                "description": "The parts' ratios, in order. Only their proportions matter: [70, 30], [7, 3] and [0.7, 0.3] split the same way. A ratio of 0 gets nothing. Give ratios or parts. 1 to 1000 items. Each item: >= 0 and <= 1000000000000000.",
                "examples": [
                  ["70", "20", "10"]
                ],
                "items": {
                  "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                  "type": "string"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              },
              "rounding": {
                "default": "half_up",
                "description": "How to round the amount to the currency's minor unit first, if it has more decimals (a warning says so). Options: half_up: to nearest, ties away from zero (2.5 → 3, -2.5 → -3); half_even: to nearest, ties to even (2.5 → 2, 3.5 → 4): banker's rounding; half_down: to nearest, ties towards zero (2.5 → 2); up: away from zero (2.1 → 3, -2.1 → -3); down: towards zero, i.e. truncate (2.9 → 2); ceiling: towards +∞ (2.1 → 3, -2.1 → -2); floor: towards −∞ (2.9 → 2, -2.1 → -3)",
                "enum": ["half_up", "half_even", "half_down", "up", "down", "ceiling", "floor"],
                "type": "string"
              }
            },
            "required": ["amount", "currency"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["money/allocate@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "allocation": {
                    "description": "Each part: ratio, exact share and share.",
                    "items": {
                      "properties": {
                        "exact_share": {
                          "description": "total × ratio ÷ sum of ratios, exactly (a fraction p/q when it does not end), where total is the amount in whole minor units.",
                          "type": "string"
                        },
                        "extra_unit": {
                          "description": "True when this part got one of the leftover minor units.",
                          "type": "boolean"
                        },
                        "part": {
                          "description": "Part number, starting at 1, in the order given.",
                          "type": "integer"
                        },
                        "ratio": {
                          "description": "This part's ratio, as given (1 for equal parts).",
                          "type": "string"
                        },
                        "share": {
                          "description": "This part's share in whole minor units.",
                          "type": "string"
                        }
                      },
                      "required": ["exact_share", "extra_unit", "part", "ratio", "share"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "decimals": {
                    "description": "The currency's number of decimals (ISO 4217 minor unit).",
                    "type": "integer"
                  },
                  "leftover_units": {
                    "description": "How many minor units were left after rounding every share down, and handed out one each.",
                    "type": "integer"
                  },
                  "shares": {
                    "description": "The shares, in the order of the parts.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "total": {
                    "description": "The amount that was split, in the currency's minor unit; the shares add up to exactly this.",
                    "type": "string"
                  }
                },
                "required": ["allocation", "decimals", "leftover_units", "shares", "total"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Money splitter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
