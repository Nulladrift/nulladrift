        {
          "name": "calc_money_round",
          "title": "Currency rounding calculator",
          "description": "Round an amount to its currency's minor unit (ISO 4217: 2 decimals for EUR, 0 for JPY, 3 for KWD) and to a country's cash rounding rule, such as 0.05 in Canada.\n\nRounds an amount of money the way the currency and the country require. First it rounds to the currency's minor unit from ISO 4217, the international list of currency codes: cents for USD and EUR, whole yen for JPY, three decimals for the Kuwaiti dinar. Then, if you give a country, it applies that country's rule for rounding cash totals in countries that have withdrawn their smallest coins, such as 0.05 in Canada, Australia and several euro countries, 0.10 in Israel, a whole krona in Sweden or 10 pesos in Chile. There are 23 countries, and every rule follows the country's law, central bank or government guidance, cited in the references, including the special cases: Finland and Estonia never round a total of 0.01 or 0.02 to zero, Slovakia rounds it up to 0.05, and Chile rounds 5 pesos down. You can also give your own cash step.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The amount to round. Allowed: >= -1000000000000000 and <= 1000000000000000. Unit: currency.",
                "examples": ["23.37"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "cash_country": {
                "description": "Optional ISO 3166 two-letter country code, to also round the total for a cash payment by that country's rule. The currency must be the country's. Countries: AU (AUD), BE (EUR), BS (BSD), CA (CAD), CH (CHF), CL (CLP), CZ (CZK), DK (DKK), EE (EUR), FI (EUR), HU (HUF), IE (EUR), IL (ILS), IT (EUR), JM (JMD), LT (EUR), MY (MYR), NL (EUR), NO (NOK), NZ (NZD), SE (SEK), SK (EUR), TT (TTD). At most 2 characters.",
                "examples": ["NL"],
                "maxLength": 2,
                "type": "string"
              },
              "cash_step": {
                "description": "Optional cash step of your own, such as 0.05 or 0.10, instead of cash_country. It must be a whole number of minor units. Allowed: > 0 and <= 1000000.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "cash_tie": {
                "description": "Which way a cash total exactly halfway between two steps goes. The default is the country's rule; when the rule does not say (or with cash_step), up is used and a CASH_TIE_ASSUMED warning says so. Options: up: a total exactly halfway between two steps rounds away from zero; down: a total exactly halfway between two steps rounds towards zero",
                "enum": ["up", "down"],
                "type": "string"
              },
              "currency": {
                "description": "ISO 4217 code of the currency, such as USD, EUR, JPY or KWD. It sets the number of decimals (the minor unit): 2 for most currencies, 0 for JPY, 3 for KWD. At most 3 characters.",
                "examples": ["EUR"],
                "maxLength": 3,
                "type": "string"
              },
              "rounding": {
                "default": "half_up",
                "description": "How to round to the currency's minor unit. half_up is the usual commercial rule (and the rule for euro conversions). Options: half_up: to nearest, ties away from zero (2.5 → 3, -2.5 → -3); half_even: to nearest, ties to even (2.5 → 2, 3.5 → 4): banker's rounding; half_down: to nearest, ties towards zero (2.5 → 2); up: away from zero (2.1 → 3, -2.1 → -3); down: towards zero, i.e. truncate (2.9 → 2); ceiling: towards +∞ (2.1 → 3, -2.1 → -2); floor: towards −∞ (2.9 → 2, -2.1 → -3)",
                "enum": ["half_up", "half_even", "half_down", "up", "down", "ceiling", "floor"],
                "type": "string"
              }
            },
            "required": ["amount", "currency"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["money/round@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "cash_amount": {
                    "description": "The total to pay in cash after the cash rounding rule.",
                    "type": "string"
                  },
                  "cash_difference": {
                    "description": "cash_amount − rounded, exactly.",
                    "type": "string"
                  },
                  "cash_rule": {
