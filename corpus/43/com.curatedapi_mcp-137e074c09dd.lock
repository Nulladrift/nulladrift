                    "description": "The annual percentage rate of charge, in percent, rounded half up. Unit: percent.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "number_of_payments": {
                    "description": "Number of payments.",
                    "type": "integer"
                  },
                  "schedule": {
