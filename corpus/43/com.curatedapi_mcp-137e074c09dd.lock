                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
            "type": "object"
          },
