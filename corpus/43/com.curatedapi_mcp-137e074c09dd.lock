                "enum": ["add", "subtract"],
                "type": "string"
              },
              "seconds": {
                "default": "0",
                "description": "Seconds of elapsed time to add (date-times). Allowed: >= 0 and <= 10000000000.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "start": {
