        {
          "name": "calc_date_working_hours",
          "title": "Working hours and SLA deadline calculator",
          "description": "The deadline a number of working hours after a start, or the working time between two moments, with office hours, weekends, public holidays and time zones.\n\nAnswers the two questions a service-level agreement asks. When is the deadline, if a ticket opened now must be answered within 8 working hours? And how much working time passed between the moment it opened and the moment it closed? Working time is the office hours you give, in the office's time zone, on days that are not a weekend day, a public holiday of the chosen calendar or one of your own closing days. Time outside office hours does not count: a ticket opened on Friday evening starts its clock on Monday morning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "add_hours": {
                "description": "Working hours allowed, to find the deadline. Allowed: >= 0 and <= 20000. Unit: hours.",
                "examples": ["8"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "calendar": {
                "description": "The public holidays to leave out (2020 to 2030). Omit it to count only weekends and extra_holidays. Options: US: United States (federal holidays); GB-ENG: United Kingdom: England and Wales; GB-SCT: United Kingdom: Scotland; GB-NIR: United Kingdom: Northern Ireland; DE: Germany (the nine nationwide holidays); DE-BW: Germany: Baden-Württemberg; DE-BY: Germany: Bavaria; DE-BE: Germany: Berlin; DE-BB: Germany: Brandenburg; DE-HB: Germany: Bremen; DE-HH: Germany: Hamburg; DE-HE: Germany: Hesse; DE-MV: Germany: Mecklenburg-Vorpommern; DE-NI: Germany: Lower Saxony; DE-NW: Germany: North Rhine-Westphalia; DE-RP: Germany: Rhineland-Palatinate; DE-SL: Germany: Saarland; DE-SN: Germany: Saxony; DE-ST: Germany: Saxony-Anhalt; DE-SH: Germany: Schleswig-Holstein; DE-TH: Germany: Thuringia; FR: France (mainland); NL: Netherlands; IE: Ireland; BE: Belgium; AT: Austria; IT: Italy",
                "enum": ["US", "GB-ENG", "GB-SCT", "GB-NIR", "DE", "DE-BW", "DE-BY", "DE-BE", "DE-BB", "DE-HB", "DE-HH", "DE-HE", "DE-MV", "DE-NI", "DE-NW", "DE-RP", "DE-SL", "DE-SN", "DE-ST", "DE-SH", "DE-TH", "FR", "NL", "IE", "BE", "AT", "IT"],
                "type": "string"
              },
              "day_end": {
                "default": "17:00",
                "description": "When work ends each day, as HH:MM; 24:00 for midnight. At most 5 characters.",
                "maxLength": 5,
                "type": "string"
              },
              "day_start": {
                "default": "09:00",
                "description": "When work starts each day, as HH:MM. At most 5 characters.",
                "maxLength": 5,
                "type": "string"
              },
              "end": {
                "description": "When the clock stops, to measure the working time.",
                "format": "date-time",
                "type": "string"
              },
              "extra_holidays": {
                "description": "More days that are not worked, such as company closing days. Up to 1000 items.",
                "items": {
                  "format": "date",
                  "type": "string"
                },
                "maxItems": 1000,
                "minItems": 0,
                "type": "array"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=4).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  },
                  "significant_digits": {
                    "description": "Round results to this many significant digits.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "start": {
                "description": "When the clock starts: a date-time with a UTC offset, or a local time in timezone.",
                "examples": ["2026-12-24T15:30:00"],
                "format": "date-time",
                "type": "string"
              },
              "timezone": {
                "description": "The IANA time zone the office hours are in.",
                "examples": ["Europe/London"],
                "type": "string"
              },
              "weekend": {
                "default": "sat_sun",
                "description": "Days of the week that are not worked. Options: sat_sun: Saturday and Sunday; fri_sat: Friday and Saturday; sun: Sunday only; fri: Friday only; none: no weekend days",
                "enum": ["sat_sun", "fri_sat", "sun", "fri", "none"],
                "type": "string"
              }
            },
            "required": ["start", "timezone"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["date/working-hours@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
