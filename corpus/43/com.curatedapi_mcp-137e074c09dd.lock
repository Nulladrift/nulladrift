        {
          "name": "calc_math_rounding",
          "title": "Rounding calculator",
          "description": "Round a number to decimal places, significant digits or a multiple, with any of seven rounding rules.\n\nRounds exactly (no binary floating point), so 2.675 to two places with half-up gives 2.68, not the 2.67 many programs print. Choose the rule explicitly: half-up, banker's rounding (half-even), half-down, up, down (truncate), ceiling or floor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "method": {
                "default": "decimals",
                "description": "What to round to. Options: decimals: to a number of decimal places (negative rounds to tens, hundreds, ...); significant: to a number of significant digits; multiple: to the nearest multiple of a step, e.g. 0.05 for cash rounding",
                "enum": ["decimals", "significant", "multiple"],
                "type": "string"
              },
              "mode": {
                "default": "half_up",
                "description": "Rounding rule. Options: half_up: to nearest, ties away from zero (2.5 → 3, -2.5 → -3); half_even: to nearest, ties to even (2.5 → 2, 3.5 → 4): banker's rounding; half_down: to nearest, ties towards zero (2.5 → 2); up: away from zero (2.1 → 3, -2.1 → -3); down: towards zero, i.e. truncate (2.9 → 2); ceiling: towards +∞ (2.1 → 3, -2.1 → -2); floor: towards −∞ (2.9 → 2, -2.1 → -3)",
                "enum": ["half_up", "half_even", "half_down", "up", "down", "ceiling", "floor"],
                "type": "string"
              },
              "multiple": {
                "description": "Step to round to (method multiple), e.g. 0.05. Allowed: > 0.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "places": {
                "description": "Decimal places (method decimals) or significant digits (method significant). Allowed: >= -20 and <= 60.",
                "examples": [2],
                "maximum": 60,
                "minimum": -20,
                "type": "integer"
              },
              "value": {
                "description": "The number to round.",
                "examples": ["2.675"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["math/rounding@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "changed": {
                    "description": "False when the value was already exact at this precision.",
                    "type": "boolean"
                  },
                  "difference": {
                    "description": "result − value, exactly.",
                    "type": "string"
                  },
                  "result": {
                    "description": "The rounded number, with trailing zeros kept (2.10).",
                    "type": "string"
                  }
                },
                "required": ["changed", "difference", "result"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
            "type": "object"
          },
          "annotations": {
