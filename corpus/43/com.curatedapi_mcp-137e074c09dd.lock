                    "type": "string"
                  }
                },
                "type": "object"
              },
              "principal": {
                "description": "Amount the interest is charged on. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["10000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "start_date": {
                "description": "First day of the interest period (YYYY-MM-DD).",
                "examples": ["2026-01-15"],
                "format": "date",
                "type": "string"
              },
              "years": {
                "description": "Time in years (for example 0.5). Use this or the two dates. Allowed: >= 0 and <= 1000. Unit: years.",
                "examples": ["2"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              }
            },
            "required": ["annual_rate_percent", "principal"],
