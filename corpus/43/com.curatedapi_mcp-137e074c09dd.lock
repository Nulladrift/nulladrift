              "add_days": {
                "description": "Working days to move from start, to find a date; negative to go back. The start date itself is not counted. Allowed: >= -2500 and <= 2500.",
                "examples": [5],
                "maximum": 2500,
                "minimum": -2500,
                "type": "integer"
              },
              "calendar": {
                "description": "The public holidays to leave out (2020 to 2030). Omit it to count only weekends and extra_holidays. Options: US: United States (federal holidays); GB-ENG: United Kingdom: England and Wales; GB-SCT: United Kingdom: Scotland; GB-NIR: United Kingdom: Northern Ireland; DE: Germany (the nine nationwide holidays); DE-BW: Germany: Baden-Württemberg; DE-BY: Germany: Bavaria; DE-BE: Germany: Berlin; DE-BB: Germany: Brandenburg; DE-HB: Germany: Bremen; DE-HH: Germany: Hamburg; DE-HE: Germany: Hesse; DE-MV: Germany: Mecklenburg-Vorpommern; DE-NI: Germany: Lower Saxony; DE-NW: Germany: North Rhine-Westphalia; DE-RP: Germany: Rhineland-Palatinate; DE-SL: Germany: Saarland; DE-SN: Germany: Saxony; DE-ST: Germany: Saxony-Anhalt; DE-SH: Germany: Schleswig-Holstein; DE-TH: Germany: Thuringia; FR: France (mainland); NL: Netherlands; IE: Ireland; BE: Belgium; AT: Austria; IT: Italy",
                "enum": ["US", "GB-ENG", "GB-SCT", "GB-NIR", "DE", "DE-BW", "DE-BY", "DE-BE", "DE-BB", "DE-HB", "DE-HH", "DE-HE", "DE-MV", "DE-NI", "DE-NW", "DE-RP", "DE-SL", "DE-SN", "DE-ST", "DE-SH", "DE-TH", "FR", "NL", "IE", "BE", "AT", "IT"],
                "type": "string"
              },
              "end": {
                "description": "The end date, to count working days.",
                "format": "date",
                "type": "string"
              },
              "extra_holidays": {
                "description": "More days that are not worked, such as company closing days. Up to 1000 items.",
                "items": {
                  "format": "date",
                  "type": "string"
                },
                "maxItems": 1000,
                "minItems": 0,
                "type": "array"
              },
              "include_end_date": {
                "default": false,
                "description": "When counting: whether the end date counts too. Without it the count runs from start up to the day before end.",
                "type": "boolean"
              },
              "start": {
                "description": "The start date.",
                "examples": ["2026-12-21"],
                "format": "date",
                "type": "string"
              },
              "weekend": {
                "default": "sat_sun",
                "description": "Days of the week that are not worked. Options: sat_sun: Saturday and Sunday; fri_sat: Friday and Saturday; sun: Sunday only; fri: Friday only; none: no weekend days",
                "enum": ["sat_sun", "fri_sat", "sun", "fri", "none"],
                "type": "string"
              }
            },
            "required": ["start"],
