                      "type": "object"
                    },
                    "type": "array"
                  },
                  "closing_wdv": {
                    "description": "WDV carried to next year. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "depreciation": {
                    "description": "Depreciation for the year. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "full_rate_base": {
                    "description": "Part depreciated at the full rate. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "half_rate_base": {
                    "description": "Part depreciated at half the rate. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "short_term_capital_gain": {
                    "description": "Sale proceeds above the block. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "short_term_capital_loss": {
                    "description": "WDV left when the block ceases. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
