        {
          "name": "calc_finance_implied_volatility",
          "title": "Implied volatility calculator",
          "description": "The volatility at which the Black-Scholes-Merton formula gives an option's market price, pinned between proven bounds.\n\nTurns an option's price back into the volatility that explains it. The Black-Scholes price rises with volatility, so a price inside the option's possible range matches exactly one volatility. It is found here by closing in on it and then proving that the price is too low just below and too high just above, so the digits returned are correct. A price outside the possible range is refused with the reason.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dividend_yield_percent": {
                "default": "0",
                "description": "Dividend yield per year in percent, continuously compounded. Allowed: >= -50 and <= 100. Unit: percent.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "option_price": {
                "description": "The option's market price. A ratio of two decimals such as \"0.08/12\" is accepted. Allowed: > 0 and <= 1000000000000000.",
                "examples": ["4.759422"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?(/[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?)?$",
                "type": "string"
              },
              "option_type": {
                "description": "Call or put. Options: call: the right to buy; put: the right to sell",
                "enum": ["call", "put"],
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=6).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
