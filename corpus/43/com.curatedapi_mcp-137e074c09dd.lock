        {
          "name": "calc_units_data_size",
          "title": "Data size converter",
          "description": "Convert between bits, bytes and their decimal (kB, MB) and binary (KiB, MiB) multiples.\n\nConvert between bits, bytes and their decimal (kB, MB) and binary (KiB, MiB) multiples. Conversion factors are exact values from the official unit definitions, so the result is exact before the single final rounding. Leave out to_unit to get the value in every supported unit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_unit": {
                "description": "Unit of the value. Options: bit: bit; B: byte; kB: kilobyte; MB: megabyte; GB: gigabyte; TB: terabyte; PB: petabyte; EB: exabyte; ZB: zettabyte; KiB: kibibyte; MiB: mebibyte; GiB: gibibyte; TiB: tebibyte; PiB: pebibyte; EiB: exbibyte; ZiB: zebibyte; kbit: kilobit; Mbit: megabit; Gbit: gigabit; Tbit: terabit; Kibit: kibibit; Mibit: mebibit; Gibit: gibibit",
                "enum": ["bit", "B", "kB", "MB", "GB", "TB", "PB", "EB", "ZB", "KiB", "MiB", "GiB", "TiB", "PiB", "EiB", "ZiB", "kbit", "Mbit", "Gbit", "Tbit", "Kibit", "Mibit", "Gibit"],
                "examples": ["bit"],
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, significant_digits=15).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  },
                  "significant_digits": {
                    "description": "Round results to this many significant digits.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "to_unit": {
                "description": "Unit to convert to. Omit to convert to every unit. Options: bit: bit; B: byte; kB: kilobyte; MB: megabyte; GB: gigabyte; TB: terabyte; PB: petabyte; EB: exabyte; ZB: zettabyte; KiB: kibibyte; MiB: mebibyte; GiB: gibibyte; TiB: tebibyte; PiB: pebibyte; EiB: exbibyte; ZiB: zebibyte; kbit: kilobit; Mbit: megabit; Gbit: gigabit; Tbit: terabit; Kibit: kibibit; Mibit: mebibit; Gibit: gibibit",
                "enum": ["bit", "B", "kB", "MB", "GB", "TB", "PB", "EB", "ZB", "KiB", "MiB", "GiB", "TiB", "PiB", "EiB", "ZiB", "kbit", "Mbit", "Gbit", "Tbit", "Kibit", "Mibit", "Gibit"],
                "examples": ["B"],
                "type": "string"
              },
              "value": {
