        {
          "name": "calc_date_difference",
          "title": "Date difference calculator",
          "description": "Days, weeks, months, years and business days between two dates, or the exact time between two date-times across time zones and daylight saving changes.\n\nFor two dates, returns the number of days (end minus start), the breakdown into years, months and days, and the number of business days. For two date-times, returns the exact elapsed time; each date-time needs a UTC offset or a time zone, and times that are skipped or repeated by daylight saving changes are reported instead of guessed.",
          "inputSchema": {
