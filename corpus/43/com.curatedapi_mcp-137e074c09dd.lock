        {
          "name": "calc_finance_loan_emi",
          "title": "Loan EMI calculator",
          "description": "Monthly instalment (EMI), total interest and an exact amortization schedule for a fixed-rate loan.\n\nComputes the equated monthly instalment for a fixed-rate loan repaid in equal monthly payments, the total paid and the total interest. The schedule is computed the way lenders do it: each month's interest is rounded to the cent, every payment is the rounded EMI, and the final payment is adjusted so the balance ends at exactly zero. Totals are the sums of that schedule, so they always add up to the cent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_rate_percent": {
                "description": "Nominal annual interest rate in percent (7.5 means 7.5%), compounded monthly. Allowed: >= 0 and <= 100. Unit: percent.",
                "examples": ["7.5"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "include_schedule": {
                "default": false,
                "description": "Also return the month-by-month schedule.",
                "type": "boolean"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "principal": {
                "description": "Amount borrowed. Allowed: > 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["250000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "term_months": {
                "description": "Number of monthly payments. Allowed: >= 1 and <= 1200.",
                "examples": [240],
                "maximum": 1200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["annual_rate_percent", "principal", "term_months"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["finance/loan/emi@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "emi": {
                    "description": "The monthly payment, rounded to the precision. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "last_payment": {
                    "description": "The final payment, which clears the balance exactly. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "number_of_payments": {
                    "description": "Number of payments in the schedule.",
                    "type": "integer"
                  },
                  "schedule": {
