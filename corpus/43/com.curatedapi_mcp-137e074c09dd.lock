        {
          "name": "calc_excel_cumipmt",
          "title": "Excel CUMIPMT function: interest paid between two periods",
          "description": "Total interest paid on a loan from one period to another, as Excel's CUMIPMT.\n\nCUMIPMT(rate, nper, pv, start_period, end_period, type).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "end_period": {
                "description": "Last period to include. Allowed: >= 1 and <= 12000.",
                "examples": [24],
                "maximum": 12000,
                "minimum": 1,
                "type": "integer"
              },
              "nper": {
                "description": "Total number of payment periods. Allowed: >= 1 and <= 12000.",
                "examples": [360],
                "maximum": 12000,
                "minimum": 1,
                "type": "integer"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, significant_digits=15).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  },
                  "significant_digits": {
                    "description": "Round results to this many significant digits.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "pv": {
