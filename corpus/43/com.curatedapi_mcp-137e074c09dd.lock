        {
          "name": "calc_accounting_depreciation_india_income_tax",
          "title": "Indian income-tax depreciation",
          "description": "Tax depreciation on a block of assets: opening WDV plus additions less sale proceeds, with half the rate for additions used under 180 days.\n\nDepreciation is the block's rate on its written down value: the opening WDV, plus the year's additions, less the money received for assets sold. An asset acquired in the year and put to use for less than 180 days gets half the rate. If the sale proceeds exceed the block, there is no depreciation and the excess is a short-term capital gain; if every asset in the block was sold, what is left is a short-term capital loss.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "additions": {
                "description": "Cost of each asset added in the year. Up to 500 items. Each item: >= 0 and <= 1000000000000000.",
                "examples": [
                  ["200000", "100000"]
                ],
                "items": {
                  "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                  "type": "string"
                },
                "maxItems": 500,
                "minItems": 0,
                "type": "array"
              },
              "all_assets_sold": {
                "default": false,
                "description": "True when no asset is left in the block at the end of the year.",
                "type": "boolean"
              },
              "opening_wdv": {
                "default": "0",
                "description": "WDV of the block at the start of the year. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["500000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "put_to_use_dates": {
                "description": "The day each addition was put to use, in the same order. Up to 500 items.",
                "examples": [
                  ["2026-06-10", "2026-12-01"]
                ],
                "items": {
                  "format": "date",
                  "type": "string"
                },
                "maxItems": 500,
                "minItems": 0,
                "type": "array"
              },
              "rate_percent": {
                "description": "The block's rate, e.g. 15 (general plant and machinery), 40 (computers), 10 (furniture), 5 or 10 (buildings). Allowed: > 0 and <= 100. Unit: percent.",
                "examples": ["15"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "sale_proceeds": {
                "default": "0",
                "description": "Money payable for assets of the block sold, discarded or destroyed in the year (with any scrap value). Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "tax_year_start": {
                "description": "Year the tax year starts: 2026 means 1 April 2026 to 31 March 2027. Allowed: >= 1990 and <= 2200.",
                "examples": [2026],
                "maximum": 2200,
                "minimum": 1990,
                "type": "integer"
              }
            },
            "required": ["rate_percent", "tax_year_start"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["accounting/depreciation/india-income-tax@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
