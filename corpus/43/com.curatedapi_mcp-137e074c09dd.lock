        {
          "name": "calc_finance_usda_guarantee_fee",
          "title": "USDA loan guarantee fee calculator",
          "description": "The upfront guarantee fee and the annual fee on a USDA guaranteed home loan, at the rates USDA Rural Development set for fiscal year 2027.\n\nA USDA Single Family Housing Guaranteed loan has an upfront guarantee fee of 1.00% and an annual fee of 0.35%, for purchases and refinances in fiscal year 2027 (1 October 2026 to 30 September 2027). The upfront fee can be added to the loan; it is then 1% of the loan including the fee. The annual fee is paid monthly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "finance_upfront_fee": {
                "default": true,
                "description": "Whether the upfront fee is added to the loan instead of paid in cash.",
                "type": "boolean"
              },
              "loan_amount": {
