        {
          "name": "calc_finance_mortgage_affordability",
          "title": "Mortgage affordability calculator",
          "description": "The largest loan and home price an income supports, from housing and debt-to-income ratios you set (28% and 36% by default).\n\nLenders compare monthly payments with gross monthly income. This calculator takes two limits: the share of income that may go to housing costs, and the share that may go to all debt payments together. It finds the largest housing payment that meets both, takes off property tax, insurance and fees, and turns what is left into the loan that a level monthly payment repays at the given rate and term. The ratios are inputs because lenders and loan programmes use different ones.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_rate_percent": {
                "description": "The mortgage's annual interest rate. Allowed: >= 0 and <= 100. Unit: percent.",
                "examples": ["6.5"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "debt_ratio_percent": {
                "default": "36",
                "description": "The most of gross income that may go to housing costs and other debts together (the back-end or debt-to-income ratio). Allowed: > 0 and <= 100. Unit: percent.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "down_payment": {
                "default": "0",
                "description": "Cash paid towards the price. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["40000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "gross_monthly_income": {
                "description": "Income per month before tax. Allowed: > 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["6000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "housing_ratio_percent": {
                "default": "28",
                "description": "The most of gross income that may go to housing costs (the front-end ratio). Allowed: > 0 and <= 100. Unit: percent.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "monthly_debt_payments": {
                "default": "0",
                "description": "Other debt payments per month: car loans, student loans, credit card minimums. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["500"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "monthly_taxes_insurance_and_fees": {
                "default": "0",
                "description": "Property tax, home insurance, mortgage insurance and association fees per month. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["450"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_even, decimals=2).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_even.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "term_years": {
                "description": "The mortgage term in years. Allowed: >= 1 and <= 50.",
                "examples": [30],
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["annual_rate_percent", "gross_monthly_income", "term_years"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["finance/mortgage-affordability@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
              },
              "precision": {
                "description": "The precision and rounding that were applied.",
                "type": ["object", "null"]
              },
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "references": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "result": {
                "properties": {
                  "limited_by": {
                    "description": "Which ratio set the limit: housing_ratio or debt_ratio.",
                    "type": "string"
                  },
                  "max_home_price": {
                    "description": "The loan plus the down payment. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "max_loan_amount": {
                    "description": "The loan that payment repays. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "max_monthly_housing_payment": {
                    "description": "The largest monthly housing cost that meets both ratios. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  },
                  "max_principal_and_interest": {
                    "description": "What is left for the loan payment after taxes, insurance and fees. Unit: currency.",
                    "pattern": "^-?\\d+(\\.\\d+)?$",
                    "type": "string"
                  }
                },
                "required": ["limited_by", "max_home_price", "max_loan_amount", "max_monthly_housing_payment", "max_principal_and_interest"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculator", "exactness", "inputs", "result", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Mortgage affordability calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a506cfcfb3db605f75c8fad70f161dbd9480cce715ace1fe3ca8e72ee9a61538"
