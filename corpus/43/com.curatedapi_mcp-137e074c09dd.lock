          "title": "Verzugszinsen calculator (§ 288 BGB, Germany)",
          "description": "Verzugszinsen under § 288 BGB, half-year by half-year: the Basiszinssatz plus 9 points and the €40 fee between businesses, or plus 5 points with consumers.\n\nSimple interest at the Bundesbank Basiszinssatz (§ 247 BGB) plus 9 percentage points when no consumer is involved, or 5 points when the debtor is a consumer (8 points for business contracts made before 29 July 2014). The Basiszinssatz changes on 1 January and 1 July, so a long delay is split into half-years. Business debtors also owe the €40 Verzugspauschale (§ 288 (5) BGB).",
