        {
          "name": "calc_finance_apr_eu_aprc",
          "title": "EU and UK APRC calculator",
          "description": "Annual percentage rate of charge (APRC, the UK's APR) for consumer and mortgage credit, by the EU directives' equation and day count.\n\nComputes the annual percentage rate of charge defined in the EU Consumer Credit and Mortgage Credit Directives (Annex III and Annex I) and in the UK FCA rules (CONC App 1, MCOB 10A): the yearly rate X at which the payments, discounted with (1 + X) to the power of minus their time in years, equal the credit drawn down less the charges paid at the start. Times are 1/12 of a year per month and 1/52 per week; with dates, whole months (or weeks, or years) are counted back from each payment and the remaining days divided by 365 or 366, as the Mortgage Credit Directive and the European Commission's guidelines prescribe. The equation is solved with proven bounds and the APRC is rounded half up, to 1 decimal by default.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "credit_amount": {
                "description": "The credit, drawn down in full at the start. Allowed: > 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["200000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "first_payment_date": {
                "description": "Date of the first payment. Later payments fall on the same day of the month (or the same weekday) at the payment frequency.",
                "examples": ["2012-02-15"],
                "format": "date",
                "type": "string"
              },
              "include_schedule": {
                "default": false,
                "description": "Also return each payment with its time in years.",
                "type": "boolean"
              },
              "options": {
                "additionalProperties": false,
                "description": "Precision and rounding of the results (default: rounding=half_up, decimals=1).",
                "properties": {
                  "decimals": {
                    "description": "Round results to this many digits after the decimal point.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounding": {
                    "description": "Rounding mode applied once to each result. Default half_up.",
                    "enum": ["half_even", "half_up", "half_down", "up", "down", "ceiling", "floor"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "payment_amounts": {
                "description": "The payments in order. Give one amount per group of equal payments and the group sizes in payment_counts, e.g. [\"210.71\", \"220.25\"] with [24, 36]; without payment_counts each amount is one payment. 1 to 100 items. Each item: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": [
                  ["230"]
                ],
                "items": {
                  "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "payment_counts": {
                "description": "How many payments of each amount in payment_amounts (whole numbers, same order). Omit it when every amount is a single payment. Up to 100 items. Each item: >= 1 and <= 1200.",
                "examples": [
                  ["24"]
                ],
                "items": {
                  "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 0,
                "type": "array"
              },
              "payment_frequency": {
                "default": "monthly",
                "description": "How often payments are made. Options: monthly: every month, 1/12 of a year; quarterly: every 3 months; semiannually: every 6 months; annually: every year; weekly: every week, 1/52 of a year; fortnightly: every 2 weeks",
                "enum": ["monthly", "quarterly", "semiannually", "annually", "weekly", "fortnightly"],
                "type": "string"
              },
              "start_date": {
                "description": "Date of the drawdown (the credit agreement). Give it with first_payment_date to count exact days; without both, the first payment is one period after the drawdown.",
                "examples": ["2012-01-12"],
                "format": "date",
                "type": "string"
              },
              "upfront_charges": {
                "default": "0",
                "description": "Charges the consumer pays at the start (arrangement or valuation fees, for example). Charges paid later go into the payments they are paid with. Allowed: >= 0 and <= 1000000000000000. Unit: currency.",
                "examples": ["4000"],
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              }
            },
            "required": ["credit_amount", "payment_amounts"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "description": "The calculator and version that ran.",
                "examples": ["finance/apr/eu-aprc@1"],
                "type": "string"
              },
              "exactness": {
                "additionalProperties": {
                  "enum": ["exact", "rounded", "rounded_uncertified", "underflow"],
                  "type": "string"
                },
                "description": "For each decimal output: exact; rounded (correctly, to the precision); rounded_uncertified (the last digit could not be proven); or underflow (below 1e-100, reported as 0).",
                "type": "object"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "description": "The inputs as understood.",
                "type": "object"
