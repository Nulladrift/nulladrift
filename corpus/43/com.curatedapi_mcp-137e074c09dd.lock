          "title": "VA funding fee calculator",
          "description": "The VA funding fee on a home loan, from the Department of Veterans Affairs' current rate chart, by loan type, down payment and first or later use.\n\nMost VA home loans carry a one-time funding fee, a percentage of the loan amount that depends on the kind of loan, on the down payment for a purchase, and on whether the borrower has used a VA loan before. This calculator applies the rate chart the VA publishes for loans closed on or after 7 April 2023 and shows the loan amount if the fee is financed.",
