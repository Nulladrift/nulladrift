          "description": "The standard and reduced VAT or GST rates of a country, with the official page they were read from and the day they were last checked.\n\nThe VAT or GST rates of 40 countries and provinces: the 27 EU member states from the European Commission's table, and the United Kingdom, Switzerland, Norway, Australia, New Zealand, Singapore, India and Canada (the federal GST and each province's HST) from the tax authority's own page. Every answer names its source and the day the rate was last compared with it, so you can see how fresh it is. Zero rates, exemptions and regional rates are not listed.",
          "inputSchema": {
