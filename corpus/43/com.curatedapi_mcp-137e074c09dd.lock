                "type": "string"
              },
              "contribution": {
                "description": "Contribution per period (solve_for = time). Allowed: > 0 and <= 1000000000000000. Unit: currency.",
                "pattern": "^[+-]?(\\d+(\\.\\d*)?|\\.\\d+)([eE][+-]?\\d+)?$",
                "type": "string"
              },
              "contribution_frequency": {
                "default": "monthly",
                "description": "How often you contribute. Options: monthly: 12 contributions a year; semimonthly: 24 contributions a year; biweekly: 26 contributions a year; weekly: 52 contributions a year; quarterly: 4 contributions a year; annually: 1 contribution a year",
                "enum": ["monthly", "semimonthly", "biweekly", "weekly", "quarterly", "annually"],
                "type": "string"
              },
              "contribution_timing": {
                "default": "end",
