          "description": "Check a UBL or CII invoice against the European e-invoicing standard EN 16931 with CEN's official rules.\n\nRuns the UBL 2.1 or UN/CEFACT CII D16B schema and then CEN/TC 434's own validation artefacts: the business rules (BR-…), calculation rules (BR-CO-…), VAT rules and code lists of EN 16931-1. The syntax is detected from the document. Country rules (CIUS) such as XRechnung or Peppol BIS are separate endpoints.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "xml": {
                "description": "The invoice XML, as text.",
                "maxLength": 4194304,
                "type": "string"
              }
            },
            "required": ["xml"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "receipt": {
                "description": "Only with ?receipt=true: a signed receipt for this answer, a JSON Web Token signed with Ed25519 (alg EdDSA). Its claims are iss, iat, jti (the request id), endpoint, date and response (this response without the receipt). Check it with the keys at /.well-known/jwks.json or POST /v1/receipts/verify.",
                "type": "string"
              },
              "result": {
                "properties": {
                  "checks": {
                    "description": "Each check in the order it ran, and whether it passed (a schema failure skips the rules, as in KoSIT's validator).",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "document_type": {
                    "description": "UBL Invoice, UBL CreditNote or UN/CEFACT CII.",
                    "type": ["string", "null"]
                  },
                  "error_rules": {
                    "description": "The distinct rules that reported an error, sorted.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "errors": {
                    "description": "Messages at level error.",
                    "type": "integer"
                  },
                  "messages": {
                    "description": "Up to 500 findings.",
                    "items": {
                      "properties": {
                        "check": {
                          "description": "The check (schema or rule set) that reported it.",
                          "type": "string"
                        },
                        "level": {
                          "enum": ["error", "warning", "information"],
                          "type": "string"
                        },
                        "line": {
                          "description": "Line in the document, for syntax and schema errors.",
                          "type": "integer"
                        },
                        "location": {
                          "description": "XPath of the element concerned, when given.",
                          "type": "string"
                        },
                        "message": {
                          "description": "The rule owner's own wording.",
                          "type": "string"
                        },
                        "rule": {
                          "description": "The rule's ID, e.g. BR-CO-10, or XSD for a schema error.",
                          "type": "string"
                        }
                      },
                      "required": ["check", "level", "message", "rule"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "messages_truncated": {
                    "type": "boolean"
                  },
                  "notices": {
                    "description": "Messages at level information.",
                    "type": "integer"
                  },
                  "scenario": {
                    "description": "Which set of rules applied, chosen from the document's own type and specification ID; null when none applies.",
                    "type": ["string", "null"]
                  },
                  "specification_id": {
                    "description": "The CustomizationID (UBL) or guideline ID (CII), BT-24, as found.",
                    "type": ["string", "null"]
                  },
                  "valid": {
                    "description": "true when the document matched a scenario and no check reported an error.",
                    "type": "boolean"
                  },
                  "warnings": {
                    "description": "Messages at level warning.",
                    "type": "integer"
                  }
                },
                "required": ["checks", "error_rules", "errors", "messages", "messages_truncated", "notices", "scenario", "valid", "warnings"],
                "type": "object"
              },
              "rules": {
                "description": "The official artefacts used: name, version and source.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "validator": {
                "description": "The validator and version that ran.",
                "examples": ["einvoice/en16931@1"],
                "type": "string"
              }
            },
            "required": ["result", "rules", "validator"],
            "type": "object"
          },
