      },
      "instructions": "Search Linux package manuals. Use get_targets to discover indexed scopes. Omitted scope filters search all distributions/releases; locale defaults to English. Use get_manual(manual_name=\"ls\") to read a command manual without knowing its package. get_manual recommends the latest indexed Fedora package when no distro is specified, falling back to other matching distributions. Explicit filters take precedence.",
      "tools": [
        {
          "name": "get_manual",
          "description": "Get full manual text by name, e.g. manual_name=\"ls\"; no package needed.\n\nmanual_name is the command name (also matches aliases); package is an optional filter.\nTries exact casing first, then a case-insensitive name/alias match.\nSearch API selects latest indexed packages per scope, preferring Fedora\nwhen distribution is omitted, then newest Fedora RPM version across scopes.\nExplicit filters always apply; package_version can select historical manuals.\nExact command names (sections 1/8) precede other names and aliases within\nthe preferred distro. No locale fallback.\nReturns manual text with a distro/release and package/version header.\nSource-only manuals raise an error with extraction status.",
          "inputSchema": {
            "properties": {
              "architecture": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "distribution": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "locale": {
                "default": "en",
                "maxLength": 128,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                "type": "string"
              },
              "manual_name": {
                "maxLength": 256,
                "pattern": "^[^\\s/\\\\]+$",
                "type": "string"
              },
              "package": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "package_version": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "release": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "repository": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "section": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["manual_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:febf1fd2b24ed9af7519e20135fb1a5dcd43aa690a89869de51e02ffb95bf4ab"
        },
        {
          "name": "get_targets",
          "description": "List indexed distribution/release/repository/architecture scopes and counts.\n\nUse the returned values verbatim; targets such as CentOS 8, EPEL 9 or\nFedora 43 are available only if they have been indexed.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "document_count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "package_count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "scope": {
                      "properties": {
                        "architecture": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        },
                        "distribution": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        },
                        "release": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        },
                        "repository": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        }
                      },
                      "required": ["architecture", "distribution", "release", "repository"],
                      "type": "object"
                    }
                  },
                  "required": ["document_count", "package_count", "scope"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:8ba91fad05e374b484a64a33a543ff77b4ebbc07eaaa8489ff34b4cff8f59a28"
        },
        {
          "name": "search",
          "description": "Search manual text/metadata; return ranked hits, snippets and exact identities.\n\nLatest indexed package versions are used unless package_version is supplied.\nOmitted scope filters include all indexed distributions and releases.\nSupply query for relevance-ranked text search, or manual_name without query\nfor name/alias lookup with Fedora-preferred recommendations and case-insensitive fallback.\nPass next_cursor with identical arguments for the next live page; results\ncan shift as indexing progresses. Filters are exact and case-sensitive.",
          "inputSchema": {
            "properties": {
              "architecture": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "cursor": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "distribution": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "maxLength": 128,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                "type": "string"
              },
              "manual_name": {
                "anyOf": [
                  {
                    "maxLength": 256,
                    "pattern": "^[^\\s/\\\\]+$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "package": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "package_version": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "query": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "minLength": 1,
                    "pattern": "^[\\s\\S]*\\S[\\s\\S]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "release": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "repository": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "section": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "manual": {
                      "properties": {
                        "aliases": {
                          "items": {
                            "maxLength": 256,
                            "pattern": "^[^\\s/\\\\]+$",
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "locale": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        },
                        "manual_id": {
                          "format": "uuid",
                          "type": "string"
                        },
                        "name": {
                          "maxLength": 256,
                          "pattern": "^[^\\s/\\\\]+$",
                          "type": "string"
                        },
                        "section": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        }
                      },
                      "required": ["locale", "manual_id", "name", "section"],
                      "type": "object"
                    },
                    "membership_id": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "package": {
                      "properties": {
                        "architecture": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        },
                        "name": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        },
                        "package_id": {
                          "format": "uuid",
                          "type": "string"
                        },
                        "sha256": {
                          "pattern": "^[a-f0-9]{64}$",
                          "type": "string"
                        },
                        "version": {
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["architecture", "name", "package_id", "sha256", "version"],
                      "type": "object"
                    },
                    "revision_id": {
                      "pattern": "^[a-f0-9]{64}$",
                      "type": "string"
                    },
                    "scope": {
                      "properties": {
                        "architecture": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        },
                        "distribution": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        },
                        "release": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        },
                        "repository": {
                          "maxLength": 128,
                          "pattern": "^[A-Za-z0-9][A-Za-z0-9._+~-]*$",
                          "type": "string"
                        }
                      },
                      "required": ["architecture", "distribution", "release", "repository"],
                      "type": "object"
                    },
                    "score": {
                      "type": "number"
                    },
                    "snippet": {
                      "type": "string"
                    }
                  },
                  "required": ["manual", "membership_id", "package", "revision_id", "scope", "score", "snippet"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["items", "next_cursor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:81ddf15af39624eecdcf486156e0ecb473719ae12cf5fce1ea9413efdb88bcf9"
        }
      ],
      "digest": "sha256:97cc87ff31bcead05658dd52132e978a6ea09d4781865dbd86f786b324b68ad8"
    }
  }
