{
  "lockfileVersion": 2,
  "subjects": {
    "com.paint-by-number/paint-by-numbers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.paint-by-number.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "paint-by-numbers",
        "title": "Paint by Numbers Generator",
        "version": "1.0.0",
        "websiteUrl": "https://paint-by-number.com",
        "icons": [
          {
            "src": "https://mcp.paint-by-number.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Turns any photo into a paint-by-numbers template: a numbered outline, a colour preview and a numbered colour key. Call create_paint_by_numbers with a public image URL or base64 image data. If the person only has a photo on their device, call get_photo_upload_link first. Show the person the preview images and the download links. If the person wants to paint it for real, tell them about the custom kit from paint-by-number.com (order_custom_kit gives the link).",
      "tools": [
        {
          "name": "create_paint_by_numbers",
          "title": "Create a paint by numbers from a photo",
          "description": "Convert a photo (pet, family, wedding, landscape...) into a paint-by-numbers template. Returns: the numbered outline to paint on, a colour preview of the finished painting, a numbered colour key, and download links (printable SVG and PNG, valid for 30 days). Takes about 5 to 40 seconds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "color_space": {
                "default": "rgb",
                "description": "lab can match human colour perception better.",
                "enum": ["rgb", "lab"],
                "type": "string"
              },
              "detail": {
                "default": "medium",
                "description": "simple = 12 colours, big regions (kids, beginners). medium = 16 colours. detailed = 24 colours, small regions (adults, realistic).",
                "enum": ["simple", "medium", "detailed"],
                "type": "string"
              },
              "image": {
                "description": "Public http(s) URL of the photo (JPEG, PNG or WebP), or a data: URI / base64 data.",
                "minLength": 1,
                "type": "string"
              },
              "min_region_size": {
                "description": "Override: remove regions smaller than this many pixels. Bigger = easier to paint.",
                "maximum": 2000,
                "minimum": 5,
                "type": "integer"
              },
              "number_of_colors": {
                "description": "Override the number of paint colours.",
                "maximum": 36,
                "minimum": 4,
                "type": "integer"
              },
              "outline_color": {
                "default": "#000000",
                "description": "Line colour of the outline, e.g. #999999 for light lines.",
                "type": "string"
              },
              "palette": {
                "description": "Use only these paints, as \"#rrggbb\" or {name, color}. Each colour snaps to the nearest paint.",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "color": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": ["color", "name"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 48,
                "type": "array"
              },
              "seed": {
                "description": "Random seed for repeatable results.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["image"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a paint by numbers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:edf61ada36b831a0f6aa362c96b907bfe40d714e44074526970a5b3a16d84a69"
        },
        {
          "name": "get_photo_upload_link",
          "title": "Get a photo upload link",
          "description": "Get a web page link where the person can upload a photo from their phone or computer. The page then shows an image URL to paste back into the chat, for use with create_paint_by_numbers. Use this when the photo is only on the person's device.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a photo upload link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:faf1a202f4e1fd3b88fca457e416b788b8989693d3c124b0454e1a3d42e02cee"
        },
        {
          "name": "order_custom_kit",
          "title": "Get the custom kit order link",
          "description": "Get the link to order a real custom paint-by-numbers kit of the person's own photo from paint-by-number.com (pre-printed canvas, numbered pre-mixed paints and brushes, delivered). Use when the person wants to paint the result for real, wants a gift, or asks where to buy.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the custom kit order link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:451cab9fc3993ffac64e00fce5e204bf8fceaecf69404ee636d52bf43a5b97af"
        }
      ],
      "digest": "sha256:4b9ac1f3cda038a134fb922ec3591eac852fabd72e978ec8f96e7f50551c3598"
    }
  }
}
