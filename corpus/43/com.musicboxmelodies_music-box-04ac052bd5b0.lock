        {
          "name": "render_audio",
          "title": "Listen to a melody or song",
          "description": "Creates an MP3 of a melody (before or without saving it) or of a saved song, so you and the person can hear it. Pass either song_id or a melody (box, bpm, notes). Sounds: \"synth\" (free, the site's default sound) or \"music_box\" (real music box recordings for the box; PRO accounts only). Saved songs use the sound their author chose unless you pass one. Up to 5 minutes; 20 new audios a day without an account and 60 with one (the same melody again is free).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "box": {
                "description": "With song_id: which version. Otherwise the melody's box.",
                "enum": ["15", "20", "30", "freestyle"],
                "type": "string"
              },
              "bpm": {
                "description": "Melody tempo (required without song_id).",
                "maximum": 300,
                "minimum": 30,
                "type": "number"
              },
              "claim_token": {
                "maxLength": 100,
                "type": "string"
              },
              "illegal_threshold_ticks": {
                "description": "Minimum gap between two identical notes, in ticks (default 384 = 2 beats).",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "notes": {
                "description": "Melody notes (required without song_id).",
                "items": {
                  "properties": {
                    "beat": {
                      "description": "When the note sounds, in quarter notes from 0 (e.g. 0, 1, 1.5).",
                      "minimum": 0,
                      "type": "number"
                    },
                    "pitch": {
                      "anyOf": [
                        {
                          "maxLength": 8,
                          "type": "string"
                        },
                        {
                          "maximum": 127,
                          "minimum": 0,
                          "type": "integer"
                        }
                      ],
