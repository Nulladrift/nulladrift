        {
          "name": "export_song",
          "title": "Export a song as MIDI or a printable strip",
          "description": "Creates a download link for one box version of a song: an MP3, a MIDI file or a printable strip PDF to cut and punch for a hand-crank music box (\"pdf_long\" is one continuous strip, \"pdf_a4\"/\"pdf_letter\" are sliced to fit the page). Works on the person's songs and on public tunes. Requires signing in, like exporting in the composer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "box": {
                "description": "Which version. Defaults to the preferred one.",
                "enum": ["15", "20", "30", "freestyle"],
                "type": "string"
              },
              "format": {
                "enum": ["mp3", "midi", "pdf_long", "pdf_a4", "pdf_letter"],
                "type": "string"
              },
              "grid": {
                "description": "Grid printed on the strip (PDF only). Default standard.",
                "enum": ["standard", "note_lines", "tempo_lines", "empty"],
                "type": "string"
              },
              "show_title": {
                "description": "Print the song title on the strip (PDF only). Default true.",
                "type": "boolean"
              },
              "song_id": {
                "maxLength": 40,
                "type": "string"
              },
              "strip_shape": {
                "description": "Shape of the strip ends (PDF only). Default capped.",
                "enum": ["capped", "straight", "pointy", "round"],
                "type": "string"
              }
            },
            "required": ["format", "song_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "box": {
                "type": "string"
              },
              "download_url": {
                "type": "string"
              },
              "format": {
                "type": "string"
              },
              "song_id": {
                "type": "string"
              }
            },
            "required": ["box", "download_url", "format", "song_id"],
            "type": "object"
          },
          "annotations": {
