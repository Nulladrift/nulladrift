      },
      "serverInfo": {
        "name": "musicboxmelodies",
        "version": "1.2.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Musicboxmelodies arranges songs for music boxes. Use these tools to browse public music box tunes, check that a melody can be played on a given music box, fit it to one, save it and export it as a printable strip or MIDI. Read the resource mbm://guides/composing-for-music-boxes before composing. Workflow: validate_melody or fit_melody_to_box until there are no errors, then create_song. Saving works without an account (the person gets a link to claim the song); with save_to_my_account the person signs in and the song goes straight to their account. Songs are always saved private; only make one public when the person asks for it. To order a custom arrangement, use get_product_options and prepare_order: the person pays on the website.",
      "tools": [
        {
          "name": "add_version",
          "title": "Add or replace a box version of a song",
          "description": "Saves a melody as the version of an existing song for one box (a song can have one version per box: 15, 20, 30 notes or freestyle). Replaces that box's version if it exists. Works on the signed-in person's songs, or on a song saved without an account if you pass its claim_token. The melody must have no errors.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "box": {
                "description": "Music box type: \"15\", \"20\", \"30\" (notes) or \"freestyle\" (digital only). See list_music_boxes.",
                "enum": ["15", "20", "30", "freestyle"],
                "type": "string"
              },
              "bpm": {
                "description": "Tempo in beats per minute (30-300).",
                "maximum": 300,
                "minimum": 30,
                "type": "number"
              },
              "claim_token": {
                "description": "Only for songs saved without an account.",
                "maxLength": 100,
                "type": "string"
              },
              "illegal_threshold_ticks": {
                "description": "Minimum gap between two identical notes, in ticks (default 384 = 2 beats).",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "notes": {
                "description": "Notes in any order, at most 2000. Only onsets matter: music boxes have no note durations.",
                "items": {
                  "properties": {
                    "beat": {
                      "description": "When the note sounds, in quarter notes from 0 (e.g. 0, 1, 1.5).",
                      "minimum": 0,
                      "type": "number"
                    },
                    "pitch": {
                      "anyOf": [
                        {
                          "maxLength": 8,
                          "type": "string"
                        },
                        {
                          "maximum": 127,
                          "minimum": 0,
                          "type": "integer"
                        }
                      ],
                      "description": "Note name like \"C5\", \"F#4\", \"Bb3\", or a MIDI number (60 = C4)."
                    },
                    "ticks": {
                      "description": "Alternative to beat: 192 ticks per quarter note.",
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["pitch"],
                  "type": "object"
                },
                "maxItems": 2000,
                "minItems": 1,
                "type": "array"
              },
              "song_id": {
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["box", "bpm", "notes", "song_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "box": {
                "type": "string"
              },
              "composer_url": {
                "type": "string"
              },
              "replaced": {
                "type": "boolean"
              },
              "song_id": {
                "type": "string"
              },
              "validation": {
                "additionalProperties": false,
                "properties": {
                  "issues": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "code": {
                          "type": "string"
                        },
                        "index": {
                          "description": "Index of the note in the input, when the issue is about one note.",
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "message": {
                          "type": "string"
                        },
                        "severity": {
                          "enum": ["error", "warning"],
                          "type": "string"
                        },
                        "suggestions": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["code", "message", "severity"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "ok": {
                    "type": "boolean"
                  },
                  "stats": {
                    "additionalProperties": false,
                    "properties": {
                      "duration_seconds": {
                        "type": "number"
                      },
                      "illegal_count": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "note_count": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "strip_length_cm": {
                        "type": "number"
                      }
                    },
                    "required": ["duration_seconds", "illegal_count", "note_count"],
                    "type": "object"
                  }
                },
                "required": ["issues", "ok", "stats"],
                "type": "object"
              }
            },
            "required": ["box", "replaced", "song_id", "validation"],
            "type": "object"
          },
