                    "type": "number"
                  },
                  "reformatted": {
                    "type": "number"
                  }
                },
                "required": ["ambiguous", "cited", "derived", "error", "items", "none", "reformatted"],
                "type": "object"
              }
            },
            "required": ["_meta", "results", "summary"],
            "type": "object"
          },
