          ],
          "digest": "sha256:aeb5e773a96229ad6319757ece05c34f15c1907ae0adf9bd67add9208a2941d2"
        },
        {
          "name": "dividend_sustainability_review",
          "title": "Dividend Sustainability Review",
          "description": "Dividend safety from cash-flow articulation, not yield-chasing: 10 years of payout history, FCF coverage trajectory, deployment flags (debt-funded distributions), leverage headroom, and the revision record on the cash-flow concepts — ending in a SAFE / STRETCHED / AT-RISK read with every figure cited. Deliberately performs no dividend-discount arithmetic: capacity is read from returned coverage ratios; growth/required-return inputs are labelled user assumptions. Chains get_company_fundamentals → get_financial_ratios (per_share + leverage) → get_capital_allocation_profile → list_restatements → optional claim + tripwire.",
          "arguments": [
            {
              "name": "ticker",
              "description": "Ticker whose dividend is under review.",
