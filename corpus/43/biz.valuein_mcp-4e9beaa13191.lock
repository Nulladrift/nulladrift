        {
          "name": "compute_accretion_dilution",
          "title": "Compute M&A Accretion/Dilution",
          "description": "M&A accretion/dilution: the standard sell-side/banker quick-screen for whether a proposed acquisition adds to (accretive) or subtracts from (dilutive) the acquirer's EPS in the first pro-forma year. Pulls net income + shares outstanding for both companies. A share price comes from `get_price_history` (a graded daily close, cited with its date and grade) or from the user, never from memory: for a stock deal (cash_pct < 1) pass the acquirer's share price as acquirer_share_price_override (a user's price is called user-supplied); the target's price only discloses the offer premium. Caller sets the consideration mix (cash_pct, cash-financed by new debt or the acquirer's balance sheet), annual run-rate synergies, and the new-debt interest rate. A SINGLE pro-forma-year bridge — NOT a multi-year merger model; synergy ramp, integration costs, and purchase-price-allocation amortization (goodwill/intangibles step-up) are not modeled (see `result.caveats[]`). `result.accretion_dilution_pct` positive = accretive, negative = dilutive. Plan: Benchmark and above.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "acquirer_share_price_override": {
                "description": "The acquirer's share price in USD, supplied by you. Required when cash_pct < 1.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "acquirer_ticker": {
                "description": "Acquirer's stock ticker symbol, e.g. MSFT.",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              },
              "as_of_date": {
                "description": "Point-in-time cutoff (YYYY-MM-DD) for both companies' fundamentals. Omit to use the latest knowable data.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "cash_financing_source": {
                "default": "new_debt",
                "description": "Where the cash consideration is funded from. \"new_debt\" (default) applies an after-tax interest drag; \"balance_sheet_cash\" applies none.",
                "enum": ["new_debt", "balance_sheet_cash"],
                "type": "string"
              },
              "cash_pct": {
                "description": "Fraction (0-1) of deal value paid in cash; the remainder (1 - cash_pct) is paid in acquirer stock.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "new_debt_interest_rate": {
                "default": 0.06,
                "description": "Annual interest rate on new acquisition debt (only used when cash_financing_source is \"new_debt\"). Default 0.06.",
                "maximum": 0.5,
                "minimum": 0,
                "type": "number"
              },
              "offer_price_per_share": {
                "description": "Offer price per target share (USD).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "synergies_pretax": {
                "default": 0,
                "description": "Pretax annual run-rate cost/revenue synergies (USD). Default 0.",
                "type": "number"
              },
              "target_share_price_override": {
                "description": "The target's share price in USD, supplied by you (used only for the disclosed premium). Leave unset to skip the premium.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "target_ticker": {
                "description": "Target's stock ticker symbol, e.g. ATVI.",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              },
              "tax_rate": {
                "default": 0.21,
                "description": "Effective tax rate applied to synergies and the interest drag. Default 0.21.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["acquirer_ticker", "cash_pct", "offer_price_per_share", "target_ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "acquirer_ticker": {
                "type": "string"
              },
              "result": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "target_ticker": {
                "type": "string"
              }
            },
            "required": ["_meta", "acquirer_ticker", "result", "target_ticker"],
            "type": "object"
          },
