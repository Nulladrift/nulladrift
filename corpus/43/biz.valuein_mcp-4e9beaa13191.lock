        {
          "name": "project_three_statement",
          "title": "Project Linked Three-Statement Model",
          "description": "Linked forward Income Statement / Balance Sheet / Cash Flow projection, seeded from the company's latest historical annual period. The balance sheet ties out (assets == liabilities + equity) EVERY projected year by algebraic construction — each year's `tie_out_ok` field is a live correctness check, not decoration. Interest is computed on beginning-of-period debt balances (no circular cash-sweep/revolver solve — deterministic by design). Gross margin, operating margin, and the combined D&A + working-capital adjustment are held at the seed period's ratio-of-revenue unless overridden; interest_rate_on_debt and tax_rate are ASSUMPTIONS (no historical InterestExpense concept exists in the dataset). Every simplification is listed in the response `caveats[]` — read them before presenting this as a precise forecast. Returns a `fcf_stream` usable directly as `compute_dcf`'s `fcf_source:\"three_statement\"` input. Plan: Benchmark and above.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Point-in-time cutoff (YYYY-MM-DD) for the seed period. Omit to use the latest knowable annual period.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "capex_pct_of_revenue_override": {
                "description": "Override the seed period's capex-as-%-of-revenue ratio. Leave unset to use the historical ratio.",
                "type": "number"
              },
              "cash_sweep_pct": {
                "default": 0,
                "description": "Fraction (0-1) of each year's free cash flow swept to debt paydown. Default 0 (going-concern; use ~1.0 for an LBO-style paydown).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "dividend_payout_pct": {
                "default": 0,
                "description": "Fraction (0-1) of net income paid out as dividends each year. Default 0.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "gross_margin_pct_override": {
                "description": "Override the seed period's gross margin (held flat across all years). Leave unset to use the historical ratio.",
                "type": "number"
              },
              "interest_rate_on_debt": {
                "default": 0.06,
                "description": "Annual interest rate on beginning-of-period debt. Assumption — default 0.06.",
                "maximum": 0.5,
                "minimum": 0,
                "type": "number"
              },
              "new_debt_draw_year1": {
                "default": 0,
                "description": "New debt drawn at year 1 only (absolute USD) — e.g. acquisition financing. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "new_equity_draw_year1": {
                "default": 0,
                "description": "New equity contributed at year 1 only (absolute USD) — hits cash + equity symmetrically. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "operating_margin_pct_override": {
                "description": "Override the seed period's operating margin. Leave unset to use the historical ratio.",
                "type": "number"
              },
              "revenue_growth_rate": {
                "description": "Flat annual revenue growth rate applied every year (e.g. 0.08 = 8%/yr).",
                "maximum": 1,
                "minimum": -0.5,
                "type": "number"
              },
              "tax_rate": {
                "default": 0.21,
                "description": "Effective tax rate on positive pretax income. Default 0.21 (US statutory).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "ticker": {
                "description": "Stock ticker symbol, e.g. AAPL, MSFT, BRK.B.",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              },
              "years": {
                "default": 5,
                "description": "Projection horizon in years (1-15). Defaults to 5.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["revenue_growth_rate", "ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
