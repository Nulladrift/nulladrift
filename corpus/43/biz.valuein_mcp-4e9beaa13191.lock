          "title": "ratio table schema",
          "description": "Financial ratios per company per fiscal period, derived from fact data.  Point-in-time: each row's `accepted_at` is the SEC acceptance time of the latest input fact, so a restated period is a new vintage row rather than an overwrite.  Filter `accepted_at <= as_of` and take the latest vintage to avoid look-ahead bias.  No accession_id (a ratio can draw on several filings).  `accepted_at` is NULL for cross-sectional rank rows (`*_sector_pctile`) and for years whose source facts carry no acceptance timestamp.  Equity ratios name the equity they use: `return_on_equity` is on common equity (the default basis), `return_on_parent_equity` on parent equity, `return_on_total_equity` on total equity including noncontrolling interest; `book_value_per_share` and the tangible variants are on common equity; `debt_to_equity`, `liabilities_to_equity`, `long_term_debt_to_equity`, `debt_to_capital` and `equity_multiplier` are on total equity.  Averages use the same equity concept at both ends; a missing or non-positive equity leaves the ratio absent.",
