        {
          "name": "get_filing_review_pack",
          "title": "Filing Review Pack",
          "description": "Everything for a 10-K / 10-Q case in ONE call, already cited: the company and the filing (form, accession, period, filed date), this period against the prior comparable period (`compare_periods`, with `derived_id`s), key ratios, earnings signals, forensic flags (`forensic_audit`), the company's restatements, and the filing-section index with the exact `read_filing_section` arguments for MD&A and Risk Factors. Each section is the underlying tool's output unchanged (`value`, `fact_id` / `derived_id`, `availability`, `metrics_display`): quote it verbatim. A section above the caller's plan, or that fails, carries its own `status` and error and sets `degraded: true`; it never fails the pack and is never shown as empty. Point-in-time: with `as_of_date` (or an explicit `accession` / `period`, which cuts at that filing's acceptance date) every section reads only what was knowable then; the forensic audit has no as-of date, so it is not run in a dated case. Start here for a filing case, then read the sections you need. Each section keeps the plan gate of its own tool.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "accession": {
                "description": "A specific 10-K / 10-Q to review. Omit for the latest.",
                "pattern": "^(?:\\d{10}-\\d{2}-\\d{6}|\\d{18})$",
                "type": "string"
              },
              "as_of_date": {
                "description": "Point-in-time cutoff: every section reads only what the SEC had accepted by this date. A section that cannot honour it is not run and says so.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "period": {
                "default": "latest",
                "description": "'latest', 'FY2024' or 'Q3-2024'. Ignored when `accession` is given.",
                "pattern": "^(?:latest|FY\\d{4}|Q[1-4]-\\d{4})$",
                "type": "string"
              },
              "ticker": {
                "description": "Company ticker or CIK (SEC identifier), e.g. 'AAPL' or '0000320193'. A CIK is the stable identifier.",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.\\-]+$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "as_of_date": {
                "type": ["string", "null"]
              },
              "company": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "cik": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "ticker": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["cik", "name", "ticker"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "degraded": {
                "description": "True when any section did not return its data. Read each section's `status`; an unreadable section is never an empty one.",
                "type": "boolean"
              },
              "filing": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "accepted_at": {
                        "type": "string"
                      },
                      "accession_id": {
                        "type": "string"
                      },
                      "filing_date": {
                        "type": "string"
                      },
                      "form_type": {
                        "type": "string"
                      },
                      "inline_viewer_url": {
                        "type": ["string", "null"]
                      },
                      "is_amendment": {
                        "type": "boolean"
                      },
                      "period": {
                        "type": ["string", "null"]
                      },
                      "period_end": {
                        "type": ["string", "null"]
                      },
                      "sec_url": {
                        "type": "string"
                      }
                    },
                    "required": ["accepted_at", "accession_id", "filing_date", "form_type", "inline_viewer_url", "is_amendment", "period", "period_end", "sec_url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "note": {
                "type": "string"
              },
              "pack": {
                "type": "string"
              },
              "reading_list": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "present": {
                      "type": "boolean"
                    },
                    "read_with": {
                      "additionalProperties": false,
                      "properties": {
                        "args": {
                          "additionalProperties": {},
                          "properties": {},
                          "type": "object"
                        },
                        "tool": {
                          "type": "string"
                        }
                      },
                      "required": ["args", "tool"],
                      "type": "object"
                    },
                    "section": {
                      "type": "string"
                    }
                  },
