        {
          "name": "screen_universe",
          "title": "Screen Universe by Factor Scores",
          "description": "Rank companies by cross-sectional factor scores from factor_scores.parquet. Returns the underlying factors (roe, gross_margin, operating_margin, net_profit_margin, revenue_growth_yoy, fcf_to_assets, debt_to_equity, asset_turnover, current_ratio, piotroski_f_score) plus their percentile ranks (1.0 = best in universe, 0.0 = worst). `composite_rank` (the default sort) is a one-number multi-factor shortcut; sort by a specific *_rank column for a single factor. Two modes: full-universe (omit ticker) or single-entity (ticker set — spot-check ONE company's factor profile). Sector filter is SIC-derived (GICS-aligned, not licensed GICS — see `get_pit_universe`). Use this *instead of* `get_financial_ratios` when you want CROSS-SECTIONAL comparison (rank vs peers); use `get_financial_ratios` when you want one company's ratios over time. Supports survivorship-free POINT-IN-TIME screening via `as_of_date` (see the param). Full-universe screens omit rows that don't join to a company (null symbol) and companies not listed on the reference date (delisted, acquired, or an unlisted filer; a single-ticker lookup still answers and marks `listed: false` + `listed_until`); pass `exclude_outliers=true` to also drop shell-company rows with implausible factors. Plan: every plan; without sign-in it ranks the subset that coverage includes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Point-in-time cutoff (YYYY-MM-DD). When set, the screen is reconstructed as of this date via factor_scores.accepted_at — each entity ranked at its latest-knowable period, zero look-ahead, survivorship-free. Omit for the latest snapshot.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "exclude_outliers": {
                "default": false,
                "description": "Optional data-quality guard (default false). When true, additionally drops rows with implausible raw factor values (non-finite, or e.g. asset_turnover > 50x, |FCF/assets| > 10) from shell companies with near-zero denominators. Rows that do not join to a company (null symbol) are ALWAYS omitted in full-universe mode, regardless of this flag.",
                "type": "boolean"
              },
              "limit": {
                "default": 25,
                "description": "Number of results to return (1-100). Defaults to 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Zero-based row offset for paging within the requested `limit` window. At most 250 rows are inlined per call; if the response carries a `truncation` envelope, pass its `next_offset` here. Defaults to 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "sector": {
                "description": "Filter to a specific sector (case-insensitive partial match). E.g. 'Technology', 'Healthcare'.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "sort_by": {
                "default": "composite_rank",
                "description": "Which factor rank to sort by (see the enum). Defaults to composite_rank. An unrecognized column is rejected with INVALID_ARGUMENT (no silent fallback).",
                "enum": ["roe_rank", "gross_margin_rank", "operating_margin_rank", "net_profit_margin_rank", "revenue_growth_yoy_rank", "fcf_to_assets_rank", "debt_to_equity_rank", "asset_turnover_rank", "current_ratio_rank", "piotroski_f_score_rank", "composite_rank"],
                "type": "string"
              },
              "ticker": {
                "description": "If provided, show only this ticker's factor scores (single-entity mode). Omit to screen the full universe.",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.\\-]+$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "as_of_date": {
                "description": "Present only when a point-in-time as_of_date was supplied",
                "type": "string"
              },
              "data": {
                "description": "Ranked factor-score rows for the screened universe",
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "lineage": {
                "additionalProperties": false,
                "description": "Provenance for pipeline-derived values (ratio.parquet / factor_scores.parquet): source table + pipeline computed_at, plus a pointer to the tools that return filing-level lineage. NOT point-in-time (recomputed on each pipeline run).",
                "properties": {
