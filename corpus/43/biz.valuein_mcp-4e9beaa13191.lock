                                "type": "array"
                              }
                            },
                            "required": ["formula_id", "inputs"],
                            "type": "object"
                          },
                          "derived_id": {
                            "description": "Citation id of a figure the server computed (drv1:...). Cite it exactly like a fact_id; verify_facts re-derives it from its input facts. Absent when no input fact could be resolved.",
                            "type": "string"
                          },
                          "fact_id": {
                            "type": "string"
                          },
                          "formula": {
                            "type": "string"
                          },
                          "inputs": {
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "fact_id": {
                                  "type": "string"
                                },
                                "role": {
                                  "type": "string"
                                },
                                "value": {
                                  "type": ["number", "null"]
