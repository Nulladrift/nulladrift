        {
          "name": "get_financial_ratios",
          "title": "Financial Ratios",
          "description": "Financial ratios Valuein precomputes from each company's SEC filings. A bare call returns the 2 most recent periods and every category except growth and rank (both large); pass `categories` (e.g. [\"growth\",\"rank\"]) to get them and `limit` (up to 20) for more periods. Served categories: profitability (margins, ROE, ROA, ROIC), liquidity (current ratio, quick ratio), leverage (D/E, interest coverage, net debt/EBITDA), efficiency (asset turnover, inventory days), per_share (EPS, BVPS, FCF/share), owner_earnings (Buffett FCF, owner yield), valuation (graham_number, ncav_per_share; no price-based multiple is published), and the pipeline-emitted forensic, growth, and rank (cross-sectional *_sector_pctile) categories. NOT every category exists for every ticker — omit `categories` to get whatever this ticker has, or read `available_categories` on the DATA_NOT_AVAILABLE_FOR_PERIOD error a missing category returns. valuation is the pair of price-free reference points precomputed at each fiscal period end from SEC filings data. Includes TTM rows alongside annual; each row's `is_calendar_aligned` is TRUE only when period_end sits on the fiscal-year boundary (±7 days) — filter to TRUE when joining ratios to fact-table fundamentals on (entity, fiscal_year). For historical cuts use `as_of_date` (PIT by accepted_at when present, else by period_end — see the param). For the profitability, leverage and cash-flow summary with per-figure provenance use `get_valuation_metrics`; for intrinsic value use `compute_dcf`. Each ratio is a `{value, unit, category, reason}` entry with a response-level `lineage` (DerivedLineage) pointing to `get_company_fundamentals` / `verify_fact_lineage` for filing-level provenance; a null value carries a `reason` (e.g. INPUT_MISSING) so missing is never a real zero. An FY ratio also carries a `derived_id`: cite it like a fact_id (verify_facts re-reads the row). On fiscal-year rows net_debt (total_debt − (cash + short-term investments), the compute_dcf definition), fcf_margin, debt_to_equity (total_debt / equity) and the *_cagr_Ny ratios are recomputed from the annual facts (`basis: recomputed_from_facts`) so every tool agrees; those carry a formula-form `derived_id` over the input facts when a registered formula reproduces the figure (net_debt carries none); a CAGR over a zero or negative base is null with a reason. Available on all plans.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Historical cutoff (canonical cross-tool date param). PIT by SEC accepted_at when the ratio data carries it (latest value knowable on/before the date, zero look-ahead, _meta.pit_safe=true), else by ratio.period_end (pit_safe=false). For guaranteed accepted_at PIT use get_company_fundamentals.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "categories": {
                "description": "Ratio categories to include (see the enum). Omit to return every category this ticker has except growth and rank, which are returned only when named here. `valuation` (graham_number, ncav_per_share) are precomputed at each fiscal period end. Availability is per-ticker (the envelope lists this ticker's available_categories).",
                "items": {
                  "enum": ["profitability", "liquidity", "leverage", "efficiency", "per_share", "owner_earnings", "forensic", "growth", "rank", "valuation"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "fiscal_period": {
                "description": "Filter to a specific fiscal period type. Use 'TTM' for trailing twelve months. Omit to return both annual (FY) and TTM rows.",
                "enum": ["FY", "TTM", "Q1", "Q2", "Q3", "Q4"],
                "type": "string"
              },
              "limit": {
                "default": 2,
                "description": "Number of distinct period_end dates to return (1–20). Defaults to 2. Within each period, all matching ratio_names are included.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "period_end_before": {
                "description": "Alias of as_of_date (as_of_date preferred — the canonical name). Returns ratios with period_end on or before this date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ticker": {
                "description": "Stock ticker symbol, e.g. AAPL, MSFT — or a CIK (SEC identifier), e.g. '0000320193'.",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.\\-]+$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "data": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "computed_at": {
                      "type": "string"
                    },
                    "fiscal_period": {
                      "type": "string"
                    },
                    "fiscal_year": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "is_calendar_aligned": {
                      "type": ["boolean", "null"]
                    },
                    "is_ttm": {
                      "type": "boolean"
                    },
                    "period_end": {
                      "type": "string"
                    },
                    "ratios": {
                      "additionalProperties": {
                        "additionalProperties": false,
                        "properties": {
                          "basis": {
                            "const": "recomputed_from_facts",
                            "description": "Present when the pipeline value was replaced by the Worker's own computation from the annual facts (net_debt, fcf_margin, debt_to_equity, *_cagr_Ny), so every tool quotes one definition. `detail` states it.",
                            "type": "string"
                          },
                          "category": {
                            "type": "string"
                          },
                          "derived_id": {
                            "description": "Citation id of this ratio (drv1:<cik>:pipeline:ratio.<name>@1:period_end=...): cite it like a fact_id; verify_facts re-reads the ratio row and reproduces `display`. Absent when the figure cannot be re-read as quoted (TTM or quarterly rows, a server-corrected sign).",
                            "type": "string"
                          },
                          "detail": {
                            "type": "string"
                          },
                          "display": {
                            "description": "The ratio rendered exactly as it should be quoted (31.20%, 1.45x, $6.11). QUOTE THIS VERBATIM instead of converting `value` yourself.",
                            "type": ["string", "null"]
                          },
                          "reason": {
                            "type": "string"
                          },
                          "unit": {
                            "type": "string"
                          },
                          "value": {
                            "type": ["number", "null"]
                          }
                        },
                        "required": ["category", "display", "unit", "value"],
                        "type": "object"
                      },
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    }
                  },
                  "required": ["computed_at", "fiscal_period", "fiscal_year", "is_calendar_aligned", "is_ttm", "period_end", "ratios"],
                  "type": "object"
                },
                "type": "array"
              },
              "lineage": {
                "additionalProperties": false,
                "description": "Provenance for pipeline-derived values (ratio.parquet / factor_scores.parquet): source table + pipeline computed_at, plus a pointer to the tools that return filing-level lineage. NOT point-in-time (recomputed on each pipeline run).",
                "properties": {
                  "computed_at": {
                    "type": "string"
                  },
                  "derivation": {
                    "const": "pipeline_computed",
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "pit_safe": {
                    "type": "boolean"
                  },
                  "source_table": {
                    "type": "string"
                  },
                  "verify_with": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["derivation", "note", "pit_safe", "source_table", "verify_with"],
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "periods_returned": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "plan": {
                "type": "string"
              },
              "ticker": {
                "type": "string"
              }
            },
            "required": ["_meta", "data", "note", "periods_returned", "plan", "ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Financial Ratios"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2219e1ba6be56db9f8b96cf7048468f6c994271207edd044716a651a56a9d01"
        },
        {
