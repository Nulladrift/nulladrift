              "description": "Explicit-forecast horizon. Defaults to 5.",
              "required": false
            },
            {
              "name": "confirm_each_step",
              "description": "When 'true', the agent pauses after each assumption block and asks the user to confirm before proceeding. Default 'true' — the discipline is the value. Set 'false' for one-shot runs.",
              "required": false
