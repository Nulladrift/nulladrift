        {
          "name": "get_pit_universe",
          "title": "Point-in-Time Universe",
          "description": "Historical index membership, survivorship-free: who was in an index on `as_of_date` (companies that existed and belonged on that exact date, including ones delisted since; no hindsight). Use it INSTEAD OF `search_companies` for any past date (\"Was X in the S&P 500 on Y?\"); `search_companies` knows only current membership. To check one company, pass `ticker` (better, a CIK) + `index` + the date: present = member. Coverage: S&P 500 members on a date, including former members, from 1996 (reconstructed, incomplete before about 2007); Russell 1000/2000/3000 from 2000-09-30 at medium confidence. Each result's `note` states the depth and gaps of the index asked about: read it before a backtest. Branch on `_meta.pit_safe` (false = approximate; always false for Russell) and each row's `confidence`. A response is one PAGE: `complete` and `survivorship_free` are true only when `returned_rows` equals `universe_size`; page with `offset` = `truncation.next_offset`, or read the whole table with `get_compute_ready_stream`. Carry each row's `cik`; `enriched: false` is a member whose identity is unknown, still a member. `sector` is SIC-derived, not GICS. Plan: every plan; without sign-in it returns the subset that coverage includes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Historical date (YYYY-MM-DD) for survivorship-free construction. Index queries use index_membership join/leave dates (entrants after the date excluded, later-removed members kept); sector queries use security valid_from/valid_to. Omit for the current universe.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include_share_classes": {
                "default": false,
                "description": "false (default) collapses to one row per CIK (index-provider convention — BRK counts once, not BRK-A + BRK-B). true returns every share-class row (GOOG and GOOGL separately) — for security-level analysis only.",
                "type": "boolean"
              },
              "index": {
                "description": "Index filter. 'sp500' (~500 large caps; reconstructed history from 1996, incomplete before ~2007, check pit_safe), 'russell1000' (~1000 large/mid), 'russell2000' (~2000 small caps), 'russell3000' (~3000 broad market) — the three Russell indices carry fund-derived history back to 2000-09-30 at medium confidence, with observation spacing that widens before 2007. Omit for no index filter (sector-only or full universe queries).",
                "enum": ["sp500", "russell1000", "russell2000", "russell3000"],
                "type": "string"
              },
              "is_active": {
                "description": "Filter to active (currently trading) companies only. Omit to include all. WARNING: setting this to true on a HISTORICAL query reintroduces survivorship bias — companies that were active on as_of_date but later went bankrupt or got acquired will be filtered out.  Leave unset for true PIT backtests.",
                "type": "boolean"
              },
              "limit": {
                "default": 100,
                "description": "Rows per page (1–3500; at most 250 are inlined per call). Defaults to 100. `universe_size` always states the full matched count; when more rows remain after this page the response carries a `truncation` envelope — call again with `offset` = its `next_offset`. Universe is deduped to one row per CIK (SP500 ~505, Russell 3000 ~3050).",
                "maximum": 3500,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Zero-based row offset where this page starts. Pass the previous response's `truncation.next_offset` to fetch the next page. Defaults to 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "sector": {
                "description": "Sector filter (case-insensitive substring) over the SIC-derived, GICS-aligned label (not licensed GICS — see tool description). E.g. 'Technology', 'Energy'.",
                "maxLength": 100,
                "type": "string"
              },
              "ticker": {
                "description": "Check ONE company: a ticker or a CIK (SEC identifier), e.g. 'AAPL' or '0000320193'. Returns that company's row if it was a member on as_of_date, none if it was not. A ticker matches the symbol listed ON that date, and a since-delisted member can carry no ticker at all (enriched=false), so prefer the CIK for historical checks. Omit to list the universe.",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^([A-Za-z][A-Za-z0-9.\\-]{0,9}|\\d{1,10})$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "as_of_date": {
                "type": "string"
              },
              "companies": {
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "complete": {
                "type": "boolean"
              },
              "confidence_summary": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "type": "number"
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "coverage": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "assessed": {
                        "type": "boolean"
                      },
                      "completeness_pct": {
                        "type": "number"
                      },
                      "expected_size": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "returned": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "undercount": {
                        "type": "boolean"
                      }
                    },
                    "required": ["assessed", "completeness_pct", "expected_size", "returned", "undercount"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "coverage_gap": {
                "type": "boolean"
              },
              "index": {
                "type": ["string", "null"]
              },
              "limit_truncated": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "returned_rows": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "sector": {
                "type": ["string", "null"]
              },
              "survivorship_free": {
                "type": "boolean"
              },
              "truncation": {
                "additionalProperties": false,
                "description": "Present only when the inline-row cap withheld rows. Page with `next_offset` (keep the same `limit`) or pull the full set via get_compute_ready_stream.",
                "properties": {
                  "hint": {
                    "type": "string"
                  },
                  "next_offset": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "returned": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "total_available": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "truncated": {
                    "const": true,
                    "type": "boolean"
                  }
                },
                "required": ["hint", "next_offset", "returned", "total_available", "truncated"],
                "type": "object"
              },
              "universe_size": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["_meta", "as_of_date", "companies", "complete", "confidence_summary", "coverage", "coverage_gap", "index", "limit_truncated", "note", "returned_rows", "sector", "survivorship_free", "universe_size"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Point-in-Time Universe"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:41906ebaf28769d8c23ad0181220e79ee616913d41842c0a08b1ca663e5de3d5"
