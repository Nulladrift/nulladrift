        {
          "name": "match_derived",
          "title": "Match Derived Figures",
          "description": "Which verifier: one fact_id → verify_fact_lineage; a list of fact_ids or derived_ids → verify_facts; a number with no id → match_derived; a number quoted from filing text or insider/13F rows → verify_filing_figures; every number in a saved report → verify_report_figures; figures a later filing revised → check_report_figures_current.\n\nCheck whether figures a report STATES can be reproduced by the engine from the SEC facts the report cites. For each `{ token, ticker, fact_ids }` it tries every registered margin, growth, share-of, difference and ratio formula over those facts and compares the rendered result to your token EXACTLY. Use it for a figure that has no `fact_id` or `derived_id` of its own (the model worked it out, or retyped it) — never to invent a figure.\n\nPer item: `cited` (your token is an exact quote of one cited fact's display: cite that `fact_id`), `derived` (exactly one formula reproduces it: cite the returned `derived_id` like a fact_id), `reformatted` (your token is a rounding of a cited fact such as \"$403B\" for \"$402.83B\": quote the returned `display` instead), `ambiguous` (two or more different formulas reproduce it: a person must choose, never auto-pass), `none` (nothing reproduces it: treat as unsupported) or `error` (the cited facts could not be read).\n\nUp to 50 items per call, each with 1–20 cited `fact_ids` (64-char hex, from a tool result) of ONE company; at most 5 distinct companies per call (chunk larger sets). Every fact is read from your own plan's data; `as_of_date` (YYYY-MM-DD) drops facts accepted after it. Read-only; available on all plans.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Point-in-time cut (YYYY-MM-DD): a cited fact accepted after this date is not used.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "items": {
                "description": "The figures to check, 1–50; one call per report, not one per figure.",
                "items": {
                  "properties": {
                    "fact_ids": {
                      "description": "The facts cited near the figure (1–20), exactly as tool results gave them.",
                      "items": {
                        "pattern": "^[0-9a-f]{64}$",
                        "type": "string"
                      },
                      "maxItems": 20,
                      "minItems": 1,
                      "type": "array"
                    },
                    "ticker": {
                      "description": "Ticker or CIK of the company the cited facts belong to.",
                      "maxLength": 10,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9.\\-]+$",
                      "type": "string"
                    },
                    "token": {
                      "description": "The figure exactly as written in the prose, e.g. \"46.21%\" or \"$403B\".",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["fact_ids", "ticker", "token"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "results": {
                "description": "One entry per item, in the order sent.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "candidates": {
                      "description": "outcome ambiguous: the competing candidates (at most 6). Never auto-pass; a person chooses.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "derived": {
                            "additionalProperties": false,
                            "properties": {
                              "formula_id": {
                                "description": "The registered formula, e.g. margin.net@1.",
                                "type": "string"
                              },
                              "inputs": {
                                "description": "The cited facts the figure is recomputed from (`fact_id` is a literal key).",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "fact_id": {
                                      "type": "string"
                                    },
                                    "role": {
                                      "type": "string"
                                    }
                                  },
                                  "required": ["fact_id", "role"],
                                  "type": "object"
                                },
                                "type": "array"
                              }
                            },
                            "required": ["formula_id", "inputs"],
                            "type": "object"
                          },
                          "derived_id": {
                            "description": "A citable id: a `drv1:` derived_id, or a fact_id for a rounding of a cited fact.",
                            "type": "string"
                          },
                          "display": {
                            "type": "string"
                          }
                        },
                        "required": ["derived_id", "display"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "cited_display": {
                      "description": "outcome reformatted from a cited fact: that fact's exact display.",
                      "type": "string"
                    },
                    "cited_fact_id": {
                      "description": "outcome reformatted from a cited fact: that fact's id.",
                      "type": "string"
                    },
                    "derived": {
                      "additionalProperties": false,
