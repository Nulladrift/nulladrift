        {
          "uri": "schema://index_membership",
          "name": "index_membership schema",
          "title": "index_membership table schema",
          "description": "Index constituents keyed on `cik`.  Join `references.cik = index_membership.cik` to attach company metadata (name, sector, ticker).  Filter by `index_name` for the index, and by `effective_date` / `removal_date` for the as-of window (half-open [) semantics).  `cik` is named `cik` here, not `entity_id` as on security, filing and fact.  HISTORICAL DEPTH AND PROVENANCE DIFFER BY INDEX.  Read this before using the table for point-in-time work.  The `source`, `confidence` and `date_precision` columns say how far to trust each row's dates. * SP500: from 1996-01-02.  Membership comes from SEC portfolio filings of index funds (N-PORT and N-CSR) and, for change dates, issuers' 8-Ks, Form 25 / Form 15 and public reports of index changes, plus publicly available constituent lists.  There are about 500 members at every year end from 1996.  Where a change date is not known to the day, the row is a window: `effective_date` is the conservative point (the latest plausible join day, the earliest plausible exit day) and the bounds sit in the `*_earliest` / `*_latest` columns.  Most changes before 2007 are windows.  A change newer than the latest fund filing is `status='provisional'` until a fund filing confirms it, which can take a few months.  Rows with `date_precision` NULL come from an earlier, coarser build; it under-counts the index before about 2006, so grade those rows by `confidence`. * RUSSELL1000 / RUSSELL2000 / RUSSELL3000: from 2000-09-30, `medium` confidence, `source='fund_holdings'`.  Derived from public SEC portfolio filings of funds tracking each index.  Carry these bounds into any conclusion drawn from the Russell rows.  (1) Observation spacing varies: roughly one to four observations a year from 2000 through 2006, monthly from 2007 on, so a join or leave date is only as precise as the interval between observations and is never exact to the day in the early years.  (2) A tracking fund only proxies its index: a few holdings sit outside it and a sampled fund can miss members, so these rows are our derived membership, not the index itself.  (3) There is no Russell data before 2000-09-30; an earlier date returns zero rows because we do not carry it, which does not mean the index was empty.  Confidence is therefore `medium` and never `high`, which leaves the MCP `pit_safe` flag false.  KNOWN GAP: no Russell observation exists between 2016-12-30 and 2017-07-31.  Departures in that period collapse onto 2016-12-31 and arrivals onto 2017-07-31, so the June 2017 reconstitution appears to happen on 31 July, and a year-end 2016 query returns about 2,600 RUSSELL3000 members rather than about 2,900.  SP500 is unaffected.  Index membership is reconstructed independently by Valuein from public information: SEC filings (index funds' N-PORT, N-CSR, N-30D and N-Q schedules; issuers' 8-Ks, Form 25 / 15, 8-K12B), publicly available constituent lists and public reports of index changes; never from an index provider's licensed constituent data. Index names are trademarks of their owners; Valuein is not affiliated with or endorsed by any index provider.",
