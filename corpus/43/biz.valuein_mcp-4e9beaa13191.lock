        {
          "name": "get_peer_comparables",
          "title": "Peer Comparables",
          "description": "Get ratio-based peer comparison for a company and its closest competitors by SIC industry code. Returns pipeline-computed ratios from up to 10 peers alongside the subject company for direct benchmarking. Ratio categories: profitability, liquidity, leverage, efficiency, per_share, owner_earnings, valuation (price-free reference values only). TTM ratios are used when available. The exact 4-digit SIC code is matched first, then the 3- and 2-digit groupings, with S&P 500 members first within each. Each company appears once, under its main listed share class; a candidate with no figures for the period is left out and counted in peers_omitted_no_data. Without as_of_date, peers are companies listed today. With as_of_date, peers are companies listed on that date — including ones delisted since — ranked by S&P 500 membership on that date, and figures are limited to that date: by SEC acceptance time when the ratio data carries it (_meta.pit_safe=true), otherwise by period end (_meta.pit_safe=false). Set peer_universe to sp500_sector to compare against S&P 500 members in the subject's own sector, in ticker order, instead of SIC-code peers. Plan: every plan; without sign-in it compares within the subset that coverage includes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Historical date (canonical cross-tool date param). Peers are the companies listed on this date, including ones delisted since, ranked by S&P 500 membership on this date. Figures are point-in-time by SEC acceptance time when the ratio data carries it (_meta.pit_safe=true), else limited to periods ending on or before this date (_meta.pit_safe=false).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "categories": {
                "default": ["profitability", "valuation", "leverage"],
                "description": "Ratio categories to include in the comparison. Defaults to profitability, valuation, and leverage.",
                "items": {
                  "enum": ["profitability", "liquidity", "leverage", "efficiency", "per_share", "owner_earnings", "valuation"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of peers to return alongside the subject company (1–10). Defaults to 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "peer_universe": {
                "description": "Where peers come from: 'sic' (default) matches SIC industry codes; 'sp500_sector' uses S&P 500 members in the subject's own sector, in ticker order.",
                "enum": ["sic", "sp500_sector"],
                "type": "string"
              },
              "period_end_before": {
                "description": "Alias of as_of_date (as_of_date preferred — the canonical name). Only include ratios with period_end on or before this date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ticker": {
                "description": "Subject company ticker or CIK, e.g. AAPL or '0000320193'. Peers are auto-selected by SIC code.",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.\\-]+$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "as_of_date": {
                "type": ["string", "null"]
              },
              "categories": {
                "description": "Ratio categories included in each peer panel",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "data": {
                "description": "One row per company (subject + peers): ticker, cik, name, sector, industry, is_subject, ratios",
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "lineage": {
                "additionalProperties": false,
                "description": "Provenance for pipeline-derived values (ratio.parquet / factor_scores.parquet): source table + pipeline computed_at, plus a pointer to the tools that return filing-level lineage. NOT point-in-time (recomputed on each pipeline run).",
                "properties": {
                  "computed_at": {
                    "type": "string"
                  },
                  "derivation": {
                    "const": "pipeline_computed",
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "pit_safe": {
                    "type": "boolean"
                  },
                  "source_table": {
                    "type": "string"
                  },
                  "verify_with": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["derivation", "note", "pit_safe", "source_table", "verify_with"],
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "peers_omitted_no_data": {
                "description": "Candidate peers left out because they had no ratio figures for the period; each was replaced by the next-closest candidate",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "peers_returned": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "period_end_before": {
                "type": ["string", "null"]
              },
              "subject": {
                "description": "Subject ticker the peer set is built around",
                "type": "string"
