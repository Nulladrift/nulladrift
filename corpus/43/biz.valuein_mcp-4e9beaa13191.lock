                "minimum": -0.05,
                "type": "number"
              },
              "three_statement_assumptions": {
                "description": "Only used when fcf_source is \"three_statement\". Overrides for the underlying projection; unset fields use project_three_statement's defaults.",
                "properties": {
                  "cash_sweep_pct": {
                    "description": "Default 0.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "dividend_payout_pct": {
                    "description": "Default 0.",
