        {
          "name": "submit_artifact_feedback",
          "title": "Submit Artifact Feedback",
          "description": "File EXPLICIT, structured feedback about a specific artifact you (or the model) produced — a chat message, a report, a tool call, or the schema. Never quote or paste the person's research (report text, notes, uploaded documents, watchlists, agent memory, or figures from their reports): it is private and theirs. Describe the problem in your own words and point at it by id (target_id, request_id, fact_id with its ticker). Use this (not `submit_feedback`) when you can name WHAT was judged and HOW: pass `target_type` + `target_id` + a `sentiment` (positive/negative/correction), and optionally a structured `reason` (e.g. wrong_number, bad_citation, hallucinated_fact), the `request_id` of the turn, the disputed `fact_id` WITH its `ticker`, and an `expected_value` (the value it SHOULD have been, in your words). Plan: every plan, including no sign-in. This is a one-way intake channel — it records your assertion, it NEVER computes or validates a number, and `expected_value` is stored verbatim, never trusted as data. Retried submissions of the same judgement on the same `request_id` file exactly once. Returns the recorded feedback id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "expected_value": {
                "description": "Optional: what the value SHOULD have been, in your own words. Stored verbatim for triage — NEVER computed, restated, or trusted as data by Valuein. The person's own words about the product, or yours; never a copy of their research.",
                "maxLength": 4000,
                "type": "string"
              },
              "fact_id": {
                "description": "Optional disputed `fact_id` (most useful for wrong_number / bad_citation).",
                "maxLength": 256,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional explicit dedupe key (1–64 chars). Used to dedupe when no `request_id` is supplied; safe to retry on a network error.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "description": "Optional free-text detail (≤4000 chars). What you expected and what happened. The person's own words about the product, or yours; never a copy of their research.",
                "maxLength": 4000,
                "type": "string"
              },
              "reason": {
                "description": "Optional structured error-mode: 'wrong_number', 'bad_citation', 'missing_data', 'wrong_company', 'formatting', 'hallucinated_fact', 'tool_error', 'coverage_gap', or 'other'.",
                "enum": ["wrong_number", "bad_citation", "missing_data", "wrong_company", "formatting", "hallucinated_fact", "tool_error", "coverage_gap", "other"],
                "type": "string"
              },
              "request_id": {
                "description": "Optional `_meta` request id of the turn that produced the artifact. Folded into the idempotency key so a retried submission of the same judgement files once.",
                "maxLength": 256,
                "type": "string"
              },
              "sentiment": {
                "description": "REQUIRED. How you judge the artifact: 'positive' (it was right/useful), 'negative' (it was wrong/unhelpful), or 'correction' (you are supplying the right value via `expected_value`).",
                "enum": ["positive", "negative", "correction"],
                "type": "string"
              },
              "target_id": {
                "description": "REQUIRED. The id of the artifact this feedback targets (a report id, message id, tool-call id, or table/schema name).",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "target_type": {
                "description": "REQUIRED. The kind of artifact this feedback is about: 'chat_message', 'report', 'tool_call', 'schema', or 'other'.",
                "enum": ["chat_message", "report", "tool_call", "schema", "other"],
                "type": "string"
              },
              "ticker": {
                "description": "Optional ticker the disputed figure belongs to (e.g. 'AAPL', 'BRK.B'). ALWAYS send this alongside `fact_id` — a `fact_id` is a one-way hash that does not contain the symbol, so without it nobody can locate the filing and your report cannot be checked against the source. Supplying it is what turns a complaint into a verifiable one.",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[A-Za-z][A-Za-z0-9.\\-]{0,9}$",
                "type": "string"
              }
            },
            "required": ["sentiment", "target_id", "target_type"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
