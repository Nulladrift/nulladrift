        {
          "name": "get_sec_filing_links",
          "title": "SEC Filing Links",
          "description": "Get direct links to original SEC EDGAR filings for any US public company. Returns four per-filing deep links: `sec_url` (the EDGAR filing-index page listing every document), `viewer_url` (the cgi-bin Financial-Report viewer for the specific accession), `inline_viewer_url` (the SEC Inline-XBRL viewer opened on the rendered primary document — the strongest provenance link, `null` when the filing is not Inline-XBRL), and `document_url` (a direct link to the rendered primary document itself — opens the actual filing, never the index page, `null` only when primary_document is unknown). Prefer `inline_viewer_url ?? document_url ?? viewer_url ?? sec_url`. Supported form_types (enum): 10-K, 10-Q, 8-K, 20-F, 40-F, 10-K/A, 10-Q/A, 20-F/A, 40-F/A. Other forms (6-K, DEF 14A, Form 4, 13F) are NOT yet exposed by this tool — use `describe_schema` to confirm the parquet has them, then read raw via the SDK. 8-K item codes are filterable via `event_types` (e.g. ['2.02'] for earnings, ['1.01'] for material agreements, ['5.02'] for officer changes). PIT-safe — filings are filtered by accepted_at, never by report_date alone. Use this *instead of* `verify_fact_lineage` when you want a list of filings; use `verify_fact_lineage` when you want one specific fact-to-filing trace. Available on all plans. Free-plan freshness: sample and sp500 (Benchmark) data lists the day's filings at end of day (20:00 America/New_York), not in real time; real-time filing data is a Pro/Institutional feature.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "end_date": {
                "description": "Inclusive upper bound on filing_date (YYYY-MM-DD). E.g. '2023-12-31'.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "event_types": {
                "description": "8-K item codes to filter by. E.g. ['1.01'] for material agreements, ['2.01'] for asset acquisitions, ['5.02'] for director/officer changes. Only relevant when form_types includes '8-K'.",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "form_types": {
                "default": ["10-K", "10-Q"],
                "description": "Filing form types to include. Defaults to 10-K and 10-Q.",
                "items": {
                  "enum": ["10-K", "10-Q", "8-K", "20-F", "40-F", "10-K/A", "10-Q/A", "20-F/A", "40-F/A"],
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of filings to return (1–50). Defaults to 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "description": "Inclusive lower bound on filing_date (YYYY-MM-DD). E.g. '2023-01-01'.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ticker": {
                "description": "Stock ticker symbol, e.g. AAPL, MSFT — or a CIK (SEC identifier), e.g. '0000320193'.",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.\\-]+$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
