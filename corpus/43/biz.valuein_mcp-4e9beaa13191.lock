                  },
                  "required": ["args", "data", "status", "tool"],
                  "type": "object"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["_meta", "as_of_date", "company", "degraded", "filing", "note", "pack", "reading_list", "sections"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
