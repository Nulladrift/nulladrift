                        },
                        "inputs": {
                          "description": "The cited facts the figure is recomputed from (`fact_id` is a literal key).",
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "fact_id": {
                                "type": "string"
                              },
                              "role": {
                                "type": "string"
                              }
                            },
                            "required": ["fact_id", "role"],
                            "type": "object"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["formula_id", "inputs"],
                      "type": "object"
                    },
                    "derived_id": {
                      "description": "outcome derived (or a derived reformatted): the citation id to use, like a fact_id.",
                      "type": "string"
                    },
                    "display": {
                      "description": "The exact rendering to quote (derived, reformatted).",
                      "type": "string"
                    },
                    "error": {
                      "additionalProperties": false,
                      "description": "outcome error: ENTITLEMENT_DENIED, INPUT_NOT_FOUND (no cited fact readable at as_of_date) or a transient code.",
                      "properties": {
                        "code": {
                          "type": "string"
                        },
                        "message": {
                          "type": "string"
                        }
                      },
                      "required": ["code", "message"],
                      "type": "object"
                    },
                    "fact_id": {
                      "description": "outcome cited: the cited fact whose display the token quotes exactly.",
                      "type": "string"
                    },
                    "outcome": {
                      "description": "cited = the token is an exact quote of exactly one cited fact's display; derived = exactly one candidate reproduces the token; reformatted = the token is a rounding of a cited fact or derived figure, quote `display` instead; ambiguous = two or more different candidates reproduce it; none = nothing reproduces it; error = the cited facts could not be read.",
                      "enum": ["cited", "derived", "reformatted", "ambiguous", "none", "error"],
                      "type": "string"
                    },
                    "rounded": {
                      "description": "outcome derived: true when the token is a rounding (2+ significant digits) of `display`, the engine's unrounded figure.",
                      "type": "boolean"
                    },
                    "ticker": {
                      "description": "The uppercased ticker (or CIK) the item asked about.",
                      "type": "string"
                    },
                    "token": {
                      "description": "The figure exactly as you sent it.",
                      "type": "string"
