        {
          "name": "get_valuation_metrics",
          "title": "Valuation Metrics",
          "description": "Get the profitability, cash-flow and leverage metrics of a US public company, plus two parameter-free reference points. No price-based multiple is published, so none is returned and you must never compute one; if the user needs a price, ask for it and label it user-supplied. This is NOT an opinion of intrinsic worth — for that, call `compute_dcf` with assumptions you state explicitly, and present the result as a scenario, never as \"the\" fair value. Returns per-period data combining computed ratios (gross_margin, operating_margin, net_margin, ROE, ROA, ROIC, debt_to_equity, FCF, FCF margin) and reference_points (graham_number, ncav_per_share) — two assumption-free values computed directly from filed fundamentals, with no discount rate or growth assumption baked in. Profitability/cash-flow/leverage fields come from fact.parquet (PIT-safe via accepted_at). reference_points come from ratio.parquet's `valuation` category, precomputed at each fiscal period end from SEC filings data. A share price comes from `get_price_history` (a graded daily close: cite its date, grade and source) or from the user, never from memory; for a multiple on it use `compute_price_multiples`, and call a user's price user-supplied with its date. Each value is a `{value, unit}` pair (unit varies: x / USD / percent); a null value carries a `null_reasons[field]` code — ALWAYS check it before assuming zero (null != 0). Use this *instead of* `get_financial_ratios` when the reference points matter; use `get_financial_ratios` when you only need the raw ratio table; use `compute_dcf` whenever the user is asking what the company is WORTH. Available on all plans.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Point-in-time date (YYYY-MM-DD). Only returns data with accepted_at on or before this date. Eliminates look-ahead bias for backtesting.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
