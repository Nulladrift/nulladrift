        {
          "name": "get_insider_transactions",
          "title": "Insider Transactions",
          "description": "Form 3 / 4 / 5 / 144 line items for a US public company. Returns each transaction (or initial holding / proposed sale) with the insider's name, role, transaction code, share count, price, and notional.  Filters by lookback window, transaction code (P=purchase, S=sale, A=grant, M=option exercise, F=tax withholding, etc.), insider role, and minimum share threshold. Institutional plan only — every other plan gets ENTITLEMENT_DENIED with an upgrade link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Point-in-time date (YYYY-MM-DD).  Only returns transactions with accepted_at <= this date — eliminates look-ahead bias.  When set, lookback_days is ignored.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Maximum rows to return. Default 100, max 500.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "lineage_detail": {
                "default": "compact",
                "description": "Per-row provenance envelope. 'compact' (default) returns source_filing + source_url. 'full' adds accepted_at. 'off' omits lineage.",
                "enum": ["off", "compact", "full"],
                "type": "string"
              },
              "lookback_days": {
                "default": 90,
                "description": "How many days back from today to scan transactions for. Ignored when as_of_date is set.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "min_shares": {
                "description": "Minimum |shares| per transaction. Omit for no floor.",
                "minimum": 0,
                "type": "number"
              },
              "roles_in": {
                "description": "Insider roles to keep. Omit to include any role.",
                "items": {
                  "enum": ["Officer", "Director", "TenPercentOwner", "Other"],
                  "type": "string"
                },
                "type": "array"
              },
              "ticker": {
                "description": "Stock ticker symbol, e.g. AAPL, MSFT, BRK.B — or a CIK (SEC identifier), e.g. '0000320193'.",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.\\-]+$",
                "type": "string"
              },
              "transaction_codes": {
                "description": "SEC transaction codes to keep (uppercase, single-letter):  P=purchase, S=sale, A=grant, M=option exercise, F=tax withholding, G=gift, J=other.  Unknown codes are rejected.  Omit to include all codes.",
                "items": {
                  "enum": ["P", "S", "A", "M", "F", "G", "J"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "cik": {
                "type": "string"
              },
