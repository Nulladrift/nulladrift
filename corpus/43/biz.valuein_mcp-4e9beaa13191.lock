                    "required": ["buy_usd", "net_weighted_usd", "sell_usd"],
                    "type": "object"
                  },
                  "institutional": {
                    "additionalProperties": false,
                    "properties": {
                      "component_basis_current_shares": {
                        "description": "Current shares of the top-5 filers — the basis used for the component.",
                        "type": "number"
                      },
                      "component_basis_prior_shares": {
                        "description": "Prior-quarter shares of the SAME top-5 filers (matched basis).",
                        "type": "number"
                      },
                      "covered_book_shares": {
                        "description": "Sum of shares across all covered (top-N) 13F holders — informative.",
                        "type": "number"
                      },
                      "net_change_shares": {
                        "description": "Top-5 matched-basis QoQ share change.",
                        "type": "number"
                      }
                    },
                    "required": ["component_basis_current_shares", "component_basis_prior_shares", "covered_book_shares", "net_change_shares"],
                    "type": "object"
                  }
                },
                "required": ["blockholder", "insider", "institutional"],
                "type": "object"
              },
              "composite_score": {
                "type": "number"
              },
              "coverage": {
                "additionalProperties": false,
                "description": "Honesty block: the institutional signal is computed from a top-N 13F slice with a top-5-filer matched basis. Surfaces holder coverage + staleness so the composite is never read as the issuer's complete book.",
                "properties": {
                  "component_basis_filers_matched": {
                    "description": "Count of top-5 filers that had an observable prior-quarter book.",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "coverage_confidence": {
                    "description": "Fraction of the top-5 basis with an OBSERVABLE prior-quarter book (matched filers / 5). 0 → institutional_component is forced to 0 (no honest QoQ basis), so a 13F ingestion gap can never masquerade as a saturated buy signal.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "data_age_days": {
                    "type": ["number", "null"]
                  },
                  "institutional_component_basis": {
                    "type": "string"
                  },
                  "institutional_holders_covered": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "institutional_is_partial": {
                    "description": "True when the top-N cap was hit — the 13F book is only partially covered.",
                    "type": "boolean"
                  },
                  "institutional_topn_cap": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "note": {
                    "type": "string"
                  },
                  "staleness_warning": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["component_basis_filers_matched", "coverage_confidence", "data_age_days", "institutional_component_basis", "institutional_holders_covered", "institutional_is_partial", "institutional_topn_cap", "note", "staleness_warning"],
                "type": "object"
              },
              "insider_component": {
                "type": "number"
              },
              "institutional_component": {
                "type": "number"
              },
              "metrics_display": {
                "additionalProperties": {
                  "type": ["string", "null"]
                },
                "description": "The scores, insider dollar flows and institutional share counts rendered for prose, keyed by field path ('composite_score', 'components.insider.sell_usd', 'components.institutional.net_change_shares'). QUOTE THESE VERBATIM.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "period_end": {
                "description": "The institutional 13F REPORTING period — NOT a point-in-time cutoff.",
                "type": ["string", "null"]
              },
              "ticker": {
                "type": "string"
              },
              "weights": {
                "additionalProperties": false,
                "properties": {
                  "blockholder": {
                    "type": "number"
                  },
                  "insider": {
                    "type": "number"
                  },
                  "institutional": {
                    "type": "number"
                  }
                },
                "required": ["blockholder", "insider", "institutional"],
                "type": "object"
              }
            },
            "required": ["_meta", "as_of_date", "blockholder_component", "cik", "company_name", "components", "composite_score", "coverage", "insider_component", "institutional_component", "period_end", "ticker", "weights"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Smart Money Flow"
          },
          "behavior": {
