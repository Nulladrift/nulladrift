        {
          "name": "run_backtest",
          "title": "Run Bounded Factor Backtest",
          "description": "A SMALL, BOUNDED, in-Worker sanity-check backtest — NOT a full-universe backtesting engine. Answers a quick question like 'does this factor actually work on these 5 names over the last year' inline, mid-conversation, without leaving MCP. Composes two existing tools (`get_pit_universe` + `get_pit_valuation_ratios`) across up to 10 tickers x 12 rebalance dates (120 cells): for each rebalance date, checks which requested tickers were in the survivorship-free PIT universe on that date (dropping — never erroring on — a ticker not yet listed or already delisted), then pulls each surviving ticker's point-in-time TTM margins. Returns a flat {rebalance_date, ticker, factor_values} grid (no forward returns are computed: the tool takes no price input) — a quick cross-sectional factor snapshot, NOT a transaction-cost-aware portfolio simulation or a statistically validated backtest result. If the requested grid exceeds 120 cells, this tool does NOT silently truncate — it returns a `stream_fallback` response (signed Parquet download URLs, same shape as `get_compute_ready_stream`) and tells you to use those URLs. For a REAL full-universe, multi-date, survivorship-free backtest, use the Python SDK's AlphaEngine (`pip install valuein-sdk`) looped over `as_of` dates client-side — this tool is explicitly the small complement to that, not a replacement for it. Pro and Institutional only: it composes get_pit_valuation_ratios (TTM financials), which needs the Pro plan, so the free plans receive an ENTITLEMENT_DENIED upgrade envelope before any read. Coverage follows your plan tier same as the two tools it composes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "factors": {
                "description": "Which of get_pit_valuation_ratios's own output fields to include as factor_values. One or more of: gross_margin_pct, operating_margin_pct, net_margin_pct. Omit to include all of them.",
                "items": {
                  "enum": ["gross_margin_pct", "operating_margin_pct", "net_margin_pct"],
                  "type": "string"
                },
                "type": "array"
              },
              "rebalance_dates": {
                "description": "1-12 historical dates (YYYY-MM-DD) to snapshot TTM margins on. Order does not matter — the tool sorts them chronologically. Forward return is computed from each date to the NEXT one in the sorted list.",
                "items": {
                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "tickers": {
                "description": "1-10 stock ticker symbols, e.g. [\"AAPL\",\"MSFT\"].",
                "items": {
                  "maxLength": 10,
                  "minLength": 1,
                  "pattern": "^([A-Za-z][A-Za-z0-9.\\-]{0,9}|\\d{1,10})$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["rebalance_dates", "tickers"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
