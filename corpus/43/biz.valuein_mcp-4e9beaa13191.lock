        {
          "name": "dcf_build_flow",
          "title": "DCF Build (Disciplined)",
          "description": "Disciplined forward-DCF construction for a single ticker — pulls reported history, justifies each assumption (growth, a WACC the user gives or you state, terminal growth) against history + peers, calls `compute_dcf`, and renders the full per-share value + 5×5 sensitivity grid. Wraps Valuein's existing `compute_dcf` math tool with verify-at-each-step discipline. Adapted from anthropics/financial-services financial-analysis/dcf-model.",
          "arguments": [
            {
              "name": "ticker",
