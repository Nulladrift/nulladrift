        {
          "name": "render_report",
          "title": "Render Report Download URL",
          "description": "Return a 15-minute presigned download URL for a report in the requested binary format.\n\n`format=md` presigns the cached markdown — instant, no compute. `format=docx` and `format=pdf` return the SAME branded research-note design in the two media: a masthead-first page 1 (Valuein letterhead — brand rule, wordmark, 'EQUITY RESEARCH' kicker + date), the ticker eyebrow and title, the named analyst's byline, then the body (abstract, sections with full markdown incl. GFM tables, citations table with clickable SEC EDGAR links) and a running footer (ticker, 'Built on Valuein · valuein.biz', page N of M, one disclosure line). The PDF embeds the Geist brand faces with figures set in tabular mono. Binary renders are cached in R2 after first build so repeat downloads are instant; pass `force_regenerate: true` to bust the cache (e.g. right after `update_report`).\n\nTier gate mirrors `get_report`: authors always see their own reports; non-authors below the report's required tier get an upgrade prompt.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "author_name": {
                "description": "Display name of the report's author, shown as a named byline ('By {name}') on the masthead — the way a real research note credits an analyst. Omit to show 'Valuein Research'. Only affects the binary formats; ignored on a cache hit (the cached file keeps whatever byline was baked in on first render — pass `force_regenerate: true` to refresh it).",
                "maxLength": 120,
                "type": "string"
              },
              "force_regenerate": {
                "default": false,
                "description": "If true, ignore the cached DOCX/PDF and re-render. No effect on md (markdown is canonical).",
                "type": "boolean"
              },
              "format": {
                "description": "md = raw markdown (the same body the editor renders). docx = branded Word document; pdf = the same branded research-note design as a shareable PDF (Geist faces embedded, clickable citation links).",
                "enum": ["md", "docx", "pdf"],
                "type": "string"
              },
              "report_id": {
                "description": "Id from create_report or list_my_reports.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
