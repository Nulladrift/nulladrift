        {
          "name": "get_capital_allocation_profile",
          "title": "Capital Allocation Profile",
          "description": "Get a multi-year capital allocation breakdown for a US public company. Shows how management deploys cash across all six categories — capex, R&D, M&A, dividends, buybacks, and debt — plus pre-computed deployment ratios (% of operating cash flow) and over-distribution flags. Use this tool when the user asks: how does a company allocate capital, what's the buyback-vs-dividend mix, is the company over-distributing, is growth funded by R&D or M&A, what's the cash-return-ratio trend, or any 'where does the money go' question — including owner-earnings (Buffett-style) and reinvestment-rate (Damodaran-style) analysis. Data sourced from annual 10-K filings; PIT-safe via as_of_date. R&D is included as a deployment category (the primary growth-reinvestment vehicle for knowledge-economy firms), but since it's already deducted before operating cash flow, `rd_pct_ocf` is INFORMATIONAL and `total_deployment_pct_ocf` EXCLUDES R&D to preserve the cash-flow identity (OCF = capex + M&A + dividends + buybacks + debt repayment + Δcash). The `flags` object carries pre-computed booleans: `buybacks_exceed_fcf`, `total_returns_exceed_fcf` (buybacks + dividends > FCF), and `debt_funded_distribution` (over-distribution funded by leverage vs cash). `sbc` is stock-based compensation (the cash-flow add-back), with `sbc_pct_ocf` and `sbc_pct_revenue` (fractions, each cited by derived_id); `sbc` is null, never 0, when the filer reports no SBC fact. Available on all plans.",
