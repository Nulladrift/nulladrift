                      "type": "string"
                    },
                    "as_of": {
                      "description": "When the price was observed, ISO 8601 with offset. Default: 16:00 America/New_York on price_date.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "cik": {
                      "description": "SEC Central Index Key of the company. Preferred over a ticker.",
                      "maxLength": 16,
                      "type": "string"
                    },
                    "close": {
                      "description": "Closing price per share, in `currency`: above 0, at most 10,000,000, at most 8 decimal places.",
                      "type": "number"
                    },
                    "currency": {
                      "description": "ISO 4217 currency of the close, e.g. USD.",
                      "maxLength": 8,
                      "type": "string"
                    },
                    "fx_rate": {
                      "description": "Units of the company's reporting currency per 1 unit of `currency`; needed when the currencies differ. Also yours.",
                      "type": "number"
                    },
                    "price_date": {
                      "description": "Date the close belongs to, YYYY-MM-DD. Required: a price without a date is refused.",
                      "maxLength": 32,
                      "type": "string"
                    },
                    "source_label": {
                      "description": "Your own note on where the price came from, at most 64 characters. Shown as yours.",
                      "maxLength": 256,
                      "type": "string"
                    },
                    "ticker": {
                      "description": "Ticker, resolved to the company that held it ON price_date (recycled tickers map by date).",
                      "maxLength": 16,
                      "type": "string"
                    }
                  },
                  "required": ["close", "currency", "price_date"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["prices"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "price_inputs_echo": {
                "items": {
