        {
          "name": "compute_dcf",
          "title": "Compute Forward DCF",
          "description": "Forward discounted-cash-flow valuation (two-stage Gordon-growth model) under YOUR assumptions: you give stage-1 growth, WACC, terminal growth and horizon; it returns the per-share intrinsic value (`value_per_share_cents`, cents of `result.reporting_currency`, never converted) and a 5×5 WACC × terminal-growth sensitivity grid. Valuein publishes no precomputed DCF, DDM or fair value: this tool is the only intrinsic value, and it is a scenario under the stated assumptions: a different discount rate is a different answer, so where it matters run more than one set of assumptions and give the range. In prose quote `result.metrics_display` verbatim (e.g. \"$249.17\"; each grid cell carries `value_per_share_display`), never the cents, and state the assumptions beside it. Inputs pulled from the filings (any can be overridden): FCF base = operating_cash_flow − capex; net_debt = total_debt − (cash + short-term investments), with `result.net_debt_basis` saying whether it was reported or assumed; shares = CommonSharesOutstanding, else net_income / eps_diluted (`result.shares_source`). Use the returned net debt, shares and bridge; never recompute them. `result.inputs_echo` and `result.inputs_provenance` cite each input's `fact_id` (the FCF base carries a `derived_id`). When every input came from cited facts (fcf_source \"trend\", no override) `result.outputs_provenance.value_per_share.derived_id` and each grid cell's `derived_id` encode your assumptions so the arithmetic can be re-derived: cite them beside the figure. An override, a three_statement run or a degenerate model ships no id: quote those as your own assumptions. A null `value_per_share_cents` (WACC ≤ terminal growth, FCF base ≤ 0, or a missing input) is NOT a zero valuation; `reason` explains. Optional `share_price` (a price the user gave, with its date) adds `result.upside_pct`. `fcf_source: \"three_statement\"` feeds the linked projection of `project_three_statement` into the same PV math (`stage1_growth_rate` then ignored; detail in `three_statement_detail`). Persists nothing: use `create_report` (report_type 'reverse_dcf') to save. Plan: Benchmark and above.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Point-in-time cutoff (YYYY-MM-DD) for the auto-pulled inputs. Fundamentals are filtered by SEC accepted_at (strict PIT). Omit to use the latest knowable inputs.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fcf_base_override": {
                "description": "Override the auto-pulled FCF base (USD). Leave unset to use R2-derived.",
                "type": "number"
              },
              "fcf_source": {
                "default": "trend",
                "description": "\"trend\" (default): compound fcf_base by stage1_growth_rate every year (unchanged original behavior). \"three_statement\": derive the FCF stream from a full linked 3-statement projection instead — see the tool description for details.",
                "enum": ["trend", "three_statement"],
                "type": "string"
              },
              "share_price": {
                "description": "Optional share price YOU supply (never from memory) for the company valued, same fields as a `compute_price_multiples` row (cik optional, ticker not used). Adds `result.upside_pct`: the DCF value per share against your price, with the price and its date in the figure's `derived_id`. Call it your price, user-supplied, with its date.",
                "properties": {
                  "adjusted_through": {
                    "description": "For split_adjusted: the date the adjustment runs to (YYYY-MM-DD).",
                    "maxLength": 32,
                    "type": "string"
                  },
                  "adjustment": {
                    "description": "How the close was adjusted; default raw. split_adjusted needs adjusted_through. total_return is refused for multiples.",
                    "enum": ["raw", "split_adjusted", "total_return"],
                    "type": "string"
                  },
                  "as_of": {
                    "description": "When the price was observed, ISO 8601 with offset. Default: 16:00 America/New_York on price_date.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "cik": {
                    "description": "SEC Central Index Key of the company. Preferred over a ticker.",
                    "maxLength": 16,
                    "type": "string"
                  },
                  "close": {
                    "description": "Closing price per share, in `currency`: above 0, at most 10,000,000, at most 8 decimal places.",
                    "type": "number"
                  },
                  "currency": {
                    "description": "ISO 4217 currency of the close, e.g. USD.",
                    "maxLength": 8,
                    "type": "string"
                  },
                  "fx_rate": {
                    "description": "Units of the company's reporting currency per 1 unit of `currency`; needed when the currencies differ. Also yours.",
                    "type": "number"
                  },
                  "price_date": {
                    "description": "Date the close belongs to, YYYY-MM-DD. Required: a price without a date is refused.",
                    "maxLength": 32,
                    "type": "string"
                  },
                  "source_label": {
                    "description": "Your own note on where the price came from, at most 64 characters. Shown as yours.",
                    "maxLength": 256,
                    "type": "string"
                  }
                },
                "required": ["close", "currency", "price_date"],
                "type": "object"
              },
              "shares_override": {
                "description": "Override shares outstanding. Leave unset to use R2-derived.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "stage1_growth_rate": {
                "description": "Stage-1 FCF growth rate (e.g. 0.12 = 12%/yr).",
                "maximum": 1,
                "minimum": -0.5,
                "type": "number"
              },
              "stage1_years": {
                "default": 5,
                "description": "Number of explicit high-growth projection years before the terminal stage (3–15). Defaults to 5.",
                "maximum": 15,
                "minimum": 3,
                "type": "integer"
              },
              "terminal_growth_rate": {
                "default": 0.025,
