                    "type": "number"
                  },
                  "tax_rate": {
                    "description": "Default 0.21.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "ticker": {
                "description": "Stock ticker symbol of the company to value, e.g. AAPL, MSFT, BRK.B.",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              },
              "wacc": {
                "default": 0.09,
                "description": "Discount rate. Default 0.09.",
