        {
          "name": "get_smart_money_flow",
          "title": "Smart Money Flow (composite)",
          "description": "Composite flow score on [-100, +100] aggregating insider transactions, 13F institutional Δ-shares vs the prior quarter, and SC 13D/13G blockholder changes over a lookback window. Each component normalised independently, then combined with configurable weights (default: institutional 0.4, blockholder 0.4, insider 0.2). Returns per-component attribution so an agent can see WHY the score is what it is — not just the headline number. NOTE: the institutional component is a QoQ share-change signal computed over the top-5 13F filers on a MATCHED current-vs-prior basis (a filer only counts when its prior-quarter book is observable), NOT the issuer's complete institutional book — treat the score as a directional signal, not an exact flow. `coverage.coverage_confidence` (0–1) reports how much of that basis had a real prior quarter; when it is 0 the institutional component is forced to 0 so a 13F ingestion gap can never surface as a false max-conviction buy. See the `coverage` block for holder coverage + staleness. The score is a unitless composite, not a dollar figure. Institutional plan only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Point-in-time cutoff (YYYY-MM-DD) applied to all three legs (institutional, insider, blockholder) via SEC accepted_at — filings accepted after this date are excluded so the composite is computed with zero look-ahead. Omit for the latest knowable signal.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "lookback_days": {
                "default": 90,
                "description": "Lookback window for insider + blockholder components. Default 90.",
                "maximum": 3650,
                "minimum": 30,
                "type": "integer"
              },
              "ticker": {
                "description": "Issuer ticker symbol — or a CIK (SEC identifier).",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.\\-]+$",
                "type": "string"
              },
              "weight_blockholder": {
                "default": 0.4,
                "description": "Weight applied to the blockholder component (0–1).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "weight_insider": {
                "default": 0.2,
                "description": "Weight applied to the insider component (0–1).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "weight_institutional": {
                "default": 0.4,
                "description": "Weight applied to the institutional component (0–1).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "as_of_date": {
                "description": "The point-in-time cutoff actually applied (echo of the as_of_date input). Null when no PIT cut was requested — never the reporting period_end fabricated as a cutoff.",
                "type": ["string", "null"]
              },
              "blockholder_component": {
                "type": "number"
              },
              "cik": {
                "type": "string"
              },
              "company_name": {
                "type": "string"
              },
              "components": {
                "additionalProperties": false,
                "properties": {
                  "blockholder": {
                    "additionalProperties": false,
                    "properties": {
                      "going_active_count": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "net_percent_change": {
                        "type": "number"
                      }
                    },
                    "required": ["going_active_count", "net_percent_change"],
                    "type": "object"
                  },
                  "insider": {
                    "additionalProperties": false,
                    "properties": {
                      "buy_usd": {
                        "type": "number"
