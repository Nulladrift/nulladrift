        {
          "name": "search_companies",
          "title": "Search Companies",
          "description": "Search for US public companies by name, ticker symbol, CIK (SEC identifier), or SIC industry code. Returns ticker, company name, sector, industry, exchange, and current S&P 500 membership status. Use this tool to resolve a company name to ticker/CIK before calling `get_company_fundamentals`, `get_valuation_metrics`, or other tools that require a ticker — they do not fuzzy-match company names.\n\n**Use this tool — NOT `get_pit_universe` — when the user asks about CURRENT S&P 500 members.** To list current S&P 500 members, call `search_companies({ is_sp500: true })` (the `is_sp500` filter is itself a valid search parameter, so no other input is required). This returns the live snapshot as of query time. Example: \"List 5 current S&P 500 members\" → call `search_companies({ is_sp500: true, limit: 5 })`.\n\n**Use `get_pit_universe` ONLY when the user explicitly needs a survivorship-free historical universe as of a specific past date** (e.g. \"S&P 500 members as of March 2018\"). If the user says \"current,\" \"today,\" \"now,\" or gives no date, use `search_companies` instead.\n\n**One ticker can return two rows.** A CIK identifies a *registrant*, not a company, so a reincorporation or holdco reorganisation moves the ticker to a NEW CIK while the filing history stays under the old one. Both rows are real. Use `is_active` to tell them apart: `true` is the current listing, `false` is the superseded one and carries `listed_until`. Prefer `is_active` over `status` — `status` is an entity-level flag that is unreliable in both directions.\n\n**Data details:** `sic_code` is the 4-digit SIC; `industry` is the human-readable label. `sector` is SIC-derived with GICS-style labels — NOT licensed GICS, so industrial conglomerates may map differently from official GICS (e.g. 3M → 'Health Care' by SIC vs Industrials by GICS). Current S&P 500 membership comes from the point-in-time membership history (a member with no removal date). Plan: every plan, including no sign-in.\n\n**CIK is the canonical, stable identifier — prefer it for backtests and archival work.** A ticker can be retired and later RECYCLED to an unrelated company (DEC is now Diversified Energy, AMR is Alpha Metallurgical, ARC is a document company today), so a ticker-only reference can silently drift to the wrong issuer years later. A purely-numeric `query` (or the dedicated `cik` param) resolves by CIK. Every company-scoped tool (`get_company_fundamentals`, `get_financial_ratios`, `get_valuation_metrics`, etc.) accepts the `cik` this tool returns in place of `ticker` — carry it forward across a multi-step workflow instead of re-resolving by ticker each call. `include_inactive` defaults to `true`: this is a survivorship-free product, so delisted/superseded listings are never hidden by default.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cik": {
                "description": "SEC CIK identifier (exact match). E.g. '0000320193' for Apple.",
                "pattern": "^\\d{1,10}$",
                "type": "string"
              },
              "include_inactive": {
                "default": true,
                "description": "Whether delisted / superseded listings may appear in results. Defaults to true — this is a survivorship-free product, so a search must not silently hide dead companies by default. Set to false to restrict to currently-active listings only (equivalent to `is_active: true`, but as a search-scope toggle rather than a hard filter). If `is_active` is also supplied, `is_active` wins.",
                "type": "boolean"
              },
              "is_active": {
                "description": "Filter on whether the LISTING is current. true = currently trading; false = superseded listings only (delisted, or a ticker that moved to a new registrant). Omit to return both.",
                "type": "boolean"
              },
              "is_sp500": {
                "description": "Filter to current S&P 500 members only.",
                "type": "boolean"
              },
              "limit": {
                "default": 25,
                "description": "Maximum number of results to return (1–50). Defaults to 25.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search over company name and ticker. Case-insensitive. E.g. 'Apple', 'AAPL', 'Microsoft', 'semiconductor'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "sic_code": {
                "description": "4-digit SIC industry code. E.g. '7372' for Prepackaged Software.",
                "pattern": "^\\d{4}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "companies": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cik": {
                      "type": "string"
                    },
                    "exchange": {
                      "type": ["string", "null"]
                    },
                    "industry": {
                      "type": ["string", "null"]
                    },
                    "is_active": {
                      "description": "Whether THIS listing is the current one for its ticker. When a company reincorporates or forms a holdco, SEC issues a new CIK and moves the ticker to it, so one symbol can return two rows — the superseded listing (false, with `listed_until` set) and the current one (true).",
                      "type": "boolean"
                    },
                    "is_sp500": {
                      "type": "boolean"
                    },
                    "listed_until": {
                      "description": "Date this listing stopped being current, or null while it still is. Non-null means the ticker moved to another registrant or the security was delisted.",
                      "type": ["string", "null"]
                    },
                    "match_confidence": {
