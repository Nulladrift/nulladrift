        {
          "name": "verify_fact_lineage",
          "title": "Verify Fact Lineage",
          "description": "Which verifier: one fact_id → verify_fact_lineage; a list of fact_ids or derived_ids → verify_facts; a number with no id → match_derived; a number quoted from filing text or insider/13F rows → verify_filing_figures; every number in a saved report → verify_report_figures; figures a later filing revised → check_report_figures_current.\n\nUse this tool when the user asks BOTH what a financial figure is AND which filing reported it — e.g. \"What was Apple's most recently reported revenue, and which 10-Q filed it?\" or \"Show me the accession ID for Tesla's latest net income.\" Returns a single fact plus its complete filing provenance: entity, concept, period, value, accession ID, filing URL, and form type (10-K, 10-Q, etc.).\n\nUse this INSTEAD OF `search_companies` when the user already names a company and wants a financial figure with its source filing — `search_companies` only resolves identifiers and returns no financial data. Use this INSTEAD OF `get_company_fundamentals` when the user explicitly wants the filing/form type or the accession ID — `get_company_fundamentals` returns metrics across periods but omits filing provenance.\n\nTwo lookup modes: (1) by fact_id (deterministic SHA-256 identity) or (2) by concept name plus a ticker (most recently reported fact). Optionally pin a point-in-time cutoff via as_of_date (YYYY-MM-DD) — returns the latest filing accepted by SEC on or before that date (no look-ahead); check `_meta.pit_safe`.\n\nDURATION: a single 10-K tags BOTH a 12-month figure and a 3-month Q4 stub at the same period_end; on a tie this returns the longer (headline) window, and every result carries `period_type` and `period_span_days` so a 3-month stub is never mistaken for the annual figure.\n\nProvide either fact_id or concept (required). Returns DATA_NOT_AVAILABLE_FOR_PERIOD if no matching fact exists (NO_FACTS_BEFORE_AS_OF_DATE when a concept was only filed after `as_of_date`). Available on all plans.\n\nThird mode: `derived_id` (a `drv1:` id a tool gave you for a COMPUTED figure) re-reads the input facts, re-runs the registered formula and returns the recomputed `lineage.display` with a `derived` block listing the inputs; `verified:false` plus an `error` code says why it could not be proven. `ticker` is not needed: the id carries its own filer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Point-in-time cutoff (YYYY-MM-DD) used with `concept` — returns the latest fact whose 10-K/10-Q was accepted by SEC on or before this date (true PIT, no lookahead; any calendar date works). Canonical name across the suite; supersedes the legacy `period_end`.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "concept": {
                "description": "Standard concept to look up the most recently known fact for (see the enum for the full fundamentals + capital-allocation set). Use this when you don't have a fact_id. Provide either concept OR fact_id.",
                "enum": ["TotalRevenue", "CostOfRevenue", "GrossProfit", "OperatingIncome", "OperatingExpenses", "ResearchAndDevelopment", "NetIncome", "EPSDiluted", "TotalAssets", "TotalLiabilities", "ParentEquity", "TotalEquity", "StockholdersEquity", "StockholdersEquityIncludingNCI", "CashAndEquivalents", "TotalDebt", "OperatingCashFlow", "CAPEX", "Dividends", "ShareBuyback", "DebtIssuance", "DebtRepayment", "Acquisitions", "Divestitures"],
                "type": "string"
              },
              "derived_id": {
                "description": "Citation id of a computed figure (`drv1:...`), exactly as a tool result gave it to you. Re-derived from its input facts; `as_of_date` applies the point-in-time cut to every input.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "fact_id": {
                "description": "Deterministic fact identity hash: SHA-256(entity_id|accession_id|concept|period_end|unit). 64-char lowercase hex. Use this when you already have the hash from a previous query. Provide either fact_id OR concept (not both required, but at least one must be set).",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "period_end": {
                "description": "[DEPRECATED — pass `as_of_date` instead.] Filing-acceptance cutoff (YYYY-MM-DD) used with `concept`; despite the name it filters on filing accepted_at, not the returned fact's period_end. Kept one release for back-compat.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ticker": {
                "description": "Stock ticker symbol, e.g. AAPL, MSFT, BRK.B — or a CIK (SEC identifier), e.g. '0000320193'. Required with `fact_id` or `concept`: a fact_id is unique within its company's filings, so pass the company it came from (every result that gives you a fact_id also names the company's CIK). Not needed with `derived_id`.",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.\\-]+$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": {},
                "description": "Response metadata (provenance, point-in-time flag, freshness, request id and warnings). Every field is documented once in the agent contract (agent_contract.meta in the server's manifest.json).",
                "properties": {},
                "type": "object"
              },
              "derived": {
                "additionalProperties": false,
                "description": "Derived mode only: the formula and input facts behind the recomputed `lineage`.",
                "properties": {
                  "formula_id": {
                    "type": "string"
                  },
                  "inputs": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "concept": {
                          "type": ["string", "null"]
                        },
                        "display": {
                          "type": ["string", "null"]
                        },
                        "fact_id": {
                          "type": "string"
                        },
                        "period_end": {
                          "type": ["string", "null"]
                        },
                        "role": {
                          "type": "string"
                        }
                      },
                      "required": ["concept", "display", "fact_id", "period_end", "role"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["formula_id", "inputs"],
                "type": "object"
              },
              "error": {
                "additionalProperties": false,
                "description": "Derived mode only, with verified:false: why the figure could not be proven. Permanent: INVALID_ARGUMENT, UNKNOWN_FORMULA, INPUT_NOT_FOUND, INPUT_UNAVAILABLE, UNDEFINED_RESULT, ENTITLEMENT_DENIED. Transient (retry): UPSTREAM_UNAVAILABLE, STALE_SNAPSHOT, RATE_LIMITED, INTERNAL_ERROR.",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "required": ["code", "message"],
                "type": "object"
              },
              "lineage": {
                "additionalProperties": false,
                "description": "Full provenance for one fact. Identity: fact_id, entity_id, ticker, company_name, concept, standard_concept, accession_id. Value: numeric_value (raw), `display` (the SAME number already rendered — \"$391.04B\" — QUOTE THIS rather than re-rounding numeric_value yourself), unit, plus derived_quarterly_value/derived_quarterly_display/derived_quarterly_label (the standalone quarter: a Q2/Q3 10-Q states year-to-date and a 10-K the whole year, so the quarter and the filing are different numbers). Filing: source_url, inline_viewer_url, document_url, filing_date, form_type, accepted_at. Duration: period_start, period_end, period_span_days, and period_type (instant | quarterly | half_year | nine_month | annual | duration) so a 3-month stub is never mistaken for the 12-month figure — a 10-K tags BOTH at the same period_end. ⚠️ There is no `value` key and no `cik` key; the fields are named exactly as emitted.",
                "properties": {
                  "accepted_at": {
                    "description": "SEC acceptance timestamp (ISO 8601) — the moment this number became public. The PIT cut is taken on this.",
                    "type": ["string", "null"]
