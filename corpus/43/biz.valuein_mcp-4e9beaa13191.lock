                  "properties": {
                    "accepted_at": {
                      "type": "string"
                    },
                    "cash_flow": {
                      "additionalProperties": false,
                      "properties": {
                        "fcf_margin": {
                          "type": ["number", "null"]
                        },
                        "free_cash_flow": {
                          "type": ["number", "null"]
                        }
