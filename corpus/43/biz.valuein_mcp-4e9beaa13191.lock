        {
          "name": "compute_lbo",
          "title": "Compute LBO Returns (IRR + MOIC)",
          "description": "Leveraged buyout returns analysis: caller provides entry/exit multiples, leverage, and a hold period; the tool builds a Day-1 pro-forma opening balance sheet from the deal's own sources & uses (cash-free, debt-free convention — entry_debt = leverage_multiple x EBITDA, sponsor_equity = entry_enterprise_value + minimum_cash - entry_debt), then runs it through the same linked three-statement engine as `project_three_statement` (100% FCF-to-debt-paydown sweep by default). Returns MOIC and IRR (solved by bounded bisection over the sponsor's cash flow stream — interim dividends if any, plus exit equity proceeds). EBITDA is PROXIED by operating income (no separate D&A concept exists in the dataset) unless entry_ebitda_override is supplied — see `result.entry_ebitda_is_proxy`. `result.irr.converged:false` means no root was found (e.g. a total wipeout) — never a fabricated rate. Every simplification is listed in `result.caveats[]`. Plan: Benchmark and above.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of_date": {
                "description": "Point-in-time cutoff (YYYY-MM-DD) for the seed period. Omit to use the latest knowable annual period.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "cash_sweep_pct": {
                "default": 1,
                "description": "Fraction (0-1) of each year's FCF swept to debt paydown. Default 1.0 (standard LBO — 100% sweep).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "dividend_payout_pct": {
                "default": 0,
                "description": "Fraction (0-1) of net income distributed to the sponsor each year (dividend recap style). Default 0 — most LBOs return capital only at exit.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "entry_ebitda_override": {
