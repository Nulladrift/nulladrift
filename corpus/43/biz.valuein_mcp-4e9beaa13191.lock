          "title": "investment_adviser table schema",
          "description": "SEC Form ADV Part 1A: registered investment advisers and Exempt Reporting Advisers (about 23.6K firms).  A separate SEC source from EDGAR: advisers file into IARD, so rows key on the firm's CRD number, not a CIK.  Point-in-time: the natural key is (crd_number, filing_date), where filing_date is the adviser's own Form ADV filing date.  A firm's annual updating amendment appends a new vintage instead of overwriting the prior one.  Filter `filing_date <= as_of` and take the latest vintage per crd_number for a point-in-time view, or the whole partition for adviser history.  Caveat: Items 5.A-5.F are absent for firm_type='ERA'.  Exempt Reporting Advisers file an abbreviated form; that is a different filing obligation, not missing data.  Scope coverage metrics to firm_type='Registered' or you understate completeness.  Institutional (full) tier only.",
