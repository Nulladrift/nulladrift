        {
          "name": "list_restatements",
          "title": "Restatement Radar Feed",
          "description": "List financial-statement restatements — facts a later SEC filing materially changed from what was originally reported. Each event carries the as-reported value, the restated value, the signed delta, a severity bucket, the RAW XBRL tag both filings used (the diff is same-tag, so it is apples-to-apples and checkable), both filings' accession numbers for one-click lineage, an analyst-importance tier (1 headline / 2 statement line / 3 footnote), the fact's rank within the company's restatement history, and — crucially — HOW the company told the market (`disclosure_class`): `non_reliance` (it filed an 8-K Item 4.02 telling the SEC not to rely on its prior financials), `amended` (a 10-K/A or 10-Q/A), or `undisclosed` (the number changed inside a routine 10-Q/10-K — no amendment, no 4.02). About 94% of events are `undisclosed`: most numbers that change, change quietly. `undisclosed` is a statement about the FILING CHAIN, not about the filer's intent — adopting a new accounting standard (ASC 606, ASC 842) legitimately restates prior comparatives with nobody doing anything wrong. Do NOT describe these as fraud, concealment, or wrongdoing. Filter by ticker, sector, severity, minimum swing, importance, disclosure class, or filing date; pass as_of_date for a point-in-time view (only events whose restating filing was accepted on or before that day — without it the feed includes restatements filed after any date you are analysing, a look-ahead leak); sort by recency (default) or significance; paginate with the returned cursor. A single-event lookup (`event_id`) also returns `versions` when available: every filed value of that fact, oldest first, each with its accession. `include_cause: true` adds, per event, WHY the number changed as the restating filing states it: `cause` (error | merger | reclass | none), `cause_quote` (the filing's own sentence) and `cause_state` (found | no_reason | unreadable; unreadable is a retry, never 'no reason'). It reads one filing per row, so the page is CLAMPED to 25 events (a larger `limit` is reduced, and `note` says so). `cause: [...]` (only with include_cause) keeps just those causes from THIS PAGE, not from the whole feed, and `filtered_out` counts what it dropped from the page (rows whose filing could not be read are kept); page on with `cursor` to look further. For one event use explain_restatement. Public data — available on every tier. Provenance: derived from SEC EDGAR filings; verify any figure with verify_fact_lineage.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amendments_only": {
                "description": "Only restatements that arrived in an AMENDED filing (10-K/A, 10-Q/A) — the company formally telling the SEC it got a number wrong. The sharpest cut there is: it separates real restatements from routine re-files (a next-year 10-K carrying a revised comparative).",
                "type": "boolean"
              },
              "as_of_date": {
                "description": "Point-in-time filter: only restatements whose restating filing was accepted (last_filed_at) on or before this day, inclusive. Results are point-in-time ONLY when this is passed — omit it and later restatements are included. Use for backtests and dated analyses to avoid look-ahead bias.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "cause": {
                "description": "Only with include_cause: keep events of these causes (error | merger | reclass | none) from THIS PAGE. It filters the page returned, not the whole feed; `filtered_out` counts the rows dropped.",
                "items": {
                  "enum": ["error", "merger", "reclass", "none"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "cursor": {
                "description": "Opaque pagination cursor from a prior response's next_cursor.",
                "maxLength": 20,
                "pattern": "^\\d+$",
                "type": "string"
              },
              "disclosure": {
                "description": "Filter by HOW the company told the market. 'non_reliance' = it filed an 8-K Item 4.02 ('Non-Reliance on Previously Issued Financial Statements') — formally telling the SEC not to rely on what it already reported. The loudest signal in US disclosure, and rare. 'amended' = corrected in a 10-K/A or 10-Q/A. 'undisclosed' = the value changed inside a ROUTINE 10-Q or 10-K: no amendment, no 4.02, the old number is simply gone. ~94% of events. Anyone can parse an 8-K, so anyone can list what companies ANNOUNCED; finding what they didn't requires every vintage back to 1993.",
                "items": {
                  "enum": ["non_reliance", "amended", "undisclosed"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "event_id": {
                "description": "Fetch exactly one event by its id (from a prior response).",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[a-f0-9]+$",
                "type": "string"
              },
              "filed_since": {
                "description": "Only restatements FILED on or after this date — the 'what changed recently' window.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include_cause": {
                "default": false,
                "description": "Add `cause`, `cause_quote` and `cause_state` to each event, read from the restating filing. Reads one filing per event, so the page is clamped to 25. Default false.",
                "type": "boolean"
              },
              "limit": {
                "default": 25,
                "description": "Page size (1-100, default 25). With include_cause it is clamped to 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_importance": {
                "description": "Only lines at or above this importance tier: 1 = headline only (revenue, net income, EPS, total assets, operating cash flow), 2 = + primary statement lines, 3 = everything incl. footnotes. Severity says how far a number moved; importance says whether anyone cares.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
