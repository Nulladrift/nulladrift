                "description": "Restrict to one company — ticker (e.g. 'AAPL') or CIK (e.g. '0000320193').",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.\\-]+$",
                "type": "string"
              }
            },
            "type": "object"
          },
