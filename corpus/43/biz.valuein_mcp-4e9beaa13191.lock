          "description": "Fetch the current HEAD of a report by id. `format=markdown` returns the rendered body, `format=json` returns the full structured payload (sections + citations + report-type-specific data), `format=preview` returns abstract-only. Authors see any of their own reports; non-authors only get `preview` of listed reports and need the report's required tier for full bodies. A guest who is not the author always gets the preview, whatever `format` asks for. For an archived prior version use `get_report_version`, not this tool.",
