        },
        {
          "name": "quote",
          "description": "Quote a CraterView.ai job without running it: what it would charge for this image, the settings it would send and, for an enlargement by scale, the result's size in megapixels. It uploads, queues and charges nothing.\n\nSend the model and the params its tool would be sent, and the image as `input_key` — or, in place of it, image_width and image_height, which prices a file still on the user's computer without taking it off. For a link, call upload_photo first, which needs no asking.\n\nAn answer's `quote` is the quote as POST /v1/quotes states it, and `quote.params` is what to send the tool.\n\n`credits_at_most`: In place of `credits`, where the price is not known yet: the most the job can be charged. A model priced by the faces it redraws knows only after the run, and a price by size needs the picture's size.\n\nPrivacy: images and results are private to the account, never used to train, tune or evaluate a model, public only if the user submits them to the gallery.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image_height": {
                "description": "In place of the image: the image file's height in pixels.",
                "minimum": 1,
                "type": "integer"
              },
              "image_width": {
                "description": "In place of the image: the image file's width in pixels.",
                "minimum": 1,
                "type": "integer"
              },
              "input_key": {
                "description": "The image: the `input_key` upload_photo answered with, or a File ID the user copied from their CraterView.ai workspace.",
                "type": "string"
              },
              "model": {
                "description": "The model the job would run: cv-enhance-v3 is enhance_photo, cv-faces-v1 is redraw_small_faces, cv-headshot-v1 is make_headshot, cv-denoise-v1 is denoise_photo, cv-restore-v1 is restore_photo, cv-content-check-v1 is check_content, cv-real-check-v2 is check_real.",
                "enum": ["cv-enhance-v3", "cv-faces-v1", "cv-headshot-v1", "cv-denoise-v1", "cv-restore-v1", "cv-content-check-v1", "cv-real-check-v2"],
                "type": "string"
              },
              "params": {
                "description": "The params that tool would be sent.",
                "type": "object"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e218efc9dd04d1a7ba2bff8dbe984066d56acc693328998db8ef920347e100a2"
        },
        {
          "name": "redraw_small_faces",
          "description": "Small face enhancement (cv-faces-v1, 1 credit an image up to 6 faces redrawn, 2 credits above): Makes small, blurry or distorted faces look natural. For the people in a group photograph whose faces came out small and distorted after enlarging: run it on the enlarged result rather than the original. A picture with no face small enough is refused and costs nothing. It draws a small face to fit rather than recovering it, so keep the source. Stills only.\n\nOnly the user starts a run: call this only after they have said to, free jobs too. \"Make this sharper\" asks for a result, not a run: say what you would use and what it will cost, then wait. `quote` runs nothing and is free: call it without asking.\n\nSend the image as `input_key`: upload_photo answers with one.\n\nAn answer's `job` is the job as the API states it. On a finished job, `usage` is the account as get_usage answers it, and get_usage says what its fields mean.\n\nMost images finish inside this call, with links in `job.result.output` and a small preview of the result to check it by. A slower one answers with `job.status` queued or running: collect it with get_job and `job.id`. Calling this tool again would run the work and charge for it twice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input_key": {
                "description": "The image: the `input_key` upload_photo answered with, or a File ID the user copied from their CraterView.ai workspace.",
                "type": "string"
              },
              "params": {
                "description": "Settings for this model. Leave out anything not asked for: each has a default.",
                "properties": {
                  "output_format": {
                    "default": "auto",
                    "description": "The format of the result. auto keeps the format you sent, except HEIC and HEIF, which prefer JPEG, and TIFF, which comes back as PNG. Any format is a preference, and the result is PNG where it cannot hold the picture whole: JPEG holds no alpha channel and at most 65,500 pixels a side, WebP at most 16,383 pixels a side, and both 8 bits per channel. A deeper picture keeps its depth, colours keep their space, and greyscale comes back as colour (RGB). WebP halves colour resolution; PNG and JPEG keep it whole. result.output.content_type says which format came back.\n",
                    "enum": ["auto", "png", "jpeg", "webp"],
                    "type": "string"
                  },
                  "quality": {
                    "default": 96,
                    "description": "Encoder quality for jpeg and webp.\n",
                    "maximum": 100,
                    "minimum": 96,
                    "type": "integer"
                  },
                  "seed": {
                    "default": 42,
                    "description": "The same seed and input reproduce the same result. Faces up to about 48 pixels tall are redrawn, twelve at most, and larger ones are left as they are. A face that small is drawn to fit the photograph, not recovered, so vary the seed for a differently drawn face.\n",
                    "maximum": 2147483647,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["input_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0490bdd0e4116019fa6ab24f8e3135356b845428a81b27651af346c578b6c309"
        },
        {
          "name": "restore_photo",
          "description": "Restore (cv-restore-v1, 1 credit an image): Tears, creases, scratches, dust and grain are removed and washed-out colour is corrected. The photograph comes back at its own size, or enlarged up to 4 times with scale. The repair is made at no more than about a megapixel, and a larger result has its detail drawn again at full size, which takes longer the larger the result is. In a very small photo, small details can come back changed. For a print that is torn, stained or badly faded. It rebuilds a face as a close likeness rather than the original pixels, so keep the source for a photograph of a person. Before a black-and-white photograph of people is returned in colour, ask the user who is in it and what they know of its colours, and send that as `context`: without it every colour, skin tone included, is a guess. Stills only.\n\nOnly the user starts a run: call this only after they have said to, free jobs too. \"Make this sharper\" asks for a result, not a run: say what you would use and what it will cost, then wait. `quote` runs nothing and is free: call it without asking.\n\nSend the image as `input_key`: upload_photo answers with one.\n\nAn answer's `job` is the job as the API states it. On a finished job, `usage` is the account as get_usage answers it, and get_usage says what its fields mean.\n\nMost images finish inside this call, with links in `job.result.output` and a small preview of the result to check it by. A slower one answers with `job.status` queued or running: collect it with get_job and `job.id`. Calling this tool again would run the work and charge for it twice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input_key": {
                "description": "The image: the `input_key` upload_photo answered with, or a File ID the user copied from their CraterView.ai workspace.",
                "type": "string"
              },
              "params": {
                "description": "Settings for this model. Leave out anything not asked for: each has a default.\n\nroi: **look at the image and name the subject.** Everything outside it is discarded, so what comes back is made from this part alone — a face in a group photograph, a sign in the distance, the animal rather than the field — and it may be any shape that fits the subject. A region is how a large photograph gets the full factor on the part worth enlarging.",
                "properties": {
                  "context": {
                    "default": "",
                    "description": "What you know that the picture cannot show, in a sentence: who the people are, the colour of what they are wearing, where and when it was taken. The repair follows it, most of all when a black-and-white photograph comes back in colour: \"The first Black Canadian Olympian\", \"A soldier in a red tunic\". Up to 260 characters.\n",
                    "maxLength": 260,
                    "type": "string"
                  },
                  "monochrome": {
                    "default": false,
                    "description": "Set for a black-and-white photograph: it is returned black and white and the repair is more conservative. Left unset, a black-and-white photograph is returned in colour.\n",
                    "type": "boolean"
                  },
                  "output_format": {
                    "default": "auto",
                    "description": "The format of the result. auto keeps the format you sent, except HEIC and HEIF, which prefer JPEG, and TIFF, which comes back as PNG. Any format is a preference, and the result is PNG where it cannot hold the picture whole: JPEG holds no alpha channel and at most 65,500 pixels a side, WebP at most 16,383 pixels a side, and both 8 bits per channel. A deeper picture keeps its depth, colours keep their space, and greyscale comes back as colour (RGB). WebP halves colour resolution; PNG and JPEG keep it whole. result.output.content_type says which format came back.\n",
                    "enum": ["auto", "png", "jpeg", "webp"],
                    "type": "string"
                  },
                  "quality": {
                    "default": 96,
                    "description": "Encoder quality for jpeg and webp.\n",
                    "maximum": 100,
                    "minimum": 96,
                    "type": "integer"
                  },
                  "roi": {
                    "additionalProperties": false,
                    "description": "The part of the photograph to repair, as fractions of the width and height of **the image you send**, from the top left. Everything outside it is discarded first, and the part comes back at its own size, or enlarged by scale; a region is how a large photograph fits your key's limits when enlarged. In a very small part, well under a megapixel, small details can come back changed. Omit it for the whole photograph. If you cropped the file yourself, use the cropped image's coordinates, not the original's. A region past an edge is trimmed to the image.\n",
                    "properties": {
                      "height": {
                        "exclusiveMinimum": 0,
                        "maximum": 1,
                        "type": "number"
                      },
                      "width": {
                        "exclusiveMinimum": 0,
                        "maximum": 1,
                        "type": "number"
                      },
                      "x": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "y": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["height", "width", "x", "y"],
                    "type": "object"
                  },
                  "scale": {
                    "default": 1,
                    "description": "Enlargement factor, from 1 to 4; it need not be a whole number. The result is your image, or the region you name, this many times larger in each direction, rounded down to whole pixels. At 1, the default, it comes back at its own size. An enlarged result's fine detail is drawn by the repair, not recovered from your image. The result must fit your key's limits; if not, name a smaller region or enlarge less.\n",
                    "maximum": 4,
                    "minimum": 1,
                    "type": "number"
                  },
                  "seed": {
                    "default": 42,
                    "description": "The same seed and input reproduce the same result. Vary it to get a different repair of the same photograph.\n",
                    "maximum": 2147483647,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["input_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1bc4e47ba07390e95ed4fb0895b99533f9d0d2923c5efd59d3d6a5f19f6ebfb5"
        },
        {
          "name": "upload_photo",
          "description": "Put an image into CraterView.ai. Every image goes in this way first: the tools that run a job, and quote, take the `input_key` this answers with. It runs nothing and charges nothing.\n\nGive one of:\n- image_url, for an image already online.\n- content_type and content_length, for a file on this computer that your shell can read. The answer has a `curl` command that sends it straight to storage, and the file is there once that has succeeded.\n- job_id, for the file a finished job returned.\n- image_base64, only for a very small file you cannot send any other way.\n\nCall this without asking for a link the user gave you. A file on the user's computer stays there until they say to run: read its width and height in your shell and give those to quote. An `input_key` can be sent to any number of jobs, and the file is deleted a day after it was made.\n\nIf you cannot send the image, because you can only see it in this conversation or your shell cannot reach storage, ask the user for a link, or to choose the photo at https://craterview.ai/app and give you its File ID, which is an `input_key`.\n\nPrivacy: images and results are private to the account, never used to train, tune or evaluate a model, public only if the user submits them to the gallery.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_length": {
                "description": "For a file on this computer, with content_type: its exact size in bytes, read in your shell so the image never enters your context. The limit is 300MB.",
                "minimum": 1,
                "type": "integer"
              },
              "content_type": {
                "description": "For a file on this computer, with content_length: the file's type.",
                "enum": ["image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "image/tiff"],
                "type": "string"
              },
              "image_base64": {
                "description": "The image itself, base64-encoded; a data: URL is also accepted. Limit 8MB decoded. Only for a very small file you cannot send any other way: inline base64 is text in your context, and a one-megabyte image costs hundreds of thousands of tokens. An image you can only see in this conversation cannot be sent: encode the file's bytes, never what you see.",
                "type": "string"
              },
              "image_url": {
                "description": "A public or signed http(s) link to a PNG, JPEG, WebP, HEIC, HEIF or TIFF image, which is fetched from there. The limit is 300MB.",
                "type": "string"
              },
              "job_id": {
                "description": "The `id` of a finished job whose result is the image, to run another job on what it returned. For enhance_photo, the original photo is strongly recommended: it might not work well on a result.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:93aa009a966448f13158132fe51209ac6ea793c7565aad995051e855617a9f6a"
        },
        {
          "name": "view_photo",
          "description": "Look at an image: an upload or a finished job's result, the whole of it or a part, as a picture you can see.\n\nGive `input_key` or `job_id`. It is free and needs no go-ahead: each look is a free job on the `echo` test model that makes a reduced copy, which the user's dashboard leaves out. Look at the whole image first: the answer states its full size in pixels. Then, to judge detail, look at a small part with `roi`, which comes back pixel for pixel when it fits within `max_side`.\n\n`roi` is in fractions of the full-size image, as a job's is, and the answer gives the `roi` for the part it shows, ready to send to a job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input_key": {
                "description": "The image: the `input_key` upload_photo answered with, or a File ID the user copied from their CraterView.ai workspace.",
                "type": "string"
              },
              "job_id": {
                "description": "A finished job's `id`, to look at its result.",
                "type": "string"
              },
              "max_side": {
                "description": "The longest side of the picture you get back, in pixels. 1024 is enough for a first look at the whole image; a part that fits within this comes back pixel for pixel.",
                "maximum": 1568,
                "minimum": 64,
                "type": "integer"
              },
              "roi": {
                "additionalProperties": false,
                "description": "The part to look at, as fractions of the full-size image's width and height the way up it is shown, from the top left: the `roi` a job takes. Leave it out for the whole image.",
                "properties": {
                  "height": {
                    "exclusiveMinimum": 0,
                    "maximum": 1,
                    "type": "number"
                  },
                  "width": {
                    "exclusiveMinimum": 0,
                    "maximum": 1,
                    "type": "number"
                  },
                  "x": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "y": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["height", "width", "x", "y"],
                "type": "object"
              }
            },
            "required": ["max_side"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f20bdecc7cfa92faf72d9915ddf8ffbc85e5623d2b1280f1fa2214a057d31af"
        }
      ],
