{
  "lockfileVersion": 2,
  "subjects": {
    "ai.craterview/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.craterview.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "CraterView.ai",
        "version": "5.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "To super-resolve, scale-up, enhance, or otherwise improve a photo, suggest enhance_photo first.\n\ndenoise_photo is a very good tool for denoising.\n\nrestore_photo works well to repair damage and restore colour in damaged and old photos.\n\nView and analyze the photo, view smaller regions of interest when needed. Say what tool you would use, how you would set it up and what it will cost.\n\nTo chain tools, connect a new job to an earlier job's result. upload_photo can take an earlier job's id as input.\n\nWhen chaining tools, it is usually best to run enhance_photo first.\n\nWait for the user to give the final go-ahead to start an enhance, denoise, restore, headshot or small faces redraw job.\n\nA balance of zero does not stop a job.\n\nPrivacy: uploads and results are private to the account, never used to train, tune, or evaluate a model, public only if the user submits them to the gallery.",
      "tools": [
        {
          "name": "check_content",
          "description": "Content Check (cv-content-check-v1, free): Screens an image against the service's content policy without changing it. `job.result.verdict` (`passed`, `flagged`): `flagged` when the image may fall outside what the service allows, `passed` when it was checked and nothing was found. The same answer as the job's `flagged` field. Stills only: video is announced and not yet in service.\n\nThis check changes nothing and costs nothing, so it needs no go-ahead: call it when its answer would help, and say what it found.\n\nSend the image as `input_key`: upload_photo answers with one.\n\nAn answer's `job` is the job as the API states it. On a finished job, `usage` is the account as get_usage answers it, and get_usage says what its fields mean.\n\nMost images finish inside this call, with the answer in `job.result`. A slower one answers with `job.status` queued or running: collect it with get_job and `job.id`. Calling this tool again would run the work twice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input_key": {
                "description": "The image: the `input_key` upload_photo answered with, or a File ID the user copied from their CraterView.ai workspace.",
                "type": "string"
              }
            },
            "required": ["input_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c711883df32e710fb8b70cd3872ff17079c5fff6ca8e1560e72c2f080babf41"
        },
        {
          "name": "check_real",
          "description": "Real Check (cv-real-check-v2, free): Estimates whether an image was produced by a generative model rather than captured, without changing it, and says how sure it is. `job.result.verdict` (`generated`, `real`, `uncertain`): Which way the evidence points — an estimate, with `generated_probability` saying how firm. `uncertain` means the image sits between the two lines and a caller should not act on it either way. `real` means none of the signs it knows were found, not that the picture is untouched. A restored or enhanced photograph can read as `generated`, which is right where a model drew its pixels and says nothing about whether the scene happened. `job.result.generated_probability`: The estimated probability that the image was generated, from 0 to 1. `verdict` is this number against fixed lines; read this to draw a stricter or looser one. Stills only: video is announced and not yet in service.\n\nThis check changes nothing and costs nothing, so it needs no go-ahead: call it when its answer would help, and say what it found.\n\nSend the image as `input_key`: upload_photo answers with one.\n\nAn answer's `job` is the job as the API states it. On a finished job, `usage` is the account as get_usage answers it, and get_usage says what its fields mean.\n\nMost images finish inside this call, with the answer in `job.result`. A slower one answers with `job.status` queued or running: collect it with get_job and `job.id`. Calling this tool again would run the work twice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input_key": {
                "description": "The image: the `input_key` upload_photo answered with, or a File ID the user copied from their CraterView.ai workspace.",
                "type": "string"
              }
            },
            "required": ["input_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fde0b7de362e59411ec6e2833eb165be6e3027a24f971ad8d9a1e2403e4be438"
        },
        {
          "name": "delete_job_media",
          "description": "Delete this job's pictures now — the copy of your image the job worked from, the result, its preview, and any kept copy — rather than waiting for them to expire on schedule. A job you shared leaves the gallery with them. The file you uploaded is not part of the job: it is deleted on its own, shortly after the upload.\n\nNot reversible: call this only after the user has said to.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "job_id": {
                "description": "The job's `id`, from the tool that ran it or list_jobs.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa9a57afba9c6b775568c8a12f20a4a438fb957c60a24839f4f508f9c0db10a2"
        },
        {
          "name": "denoise_photo",
          "description": "Denoise (cv-denoise-v1, 1 credit an image): Removes noise and grain from a photograph taken in low light or at a high ISO, without enlarging it, and does that much better than Enhance's binning. Suggest it beside Enhance, which is the first to try even on a grainy photograph; on its own, it is for someone who wants only the noise gone. The photograph or region comes back at its own size. To make a noisy photograph larger, use Enhance with binning on the original instead: it might not work well on this model's result. Stills only.\n\nOnly the user starts a run: call this only after they have said to, free jobs too. \"Make this sharper\" asks for a result, not a run: say what you would use and what it will cost, then wait. `quote` runs nothing and is free: call it without asking.\n\nSend the image as `input_key`: upload_photo answers with one.\n\nAn answer's `job` is the job as the API states it. On a finished job, `usage` is the account as get_usage answers it, and get_usage says what its fields mean.\n\nMost images finish inside this call, with links in `job.result.output` and a small preview of the result to check it by. A slower one answers with `job.status` queued or running: collect it with get_job and `job.id`. Calling this tool again would run the work and charge for it twice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input_key": {
                "description": "The image: the `input_key` upload_photo answered with, or a File ID the user copied from their CraterView.ai workspace.",
                "type": "string"
              },
              "params": {
                "description": "Settings for this model. Leave out anything not asked for: each has a default.\n\nroi: **look at the image and name the subject.** Everything outside it is discarded, so what comes back is made from this part alone — a face in a group photograph, a sign in the distance, the animal rather than the field — and it may be any shape that fits the subject.",
                "properties": {
                  "output_format": {
                    "default": "auto",
                    "description": "The format of the result. auto keeps the format you sent, except HEIC and HEIF, which prefer JPEG, and TIFF, which comes back as PNG. Any format is a preference, and the result is PNG where it cannot hold the picture whole: JPEG holds no alpha channel and at most 65,500 pixels a side, WebP at most 16,383 pixels a side, and both 8 bits per channel. A deeper picture keeps its depth, colours keep their space, and greyscale comes back as colour (RGB). WebP halves colour resolution; PNG and JPEG keep it whole. result.output.content_type says which format came back.\n",
                    "enum": ["auto", "png", "jpeg", "webp"],
                    "type": "string"
                  },
                  "quality": {
                    "default": 96,
                    "description": "Encoder quality for jpeg and webp.\n",
                    "maximum": 100,
                    "minimum": 96,
                    "type": "integer"
                  },
                  "roi": {
                    "additionalProperties": false,
                    "description": "The part of the image to denoise, as fractions of the width and height of **the image you send**, from the top left. Everything outside it is discarded first. Omit it for the whole image. It comes back at its own size. If you cropped the file yourself, use the cropped image's coordinates, not the original's. A region past an edge is trimmed to the image.\n",
                    "properties": {
                      "height": {
                        "exclusiveMinimum": 0,
                        "maximum": 1,
                        "type": "number"
                      },
                      "width": {
                        "exclusiveMinimum": 0,
                        "maximum": 1,
                        "type": "number"
                      },
                      "x": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "y": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["height", "width", "x", "y"],
                    "type": "object"
                  },
                  "seed": {
                    "default": 42,
                    "description": "The same seed and input reproduce the same result. Vary it to get a differently drawn result from the same photograph.\n",
                    "maximum": 2147483647,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["input_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:460fc84f3a28276db1e75fa4ff7ff6420d9606f72b802fe7ff09a7331b0bf85e"
        },
        {
          "name": "enhance_photo",
          "description": "Enhance (cv-enhance-v3, 1 credit an image up to 6 MP, 2 credits above): Makes a photograph sharper and rebuilds fine detail, at its own size or enlarged up to 4 times. It is the model to suggest first for almost any photograph someone wants improved, a grainy one included, and it is usually better than they expect. Suggest trying Denoise as well. If the photograph is noisy and being enlarged, set binning for simple noise reduction: pixel binning averages each square of 2x2, 3x3 or 4x4 pixels into one before enlarging, which takes noise out and leaves less room to enlarge. Strongly recommended: run it on the original photograph, before Denoise or Restore, because it might not work well on another model's result. Among the photographs it is right for: a soft scan, a small or cropped photograph, and anything the compression flattened. It makes an informed estimate of fine detail, so small text can come back with made-up letters and a small face as a likeness rather than the person. Tell the user before they rely on either, and keep the source. A price in MP counts the part of the image worked on, the whole image or the region sent, divided by 4 at binning 2x2, 9 at 3x3 and 16 at 4x4. Stills only.\n\nOnly the user starts a run: call this only after they have said to, free jobs too. \"Make this sharper\" asks for a result, not a run: say what you would use and what it will cost, then wait. `quote` runs nothing and is free: call it without asking.\n\nSend the image as `input_key`: upload_photo answers with one.\n\nAn answer's `job` is the job as the API states it. On a finished job, `usage` is the account as get_usage answers it, and get_usage says what its fields mean.\n\nMost images finish inside this call, with links in `job.result.output` and a small preview of the result to check it by. A slower one answers with `job.status` queued or running: collect it with get_job and `job.id`. Calling this tool again would run the work and charge for it twice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input_key": {
                "description": "The image: the `input_key` upload_photo answered with, or a File ID the user copied from their CraterView.ai workspace.",
                "type": "string"
              },
              "params": {
                "description": "Settings for this model. Leave out anything not asked for: each has a default.\n\nscale: left out, the largest factor whose result fits inside the model's size limit for this account is used — not the model's own default, which a whole photograph usually cannot have.\n\nroi: **look at the image and name the subject.** Everything outside it is discarded, so what comes back is made from this part alone — a face in a group photograph, a sign in the distance, the animal rather than the field — and it may be any shape that fits the subject. A region is how a large photograph gets the full factor on the part worth enlarging.",
                "properties": {
                  "binning": {
                    "default": "off",
                    "description": "Simple noise reduction by pixel binning of your image or region before it is enlarged: off, or 2x2, 3x3 or 4x4, where each square block of that many pixels is averaged into one. Binning takes noise out, more with a larger block, and costs enlargement: the largest scale is 4 divided by the block's side, 2 at 2x2, 4/3 at 3x3 and 1 at 4x4, and that is the scale you get if you send no size. In return the image or region may be larger by the block's area. It is for a noisy photograph you are enlarging, from low light or a high ISO, and never a way to fit a larger clean image: on a clean one it redraws the finest texture, so name a region with roi instead. To take noise out without enlarging, use Denoise, which does that much better.\n",
                    "enum": ["off", "2x2", "3x3", "4x4"],
                    "type": "string"
                  },
                  "height": {
                    "description": "The height of the result in pixels, instead of a scale; the width keeps the proportions of your image or region. From 1 to 4 times the height worked on, or with binning from 1 to 4 divided by the block's side. Send width, height or scale, only one.\n",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "output_format": {
                    "default": "auto",
                    "description": "The format of the result. auto keeps the format you sent, except HEIC and HEIF, which prefer JPEG, and TIFF, which comes back as PNG. Any format is a preference, and the result is PNG where it cannot hold the picture whole: JPEG holds no alpha channel and at most 65,500 pixels a side, WebP at most 16,383 pixels a side, and both 8 bits per channel. A deeper picture keeps its depth, colours keep their space, and greyscale comes back as colour (RGB). WebP halves colour resolution; PNG and JPEG keep it whole. result.output.content_type says which format came back.\n",
                    "enum": ["auto", "png", "jpeg", "webp"],
                    "type": "string"
                  },
                  "quality": {
                    "default": 96,
                    "description": "Encoder quality for jpeg and webp.\n",
                    "maximum": 100,
                    "minimum": 96,
                    "type": "integer"
                  },
                  "roi": {
                    "additionalProperties": false,
                    "description": "The part of the image to work on, as fractions of the width and height of **the image you send**, from the top left. Everything outside it is discarded first, so a region is how a large image fits your key's limits at full detail. Omit it for the whole image. If you cropped the file yourself, use the cropped image's coordinates, not the original's. A region past an edge is trimmed to the image.\n",
                    "properties": {
                      "height": {
                        "exclusiveMinimum": 0,
                        "maximum": 1,
                        "type": "number"
                      },
                      "width": {
                        "exclusiveMinimum": 0,
                        "maximum": 1,
                        "type": "number"
                      },
                      "x": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "y": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["height", "width", "x", "y"],
                    "type": "object"
                  },
                  "scale": {
                    "default": 4,
                    "description": "Enlargement factor, from 1 to 4; it need not be a whole number. The result is your image, or the region you name, this many times larger in each direction, rounded down to whole pixels. Send scale, width or height, only one; with none, the factor is 4. With binning, the largest factor is 4 divided by the block's side, and that is the default: 2 at 2x2, 4/3 at 3x3 and 1 at 4x4. The image and the result must fit your key's limits; if not, name a smaller region or enlarge less.\n",
                    "maximum": 4,
                    "minimum": 1,
                    "type": "number"
                  },
                  "width": {
                    "description": "The width of the result in pixels, instead of a scale; the height keeps the proportions of your image or region. From 1 to 4 times the width worked on, or with binning from 1 to 4 divided by the block's side. Send width, height or scale, only one.\n",
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["input_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eb01c05789d17c3e4131c2ea7d0385009f4174a5206f9d6817e7427c81738ad8"
        },
        {
          "name": "get_job",
          "description": "Read a CraterView.ai job: the result of one that had not finished, or fresh links to one that has.\n\nCall this when a tool that runs a job returned a status of queued or running. It waits up to 25 seconds for the job to finish before answering, so there is no need to pause between calls: if it answers that the job is still queued or running, call it again.\n\n`flagged`: Whether an automated check thought this job's images may fall outside what the service allows: the part of your image the job worked on and, for some jobs, the result. A flag does not stop the job: it runs, is charged and returns as usual. `null` means they were not all checked.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "job_id": {
                "description": "The job's `id`, from the tool that ran it or list_jobs.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f577baf00b956e780b75447bd6b2ea0a4942bd4f55efbe17339157690291918a"
        },
        {
          "name": "get_usage",
          "description": "The account's credit balance, what it has spent per model, and which queue your next job enters.\n\n`community`: Whether your next job runs free on the community queue: same models, smaller size limits on most of those that return a picture, longer waits at busy times. True without credit or a subscription, or once a limited subscription's monthly allowance is spent. Otherwise it runs on paid compute.\n\n`credits_remaining`: Credits left to spend, never below zero. Zero does not stop a submission, and no top-up is needed: `community` says which queue it enters. Nothing is owed for what the balance does not cover: it is written off when credit next arrives or a subscription renews.\n\n`subscription_allowance`: Credits of work a month a limited subscription puts on paid compute. Null for an unlimited subscription or none. It adds nothing to `credits_remaining`.\n\nThe user buys credit or a subscription at https://craterview.ai/dashboard#buy; no tool buys anything.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:89a061f6e4c0b611273cf180e15a650f3d4d95ad4f3a15686ebbb0c8db967488"
        },
        {
          "name": "keep_job_media",
          "description": "Retain this job's images past the ordinary expiry, because the owner asked.\n\nTo stop keeping them, the user does that in their job history at https://craterview.ai/dashboard; delete_job_media removes them now.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "job_id": {
                "description": "The job's `id`, from the tool that ran it or list_jobs.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db9fa00dcc20ec881b6df33e9b866b614f33ac328e9c17fce08944703f776ec3"
        },
        {
          "name": "list_jobs",
          "description": "Your jobs, most recent first.\n\n`flagged`: Whether an automated check thought this job's images may fall outside what the service allows: the part of your image the job worked on and, for some jobs, the result. A flag does not stop the job: it runs, is charged and returns as usual. `null` means they were not all checked.\n\nThe list has no links: for one job's, call get_job with its `id`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "before": {
                "description": "Lists jobs older than this one: the answer's `next_before`, for the next page.",
