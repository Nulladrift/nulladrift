                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:79a3f57547aeebd796996c3bb9cd1a10b47b3d45d575d525f9b622d27cfa5831"
        },
        {
          "name": "make_headshot",
          "description": "Headshot (cv-headshot-v1, 1 credit an image): Turns a photograph with a face in it into a professional headshot. Stills only.\n\nOnly the user starts a run: call this only after they have said to, free jobs too. \"Make this sharper\" asks for a result, not a run: say what you would use and what it will cost, then wait. `quote` runs nothing and is free: call it without asking.\n\nSend the image as `input_key`: upload_photo answers with one.\n\nAn answer's `job` is the job as the API states it. On a finished job, `usage` is the account as get_usage answers it, and get_usage says what its fields mean.\n\nMost images finish inside this call, with links in `job.result.output` and a small preview of the result to check it by. A slower one answers with `job.status` queued or running: collect it with get_job and `job.id`. Calling this tool again would run the work and charge for it twice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input_key": {
                "description": "The image: the `input_key` upload_photo answered with, or a File ID the user copied from their CraterView.ai workspace.",
                "type": "string"
              },
              "params": {
                "description": "Settings for this model. Leave out anything not asked for: each has a default.\n\nroi: **look at the image and name the subject.** Everything outside it is discarded, so what comes back is made from this part alone — a face in a group photograph, a sign in the distance, the animal rather than the field — and it may be any shape that fits the subject.",
                "properties": {
                  "attire": {
                    "default": "business",
                    "description": "business: a dark jacket over a plain shirt. as-is: the clothes they are wearing. Both use the headshot's backdrop, lighting and framing, and remove sunglasses, hats and anything in front of the face. starship-captain: a dark high-collared uniform on a starship's bridge, with pointed ears and upswept eyebrows. Their hairstyle, facial hair, age, face shape and expression are kept.\n",
                    "enum": ["business", "as-is", "starship-captain"],
                    "type": "string"
                  },
                  "output_format": {
                    "default": "auto",
                    "description": "The format of the result. auto keeps the format you sent, except HEIC and HEIF, which prefer JPEG, and TIFF, which comes back as PNG. Any format is a preference, and the result is PNG where it cannot hold the picture whole: JPEG holds no alpha channel and at most 65,500 pixels a side, WebP at most 16,383 pixels a side, and both 8 bits per channel. A deeper picture keeps its depth, colours keep their space, and greyscale comes back as colour (RGB). The result has no transparency. WebP halves colour resolution; PNG and JPEG keep it whole. result.output.content_type says which format came back.\n",
                    "enum": ["auto", "png", "jpeg", "webp"],
                    "type": "string"
                  },
                  "quality": {
                    "default": 96,
                    "description": "Encoder quality for jpeg and webp.\n",
                    "maximum": 100,
                    "minimum": 96,
                    "type": "integer"
                  },
                  "roi": {
                    "additionalProperties": false,
                    "description": "The part of the photograph the person is in, as fractions of the width and height of **the image you send**, from the top left. Everything outside it is discarded first, and the headshot is made from the largest face inside it, so a region chooses the person in a photograph of several. Omit it for the whole photograph. If you cropped the file yourself, use the cropped image's coordinates, not the original's. A region past an edge is trimmed to the image.\n",
                    "properties": {
                      "height": {
                        "exclusiveMinimum": 0,
                        "maximum": 1,
                        "type": "number"
                      },
                      "width": {
                        "exclusiveMinimum": 0,
                        "maximum": 1,
                        "type": "number"
                      },
                      "x": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "y": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["height", "width", "x", "y"],
                    "type": "object"
                  },
                  "seed": {
                    "default": 42,
                    "description": "The same seed and input reproduce the same result. Vary it to get a different headshot from the same photograph.\n",
                    "maximum": 2147483647,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["input_key"],
            "type": "object"
          },
