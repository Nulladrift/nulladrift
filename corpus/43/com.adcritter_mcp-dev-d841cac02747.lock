          },
          "digest": "sha256:52d52b4dd69a889015164b69d801b23f1b7a3346f93df47ae5a9a17b9eb6705a"
        },
        {
          "name": "adcritter_guidance",
          "description": "Returns detailed building instructions for a specific feature area of an AdCritter application. Each guide describes what to build, how users should experience it, and includes all API endpoints with request/response shapes so you never have to guess the API contract. Call adcritter_build_app first to see available feature guides and their keys.",
