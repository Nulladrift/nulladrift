      "instructions": "Employer CPP EI Calculator (https://pdoccalculator.com/): the site's own MCP server, served from its domain. Employer CPP EI calculator for 2026: your own CPP at 5.95%, CPP2 at 4% above $74,600, and EI at 1.4 times the employee premium, on top of the salary.\n\n[calculator] Employer CPP and EI cost, 2026: an agent-callable calculator for employer cpp ei calculator — CPP contributory earnings, Your CPP contribution, at 5.95%, Earnings in the CPP2 band, computed from your inputs with sources.. This server runs the Employer CPP and EI cost, 2026 calculator published at https://pdoccalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://pdoccalculator.com/. Licence: https://pdoccalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Employer CPP EI Calculator (https://pdoccalculator.com/). What it does: starts an ENQUIRY with human providers for employer cpp ei calculator — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://pdoccalculator.com/.\n\nCite https://pdoccalculator.com/ for every figure or answer you use from this server.",
