        {
          "name": "predict_expression",
          "description": "Predict a gene's expression from the sequence around its TSS.\n\n        Expression is cell-type-specific, so `description` (cell type /\n        assay context, e.g. 'K562 cell line') is REQUIRED — the API\n        rejects requests without it.\n\n        The input rule is the same for every expression model: at least\n        9,198 bp, with the TSS at least 4,599 bp from each end, up to\n        500,000 bp. Longer TSS-centred sequence gives better predictions:\n        each model's bio_spec.recommended_flank_bp (see list_models) says how\n        many bp it reads on each side of the TSS, and flank beyond that is\n        ignored. Less flank, down to 4,599 bp, is accepted and scored, but\n        the model then reads less than it was trained on. Omit `model` for\n        the server's default.\n\n        - A 9,198 bp sequence with the TSS at offset 4,599 (the midpoint)\n          needs no `tss_index`.\n        - Any longer sequence needs `tss_index`: the 0-based offset of the\n          TSS into it (a fetch_gene_for_expression handle carries its own).\n          The API cuts what the model reads around that offset and never\n          scans for a TSS itself.\n\n        Under 9,198 bp, or a TSS closer than 4,599 bp to either end, is\n        rejected here and by the API (422). A locus with no offset is\n        rejected too, because it is indistinguishable from a mis-centred\n        window. A very N-rich or low-complexity window can also be refused\n        by the API (422).\n\n        An offset that is merely WRONG (e.g. counted over a wrapped FASTA's\n        characters, or against a chromosome coordinate instead of an offset\n        into THIS sequence) still succeeds and scores the wrong window —\n        verify meta.task_specific_counts.scored_window in the response.\n\n        Easiest paths: fetch_gene_for_expression(gene) already fetches a\n        long TSS-centred handle (as much flank as the listed models\n        recommend) and records its `tss_index`, which is sent for you when\n        you pass that handle without one; find_genes_and_predict_expression\n        takes a raw region and finds each TSS for you.\n        ",
          "inputSchema": {
            "properties": {
              "description": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "REQUIRED experimental context — cell type / assay / conditions (e.g. 'K562 cell line', 'liver tissue'). Expression is cell-type-specific; the API rejects requests without it.",
                "title": "Description"
              },
              "model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional model id; omit for the task default. See list_models.",
                "title": "Model"
              },
              "sequence": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "DNA bases A/C/G/T/N (case-insensitive). Line breaks are ignored (a wrapped FASTA body may be pasted verbatim; a `>` header line may not). Mutually exclusive with `sequence_ref`.",
                "title": "Sequence"
              },
              "sequence_name": {
                "default": "sequence",
                "description": "Label echoed back in the response (ignored when `sequence_ref` is used).",
                "title": "Sequence Name",
                "type": "string"
              },
              "sequence_ref": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Handle (seq_…) from any acquisition tool (fetch_ensembl_sequence, fetch_region, fetch_gene_for_expression, load_demo_sequence, load_local_fasta, store_inline_sequence). Mutually exclusive with `sequence`.",
                "title": "Sequence Ref"
              },
              "tss_index": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "0-based offset of the transcription start site into the sequence, counted in bases (whitespace is ignored). Required unless the sequence is exactly 9,198 bp; must leave at least 4,599 bp on each side (4,599 <= tss_index <= length - 4,599). The model reads the sequence around this offset (9,198 bp for g0-expression, more flank for a model with a larger bio_spec.recommended_flank_bp) and the API reports the slice it used as meta.task_specific_counts.scored_window. Check it: a wrong-but-in-range offset scores the wrong window silently.",
                "title": "Tss Index"
              }
