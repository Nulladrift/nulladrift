        {
          "name": "list_models",
          "description": "List available models for a task.\n\n        Use to discover model ids before passing one as the `model`\n        argument to a predict tool. The same catalog is also available\n        as the resource `gi://models`.\n\n        Returns a FLAT object — {task, default_model, models: [...]} — not the\n        {data, meta} envelope the predict tools return. Each model carries a\n        `bio_spec`, whose useful fields are `request_max_bp` (the enforced\n        ceiling, 500,000 everywhere) and `context_window_bp` (what the model\n        reads in one step — compare your sequence length against it: a shorter\n        one is scored against a padded window). `trained_window_bp` is the fixed\n        receptive field where there is no sliding window (null for a model\n        without one). For expression, `recommended_flank_bp` is how many bp the\n        model reads on each side of the TSS; longer TSS-centred input is\n        better, and fetch_gene_for_expression already fetches the largest\n        listed value. `request_max_bp` is the only cap; the other\n        fields describe what the model reads, not what the route accepts.\n        ",
          "inputSchema": {
            "properties": {
              "task": {
                "description": "Task name. One of: promoter, splice, enhancer, chromatin, expression, annotation.",
                "title": "Task",
                "type": "string"
              }
            },
            "required": ["task"],
            "title": "list_modelsArguments",
            "type": "object"
          },
          "outputSchema": {
