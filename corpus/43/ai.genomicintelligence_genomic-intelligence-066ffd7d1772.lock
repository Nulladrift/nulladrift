        {
          "name": "find_genes_and_predict_expression",
          "description": "Find genes in a sequence, then predict each gene's expression (composite).\n\n        Server-side chaining in ONE call: finds genes (transcript intervals,\n        with their TSS) in the sequence, then predicts expression off each\n        discovered TSS in the given experimental context. This is the right\n        tool whenever you want expression for a raw region or sequence — e.g.\n        \"find the genes in chr8:… and predict their expression in K562\".\n        predict_expression scores the sequence around ONE TSS and needs you to\n        know where that TSS is (a sequence of at least 9,198 bp with the TSS\n        at least 4,599 bp from each end, longer being better, plus\n        `tss_index`; fetch_gene_for_expression builds one); this tool discovers\n        every gene's TSS itself. It has no 9,198 bp floor and no tss_index;\n        it starts with gene finding, so it takes 1,000–500,000 bp.\n\n        Runs async internally at every size (the annotate stage is slow even\n        for small inputs), so progress always streams. With wait=True\n        (default), blocks and streams progress, then returns the result\n        {data, meta} — it never returns a job_id on this path. With wait=False\n        (detached), returns {data: {job_id, status: 'submitted'}} immediately —\n        poll it with get_job. Because it ends in expression, `description`\n        (cell type / assay context) is REQUIRED.\n        ",
          "inputSchema": {
            "properties": {
              "description": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "REQUIRED experimental context — cell type / assay / conditions (e.g. 'K562 cell line'), applied to every found gene. The workflow ends in expression, which the API rejects without it.",
                "title": "Description"
              },
              "sequence": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "DNA bases, 1,000-500,000 bp (line breaks ignored). Mutually exclusive with sequence_ref.",
                "title": "Sequence"
              },
              "sequence_name": {
                "default": "sequence",
                "description": "Label echoed back.",
                "title": "Sequence Name",
                "type": "string"
              },
              "sequence_ref": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Stored sequence handle. Mutually exclusive with sequence.",
                "title": "Sequence Ref"
              },
              "wait": {
                "default": true,
                "description": "Default True: block and stream progress until the result is ready. Set False for detached mode — returns a job_id immediately to poll with get_job.",
                "title": "Wait",
                "type": "boolean"
              }
            },
            "title": "find_genes_and_predict_expressionArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "find_genes_and_predict_expressionDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
