      "instructions": "DNA sequence analysis with Genomic Intelligence models. Research use only, not for clinical or diagnostic decisions.\n\nFirst get a sequence handle (fetch_ensembl_sequence, fetch_region, fetch_gene_for_expression, load_demo_sequence or store_inline_sequence), then pass its sequence_ref to a predict tool or find_genes; large sequences then stay out of the conversation. Short sequences can go inline as `sequence`. For expression of every gene in a region, use find_genes_and_predict_expression.\n\nEach tool states its length limits; list_models gives each model's bio_spec.",
      "tools": [
        {
          "name": "fetch_ensembl_sequence",
          "description": "Fetch a gene's reference sequence from Ensembl and store it.\n\n        Returns a handle ({ref, name, length, preview, ...}). Pass the\n        `ref` to predict_* tools — the bases stay server-side. For\n        expression, use fetch_gene_for_expression instead (it prepares\n        the TSS-centred window that model needs).\n        ",
          "inputSchema": {
            "properties": {
              "flank_bp": {
                "default": 0,
                "description": "Extra bp added on each side of the gene body.",
                "minimum": 0,
                "title": "Flank Bp",
                "type": "integer"
              },
              "gene": {
                "description": "Gene symbol (e.g. 'TP53') or Ensembl ID.",
                "title": "Gene",
                "type": "string"
              },
              "species": {
                "default": "human",
                "description": "Species name, e.g. 'human', 'mouse'.",
                "title": "Species",
                "type": "string"
              }
            },
            "required": ["gene"],
            "title": "fetch_ensembl_sequenceArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "fetch_ensembl_sequenceDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:337648300a5192d5fb148ae49d95535a402d15fc4599f015d867f872abe02c63"
        },
        {
          "name": "fetch_gene_for_expression",
          "description": "Fetch a gene's sequence prepared for expression prediction.\n\n        Resolves the gene's canonical-transcript TSS via Ensembl and stores a\n        gene-sense sequence centred on it, as a handle to pass to\n        predict_expression(sequence_ref=...). Longer TSS-centred sequence\n        gives better predictions, so this already fetches as much flank on\n        each side of the TSS as the listed expression models recommend (the\n        largest bio_spec.recommended_flank_bp from list_models). One handle\n        serves every expression model: the API reads what the chosen model\n        needs around the TSS and ignores the rest.\n\n        The handle records `tss_index` (the TSS offset into it), and\n        predict_expression uses it when you do not pass one, so no offset\n        arithmetic is needed. Every expression model accepts at least\n        9,198 bp with the TSS at least 4,599 bp from each end. Near a\n        chromosome end the flank is shortened to what fits (reported as\n        `flank_shortened`), never below 4,599 bp; a TSS closer to the end\n        than that is an error.\n        ",
          "inputSchema": {
            "properties": {
              "gene": {
                "description": "Gene symbol (e.g. 'HBB').",
                "title": "Gene",
                "type": "string"
              },
              "species": {
                "default": "human",
                "description": "Species name.",
                "title": "Species",
                "type": "string"
              }
            },
            "required": ["gene"],
            "title": "fetch_gene_for_expressionArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "fetch_gene_for_expressionDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba987b425676734933d5a8af4aec733ad309e7b830bcc28853d02030d5b41cad"
        },
        {
          "name": "fetch_region",
          "description": "Fetch a genomic region by coordinates from Ensembl and store it.\n\n        For \"find the genes in chr8:127,680,000-127,800,000\"-style requests:\n        resolves a coordinate range to reference sequence and returns a handle\n        ({ref, name, length, ...}) to pass to find_genes / predict_* — the bases\n        stay server-side. Plus strand by default, which is what the gene-finder\n        expects. For a gene by name use fetch_ensembl_sequence; for expression\n        use fetch_gene_for_expression.\n        ",
          "inputSchema": {
            "properties": {
              "flank_bp": {
                "default": 0,
                "description": "Extra bp added on each side of the region.",
                "minimum": 0,
                "title": "Flank Bp",
                "type": "integer"
              },
              "region": {
                "description": "Genomic coordinates, e.g. 'chr8:127,680,000-127,800,000'. Commas, en/em dashes and '..' are accepted; the 'chr' prefix is optional.",
                "title": "Region",
                "type": "string"
              },
              "species": {
                "default": "human",
                "description": "Species name, e.g. 'human', 'mouse'.",
                "title": "Species",
                "type": "string"
              },
              "strand": {
                "default": 1,
                "description": "1 = plus (default), -1 = minus. find_genes (gene finding) is plus-oriented — keep 1 for annotation; use -1 only for a strand-sensitive task on a known minus-strand locus.",
                "title": "Strand",
                "type": "integer"
              }
            },
            "required": ["region"],
            "title": "fetch_regionArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "fetch_regionDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4ae83dc10da61d872eae302c4162bd94b5429abfb34fcdf75ac1bf5fa9b1cbef"
        },
        {
          "name": "find_genes",
          "description": "Find genes (transcript intervals) in a genomic region (async, ~8-25s).\n\n        Takes 1,000–500,000 bp. The floor is the strictest of the scanning\n        tasks: gene finding needs a region, not a site. (Only expression's\n        9,198 bp is higher, and that is the sequence around one TSS rather\n        than a region to search.)\n\n        Gene-finding: detects transcript boundaries (TSS + PolyA) and returns\n        one interval per predicted transcript — start/end, strand, a\n        confidence score, and predicted TSS/PolyA positions (BED-style feature\n        intervals, not free-text notes). Use this for \"what genes are here\",\n        \"find / locate genes\", or \"annotate this region\".\n\n        Each transcript also carries its type (mRNA/lnc_RNA) and internal\n        exon/intron/CDS structure in `exons`/`introns`/`cds` arrays, plus a\n        browser-ready GFF3 track in `data.formats.gff3`. To get each gene's\n        *expression* from a raw region, use find_genes_and_predict_expression\n        instead — expression needs a per-gene TSS window, so predict_expression\n        cannot run on a whole region.\n\n        Submits an async job internally. With wait=True (default), blocks and\n        streams progress, then returns the result {data, meta} — it never\n        returns a job_id on this path. (If a generous block ceiling is\n        exceeded it returns a timeout error, not a job handle.) With\n        wait=False (detached), returns {data: {job_id, status: 'submitted'}}\n        immediately — poll it with get_job.\n        ",
          "inputSchema": {
            "properties": {
              "model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional model id; omit for the task default. See list_models.",
                "title": "Model"
              },
              "sequence": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "DNA bases A/C/G/T/N (case-insensitive). Line breaks are ignored (a wrapped FASTA body may be pasted verbatim; a `>` header line may not). Mutually exclusive with `sequence_ref`.",
                "title": "Sequence"
              },
              "sequence_name": {
                "default": "sequence",
                "description": "Label echoed back in the response (ignored when `sequence_ref` is used).",
                "title": "Sequence Name",
                "type": "string"
              },
              "sequence_ref": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Handle (seq_…) from any acquisition tool (fetch_ensembl_sequence, fetch_region, fetch_gene_for_expression, load_demo_sequence, load_local_fasta, store_inline_sequence). Mutually exclusive with `sequence`.",
                "title": "Sequence Ref"
              },
              "wait": {
                "default": true,
                "description": "Default True: block and stream progress until the result is ready. Set False for detached mode — returns a job_id immediately to poll with get_job.",
                "title": "Wait",
                "type": "boolean"
              }
            },
            "title": "find_genesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "find_genesDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
