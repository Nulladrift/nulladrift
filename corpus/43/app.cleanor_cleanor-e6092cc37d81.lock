                "type": "string"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["all_formats", "format", "percent_smaller_than_jpeg", "quality", "source"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
