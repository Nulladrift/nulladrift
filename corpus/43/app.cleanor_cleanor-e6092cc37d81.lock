      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Cleanor tools for AI builders. Use optimize_image to shrink/convert an image an AI generated or dropped in (returns the optimized bytes + before/after size). Use storage_capacity and image_format_savings for real, cited Cleanor Labs data on device storage and image formats. Use qr_code for a paste-ready SVG QR. No API key needed. Every result links its cleanor.app source.",
      "tools": [
        {
          "name": "base64",
          "title": "Base64 encode / decode",
          "description": "Encode text to Base64 or decode Base64 back to text (UTF-8 safe). Supports URL-safe alphabet. Use whenever you need to encode/decode data URIs, tokens, or config values instead of guessing the bytes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "input": {
                "description": "Text to encode, or Base64 to decode.",
                "maxLength": 100000,
                "minLength": 1,
                "type": "string"
              },
              "mode": {
                "default": "encode",
                "description": "Direction.",
                "enum": ["encode", "decode"],
                "type": "string"
              },
              "url_safe": {
                "default": false,
                "description": "Use URL-safe alphabet (-_ instead of +/, no padding).",
                "type": "boolean"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "mode": {
                "description": "encode or decode.",
                "type": "string"
              },
              "result": {
                "description": "The encoded or decoded text.",
                "type": "string"
              }
            },
            "required": ["mode", "result"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d86c3d2d4c7a9e7be47b7b2b6860217f28e703b02c801b7160e6fd1f57d2dd0"
        },
        {
          "name": "base_convert",
          "title": "Convert a number between bases",
          "description": "Convert an integer between number bases 2–36 (e.g. hex to binary, decimal to base-36). Arbitrary precision via BigInt, so large values stay exact. Use for radix conversions instead of doing them by hand.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from_base": {
                "default": 10,
                "description": "Base of the input (2–36).",
                "maximum": 36,
                "minimum": 2,
                "type": "integer"
              },
              "to_base": {
                "default": 16,
                "description": "Base to convert to (2–36).",
                "maximum": 36,
                "minimum": 2,
                "type": "integer"
              },
              "value": {
                "description": "The number, in from_base (e.g. \"ff\", \"1010\", \"255\").",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "decimal": {
                "description": "The value in base 10.",
                "type": "string"
              },
              "from_base": {
                "type": "number"
              },
              "input": {
                "type": "string"
              },
              "result": {
                "description": "The value in to_base.",
                "type": "string"
              },
              "to_base": {
                "type": "number"
              }
            },
            "required": ["decimal", "from_base", "input", "result", "to_base"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a970d6825bceaf21a8284c35bd6e6a02a2de4ac886dee52ecc5947d5cdb83a30"
        },
        {
          "name": "color",
          "title": "Convert a color between formats",
          "description": "Convert a color (hex, rgb() or hsl()) and return hex, RGB and HSL representations at once. Use when picking or translating colors for CSS, design tokens or themes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "value": {
                "description": "A color: \"#3b82f6\", \"rgb(59,130,246)\" or \"hsl(217,91%,60%)\".",
