                "enum": ["webp", "avif", "jxl"],
                "type": "string"
              },
              "quality": {
                "default": "web",
                "description": "web = typical web quality (SSIM 0.95); high = near-lossless (SSIM 0.98).",
                "enum": ["web", "high"],
                "type": "string"
              }
            },
            "type": "object"
          },
