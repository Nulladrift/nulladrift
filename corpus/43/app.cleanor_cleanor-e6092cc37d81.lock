                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hex": {
                "type": "string"
              },
              "hsl": {
                "type": "string"
              },
              "rgb": {
                "type": "string"
              }
            },
            "required": ["hex", "hsl", "rgb"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b1a26a1bc926813bc431409d71856a0a683b382023d1a42e34827c1141cdd1f"
        },
        {
          "name": "color_palette",
          "title": "Generate a color palette",
          "description": "Build a harmonious color palette from a base color using color-theory rules (complementary, analogous, triadic, tetradic, or monochromatic). Returns each color as hex and HSL. Use to derive a theme or design tokens from one brand color.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "Base color: \"#3b82f6\", \"rgb(...)\" or \"hsl(...)\".",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "harmony": {
                "default": "analogous",
                "description": "Color-harmony rule.",
                "enum": ["complementary", "analogous", "triadic", "tetradic", "monochromatic"],
                "type": "string"
              }
            },
            "required": ["color"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "The base color as hex.",
                "type": "string"
              },
              "colors": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "hex": {
                      "type": "string"
                    },
                    "hsl": {
                      "type": "string"
                    }
                  },
                  "required": ["hex", "hsl"],
                  "type": "object"
                },
                "type": "array"
              },
              "harmony": {
                "type": "string"
              }
            },
            "required": ["base", "colors", "harmony"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d780ff67f40faeb0932c219d4e24197ed6e6bed8ace903008150defc5eedde7"
        },
        {
          "name": "count",
          "title": "Count characters, words, lines, bytes",
          "description": "Accurately count characters (Unicode code points), UTF-16 units, words, lines and UTF-8 bytes in text. LLMs are notoriously bad at counting, so always use this tool for \"how many characters/words\" questions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "input": {
                "description": "Text to measure.",
                "maxLength": 100000,
                "minLength": 0,
                "type": "string"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bytes": {
                "description": "UTF-8 bytes.",
                "type": "number"
              },
              "characters": {
                "description": "Unicode code points.",
                "type": "number"
              },
              "lines": {
                "type": "number"
              },
              "utf16_units": {
                "type": "number"
              },
              "words": {
                "type": "number"
              }
            },
            "required": ["bytes", "characters", "lines", "utf16_units", "words"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:929a2741a1b92dd9356b75ceb3b1511edf0ff4e2518e860ab0b57b392251848e"
        },
        {
          "name": "cron_describe",
          "title": "Explain a cron expression",
          "description": "Parse a standard 5-field cron expression (minute hour day-of-month month day-of-week) into a plain-English breakdown and the next few run times in UTC. Use to sanity-check a schedule instead of guessing what the fields mean.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "expression": {
                "description": "A 5-field cron expression, e.g. \"30 2 * * 1-5\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["expression"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "day_of_month": {
                "type": "string"
              },
              "day_of_week": {
                "type": "string"
              },
              "hour": {
                "type": "string"
              },
              "minute": {
                "type": "string"
              },
              "month": {
                "type": "string"
              },
              "next_runs": {
                "description": "Next run times in UTC ISO 8601.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["day_of_month", "day_of_week", "hour", "minute", "month", "next_runs"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e4e411bd9a8a15d9417dffed54abd2f1fd8665657dd58029ea986ac2f54ab6b"
        },
        {
          "name": "datetime",
          "title": "Current or parsed date/time",
          "description": "Get the current date/time, or convert a given timestamp, into a target IANA timezone with ISO, Unix and human-readable forms. Pass a Unix timestamp (seconds or ms) or an ISO string as input; omit it for \"now\". LLMs cannot know the real current time, so use this instead of guessing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "input": {
                "description": "Optional: a Unix timestamp (s or ms) or ISO date string. Omit for the current time.",
                "maxLength": 64,
                "type": "string"
              },
              "timezone": {
                "default": "UTC",
                "description": "IANA timezone, e.g. \"America/New_York\" or \"UTC\".",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "iso_utc": {
                "type": "string"
              },
              "local": {
                "description": "Human-readable local time in the timezone.",
                "type": "string"
              },
              "timezone": {
                "type": "string"
              },
              "unix_ms": {
                "type": "number"
              },
              "unix_s": {
                "type": "number"
              }
            },
            "required": ["iso_utc", "local", "timezone", "unix_ms", "unix_s"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2636aaf16df8499b3c6aa3a51b79f89c7981e1eca9d8c573a233b3dc7d4e05a"
        },
        {
          "name": "diff",
          "title": "Line diff between two texts",
          "description": "Compute a line-by-line diff between two texts, marking removed lines with \"-\", added with \"+\" and unchanged with two spaces, plus a change count. Use to see exactly what changed instead of comparing by eye. Capped at 1000 lines per side.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "The original (\"before\") text.",
                "maxLength": 100000,
                "minLength": 0,
                "type": "string"
              },
              "b": {
                "description": "The updated (\"after\") text.",
                "maxLength": 100000,
                "minLength": 0,
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "added": {
                "type": "number"
              },
              "changed": {
                "type": "boolean"
              },
              "diff": {
                "description": "The line diff (+/-/space prefixed), empty if identical.",
                "type": "string"
              },
              "removed": {
                "type": "number"
              }
            },
            "required": ["added", "changed", "diff", "removed"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bae39cd4e3d92e9e8825a0d0c1ff70e07070daee2ae146f7a750d47db77349d2"
        },
        {
          "name": "hash",
          "title": "Hash text (SHA family)",
          "description": "Compute a cryptographic hash of text (SHA-1, SHA-256, SHA-384 or SHA-512) and return the hex digest. Use for checksums, cache keys, or verifying content. MD5 is intentionally not offered (broken, and unavailable in Web Crypto). LLMs cannot compute these reliably by hand, so always use this tool instead of guessing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "algorithm": {
                "default": "sha-256",
                "description": "Hash algorithm. Default sha-256.",
                "enum": ["sha-256", "sha-1", "sha-384", "sha-512"],
                "type": "string"
              },
              "input": {
                "description": "Text to hash (UTF-8).",
                "maxLength": 100000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "algorithm": {
                "description": "The hash algorithm used.",
                "type": "string"
              },
              "hex": {
                "description": "The hex-encoded digest.",
                "type": "string"
              }
            },
            "required": ["algorithm", "hex"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a1a997e3c683f4e0a02f4346b66568264d8c4b08a029302726bdf23494aa19e"
        },
        {
          "name": "hmac",
          "title": "HMAC signature of a message",
          "description": "Compute an HMAC (keyed hash) of a message with a secret, using SHA-1/256/384/512, returned as hex or Base64. Use to sign webhook payloads or verify a signature instead of guessing. LLMs cannot compute this by hand.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "algorithm": {
                "default": "sha-256",
                "description": "Hash algorithm.",
                "enum": ["sha-256", "sha-1", "sha-384", "sha-512"],
                "type": "string"
              },
              "encoding": {
                "default": "hex",
                "description": "Output encoding.",
                "enum": ["hex", "base64"],
                "type": "string"
              },
              "message": {
                "description": "The message to sign (UTF-8).",
                "maxLength": 100000,
                "minLength": 0,
                "type": "string"
              },
              "secret": {
                "description": "The shared secret key (UTF-8).",
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message", "secret"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "algorithm": {
                "type": "string"
              },
              "encoding": {
                "type": "string"
              },
              "signature": {
                "description": "The HMAC in the requested encoding.",
                "type": "string"
              }
            },
            "required": ["algorithm", "encoding", "signature"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
