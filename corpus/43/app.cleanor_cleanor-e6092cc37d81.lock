        {
          "name": "image_format_savings",
          "title": "Real storage savings of next-gen image formats",
          "description": "How much smaller WebP, AVIF or JPEG XL are than JPEG at matched perceptual quality, from Cleanor Labs’ controlled benchmark. Also reports the \"HEIC conversion tax\" (converting an iPhone HEIC to JPG/PNG makes it bigger). Use to justify a format choice when building a site or app.",
