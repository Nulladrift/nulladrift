{
  "lockfileVersion": 2,
  "subjects": {
    "com.jithox/jithox": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jithox.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "jithox",
        "title": "Jithox",
        "version": "1.1.0",
        "description": "Read-only checks for payments, invoices, VAT and company records, EU sanctions, imports, energy labels, and agent action preflights. Nothing sends, pays, files, or changes an external system.",
        "websiteUrl": "https://jithox.com",
        "icons": [
          {
            "src": "https://jithox.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Jithox at https://jithox.com/api/mcp: one connection to 35 read-only tools across payments, e-invoicing, VAT and companies, EU energy labels, import and sanctions. Start with jithox_task: give the task in plain words with its values; it picks the tool, calls it and returns the answer. find_jithox_tool only ranks; describe_jithox_tool gives a tool's full schema; call_jithox_tool calls a tool by name. Five checks need no token (IBAN, supplier bank change, payment preflight, Peppol readiness and lookup); a tool that needs one answers HTTP 401 with an OAuth challenge for this URL, and nothing runs or is charged before you sign in.",
      "tools": [
        {
          "name": "call_jithox_tool",
          "title": "Call a Jithox tool",
          "description": "Call any Jithox tool by name with its arguments. Same answer, price and sign-in as that tool on its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arguments": {
                "description": "The tool's arguments (describe_jithox_tool shows its schema).",
                "type": "object"
              },
              "name": {
                "description": "The tool name.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Call a Jithox tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["tools:discover", "engine:call", "actions:prepare:agent-action-preflight", "actions:prepare:company-register-verification"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:5624f543efc7f7d46719684627bb15e03d2a86680983155b453421836ddf7f09"
        },
        {
          "name": "describe_jithox_tool",
          "title": "Describe Jithox tools",
          "description": "Full description and input schema of up to 5 Jithox tools by name, so you can call them with call_jithox_tool. Runs nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "names": {
                "description": "Tool names, e.g. from find_jithox_tool.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Describe Jithox tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:d478a4c6b59f3f68eae7670facc23072a6256fb3bb0e109c81bb4698037bcca9"
        },
        {
          "name": "find_jithox_tool",
          "title": "Find the right Jithox tool",
          "description": "Rank Jithox tools for a goal in plain words: name, reason, price and example arguments. Runs nothing; no fit means no tool, never a guess.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goal": {
                "description": "What you want to get done, in your own words.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "max_results": {
                "description": "How many tools at most (1-5); default 3.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["goal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the right Jithox tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:91b8d45d3ecbec3a8960d9f8e95398d1b71e89b95e4860587461c15c480a68f2"
        },
        {
          "name": "jithox_task",
          "title": "Do a Jithox task",
          "description": "Say what you need in plain words (any language), e.g. \"check IBAN BE68539007547034\" or \"can BE0403170701 receive Peppol invoices?\". Jithox picks the right tool from all its products (payments, e-invoicing, VAT and companies, EU energy labels, import, sanctions), calls it and returns its answer. If the task lacks a value, nothing runs: you get the tool and its schema; call again with `tool` and `arguments`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arguments": {
                "description": "Optional: the tool's arguments; used as given instead of reading them from the task.",
                "type": "object"
              },
              "dry_run": {
                "description": "Optional: true picks the tool and fills the arguments but runs nothing.",
                "type": "boolean"
              },
              "task": {
                "description": "What you want done, with the values it is about.",
                "maxLength": 1000,
                "minLength": 3,
                "type": "string"
              },
              "tool": {
                "description": "Optional: the tool to use (from an earlier answer); skips the pick.",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Do a Jithox task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["tools:discover", "engine:call", "actions:prepare:agent-action-preflight", "actions:prepare:company-register-verification"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7d36b2ddbcd58a6945ef5dcfa20aa22621604e4f7c8a35372d972fd069c7731e"
        }
      ],
      "digest": "sha256:a0301188c0558c85a054fdd07c60e77879f76bec864156853de12ec2eb480b1d"
    }
  }
