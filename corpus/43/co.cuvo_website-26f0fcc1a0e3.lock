      },
      "instructions": "Tools over Cuvo Health's published site content, plus live discovery-call booking. Read: get_overview and get_pricing for the platform and its published pricing, list_comparisons/get_comparison for Cuvo-vs-competitor pages, list_articles/get_article for the blog. Book: get_availability to fetch open slots in the user's timezone, then book_discovery_call once the user explicitly confirms a slot, their full name, and their email (the calendar invite goes there); request_callback captures a phone callback instead. Never book without the user's consent.",
      "tools": [
        {
          "name": "book_discovery_call",
          "title": "Book a discovery call",
          "description": "Book a real 30-minute Cuvo discovery call for the user. Requires their explicit confirmation of a specific slot from get_availability plus their real full name and email; the calendar invite goes to that email. Do not book without the user's consent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "User's email (receives the invite)",
                "type": "string"
              },
              "name": {
                "description": "User's full name",
                "type": "string"
              },
              "phone": {
                "description": "Optional phone number",
                "type": "string"
              },
              "slot_start_iso": {
                "description": "startIso of the chosen slot, exactly as returned by get_availability",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone used when fetching availability",
                "type": "string"
              }
            },
            "required": ["email", "name", "slot_start_iso", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a discovery call"
          },
          "behavior": {
            "destructive": false,
