            "additionalProperties": false,
            "properties": {
              "followId": {
                "pattern": "^[a-f0-9]{32}$",
                "type": "string"
              },
              "leaderTx": {
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              }
            },
            "required": ["followId", "leaderTx"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
