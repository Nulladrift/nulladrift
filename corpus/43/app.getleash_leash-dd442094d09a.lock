        {
          "name": "leash_risk_check",
          "title": "Leash risk check",
          "description": "Leash risk firewall. Pass {tx:{from,to,data?,value? (HYPE decimal)}} to assess a transaction on the selected chain (simulation, approvals, recipients, address poisoning, new/unverified contracts, look-alike tokens, value), OR Hyperliquid perp fields {account, coin, side, size, leverage, stopPrice?, limits?} for a pre-trade check on live public data. Returns verdict pass/warn/block with checks. It NEVER places orders or sends anything. Chains: elysium (default), hyperevm, robinhood, base, arc, bsc.",
          "inputSchema": {
            "properties": {
              "account": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "chain": {
                "default": "elysium",
                "description": "elysium (default), hyperevm, robinhood, base, arc, bsc",
                "enum": ["elysium", "hyperevm", "robinhood", "base", "arc", "bsc"],
                "type": "string"
              },
              "coin": {
                "pattern": "^[A-Za-z0-9:@_-]{1,20}$",
                "type": "string"
              },
              "leverage": {
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "limits": {
                "properties": {
                  "allowedCoins": {
                    "items": {
                      "pattern": "^[A-Za-z0-9:@_-]{1,20}$",
                      "type": "string"
                    },
                    "maxItems": 100,
                    "type": "array"
                  },
                  "maxLeverage": {
                    "maximum": 100,
                    "minimum": 1,
                    "type": "number"
                  },
                  "maxNotionalUsd": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "maxPositionPctOfEquity": {
                    "maximum": 1000,
                    "minimum": 1,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "side": {
                "enum": ["buy", "sell"],
                "type": "string"
              },
              "size": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "stopPrice": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "tx": {
                "properties": {
                  "data": {
                    "maxLength": 262146,
                    "pattern": "^0x([0-9a-fA-F]{2})*$",
                    "type": "string"
                  },
                  "from": {
                    "pattern": "^0x[0-9a-fA-F]{40}$",
                    "type": "string"
                  },
                  "to": {
                    "anyOf": [
                      {
                        "pattern": "^0x[0-9a-fA-F]{40}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "value": {
                    "default": "0",
                    "pattern": "^\\d{1,40}(\\.\\d{1,36})?$",
                    "type": "string"
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fa6ce386548b8b3d3f8f4753b467317f04f4d3f6884ab72558456372542186b9"
