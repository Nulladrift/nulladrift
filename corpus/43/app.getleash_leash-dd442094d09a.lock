          "description": "Leash firewall for a serialized Solana transaction (base64, legacy or v0) and the signer you expect: lookup tables, every instruction (drainer patterns: assign, authority changes, close-to-stranger, unlimited delegates, durable nonce, unknown programs, pump admin and Squads takeover), simulation and received-token checks. Returns pass/warn/block; sends nothing.",
