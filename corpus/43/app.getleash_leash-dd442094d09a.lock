              },
              "chain": {
                "default": "elysium",
                "description": "elysium (default), hyperevm, robinhood, base, arc, bsc",
                "enum": ["elysium", "hyperevm", "robinhood", "base", "arc", "bsc"],
                "type": "string"
              },
              "from": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "policy": {
                "description": "Optional Leash policy token (lp1.…) from the /wallets page. With a policy, set from = the agent address: the call is routed through the agent's Safe (Safe.execTransaction) so the Safe pays, and it is refused unless it fits the policy. Limits are enforced by the Leash gateway, not on-chain. The agent is a 1-of-2 Safe owner, so if its key is used directly (outside Leash) it can bypass these limits. An audited on-chain allowance module is planned. Revoking removes the agent as owner on-chain. Per-transaction and optional rolling-24h daily caps apply to native HYPE and to each ERC-20 in the policy's tokenCaps (transfer, transferFrom, approve and increaseAllowance amounts of the call the Safe executes). Approvals above the token's daily cap (or per-tx cap if no daily cap) count as unlimited and are refused unless the cap sets allowUnlimitedApprove; approve(spender, 0) is always allowed. ERC-20 movements on tokens without a cap are refused when uncappedTokens='block' (default for new policies) and allowed uncounted when 'allow' (legacy v1 tokens behave as 'allow'; re-issue them). Undecodable calldata counts native value only.",
