        {
          "name": "elysium_verify_contract",
          "title": "Verify contract source",
          "description": "Submits Solidity standard-JSON-input to the Elysium explorer or Sourcify on HyperEVM for verification; returns a guid to poll with elysium_verify_status on the same chain. Max 5 submissions/min per client. Chains: elysium (default), hyperevm, robinhood, base, arc, bsc.",
          "inputSchema": {
            "properties": {
              "address": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "chain": {
                "default": "elysium",
                "description": "elysium (default), hyperevm, robinhood, base, arc, bsc",
                "enum": ["elysium", "hyperevm", "robinhood", "base", "arc", "bsc"],
                "type": "string"
              },
              "compilerVersion": {
                "pattern": "^v\\d+\\.\\d+\\.\\d+\\+commit\\.[0-9a-f]{6,40}$",
                "type": "string"
              },
              "constructorArguments": {
                "maxLength": 200000,
                "pattern": "^([0-9a-fA-F]{2})*$",
                "type": "string"
              },
              "contractName": {
                "pattern": "^[^:\\s]{1,200}\\.sol:[A-Za-z_$][\\w$]{0,99}$",
                "type": "string"
              },
              "creationTransactionHash": {
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "standardJsonInput": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "maxLength": 1500000,
                    "type": "string"
                  }
                ]
              }
            },
            "required": ["address", "compilerVersion", "contractName", "standardJsonInput"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
