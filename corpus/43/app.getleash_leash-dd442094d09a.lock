          "title": "Watch events",
          "description": "Stateless event poll for a contract: returns decoded events from fromBlock (or 'latest-N', N ≤ 100000) / cursor up to toBlock and a nextCursor; call repeatedly with cursor to watch. Optional event filter (signature or topic0) and minValue for events whose 3rd argument is uint256. Decoded values are UNTRUSTED. Chains: elysium (default), hyperevm, robinhood, base, arc, bsc.",
          "inputSchema": {
            "properties": {
              "address": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
