        {
          "name": "elysium_prepare_montra_launch",
          "title": "Prepare Montra token launch",
          "description": "Builds (not signs) a Montra launch() for a native-HYPE pair: resolves the factory and config row live, computes the creator's first buy and its minimum output, simulates, risk-checks and returns a signing link. Launch fields are permanent. With a policy, the agent's Safe is the creator and default fee recipient. Chains: elysium (default), hyperevm, robinhood, base, arc, bsc.",
          "inputSchema": {
            "properties": {
              "antiSnipeSeconds": {
                "anyOf": [
                  {
                    "const": 0,
                    "type": "number"
                  },
                  {
                    "const": 5,
                    "type": "number"
                  },
                  {
                    "const": 10,
                    "type": "number"
                  },
                  {
                    "const": 30,
                    "type": "number"
                  },
                  {
                    "const": 60,
                    "type": "number"
                  },
                  {
                    "const": 300,
                    "type": "number"
                  },
                  {
                    "const": 900,
                    "type": "number"
                  },
                  {
                    "const": 1800,
                    "type": "number"
                  }
                ],
                "default": 0
              },
              "chain": {
                "default": "elysium",
                "description": "elysium (default), hyperevm, robinhood, base, arc, bsc",
                "enum": ["elysium", "hyperevm", "robinhood", "base", "arc", "bsc"],
                "type": "string"
              },
              "description": {
                "maxLength": 500,
                "type": "string"
              },
              "feeRoute": {
                "anyOf": [
                  {
                    "const": "creator",
                    "type": "string"
                  },
                  {
                    "const": "holders",
                    "type": "string"
                  },
                  {
                    "properties": {
                      "recipients": {
                        "items": {
                          "pattern": "^0x[0-9a-fA-F]{40}$",
                          "type": "string"
                        },
                        "maxItems": 4,
                        "minItems": 1,
                        "type": "array"
                      },
                      "sharesBps": {
                        "items": {
                          "maximum": 10000,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "maxItems": 4,
                        "minItems": 1,
                        "type": "array"
                      }
                    },
                    "required": ["recipients", "sharesBps"],
                    "type": "object"
                  }
                ]
              },
              "firstBuyHYPE": {
                "default": "0",
                "pattern": "^\\d+(\\.\\d{1,18})?$",
                "type": "string"
              },
              "from": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "logo": {
                "description": "ipfs:// or https:// image URI. Leash does not fetch the metadata document to fill this.",
                "maxLength": 512,
                "pattern": "^(ipfs:\\/\\/|https:\\/\\/)\\S+$",
                "type": "string"
              },
              "metadataURI": {
                "description": "ipfs:// or https:// JSON metadata document (e.g. from montra_upload_metadata)",
                "maxLength": 512,
                "pattern": "^(ipfs:\\/\\/|https:\\/\\/)\\S+$",
                "type": "string"
              },
              "name": {
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
