                "type": "string"
              },
              "cursor": {
                "pattern": "^\\d{1,12}$",
                "type": "string"
              },
              "event": {
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "fromBlock": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "pattern": "^latest-\\d{1,6}$",
                    "type": "string"
                  }
                ]
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "minValue": {
                "pattern": "^\\d{1,78}$",
                "type": "string"
              },
              "toBlock": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["address"],
            "type": "object"
          },
