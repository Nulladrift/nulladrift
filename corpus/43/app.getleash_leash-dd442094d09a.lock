        {
          "name": "leash_policy_create",
          "title": "Create Leash policy",
          "description": "Signs a Leash policy token for an agent wallet (same rules as POST /api/policy: Safe deployed, owner and agent both owners, caps, expiry ≤ 1 year). The OWNER should create the policy. The token only limits what Leash will prepare; the agent key can still act outside Leash (see HONEST note). Limits are enforced by the Leash gateway, not on-chain. The agent is a 1-of-2 Safe owner, so if its key is used directly (outside Leash) it can bypass these limits. An audited on-chain allowance module is planned. Revoking removes the agent as owner on-chain. Chains: elysium (default), hyperevm, robinhood, base, arc, bsc.",
          "inputSchema": {
            "properties": {
              "agent": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "allowedContracts": {
                "items": {
                  "pattern": "^0x[0-9a-fA-F]{40}$",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "chain": {
                "default": "elysium",
                "description": "elysium (default), hyperevm, robinhood, base, arc, bsc",
                "enum": ["elysium", "hyperevm", "robinhood", "base", "arc", "bsc"],
                "type": "string"
              },
              "expiresAt": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                "type": "string"
              },
              "maxPerDayWei": {
                "pattern": "^\\d{1,78}$",
                "type": "string"
              },
              "maxPerTxWei": {
                "pattern": "^\\d{1,78}$",
                "type": "string"
              },
              "owner": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "safe": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "tokenCaps": {
                "items": {
                  "properties": {
                    "allowUnlimitedApprove": {
                      "default": false,
                      "type": "boolean"
                    },
                    "maxPerDay": {
                      "pattern": "^\\d{1,78}$",
                      "type": "string"
                    },
                    "maxPerDayUnits": {
                      "pattern": "^\\d{1,40}(\\.\\d{1,36})?$",
                      "type": "string"
                    },
                    "maxPerTx": {
                      "pattern": "^\\d{1,78}$",
                      "type": "string"
                    },
                    "maxPerTxUnits": {
                      "pattern": "^\\d{1,40}(\\.\\d{1,36})?$",
                      "type": "string"
                    },
                    "token": {
                      "pattern": "^0x[0-9a-fA-F]{40}$",
                      "type": "string"
                    }
                  },
                  "required": ["token"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "uncappedTokens": {
                "default": "block",
                "enum": ["block", "allow"],
                "type": "string"
              }
            },
            "required": ["agent", "expiresAt", "maxPerTxWei", "owner", "safe"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f5245e4bb53c1bd16d118e73225c1967eab9f73eac8a84a6a8c85171a29a3c2"
