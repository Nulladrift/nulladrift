        {
          "name": "copy_prepare_evm",
          "title": "Prepare EVM copy trade",
          "description": "Re-reads a leader receipt, accounts for copy and policy caps atomically, simulates the full Safe transaction, and applies the risk firewall before a signing link. Leash fee 0.50% is inside the signed batch. Past results are no guarantee. Copying is late by design: you buy after the wallet you copy, usually at a worse price, and can lose everything you put in.",
