{
  "lockfileVersion": 2,
  "subjects": {
    "com.standardblanks/shop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://standardblanks.com/mcp/shop"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "standardblanks-shop",
        "title": "Standard Blanks",
        "version": "1.0.0",
        "websiteUrl": "https://standardblanks.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Standard Blanks sells blank apparel (tees, hoodies, polos, hats, bags and more) for decorators, print shops, teams and businesses, shipped from warehouses across the US. Find products with search_catalog, read one with get_product (call it again with a color for that color's sizes and SKUs), check stock with get_inventory, price a set of items with quote, and hand the shopper a cart with build_cart: it returns a link that opens their cart on standardblanks.com, where they review it and check out. Nothing here takes payment or places an order. Prices are per unit and in US cents; each style's price depends on that style's total units in the order. Sales tax is calculated at checkout. Questions about an order go to support@standardblanks.com.",
      "tools": [
        {
          "name": "build_cart",
          "title": "Build a cart link",
          "description": "Create a cart of SKUs and quantities and return a link (claimUrl) that opens it in the shopper's cart on standardblanks.com, where they review it and check out. It does not take payment or place an order. Give the shopper the link. Limits: 40 lines, $5,000 of merchandise; the link works for 7 days.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "items": {
                "description": "1–40 lines.",
                "items": {
                  "properties": {
                    "qty": {
                      "description": "Units of this SKU.",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "A variant SKU from get_product (called with a color).",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["qty", "sku"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "note": {
                "description": "Optional context for our support team, e.g. what the order is for. Not shown on the cart.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6ee8cad16e70c3d878676f99ea0af13896f6f3410f4079dac4edc21563717965"
        },
        {
          "name": "get_inventory",
          "title": "Check availability",
          "description": "Whether one variant is available now: in_stock, low (a dozen or fewer), out_of_stock, or unknown. Pass its SKU, or the product slug with color and size.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "color": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "size": {
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "sku": {
                "description": "A variant SKU from get_product (called with a color).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Product slug, with color and size.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72b0e3c2fa569e901a1bc14da00e5a3c2fa237ccbc93bad775e71c797002cf0f"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Details for one product, by slug (from search_catalog) or by any of its variant SKUs: description, colors with images and availability, sizes, the size chart (garment measurements), fabric specs, and how well it takes each decoration method (screen print, DTG, embroidery, sublimation, heat-transfer vinyl, discharge, DTF). Pass `color` to also get that color's sizes, each with its SKU and availability.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "color": {
                "description": "A color name exactly as listed in `colors`.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "sku": {
                "description": "A variant SKU from get_product (called with a color).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Product slug from search_catalog.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8987d663700c64ae35ab94b1b177aede42f1534eb541eccb566db1083188de35"
        },
        {
          "name": "quote",
          "title": "Price a set of items",
          "description": "Exact prices for a set of SKUs and quantities, as the Standard Blanks cart would charge them: each line's unit price (set by its style's total units), the merchandise subtotal, shipping, and the total before tax. Pass ship_to_zip for that ZIP's shipping and estimated delivery dates (estimates, not guarantees); without it, shipping assumes a contiguous-US address and no dates are given. Sales tax is calculated at checkout. Creates nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "items": {
                "description": "1–40 lines.",
                "items": {
                  "properties": {
                    "qty": {
                      "description": "Units of this SKU.",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "A variant SKU from get_product (called with a color).",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["qty", "sku"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "ship_to_zip": {
                "description": "5-digit US ZIP code.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0d3659f7a64d3372496df04b0f954b55b3450df8d07a05f8f8acc3c6e651233"
        },
        {
          "name": "search_catalog",
          "title": "Search the catalog",
          "description": "Search Standard Blanks' blank apparel by keywords and filters. Returns up to 20 products with name, brand, slug, the lowest single-unit price (\"from\" price, in cents), availability, image and product page URL. When the query names a color or size, matchedColors lists the colors of that style that match (best first) and url opens the page on that color; an empty matchedColors for a query that named a color means that style is not sold in it. signal reports typo corrections and any words the search had to drop. Use the slug with get_product.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Exact brand name, e.g. 'BELLA + CANVAS'.",
                "maxLength": 100,
                "type": "string"
              },
              "category": {
                "description": "Category slug.",
                "enum": ["accessories", "bags", "bottoms", "fleece-core-crew", "fleece-core-hood", "fleece-premium-crew", "fleece-premium-hood", "headwear", "infant-baby", "knits-layering", "outerwear", "polos", "t-shirts-core", "t-shirts-long-sleeve", "t-shirts-premium", "wovens"],
                "type": "string"
              },
              "cheaper_than": {
                "description": "A style's slug: the comparable styles priced below it.",
                "type": "string"
              },
              "color": {
                "description": "Color family.",
                "enum": ["blacks", "whites", "greys", "blues", "reds", "greens", "yellows", "oranges", "purples", "pinks", "browns", "neutrals", "others"],
                "type": "string"
              },
              "decoration": {
                "description": "Only styles rated good or best for this decoration method (screen print, DTG, embroidery, sublimation, heat-transfer vinyl, discharge, DTF).",
                "enum": ["screen-print", "dtg", "embroidery", "sublimation", "vinyl", "discharge", "dtf"],
                "type": "string"
              },
              "fit": {
                "description": "Cut of the garment.",
                "enum": ["classic", "relaxed", "oversized", "slim", "athletic", "retail"],
                "type": "string"
              },
              "in_stock": {
                "description": "Only styles with stock now.",
                "type": "boolean"
              },
              "limit": {
                "description": "Results to return (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Highest single-unit price, in US dollars.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "min_price": {
                "description": "Lowest single-unit price, in US dollars.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "query": {
                "description": "Keywords: brand, style number or product words, e.g. 'heavyweight hoodie' or 'bella canvas 3001'.",
                "maxLength": 200,
                "type": "string"
              },
              "similar_to": {
                "description": "A style's slug: list the styles comparable to it (same garment, other brands and price tiers), leaving it out. \"alternative to gildan 18500\" in `query` does the same.",
                "type": "string"
              },
              "size": {
                "description": "Only styles offered in this size.",
                "enum": ["xxs", "xs", "s", "m", "l", "xl", "2xl", "3xl", "4xl", "5xl", "6xl", "tall"],
                "type": "string"
              },
              "sort": {
                "description": "Order of results. Default: relevance with a query, popular without one.",
                "enum": ["relevance", "price-asc", "price-desc", "popular"],
                "type": "string"
              },
              "weight": {
                "description": "Fabric weight band (ultralight 0-4 oz, light 4-5 oz, standard 5-6 oz, mid-heavy 6-7 oz, heavy 7-9 oz, heavyweight 9+ oz).",
                "enum": ["ultralight", "light", "standard", "mid-heavy", "heavy", "heavyweight"],
                "type": "string"
              },
              "youth_and_adult": {
                "description": "Only styles a team can order in both kids' and adult sizes: one style whose sizes span both, or one of a manufacturer's matching youth/adult pair (e.g. Gildan 5000 and 5000B).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:06b7f5ea405d2cad8a1b0d3c21a716586b4eff24765e33393cbe31d4d621a60d"
        }
      ],
      "digest": "sha256:4e99ce956a39f4e4b2c3c76a6da62ed265dc521c78287e9db75fea67ff588489"
    }
  }
}
