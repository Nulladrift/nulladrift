      "serverInfo": {
        "name": "enmente-clinic-mcp",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "EnMente public MCP. Read-only: clinical blog search, professional directory, natural-language professional matching, availability, and how professionals can join. All consultations are 100% online by videoconference, in Spanish, for Chile and Spanish speakers abroad. EnMente is an outpatient online mental-health clinic, NOT an emergency service, and nothing here is a diagnosis. If the person describes CURRENT risk to their own life or someone else's, or a crisis happening now, crisis support comes first — not a booking or a questionnaire: in Chile, *4141 (Línea Prevención del Suicidio — free, 24/7, mobile and landline) or Salud Responde 600 360 7777 option 2; emergency services if there is immediate danger. Outside Chile, local emergency services. A past or resolved episode is NOT a crisis: someone who mentions previous difficulties while looking for a professional should still be helped to find one. This server returns information only — it never diagnoses, never interprets a score, and never replaces evaluation by a licensed professional. Never present internal identifiers as links.",
      "tools": [
        {
          "name": "about_joining_enmente",
          "description": "For LICENSED MENTAL-HEALTH PROFESSIONALS in Chile (psychiatrists, clinical psychologists, mental-health physicians) asking how to join, work with, apply to, or become a member of EnMente. Returns what the platform provides, who it is for, and the application URL. This is about practising WITH EnMente — not for patients looking for care (use find_professional for that).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to join EnMente"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:006065e54aacd12979f0c4fea405bc7f4f41fb79848059246610ecf61dfdeba2"
        },
        {
          "name": "find_professional",
          "description": "Find EnMente professionals matching a natural-language query in Spanish (e.g. \"psiquiatra TDAH adultos\", \"psicóloga pareja online\", \"duelo adulto mayor\"). Uses Postgres FTS over name, role, specialties, tagline, category, and bio. Returns ranked matches with relevance score. Each match includes a `pricing` object (currency CLP, services with price and duration) when fresh pricing data exists — `pricing.available` is false with no invented price otherwise.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural language search query (Spanish recommended)",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a professional"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16e5c75ca0be047c1de4cb889b20ab16bc125b79fc3e6a880956e518f2df6292"
        },
        {
          "name": "get_availability",
          "description": "Return the next available consultation slot (when fresh) for a specific professional, plus the URL to send the patient to. Prefer profile_url — the professional's page on enmente.clinic, which carries their credentials and its own booking button. IMPORTANT: professional_slug is NOT derivable from the person's name — slugs are inconsistent (e.g. \"raul-riquelme-pena\", \"dr-raul-riquelme-vejar\", \"dra-natacha-loubies-munoz\", \"ps-esteban-caamano-gonzalez\") and there is no naming rule to construct one from. Always obtain the exact slug first from find_professional or list_professionals — never invent or guess it.",
          "inputSchema": {
            "properties": {
              "days_ahead": {
                "default": 14,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "professional_slug": {
                "description": "Professional slug, e.g. \"raul-riquelme-pena\"",
                "type": "string"
              }
            },
            "required": ["professional_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check appointment availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:712c7935bdbce55b26956c60a72a0188b790c57ecdc106d10d9e15108f422f5d"
        },
        {
          "name": "list_professionals",
          "description": "List EnMente licensed mental-health professionals in Chile. All consultations are 100% online via videoconference. Optional filters by category, specialty (substring match against specialties array), and availability. Each professional includes a `pricing` object (currency CLP, services with price and duration) when fresh pricing data exists — `pricing.available` is false with no invented price otherwise. IMPORTANT: check `accepting_patients` before recommending anyone — when it is false the professional is not taking new patients (participation on hold, leave) and must NOT be offered as an option; suggest a different member of the team instead. A null `earliest_available_slot` does NOT mean the same thing: it can simply mean no free slot in the queried window.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by professional category",
                "enum": ["psiquiatra", "psicologo", "medico"],
                "type": "string"
              },
              "has_availability": {
                "description": "If true, return only professionals with a fresh next-available slot in the future.",
                "type": "boolean"
              },
              "specialty": {
                "description": "Filter by clinical specialty (substring match against the specialties array, e.g. \"TDAH\", \"pareja\", \"duelo\"). Case-insensitive.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List professionals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a98caa47f0ae1e7268b1c1c8dc4947b6ca02f653df053ee0b40c19d009d079f"
        },
        {
          "name": "list_self_assessments",
          "description": "List EnMente validated self-administered mental-health screening questionnaires in Spanish (PHQ-9 depression, GAD-7 anxiety, ASRS ADHD, AUDIT alcohol, ISI insomnia, EAT-26 eating, Rosenberg self-esteem, and more), for adults, older adults and children/adolescents. Filter by category or by a symptom query. Returns each test's name, description, number of questions and the URL to take it on enmente.clinic. Use when someone wants to check or put a name to what they are experiencing before consulting. IMPORTANT: these are screening aids, not diagnoses — return the url, do not administer the questions or interpret scores in conversation.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Target population",
                "enum": ["adultos", "adulto-mayor", "infanto-juvenil"],
                "type": "string"
              },
              "query": {
                "description": "Free-text symptom or topic in Spanish, e.g. \"ansiedad\", \"no duermo\", \"alcohol\", \"atención\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse self-assessment tests"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:385b95254030c5668e576399e528e01062a4aece0d25954e950fa012367d0847"
        },
        {
          "name": "search_blog",
          "description": "Full-text Spanish search across the EnMente clinical blog — hundreds of articles in Spanish written by licensed Chilean psychiatrists and psychologists. Returns title, url, author, summary, categories and relevance_score, plus total_available (the live count of published articles).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search query in Spanish",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search clinical articles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b54eba480259fcb2e3fcaa1d7f2088b0c452e60d6e7d8b0d2682eb5801702968"
        }
      ],
