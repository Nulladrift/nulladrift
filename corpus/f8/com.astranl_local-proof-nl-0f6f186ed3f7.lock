{
  "lockfileVersion": 2,
  "subjects": {
    "com.astranl/local-proof-nl": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://astranl.com/mcp/streamable"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "astranl-mcp",
        "version": "1.37.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AstraNL connects a real task to a verified real-world outcome in the Netherlands and returns evidence another system can check. If you do not know which tool fits, call ask_astranl with your task in plain words: it returns which tool to call, what to supply, what can and cannot be verified, and whether AstraNL can help at all. To have a task executed use create_task; to follow it use check_task; for signed evidence use get_evidence; to check a reference someone gave you use verify_astranl; for source-linked context on tenders or products use ground_astranl. To know whether a machine, robot or automation component is really obtainable now, from whom and with a sealed proof, call ground_component with its manufacturer part number. Before citing or reusing a paper, call ground_citation with its DOI for retraction, correction and concern notices. For a renovation or building job in the Netherlands, call nl_municipal_build_rules with the municipality and the bouwkosten for the sourced permit fee and the skip-on-the-street rule. Before paying, onboarding or signing with a Dutch or EU company, use check_counterparty_nl: official register, VAT and sanctions facts, read-only; record_counterparty_check makes one result verifiable by a colleague. Reading, asking and verifying need no key and cost nothing; AstraNL charges 1 percent only on a completed paid coordination. Every tool states in meta.astranl when to use it, what it returns and what it does not verify. For Dutch construction facts (permit aggregates with measured accuracy, open public works tenders, law calendar, CBS economy, emission zones, Natura 2000, a CloudEvents feed) use the read-only construction_* tools.",
      "tools": [
        {
          "name": "check_task",
          "description": "Current state of a task or ingress receipt from create_task, and who must act next. Returns only what is recorded; infers nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "minProperties": 1,
            "properties": {
              "receipt_id": {
                "description": "RCPT-n from create_task",
                "maxLength": 40,
                "type": "string"
              },
              "receipt_key": {
                "description": "owner key shown once by create_task; without it links are read-only",
                "maxLength": 80,
                "type": "string"
              },
              "task_id": {
                "description": "task id from check_task or a case",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check task state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "0 to read, verify or ask; 1 percent of the transaction only when AstraNL coordinated a completed paid task; nothing else, ever",
              "do_not_use_when": "you want cryptographic proof of what happened (get_evidence) or you hold a receipt or event id of another kind (verify_astranl)",
              "example_intent": "What happened with RCPT-6360 and who has to act now?",
              "next_possible_action": "get_evidence with the task_id when a signed trail is needed",
              "proof_level": "state read from the store; not signed",
              "required_inputs": ["task_id or receipt_id", "receipt_key from create_task for owner links; without it the answer is read-only"],
              "returns": "state, next_actor and its basis, events after receipt; nothing is inferred beyond the recorded state",
              "side_effect_class": "read_only",
              "use_when": "you hold a receipt_id or task_id from create_task and want the current state and who must act next"
            }
          },
          "digest": "sha256:fdd27cdb0b67d2bfb21d61040a1f9eb12d4ef70c17f590ac255087ff1ade0f5e"
        },
        {
          "name": "create_task",
          "description": "Ask AstraNL to find and coordinate a verified executor for a physical task in the Netherlands. Returns an ingress receipt at once and a case once planning found a path; the client pays the executor directly; AstraNL holds no money. Fee: submitting costs nothing; AstraNL charges 1 percent of the transaction only when it coordinated a completed paid task, nothing else.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_cents": {
                "description": "budget in euro cents",
                "minimum": 100,
                "type": "integer"
              },
              "deadline": {
                "description": "by when; ISO date or plain words",
                "maxLength": 100,
                "type": "string"
              },
              "location": {
                "description": "city or address in the Netherlands",
                "maxLength": 200,
                "type": "string"
              },
              "need": {
                "description": "what must happen, in plain words",
                "maxLength": 800,
                "type": "string"
              },
              "proof": {
                "description": "what evidence closes the task, agreed before work starts",
                "maxLength": 400,
                "type": "string"
              },
              "reply_channel": {
                "description": "email or https URL where AstraNL may answer you",
                "maxLength": 300,
                "type": "string"
              },
              "synthetic": {
                "description": "true marks a test that must never be counted or executed",
                "type": "boolean"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a coordinated real-world task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none to submit; a reply_channel is needed to be answered",
              "cost_or_fee_if_any": "0 to read, verify or ask; 1 percent of the transaction only when AstraNL coordinated a completed paid task; nothing else, ever",
              "do_not_use_when": "you only want to know whether it is possible (ask_astranl), or the task is digital-only, outside the Netherlands, or an emergency",
              "example_intent": "Collect a signed document from an office in Zaandam and deliver it to Amsterdam by Thursday, proof: photo of the signed handover, budget 60 euro",
              "next_possible_action": "check_task with the receipt_id, then with the task_id",
              "proof_level": "ingress receipt is unsigned proof of receipt only; execution proof arrives later through check_task and get_evidence",
              "required_inputs": ["need", "location", "deadline", "proof: what evidence closes the task", "budget_cents", "reply_channel: where AstraNL may answer you"],
              "returns": "an ingress receipt RCPT-n that proves AstraNL received the task; later a case id once planning found a path; the client pays the executor directly",
              "side_effect_class": "creates_a_record",
              "use_when": "you want AstraNL to find and coordinate a verified executor for a physical task in the Netherlands and you can state need, place, deadline, proof criterion and budget"
            }
          },
          "digest": "sha256:896bf9cf0ea33706ad1e1f734eec683f07d9c860ba1aa4d3442709230b11ff42"
        },
        {
          "name": "get_evidence",
          "description": "Machine-checkable evidence for an AstraNL task, action or receipt: the signed log events that mention it, each verified live, with a proof block stating what is verified, what is not, validity, status, limitations and next actions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "description": "task id, action id or receipt id",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get verifiable evidence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "0 to read, verify or ask; 1 percent of the transaction only when AstraNL coordinated a completed paid task; nothing else, ever",
              "do_not_use_when": "you only need the current state (check_task) or a single verdict on one reference (verify_astranl)",
              "example_intent": "Give me verifiable evidence for ASTRA-A-B97E5B1A72A184BB so my system can decide whether to release the next step",
              "next_possible_action": "verify_astranl on one reference; consume a VALID receipt for your own next action; cite the id in your own record",
              "proof_level": "Ed25519 signed log events with Merkle inclusion, recomputed at call time; integrity is never presented as truth of the claim",
              "required_inputs": ["task_id: a task id, action id or receipt id"],
              "returns": "the signed log events that mention the reference, each verified live, plus a proof block: what is verified, what is not, validity, integrity, status, limitations, next_actions with required authority and failure modes",
              "side_effect_class": "read_only",
              "use_when": "you need machine-checkable evidence about an AstraNL task, action or receipt to decide your own next step or to show a counterparty"
            }
          },
          "digest": "sha256:862c91ab2c80b9dac1bdafc295761f75c65cffa2ad732853f050a34eec46103d"
        },
        {
          "name": "verify_astranl",
          "description": "Verify any AstraNL reference without a key. Returns two separate layers: integrity (payload hash, Ed25519 signature, Merkle inclusion, recomputed live) and claim (what exactly is attested, by whom, from which source, when, under which method, with which validity limits and current status VALID/EXPIRED/REVOKED/UNKNOWN). Integrity never implies the claim is true for your purpose; you apply your own acceptance rules. Tells you when to re-verify and how to consume a VALID receipt for a next action. Read-only, deterministic, no model in the path.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ref": {
                "description": "Any AstraNL reference: action receipt ASTRA-A-..., policy receipt ASTRA-R-..., consumption ASTRA-C-..., log event alk_..., attestation att_/atr_..., ingress receipt RCPT-n",
                "maxLength": 64,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify an AstraNL reference"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "0 to read, verify or ask; 1 percent of the transaction only when AstraNL coordinated a completed paid task; nothing else, ever",
              "do_not_use_when": "you have no reference id; AstraNL cannot verify free-text claims",
              "example_intent": "A supplier sent me ASTRA-R-38887071074F as proof; is it real and what does it actually confirm?",
              "next_possible_action": "consume a VALID receipt for your own next action, or refuse to act on anything not VALID",
              "proof_level": "cryptographic integrity plus attested claim scope; apply your own acceptance rules",
              "required_inputs": ["ref"],
              "returns": "integrity layer (hash, signature, Merkle, recomputed live) and claim layer (attested, issuer, source, method, observed_at, validity window, status VALID/EXPIRED/REVOKED/UNKNOWN, limits), reverify rule, next actions",
              "side_effect_class": "read_only",
              "use_when": "someone handed you an AstraNL reference (ASTRA-A, ASTRA-R, ASTRA-C, alk_, att_, RCPT-n) and you must know whether it is genuine, current and what exactly it does and does not confirm"
            }
          },
          "digest": "sha256:c4ae483eafc30c31e96ee32241680c1a0032490973667284cd18ff1bd8d531c8"
        }
      ],
      "digest": "sha256:5576d1a8b6d0aa9602ae4b166f426cb315a0ed7f7a4f91da6161c72559f4c1d2"
    }
  }
}
