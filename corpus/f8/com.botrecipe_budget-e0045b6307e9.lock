{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/budget": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://budget.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "run-budget-guard",
        "title": "Run Budget Guard",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Spending caps for one AI agent run, shared by every sub-agent. Free watch-only mode tracks spend and drafts a weekly report of runs that went over; Pro enforces the cap with a clear STOP before the next model or tool call. $9 a month. Free 500 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "budget_status",
          "description": "See spend vs limits, remaining budget, whether the run is stopped and why, and the last 20 ledger events. Set close=true when the run finishes.",
          "inputSchema": {
            "properties": {
              "close": {
                "type": "boolean"
              },
              "handle": {
                "description": "The budget handle from open_budget (looks like bg_<id>.<secret>). Pass it to every sub-agent so they all spend from the same budget.",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7513de7b65f5d0a28580537921db3e0dc43e4c504a403172f9354d6222a9abfe"
        },
        {
          "name": "open_budget",
          "description": "Open a hard budget for one agent run before it starts: max dollars, tokens, calls and/or wall-clock seconds. Returns a handle. Give the handle to every sub-agent; they all draw from the same ledger, so one runaway loop or fork cannot exceed the run cap.",
          "inputSchema": {
            "properties": {
              "label": {
                "description": "What this run is for, e.g. \"nightly code cleanup\".",
                "type": "string"
              },
              "max_calls": {
                "description": "Cap on model/tool calls for the whole run.",
                "type": "integer"
              },
              "max_seconds": {
                "description": "Wall-clock cap in seconds from now.",
                "type": "integer"
              },
              "max_tokens": {
                "description": "Token cap (input + output) for the whole run.",
                "type": "integer"
              },
              "max_usd": {
                "description": "Dollar cap for the whole run (your own estimates per call).",
                "type": "number"
              },
              "mode": {
                "description": "shadow = watch only: track spend and flag where the cap WOULD have stopped the run, never block (free). enforce = return allowed=false at the cap (Pro). Default: enforce on Pro, shadow on free.",
                "enum": ["shadow", "enforce"],
                "type": "string"
              },
              "ttl_hours": {
                "description": "Handle lifetime (free max 24, Pro max 168). Default 24.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d20d34106c6b7bc1b84e30fdd7a1da648c5c676f02ce95a16b69b43d0991fddc"
        },
        {
          "name": "record",
          "description": "After a call, report the actual usage minus what you reserved (positive if it cost more, negative to give back an overestimate). Keeps the ledger honest without blocking.",
          "inputSchema": {
            "properties": {
              "handle": {
                "description": "The budget handle from open_budget (looks like bg_<id>.<secret>). Pass it to every sub-agent so they all spend from the same budget.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "tokens": {
                "type": "integer"
              },
              "usd": {
                "type": "number"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1962af62a82ccaf3db63660f0fe0dc979e409b9a5ceefd9d0e96fb2160404508"
        },
        {
          "name": "reserve",
          "description": "Call BEFORE each model call, tool call or sub-agent spawn with your estimate. Returns allowed=true and deducts it, or allowed=false with the limit that tripped. When allowed is false, stop, do not retry, and return your partial result to the user. Atomic, so parallel sub-agents cannot both slip under the cap.",
          "inputSchema": {
            "properties": {
              "calls": {
                "description": "Number of calls to reserve (default 1).",
                "type": "integer"
              },
              "handle": {
                "description": "The budget handle from open_budget (looks like bg_<id>.<secret>). Pass it to every sub-agent so they all spend from the same budget.",
                "type": "string"
              },
              "note": {
                "description": "Short note, e.g. \"web_search #12\".",
                "type": "string"
              },
              "tokens": {
                "description": "Estimated tokens of the next call.",
                "type": "integer"
              },
              "usd": {
                "description": "Estimated cost of the next call in USD.",
                "type": "number"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b13e919caa600440c42ae338d38315fc66915ac5af10553856f03b343533a3c"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $49/month All Access upgrade link (cloudforbots.com/offer). Free tier: 500 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f8895c9a1d194591686eb4108d589d31d709219a106bc36796a604b3aea5de83"
        },
        {
          "name": "weekly_report",
          "description": "Draft a plain-English report of the last 7 days for your key (or IP): runs, spend, runs that went over their cap, and dollars spent after a cap would have stopped them. Read-only; sends nothing. Show it to your user.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d73b8aa5a59ca2e849f246fe3d08bd429ce2a6c74d8e644226cb1133fef691f"
        }
      ],
      "digest": "sha256:5caefa8e28aaa06dcf6745371f564215bcd8ef38e9783646440291b6dc4a0673"
    }
  }
}
