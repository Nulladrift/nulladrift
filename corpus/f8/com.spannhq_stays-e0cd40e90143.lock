{
  "lockfileVersion": 2,
  "subjects": {
    "com.spannhq/stays": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.spannhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "hospitality",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Spann hospitality MCP: sample workflow tools are fixture-only; published customer tools return facts and official routes. Surface='public'. Inquiry tools, when explicitly configured, require authenticated operator access, exact payload preview and confirmation before sending an inquiry. Unknown delivery is never automatically retried. No live inventory, booking, payment or PMS action is supported. Actual approved customer catalog tools and token-bound desktop handoff are also available. The remote server cannot execute a client browser. Never treat a preparation report, reference, discount or return visit as verified booking/payment. Do not send guest or payment data to journey tools.",
      "tools": [
        {
          "name": "discover_customer_stays",
          "description": "Find eligible actual owner-approved customer property records by destination and traveler fit, without knowing a property name or ID. Read-only catalog discovery; no live availability or price. Returns fit evidence, limitations, official routes and expiring selection tokens. Coverage is limited to this approved catalog. Do not treat a conditional recommendation as a confirmed available/budget-matching stay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "const": "JPY"
                  },
                  "max_total": {
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["currency", "max_total"],
                "type": "object"
              },
              "destination": {
                "additionalProperties": false,
                "properties": {
                  "area": {
                    "type": "string"
                  },
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "const": "JP"
                  },
                  "prefecture": {
                    "type": "string"
                  }
                },
                "required": ["country"],
                "type": "object"
              },
              "guest_count": {
                "additionalProperties": false,
                "properties": {
                  "adults": {
                    "minimum": 1,
                    "type": "integer"
                  },
                  "children": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rooms": {
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["adults", "children", "rooms"],
                "type": "object"
              },
              "language": {
                "enum": ["en", "ja"]
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "preferences": {
                "additionalProperties": false,
                "properties": {
                  "whole_place": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "required_constraints": {
                "items": {
                  "enum": ["whole_place", "on_site_parking", "full_kitchen", "step_free"]
                },
                "type": "array"
              },
              "stay": {
                "additionalProperties": false,
                "properties": {
                  "check_in": {
                    "type": "string"
                  },
                  "check_out": {
                    "type": "string"
                  }
                },
                "required": ["check_in", "check_out"],
                "type": "object"
              }
            },
            "required": ["destination", "guest_count", "stay"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3267e7203495b9c20c0b351fe81d60aa81c8f429f2003664ebd89184639fc299"
        },
