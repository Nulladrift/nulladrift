            "additionalProperties": false,
            "properties": {
              "language": {
                "enum": ["en", "ja"],
                "type": "string"
              },
              "property_id": {
                "type": "string"
              },
              "room_rate_id": {
                "type": "string"
              },
              "traveler_constraints": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "constraint_type": {
                      "type": "string"
                    },
                    "notes": {
                      "type": ["string", "null"]
                    },
                    "value": {
                      "type": ["string", "number", "boolean", "null"]
                    }
                  },
                  "required": ["constraint_type", "value"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["language", "property_id", "room_rate_id"],
            "type": "object"
          },
