          "description": "Resume a Spann handoff by its opaque journey credential. Preparation reports are assistant-reported; booking and payment remain unconfirmed until independently reconciled with the provider. Confirmed states require an independently authorized property/provider receipt. Never send guest/card details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
