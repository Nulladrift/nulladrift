{
  "lockfileVersion": 2,
  "subjects": {
    "com.lilla-alva/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lilla-alva.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "lilla-alva-booking",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Check whether Lilla Älva is available. Without arguments, returns all blocked (unavailable) date ranges from today onward. With check_in and check_out (YYYY-MM-DD), also states whether that stay is available. Ranges are all-day and end-exclusive: a new stay may begin on another booking's check-out day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "check_in": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48f72357498f89f4b2f92e4f510d6adafff61986190275e39a0b80e83d7449fb"
        },
        {
          "name": "get_property_info",
          "title": "Get property info",
          "description": "Description, amenities, house rules, booking flow and contact details for Lilla Älva, a holiday home in Värmland, Sweden.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cec7d3c48ce2a071e0f973de04ed6f3daed248ac70312ba57041fff92ddede80"
        },
        {
          "name": "get_quote",
          "title": "Get price quote",
          "description": "Price breakdown in EUR for a stay at Lilla Älva: date-dependent nightly rates, mandatory cleaning fee, and optional add-ons (bed linens & towels per person, Hot Tub Service per stay, one-time dog fee).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bed_linens": {
                "default": false,
                "description": "Rent bed linens & towels (per person)",
                "type": "boolean"
              },
              "check_in": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "hot_tub": {
                "default": false,
                "description": "Hot Tub Service (€49 per stay)",
                "type": "boolean"
              },
              "number_of_dogs": {
                "default": 0,
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "number_of_guests": {
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["check_in", "check_out", "number_of_guests"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d652f86ee13c7dc25dd4b617c00ef2a065c8ffb90e8ab96084f834a2ec2cd18f"
        },
        {
          "name": "submit_booking_request",
          "title": "Submit booking request",
          "description": "Submit a booking request for Lilla Älva on behalf of the guest. This does NOT charge anything and is not an instant booking: it creates a pending request; the owner confirms or declines by email within 24 hours. Only submit with the guest's real name and email, after they have explicitly agreed to the dates and estimated total.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bed_linens": {
                "default": false,
                "type": "boolean"
              },
              "check_in": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guest_email": {
                "format": "email",
                "maxLength": 255,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "guest_name": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "guest_phone": {
                "maxLength": 40,
                "type": "string"
              },
              "hot_tub": {
                "default": false,
                "type": "boolean"
              },
              "number_of_dogs": {
                "default": 0,
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "number_of_guests": {
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "special_requests": {
                "maxLength": 1500,
                "type": "string"
              }
            },
            "required": ["check_in", "check_out", "guest_email", "guest_name", "number_of_guests"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8716a0921183b169dbb5e9374268116ad6d6fa0a2a633dc614dbf92ee3d9c0c3"
        }
      ],
      "digest": "sha256:ae3864863a5672c9c8c9cc1b2bed9ef7305c1d06e568d4627ebb5918a332ca67"
    }
  }
}
