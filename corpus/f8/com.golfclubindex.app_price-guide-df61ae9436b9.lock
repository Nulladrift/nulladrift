        {
          "name": "golf_best_used_under",
          "title": "Best used golf clubs under a budget",
          "description": "Use when someone asks for the best used drivers, fairway woods, hybrids, irons, wedges or putters under a budget in US dollars, optionally for one brand (e.g. \"best used drivers under $200\", \"best used Ping irons under $500\"). Returns the ranked list from golfclubindex.com for the nearest published budget at or below the one asked (model, average sale price, number of sales) and a link to the full page with live listings.",
