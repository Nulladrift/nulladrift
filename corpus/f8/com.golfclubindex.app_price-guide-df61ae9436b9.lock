      },
      "instructions": "Golf Club Index gives used golf club prices from completed eBay sales, updated daily. Use golf_used_value when someone asks what a used club is worth or what to sell it for; use golf_best_used_under when they ask for the best used clubs of a type under a budget; use find_used_deals when they want to buy one and ask for deals or listings priced below what the club usually sells for. golf_used_value and golf_best_used_under link to golfclubindex.com; find_used_deals links each listing through app.golfclubindex.com to eBay, with a commission disclosure. Give those links exactly as returned and never build eBay links yourself. The app has no accounts and only reads its own daily price data.",
      "tools": [
        {
          "name": "find_used_deals",
          "title": "Used golf club deals below the usual price",
          "description": "Use when someone wants to buy a used golf club and asks for deals, bargains or listings for sale, for one club (e.g. \"deals on a used TaylorMade P790 iron set\", \"cheap Vokey SM9\") or a club type (e.g. \"used driver deals under $200\"). Takes a club as the person said it or a club type, and an optional budget in US dollars. Returns up to 5 live eBay listings priced below what that club usually sells for (its median completed-sale price), with title, condition, price before shipping, the usual price and the gap, whether it is a great or good deal, the date it was last checked, and a link for each. Give each link exactly as returned (it counts the click and goes on to the eBay listing) and never build eBay links yourself; include the disclosure that Golf Club Index may earn a commission. For what a club is worth, use golf_used_value instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Club type when no club is named: driver, fairway wood, hybrid, iron, wedge or putter",
                "type": "string"
              },
              "club": {
                "description": "The club as the user said it, e.g. 'taylormade p790 irons'. Give this or category.",
                "type": "string"
              },
              "max_price": {
                "description": "Optional budget in US dollars, e.g. 200",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
