      },
      "transport": {
        "type": "http",
        "url": "https://geteverwear.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "geteverwear-catalogue",
        "title": "GetEverwear - catalogue public",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Catalogue public de GetEverwear, boutique française de vêtements et accessoires de seconde main : chaque pièce est unique. Lecture seule. lister_rayons donne l'arborescence, chercher_pieces trouve les pièces en vente, fiche_piece donne le détail d'une pièce. Prix en euros, liens vers la boutique.",
      "tools": [
        {
          "name": "chercher_pieces",
          "title": "Chercher des pièces",
          "description": "Cherche dans le catalogue GetEverwear (vêtements et accessoires de seconde main, pièces uniques) les pièces EN VENTE. Le texte peut être une phrase (« robe femme taille 38 moins de 40 euros », « blue shirt ») : la taille, la pointure, le budget, l'état, « pas cher », « nouveautés » et homme/femme y sont reconnus. Filtres facultatifs : rayon (handle donné par lister_rayons), taille (ex. M, 38, W32), marque, prix minimum et maximum en euros, état minimum, tri, limite. Rend au plus 20 pièces : titre, prix, taille, état, couleur, une photo et le lien de la fiche ; « approximatif » vaut true quand aucune pièce ne porte tous les mots et que les plus proches sont rendues.",
          "inputSchema": {
            "properties": {
              "etat_min": {
                "description": "État minimum de la pièce.",
                "enum": ["satisfaisant", "bon", "tres_bon", "neuf"],
                "type": "string"
              },
              "limite": {
                "description": "Nombre de pièces à rendre, ramené entre 1 et 20 (20 par défaut).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "marque": {
                "description": "Nom de la marque, ex. Ralph Lauren.",
                "maxLength": 60,
                "type": "string"
              },
              "prix_max": {
                "description": "Prix maximum en euros.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "prix_min": {
                "description": "Prix minimum en euros.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "rayon": {
                "description": "Handle d'un rayon renvoyé par lister_rayons (sous-rayons compris).",
                "maxLength": 120,
                "pattern": "^[a-z0-9][a-z0-9_-]*$",
                "type": "string"
              },
              "taille": {
                "description": "Taille exacte, sans casse : M, 38, W32...",
                "maxLength": 30,
                "type": "string"
              },
              "texte": {
                "description": "Recherche en texte libre ou en phrase (français de préférence ; types et couleurs courants compris en anglais, espagnol, allemand, italien, portugais, néerlandais).",
                "maxLength": 300,
                "type": "string"
              },
              "tri": {
                "description": "Ordre des pièces (pertinence par défaut).",
                "enum": ["pertinence", "prix_croissant", "prix_decroissant", "recent"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chercher des pièces"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6dffd7083f7b54ea56736f8a3bd6d0bbc63e020a4c847555cb3aeeed6404e94"
        },
        {
          "name": "fiche_piece",
          "title": "Fiche d'une pièce",
          "description": "Détail d'une pièce par son handle (donné par chercher_pieces) : disponibilité, prix, taille, état, marque, couleur et matière si connues, mesures, description, photos et lien de la fiche.",
          "inputSchema": {
            "properties": {
              "handle": {
                "description": "Handle de la pièce, tel que renvoyé par chercher_pieces, ou l'adresse complète de sa fiche.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fiche d'une pièce"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63d8047fc1326b1ec049f9258e511b3394fe268e0274dee013fb98b302565af3"
        },
        {
          "name": "lister_rayons",
          "title": "Lister les rayons",
          "description": "Arborescence des rayons du catalogue qui contiennent des pièces en vente (Femmes, Hommes...), avec le nombre de pièces disponibles et le lien de chaque rayon.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
