        {
          "name": "pieces_similaires",
          "title": "Pièces similaires",
          "description": "À partir d'une pièce (même vendue), jusqu'à 10 pièces RÉELLEMENT en vente qui lui ressemblent (même rayon ou même type, puis marque, taille, couleur, prix), les plus proches d'abord, chacune avec les raisons de la ressemblance. Filtres facultatifs : taille, prix maximum. N'invente jamais de stock : une liste vide veut dire qu'aucune pièce proche n'est en vente.",
          "inputSchema": {
            "properties": {
              "handle": {
                "description": "Handle de la pièce de départ, ou l'adresse complète de sa fiche.",
                "maxLength": 300,
                "type": "string"
              },
              "limite": {
                "description": "Nombre de pièces à rendre, ramené entre 1 et 10 (6 par défaut).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "prix_max": {
                "description": "Prix maximum en euros.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "taille": {
                "description": "Ne garder que cette taille (M, 38, W32...).",
                "maxLength": 30,
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
