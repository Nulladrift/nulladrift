            "readOnly": true
          },
          "digest": "sha256:924333c6034f46d05e0a2515282b1c1a938676c7ad4dd688adce07419d1a8a5f"
        },
        {
          "name": "infos_boutique",
          "title": "Informations de la boutique",
          "description": "Conditions de la boutique lues dans la configuration du site : livraison (pays livrés, modes publiés - liste partielle -, délais, prix « à partir de », livraison offerte, expédition du jour), retours (délai de rétractation, frais, étiquette), paiement, programme de fidélité, certificat d'authenticité, avec les réponses de la FAQ et les liens des pages officielles. N'affirmez rien que cet outil ou ces pages ne disent pas.",
          "inputSchema": {
            "properties": {
              "sujet": {
                "description": "Sujet voulu (tout par défaut). « fidelite » donne aussi le règlement complet.",
                "enum": ["tout", "livraison", "retours", "paiement", "fidelite", "authenticite"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
