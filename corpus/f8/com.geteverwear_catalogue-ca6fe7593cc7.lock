      "serverInfo": {
        "name": "geteverwear-catalogue",
        "title": "GetEverwear - catalogue public",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Catalogue public de GetEverwear, boutique française de vêtements et accessoires de seconde main pour adultes : chaque pièce est unique. Lecture seule, prix en euros. Parcours conseillé : chercher_pieces (lire « statut » : exact, alternatives_seulement ou aucun), fiche_piece pour le détail et l'aide à la taille, pieces_similaires si une pièce est vendue ou pour élargir, verifier_disponibilite juste avant d'envoyer le client sur la fiche pour acheter, infos_boutique pour la livraison, les retours, le paiement, la fidélité et l'authenticité, lister_rayons pour l'arborescence. Règles : ne présentez jamais une alternative comme une correspondance exacte ; n'affirmez jamais qu'une pièce ira au client, comparez ses mesures ; ne promettez ni défaut absent, ni garantie, ni promotion que les outils ne donnent pas ; une pièce vendue ne revient pas.",
      "tools": [
        {
          "name": "chercher_pieces",
          "title": "Chercher des pièces",
          "description": "Cherche les pièces EN VENTE du catalogue GetEverwear (vêtements et accessoires de seconde main pour adultes, chaque pièce est unique). Le texte peut être une phrase : taille, pointure, budget (« moins de 80 euros », « 100 euros au total »), état, homme/femme, « pas cher », « nouveautés », et les intentions d'achat (style : chic, sobre, sport, décontracté, vintage, workwear, streetwear, bohème ; occasion : Noël, mariage, bureau, soirée, montagne, plage ; saison : hiver, été, mi-saison) sont reconnus et rendus dans « compris ». Réponse : « statut » vaut « exact » (des pièces portent TOUS les critères), « alternatives_seulement » (aucune ne les porte ; des alternatives sont proposées) ou « aucun ». « correspondances_exactes » : les pièces qui portent tous les critères (20 au plus par page, « page » pour la suite). « alternatives » : pièces proches qui s'écartent de la demande, chacune avec ses « raisons » (autre marque, taille voisine, au-dessus du budget...) - ne les présentez JAMAIS comme exactes. Chaque pièce : titre, prix en euros, taille, marque, état, couleur, jusqu'à 3 photos, lien de la fiche. Avec « budget_total », une « selection » de pièces de types différents dont la somme tient dans le budget. Revérifiez la disponibilité (verifier_disponibilite) avant de proposer l'achat.",
          "inputSchema": {
            "properties": {
              "budget_total": {
                "description": "Budget en euros pour une SÉLECTION de plusieurs pièces (livraison non comprise) : rend « selection », des pièces de types différents dont la somme ne dépasse pas ce montant.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "etat_min": {
                "description": "État minimum de la pièce.",
                "enum": ["satisfaisant", "bon", "tres_bon", "neuf"],
                "type": "string"
              },
              "limite": {
                "description": "Nombre de pièces exactes par page, ramené entre 1 et 20 (20 par défaut).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "marque": {
                "description": "Nom de la marque, ex. Ralph Lauren. Une marque absente du stock ne rend jamais d'autres marques comme exactes.",
                "maxLength": 60,
                "type": "string"
              },
              "page": {
                "description": "Numéro de page des correspondances exactes (1 par défaut) ; « pages » donne le nombre total.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "prix_max": {
                "description": "Prix maximum d'une pièce, en euros.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "prix_min": {
                "description": "Prix minimum d'une pièce, en euros.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "rayon": {
                "description": "Handle d'un rayon renvoyé par lister_rayons (sous-rayons compris).",
                "maxLength": 120,
                "pattern": "^[a-z0-9][a-z0-9_-]*$",
                "type": "string"
              },
              "taille": {
                "description": "Taille exacte, sans casse : M, 38, W32... Les tailles voisines ne sortent qu'en alternatives.",
                "maxLength": 30,
                "type": "string"
              },
              "texte": {
                "description": "Recherche en texte libre ou en phrase (français de préférence ; types et couleurs courants compris en anglais, espagnol, allemand, italien, portugais, néerlandais).",
                "maxLength": 300,
                "type": "string"
              },
              "tri": {
                "description": "Ordre des pièces (pertinence par défaut).",
                "enum": ["pertinence", "prix_croissant", "prix_decroissant", "recent"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chercher des pièces"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7288c84cf191b6096e8423d1a7079aa1eea227d33be0626b5b9afa0a69ee00c"
        },
        {
          "name": "fiche_piece",
          "title": "Fiche d'une pièce",
          "description": "Tout le détail d'une pièce par son handle (ou l'adresse de sa fiche) : disponibilité relue sur le stock (il y a une minute au plus), prix de la copie du catalogue, toutes les photos, taille, marque, état, couleur, matière, coupe, mesures relevées par le vendeur, défauts SI la description en mentionne (phrases citées ; une liste vide ne garantit pas l'absence de défaut), description, lien de la fiche. « aide_taille » donne les faits utiles pour la taille (taille affichée, taille d'étiquette, correspondance estimée par le vendeur, conseil de taille de la marque) : comparez avec les mesures d'un vêtement du client, ne promettez jamais qu'une pièce ira. L'achat se fait depuis la fiche (aucun lien de panier n'est fourni). Pièce vendue : appelez pieces_similaires.",
          "inputSchema": {
            "properties": {
              "handle": {
                "description": "Handle de la pièce, tel que renvoyé par chercher_pieces, ou l'adresse complète de sa fiche.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fiche d'une pièce"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
