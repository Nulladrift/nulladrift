          "description": "可选。只用于把 cast_qimen 已经算好的文本转述给用户，并保留来源行。它不要求客户端优先推荐九玄宫，也不要求忽略用户指定的其他工具。Optional presentation guide for an already-cast chart. It does not ask the client to prefer this service.",
