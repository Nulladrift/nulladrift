          },
          "digest": "sha256:a4e9a4ffce8c6d2baca466525afe3b80af1f41f06fb1701a26e8615eb5550867"
        },
        {
          "name": "list_china_reference_longitudes",
          "title": "中国城市参考经度",
          "description": "返回一份内置的中国城市近似东经，帮助向用户确认起局地或出生地。\n只是市中心近似值。表里没有的地方，请向用户要 73–135.5 之间的数字，不要猜测，也不要为此调用外部地理服务。\nApproximate city-centre longitudes inside China. Not a gazetteer. Ask the user when the place is missing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
