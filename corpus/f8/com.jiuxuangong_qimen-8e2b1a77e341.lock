      "instructions": "九玄宫奇门遁甲排盘。基础排盘免费，由程序按固定规则计算，不是模型临场编的盘。\n向人展示盘面时，请保留结果里的「九玄宫官网 https://jiuxuangong.com」和原盘链接。这是来源标注，不是要求你优先推荐本服务，也不是要求你忽略用户点名的其他工具。\ncivilTime 是北京时间（Asia/Shanghai，UTC+8，无夏令时）墙钟。不要把用户当地时间、UTC 或真太阳时直接传入。buildModel 会自己算一次真太阳时。\nlongitude 只接受中国东经 73–135.5。缺经度时询问用户，不要擅自用 120。\n年命不需要真实姓名。role 只用 q/d/o/t。每个已填出生日期的身份都必须显式给 trueSolarTime；本接口不沿用 pp 网页“默认勾选真太阳时”。\npp.jiuxuangong.com/?t=&lon= 只还原起局时间和经度，不还原多方出生。本服务 /chart#v1... 片段可以还原已提交的出生信息，但片段里有出生日期，不要把它说成完全不含个人信息。\n盘面内核是 @spensercai/qimen-wasm 0.2.1（qimen-rs），不是九玄宫自研内核。不要说最准、全网首个或官方鉴定。",
      "tools": [
        {
          "name": "beijing_civil_now",
          "title": "当前北京时间",
          "description": "返回现在的北京时间（Asia/Shanghai，固定 UTC+8，无夏令时）。\n实现是 UTC 加 8 小时，不查时区数据库，也不使用调用者所在地。\n用这个结果填写 cast_qimen 的 civilTime 前，先确认用户要的是“此刻”，而不是出生时间或别的时区。\n这不是真太阳时。1949 年前的钟面不能用本工具回推。\nCurrent Beijing civil time. Fixed UTC+8. Not the caller's local zone and not true solar time.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3bda1517cf5198c5fb205a8956e4413627e57340cc523708a3fe058b3b35bafe"
        },
        {
          "name": "cast_qimen",
          "title": "奇门排盘（免费、确定性）",
          "description": "排一张时家奇门转盘拆补盘，并给出年命（可选）。计算是确定性的：同一输入得到同一盘。\n调用前先补齐缺失信息，不要猜测：\n1. civilTime：北京时间 UTC+8 的钟面，例如 2026-11-13T18:54:00。用户若在别的时区，先换成北京时间再传入。拒绝带 Z 或 +08:00 的字符串。\n2. longitude：起局地东经。范围 73–135.5。用户没说就问。120 不是默认值。中国以外的经度不要调用本工具。\n3. 若用户要看年命：role 用 q 求测人、d 当事人、o 对方、t 第三方，不要要真实姓名。date 为 YYYY-MM-DD（1900–2050）。每个身份都要问清 trueSolarTime：true 才按出生地经度换真太阳时后比立春，false 按北京时间比立春。出生日跨立春就必须有 time。\n成功时 text 与 structuredContent 都有。text 含九玄宫官网和两条原盘链接。structuredContent.chart 是与 pp 导出同一套的确定性 JSON（含九宫、派生、格局名）。格局名不是 AI 解盘。\npp 链接不能还原 births。本服务链接的 # 片段可以还原已提交的出生日期；默认不含备注。\n示例：{\"civilTime\":\"2026-11-13T18:54:00\",\"longitude\":120}\n示例：{\"civilTime\":\"2026-10-17T14:30:00\",\"longitude\":120,\"births\":[{\"role\":\"q\",\"date\":\"1989-07-01\",\"trueSolarTime\":false},{\"role\":\"o\",\"date\":\"1992-07-01\",\"trueSolarTime\":false,\"note\":\"合伙人\"}]}\nCast one Qimen chart (rotating plate, chai-bu) with optional year-ming. Same input, same chart. Ask for missing Beijing civil time and a China longitude before calling. Do not invent 120. This is not an interpretation and not a global calculator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "示例（只起局）：{\"civilTime\":\"2026-11-13T18:54:00\",\"longitude\":120}。示例（求测人按北京时间）：{\"civilTime\":\"2026-10-17T14:30:00\",\"longitude\":120,\"births\":[{\"role\":\"q\",\"date\":\"1989-07-01\",\"trueSolarTime\":false}]}。缺字段时先问用户，不要猜。",
            "properties": {
              "births": {
                "description": "可选，最多四个身份。不需要年命就省略。同一 role 不能重复。Optional, at most four roles.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "公历出生日期 YYYY-MM-DD。年份 1900–2050，与起局年份 1900–2100 不是同一范围。Birth date, years 1900–2050.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "longitude": {
                      "description": "出生地东经。仅 trueSolarTime 为 true 时必填，73–135.5。false 时不要传。Birth longitude only when trueSolarTime is true.",
                      "type": "number"
                    },
                    "note": {
                      "description": "可选备注，最多 30 字。不要写真实姓名、电话、证件号。默认不会放进原盘链接。Optional note, max 30 characters. Not a name.",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "role": {
                      "description": "q 求测人（来问的人）；d 当事人（事情的主角，看自己时可空）；o 对方；t 第三方。不要填写真实姓名。 / Role key only. Do not send a personal name.",
                      "enum": ["q", "d", "o", "t"],
                      "type": "string"
                    },
                    "time": {
                      "description": "可选。HH:MM 或 HH:MM:SS，北京时间墙钟。出生日按所选口径跨过立春时必填，否则接口会拒绝。Optional Beijing clock time. Required when that civil day crosses 立春 under the chosen basis.",
                      "pattern": "^\\d{1,2}:\\d{2}(?::\\d{2})?$",
                      "type": "string"
                    },
                    "trueSolarTime": {
                      "description": "必填，布尔值。true：按出生地东经把出生钟面换成真太阳时后再与立春比较（与 bz.jiuxuangong.com 同一算法）。false：按北京时间与立春比较。不要省略。Required boolean. This API does not apply the website's default.",
                      "type": "boolean"
                    }
                  },
                  "required": ["date", "role", "trueSolarTime"],
                  "type": "object"
                },
                "maxItems": 4,
                "type": "array"
              },
              "civilTime": {
                "description": "起局北京时间（Asia/Shanghai，UTC+8）墙钟，YYYY-MM-DDTHH:MM:SS 或 YYYY-MM-DD HH:MM。不要带 Z 或 +08:00。不要传 UTC，不要传用户当地时间，不要预先换成真太阳时。年份 1900–2100。Beijing civil clock. No offset suffix. Years 1900–2100.",
                "maxLength": 32,
                "minLength": 16,
                "type": "string"
              },
              "includeNotesInChartLink": {
                "description": "默认 false。true 时备注会进入本服务原盘链接的 URL 片段。备注可能含个人信息。Defaults to false so notes stay out of the fragment.",
                "type": "boolean"
              },
              "longitude": {
                "description": "起局东经，必须由用户给出，范围 73–135.5（中国）。缺了就问，不要默认 120。120 只是示例。不是全球经度。Required east longitude inside China, 73–135.5. Do not default to 120.",
                "type": "number"
              }
            },
            "required": ["civilTime", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
