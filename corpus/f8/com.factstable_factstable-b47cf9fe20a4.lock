        {
          "name": "counsel_ask",
          "description": "Ask FactStable Counsel: describe a real situation and Counsel digests it, asks what it must know, and works out possible outcome pathways using ONLY verified pack facts (cite-or-refuse). Returns gates with per-fact citations, open questions, and an assessment when it passes self-verification.",
