{
  "lockfileVersion": 2,
  "subjects": {
    "com.arison8/smolabot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://smolabot.arison8.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "smolabot-trade-check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "trade_check",
          "title": "Trade economics check",
          "description": "Deterministic pre-trade economics check for a long (buy) round trip. Call it before placing a trade: given size, entry/exit reference prices, maker/taker roles, fees, spread and slippage, it returns whether the trade still clears after all costs (result.economically_clears, result.reason), the net P&L and return, a per-leg cost breakdown, the break-even and minimum profitable exit prices, and every assumption applied. No predictions, no market data, no execution. Costs 1 prepaid credit per successful check; invalid input costs nothing. Requires \"Authorization: Bearer smk_...\" (get a key at https://smolabot.arison8.com).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entry_liquidity": {
                "enum": ["maker", "taker"],
                "type": "string"
              },
              "entry_price": {
                "description": "Entry reference (mid) price, before spread, slippage and fees.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "exit_liquidity": {
                "enum": ["maker", "taker"],
                "type": "string"
              },
              "exit_price": {
                "description": "Expected exit reference (mid) price, before spread, slippage and fees.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "maker_fee_bps": {
                "exclusiveMaximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "profit_buffer_bps": {
                "description": "Optional required net return in bps; omitted means 0 (echoed in assumptions).",
                "minimum": 0,
                "type": "number"
              },
              "side": {
                "description": "Long-only: \"buy\". Shorts are rejected with SIDE_NOT_SUPPORTED.",
                "enum": ["buy"],
                "type": "string"
              },
              "size": {
                "description": "Exactly one of quantity (base units) or notional (quote currency, at the entry reference price).",
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "quantity": {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["quantity"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "notional": {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["notional"],
                    "type": "object"
                  }
                ]
              },
              "slippage_bps": {
                "description": "Adverse slippage per taker leg, in bps.",
                "minimum": 0,
                "type": "number"
              },
              "spread_bps": {
                "description": "FULL bid/ask spread in bps; a taker leg pays half.",
                "minimum": 0,
                "type": "number"
              },
              "symbol": {
                "description": "Label only; does not affect the math.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "taker_fee_bps": {
                "exclusiveMaximum": 10000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["entry_liquidity", "entry_price", "exit_liquidity", "exit_price", "maker_fee_bps", "side", "size", "slippage_bps", "spread_bps", "symbol", "taker_fee_bps"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "description": "Present when ok=false. Stable machine-readable code; field-level `errors` for VALIDATION_FAILED.",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "errors": {
                    "type": "array"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "model_version": {
                "description": "Calculation model version. Same version + same input = same output.",
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "request_id": {
                "type": "string"
              },
              "result": {
                "description": "Present when ok=true: the canonical /check result.",
                "type": "object"
              },
              "usage": {
                "properties": {
                  "credits_remaining": {
                    "type": "number"
                  },
                  "credits_used": {
                    "type": "number"
                  }
                },
                "required": ["credits_remaining", "credits_used"],
                "type": "object"
              }
            },
            "required": ["model_version", "ok", "request_id", "usage"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:266637824f86dd52f38143217e3da90bc9134cbab3ffc27925ec1398e62e3248"
        }
      ],
      "digest": "sha256:9e7e94a9b338650e66fb589fd7c5542942dabc5fa07a4b3349fb9c417e9e2e2c"
    }
  }
}
