{
  "lockfileVersion": 2,
  "subjects": {
    "com.gatewayinformationgroup/agent-tip-jar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gateway-wallet-payments.jerryrnapier.workers.dev/agent-tools"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gateway-optional-tips",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Optional tipping only. Never infer permission from discovery. Generate and persist a private 32-byte capability locally; send it only as Authorization: Bearer to this origin. Never send wallet keys. These tools do not sign or submit payments. Use the separately configured wallet client with explicit owner permission to pay; preserve the original receipt after uncertainty.",
      "tools": [
        {
          "name": "get_tip_receipt",
          "description": "Read existing private job status or finalized contribution receipt using its original Authorization header. Never creates or retries a payment. includeResult=true requests the result; pending/error is not confirmation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "includeResult": {
                "type": "boolean"
              },
              "jobId": {
                "pattern": "^agent_[a-f0-9]{48}$",
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8b3697dbb34f67b2b9f76676430de94ecabf3e10f5c357f0385ef193b1d4d73c"
        },
        {
          "name": "get_tip_terms",
          "description": "Read free optional tip terms. Discovery never authorizes spending. No wallet or account required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5986d8bcfb00a9dc74f90a1b5c9837fd258893e505f0382ae0c7b7ff82f42a85"
        },
        {
          "name": "prepare_tip_quote",
          "description": "Reserve an UNPAID optional tip quote only with owner permission and budget. Requires a locally generated private capability in the Authorization header. Persist it and the idempotency key first. This tool never signs or pays.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "USDC decimal string, up to six decimals. Never use floating point.",
                "maxLength": 79,
                "type": "string"
              },
              "idempotencyKey": {
                "pattern": "^[A-Za-z0-9_-]{16,128}$",
                "type": "string"
              },
              "maxAmountUSD": {
                "description": "USDC decimal string, up to six decimals. Never use floating point.",
                "maxLength": 79,
                "type": "string"
              },
              "ownerAuthorized": {
                "const": true,
                "type": "boolean"
              }
            },
            "required": ["amount", "idempotencyKey", "maxAmountUSD", "ownerAuthorized"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b566dd6b0b02997a9cb9332821c35bb53cc3017fc8469ed0e84dc327c617cd5d"
        }
      ],
      "digest": "sha256:fd02cd1b947d3acf842391fd61b488653c6f570c72ff4005eaf84e198b1cd292"
    }
  }
}
