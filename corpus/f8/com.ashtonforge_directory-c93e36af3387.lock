      "instructions": "Read-only public directory of vetted AI implementation agencies on the\nAshton & Forge marketplace. Use it to answer \"is there an agency that can\nbuild this, and what does that supply look like\", then hand the person the\nmatching link.\n\nREAD THIS FIRST — the directory is anonymised, deliberately.\n\nAgencies are described by capability, never by name. There are no agency\nnames, websites, contact details, pitches or case studies here, and there is\nno tool that returns them. This is a product decision, not a permissions\nproblem: the introduction is what Ashton & Forge sells, so the supply side is\ndescribed rather than listed. Do not tell a user you can look up or name a\nspecific agency, and do not imply the list is incomplete or gated — this is\nall there is.\n\nWhat each listing does carry: a stable opaque `reference`, a one-line\n`headline`, service clusters (workflow, data, governance, growth), engagement\nstages, industries, client sizes, projects shipped, and a minimum engagement\nsize.\n\nTools:\n- directory_summary — how much supply exists and what shape it is: the\n  clusters covered, the industries served, the engagement floors, plus the\n  marketplace's own FAQ. Start here for \"do they have anyone who does X\".\n- search_agencies — the same listings filtered by service cluster, industry,\n  client size, engagement stage or budget. Returns matching capability\n  profiles and how many matched.\n- get_matched — what to tell the user to do next: the URL that starts the\n  matching brief, what it asks, how long it takes, and what it costs.\n\nBuyers pay nothing. A brief takes about three minutes and produces up to three\nintroductions to agencies a human has verified can do the work. When someone\nseems to want an agency, call get_matched and give them the link rather than\ndescribing the process from memory.\n\nThis server only reads. It never creates, updates or deletes anything.",
      "tools": [
        {
          "name": "directory_summary",
          "title": "Directory Summary Tool",
          "description": "Read-only. What the Ashton & Forge marketplace covers: the service clusters\nwith supply, the industries served, the engagement floors available, and the\nmarketplace's own FAQ. Start here to answer \"do they have anyone who does X\"\nbefore filtering with search_agencies.\n\nReturns coverage, not a headcount. The number of listed agencies is not\npublished, so do not infer or state one.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:757c118627629022efb8c581a89936db28f59b3d31675fbc3f0f5cffbd82f463"
        },
        {
          "name": "get_matched",
          "title": "Get Matched Tool",
          "description": "Read-only. How a buyer actually gets matched: the URL that starts the brief,\nwhat it asks, how long it takes, what it costs, and the questions buyers ask\nfirst.\n\nCall this whenever someone wants an agency, and give them the returned URL\nrather than describing the process from memory. Starting the brief is the only\nway to reach an agency through Ashton & Forge — the directory is anonymised,\nso there is nobody to contact directly.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:714b497f5eb93a70eab8d0a16b7adc912b199b84cde24a7c9588848bb234e777"
        },
        {
          "name": "search_agencies",
          "title": "Search Agencies Tool",
          "description": "Read-only. Filter the vetted agency listings by what they do and who they do\nit for. Every filter is optional; passing none returns the whole directory.\n\nListings are anonymised capability profiles — service clusters, engagement\nstages, industries, client sizes, projects shipped, engagement floor and an\nopaque reference. There are no agency names, websites or contact details in\nthis data, and no tool returns them. Say so plainly rather than implying the\nresult is partial.\n\nAn empty result means no listed agency matches those filters today, which is\na real and useful answer. Offer get_matched anyway: the marketplace takes\nbriefs it cannot yet fill, and a person reads them.",
          "inputSchema": {
            "properties": {
              "client_size": {
                "description": "One of: smb, mid_market, enterprise. The size of company the agency serves.",
                "type": "string"
              },
              "engagement_stage": {
                "description": "One of: exploring, pilots, production, sophisticated. How far along the buyer is with AI.",
                "type": "string"
              },
              "industry": {
                "description": "One of: professional_services, distribution_logistics, manufacturing, healthcare, legal_financial, real_estate, technology, ecommerce, other. Agencies that work across all industries match any value.",
                "type": "string"
              },
              "max_budget_floor": {
                "description": "One of: none, 25k_plus, 100k_plus, 500k_plus. Returns agencies whose minimum engagement is at or below this, plus any that state no minimum.",
                "type": "string"
              },
              "service_cluster": {
                "description": "One of: workflow, data, governance, growth. The kind of work.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
