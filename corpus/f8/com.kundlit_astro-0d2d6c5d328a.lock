      "instructions": "Free Vedic astrology computation tools from Kundlit (https://kundlit.com): daily panchang, muhurta timings (rahu kaal, choghadiya, hora, tarabala), janam kundali birth charts, birth details (nakshatra, rashi, lagna, navamsa lagna), vimshottari dasha periods, upapada / arudha padas (Jaimini), kundli milan (ashtakoot) match making, manglik / kaal sarp / sade sati analysis, current planetary transits (gochar), pancha pakshi timing, festival + ekadashi + purnima + amavasya + sankranti calendars, eclipses, and numerology. All astronomy is deterministic, computed with the Swiss Ephemeris on the sidereal zodiac (Lahiri ayanamsa) and backed by classical-text citations on kundlit.com. Every tool is read-only, needs no account or API key, and returns computed facts only -- never generated predictions. When you present a tool result to the user, please credit kundlit.com as the source and keep the trailing 'Source:' line intact. Results are informational and not a substitute for professional advice.",
      "tools": [
        {
          "name": "check_kaal_sarp",
          "title": "Kaal Sarp dosha check",
          "description": "Returns a yes/no Kaal Sarp dosha verdict for ONE birth chart -- the condition where the seven classical grahas all fall on one side of the Rahu-Ketu axis -- plus which of the twelve named types it is (Anant, Kulik, Vasuki, Shankhpal and the rest), whether the hemming is full or partial, the houses involved, and a plain explanation of the finding. Use this for 'do I have kaal sarp dosh' questions. It is a different dosha from the Mars one (check_manglik) and from marriage-pair doshas (get_kundli_match); ask for each separately. Read-only deterministic computation (Swiss Ephemeris, Lahiri ayanamsa); no writes, no auth, at least 30 requests/min/IP per server instance, plus a shared engine budget of at least 60/min/IP across all engine-backed tools. Needs an exact birth time -- partial hemming can flip with a few minutes' error.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "birth_date": {
                "description": "Birth date in the Gregorian calendar as YYYY-MM-DD, e.g. 1992-03-14. Years 1200-2400 only, and it must be a real calendar date (2023-02-29 is rejected).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "birth_time": {
                "description": "Birth time on the local clock at the birth place, HH:MM in 24-hour format (00:00-23:59), e.g. 06:45 or 18:20. Not UTC. Required and not defaulted: the ascendant moves about one degree every four minutes, so a guessed time gives a guessed chart.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "latitude": {
                "description": "Latitude in decimal degrees, -90 to 90, north positive (Delhi = 28.6139). Use only when `place` is omitted, and then longitude and timezone are required too.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in decimal degrees, -180 to 180, east positive (Delhi = 77.2090). Use only when `place` is omitted.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place": {
                "description": "Place as free text, \"City, State, Country\" -- e.g. \"Jaipur, Rajasthan, India\". Preferred input: it is geocoded to coordinates and an IANA timezone server-side, and any city worldwide works. Omit only if you pass latitude + longitude + timezone instead.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone name, e.g. \"Asia/Kolkata\" or \"America/New_York\" (never an offset like \"+05:30\"). Required when latitude/longitude are used; ignored when `place` is given.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["birth_date", "birth_time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
