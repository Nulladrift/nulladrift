        {
          "name": "get_year_events",
          "title": "Hindu festival & vrat dates for a year",
          "description": "Returns dated Hindu calendar events for a whole year at one city. category='festival' lists every festival and vrat that year (Holi, Diwali, Navratri, Shivratri and the rest); the other categories list every ekadashi, purnima, amavasya or sankranti date. Each row is the exact local date and the event name, plus a one-line significance on shorter lists. Use this for 'when is X this year' and 'list all ekadashi dates' questions. For the detail of a single day (tithi, sunrise, rahu kaal) call get_panchang with that date; for eclipses call get_eclipses. Read-only deterministic computation (Swiss Ephemeris, Lahiri ayanamsa), served from a shared cache -- a cold or expired entry recomputes and can take ~30s; no writes, no auth, at least 30 requests/min/IP per server instance, plus a shared engine budget of at least 60/min/IP across all engine-backed tools. Constraints: the year must be within two years either side of the current year, and results are computed for the nearest of 50 supported cities (a location_note names it when the snap is far); long lists are capped at 80 rows, so pass month to page through them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "\"festival\" returns every event of the year; \"ekadashi\", \"purnima\", \"amavasya\" and \"sankranti\" each narrow the list to that lunar/solar family only.",
                "enum": ["festival", "ekadashi", "purnima", "amavasya", "sankranti"],
                "type": "string"
              },
              "month": {
                "description": "Restrict the result to a single Gregorian month, 1 = January to 12 = December. Omit for the whole year. Use it when a year-wide list came back truncated.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "description": "City as free text, e.g. \"Jaipur\" or \"Chennai, India\". Omit to use Delhi. Any input is snapped to the nearest of 50 supported cities, since tithi-based dates can differ by a day between distant longitudes.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "year": {
                "description": "Gregorian calendar year as a number, e.g. 2026. Only the current year plus or minus two is supported; anything else is rejected.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
