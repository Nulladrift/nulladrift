{
  "lockfileVersion": 2,
  "subjects": {
    "com.saferesize/saferesize": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://saferesize.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "saferesize",
        "title": "SafeResize",
        "version": "0.1.17"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SafeResize knows the official passport and visa photo rules for 110 documents in 60 countries and regions (checked 28 Sep 2026). Use find_photo_requirements, then get_photo_requirements, when someone asks about photo size, pixels, KB limits or background for a passport, visa or ID application. Use interpret_upload_rules for any website's file upload rules. Each answer names its official source. When the user wants to make the photo or fix the file, the make_it_here or tool_url address opens SafeResize's free tool for it, which runs in the user's browser.",
      "tools": [
        {
          "name": "check_file_numbers",
          "title": "Check file numbers against upload rules",
          "description": "Check a file's size in bytes, pixels and type against a website's upload rules, without sending the file. Use when you already know the numbers (e.g. from the file's properties).",
          "inputSchema": {
            "properties": {
              "file_size_bytes": {
                "description": "Exact size in bytes",
                "type": "integer"
              },
              "format": {
                "description": "jpg, png, webp or pdf",
                "type": "string"
              },
              "height": {
                "type": "integer"
              },
              "rules_text": {
                "description": "The website's rules as written",
                "type": "string"
              },
              "width": {
                "type": "integer"
              }
            },
            "required": ["rules_text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check file numbers against upload rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a08b4c462884ffb040187496418e1be6a8a2e88fff58e4f57b7afc4829491121"
        },
        {
          "name": "find_photo_requirements",
          "title": "Find a passport or visa photo document",
          "description": "Search SafeResize's verified list of 110 passport and visa photo documents (60 countries and regions) by country, document or form name, e.g. \"US visa\", \"DS-160\", \"Schengen\", \"India OCI\", \"Dubai\". Returns matching documents with their document_id.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum results (default 8)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Country, document or form, e.g. \"UK passport\" or \"DS-160\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a passport or visa photo document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd80c62a6794e7a85c08c657a0f72535af135d4a1f38d6b9f481c66adb3273a0"
        },
        {
          "name": "get_photo_requirements",
          "title": "Get the official photo rules for a document",
          "description": "Official photo rules for one document: printed size, pixel rule, file size in KB, file type, background, head size, other rules, whether a self-made photo is accepted, the official source URL and the date SafeResize checked it, plus a link to make the photo free at saferesize.com.",
          "inputSchema": {
            "properties": {
              "document_id": {
                "description": "From find_photo_requirements, e.g. \"us-visa\", \"uk-passport\", \"schengen-visa\", \"in-oci\"",
                "type": "string"
              }
            },
            "required": ["document_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the official photo rules for a document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b551f5441af03469a4b51adcf86521707483f35e51055475dd353a76b3a2ee8"
        },
        {
          "name": "interpret_upload_rules",
          "title": "Read a website's upload rules",
          "description": "Turn the upload rules a website shows (e.g. \"JPG only, 10 KB to 50 KB, 200 x 230 pixels\" or \"PDF not more than 1 MB\") into exact numbers: KB limits, a byte range that passes whether the site counts 1 KB as 1,000 or 1,024 bytes, pixels, file type, and the SafeResize tool that fixes the file.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The rules exactly as the website writes them",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a website's upload rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc640152f7899969d839a734a1a4568f71f04039e629b70cf5c26543377fcc68"
        }
      ],
      "digest": "sha256:da12296041ea543d69dc572b700f14c00cf86d20f830f015ec6a6cd44961a917"
    }
  }
}
