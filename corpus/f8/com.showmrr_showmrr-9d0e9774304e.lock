        },
        {
          "name": "search_startups",
          "title": "Search startups",
          "description": "Search ShowMRR startups by name or keyword. Returns each match with its current MRR, whether that MRR is verified or self-reported, and a link to its public ShowMRR page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category name, e.g. \"saas\" or \"ai\". Use list_categories to see the categories that exist.",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Startup name or keyword, e.g. \"analytics\".",
                "maxLength": 100,
                "minLength": 1,
