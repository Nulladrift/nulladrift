        {
          "name": "list_events",
          "title": "What changed",
          "description": "Changes to projects and listings. The feed keeps 90 days and reads oldest first, so one call scans up to 1,000 events from the cursor (or from the start) and returns the newest ones since `since` (7 days ago by default). Passed back in a later call, its next_cursor reads only what came after. For the current state of a project, get_project and list_listings are cheaper.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "next_cursor from an earlier call: continues from there",
                "maxLength": 500,
                "type": "string"
              },
              "limit": {
                "description": "Rows to return, 25 by default, 100 at most",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "Only this project",
                "pattern": "^prj_[0-9A-Za-z]{22}$",
                "type": "string"
              },
              "since": {
                "description": "ISO time; 7 days ago by default, none when a cursor is given",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "type": {
                "description": "A type such as listing.live, or a group: listing.*, project.*, report.*",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What changed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ebf43d3b512e4ed509b756336f564dec16e9fb26fc2f95823717258aaa512fd1"
