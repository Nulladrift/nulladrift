                "maxLength": 500,
                "type": "string"
              },
              "directory_id": {
                "description": "Read this one directory; other filters are ignored",
                "pattern": "^dir_[0-9A-Za-z]{22}$",
                "type": "string"
              },
              "kind": {
                "description": "article = article platforms, open only through include",
                "enum": ["directory", "article"],
                "type": "string"
              },
              "limit": {
                "description": "Rows to return, 25 by default, 50 at most",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_dr": {
                "description": "Lowest Domain Rating",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
