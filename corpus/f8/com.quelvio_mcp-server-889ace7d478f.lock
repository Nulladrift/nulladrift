{
  "lockfileVersion": 2,
  "subjects": {
    "com.quelvio/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.quelvio.com/http"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "quelvio-mcp",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_source_detail",
          "description": "Return per-chunk source provenance for a previous query — document path, lifecycle state, embedding timestamp, contributor, last-updated — useful for verifying a citation or surfacing trust signals to a downstream system. Pass a `query_id` returned by an earlier `query_knowledge` call. Returns 404 if the query_id is unknown OR belongs to a different tenant (indistinguishable to prevent info-leak). Zero Knowledge Tokens consumed.",
          "inputSchema": {
            "properties": {
              "query_id": {
                "description": "UUID returned in the structured-metadata block of a prior `query_knowledge` response. Tenant-scoped — cross-tenant 404.",
                "type": "string"
              }
            },
            "required": ["query_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get source detail"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:78aea026b9ba0e2282310a44a6481a05053f00353ba741bea786c6619b781119"
        },
        {
          "name": "list_domains",
          "description": "List the taxonomy domains the company has indexed — with document counts, expert counts, and coverage levels — so an agent can decide whether to query before spending a Knowledge Token. Returns one row per domain with the canonical `taxonomy_domain` slug, document/chunk counts, expert count, coverage level (expert | partial | none), the single_expert risk flag, and the top contributor by authority. Use the slug as the `domain` filter on a follow-up `query_knowledge` call. Zero Knowledge Tokens consumed.",
          "inputSchema": {
            "properties": {
              "coverage_filter": {
                "description": "Optional comma-separated subset of expert,partial,none. Default: all three. Unknown tokens 400.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List indexed domains"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:646ecc354fb4e21b49b3f0d30b5accbd5e2379b139c0eff399aedeefbb6c1565"
        },
        {
          "name": "query_knowledge",
          "description": "Search the company's connected knowledge across every source — Drive, SharePoint, Confluence, Slack, Notion — with cited synthesized answers, lifecycle awareness, and refusal-on-weak-context. Returns a written answer with [n] citations plus the ranked source chunks. Modes: `fast` (1,500 kT — retrieval-only, no synthesis), `standard` (12,500 kT — default; synthesized answer over the top retrieval set), `deep` (25,000 kT — wider retrieval + premium synthesis for complex questions). Pick the cheapest tier that answers the question. Responses are capped at 25,000 output tokens per Claude Connectors policy; if truncated, structured metadata carries `truncated: true` and `query_id` so the agent can call `get_source_detail` for full provenance.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Optional taxonomy domain filter (e.g. 'engineering.platform'). Use `list_domains` to discover valid values for the tenant.",
                "type": "string"
              },
              "max_sources": {
                "description": "Number of source chunks to return (1–20, default 5). The 25K token cap may force fewer results regardless of this value.",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "mode": {
                "description": "fast | standard | deep. Defaults to `standard`. `fast` returns chunks only (no synthesized answer); `standard` and `deep` return a synthesized answer with [n] citations + the source chunks.",
                "enum": ["fast", "standard", "deep"],
                "type": "string"
              },
              "query": {
                "description": "Natural-language query (1–2000 characters). Be specific — results are ranked by authority + relevance, not keyword overlap.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search company knowledge"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c811bde2ff45ff435a13dee63e2618442e83dbd98ee4eedfa7839402ba411e0b"
        }
      ],
      "digest": "sha256:eade4614231590129b4cfee59e84a2dcd50b49bd2c709ba005fc1f4e82a7500f"
    }
  }
}
