{
  "lockfileVersion": 2,
  "subjects": {
    "com.cardvolume/market-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cardvolume.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cardvolume",
        "title": "CardVolume",
        "version": "1.0.0",
        "websiteUrl": "https://cardvolume.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Verified trading-card sales data. Match the exact version (1st Edition vs Unlimited, English vs Japanese) and grade before quoting a price. If market_price_usd is null there are too few verified sales; quote the last verified sale with its date instead. Cite as \"CardVolume, <card url>, as of <as_of>\".",
      "tools": [
        {
          "name": "get_card",
          "title": "Get card prices and verified sales",
          "description": "Full verified data for one card: key facts, market price for each version and grade (median of at least 5 verified sales in 90 days), last and record sale, population, and every verified sale with its source URL. Accepts a CardVolume id, a card URL, or a search query.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Card id like 'pokemon/base-set/charizard-4-102' or a cardvolume.com URL",
                "type": "string"
              },
              "max_sales": {
                "default": 50,
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Used when id is not known; the best match is returned",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9467e8216fcb46eb2089eb472c96e11466cb3a151f2fb7f21f6403ad7348be84"
        },
        {
          "name": "get_set_checklist",
          "title": "Get a complete set checklist",
          "description": "Every card in a set (for example the Harry Potter TCG Base Set) with number, type, rarity, holo version and whether two independent sources agree. Call with no arguments to list available sets.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Set id like 'harry-potter/base-set' or a set name such as 'chamber of secrets'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:456b3c4affa736a48c45f488b15c314bfb09dc968bba3ffcfac65b4a51af2e08"
        },
        {
          "name": "list_record_sales",
          "title": "List verified record sales",
          "description": "Highest verified sale for each card, version and grade, largest first, with venue, date and source URL.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["pokemon", "magic", "yugioh", "sports", "one-piece", "lorcana", "harry-potter", "non-sport"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab3ce045f808a754ab3df89d0fb94e73920d8e24502687152f9f398cac82e16e"
        },
        {
          "name": "search_cards",
          "title": "Search cards",
          "description": "Find trading cards tracked by CardVolume by name, set, number or player. Returns ids, titles, headline market price and record sale. Use get_card with an id for full data.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["pokemon", "magic", "yugioh", "sports", "one-piece", "lorcana", "harry-potter", "non-sport"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "e.g. 'base set charizard 1st edition', 'moonbreon', '1986 fleer jordan'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:77eff1eef3ee6eae03514f1b56b9d123eedbd727143732fca6f80d44cb5e8434"
        }
      ],
      "digest": "sha256:9dcc0cb105572f2b402bd409ef20de27c017869d6fcd3bdc981cfe3858ef77ac"
    }
  }
}
