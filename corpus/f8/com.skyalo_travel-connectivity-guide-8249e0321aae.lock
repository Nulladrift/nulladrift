{
  "lockfileVersion": 2,
  "subjects": {
    "com.skyalo/travel-connectivity-guide": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://skyalo.com/chatgpt/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "skyalo-travel-connectivity-guide",
        "version": "2.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Build provider-neutral travel connectivity estimates and check exact-device eSIM readiness. Route pure phone compatibility, eSIM support, carrier-lock, EID, Add eSIM, or regional-variant questions to check_esim_device_compatibility; do not use build_travel_connectivity_guide for those questions. Route trip data budgeting, hotspot, offline-readiness, and connection-fallback questions to build_travel_connectivity_guide. Ask for the exact phone model before a device check, and ask for destinations or trip length only when building a travel guide. Do not compare, promote, recommend, price, sell, or link to connectivity products or services.",
      "tools": [
        {
          "name": "build_travel_connectivity_guide",
          "title": "Build a travel connectivity guide",
          "description": "Creates a free, provider-neutral mobile-data estimate and readiness checklist for a travel route. Use it for trip data budgeting, hotspot planning, offline readiness, and connection fallback advice. Do not use it for a pure phone eSIM compatibility question; use check_esim_device_compatibility instead. It does not browse, compare, promote, recommend, price, sell, or link to products, plans, carriers, or connectivity services.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "deviceReadiness": {
                "default": "unsure",
                "description": "confirmed when eSIM support and unlocked status are known, unsure when unverified, or not-supported when the device cannot use eSIM.",
                "enum": ["confirmed", "unsure", "not-supported"],
                "type": "string"
              },
              "hotspot": {
                "default": false,
                "description": "Whether one or more travelers expect to share data by hotspot.",
                "type": "boolean"
              },
              "locale": {
                "default": "en",
                "description": "BCP 47 language tag for the requested guide.",
                "maxLength": 20,
                "minLength": 2,
                "type": "string"
              },
              "stops": {
                "description": "One to eight destinations in travel order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "days": {
                      "description": "Number of days at this stop.",
                      "maximum": 90,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "destination": {
                      "description": "Country or destination name for this stop.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["days", "destination"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "travelers": {
                "default": 1,
                "description": "Travelers who need connectivity.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "usageProfile": {
                "default": "balanced",
                "description": "light for maps and messaging, balanced for everyday use, heavy for frequent media, or remote-work for calls and laptop work.",
                "enum": ["light", "balanced", "heavy", "remote-work"],
                "type": "string"
              }
            },
            "required": ["stops"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "questionsToConfirm": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "readinessChecklist": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "riskSignals": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "safeFallbacks": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "const": "ok",
                "type": "string"
              },
              "stops": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "connectivityMix": {
                      "enum": ["cellular-primary", "wifi-primary", "hybrid"],
                      "type": "string"
                    },
                    "dailyBudgetMb": {
                      "type": "number"
                    },
                    "days": {
                      "type": "number"
                    },
                    "destination": {
                      "type": "string"
                    },
                    "estimatedDataGb": {
                      "type": "number"
                    },
                    "usageBreakdown": {
                      "additionalProperties": false,
                      "properties": {
                        "essentialsGb": {
                          "type": "number"
                        },
                        "mediaAndWorkGb": {
                          "type": "number"
                        },
                        "socialAndBrowsingGb": {
                          "type": "number"
                        }
                      },
                      "required": ["essentialsGb", "mediaAndWorkGb", "socialAndBrowsingGb"],
                      "type": "object"
                    }
                  },
                  "required": ["connectivityMix", "dailyBudgetMb", "days", "destination", "estimatedDataGb", "usageBreakdown"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "additionalProperties": false,
                "properties": {
                  "averageDailyDataGb": {
                    "type": "number"
                  },
                  "deviceReadiness": {
                    "enum": ["confirmed", "unsure", "not-supported"],
                    "type": "string"
                  },
                  "hotspot": {
                    "type": "boolean"
                  },
                  "locale": {
                    "type": "string"
                  },
                  "riskLevel": {
                    "enum": ["low", "medium", "high"],
                    "type": "string"
                  },
                  "totalDays": {
                    "type": "number"
                  },
                  "totalEstimatedDataGb": {
                    "type": "number"
                  },
                  "travelers": {
                    "type": "number"
                  },
                  "usageProfile": {
                    "enum": ["light", "balanced", "heavy", "remote-work"],
                    "type": "string"
                  }
                },
                "required": ["averageDailyDataGb", "deviceReadiness", "hotspot", "locale", "riskLevel", "totalDays", "totalEstimatedDataGb", "travelers", "usageProfile"],
                "type": "object"
              }
            },
            "required": ["limitations", "questionsToConfirm", "readinessChecklist", "riskSignals", "safeFallbacks", "status", "stops", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/skyalo-travel-connectivity-guide.html",
            "openai/toolInvocation/invoked": "Travel connectivity guide ready",
            "openai/toolInvocation/invoking": "Building your travel readiness guide…",
            "ui": {
              "resourceUri": "ui://widget/skyalo-travel-connectivity-guide.html"
            }
          },
          "digest": "sha256:2fd8bf9f6f17440d4d31800ee615896c3c8dd167760b1b0cda19d8a3d96afd5e"
        },
        {
          "name": "check_esim_device_compatibility",
          "title": "Check an exact phone's eSIM readiness",
          "description": "Use this tool whenever the user asks whether a phone supports eSIM or is ready for a travel eSIM. Check an exact phone model against Skyalo's manufacturer-sourced compatibility catalog, including regional variants, carrier locks, EID, and Add eSIM settings. Do not call build_travel_connectivity_guide for a pure device question. Unknown never means incompatible. This tool does not search, compare, recommend, price, sell, or link to connectivity plans.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "addEsimSettingPresent": {
                "type": "boolean"
              },
              "carrierUnlocked": {
                "type": "boolean"
              },
              "eidPresent": {
                "type": "boolean"
              },
              "locale": {
                "maxLength": 20,
                "minLength": 2,
                "type": "string"
              },
              "manufacturer": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Exact phone model, for example Samsung Galaxy S24 or Apple iPhone 15; not a broad product family.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "Country or sales region of the exact device variant.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "catalogStatus": {
                "enum": ["compatible", "variant-check", "unknown"],
                "type": "string"
              },
              "checks": {
                "additionalProperties": false,
                "properties": {
                  "addEsimSettingPresent": {
                    "type": ["boolean", "null"]
                  },
                  "carrierUnlocked": {
                    "type": ["boolean", "null"]
                  },
                  "eidPresent": {
                    "type": ["boolean", "null"]
                  },
                  "region": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["addEsimSettingPresent", "carrierUnlocked", "eidPresent", "region"],
                "type": "object"
              },
              "device": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "caveats": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "manufacturer": {
                        "type": "string"
                      },
                      "model": {
                        "type": "string"
                      },
                      "source": {
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "type": "string"
                          },
                          "url": {
                            "format": "uri",
                            "type": "string"
                          },
                          "verifiedAt": {
                            "type": "string"
                          }
                        },
                        "required": ["label", "url", "verifiedAt"],
                        "type": "object"
                      }
                    },
                    "required": ["caveats", "manufacturer", "model", "source"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "guidance": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reason": {
                "enum": ["timeout", "backend-unavailable", "invalid-backend-response"],
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "status": {
                "enum": ["compatible", "needs-confirmation", "not-ready", "unknown", "unavailable"],
                "type": "string"
              },
              "suggestions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "manufacturer": {
                      "type": "string"
                    },
                    "model": {
                      "type": "string"
                    }
                  },
                  "required": ["manufacturer", "model"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
