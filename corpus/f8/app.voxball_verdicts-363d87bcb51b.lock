  "lockfileVersion": 2,
  "subjects": {
    "app.voxball/verdicts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.voxball.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "voxball",
        "title": "VoxBall · the fans' verdict",
        "version": "1.0.0",
        "websiteUrl": "https://www.voxball.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "VoxBall publishes the man of the match and the best player of the season as voted by football fans, for the big European leagues, the Champions League, the Europa League and international tournaments. Each verdict says who voted: the number of voters, how many of them are VoxBall members, and which club the other voting supporters follow. When no fan has voted on a match, the ranking comes from the press and rating algorithms, and the verdict says so. Each verdict carries a ready-made answer sentence with those qualifiers (e.g. \"according to 266 voters, including 1 VoxBall member and Brighton supporters\"), a provisional flag, and the page_url of the public page it comes from. A fans' verdict is a ranking of the players of a match, not a rating out of 10. search_matches returns the match_id used by get_match_verdict; get_season_ranking covers the season.",
      "tools": [
        {
          "name": "get_match_verdict",
          "title": "Man of the match, voted by fans",
          "description": "The VoxBall verdict of one match: who is the man of the match according to the fans who voted, with what qualifies it (number of voters, how many are VoxBall members, which club the other voting supporters follow, provisional or not, date), the top 10, and the number one of the press and of rating algorithms for comparison. Same verdict as the public match page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer sentence and of the page links. Default: en.",
                "enum": ["fr", "en", "es", "de", "it", "pt", "nl"],
                "type": "string"
              },
              "match_id": {
                "description": "From search_matches, or the number at the end of a VoxBall match page address.",
                "type": "integer"
              }
            },
            "required": ["match_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Man of the match, voted by fans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b56a7a8ee5a9f00f85a76bea3430c3814817cfb4cd77f6b8935c0e4f9e3b5d6"
        },
        {
          "name": "get_season_ranking",
          "title": "Best player of the season, elected by those who watch",
          "description": "The VoxBall ranking of the best player of the season, all competitions: each match gives points to its top 10, from the fans' verdict when fans voted, otherwise from the press and rating algorithms. Returns the ranking with its electorate (voters, VoxBall members), whether the season is still in progress, and the page to link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer sentence and of the page links. Default: en.",
                "enum": ["fr", "en", "es", "de", "it", "pt", "nl"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "season": {
                "description": "e.g. \"2026-27\". Default: the current season.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best player of the season"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:182a9b19445baba5f39015e1a9c15c2fc9dbff85432ddea659e20a8d8a22bb60"
        },
        {
          "name": "search_matches",
          "title": "Find a match",
          "description": "Find football matches that have a VoxBall verdict (man of the match voted by fans), by team, optional opponent and optional day. Accepts usual names and abbreviations (PSG, Barça, Man City). Returns match ids for get_match_verdict, most recent first. Only matches whose vote has closed are listed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional: the day of the match, YYYY-MM-DD (Paris time).",
                "type": "string"
              },
              "language": {
                "description": "Language of the answer sentence and of the page links. Default: en.",
                "enum": ["fr", "en", "es", "de", "it", "pt", "nl"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "opponent": {
                "description": "Optional: the other team.",
                "type": "string"
              },
              "team": {
                "description": "A team that played the match, e.g. \"Brighton\", \"PSG\", \"France\".",
                "type": "string"
              }
            },
            "required": ["team"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a match"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74e91e38950848ab0b73d1778b6e2b5a3090457dd19e247e639fcbed77f58669"
        }
      ],
      "digest": "sha256:41f65de469977d827843bc2b86004ae0685fff289fab4a1e20097ad2fea08ab4"
    }
  }
