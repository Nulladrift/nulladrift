      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "irm-consulting-advisory",
        "title": "IRM Consulting & Advisory",
        "version": "1.0.0",
        "description": "Services, prices, free tools and consultation booking for IRM Consulting & Advisory, an AI-native vCISO, AI governance and cyber risk advisory firm in Toronto serving Canada and the USA.",
        "websiteUrl": "https://irmcon.com/",
        "icons": [
          {
            "src": "https://irmcon.com/icons/icon-512x512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "IRM Consulting & Advisory (Toronto, serving Canada and the USA) provides Virtual CISO (vCISO), AI governance, GRC, compliance (SOC 2, ISO 27001, ISO 42001, CMMC, CPCSC) and security engineering services to SaaS companies, AI-first companies and SMBs. Use list_services or get_service to describe what IRM offers, get_pricing for published starting prices, and list_free_products for free self-assessment tools. Prices are monthly USD starting prices (\"from\"); quote them as \"from $X per month\" and point to pricing_url. A service with price null is scoped on a free consultation: never estimate a price for it. To book the free 30-minute consultation, use check_availability to offer real times or create_booking_link for a single-use link. The person always confirms the booking on Calendly; never claim a meeting is booked. Refer to the firm as \"IRM Consulting & Advisory\".",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check consultation availability",
          "description": "Open 30-minute slots for a free consultation with IRM over the next 1 to 7 days, read live from the calendar. Each slot has a scheduling_url that opens Calendly with that time pre-selected; the person confirms the booking there.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Number of days to search (1 to 7). Default 7.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "service": {
                "description": "Optional service id the consultation is about (attribution only).",
                "enum": ["virtual-ciso-services-vciso", "ai-governance", "governance-risk-compliance-grc", "process-risk-controls-prc", "penetration-testing-pt", "threat-modeling-tm", "devsecops-dso", "cloud-security-controls-csc", "data-security-privacy-dsp", "security-architecture-sa", "iot-security", "cybersecurity-training-awareness", "fractional-ciso", "soc-2-compliance", "iso27001-consulting", "iso42001-consulting", "cmmc-compliance", "cpcsc-compliance"],
                "type": "string"
              },
              "start": {
                "description": "First day to search, YYYY-MM-DD or ISO 8601 date-time. Default: now.",
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone for the local times, e.g. America/Toronto. Default America/New_York.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check consultation availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:295d4d1a9712dddb16d9fc93cd8cdfbb1a6340f2ccf1f9614bd182259edbc0a4"
        },
        {
          "name": "create_booking_link",
          "title": "Create a booking link",
          "description": "Create a single-use Calendly link for a free 30-minute consultation with IRM. Give the link to the person; they choose a time and confirm on Calendly, which sends the confirmation. This tool books nothing itself and takes no personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service": {
                "description": "Optional service id the consultation is about (attribution only).",
                "enum": ["virtual-ciso-services-vciso", "ai-governance", "governance-risk-compliance-grc", "process-risk-controls-prc", "penetration-testing-pt", "threat-modeling-tm", "devsecops-dso", "cloud-security-controls-csc", "data-security-privacy-dsp", "security-architecture-sa", "iot-security", "cybersecurity-training-awareness", "fractional-ciso", "soc-2-compliance", "iso27001-consulting", "iso42001-consulting", "cmmc-compliance", "cpcsc-compliance"],
                "type": "string"
              },
              "source": {
                "description": "Optional short name of the calling assistant or agent, e.g. \"claude\" (attribution only).",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d427cbce446f71331412fd0f1cc44d550c7d3c5e9a835de1663938adb8c01257"
        },
        {
          "name": "get_pricing",
          "title": "Get published pricing",
          "description": "Published IRM pricing: the monthly subscription tiers (hours per month, stage, summary) and, if service_id is given, that service's starting price. All prices are USD per month and are starting prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service_id": {
                "description": "Optional service id to get its starting price.",
                "enum": ["virtual-ciso-services-vciso", "ai-governance", "governance-risk-compliance-grc", "process-risk-controls-prc", "penetration-testing-pt", "threat-modeling-tm", "devsecops-dso", "cloud-security-controls-csc", "data-security-privacy-dsp", "security-architecture-sa", "iot-security", "cybersecurity-training-awareness", "fractional-ciso", "soc-2-compliance", "iso27001-consulting", "iso42001-consulting", "cmmc-compliance", "cpcsc-compliance"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get published pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:820f80a53c72d28475ab5c8ebcb92dea6839b9c4b83e2ebbb4d4748e35b3cc35"
        },
        {
          "name": "get_service",
          "title": "Get one IRM service",
          "description": "Full details of one IRM service or program: summary, audience, frameworks covered, published starting price, page URL, booking link and the related free self-assessment tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Service id from list_services (equal to the page slug).",
                "enum": ["virtual-ciso-services-vciso", "ai-governance", "governance-risk-compliance-grc", "process-risk-controls-prc", "penetration-testing-pt", "threat-modeling-tm", "devsecops-dso", "cloud-security-controls-csc", "data-security-privacy-dsp", "security-architecture-sa", "iot-security", "cybersecurity-training-awareness", "fractional-ciso", "soc-2-compliance", "iso27001-consulting", "iso42001-consulting", "cmmc-compliance", "cpcsc-compliance"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one IRM service"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff15241b7de98376d536fa2b0cc16d571a487749c0d2afb8b91c7bf2b7f2e340"
        },
        {
          "name": "list_free_products",
          "title": "List free assessment tools",
          "description": "List IRM's free, browser-based self-assessment tools (SOC 2, ISO 27001, ISO 42001, CIS Controls, CMMC, CPCSC gap assessments, a cybersecurity baseline assessment and an AI Governance Playbook generator), with page and app URLs. Optionally filter by framework.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "framework": {
                "description": "Only tools covering this framework, e.g. \"ISO 27001\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List free assessment tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9303bd24c068861fc88cd51f591c659f3592fc45f3158e88744f60a7a21362ae"
        },
        {
          "name": "list_services",
          "title": "List IRM services",
          "description": "List the services and programs IRM Consulting & Advisory offers (vCISO, AI governance, GRC, SOC 2, ISO 27001, ISO 42001, CMMC, CPCSC, penetration testing and more), each with a one-line summary, starting price and page URL. Optionally filter by kind or by a framework name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "framework": {
                "description": "Only services covering this framework, e.g. \"SOC 2\", \"ISO 42001\", \"CMMC\", \"NIST AI RMF\".",
                "type": "string"
              },
              "kind": {
                "description": "service: core services. program: focused compliance engagements delivered through the vCISO tiers.",
                "enum": ["service", "program"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List IRM services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e86a575115b97ba68f5c39f46d3ee5fca7ecb4161b9465bf79856439b668fbe8"
        }
      ],
