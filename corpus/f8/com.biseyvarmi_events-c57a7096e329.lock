{
  "lockfileVersion": 2,
  "subjects": {
    "com.biseyvarmi/events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.biseyvarmi.com/mcp/gc5oul2x1d"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "biseyvarmi",
        "title": "biseyvarmi.com events",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "biseyvarmi.com: current listings of upcoming cultural events in Türkiye (Turkey) only (theatre, concerts, stand-up, exhibitions, festivals, children's events, workshops), gathered from Turkish ticket providers, answering questions about what is on in a Turkish city or district (e.g. \"Kadıköy'de bu akşam ne var?\"). search takes a plain question and search_events structured filters; fetch gives one event's dates, venues and prices. Each event has a biseyvarmi.com link; tickets are bought from the provider shown there. Events in other countries are not covered.",
      "tools": [
        {
          "name": "fetch",
          "title": "Event details",
          "description": "Full details of one event found with search: upcoming dates and times (Istanbul), venues, price range, category and credits, with the biseyvarmi.com link where tickets are confirmed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An id from search results.",
                "pattern": "^[0-9a-f]{8}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Event details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2c58906523af966892f5a8200368ab234282f8dd3fdee86de7e0dab4c056b5aa"
        },
        {
          "name": "search",
          "title": "Ask about events",
          "description": "Covers events in Türkiye (Turkey) only. Searches current listings on biseyvarmi.com from a plain question in Turkish or English, e.g. \"Kadıköy'de bu hafta sonu konser\", \"tiyatro Ankara yarın\", \"Hamlet İstanbul\", \"kids events in Beşiktaş this weekend\". Reads the place (city or district), the kind of event (konser, tiyatro, stand-up, sergi, festival, çocuk…) and the time (bugün, yarın, bu hafta sonu); the rest is searched as a title, performer or venue. Returns up to 10 events with ids; an id can be passed to fetch for dates, venues and prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "The question, in Turkish or English.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask about events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aae8a53d89f48a66eb2d31f6e05a8ca50a74421aee8f000c7fefdb4002bb4bcb"
        },
        {
          "name": "search_events",
          "title": "Search events in Türkiye",
          "description": "Covers events in Türkiye (Turkey) only. Searches current listings on biseyvarmi.com, which gathers events across Turkish ticket providers: what is on, where and when (etkinlik, ne var, konser, tiyatro, stand-up, sergi, festival, çocuk, opera, bale, atölye), in a city or district such as İstanbul, Kadıköy, Beşiktaş, Ankara or İzmir, with dates, venues and prices. Requires at least one of city, category or q. Each result includes its biseyvarmi.com event page link (a short bise.ws link), where dates, prices and ticket options are confirmed. At most 20 results, no paging; a district, category, dates or words give more specific results. A refused question returns the reason.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "One category slug.",
                "enum": ["tiyatro", "muzik", "standup", "opera", "bale-ve-dans", "performans", "sergi-muze-ve-fuar", "film", "cocuk-ve-aile", "festival", "spor", "dinleti-ve-konferans", "egitim-ve-atolye", "yeme-ve-icme", "oyun-ve-yarisma", "saglik-ve-yasam", "sosyal-etkinlik-ve-tur", "diger"],
                "type": "string"
              },
              "city": {
                "description": "A Turkish city by name, e.g. \"istanbul\", \"ankara\", \"izmir\", \"mugla\"; a well-known district (\"bodrum\", \"kadikoy\") also works.",
                "type": "string"
              },
              "district": {
                "description": "A district of the city, e.g. \"kadikoy\"; needs city.",
                "type": "string"
              },
              "from": {
                "description": "First day, YYYY-MM-DD (Istanbul time). Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Results to return, default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Search words in Turkish or English: a title, performer or venue. Alternatives are separated by commas (at most four).",
                "maxLength": 80,
                "type": "string"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD. Default from + 30 days; a wider span is cut to 92 days.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search events in Türkiye"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7f309de35507a7a7ddbb2b15877cda291040c1edb84164430cc0e8c54f83005d"
        }
      ],
      "digest": "sha256:8bf65f91890b2fcd5ff35d14cce8c365d484b12e89beacf5fde30dfefc3bb91f"
    }
  }
}
