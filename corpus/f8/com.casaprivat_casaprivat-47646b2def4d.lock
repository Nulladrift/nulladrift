  "subjects": {
    "com.casaprivat/casaprivat": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://casaprivat.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "casaprivat",
        "title": "CasaPrivat – homes sold directly by their owners (ES, FR)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search homes for sale directly from private owners in Spain and France (search_homes, get_home, get_facets). request_viewing only forwards a question or viewing request to the owner; it does not book anything. Always tell the user that the owner will answer directly, and never ask anyone to pay money before a viewing. CasaPrivat is not an estate agent. Listings are published by private owners, who are responsible for their content. No commission. Report illegal listings at /en/report (Regulation (EU) 2022/2065, art. 16).",
      "tools": [
        {
          "name": "get_facets",
          "title": "Counts and filter values",
          "description": "Counts of published listings by country, type and city, price range and valid filter values. No arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "facets": {
                "type": "object"
              },
              "note": {
                "type": "string"
              }
            },
            "required": ["facets"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Facets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:544cb02d6cd61ac2095e1607fc3d8bbf643893b45e88bb5fd51dc2b9d2ba37f2"
        },
        {
          "name": "get_home",
          "title": "Get one home",
          "description": "Full public record of one published listing by id (e.g. EXAMPLE-ES-1 or ES-XXXXXXXX).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "home": {
                "type": "object"
              },
              "note": {
                "type": "string"
              }
            },
            "required": ["home"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get home"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6bc90faf1a9c9008f95f21c0bebcfa5b5defe685002fc64340c2fe8c517f708f"
        },
        {
          "name": "request_viewing",
          "title": "Send a question or viewing request to the owner",
          "description": "Forwards a question or viewing request from a buyer to the owner of a published home. It does NOT book a viewing and creates no offer or contract: the owner replies directly to the buyer's email. Requires the buyer's explicit consent to share their name and email with the owner.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Name of the AI agent or app sending this",
                "maxLength": 80,
                "type": "string"
              },
              "buyer_consent": {
                "description": "true = the buyer agreed that their name, email and message are passed to the owner",
                "type": "boolean"
              },
              "buyer_email": {
                "type": "string"
              },
              "buyer_name": {
                "maxLength": 80,
                "type": "string"
              },
              "buyer_phone": {
                "maxLength": 40,
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "kind": {
                "enum": ["viewing", "question"],
                "type": "string"
              },
              "message": {
                "maxLength": 3000,
                "type": "string"
              },
              "preferred_times": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["buyer_consent", "buyer_email", "buyer_name", "id", "message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "request_id": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["request_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request viewing (notifies owner only)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4557579b0065ab1b791ac6aa81e5ce00c05df63c1f6d88fd3d818a82be1dbf39"
        },
        {
          "name": "search_homes",
          "title": "Search homes for sale by owner",
          "description": "Search homes for sale directly by private owners (no agent, no commission) in Spain (ES) and France (FR). Returns public listing records incl. the mandatory energy rating.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Substring match on city",
                "type": "string"
              },
              "country": {
                "enum": ["ES", "FR"],
                "type": "string"
              },
              "include_examples": {
                "description": "Include fictional EXAMPLE listings (default true in the MVP)",
                "type": "boolean"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "type": "number"
              },
              "min_area_m2": {
                "type": "number"
              },
              "min_energy_class": {
                "description": "Only homes with this class or better (A best)",
                "enum": ["A", "B", "C", "D", "E", "F", "G"],
                "type": "string"
              },
              "min_price": {
                "type": "number"
              },
              "min_rooms": {
                "type": "number"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "property_type": {
                "enum": ["apartment", "house"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["items", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search homes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfb2e912124bbb36b8ce374db0a5a98c84224a4153b848cc94dd104d4df71953"
        }
      ],
      "digest": "sha256:126e2c0564f18eb01094cf088fb14ce03e18a17da6b812a1664ad5cce72997c3"
    }
  }
