      "tools": [
        {
          "name": "compare_transport_routes",
          "description": "Compare catalog transport corridors between two cities. Timings are demo estimates, not live seats or fares.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destinationSlug": {
                "type": "string"
              },
              "originSlug": {
                "type": "string"
              }
            },
            "required": ["destinationSlug", "originSlug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a956d961f65ba70cf83f80160699e82101e1bf3c06c58307b3ca30c569d5b9f5"
        },
        {
          "name": "estimate_trip_budget",
          "description": "Illustrative budget in Chinese yuan. Demo bands only — not a quote or a live price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citySlug": {
                "type": "string"
              },
              "days": {
                "type": "number"
              },
              "style": {
                "enum": ["budget", "standard", "comfort"],
                "type": "string"
              },
              "travelers": {
                "type": "number"
              }
            },
            "required": ["citySlug", "days"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:18ac285657aeb1b61629aab992b703b783c143b6497bc2874d84da4b3508034e"
        },
        {
          "name": "find_nearby_attractions",
          "description": "Find published attractions near a latitude and longitude.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "type": "number"
              },
              "lng": {
                "type": "number"
              },
              "radiusKm": {
                "type": "number"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2d83068141a8e62ad64b7a4638e8539e2ef1596c6bc3eb98671d7ee626d0e38b"
        },
        {
          "name": "generate_itinerary",
          "description": "Build a day-by-day plan from published cities and attractions. Demo planning only. Live AI generation is not available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citySlugs": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "days": {
                "type": "number"
              },
              "interests": {
                "items": {
                  "enum": ["heritage", "nature", "food", "nightlife", "family"],
                  "type": "string"
                },
                "type": "array"
              },
              "pace": {
                "enum": ["relaxed", "balanced", "packed"],
                "type": "string"
              },
              "preferLlm": {
                "description": "Optional. Plans always use the published catalog. Live AI generation is not available.",
                "type": "boolean"
              }
            },
            "required": ["citySlugs", "days"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
