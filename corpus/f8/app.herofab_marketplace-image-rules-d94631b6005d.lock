      "instructions": "Herofab publishes the product-image rules of 98 marketplaces and ad platforms, including Amazon, eBay, Etsy, Shopify, Walmart, TikTok Shop and Google Shopping, each read from the platform's own help page and dated. Use get_image_requirements to read a platform's rules (omit platform for the list of keys). When the user has the photo at a public https link, use check_image_url: it fetches the image, reads its real size, format and file size, and estimates the background (pure white or not), the product fill and whether the product touches an edge. When only the numbers are known, use check_image_spec with width, height, format and optionally the file size, background and product fill. Both checks list what they could not check under not_checked, link the platform's guide (guide_url) and, when a rule fails, where to fix the image (fix_url). Pixel measurements are estimates; say so when reporting them. No key is needed; images are measured in memory and nothing sent is stored.",
      "tools": [
        {
          "name": "check_image_spec",
          "title": "Check an image against marketplace rules",
          "description": "Check an image's width, height, format and file size, and its declared main-image background and product fill, against a platform's published rules (Amazon, eBay, Etsy, Shopify, Walmart and others). Returns pass, the failing rules, notes, the rules that need the photo itself, and a link to fix the image. Use it when the dimensions are known; it never sees the photo, so background and fill are only as declared. When the photo is at a public https link, use check_image_url instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "background": {
                "description": "Main-image background as seen in the photo: pure-white (RGB 255), white (off-white), light (light grey or neutral), coloured (plain colour), busy (scene or texture), transparent.",
                "enum": ["pure-white", "white", "light", "coloured", "busy", "transparent"],
                "type": "string"
              },
              "file_size_bytes": {
                "description": "File size in bytes; without it the file size limit is not checked.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "integer"
              },
              "format": {
                "description": "File format.",
                "enum": ["jpeg", "jpg", "png", "gif", "webp", "tiff", "tif", "bmp", "heic", "avif", "svg"],
                "type": "string"
              },
              "height": {
                "description": "Image height in pixels.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Platform key (see get_image_requirements).",
                "enum": ["about-you", "adobe-commerce", "aliexpress", "allegro", "amazon", "amazon-a-content", "amazon-ads", "amazon-brand-store", "avocadostore", "beslist-nl", "best-buy-canada", "big-cartel", "bigcommerce", "bol", "cdiscount", "cdon", "coupang", "dafiti", "ebay", "ecwid", "emag", "etsy", "etsy-shop-banner", "facebook-instagram-shop", "faire", "falabella", "folksy", "fruugo", "fyndiq", "galaxus", "glami", "google-ads", "google-business-profile", "google-shopping", "gumroad", "heureka", "hood-de", "jimdo", "kaufland", "kickstarter", "klaviyo", "lightspeed-ecom", "linkedin-ads", "mailchimp", "mercado-livre", "microsoft-advertising", "miinto", "naver-smart-store", "newegg", "nextdoor-ads", "noon", "omnisend", "onbuy", "opencart", "orderchamp", "otto", "outbrain", "pinterest", "prestashop", "rakuten-ichiba", "reddit-ads", "reverb", "ricardo", "shein", "shift4shop", "shopee", "shopify", "shopify-themes", "shopline", "shopware", "skroutz", "snapchat-ads", "square-online", "squarespace", "taboola", "temu", "the-iconic", "tiki", "tiktok-ads", "tiktok-shop", "tokopedia", "trade-me", "tradera", "trendyol", "vestiaire-collective", "vinted", "volusion", "walmart", "walmart-connect", "wayfair", "webflow", "weebly", "wix", "wolf-badger", "woocommerce", "youtube", "zalando", "zalora"],
