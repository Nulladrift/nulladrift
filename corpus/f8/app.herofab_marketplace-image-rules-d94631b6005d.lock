        {
          "name": "check_image_url",
          "title": "Measure an image from a link against marketplace rules",
          "description": "Fetch a product photo from a public https link and check it against a marketplace's published image rules, for example an Amazon, eBay, Etsy, Shopify, Walmart, TikTok Shop or Google Shopping main image. Herofab reads the real width, height, format and file size from the file, and estimates from the pixels whether the background is pure white (RGB 255), how much of the frame the product fills and whether it touches an edge (cut off). Pixel measurements are estimates; rules that could not be measured are listed under not_checked. Returns the same verdict as check_image_spec plus the measured values, and a link to fix the image when a rule fails. The image is not stored. Do not use it for a product page, a local file or an image behind a login; when only the dimensions are known, use check_image_spec.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image_url": {
                "description": "Public https link to the image file itself (JPEG, PNG, WebP or GIF are measured; up to 15 MB), not to the product page.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "platform": {
                "description": "Platform key, for example amazon, ebay, etsy, shopify, walmart, tiktok-shop, google-shopping (see get_image_requirements).",
                "enum": ["about-you", "adobe-commerce", "aliexpress", "allegro", "amazon", "amazon-a-content", "amazon-ads", "amazon-brand-store", "avocadostore", "beslist-nl", "best-buy-canada", "big-cartel", "bigcommerce", "bol", "cdiscount", "cdon", "coupang", "dafiti", "ebay", "ecwid", "emag", "etsy", "etsy-shop-banner", "facebook-instagram-shop", "faire", "falabella", "folksy", "fruugo", "fyndiq", "galaxus", "glami", "google-ads", "google-business-profile", "google-shopping", "gumroad", "heureka", "hood-de", "jimdo", "kaufland", "kickstarter", "klaviyo", "lightspeed-ecom", "linkedin-ads", "mailchimp", "mercado-livre", "microsoft-advertising", "miinto", "naver-smart-store", "newegg", "nextdoor-ads", "noon", "omnisend", "onbuy", "opencart", "orderchamp", "otto", "outbrain", "pinterest", "prestashop", "rakuten-ichiba", "reddit-ads", "reverb", "ricardo", "shein", "shift4shop", "shopee", "shopify", "shopify-themes", "shopline", "shopware", "skroutz", "snapchat-ads", "square-online", "squarespace", "taboola", "temu", "the-iconic", "tiki", "tiktok-ads", "tiktok-shop", "tokopedia", "trade-me", "tradera", "trendyol", "vestiaire-collective", "vinted", "volusion", "walmart", "walmart-connect", "wayfair", "webflow", "weebly", "wix", "wolf-badger", "woocommerce", "youtube", "zalando", "zalora"],
                "type": "string"
              }
            },
            "required": ["image_url", "platform"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Verdict against the platform's published rules.",
            "properties": {
              "fails": {
                "description": "Rules the image breaks.",
                "items": {
                  "properties": {
                    "message": {
                      "description": "The rule and the image's value in one English sentence.",
                      "type": "string"
                    },
                    "rule": {
                      "description": "Rule key, for example format, fileLarger, shortUnder, bg-pure-white, fill-min, whole, square.",
                      "type": "string"
                    }
                  },
                  "required": ["message", "rule"],
                  "type": "object"
                },
                "type": "array"
              },
              "fix_url": {
                "description": "Where to fix a failing image; null when nothing fails.",
                "type": ["string", "null"]
              },
              "guide_url": {
                "description": "Herofab's guide for the platform.",
                "type": "string"
              },
              "measured": {
                "description": "What Herofab read from the image. width, height, format and file size come from the file; background, product and shadow are estimates from the pixels.",
                "properties": {
                  "background": {
                    "description": "null when the pixels were not measured.",
                    "properties": {
                      "distance_from_white": {
                        "description": "255 minus the darkest channel of the edge colour; 0 is pure white.",
                        "type": ["integer", "null"]
                      },
                      "edge_colour": {
                        "description": "Median RGB of the image border.",
                        "items": {
                          "type": "integer"
                        },
                        "type": ["array", "null"]
                      },
                      "is_pure_white": {
                        "description": "Edge colour is RGB 255, 255, 255 and at least 95% of the background is pure white.",
                        "type": "boolean"
                      },
                      "kind": {
                        "description": "Estimated background: pure-white (RGB 255), near-white, white (off-white), light, coloured, busy (scene or texture) or transparent.",
                        "enum": ["pure-white", "near-white", "white", "light", "coloured", "busy", "transparent"],
                        "type": "string"
                      },
                      "near_white_share": {
                        "description": "Share of background pixels at RGB 250 or above.",
                        "type": ["number", "null"]
                      },
                      "plain": {
                        "description": "False for a scene or textured background.",
                        "type": "boolean"
                      },
                      "pure_white_share": {
                        "description": "Share of background pixels at exactly RGB 255.",
                        "type": ["number", "null"]
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "estimated": {
                    "description": "Always true: background, product fill, edge contact and shadow are estimates.",
                    "type": "boolean"
                  },
                  "file_size_bytes": {
                    "description": "Downloaded file size in bytes.",
                    "type": "integer"
                  },
                  "file_size_mb": {
                    "description": "Decimal megabytes (1 MB = 1,000,000 bytes), as marketplaces count them.",
                    "type": "number"
                  },
                  "format": {
                    "description": "File format detected from the file content (jpeg, png, webp, gif, tiff, bmp, avif).",
                    "type": "string"
                  },
                  "height": {
                    "description": "Height in pixels, read from the file (EXIF rotation applied).",
                    "type": "integer"
                  },
                  "method": {
                    "description": "How the values were measured, in one or two sentences.",
                    "type": "string"
                  },
                  "product": {
                    "description": "null when the product could not be separated (see product_note).",
                    "properties": {
                      "box": {
                        "description": "Product bounding box as shares of the frame, from the top-left corner.",
                        "properties": {
                          "h": {
                            "description": "Height, 0 to 1.",
                            "type": "number"
                          },
                          "w": {
                            "description": "Width, 0 to 1.",
                            "type": "number"
                          },
                          "x": {
                            "description": "Left edge, 0 to 1.",
                            "type": "number"
                          },
                          "y": {
                            "description": "Top edge, 0 to 1.",
                            "type": "number"
                          }
                        },
                        "type": "object"
                      },
                      "cut_off": {
                        "description": "True when the product touches an edge of the frame: it may be cut off.",
                        "type": "boolean"
                      },
                      "fill": {
                        "description": "Share of the frame the product covers on its longest axis, 0 to 1.",
                        "type": "number"
                      },
                      "fill_height": {
                        "description": "Share of the frame height the product covers, 0 to 1.",
                        "type": "number"
                      },
                      "fill_width": {
                        "description": "Share of the frame width the product covers, 0 to 1.",
                        "type": "number"
                      },
                      "touches_edge": {
                        "description": "Which frame edges the product touches.",
                        "properties": {
                          "bottom": {
                            "description": "Touches the bottom edge.",
                            "type": "boolean"
                          },
                          "left": {
                            "description": "Touches the left edge.",
                            "type": "boolean"
                          },
                          "right": {
                            "description": "Touches the right edge.",
                            "type": "boolean"
                          },
                          "top": {
                            "description": "Touches the top edge.",
                            "type": "boolean"
                          }
                        },
                        "type": "object"
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "product_note": {
                    "description": "Why product is null: a scene or textured background, a product that blends into the background, or pixels not measured; null when product is present.",
                    "enum": ["background_not_plain", "product_not_detected", "not_measured", null],
                    "type": ["string", "null"]
                  },
                  "shadow": {
                    "description": "Estimated shadow around the product; null on a scene or transparent background, or when pixels were not measured.",
                    "properties": {
                      "present": {
                        "description": "True when a shadow appears near the product.",
                        "type": "boolean"
                      },
                      "share": {
                        "description": "Share of the frame covered by the shadow, 0 to 1.",
                        "type": "number"
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "width": {
                    "description": "Width in pixels, read from the file (EXIF rotation applied).",
                    "type": "integer"
                  }
                },
                "required": ["background", "estimated", "file_size_bytes", "file_size_mb", "format", "height", "method", "product", "shadow", "width"],
                "type": "object"
              },
              "name": {
                "description": "Platform name.",
                "type": "string"
              },
              "not_checked": {
                "description": "Rules that could not be checked from the input, with the reason.",
                "items": {
                  "properties": {
                    "message": {
                      "description": "The rule and the image's value in one English sentence.",
                      "type": "string"
                    },
                    "rule": {
                      "description": "Rule key, for example format, fileLarger, shortUnder, bg-pure-white, fill-min, whole, square.",
                      "type": "string"
                    }
                  },
                  "required": ["message", "rule"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "description": "Warnings that do not fail the image, such as recommendations and zoom size.",
                "items": {
                  "properties": {
                    "message": {
                      "description": "The rule and the image's value in one English sentence.",
                      "type": "string"
                    },
                    "rule": {
                      "description": "Rule key, for example format, fileLarger, shortUnder, bg-pure-white, fill-min, whole, square.",
                      "type": "string"
                    }
                  },
                  "required": ["message", "rule"],
                  "type": "object"
                },
                "type": "array"
              },
              "pass": {
                "description": "True when no checked rule fails; see not_checked for what was not checked.",
                "type": "boolean"
              },
              "platform": {
                "description": "Platform key.",
                "type": "string"
              }
            },
            "required": ["fails", "fix_url", "guide_url", "measured", "name", "not_checked", "notes", "pass", "platform"],
            "type": "object"
