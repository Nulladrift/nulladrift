        {
          "name": "find_moments",
          "title": "Find clip-worthy moments in a video",
          "description": "Transcribe a public video (up to 2 hours) and propose up to 3 shareable moments (5 on Pro) of 10–90 s, optionally focused on `looking`. Returns a moments_id while processing: call find_moments again with moments_id to check. Pass any returned moment’s start and end seconds to edit_video (up to 15 s on Free, 90 s on Pro). Cached for 30 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "item": {
                "default": 1,
                "description": "1-based item from get_video_info; a photo-only post can offer a slideshow after its last photo.",
                "maximum": 21,
                "minimum": 1,
                "type": "integer"
              },
              "looking": {
                "description": "Optional topic to focus on, e.g. “where they discuss pricing”.",
                "maxLength": 200,
                "type": "string"
              },
              "moments_id": {
                "description": "Resume/check an existing moment search.",
                "type": "string"
              },
              "url": {
                "description": "Link to a public post or video (YouTube, Instagram, X / Twitter, TikTok, Bluesky, Facebook, VK, LinkedIn, Weibo, Twitch, Kick).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2a10444b314a9497d9742c37ceeff01743ef4ddf825406e11ac2c600abdf06b6"
        },
        {
          "name": "follow_channel",
          "title": "Follow a channel",
          "description": "Follow a YouTube channel for the account (needs an API key): its new videos land in the account’s inbox (check_inbox) and notify the browsers that turned that on. Optionally only videos whose title has one of `words`, no Shorts, or only for the next `days`. With `moments`, each new video (not Shorts, up to 2 hours) is transcribed and up to 3 parts worth clipping are proposed on its inbox row, about `looking` when given; nothing is rendered or shared, each search counts as one download, up to 2 a day (10 on Pro). Following one already followed changes only the parts of its rule given. Playlists can’t be followed: YouTube lists only their first 15 videos, so new ones at the end never show. What it holds now is not news, except a video from the last 3 days. Up to 20 follows (100 on Pro); feeds are read every 15 minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Stop following after this many days. Omit to follow until unfollowed.",
                "maximum": 366,
                "minimum": 1,
                "type": "integer"
              },
              "looking": {
                "description": "What the moments should be about, e.g. “where she talks about pricing”. Omit for the best of the video.",
                "maxLength": 200,
                "type": "string"
              },
              "moments": {
                "default": false,
                "description": "Search each new video for moments worth clipping.",
                "type": "boolean"
              },
              "shorts": {
                "default": true,
                "description": "Whether Shorts are news too.",
                "type": "boolean"
              },
              "url": {
                "description": "A YouTube channel link.",
                "type": "string"
              },
              "words": {
                "description": "Only videos whose title has one of these are news (case and accents ignored). Omit for every video.",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
