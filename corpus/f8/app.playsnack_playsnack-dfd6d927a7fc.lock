          "digest": "sha256:fe7b5151784f8ca58dd35a3e8f00f80b6e5a4c272bf39260d01aefc25c9224c6"
        },
        {
          "name": "recommend_games",
          "title": "Recommend party games",
          "description": "Recommends PlaySnack party games for a group of a given size (friends, coworkers, a class, family), optionally matching a mood and a length in minutes. Each game runs in a phone's web browser, with everyone on their own phone, in one place or apart. Returns up to 5 games, best match first, each with its game_id (the input of get_game and open_friend_room), player range, length and page link; note explains when the group is larger than a friends room.\n인원·분위기·시간에 맞는 PlaySnack 파티 게임을 최대 5개 추천합니다(각자 폰 브라우저로 해요).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Answer language (default \"ko\").",
                "enum": ["ko", "en"],
                "type": "string"
              },
              "minutes": {
                "description": "Roughly how long they want to play.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "mood": {
                "enum": ["loud", "quick", "brainy", "chill", "luck"],
                "type": "string"
              },
              "players": {
                "description": "How many people will play.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["players"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "games": {
