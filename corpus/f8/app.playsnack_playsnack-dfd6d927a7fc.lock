      "instructions": "PlaySnack is a set of party games played in each person's phone browser, with no app install and no account. recommend_games suggests games for a group size, mood and length; list_games lists them all; get_game returns one game's rules; open_friend_room opens a private room link for up to 10 phones (polls and wheels open only after the user approves the list). Every tool takes lang: \"ko\" (default) or \"en\" for the language of the answer.",
      "tools": [
        {
          "name": "get_game",
          "title": "Get game rules",
          "description": "Returns one game's rules in a few sentences (how a round goes), its player range, length and what it suits. game_id comes from list_games or recommend_games.\n게임 한 개의 규칙·인원·시간.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game_id": {
                "description": "A game_id from list_games or recommend_games.",
                "pattern": "^[a-z0-9-]{1,60}$",
                "type": "string"
              },
              "lang": {
                "description": "Answer language (default \"ko\").",
                "enum": ["ko", "en"],
                "type": "string"
              }
            },
            "required": ["game_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "game_id": {
                "type": "string"
              },
              "good_for": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "how_to_play": {
                "type": "string"
              },
              "korean_only": {
                "type": "boolean"
              },
              "maker": {
                "type": "boolean"
              },
              "minutes": {
                "type": "integer"
              },
              "moods": {
                "items": {
                  "enum": ["loud", "quick", "brainy", "chill", "luck"],
                  "type": "string"
                },
                "type": "array"
              },
              "page_url": {
                "type": "string"
              },
              "pitch": {
                "type": "string"
              },
              "players": {
                "additionalProperties": false,
                "properties": {
                  "best": {
                    "items": {
                      "type": "integer"
                    },
                    "maxItems": 2,
                    "minItems": 2,
                    "type": "array"
                  },
                  "min": {
                    "type": "integer"
                  }
                },
                "required": ["best", "min"],
                "type": "object"
              },
              "solo_url": {
                "type": ["string", "null"]
              },
              "title": {
                "type": "string"
              },
              "together": {
                "type": "boolean"
              }
            },
            "required": ["game_id", "good_for", "how_to_play", "korean_only", "maker", "minutes", "moods", "page_url", "pitch", "players", "solo_url", "title", "together"],
            "type": "object"
          },
