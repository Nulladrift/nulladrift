        {
          "name": "open_friend_room",
          "title": "Open a friends room",
          "description": "Opens a private PlaySnack room for one game. Returns one join link (join_url) that everyone in the group uses and a QR page (qr_url) for people in the same place. A room holds up to 10 phones; joining needs no account. The first person to open join_url becomes the host, who starts the game (or spins the wheel); anyone else with the link joins the same room. join_url works only exactly as returned: its query and its #fragment are part of the room. Each call opens a new room.\nContent games (vote-maker: a poll; wheel-fortune: a roulette wheel) open ready with the list in content, and the server requires the user's approval of that list before it opens a room: without content → status needs_content with content_shape (the fields and an example); with content but without confirmed: true → status needs_confirmation with the cleaned list the room will use (what cleaning changed is in content_notes), and no room is opened; the same content with confirmed: true → the room opens with that list. Other games that are written first return status maker_link with make_url, where the user writes their questions. Other statuses: solo_only (one-phone game, solo_url), rooms_full_today and busy (retry_after), slow (retry_in seconds).\n게임 하나로 친구방(최대 10명)을 열고 모두가 쓰는 참여 링크(join_url)와 QR 페이지를 돌려줍니다. 링크를 먼저 연 사람이 방장이에요. 투표(vote-maker)·룰렛(wheel-fortune)은 content의 목록으로 열리고, 정리된 목록을 needs_confirmation으로 먼저 돌려준 뒤 confirmed: true로 다시 불렀을 때만 방이 열려요.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmed": {
                "description": "true = the user approved the exact list returned with needs_confirmation; the room then opens with it. Absent or false = no room; the cleaned list comes back for approval.",
                "type": "boolean"
              },
              "content": {
                "additionalProperties": false,
                "description": "The list a content game opens with. vote-maker: {question, options} — e.g. {\"question\": \"점심 뭐 먹지?\", \"options\": [\"김치찌개\", \"돈가스\", \"쌀국수\"]} (2+ options). wheel-fortune: {items, title?} — e.g. {\"title\": \"벌칙\", \"items\": [\"노래하기\", \"커피 사기\", \"통과\"]} (2+ items; each item is short, up to 16 characters).",
                "properties": {
                  "items": {
                    "description": "wheel-fortune: the wheel's segments, in order.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "options": {
                    "description": "vote-maker: the choices, in order.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "question": {
                    "description": "vote-maker: the poll question.",
                    "type": "string"
                  },
                  "title": {
                    "description": "wheel-fortune: an optional name shown above the wheel.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "game_id": {
                "description": "A game_id from recommend_games or list_games.",
                "pattern": "^[a-z0-9-]{1,60}$",
                "type": "string"
              },
              "lang": {
                "description": "Answer language (default \"ko\").",
                "enum": ["ko", "en"],
                "type": "string"
              }
            },
            "required": ["game_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "content": {
                "additionalProperties": false,
                "description": "needs_confirmation / ok: the cleaned content the room uses, exactly as the room shows it.",
                "properties": {
                  "items": {
                    "description": "wheel-fortune: the wheel's segments, in order.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "options": {
                    "description": "vote-maker: the choices, in order.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "question": {
                    "description": "vote-maker: the poll question.",
                    "type": "string"
                  },
                  "title": {
                    "description": "wheel-fortune: an optional name shown above the wheel.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "content_notes": {
                "description": "What cleaning changed (cut to the length limit, a repeat or an empty entry dropped).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "content_shape": {
                "description": "needs_content / invalid_content: the content this game takes, with an example.",
                "type": "object"
              },
              "game": {
                "additionalProperties": false,
                "properties": {
                  "game_id": {
                    "type": "string"
                  },
                  "korean_only": {
                    "type": "boolean"
                  },
                  "maker": {
                    "type": "boolean"
                  },
                  "minutes": {
                    "type": "integer"
                  },
                  "moods": {
                    "items": {
                      "enum": ["loud", "quick", "brainy", "chill", "luck"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "page_url": {
                    "type": "string"
                  },
                  "pitch": {
                    "type": "string"
                  },
                  "players": {
                    "additionalProperties": false,
                    "properties": {
                      "best": {
                        "items": {
                          "type": "integer"
                        },
                        "maxItems": 2,
                        "minItems": 2,
                        "type": "array"
                      },
                      "min": {
                        "type": "integer"
                      }
                    },
                    "required": ["best", "min"],
                    "type": "object"
                  },
                  "solo_url": {
                    "type": ["string", "null"]
                  },
                  "title": {
                    "type": "string"
                  },
                  "together": {
                    "type": "boolean"
                  }
                },
                "required": ["game_id", "korean_only", "maker", "minutes", "moods", "page_url", "pitch", "players", "solo_url", "title", "together"],
                "type": "object"
              },
              "join_url": {
                "description": "The one link for everyone, valid only exactly as returned. Its first opener becomes the host; the group joins with the same link.",
                "type": "string"
              },
              "make_url": {
                "description": "maker_link: where the user writes their questions / options, then shares from the app.",
                "type": "string"
              },
              "max_players": {
                "type": "integer"
              },
              "qr_url": {
                "description": "A page showing the join QR, for people in the same place.",
                "type": "string"
              },
              "retry_after": {
                "description": "ISO time when new rooms open again.",
                "type": "string"
              },
              "retry_in": {
                "description": "Seconds to wait.",
                "type": "integer"
              },
              "solo_url": {
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["ok", "needs_content", "needs_confirmation", "invalid_content", "maker_link", "solo_only", "rooms_full_today", "busy", "slow"],
                "type": "string"
              }
            },
            "required": ["game", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
