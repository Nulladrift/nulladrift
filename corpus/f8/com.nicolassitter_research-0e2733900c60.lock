            "readOnly": true
          },
          "digest": "sha256:aa168ff85e76c4fdbb4388f70d92f88349913c5220c59e1f093458cf9bbcad46"
        },
        {
          "name": "get_hotel_brand_leaderboard",
          "description": "Get the chain-brand leaderboard for one AI platform in one week: which hotel groups (Marriott, Accor, Hilton, IHG and the rest) get mentioned most, and across how many distinct properties. Use this when the user asks which hotel chains or brands dominate AI recommendations, how a specific group performs against its competitors in AI answers, or whether big brands beat independents. For individual properties use get_ai_hotel_visibility instead.",
          "inputSchema": {
            "properties": {
              "client": {
                "description": "Optional: identify yourself, e.g. \"my-agent/1.0\". Not required and never used by the tool itself — recorded only so the public tracker at /projects/agent-tools can measure how many callers self-identify when nothing forces them to.",
                "type": "string"
              },
              "platform": {
                "description": "Platform id from the manifest.",
                "type": "string"
              },
              "week": {
                "description": "Snapshot week as YYYY-MM-DD. Omit for the most recent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d72e243a6624924ce55106e875385ce23ba28b889f3d9155ec1fb3200873f5d"
        },
        {
          "name": "list_race_explorers",
          "description": "List the endurance races this site publishes results explorers for — L'Étape du Tour, the Marathon and Semi de Paris, the Triathlon de l'Alpe d'Huez, La Marmotte and their archive editions — with each one's year, sport, distance, finisher count and URL. Use this when the user asks what race data this site has, asks about results or statistics for one of these events, or wants to know how many people finished a particular edition. Returns aggregate figures per race only.",
          "inputSchema": {
            "properties": {
              "client": {
                "description": "Optional: identify yourself, e.g. \"my-agent/1.0\". Not required and never used by the tool itself — recorded only so the public tracker at /projects/agent-tools can measure how many callers self-identify when nothing forces them to.",
                "type": "string"
              },
              "sport": {
                "description": "Filter to \"cycling\", \"running\" or \"triathlon\".",
                "type": "string"
              },
              "year": {
                "description": "Filter to a single edition year.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1b7e2f988916bf077934c64f6d08fda31dd618c98fcac57534e1bc84e2c1d84"
        },
        {
          "name": "search_research_articles",
          "description": "Search Nicolas Sitter's published research on AI search, answer engines and hotel technology by keyword, matching headlines and descriptions. Use this when the user asks what research exists on a topic, wants studies or data about how ChatGPT/Gemini/Perplexity/Copilot/Google AI Mode behave, asks about AEO/GEO measurement, or asks what this site has written about something. Returns headline, description, URL and publish date for each match; call with no query to list everything.",
          "inputSchema": {
            "properties": {
              "client": {
                "description": "Optional: identify yourself, e.g. \"my-agent/1.0\". Not required and never used by the tool itself — recorded only so the public tracker at /projects/agent-tools can measure how many callers self-identify when nothing forces them to.",
                "type": "string"
              },
              "query": {
                "description": "Keyword or phrase. Omit to list all articles.",
                "type": "string"
              }
            },
            "type": "object"
          },
