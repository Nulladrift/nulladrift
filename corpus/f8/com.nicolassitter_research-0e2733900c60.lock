      "serverInfo": {
        "name": "nicolassitter.com",
        "title": "Nicolas Sitter — AI search research & race data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Research on how AI answer engines recommend hotels and cite sources, plus race-results data. Call get_ai_hotel_landscape_manifest before the other landscape tools — it supplies the platform ids, city slugs and week dates they expect.",
      "tools": [
        {
          "name": "get_ai_citation_sources",
          "description": "Get what an AI platform cites when it answers hotel questions — the mix of source categories (OTAs, review sites, the hotels' own sites, editorial, and so on) and the leading domains inside each category. Use this when the user asks where ChatGPT or Perplexity gets its hotel information, which sites influence AI recommendations, whether a domain is cited by AI assistants, or how to get cited. This is the question behind most AEO and GEO work.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug or name. Omit for all destinations.",
                "type": "string"
              },
              "client": {
                "description": "Optional: identify yourself, e.g. \"my-agent/1.0\". Not required and never used by the tool itself — recorded only so the public tracker at /projects/agent-tools can measure how many callers self-identify when nothing forces them to.",
                "type": "string"
              },
              "platform": {
                "description": "Platform id from the manifest. Naming one also returns top domains per category.",
                "type": "string"
              },
              "week": {
                "description": "Snapshot week as YYYY-MM-DD. Omit for the most recent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:742108abce6925f1785da7feb6ca2d3b139d07fdfa6be545d05187cdcb0734ec"
        },
        {
          "name": "get_ai_hotel_landscape_manifest",
          "description": "Read the manifest for the AI Hotel Landscape dataset: which AI platforms are tracked (ChatGPT, Gemini, Perplexity, Grok, Copilot, Google AI Mode) and whether each is still active, which of the 56 destinations are covered, which weekly snapshots exist, and the licence and refresh cadence. Call this FIRST before any other landscape tool, because it gives you the exact platform ids, city slugs and week dates the other tools expect. Use it whenever the user asks what data is available about how AI assistants recommend hotels.",
          "inputSchema": {
            "properties": {
              "client": {
                "description": "Optional: identify yourself, e.g. \"my-agent/1.0\". Not required and never used by the tool itself — recorded only so the public tracker at /projects/agent-tools can measure how many callers self-identify when nothing forces them to.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a633e1f1faf1423ea1192e33456fe1d382390eff331c4702073a58e50d8227b7"
        },
        {
          "name": "get_ai_hotel_visibility",
          "description": "Get the hotels an AI platform actually recommends for a destination in a given week, ranked by how often it mentions them, with the split of links it gives each one (direct to the hotel, to an OTA, to a chain site, or elsewhere). Use this when the user asks which hotels ChatGPT or Gemini or Perplexity recommends in a city, whether a specific hotel or brand shows up in AI answers, who is winning AI visibility in a market, or how a destination's results differ between platforms. Get platform ids and city slugs from get_ai_hotel_landscape_manifest first.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug or name, e.g. \"paris\". Omit for all destinations.",
                "type": "string"
              },
              "client": {
                "description": "Optional: identify yourself, e.g. \"my-agent/1.0\". Not required and never used by the tool itself — recorded only so the public tracker at /projects/agent-tools can measure how many callers self-identify when nothing forces them to.",
                "type": "string"
              },
              "platform": {
                "description": "Platform id from the manifest, e.g. \"chatgpt\". Omit for all platforms.",
                "type": "string"
              },
              "week": {
                "description": "Snapshot week as YYYY-MM-DD. Omit for the most recent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f648be09d0e92e9ca5b227fc5a5f199131c948f323b10f2da3878ac168e3522"
        },
        {
          "name": "get_article",
          "description": "Fetch one research article by its URL slug — the last path segment of a /research/<slug> URL. Use this after search_research_articles to read a specific study, or when the user names an article or pastes one of its URLs. format 'summary' (the default) returns headline, description, date and read time; format 'full' also returns the complete article body as markdown, which is what you want if the user asks about the methodology, the numbers, or what the study actually found.",
          "inputSchema": {
            "properties": {
              "client": {
                "description": "Optional: identify yourself, e.g. \"my-agent/1.0\". Not required and never used by the tool itself — recorded only so the public tracker at /projects/agent-tools can measure how many callers self-identify when nothing forces them to.",
                "type": "string"
              },
              "format": {
                "description": "'summary' (default) or 'full'.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "slug": {
                "description": "Article slug, e.g. \"ai-hotel-landscape-2026\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81ed4bde0fdf1cd569c92154f63c70ce5996c80ca26ce450fce115f4e408a3bb"
        },
        {
          "name": "get_chain_vs_independent_mix",
          "description": "Get the share of chain hotels versus independents versus vacation rentals in what each AI platform recommends, for one week. Use this when the user asks whether AI assistants favour big chains over independent hotels, whether an independent property can compete in AI answers, or how the platforms differ in the kind of property they surface.",
          "inputSchema": {
            "properties": {
              "client": {
                "description": "Optional: identify yourself, e.g. \"my-agent/1.0\". Not required and never used by the tool itself — recorded only so the public tracker at /projects/agent-tools can measure how many callers self-identify when nothing forces them to.",
                "type": "string"
              },
              "platform": {
                "description": "Platform id from the manifest. Omit for all.",
                "type": "string"
              },
              "week": {
                "description": "Snapshot week as YYYY-MM-DD. Omit for the most recent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
