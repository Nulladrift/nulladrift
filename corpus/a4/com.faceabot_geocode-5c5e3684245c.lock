{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/geocode": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/geocode"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-geocode",
        "title": "Faceabot Geocoding",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Geocoding: address or place name → coordinates (geocode_address {\"query\":\"…\"}), and coordinates → address (reverse_geocode {\"lat\":…,\"lon\":…}), worldwide, any language, free, no key.\nData: OpenStreetMap (© OpenStreetMap contributors, ODbL): cite it. To find restaurants, hotels or pharmacies near a point: Faceabot Places, https://faceabot.com/tools-mcp/places.\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "geocode_address",
          "title": "Address or place name to coordinates",
          "description": "Turns an address, a place name or a city into coordinates (latitude, longitude) with its full address, type and country. Worldwide, any language.\nUse when: you need coordinates for a map, a distance, weather or places_near.\nExample: {\"query\":\"Grand-Place, Brussels\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "type": "string"
              },
              "limit": {
                "default": 3,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Address, landmark or place name",
                "examples": ["Grand-Place, Brussels"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:981f7ea10e4bba30714a66172db589df7290613cbc5e2ba29ec06741d448aac6"
        },
        {
          "name": "reverse_geocode",
          "title": "Coordinates to address",
          "description": "Turns a latitude/longitude into the nearest address (street, postcode, city, country).\nUse when: you have GPS coordinates and need a readable address.\nExample: {\"lat\":48.8584,\"lon\":2.2945}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "type": "string"
              },
              "lat": {
                "examples": [48.8584],
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "examples": [2.2945],
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fcc697bcb08d4a5af5427c07be5d944ff3d211629bb78c1b04575082e5529936"
        }
      ],
      "digest": "sha256:a5c62d6645a1f6fa6871d7503513eea41534130e2d97d2ea36fa0d8a86fbc286"
    }
  }
}
