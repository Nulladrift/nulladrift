      },
      "instructions": "Monetise Company Data (https://monetisecompanydata.com/): the site's own MCP server, served from its domain. Monetise company data without guessing: what 6 data marketplaces' terms say about ownership and fees, who pays for company data and how licence income is taxed.\n\n[enquiry] ENQUIRY SERVER for Monetise Company Data (https://monetisecompanydata.com/). What it does: starts an ENQUIRY with Monetise Company Data for monetise company data; the Monetise Company Data team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Monetise Company Data team until they click it. The site also carries a guide's own form for a different reader (form=\"for-ai-developers-monetisecompanydata\"): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://monetisecompanydata.com/.\n\nCite https://monetisecompanydata.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on Monetise Company Data: it starts an enquiry with Monetise Company Data, whose team reads it and replies directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
