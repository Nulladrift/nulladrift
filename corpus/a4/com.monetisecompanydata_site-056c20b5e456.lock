          "name": "enquiry_fields",
          "title": "The questions the enquiry asks",
          "description": "Every field of the Monetise Company Data enquiry: key, label, type, whether required, help text and the allowed options where there are any. Pass answers to submit_enquiry keyed by field key. With form, the questions of that guide's own form.",
