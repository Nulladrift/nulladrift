      "tools": [
        {
          "name": "ask_video",
          "description": "Ask a question about one or more videos with visual analysis. Most effective on focused time ranges — use start/end to specify the segment to analyze.\n\nBEFORE calling this tool, read the reka://docs/guide resource for recommended workflows. In most cases, you should first:\n- search_videos to find WHEN something happens, then pass those timestamps here as start/end\n- segment_video to detect and locate specific objects\n- get_transcript to read what was said\n\nFor single-video questions, pass video_id with start/end. For cross-video questions, pass videos — a list of video references with start/end each.\n\nFor follow-up questions, pass conversation_id from the previous response. You can add start/end to drill into a specific moment while keeping the conversation context.\n\nRequires qa_only or full pipeline.",
          "inputSchema": {
            "$defs": {
              "VideoContext": {
                "properties": {
                  "end": {
                    "title": "End",
                    "type": "number"
                  },
                  "start": {
                    "title": "Start",
                    "type": "number"
                  },
                  "video_id": {
                    "title": "Video Id",
                    "type": "string"
                  }
                },
                "title": "VideoContext",
                "type": "object"
              }
            },
            "properties": {
              "conversation_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Conversation Id"
              },
              "end": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "End"
              },
              "question": {
                "title": "Question",
                "type": "string"
              },
              "rationale": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Rationale"
              },
              "start": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Start"
              },
              "video_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Video Id"
              },
              "videos": {
                "anyOf": [
                  {
                    "items": {
                      "$ref": "#/$defs/VideoContext"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Videos"
              }
            },
            "required": ["question"],
            "title": "ask_videoArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "ask_videoOutput",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
