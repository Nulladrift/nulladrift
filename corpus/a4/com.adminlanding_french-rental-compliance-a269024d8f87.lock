      },
      "instructions": "French rental & cross-border tools by AdminLanding (adminlanding.com): rental — zone tendue status, tenant notice period, DPE rental restrictions, IRL rent-revision; frontalier (France–Switzerland) — net Swiss salary, LAMal vs CMU health cover, Swiss vs French family allowances, Geneva quasi-resident status; home employment (particulier employeur ↔ salarié, CCN 3239) — end-of-contract notice, calendar, indemnity and documents for either party, plus an assistant-maternel (assmat) alias with the regime pre-set — all free, no account needed (read-only, except generate_rent_receipt which renders a free PDF). generate_rent_receipt is available here WITHOUT an account: a free French quittance de loyer PDF from the fields you give (nothing stored beyond the 24h PDF and its single-use link; per-network caps apply). Leases, the other rental letters, home-employment documents, the cross-border reports and the two frontalier attestations (membership or a Cross-Border Pack édition already bought, unlimited under fair use) and e-signature (generate_lease, generate_home_employment_*, generate_*_report, generate_presence_attestation, generate_leaver_attestation, request_signature) require a personal API key or OAuth sign-in on /mcp/account. Deterministic legal formulas, official datasets and fixed document templates — general information, not legal advice (the user should verify important decisions).",
      "tools": [
        {
          "name": "calculate_assistant_maternel_end_of_contract",
          "title": "Assistant maternel (assmat) end of contract — retrait d'enfant, démission, préavis, indemnité (CCN 3239)",
          "description": "End of an assistant maternel (assmat) contract with a parent-employer: retrait d'enfant or resignation, notice, indemnity, Pajemploi documents, for the parent or the assistant maternel. · Fin de contrat d'assistant maternel (assmat) avec un parent employeur : retrait d'enfant ou démission, préavis, indemnité de rupture, documents Pajemploi, pour le parent comme pour l'assistant maternel. — Same engine as calculate_home_employment_end_of_contract with regime pre-set to assistant_maternel (socle spécifique): notice by length of care (art. 120: 8 days / 15 days / 1 month, outside the trial period), withdrawal indemnity (art. 121.1: 1/80 of gross salaries excluding entretien/repas/km, from 9 months of care), rupture conventionnelle NOT available (CASF L.423-2), unfitness (art. 119.5) and the approval suspended or withdrawn (art. 119.3), last Pajemploi declaration, 6-month settlement contest window (from the receipt's signature — earliest end shown), documents with who produces and who receives each; départ volontaire à la retraite (art. 63.2.2, notice art. 120; the annex-4 indemnity of art. 121.2 computed on the periods given, PAID BY THE INSURER, not the employer). With no date given the seniority is taken today (Europe/Paris) and the result says so. NOT for a garde d'enfant à domicile (nounou at the family's home) — that is regime garde_domicile on the generic tool. Applies the Convention collective IDCC 3239 (verified on Légifrance 2026). Deterministic formulas — no AI, no assessment of any person or motif.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agreed_end_date": {
                "description": "Rupture conventionnelle only: the end date the parties agreed — the minimum indemnity (art. 161.3 → 163.1) is computed with the seniority reached on that day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "am_monthly_gross": {
                "description": "Assistant maternel: monthly gross (mensualisation), EXCLUDING indemnités d'entretien, repas, kilométriques.",
                "minimum": 0,
                "type": "number"
              },
              "am_total_gross_paid": {
                "description": "Assistant maternel: optional total gross salaries paid since the start (art. 121.1 base). Defaults to mensualisation × complete months.",
                "minimum": 0,
                "type": "number"
              },
              "approval_decision": {
                "description": "Approval ending only (assistant maternel): the conseil départemental's decision.",
                "enum": ["suspension", "modification", "retrait"],
                "type": "string"
              },
              "approval_notified_date": {
                "description": "Approval ending only: the day the conseil départemental notified the decision — the contract ends on it (art. 119.3).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "as_of_date": {
                "description": "Seniority reference date when the letter has not been sent yet (planning). Ignored when notification_date is given. Defaults to today (Europe/Paris) when no date at all is given, as on the web calculator and the documents.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "avg_60_months_gross": {
                "description": "retirement_departure only: the monthly average of the gross salaries of the last 60 calendar months in the branch (annex 4, art. 4.1 takes the most favourable of the 60-, 12- and 3-month averages). The indemnity is PAID BY THE INSURER, not by the employer (art. 4.2).",
                "minimum": 0,
                "type": "number"
              },
              "cdd_end_date": {
                "description": "contract_type 'cdd' only: the term of the contract with its renewals (the L.1243-2 notice counts on the total length).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "cdd_reason": {
                "description": "contract_type 'cdd' only: the motif (C. trav. art. L.1242-2) — 'seasonal' has no end-of-contract indemnity (L.1243-10, 1°).",
                "enum": ["replacement_absence", "replacement_part_time", "replacement_suspension", "replacement_before_removal", "awaiting_cdi", "temporary_increase", "seasonal"],
                "type": "string"
              },
              "contract_type": {
                "description": "'cdi' (permanent) or 'cdd' (fixed-term). Omitted = the rules of a permanent contract. A CDD ends before its term only in the cases of C. trav. art. L.1243-1 / L.1243-2 (CCN 3239 art. 62): agreement of the parties (no official form, no homologation), faute grave, unfitness (L.1226-4-3 / L.1226-20), the employee's resignation on a CDI hire (notice one day per week of the total length, two weeks at most) — any other ending is answered status 'blocked', code cdd_early_end_not_provided. Judged after its term (cdd_end_date), the relationship still running, the CDD is a CDI (L.1243-11).",
                "enum": ["cdi", "cdd"],
                "type": "string"
              },
              "end_reason": {
                "description": "Closed category matching the letter: 'cdd_term_end' (a fixed-term contract ending at its term — C. trav. art. L.1243-5 « cesse de plein droit à l'échéance du terme »: no letter, no notice, no rupture indemnity; the end-of-contract indemnity of L.1243-8 except in the cases of L.1243-10; every figure taken at the term; needs contract_type 'cdd' and cdd_end_date; not when the work went on after the term — then a permanent contract, L.1243-11), 'employer_termination' (licenciement / retrait d'enfant), 'resignation' (démission), 'mutual_termination' (rupture conventionnelle — not available for assistants maternels), 'unfitness' (inaptitude, CCN art. 161.1.3 / 119.5: no notice; needs unfitness_origin and unfitness_opinion_date), 'approval_withdrawn' (assistant maternel only, art. 119.3: approval suspended, changed or withdrawn; needs approval_decision and approval_notified_date), 'retirement_by_employer' (mise à la retraite, home employee only, art. 161.1.2: the dismissal's notice, art. 162.5; an indemnity whatever the seniority, computed like art. 163.1, art. 163.2 — for an assistant maternel the employer's ending is the withdrawal of the child, blocked with code retirement_by_employer_is_withdrawal_am), 'retirement_departure' (départ volontaire à la retraite, art. 63.2.2: home employee notice art. 162.5, assistant maternel art. 120; the voluntary-retirement indemnity of annex 4 — art. 163.3 / 121.2 — is computed from annex 4 on sector_months / sector_months_last_84 / avg_60_months_gross when given, else on this contract alone, with payer 'insurer' (annex 4, art. 4.2); reason annex4_conditions_not_met when the periods known do not reach 120 months, 60 of them in the last 84).",
                "enum": ["employer_termination", "resignation", "mutual_termination", "unfitness", "approval_withdrawn", "retirement_by_employer", "retirement_departure", "cdd_term_end"],
                "type": "string"
              },
              "entretien_date": {
                "description": "Home employee dismissal / unfitness: the day the preliminary interview was held — the notification window (4th–30th jour ouvrable, art. 161.1.1.1) is computed from it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "leave_pay_mode": {
                "description": "Home employee: how paid leave is paid — 'on_leave' (when taken) or 'cesu_10pct' (the CESU hourly wage raised by 10 %: « les congés payés sont rémunérés au moment du versement du salaire mensuel », CCN 3239 art. 140.1.2 — then no compensatory paid-leave indemnity at the end). Omitted = unknown: the answer states the rule with its exception.",
                "enum": ["on_leave", "cesu_10pct"],
                "type": "string"
              },
              "notification_date": {
                "description": "ISO date of the FIRST PRESENTATION (or handover) of the letter that ends the contract — the notice runs from it. For a rupture conventionnelle: the day both parties sign the OFFICIAL form (the withdrawal period runs from it). When omitted (with sent_date and as_of_date), the seniority is taken TODAY (Europe/Paris) and the result says so (seniority.as_of_default: 'today') — never zero seniority.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "party": {
                "description": "Who is asking: 'employer' (particulier employeur) or 'employee' (salarié / assistant maternel). Wording only — the figures are identical for both.",
                "enum": ["employer", "employee"],
                "type": "string"
              },
              "sector_months": {
                "description": "retirement_departure only: the months of employment in the branch over the whole career, ALL household employers together (CCN 3239 annex 4, art. 2.2: 120 months needed; 1 month of salary from 10 years, 1.5 from 15, 2 from 20, 2.5 from 30). Defaults to this contract's months — a floor.",
                "maximum": 720,
                "minimum": 0,
                "type": "number"
              },
              "sector_months_last_84": {
                "description": "retirement_departure only: of those, the months within the 84 months before the end of the contract (annex 4, art. 2.2: 60 needed). Defaults to this contract's.",
                "maximum": 84,
                "minimum": 0,
                "type": "number"
              },
              "sent_date": {
                "description": "ISO date the ending letter was SENT (registered post) or handed over. The notice tier is set by the seniority on that day (CCN art. 162.1 / 120); for faute grave/lourde and unfitness the contract ends on it (art. 64.3 / 64.4). When omitted the tier is taken at the first presentation and notice.tierDependsOnSentDate says whether a threshold lies in the 7 days before it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "serious_misconduct": {
                "description": "The letter states faute grave or faute lourde (a category chosen by the user — the tool does not assess it). Removes the notice and the indemnity by rule.",
                "type": "boolean"
              },
              "start_date": {
                "description": "Contract start (ISO).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "unfitness_opinion_date": {
                "description": "Unfitness only: the date of the occupational physician's final opinion; the rupture takes place within one month of it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "unfitness_origin": {
                "description": "Unfitness only: 'occupational' (work accident or occupational disease — the indemnity is doubled, art. 161.1.3 / 2/80 art. 119.5) or 'non_occupational'.",
                "enum": ["occupational", "non_occupational"],
                "type": "string"
              }
            },
            "required": ["end_reason", "party", "start_date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94777f852512c7fd11e73df8912ef95409effa943e59b0063f167a8aeeb73a44"
        },
        {
          "name": "calculate_deposit_restitution",
          "title": "Security-deposit restitution calculator — due date, late penalty, vétusté apportionment",
          "description": "Deposit restitution: due date, 10 %/month late penalty, vétusté-apportioned retentions. · Restitution du dépôt de garantie : date limite, majoration de 10 % par mois de retard, retenues avec vétusté. — For a French residential lease (loi n° 89-462 art. 22 / art. 25-6): the restitution deadline (1 month from the remise des clés when the exit état des lieux matches the entry one, 2 months otherwise), the late penalty (10 % of the monthly rent en principal per monthly period started late; not due when the delay results from the tenant not having given the address of the new home), the provision a landlord may keep in an immeuble collectif (duly justified, at most 20 % of the deposit — art. 22, al. 5: a ceiling, the amount is the landlord's), the legal deposit cap (1 month unfurnished / 2 months furnished, when lease_type is given) and, for each damage line, the share chargeable to the tenant after vétusté (usure normale) — under the grille of the lease when given, otherwise an ILLUSTRATIVE grille (no official grille exists — décret n° 2016-382 art. 4 defers to accords collectifs; the response says so). Nothing is assumed: the age of an element a grille applies to is asked for, the lease type and the provision amount are left out when not given. Same figures whichever party asks: pass perspective 'landlord' (justify a retention) or 'tenant' (contest one) — only next_steps change. Ask the user for amounts and dates in plain words; damage items as 'what, repair cost, age of the element'. Deterministic rules, not AI. General information, not legal advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "apply_provision": {
                "description": "true to deduct provision_amount in the figures; false to leave it out. Without provision_amount nothing can be deducted: the tool asks for the amount.",
                "type": "boolean"
              },
              "copropriete": {
                "description": "true when the dwelling is in an immeuble collectif (a collective building, co-owned or not): the landlord may keep a duly justified provision of at most 20 % of the deposit until the building's yearly accounts (art. 22, al. 5).",
                "type": "boolean"
              },
              "damages": {
                "description": "Damage lines to apportion. Omit for a full restitution.",
                "items": {
                  "properties": {
                    "age_years": {
                      "description": "Age of the element in years (installed or last renewed) — 0 for a new element. REQUIRED when a grille applies to the line (grille_key, lifespan_years or annual_rate_pct): the chargeable share is computed from it and it is never assumed.",
                      "maximum": 80,
                      "minimum": 0,
                      "type": "number"
                    },
                    "annual_rate_pct": {
                      "description": "Lease-annexed grille: annual abatement in % (omit for a linear abatement over the lifespan).",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "cost": {
                      "description": "Justified repair cost (quote or invoice), €.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "franchise_years": {
                      "description": "Lease-annexed grille: franchise in years.",
                      "maximum": 20,
                      "minimum": 0,
                      "type": "number"
                    },
                    "grille_key": {
                      "description": "Category in the grille (peinture, papier_peint, moquette, sol_souple, parquet_vitrification, robinetterie, chauffe_eau, electromenager, volets_stores). Omit for an element outside the grille — its full cost then stays chargeable.",
                      "enum": ["peinture", "papier_peint", "moquette", "sol_souple", "parquet_vitrification", "robinetterie", "chauffe_eau", "electromenager", "volets_stores"],
                      "type": "string"
                    },
                    "item": {
                      "description": "What is damaged / repaired (plain words).",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "lifespan_years": {
                      "description": "Lease-annexed grille: theoretical lifespan of the element (overrides the category).",
                      "maximum": 60,
                      "minimum": 1,
                      "type": "number"
                    },
                    "residual_pct": {
                      "description": "Lease-annexed grille: residual share in % (default 0).",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["cost", "item"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "deposit": {
                "description": "Deposit paid at move-in (€).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "edl_outcome": {
                "description": "'identical' when the exit état des lieux matches the entry one (1-month deadline); 'differences' otherwise (2 months).",
                "enum": ["identical", "differences"],
                "type": "string"
              },
              "key_return_date": {
                "description": "Date the keys were handed back (remise des clés), ISO date — the deadline runs from this day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "lease_type": {
                "description": "'vide' unfurnished (deposit cap 1 month) or 'meuble' furnished (cap 2 months). Never presumed: omitted, no cap is computed.",
                "enum": ["vide", "meuble"],
                "type": "string"
              },
              "perspective": {
                "description": "Who is asking — changes only the next_steps wording, never the figures.",
                "enum": ["landlord", "tenant"],
                "type": "string"
              },
              "provision_amount": {
                "description": "Immeuble collectif only: the provision the landlord keeps, € — the landlord's own justified amount, at most 20 % of the deposit. Never assumed: omitted, no provision is deducted and the result only states the maximum.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "provision_justification": {
                "description": "What justifies the provision (e.g. 'arrêté provisoire des comptes du 15/09/2026').",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "rent_hors_charges": {
                "description": "Monthly rent en principal, excluding charges (€).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "restitution_date": {
                "description": "Date the deposit was / will be returned (ISO) — the penalty is computed against it. Omitted, the figures are computed as of today (date in France) and the result says the date was assumed (as_of.assumed).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "tenant_gave_address": {
                "description": "false when the tenant never gave the address of the new home and the delay results from it — the late penalty is then not due (art. 22, al. 7). Defaults to true.",
                "type": "boolean"
              }
            },
            "required": ["deposit", "edl_outcome", "key_return_date", "rent_hors_charges"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4cb5c6091de45656fed6daa75d2563c51e6b6122b9deb61a9f5c17fea8597ae5"
        },
        {
          "name": "calculate_home_employment_end_of_contract",
          "title": "Home employment end of contract — notice, calendar, indemnity (CCN 3239)",
          "description": "End of a home-employment contract in France (particulier employeur ↔ salarié: cleaner, carer, garde d'enfant à domicile, assistant maternel): notice, dates, indemnity, documents, for either party. · Fin de contrat d'emploi à domicile (particulier employeur ↔ salarié, assistant maternel) : préavis, calendrier, indemnité, documents, pour l'employeur comme pour le salarié. — Notice duration by seniority (art. 162.4.1 dismissal / 162.6 resignation / 120 assistant maternel), earliest entretien préalable date (art. 161.1.1.1 — 4th jour ouvrable counted from the day after presentation; the Code du travail dismissal procedure does not apply to the particulier employeur), notice end computed from the FIRST PRESENTATION of the letter, dismissal indemnity (art. 163.1: 1/4 month per year up to 10 years then 1/3, from 8 months, best of the 12- or 3-month average) or assistant-maternel withdrawal indemnity (art. 121.1: 1/80 of gross salaries, from 9 months), rupture conventionnelle windows (blocked for assistants maternels, CASF L.423-2), paid-leave reminder, last CESU/Pajemploi declaration date, the 6-month settlement contest window (it runs from the receipt's signature, CCN art. 69 — only its earliest end is shown), unfitness (no notice, doubled indemnity when occupational, one month from the opinion) and the approval ending, and the end-of-contract documents with who produces and who receives each; retirement (mise à la retraite art. 161.1.2 / 162.5 / 163.2 — indemnity whatever the seniority; départ volontaire art. 63.2.2, its annex-4 indemnity computed on the periods given and PAID BY THE INSURER, not the employer), the paid job-search hours from 40 hours a week only (art. 162.4.2), no paid-leave indemnity for a CESU wage raised by 10 % (art. 140.1.2). With no date given the seniority is taken today (Europe/Paris) and the result says so. Same numbers whichever party calls. Applies the Convention collective IDCC 3239 (verified on Légifrance 2026). Deterministic formulas — no AI, no assessment of any person or motif.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agreed_end_date": {
                "description": "Rupture conventionnelle only: the end date the parties agreed — the minimum indemnity (art. 161.3 → 163.1) is computed with the seniority reached on that day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "am_monthly_gross": {
                "description": "Assistant maternel: monthly gross (mensualisation), EXCLUDING indemnités d'entretien, repas, kilométriques.",
                "minimum": 0,
                "type": "number"
              },
              "am_total_gross_paid": {
                "description": "Assistant maternel: optional total gross salaries paid since the start (art. 121.1 base). Defaults to mensualisation × complete months.",
                "minimum": 0,
                "type": "number"
              },
              "approval_decision": {
                "description": "Approval ending only (assistant maternel): the conseil départemental's decision.",
                "enum": ["suspension", "modification", "retrait"],
                "type": "string"
              },
              "approval_notified_date": {
                "description": "Approval ending only: the day the conseil départemental notified the decision — the contract ends on it (art. 119.3).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "as_of_date": {
                "description": "Seniority reference date when the letter has not been sent yet (planning). Ignored when notification_date is given. Defaults to today (Europe/Paris) when no date at all is given, as on the web calculator and the documents.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "avg_12_months_gross": {
                "description": "Optional — average gross monthly pay over the last 12 months (art. 163.1 reference).",
                "minimum": 0,
                "type": "number"
              },
              "avg_3_months_gross": {
                "description": "Optional — average gross monthly pay over the last 3 months (the more favourable average is used).",
                "minimum": 0,
                "type": "number"
              },
              "avg_60_months_gross": {
                "description": "retirement_departure only: the monthly average of the gross salaries of the last 60 calendar months in the branch (annex 4, art. 4.1 takes the most favourable of the 60-, 12- and 3-month averages). The indemnity is PAID BY THE INSURER, not by the employer (art. 4.2).",
                "minimum": 0,
                "type": "number"
              },
              "cdd_end_date": {
                "description": "contract_type 'cdd' only: the term of the contract with its renewals (the L.1243-2 notice counts on the total length).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "cdd_reason": {
                "description": "contract_type 'cdd' only: the motif (C. trav. art. L.1242-2) — 'seasonal' has no end-of-contract indemnity (L.1243-10, 1°).",
                "enum": ["replacement_absence", "replacement_part_time", "replacement_suspension", "replacement_before_removal", "awaiting_cdi", "temporary_increase", "seasonal"],
                "type": "string"
              },
              "contract_type": {
                "description": "'cdi' (permanent) or 'cdd' (fixed-term). Omitted = the rules of a permanent contract. A CDD ends before its term only in the cases of C. trav. art. L.1243-1 / L.1243-2 (CCN 3239 art. 62): agreement of the parties (no official form, no homologation), faute grave, unfitness (L.1226-4-3 / L.1226-20), the employee's resignation on a CDI hire (notice one day per week of the total length, two weeks at most) — any other ending is answered status 'blocked', code cdd_early_end_not_provided. Judged after its term (cdd_end_date), the relationship still running, the CDD is a CDI (L.1243-11).",
                "enum": ["cdi", "cdd"],
                "type": "string"
              },
              "convocation_date": {
                "description": "Employer termination only: first presentation of the convocation à l'entretien préalable → earliest entretien date (CCN art. 161.1.1.1).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
