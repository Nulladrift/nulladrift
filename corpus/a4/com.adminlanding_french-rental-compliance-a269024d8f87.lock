        {
          "name": "check_zone_tendue",
          "title": "Zone tendue status of a French commune",
          "description": "Is a commune in zone tendue, and which list (reduced tenant notice, or tax only)? · Une commune est-elle en zone tendue, et sur quelle liste (préavis réduit, ou fiscal seulement) ? — Checks whether a French commune is in the 'zone tendue' perimeter and — crucially — WHICH one: the first list (décret n° 2013-392 annex, 1,434 communes, agglomérations >50k) where the tenant's reduced 1-month notice applies, or the wider TLV tax perimeter added in 2023 where ONLY fiscal measures apply (widely mislabelled 'zone tendue' — the reduced notice does NOT apply there). Deterministic dataset lookup on DILA reference data (service-public.fr simulator dataset) — no AI involved. Provide insee_code, or commune (+ code_postal to disambiguate).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code_postal": {
                "description": "5-digit postal code — disambiguates homonym communes.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              },
              "commune": {
                "description": "Commune name, e.g. 'Lyon'. Used when insee_code is not provided.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "insee_code": {
                "description": "INSEE commune code (5 chars, e.g. 75056 for Paris, 2A004 for Ajaccio). Preferred when known — skips name resolution.",
                "pattern": "^[0-9][0-9ABab][0-9]{3}$",
                "type": "string"
              }
            },
