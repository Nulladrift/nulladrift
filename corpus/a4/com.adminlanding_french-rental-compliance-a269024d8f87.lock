        {
          "name": "compare_family_allowances",
          "title": "Family allowances — Swiss vs French (frontalier)",
          "description": "Family allowances: Swiss vs French for a frontalier. · Allocations familiales : Suisse ou France pour un frontalier. — Compares the family allowances a cross-border worker's household is due under the Swiss canton's rules (BSV 2026 table, LAFam art. 3 age limits; paid monthly with the salary) vs the French CAF (F13213 amounts, modulated by the household's N-2 resources band), and the EU 883/2004 art. 68 differential when the other parent has an activity or an assimilated situation in France. Deterministic official tables — no AI. Returns Swiss monthly + annual (CHF), CAF monthly (EUR), the differential, per-child detail, the notes and the data year.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "caf_income_band": {
                "description": "The household's CAF resources band (revenu net catégoriel of year N-2; service-public F13213): full rate, half or quarter. Omitted → full rate, and the result says so.",
                "enum": ["full", "half", "quarter"],
                "type": "string"
              },
              "canton": {
                "description": "Swiss canton of work — two-letter code, any of the 26 cantons.",
                "enum": ["AG", "AI", "AR", "BE", "BL", "BS", "FR", "GE", "GL", "GR", "JU", "LU", "NE", "NW", "OW", "SG", "SH", "SO", "SZ", "TG", "TI", "UR", "VD", "VS", "ZG", "ZH"],
                "type": "string"
              },
              "children": {
                "description": "The children (at least one).",
                "items": {
                  "properties": {
                    "age": {
                      "description": "Child's completed age.",
                      "maximum": 30,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "in_training": {
                      "description": "In post-compulsory training (training allowance from 15 at the earliest, until 25 at the latest — LAFam art. 3), or still at school after 16.",
                      "type": "boolean"
                    },
                    "incapable": {
                      "description": "Unable to exercise a gainful activity (art. 7 LPGA): child allowance until 20.",
                      "type": "boolean"
                    }
                  },
                  "required": ["age"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "spouse_works_in_france": {
                "description": "Does the OTHER parent have an activity in France (employed or self-employed) or an assimilated situation there (French unemployment, sickness or maternity benefits, paid leave, parental leave treated as activity — Decision F1)? Yes → the CAF pays first and Switzerland pays the difference (Reg. 883/2004 art. 68).",
                "type": "boolean"
              }
            },
            "required": ["canton", "children"],
            "type": "object"
          },
          "annotations": {
