        },
        {
          "name": "compare_lamal_cmu",
          "title": "Frontalier health cover — LAMal vs CMU",
          "description": "Frontalier health cover: LAMal (CH) vs CMU/PUMa (FR). · Couverture santé frontalier : LAMal (CH) ou CMU (FR). — Estimates the monthly cost of the two health-insurance options a France–Switzerland cross-border worker chooses between (droit d'option): Swiss LAMal (in CHF) vs the French contribution (in EUR, 8 % of the worker's OWN income of year N-2 above 25 % of the PASS — CSS art. L. 380-3-1 IV and D. 380-2). Give income_n2_eur (own net income as declared); without it the French figure is an UPPER estimate from the gross salary, flagged as such. Dependants are priced by age band (0-18 child, 19-25 young adult, 26+ adult). Deterministic official premium/rate tables — no AI. Returns both monthly figures, the rules of the option (window, reception by the Swiss authority, default, who has it) and how to transmit the form. Recommends neither system.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age": {
                "description": "Worker's age.",
                "maximum": 80,
                "minimum": 16,
                "type": "integer"
              },
              "canton": {
                "description": "Swiss canton of work — two-letter code, any of the 26 cantons.",
                "enum": ["AG", "AI", "AR", "BE", "BL", "BS", "FR", "GE", "GL", "GR", "JU", "LU", "NE", "NW", "OW", "SG", "SH", "SO", "SZ", "TG", "TI", "UR", "VD", "VS", "ZG", "ZH"],
                "type": "string"
              },
              "children_ages": {
                "description": "Ages of dependants (optional) — priced by band (≤18 / 19-25 / 26+).",
                "items": {
                  "maximum": 30,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "income_n2_eur": {
                "description": "The worker's OWN income of year N-2 in EUR, net, as declared (salaries + other own income; half of income held in common) — the base of the French contribution (CSS D. 380-2). Not the household revenu fiscal de référence.",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "salary_chf": {
                "description": "Annual gross Swiss salary in CHF — used only when income_n2_eur is missing, and then the French figure is an upper estimate.",
                "maximum": 2000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["age", "canton"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
