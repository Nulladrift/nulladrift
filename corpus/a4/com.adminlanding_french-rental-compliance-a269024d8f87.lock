        },
        {
          "name": "generate_rent_receipt",
          "title": "Generate a French rent receipt (quittance de loyer) PDF — free, no account",
          "description": "FREE — no account needed. · GRATUIT, sans compte : quittance de loyer en PDF. — Rent receipt (quittance de loyer, loi n° 89-462 art. 21) PDF from the data you give: landlord, tenant, property address, period, rent and charges, payment date. Deterministic template engine — a fixed legal template filled with the given data, not AI-generated content. The document is issued in FRENCH (required for legal validity); includeEnglish appends a non-binding English reference translation. Nothing is stored: the PDF is available for 24 hours through a single-use link, then deleted — no account, no property, no history. Per-network caps apply (a structured rate_limited result says when to retry). Have the landlord verify every field before sending it to the tenant. BLANK MENTIONS: what is not given is printed blank, never invented. Before the document is produced, the tool answers needs_input with blank_mentions — the mentions that would be blank, as printed: show the landlord the list and complete them, or pass acknowledge_incomplete: true once the landlord has chosen to leave them blank. A generated document returns printed_blank, the mentions to complete by hand. With an AdminLanding account the same receipt is pre-filled from your saved properties, the tenant is stamped from the record so their name never passes through the assistant, receipts are kept in your history and shared through the tenant portal, and leases can be sent for e-signature — €4.90 — one document for this property (buy in the web app), or Membership — €6 a month or €59 a year, renewed automatically, cancel any time from the account: every rental document on up to 10 properties (€1 a month or €10 a year per extra property), plus home employment, cross-border, letters and patrimoine; first property free (10 documents). Payment happens in the browser, never through the agent. General information/document tooling, not legal advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "acknowledge_incomplete": {
                "description": "Set ONLY after the tool has returned status:'needs_input' — with blank_mentions, the mentions the document would print blank — you have shown the landlord that list, and the landlord has explicitly chosen to generate the document with those mentions left blank, to complete them by hand before signing or sending. Never set this on a first call. It never waives a refusal: a missing mandatory input, an unlawful value or an input that would not be printed stays refused.",
                "type": "boolean"
              },
              "chargesAmount": {
                "description": "Charges (provisions/forfait), in euros, as a string ('0' if none).",
                "pattern": "^[0-9]+([.,][0-9]{1,2})?$",
                "type": "string"
              },
              "includeEnglish": {
                "description": "Append a non-binding English reference translation as the last page. The legal document itself stays French.",
                "type": "boolean"
              },
              "issuedAt": {
                "description": "City where the receipt is issued, printed « Fait à … ». Ask the landlord — it is never taken from an address. Omitted, the mention is blank. The date next to it is the day of issue (today, date in France).",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "landlordAddress": {
                "description": "Landlord's address.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "landlordName": {
                "description": "Landlord's full name, or the company's name (bailleur). With an account, a company is designated from the landlord profile — « (société) », SIRET — when this name is the profile's; without one, write the designation here.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "description": "Filename/interface language only — the document is always issued in French (required for validity). Default fr.",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "paymentDate": {
                "description": "Date the landlord RECEIVED the payment (ISO date).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "paymentMethod": {
                "description": "Payment method as the landlord states it (e.g. 'Virement bancaire', 'Chèque'), printed after « Mode de paiement ». NO default: omitted, the mention is blank. Never guess it.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "periodFrom": {
                "description": "Rental period start (ISO date, e.g. 2026-08-01).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "periodTo": {
                "description": "Rental period end (ISO date). The receipt month is derived from this date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "propertyAddress": {
                "description": "Address of the rented dwelling.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "rentAmount": {
                "description": "Rent RECEIVED, excluding charges, in euros, as a string (e.g. '850' or '850.50'). Above 0: a receipt of nothing is refused.",
                "pattern": "^[0-9]+([.,][0-9]{1,2})?$",
                "type": "string"
              },
              "tenantName": {
                "description": "Tenant's full name (locataire) as it must appear on the receipt.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["chargesAmount", "landlordAddress", "landlordName", "paymentDate", "periodFrom", "periodTo", "propertyAddress", "rentAmount", "tenantName"],
            "type": "object"
          },
