{
  "lockfileVersion": 2,
  "subjects": {
    "com.audiscape.agentguard/agentguard": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentguard.audiscape.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "AgentGuard",
        "version": "3.0.0",
        "description": "Loop and budget guard for AI agents. Call guard_check_session before each tool call."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call guard_check_session before every tool call. Smallest call: {\"next\":{\"tool\":\"<tool name>\"}}. Add calls (the tool calls so far) to catch loops and budget overruns. Free, no account, read-only, arguments are not stored.",
      "tools": [
        {
          "name": "audit_domain",
          "description": "Run a live HTTP audit against a public domain and return score, grade and report URL.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Target domain, e.g. cursor.com",
                "type": "string"
              },
              "mode": {
                "enum": ["citerank", "checkoutguard", "agentguard", "signalstrike"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f0150a966353f2a581912f8f60d8cb7123ffd442e3e36fc3f02d412db3696e5"
        },
        {
          "name": "create_checkout_session",
          "description": "Return a Stripe checkout link for the remediation pack for a domain.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              },
              "mode": {
                "enum": ["citerank", "checkoutguard", "agentguard", "signalstrike"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4d01a5baa9485015e6ed93294eb831616009185358b690515dfe112b40a131aa"
        },
        {
          "name": "get_remediation_preview",
          "description": "Return the remediation preview and scorecard URL for a domain.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9623ca2a80da28f1f9a9a4e91f6a112cb5ce488be4b95604d69a4d4213afa825"
        },
        {
          "name": "guard_check_session",
          "title": "Loop and budget guard",
          "description": "Call before each tool call your agent makes. Send the calls so far and the one you are about to make, get back allowed true or false with the reason. Catches identical and near-repeat loops (same file, URL or command), re-reads of finished items, failing-tool retry streaks and USD or token caps before spend. Free, no account, arguments are not stored, nothing is executed. Smallest valid call: {\"calls\":[],\"next\":{\"tool\":\"bash\"}}",
          "inputSchema": {
            "examples": [
              {
                "calls": [],
                "next": {
                  "tool": "bash"
                }
              }
            ],
            "properties": {
              "calls": {
                "items": {
                  "properties": {
                    "arguments": {},
                    "costUsd": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "errorText": {
                      "description": "Error message when isError; permanent errors (missing binary, 4xx, quota, permission) halt after 1 retry",
                      "type": "string"
                    },
                    "isError": {
                      "type": "boolean"
                    },
                    "readOnly": {
                      "description": "Call had no side effects; lets the opt-in completed-read rule apply",
                      "type": "boolean"
                    },
                    "resultHash": {
                      "description": "Stable hash of the tool result; repeats with the same hash count as no progress",
                      "type": "string"
                    },
                    "tokens": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "tool": {
                      "type": "string"
                    },
                    "totalCostUsd": {
                      "description": "Running session spend so far; spend becomes max(spend, total)",
                      "minimum": 0,
                      "type": "number"
                    },
                    "totalTokens": {
                      "description": "Running session tokens so far",
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["tool"],
                  "type": "object"
                },
                "maxItems": 20000,
                "type": "array"
              },
              "config": {
                "description": "Optional agentguard.json contents",
                "type": "object"
              },
              "next": {
                "properties": {
                  "arguments": {},
                  "tool": {
                    "type": "string"
                  }
                },
                "required": ["tool"],
                "type": "object"
              }
            },
            "required": ["next"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Loop and budget guard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:528cdb66ab8fb785250fcc164828ff82d768e1b1c2a4a197f7d7b68b633215de"
        }
      ],
      "digest": "sha256:79580ca55ddb95ba0caad4b85c8f998592ab8391a81a0b70a42e36af33c9fdcc"
    }
  }
}
