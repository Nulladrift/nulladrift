              },
              "quantity": {
                "description": "Estimated order size per style and colour",
                "enum": ["50–100 pcs", "100–300 pcs", "300–1,000 pcs", "1,000+ pcs"],
                "type": "string"
              }
            },
            "required": ["confirmation_token", "email", "message", "name", "quantity"],
            "type": "object"
          },
