          },
          "digest": "sha256:5b00c3c62cd648439184d540628fe940f1e5f36299bd8e5a401824041795d0b7"
        },
        {
          "name": "preview_inquiry",
          "title": "Preview a quote inquiry",
          "description": "Step 1 of 2. Checks a quote request for HLN Apparel and returns a summary plus a confirmation_token. Sends nothing. Show the summary to the buyer and ask them to confirm before calling submit_inquiry. Only use details the buyer actually gave; ask for missing name, email, quantity or requirements instead of guessing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "attachment_urls": {
                "description": "Up to 3 https links to the buyer’s files (tech pack, sketch, reference photo): the download URL of a file the buyer uploaded in this chat, or a public share link. PDF, Word, Excel, JPG, PNG or WebP, 10 MB each.",
                "items": {
                  "format": "uri",
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "company": {
                "description": "Company or brand name",
                "maxLength": 160,
                "type": "string"
              },
              "country": {
                "description": "Country the goods ship to",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "description": "Buyer's real email address. The sales team replies here, and a receipt is sent to it.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language for the receipt email: en, es or fr",
                "enum": ["en", "es", "fr"],
                "type": "string"
              },
              "message": {
                "description": "What the buyer needs: styles, fabric, GSM, colours, decoration, sizes, target date, target price. Write it in the buyer’s words; do not invent requirements.",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Buyer's full name",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Phone or WhatsApp number, with country code",
                "maxLength": 80,
                "type": "string"
              },
              "product_interest": {
                "description": "Product type, e.g. \"heavyweight hoodies\" or \"yoga leggings\"",
                "maxLength": 160,
                "type": "string"
              },
              "quantity": {
                "description": "Estimated order size per style and colour",
                "enum": ["50–100 pcs", "100–300 pcs", "300–1,000 pcs", "1,000+ pcs"],
                "type": "string"
              }
            },
            "required": ["email", "message", "name", "quantity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
