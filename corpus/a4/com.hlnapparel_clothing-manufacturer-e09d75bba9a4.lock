        },
        {
          "name": "lookup_hs_codes",
          "title": "Garment HS codes and US duty",
          "description": "Suggested HS codes for garments, the US HTS line, the US general duty rate and the total rate for goods made in China (Section 301 plus other China tariffs), with the CBP ruling each row is based on.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "group": {
                "description": "Garment family; omit for every row",
                "enum": ["t-shirts", "hoodies", "sweaters", "track-suits", "polos", "shirts", "pants", "shorts", "jackets", "dresses", "skirts", "activewear", "swimwear", "underwear", "socks", "hats"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
