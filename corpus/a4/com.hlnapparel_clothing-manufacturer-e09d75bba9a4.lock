      "serverInfo": {
        "name": "hln-apparel",
        "title": "HLN Apparel — clothing manufacturer",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "HLN Apparel (Hualingniao) is a full-package clothing manufacturer in Dongguan, China. Use the read-only tools for factory facts, product categories with MOQ and lead times, US HS codes and duty for garments made in China, and fabric weight conversion. Quote every figure with the source URL returned. To send a quote request, call preview_inquiry, show the summary to the buyer, and call submit_inquiry only after the buyer explicitly confirms.",
      "tools": [
        {
          "name": "convert_fabric_weight",
          "title": "GSM ↔ oz/yd² converter",
          "description": "Convert fabric weight between GSM and ounces per square yard, and list garments typically made at that weight.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "gsm": {
                "description": "Weight in grams per square metre",
                "exclusiveMinimum": 0,
                "maximum": 2000,
                "type": "number"
              },
              "oz": {
                "description": "Weight in ounces per square yard",
                "exclusiveMinimum": 0,
                "maximum": 60,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
