          "digest": "sha256:1fb35ac15e80272a911c442fb26c33934c5b67deafeac5e5f2f4a6bd98223238"
        },
        {
          "name": "submit_inquiry",
          "title": "Send a quote inquiry",
          "description": "Step 2 of 2. Sends the confirmed quote request to the HLN sales team and emails the buyer a receipt. Call it only after the buyer explicitly confirmed the preview_inquiry summary, with exactly the same fields and its confirmation_token. Attachment links are downloaded and stored privately.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "attachment_urls": {
                "description": "Up to 3 https links to the buyer’s files (tech pack, sketch, reference photo): the download URL of a file the buyer uploaded in this chat, or a public share link. PDF, Word, Excel, JPG, PNG or WebP, 10 MB each.",
                "items": {
                  "format": "uri",
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "company": {
                "description": "Company or brand name",
                "maxLength": 160,
                "type": "string"
              },
              "confirmation_token": {
                "description": "The confirmation_token preview_inquiry returned",
                "maxLength": 200,
                "minLength": 10,
                "type": "string"
              },
              "country": {
                "description": "Country the goods ship to",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "description": "Buyer's real email address. The sales team replies here, and a receipt is sent to it.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language for the receipt email: en, es or fr",
                "enum": ["en", "es", "fr"],
                "type": "string"
              },
              "message": {
                "description": "What the buyer needs: styles, fabric, GSM, colours, decoration, sizes, target date, target price. Write it in the buyer’s words; do not invent requirements.",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Buyer's full name",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Phone or WhatsApp number, with country code",
                "maxLength": 80,
