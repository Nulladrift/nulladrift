        },
        {
          "name": "get_factory_overview",
          "title": "Factory overview",
          "description": "Who HLN Apparel is: founding year, quality standard, audits, shipping terms, scale and key page links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "default": "en",
                "description": "Answer language: en, es or fr",
                "enum": ["en", "es", "fr"],
