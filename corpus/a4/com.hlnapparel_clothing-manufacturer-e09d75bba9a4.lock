        },
        {
          "name": "list_product_categories",
          "title": "Product categories",
          "description": "Garment categories HLN makes, each with typical fabrics, GSM range, MOQ, sample time, bulk lead time, size range, customisation options and the category page URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "default": "en",
                "description": "Answer language: en, es or fr",
                "enum": ["en", "es", "fr"],
