        },
        {
          "name": "get_emora_overview",
          "title": "Get an overview of Emora",
          "description": "[Step 1 of explore_information · optional]\n\nDescribes Emora Health: services, states served, insurance accepted, ages seen, how care works, and how to reach the care team.\n\nUse when: A parent asks what Emora is, what it offers, where it works, or which plans it takes.\n\nExample: get_emora_overview({})",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
