          },
          "digest": "sha256:f8056cd12535c3cd96adf1e91181d73c7ac2d1b37f5f619432b8005b8645281b"
        },
        {
          "name": "recommend_care",
          "title": "Recommend care for a concern",
          "description": "[Step 1 of find_a_clinician · optional]\n\nTakes a parent's concern and returns a recommended path: crisis resources when there is danger, the service that fits (therapy, medication, ADHD or autism testing, or a clinical matching session), matched clinicians with their next opening, and related care resources. Says so when the family's state is not one Emora serves.\n\nUse when: A parent has described a concern and the next step (crisis help, a clinician, reading, or all three) is not yet clear.\n\nDon't use when: A clinician is already chosen: get_availability and get_booking_link cover the rest.\n\nExample: recommend_care({ concern: \"Teacher thinks my 9-year-old may have ADHD\", state: \"Texas\", age: 9, insurance: \"Aetna\" })",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "age": {
                "description": "Child's age in years.",
                "type": "number"
              },
              "concern": {
                "description": "What the parent is worried about, in their words.",
                "type": "string"
              },
              "insurance": {
                "description": "Insurance plan name, or \"Cash Pay\" for self-pay. A plan Emora does not take is ignored, and the result says so.",
                "type": "string"
              },
              "service": {
                "description": "Optional; inferred from the concern when omitted. therapy, clinical-matching, medication, adhd-testing or autism-testing.",
                "enum": ["therapy", "clinical-matching", "medication", "adhd-testing", "autism-testing"],
                "type": "string"
              },
              "state": {
                "description": "U.S. state, full name or 2-letter code. For a state Emora does not serve, the result says so and lists alternatives.",
                "type": "string"
              }
            },
            "required": ["concern"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bc4b9ec2a9060f3ab6c5ccb601531b0e64f2790c0b6a84cf6c45b7aff5c71760"
        },
        {
          "name": "search_care_resources",
          "title": "Search care resources",
          "description": "[Step 2 of explore_information]\n\nSearches Emora's clinician-reviewed resources for parents by words: articles on behavior, conditions, treatment and medication, free self-tests, activities, condition and specialty pages, and clinical insights. Each result has a type, title, description and URL to cite.\n\nUse when: A parent wants to understand something (a behavior, a condition, a treatment, a medication question) or asks for a test, worksheet or activity.\n\nDon't use when: The parent wants a clinician: search_providers or recommend_care.\n\nExample: search_care_resources({ query: 'social anxiety test for teens' })",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Results to return (default 10, max 20).",
                "type": "number"
              },
              "query": {
                "description": "The parent's question or topic, in their words.",
                "type": "string"
              },
              "type": {
                "description": "Optional. Only this kind of resource.",
                "enum": ["article", "self_test", "activity", "condition", "specialty", "clinical_insight"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:41e8953204172387e37cd0b46445df6e9bce7dafe313bd67c4fc3e9692633f39"
        },
        {
          "name": "search_providers",
          "title": "Search Emora clinicians",
          "description": "[Step 2 of find_a_clinician]\n\nReturns Emora clinicians who fit a state, service, insurance and child's age, ranked by clinical fit when concerns are given, then by availability and reviews. Each result has the clinician's next opening. Ten per page; limit and offset page through the rest.\n\nUse when: A family wants to see clinicians: therapists, psychiatric prescribers, psychologists for testing, or intake specialists (service clinical-matching).\n\nDon't use when: The family hasn't said what they're worried about yet: recommend_care orients first.\n\nExample: search_providers({ state: 'Florida', service: 'therapy', concerns: ['social-anxiety'], insurance: 'Aetna', client_age: 12 })",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "client_age": {
                "description": "Child's age in years.",
                "type": "number"
              },
              "concerns": {
                "description": "One to three concern IDs from the list. More than three dilutes the ranking.",
                "items": {
                  "enum": ["parenting-stress", "sep-anxiety", "gad", "social-anxiety", "specific-phobia", "panic-attacks", "depression", "bipolar", "irritability", "grief", "adhd", "odd", "conduct", "impulsivity", "autism", "speech-delay", "motor-delay", "learning-disability", "sleep-disorder", "peer-issues", "life-transitions", "family-changes", "relocation", "social-stress", "relationship-issues", "build-confidence", "grow-faith", "mindfulness", "personal-values", "resilience", "self-compassion", "unsure", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "continuation": {
                "description": "Token from a previous search_providers result. Repeats its filters; new arguments take precedence.",
                "type": "string"
              },
              "insurance": {
                "description": "Insurance plan name, or \"Cash Pay\" for self-pay. A plan Emora does not take is ignored, and the result says so.",
                "type": "string"
              },
              "limit": {
                "description": "Matches to return. Defaults to 10, with no maximum.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "offset": {
                "description": "Matches to skip. next_offset from a previous result gives the next page.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "preferred_approaches": {
                "description": "Therapy approaches, e.g. [\"cbt\",\"playTherapy\"]. Clinicians who use them rank higher.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "preferred_gender": {
                "description": "Clinician gender preference: 'female', 'male' or 'non-binary'.",
                "type": "string"
              },
              "preferred_language": {
                "description": "A language other than English the clinician should speak.",
                "type": "string"
              },
              "service": {
                "description": "therapy (the default), clinical-matching (unsure what is needed), medication (non-stimulant only), adhd-testing or autism-testing.",
                "enum": ["therapy", "clinical-matching", "medication", "adhd-testing", "autism-testing"],
                "type": "string"
              },
              "state": {
                "description": "U.S. state, full name or 2-letter code. For a state Emora does not serve, the result says so and lists alternatives.",
                "type": "string"
              }
            },
            "required": ["service", "state"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
