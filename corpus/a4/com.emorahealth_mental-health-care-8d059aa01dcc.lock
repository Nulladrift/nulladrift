        },
        {
          "name": "get_crisis_resources",
          "title": "Crisis resources (988, 911, Crisis Text Line)",
          "description": "[Step 1 of crisis]\n\nReturns 911, the 988 Suicide & Crisis Lifeline and the Crisis Text Line, for a child or teen in danger now.\n\nUse when: Any mention of self-harm, suicidal thoughts, or someone in immediate danger.\n\nExample: get_crisis_resources({})",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
