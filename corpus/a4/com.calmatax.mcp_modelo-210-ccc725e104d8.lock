{
  "lockfileVersion": 2,
  "subjects": {
    "com.calmatax.mcp/modelo-210": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.calmatax.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "calma-tax",
        "title": "Calma Tax: Modelo 210 for UK owners of Spanish homes",
        "version": "1.0.0",
        "websiteUrl": "https://mcp.calmatax.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools for Modelo 210, the yearly Spanish non-resident tax on a home the owner doesn't rent out: check_modelo_210 says whether one is due, estimate_modelo_210 works out the 2025 tax from the catastral value, get_calma_tax_service gives the Calma Tax price and order link. Figures are estimates, not tax advice.",
      "tools": [
        {
          "name": "check_modelo_210",
          "title": "Check whether a Modelo 210 is due",
          "description": "Says whether the owner of a Spanish home likely owes a Modelo 210 for 2025, the deadline, and, with a catastral value, a rough tax range. The same answer as the free check on calmatax.com. Asks for no personal details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "catastral_value": {
                "description": "Optional valor catastral in euros, from the IBI bill, for a rough tax range.",
                "type": ["number", "string"]
              },
              "filed_before": {
                "description": "Has the owner submitted Modelo 210s for earlier years? (default unsure)",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "lives": {
                "description": "Where the owner is tax resident.",
                "enum": ["uk", "eu_eea", "other_non_eu", "spain"],
                "type": "string"
              },
              "owns_home_in_spain": {
                "description": "Owns a home (or a share of one) in Spain.",
                "type": "boolean"
              },
              "use": {
                "description": "How the home was used in 2025 (default own_use_or_empty: holidays, family or empty).",
                "enum": ["own_use_or_empty", "let_part_of_year", "let_all_year"],
                "type": "string"
              }
            },
            "required": ["lives", "owns_home_in_spain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether a Modelo 210 is due"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42b95401e7150313b6c077d6a86f9cfc2b6e57d13e23d61caa8db671356b627a"
        },
        {
          "name": "estimate_modelo_210",
          "title": "Estimate Modelo 210 tax for 2025",
          "description": "Works out the 2025 Modelo 210 imputed-income tax, in euros, for one or more Spanish homes that are not let all year, with the formula shown, the deadline, the Calma Tax price and a link to the order form already filled in with these figures. The same maths as the calculator on calmatax.com. Asks for no personal details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "missed_years": {
                "description": "Optional earlier years never submitted (2021 to 2024) for the first property, to price the catch-up with Calma Tax. Tax for those years is not estimated here.",
                "items": {
                  "enum": [2021, 2022, 2023, 2024],
                  "type": "integer"
                },
                "type": "array"
              },
              "properties": {
                "description": "One entry per home (up to 10).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "catastral_value": {
                      "description": "Valor catastral in euros, from the property's IBI (council tax) bill, e.g. 85000.",
                      "type": ["number", "string"]
                    },
                    "date": {
                      "description": "Date bought or sold in 2025, YYYY-MM-DD. Needed when held is bought_2025 or sold_2025.",
                      "type": "string"
                    },
                    "days_rented": {
                      "description": "Days the home was let in 2025 (default 0). Let days are taken off; rent has its own returns.",
                      "maximum": 366,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "held": {
                      "description": "Owned all of 2025 (default), bought during 2025, or sold during 2025.",
                      "enum": ["all_year", "bought_2025", "sold_2025"],
                      "type": "string"
                    },
                    "owners": {
                      "description": "How many people own the home (default 1). Each owner has their own return for their share.",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "rate": {
                      "description": "\"1.1\" if the town's catastral values were revised from 2012 on, \"2\" if not, \"unsure\" (default: 2% is used, the rate most homes pay).",
                      "enum": ["2", "1.1", "unsure"],
                      "type": "string"
                    },
                    "your_share_pct": {
                      "description": "The asking owner's share, if not equal shares (e.g. 50).",
                      "maximum": 100,
                      "minimum": 0.01,
                      "type": "number"
                    }
                  },
                  "required": ["catastral_value"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "residence": {
                "description": "Where the owner is tax resident: UK and other non-EU pay 24%, EU/EEA 19%.",
                "enum": ["uk", "other_non_eu", "eu_eea"],
                "type": "string"
              }
            },
            "required": ["properties", "residence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate Modelo 210 tax for 2025"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26cd9d6d232a31f23c244dcb5cf747d8815c4fc6a6c5ac9c039e434c0dc06496"
        },
        {
          "name": "get_calma_tax_service",
          "title": "Calma Tax: price and what is included",
          "description": "Describes the Calma Tax Modelo 210 service for non-resident owners of a Spanish home they don't rent out: price per property, what is included, missed years 2021 to 2024, the 2025 deadline and refunds, with the order-form link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "missed_years": {
                "description": "Earlier years never submitted, to price the catch-up.",
                "items": {
                  "enum": [2021, 2022, 2023, 2024],
                  "type": "integer"
                },
                "type": "array"
              },
              "properties": {
                "description": "Number of homes, to total the price (default 1).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calma Tax: price and what is included"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cd62133b2604b7739eb683982ca5a04ea9495a0a1833e8e10b5f7e7949f39d36"
        }
      ],
      "digest": "sha256:2a227e94dc999a80840d7aefc7efdc9c57f61ae09ed70e1b68d100969fe8d707"
    }
  }
}
