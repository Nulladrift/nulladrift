        "name": "Bushdrum Events",
        "version": "1.26.0",
        "websiteUrl": "https://bushdrum.com/developers"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bushdrum MCP is a small, read-only, city-scoped event search interface. Call list_cities first to discover supported public cities. Then call search_events with an explicit city slug and optional filters. Results are structured JSON, default to 10 items, and are capped at 20 items. Data is sourced from bushdrum.com — please credit Bushdrum when displaying results.",
      "tools": [
        {
          "name": "list_cities",
          "description": "List public Bushdrum cities with event and venue coverage.",
          "inputSchema": {
            "properties": {},
            "title": "list_citiesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "list_citiesDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:42b7c0f744ca3d6c9c03171c334c7d9f16463e294638aa63a716050c04f31cd3"
        },
        {
          "name": "search_events",
          "description": "Search events inside one Bushdrum city.\n\n    Args:\n        city: Required Bushdrum city slug such as zurich or berlin.\n        limit: Number of results to return. Defaults to 10 and is capped at 20.\n        q: Plain search query for titles, venue names, and summaries.\n        category: One or more event categories.\n        subcategory: One subcategory value.\n        vibe: One or more vibe filters.\n        audience: One or more audience filters.\n        neighborhood: Neighborhood filter scoped to the chosen city.\n        date_from: Start date in YYYY-MM-DD format.\n        date_to: End date in YYYY-MM-DD format.\n        is_free: Only return free events when true.\n        price_max: Maximum ticket price.\n        indoor_outdoor: indoor, outdoor, or both.\n        event_language: Event language code such as de or en.\n        tags: One or more tag filters.\n        time_from: Start time filter in HH:MM format.\n        time_to: End time filter in HH:MM format.\n        age_max: Maximum age suitability filter.\n    ",
          "inputSchema": {
            "properties": {
              "age_max": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Age Max"
              },
              "audience": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Audience"
              },
              "category": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Category"
              },
              "city": {
                "title": "City",
                "type": "string"
              },
              "date_from": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Date From"
              },
              "date_to": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Date To"
              },
              "event_language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Event Language"
              },
              "indoor_outdoor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Indoor Outdoor"
              },
              "is_free": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Is Free"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "neighborhood": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Neighborhood"
              },
              "price_max": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Price Max"
              },
              "q": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Q"
              },
              "subcategory": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Subcategory"
              },
              "tags": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Tags"
              },
              "time_from": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Time From"
              },
              "time_to": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Time To"
              },
              "vibe": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Vibe"
              }
            },
            "required": ["city"],
            "title": "search_eventsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "search_eventsDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2430d3afe719f7a6bab32c7025d64ee16e8b116a49ed92e7ff62c4b56aca92e"
