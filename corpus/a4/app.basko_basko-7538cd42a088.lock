      "instructions": "Basko's price database for groceries, pharmacy and household products, and electronics in Uzbekistan (UZ), Kazakhstan (KZ), Russia (RU), the United States (US) and the United Kingdom (GB). Every tool needs country; lang (en, ru, uz, uz-Cyrl, kk, …) sets the language of texts and amounts. Prices are those Basko last read from stores' sites, shoppers' receipts and price tags, ordered by price only. Product ids come from search_products. Store links in results go through basko.app, which may earn a commission on them.",
      "tools": [
        {
          "name": "compare_basket",
          "title": "Compare a shopping list across stores",
          "description": "Prices a shopping list at every store in the country: each store's total for the items it sells (with its delivery fee where the store publishes one), the cheapest single store, and the cheapest way to split the list between stores. Items are matched to products by their names, or exactly by productId.",
