        {
          "name": "get_product",
          "title": "Get a product's prices and history",
          "description": "Returns one product's current price at every store in the country that sells it (cheapest first, with delivery and where each price comes from), its lowest price day by day over the last 3 months, and a deal score that compares today's price with its usual price. Product ids come from search_products, get_deals and compare_basket.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country whose stores to read: UZ (Uzbekistan), KZ (Kazakhstan), RU (Russia), US (United States), GB or UK (United Kingdom).",
                "enum": ["UZ", "KZ", "RU", "US", "GB", "UK"],
                "type": "string"
              },
              "lang": {
                "description": "Language of texts and amounts in the answer, as a BCP 47 tag (en, ru, uz, uz-Cyrl, kk, es, …). Default: the assistant's locale, else the country's main language.",
                "maxLength": 20,
                "type": "string"
              },
              "productId": {
                "description": "The product's id.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country", "productId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "type": "string"
              },
              "category": {
                "type": "string"
              },
