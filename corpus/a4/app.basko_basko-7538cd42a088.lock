        {
          "name": "find_stores",
          "title": "Find stores and branches",
          "description": "Lists the stores Basko covers in a country: their kind, whether their prices are compared now, where the prices come from, delivery fees and links to their sites. With latitude and longitude, also each store's nearest branches with the distance and opening hours (branches are known in Uzbekistan).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "branches": {
                "default": 3,
                "description": "How many nearest branches per store (1 to 10, default 3).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "category": {
                "description": "Only stores of this kind.",
                "enum": ["grocery", "pharmacy", "electronics", "marketplace"],
                "type": "string"
              },
              "country": {
                "description": "The country whose stores to read: UZ (Uzbekistan), KZ (Kazakhstan), RU (Russia), US (United States), GB or UK (United Kingdom).",
                "enum": ["UZ", "KZ", "RU", "US", "GB", "UK"],
                "type": "string"
              },
              "lang": {
                "description": "Language of texts and amounts in the answer, as a BCP 47 tag (en, ru, uz, uz-Cyrl, kk, es, …). Default: the assistant's locale, else the country's main language.",
                "maxLength": 20,
                "type": "string"
              },
              "latitude": {
                "description": "Where to look for branches near (with longitude).",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Where to look for branches near (with latitude).",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "store": {
                "description": "Only this store. Store ids come from find_stores (korzinka, walmart-us, tesco-uk, …).",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "description": "the credit the branch data asks for",
