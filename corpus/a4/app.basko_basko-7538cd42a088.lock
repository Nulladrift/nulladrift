            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country whose stores to read: UZ (Uzbekistan), KZ (Kazakhstan), RU (Russia), US (United States), GB or UK (United Kingdom).",
                "enum": ["UZ", "KZ", "RU", "US", "GB", "UK"],
                "type": "string"
              },
              "items": {
                "description": "The shopping list (1 to 60 items).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "description": "The item as a shopper writes it (\"milk 1 l\", \"eggs\", \"paracetamol 500 mg\").",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "productId": {
                      "description": "A product id from search_products, to compare exactly that product.",
                      "maxLength": 100,
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "description": "How many.",
                      "maximum": 99,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "description": "Language of texts and amounts in the answer, as a BCP 47 tag (en, ru, uz, uz-Cyrl, kk, es, …). Default: the assistant's locale, else the country's main language.",
                "maxLength": 20,
                "type": "string"
              },
              "stores": {
                "description": "Only these stores (ids from find_stores). Default: every store whose prices are compared.",
                "items": {
                  "description": "A store. Store ids come from find_stores (korzinka, walmart-us, tesco-uk, …).",
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["country", "items"],
            "type": "object"
