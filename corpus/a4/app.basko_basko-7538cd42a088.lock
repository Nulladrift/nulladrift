          "description": "Searches Basko's price database for products sold by stores in one country and returns, for each product, its listings ordered by price (cheapest in-stock first), the number of stores selling it, the size and price per kilogram, litre or piece when known, and links to the listings. Use it to find what a product costs or which store sells it for less. Results are ordered by how well they match the words.",
