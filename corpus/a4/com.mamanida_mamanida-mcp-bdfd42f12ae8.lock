{
  "lockfileVersion": 2,
  "subjects": {
    "com.mamanida/mamanida-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mamanida.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mamanida-mcp",
        "title": "Mamanida Maternity Catalogue",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Mamanida is an independent comparison site for maternity and nursing clothing. Every tool needs an explicit `storefront` id: 'int' (English/USD), 'se' (Swedish/SEK), 'dk' (Danish/DKK), 'no' (Norwegian/NOK), 'fi' (Finnish/EUR), 'de', 'fr', 'nl', 'es' (EUR), 'us' (English/USD). Prices, availability and buying options differ per storefront, so never reuse a result from one storefront for another. `price.retailer_authoritative` is the retailer's own listed amount and the only authoritative figure; `price.local_display` may be an approximate currency conversion, flagged with `approximate: true` and basis 'approximate' — present it as an estimate, not a quote. When an item is on sale, `price.original_retailer_authoritative` and `price.original_local_display` carry the retailer's own original ('compare at') price with the same native/approximate rules; use them verbatim and never reconstruct an original price from `discount_percent`. When those two fields are absent, no authoritative original price exists — say so rather than estimating one. `availability` is IN_STOCK, OUT_OF_STOCK or UNKNOWN; UNKNOWN means the retailer publishes no variant stock data, so never claim it is in stock. `commercial.state` is AFFILIATE (Mamanida may earn a commission — disclose that), DIRECT (no commission) or BLOCKED (no verified retailer destination for that storefront, so the product cannot be bought there). Retailer and affiliate URLs are never returned: send users to the `url` field, the canonical Mamanida product page, which carries the disclosure. Call `get_guides` for Mamanida's editorial buying guides: without `guide` it lists the published guides for that storefront, with `guide` it returns one localized edition whose `category_cta` blocks hand a canonical `category_slug` straight to `search_products`. Call `list_categories` before filtering by category: `category` must be a canonical slug from that tool, and an unknown category returns an error listing the valid slugs rather than an empty result.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Compare 2-10 Mamanida products on one storefront. Each product is returned with the same public contract as get_product (localized details, availability, retailer-authoritative and displayed prices, AFFILIATE / DIRECT / BLOCKED commercial state and its canonical Mamanida URL), so prices and availability are directly comparable within that storefront.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slugs": {
                "description": "Between 2 and 10 product slugs.",
                "items": {
                  "maxLength": 160,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "storefront": {
                "description": "Required storefront id, e.g. 'int', 'se', 'dk', 'no', 'fi', 'us'.",
                "enum": ["int", "us", "se", "dk", "fi", "no", "fr", "de", "nl", "es"],
                "type": "string"
              }
            },
            "required": ["slugs", "storefront"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a3199716c83d0b913b693ad803d5625beef91e3b61a7ade3e5bbba983616dce7"
        },
        {
          "name": "get_guides",
          "title": "List or read Mamanida buying guides",
          "description": "Mamanida's editorial buying guides for one storefront, in that storefront's own language. Called without `guide` it lists the published guides (metadata only: title, deck, meta description, pillar, topics, dates and the canonical Mamanida URL), optionally filtered by `topic`. Called with `guide` (the guide slug from the listing) it returns that one localized edition plus its structured body: paragraphs, headings, lists, comparison tables, callouts, links to other guides and category calls-to-action. A `category_cta` gives a `category_slug` you can pass straight to search_products, which is the intended guide → category → product path. Retailer and affiliate URLs are never returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "guide": {
                "description": "Guide slug as it appears in the Mamanida guide URL. Omit to list guides.",
                "maxLength": 120,
                "type": "string"
              },
              "storefront": {
                "description": "Required storefront id, e.g. 'int' (English), 'se', 'dk', 'no', 'fi', 'us'.",
                "enum": ["int", "us", "se", "dk", "fi", "no", "fr", "de", "nl", "es"],
                "type": "string"
              },
              "topic": {
                "description": "Authoritative topic id, e.g. 'maternity-jeans'. Filters the listing.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["storefront"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:46cf32d080c32a1367a19588520ec8200001d5d8c3bc4fbac0ad108a2876bc95"
        },
        {
          "name": "get_product",
          "title": "Get one product",
          "description": "Fetch full public details for one Mamanida product on a specific storefront: localized summary, fabric and bump-panel facts, sizes, colours, availability (IN_STOCK / OUT_OF_STOCK / UNKNOWN), the retailer's authoritative price plus the storefront's displayed price, and whether the outbound link is AFFILIATE, DIRECT or BLOCKED. Only the canonical Mamanida URL is returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Product slug as it appears in the Mamanida product URL.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "storefront": {
                "description": "Required storefront id, e.g. 'int', 'se', 'dk', 'no', 'fi', 'us'.",
                "enum": ["int", "us", "se", "dk", "fi", "no", "fr", "de", "nl", "es"],
                "type": "string"
              }
            },
            "required": ["slug", "storefront"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5d8ddfdb486345d7cefc4160040b2eca7fe0996f06dfff87e38134eb0f61ad0"
        },
        {
          "name": "list_categories",
          "title": "List product categories for a storefront",
          "description": "List the canonical product categories available on one Mamanida storefront. Each entry gives the exact `slug` to pass to search_products, a label in the storefront's language, any existing localized aliases, and the number of products currently visible on that storefront. Only categories with at least one visible product are returned, and the order is Mamanida's own category order (never product counts).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "storefront": {
                "description": "Required storefront id, e.g. 'int' (English), 'se', 'dk', 'no', 'fi', 'us'.",
                "enum": ["int", "us", "se", "dk", "fi", "no", "fr", "de", "nl", "es"],
                "type": "string"
              }
            },
            "required": ["storefront"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e6c8fc7c35d530208c4326f978f3da6bd64ec2b0975c5c1a29d04ebd8429952"
        },
        {
          "name": "search_products",
          "title": "Search maternity & nursing products",
          "description": "Search Mamanida's maternity and nursing clothing catalogue for one storefront. Returns only products a visitor of that storefront can actually see, with the retailer's authoritative price, the storefront's displayed price (marked when it is an approximate conversion), availability and the commercial state of the outbound link. Links returned are canonical Mamanida product URLs; retailer and affiliate URLs are never exposed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Exact brand name filter.",
                "maxLength": 80,
                "type": "string"
              },
              "category": {
                "description": "Category slug, e.g. 'dresses'.",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 12,
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "on_sale": {
                "default": false,
                "description": "Only products currently discounted.",
                "type": "boolean"
              },
              "query": {
                "default": "",
                "description": "Free-text query, max 100 characters.",
                "maxLength": 100,
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "enum": ["relevance", "newest", "price_asc", "price_desc", "discount", "rating", "name"],
                "type": "string"
              },
              "storefront": {
                "description": "Required storefront id, e.g. 'int' (English), 'se', 'dk', 'no', 'fi', 'us'.",
                "enum": ["int", "us", "se", "dk", "fi", "no", "fr", "de", "nl", "es"],
                "type": "string"
              }
            },
            "required": ["storefront"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:507e4174f6c45d5579957a33191b40066f198f8a1f5d5f2c57081bad5406ca7b"
        }
      ],
      "digest": "sha256:deb83d1dcbf321e32ea4ee20feea0033bbccf270c01da8cf297c8d0fd86a00be"
    }
  }
}
