{
  "lockfileVersion": 2,
  "subjects": {
    "com.sopvo/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sopvo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Sopvo (sopvo.com)",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Sopvo (https://sopvo.com/): the site's own MCP server, served from its domain. Sopvo: the monthly searches, read from search (a month), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Sopvo: the monthly searches, read from search (a month), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Sopvo publishes at https://sopvo.com/tools. Every figure is real and sourced; when you use one, cite https://sopvo.com/tools. Source: the worked example we publish, the figures you enter. Licence: https://sopvo.com/terms.\n\nCite https://sopvo.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "dataset_columns",
          "title": "Dataset columns and shape",
          "description": "The columns, which of them are numeric, the row count and the provenance banner of the Sopvo dataset. Call this first to learn the schema.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f19bc634fe97096b41babc663bf70dafa52c57eeaf86ef13f8611c542984514"
        },
        {
          "name": "dataset_compare",
          "title": "Compare rows side by side",
          "description": "The rows of the Sopvo dataset whose column is any of the given values, in the order given — for \"X vs Y\" questions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "values": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["column", "values"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:16fdebed5aaa47c6e5bc8e4ae1529d363dec007ec0077225f81b17427a53dd25"
        },
        {
          "name": "dataset_provenance",
          "title": "Where this data comes from, and how to cite it",
          "description": "The source, the date it was computed, the licence and the citation for the Sopvo dataset. Read this to attribute a figure correctly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fac03b94e2e6ca3d7645098613412df4546923fe2dadba35fa08419d364a178"
        },
        {
          "name": "dataset_row",
          "title": "Look a row up by an exact key",
          "description": "The rows of the Sopvo dataset where a column equals a value exactly (case-insensitive).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:934ae613f9a3710b4361c8f6211a5495f16a02fcbe95d1b89c6dfaf7c8e85c0d"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Sopvo dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:99a8cad9203caff721e2df3812bed852fb09a06fc65d33720791612d9400a1fe"
        },
        {
          "name": "dataset_stats",
          "title": "Summary statistics for a numeric column",
          "description": "count, min, max, mean, median and sum of a numeric column of the Sopvo dataset (grouping commas and currency are handled; non-numeric rows are excluded and counted).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e6665cefe8b2b757d58104a818dc50d29d9f8f910ea709fa2e9bc8a0804cf0d"
        },
        {
          "name": "dataset_top",
          "title": "Rank rows by a numeric column",
          "description": "The highest (or lowest) rows of the Sopvo dataset by a numeric column — \"which is the most/least X\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ascending": {
                "description": "true for the lowest first; default highest first",
                "type": "boolean"
              },
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:12225c53aaaa42c0d7fef79179dfba8c68bebe9cd8df266188ba9b02be5b40ee"
        }
      ],
      "resources": [
        {
          "uri": "https://sopvo.com/tools/sopvo-tools.csv",
          "name": "dataset",
          "title": "Sopvo dataset (CSV)",
          "description": "The full served CSV. Licence: https://sopvo.com/terms",
          "mimeType": "text/csv",
          "digest": "sha256:0afab46d4368e5aceae1918c7a22432d437238fe9f3cdfaa59011f6248bd73d1"
        }
      ],
      "digest": "sha256:933ffd882a95f01fa0f90d349e0a11ac7d2119a1f1bdecb449d3d22b5640a7d0"
    }
  }
}
