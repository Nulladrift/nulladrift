      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ai.reg-bot/compliance-oracle",
        "title": "Regzy Compliance Oracle",
        "version": "0.1.0",
        "websiteUrl": "https://www.regzy.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only US food license data. Rules come only from full-page verified official sources; otherwise the tools say to check with the local health department. Powered by Regzy (https://www.regzy.app) - food license answers and renewal reminders.",
      "tools": [
        {
          "name": "get_state_food_rules",
          "title": "Verified state food license rules",
          "description": "Get verified food license rules (issuing agency, renewal cycle, expiry, fee, late fee, official link) for a US state and business type. Only rows verified against the full official page are returned; anything else returns 'Check with your local health department' and an official link. Never guesses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_type": {
                "description": "Optional, e.g. food truck, restaurant, caterer, cottage food",
                "type": "string"
              },
              "state": {
                "description": "2-letter US state code, e.g. FL, TX, DC",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:895e3999dc8e612e7928dcc59fb3977eff02614e656cb90cfc2131cbe6d969c3"
        },
        {
          "name": "lookup_florida_license",
          "title": "Look up a Florida food license",
          "description": "Look up a Florida DBPR food service / mobile food license (restaurants, food trucks, caterers) by license number, or by business name plus 5-digit zip. Returns status and expiry date from Florida DBPR public records (checked daily; DBPR updates about once a week, so it may lag). Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_name": {
                "description": "Business name (use with zip)",
                "type": "string"
              },
              "license_number": {
                "description": "DBPR license number, e.g. MFD2650526",
                "type": "string"
              },
              "zip": {
                "description": "5-digit Florida zip code (use with business_name)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf6f3ab3f17b296c3ff0a806b7d70fe74e442b3bddeb3a1846ec9419faaf4039"
        },
        {
          "name": "next_renewal_date",
          "title": "Next food license renewal date",
          "description": "Get the next food license renewal deadline. Give a Florida DBPR license_number for its real expiry date, or a state (plus optional city and business_type) for states/cities with a verified fixed yearly deadline (e.g. Michigan Apr 30). Returns null with guidance when there is no verified fixed date (e.g. anniversary-based permits, or Ohio food trucks, which renew before first operating in the new licensing year).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_type": {
                "description": "Optional, e.g. home bakery",
                "type": "string"
              },
              "city": {
                "description": "Optional city, e.g. Dallas",
                "type": "string"
              },
              "county": {
                "description": "Optional county, e.g. Franklin County",
                "type": "string"
              },
              "license_number": {
                "description": "Optional Florida DBPR license number",
                "type": "string"
              },
              "state": {
                "description": "2-letter US state code",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74c7e8aa991dfedaffb8704954577ee0ce19e7b4c0d0ae02722f7ab68f7a6589"
        }
      ],
      "digest": "sha256:a6214abbb285f7360ebf09a5748e18b819038aeadedcf60675b40b6b1808b374"
    }
  }
