          "name": "get_capabilities",
          "title": "Timer capabilities",
          "description": "Get a short feature and limits summary. Request detail=full only for the complete reference. Does not start a timer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
