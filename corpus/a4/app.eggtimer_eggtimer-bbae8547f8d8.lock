{
  "lockfileVersion": 2,
  "subjects": {
    "app.eggtimer/eggtimer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://eggtimer.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "eggtimer",
        "title": "Eggtimer.app",
        "version": "1.0.0",
        "websiteUrl": "https://eggtimer.app/ai.html"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Create validated timer links and data-only recipes. Link creation does not start a timer, schedule an alarm, or arm Zapier. Discovery is compact by default: list_presets returns summaries; get_preset(id) returns a full recipe. Use get_capabilities({detail:\"full\"}) only for the complete reference. Use create_clock_link for local clock times.",
      "tools": [
        {
          "name": "create_clock_link",
          "title": "Create a clock-time link",
          "description": "Return a validated link to the next local clock time, e.g. 9pm or 17:30. Each opener uses their own timezone. This does not schedule a server timer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "label": {
                "maxLength": 80,
                "type": "string"
              },
              "time": {
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["time"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alarm_note": {
                "type": "string"
              },
              "start_behavior": {
                "type": "string"
              },
              "time": {
                "type": "string"
              },
              "timezone": {
                "const": "opener_local"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["alarm_note", "start_behavior", "time", "timezone", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:498edb2c85394410c39201469ae8ff25c6902ec9547ffedf0f0ce6b891076612"
        },
        {
          "name": "create_recipe",
          "title": "Create a recipe link",
          "description": "Validate a data-only recipe and return its portable preview link. The person opens it and presses Start. No code runs and no webhook is armed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "recipe": {
                "additionalProperties": false,
                "description": "Recipe v1: 1–12 whole-second steps, no repeats. v2: 1–32 steps, fractional seconds and repeats. At most 512 expanded intervals and 10 years; defaults may be omitted.",
                "properties": {
                  "author": {
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "autoAdvance": {
                    "type": "boolean"
                  },
                  "completion": {
                    "additionalProperties": false,
                    "properties": {
                      "message": {
                        "maxLength": 160,
                        "minLength": 1,
                        "type": "string"
                      },
                      "sound": {
                        "type": "boolean"
                      },
                      "webhook": {
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "cycles": {
                    "maximum": 12,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "display": {
                    "enum": ["digits", "ring", "bar"]
                  },
                  "note": {
                    "maxLength": 320,
                    "type": "string"
                  },
                  "repeatLabel": {
                    "maxLength": 20,
                    "minLength": 1,
                    "type": "string"
                  },
                  "stepSound": {
                    "type": "boolean"
                  },
                  "steps": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "label": {
                          "maxLength": 60,
                          "minLength": 1,
                          "type": "string"
                        },
                        "repeat": {
                          "maximum": 32,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "seconds": {
                          "maximum": 315576000,
                          "minimum": 0.1,
                          "type": "number"
                        }
                      },
                      "required": ["seconds"],
                      "type": "object"
                    },
                    "maxItems": 32,
                    "minItems": 1,
                    "type": "array"
                  },
                  "theme": {
                    "additionalProperties": false,
                    "properties": {
                      "accent": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "highlight": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "ink": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "line": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "muted": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "panel": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "paper": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      },
                      "white": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "title": {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "version": {
                    "enum": [1, 2],
                    "type": "integer"
                  }
                },
                "required": ["steps", "version"],
                "type": "object"
              }
            },
            "required": ["recipe"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "duration_seconds": {
                "type": "number"
              },
              "integration_note": {
                "type": "string"
              },
              "intervals": {
                "type": "integer"
              },
              "recipe": {
                "type": "object"
              },
              "start_behavior": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["duration_seconds", "integration_note", "intervals", "recipe", "start_behavior", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7641a7e790387b64f29e8feb9b19cc91263670b066207d671a5c9372742a091"
        },
        {
          "name": "create_timer",
          "title": "Create a timer link",
          "description": "Validate a duration and return a link. The countdown starts when the person opens it, not when this tool runs. No background alarm or automation is scheduled.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "display": {
                "description": "Omit to use defaults.",
                "enum": ["digits", "ring", "bar"],
                "type": "string"
              },
              "duration": {
                "description": "Relative duration, e.g. 12m or 1h20m. Bare numbers mean minutes. Use recipes for sequences.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "label": {
                "description": "Omit unless requested.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "muted": {
                "description": "Omit to use defaults.",
                "type": "boolean"
              },
              "theme": {
                "description": "Omit to use defaults.",
                "enum": ["plain", "oat", "midnight", "clay", "lilac"],
                "type": "string"
              }
            },
            "required": ["duration"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alarm_note": {
                "type": "string"
              },
              "duration_seconds": {
                "type": "integer"
              },
              "start_behavior": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["alarm_note", "duration_seconds", "start_behavior", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9dfa40cefae745bd0f80c3b06374721ec55679baf5c2d75d84344424d3ab915c"
        },
