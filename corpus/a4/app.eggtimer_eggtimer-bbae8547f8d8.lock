                "type": "string"
              }
            },
            "required": ["canonical_origin", "decision_rules", "families", "limits", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
