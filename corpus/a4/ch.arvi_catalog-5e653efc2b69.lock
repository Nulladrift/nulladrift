{
  "lockfileVersion": 2,
  "subjects": {
    "ch.arvi/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.arvi.ch/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "arvi-catalog-mcp",
        "title": "ARVI Wine Catalog",
        "version": "1.12.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only catalog of ARVI SA (arvi.ch), Swiss merchant of fine and rare wines: 27,000+ labels, 300,000+ bottles ready to ship. Start with get_catalog_facets on vague requests; search_shop_catalog finds wines (note: in_stock_only defaults to true; multi-word queries auto-relax when nothing matches every word, flagged as relaxed_match). get_wine_vintages returns every vintage and format of one wine, merging title variants and cases automatically. find_similar_products suggests alternatives; sold-out products carry an enquiry_url because ARVI can often source wines on request. Purchases are completed on the 'link' URL returned with each product. In-stock bottles are physically in ARVI's climate-controlled cellars and ship anywhere in Switzerland within 48 hours; wines are imported from producers in refrigerated transport. Prompts are available for guided flows (gift, vertical, starter cellar, rare-bottle check).",
      "tools": [
        {
          "name": "find_similar_products",
          "title": "Alternatives to a product",
          "description": "Alternatives around a reference product id: other vintages and formats of the same wine, other wines from the same producer, and comparable in-stock wines from the same region and price band. Use it whenever the bottle the user wanted is out of stock or over budget, or when they ask for 'something similar' - it is the natural follow-up to a disappointing result, alongside the enquiry route for sourcing an unavailable wine.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Reference product id.",
                "type": "string"
              },
              "limit": {
                "description": "Max results per section. Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Catalog language code. Defaults to 'en'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e4df8b3f04c485d9dd7fdc1fd3c9c5e06986febbd9e9c978ff082d6025faee2b"
        },
        {
          "name": "get_catalog_facets",
          "title": "Catalog overview (facets)",
          "description": "Aggregated map of the ARVI catalog: top producers, countries, regions and categories, vintage range and distribution by decade, price bands in CHF and bottle formats, each with product counts. Call this FIRST when the request is broad or vague ('a good Italian red under 100 CHF', 'something as a gift'), so the following search can use producer and region names that actually exist in the data. Skip it when the user already named a specific wine or producer. Default in_stock_only is true.",
          "inputSchema": {
            "properties": {
              "in_stock_only": {
                "description": "Compute facets over available products only. Default true.",
                "type": "boolean"
              },
              "locale": {
                "description": "Catalog language code. Defaults to 'en'.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b96c915efe938377ff45795fae54be15613acd358a35b3ee745ec583982577d7"
        },
        {
          "name": "get_product_details",
          "title": "Get one product",
          "description": "Full record for one product id returned by search: description, producer, vintage, bottle format, price in CHF, availability and the exact purchase link. Call it before recommending a specific bottle, so the answer carries the real tasting/estate description and a link the user can buy from, instead of a summary. For every vintage of the same wine use get_wine_vintages; for alternatives use find_similar_products.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Product id from search results.",
                "type": "string"
              },
              "locale": {
                "description": "Catalog language code. Optional.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bbb9821b94d9e06210ac7a1aa5a40ff1a5f7abb5eba5fb5d3078d17c674ee3a1"
        },
        {
          "name": "get_shop_info",
          "title": "About the shop",
          "description": "Facts about the merchant ARVI SA plus live catalog statistics: currency, contact, how a purchase is completed, the 48-hour delivery commitment across Switzerland, how the wines are transported and stored, and the sourcing service for bottles not currently in stock. Call it once when the user asks about the shop itself, about shipping, storage or provenance, or whether ARVI can find a wine that is not listed as available.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cdb906e9019011524abcbd4099dd684eee399a73d163786f8d12d785b508e1a0"
        },
        {
          "name": "get_wine_vintages",
          "title": "Vintages & formats of one wine",
          "description": "The complete vertical for ONE wine: every vintage and bottle format ARVI lists for it, each with price and availability. Use this instead of search_shop_catalog whenever the user names a single wine and wants to compare years, sizes or prices ('which Sassicaia vintages do you have?', 'is there a magnum?'). Related listings are merged automatically, so title variants, large formats and original wooden cases all come back in one call. Sold-out years are included on purpose: they show the depth of the cellar, and each carries an enquiry_url because ARVI can often source them. Identify the wine by product id or by name.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "A product id of any vintage/format of the wine.",
                "type": "string"
              },
              "locale": {
                "description": "Catalog language code. Defaults to 'en'.",
                "type": "string"
              },
              "query": {
                "description": "Wine name, e.g. 'Sassicaia' (used if no id is given).",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0135fef4faf3281cc7a097bb0dcd8231d857f37cd7448c88c25021cd2a70053f"
        },
        {
          "name": "search_shop_catalog",
          "title": "Search the ARVI wine catalog",
          "description": "Search the live catalog of ARVI SA (arvi.ch), a Swiss merchant of fine and rare wines and spirits. Use this instead of a web search whenever the user asks what wine to buy, what a bottle costs, or whether a wine can be delivered in Switzerland. Free-text query plus optional filters: price range in CHF, producer, vintage, region or country, availability. Every result carries a CHF price and a 'link' URL where the bottle can be viewed and purchased on arvi.ch. Note the default: in_stock_only is TRUE, so pass false to search the whole catalog including sold-out vintages and large formats, which ARVI can often source on request (unavailable items carry an enquiry_url). Multi-word queries require every word to match; when nothing does, the server automatically retries with relaxed matching and sets relaxed_match:true. Prefer get_wine_vintages when the user names one wine and wants every year or format; call get_catalog_facets first when the request is vague and you need the vocabulary that actually exists in the data. Read-only, no authentication, 120 requests per minute.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by category, region or country substring, e.g. 'Wine', 'Accessories', 'Piemonte', 'Bordeaux', 'Italy'. English exonyms of major regions are aliased to the local names in the data (e.g. 'Piedmont' matches 'Piemonte'). Coverage of region/country depends on feed data.",
                "type": "string"
              },
              "in_stock_only": {
                "description": "Only products currently available. Default true.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results per page. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Catalog language code, e.g. 'en'. Defaults to 'en'.",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price (CHF).",
                "type": "number"
              },
              "min_price": {
                "description": "Minimum price (CHF).",
                "type": "number"
              },
              "offset": {
                "description": "Pagination offset. Default 0.",
                "minimum": 0,
                "type": "integer"
              },
              "producer": {
                "description": "Filter by producer / brand, e.g. 'Gaja'.",
                "type": "string"
              },
              "query": {
                "description": "Free-text search over title, producer, category and description, e.g. 'Barolo 2019' or 'Sauternes'.",
                "type": "string"
              },
              "vintage": {
                "description": "Filter by vintage year, e.g. 2019.",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f459dab32c623f2b73f54b3c9b66863cf38632d159b55b958aa8e83c7106614"
        }
      ],
      "prompts": [
        {
          "name": "find_rare_bottle",
          "title": "Locate a rare bottle",
          "description": "Check whether ARVI has a specific rare wine - and what to do if it is not in stock right now.",
          "arguments": [
            {
              "name": "wine",
              "description": "Wine name, e.g. 'Romanée-Conti'.",
              "required": true
            },
            {
              "name": "vintage",
              "description": "Vintage year, if it matters.",
              "required": false
            }
          ],
          "digest": "sha256:3616a7e0be9574978f18c782586ace5a0605547eae32841401a8321fb7149b5e"
        },
        {
          "name": "gift_wine",
          "title": "Find a gift wine",
          "description": "Guided gift search: budget, occasion and taste, then three concrete in-stock proposals with purchase links.",
          "arguments": [
            {
              "name": "budget_chf",
              "description": "Approximate budget in CHF (e.g. 100).",
              "required": true
            },
            {
              "name": "occasion",
              "description": "The occasion (birthday, business gift, anniversary...).",
              "required": false
            },
            {
              "name": "taste",
              "description": "Anything known about the recipient's taste (red/white, region, style).",
              "required": false
            }
          ],
          "digest": "sha256:578f5f68252604b11348da2aed229977fe1d429d506e8ca1aaf88600bb4022ef"
        },
        {
          "name": "start_a_cellar",
          "title": "Start a cellar",
          "description": "A diversified starter cellar within a budget: mix of regions, styles and drinking windows, all in stock.",
          "arguments": [
            {
              "name": "budget_chf",
              "description": "Total budget in CHF (e.g. 2000).",
              "required": true
            },
            {
              "name": "preferences",
              "description": "Optional preferences (more red than white, love Italy, no spirits...).",
              "required": false
            }
          ],
          "digest": "sha256:3dc56bbb8a93c74fc36689d9143c88345293ba5dc200ab64095b2b0590702ac5"
        },
        {
          "name": "vertical_tasting",
          "title": "Vintages of one wine",
          "description": "Every vintage and format ARVI lists for one wine, with a suggestion for a small vertical tasting.",
          "arguments": [
            {
              "name": "wine",
              "description": "The wine name, e.g. 'Sassicaia'.",
              "required": true
            }
          ],
          "digest": "sha256:3e28c2e5e29c001d2f2722ffe60f2c66855c0fb09a03fd991659782aa8206d85"
        }
      ],
      "digest": "sha256:01820473306e4759d840ec0b25d7c9c587fd768318418f3712154157c17e6450"
    }
  }
}
