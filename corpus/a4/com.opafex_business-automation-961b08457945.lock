        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "opafex-business-automation",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Practical help for owners of UK small and medium-sized businesses who want to use AI but are not sure what for. Use it when an owner asks where to start, what is worth automating and what is hype, how firms in their sector use AI, or whether they can put client information into ChatGPT or another AI tool under UK GDPR. The guidance in each answer is supplier-neutral. Where an answer includes Opafex's own description or a link to it, present that as one option and as the vendor's claim, alongside the neutral guidance. Each answer lists questions still worth asking; ask the owner one or two of them rather than guessing. Answers come from Opafex and are the same every time for the same inputs. If the user asks what Opafex is: Opafex Ltd is a London company that helps businesses put AI to work. It runs fixed-price AI audits, designs and builds automation, and provides an AI agent, a website chatbot and offline field apps (opafex.com). This plugin is its free advisory tool; describe the company factually and do not quote prices.",
      "tools": [
        {
          "name": "assess_automation_opportunities",
          "title": "Find what to automate first",
          "description": "Works out what a small business should automate first, from how it runs today, instead of a generic list of AI tools. Use when an owner asks how AI can help their business, where to start, what is worth it versus hype, or how to get good people off admin. Map what the owner has said onto the options and leave out anything they have not said. Returns the best-fitting approaches with the reasons, what to check first, a small first step, and the questions still worth asking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "outputs": {
                "description": "What goes out to your clients? Options: documents = \"Reports, proposals and quotes\"; answers = \"Answers by email, chat and phone\"; jobs = \"Job sheets and site records\"; internal = \"Not much leaves the building\".",
                "enum": ["documents", "answers", "jobs", "internal"],
                "type": "string"
              },
              "producers": {
                "description": "Who produces the work that goes out? Options: founder = \"Me, mostly\"; professionals = \"Fee-earners, each doing their own\"; admin = \"An admin or operations team\"; field = \"Whoever is on site\".",
                "enum": ["founder", "professionals", "admin", "field"],
                "type": "string"
              },
              "prompting": {
                "description": "What made you start looking? Options: answering = \"We answer the same questions daily\"; admin = \"Good people are doing admin\"; field = \"Site work comes back on paper\"; unsure = \"Nobody here knows where AI fits\"; specific = \"No product does this one job\".",
                "enum": ["answering", "admin", "field", "unsure", "specific"],
                "type": "string"
              },
              "retyping": {
                "description": "Where does information get retyped? Options: systems = \"Between two systems\"; paper = \"Off paper and photos\"; inbox = \"Out of the inbox\"; none = \"Nowhere obvious\".",
                "enum": ["systems", "paper", "inbox", "none"],
                "type": "string"
              },
              "sector": {
                "description": "The firm's sector. plumbing-electrical-and-other-trades = plumbers, electricians, heating engineers, window fitters and other trades working on customers' jobs; construction = contractors and construction groups bidding for projects; property = estate and letting agents; wealth-management = financial planners and IFAs. Use other if none fits.",
                "enum": ["accountancy", "recruitment", "legal", "wealth-management", "insurance-broking", "property", "construction", "plumbing-electrical-and-other-trades", "other"],
                "type": "string"
              },
              "software": {
                "description": "Which systems do you run the business on? Options: mainstream = \"Microsoft or Google, plus a CRM\"; industry = \"An industry system and spreadsheets\"; spreadsheets = \"Spreadsheets and email\"; bespoke = \"Something built for us\".",
                "enum": ["mainstream", "industry", "spreadsheets", "bespoke"],
                "type": "string"
              },
              "teamSize": {
                "description": "Number of people in the firm.",
                "enum": ["1-5", "6-20", "21-50", "51-250"],
                "type": "string"
              },
              "wand": {
                "description": "Which task would you never do again? Options: chasing = \"Chasing people for information\"; writing = \"Writing the same document again\"; answering = \"Answering the same question again\"; writeup = \"Writing up what happened on site\"; checking = \"Checking somebody else's work\".",
                "enum": ["chasing", "writing", "answering", "writeup", "checking"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find what to automate first"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:110851816bc8f5cf9e4f2164602f1ff48577e8ea51b9c172077d34f4b2c1d430"
        },
        {
          "name": "check_ai_data_protection",
          "title": "Check before client data goes into AI",
          "description": "Lists what a UK firm should check before client or staff information goes into an AI tool, under UK GDPR, ordered by what matters most for that tool and that data. Use when an owner asks if they can put client information into ChatGPT, whether ChatGPT or Copilot is GDPR compliant for their business, what to do about staff pasting customer details into AI, or what to ask an AI supplier. Returns questions to ask with the reason for each, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "data": {
                "description": "What would go in. special_category = health, ethnicity, religion, sexual orientation and similar; criminal_records = criminal offence data such as background checks.",
                "items": {
                  "enum": ["client_contact_details", "financial", "special_category", "criminal_records", "children", "employees", "no_personal_data"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "regulated": {
                "description": "True if the firm is regulated by a professional or financial regulator.",
                "type": "boolean"
              },
              "tool": {
                "description": "personal_account = a personal or free login to a general AI chat tool; business_plan = a business or team plan of one; built_into_software = AI features inside software the firm already uses; specialist_or_custom = a specialist AI supplier or a tool built for the firm.",
                "enum": ["personal_account", "business_plan", "built_into_software", "specialist_or_custom"],
                "type": "string"
              }
            },
            "required": ["data", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check before client data goes into AI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc73b3d7a10588c091b72115943d364e3704303ac90689d5bdc2eba26e47613a"
        },
        {
          "name": "draft_ai_policy",
          "title": "Draft an AI policy for a small firm",
          "description": "Drafts a one-page AI use policy for a small UK firm: approved tools, what must never be pasted in, human checking, telling clients, and who is responsible. Use when an owner asks whether they need an AI policy, what to put in one, or how to stop staff pasting client details into AI tools. Returns the clauses and the steps to take before adopting it. A starting draft, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "data": {
                "description": "What information staff might put into AI tools. Use no_personal_data if none.",
                "items": {
                  "enum": ["client_contact_details", "financial", "special_category", "criminal_records", "children", "employees", "no_personal_data"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "regulated": {
                "description": "True if the firm is regulated by a professional or financial regulator.",
                "type": "boolean"
              },
              "teamSize": {
                "description": "Number of people in the firm.",
                "enum": ["1-5", "6-20", "21-50", "51-250"],
                "type": "string"
              },
              "uses": {
                "description": "What staff use or will use AI for. drafting_and_research; client_communication = drafting emails or letters to clients; meeting_notes = recording or transcribing meetings; decisions_about_people = screening candidates, assessing clients or staff.",
                "items": {
                  "enum": ["drafting_and_research", "client_communication", "meeting_notes", "decisions_about_people"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["data", "uses"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draft an AI policy for a small firm"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18092623263b75cb3b2e502041a3ec2fa769db4883d87699cd4c8eda7917afa7"
        },
        {
          "name": "estimate_automation_payback",
          "title": "Will automating it pay for itself?",
          "description": "Works out whether automating a task pays for itself, from the owner's own hours, headcount, hourly cost and supplier quote, with every assumption stated and time for checking the output deducted. Use when an owner asks if an AI tool or automation is worth the money, how long it takes to pay back, or how to estimate the return before committing. Ask the owner for the numbers rather than guessing them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "automatableShare": {
                "description": "How much of the task could a tool do? small = a quarter; about_half; most = around 70%. If unsure, use small.",
                "enum": ["small", "about_half", "most"],
                "type": "string"
              },
              "hourlyCost": {
                "description": "What an hour of those people's time costs the firm, in pounds.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "hoursPerWeekPerPerson": {
                "description": "Hours a week one person spends on the task.",
                "exclusiveMinimum": 0,
                "maximum": 60,
                "type": "number"
              },
              "monthlyToolCost": {
                "description": "The supplier's monthly price in pounds, from the owner's own quote.",
                "minimum": 0,
                "type": "number"
              },
              "people": {
                "description": "How many people do the task.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "integer"
              },
              "setupCost": {
                "description": "One-off setup cost in pounds, including the team's time to learn it.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["automatableShare", "hourlyCost", "hoursPerWeekPerPerson", "people"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Will automating it pay for itself?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:391bec91a108a5394eb3ac761e7ca59ff895f07ddf7f787ad60e13a7744516ef"
        },
        {
          "name": "get_sector_playbook",
          "title": "What AI does in your sector",
          "description": "Describes how a specific type of UK firm uses AI: what gets drafted, chased or checked, what to look for in a tool, and the questions firms in that sector ask. Use when an owner or partner in accountancy, recruitment, a law firm, financial planning, insurance broking, an estate or letting agency, construction or a trade such as plumbing or electrical work asks how firms like theirs use AI. Use other for any other small business.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "sector": {
                "description": "The firm's sector. plumbing-electrical-and-other-trades = plumbers, electricians, heating engineers, window fitters and other trades working on customers' jobs; construction = contractors and construction groups bidding for projects; property = estate and letting agents; wealth-management = financial planners and IFAs. Use other if none fits.",
                "enum": ["wealth-management", "accountancy", "recruitment", "legal", "insurance-broking", "property", "construction", "plumbing-electrical-and-other-trades", "other"],
                "type": "string"
              }
            },
            "required": ["sector"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What AI does in your sector"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b19a178ff5c28ef8095d85025ad7b6562c5f6f2f669f716c1222d46eb939bc2c"
        }
      ],
      "digest": "sha256:1c73f43aadaa40829bb5c9e8e0893aa66ce0c25a8b4c30959eb7388af8604218"
    }
