        {
          "name": "income_tax_by_place",
          "title": "Income tax by place: one income, 100 places",
          "description": "Income tax on one yearly income in Patrician.ch's 100 places to live, lowest first, with the effective rate and the patrician.ch page. Covers zero income tax countries, Swiss cantons, US states such as Florida, New York and California, and European capitals. A US state or town that is not one of the 100 (Texas, California, Los Angeles, Houston, Boerne, Tampa, Nashville) is answered through the board place that carries the same income tax, and the result says which. A town in Illinois, New Jersey or Massachusetts (Chicago, Jersey City, Boston) is answered as its federal tax plus its own 2026 state scale. Optionally only named places, a US citizen (taxed by the US wherever they live), or married filing jointly. Use it for \"how much tax would I pay in X\", \"which country taxes $1M least\" and \"countries with no income tax\".",
          "inputSchema": {
            "properties": {
              "annual_income_usd": {
                "maximum": 1000000000,
                "minimum": 10000,
                "type": "number"
              },
              "employment_income": {
                "description": "Treat the income as one person's salary and add the employee's compulsory social contributions where Patrician.ch models them. Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many places to return, lowest tax first. Default 10, at most 10. The full list is on the site, at calculator.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "married_joint": {
                "description": "Married, filing jointly where the place allows it. Default false.",
                "type": "boolean"
              },
              "places": {
                "description": "Optional: 1 or 2 place names to answer for. Call again for more places.",
                "items": {
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "us_citizen": {
                "description": "US citizens stay taxed by the US wherever they live. Default false.",
                "type": "boolean"
              }
            },
            "required": ["annual_income_usd"],
            "type": "object"
          },
