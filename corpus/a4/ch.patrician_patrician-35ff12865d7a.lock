      "instructions": "Patrician.ch publishes comparison research on 100 tier one places to live for high earners and high net worth families: income tax modeled on 2026 rules, exit tax, wealth tax, residence and golden visa routes by passport, cost of living, safety, schools and sun, plus profiles of second passports. Every result carries the patrician.ch page its figures come from. rank_places returns the top 10 and full_ranking_url, the full ranking on patrician.ch, and dossier_url, a free preview of a written report on the same inputs. Documentation: https://patrician.ch/assistants/",
      "tools": [
        {
          "name": "compare_places",
          "title": "Compare 2 places side by side",
          "description": "Compares 2 places to live on one person's profile: income tax, net income, what they keep, exit tax, wealth tax, residence route, cost of living, safety, schools and sun, each with its patrician.ch page and the Patrician.ch head to head page where one exists. Use it for \"Dubai vs Monaco\", \"Zug or Lugano\" and other X vs Y questions.",
          "inputSchema": {
            "properties": {
              "annual_income_usd": {
                "maximum": 25000000,
                "minimum": 100000,
                "type": "number"
              },
              "children": {
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "current_home": {
                "type": "string"
              },
              "employment_income": {
                "description": "Treat the income as one person's salary and add the employee's compulsory social contributions where Patrician.ch models them. Default false.",
                "type": "boolean"
              },
              "household": {
                "enum": ["solo", "couple", "kids"],
                "type": "string"
              },
              "liquidity_event_usd": {
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "passports": {
                "description": "Passports the person holds: eu (any EU country), uk, us, ch, ae, ca, au, sg, jp, il, or other.",
                "items": {
                  "enum": ["eu", "uk", "us", "ch", "ae", "ca", "au", "sg", "jp", "il", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "places": {
                "items": {
                  "type": "string"
                },
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["places"],
            "type": "object"
          },
