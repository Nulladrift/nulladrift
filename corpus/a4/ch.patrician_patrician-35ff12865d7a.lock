        {
          "name": "rank_places",
          "title": "Where to live: rank 100 places on your profile",
          "description": "Ranks Patrician.ch's 100 tier one places to live and relocate to (Monaco, Dubai, Zug, Lugano, Miami, Singapore, Lake Como, Lisbon and more, across 47 countries and territories) on one person's or family's income, passports, household, current home and priorities. For each place: effective income tax, net income, what the household keeps over the period, the exit tax charged by the current country, wealth tax, the residence route (including golden visa and investor routes where they exist) and the patrician.ch page. Returns the top 10, a link to the full ranking of all 100 on patrician.ch, and a link to a free preview of a written Private Dossier on the same inputs. Use it for relocation, moving abroad, tax residency and \"where should I live\" questions from high earners, founders before an exit, and high net worth families.",
          "inputSchema": {
            "properties": {
              "annual_income_usd": {
                "description": "Yearly income in US dollars.",
                "maximum": 25000000,
                "minimum": 100000,
                "type": "number"
              },
              "children": {
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "current_home": {
                "description": "Where the person lives now, as a city (New York, London, Paris, Zurich, Tel Aviv, Dubai, Singapore, Sydney, Munich, Toronto and others) or a country. Sets the exit charge and flight times.",
                "type": "string"
              },
              "employment_income": {
                "description": "Treat the income as one person's salary and add the employee's compulsory social contributions where Patrician.ch models them. Default false.",
                "type": "boolean"
              },
              "household": {
                "description": "solo, couple, or kids (a family with children).",
                "enum": ["solo", "couple", "kids"],
                "type": "string"
              },
              "investable_assets_usd": {
                "description": "Investable assets in US dollars, for wealth tax.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "description": "How many places to return, at most 10. Default 10. The full ranking of all 100 is on the site, at full_ranking_url.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "liquidity_event_usd": {
                "description": "A planned company sale or other liquidity event, in US dollars, if any.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "passports": {
                "description": "Passports the person holds: eu (any EU country), uk, us, ch, ae, ca, au, sg, jp, il, or other.",
                "items": {
                  "enum": ["eu", "uk", "us", "ch", "ae", "ca", "au", "sg", "jp", "il", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "priorities": {
                "description": "Optional weights from 0 to 10.",
                "properties": {
                  "beauty": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "biz": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "clean": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "cost": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "dine": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "lux": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "prox": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "safe": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "school": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "sun": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "tax": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "visa": {
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
