      "instructions": "Kürsüde: münazara antrenmanı. Kullanıcı İngilizce konuşuyorsa her araca dil=en ver (If the user speaks English, pass dil=en to every tool). Akış: onerge_listele ile önerge seçtir, format, rol ve seviyeyi sor (uzun maçta sure=hizli öner); isterse hazirlik_brifingi ile hazırlan; kullanıcının rolünden önce konuşan her konuşmacı için sırayla kullanici_rolu vererek rakip_brifingi al ve konuşmayı brifinge uyarak sen yaz (brifingi ve açıkları gösterme); POI için poi_brifingi al; kullanıcı konuşmasını yazınca juri_olcutu al ve değerlendirmeyi sen yap, sonunda rakiplerin açıklarını açıkla. Araçlar model çağırmaz; konuşmaları ve kararı sen üretirsin.",
      "tools": [
        {
