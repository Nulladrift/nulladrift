                "description": "Kullanıcının rolü (kimlik ya da ad). bp: AH1=Başbakan, AM1=Muhalefet Lideri, AH2=Başbakan Yardımcısı, AM2=Muhalefet Lider Yardımcısı, KH1=Hükümet Üyesi, KM1=Muhalefet Üyesi, KH2=Hükümet Kırbacı, KM2=Muhalefet Kırbacı | asya: H1=Başbakan, M1=Muhalefet Lideri, H2=Bakan, M2=Muhalefet Lider Yardımcısı, H3=Hükümet Kırbacı, M3=Muhalefet Kırbacı, MC=Muhalefet Cevap, HC=Hükümet Cevap | wsdc: O1=Önerme 1. Konuşmacı, K1=Karşı 1. Konuşmacı, O2=Önerme 2. Konuşmacı, K2=Karşı 2. Konuşmacı, O3=Önerme 3. Konuşmacı, K3=Karşı 3. Konuşmacı, KC=Karşı Cevap, OC=Önerme Cevap. Varsayılan ilk konuşma.",
