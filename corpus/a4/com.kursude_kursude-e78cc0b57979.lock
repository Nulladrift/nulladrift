          "title": "Hazırlık brifingi",
          "description": "Maç öncesi hazırlık için kuralları döndürür: tüm takımlara gizli vaka planı çıkarma ve kullanıcının takım arkadaşı olarak onunla hazırlanma. Model çağırmaz; planı ve arkadaş cevaplarını sen yazarsın. Kullanıcı hazırlanmak istemiyorsa atla.",
