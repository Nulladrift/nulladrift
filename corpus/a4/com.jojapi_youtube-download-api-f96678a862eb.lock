{
  "lockfileVersion": 2,
  "subjects": {
    "com.jojapi/youtube-download-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.jojapi.com/youtube-download-api"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "jojapi-youtube-download-api",
        "title": "Youtube Download API API — JoJ API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools are the documented endpoints of Youtube Download API on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/youtube-download-api/pricing · Docs: https://jojapi.com/hub/api/youtube-download-api",
      "tools": [
        {
          "name": "get_ajax_download_php",
          "title": "Create a download job",
          "description": "Submits a new download job for the given `url` in the requested `format`.\nReturns a unique `id` you can pass to the Progress endpoint to poll for\ncompletion and retrieve the final download URL. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "add_info": {
                "description": "Set to `1` to include the `info` object (title + thumbnail) in the response. Defaults to `0` when omitted.",
                "title": "add_info",
                "type": "string"
              },
              "allow_extended_duration": {
                "description": "Set to `1` to permit downloads whose video duration exceeds the format's\nbase duration limit. Extended-duration jobs are charged a multiplier of\nthe base price (see the `ExtendedDuration` response object). Defaults to\n`0` when omitted.",
                "title": "allow_extended_duration",
                "type": "string"
              },
              "apikey": {
                "description": "Your personal API key.",
                "title": "apikey",
                "type": "string"
              },
              "audio_language": {
                "description": "YouTube only. Selects the audio track language by BCP-47 / YouTube\nlanguage code. If the requested track is not available on the video,\nthe default track is used instead. No additional cost.\n\nSupported codes: `af, az, id, ms, bs, ca, cs, da, de, et, en-IN, en-GB,\nen, es, es-419, es-US, eu, fil, fr, fr-CA, gl, hr, zu, is, it, sw, lv,\nlt, hu, nl, no, uz, pl, pt-PT, pt, ro, sq, sk, sl, sr-Latn, fi, sv, vi,\ntr, be, bg, ky, kk, mk, mn, ru, sr, uk, el, hy, iw, ur, ar, fa, ne, mr,\nhi, as, bn, pa, gu,…",
                "title": "audio_language",
                "type": "string"
              },
              "audio_quality": {
                "description": "Audio bitrate in kbps. Common values include `128`, `192`, `256`, `320`.",
                "title": "audio_quality",
                "type": "string"
              },
              "end_time": {
                "description": "Optional. End time (in seconds) of a cut/segment download.",
                "title": "end_time",
                "type": "string"
              },
              "format": {
                "description": "The output format to download. Accepted values: `mp3`, `m4a`,\n`webm_audio`, `aac`, `flac`, `opus`, `ogg`, `wav`, `144`,\n`240`, `360`, `480`, `720`, `1080`, `1440`, `4k`, `8k`.\n\nAudio formats have a 120-minute base duration limit; video formats\nhave format-specific limits (1080p=90m, 1440p=60m, 4k/8k=15m,\neverything else=120m).",
                "title": "format",
                "type": "string"
              },
              "no_merge": {
                "description": "If set to `1`, audio and video streams are **not** merged. The client\nreceives a zip file containing the separate streams. Defaults to `0`\n(streams are merged into a single file).",
                "title": "no_merge",
                "type": "string"
              },
              "start_time": {
                "description": "Optional. Start time (in seconds) of a cut/segment download. When\n`start_time`/`end_time` are supplied, progress is not reported — the\nProgress endpoint only returns initialization and the final success /\nfailure status.",
                "title": "start_time",
                "type": "string"
              },
              "url": {
                "description": "The URL-encoded URL of the video to download (YouTube and other supported sources).",
                "title": "url",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90dc2349405524d21ba169ed9dfb9ed899d67b537632304d2fe0c0f3a7b89726"
        },
        {
          "name": "get_ajax_progress",
          "title": "Check download progress",
          "description": "Polls the status of a previously-submitted download job. Keep polling\nuntil `progress == 1000` (i.e. 100%) and `download_url` is populated. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The job id returned by the Download endpoint.",
                "example": "YOUR_JOB_ID",
                "title": "id",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b20943f141645c4d324b20d8c6a70ef9b5ad9460d33a2726e9c442e34df59f6"
        }
      ],
      "digest": "sha256:6f995d865a7c659ab81d640ff16c99362b7eace374d5fd1096af4a8bed040dde"
    }
  }
}
