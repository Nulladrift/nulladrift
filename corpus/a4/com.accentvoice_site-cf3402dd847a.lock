{
  "lockfileVersion": 2,
  "subjects": {
    "com.accentvoice/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.accentvoice.com/agent/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "accent-site",
        "title": "Accent site content",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only search and lookup over the published content of www.accentvoice.com. Use site_search to find pages, posts, products and customer stories, then site_get to read one in full. Rate limited per client; on HTTP 429 wait for Retry-After. Use get_budgetary_quote for a non-binding monthly estimate from the published plan prices.",
      "tools": [
        {
          "name": "get_budgetary_quote",
          "title": "Budgetary monthly price estimate (non-binding)",
          "description": "Non-binding monthly estimate for Accent cloud phone and team messaging plans at the published 36-month rates on https://www.accentvoice.com/plans-pricing/ (users × per-user plan price, plus published add-ons). Month-to-month, other terms and annual-billing online-order pricing are not quoted here: request a formal quote. Omit plan to get every plan; monthly.low_from / high_from name the plan behind each end of the range (each plan carries its tagline, e.g. Team is team messaging). Excludes taxes, fees, usage and one-time charges. Each estimate lists the plan's included features as published on the Plans & Pricing page. No personal data needed. For a binding price, send the person to next_steps.formal_quote_url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "addons": {
                "additionalProperties": false,
                "properties": {
                  "additional_phone_numbers": {
                    "description": "Additional Phone Numbers, per number per month",
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "cloud_e_fax_service": {
                    "description": "Cloud E-Fax Service, per number per month",
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "queue_supervisor_agent_license": {
                    "description": "Queue Supervisor/Agent License, per license per month",
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "toll_free_numbers": {
                    "description": "Toll Free Numbers, per number per month",
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "plan": {
                "description": "team = Team (Team Messaging); pro = Pro (Cloud Phone, Team Messaging); pro-plus = Pro+ (Phone, Message + Bring Your Own VoIP Phone); premium = Premium (Phone, Message with a VoIP Phone Included)",
                "enum": ["team", "pro", "pro-plus", "premium"],
                "type": "string"
              },
              "term": {
                "description": "36_month (default) = the published plan-card price. month_to_month is not quoted by this tool: it returns term_not_supported with a formal-quote link.",
                "enum": ["36_month", "month_to_month"],
                "type": "string"
              },
              "users": {
                "description": "Number of users. Above the service limit the tool answers formal_quote_required.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["users"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Budgetary estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d0809056e04e3980214e479221fdc9eb78fc88df6364886a48c5d1cf4b9b0b8"
        },
        {
          "name": "site_get",
          "title": "Get a page, post, product or story",
          "description": "Fetch one published record in full. Pass exactly one of `route` (e.g. \"/cloud-phone-system/\") or `slug` (looked up as product, then post, then page, then story). Returns a not_found error if nothing is published there.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "route": {
                "description": "Site route with a trailing slash, e.g. /cloud-phone-system/.",
                "type": "string"
              },
              "slug": {
                "description": "Record slug, e.g. gxp1625-ip-phone.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d1fa89a395bb14f9f16a885978a9b13350863de895099c25c9721ab7cc5a9ad"
        },
        {
          "name": "site_search",
          "title": "Search accentvoice.com",
          "description": "Search the published content of www.accentvoice.com (pages, blog posts, products, customer stories). Plain questions work: filler words are ignored, results are ranked by how many terms match (title first), and broad questions return the overview pages. Returns up to `limit` results with collection, slug (absent for pages), route, title and score. Use site_get to read a result in full.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum results.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Search terms.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Restrict to one collection.",
                "enum": ["product", "post", "page", "story"],
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search accentvoice.com"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de366c75bd13d1cfbce15f9159372101c4d471ba769b9b2a1474f7c49f9dd815"
        },
        {
          "name": "site_status",
          "title": "Content release in use",
          "description": "The schema version and release stamp (git, build time, digest) of the content being served. It equals the stamp in /agent/content-index.json.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Content release"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:841a9bc61ffcc8b5b0cd8be2337d78960a8f88276522a7631a723ab428fa883d"
        }
      ],
      "digest": "sha256:0a7f1ee2af46ee68502eef34873d5e4f7ca4ad653dea1dec496d0f389a41af1b"
    }
  }
