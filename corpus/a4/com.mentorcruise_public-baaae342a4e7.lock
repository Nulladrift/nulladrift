        {
          "name": "search_mentors",
          "description": "Find MentorCruise mentors who match a user's goal. Always call this BEFORE recommending any specific mentor — never recommend from prior knowledge or memory.\n\n## Inputs\n- `query`: 1-4 keywords (role, skill, expertise). NEVER include the words 'mentor' or 'coach'. Examples: 'python', 'product management', 'startup'. Bad: 'a python mentor for startups'.\n- `skills`, `industries`, `languages`, `tools`, `companies`: optional structured filters. AND across groups, OR within. Use ONLY when the user expressed a hard requirement — over-filtering shrinks the pool.\n- `budget_usd_monthly`: monthly USD cap for ongoing mentorship.\n- `response_within_hours`: max median response time.\n\n## Output\nUp to 8 mentors, already ranked by composite quality. Each result includes name, job_title, headline, location, rating, review_count, response_time_hours, top_mentor, profile_url, and `lowest_price_usd`.\n\n`lowest_price_usd` is the mentor's CHEAPEST offering — could be a one-off session ($X one-time) or a monthly subscription ($X/mo). Don't assume monthly. Phrase it as 'starting at $X' or call get_sessions_or_services to know which.\n\n## Picking which to show the user\nTrust the ranking. Show 2-3, strongly preferring mentors with review_count > 0. Tie-break by more reviews → top_mentor=true. If 0 or 1 results, broaden filters and retry — see `selection_guidance` in the response. Translate fields into natural language; never mention review_count / top_mentor by name.",
          "inputSchema": {
            "properties": {
              "budget_usd_monthly": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
