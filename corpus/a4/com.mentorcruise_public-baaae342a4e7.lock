        {
          "name": "create_booking_link",
          "description": "Generate booking deep-links for an ONGOING MENTORSHIP (subscription / PricingPlan). Returns:\n  - apply_url: where the user starts the subscription. Optional     plan_hash pre-selects a specific plan.\n  - inquiry_url: free question before committing (no booking).\n  - requires_intro_call: when true, the mentor offers an intro     call (free or paid – see intro_call_note). apply_url already     routes the user to the scheduler first — mention the intro     call when sharing it.\n\nIMPORTANT: this tool is for ongoing mentorships only. For ONE-OFF SESSIONS, use the `booking_url` from get_sessions_or_services directly — those bookings go through /sessions/<slug>/book/, NOT /apply/.\n\nThe user must click the link and sign in via the browser — this tool does NOT book on their behalf.",
          "inputSchema": {
            "properties": {
              "intent": {
                "default": "",
                "title": "Intent",
                "type": "string"
              },
              "plan_hash": {
