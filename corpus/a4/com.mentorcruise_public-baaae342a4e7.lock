                "default": null,
                "title": "Industries"
              },
              "languages": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Languages"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "response_within_hours": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Response Within Hours"
              },
              "skills": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Skills"
              },
              "tools": {
                "title": "Tools",
