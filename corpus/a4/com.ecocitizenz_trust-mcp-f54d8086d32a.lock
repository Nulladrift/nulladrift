{
  "lockfileVersion": 2,
  "subjects": {
    "com.ecocitizenz/trust-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://trust-mcp.ecocitizenz.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "eczid-trust-mcp",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ECZ-ID Trust: resolve ECZ-ID identifiers and evidence state via the public Resolver, explain exact canonical state, route to the single best next ECZ-ID product action, and (authenticated) create neutral Request-to-Resolve records. Results render ECZ-ID state exactly and never assert safety, approval, compliance or Microsoft certification. Local policy decides whether a signal is sufficient.",
      "tools": [
        {
          "name": "create_request_to_resolve",
          "title": "Create a neutral Request-to-Resolve (authenticated)",
          "description": "AUTHENTICATED: create a neutral, shareable request for independently re-checkable ECZ-ID evidence. Requires a Microsoft Entra bearer token with the RequestToResolve.Create scope (or app role). It never verifies a target, never sends messages, and absence of evidence is never rendered as unsafe.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "consent_mode": {
                "enum": ["link-only", "user-initiated-share"],
                "type": "string"
              },
              "idempotency_key": {
                "pattern": "^[A-Za-z0-9._-]{8,128}$",
                "type": "string"
              },
              "requested_evidence_category": {
                "pattern": "^[a-z][a-z0-9-]{1,60}$",
                "type": "string"
              },
              "resolver_ref": {
                "maxLength": 300,
                "type": "string"
              },
              "target_descriptor": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "target_type": {
                "enum": ["business", "agent", "mcp", "api", "software"],
                "type": "string"
              }
            },
            "required": ["consent_mode", "requested_evidence_category", "target_descriptor", "target_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:edc0221660bc2c8b59fef85cd255f8eeb62f82e21cfa8634daf11e191b66d966"
        },
        {
          "name": "explain_status",
          "title": "Explain ECZ-ID status",
          "description": "Deterministically render the exact ECZ-ID status using the claims-safe renderer (VERIFIED is an ECZ-ID state, not a Microsoft certification). Absence of evidence renders the approved neutral wording — never \"unsafe\". No LLM.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ecz_id": {
                "description": "ECZ-ID identifier. Parent, e.g. ECZ-GB-RBS1NW; or child Passport, e.g. ECZ-GB-RBS1NW::MCP_PASSPORT-ABC123",
                "maxLength": 64,
                "pattern": "^ECZ(-[A-Z0-9]{2,32}){1,4}(::[A-Z0-9][A-Z0-9_-]*-[0-9A-Z]{6})?$",
                "type": "string"
              }
            },
            "required": ["ecz_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f7895b836b19519732e64d26fcc1538a64147bd671da5b8e8182adb8b41a2f0a"
        },
        {
          "name": "find_product",
          "title": "Find the next best ECZ-ID action",
          "description": "Given narrow context flags, return ONE best next ECZ-ID product action (free/community routes win where correct; neutral context routes to free public verification).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "agent_concern": {
                "type": "boolean"
              },
              "business_identity_missing": {
                "type": "boolean"
              },
              "deeper_evidence_required": {
                "type": "boolean"
              },
              "developer_local_workflow": {
                "type": "boolean"
              },
              "implementation_assessment_needed": {
                "type": "boolean"
              },
              "mcp_concern": {
                "type": "boolean"
              },
              "multi_tenant_estate": {
                "type": "boolean"
              },
              "org_wide_governance": {
                "type": "boolean"
              },
              "software_supply_chain_evidence": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e7f132a4f75fdf04a7280059a5f412069d818dc106f988034607ff38d582cd28"
        },
        {
          "name": "get_current_state",
          "title": "Get current ECZ-ID state",
          "description": "Return the narrow current Resolver-derived state for an ECZ-ID (state, checked_at, Resolver link). No risk/safety/compliance inference.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ecz_id": {
                "description": "ECZ-ID identifier. Parent, e.g. ECZ-GB-RBS1NW; or child Passport, e.g. ECZ-GB-RBS1NW::MCP_PASSPORT-ABC123",
                "maxLength": 64,
                "pattern": "^ECZ(-[A-Z0-9]{2,32}){1,4}(::[A-Z0-9][A-Z0-9_-]*-[0-9A-Z]{6})?$",
                "type": "string"
              }
            },
            "required": ["ecz_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:33c22b995db31089966b0e426f4098ff8c458b2c45a41708a87424464d423605"
        },
        {
          "name": "get_install_instructions",
          "title": "Get official install routes",
          "description": "Return deterministic official install/discovery routes for an ECZ-ID product or surface (canonical URLs only; planned Microsoft surfaces carry no URLs).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product slug: mcp-trust | agent-trust | developer-trust | resolver | developer-gateway | trustops | mcp-services | msp",
                "pattern": "^[a-z][a-z0-9-]{1,40}$",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76394b033152f015e924f75b718ec482f4f11a7f7cf87bc9958443a570cb4ce5"
        },
        {
          "name": "get_resolver_link",
          "title": "Get Resolver proof link",
          "description": "Return the deterministic public Resolver proof/re-check URL for an ECZ-ID. No network call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ecz_id": {
                "description": "ECZ-ID identifier. Parent, e.g. ECZ-GB-RBS1NW; or child Passport, e.g. ECZ-GB-RBS1NW::MCP_PASSPORT-ABC123",
                "maxLength": 64,
                "pattern": "^ECZ(-[A-Z0-9]{2,32}){1,4}(::[A-Z0-9][A-Z0-9_-]*-[0-9A-Z]{6})?$",
                "type": "string"
              }
            },
            "required": ["ecz_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:583c85dc9bed8f131bdcc8b5cf5c84e5c105c33728c7768494075adeb60ae289"
        },
        {
          "name": "resolve_identity",
          "title": "Resolve an ECZ-ID",
          "description": "Resolve an ECZ-ID through the public ECZ-ID Resolver and return the exact canonical state with checked_at, Resolver proof link, re-check action and the local-policy caveat. Never asserts safety, approval or compliance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ecz_id": {
                "description": "ECZ-ID identifier. Parent, e.g. ECZ-GB-RBS1NW; or child Passport, e.g. ECZ-GB-RBS1NW::MCP_PASSPORT-ABC123",
                "maxLength": 64,
                "pattern": "^ECZ(-[A-Z0-9]{2,32}){1,4}(::[A-Z0-9][A-Z0-9_-]*-[0-9A-Z]{6})?$",
                "type": "string"
              }
            },
            "required": ["ecz_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff6cb5fceb259bb90ea764d95edcb55eeafa9c40feee2a10efd8348cffc53514"
        }
      ],
      "digest": "sha256:c0756430a39fbaf066397cc562a45ba85389276951e0af6f07895bdd24272c62"
    }
  }
}
