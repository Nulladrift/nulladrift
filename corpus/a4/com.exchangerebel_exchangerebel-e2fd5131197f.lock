          "description": "Poll the alerts view of a registered watch: the filings matching the watch's own rules that this service first saw since the cursor — new filings, /A amendments grouped to their base form, and deletion flags from weekly index reconciliation only. Paid via x402: $0.01 — RULED (10000 USDC units / 68000 SOL lamports) per delivered view — one poll delivers ALL matching events since the cursor, up to 200 per poll; it is NOT charged per event. Always call the free preflight first (same watch_id + cursor): GET /toll/secalerts/alerts/preflight returns the pending-event count only (no event content) — pending_count 0 is the complete free answer, so you never pay for an empty view. A settled poll that still delivers zero writes exactly one refund intent (net charge zero, cursor unmoved). If you lose a response, re-poll the same cursor within 7 days: the delivery record is re-served verbatim and free (redelivered: true). first_seen_at is ExchangeRebel's own detection timestamp — the moment this service first recorded the filing in its append-only store. The SEC publishes no availability timestamp, so no seller's first-seen time can be anything other than their own observation. For a filer's first-ever touch, the store is seeded from the filer's returned history and first_seen_at is the seed time (records carry seeded:true). Deletion flags are issued only for removals confirmed by the weekly full-index reconciliation: a deletion_flag event is produced only from a record whose provenance marks it weekly-index-reconciliation-sourced. Removals noticed when a single filer's submissions record is re-read are never issued as deletion alerts by this service. Until the weekly reconciliation is wired to the live store, deletion flags do not fire in production. Honest crossover: polls cost $0.01 (ruled price) per delivered alerts view. A caller whose watches deliver about 500 events a month is spending about $5.00 a month here — the price of Datamule's $5/month 