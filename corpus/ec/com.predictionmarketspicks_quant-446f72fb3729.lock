        {
          "name": "stress_test_strategy",
          "title": "Strategy Stress Test",
          "description": "Paste a prediction-market trade history (or just trades, wins and average price) and get whether the edge is statistically real, how many trades would prove it, and where it leaks. The verdict reads net per dollar staked after fees, never a pooled win rate, with the bar raised for every strategy version tried. Accepts positions, a CSV, or Kalshi's realized P&L export (lots are grouped into positions). Nothing you paste is stored.",
          "inputSchema": {
            "properties": {
              "avg_price_c": {
                "description": "Quick check: average price paid per contract, ¢ (1–99).",
                "type": ["number", "string"]
              },
              "csv": {
                "description": "CSV text instead of trades: header price_c,contracts,won,fee_c,at,venue,maker (one row per position), or Kalshi's realized P&L export. Up to 10,000 lines.",
                "type": "string"
              },
              "maker": {
                "description": "Quick check: maker fills (Kalshi maker fee).",
                "type": "boolean"
              },
              "strategies_tried": {
                "description": "How many versions you tried before this one (default 1). More tries raise the bar (Bonferroni).",
                "type": ["number", "string"]
              },
              "trades": {
                "description": "EITHER an array of positions [{ price_c (1–99, price paid per contract), contracts?, won (true | false | null = closed before settlement, then give net_c), fee_c? (total fee, ¢), net_c?, at? (ISO), venue? (kalshi | polymarket | other), maker? }] OR, for a quick check, the number of trades (with wins and avg_price_c)."
              },
              "venue": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["kalshi", "polymarket", "other"],
                    "type": "string"
                  }
                ],
                "description": "Venue for fees when none are given: kalshi (fee computed), polymarket or other (fee 0, flagged). One of: kalshi · polymarket · other."
              },
              "wins": {
                "description": "Quick check: how many of the trades won.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "buckets": {
                "description": "Per price bucket: n, win %, break-even %, net ¢/contract."
              },
              "data_freshness": {},
              "example_call": {},
              "headline": {
                "description": "One plain sentence: the verdict."
              },
              "needs_input": {},
              "sources": {},
              "tell_user": {
                "description": "Show this sentence to the user first.",
                "type": "string"
              },
              "timestamp": {
                "type": "string"
              },
              "trades_needed": {
                "description": "Trades that would settle it, or null."
              },
              "verdict": {
                "description": "edge_confirmed / losing / not_proven_yet (net per dollar staked)."
              }
            },
            "type": "object"
          },
