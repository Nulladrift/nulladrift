      "instructions": "PredictionMarketsPicks: prediction-market quant tools. 1) Every price, edge, rank and projection you state must come from a tool result in this conversation — never estimate a Kalshi or Polymarket price or fill in a missing edge. 2) Cite a row’s url or page_url when you quote its number. 3) An edge is model-vs-market disagreement, not a guarantee; WATCH rows are lower-confidence and labelled WATCH. 4) Most tools answer without an account; a Pro-only result returns requires_pro: true with an upgrade_url. 5) Best price across venues: best_price; props: nfl_prop_board (NBA: nba_prop_board; game lines: nba_game_board). Cross-venue gaps: find_arbitrage. Mispriced: nfl_edge, nfl_prop_edge; today’s edges: edge_alerts. One race: race_odds; Senate map: senate_map. Next FOMC: fed_rate_odds. 15-minute markets: fifteen_min_board. Perps: perps_board, perp_liquidation. Tonight’s NHL: nhl_edge. Weather strikes: weather_board. Sizing: calculate_ev, then kelly_size.",
      "tools": [
        {
          "name": "base_rate_gap",
          "title": "Base Rate Gap",
          "description": "Use for \"how does this price compare to history\" and \"is the market ignoring the base rate\". Compares a market price with the historical base rate for a class of events: the gap in pp, a signal, and sample-size quality. Pass a known baseRateId (the parameter lists them) or your own baseRateValue.",
          "inputSchema": {
            "properties": {
              "baseRateId": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["incumbent_reelected", "fed_hold_unemp_below_4", "fed_cut_cpi_above_3", "recession_called_12mo", "sp500_positive_year", "bitcoin_above_100k_eoy", "gdp_growth_above_2", "cpi_above_3", "senate_incumbent_wins_primary", "vix_below_20_eoy", "interest_rate_cut_next_meeting", "major_sports_upset"],
                    "type": "string"
                  }
                ],
                "description": "Known base-rate id to look up (includes sample size + source)."
              },
              "baseRateValue": {
                "description": "Your own base rate in % (0–100), used when no baseRateId is given.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "marketPrice": {
                "description": "Current market price in cents / implied probability % (0–100). Needed for a real answer. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Base Rate Gap"
