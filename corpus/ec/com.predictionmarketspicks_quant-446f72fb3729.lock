        {
          "name": "combo_edge",
          "title": "Combo Edge Verdict",
          "description": "Use for \"price a same-game NFL and NBA combo\" and \"is this combo worth it\". Pass nflGame (\"NYG-LAR\", \"Giants vs Rams\") to list that game's Kalshi legs — moneyline, spreads, totals, player props — then legIds to price your pick with the correlation done for you. Or pass legPrices + trueWinProbability for a fair band; add offeredOdds for EV and a verdict. Free.",
          "inputSchema": {
            "properties": {
              "kind": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["game", "prop"],
                    "type": "string"
                  }
                ],
                "description": "With nflGame: \"game\" = all game lines, \"prop\" = props only. One of: game · prop."
              },
              "legIds": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "2–6 leg ids from a previous nflGame call (array or comma-separated string)."
              },
              "legPrices": {
                "description": "Each leg's YES price in cents (1–99). Omit with nflGame + legIds.",
                "items": {
                  "maximum": 99,
                  "minimum": 1,
                  "type": "number"
                },
                "minItems": 2,
                "type": "array"
              },
              "limit": {
                "description": "With nflGame: max props listed (default 40, max 200).",
                "type": ["number", "string", "null"]
              },
              "nbaGame": {
                "description": "An NBA game on tonight's board, as \"AWAY-HOME\" (e.g. \"BOS-DET\"). Same doors as nflGame.",
                "type": "string"
              },
              "nflGame": {
                "description": "An NFL game on the live board, as \"AWAY-HOME\" (e.g. \"NYG-LAR\"). Alone: lists its legs with ids, trimmed (narrow with player/stat/kind/limit). With legIds: prices that exact combo.",
                "type": "string"
              },
              "novigMarket": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["pregame", "live", "futures"],
                    "type": "string"
                  }
                ],
                "description": "With venue novig: pregame (default), live or futures. Sets the fee. One of: pregame · live · futures."
              },
              "offeredAmerican": {
                "description": "Alias for offeredOdds; offeredOdds wins if both are sent.",
                "type": "number"
              },
              "offeredOdds": {
                "description": "The combo price you are quoted — American odds (-150, 988) or a decimal multiplier (10.7). Omit for fair value only.",
                "type": "number"
              },
              "player": {
                "description": "With nflGame: every strike for a player whose name contains this (e.g. \"Mariota\").",
                "type": "string"
              },
              "stat": {
                "description": "With nflGame: props of one stat (e.g. \"rec_yds\").",
                "type": "string"
              },
              "trueWinProbability": {
                "description": "Your estimate that all legs hit, in % (0–100). Omit with nflGame + legIds — we compute it.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "venue": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["kalshi", "polymarket-us", "novig"],
                    "type": "string"
                  }
                ],
                "description": "Where you would trade it: kalshi, polymarket-us or novig. Default kalshi. One of: kalshi · polymarket-us · novig."
              }
            },
            "type": "object"
          },
