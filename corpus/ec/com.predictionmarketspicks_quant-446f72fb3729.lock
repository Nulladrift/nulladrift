        {
          "name": "explain_player",
          "title": "Explain This Price — why we price a player’s strikes there",
          "description": "Why our model prices an NFL player's Kalshi prop strikes where it does this week: the projection, The Ladder's verdict, the widest published gap, and what the model does not account for (our number only where calibrated, 30–70%). Use for \"why do you price <player> there\", \"explain <player>'s prop\".",
          "inputSchema": {
            "properties": {
              "player": {
                "description": "Player name, full or partial (e.g. \"Puka Nacua\").",
                "type": "string"
              },
              "stat": {
                "description": "Optional stat to narrow to, e.g. \"rec_yds\", \"receptions\", \"rush_yds\".",
                "type": "string"
              }
            },
            "type": "object"
