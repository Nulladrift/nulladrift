{
  "lockfileVersion": 2,
  "subjects": {
    "app.dotquad/dotquad": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.dotquad.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dotquad",
        "title": "Dotquad",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Dotquad's network tools: IP lookup (one address or a batch), DNS, DNSSEC, WHOIS, blacklist, TLS and security headers, email authentication, a domain report card combining them, a link safety check, a subdomain takeover check, ASN, traceroute and a subnet calculator. Every call needs the user's API key (a free one works) and counts as one request on their plan; a batch counts one per address. Batch lookups and privacy detection need the Starter plan or higher. Traceroute is slow and limited to a few an hour, so only run it when the user wants the route. Answers include the data source behind each field; mention it when accuracy matters.",
      "tools": [
        {
          "name": "batch_lookup",
          "title": "Batch IP lookup",
          "description": "The IP lookup for up to 100 addresses at once, in the order given, with privacy detection. Each valid address counts as one request. Needs the Starter plan or higher: on Free it answers with the plan that includes it.",
          "inputSchema": {
            "properties": {
              "ips": {
                "description": "IPv4 or IPv6 addresses, e.g. [\"8.8.8.8\", \"1.1.1.1\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              }
            },
            "required": ["ips"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3a9096926342f281cdf35dfd5b42c61842b489340402e4b6531b42042e799b6e"
        },
        {
          "name": "blacklist_check",
          "title": "Blacklist check",
          "description": "Whether an IPv4 address, or a domain's mail servers, are on the DroneBL or PSBL blocklists, with the reason and a removal link for each listing.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "An IPv4 address or a domain",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7d22742103dc831ccf29a7af4d86032ed588f116a6cf87037ee9698d766bbe70"
        },
        {
          "name": "dns_lookup",
          "title": "DNS lookup",
          "description": "DNS records (A, AAAA, CNAME, MX, NS, TXT, SOA, CAA) for a domain or hostname, or reverse DNS with a forward check for an IP address.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A domain, hostname or IP address",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4456e7659c26ec4aa4a0d3ed234e1d7b2abf10572274ba75df051bfba6a571ba"
        },
        {
          "name": "dnssec_check",
          "title": "DNSSEC check",
          "description": "Validates a domain's DNSSEC chain of trust from the root down, zone by zone: secure, insecure (not signed) or bogus (broken), with the reason for any failure.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "A domain or hostname",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a291d4a1e7d723878386ea34f9a8e17d130355d94981676e91fbae2a219ed6f6"
        },
        {
          "name": "domain_report",
          "title": "Domain report card",
          "description": "One graded report for a domain: HTTPS and security headers, email authentication (SPF, DKIM, DMARC, MTA-STS), DNSSEC, DNS (nameservers, CAA, IPv6) and registration (expiry, transfer lock), each with a grade, a summary and the problems to fix, plus an overall A+ to F grade. Use the separate checks for full detail on one area.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "A domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2f3de5f4c8c5bf37bf285e7f87e2a7f6faf9a6ccf2940f9964a26d58f4c3ed3d"
        },
        {
          "name": "email_check",
          "title": "Email authentication check",
          "description": "Checks a domain's email authentication: SPF (every include followed and the 10-lookup limit counted), DMARC, DKIM keys at common selectors (or the ones given), MTA-STS, TLS-RPT and BIMI, with an A+ to F grade, whether the domain can be spoofed, and a fix for each problem.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "A domain, e.g. example.com",
                "type": "string"
              },
              "selectors": {
                "description": "Optional DKIM selectors to check, e.g. from the s= tag of a DKIM-Signature header",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0692fa24f3b41c02d40bb376140d486f530601b660fa10a2ee8e72b4fed77e12"
        },
        {
          "name": "link_check",
          "title": "Is this link safe?",
          "description": "Warning signs in a web link before anyone clicks it: a destination hidden with @, a bare IP, look-alike or misspelled brand names, mixed alphabets, where its redirects really lead, how old the sites are and whether the final site's certificate is valid. Each sign is danger, warning, info or good. It isn't a phishing or malware list, so no warning signs isn't a guarantee. Redirects are followed with HEAD requests, so don't pass single-use links such as password resets.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The link, e.g. https://bit.ly/abc123",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f25d01ba5dd25d3e1cf3d145741756cf1ad990e32ea8df148f10226d16d1f44"
        },
        {
          "name": "lookup_asn",
          "title": "ASN lookup",
          "description": "Owner, country and every announced IP prefix for an autonomous system number.",
          "inputSchema": {
            "properties": {
              "asn": {
                "description": "An ASN such as 13335 or AS13335",
                "type": "string"
              }
            },
            "required": ["asn"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dc8e77930b0f3d32157efa83e4f77885dbcec09ed5e434145f6fee45c870ddb9"
        },
        {
          "name": "lookup_ip",
          "title": "IP lookup",
          "description": "Location, network (ASN and owner), reverse DNS hostname and timezone for an IPv4 or IPv6 address, with the data source behind each field. Set abuse to true to also get the address's abuse contact from its registry (slower). Privacy detection (VPN, proxy, Tor, hosting) fills the privacy field on the Starter plan and up; on Free it's null.",
          "inputSchema": {
            "properties": {
              "abuse": {
                "description": "Also fetch the abuse contact email",
                "type": "boolean"
              },
              "ip": {
                "description": "An IPv4 or IPv6 address, e.g. 8.8.8.8",
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c27417830b2efa30c2ff1f90868328e230ee8c23507e0c0255c62a8d7066cd1e"
        },
        {
          "name": "subnet",
          "title": "Subnet calculator",
          "description": "Exact subnet math for an IPv4 or IPv6 block: network and last address, netmask, wildcard and broadcast (IPv4), usable host range and count, and what kind of range it is (private, documentation, public…). Set split_prefix to list the smaller subnets the block divides into. Arithmetic only: it reaches nothing outside Dotquad.",
          "inputSchema": {
            "properties": {
              "cidr": {
                "description": "A block such as 10.0.0.0/24 or 2001:db8::/48, an address and netmask such as 192.168.1.10 255.255.255.0, or a bare address",
                "type": "string"
              },
              "split_prefix": {
                "description": "Split the block into subnets of this prefix length (lists the first 256)",
                "type": "integer"
              }
            },
            "required": ["cidr"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eae14728b81635f4c92777eb1e306350f789b04c89f91f82d14539b85a814d97"
        },
        {
          "name": "takeover_check",
          "title": "Subdomain takeover check",
          "description": "Looks for subdomains someone else could take over: tries about 50 common subdomain names (www, blog, shop, docs, status, staging and more) plus any given, follows each CNAME, and flags aliases to cloud resources that no longer exist where anyone can claim the name (Azure, Elastic Beanstalk) or into unregistered domains. Aliases to services where only the page can tell (GitHub Pages, S3, Heroku) are listed to check. DNS only; certificate logs aren't searched, so pass known subdomains in names.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "A domain, e.g. example.com",
                "type": "string"
              },
              "names": {
                "description": "Optional subdomains to check as well, e.g. [\"shop\", \"old-blog\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:89e88a1f6ae0dd7f92851ffb9fe50473d2e143c9937654322ea05370ac3ae40b"
        },
        {
          "name": "tls_check",
          "title": "TLS and security headers check",
          "description": "Checks a website's HTTPS on port 443: the certificate (expiry, issuer, chain, whether browsers trust it), which TLS versions it accepts, whether HTTP redirects to HTTPS, and its security headers (HSTS, CSP and others), with an A+ to F grade and a fix for each problem.",
          "inputSchema": {
            "properties": {
              "host": {
                "description": "A domain or public IP address, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4780cdbba8e5042d0c99208636b706fe1467e2ba4be610d9d53855809690e7e9"
        },
        {
          "name": "traceroute",
          "title": "Traceroute",
          "description": "The route packets take from Dotquad's server to a hostname or public IP address: each router hop with its round-trip time, reverse DNS name, network (ASN and owner) and approximate location. Takes up to a minute. Limited by plan (5 traces an hour on Free, up to 100 on Business), one at a time.",
          "inputSchema": {
            "properties": {
              "target": {
                "description": "A hostname or public IP address, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7777155b840ac090ae24ecdb6f9183902a947fa554c576aec7543ad2fd2a3e78"
        },
        {
          "name": "usage",
          "title": "Usage",
          "description": "Your Dotquad plan and how many requests you've used and have left this month.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:65ae525ebeb9502adfcf18b179d665435b57f0d2cf61081e96c472107b5c62ae"
        },
        {
          "name": "whois",
          "title": "WHOIS",
          "description": "The registration record for a domain, IP address or ASN: holder, registrar, dates, status, nameservers and contacts, as the registry publishes them.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A domain, IP address or ASN such as AS13335",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5cea7987b740156f27175d632b84a28c71b71aa8e02fffa80dc645e376521391"
        }
      ],
      "digest": "sha256:db467881231f0c97e32eacab16ca8dafa43a74812faa445cc19e01b2f6d156d7"
    }
  }
}
