{
  "lockfileVersion": 2,
  "subjects": {
    "app.flowershow/flowershow": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://flowershow.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "flowershow",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "publish",
          "title": "Publish to Flowershow",
          "description": "Publish files as a live website on Flowershow and get a shareable URL. Use when the user says \"publish this\", \"put this online\", \"make this a website\", \"share this as a page\" or \"host this\".\n\nAccepts Markdown (.md, rendered as a styled page with navigation), HTML (.html, served as-is) and supporting files such as CSS, JS, JSON and images: one page or a small site, up to 50 files and 3 MB per call. Name the home page index.md or index.html.\n\nAnyone with the link can see what you publish. When you publish, tell the user every path you are sending (and any paths in delete) and which site they go to: a new site, or the one being updated. Stop and ask before calling publish only when it matters: a file looks private or sensitive (drafts, personal notes, keys or passwords, data with people's names or emails), the call removes files (with delete or replaceWholeSite) the user didn't ask to remove, it would create a new site when the user meant to update one, or the set of files differs from what the user asked to publish. If the user already named the files, asked for the removal or said to go ahead, that is their yes.\n\nWithout an account this creates a new site that expires in 7 days and returns a claim link: always show the user the live URL and the claim link exactly as returned, so they can keep the site. To update that site later in the conversation, call publish again with its siteId and claimToken and only the files you changed or added: files you don't send are kept as they are. To remove pages or files, list their paths in delete (files can then be empty). Only when the user explicitly asks to start the site over, set replaceWholeSite to true: the files you send become the whole site and every other file is removed. If that would remove existing files, the call is refused and tells you how many and which; ask the user, then call again with confirmDeleteCount set to that number.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "claimToken": {
                "description": "The claimToken returned when the anonymous site was created (needed with siteId when not signed in)",
                "type": "string"
              },
              "confirmDeleteCount": {
                "description": "With replaceWholeSite: the number of existing files the replace will remove, as reported by the refused first call. Set it only after the user has confirmed.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "delete": {
                "description": "Paths of existing files to remove from the site (with siteId), e.g. [\"old-page.md\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "files": {
                "description": "Files to add or update. When updating a site, send only the files that changed; other files are kept. Can be empty when only deleting.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Text content (UTF-8)",
                      "type": "string"
                    },
                    "contentBase64": {
                      "description": "Binary content, base64-encoded (images etc.)",
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path, e.g. \"index.html\" or \"img/logo.png\"",
                      "type": "string"
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "type": "array"
              },
              "replaceWholeSite": {
                "description": "Set true only when the user asks to start the site over: the files sent become the whole site and all other files are permanently removed. Never use it to update a few pages. Default false.",
                "type": "boolean"
              },
              "siteId": {
                "description": "Update this existing site instead of creating a new one",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claimToken": {
                "type": "string"
              },
              "claimUrl": {
                "type": "string"
              },
              "expiresAt": {
                "type": "string"
              },
              "liveUrl": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "siteId": {
                "type": "string"
              }
            },
            "required": ["liveUrl", "message", "siteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish to Flowershow"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:efa7997ef6148b2a743e2cd012143a36742cc427ae9b2066a8d88ddad553af7c"
        }
      ],
      "digest": "sha256:ff2609edc8d55a208d439615afe15d4ca289da79c9897c6ad847884151fef5f6"
    }
  }
}
