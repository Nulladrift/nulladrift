          "digest": "sha256:a559e7aef0725863c6c6c142ae05700c89a7bcf70d84855f64376acefb6bbae6"
        },
        {
          "name": "list-files",
          "title": "List the files on a Flowershow site",
          "description": "List the files currently on one of the signed-in user's Flowershow sites: each path, its size in bytes and when it last changed. Use it before updating a site in a new conversation, to see which pages exist, pick the right paths to update or delete, and avoid duplicating a page under a new name. Get siteId from list-sites. Returns up to 1000 paths; for bigger sites, pass folder to list one folder at a time. If the user is not signed in yet, calling it asks them to sign in to Flowershow first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "folder": {
                "description": "Only list files in this folder (and its subfolders), e.g. \"blog\"",
                "type": "string"
              },
              "siteId": {
                "description": "siteId of the site, from list-sites",
                "type": "string"
              }
            },
            "required": ["siteId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "files": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "path": {
                      "type": "string"
                    },
                    "size": {
                      "type": "number"
                    },
                    "updatedAt": {
                      "type": "string"
                    }
                  },
                  "required": ["path", "size", "updatedAt"],
                  "type": "object"
                },
                "type": "array"
              },
              "siteId": {
                "type": "string"
              },
              "total": {
                "type": "number"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["files", "siteId", "total", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the files on a Flowershow site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["sites:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:48f9081aeef5e2e6defee8fdf26b7cb925bf9de4ea1df1797b095756598d3b83"
        },
        {
          "name": "list-sites",
          "title": "List my Flowershow sites",
          "description": "List the sites in the signed-in Flowershow account and sites shared with it (role editor), with their siteId (use it with list-files to see what a site has, and with publish to update it), URL and when each was last published. If the user is not signed in yet, calling it asks them to sign in to Flowershow first.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "sites": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "lastPublishedAt": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "type": "string"
                    },
                    "owner": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["owner", "editor"],
                      "type": "string"
                    },
                    "siteId": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["lastPublishedAt", "name", "owner", "role", "siteId", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["sites"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["sites:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:a8fd758d143568fbbe5759e313b52b464b07da4d44f7b0a1eb6bd58e5de6faf7"
        },
        {
          "name": "publish",
          "title": "Publish to Flowershow",
          "description": "Publish files as a live website on Flowershow and get a shareable URL. Use when the user says \"publish this\", \"put this online\", \"make this a website\", \"share this as a page\" or \"host this\".\n\nAccepts Markdown (.md, rendered as a styled page with navigation), HTML (.html, served as-is) and supporting files such as CSS, JS, JSON and images: one page or a small site, up to 50 files and 3 MB per call. Name the home page index.md or index.html.\n\nAnyone with the link can see what you publish. When you publish, tell the user every path you are sending (and any paths in delete) and which site they go to: a new site, or the one being updated. Stop and ask before calling publish only when it matters: a file looks private or sensitive (drafts, personal notes, keys or passwords, data with people's names or emails), the call removes files (with delete or replaceWholeSite) the user didn't ask to remove, it would create a new site when the user meant to update one, or the set of files differs from what the user asked to publish. If the user already named the files, asked for the removal or said to go ahead, that is their yes.\n\nWithout an account this creates a new site that expires in 7 days and returns a claim link: always show the user the live URL and the claim link exactly as returned, so they can keep the site. To update that site later in the conversation, call publish again with its siteId and claimToken and only the files you changed or added: files you don't send are kept as they are. To remove pages or files, list their paths in delete (files can then be empty). Only when the user explicitly asks to start the site over, set replaceWholeSite to true: the files you send become the whole site and every other file is removed. If that would remove existing files, the call is refused and tells you how many and which; ask the user, then call again with confirmDeleteCount set to that number.\n\nTo keep a site in the user's Flowershow account, call claim-site; to work with sites already in their account, use list-sites, list-files and read-file. Those tools ask the user to sign in to Flowershow first; after that, publish goes into their account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "claimToken": {
                "description": "The claimToken returned when the anonymous site was created (needed with siteId when not signed in)",
                "type": "string"
              },
              "confirmDeleteCount": {
                "description": "With replaceWholeSite: the number of existing files the replace will remove, as reported by the refused first call. Set it only after the user has confirmed.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "delete": {
                "description": "Paths of existing files to remove from the site (with siteId), e.g. [\"old-page.md\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "files": {
                "description": "Files to add or update. When updating a site, send only the files that changed; other files are kept. Can be empty when only deleting.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Text content (UTF-8)",
                      "type": "string"
                    },
                    "contentBase64": {
                      "description": "Binary content, base64-encoded (images etc.)",
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path, e.g. \"index.html\" or \"img/logo.png\"",
                      "type": "string"
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "type": "array"
              },
              "replaceWholeSite": {
                "description": "Set true only when the user asks to start the site over: the files sent become the whole site and all other files are permanently removed. Never use it to update a few pages. Default false.",
                "type": "boolean"
              },
              "siteId": {
                "description": "Update this existing site instead of creating a new one",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claimToken": {
                "type": "string"
              },
              "claimUrl": {
                "type": "string"
              },
              "expiresAt": {
                "type": "string"
              },
              "liveUrl": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "siteId": {
                "type": "string"
              }
            },
            "required": ["liveUrl", "message", "siteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish to Flowershow"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["sites:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:94965ac825fb8fb0803f734eb07768fc5c21e49f47d0109e5bbb48de6ecbdbbe"
        },
        {
          "name": "read-file",
          "title": "Read a file on a Flowershow site",
          "description": "Get the current text of one file on one of the signed-in user's Flowershow sites, e.g. index.md. Use it before changing a page that is already on the site, then publish the whole updated file, so the parts you didn't mean to change stay as they are. Text files only (Markdown, HTML, CSS, JS, JSON, ...), up to 256 KB. Get siteId from list-sites and paths from list-files. If the user is not signed in yet, calling it asks them to sign in to Flowershow first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "path": {
                "description": "Path of the file, as returned by list-files",
                "type": "string"
              },
              "siteId": {
                "description": "siteId of the site, from list-sites",
                "type": "string"
              }
            },
            "required": ["path", "siteId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "type": "string"
              },
              "path": {
                "type": "string"
              },
              "siteId": {
                "type": "string"
              }
            },
            "required": ["content", "path", "siteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a file on a Flowershow site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["sites:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:2075f4b09798d7a82c1570831c29655b7103e3d2e4617a95c91ca1a61cab3368"
        }
      ],
      "digest": "sha256:7e0068d27196569b69be210b2322cce12644d1aca9afe210b8b329d1bbfaf40b"
    }
  }
