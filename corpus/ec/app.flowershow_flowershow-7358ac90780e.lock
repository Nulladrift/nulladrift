        {
          "name": "claim-site",
          "title": "Keep an anonymous site",
          "description": "Move an anonymous site published earlier in this conversation into the signed-in user's Flowershow account, so it no longer expires and can be updated with publish using siteId alone. Use when the user wants to keep a site that was published without an account. Needs the siteId and claimToken returned by that earlier publish. If the user is not signed in yet, calling it asks them to sign in to Flowershow first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "claimToken": {
                "description": "claimToken returned when the anonymous site was created",
                "type": "string"
              },
              "siteId": {
                "description": "siteId of the anonymous site",
                "type": "string"
              }
            },
            "required": ["claimToken", "siteId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "liveUrl": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "siteId": {
                "type": "string"
              }
            },
            "required": ["liveUrl", "message", "name", "siteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Keep an anonymous site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
