        {
          "name": "translate_subtitles",
          "title": "Translate subtitles and make a dub script",
          "description": "Translates subtitles or a saved transcript into another language and writes a dub script. Best for: \"translate these subtitles to Spanish\", \"make a French dub script for my talk\". Returns: translated SRT and VTT with the original times, and a dub script with one spoken line per segment, its start and end, max_chars and a fit of ok, tight or long (trim with include). Nothing is stored. Input tips: always pass target_lang. Give exactly one of transcript_id (with library_id when transcribe_media returned one) or subtitles, the text of an SRT or VTT file. With subtitles also pass source_lang and confirm_rights true, only after the user says they own the media or may use it. Limits: about 18,000 characters per call (about 20 minutes of speech) and a daily allowance of characters. Not for: transcribing audio; use transcribe_media first. Translation is machine output to check before publishing.",
          "inputSchema": {
            "additionalProperties": false,
            "dependentRequired": {
              "subtitles": ["source_lang", "confirm_rights"]
            },
            "oneOf": [
              {
                "required": ["transcript_id"]
              },
              {
                "required": ["subtitles"]
              }
            ],
            "properties": {
              "confirm_rights": {
                "description": "true, and only after the user has said they own this recording or have the rights to translate it. Required with subtitles; false is refused with rights_not_confirmed.",
                "type": "boolean"
              },
              "include": {
                "description": "What to return (default all three): translated SRT captions, translated VTT captions, a dub script with one spoken line per segment.",
                "items": {
                  "enum": ["srt", "vtt", "dub_script"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "library_id": {
                "description": "The library_id an earlier transcribe_media answer returned, such as lib_9b6a98861ea4f54bff8f5cf1. It names the set of transcripts that call saved. Pass it when that answer had one; leave it out when it was null or absent.",
                "pattern": "^lib_[0-9a-f]{24}$",
                "type": "string"
              },
              "source_lang": {
                "description": "Language of the text, as a two-letter code such as en. Required with subtitles; for a transcript the detected language is used when left out.",
                "enum": ["af", "am", "ar", "ast", "az", "ba", "be", "bg", "bn", "br", "bs", "ca", "ceb", "cs", "cy", "da", "de", "el", "en", "es", "et", "fa", "ff", "fi", "fr", "fy", "ga", "gd", "gl", "gu", "ha", "he", "hi", "hr", "ht", "hu", "hy", "id", "ig", "ilo", "is", "it", "ja", "jv", "ka", "kk", "km", "kn", "ko", "lb", "lg", "ln", "lo", "lt", "lv", "mg", "mk", "ml", "mn", "mr", "ms", "my", "ne", "nl", "no", "ns", "oc", "or", "pa", "pl", "ps", "pt", "ro", "ru", "sd", "si", "sk", "sl", "so", "sq", "sr", "ss", "su", "sv", "sw", "ta", "th", "tn", "tr", "uk", "ur", "uz", "vi", "wo", "xh", "yi", "yo", "zh", "zu"],
                "type": "string"
              },
              "subtitles": {
                "description": "The full text of an SRT or WebVTT file the user owns or may use, with timing lines such as 00:00:01,000 --> 00:00:03,000. Give exactly one of transcript_id or subtitles. With subtitles, source_lang and confirm_rights true are required.",
                "maxLength": 60000,
                "type": "string"
              },
              "target_lang": {
                "description": "Language to translate into, as a two-letter code such as es, fr, de, ja, ar or hi.",
                "enum": ["af", "am", "ar", "ast", "az", "ba", "be", "bg", "bn", "br", "bs", "ca", "ceb", "cs", "cy", "da", "de", "el", "en", "es", "et", "fa", "ff", "fi", "fr", "fy", "ga", "gd", "gl", "gu", "ha", "he", "hi", "hr", "ht", "hu", "hy", "id", "ig", "ilo", "is", "it", "ja", "jv", "ka", "kk", "km", "kn", "ko", "lb", "lg", "ln", "lo", "lt", "lv", "mg", "mk", "ml", "mn", "mr", "ms", "my", "ne", "nl", "no", "ns", "oc", "or", "pa", "pl", "ps", "pt", "ro", "ru", "sd", "si", "sk", "sl", "so", "sq", "sr", "ss", "su", "sv", "sw", "ta", "th", "tn", "tr", "uk", "ur", "uz", "vi", "wo", "xh", "yi", "yo", "zh", "zu"],
                "type": "string"
              },
              "transcript_id": {
                "description": "The transcript_id from transcribe_media, such as tr_a6f8c87a9b2eb748. Give exactly one of transcript_id or subtitles.",
                "pattern": "^tr_[0-9a-f]{16}$",
                "type": "string"
              }
            },
            "required": ["target_lang"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "The UTC day of the answer, such as 2026-10-10.",
                "format": "date",
                "type": "string"
              },
              "cue_count": {
                "description": "Caption cues translated.",
                "minimum": 0,
                "type": "integer"
              },
              "dub_model": {
                "description": "Present when some dub lines were shortened by this model.",
                "type": "string"
              },
              "dub_script": {
                "items": {
                  "properties": {
                    "end": {
                      "description": "End, in seconds from the beginning of the recording.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "fit": {
                      "description": "ok fits the time, tight is up to 15% over max_chars, long is further over and needs a shorter line.",
                      "enum": ["ok", "tight", "long"],
                      "type": "string"
                    },
                    "max_chars": {
                      "description": "Characters that can be spoken in the segment at a typical pace.",
                      "type": "integer"
                    },
                    "start": {
                      "description": "Start, in seconds from the beginning of the recording.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "text": {
                      "description": "The spoken line in the target language.",
                      "type": "string"
                    }
                  },
                  "required": ["end", "fit", "max_chars", "start", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "model": {
                "description": "The translation model, such as @cf/meta/m2m100-1.2b.",
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "properties": {
                  "kind": {
                    "description": "What was translated.",
                    "enum": ["transcript", "subtitles"],
                    "type": "string"
                  },
                  "language": {
                    "description": "Source language code, such as en.",
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "transcript_id": {
                    "description": "Id of a saved transcript, for suggest_clips and translate_subtitles.",
                    "pattern": "^tr_[0-9a-f]{16}$",
                    "type": "string"
                  }
                },
                "required": ["kind", "language"],
                "type": "object"
              },
              "srt": {
                "description": "Translated SRT captions with the original times (when include has srt).",
                "type": "string"
              },
              "status": {
                "description": "ok: the text was translated. A refused call returns no object, only an error text such as \"transcript_not_found: ...\" that says what to do next.",
                "enum": ["ok"],
                "type": "string"
              },
              "target": {
                "properties": {
                  "code": {
                    "description": "Target language code, such as es.",
                    "type": "string"
                  },
                  "name": {
                    "description": "Its English name, such as Spanish.",
                    "type": "string"
                  }
                },
                "required": ["code", "name"],
                "type": "object"
              },
              "usage": {
                "properties": {
                  "characters_charged": {
                    "description": "Characters this call used from today's allowance.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "characters_left_today": {
                    "description": "Characters the caller can still translate today (UTC).",
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["characters_charged", "characters_left_today"],
                "type": "object"
              },
              "vtt": {
                "description": "Translated WebVTT captions with the original times (when include has vtt).",
                "type": "string"
              }
            },
            "required": ["as_of", "cue_count", "model", "notes", "source", "status", "target", "usage"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
