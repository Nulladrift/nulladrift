        {
          "name": "publish_board",
          "title": "Publish a board",
          "description": "Publishes a board and returns a link that opens it in the user's browser. Call check_board first. A board with errors is not published: the problems come back instead. With narration_language, the :::say blocks are voiced, so that the presentation plays with a voice. Give the link to the user exactly as returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "autoplay": {
                "description": "true: the link opens the board straight in the presentation player, which plays it step by step (for a presentation, an explainer, a video lesson). Leave it out for a board to look at and work on.",
                "type": "boolean"
              },
              "narration_language": {
                "description": "The language of the :::say blocks, to voice them with the site's voice of that language. Leave it out for a board without narration, or to leave the voicing to the teacher.",
                "enum": ["ru", "uk", "en", "fr", "es", "it", "pl"],
                "type": "string"
              },
              "narration_speed": {
                "description": "How fast the voice speaks: 1 is normal, 0.85 or 0.75 slower (for younger students), 1.1 or 1.25 faster.",
                "enum": [0.75, 0.85, 1, 1.1, 1.25],
                "type": "number"
              },
              "narration_voice": {
                "description": "A voice id from get_voices for that language (a man's or a woman's voice, for example). Leave it out for the site's default voice of the language.",
                "maxLength": 160,
                "type": "string"
