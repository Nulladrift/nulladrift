      "instructions": "Notematics is an online whiteboard for maths teachers. With these tools you make a board (for example, a step-by-step solution of a problem) and give the user a link that opens it in their browser. No sign-in is needed.\n\nHow to make a board:\n1. Write the board text in the Notematics format (call get_board_format if you do not have it).\n2. Call check_board with the whole text. Fix every ERROR it reports and check again.\n3. Call publish_board with the whole text. Give the user the link it returns.\nCheck the mathematics yourself as well: a teacher will show the board to students.\n\nTo explain how to solve a task (a presentation, an explainer, a video lesson), write the solution as small steps, one idea per ### heading, and give it the look of a learning presentation, with these four lines right under the # title: \":::show pen pencil speed=4 after=3\" (the words fade in, the formulas are written by hand and the drawings drawn by a pencil, four times as fast, and each step waits three seconds before the next), \":::spacing wider\" (room between the paragraphs and the steps), \":::music morning quiet\" and \":::turn flip\". Give each step a :::say block, a sentence or two about what appears in it: a step lasts as long as its voice, and what it shows appears, is drawn and written while the voice speaks, so keep each step to what its sentence talks about. Mark the key words with a colour or a highlight, and add a :::comment where students often go wrong. Where a teacher would cross out, cancel, underline or ring what is already written (terms that cancel, a wrong line, the answer), put a mark line such as :::cancel \"+3\" or :::box \"x = 2\" in the step where it happens, with \":::pause 2\" on the line before the first mark of a step and \":::pause 1\" before each further mark, so that the class sees what is marked before the mark is drawn. For a quiz or a test, write :::question blocks with their answer keys, one per ### heading, on a test page of their own (a page with questions is a test page; a :::test line under its ## heading sets what the student sees, when, the scale and a time limit): the teacher sends that page alone as a self-check link or to one student, or asks the questions in a lesson, while the key stays on the teacher's device. If the user likes, add the wire man or the wire girl (:::companion man or :::companion girl) with a :::mood in some steps. Call get_voices to see the voices, then publish_board with narration_language, the language of the :::say blocks (and narration_voice, narration_speed if the user asks for a voice): the link then plays with the voice. Publish a presentation with autoplay: true, so that the link opens it in the player.\n\nWhen the user gives you a Notematics link (.../live/... or .../s/...#...), call read_board with it to see the board. A live link is the board the teacher has open now: add to it with add_to_board (check_board first), and the teacher sees the addition at once.\n\nNOTEMATICS FORMAT\n\nWrite the whole board as ONE code block: the first line is ~~~notematics and the last line is ~~~. Write nothing else inside it.\n\nInside the block, use Markdown:\n# Board title            (once, on the first line)\n## Page name             (starts a new page; at most 40 characters)\n### Heading              (a heading on the page)\nParagraphs, **bold**, *italic*, lists (- item, 1. item), > notes, tables (| a | b |), and --- for a line across.\nWords with a look of their own: ==highlighted==, ~~struck through~~, and a span [words]{...} with any of: a colour (red, blue, green, orange, purple, gray), highlight or highlight=green, underline, strike, hand (handwriting), draft (drafting type), small, big, huge. Example: [the main idea]{red underline}. A formula in a span takes its colour: [$x = 2$]{green}.\nLinks: [words](https://example.com), with a hint shown when the pointer is over them in quotes: [the rule](https://example.com \"Read the rule\"). A link opens in a new tab; [words](https://example.com){same tab} opens in the same one, leaving the board, so use it only when the teacher asks.\nFormulas are LaTeX: $x^2 + 1$ among the words, and $$\\frac{a+b}{2}$$ on a line of its own.\nNames of points, segments and figures among the words are bold, so that they stand out from the text: **$K$** lies on **$AB$**, the section is **$KLM$**. Other formulas stay plain.\n\nPictures go in blocks that start with :::graph, :::geometry, :::solid or :::numberline on a line of their own and end with ::: on a line of its own. Never use backticks inside the board: the board must stay ONE code block.\n\n:::graph\nx: -2..6\ny: -2..5\ny = x^2 - 4*x + 3\ny = a*x - 1\na = 0.5 (-2..2)\n(2, -1)\n:::\nIn a graph: optional x and y ranges (the y range is found when left out), then one curve per line: y = f(x), x = number, or a point (a, b). Use x, numbers, + - * / ^, sqrt, abs, sin, cos, tan, ln, log, exp, pi, and letters defined as sliders: \"a = 0.5 (-2..2)\".\n\nA graph also takes named points and figures through them, and texts:\n:::graph\nx: -1..5\ny: -2..4\nf(x) = (x - 2)^2 - 1\nA = (0, 3)\nV = on(f, 2)\nsegment(A, V) dashed\nperp(V, x) \"x_0\"\nperp(V, y)\ntext (2.3, 3.2) \"The vertex $V(2, -1)$\"\n:::\nA = (0, 3) is a point with its name. segment(A, B), line(A, B) and ray(A, B) go through named points. perp(V, x) is the dashed perpendicular from V down to the x axis, with the value at its foot; perp(V, y) goes to the y axis. A \"caption\" in quotes after it is written at the foot instead of the value; \"no value\" draws neither. V = on(f, 2) is a point on the named curve f(x) = … at x = 2; P = on(segment(A, B), 0.4) is a point 0.4 of the way from A to B (on(line…), on(ray…) too). text (x, y) \"words\" writes words at that place of the axes, formulas between $.\nAfter a curve, a point or a figure: color=red (or a colour's name) and dashed or dotted; after a segment, a line or a ray: arrow (a head at its second point, for a ray far away), arrows (both ends) or arrow=start. A \"no labels\" line in a graph hides the equations written beside its curves (for a question whose answer they would give away).\n\n:::geometry\nA = (0, 0)\nB = (6, 0)\nC = (2, 4)\ntriangle A B C\nH = foot C A B\nsegment C H dashed\nangle C H B right\nsegment A B \"6 cm\"\nM = midpoint A C\nsegment B M ticks=1\nangle B A C \"α\"\n:::\nIn geometry: points with coordinates (y goes up; the drawing is scaled to fit), then what to draw:\nsegment A B, line A B, triangle A B C, polygon A B C D, circle O A (centre O through A), circumcircle A B C, incircle A B C,\nM = midpoint A B, H = foot C A B (foot of the perpendicular from C to line AB), L = bisector C A B (where the bisector of the angle at C meets AB), P = intersection A B C D (lines AB and CD, drawn first), D = on A B 0.3 (on segment AB), O = center circumcircle A B C,\nangle A B C right, angle A B C \"60°\", angle A B C measured, angle A B C arcs=2 (equal angles: 1 to 3 arcs; B is the vertex).\nAfter a line or a figure: \"label\" in quotes, ticks=1 (equal-side marks 1 to 3), dashed or dotted, color=red, hand (drawn as by hand). After a segment or a line: arrow (a head at its second point: segment A B arrow points to B), arrows (heads at both ends) or arrow=start; vector A B is segment A B arrow. After a polygon or a circle: fill (its inside in a see-through colour, fill=yellow for its own) or hatch (shaded with slanting lines, hatch=blue); fill A B C D and hatch A B C D fill the polygon through those points in order, as for the area between two figures. \"K = (1, 2) hidden\" is a point with no dot and no name.\nWrite \"hand\" after the block type (:::geometry hand) to draw every line of the picture as by hand, as a teacher draws on the board.\n\nSpace geometry is drawn as in a textbook, with the coordinates of the picture: a plane is a parallelogram, \"plane α\" and three of its corners in order; hidden lines are dashed. A point at the same fraction along AB and AB1 makes CC1 parallel to BB1.\n:::geometry\nplane α (0, 0) (8, 0) (10, 3)\nA = (2.5, 1.2)\nB = (5.5, 6.5)\nB1 = (8, 1.6)\nsegment A B\nsegment A B1\nsegment B B1\nC = on A B 0.5\nC1 = on A B1 0.5\nsegment C C1\n:::\n\n:::solid\ncone\n:::\nA solid: cube, cuboid, prism3, prism4, pyramid3, pyramid4, cylinder, cone, frustum, sphere or hemisphere; add \"oblique\" for the textbook view, and \"hand\" to draw it as by hand.\n\n:::numberline\n(x+1)(x-3)/(x-5) >= 0\n:::\nA number line with intervals, for a domain or the answer of an inequality. One interval set per line; each line is a level of its own above the axis, as the inequalities of a system are drawn. Write intervals in any usual notation, (-∞; 2) ∪ [3; +∞), [-1, 4), ]2 ; 5], ℝ \\ {3} (inf for ∞), or inequalities: x <= 2, -1 < x <= 4, x < -1 or x > 2. An inequality with an expression, (x+1)(x-3)/(x-5) >= 0 or x^2 > x + 2, is solved by the method of intervals: its roots and the points where it is undefined go on the axis, with the sign over each interval and arcs. After the type, if you like: line or band (instead of hatching), a colour, arcs, brackets (ends as brackets on the axis, as in France), outside (hatch what is not a solution), scale or scale=-2..5:1 (to scale instead of a sketch), letter=t. A line \"points: 0 tick; 2 filled\" adds points of your own, \"signs: + - +\" signs over the intervals. When you solve an inequality or find a domain, show the answer on a number line too.\n\nWrite \"right\" after the type of a block (:::geometry right) to put the picture to the right of the text before it.\n\nThe teacher shows the board step by step: each ### heading starts a step, and what follows it, pictures too, appears with it. A comment is a note beside its step, shown only during that step:\n:::comment\nThe hypotenuse is opposite the right angle: $c^2 = a^2 + b^2$.\n:::\nPut a comment right after the ### heading of its step, or inside the step. Add a colour after the type if you like (:::comment blue).\n\nOnly when the request asks for narration: what the teacher's voice says during a step, a sentence or two in plain words (formulas said in words), right after the ### heading of its step:\n:::say\nNow we find the discriminant.\n:::\n\nOnly when the request asks for the wire man or the wire girl (a little figure drawn in lines who reacts to the steps): say which, on one line right under the # title (add cap for a graduation cap; none for no figure):\n:::companion girl cap\nand the mood during a step, on one line right after the ### heading of its step. The moods are calm, explain, think, happy, surprised, confused, oops (for a common mistake) and celebrate (for the answer); draw and type exist too, but without a mood the figure draws by itself while the pencil draws and types while text is typed. With moods and no :::companion line, the wire man comes:\n:::mood oops\n\nOnly when the request asks for background music under the presentation, on one line right under the # title: bright (light and cheerful), sunny, morning, playful or inspiring (cheerful too, each its own tune), piano (a bouncy swung piano), stroll (a shuffle with a harmonica), energetic (four on the floor), arcade (a little game tune), calm (slow, for thinking) or study (an unhurried groove); add quiet or loud if you like. It plays while the presentation plays, softer while the voice speaks:\n:::music calm quiet\n\nOnly when the request asks for an effect as the presentation goes to the next page, on one line right under the # title: fade, down (the next page slides down from above), up (it slides up from below) or flip (the page is turned over like a leaf of a book):\n:::turn flip\n\nHow the steps appear, on one line: right under the # title for every step of the board, or right after the ### heading of a step for that step:\n:::show typing pencil pen\ntyping: the words are typed letter by letter. pencil: a pencil draws the drawings, graphs and solids. pen: the formulas are written by hand, stroke by stroke, as a teacher writes them, whether the words are typed or not. slow, fast, very fast (four times as fast) or fastest (six times): how fast the drawings and the formulas written by pen are drawn. sound=celesta: the sound heard as things appear (glass, the usual one; celesta; marimba; harp; chord; bubble; silent for none). after=3: wait three seconds once the step has appeared (and its voice has been said) before the next (1.5 when not said). plain: none of these. Without a :::show line, the parts of a step fade in.\nA wait inside a step, on one line where it happens, such as before a mark (a short one comes before the first mark of a step anyway):\n:::pause 2\n\nTo cross out, cancel, underline or ring what is already written, as a teacher does while explaining, write a mark on one line in the step where it happens, often a later step than the one that wrote it:\n:::strike \"+3\"\nThe mark is drawn by hand over the last paragraph above it that has these words or this piece of a formula (LaTeX as in the formula; spaces do not matter). The marks: strike (a line through), cancel (a slash, as when cancelling), cross (a cross over it), underline, double (two lines under), circle (a ring round it), box (a frame round it). After the quotes: a colour (red when not said; never black, which cannot be seen over the words), and 2nd, 3rd… when the piece is in the paragraph more than once. A mark without quotes goes over the whole paragraph right above it. To rub a mark out in a later step, write :::unmark \"+3\" there.\n\nA question for students to answer, with its answer key (a quiz in a lesson, a test the teacher sends to a student, a self-check): students never get the key from the teacher's device. The first line says the kind and the points (1 when left out); the words of the question come first inside, then the options, with the right ones ticked [x]:\n:::question single 2\nWhich number is prime?\n- [ ] 21\n- [x] 23\n- [ ] $3 cdot 9$\n:::\nThe kinds: single (one right option), multiple (any number right; partial points, or strict for all or nothing), natural, integer, decimal, text, match. After the kind: shuffle (each student sees the options in another order), pen (the formulas of the options written by hand).\nA typed answer is written on a line of its own:\n:::question decimal\nFind $sqrt{2}$ to two decimal places.\nanswer: 1.41 ± 0.005\n:::\nanswer: 6 for natural and integer; for decimal, answer: 3.14159 digits=2 (right when it is 3.14 to 2 digits after the point) or answer: 1.41 ± 0.01; students may write a decimal comma. For text, the accepted answers separated by ; (case and spaces do not count): answer: Kyiv; Kiev. Every question is graded by its answer: give every one its key.\nMatching: the left column numbered, the right one lettered, and the right pairs; an item may go with several:\n:::question match 3\nMatch each function with its graph.\n1. $y = x^2$\n2. $y = 2x + 1$\n3. $y = x^2 - 4$\nA. a parabola\nB. a straight line\npairs: 1-A, 2-B, 3-A\n:::\nQuestions are only on test pages: a page with a :::question is a test page, which the teacher sends alone, as a self-check link or to one student. Keep the questions of a test on its own page (## Test), with what the student needs to read beside them; a test in two parts is two pages. Write the questions one after another, each under its own ### heading. A :::test line right under the ## heading sets how the test page works:\n:::test answers each 20min\nWhat the student sees of the result: nothing, mark (the points and the mark; the default) or answers (and the right answers). When, in a self-check link: each (after each question) or finish (after Finish; the default). In an assignment: collect (as soon as the teacher's device collects the answers; the default) or release (when the teacher releases it). A scale of marks: percent, ua12, pl6, ru5 or us (the teacher's own when left out). A time limit such as 20min.\nA picture or words that a question needs (a graph, a solid, a paragraph) go right before it, with a :::for line right before them: :::for next (the next question), :::for next 3 (one picture for the next three), or :::for 2, 5-7 (these questions of the page, by number). The teacher's Arrange keeps them above their questions, and they are deleted with the last of them. A :::geometry drawing cannot belong to questions: draw it as a :::graph or a :::solid when it must.\n\nMore room between the paragraphs of the texts (twice as much above each step's heading), on one line right under the # title: wide, wider or widest, or the room in ems such as 0.6:\n:::spacing wide\n\nThe type of all the texts, on one line right under the # title: hand (handwriting, as on a school board), draft (the drafting type of technical drawings) or print (the default):\n:::font hand\n\nOnly when the request asks for a dark board: the board theme, on one line right under the # title: black (a dark board) or green (a green school board); white is the default:\n:::theme green\n\nOnly when the request asks for another paper than squared: the paper of a page, on one line right under its ## heading: lined (for writing, with a margin), isometric (triangles, for drawings of solids), millimetre (for graphs drawn by hand), dots, blank or contrast (squared in bold lines); grid, squared, is the default:\n:::paper lined\n\nOnly when the request asks for something fixed in place (a graph or a solid as the background of a task, a heading the class must not move): a :::lock line right before that graph, solid or paragraph. A click or a drag does not take it; the teacher unlocks it from the selection bar.\n:::lock\n\nRULES\n- Put everything on ONE page, unless the request asks for more pages. Use ### headings for the steps: the class sees them one by one.\n- Put a graph or a drawing right after the step it belongs to, with \"right\".\n- Check every number and every step. The teacher will show the board to students.\n- No images, no HTML, no other block types.\n\nEXAMPLE\n~~~notematics\n# Quadratic equation\n## Solution\n:::test answers each\n### Problem\nSolve the equation $x^2 - 5x + 6 = 0$.\n### Step 1. Discriminant\n:::comment\nThe discriminant tells how many roots there are.\n:::\nFor $ax^2 + bx + c = 0$: $a = 1$, $b = -5$, $c = 6$.\n$$D = b^2 - 4ac = 25 - 24 = 1$$\n**D > 0**, so there are two roots.\n### Step 2. Roots\n$$x_{1,2} = \\frac{-b \\pm \\sqrt{D}}{2a} = \\frac{5 \\pm 1}{2}$$\n- $x_1 = 3$\n- $x_2 = 2$\n:::graph right\nx: -1..5\ny = x^2 - 5*x + 6\n(2, 0)\n(3, 0)\n:::\n### Answer\n> **Answer:** $x_1 = 2$, $x_2 = 3$.\n### Check yourself\n:::question single\nWhich number is a root of $x^2 - 7x + 10 = 0$?\n- [ ] 1\n- [x] 2\n- [ ] 7\n:::\n~~~",
      "tools": [
        {
          "name": "add_to_board",
          "title": "Add to the open board",
          "description": "Adds board text to the board the teacher has open, behind a live link (.../live/<id>). place \"current_page\": put it under what is on the page the teacher is on (write ONE page: the next step, a hint, a drawing). place \"new_pages\": add your pages after the last page (exercises, answers, a new topic). Call check_board first: a text with errors is not added. Nothing on the board is changed or removed; the teacher can undo the addition.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
