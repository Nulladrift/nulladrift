{
  "lockfileVersion": 2,
  "subjects": {
    "com.moacut/moacut": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.moacut.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "moacut",
        "title": "MOACUT 2D Nesting",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MOACUT calculates how rectangular parts fit on rectangular sheets (2D nesting / cut-list optimization) for wood, MDF, plywood, acrylic, sheet metal and similar. All sizes are millimetres. Kerf is the cut width between parts; edge margin is kept clear around each sheet. Without an account it calculates up to 10 part types and 30 pieces per job; larger jobs return a link to open the job on moacut.com, where MOACUT Pro calculates them. Parts in separate calls cannot share sheets, so a sheet count is correct only for the whole job sent in one call. Each result includes an openInMoacut link that opens the same job in the MOACUT calculator, where the layout can be viewed and adjusted.",
      "tools": [
        {
          "name": "calculate_nesting",
          "title": "Calculate a sheet cutting layout",
          "description": "Lay out rectangular parts on rectangular sheets and return how many sheets are needed, the scrap percentage, the largest reusable offcut, each part's position on each sheet, and a link that opens the job in MOACUT. Sizes in millimetres. Free limit: 10 part types and 30 pieces in total. Sheet counts are correct only for the whole job in one call.",
          "inputSchema": {
            "properties": {
              "allowRotation": {
                "description": "Allow parts to turn 90 degrees. Set false when the grain direction matters (default true)",
                "type": "boolean"
              },
              "edgeMargin": {
                "description": "Clear margin around each sheet in mm (default 10)",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "kerf": {
                "description": "Cut width between parts in mm (default 3)",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "language": {
                "description": "Language of the MOACUT page the link opens (default en)",
                "enum": ["en", "ko", "ja", "de", "es", "pt"],
                "type": "string"
              },
              "parts": {
                "description": "Part types to cut",
                "items": {
                  "properties": {
                    "height": {
                      "description": "Part height in mm",
                      "exclusiveMinimum": 0,
                      "maximum": 100000,
                      "type": "number"
                    },
                    "quantity": {
                      "description": "How many of this part",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "width": {
                      "description": "Part width in mm",
                      "exclusiveMinimum": 0,
                      "maximum": 100000,
                      "type": "number"
                    }
                  },
                  "required": ["height", "quantity", "width"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "sheetHeight": {
                "description": "Sheet height in mm, e.g. 1220",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "sheetWidth": {
                "description": "Sheet width in mm, e.g. 2440",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              }
            },
            "required": ["parts", "sheetHeight", "sheetWidth"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate a sheet cutting layout"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0123e05e5a299fa13d47d8e67d9160fcb55ea7fe87960c986a0fa02dad9939a9"
        }
      ],
      "digest": "sha256:d232e58e3cd51327d7d1fa89a20a439dcc7cd7c7f983a4ffdc0696845686d5fe"
    }
  }
