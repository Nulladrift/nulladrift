{
  "lockfileVersion": 2,
  "subjects": {
    "com.coinmarketcal/events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://coinmarketcal.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "coinmarketcal",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CoinMarketCal curated crypto-event calendar. Authenticate every request with the x-api-key header (same key as the REST API). Quota and tier gates match GET /v2/*. When you mention an event to a user, cite its `url` so they can check the source and proof.",
      "tools": [
        {
          "name": "get_coin",
          "title": "Fetch a single coin",
          "description": "Returns the full coin payload by slug. 404 when the slug doesn't match any coin (tracked or otherwise).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Coin slug (e.g. `bitcoin`). Lowercase, URL-safe.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9d6b6aba36f136dd06841555ddcc17cca8fd5c5e1ff8cfd3d18fa1302797aa04"
        },
        {
          "name": "get_event",
          "title": "Fetch a single event",
          "description": "Returns the full event payload by id. Tier-gated fields follow the caller's plan. A recently removed event returns `410 Gone` with its `id` and `cancelledAt`. An unknown, temporarily unpublished, or out-of-window event returns `404`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The event id, as returned by `GET /v2/events`.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eef9b602fb229b2fc950e55f5d75c642f57f35a77ae0d31ae48eadd5e06bc222"
        },
        {
          "name": "get_usage",
          "title": "Monthly usage",
          "description": "Returns the authenticated key's monthly usage counters. Does not consume quota beyond the cost of the HTTP call itself. Use this to backoff before hitting 429s or to drive alerts in your integration.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b64300152569e161941d4f5621f291ec312f991707ae6ced712b285aec11ec3"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Returns every category in the editorial taxonomy with the count of upcoming events per category (tier-windowed). Standard+ only. Query parameters are ignored; the list is not paginated.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:75522410edbfa78cc38a3e4901cbe50e87083fafd55cc6105c59fc361913c1d5"
        },
        {
          "name": "list_coins",
          "title": "List coins",
          "description": "Returns a paginated list of coins ordered by `rank` ascending (top-ranked first). Pass the `tracked` filter only when you need to limit results by editorial coverage.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "Opaque pagination cursor.",
                "type": "string"
              },
              "limit": {
                "description": "Page size (1–200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Free-text search across name + symbol. Case-insensitive substring match.",
                "type": "string"
              },
              "tracked": {
                "description": "Filter by editorial coverage. Omit to return both tracked and untracked coins; set `true` for actively monitored coins only; set `false` for coins outside active coverage only.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e4c88da98cf27c35fae0776a10464a4f94f6dd0d5769f4597db1e4044e9b72c"
        },
        {
          "name": "list_event_cancellations",
          "title": "List permanently removed events",
          "description": "Returns removal records ordered by `cancelledAt`, then `id`. Available to every API V2 tier. Poll regularly and never leave more than 90 days between successful requests, even when webhooks are enabled.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "Opaque pagination cursor returned in the previous response's `meta.cursor`.",
                "type": "string"
              },
              "limit": {
                "description": "Page size (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Inclusive cancellation-time lower bound. Accepts RFC3339 or `YYYY-MM-DD`; defaults to 90 days ago.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8da3eaac0e1bd8187b030ff5e98919b216ecca8452817adb15fe1dc3d7fd7a10"
        },
        {
          "name": "list_events",
          "title": "List events",
          "description": "Returns a paginated list of upcoming and historical events within the date window available to the caller's plan. Default sort is `date asc` (soonest first). The `coins`, `categories`, and date filters compose with `AND`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "categories": {
                "description": "Comma-separated category ids. Case-insensitive. Standard+ only; Free requests using this filter return 403. Use `GET /v2/categories` to look up the canonical id list.",
                "type": "string"
              },
              "coins": {
                "description": "Comma-separated coin **slugs** (e.g. `bitcoin,ethereum`). Tickers are accepted but **strongly discouraged**; symbols collide across coins (e.g. `UNI` resolves to several different projects). Use `GET /v2/coins` to look up canonical slugs.",
                "type": "string"
              },
              "cursor": {
                "description": "Opaque pagination cursor returned in the previous response's `meta.cursor`.",
                "type": "string"
              },
              "from": {
                "description": "Inclusive lower bound on `date`. Default = today. Free and Standard clamp past values to today; Pro clamps them to the previous 30 days; Elite and Enterprise can query the complete public catalog history since 2017.",
                "type": "string"
              },
              "impactMin": {
                "description": "Lower bound on the precise impact score (0.0–10.0). Elite+ only; lower tiers receive 403. Excludes conferences, which have no score.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "keyword": {
                "description": "Free-text search across event title and description. Case-insensitive substring match.",
                "type": "string"
              },
              "limit": {
                "description": "Page size (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "sortBy": {
                "description": "Sort order. Default `date_asc` (soonest first). `impact_desc` is Elite+ only; lower tiers receive 403. It lists conferences, which have no score, last.",
                "enum": ["date_asc", "date_desc", "created_desc", "created_desc_and_updated_desc", "impact_desc"],
                "type": "string"
              },
              "to": {
                "description": "Inclusive upper bound on `date`. Default = today + tier upcoming window (e.g. 7 days on Free, 90 days on Standard, full on Pro+).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc5e0d065cccc6c46c3a0734d8136e72447001d3be3a6a7578cec9ce6d4c31bf"
        }
      ],
      "digest": "sha256:aa9795f476d11187cc30c7293ecf1e0532e508bf7f9b66e58557c4c80e25b1df"
    }
  }
}
