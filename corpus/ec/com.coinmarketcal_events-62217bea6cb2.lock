{
  "lockfileVersion": 2,
  "subjects": {
    "com.coinmarketcal/events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://coinmarketcal.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "coinmarketcal",
        "version": "1.2.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CoinMarketCal is a curated calendar of crypto events: dated, sourced, and impact-scored. Authenticate with an x-api-key header, or connect through OAuth (ChatGPT / Claude connectors). Quota and plan gates are the same as the REST API. Filter events by coin slug, and look slugs up with list_coins first, because tickers collide across coins. When an event has isEstimated true, show its displayedDate instead of date. When you mention an event to a user, cite its `url` so they can check the source and proof. A 403 means a filter, sort, or tool is reserved for a higher plan: retry without the filter or sort. get_usage returns the remaining monthly quota; check it before paging through many results.",
      "tools": [
        {
          "name": "get_coin",
          "title": "Fetch a single coin",
          "description": "Returns the full coin payload by slug. 404 when the slug doesn't match any coin (tracked or otherwise).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Coin slug (e.g. `bitcoin`). Lowercase, URL-safe.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:a3c1985953298f0a0a57ce5f100b66a3488d82ac3e8a1741ac19cc4f5f83e52a"
        },
        {
          "name": "get_event",
          "title": "Fetch a single event",
          "description": "Returns the full event payload by id. Tier-gated fields follow the caller's plan. A recently removed event returns `410 Gone` with its `id` and `cancelledAt`. An unknown, temporarily unpublished, or out-of-window event returns `404`. When `isEstimated` is true, `date` is a deadline or window end, not an exact time; `displayedDate` holds the display form (e.g. `Q2 2026`).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The event id, as returned by `list_events`.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6e4af53f79e07d8758b66d8d4ef5f90b32128c1c3846fbcfbc97194b743ff626"
        },
        {
          "name": "get_usage",
          "title": "Monthly usage",
          "description": "Returns the authenticated key's monthly usage counters. Does not consume quota beyond the cost of the HTTP call itself. Use this to backoff before hitting 429s or to drive alerts in your integration.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:1ac9de6db14ccc2703777d4bcfd39209450afb7b699ebe567374ece1a8424d70"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Returns every category in the editorial taxonomy with the count of upcoming events per category (tier-windowed). Standard+ only. Query parameters are ignored; the list is not paginated.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:cd1e8d5df7e62e48d8ad9c3564b826cb1f3a5fb59a64f65afbd0c57844656b99"
        },
        {
          "name": "list_coins",
          "title": "List coins",
          "description": "Returns a paginated list of coins ordered by `rank` ascending (top-ranked first). Pass the `tracked` filter only when you need to limit results by editorial coverage.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "Opaque pagination cursor.",
                "type": "string"
              },
              "limit": {
                "description": "Page size (1–200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Free-text search across name + symbol. Case-insensitive substring match.",
                "type": "string"
              },
              "tracked": {
                "description": "Filter by editorial coverage. Omit to return both tracked and untracked coins; set `true` for actively monitored coins only; set `false` for coins outside active coverage only.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:f461f7bb72dfbba33b221dbd13659dd7c2e814b83baaab63fe213a8f942fda19"
        },
        {
          "name": "list_event_cancellations",
          "title": "List permanently removed events",
          "description": "Returns removal records ordered by `cancelledAt`, then `id`. Available to every API V2 tier. Poll regularly and never leave more than 90 days between successful requests, even when webhooks are enabled.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "Opaque pagination cursor returned in the previous response's `meta.cursor`.",
                "type": "string"
              },
              "limit": {
                "description": "Page size (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Inclusive cancellation-time lower bound. Accepts RFC3339 or `YYYY-MM-DD`; defaults to 90 days ago.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6bb8e2ba83f9d40d306d42a34131e6304108294d012ecab74918774962731c1e"
        },
        {
          "name": "list_events",
          "title": "List events",
          "description": "Returns a paginated list of upcoming and historical events within the date window available to the caller's plan. Default sort is `date asc` (soonest first). The `coins`, `categories`, and date filters compose with `AND`. When `isEstimated` is true, `date` is a deadline or window end, not an exact time; `displayedDate` holds the display form (e.g. `Q2 2026`).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "categories": {
                "description": "Comma-separated category ids. Case-insensitive. Standard+ only; Free requests using this filter return 403. Use `list_categories` to look up the canonical id list.",
                "type": "string"
              },
              "coins": {
                "description": "Comma-separated coin **slugs** (e.g. `bitcoin,ethereum`). Tickers are accepted but **strongly discouraged**; symbols collide across coins (e.g. `UNI` resolves to several different projects). Use `list_coins` to look up canonical slugs.",
                "type": "string"
              },
              "cursor": {
                "description": "Opaque pagination cursor returned in the previous response's `meta.cursor`.",
                "type": "string"
              },
              "from": {
                "description": "Inclusive lower bound on `date`. Default = today. Free and Standard clamp past values to today; Pro clamps them to the previous 30 days; Elite and Enterprise can query the complete public catalog history since 2017.",
                "type": "string"
              },
              "impactMin": {
                "description": "Lower bound on the precise impact score (0.0–10.0). Elite+ only; lower tiers receive 403. Excludes conferences, which have no score.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "keyword": {
                "description": "Free-text search across event title and description. Case-insensitive substring match.",
                "type": "string"
              },
              "limit": {
                "description": "Page size (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "sortBy": {
                "description": "Sort order. Default `date_asc` (soonest first). `impact_desc` is Elite+ only; lower tiers receive 403. It lists conferences, which have no score, last.",
                "enum": ["date_asc", "date_desc", "created_desc", "created_desc_and_updated_desc", "impact_desc"],
                "type": "string"
              },
              "to": {
                "description": "Inclusive upper bound on `date`. Default = today + tier upcoming window (e.g. 7 days on Free, 90 days on Standard, full on Pro+).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:05a4776f74799acc38b54ca09704af0168c85174a270b007481546053686f955"
        }
