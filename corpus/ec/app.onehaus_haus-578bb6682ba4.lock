        {
          "name": "create_document",
          "description": "Store a document (passport, insurance, certificate, warranty, license, other) with its reference number, issuing authority, fee and notes. Optionally file it against a pet, vehicle or appliance with linkedEntityType and linkedEntityId. Returns the new id, which an appliance, vehicle or pet can link to.",
          "inputSchema": {
            "examples": [
              {
                "documentNumber": "512345678",
                "documentType": "Passport",
                "fee": {
                  "currencyCode": "GBP",
                  "value": 8250
                },
                "issuingAuthority": "HM Passport Office",
                "notes": "Renew before the next family trip.",
                "title": "UK Passport"
              }
            ],
            "properties": {
              "documentNumber": {
                "description": "Reference or serial number, e.g. a passport or policy number.",
                "examples": ["512345678"],
                "type": "string"
              },
              "documentType": {
                "description": "Kind of document.",
                "enum": ["Passport", "Insurance", "Certificate", "Warranty", "License", "Other"],
                "examples": ["Passport"],
                "type": "string"
              },
              "fee": {
                "description": "Cost, e.g. a renewal or issuance fee.",
                "properties": {
                  "currencyCode": {
                    "description": "Uppercase ISO 4217 code, e.g. USD, GBP, JPY.",
                    "examples": ["USD"],
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  "value": {
                    "description": "Amount in the currency's minor units. Most currencies have 2 decimal places (1599 = 15.99 USD), but some have none (1500 = 1500 JPY) and a few have 3 (12345 = 12.345 KWD).",
                    "examples": [1599],
                    "type": "integer"
                  }
                },
                "required": ["currencyCode", "value"],
                "type": "object"
              },
              "issuingAuthority": {
                "description": "Who issued it.",
                "examples": ["HM Passport Office"],
                "type": "string"
              },
              "linkedEntityId": {
                "description": "Id of that pet, vehicle or appliance from list_pets, list_vehicles or list_appliances. Send with linkedEntityType.",
                "examples": ["01928e4a7d3f7b9ac1e3f6d8b2a4c710"],
                "type": "string"
              },
              "linkedEntityType": {
                "description": "Kind of record the document is filed against. Send with linkedEntityId.",
                "enum": ["Pet", "Vehicle", "Appliance"],
                "examples": ["Pet"],
                "type": "string"
              },
              "notes": {
                "description": "Free-text notes.",
                "examples": ["Renew before the next family trip."],
                "type": "string"
              },
              "renewalCronExpression": {
                "description": "Accepted but not yet stored or acted on; has no effect.",
                "examples": ["0 0 1 1 *"],
                "type": "string"
              },
              "title": {
                "description": "Custom title. Defaults to type plus number, e.g. 'Passport - 512345678'.",
