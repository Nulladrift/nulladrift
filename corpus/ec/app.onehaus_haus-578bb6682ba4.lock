                "description": "New inclusive end date, YYYY-MM-DD. Empty string makes it open-ended.",
                "examples": ["2026-12-31"],
                "type": "string"
              },
              "id": {
                "description": "Template id from list_recurring_tasks or create_recurring_task.",
