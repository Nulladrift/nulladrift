                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              },
              "startDate": {
                "description": "New start date, YYYY-MM-DD. Empty string clears it.",
                "examples": ["2026-08-01"],
                "type": "string"
              },
              "title": {
                "description": "New title. Uncompleted instances are updated to match; completed ones keep theirs.",
                "examples": ["Take out the recycling"],
                "type": "string"
              }
            },
