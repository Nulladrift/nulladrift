        {
          "name": "update_subscription",
          "description": "Update a subscription. Only the fields you send change; for renewalCronExpression, startDate, paymentDate and notes an empty string clears the stored value.",
          "inputSchema": {
            "examples": [
              {
                "id": "0198c1f4b2c07a1b9e4d5f6a7b8c9d0e",
                "notes": "Paused while travelling",
                "status": "Paused"
              },
              {
                "id": "0198c1f4b2c07a1b9e4d5f6a7b8c9d0e",
                "paymentDate": "2026-10-03"
              }
            ],
            "properties": {
              "fee": {
                "description": "Recurring charge.",
                "properties": {
                  "currencyCode": {
                    "description": "Uppercase ISO 4217 code, e.g. USD, GBP, JPY.",
                    "examples": ["USD"],
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  "value": {
                    "description": "Amount in the currency's minor units. Most currencies have 2 decimal places (1599 = 15.99 USD), but some have none (1500 = 1500 JPY) and a few have 3 (12345 = 12.345 KWD).",
                    "examples": [1599],
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "id": {
                "description": "Subscription id from list_subscriptions.",
                "examples": ["0198c1f4b2c07a1b9e4d5f6a7b8c9d0e"],
                "type": "string"
              },
              "name": {
                "description": "New name.",
                "examples": ["Netflix"],
                "type": "string"
              },
              "notes": {
                "description": "Free-text notes. Empty string clears them.",
                "examples": ["Paused while travelling"],
                "type": "string"
              },
              "paymentDate": {
                "description": "Date the first payment leaves the account, YYYY-MM-DD, when it differs from the renewal date. Payments repeat on the renewal cadence from this date. Omit when payment happens on renewal. Empty string clears it.",
                "examples": ["2026-10-03"],
                "type": "string"
              },
              "remindMe": {
                "description": "Whether to remind the household before each renewal.",
                "examples": [true],
                "type": "boolean"
              },
              "renewalCronExpression": {
                "description": "Cron expression for the renewal cadence, no more often than daily. Empty string clears it, making the bill a one-off.",
                "examples": ["0 0 1 * *"],
                "type": "string"
              },
              "startDate": {
                "description": "Renewal date, YYYY-MM-DD. Optional. For a recurring bill it is the first renewal; for a one-off it is the date it is due. Empty string clears it.",
                "examples": ["2026-10-01"],
                "type": "string"
              },
              "status": {
                "description": "New status.",
                "enum": ["Active", "Paused", "Cancelled"],
                "examples": ["Paused"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
