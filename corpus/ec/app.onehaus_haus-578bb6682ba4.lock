      "instructions": "Haus household-management tools. They operate on the user's current household, resolved automatically from the authenticated session — you never pass a houseId. Use list_houses only to tell the user which household you are acting on.",
      "tools": [
        {
          "name": "add_shopping_list_item",
          "description": "Add one item to the shopping list. A new item gets a category from its name; if an unbought item of the same name exists, its quantity is increased instead of duplicating it.",
          "inputSchema": {
            "examples": [
              {
                "name": "Milk",
                "quantity": 2
              }
            ],
            "properties": {
              "category": {
                "description": "Store-aisle category to use instead of auto-assigning one; the name is then kept exactly as given. Omit to auto-categorise. Ignored when merged into an existing item.",
                "enum": ["FruitAndVegetables", "Bakery", "DeliAndPreparedFoods", "MeatAndSeafood", "DairyAndEggs", "Frozen", "PantryAndDryGoods", "SnacksAndConfectionery", "Beverages", "HouseholdAndCleaning", "HealthAndPersonalCare", "BabyAndKids", "PetSupplies", "Online", "Other"],
                "examples": ["DairyAndEggs"],
                "type": "string"
              },
              "name": {
                "description": "Item name, e.g. 'Milk'. A new item gets a category from its name; a matching unbought item has its quantity increased instead.",
                "examples": ["Milk"],
                "type": "string"
              },
              "quantity": {
                "description": "How many to add, 1-9999, default 1. Added to the existing quantity when merged.",
                "examples": [2],
                "type": "integer"
              },
              "shoppingListId": {
                "description": "Target list, an id from list_shopping_lists. Omit for the default. Merging only happens within one list.",
                "examples": ["0189c8d4f2b1712a9e4d6c9a1b2e3f4a"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "variant": {
                "enum": ["list", "detail", "confirmation"],
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://haus/widgets/v2",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://haus/widgets/v2",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:f37942975563111db7bb559a2c1e92dab1d16e4c8fb555f418daa6d8011ccf23"
        },
        {
          "name": "apply_task_pack",
          "description": "Add a task pack from list_task_packs to the household: creates its tasks, repeating tasks and events, dated from the anchor date. The pack's titles are English: when the user is not writing in English, pass their titles (and notes) translated in overrides. Returns how many of each were created.",
          "inputSchema": {
            "examples": [
              {
                "anchorDate": "2026-11-28",
                "packId": "moving-house",
                "timezone": "Europe/London"
              },
              {
                "entityId": "0190c2d3e4f5a6b7c8d9e0f1a2b3c4d5",
                "itemIds": ["check-tyre-pressure", "service-car"],
                "packId": "car-maintenance"
              },
              {
                "itemIds": ["wipe-counters"],
                "overrides": [
                  {
                    "itemId": "wipe-counters",
                    "title": "Arbeitsflächen abwischen"
                  }
                ],
                "packId": "weekly-household-reset"
              }
            ],
            "properties": {
              "anchorDate": {
                "description": "YYYY-MM-DD, at most 5 years ahead. Required for a pack with isTargetDatePack true: the target date the items count back from (e.g. moving day or due date); ask the user if they haven't said. Otherwise the date the pack starts; omit to use the linked entity's date from list_task_packs, or today. Items that would fall in the past are moved to today.",
                "examples": ["2026-11-28"],
                "type": "string"
              },
              "entityId": {
                "description": "Required for packs with a relatedEntityType (vehicle, appliance or pet packs): the id of one of the pack's entities from list_task_packs. Omit for other packs.",
                "examples": ["0190c2d3e4f5a6b7c8d9e0f1a2b3c4d5"],
                "type": "string"
              },
              "itemIds": {
                "description": "The items to add. Omit to add the items selected by default.",
                "items": {
                  "description": "One item id from the pack's items in list_task_packs.",
                  "examples": ["book-movers"],
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "overrides": {
                "description": "Replacement text for added items. When the user is not writing in English, give every added item its title (and notes) translated into their language.",
                "items": {
                  "description": "The replacement title and/or notes for one item.",
                  "properties": {
                    "itemId": {
                      "description": "An item id from the pack's items in list_task_packs.",
                      "examples": ["wipe-counters"],
                      "type": "string"
                    },
                    "notes": {
                      "description": "Replacement notes, up to 2000 characters.",
                      "examples": ["Nach dem Abendessen"],
                      "type": "string"
                    },
                    "title": {
                      "description": "Replacement title, up to 200 characters.",
                      "examples": ["Arbeitsflächen abwischen"],
                      "type": "string"
                    }
                  },
                  "required": ["itemId"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "packId": {
                "description": "Pack id from list_task_packs.",
                "examples": ["moving-house"],
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone, e.g. Europe/London, used to place timed events and to decide today. Omit to use the user's saved time zone.",
                "examples": ["Europe/London"],
                "type": "string"
              }
            },
            "required": ["packId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "variant": {
                "enum": ["list", "detail", "confirmation"],
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://haus/widgets/v2",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://haus/widgets/v2",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:c8fd8b82153435d8c91149dbbf93b771317085aa5541aac16f021110ca6e4e99"
        },
