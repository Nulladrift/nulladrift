        {
          "name": "create_calendar_event",
          "description": "Creates a single, one-off calendar event on the household calendar. Timed events need startDateTime; all-day events need startDate (plus endDate for several days). Set reminders with reminderOffsetMinutes. For a repeating schedule use create_recurring_calendar_event instead.",
          "inputSchema": {
            "examples": [
              {
                "description": "Annual checkup with Dr. Smith",
                "endDateTime": "2026-08-03T15:30:00Z",
                "isAllDay": false,
                "location": {
                  "$type": "Address",
                  "countryCode": "GB",
                  "line1": "221B Baker Street",
                  "postalCode": "NW1 6XE"
                },
                "notes": "Bring insurance card",
                "reminderOffsetMinutes": [60, 1440],
                "startDateTime": "2026-08-03T14:30:00Z",
                "timezone": "Europe/London",
                "title": "Dentist appointment"
              },
              {
                "endDate": "2026-10-30",
                "isAllDay": true,
                "startDate": "2026-10-26",
                "title": "Half term"
              }
            ],
            "properties": {
              "description": {
                "description": "Longer description.",
                "examples": ["Annual checkup with Dr. Smith"],
                "type": "string"
              },
              "endDate": {
                "description": "All-day only: LAST day, inclusive, YYYY-MM-DD. Omit for a single day. The event may cover at most 366 days, between 1900 and 2200.",
                "examples": ["2026-08-05"],
                "type": "string"
              },
              "endDateTime": {
                "description": "End of a timed event, ISO 8601 UTC. Must not precede startDateTime. For all-day events send endDate instead. An all-day event sent with endDateTime and no startDate stores it as given, and a midnight endDateTime then names the LAST day (inclusive).",
                "examples": ["2026-08-03T15:30:00Z"],
                "type": "string"
              },
              "isAllDay": {
                "description": "True for all-day, false for timed.",
                "examples": [false],
                "type": "boolean"
              },
              "location": {
                "description": "Where it happens. $type 'Address' takes line1-3/postalCode/countryCode; 'OnlineLocation' takes url/notes.",
                "properties": {
                  "$type": {
                    "description": "Which location shape this is.",
                    "enum": ["Address", "OnlineLocation"],
                    "examples": ["Address"],
                    "type": "string"
                  },
                  "countryCode": {
                    "description": "ISO country code, e.g. GB.",
                    "examples": ["GB"],
                    "type": "string"
                  },
                  "line1": {
                    "description": "Address line 1. An Address needs one of line1-3 or postalCode.",
                    "examples": ["221B Baker Street"],
                    "type": "string"
                  },
                  "line2": {
                    "description": "Address line 2, e.g. flat or suite.",
                    "examples": ["Flat 3"],
                    "type": "string"
                  },
                  "line3": {
                    "description": "Address line 3.",
                    "examples": ["London"],
                    "type": "string"
                  },
                  "notes": {
                    "description": "Access detail, e.g. parking or passcode.",
                    "examples": ["Parking on level 2"],
                    "type": "string"
                  },
                  "postalCode": {
                    "description": "Postal or ZIP code.",
                    "examples": ["NW1 6XE"],
                    "type": "string"
                  },
                  "url": {
                    "description": "Absolute http/https join link.",
                    "examples": ["https://meet.google.com/abc-defg-hij"],
                    "type": "string"
                  }
                },
                "required": ["$type"],
                "type": "object"
              },
              "notes": {
                "description": "Freeform notes.",
                "examples": ["Bring insurance card"],
                "type": "string"
              },
              "reminderOffsetMinutes": {
                "description": "Reminder lead times, in minutes before the event starts. Each value is whole hours, 60-1380 (1-23 hours), or whole days, a multiple of 1440 up to 525600 (365 days); a week is 10080. Up to 5 values. An all-day event counts from 00:00 on its first day, so 300 (5 hours) is 19:00 the evening before. Day and week reminders arrive at 19:00 on the earlier day; hour reminders arrive that many hours before the start, or up to 15 minutes earlier. Every household member is reminded.",
                "examples": [
                  [1440, 10080]
                ],
                "items": {
                  "description": "One lead time in minutes: whole hours 60-1380, or a multiple of 1440 for days.",
                  "examples": [1440],
                  "maximum": 525600,
                  "minimum": 60,
                  "multipleOf": 60,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              },
              "startDate": {
                "description": "All-day only (preferred for all-day): first day, YYYY-MM-DD. Takes precedence over startDateTime. Stored as startDateTime 00:00Z on this day, with endDateTime 00:00Z on the last day (null for a single day).",
                "examples": ["2026-08-03"],
                "type": "string"
              },
              "startDateTime": {
                "description": "Start of a timed event, ISO 8601 UTC with a Z suffix. For an all-day event send startDate instead; when startDate is present this is ignored.",
                "examples": ["2026-08-03T14:30:00Z"],
                "type": "string"
              },
              "timezone": {
                "description": "IANA zone for the wall-clock times, e.g. 'Europe/London'. Null means UTC. Not stored when an all-day event is sent with startDate.",
                "examples": ["Europe/London"],
                "type": ["string", "null"]
              },
              "title": {
                "description": "Title shown in calendar views.",
                "examples": ["Dentist appointment"],
                "type": "string"
              }
            },
            "required": ["isAllDay", "title"],
            "type": "object"
          },
