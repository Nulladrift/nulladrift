        {
          "name": "update_document",
          "description": "Update a stored document's type, title, reference number, issuing authority, fee, notes or linked pet, vehicle or appliance, returning the updated document. Only the fields you send change. renewalCronExpression is the one exception: it is accepted but not yet stored or acted on, so sending it changes nothing.",
          "inputSchema": {
            "examples": [
              {
                "id": "01928e4a7d3f7b9ac1e3f6d8b2a4c710",
                "issuingAuthority": "HM Passport Office",
                "notes": "Renewed for another 10 years."
              }
            ],
            "properties": {
              "documentNumber": {
                "description": "Reference or serial number, e.g. a passport or policy number.",
                "examples": ["512345678"],
                "type": "string"
              },
              "documentType": {
                "description": "Kind of document.",
                "enum": ["Passport", "Insurance", "Certificate", "Warranty", "License", "Other"],
                "examples": ["Passport"],
                "type": "string"
              },
              "fee": {
                "description": "Cost. Replaces the stored fee outright.",
                "properties": {
                  "currencyCode": {
                    "description": "Uppercase ISO 4217 code, e.g. USD, GBP, JPY.",
                    "examples": ["USD"],
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  "value": {
                    "description": "Amount in the currency's minor units. Most currencies have 2 decimal places (1599 = 15.99 USD), but some have none (1500 = 1500 JPY) and a few have 3 (12345 = 12.345 KWD).",
                    "examples": [1599],
                    "type": "integer"
                  }
                },
                "required": ["currencyCode", "value"],
                "type": "object"
              },
              "id": {
                "description": "Document id from create_document or list_documents.",
                "examples": ["01928e4a7d3f7b9ac1e3f6d8b2a4c710"],
                "type": "string"
              },
              "issuingAuthority": {
                "description": "Who issued it.",
                "examples": ["HM Passport Office"],
                "type": "string"
              },
              "linkedEntityId": {
                "description": "Id of that pet, vehicle or appliance from list_pets, list_vehicles or list_appliances. Send with linkedEntityType; \"\" for both removes the link.",
                "examples": ["01928e4a7d3f7b9ac1e3f6d8b2a4c710"],
                "type": "string"
              },
              "linkedEntityType": {
                "description": "Kind of record the document is filed against. Send with linkedEntityId; send \"\" for both to remove the link, omit both to keep it.",
                "enum": ["Pet", "Vehicle", "Appliance", ""],
                "examples": ["Pet"],
                "type": "string"
              },
              "notes": {
                "description": "Free-text notes.",
                "examples": ["Renewed for another 10 years."],
                "type": "string"
              },
              "renewalCronExpression": {
                "description": "Accepted but not yet stored or acted on; has no effect.",
                "examples": ["0 0 1 1 *"],
                "type": "string"
              },
              "title": {
                "description": "Custom title.",
                "examples": ["UK Passport"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
