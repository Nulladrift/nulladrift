        {
          "name": "create_recurring_calendar_event",
          "description": "Create a recurring calendar event. It generates event instances on a schedule, each with the reminders set in reminderOffsetMinutes.",
          "inputSchema": {
            "examples": [
              {
                "cronExpression": "1 Week",
                "description": "Sync on sprint progress",
                "duration": "PT30M",
                "endDate": "2026-12-31",
                "isAllDay": false,
                "maxOccurrences": 20,
                "notes": "Bring your laptop",
                "reminderOffsetMinutes": [60],
                "startDate": "2026-08-03",
                "startTime": "09:00:00",
                "timezone": "Europe/London",
                "title": "Weekly team standup"
              }
            ],
            "properties": {
              "cronExpression": {
                "description": "Interval as 'N Unit', Unit one of Day, Week, Month, Year, e.g. '2 Week'. Not cron syntax.",
                "examples": ["1 Week"],
                "type": "string"
              },
              "description": {
                "description": "Longer description of each instance.",
                "examples": ["Sync on sprint progress"],
                "type": "string"
              },
              "duration": {
                "description": "Length of each instance, ISO 8601 duration e.g. 'PT30M'.",
                "examples": ["PT30M"],
                "type": "string"
              },
              "endDate": {
                "description": "Last date an instance may fall on, YYYY-MM-DD.",
                "examples": ["2026-12-31"],
                "type": "string"
              },
              "isAllDay": {
                "description": "True for all-day instances, false for timed. An all-day instance starts at midnight of its occurrence date in the template timezone (stored in UTC; omit startTime) and ends duration later (no end without a duration), so a duration of one day or more makes each instance span that many whole days.",
                "examples": [false],
                "type": "boolean"
              },
              "location": {
                "description": "Where each instance happens. $type 'Address' takes line1-3/postalCode/countryCode; 'OnlineLocation' takes url/notes.",
                "properties": {
                  "$type": {
                    "description": "Which location shape this is.",
                    "enum": ["Address", "OnlineLocation"],
                    "examples": ["Address"],
                    "type": "string"
                  },
                  "countryCode": {
                    "description": "ISO country code, e.g. GB.",
                    "examples": ["GB"],
                    "type": "string"
                  },
                  "line1": {
                    "description": "Address line 1. An Address needs one of line1-3 or postalCode.",
                    "examples": ["221B Baker Street"],
                    "type": "string"
                  },
                  "line2": {
                    "description": "Address line 2, e.g. flat or suite.",
                    "examples": ["Flat 3"],
                    "type": "string"
                  },
                  "line3": {
                    "description": "Address line 3.",
                    "examples": ["London"],
                    "type": "string"
                  },
                  "notes": {
                    "description": "Access detail, e.g. parking or passcode.",
                    "examples": ["Parking on level 2"],
                    "type": "string"
                  },
                  "postalCode": {
                    "description": "Postal or ZIP code.",
                    "examples": ["NW1 6XE"],
                    "type": "string"
                  },
                  "url": {
                    "description": "Absolute http/https join link.",
                    "examples": ["https://meet.google.com/abc-defg-hij"],
                    "type": "string"
                  }
                },
                "required": ["$type"],
                "type": "object"
              },
              "maxOccurrences": {
                "description": "Cap on instances generated.",
                "examples": [20],
                "type": "integer"
              },
              "notes": {
                "description": "Notes on each instance.",
                "examples": ["Bring your laptop"],
                "type": "string"
              },
              "reminderOffsetMinutes": {
                "description": "Reminder lead times, in minutes before each occurrence starts. Each value is whole hours, 60-1380 (1-23 hours), or whole days, a multiple of 1440 up to 40320 (4 weeks, the most for a repeating item); a week is 10080. Up to 5 values. An all-day event counts from 00:00 on its first day, so 300 (5 hours) is 19:00 the evening before. Day and week reminders arrive at 19:00 on the earlier day; hour reminders arrive that many hours before the start, or up to 15 minutes earlier. Every household member is reminded.",
                "examples": [
                  [1440, 10080]
                ],
                "items": {
                  "description": "One lead time in minutes: whole hours 60-1380, or a multiple of 1440 for days.",
                  "examples": [1440],
                  "maximum": 40320,
                  "minimum": 60,
                  "multipleOf": 60,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              },
              "startDate": {
                "description": "Date of the first instance, YYYY-MM-DD. Later ones repeat from it.",
                "examples": ["2026-08-03"],
                "type": "string"
              },
              "startTime": {
                "description": "Local start time, HH:mm:ss. Omit if there is no fixed time.",
