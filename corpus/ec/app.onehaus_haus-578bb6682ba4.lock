        {
          "name": "update_recurring_calendar_event",
          "description": "Update a recurring calendar event. Changes to title/description/notes/reminders patch existing instances. Changes to frequency/dates/time regenerate future instances.",
          "inputSchema": {
            "examples": [
              {
                "cronExpression": "2 Week",
                "endDate": "2027-01-31",
                "id": "0198f3a1b2c34d5e6f7089ab1c2d3e4f"
              }
            ],
            "properties": {
              "cronExpression": {
                "description": "New interval as 'N Unit', Unit one of Day, Week, Month, Year, e.g. '2 Week'. Not cron syntax.",
                "examples": ["2 Week"],
                "type": "string"
              },
              "description": {
                "description": "New description, patched onto existing instances.",
                "examples": ["Sync on sprint progress"],
                "type": "string"
              },
              "duration": {
                "description": "Length of each instance, ISO 8601 duration e.g. 'PT30M'.",
                "examples": ["PT30M"],
                "type": "string"
              },
              "endDate": {
                "description": "New last date, YYYY-MM-DD. Empty string leaves it unbounded.",
                "examples": ["2027-01-31"],
                "type": "string"
              },
              "id": {
                "description": "Template id from list_recurring_calendar_events or create_recurring_calendar_event.",
                "examples": ["0198f3a1b2c34d5e6f7089ab1c2d3e4f"],
                "type": "string"
              },
              "isAllDay": {
                "description": "True for all-day instances, false for timed. An all-day instance starts at midnight of its occurrence date in the template timezone (stored in UTC; omit startTime) and ends duration later (no end without a duration), so a duration of one day or more makes each instance span that many whole days.",
                "examples": [false],
                "type": "boolean"
              },
              "location": {
                "description": "Replaces the location outright. $type 'Address' takes line1-3/postalCode/countryCode; 'OnlineLocation' takes url/notes.",
                "properties": {
                  "$type": {
                    "description": "Which location shape this is.",
                    "enum": ["Address", "OnlineLocation"],
                    "examples": ["Address"],
                    "type": "string"
                  },
                  "countryCode": {
                    "description": "ISO country code, e.g. GB.",
                    "examples": ["GB"],
                    "type": "string"
                  },
                  "line1": {
                    "description": "Address line 1. An Address needs one of line1-3 or postalCode.",
                    "examples": ["221B Baker Street"],
                    "type": "string"
                  },
                  "line2": {
                    "description": "Address line 2, e.g. flat or suite.",
                    "examples": ["Flat 3"],
                    "type": "string"
                  },
                  "line3": {
                    "description": "Address line 3.",
                    "examples": ["London"],
                    "type": "string"
                  },
                  "notes": {
                    "description": "Access detail, e.g. parking or passcode.",
                    "examples": ["Bring your laptop"],
                    "type": "string"
                  },
                  "postalCode": {
                    "description": "Postal or ZIP code.",
                    "examples": ["NW1 6XE"],
                    "type": "string"
                  },
                  "url": {
                    "description": "Absolute http/https join link.",
                    "examples": ["https://meet.google.com/abc-defg-hij"],
                    "type": "string"
                  }
                },
                "required": ["$type"],
                "type": "object"
              },
              "maxOccurrences": {
                "description": "New cap on instances generated.",
                "examples": [20],
                "type": "integer"
              },
              "notes": {
                "description": "New notes.",
                "examples": ["Bring your laptop"],
                "type": "string"
              },
              "reminderOffsetMinutes": {
                "description": "New reminder lead times, in minutes before each occurrence starts. Send the full list: it replaces the current one. [] clears all reminders; omit to keep them. A change also applies to existing instances. Each value is whole hours, 60-1380 (1-23 hours), or whole days, a multiple of 1440 up to 40320 (4 weeks, the most for a repeating item); a week is 10080. Up to 5 values. An all-day event counts from 00:00 on its first day, so 300 (5 hours) is 19:00 the evening before. Day and week reminders arrive at 19:00 on the earlier day; hour reminders arrive that many hours before the start, or up to 15 minutes earlier. Every household member is reminded.",
                "examples": [
                  [1440, 10080]
                ],
                "items": {
                  "description": "One lead time in minutes: whole hours 60-1380, or a multiple of 1440 for days.",
                  "examples": [1440],
                  "maximum": 40320,
                  "minimum": 60,
                  "multipleOf": 60,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              },
              "startDate": {
                "description": "New first-instance date, YYYY-MM-DD. Empty string clears it.",
                "examples": ["2026-08-03"],
                "type": "string"
              },
              "startTime": {
                "description": "New local start time, HH:mm:ss.",
                "examples": ["09:00:00"],
                "type": "string"
              },
              "timezone": {
                "description": "IANA zone for startTime, e.g. 'Europe/London'. Occurrences follow its DST.",
                "examples": ["Europe/London"],
                "type": ["string", "null"]
              },
              "title": {
                "description": "New title, patched onto existing instances.",
                "examples": ["Weekly team standup"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "variant": {
                "enum": ["list", "detail", "confirmation"],
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
