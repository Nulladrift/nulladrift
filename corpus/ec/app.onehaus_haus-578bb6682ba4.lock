          "description": "Updates fields on an existing single calendar event; only the fields supplied are changed, all others keep their current value. Imported (subscription-sourced) events cannot be edited.",
          "inputSchema": {
            "examples": [
              {
                "endDateTime": "2026-08-04T15:30:00Z",
                "id": "0198f3a1b2c34d5e6f7089ab1c2d3e4f",
                "notes": "Moved to Thursday",
                "startDateTime": "2026-08-04T14:30:00Z"
              }
            ],
            "properties": {
              "description": {
                "description": "New description.",
                "examples": ["Annual checkup with Dr. Smith"],
                "type": "string"
              },
              "endDate": {
                "description": "All-day only: new LAST day, inclusive, YYYY-MM-DD. Alone it keeps the current first day. Dates are stored in the event's own end rule (see list_calendar_events).",
                "examples": ["2026-08-06"],
                "type": "string"
              },
              "endDateTime": {
                "description": "New end of a timed event, ISO 8601 UTC. Must not precede startDateTime. For all-day events send endDate instead. An all-day endDateTime is stored as given and keeps the event's own end rule (see list_calendar_events): with no source a midnight end names the LAST day, on a device-calendar event the day after it.",
                "examples": ["2026-08-04T15:30:00Z"],
                "type": "string"
              },
              "id": {
                "description": "Event id from create_calendar_event or list_calendar_events.",
                "examples": ["0198f3a1b2c34d5e6f7089ab1c2d3e4f"],
                "type": "string"
              },
              "isAllDay": {
                "description": "True for all-day, false for timed.",
                "examples": [false],
                "type": "boolean"
              },
              "location": {
                "description": "Replaces the location outright. $type 'Address' takes line1-3/postalCode/countryCode; 'OnlineLocation' takes url/notes.",
                "properties": {
                  "$type": {
                    "description": "Which location shape this is.",
                    "enum": ["Address", "OnlineLocation"],
                    "examples": ["Address"],
                    "type": "string"
                  },
                  "countryCode": {
                    "description": "ISO country code, e.g. GB.",
                    "examples": ["GB"],
                    "type": "string"
                  },
                  "line1": {
                    "description": "Address line 1. An Address needs one of line1-3 or postalCode.",
                    "examples": ["221B Baker Street"],
                    "type": "string"
                  },
                  "line2": {
                    "description": "Address line 2, e.g. flat or suite.",
                    "examples": ["Flat 3"],
                    "type": "string"
                  },
                  "line3": {
                    "description": "Address line 3.",
                    "examples": ["London"],
                    "type": "string"
                  },
                  "notes": {
                    "description": "Access detail, e.g. parking or passcode.",
                    "examples": ["Parking on level 2"],
                    "type": "string"
                  },
                  "postalCode": {
                    "description": "Postal or ZIP code.",
                    "examples": ["NW1 6XE"],
                    "type": "string"
                  },
                  "url": {
                    "description": "Absolute http/https join link.",
                    "examples": ["https://meet.google.com/abc-defg-hij"],
                    "type": "string"
                  }
                },
                "required": ["$type"],
                "type": "object"
              },
              "notes": {
                "description": "New notes.",
                "examples": ["Moved to Thursday"],
                "type": "string"
              },
              "reminderOffsetMinutes": {
                "description": "New reminder lead times, in minutes before the event starts. Send the full list: it replaces the current one. [] clears all reminders; omit to keep them. Reminders move with the start. Not allowed on imported events (device calendar or subscription). Each value is whole hours, 60-1380 (1-23 hours), or whole days, a multiple of 1440 up to 525600 (365 days); a week is 10080. Up to 5 values. An all-day event counts from 00:00 on its first day, so 300 (5 hours) is 19:00 the evening before. Day and week reminders arrive at 19:00 on the earlier day; hour reminders arrive that many hours before the start, or up to 15 minutes earlier. Every household member is reminded.",
                "examples": [
                  [1440, 10080]
                ],
                "items": {
                  "description": "One lead time in minutes: whole hours 60-1380, or a multiple of 1440 for days.",
                  "examples": [1440],
                  "maximum": 525600,
                  "minimum": 60,
                  "multipleOf": 60,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              },
              "startDate": {
                "description": "All-day only (preferred for all-day): new first day, YYYY-MM-DD. Without endDate the event becomes a single day.",
                "examples": ["2026-08-04"],
                "type": "string"
              },
              "startDateTime": {
                "description": "New start of a timed event, ISO 8601 UTC. For an all-day event send startDate instead.",
                "examples": ["2026-08-04T14:30:00Z"],
                "type": "string"
              },
              "timezone": {
                "description": "IANA zone for the wall-clock times, e.g. 'Europe/London'. Null means UTC.",
                "examples": ["Europe/London"],
                "type": ["string", "null"]
              },
              "title": {
                "description": "New event title.",
                "examples": ["Dentist appointment (rescheduled)"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "variant": {
                "enum": ["list", "detail", "confirmation"],
                "type": "string"
              }
            },
            "required": ["items"],
