        {
          "name": "create_task",
          "description": "Creates a new household task. Only title is required; the task starts unassigned and uncompleted. Set reminders with reminderOffsetMinutes. Use assign_task, update_task, or complete_task to change it afterward.",
          "inputSchema": {
            "examples": [
              {
                "assignedToMemberId": "7f3a9c2e1b4d8f6a0c5e3b7d9a1f4c6e",
                "dueDate": "2026-08-01",
                "notes": "Blue bin only",
                "reminderOffsetMinutes": [1440, 10080],
                "title": "Take out the recycling"
              }
            ],
            "properties": {
              "assignedToMemberId": {
                "description": "Member id from list_house_members.",
                "examples": ["7f3a9c2e1b4d8f6a0c5e3b7d9a1f4c6e"],
                "type": "string"
              },
              "dueDate": {
                "description": "Due date, YYYY-MM-DD.",
                "examples": ["2026-08-01"],
                "type": "string"
              },
              "isUrgent": {
                "description": "Mark the task urgent so it is shown first and highlighted.",
                "examples": [true],
                "type": "boolean"
              },
              "notes": {
                "description": "Freeform notes. Not for assignment info.",
                "examples": ["Blue bin only"],
                "type": "string"
              },
              "preparationDate": {
                "description": "Legacy single reminder date, YYYY-MM-DD; use reminderOffsetMinutes instead. Ignored when reminderOffsetMinutes is sent. Must be on or before dueDate, and needs dueDate.",
                "examples": ["2026-07-30"],
                "type": "string"
              },
              "reminderOffsetMinutes": {
                "description": "Reminder lead times, in minutes before the due date. Each value is whole hours, 60-1380 (1-23 hours), or whole days, a multiple of 1440 up to 525600 (365 days); a week is 10080. Up to 5 values. A due date counts from 00:00 on that day, so 300 (5 hours) is 19:00 the evening before. Day and week reminders arrive at 19:00 on the earlier day; hour reminders arrive that many hours before, or up to 15 minutes earlier. Needs dueDate.",
                "examples": [
                  [1440, 10080]
                ],
                "items": {
                  "description": "One lead time in minutes: whole hours 60-1380, or a multiple of 1440 for days.",
                  "examples": [1440],
                  "maximum": 525600,
                  "minimum": 60,
                  "multipleOf": 60,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              },
              "title": {
                "description": "Task title, e.g. 'Take out the recycling'.",
                "examples": ["Take out the recycling"],
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
