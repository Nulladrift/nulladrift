        {
          "name": "create_subscription",
          "description": "Track a bill such as a streaming service or membership, with an optional fee and cron renewal schedule (no more often than daily). A bill with no renewal schedule is a one-off. Set paymentDate only when the money leaves the account on a different day from the renewal.",
          "inputSchema": {
            "examples": [
              {
                "fee": {
                  "currencyCode": "USD",
                  "value": 1599
                },
                "name": "Netflix",
                "notes": "Family plan, shared with parents",
                "paymentDate": "2026-10-03",
                "remindMe": true,
                "renewalCronExpression": "0 0 1 * *",
                "startDate": "2026-10-01",
                "status": "Active"
              }
            ],
            "properties": {
              "fee": {
                "description": "Recurring charge.",
                "properties": {
                  "currencyCode": {
                    "description": "Uppercase ISO 4217 code, e.g. USD, GBP, JPY.",
                    "examples": ["USD"],
                    "pattern": "^[A-Z]{3}$",
                    "type": "string"
                  },
                  "value": {
                    "description": "Amount in the currency's minor units. Most currencies have 2 decimal places (1599 = 15.99 USD), but some have none (1500 = 1500 JPY) and a few have 3 (12345 = 12.345 KWD).",
                    "examples": [1599],
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "name": {
                "description": "Name, e.g. 'Netflix' or 'Gym membership'.",
                "examples": ["Netflix"],
                "type": "string"
              },
              "notes": {
                "description": "Free-text notes.",
                "examples": ["Family plan, shared with parents"],
                "type": "string"
              },
              "paymentDate": {
                "description": "Date the first payment leaves the account, YYYY-MM-DD, when it differs from the renewal date. Payments repeat on the renewal cadence from this date. Omit when payment happens on renewal.",
                "examples": ["2026-10-03"],
                "type": "string"
              },
              "remindMe": {
                "description": "Whether to remind the household before each renewal.",
                "examples": [true],
                "type": "boolean"
              },
              "renewalCronExpression": {
                "description": "Cron expression for the renewal cadence. No more often than daily. Omit for a one-off bill.",
                "examples": ["0 0 1 * *"],
                "type": "string"
              },
              "startDate": {
                "description": "Renewal date, YYYY-MM-DD. Optional. For a recurring bill it is the first renewal; for a one-off it is the date it is due.",
                "examples": ["2026-10-01"],
                "type": "string"
              },
              "status": {
                "description": "Status at creation.",
                "enum": ["Active", "Paused", "Cancelled"],
                "examples": ["Active"],
                "type": "string"
              }
            },
            "required": ["name", "status"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "variant": {
                "enum": ["list", "detail", "confirmation"],
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
