        {
          "name": "create_recurring_task",
          "description": "Create a recurring task. It generates task instances on a schedule, each with the reminders set in reminderOffsetMinutes.",
          "inputSchema": {
            "examples": [
              {
                "assigneeRotation": ["7f3a9c2e1b4d8f6a0c5e3b7d9a1f4c6e", "a1b2c3d4e5f60718293a4b5c6d7e8f90"],
                "cronExpression": "2 Week",
                "endDate": "2026-12-31",
                "maxOccurrences": 26,
                "notes": "Blue bin only",
                "reminderOffsetMinutes": [1440],
                "startDate": "2026-08-01",
                "title": "Take out the recycling"
              }
            ],
            "properties": {
              "assigneeRotation": {
                "description": "A member id from list_house_members.",
                "items": {
                  "description": "Member ids round-robined one per instance. Ids that are no longer members are skipped, leaving that instance unassigned.",
                  "examples": ["7f3a9c2e1b4d8f6a0c5e3b7d9a1f4c6e"],
                  "type": "string"
                },
                "type": "array"
              },
              "cronExpression": {
                "description": "Interval as 'N Unit', Unit one of Day, Week, Month, Year, e.g. '2 Week'. Not cron syntax.",
                "examples": ["2 Week"],
                "type": "string"
              },
              "endDate": {
                "description": "Inclusive last date, YYYY-MM-DD. Omit for open-ended.",
                "examples": ["2026-12-31"],
                "type": "string"
              },
              "isUrgent": {
                "description": "Mark every task this series generates as urgent.",
                "examples": [true],
                "type": "boolean"
              },
              "maxOccurrences": {
                "description": "Cap on instances generated, applied even if endDate is not reached.",
                "examples": [26],
                "type": "integer"
              },
              "notes": {
                "description": "Notes copied to every generated instance.",
                "examples": ["Blue bin only"],
                "type": "string"
              },
              "preparationDays": {
                "description": "Legacy single reminder, days before each occurrence's due date, 0-365 (0 means none); use reminderOffsetMinutes instead. Ignored when reminderOffsetMinutes is sent.",
                "examples": [1],
                "type": "integer"
              },
              "reminderOffsetMinutes": {
                "description": "Reminder lead times, in minutes before each generated task's due date. Each value is whole hours, 60-1380 (1-23 hours), or whole days, a multiple of 1440 up to 40320 (4 weeks, the most for a repeating item); a week is 10080. Up to 5 values. A due date counts from 00:00 on that day, so 300 (5 hours) is 19:00 the evening before. Day and week reminders arrive at 19:00 on the earlier day; hour reminders arrive that many hours before, or up to 15 minutes earlier.",
                "examples": [
                  [1440, 10080]
                ],
                "items": {
                  "description": "One lead time in minutes: whole hours 60-1380, or a multiple of 1440 for days.",
                  "examples": [1440],
                  "maximum": 40320,
                  "minimum": 60,
                  "multipleOf": 60,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              },
              "startDate": {
                "description": "First date to generate from, YYYY-MM-DD. Defaults to today.",
                "examples": ["2026-08-01"],
                "type": "string"
              },
              "title": {
                "description": "Title given to every generated instance.",
                "examples": ["Take out the recycling"],
                "type": "string"
              }
            },
            "required": ["cronExpression", "title"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "variant": {
                "enum": ["list", "detail", "confirmation"],
                "type": "string"
              }
            },
