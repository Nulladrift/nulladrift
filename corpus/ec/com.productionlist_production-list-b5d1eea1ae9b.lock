{
  "lockfileVersion": 2,
  "subjects": {
    "com.productionlist/production-list": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.productionlist.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "production-list",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Production List is a live directory of film and television productions (development, pre-production, production, post) with the companies and named people attached to each. The tools look up productions, companies, the people attached to them, and what is filming in a place. Every record carries `url` (the public page to cite) and `updated_at`; link the title and state the last-updated date in words. `search_productions.q` matches TITLES only. For what is filming in a place now use stage=in-production; for what is coming, stage=in-pre-production and production_dates.start. For who is producing, casting or directing a title use `get_production`; for a company's productions use `get_company`, which returns them. If a filter value is rejected, `get_taxonomies` lists the valid slugs. Never provide, infer or search for contact details; when asked how to reach a production, say the contacts are on file for members and link the page.",
      "tools": [
        {
          "name": "get_company",
          "title": "Get a company and its productions",
          "description": "Returns one production company by slug, id, or productionlist.com/production-contact/… URL, with its description, categories, website, url, and the productions attached to it (active first). Contact details are never included.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id_or_slug": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id_or_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a company and its productions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:129e5a784793bab11302548ffd12203ddbd1a1a323ae92c24c608facaa79ccb2"
        },
        {
          "name": "get_production",
          "title": "Get a production",
          "description": "Returns one production by slug, id, or productionlist.com/production/… URL: synopsis, stage, dates, locations, attached companies, and attached people with their roles (producer, casting director, director, writer…). Contact details are never included; the contacts field states whether contacts are on file for members.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id_or_slug": {
                "description": "Slug (preferred), numeric id, or the page URL",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id_or_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a production"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86f0e47f76c21bc53b0c4de68f252f1728388e2ac205d034032cdd1fb291c59b"
        },
        {
          "name": "get_taxonomies",
          "title": "List valid filter values",
          "description": "Returns the valid slugs for the stage, type, status and company category filters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List valid filter values"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad2f5fc29ae19cf16df7d9a93022884b94587b354f8eb6781f9570270416880e"
        },
        {
          "name": "search_companies",
          "title": "Search production companies",
          "description": "Finds production companies by name substring (q) or company category slug. Returns name, categories, description, website and url; a company's productions are not included.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search production companies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:556dd4776c61f6b9abf72c071042db02feb98b67b8f668af7632080c5dbb85da"
        },
        {
          "name": "search_productions",
          "title": "Search productions",
          "description": "Searches and filters film and TV productions. q matches the title only (not companies or people). stage: in-development | in-pre-production | in-production | in-post-production | completed. city / state / country match the shooting location (state is a two-letter US or Canadian code such as GA; UK regions by name, such as England). since = first detected on or after an ISO date; updated_since = changed on or after. Results are newest first. Each result includes its public page url, updated_at, and production_dates.start where known.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "description": "Results per page (free tier caps at 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Title substring, case-insensitive",
                "maxLength": 120,
                "type": "string"
              },
              "since": {
                "description": "ISO date: only productions first detected on or after",
                "maxLength": 30,
                "type": "string"
              },
              "stage": {
                "enum": ["in-development", "in-pre-production", "in-production", "in-post-production", "completed"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state / Canadian province, or a UK region name",
                "maxLength": 40,
                "type": "string"
              },
              "status": {
                "description": "Detection status slug, e.g. casting",
                "maxLength": 60,
                "type": "string"
              },
              "type": {
                "description": "Production type slug, e.g. feature-film or series",
                "maxLength": 60,
                "type": "string"
              },
              "updated_since": {
                "description": "ISO date: only productions updated on or after",
                "maxLength": 30,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search productions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fa10f862bcc64c8830975f0847eeac15288543b94f853eac9406604e959e695f"
        }
      ],
      "digest": "sha256:d30dcaa157a45183e5a47ffcacdd3d5c28be26f37026a00d0fbff4314d98f4e3"
    }
  }
