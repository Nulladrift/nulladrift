      "serverInfo": {
        "name": "pofx-tools",
        "title": "PoF-X deterministic rule checks and time stamps",
        "version": "1.7.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PoF-X: deterministic compliance verdicts and free time stamps, no account. To check values against a rule: call list_rule_packs (a word such as sulphur, CII, FuelEU or ETS finds packs), read the fields of the pack you choose, then call check_rules with records of those fields; each rule returns ADMIT, REJECT or NOVERDICT, the margin B to its limit and the legal citation. The same input always gives the same verdict. generate_test_cases gives records at the edges of a pack's limits. A verdict is a supporting result on the values given, not an official approval. To time-stamp: send only the SHA-256 of the content (64 hex digits), never the content; receipts are signed (Ed25519) and each UTC day is anchored in OpenTimestamps (Bitcoin). check_rules has a daily limit per address; request_api_key gives a free key (no e-mail) with a higher limit. Your own rules: write a pack in the open pack language (https://platform.ethtopology.com/pack-language.txt) and run it with check_own_pack; for the full kernel inside your own silicon or systems, use request_kernel. Technical note and the open pack language, citable: https://doi.org/10.5281/zenodo.24623441",
      "tools": [
        {
          "name": "check_conflicts",
          "title": "Find contradictions in a rule pack",
          "description": "Decides in exact rational arithmetic whether the rules of a pack (base64) still admit some value on every field, or whether no record can ever be admitted; also one field id with two units. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pack": {
                "type": "string"
              }
            },
            "required": ["pack"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b4242e1293c951badb34db366d53373e5fdc75faf64143bd04b71964ce745b66"
        },
        {
          "name": "check_own_pack",
          "title": "Judge values with your own rule pack",
          "description": "Run the PoF-X kernel on a rule pack you wrote (the open pack language: https://platform.ethtopology.com/pack-language.txt). Give pack_text (or pack, base64) and records (objects of field values). The kernel certifies the pack, seals it and returns per record ADMIT, REJECT or NOVERDICT, the margin B to every limit, and the sealed pack and chain to replay. Deterministic: the same input always gives the same verdict. Free within the daily limit of check_rules; a refused pack is not counted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pack": {
                "type": "string"
              },
              "pack_text": {
                "type": "string"
              },
              "records": {
                "items": {
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["records"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:53c1d89054ccff9646c07c451b03766282c9fee946affa0c8b46f25f79cafb42"
        },
