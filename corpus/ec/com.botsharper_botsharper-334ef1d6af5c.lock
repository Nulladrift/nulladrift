      "serverInfo": {
        "name": "botsharper",
        "version": "1.5.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "BotSharper tests Solana trading bots on real on-chain results (botsharper_test_my_bot), simulates bot settings on real pump.fun launches before any SOL is spent (botsharper_simulate_bot), flags serial creators and launch-team wallets (botsharper_check_wallet) and gives today's pump.fun weather and serial launch teams (botsharper_pump_weather). It also reports where a Solana address ranks among measured pump.fun operators (botsharper_wallet_report), what happened on a pump.fun token since its launch (botsharper_token_sheet) and the benchmarks of each fifth of operators (botsharper_benchmarks). Past facts only: no forecast, no advice.",
      "tools": [
        {
          "name": "botsharper_benchmarks",
          "description": "Benchmarks of the five quintiles of measured operators (share of winning positions, share of total losses, multiple) and the size of the measured population.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4bb724d3068accc35daf1da28e9628beceae697fdddfb456568ec09edf7386ed"
        },
        {
          "name": "botsharper_check_wallet",
          "description": "Protection filter for trading bots: tells whether a Solana address is a serial pump.fun creator (3+ launches in the last 7 days, how often it dumped within 5 minutes, how many of its launches migrated) and/or a wallet that repeatedly buys in the launch block of a serial creator's tokens (launch team). Check a token's creator before buying. Updated hourly. Facts about the last 7 days, not advice.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "public Solana address (creator or wallet), base58",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a creator or wallet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0766d65b8ee17c8b8297631e6381f910dd0d2e2f0e109e334c5dc3cff09f6f5"
        },
        {
          "name": "botsharper_pump_weather",
          "description": "Today's pump.fun weather (refreshed hourly): launches per hour, share of launches prepared in advance (3+ buyers in the launch block), share of creators dumping within 5 minutes, migrations, share of winning positions, which entry speed made money in the last 24 h (launch block / 1-10 s / 10 s-5 min / later), and serial launch teams of the last 7 days. Use it before tuning a bot or when someone asks what is happening on pump.fun now. Past facts, not a forecast.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "pump.fun weather"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a08adeccf5393bdf596bfc949a56b334770fd3fb46da7258244678d96e94001b"
        },
        {
          "name": "botsharper_simulate_bot",
          "description": "Simulate / backtest a pump.fun sniper or trading bot BEFORE risking SOL: replays its settings on real recent pump.fun launches (fees, priority fee and price impact included, pessimistic fills) and returns what 3 SOL would have become with 0.1 SOL per trade and 30 trades a day: median final balance, share of replays that ran out of SOL and after how many days, result per trade, share of winning trades, plus the median real result of bots that buy as fast, and a link to the interactive chart where any amount can be tried. Use it when someone asks whether a bot strategy or settings (entry delay, take profit, stop loss, holding time, filters) would make money. Past data, not a forecast, not advice.",
          "inputSchema": {
            "properties": {
              "buys": {
                "description": "'trending' = only tokens already up 2x when it buys (default), 'all' = every new token",
                "type": "string"
              },
              "entry": {
                "description": "how fast the bot buys after launch: block, 1s, 5s, 10s, 30s, 1m, 2m or 5m (default 2m)",
                "type": "string"
              },
              "max_hold_seconds": {
                "description": "sell anyway after this many seconds (grid 10, 60, 300, 1800, 3600, 21600; default 300)",
                "type": "number"
              },
              "skip_prepared": {
                "description": "skip launches with 3+ buyers in the launch block",
                "type": "boolean"
              },
              "skip_serial_creators": {
                "description": "skip creators with 3+ launches in the last 7 days",
                "type": "boolean"
              },
              "stop_loss": {
                "description": "sell when price falls by this fraction, e.g. 0.3 for -30 % (0 = none; grid 0.2, 0.3, 0.5)",
                "type": "number"
              },
              "take_profit": {
                "description": "sell when price reaches this multiple of the entry, e.g. 2 (0 = none; grid 1.5, 2, 3, 5)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Simulate a bot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e0773d91caf16b7052c126d4b2a2b4dadc7b1ed74d26fa4abc2335e5f1a5b4b"
        },
        {
          "name": "botsharper_test_my_bot",
          "description": "Test / improve / debug a Solana trading bot (pump.fun, PumpSwap, sniper, copy-trading bot): give the bot's public wallet address and get its REAL net result in SOL over the measured period, up to 60 days (fees included, unsold tokens valued at the lower of cost and market price), number of positions, share of winning positions, rank among 100,000+ active bots, and the last 7 days. Use it whenever someone asks how to improve, tune, evaluate or benchmark their crypto trading bot. Past facts only, not advice.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "public Solana wallet address the bot trades from (base58)",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Test my bot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d9c85893b89c90cf9637d4e1877ab0302ad1aff07e2166c732b567af58c2db4"
        },
        {
          "name": "botsharper_token_sheet",
          "description": "Token sheet for a pump.fun token (mint address) observed by BotSharper: launch time, buyers in the launch block, in the first second and the first 10 seconds, what the creator bought and sold, share of the 5 largest buyers in the first 5 minutes, migration to PumpSwap, buyers and sellers, volume, and how many buyers appear in the wallet report (including best and weakest fifth). Past facts only, updated hourly: no forecast, no advice.",
          "inputSchema": {
            "properties": {
              "token": {
                "description": "Solana token (mint) address, base58",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Token sheet"
          },
          "behavior": {
