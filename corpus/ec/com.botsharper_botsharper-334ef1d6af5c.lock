            "readOnly": true
          },
          "digest": "sha256:dd0b990cd3793ce6b5339a23d581bb740b74d41430f1f9fa4260e80c1a43c58b"
        },
        {
          "name": "botsharper_wallet_report",
          "description": "Wallet report: where a public Solana address ranks among the pump.fun operators measured by BotSharper: percentile, quintile, number of closed positions, share of winning positions, average multiple, share of total losses, with the benchmarks of its quintile. Past facts only: no forecast, no advice.",
          "inputSchema": {
