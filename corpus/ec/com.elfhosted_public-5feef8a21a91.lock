  "subjects": {
    "com.elfhosted/public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.elfhosted.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "elfhosted",
        "version": "0.2.13"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ElfHosted hosts open-source apps for you, so there's no server to run: your own private AIOStreams for Stremio, Immich for photos, your own AI agent with OpenClaw or Hermes, Plex, Emby or Jellyfin streaming from your own debrid and Usenet accounts, and a wide catalogue of everyday apps such as Mealie, Audiobookshelf and Vaultwarden. These public tools need no account: browse and compare apps, check prices and savings, see how the trial works, search the docs, check platform status, find a setup that fits how someone watches (find_my_setup), and find apps that pair with ones they already run (second_breakfast). They can't see anyone's own apps. Someone without an account can start with the $1, 7-day trial (how_the_trial_works). Existing customers can switch to their own private MCP server, which sees their apps and can ask for changes: see connect_my_account.",
      "tools": [
        {
          "name": "browse_apps",
          "title": "Browse apps",
          "description": "Search ElfHosted's catalogue of apps and bundles by name or by what you want done, such as \"photos\" or \"password manager\". Returns each match's name, a short description, its live price and its store link. With no search words, AIOStreams, Immich, OpenClaw and Hermes come first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many to return (1 to 20, default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "An app name, such as \"aiostreams\", \"immich\" or \"plex\", or what it should do, such as \"photos\", \"recipes\" or \"media server\". Leave out to list the featured apps, then the first page of the catalogue.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse apps"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f6f3521c920169c8ac4b1db178b3791eedeb486f0ff4f1f52fa787c18869694"
        },
        {
          "name": "compare_apps",
          "title": "Compare apps",
          "description": "Compare 2 to 5 ElfHosted apps or bundles side by side: name, description, live price and store link for each. Give store product ids or names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "products": {
                "description": "Product names, search words or store product ids.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare apps"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:254a14f31c5120c4ca22f88475ebfd40c68dfa8661c3e3af6746c985358f45c4"
        },
        {
          "name": "connect_my_account",
          "title": "Connect my account",
          "description": "How an ElfHosted customer connects their agent to their own private MCP server, which sees their apps and can ask for changes, with the steps for claude.ai, ChatGPT, Claude Code and Cursor. Read from the docs, with the link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Connect my account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1dc4bd84cbc132654473281e64a040fa3e133bd0e6524d5d4a78db1e36f78ee"
        },
        {
          "name": "find_my_setup",
          "title": "Find my setup",
          "description": "Suggests which ElfHosted path fits how someone watches and what they want: Stremio with their own private AIOStreams, a Plex, Emby or Jellyfin library, or Flex for everyday apps such as photos, recipes and notes. Rules-based, with live store links and prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "already_use": {
                "description": "What they use today: Plex, Emby, Jellyfin, Stremio, or none.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "budget_monthly_usd": {
                "minimum": 0,
                "type": "number"
              },
              "household_size": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "wants": {
                "description": "addons: Stremio with their own private AIOStreams and other addons; library: Plex, Emby or Jellyfin with the *arrs and their own provider accounts; apps: everyday apps such as notes, photos and recipes.",
                "enum": ["library", "addons", "apps"],
                "type": "string"
              },
              "watch_on": {
                "description": "Where they watch: Apple TV, Android TV or Google TV, Fire TV, Roku, LG or Samsung TV, phone, browser, Stremio.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find my setup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11d6c8c0556b0cdad8c13473df43ca0d494b5fc599c727c78dd7a7068a70b085"
        },
        {
          "name": "get_doc",
          "title": "Read a docs page",
          "description": "Read one page of the public ElfHosted docs as markdown. Give its path (\"app/plex\", \"ai-agents\") or its docs.elfhosted.com link, as search_docs returns. Long pages are cut short.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "The page path, such as \"app/plex\", or its link.",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
