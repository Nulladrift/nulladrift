        },
        {
          "name": "how_the_trial_works",
          "title": "How the trial works",
          "description": "How ElfHosted's $1 trial works: how long it runs, what you get, which products are not on trial, what happens when it ends, and how to cancel. Read from the trial page of the docs, with its link.",
