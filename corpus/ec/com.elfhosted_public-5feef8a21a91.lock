        {
          "name": "second_breakfast",
          "title": "Second breakfast: apps that pair well",
          "description": "For someone happy with their stack who wants more: suggests up to 5 ElfHosted apps that pair with the apps they list, never one they already run, each with why and a live store link. Rules-based.",
          "inputSchema": {
