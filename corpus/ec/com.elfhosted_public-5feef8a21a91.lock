        {
          "name": "save_me_money",
          "title": "Save me money",
          "description": "Ways to pay less for an ElfHosted app: prepaying 3, 6 or 12 months, and paying with ElfBuckz bought with Bitcoin, which stacks with prepaying. Give a product (a name, search words or a store product id) to get its live monthly price and what each term costs; without one, it explains the savings with a worked example.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Optional: an app or bundle name, search words, or a store product id.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Save me money"
