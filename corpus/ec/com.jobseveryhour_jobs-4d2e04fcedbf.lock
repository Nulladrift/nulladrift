{
  "lockfileVersion": 2,
  "subjects": {
    "com.jobseveryhour/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jobseveryhour.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "jobs",
        "title": "Jobs Every Hour",
        "version": "1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Open tech jobs from Jobs Every Hour, read from employers' own careers pages every hour. search_jobs finds jobs; get_job reads one. Always give the person the job's page or apply link; you apply on the employer's site.",
      "tools": [
        {
          "name": "get_job",
          "title": "Read one job",
          "description": "The full posting of one job: the employer's own text, place, pay, when it was posted, when it was last seen open, and the link to apply on the employer's site.",
          "inputSchema": {
            "properties": {
              "job": {
                "description": "The job's slug or its page address, as search_jobs gives them",
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fdd8c43fbf361b8786a9da5c510356e0c4283502b1c667c8926cfeed4b624cb2"
        },
        {
          "name": "search_jobs",
          "title": "Search open jobs",
          "description": "Search the open tech jobs on Jobs Every Hour: every job is read from the employer's own careers page and re-checked every hour. Words are matched in the title, company, skills, place and text of each posting, best match first. Add 'remote' for remote jobs only.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, e.g. 'senior python engineer berlin' or 'solidity remote'",
                "type": "string"
              },
              "remote_only": {
                "default": false,
                "description": "Only remote jobs",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8237331539d9b19129426d3714e1ddeef9668bb1f364dfec2aa1d541f5ef325d"
        }
      ],
      "digest": "sha256:7c4dd2f31ed8827e7411e06fbfabb0934b1a17e8ec1e5cb1b0ff513779d6d8ae"
    }
  }
}
