{
  "lockfileVersion": 2,
  "subjects": {
    "com.jobseveryhour/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jobseveryhour.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "jobs",
        "title": "Jobs Every Hour",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Jobs Every Hour: open jobs in every field: healthcare, engineering, sales, skilled trades, retail, office, education, government and more, mostly in the United States, plus remote jobs and jobs in many other countries. Every job is read from the employer's own careers page (US federal jobs from USAJOBS), and the lists are read again around the clock, so a job the employer takes down leaves the results. search_jobs finds jobs by words (role, skill, company, place, 'remote', 'entry level'); get_job reads one posting in full. Always give the person the job's page or apply link; people apply on the employer's site.",
      "tools": [
        {
          "name": "get_job",
          "title": "Read one job",
          "description": "The full posting of one job: the employer's own text, place, pay, when it was posted, when it was last seen open, and the link to apply on the employer's site.",
          "inputSchema": {
            "properties": {
              "job": {
                "description": "The job's slug or its page address, as search_jobs gives them",
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read one job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ad44c27595b670c9f7d3478c806267e0585f3c7be487c34a71e0fe25efb55c20"
        },
        {
          "name": "search_jobs",
          "title": "Search open jobs",
          "description": "Search Jobs Every Hour: open jobs in every field: healthcare, engineering, sales, skilled trades, retail, office, education, government and more, mostly in the United States, plus remote jobs and jobs in many other countries. Every job is read from the employer's own careers page (US federal jobs from USAJOBS), and the lists are read again around the clock, so a job the employer takes down leaves the results. Words are matched in the title, company, skills, place and text of each posting, best match first, e.g. 'registered nurse houston', 'entry level accounting', 'warehouse night shift' or 'python remote'. The word 'remote' (or remote_only) keeps remote jobs only. Each result has the place, the pay when the posting states it, the posting date and the job's page.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for: a role, skill, company or place, e.g. 'entry level nurse texas' or 'customer service remote'",
                "type": "string"
              },
              "remote_only": {
                "default": false,
                "description": "Only remote jobs",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search open jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2789394fe6797b99fd5cd110e93e4ce4b86e7480911bab34a1932bdf1d430cbb"
        }
      ],
      "digest": "sha256:bb27be2e1abd0726e0f8b603476bea079cd1249cc4f71ba10a980f737a110580"
    }
  }
}
