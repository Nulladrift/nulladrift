                    },
                    "status": {
                      "enum": ["processing", "completed", "failed"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "kind", "model", "modelName", "status"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["creations"],
            "type": "object"
          },
