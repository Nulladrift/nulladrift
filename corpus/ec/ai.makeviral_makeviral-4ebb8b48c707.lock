                        "look": {
                          "type": "string"
                        },
                        "refIds": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["key", "look"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "proofLines": {
                    "description": "One short ALL CAPS line per proof photo",
                    "items": {
