                    "kind": {
                      "description": "person = becomes a character; logo / screenshot = shown in a place",
                      "enum": ["person", "logo", "screenshot", "place", "other"],
                      "type": "string"
                    },
                    "name": {
                      "description": "The name the story uses, e.g. 'Grandpa Ali', 'Acme logo'",
                      "type": "string"
                    },
                    "note": {
                      "description": "A short note, e.g. 'me at 30', 'our first office'",
                      "type": "string"
                    }
                  },
                  "required": ["id", "kind"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "seconds": {
                "description": "Target length of the animated part. Default 60. With your own script, its scenes set the length.",
                "enum": [30, 45, 60],
                "type": "integer"
              },
              "story": {
                "description": "The story in the user's words (needed when there is no draft)",
