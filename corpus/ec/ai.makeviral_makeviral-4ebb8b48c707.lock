                "type": "string"
              },
              "music": {
                "description": "Music bed. Default legacy (dark trap beat, big lift at the end).",
                "enum": ["legacy", "epic", "emotional", "upbeat", "adventure", "dark", "none"],
                "type": "string"
              },
              "proofCount": {
                "description": "How many real photos the film ends on",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "quality": {
                "description": "Size; must be one the model offers (legacy_story_guide). Default: the model's default (H3: 768p).",
                "enum": ["768p", "2k", "720p", "480p", "1080p"],
                "type": "string"
