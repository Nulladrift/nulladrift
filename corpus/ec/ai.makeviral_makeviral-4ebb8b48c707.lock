        {
          "name": "create_video",
          "title": "Make an AI video",
          "description": "Make an AI video from the user's prompt with a chosen MakeViral Create model (Seedance, Kling, Veo, Wan, Grok Imagine, MiniMax...): from text, from a start frame photo (and an end frame on some models), or from references (photos, clips and sounds), with Kling multi-shot and elements. It spends credits from the user's MakeViral account (a failed video gives them back). A video takes a few minutes: this call returns at once, then call get_creation with wait true until it is ready and give the user the link. Before calling: 1) pick the model and check what it takes with get_model, 2) tell the user the price in credits, 3) with photos or clips, ask the user to confirm the people in them are them or agreed, and that no one is a child. Files: pass files the user attached in this chat (startFrame, endFrame, referencePhotos, referenceSounds), or public https links in the *Url fields. Clips must be links (MP4 or MOV). Never use photos of a public figure or of someone who did not agree. Calling again with the same input within 10 minutes returns the first video; pass a new requestId to make another.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "description": "Shape. Default 9:16 (vertical). With a start frame most models follow the photo's shape.",
                "enum": ["9:16", "3:4", "1:1", "4:3", "16:9", "21:9", "2:3", "3:2"],
                "type": "string"
              },
              "autoShots": {
                "description": "Kling Omni: the model plans the shots itself",
                "type": "boolean"
              },
              "clipMode": {
                "description": "Kling Omni with a clip: 'edit' changes the clip itself (default), 'reference' makes a new video from it",
                "enum": ["edit", "reference"],
                "type": "string"
              },
              "count": {
                "description": "How many videos (each one is charged). Default 1.",
                "maximum": 2,
                "minimum": 1,
                "type": "integer"
              },
              "durationSec": {
                "description": "Length in seconds (get_model lists them). Default: the model's default.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "elementPhotos": {
                "description": "The element photos attached in the chat, element by element in order",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "description": "Temporary link to the file",
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "elements": {
                "description": "Kling 3.0 elements: people or things from 2-4 photos each",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "description": "Who or what it is, in a few words",
                      "type": "string"
                    },
                    "name": {
                      "description": "Lower case, e.g. 'mia'; write @mia in the prompt",
                      "type": "string"
                    },
                    "photoCount": {
                      "description": "How many of elementPhotos belong to it, in order",
                      "maximum": 4,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "photoUrls": {
                      "description": "2-4 public photo links of it",
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 4,
                      "type": "array"
                    }
                  },
                  "required": ["description", "name"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "endFrame": {
                "additionalProperties": false,
                "description": "The last frame (models with an end frame), with a start frame",
                "properties": {
                  "download_url": {
                    "description": "Temporary link to the file",
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "endFrameUrl": {
                "description": "The last frame as a public https photo link",
                "type": "string"
              },
              "keepClipSound": {
                "description": "With a clip: put the clip's own sound on the result",
                "type": "boolean"
              },
              "model": {
                "description": "Video model id (list_models). seedance-2-5 is a good default.",
                "enum": ["seedance-2-5", "kling-3-pro", "kling-3-omni", "veo-3-1-fast", "wan-3", "minimax-h3", "seedance-2", "veo-3-1-quality", "veo-3-1-lite", "seedance-2-fast", "grok-imagine", "seedance-2-mini"],
                "type": "string"
              },
              "motion": {
                "description": "Grok Imagine only",
                "enum": ["normal", "fun"],
                "type": "string"
              },
              "photosConsent": {
                "description": "Needed with photos or clips: true only after the user confirmed everyone in them is the user or agreed, and no one is a child",
                "type": "boolean"
              },
              "prompt": {
                "description": "What happens in the video. With references, name them as get_model says (e.g. [Image 1]).",
                "type": "string"
              },
              "referenceClipUrls": {
                "description": "Reference clips as public https links to an MP4 or MOV file",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "referenceClips": {
                "description": "Reference clips (MP4 or MOV) as files, where the chat can attach them",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "description": "Temporary link to the file",
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "referencePhotoUrls": {
                "description": "Reference photos as public https links",
                "items": {
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              },
              "referencePhotos": {
                "description": "Reference photos attached in the chat (people, products, a style). Never with frames.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "description": "Temporary link to the file",
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 9,
                "type": "array"
              },
              "referenceSoundUrls": {
                "description": "Reference sounds as public https links",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "referenceSounds": {
                "description": "Reference sounds (MP3 or WAV) attached in the chat",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "description": "Temporary link to the file",
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "requestId": {
                "description": "Optional id (8-64 letters, digits, - or _). The same id never charges twice.",
                "type": "string"
              },
              "resolution": {
                "description": "Size. Default: the model's smallest.",
                "enum": ["480p", "720p", "1080p", "4k", "768p", "2k"],
                "type": "string"
              },
              "seed": {
                "description": "Wan only: repeat a result",
                "minimum": 0,
                "type": "integer"
              },
              "shots": {
                "description": "Kling multi-shot: each shot's prompt and length; they add up to the video length",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "durationSec": {
                      "maximum": 15,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "prompt": {
                      "type": "string"
                    }
                  },
                  "required": ["durationSec", "prompt"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              },
              "sound": {
                "description": "Sound on or off where the model has the choice. Default on.",
                "type": "boolean"
              },
              "startFrame": {
                "additionalProperties": false,
                "description": "The first frame: a photo the user attached in the chat",
                "properties": {
                  "download_url": {
                    "description": "Temporary link to the file",
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "startFrameUrl": {
                "description": "The first frame as a public https photo link",
                "type": "string"
              },
              "webSearch": {
                "description": "Seedance, text to video only: look things up online",
                "type": "boolean"
              }
            },
            "required": ["model"],
