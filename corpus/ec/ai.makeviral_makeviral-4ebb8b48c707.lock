      "instructions": "MakeViral makes trend videos and photos from the user's own photos with ready-made templates, and AI images and videos from the user's own prompt with a chosen model (MakeViral Create). Each run uses credits from the user's MakeViral account, and a failed run returns them. Tell the user the price in credits before a run. Use only photos of the user or of adults who agreed, never photos of children or public figures. Templates: search_templates, get_template, then run_template. For a video, call get_run with wait true until it is done. Own prompt: list_models, get_model, then create_image or create_video. For a video, call get_creation with wait true until it is ready. Story videos (you may write the script yourself with the guide's rules, or send only the idea): faceless narrated videos (what if, scary, history...) with story_video_guide, check_story_video, start_story_video, get_story_video; a Legacy story (an animated film of a life or business story) with legacy_story_guide, check_legacy_story, start_legacy_story, get_legacy_story; a fruit soap opera with fruit_story_guide, start_fruit_story, get_fruit_story. Call the get tool with wait true until it is done.",
      "tools": [
        {
          "name": "check_legacy_story",
