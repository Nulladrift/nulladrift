                    "download_url": {
                      "description": "Temporary link to the file",
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
