        {
          "name": "get_creation",
          "title": "Check an image or video",
          "description": "Check images or videos started with create_image or create_video: status, minutes left, and the finished link when ready. With wait true the call waits up to 40 seconds for them to finish, so you can wait for the result in the same answer and then give the user the link.",
