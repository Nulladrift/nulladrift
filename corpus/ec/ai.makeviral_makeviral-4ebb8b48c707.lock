      "instructions": "MakeViral makes trend videos and photos from the user's own photos with ready-made templates, and AI images and videos from the user's own prompt with a chosen model (MakeViral Create). Each run uses credits from the user's MakeViral account, and a failed run returns them. Tell the user the price in credits before a run. Use only photos of the user or of adults who agreed, never photos of children or public figures. Templates: search_templates, get_template, then run_template. For a video, call get_run with wait true until it is done. Own prompt: list_models, get_model, then create_image or create_video. For a video, call get_creation with wait true until it is ready.",
      "tools": [
        {
          "name": "create_image",
          "title": "Make an AI image",
          "description": "Make AI images from the user's prompt with a chosen MakeViral Create model, from text or from the user's photos (edit a photo, put a person in a new scene, combine photos). It spends credits from the user's MakeViral account (a failed image gives them back) and usually returns the finished image link in this call. Before calling: 1) pick the model (get_model gives its sizes and prices), 2) tell the user the price in credits, 3) when photos are used, ask the user to confirm the people in them are them or agreed, and that no one is a child. Photos: pass the files the user attached in this chat as `photos`, or public image links as `photoUrls`. Never use photos of a public figure or of someone who did not agree. Calling again with the same input within 10 minutes returns the first result; pass a new requestId to make more.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "description": "Shape. Default 9:16 (vertical, for TikTok and Reels).",
                "enum": ["9:16", "16:9", "1:1", "4:3", "3:4", "4:5", "3:2", "2:3", "21:9", "5:4"],
                "type": "string"
              },
              "count": {
                "description": "How many images (each one is charged). Default 1.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Image model id (list_models). nano-banana-2 is a good default.",
                "enum": ["nano-banana-pro", "nano-banana-2-1", "nano-banana-2", "gpt-image-2-5", "seedream-5-pro", "flux-2-pro", "z-image"],
                "type": "string"
              },
              "photoUrls": {
                "description": "Public https links to photos (JPEG, PNG or WebP)",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "photos": {
                "description": "The user's photos attached in the chat (references to edit or follow)",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "description": "Temporary link to the file",
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "photosConsent": {
                "description": "Needed with photos: true only after the user confirmed everyone in them is the user or agreed, and no one is a child",
                "type": "boolean"
              },
              "prompt": {
                "description": "What the image shows, in the user's words, made clear and specific",
                "type": "string"
              },
              "requestId": {
                "description": "Optional id (8-64 letters, digits, - or _). The same id never charges twice.",
                "type": "string"
              },
              "resolution": {
                "description": "Size. Default: the model's smallest (1K).",
                "enum": ["1K", "2K", "4K"],
                "type": "string"
              },
              "transparentBackground": {
                "description": "GPT Image only, text only: a transparent background",
                "type": "boolean"
              }
            },
            "required": ["model", "prompt"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "creations": {
                "items": {
                  "properties": {
                    "appUrl": {
                      "type": "string"
                    },
                    "aspect": {
                      "type": "string"
                    },
                    "creditsCharged": {
                      "type": "number"
                    },
                    "creditsRefunded": {
                      "type": "number"
                    },
                    "durationSec": {
                      "type": "number"
                    },
                    "error": {
                      "type": "string"
                    },
                    "etaMinutes": {
                      "type": "number"
                    },
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["image", "video"],
                      "type": "string"
                    },
                    "model": {
                      "type": "string"
                    },
                    "modelName": {
                      "type": "string"
                    },
                    "previewUrl": {
                      "type": "string"
                    },
                    "prompt": {
                      "type": "string"
                    },
                    "resolution": {
                      "type": "string"
                    },
                    "saveUrl": {
                      "type": "string"
                    },
