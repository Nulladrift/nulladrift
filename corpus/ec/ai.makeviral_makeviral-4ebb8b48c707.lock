                        }
                      },
                      "required": ["beat", "cast", "place", "seconds", "shots"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "characters": {
                    "items": {
                      "properties": {
                        "key": {
                          "type": "string"
                        },
                        "look": {
                          "description": "English: age, build, hair, face, clothes, one signature detail",
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "refId": {
                          "description": "The id of a person reference",
                          "type": "string"
                        },
                        "sameAs": {
                          "description": "The key of the main character this is a younger or older version of",
                          "type": "string"
                        },
                        "voiceId": {
                          "description": "A voice id from legacy_story_guide",
                          "type": "string"
                        }
                      },
                      "required": ["key", "look", "name", "voiceId"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "places": {
                    "items": {
                      "properties": {
                        "key": {
                          "type": "string"
                        },
                        "look": {
                          "type": "string"
                        },
                        "refIds": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["key", "look"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "proofLines": {
                    "description": "One short ALL CAPS line per proof photo",
                    "items": {
