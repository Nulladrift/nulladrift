        {
          "name": "run_template",
          "title": "Make a trend video or photo",
          "description": "Make a MakeViral trend video or photo from the user's photos. It spends the version's credits from the user's MakeViral account (a failed run gives them all back). A photo is usually ready in this call and the result has the link. A video takes a few minutes: then call get_run with wait true until it is ready, and give the user the link. Before calling: 1) pick the template and version with get_template, 2) tell the user the price in credits, 3) ask for exactly the photos that version needs, in its order, 4) ask the user to confirm the people in the photos are them or people who agreed, and that no one in them is a child. Photos: pass the files the user attached in this chat as `photos`, OR public image links as `photoUrls`, OR an `uploadId` from create_upload_link when the user cannot attach files here. Never use photos of a public figure or of someone who did not agree. When the account can pay, the photos are checked before the charge: a blurry, dark or low-resolution photo, a small or missing face, a group photo in a one-person slot, or a person in a pet slot returns an explanation and charges nothing. Then ask for a better photo, or for the user's OK to go on with acceptLowQualityPhoto.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acceptLowQualityPhoto": {
                "description": "Only after this tool said a photo has a quality problem: true when the user chose to go on with these photos and agreed that MakeViral is not responsible for results caused by photo quality and gives no refund for them. Leave it out otherwise.",
                "type": "boolean"
              },
              "fields": {
                "description": "Optional 'make it yours' values: one { id, value } per field id that get_template lists",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "value"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "object": {
                "additionalProperties": false,
                "description": "Knight sword swap only: the object one knight hands the other",
                "properties": {
                  "pick": {
                    "type": "string"
                  },
                  "text": {
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "photoSubjects": {
                "description": "Optional: what a photo shows when it is NOT a person (a pet or animal, a robot, toy or cartoon character, or something else). The video keeps that one's own body and look, and the face check does not ask for a face on it. No consent is needed for this.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "photo": {
                      "description": "1 = the first photo",
                      "maximum": 4,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "subject": {
                      "enum": ["person", "animal", "character", "other"],
                      "type": "string"
                    },
                    "what": {
                      "description": "Optional: what it is in the user's words, e.g. 'golden retriever' or 'red robot toy'",
                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["photo", "subject"],
                  "type": "object"
                },
                "maxItems": 4,
                "type": "array"
              },
              "photoUrls": {
                "description": "Public https links to the photos (JPEG, PNG or WebP), in the version's photo order",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "photos": {
                "description": "The user's photos attached in the chat, in the version's photo order",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "description": "Temporary link to the file",
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 4,
                "type": "array"
              },
              "photosConsent": {
                "description": "true only after the user confirmed that everyone in the photos is the user or agreed to it, and that no one is a child",
                "type": "boolean"
              },
              "quality": {
                "description": "Quality option id from get_template. Default: the template's default option (listed first).",
                "type": "string"
              },
              "requestId": {
                "description": "Optional id (8-64 letters, digits, - or _). The same id never charges twice. Without it, the same request within 10 minutes returns the first run; pass a new id to make it again with the same photos.",
                "type": "string"
              },
              "template": {
                "description": "Template slug, e.g. 'knight-cat-ai-video'",
                "type": "string"
              },
              "uploadId": {
                "description": "The id from create_upload_link, after the user added the photos there",
                "type": "string"
              },
              "version": {
                "description": "Version id from get_template. Default 'main'.",
                "type": "string"
              }
            },
            "required": ["photosConsent", "template"],
            "type": "object"
          },
