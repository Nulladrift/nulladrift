          "name": "search_templates",
          "title": "Find trend templates",
          "description": "Find MakeViral trend templates: viral AI video and photo trends (knight cat, hotel lobby walk, Halloween costumes, dance reels...) that turn the user's own photos of themselves, their partner, friends or pets into a short video or photo. Use it when the user wants a trend video, asks what they can make from a photo, or names a TikTok or Instagram trend. Results are sorted by popularity and show an example clip, the photos needed and the price in MakeViral credits. With no query it returns the most popular templates. Suggest a few that fit and say that each one costs credits from the user's MakeViral account, then use get_template when the user picks one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "output": {
                "enum": ["photo", "video"],
                "type": "string"
              },
              "query": {
                "description": "Words for the trend or idea, e.g. 'knight cat', 'halloween couple', 'dance'",
                "type": "string"
              },
              "season": {
                "description": "e.g. 'halloween'",
                "type": "string"
              },
              "subject": {
                "description": "Who or what is in the photos (product = a brand ad from a product photo and a logo)",
                "enum": ["person", "pet", "couple", "group", "product"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "account": {
                "properties": {
                  "credits": {
                    "type": "number"
                  }
                },
                "required": ["credits"],
                "type": "object"
              },
              "templates": {
                "items": {
                  "properties": {
                    "alsoKnownAs": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "fromCredits": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "outputs": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "pageUrl": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "subjects": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "versions": {
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
