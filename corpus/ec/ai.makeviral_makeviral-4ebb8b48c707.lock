                        }
                      },
                      "required": ["beat", "cast", "place", "seconds", "shots"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "characters": {
                    "items": {
                      "properties": {
                        "key": {
                          "type": "string"
                        },
