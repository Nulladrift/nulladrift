                  },
                  "required": ["description", "name"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "endFrame": {
                "additionalProperties": false,
                "description": "The last frame (models with an end frame), with a start frame",
                "properties": {
                  "download_url": {
                    "description": "Temporary link to the file",
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "endFrameUrl": {
                "description": "The last frame as a public https photo link",
                "type": "string"
              },
              "keepClipSound": {
                "description": "With a clip: put the clip's own sound on the result",
                "type": "boolean"
              },
              "model": {
                "description": "Video model id (list_models). seedance-2-5 is a good default.",
                "enum": ["seedance-2-5", "kling-3-pro", "kling-3-omni", "veo-3-1-fast", "wan-3", "minimax-h3", "seedance-2", "veo-3-1-quality", "veo-3-1-lite", "seedance-2-fast", "grok-imagine", "seedance-2-mini"],
                "type": "string"
              },
              "motion": {
                "description": "Grok Imagine only",
                "enum": ["normal", "fun"],
                "type": "string"
              },
              "photosConsent": {
                "description": "Needed with photos or clips: true only after the user confirmed everyone in them is the user or agreed, and no one is a child",
                "type": "boolean"
              },
              "prompt": {
                "description": "What happens in the video. With references, name them as get_model says (e.g. [Image 1]).",
                "type": "string"
