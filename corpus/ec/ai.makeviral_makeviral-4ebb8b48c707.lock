        {
          "name": "legacy_story_guide",
          "title": "How to write a legacy story",
          "description": "AI Legacy Story: a short vertical film in a 3D animated (Pixar-like) style that tells a real life or business story only through on-screen dialogue (no narrator), with lip-synced voices, captions, music and the person's real photos at the end. This returns the options (models, sizes with prices, music, styles, voices, languages, limits) and the exact rules and JSON shape of a script. Use it when the user wants their story, their company's story or a family member's life as an animated film. You can then write the whole script yourself (any model, in the user's own way) and pass it to check_legacy_story and start_legacy_story as `draft`; then MakeViral does not write it and does not charge for writing it. Without a script, start_legacy_story writes it from the story text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "captions": {
                "description": "Big burned-in captions of the lines. Default big.",
                "enum": ["big", "off"],
                "type": "string"
              },
              "language": {
                "description": "Language of the spoken lines. Default en.",
                "enum": ["en", "es", "pt", "fr", "de", "it", "nl", "pl", "tr", "id", "ms", "fil", "sv", "da", "fi", "ro", "cs", "sk", "hr", "bg", "uk", "ru", "el", "ar", "hi", "ta", "ja", "zh", "ko"],
                "type": "string"
              },
              "model": {
                "description": "Video model. Default minimax-h3 (sharpest, keeps each voice).",
                "enum": ["minimax-h3", "seedance-2-fast", "seedance-2-5", "wan-3", "grok-imagine"],
                "type": "string"
              },
              "music": {
                "description": "Music bed. Default legacy (dark trap beat, big lift at the end).",
                "enum": ["legacy", "epic", "emotional", "upbeat", "adventure", "dark", "none"],
                "type": "string"
              },
              "proofCount": {
                "description": "How many real photos the film ends on (the script then has that many proofLines)",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "quality": {
                "description": "Size; must be one the model offers (legacy_story_guide). Default: the model's default (H3: 768p).",
                "enum": ["768p", "2k", "720p", "480p", "1080p"],
                "type": "string"
              },
              "references": {
                "description": "The photos the user will send (ids, kinds, names), so the rules list them",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Short id the script uses, e.g. r1 (a character's refId, a place's refIds)",
                      "type": "string"
                    },
                    "kind": {
                      "description": "person = becomes a character; logo / screenshot = shown in a place",
                      "enum": ["person", "logo", "screenshot", "place", "other"],
                      "type": "string"
                    },
                    "name": {
                      "description": "The name the story uses, e.g. 'Grandpa Ali', 'Acme logo'",
                      "type": "string"
                    },
                    "note": {
                      "description": "A short note, e.g. 'me at 30', 'our first office'",
                      "type": "string"
                    }
                  },
                  "required": ["id", "kind"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "seconds": {
                "description": "Target length of the animated part. Default 60. With your own script, its scenes set the length.",
                "enum": [30, 45, 60],
                "type": "integer"
              },
              "style": {
                "description": "Look. Default pixar-3d (3D animated film).",
                "enum": ["pixar-3d", "clay", "toon-2d"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "choices": {
                "type": "object"
              },
              "guide": {
                "type": "string"
              }
            },
            "required": ["choices", "guide"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
