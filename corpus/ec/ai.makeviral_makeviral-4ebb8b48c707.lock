        {
          "name": "fruit_story_guide",
          "title": "Plan a fruit story",
          "description": "AI Fruit Story: a short, dramatic and funny soap opera of 3D cartoon fruit people (a human body, the head is a fruit) for TikTok, with talking scenes, captions and music. This returns the ready-made fruit people, roles, personalities, plots, options and prices, and (with a cast) the exact prompts MakeViral's own writer gets. With a `draft` it also checks your story and gives its exact price, without any charge. You can write the story yourself and send it to start_fruit_story as `draft`, or send only the cast and idea and MakeViral writes it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "captions": {
                "enum": ["big", "off"],
                "type": "string"
              },
              "cast": {
                "description": "1-3 fruit people",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fruit": {
                      "description": "A typed fruit, e.g. mango (without presetId)",
                      "type": "string"
                    },
                    "name": {
                      "description": "A short name, letters only",
                      "type": "string"
                    },
                    "personality": {
                      "description": "A personality id (fruit_story_guide)",
                      "type": "string"
                    },
                    "presetId": {
                      "description": "A ready-made fruit person id (fruit_story_guide), or leave it out and type a fruit",
                      "type": "string"
                    },
                    "role": {
                      "description": "A role id (fruit_story_guide)",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "draft": {
                "description": "Your own story: the JSON the writer prompt of fruit_story_guide asks for (title, looks, numbers, scenes).",
                "properties": {
                  "looks": {
                    "type": "object"
                  },
                  "numbers": {
                    "type": "object"
                  },
                  "scenes": {
                    "items": {
                      "properties": {
                        "action": {
                          "type": "string"
                        },
                        "line": {
                          "type": "string"
                        },
                        "place": {
                          "type": "string"
                        },
                        "speaker": {
                          "type": "string"
                        },
                        "with": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["action", "line", "place", "speaker"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["scenes", "title"],
                "type": "object"
              },
              "idea": {
                "description": "One line, or a few 'Name: line' lines the story must use",
                "type": "string"
              },
              "language": {
                "enum": ["en", "es", "fr", "pt"],
                "type": "string"
              },
              "plots": {
                "description": "Up to 2 plot ids (fruit_story_guide)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sceneCount": {
                "description": "Scenes of about 8 s each. Default 6.",
                "enum": [4, 6, 8],
                "type": "integer"
              },
              "style": {
                "enum": ["glossy", "jelly"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "check": {
                "type": "object"
              },
              "choices": {
                "type": "object"
              },
              "guide": {
                "type": "string"
              }
            },
            "required": ["choices", "guide"],
            "type": "object"
