                },
                "maxItems": 9,
                "type": "array"
              },
              "referenceSoundUrls": {
                "description": "Reference sounds as public https links",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "referenceSounds": {
                "description": "Reference sounds (MP3 or WAV) attached in the chat",
