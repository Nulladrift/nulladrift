      "serverInfo": {
        "name": "tessera",
        "title": "Tessera Human Design",
        "version": "1.0.0",
        "websiteUrl": "https://bigballi.com/Tessera/connect/"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tessera: Human Design charts calculated from birth data, with original explanations in English, Dutch and German. Use get_chart for a person's chart from date, time and place of birth (Type, Strategy, Authority, Profile, Definition, Incarnation Cross, centres, channels and all 26 gate activations), get_transits for the gates the planets activate today or on a date, optionally against a person's chart, compare_charts for the channels two people form together, and explain for any type, authority, profile, line, centre, channel, gate or basic topic. A chart depends on the exact birth time: when it is unknown or approximate, birth_time_sensitivity lists which parts could change. The place is used only to find the historical time zone, and nothing sent to these tools is stored.",
      "tools": [
        {
          "name": "compare_charts",
          "title": "Human Design connection between two people",
          "description": "Compares two people's charts: every channel the pair forms, grouped as electromagnetic (each brings one gate), companionship (both have it), dominance (one has it, the other neither gate) and compromise (one has it, the other one gate), with who holds what; the type, definition and defined centres of the combined chart; and each person's Type, Authority and Profile.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the titles and summaries: en (default), nl (Dutch) or de (German).",
                "enum": ["en", "nl", "de"],
                "type": "string"
              },
              "person_a": {
                "additionalProperties": false,
                "properties": {
                  "birth_date": {
                    "description": "The first person's date of birth as YYYY-MM-DD, e.g. \"1988-03-21\".",
                    "maxLength": 10,
                    "type": "string"
                  },
                  "birth_place": {
                    "description": "Where The first person's was born, as \"City\", \"City, Country\" or \"City, Region, Country\", e.g. \"Utrecht, Netherlands\", \"Springfield, Illinois, USA\". Used only to find the time zone.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "birth_time": {
                    "description": "The first person's local clock time of birth, 24-hour HH:MM, e.g. \"14:05\". Leave out when unknown: noon is used and time_uncertainty_minutes defaults to 720.",
                    "maxLength": 5,
                    "type": "string"
                  },
                  "name": {
                    "description": "A first name or label, only to tell the two people apart in the answer.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "time_uncertainty_minutes": {
                    "description": "How far off the birth time may be, in minutes either way (e.g. 30 for \"around half past two\"). The result then says which parts of the chart could change.",
                    "maximum": 720,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "timezone": {
                    "description": "IANA time zone of the birthplace, e.g. \"Europe/Berlin\". Needed only when the place is not found; overrides the place's zone when given.",
                    "maxLength": 64,
                    "type": "string"
                  }
                },
                "required": ["birth_date"],
                "type": "object"
              },
              "person_b": {
                "additionalProperties": false,
                "properties": {
                  "birth_date": {
                    "description": "The second person's date of birth as YYYY-MM-DD, e.g. \"1988-03-21\".",
                    "maxLength": 10,
                    "type": "string"
                  },
                  "birth_place": {
                    "description": "Where The second person's was born, as \"City\", \"City, Country\" or \"City, Region, Country\", e.g. \"Utrecht, Netherlands\", \"Springfield, Illinois, USA\". Used only to find the time zone.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "birth_time": {
                    "description": "The second person's local clock time of birth, 24-hour HH:MM, e.g. \"14:05\". Leave out when unknown: noon is used and time_uncertainty_minutes defaults to 720.",
                    "maxLength": 5,
                    "type": "string"
                  },
                  "name": {
                    "description": "A first name or label, only to tell the two people apart in the answer.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "time_uncertainty_minutes": {
                    "description": "How far off the birth time may be, in minutes either way (e.g. 30 for \"around half past two\"). The result then says which parts of the chart could change.",
                    "maximum": 720,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "timezone": {
                    "description": "IANA time zone of the birthplace, e.g. \"Europe/Berlin\". Needed only when the place is not found; overrides the place's zone when given.",
                    "maxLength": 64,
                    "type": "string"
                  }
                },
                "required": ["birth_date"],
                "type": "object"
              }
            },
            "required": ["person_a", "person_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Human Design connection between two people"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1573608d043a723b5286d955373051ba6b7c696c99294a4c9f6237ab9d9627fc"
        },
        {
          "name": "explain",
          "title": "Explain a Human Design term",
          "description": "Explains one Human Design element in plain words: a type (\"Projector\"), an authority (\"emotional authority\"), a profile (\"4/6\"), a line (\"line 3\"), a definition (\"split definition\"), a centre (\"Sacral\"), a channel (\"34-20\"), a gate (\"gate 51\") or a basic topic (\"what is Human Design\", \"open centres\"). Gives the title and summary, the full text for types, authorities, profiles, definitions and basics, and the related centres, channels and gates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the titles and summaries: en (default), nl (Dutch) or de (German).",
                "enum": ["en", "nl", "de"],
                "type": "string"
              },
              "topic": {
                "description": "The element or topic, e.g. \"Manifesting Generator\", \"splenic authority\", \"2/4\", \"gate 34\", \"channel 10-20\", \"Ajna centre\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a Human Design term"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:baf1a2230875312d2b33c02ac13508527de56ff1366eff2e1e69b660b8daf498"
        },
        {
          "name": "get_chart",
          "title": "Human Design chart from birth data",
          "description": "Computes a person's Human Design chart from date, time and place of birth: Type with Strategy, Signature and Not-Self theme, Authority, Profile, Definition, Incarnation Cross angle and gates, defined and open centres, defined channels, and all 26 Personality and Design activations (planet, gate, line). Each element comes with its title and a one-line summary. When the birth time is unknown or approximate, it lists which parts of the chart could change within that window. Positions come from an ephemeris calculation (true lunar node, Design moment at 88 degrees of solar arc before birth), with historical time zones.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birth_date": {
                "description": "the person's date of birth as YYYY-MM-DD, e.g. \"1988-03-21\".",
                "maxLength": 10,
                "type": "string"
              },
              "birth_place": {
                "description": "Where the person's was born, as \"City\", \"City, Country\" or \"City, Region, Country\", e.g. \"Utrecht, Netherlands\", \"Springfield, Illinois, USA\". Used only to find the time zone.",
                "maxLength": 120,
                "type": "string"
              },
              "birth_time": {
                "description": "the person's local clock time of birth, 24-hour HH:MM, e.g. \"14:05\". Leave out when unknown: noon is used and time_uncertainty_minutes defaults to 720.",
                "maxLength": 5,
                "type": "string"
              },
              "language": {
                "description": "Language of the titles and summaries: en (default), nl (Dutch) or de (German).",
                "enum": ["en", "nl", "de"],
                "type": "string"
              },
              "time_uncertainty_minutes": {
                "description": "How far off the birth time may be, in minutes either way (e.g. 30 for \"around half past two\"). The result then says which parts of the chart could change.",
                "maximum": 720,
                "minimum": 0,
                "type": "integer"
              },
              "timezone": {
                "description": "IANA time zone of the birthplace, e.g. \"Europe/Berlin\". Needed only when the place is not found; overrides the place's zone when given.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["birth_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Human Design chart from birth data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://tessera/chart-v1.html",
            "ui": {
              "resourceUri": "ui://tessera/chart-v1.html"
            }
          },
          "digest": "sha256:157d3a622c49272317458200dd88b6efa4ed41ae9521836fb139d179196a7062"
        },
        {
          "name": "get_transits",
          "title": "Human Design transits for a date",
          "description": "The gates and lines the Sun, Moon, nodes and planets activate at a moment (now by default, or a given date and time in UTC). With a person's birth data it also lists the channels the transits complete with that person's own gates, the usual way to read a day's influence, apart from channels the transits form on their own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Day to look at as YYYY-MM-DD (default today).",
                "maxLength": 10,
                "type": "string"
              },
              "language": {
                "description": "Language of the titles and summaries: en (default), nl (Dutch) or de (German).",
                "enum": ["en", "nl", "de"],
                "type": "string"
              },
              "person": {
                "additionalProperties": false,
                "properties": {
                  "birth_date": {
                    "description": "The person's date of birth as YYYY-MM-DD, e.g. \"1988-03-21\".",
                    "maxLength": 10,
                    "type": "string"
                  },
                  "birth_place": {
                    "description": "Where The person's was born, as \"City\", \"City, Country\" or \"City, Region, Country\", e.g. \"Utrecht, Netherlands\", \"Springfield, Illinois, USA\". Used only to find the time zone.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "birth_time": {
                    "description": "The person's local clock time of birth, 24-hour HH:MM, e.g. \"14:05\". Leave out when unknown: noon is used and time_uncertainty_minutes defaults to 720.",
                    "maxLength": 5,
                    "type": "string"
                  },
                  "name": {
                    "description": "A first name or label, only to tell the two people apart in the answer.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "time_uncertainty_minutes": {
                    "description": "How far off the birth time may be, in minutes either way (e.g. 30 for \"around half past two\"). The result then says which parts of the chart could change.",
                    "maximum": 720,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "timezone": {
                    "description": "IANA time zone of the birthplace, e.g. \"Europe/Berlin\". Needed only when the place is not found; overrides the place's zone when given.",
                    "maxLength": 64,
                    "type": "string"
                  }
                },
                "required": ["birth_date"],
                "type": "object"
              },
              "time_utc": {
                "description": "Time of day in UTC as HH:MM (default now when date is today, else 12:00).",
                "maxLength": 5,
                "type": "string"
              }
            },
            "type": "object"
          },
