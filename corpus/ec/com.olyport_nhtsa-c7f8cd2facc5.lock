      "tools": [
        {
          "name": "complaint_trends_by_component",
          "description": "Get complaint counts by vehicle component for a specific make/model/year.\n\n    Shows which parts of the vehicle consumers report the most problems with\n    (e.g. brakes, engine, electrical system). Useful for identifying systemic\n    vehicle defect patterns.\n\n    Args:\n        make: Vehicle manufacturer name (e.g. 'Toyota', 'Ford').\n        model: Vehicle model name (e.g. 'Camry', 'F-150').\n        year: Model year (e.g. 2023).\n    ",
          "inputSchema": {
            "properties": {
              "make": {
                "title": "Make",
                "type": "string"
              },
              "model": {
                "title": "Model",
                "type": "string"
              },
              "year": {
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["make", "model", "year"],
            "title": "complaint_trends_by_componentArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "complaint_trends_by_componentOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc4b0c9cf7203cdba68d146847641c1ca890c51a426c6971c4860b999e69172a"
        },
        {
          "name": "decode_vin",
          "description": "Decode a Vehicle Identification Number (VIN) to get vehicle details.\n\n    Returns make, model, year, body class, engine info, safety features,\n    and other attributes encoded in the 17-character VIN.\n\n    Args:\n        vin: A 17-character Vehicle Identification Number (e.g. '1HGBH41JXMN109186').\n    ",
          "inputSchema": {
            "properties": {
              "vin": {
                "title": "Vin",
                "type": "string"
              }
            },
            "required": ["vin"],
            "title": "decode_vinArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "decode_vinOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7fd52126adc4e05b7d0d5aee70a0866b1181ebbfa027b45ffbba7559d8f3a4a4"
        },
        {
          "name": "get_complaints",
          "description": "Get consumer complaints about vehicles filed with NHTSA.\n\n    Search for safety complaints by make, model, and/or year. Returns\n    complaint descriptions, components involved, and crash/injury data.\n    At least one filter (make, model, or year) should be provided.\n\n    Args:\n        make: Vehicle manufacturer name (e.g. 'Toyota', 'Ford').\n        model: Vehicle model name (e.g. 'Camry', 'F-150').\n        year: Model year (e.g. 2023).\n        limit: Maximum number of complaints to return (default 25).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "make": {
                "default": null,
                "title": "Make",
                "type": "string"
              },
              "model": {
                "default": null,
                "title": "Model",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_complaintsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_complaintsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ee56b088d470baa5e7b5a41c119edb26013af175f057667235a5486648f0656"
        },
        {
          "name": "get_crash_statistics",
          "description": "Get fatal crash statistics from the NHTSA Fatality Analysis Reporting System (FARS).\n\n    Returns fatal motor vehicle crash data for a state, including total\n    fatalities, fatalities by person type (drivers, passengers, pedestrians),\n    and alcohol-involved crashes.\n\n    Args:\n        state: Two-digit state FIPS code (e.g. '06' for California, '48' for Texas)\n            or two-letter state abbreviation (e.g. 'CA', 'TX').\n        year: Year for statistics (e.g. 2022). Defaults to the most recent available year.\n    ",
          "inputSchema": {
            "properties": {
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_crash_statisticsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_crash_statisticsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7ba7f613d93e7171a58ff8ec0318797ca6acab75fff3e652181d19a8b4c738e4"
        },
        {
          "name": "get_recalls",
          "description": "Get vehicle safety recalls from NHTSA.\n\n    Search for recalls by make, model, and/or year. Returns recall campaigns\n    including the defect description, remedy, and affected vehicles.\n    At least one filter (make, model, or year) should be provided.\n\n    Args:\n        make: Vehicle manufacturer name (e.g. 'Toyota', 'Ford', 'Honda').\n        model: Vehicle model name (e.g. 'Camry', 'F-150', 'Civic').\n        year: Model year (e.g. 2023).\n    ",
          "inputSchema": {
            "properties": {
              "make": {
                "default": null,
                "title": "Make",
                "type": "string"
              },
              "model": {
                "default": null,
                "title": "Model",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_recallsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_recallsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e3e89c9aa654f49e6b6562a2c336a8fa60eb4115fd921379180db400ec1eb3a"
        },
        {
          "name": "local_vehicle_safety_profile",
          "description": "Get a vehicle safety profile using national complaint and recall trends.\n\n    NHTSA complaints are not geocoded by state, so this returns national-level\n    trends as context for local community safety assessments. Includes the most\n    recent recalls and top complained-about vehicle makes.\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'CA', 'TX'). Used for crash\n            statistics; complaint data is national.\n    ",
          "inputSchema": {
            "properties": {
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "local_vehicle_safety_profileArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "local_vehicle_safety_profileOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc801d739d424f9fad08f3c032e1c8176888d9976ffe6e515ae3333d0c0c1be5"
        }
      ],
      "digest": "sha256:83ff63c5a9c921d0d23963bcf2c71a1b94eace86b62935243b3d700ce1d03bce"
    }
