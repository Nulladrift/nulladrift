        },
        {
          "name": "get_available_slots",
          "title": "Find open times",
          "description": "Returns the start times that can be booked, with the hosts' calendars, buffers and limits already applied. Pass the invitee's `timezone` and either `date` (YYYY-MM-DD in `timezone`) or `from` and `to` (ISO, at most 62 days apart). With neither, it covers the next 7 days. `days` groups the slots by date in `timezone`, and `times` gives each slot as a local time to show people. People can book up to `bookableUntil`. When the range has no open times, `next` is the next one. When `timezone` was an abbreviation that names more than one zone (CST, IST, BST), `timezoneNote` says which one was used: check it with the person. For new times for an existing booking, also pass its `bookingId` and `token`. Next: call create_booking (or reschedule_booking_as_invitee) with one of the `slots` values as `start`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bookingId": {
                "description": "the booking id from create_booking, or its manageUrl",
                "type": "string"
              },
              "date": {
                "description": "one day to look at, as YYYY-MM-DD in `timezone`",
                "format": "date",
                "type": "string"
              },
              "from": {
                "description": "start of the range, ISO with an offset",
                "format": "date-time",
                "type": "string"
              },
              "handle": {
                "description": "a handle, the first part of a booking link (\"acme\" in meettempi.com/acme/demo), or the whole link",
                "type": "string"
              },
              "slug": {
                "description": "an event type slug from get_public_profile (\"demo\" in meettempi.com/acme/demo), or the whole link",
                "type": "string"
              },
              "timezone": {
                "description": "the invitee's time zone, an IANA id like America/New_York or an abbreviation like EST: days, dates and times are in it",
                "type": "string"
              },
              "to": {
                "description": "end of the range, ISO with an offset",
                "format": "date-time",
                "type": "string"
              },
              "token": {
                "description": "the token from create_booking, or the manageUrl",
                "type": "string"
              }
            },
            "required": ["handle", "slug", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ac7bc4bd80da2b422d4cb4af4e5fa54fe75592e7bfb6764c82e56d3830b42dd"
        },
        {
          "name": "get_booking",
          "title": "View a booking (invitee)",
          "description": "Returns a booking by its id and token (from create_booking), or its manageUrl passed as both, with `changeableUntil`, `refundableUntil` and `canCancel`. For a series, `series` lists every meeting with its own manageUrl.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "the booking id from create_booking, or its manageUrl",
                "type": "string"
              },
              "token": {
                "description": "the token from create_booking, or the manageUrl",
                "type": "string"
              }
            },
            "required": ["id", "token"],
            "type": "object"
          },
          "annotations": {
