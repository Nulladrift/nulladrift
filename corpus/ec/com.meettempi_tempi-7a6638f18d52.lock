        {
          "name": "reschedule_booking_as_invitee",
          "title": "Reschedule a booking (invitee)",
          "description": "Moves a confirmed booking to `start` with the same hosts. Get valid times from get_available_slots with this `bookingId` and `token`. The calendar event is updated and its provider notifies attendees. Payment carries over. Not possible after `changeableUntil` (409 change_too_late). A request (status=pending_approval) can’t be moved: cancel it and request another time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "the booking id from create_booking, or its manageUrl",
                "type": "string"
              },
              "start": {
                "description": "one of the `slots` values from get_available_slots, as given (ISO in UTC)",
                "format": "date-time",
                "type": "string"
              },
              "token": {
                "description": "the token from create_booking, or the manageUrl",
                "type": "string"
              }
            },
            "required": ["id", "start", "token"],
            "type": "object"
          },
          "annotations": {
