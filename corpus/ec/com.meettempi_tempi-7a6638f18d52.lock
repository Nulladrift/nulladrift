      },
      "instructions": "Book meetings with people and teams on Tempi: get_public_profile → get_available_slots → create_booking. A booking link works wherever a handle or slug is asked for. Pass the user's time zone as `timezone` (an IANA id, or an abbreviation like EST) and show them the local `times` and `when` the results give, not the UTC values. Keep the returned manageUrl: it is needed to view, reschedule or cancel. Paid events return a paymentUrl the user must open. To manage the user's own Tempi account, connect to /mcp/account (OAuth sign-in).",
      "tools": [
        {
          "name": "cancel_booking_as_invitee",
          "title": "Cancel a booking (invitee)",
          "description": "Cancels a booking by its id and token. The event is removed from the host's calendar. Paid bookings cancelled before `refundableUntil` are refunded in full. Later cancellations get no refund. The event type sets the rules, which get_booking shows: no changes after `changeableUntil` (409 change_too_late), no cancelling when `canCancel` is false (409 cancel_not_allowed, reschedule instead).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "following": {
                "description": "for a series: also cancel every later meeting",
                "type": "boolean"
              },
              "id": {
                "description": "the booking id from create_booking, or its manageUrl",
                "type": "string"
              },
              "reason": {
                "description": "why the invitee cancels, sent to the host",
                "maxLength": 500,
                "minLength": 0,
                "title": "maxLength(500)",
                "type": "string"
              },
              "token": {
                "description": "the token from create_booking, or the manageUrl",
                "type": "string"
              }
            },
            "required": ["id", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7f756891be67d95375cd3c0f0ba79d67029c517535563009ddf397a6516569b6"
        },
        {
          "name": "check_series",
          "title": "Check a repeating series before booking it",
          "description": "For event types with `repeatMax` (from get_public_profile): lists each meeting of a series that starts at `start` (one of the slots) and repeats `every` 1, 2 or 4 weeks at the host's clock time, and whether each is free. Pass the invitee's `timezone` to get each meeting's `when` in it: where clocks change on other dates than the host's, some meetings move for the invitee, and `message` says which. Book it with create_booking and `repeat` when `bookable` is true. A series is booked whole or not at all, and round robin gives every meeting to the same host.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "anyOf": [
                  {
                    "description": "how many meetings, first included (2 up to the event type's repeatMax)",
                    "maximum": 52,
                    "minimum": 2,
                    "title": "between(2, 52)",
                    "type": "integer"
                  },
                  {
                    "description": "a string to be decoded into a number",
                    "type": "string"
                  }
                ],
                "description": "how many meetings, first included (2 up to the event type's repeatMax)"
              },
              "every": {
                "anyOf": [
                  {
                    "description": "weeks between meetings: 1, 2 or 4",
                    "enum": [1, 2, 4],
                    "type": "number"
                  },
                  {
                    "description": "a string to be decoded into a number",
                    "type": "string"
                  }
                ],
                "description": "weeks between meetings: 1, 2 or 4"
              },
              "handle": {
                "description": "a handle, the first part of a booking link (\"acme\" in meettempi.com/acme/demo), or the whole link",
                "type": "string"
              },
              "slug": {
                "description": "an event type slug from get_public_profile (\"demo\" in meettempi.com/acme/demo), or the whole link",
                "type": "string"
              },
              "start": {
                "description": "one of the `slots` values from get_available_slots, as given (ISO in UTC)",
                "format": "date-time",
                "type": "string"
              },
              "timezone": {
                "description": "the invitee's time zone, an IANA id like America/New_York or an abbreviation like EST: each meeting's `when` is in it",
                "type": "string"
              }
            },
            "required": ["count", "every", "handle", "slug", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9677d62d08ac24465b53e4afbeffe1d180991a7eae877c8fe60ecb2ca042d460"
        },
        {
          "name": "create_booking",
          "title": "Book a meeting",
          "description": "Books `start`, which must be one of the `slots` from get_available_slots. Free events are confirmed at once, unless the event type has `requiresApproval`: then it's a request (status=pending_approval) that holds the time until a host approves or declines it, and the invitee hears either way by email. Nobody answering by its start (`holdExpiresAt`) lets it lapse. Tell the human it isn't confirmed yet. Paid events return status=pending_payment and a `paymentUrl`. Give it to the human to pay before `holdExpiresAt`, or the slot is released. Once confirmed, the event is added to the host's calendar if they connected one, and the invitee gets a confirmation email with a calendar file (.ics). Keep `manageUrl` and `token`: they are the only way to view, reschedule or cancel later. 409 slot_unavailable says why the time can't be booked and lists the `nearest` open times. The result's `when` is the start in the invitee's time zone, to tell them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cover": {
                "description": "leave it out: the id of the painting the booking page showed, when the event type shows a different one each booking (cover \"hand\", \"light\" or \"still\"), so the booking keeps it. Anything else is ignored, and Tempi picks one",
                "maxLength": 40,
                "title": "maxLength(40)",
                "type": "string"
              },
              "email": {
                "description": "the invitee's email address, which gets the confirmation and its calendar file",
                "format": "email",
                "type": "string"
              },
              "handle": {
                "description": "a handle, the first part of a booking link (\"acme\" in meettempi.com/acme/demo), or the whole link",
                "type": "string"
              },
              "name": {
                "description": "the invitee's full name",
                "type": "string"
              },
              "notes": {
                "description": "anything the invitee wants the host to know",
                "maxLength": 2000,
                "minLength": 0,
                "title": "maxLength(2000)",
                "type": "string"
              },
              "phone": {
                "description": "the invitee's phone number with its country code, like +1 415 555 0134: required when the event type is a phone call (whereKind phone on get_public_profile), where the host calls them",
                "maxLength": 40,
                "minLength": 0,
                "title": "maxLength(40)",
                "type": "string"
              },
              "repeat": {
                "additionalProperties": false,
                "description": "book a series instead: `count` meetings, `every` 1, 2 or 4 weeks at the host's clock time, when the event type's repeatMax allows. All or nothing: check_series first. The result's `series.meetings` give each start as `when` in the invitee's time zone, and `series.clockNote` says when that moves",
                "properties": {
                  "count": {
                    "description": "how many meetings, first included (2 up to the event type's repeatMax)",
                    "maximum": 52,
                    "minimum": 2,
                    "title": "between(2, 52)",
                    "type": "integer"
                  },
                  "every": {
                    "description": "weeks between meetings: 1, 2 or 4",
                    "enum": [1, 2, 4],
                    "type": "number"
                  }
                },
                "required": ["count", "every"],
                "type": "object"
              },
              "slug": {
                "description": "an event type slug from get_public_profile (\"demo\" in meettempi.com/acme/demo), or the whole link",
                "type": "string"
              },
              "start": {
                "description": "one of the `slots` values from get_available_slots, as given (ISO in UTC)",
                "format": "date-time",
                "type": "string"
              },
              "timezone": {
                "description": "the invitee's time zone, an IANA id like America/New_York or an abbreviation like EST: their emails and reminders show times in it",
                "type": "string"
              }
            },
            "required": ["email", "handle", "name", "slug", "start", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
