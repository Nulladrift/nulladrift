          },
          "digest": "sha256:c118d9b6db92cfe6b8892fd3c091e9f78389ad35d11a119459f7252395ad51dc"
        },
        {
          "name": "share_booking_as_invitee",
          "title": "Share a booking as an invitation (invitee)",
          "description": "Turns a confirmed booking into an invitation page anyone with its `url` can open: what, when (in the reader’s time zone) and with whom. It never shows the invitee’s email, phone or notes, and shows the meeting link only with `includeLink`. Calling it again changes the style or the link and keeps the same `url`. stop_sharing_booking_as_invitee ends it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "the booking id from create_booking, or its manageUrl",
                "type": "string"
              },
              "includeLink": {
                "description": "true: the invitation shows the meeting link, so anyone with it can join the call. Off by default.",
                "type": "boolean"
              },
              "style": {
                "description": "how the invitation looks: light (the default), poster (dark, the name large, in the event type's color) or glow (its painting as light). Older names still work and give the nearest of the three",
                "enum": ["light", "poster", "glow", "painting", "night", "dots", "sky", "gradient", "paper", "dither"],
                "type": "string"
              },
              "token": {
                "description": "the token from create_booking, or the manageUrl",
                "type": "string"
              }
            },
            "required": ["id", "token"],
            "type": "object"
          },
