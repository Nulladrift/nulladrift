        },
        {
          "name": "get_shared_booking",
          "title": "View a shared invitation",
          "description": "Returns the invitation behind a shared booking’s link (\"…/i/<token>\"): what, when, with whom, its status (upcoming, cancelled or past), its style, and where to book the same host. 404 once its sharer stopped sharing it.",
          "inputSchema": {
