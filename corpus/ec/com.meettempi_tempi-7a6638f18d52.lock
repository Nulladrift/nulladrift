        {
          "name": "join_waitlist",
          "title": "Join the private beta waitlist",
          "description": "Requests access to host on Tempi (create event types, share a booking page). Not needed to book meetings, since booking pages are public. Returns the status: pending, approved (sign in to the Tempi web app), rejected, or open (no waitlist, sign in directly). Joining again with the same email returns the current status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "an email address",
                "format": "email",
                "type": "string"
              },
              "name": {
                "description": "the person’s name (at most 100 characters)",
                "maxLength": 100,
                "minLength": 0,
                "title": "maxLength(100)",
                "type": "string"
              },
              "note": {
                "description": "anything the admins should know, e.g. what you want to use Tempi for",
                "maxLength": 1000,
                "minLength": 0,
                "title": "maxLength(1000)",
                "type": "string"
              },
              "ref": {
                "description": "a short source tag of lowercase letters, digits, - or _, like \"embed\"",
                "pattern": "^[a-z0-9_-]{1,32}$",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
