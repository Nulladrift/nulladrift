        {
          "name": "review",
          "title": "Request today's run",
          "description": "Requests today's run of a site and returns it. A site gets one run per UTC day: the first request that day creates it as `queued` with `created: true`, and every later request that day returns the same run in its current status with `created: false`. Requires the owner or admin role in the site's team. Creating the run also requires a verified site, an accepted review agreement, and a team with an active subscription or a premium day today; a team with neither gets 402 `subscription_required`. Once today's run exists, it is returned whatever the state of the site or its team. If the site lost its proof at its last check, Riskcovery looks for the proof again, so a restored proof lets the run be created. `mode` sets the run's mode when the run is created: `fast` (the default) runs the review on Necessary Evil 1, and `premium` runs it on Extra Necessary Evil 1, which only a team on its premium day may request. A premium day is the seventh day of each week of the premium plan (GPT Cyber, Mythos Preview Access Pending Review), or the last day of each month of its reservation. On any other day, `premium` is refused with 409 `mode_not_entitled`. Today's run keeps the mode it was created in.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
