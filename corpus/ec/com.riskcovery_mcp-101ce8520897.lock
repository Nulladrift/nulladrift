        {
          "name": "listCves",
          "title": "Search the CVE List",
          "description": "Lists the published records of the CVE List, newest first, 50 to a page, each with its CVE ID, when it was published, its CVSS score and severity when it has one, and its title or the start of its description, with the total, the number of pages, and the page shown. `query` holds up to 200 characters: a CVE ID or the start of one, such as CVE-2024-3094 or 2024-30, lists the records whose ID starts with it, an exact match first, and any other text searches the words of each record. Without `query`, every published record is listed. A search lists at most 10,000 records, and `capped` says when it matched more. `page` is a whole number from 1, and a page past the last shows the last page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "page": {
                "description": "Page of results, from 1 (the default)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "query": {
                "description": "Words to search the CVE List for, or a CVE ID or the start of one, up to 200 characters",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": true,
            "properties": {
              "capped": {
                "type": "boolean"
              },
              "items": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "publishedAt": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "rating": {
                      "anyOf": [
                        {
                          "additionalProperties": true,
                          "properties": {
                            "score": {
                              "anyOf": [
                                {
                                  "type": "number"
                                },
                                {
                                  "enum": ["Infinity", "-Infinity", "NaN"],
                                  "type": "string"
                                }
                              ]
                            },
                            "severity": {
                              "enum": ["CRITICAL", "HIGH", "MEDIUM", "LOW", "NONE"],
                              "type": "string"
                            }
                          },
                          "required": ["score", "severity"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "summary": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "publishedAt", "rating", "summary"],
                  "type": "object"
                },
                "type": "array"
              },
              "page": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "enum": ["Infinity", "-Infinity", "NaN"],
                    "type": "string"
                  }
                ]
              },
              "pages": {
                "anyOf": [
                  {
                    "type": "number"
