      "instructions": "Data from Nieruchomosci-Online.pl (https://www.nieruchomosci-online.pl) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "nieruchomosci_online_offer",
          "title": "Get one nieruchomosci-online.pl listing",
          "description": "Full details of one nieruchomosci-online.pl listing: price and price per m² (PLN), area, rooms, floor, year built, address with district and coordinates, seller type and name (agency, developer or private), the listing's detail table as shown on the page (Polish labels and values: rent and extra charges, deposit, building, heating, parking, source…), amenities, the full description and photo URLs. Get the id from nieruchomosci_online_search. Fetched live from nieruchomosci-online.pl (typically 1–3 s via direct fetch; up to ~20 s when it falls back to an unblocker). Result: { source, fetchedAt, listing: { id, url, title, property_type, transaction, kind, market, price, price_per_m2, currency, area_m2, rooms, floor, year_built, address, geo, seller_type, seller_name, agent_name, date_posted, updated, details, amenities, description, photos } }.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Listing id (digits, e.g. '26982481') or the listing's full URL, as returned by nieruchomosci_online_search.",
                "minLength": 1,
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh fetch and bypass this server's result cache (5 min). Default false.",
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db121b968b03ee0c64ba5176c55f452f0c8b4224c5836ff9592699d6e922f0ab"
        },
        {
          "name": "nieruchomosci_online_search",
          "title": "Search Polish real-estate listings (nieruchomosci-online.pl)",
          "description": "Search property listings on nieruchomosci-online.pl, one of Poland's largest real-estate portals: flats, houses, plots, commercial premises and rooms, for sale or for rent, filtered by city/district or voivodeship, price, area, rooms and private-owner-only. Returns one results page (~40 listings) with each listing's price, price per m², area, rooms, floor, location, seller type and link; pass a listing `id` to nieruchomosci_online_offer for the full details. Fetched live from nieruchomosci-online.pl (typically 1–3 s via direct fetch; up to ~20 s when it falls back to an unblocker). Result shape: { source, fetchedAt, query, search_url, heading, resolved_location, total_count, page, total_pages, count, listings: [...], note? } — the list key is `listings`; `total_count` counts matches across all pages (use `page` for more). Each listing: { id, url, title, kind, market, price, price_per_m2, currency, area_m2, rooms, floor, location, street, city, region, seller_type, image, description }. Prices are numbers in PLN (for rent, `price` is the monthly rent) and area is in m²; fields are null when the page omits them. `kind` is 'new_development' for a developer's unit in a new project (primary market), else 'listing'; `seller_type` is agency | private | developer | company. An empty match answers count: 0 with a `note` saying why and what to change — that is a successful result, not an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area_max": {
                "description": "Maximum area in m² (the plot's area for type 'plot').",
                "minimum": 0,
                "type": "number"
              },
              "area_min": {
                "description": "Minimum area in m² (the plot's area for type 'plot').",
                "minimum": 0,
                "type": "number"
              },
              "location": {
                "description": "City in Polish spelling, optionally followed by a district: 'Kraków', 'Warszawa Mokotów', 'Gdańsk Wrzeszcz'. English names ('Warsaw') are not recognised. Omit to search all of Poland, or pass region instead.",
                "minLength": 1,
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh fetch and bypass this server's result cache (5 min). Default false.",
                "type": "boolean"
              },
              "page": {
                "description": "Results page, 1-based (~40 listings per page). Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "price_max": {
                "description": "Maximum total price in PLN (monthly rent when transaction is 'rent').",
                "minimum": 0,
                "type": "number"
              },
              "price_min": {
                "description": "Minimum total price in PLN (monthly rent when transaction is 'rent').",
                "minimum": 0,
                "type": "number"
              },
              "private_only": {
                "description": "Only listings posted by private owners (bez pośredników) — no agencies or developers. Default false.",
                "type": "boolean"
              },
              "region": {
                "description": "A whole voivodeship instead of a city, e.g. 'malopolskie', 'mazowieckie'. Not combinable with location.",
                "enum": ["dolnoslaskie", "kujawsko-pomorskie", "lubelskie", "lubuskie", "lodzkie", "malopolskie", "mazowieckie", "opolskie", "podkarpackie", "podlaskie", "pomorskie", "slaskie", "swietokrzyskie", "warminsko-mazurskie", "wielkopolskie", "zachodniopomorskie"],
                "type": "string"
              },
              "rooms_max": {
                "description": "Maximum number of rooms — types 'flat' and 'house' only (use min = max for exactly N).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "rooms_min": {
                "description": "Minimum number of rooms — types 'flat' and 'house' only.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "transaction": {
                "description": "'sale' = na sprzedaż (buying), 'rent' = na wynajem (renting; prices are monthly).",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "type": {
                "description": "Property type: 'flat' = mieszkanie, 'house' = dom, 'plot' = działka (land), 'commercial' = lokal użytkowy (office, shop, premises), 'commercial_building' = budynek użytkowy, 'room' = pokój (a room to rent).",
                "enum": ["flat", "house", "plot", "commercial", "commercial_building", "room"],
                "type": "string"
              }
            },
            "required": ["transaction", "type"],
            "type": "object"
          },
