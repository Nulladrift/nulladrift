        {
          "name": "que_publico_el_dof",
          "title": "Qué publicó el DOF y qué cambió",
          "description": "Qué publicó el Diario Oficial de la Federación y qué cambió con cada decreto, de una vez: por `codigo_dof` (la nota del DOF, «5803757»), por día de publicación (`fecha`; con `hasta`, un rango), por ordenamiento («LISR», «LIF», «CFF») o por palabras («reforma fiscal 2027», «Ley de Ingresos 2027»). Por decreto: título, fecha y liga al DOF, y cada disposición con texto aprobado: si es reforma, adición, derogación o texto nuevo, desde cuándo rige (y si rige después que el resto del decreto) y la llamada siguiente (leer_disposicion con su `version_id`; que_cambio_en_la_norma con su referencia y `fecha`). Lo que la biblioteca sigue cotejando contra el DOF no se muestra. Dice cuántos hay y cómo pedir el resto (`pagina`). [EN: What the DOF published and what changed.]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "codigo_dof": {
                "description": "La nota del DOF de una publicación («5803757», el número de `codigo=` en su liga).",
                "pattern": "^\\d{5,9}$",
                "type": "string"
              },
              "consulta": {
                "description": "Palabras: «reforma fiscal 2027» (el paquete de ese ejercicio), «Ley de Ingresos 2027», «LISR 2027», «13 de noviembre de 2026».",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "fecha": {
                "description": "El día de publicación en el DOF (AAAA-MM-DD); con `hasta`, desde ese día.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "hasta": {
                "description": "El último día de publicación del rango (AAAA-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ordenamiento": {
                "description": "Sólo lo que cambia este ordenamiento, por su clave: «LISR», «LIVA», «LIF», «CFF», «LFD», «RMF».",
                "pattern": "^[A-Za-z][A-Za-z0-9-]{1,19}$",
                "type": "string"
              },
              "pagina": {
                "description": "Con varias publicaciones, la página de 4 publicaciones; con una sola, la de 40 disposiciones. Por omisión, 1.",
