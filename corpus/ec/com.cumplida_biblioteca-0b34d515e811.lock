      "instructions": "Biblioteca fiscal de Cumplida · edición abierta (gratuita): ley fiscal mexicana (leyes, reglamentos, RMF y anexos, RGCE, seguridad social, antilavado, tratados) por versión aprobada, con su DOF y su vigencia, y jurisprudencia de la SCJN, Plenos, Colegiados, TFJA y PRODECON con su vigencia y a quién obliga. Sólo lectura, sin cuenta ni llave.\n\nÚsela si la pregunta toca impuestos, el SAT, el IMSS, el INFONAVIT o tribunales fiscales de México, y antes de citar un artículo o una tesis. Primera llamada: normativa_vigente {\"consulta\":\"<el tema en español>\"}, o leer_disposicion {\"referencia\":\"CFF 46-A\"} si ya sabe el artículo; con la fecha del hecho, \"fecha\":\"AAAA-MM-DD\".\n\nDespués: leer_disposicion con el `version_id` para el texto completo; precedentes con buscar_jurisprudencia {\"consulta\":\"3 a 6 palabras\"} o precedentes_de_un_articulo {\"articulo\":\"CFF 50\"}, leer_precedente antes de citarlos y vigencia_de_un_criterio para saber si una tesis sigue vigente; lo que cambió con que_cambio_en_la_norma (un artículo) o que_publico_el_dof (una reforma o un DOF); verificar_citas sobre su borrador antes de entregarlo. El prompt `consulta_fiscal` y el recurso «cómo empezar» muestran el recorrido.\n\nLa búsqueda es por texto y en español, con los términos legales mexicanos. Un texto cortado dice con qué `desde` seguir.\n\nCada resultado trae su cita formal (`como_citar`), su fuente oficial (`fuente_oficial`) y, si cumplida.com la publica, su página (`url`); los términos piden citar a Cumplida como fuente.\n\nLímites: 20 llamadas por minuto y 400 al día por conexión; devuelva el `Mcp-Session-Id`. Ante un 429 u «ocupado», espere el `Retry-After`; cada error dice qué cambiar.\n\nInformación de consulta; no constituye asesoría fiscal ni legal.\n\nSin cuenta; las consultas se registran sin datos personales. Términos: https://cumplida.com/legal/biblioteca-abierta. Privacidad: https://cumplida.com/legal/privacy-policy. Soporte: https://cumplida.com/soporte. In English: https://mcp.cumplida.com/mcp?lang=en or Accept-Language: en.",
      "tools": [
        {
          "name": "buscar_jurisprudencia",
          "title": "Buscar precedentes",
          "description": "Busca precedentes mexicanos (SCJN, Plenos, Colegiados, TFJA, PRODECON) por tema, lo obligatorio primero, sólo vigentes y con su cita formal. Ej.: «la orden de visita debe precisar su objeto». `consulta` es el tema en palabras (3 a 6 palabras rinden mejor; no un número de tesis). Dice si puede haber más (`limite`, hasta 10). Las sentencias (del TFJA, de los Colegiados y Juzgados y de la SCJN) se buscan aparte, con `tipos: [\"SENTENCIA\"]`. Léalos con leer_precedente antes de citarlos. Por número o registro: vigencia_de_un_criterio o leer_precedente; por artículo: precedentes_de_un_articulo. Búsqueda por texto (sin vectores ni reordenador): una consulta que no está en español no se busca y se dice cómo pedirla. [EN: Search Mexican case law.]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "consulta": {
                "description": "El tema en palabras, en español (3 a 6 palabras): «plazo para desvirtuar la presunción». No un número de tesis.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "fecha_del_hecho": {
                "description": "Con ella, cada resultado dice si el texto que interpretó es el que rige ese día.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fuentes": {
                "description": "Sólo de estas fuentes: SJF (SCJN y tribunales federales), SCJN_SENTENCIAS, TFJA_SCTJ, PRODECON.",
                "items": {
                  "enum": ["SJF", "SCJN_SENTENCIAS", "TFJA_SCTJ", "PRODECON"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "limite": {
                "description": "Cuántos resultados (1 a 10; por omisión, 8).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "publicada_hasta": {
                "description": "Sólo lo publicado hasta ese día.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "solo_obligatoria": {
                "description": "true: sólo jurisprudencia y precedentes obligatorios.",
                "type": "boolean"
              },
              "tipos": {
                "description": "Sólo de estos tipos de documento. [\"SENTENCIA\"]: las sentencias del TFJA, de los Colegiados y Juzgados y de la SCJN, que la búsqueda por tema deja fuera.",
                "items": {
                  "enum": ["JURISPRUDENCIA", "TESIS_AISLADA", "PRECEDENTE", "CRITERIO_AISLADO", "SENTENCIA", "CRITERIO_PRODECON", "ACUERDO_CONCLUSIVO"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar precedentes"
          },
