        {
          "name": "precedentes_de_un_articulo",
          "title": "Precedentes de un artículo",
          "description": "Los precedentes mexicanos que aplican o interpretan un artículo de la ley («CFF 42», «art. 51 de la LFPCA»), sólo lo que sirve de apoyo: lo obligatorio primero y, dentro, la SCJN antes que los Plenos, los Colegiados y el TFJA, lo más reciente primero. `tema` no filtra: pone primero los que lo tratan y dice cuántos lo tratan; `fraccion` (en romano, «III») sí deja fuera lo que habla de otra fracción. Cada uno dice si su relación con el artículo está confirmada o propuesta sin validar, el pasaje que lo nombra cuando dice algo más que el rubro y, si se puede saber, el texto que interpretó frente al que rige el día del hecho. Entrega 10 por página (`limite`) y dice si hay más: la siguiente, con `desde` (hasta 30 en total).",
          "inputSchema": {
