        {
          "name": "que_cambio_en_la_norma",
          "title": "Qué cambió en la norma",
          "description": "Qué cambió en una disposición de la ley, la RMF o un anexo («CFF 42», «regla 2.7.1.21»): la versión que regía en `fecha` (sin ella, la más reciente) contra la anterior, con la publicación del DOF de cada una, sus vigencias y lo que cambió, literal de la biblioteca (sólo versiones aprobadas): el párrafo casi igual, marcado por palabra; el que salió o entró, entero. Si dicen lo mismo, cuándo cambió su texto por última vez. Lista todas sus versiones con su `version_id` (para ir a otra, pase una `fecha` dentro de su vigencia). Para citar, leer_disposicion con el version_id. Para todo lo que cambió una reforma o un DOF de una vez («reforma fiscal 2027», una nota del DOF), que_publico_el_dof.",
