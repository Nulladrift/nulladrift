        {
          "name": "normativa_vigente",
          "title": "Ley vigente al día del hecho",
          "description": "Busca la ley fiscal mexicana vigente en una fecha, por tema o por referencia: leyes federales, reglamentos, RMF y anexos, RGCE, seguridad social, antilavado, estímulos y tratados; sólo versiones aprobadas, con su publicación en el DOF. Ej.: «plazo para concluir una visita domiciliaria», «CFF 46-A», «RMF 2.7.1.21». Sin `fecha` ni `periodo`, la ley de hoy, o la de la fecha que nombre la consulta: un año suelto es ese ejercicio («tasa de recargos 2027», el 1 de enero de 2027, con lo ya publicado para él). Cada resultado trae un tramo, su `version_id` y su fuente oficial: para leerla completa, leer_disposicion con su `version_id`. Dice si puede haber más resultados (`limite`, hasta 10). Búsqueda por texto (sin vectores): una consulta que no está en español no se busca y se dice cómo pedirla. Para lo que cambió una reforma o un DOF («reforma fiscal 2027»), que_publico_el_dof. [EN: Mexican tax law in force on a date.]",
