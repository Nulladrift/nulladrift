                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "periodo": {
                "description": "O el periodo (AAAA o AAAA-MM) de la versión que se quiere comparar: su último día (u hoy si sigue en curso; si aún no empieza, su primer día). `fecha` manda.",
