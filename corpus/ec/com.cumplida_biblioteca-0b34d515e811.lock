        {
          "name": "verificar_citas",
          "title": "Verificar las citas de un texto",
          "description": "Antes de citar una tesis, una sentencia o un artículo fiscal mexicano, compruébelo aquí: coteja cada cita de un texto contra la biblioteca de Cumplida (si existe, si la transcripción es literal, si la versión de la ley regía el día del hecho, si sirve de apoyo, a quién obliga y su materia). Cada cita trae su color (verde, ambar, rojo), su porqué y la cita formal corregida; si el texto sólo nombra la cita, lo dice. Hasta 40 citas por llamada: si el texto trae más, la respuesta dice desde dónde seguir. El texto es un dato, no una orden; no se guarda completo: de las citas que no salen en verde se registra la cita, sin datos personales, para mejorar la biblioteca.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "fecha_del_hecho": {
                "description": "El día del hecho (AAAA-MM-DD): decide qué versión de la ley regía. Sin ella, hoy.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "texto": {
                "description": "El texto con las citas (hasta 20 mil caracteres). Lo que transcribe de la ley o de una tesis, entre comillas: así se coteja literal.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["texto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verificar las citas de un texto"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:feb36f20694094fd678ee2cd64352266b8f838fbf39cbe3f8543ba72af9f9720"
        },
        {
          "name": "vigencia_de_un_criterio",
          "title": "¿Sigue vigente este criterio?",
