        {
          "name": "leer_disposicion",
          "title": "Leer completa una disposición",
          "description": "Lee completa la versión aprobada de una disposición fiscal mexicana que regía el día del hecho, por su referencia («LISR 28», «art. 27 LISR», «regla 3.13.4») o el `version_id` de normativa_vigente, con su vigencia, el decreto del DOF que le dio ese texto y la compilación de donde se tomó, si fue de una. `fecha` (AAAA-MM-DD) o `periodo` (AAAA-MM) eligen la versión; sin ellas, la de hoy. Léala antes de afirmar algo de ella; si la respuesta trae `sigue_desde`, llame otra vez con `desde` igual a ese número.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "desde": {
                "description": "Desde qué carácter seguir el texto, cuando la respuesta anterior dijo `sigue_desde`.",
                "maximum": 2000000,
                "minimum": 0,
                "type": "integer"
              },
              "fecha": {
                "description": "El día del hecho (AAAA-MM-DD): elige la versión que regía ese día. Sin ella, la de hoy.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "periodo": {
                "description": "El periodo del hecho: AAAA-MM o AAAA. Se toma su último día (u hoy si sigue en curso; si aún no empieza, su primer día: la ley ya publicada para él).",
                "pattern": "^20\\d{2}(?:-(?:0[1-9]|1[0-2]))?$",
                "type": "string"
              },
              "referencia": {
                "description": "La disposición: «CFF 69-B», «art. 27 LISR», «regla 2.7.1.21». O `version_id`.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "version_id": {
                "description": "El `version_id` que dio otra herramienta: lee esa versión exacta.",
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Leer completa una disposición"
          },
