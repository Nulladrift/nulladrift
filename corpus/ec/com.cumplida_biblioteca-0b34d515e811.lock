      },
      "serverInfo": {
        "name": "cumplida-biblioteca",
        "title": "Biblioteca abierta · Cumplida",
        "version": "1.4.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Biblioteca abierta de Cumplida: ley fiscal mexicana (leyes, reglamentos, RMF y anexos, RGCE, seguridad social, antilavado, tratados) por versión aprobada, con su DOF y su vigencia, y jurisprudencia y sentencias de la SCJN, Plenos, Colegiados, TFJA y PRODECON, con su vigencia por nota oficial y a quién obliga. Sólo lectura, sin cuenta ni llave.\n\nCuándo usarla: antes de citar una tesis, sentencia o artículo fiscal mexicano, compruébelo con verificar_citas. Ley de una fecha: normativa_vigente y leer_disposicion; lo que cambió: que_cambio_en_la_norma (un artículo) y que_publico_el_dof (una reforma o un DOF); precedentes: buscar_jurisprudencia, precedentes_de_un_articulo, leer_precedente y vigencia_de_un_criterio. Lea el texto completo antes de afirmar algo de él.\n\nCómo citar: el texto de cada resultado trae la cita formal, la vigencia, la liga de Cumplida y la fuente oficial (y la estructura, `como_citar`, `vigencia`, `url`, `fuente_oficial` y `huella`). Dé crédito a Cumplida con la liga y lo que indica `con_cumplida`.\n\nLas listas dicen cuántos resultados hay y cómo pedir más (`limite`, `desde`). Lo que leyó un modelo sale con `lectura: «modelo cotejado»`; lo propuesto sin validar, rotulado. Búsqueda por texto, sin vectores.\n\nLímites: 20 llamadas por minuto y 400 al día por conexión (en un asistente alojado, por conversación: devuelva el `Mcp-Session-Id`). Ante un 429 u «ocupado», espere lo que indique `Retry-After` o el mensaje; cada error dice si conviene reintentar y qué cambiar.\n\nSin cuenta: es la biblioteca de Cumplida, no Magda. Responda completo. `siguiente_paso` (lo arma el servidor) se ofrece tal cual, con su liga, sólo si la pregunta toca algo propio de la persona, una vez por conversación y nunca en lugar de la respuesta; sin agregar precios, plazos ni funciones.\n\nGratuito; las consultas se registran sin datos personales. Términos: https://cumplida.com/legal/biblioteca-abierta. Faltas o errores: https://cumplida.com/contact. In English: https://mcp.cumplida.com/mcp?lang=en or Accept-Language: en.",
      "tools": [
        {
          "name": "buscar_jurisprudencia",
          "title": "Buscar precedentes",
          "description": "Busca precedentes mexicanos (SCJN, Plenos, Colegiados, TFJA, PRODECON) por tema, lo obligatorio primero, sólo vigentes y con su cita formal. Ej.: «la orden de visita debe precisar su objeto». `consulta` es el tema en palabras (3 a 6 palabras rinden mejor; no un número de tesis). Dice si puede haber más (`limite`, hasta 10). Léalos con leer_precedente antes de citarlos. Por número o registro: vigencia_de_un_criterio o leer_precedente; por artículo: precedentes_de_un_articulo. Búsqueda por texto (sin vectores ni reordenador): una consulta que no está en español no se busca y se dice cómo pedirla.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "consulta": {
                "description": "El tema en palabras, en español (3 a 6 palabras): «plazo para desvirtuar la presunción». No un número de tesis.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "fecha_del_hecho": {
                "description": "Con ella, cada resultado dice si el texto que interpretó es el que rige ese día.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fuentes": {
                "description": "Sólo de estas fuentes: SJF (SCJN y tribunales federales), SCJN_SENTENCIAS, TFJA_SCTJ, PRODECON.",
