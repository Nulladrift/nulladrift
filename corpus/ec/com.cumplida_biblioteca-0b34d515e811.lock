        {
          "name": "que_publico_el_dof",
          "title": "Qué publicó el DOF y qué cambió",
          "description": "Qué publicó el Diario Oficial de la Federación y qué cambió con cada decreto, de una vez: por `codigo_dof` (la nota del DOF, «5803757»), por día de publicación (`fecha`; con `hasta`, un rango), por ordenamiento («LISR», «LIF», «CFF») o por palabras («reforma fiscal 2027», «Ley de Ingresos 2027»). Por decreto: título, fecha y liga al DOF, y cada disposición con texto aprobado: si es reforma, adición, derogación o texto nuevo, desde cuándo rige (y si rige después que el resto del decreto) y la llamada siguiente (leer_disposicion con su `version_id`; que_cambio_en_la_norma con su referencia y `fecha`). Lo que la biblioteca sigue cotejando contra el DOF no se muestra. Dice cuántos hay y cómo pedir el resto (`pagina`).",
