        {
          "name": "que_cambio_en_la_norma",
          "title": "Qué cambió en la norma",
          "description": "Qué cambió en una disposición de la ley, la RMF o un anexo («CFF 42», «regla 2.7.1.21»): la versión que regía en `fecha` (sin ella, la más reciente) contra la anterior, con la publicación del DOF de cada una, sus vigencias y lo que cambió, literal de la biblioteca (sólo versiones aprobadas): el párrafo casi igual, marcado por palabra; el que salió o entró, entero. Si dicen lo mismo, cuándo cambió su texto por última vez. Lista todas sus versiones con su `version_id` (para ir a otra, pase una `fecha` dentro de su vigencia). Para citar, leer_disposicion con el version_id. Para todo lo que cambió una reforma o un DOF de una vez («reforma fiscal 2027», una nota del DOF), que_publico_el_dof. [EN: What changed in a provision.]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "fecha": {
                "description": "Un día (AAAA-MM-DD) dentro de la vigencia de la versión que se quiere comparar con su anterior. Sin ella, la más reciente.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "periodo": {
                "description": "O el periodo (AAAA o AAAA-MM) de la versión que se quiere comparar: su último día (u hoy si sigue en curso; si aún no empieza, su primer día). `fecha` manda.",
                "pattern": "^20\\d{2}(?:-(?:0[1-9]|1[0-2]))?$",
                "type": "string"
              },
              "referencia": {
                "description": "La disposición: «CFF 42», «art. 27 LISR», «regla 2.7.1.21».",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["referencia"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Qué cambió en la norma"
          },
          "behavior": {
