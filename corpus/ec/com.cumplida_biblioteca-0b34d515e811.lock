        {
          "name": "precedentes_de_un_articulo",
          "title": "Precedentes de un artículo",
          "description": "Los precedentes mexicanos que aplican o interpretan un artículo de la ley («CFF 42», «art. 51 de la LFPCA»), sólo lo que sirve de apoyo: lo obligatorio primero y, dentro, la SCJN antes que los Plenos, los Colegiados y el TFJA, lo más reciente primero. `tema` no filtra: pone primero los que lo tratan y dice cuántos lo tratan; `fraccion` (en romano, «III») sí deja fuera lo que habla de otra fracción. Cada uno dice si su relación con el artículo está confirmada o propuesta sin validar, el pasaje que lo nombra cuando dice algo más que el rubro y, si se puede saber, el texto que interpretó frente al que rige el día del hecho. Entrega 10 por página (`limite`) y dice si hay más: la siguiente, con `desde` (hasta 30 en total). [EN: Precedents on a statutory article.]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "articulo": {
                "description": "El ordenamiento y el número: «CFF 69-B», «art. 51 de la LFPCA».",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "desde": {
                "description": "Desde qué lugar de la lista seguir, cuando la respuesta anterior dijo `siguiente_desde`.",
                "maximum": 29,
                "minimum": 0,
                "type": "integer"
              },
              "fecha_del_hecho": {
                "description": "El día del hecho (AAAA-MM-DD): cada precedente dice si el texto que interpretó es el que rige ese día. Sin ella, hoy.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fraccion": {
                "description": "La fracción en romano («III»): deja fuera lo que habla de otra fracción.",
