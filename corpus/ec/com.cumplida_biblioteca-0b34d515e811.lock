                  "enum": ["SJF", "SCJN_SENTENCIAS", "TFJA_SCTJ", "PRODECON"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "limite": {
                "description": "Cuántos resultados (1 a 10; por omisión, 8).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "publicada_hasta": {
                "description": "Sólo lo publicado hasta ese día.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "solo_obligatoria": {
                "description": "true: sólo jurisprudencia y precedentes obligatorios.",
                "type": "boolean"
              },
              "tipos": {
                "description": "Sólo de estos tipos de documento.",
