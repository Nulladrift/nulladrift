            "readOnly": true
          },
          "digest": "sha256:05c1c2dcad4b0445a42348b0c84ef258463ad7f00c446ee5d5f5425bd231f39b"
        },
        {
          "name": "leer_precedente",
          "title": "Leer un precedente",
          "description": "Lee completo un precedente mexicano por su número, registro o clave («2a./J. 22/98», «registro 2031002»), con su vigencia, a quién obliga, su cita formal, su fuente oficial, lo que dice de otros criterios y lo que otros dicen de él. Léalo antes de citarlo; `desde` sigue el texto donde se cortó. Las relaciones propuestas sin validar salen rotuladas. [EN: Read a precedent.]",
          "inputSchema": {
