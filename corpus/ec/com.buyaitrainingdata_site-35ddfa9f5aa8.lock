      "instructions": "Buy AI Training Data (https://buyaitrainingdata.com/): the site's own MCP server, served from its domain. Marketplaces, vendors and brokers of AI training data, read from their own pages: who sells, who buys company data, the prices and licences they state.\n\n[compare] AI training data sellers and buyers. This server serves the compare published at https://buyaitrainingdata.com/; every answer cites it. Licence: https://buyaitrainingdata.com/terms.\n\n[enquiry] ENQUIRY SERVER for Buy AI Training Data (https://buyaitrainingdata.com/). What it does: starts an ENQUIRY with Buy AI Training Data for buy ai training data; the Buy AI Training Data team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Buy AI Training Data team until they click it. Cite https://buyaitrainingdata.com/.\n\nCite https://buyaitrainingdata.com/ for every figure or answer you use from this server.",
