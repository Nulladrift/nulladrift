{
  "lockfileVersion": 2,
  "subjects": {
    "ai.durmem/durmem": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://durmem.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "durmem",
        "version": "1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Durmem memory for your agents. Call tools with your store key as a bearer token. If you do not have Durmem yet, first install the CLI. On macOS or Linux run `curl -fsSL https://durmem.ai/.well-known/cli/install.sh | sh`; on Windows PowerShell run `irm https://durmem.ai/.well-known/cli/install.ps1 | iex`. Then run `durmem setup --harness claude`. To set up another tool, pass codex, opencode, muse, dot, or hermes instead of claude; repeat --harness to set up several. Setup creates your account and connects your tools. If your client can only take a web address, see https://durmem.ai/docs/hosted-mcp-endpoint.",
      "tools": [
        {
          "name": "loom_describe_store",
          "title": "Describe the connected store",
          "description": "Describe the Durmem store this key opens: what it holds, plus the server version and storage capacity when available. Use to learn what the store contains before querying; to read specific facts use loom_query or loom_read_probe_bundle. Takes no arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Describe the connected store"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4196202f055b98c97f22680263676c23a7839deb9992210fed03fad49326ef80"
        },
        {
          "name": "loom_nearest_types",
          "title": "Find the closest existing entity types",
          "description": "Find the existing Durmem entity types most similar to a text, so you reuse one instead of minting a near-duplicate. Use before declaring a new type; to read facts use loom_query. Returns type names with neighbor counts and maximum similarity.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "k": {
                "description": "How many nearest facts to count types over, integer 1-100; default 30.",
                "type": "integer"
              },
              "text": {
                "description": "Text describing the fact or concept you are about to save, at most 8000 bytes.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the closest existing entity types"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92d14216f933f7b6094dabbd59cf3ae3b24110a97080359c1f6ea3967a062c9b"
        },
        {
          "name": "loom_query",
          "title": "Run a read-only query rule",
          "description": "Run one named read-only Durmem rule and return its rows. Use for a structured read when you know the rule and its argument order, such as rule_name facts_by_groups on namespace default_root; for a natural-language question use loom_read_probe_bundle, and to learn what a store holds use loom_describe_store. Only allow-listed root-tier read rules run; write, admin, and user-tier rules are refused.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "args": {
                "description": "The rule's own arguments, in its documented order; the server adds the store and date. At most 16 items and 16 KB of JSON.",
                "type": "array"
              },
              "include_history": {
                "description": "False, the default, drops rows that are not current from multi-row results that mark current_status; true returns every row the rule produced.",
                "type": "boolean"
              },
              "namespace": {
                "description": "Rule tier: default_root, the store's read-only root rule set. default_user is not callable through this hosted endpoint.",
                "type": "string"
              },
              "rule_name": {
                "description": "Allow-listed read rule to run: facts_by_groups, current_facts_by_groups, facts_in_scope, scope_chain, fact_history, text_search, field_search, list_rules, list_types, list_nodes, edge_targets, subtree_count, ancestor_types, or compose_prompt.",
                "type": "string"
              },
              "when": {
                "description": "Point-in-time cutoff as ISO date YYYY-MM-DD; omit for today.",
                "type": "string"
              }
            },
            "required": ["namespace", "rule_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Run a read-only query rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f277ac0a02f999a8e44345d4bffce5666ddc812224c2297efd9f5d4eef41bf29"
        },
        {
          "name": "loom_read_probe_bundle",
          "title": "Retrieve facts for a question",
          "description": "Retrieve the most relevant Durmem facts, ranked and bounded, for a question or label query. Use for open natural-language questions and current-state answers; to run one specific read rule use loom_query, and to learn what a store holds use loom_describe_store. Requires at least one of query_text, label_queries, or label_exprs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_stale": {
                "description": "True to also return stale_context: retracted, disputed or superseded facts. False, the default, omits it and metadata.stale_omitted says whether any existed.",
                "type": "boolean"
              },
              "label_exprs": {
                "description": "Up to 32 [relation, target] pairs selecting facts by label, e.g. [[\"SubTypeOf()\", \"Directive\"]].",
                "type": "array"
              },
              "label_queries": {
                "description": "Up to 32 entries of [[relation, target], \"inquiry text\"] ranking each label pair by its own inquiry.",
                "type": "array"
              },
              "max_facts": {
                "description": "Cap on facts in each section (current_facts, and stale_context when requested), integer 1-50; default 16. The best fact for each requested label pair is kept even beyond the cap, so a section can be longer.",
                "type": "integer"
              },
              "mode": {
                "description": "Label combination: \"or\", the default, matches any pair; \"and\" requires all.",
                "type": "string"
              },
              "query_text": {
                "description": "Natural-language question or topic to embed and match, at most 8000 bytes.",
                "type": "string"
              },
              "since": {
                "description": "Earliest event date to include, inclusive, as ISO YYYY-MM-DD; a fact with no event_time uses its known_from. Omit for no start.",
                "type": "string"
              },
              "top_k_sources": {
                "description": "How many best-matching facts each requested label pair, and the question as a whole, contributes (up to this many current and this many stale), integer 1-20; default 5.",
                "type": "integer"
              },
              "until": {
                "description": "Latest event date to include, inclusive, as ISO YYYY-MM-DD; a fact with no event_time uses its known_from. Omit for no end.",
                "type": "string"
              },
              "when": {
                "description": "Point-in-time cutoff as ISO date YYYY-MM-DD; omit for today.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Retrieve facts for a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54ec7fa81af55399887884f0d1a39fb4efd375b86ce3a4091ea274a2e0617e18"
        },
        {
          "name": "loom_save",
          "title": "Save a fact",
          "description": "Save one fact to the store: a typed entity expression, its content, and optional [relation, target] edges. Use to write new memory; to read memory use loom_query or loom_read_probe_bundle. Returns a fact_id: the new fact's, or the existing live fact's when the same entity is saved again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Fact body as plain text or a JSON string, non-empty and at most 24000 bytes.",
                "type": "string"
              },
              "edges": {
                "description": "At most 64 [relation, target] string pairs, each string 1-500 characters, e.g. [[\"Has()\", \"Importance(\\\"normal\\\")\"]].",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "entity": {
                "description": "One Julia constructor expression giving the fact's type and identity, such as Directive(\"Never deploy on Friday\"), at most 2000 bytes; reserved system types are refused.",
                "type": "string"
              },
              "known_from": {
                "description": "Belief date as ISO YYYY-MM-DD; omit to default to today.",
                "type": "string"
              },
              "source_text": {
                "description": "Optional verbatim source utterance the fact was derived from, at most 24000 bytes.",
                "type": "string"
              }
            },
            "required": ["content", "entity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save a fact"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:858a7109cbb2158fec5e785e79bb5b11e669cd14ca0643c23aba2a597a5ada61"
        },
        {
          "name": "whoami",
          "title": "Which Durmem store this key opens",
          "description": "Show which Durmem store the presented key opens, with its name and domain when available. Use only to confirm which store a key belongs to; to learn what a store holds call loom_describe_store, and to read facts call loom_query or loom_read_probe_bundle. Takes no arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which Durmem store this key opens"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c851bb4371bd7e29ef5163bc88603744f86617850487b15c1d347dc78931f7ce"
        }
      ],
      "digest": "sha256:452340372bea5ead5a5e23e7372263fe430d994c6b369dd805d859fa2927838d"
    }
  }
}
