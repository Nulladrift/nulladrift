      "instructions": "Catalyst is building computational infrastructure for human biology, starting with a provenance-aware knowledge graph of biological entities and biomedical findings. The current MCP interface exposes graph search, study findings with their evidence strength, and biological relationships; a research engine and physiological simulation are roadmap capabilities. All seven tools only read; nothing is written, sent or bought. For what a substance does, or whether it affects something, call find_evidence once: it resolves the name and returns the findings, strongest first, and that one result is the whole answer for the query. Use search_nodes to get a node id for the other tools, get_findings to list one node's findings, get_finding to explain one finding, get_relations and get_reactions for what reference databases record, and reach for whether or what a compound can become. Every evidence strength here is computed from the study behind it (design, population, replication), never written by hand. It is one of five named levels: strong, moderate, limited, very_limited, insufficient. An evidence strength describes how well the evidence supports a finding. It is not a recommendation to take anything, and it is not medical advice. Present each finding with its evidence strength in words, and link its permalink so the reader can check the quote and the paper. A row whose assertion_class is 'inferred' is a hypothesis drawn from a reference database, not a reported result: call it a hypothesis. Do not merge findings into a stronger claim than the strongest evidence supports, and say so when findings contradict each other.",
      "tools": [
        {
          "name": "find_evidence",
          "title": "Find the evidence on a substance or a question",
          "description": "Answers \"what does X do?\" and \"does X affect Y?\" for a supplement, nutrient, drug, food compound or plant (for example \"does magnesium help sleep?\", \"what is creatine shown to do?\", \"omega-3 and triglycerides\"). Pass the substance as query and the effect or outcome asked about, if there is one, as about. When the person names two substances (\"is creatine safe with caffeine\"), pass one as query and the other as about, in one call; findings about the pair together come back under in_combination. It resolves the name to the node that has findings and returns up to limit findings (default 10), strongest evidence first, each with its evidence strength in words, the study design, the quote, the paper, a permalink and a citation to quote as it stands. total_findings counts every match. The result is complete for the query: another wording of the same substance resolves to the same node, so do not call again to rephrase. Call again only to narrow (evidence_strength, about), to raise limit (at most 50), or to ask about something else. Without about, summary lists everything the node has findings about. If matched is null, or total_findings is 0, Catalyst has recorded no findings on it. That is a complete answer: say so, and do not answer from memory as though from Catalyst. Try search_nodes only when other_matches or summary shows a node the person plausibly meant. An evidence strength says how well the evidence supports a finding and is not a recommendation. For what a compound can become, use reach; for reference-database relations, use get_relations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "about": {
                "description": "Optional: the effect, outcome or second substance asked about (e.g. \"sleep\", \"blood pressure\", \"caffeine\"), or a node id from search_nodes.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "detail": {
                "default": "brief",
                "description": "brief (default) returns each finding with its claim, evidence strength, design, population, dose, quote, paper, permalink and a citation to quote as it stands. full adds every other recorded field and is longer; use it only when the person asks for all fields.",
                "enum": ["brief", "full"],
                "type": "string"
              },
              "evidence_strength": {
                "description": "Optional floor: only findings at this evidence strength or stronger, from strong down to insufficient.",
                "enum": ["strong", "moderate", "limited", "very_limited", "insufficient"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Findings to return, strongest evidence first. The default is enough to answer; total_findings says how many match.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The substance the person asked about, in their words (e.g. \"magnesium\", \"vitamin D\", \"BPC-157\"), or a node id from search_nodes. For a question about an outcome alone (e.g. \"what lowers blood pressure\"), the outcome.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the evidence on a substance or a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "catalystproject.ai/kind": "findings",
            "openai/outputTemplate": "ui://catalyst/evidence-card.html",
            "ui": {
              "resourceUri": "ui://catalyst/evidence-card.html"
            },
            "ui/resourceUri": "ui://catalyst/evidence-card.html"
          },
          "digest": "sha256:50f7c55ed9e15176bebb72380e4a22dcae33ff02a33b7d13acaa50d121284c4d"
        },
        {
          "name": "get_finding",
          "title": "One finding, with its evidence strength explained",
          "description": "Explains one finding by its finding id: the claim, its evidence strength and what that level means, the verbatim quote, the study design and the paper, and evidence_strength_reasons, each rule that set the level in order, and what the assessment does not weigh. The finding id is 26 characters, from the id field of a find_evidence or get_findings finding, or the last part of its permalink (/e/{id}). Use it to answer why the evidence behind a finding is as strong as it is, from evidence_strength_reasons and never by guessing. To find findings, use find_evidence or get_findings; this tool takes no name. A head-to-head comparison id returns a sentence naming the page that shows the comparison, not a finding.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "finding_id": {
                "description": "A 26-character finding id: the id of a finding from find_evidence or get_findings, or the last part of its permalink.",
                "pattern": "^[0-9A-HJKMNP-TV-Z]{26}$",
                "type": "string"
              }
            },
            "required": ["finding_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One finding, with its evidence strength explained"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "catalystproject.ai/kind": "findings"
          },
          "digest": "sha256:00723b053207b30482f324cb74cd474d1d10987616c886d4f57b4ee8677f0389"
        },
        {
          "name": "get_findings",
          "title": "Findings about a node, with their evidence strength",
          "description": "Lists the curated study findings for one node by id, from search_nodes: for a compound, organism or material, what it has been shown to affect; for an outcome, which compounds have been studied against it. Use it to browse a node by id. For a question in words, such as \"does X help Y\", find_evidence answers in one call and needs no id. summary has one row per thing the node has findings about, counted over all its findings and not only the rows returned. The default number of findings, strongest first, is enough to answer. There is no offset: to see a different slice, pass about (an id from summary, or words such as \"sleep\") or evidence_strength. Each finding carries its evidence strength, one of five named levels from strong to insufficient (strong, moderate, limited, very_limited, insufficient), the verbatim sentence it was drawn from, the paper, the population and dose, and a permalink. An evidence strength says how well the evidence supports the finding and is not a recommendation; give it with the claim, and link the permalink. An empty list means no findings are recorded for that node, a complete answer that does not show the compound does nothing; empty_means says why.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "about": {
                "description": "Optional: only findings about this, as an id from summary (e.g. CAT:outcome/sleep-onset-latency) or words in its name (e.g. \"sleep\").",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "detail": {
                "default": "brief",
                "description": "brief (default) returns each finding with its claim, evidence strength, design, population, dose, quote, paper, permalink and a citation to quote as it stands. full adds every other recorded field and is longer; use it only when the person asks for all fields.",
                "enum": ["brief", "full"],
                "type": "string"
              },
              "evidence_strength": {
                "description": "Optional floor: only findings at this evidence strength or stronger, from strong down to insufficient.",
                "enum": ["strong", "moderate", "limited", "very_limited", "insufficient"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Findings to return, strongest evidence first (1 to 50). The default is enough to answer.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "node_id": {
                "description": "A node id in the form PREFIX:local, e.g. CHEBI:16919 (creatine). Get it from the id field of a search_nodes hit.",
                "maxLength": 120,
                "minLength": 3,
                "pattern": "^[A-Za-z_]+:[A-Za-z0-9_./+-]+$",
                "type": "string"
              }
            },
            "required": ["node_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Findings about a node, with their evidence strength"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "catalystproject.ai/kind": "findings"
          },
          "digest": "sha256:69e710d31542470097141c00e92105820b542aa0e50fce6b1d3ba888c3bba8b3"
        },
        {
          "name": "get_reactions",
          "title": "Reactions a compound or protein takes part in (inferred)",
          "description": "Lists the biochemical reactions from Rhea and Human-GEM that a compound is a substrate or product of, or that a protein (enzyme) catalyses or transports, by node id from search_nodes. It lists reactions and does not answer a route question: for \"can X become Y\" or \"what can X become\", use reach. Every row is assertion_class 'inferred': a reaction two public databases record, not a result anyone measured in a person. Present these as known biochemistry, never as an effect a compound has, and never as a recommendation. For effects, use find_evidence. Returns total and up to limit reactions (default 10), each with its equation, its participants by side, id and label, the first five enzymes with catalyst_count for all of them, and its source; offset pages the rest, and the default is enough to answer. A page too large for one result is cut to fit, and truncated with next_offset says how to get the rest. A compound flagged is_hub (water, ATP, protons and the like) returns its reaction count only, because it takes part in nearly every reaction. Coverage is one Rhea release and one Human-GEM release; a participant that is not a node in this graph is listed with a null id, and only human enzymes that are nodes are listed. An empty result means no reaction in those releases names this node. That is a complete answer and does not show the body has none.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "limit": {
                "default": 10,
                "description": "Reactions to return (1 to 50). Each carries its participants and enzymes; the default is enough to answer.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "node_id": {
                "description": "A node id in the form PREFIX:local, e.g. CHEBI:16919 (creatine). Get it from the id field of a search_nodes hit.",
                "maxLength": 120,
                "minLength": 3,
                "pattern": "^[A-Za-z_]+:[A-Za-z0-9_./+-]+$",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Reactions to skip, to page past limit.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["node_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Reactions a compound or protein takes part in (inferred)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "catalystproject.ai/kind": "hypotheses"
          },
          "digest": "sha256:3937390802772754167fc993d8e0e8744e731ef2cfcf004d9b7248fd11866670"
        },
        {
          "name": "get_relations",
          "title": "Reference-database relations (hypotheses)",
          "description": "Lists what public reference databases (Reactome, UniProt, Rhea, ChEBI and others) record about one node by id, from search_nodes: transporters, enzymes, pathways, expression. Every row is assertion_class 'inferred': a hypothesis about how a compound could act, not a result anyone measured in people. Present these as possible mechanisms and never as effects. For effects, use find_evidence. For the reactions a compound or enzyme takes part in, use get_reactions; for what a compound can become, use reach. predicate limits the list to one relation type, named as in the predicate field of a row (for example transported_by for transporters, metabolized_by for enzymes). Returns total and up to limit rows (default 10); offset pages the rest, and the default is enough to answer. A page too large for one result is cut to fit, and truncated with next_offset says how to get the rest. An empty list with a predicate means the databases record no relation of that type for this node. That is a complete answer, so do not repeat the call with the same predicate. Leave predicate out once only when the person asked broadly and you need to see which types the node has.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "limit": {
                "default": 10,
                "description": "Rows to return (1 to 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "node_id": {
                "description": "A node id in the form PREFIX:local, e.g. CHEBI:16919 (creatine). Get it from the id field of a search_nodes hit.",
                "maxLength": 120,
                "minLength": 3,
                "pattern": "^[A-Za-z_]+:[A-Za-z0-9_./+-]+$",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Rows to skip, to page past limit.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "predicate": {
                "description": "Limit to one relation type, as in the predicate field of a row, e.g. transported_by.",
                "enum": ["transported_by", "substrate_of", "inhibits", "activates", "binds", "metabolized_by", "converted_to", "participates_in", "regulates", "expressed_in", "absorbed_at", "accumulates_in", "affects", "depletes", "requires_cofactor", "contraindicated_with", "alters_exposure_of", "contradicts", "has_adi", "response_varies_by", "has_functional_parent", "enantiomer_of", "has_hepatotoxicity_likelihood", "regulates_expression_of", "interacts_with", "covaries_with", "affects_phenotype", "has_phenotype", "has_germline_basis_in", "located_in", "part_of", "affects_relative_to"],
                "type": "string"
              }
            },
            "required": ["node_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Reference-database relations (hypotheses)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "catalystproject.ai/kind": "hypotheses"
          },
          "digest": "sha256:05f7ff3b8b42aa39472d58926d99f22be797d980cdb6906351f9e3b13b927564"
        },
        {
          "name": "reach",
          "title": "What a compound can become, and through what (inferred, a hypothesis)",
          "description": "Answers a route question: \"can X become Y in the body\" (give from_id and to_id) and \"what can X become\" (give only from_id). Both ids are compound node ids from search_nodes, so a question that names two compounds needs one search_nodes call for each first. It searches the reactions two public databases (Rhea, Human-GEM) record, up to depth steps (1 to 3, default 3), and returns the routes with the reactions and enzymes along each. Every route is assertion_class 'inferred': a hypothesis drawn from reference databases, never a measured or reported effect. Present it as known biochemical connectivity, never as an effect, a recommendation, or a claim that the body actually does this. For measured effects, use find_evidence. Common cofactors and currency species (water, ATP, protons and the like) are not used as intermediate steps, so a route never reads 'reaches everything through ATP'. A currency species given as from_id or to_id returns reachable: null with a coverage note, not a checked 0 routes. With from_id alone it lists up to limit routes (default 10, offset pages the rest); a page too large for one result is cut to fit, and truncated with next_offset says how to get the rest. When no route is found, the coverage field says which of three cases it is: reachability has not been built for this scope yet, so nothing was checked; it was checked and no route exists through the reactions loaded, which does not mean the body cannot make it; or the compound is a currency species and was never searched. The answer is in that one result; another tool does not check it again.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "depth": {
                "default": 3,
                "description": "Longest route to consider, in reaction steps (1 to 3).",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "from_id": {
                "description": "The compound to start from: a compound node id from search_nodes.",
                "maxLength": 120,
                "minLength": 3,
                "pattern": "^[A-Za-z_]+:[A-Za-z0-9_./+-]+$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Routes to return when to_id is omitted (1 to 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Routes to skip when to_id is omitted, to page past limit.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "to_id": {
                "description": "A target compound: a compound node id from search_nodes. Omit to list everything from_id reaches.",
                "maxLength": 120,
                "minLength": 3,
                "pattern": "^[A-Za-z_]+:[A-Za-z0-9_./+-]+$",
                "type": "string"
              }
            },
            "required": ["from_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What a compound can become, and through what (inferred, a hypothesis)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "catalystproject.ai/kind": "hypotheses"
          },
          "digest": "sha256:10111331a440130b411f560ae0dca5c5366cbb6369bddbd9f2dad14b95f5c970"
        },
        {
          "name": "search_nodes",
          "title": "Find a compound, outcome or protein",
          "description": "Looks up the node id for a compound, protein, organism or outcome by name or synonym (for example \"CoQ10\", \"caffeine\", \"CYP1A2\", \"sleep\"). Use it to get the id that get_findings, get_finding, get_relations, get_reactions and reach take; for a question about what a substance does, call find_evidence instead, which needs no id. Returns up to 10 hits, each with id, label, type and the number of findings; hits with findings come first, so the first hit with findings above 0 is usually the one to use. An enzyme or transporter has type protein. It says nothing about a node beyond its id and how many findings it has. If with_findings is 0 the graph holds no findings for the name; the hits may still be the right node for get_relations, get_reactions or reach.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "query": {
                "description": "A name, synonym or short phrase, e.g. \"CoQ10\" or \"vitamin D\". One substance per call.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a compound, outcome or protein"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "catalystproject.ai/kind": "lookup"
          },
