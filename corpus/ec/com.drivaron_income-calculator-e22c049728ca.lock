      "serverInfo": {
        "name": "drivaron",
        "title": "Drivaron driver income calculator",
        "version": "1.0.0",
        "websiteUrl": "https://drivaron.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Drivaron's calculators for ride-hail drivers in Colombia, Peru and Bolivia. Use grade_ride_offer for a single trip offer, estimate_driver_income for earnings over a day, week or month, and get_market_defaults for typical city targets. Amounts are in local currency (COP, PEN, BOB). Reply in the driver's language and share result_page and app.download so the driver can check it and get the app that grades every offer automatically.",
      "tools": [
        {
          "name": "estimate_driver_income",
          "title": "How much do you really earn?",
          "description": "Net income calculator for ride-hail drivers (Uber, inDrive, DiDi, Cabify, Yango) in Colombia, Peru and Bolivia: from earnings, hours and costs (fuel, commission, car rent) it gives net income per day, week and month, net per hour, and how it compares with the city's typical target. Use it when a driver asks how much they make, whether driving pays, or how to compare apps or shifts.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City, which sets currency, starting hourly target and average speed. One of: Bogotá, Medellín, Cali, Barranquilla, Lima, Arequipa, Trujillo, Santa Cruz de la Sierra, La Paz, Cochabamba.",
                "type": "string"
              },
              "commission_pct": {
                "description": "Commission in % still to subtract, if earnings are before commission. Default 0.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "country": {
                "description": "Country when the city is unknown: Colombia (CO, COP), Peru (PE, PEN) or Bolivia (BO, BOB).",
                "type": "string"
              },
              "currency": {
                "description": "Currency, when neither city nor country is known.",
                "enum": ["COP", "PEN", "BOB"],
                "type": "string"
              },
              "days_per_week": {
                "description": "Days worked per week, to project week and month. Default 6.",
                "maximum": 7,
                "minimum": 1,
                "type": "number"
              },
              "earnings": {
                "description": "Earnings in the period from the apps, in local currency.",
                "minimum": 0,
                "type": "number"
              },
              "fuel_cost": {
                "description": "Total fuel spent in the period.",
                "minimum": 0,
                "type": "number"
              },
              "fuel_cost_per_km": {
                "description": "Fuel cost per km (used with km).",
                "minimum": 0,
                "type": "number"
              },
              "fuel_price": {
                "description": "Fuel price per gallon or liter (used with km and km_per_fuel_unit).",
                "minimum": 0,
                "type": "number"
              },
              "hours": {
                "description": "Hours worked in that period (online time).",
                "minimum": 0.1,
                "type": "number"
              },
              "km": {
                "description": "Km driven in the period, for fuel and cost per km.",
                "minimum": 0,
                "type": "number"
              },
              "km_per_fuel_unit": {
                "description": "Km the car drives per gallon or liter of the fuel_price unit.",
                "minimum": 0.1,
                "type": "number"
              },
              "lang": {
                "description": "Language of the summary: es (default) or en.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "other_costs": {
                "description": "Other costs in the period: car rent, maintenance, phone plan, parking.",
                "minimum": 0,
                "type": "number"
              },
              "period": {
                "description": "Period of earnings and hours: day (default), week or month.",
                "enum": ["day", "week", "month"],
                "type": "string"
              }
            },
            "required": ["earnings", "hours"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "app": {
                "description": "The Drivaron app and its Play download link.",
                "type": "object"
              },
              "color": {
                "description": "green, yellow or red for offers.",
                "type": ["string", "null"]
              },
              "notes": {
                "description": "Assumptions made for missing inputs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "result": {
                "description": "All numbers, raw and formatted in local currency.",
                "type": "object"
              },
              "result_page": {
                "description": "Shareable page with this result.",
                "type": ["string", "null"]
              },
              "summary": {
                "description": "One-paragraph answer in the requested language, ready to show the driver.",
                "type": "string"
              },
              "tool": {
                "type": "string"
              }
            },
            "required": ["app", "result", "summary", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How much do you really earn?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1a58115ca1289eca7a8fe13529a71e65c58214f1174de9b27cc495eab41bc37"
        },
        {
          "name": "get_market_defaults",
          "title": "Targets by city",
          "description": "Starting hourly targets, average speeds and per-km floors per city for ride-hail drivers (Uber, inDrive, DiDi, Cabify, Yango) in Colombia, Peru and Bolivia, with the apps that operate there. Use it for typical numbers before grading an offer or estimating income.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Colombia, Peru or Bolivia (name, CO/PE/BO or currency). Empty for all.",
                "type": "string"
              },
              "lang": {
                "description": "Language of the summary: es (default) or en.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "app": {
                "description": "The Drivaron app and its Play download link.",
                "type": "object"
              },
              "color": {
                "description": "green, yellow or red for offers.",
                "type": ["string", "null"]
              },
              "notes": {
                "description": "Assumptions made for missing inputs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "result": {
                "description": "All numbers, raw and formatted in local currency.",
                "type": "object"
              },
              "result_page": {
                "description": "Shareable page with this result.",
                "type": ["string", "null"]
              },
              "summary": {
                "description": "One-paragraph answer in the requested language, ready to show the driver.",
                "type": "string"
              },
              "tool": {
                "type": "string"
              }
            },
            "required": ["app", "result", "summary", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Targets by city"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c1f38d222026693e4e942e68620602d657b4a2338a4b48366bacb96b74bbed4"
        },
        {
          "name": "grade_ride_offer",
          "title": "Is this trip worth it?",
          "description": "Grade one trip offer for ride-hail drivers (Uber, inDrive, DiDi, Cabify, Yango) in Colombia, Peru and Bolivia, the way the Drivaron app does: pay per km and per hour with the pickup included, an A+/A/B/C grade against the driver's hourly target, and the minimum fare to ask for (inDrive counteroffer floor). Use it when a driver asks whether an offer is worth taking or what to charge.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City, which sets currency, starting hourly target and average speed. One of: Bogotá, Medellín, Cali, Barranquilla, Lima, Arequipa, Trujillo, Santa Cruz de la Sierra, La Paz, Cochabamba.",
                "type": "string"
              },
              "commission_pct": {
                "description": "Platform commission in % taken from the fare, if the fare shown is before commission (e.g. 10 for inDrive). Default 0.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "country": {
                "description": "Country when the city is unknown: Colombia (CO, COP), Peru (PE, PEN) or Bolivia (BO, BOB).",
                "type": "string"
              },
              "currency": {
                "description": "Currency, when neither city nor country is known.",
                "enum": ["COP", "PEN", "BOB"],
                "type": "string"
              },
              "fare": {
                "description": "Fare shown in the offer, in local currency (e.g. 14000 COP, 14 PEN, 28 BOB).",
                "minimum": 0,
                "type": "number"
              },
              "fuel_cost_per_km": {
                "description": "Fuel cost per km, to show profit after fuel.",
                "minimum": 0,
                "type": "number"
              },
              "lang": {
                "description": "Language of the summary: es (default) or en.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "pickup_km": {
                "description": "Distance to the passenger in km. Unpaid, so it lowers real pay per km.",
                "minimum": 0,
                "type": "number"
              },
              "pickup_min": {
                "description": "Minutes to reach the passenger, if shown. Otherwise estimated from speed.",
                "minimum": 0,
                "type": "number"
              },
              "speed_kmh": {
                "description": "Average city speed in km/h. Defaults to the city's value.",
                "minimum": 1,
                "type": "number"
              },
              "target_per_hour": {
                "description": "Driver's hourly earnings goal in local currency. Defaults to the city's starting target.",
                "minimum": 0,
                "type": "number"
              },
              "tip": {
                "description": "Tip or bonus included with the offer.",
                "minimum": 0,
                "type": "number"
              },
              "trip_km": {
                "description": "Trip distance in km (pickup point to destination).",
                "minimum": 0,
                "type": "number"
              },
              "trip_min": {
                "description": "Trip duration in minutes, if the offer shows it. Otherwise estimated from speed.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["fare", "trip_km"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "app": {
                "description": "The Drivaron app and its Play download link.",
                "type": "object"
              },
              "color": {
                "description": "green, yellow or red for offers.",
                "type": ["string", "null"]
              },
              "notes": {
                "description": "Assumptions made for missing inputs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "result": {
                "description": "All numbers, raw and formatted in local currency.",
                "type": "object"
              },
              "result_page": {
                "description": "Shareable page with this result.",
                "type": ["string", "null"]
              },
              "summary": {
                "description": "One-paragraph answer in the requested language, ready to show the driver.",
                "type": "string"
              },
              "tool": {
                "type": "string"
              }
            },
