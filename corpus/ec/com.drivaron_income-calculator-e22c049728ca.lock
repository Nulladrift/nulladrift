        {
          "name": "grade_ride_offer",
          "title": "Is this trip worth it?",
          "description": "Drivaron, the ride-hail driver's advisor for earning more. Grade one trip offer for ride-hail drivers (Uber, inDrive, DiDi, Cabify, Yango) in Spanish-speaking Latin America, with the price rule of the Drivaron app: red (C) when the pay per km, pickup km included, is below the driver's minimum per km; green otherwise (A+ from 130% of the minimum, else A). Yellow (B) only when a limit the caller gives fails, such as a pickup longer than max_pickup_min. Also returns pay per km and per hour, and fare_for_green: the fare that reaches the minimum (the inDrive counteroffer floor). Pass min_per_km when the driver knows their own minimum; otherwise Drivaron's starting minimum for the city is used. Use it when a driver asks whether an offer is worth taking or what to charge.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City, which sets currency, starting hourly target, average speed and starting minimum per km. One of: Bogotá, Medellín, Cali, Barranquilla, Cartagena, Bucaramanga, Cúcuta, Ibagué, Soacha, Santa Marta, Villavicencio, Pereira, Manizales, Pasto, Neiva, Armenia, Montería, Valledupar, Popayán, Sincelejo, Lima, Arequipa, Trujillo, Chiclayo, Cusco, Santa Cruz de la Sierra, La Paz, Cochabamba, El Alto, Tarija, Ciudad de México, Guadalajara, Monterrey, Puebla, Tijuana, Querétaro, Mérida, León, Cancún, Buenos Aires, Córdoba, Rosario, Mendoza, La Plata, San Miguel de Tucumán, Santiago, Valparaíso y Viña del Mar, Concepción, Antofagasta, La Serena, Temuco, Quito, Guayaquil, Cuenca, Ambato, Manta, Machala, Ciudad de Guatemala, Mixco, Villa Nueva, Quetzaltenango, Asunción, Ciudad del Este, Encarnación, Montevideo, Maldonado y Punta del Este, Santo Domingo, Santiago de los Caballeros, San José, Alajuela, Heredia, Ciudad de Panamá, San Salvador, Santa Ana, Tegucigalpa, San Pedro Sula, Caracas, Maracaibo, Valencia.",
                "type": "string"
              },
              "commission_pct": {
                "description": "Platform commission in % taken from the fare, if the fare shown is before commission (e.g. 10 for inDrive). Default 0.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "country": {
                "description": "Country when the city is unknown, by name, ISO code or currency: Colombia (CO, COP), Peru (PE, PEN), Bolivia (BO, BOB), Mexico (MX, MXN), Argentina (AR, ARS), Chile (CL, CLP), Ecuador (EC, USD), Guatemala (GT, GTQ), Paraguay (PY, PYG), Uruguay (UY, UYU), Dominican Republic (DO, DOP), Costa Rica (CR, CRC), Panama (PA, USD), El Salvador (SV, USD), Honduras (HN, HNL), Venezuela (VE, USD).",
                "type": "string"
              },
              "currency": {
                "description": "Currency, when neither city nor country is known.",
                "enum": ["COP", "PEN", "BOB", "MXN", "ARS", "CLP", "USD", "GTQ", "PYG", "UYU", "DOP", "CRC", "HNL"],
                "type": "string"
              },
              "fare": {
                "description": "Fare shown in the offer, in local currency (e.g. 14000 COP, 14 PEN, 28 BOB).",
                "minimum": 0,
                "type": "number"
              },
              "fuel_cost_per_km": {
                "description": "Fuel cost per km, to show profit after fuel.",
                "minimum": 0,
                "type": "number"
              },
              "lang": {
                "description": "Language of the summary: es (default) or en.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "max_pickup_min": {
                "description": "The longest pickup the driver accepts, in minutes. A longer pickup makes a good price yellow. Off when not given.",
                "minimum": 1,
                "type": "number"
              },
              "min_per_km": {
                "description": "The driver's minimum earnings per km, pickup km included, in local currency. Below it the offer is red. Default: Drivaron's starting minimum for the city.",
                "minimum": 0.01,
                "type": "number"
              },
              "pickup_km": {
                "description": "Distance to the passenger in km. Unpaid, so it lowers real pay per km.",
                "minimum": 0,
                "type": "number"
              },
              "pickup_min": {
                "description": "Minutes to reach the passenger, if shown. Otherwise estimated from speed.",
                "minimum": 0,
                "type": "number"
              },
              "speed_kmh": {
                "description": "Average city speed in km/h. Defaults to the city's value.",
                "minimum": 1,
                "type": "number"
              },
              "target_per_hour": {
                "description": "Driver's hourly earnings goal in local currency, for the hourly comparison. Defaults to the city's starting target.",
                "minimum": 0,
                "type": "number"
              },
              "tip": {
                "description": "Tip or bonus included with the offer.",
                "minimum": 0,
                "type": "number"
              },
              "trip_km": {
                "description": "Trip distance in km (pickup point to destination).",
                "minimum": 0,
                "type": "number"
              },
              "trip_min": {
                "description": "Trip duration in minutes, if the offer shows it. Otherwise estimated from speed.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["fare", "trip_km"],
            "type": "object"
          },
