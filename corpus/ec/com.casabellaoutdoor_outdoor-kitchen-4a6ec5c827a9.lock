        {
          "name": "outdoor_kitchen_open_designer_for_render",
          "title": "Open the 3D designer for a photoreal render",
          "description": "Create the shopper's account and return a link to the 3D outdoor kitchen designer, where they get a photoreal render of their kitchen by email. Call when the user wants to see their outdoor kitchen or BBQ island, wants a render, picture or 3D design. Needs first name, last name and email: pass them if you have them; otherwise the server asks the shopper directly when the client supports it. Pass \"design\" to open the designer with the straight layout you priced. For a Galley, Corner L, Corner 45, U-Shape or Promenade, pass \"kitchenLayout\" and no \"design\"; the shopper lays it out in the designer. Canonical examples: {\"firstName\":\"Ana\",\"lastName\":\"Diaz\",\"email\":\"ana@example.com\",\"postalCode\":\"07960\",\"design\":{\"width\":120,\"kitchenLayout\":\"straight\",\"color\":\"BasaltGrey\",\"countertopType\":\"GraniteAbsoluteBlack\",\"cabinets\":[{\"type\":\"GrillCabinet\",\"size\":42,\"grillBrand\":\"Alfresco\",\"grillModelId\":\"ALFRESCO-36-ALXE\"},{\"type\":\"DoubleDrawerFlex\",\"size\":24},{\"type\":\"FullDoorFlex\",\"size\":30},{\"type\":\"SinkCabinet\",\"size\":24}]}} and {\"firstName\":\"Ana\",\"lastName\":\"Diaz\",\"email\":\"ana@example.com\",\"kitchenLayout\":\"corner_45\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "type": "string"
              },
              "design": {
                "description": "The straight layout you priced with outdoor_kitchen_price_design; the designer opens with it. Leave out for any other shape.",
                "properties": {
                  "cabinets": {
                    "description": "Cabinets left to right along the one straight run.",
                    "items": {
                      "properties": {
                        "grillBrand": {
                          "description": "For a GrillCabinet: the grill brand, e.g. \"Alfresco\", \"DCS\", \"AOG\".",
                          "type": "string"
                        },
                        "grillModelId": {
                          "description": "For a GrillCabinet: the grill SKU from outdoor_kitchen_search_built_in_grills, e.g. \"ALFRESCO-36-ALXE\".",
                          "type": "string"
                        },
                        "size": {
                          "description": "Cabinet width in inches, one of the sizes listed for that type (e.g. 24, 30, 36, 42).",
                          "exclusiveMinimum": 0,
                          "type": "number"
                        },
                        "type": {
                          "description": "Cabinet type exactly as returned by outdoor_kitchen_list_cabinets, e.g. \"GrillCabinet\", \"DoubleDrawerFlex\", \"FullDoorFlex\", \"SinkCabinet\", \"CTS\" (refrigerator), \"SideBurnerCabinet\", \"PowerBurnerCabinet\".",
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["size", "type"],
                      "type": "object"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
