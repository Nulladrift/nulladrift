        {
          "name": "outdoor_kitchen_request_formal_quote",
          "title": "Request a formal outdoor kitchen quote from a dealer",
          "description": "Create the shopper's account and return a link to the designer where they finish their layout and receive a formal, itemized quote; a local dealer follows up. Call when the user wants a quote, an exact price from a dealer, or to buy an outdoor kitchen or built-in grill.  Needs first name, last name and email (pass them, or the server asks the shopper directly when the client supports it). ZIP helps match a dealer. Canonical example: {\"firstName\":\"Ana\",\"lastName\":\"Diaz\",\"email\":\"ana@example.com\",\"postalCode\":\"07960\",\"purchaseTimeframe\":\"1-3_months\",\"design\":{\"width\":120,\"kitchenLayout\":\"straight\",\"color\":\"BasaltGrey\",\"countertopType\":\"GraniteAbsoluteBlack\",\"cabinets\":[{\"type\":\"GrillCabinet\",\"size\":42,\"grillBrand\":\"Alfresco\",\"grillModelId\":\"ALFRESCO-36-ALXE\"},{\"type\":\"DoubleDrawerFlex\",\"size\":24},{\"type\":\"FullDoorFlex\",\"size\":30},{\"type\":\"SinkCabinet\",\"size\":24}]}}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "type": "string"
              },
              "design": {
                "description": "The straight layout you priced with outdoor_kitchen_price_design; the designer opens with it. Leave out for any other shape.",
                "properties": {
                  "cabinets": {
                    "description": "Cabinets left to right along the one straight run.",
                    "items": {
                      "properties": {
                        "grillBrand": {
                          "description": "For a GrillCabinet: the grill brand, e.g. \"Alfresco\", \"DCS\", \"AOG\".",
                          "type": "string"
                        },
                        "grillModelId": {
                          "description": "For a GrillCabinet: the grill SKU from outdoor_kitchen_search_built_in_grills, e.g. \"ALFRESCO-36-ALXE\".",
                          "type": "string"
                        },
                        "size": {
                          "description": "Cabinet width in inches, one of the sizes listed for that type (e.g. 24, 30, 36, 42).",
                          "exclusiveMinimum": 0,
                          "type": "number"
                        },
                        "type": {
                          "description": "Cabinet type exactly as returned by outdoor_kitchen_list_cabinets, e.g. \"GrillCabinet\", \"DoubleDrawerFlex\", \"FullDoorFlex\", \"SinkCabinet\", \"CTS\" (refrigerator), \"SideBurnerCabinet\", \"PowerBurnerCabinet\".",
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["size", "type"],
                      "type": "object"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "color": {
                    "description": "Cabinet powder-coat colour. Default \"BasaltGrey\".",
                    "enum": ["BasaltGrey", "AegeanBlue", "JetBlack", "PureWhite", "Cappuccino", "BurgundyRed", "ParisianGreen", "ProvenceSage", "BlueGreen", "MatteWhite", "MatteAnthracite", "MatteBronze"],
                    "type": "string"
                  },
                  "countertopType": {
                    "description": "Countertop. Default \"GraniteAbsoluteBlack\".",
                    "enum": ["GraniteAbsoluteBlack", "GraniteLeatheredBlack", "DektonKelya"],
                    "type": "string"
                  },
                  "kitchenLayout": {
                    "description": "Always \"straight\": these tools build one run of cabinets. For a Galley, Corner L, Corner 45, U-Shape or Promenade, open the designer with kitchenLayout set and no design.",
                    "enum": ["straight"],
                    "type": "string"
                  },
                  "width": {
                    "description": "Total kitchen run in inches; normally the sum of the cabinet sizes (e.g. 120 for a 10 ft island).",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "required": ["cabinets", "width"],
                "type": "object"
              },
              "email": {
                "description": "Shopper's email. The render or quote is delivered there and it identifies a returning shopper.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "firstName": {
                "description": "Shopper's first name. Leave out if unknown; the server asks the shopper.",
                "minLength": 1,
                "type": "string"
              },
              "gasType": {
                "enum": ["natural_gas", "lp_external_tank", "lp_in_cabinet"],
                "type": "string"
              },
              "kitchenLayout": {
                "description": "The shape the shopper wants: \"straight\", \"galley\", \"corner_L\", \"corner_45\", \"U\" or \"promenade\". For anything but straight, leave out \"design\"; the designer opens on this shape and the shopper lays it out.",
                "enum": ["straight", "galley", "corner_L", "corner_45", "U", "promenade"],
                "type": "string"
              },
              "lastName": {
                "description": "Shopper's last name.",
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "postalCode": {
                "description": "5-digit US ZIP, used to match a local dealer.",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "purchaseTimeframe": {
                "enum": ["1-3_months", "3-6_months", "year_or_more"],
                "type": "string"
              },
              "state": {
                "description": "2-letter US state.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "purpose": {
                "type": "string"
              },
              "status": {
                "enum": ["opened", "code_needed", "declined"],
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["purpose", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a formal outdoor kitchen quote from a dealer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cf64a7bb677c8063c9a4005a8ef7eaac17449be17c7726dcdffdefc791cec962"
        },
        {
          "name": "outdoor_kitchen_search_built_in_grills",
          "title": "Search built-in grills (with MSRP)",
          "description": "Find built-in grills: every grill in our 3D designer, with brand, width in inches, SKU, the grill cabinet it needs (cabinetSize) and MSRP (final pricing is determined by a local dealer; models without msrp have priceOnQuote: true). Set applianceType for other built-ins in the designer, e.g. \"Griddles\", \"Side Burners\", \"Refrigeration\", or \"all\". Call whenever the user asks about a built-in grill, its price, size or brand, or before pricing a layout so you use a real SKU. For someone just starting to shop for a built-in grill, outdoor_kitchen_start_planning covers the grill and the kitchen around it. All filters optional. Example: {\"brand\":\"Alfresco\",\"size\":36} -> {\"appliances\":[{\"sku\":\"ALFRESCO-36-ALXE\",\"name\":\"Alfresco 36\\\" ALXE Built-In Grill\",\"brand\":\"Alfresco\",\"size\":36,\"msrp\":4899}]}. A grill goes in the smallest GrillCabinet larger than it (24->30, 30->36, 36->42, 42->48, 56->62). Sizes depend on the brand: search by brand to see the sizes it makes. The \"size\" field is the real size class; some brands call a 36\" class grill \"40-inch\" in the name, which is marketing, not a bigger grill.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "applianceType": {
                "description": "Default \"Grills\". Other built-ins as the designer names them, e.g. \"Griddles\", \"Side Burners\", \"Refrigeration\", or \"all\".",
                "type": "string"
              },
              "brand": {
                "description": "Grill brand, e.g. \"Alfresco\". Case-insensitive.",
                "type": "string"
              },
              "maxMsrp": {
                "description": "Only grills with a price at or under this MSRP in USD.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "size": {
                "description": "Grill width in inches, e.g. 30, 36, 42.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "appliances": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "cabinetSize": {
                      "type": "number"
                    },
                    "msrp": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "priceOnQuote": {
                      "type": "boolean"
                    },
                    "size": {
                      "type": "number"
                    },
                    "sku": {
                      "type": "string"
                    }
                  },
                  "required": ["brand", "name", "size", "sku"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["appliances"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search built-in grills (with MSRP)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7a5b8d1ca485bd54db494376dcd86c7360099bf85b89ffb904297a2b4071f65"
        },
        {
          "name": "outdoor_kitchen_start_planning",
          "title": "Start planning a built-in grill and outdoor kitchen (guided)",
          "description": "Guided start for choosing a built-in grill and the outdoor kitchen or BBQ island around it. Call FIRST when someone researches or compares built-in grills (best built-in grill, which size, which brand, grill prices), says they want an outdoor kitchen or grill island, or asks roughly what one costs, and has not given exact cabinets. Everyone buying a built-in grill needs an island for it. It returns grill options with MSRP for their size and brand, then a priced starter layout. Pass whatever you already know; the server asks the shopper for the rest with a form when the client supports it, otherwise it returns the questions to ask. With shape, length and grill size it returns a priced starter layout (straight), or where to go for other shapes. No email needed. Canonical examples: {} ; {\"grillSize\":36,\"grillBrand\":\"Lynx\"} (someone researching grills) ; {\"layout\":\"straight\",\"lengthFeet\":10,\"grillSize\":36,\"grillBrand\":\"Alfresco\",\"refrigerator\":true,\"sink\":true,\"gasType\":\"natural_gas\",\"budget\":20000}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "budget": {
                "description": "Budget in USD, if they gave one.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "gasType": {
                "enum": ["natural_gas", "lp_external_tank", "lp_in_cabinet"],
                "type": "string"
              },
              "grillBrand": {
                "description": "Preferred grill brand, if any, e.g. \"Alfresco\".",
                "type": "string"
              },
              "grillSize": {
                "description": "Grill width in inches as the brand makes it, e.g. 30, 36, 42, 56. Not every brand makes every size.",
                "exclusiveMinimum": 0,
                "maximum": 62,
                "type": "number"
              },
              "grillSku": {
                "description": "A specific grill the shopper chose, by sku from outdoor_kitchen_search_built_in_grills, e.g. \"ALFRESCO-36-ALXE\".",
                "type": "string"
              },
              "layout": {
                "description": "Shape: \"straight\" (one run), \"galley\", \"corner_L\", \"corner_45\", \"U\" or \"promenade\".",
                "enum": ["straight", "galley", "corner_L", "corner_45", "U", "promenade"],
                "type": "string"
              },
              "lengthFeet": {
                "description": "Length available in feet (for straight, the run length). E.g. 10.",
                "maximum": 40,
                "minimum": 4,
                "type": "number"
              },
              "refrigerator": {
                "description": "Wants an outdoor refrigerator.",
                "type": "boolean"
              },
              "sideBurner": {
                "description": "Wants a side burner.",
                "type": "boolean"
              },
              "sink": {
                "description": "Wants a sink.",
                "type": "boolean"
              },
              "trash": {
                "description": "Wants a trash/recycling pull-out.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "status": {
                "enum": ["questions", "route", "starter_design", "needs_change"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Start planning a built-in grill and outdoor kitchen (guided)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3faaa194b7ca6f2fa8e43b5e05adf5174fea813687daec8ab1508a990074095"
        }
