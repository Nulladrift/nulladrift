        {
          "name": "outdoor_kitchen_price_design",
          "title": "Price an outdoor kitchen (MSRP)",
          "description": "Return the MSRP for a straight outdoor kitchen (one run of cabinets): cabinets, the grill and other appliances, and countertop, with a total. Call whenever the user asks what an outdoor kitchen or BBQ island would cost. No email needed and nothing is saved. Straight only: for a Galley, Corner L, Corner 45, U-Shape or Promenade the price depends on the corner cabinets and how the runs are split, so give the straight price as a guide and send the shopper to the designer. Canonical example (10 ft straight island with a 36\" Alfresco grill): {\"width\":120,\"kitchenLayout\":\"straight\",\"color\":\"BasaltGrey\",\"countertopType\":\"GraniteAbsoluteBlack\",\"cabinets\":[{\"type\":\"GrillCabinet\",\"size\":42,\"grillBrand\":\"Alfresco\",\"grillModelId\":\"ALFRESCO-36-ALXE\"},{\"type\":\"DoubleDrawerFlex\",\"size\":24},{\"type\":\"FullDoorFlex\",\"size\":30},{\"type\":\"SinkCabinet\",\"size\":24}]}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cabinets": {
                "description": "Cabinets left to right along the one straight run.",
                "items": {
                  "properties": {
                    "grillBrand": {
                      "description": "For a GrillCabinet: the grill brand, e.g. \"Alfresco\", \"DCS\", \"AOG\".",
                      "type": "string"
                    },
                    "grillModelId": {
                      "description": "For a GrillCabinet: the grill SKU from outdoor_kitchen_search_built_in_grills, e.g. \"ALFRESCO-36-ALXE\".",
                      "type": "string"
                    },
                    "size": {
                      "description": "Cabinet width in inches, one of the sizes listed for that type (e.g. 24, 30, 36, 42).",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "type": {
                      "description": "Cabinet type exactly as returned by outdoor_kitchen_list_cabinets, e.g. \"GrillCabinet\", \"DoubleDrawerFlex\", \"FullDoorFlex\", \"SinkCabinet\", \"CTS\" (refrigerator), \"SideBurnerCabinet\", \"PowerBurnerCabinet\".",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["size", "type"],
                  "type": "object"
                },
                "minItems": 1,
