                    "enum": ["BasaltGrey", "AegeanBlue", "JetBlack", "PureWhite", "Cappuccino", "BurgundyRed", "ParisianGreen", "ProvenceSage", "BlueGreen", "MatteWhite", "MatteAnthracite", "MatteBronze"],
                    "type": "string"
                  },
                  "countertopType": {
                    "description": "Countertop. Default \"GraniteAbsoluteBlack\".",
                    "enum": ["GraniteAbsoluteBlack", "GraniteLeatheredBlack", "DektonKelya"],
                    "type": "string"
                  },
                  "kitchenLayout": {
                    "description": "Always \"straight\": these tools build one run of cabinets. For a Galley, Corner L, Corner 45, U-Shape or Promenade, open the designer with kitchenLayout set and no design.",
                    "enum": ["straight"],
