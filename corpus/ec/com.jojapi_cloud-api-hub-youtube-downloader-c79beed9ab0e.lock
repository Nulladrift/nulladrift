      },
      "instructions": "Tools are the documented endpoints of Cloud API Hub - Youtube Downloader on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/cloud-api-hub-youtube-downloader/pricing · Docs: https://jojapi.com/hub/api/cloud-api-hub-youtube-downloader",
      "tools": [
        {
          "name": "get_download",
          "title": "Googlevideo.com download links",
          "description": "**object** Grabs Youtube download links directly from Google Video server valid for 6 hours. Includes additional formats, and ready to download deciphered URL. Note that high quality videos are muted. You can use our muxer available at the `/mux` endpoint to merge audio and video. Billing per call: 2 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filter": {
                "description": "Filter formats by type: \n- `audioandvideo` / `videoandaudio` for both video & audio\n- `video` for video-only\n- `videoonly` for video without audio\n- `audio` for audio-only\n- `audioonly` for audio without video",
                "example": "audioandvideo",
                "title": "filter",
                "type": "string"
              },
              "id": {
                "example": "SAmeMF1b_jU",
                "type": "string"
              },
              "quality": {
                "description": "Video quality. Can be an itag value, a list of itag values, or :\n- `highest`\n- `lowest`\n- `highestaudio`, `lowestaudio`: low video and good audio\n- `highestvideo`, `lowestvideo`: low audio and good video\nDefaults to `highest` for both video and audio.",
                "example": "highest",
                "title": "quality",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7592d958b13b07c5c3cb89fbb255019fffc0d6c4960a69faec46c8fa1365d5b8"
        },
