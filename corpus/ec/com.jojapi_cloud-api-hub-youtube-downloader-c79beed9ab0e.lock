        {
          "name": "get_mux",
          "title": "Video/audio streams muxer",
          "description": "**object** Video & Audio Muxer which generates directly downloadable links from a Youtube video. Billing per call: 10 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audioFormat": {
                "description": "**string**\nSets the audio format for downloads (e.g., mp3, ogg, wav). Default: mp3\nThrows:\nError if the provided format is not valid.",
                "example": "mp3",
                "title": "audioFormat",
                "type": "string"
              },
              "audioOnly": {
                "description": "**boolean**\nEnables downloading only audio.",
                "example": false,
                "title": "audioOnly",
                "type": "boolean"
              },
              "codec": {
                "description": "**string**\nSets the video codec for downloads. The desired video codec (e.g., h264, vp9, av1). H264 codec is set by default.\nThrows:\nError if the provided codec is not valid.",
                "example": "h264",
                "title": "codec",
                "type": "string"
              },
              "endTime": {
                "description": "**datetime or unsigned integer**\nTrims video or audio with reference to end time. Time in [HH:mm:ss](https://www.w3.org/TR/NOTE-datetime) format or in milliseconds.",
                "title": "endTime",
                "type": "string"
              },
              "id": {
                "description": "Youtube video ID in expected format `(/^[a-zA-Z0-9-_]{11}$/)`",
                "example": "SAmeMF1b_jU",
                "title": "id",
                "type": "string"
              },
              "language": {
                "description": "**string**\nspecifies the language of audio to download when a youtube video is dubbed. \nE.g.: en / ru / cs / ja / es-US / ...",
                "example": "en",
                "title": "language",
                "type": "string"
              },
              "quality": {
                "description": "**string**\nSets the video quality for downloads. The desired video quality (e.g. 144, 240, 360, 480, 720, 1080, 1440, 2160, 4320, max). 720 quality is recommended for phones.\nThrows:\nError if the provided quality is not valid.",
                "example": "144",
                "title": "quality",
                "type": "string"
              },
              "startTime": {
                "description": "**datetime or unsigned integer**\nTrims video or audio with reference to start time. Time in [HH:mm:ss](https://www.w3.org/TR/NOTE-datetime) format or in milliseconds.",
                "title": "startTime",
                "type": "string"
              },
              "subtitleLang": {
                "type": "string"
              },
              "videoOnly": {
                "description": "**boolean**\nEnables downloading only video.",
                "example": false,
                "title": "videoOnly",
                "type": "boolean"
              },
              "watermark": {
                "description": "**array** \nAdds an image to the video. List of values:\n1. *URL\n2. position: topLeft, topRight, bottomLeft, bottomRight, center (default) or pixel coordinates in x:y format from top left corner.\n3. Scale (%widest side)\n4. Transparency between 0 and 1 (none)",
                "items": {
                  "type": "string"
                },
                "title": "watermark",
                "type": "array"
              }
            },
