                    "minLength": 1,
                    "pattern": "^[\\p{L}\\p{N}/ -]+$",
                    "type": "string"
                  },
                  "provinceCode": {
                    "pattern": "^\\d{2}$",
                    "type": "string"
                  },
                  "stair": {
                    "maxLength": 16,
                    "minLength": 1,
