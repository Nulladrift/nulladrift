                          "type": "string"
                        },
                        "provinceCode": {
                          "pattern": "^\\d{2}$",
                          "type": "string"
                        }
                      },
                      "required": ["municipalityDgcCode", "municipalityIneCode", "officialLabel", "provinceCode"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "localityId": {
                          "pattern": "^[0-9]{14}$",
                          "type": "string"
                        },
                        "localityLabel": {
                          "maxLength": 120,
                          "minLength": 1,
                          "type": "string"
                        },
                        "municipalityDgcCode": {
                          "pattern": "^\\d{1,3}$",
