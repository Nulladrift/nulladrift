        {
          "name": "resolve_building",
          "title": "Identify the building or flat to report on",
          "description": "Identifies the building from an address found with search_address (object address) or from a cadastral reference (14 characters = building or plot; 18 or 20 = a single flat). Give either cadastralReference or address, not both. status resolved returns a resolutionToken (valid 15 minutes) for create_free_report, the building's public cadastral data and whether an IEE/ITE record exists (ieeAvailability; unverified means the registry did not answer, not that there is none), which decides whether the report includes the building condition assessment. status select_unit lists the units: ask the person which flat, or repeat with the 14-character reference and scope=building for the whole building. Only non-protected cadastral data is returned. Do not publish the address or reference.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "additionalProperties": false,
                "description": "Coded address from search_address (provinceCode, municipalityDgcCode, municipalityIneCode, streetTypeCode, streetCode, number; localityId in the Basque Country; optional block, stair, floor, door). Use instead of cadastralReference.",
                "properties": {
                  "block": {
                    "maxLength": 16,
                    "minLength": 1,
                    "pattern": "^[\\p{L}\\p{N}/ .-]+$",
                    "type": "string"
                  },
