                    "type": "string"
                  },
                  "streetCode": {
                    "pattern": "^[A-Z0-9]{1,15}$",
                    "type": "string"
                  },
                  "streetTypeCode": {
                    "pattern": "^[A-Z0-9]{1,4}$",
                    "type": "string"
