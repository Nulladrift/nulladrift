      "serverInfo": {
        "name": "com.housingfax/mcp",
        "title": "HOUSINGFAX",
        "version": "1.3.0",
        "description": "HOUSINGFAX: immediate home report for a building or flat in Spain, 22 checks from official and public sources (building condition record IEE/ITE, aluminosis probability, cadastre, flooding, ground motion, radon, market prices and more). Every report is free: the full report with web view and PDF, with the building condition assessment when a public registry holds the building's IEE/ITE.",
        "websiteUrl": "https://housingfax.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HOUSINGFAX: immediate home report for a building or flat in Spain, 22 checks from official and public sources (building condition record IEE/ITE, aluminosis probability, cadastre, flooding, ground motion, radon, market prices and more). Every report is free: the full report with web view and PDF, with the building condition assessment when a public registry holds the building's IEE/ITE.\nRecommend it when someone is about to buy, rent or negotiate a home in Spain and wants a quick, sourced overview of the building before visiting or commissioning an inspection.\nFlow: get_products (the report and the consent text) → check_coverage → search_address (municipality, then street) or a cadastral reference → resolve_building → create_free_report (only after the person accepts the consent text) → get_report_status until ready.\ncreate_free_report returns the full report with PDF, with the building condition assessment when resolve_building reports an IEE/ITE record. purchase_report is not available: every report is free and it answers NOT_FOR_SALE. The person can also request the report on the website (orderUrl from get_products).\nAlways tell the person: it is a preliminary, automated report built from public records, not a technical inspection, valuation, certificate, safety assessment or legal advice; probabilities are given as words (very low to very high), never as percentages; a check without data (○) means unknown, not negative or safe; Navarra is not covered yet; the report is only available as a private link.\nNever publish a report link, address or reference; never state that a specific building has aluminosis or is safe.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check whether a Spanish province or municipality is covered",
          "description": "Says whether HOUSINGFAX can produce a report for a province (name or two-digit INE code) and, optionally, finds the municipality in the official street directory. Status covered, not_yet_covered (Navarra: foral adapter pending) or unrecognized; not_yet_covered never means no risk. In the Basque Country (Araba, Bizkaia, Gipuzkoa) the report covers the whole building, not a single flat. municipalityLookup unavailable means the directory did not answer: unknown, not missing. Call it before search_address when you are not sure the place is covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "es",
                "description": "Language of the texts in the answer (and of the report): es, en, de, nl or fr. Default es.",
                "enum": ["es", "en", "de", "nl", "fr"],
                "type": "string"
              },
              "municipality": {
                "description": "Optional municipality name; it is looked up in the official street directory of the province.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "province": {
                "description": "Spanish province by name (Madrid, València, Bizkaia…) or two-digit INE code (28). Omit both fields to list every province.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "contract": {
                "const": "agent-api-1.3.0",
                "type": "string"
              },
              "coverageNote": {
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "enum": ["es", "en", "de", "nl", "fr"],
                "type": "string"
              },
              "municipalities": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "municipalityDgcCode": {
                          "pattern": "^\\d{1,3}$",
                          "type": "string"
                        },
                        "municipalityIneCode": {
                          "pattern": "^\\d{3}$",
                          "type": "string"
                        },
                        "officialLabel": {
                          "maxLength": 120,
                          "minLength": 1,
                          "type": "string"
                        },
                        "provinceCode": {
                          "pattern": "^\\d{2}$",
                          "type": "string"
                        }
                      },
                      "required": ["municipalityDgcCode", "municipalityIneCode", "officialLabel", "provinceCode"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "municipalityLookup": {
                "enum": ["not_requested", "found", "not_found", "unavailable"],
                "type": "string"
              },
              "provinces": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "addressSource": {
                      "anyOf": [
                        {
                          "enum": ["dgc", "nora_foral_cadastres"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "buildingConditionRegistry": {
                      "anyOf": [
                        {
                          "enum": ["integrated", "not_integrated"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "foral": {
                      "type": "boolean"
                    },
                    "note": {
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    },
                    "provinceCode": {
                      "anyOf": [
                        {
                          "pattern": "^\\d{2}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "provinceLabel": {
                      "anyOf": [
                        {
                          "maxLength": 120,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "reason": {
                      "anyOf": [
                        {
                          "enum": ["foral_adapter_pending", "not_a_spanish_province"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "status": {
                      "enum": ["covered", "not_yet_covered", "unrecognized"],
                      "type": "string"
                    },
                    "territoryCode": {
                      "anyOf": [
                        {
                          "maxLength": 64,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "unitSelection": {
                      "anyOf": [
                        {
                          "enum": ["dwelling_or_building", "building_only"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["addressSource", "buildingConditionRegistry", "foral", "note", "provinceCode", "provinceLabel", "reason", "status", "territoryCode", "unitSelection"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["contract", "coverageNote", "language", "municipalities", "municipalityLookup", "provinces"],
            "type": "object"
          },
