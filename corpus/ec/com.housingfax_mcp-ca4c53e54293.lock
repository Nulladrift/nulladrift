        {
          "name": "create_free_report",
          "title": "Create the HOUSINGFAX report (private link)",
          "description": "Queues the report for the building resolved with resolve_building and returns a private link (previewUrl) and a statusToken for get_report_status. Every report is free: it is the full report with PDF, with the building condition assessment when the building has an IEE/ITE record, generated in minutes. CONSENT: before calling, show the person the consent text returned by get_products (consent.text, same language) with its terms and privacy links, and set consent=true only if the person has explicitly accepted it in this conversation; pass consent.statementSha256 as consentStatementSha256. Never accept on the person's behalf. The email is optional (ready notice with the link and the PDF) and only with the person's permission. If the answer is CHANNEL_AT_CAPACITY or CLIENT_LIMIT, wait the retryAfterSeconds it gives and try again. The link is private: give it only to the person, never publish it. Always tell the person: it is a preliminary, automated report built from public records, not a technical inspection, valuation, certificate, safety assessment or legal advice; probabilities are given as words (very low to very high), never as percentages; a check without data (○) means unknown, not negative or safe; Navarra is not covered yet; the report is only available as a private link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consent": {
                "const": true,
                "description": "true only if the person explicitly accepted the consent text from get_products.",
                "type": "boolean"
              },
              "consentStatementSha256": {
                "description": "consent.statementSha256 from get_products for the same language.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "email": {
                "description": "Optional email of the person for the ready notice with the link and the PDF, only with their permission.",
                "maxLength": 254,
                "minLength": 6,
                "pattern": "^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$",
                "type": "string"
              },
              "language": {
                "default": "es",
                "description": "Language of the report and of the texts: es, en, de, nl or fr. Default es. Must be the language of the consent text shown.",
                "enum": ["es", "en", "de", "nl", "fr"],
                "type": "string"
              },
              "resolutionToken": {
                "description": "resolutionToken returned by resolve_building (valid 15 minutes).",
                "pattern": "^[A-Za-z0-9_-]{43}$",
                "type": "string"
              }
            },
            "required": ["consent", "consentStatementSha256", "resolutionToken"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "contract": {
                "const": "agent-api-1.3.0",
                "type": "string"
              },
              "emailNotice": {
                "type": "boolean"
              },
              "jobId": {
                "pattern": "^scr_[A-Za-z0-9_-]{22}$",
                "type": "string"
              },
              "language": {
                "enum": ["es", "en", "de", "nl", "fr"],
                "type": "string"
              },
              "notice": {
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              },
              "pollAfterSeconds": {
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "previewUrl": {
                "maxLength": 400,
                "pattern": "^https:\\/\\/[^\\s]+$",
                "type": "string"
              },
              "status": {
                "const": "queued",
                "type": "string"
              },
              "statusToken": {
                "pattern": "^[A-Za-z0-9_-]{43}\\.[A-Za-z0-9_-]{43}$",
                "type": "string"
              }
            },
            "required": ["contract", "emailNotice", "jobId", "language", "notice", "pollAfterSeconds", "previewUrl", "status", "statusToken"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3ab8c417b1be72a074989d9f9f8227db09eac7c3b7aa946c1969979a640bae0"
        },
