                        },
                        "streetTypeCode": {
                          "pattern": "^[A-Z0-9]{1,4}$",
                          "type": "string"
                        },
                        "streetTypeLabel": {
                          "maxLength": 120,
                          "minLength": 1,
                          "type": "string"
