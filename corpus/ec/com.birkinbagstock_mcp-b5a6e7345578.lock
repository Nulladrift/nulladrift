      },
      "instructions": "Public read-only research on indexed Hermès listings, asking prices, dated reports, auction sources and independent directories. No purchases, payments, alerts or authentication of individual bags. Asking prices are not completed sales or guaranteed valuations. BirkinBagStock is an independent price index; some merchant links on our pages may be affiliate links.",
      "tools": [
        {
          "name": "compare_listings",
          "title": "Compare Birkin listings",
          "description": "Compare the recorded specifications and USD asking prices of two or three distinct listing IDs. Price-on-request listings may have no numeric price; the lowest recorded ask is not a quality or authenticity recommendation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "listing_ids": {
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "pattern": "^[A-Za-z0-9_-]+$",
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["listing_ids"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "cheapest_id": {
                "type": ["string", "null"]
              },
              "disclosure": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "rows": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "listing_url": {
                      "pattern": "^https://birkinbagstock\\.com/listing/[^/?]+\\?source=mcp$",
                      "type": "string"
                    },
                    "merchant": {
                      "type": "string"
                    },
                    "price": {
                      "type": ["number", "null"]
                    },
                    "price_currency": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "listing_url", "merchant"],
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              },
              "spread": {
                "type": ["number", "null"]
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["disclosure", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare Birkin listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c3db3ebe859a319b600dd28c3c15fe0e0af7a8406a82c94ec3fab44a93290e3"
        },
        {
          "name": "deals",
          "title": "Comparable asking-price deals",
          "description": "List up to 30 non-exotic Hermès listings at least 25% below their comparable USD asking-price median. Cohorts have at least eight priced listings with the same model, size and condition; leather and hardware may broaden as disclosed. Asking prices are not completed sales. Check condition, accessories, stamp and availability at the named store.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "count": {
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "disclosure": {
                "type": "string"
              },
              "results": {
                "items": {
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["count", "disclosure", "results", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Comparable asking-price deals"
          },
          "behavior": {
            "destructive": false,
