      "instructions": "Distill sells pre-computed answers to narrow factual questions to AI agents, per call, over x402 (HTTP 402 and a USDC payment on Base). Every answer carries its sources, an as_of time, a computed confidence and the method version that produced it. No account, API key or signup.\n\nAnswers come in a short summary view by default (about 3,000 tokens): the first text item is a one-line answer (also the envelope's \"headline\"), the second the JSON envelope. Pass view: \"full\" for every row. Call distill_status (free) to see how fresh each dataset is before you rely on it. This endpoint lists the most-used tools; connect to /mcp?profile=full for every tool (change feeds, comparisons, batch lookups).\n\nPaid tools follow x402 over MCP. An unpaid call to a tool with a free tier gets a free, capped answer while the day's free calls last (_meta[\"distill/free-remaining\"] says how many are left); send _meta[\"distill/free-tier\"]: \"skip\" to pay for the full answer instead. Otherwise a call without payment returns isError with the x402 PaymentRequired object as structuredContent; retry with the PaymentPayload in _meta[\"x402/payment\"]. The settlement receipt comes back in _meta[\"x402/payment-response\"]. Nothing is settled unless the answer is delivered. Every answer is the envelope: headline, data, sources, as_of, confidence, method_version, price_paid, notices, view.",
      "tools": [
        {
          "name": "distill_status",
          "title": "How fresh is each Distill dataset right now? For every dataset: the as_of and last check its answers carry, the refresh cadence, the next expected update, its current confidence and whether it is late",
          "description": "How fresh is each Distill dataset right now? For every dataset: the as_of and last check its answers carry, the refresh cadence, the next expected update, its current confidence and whether it is late. Read from live answers: each dataset’s probe route answers its example, and the status reports what that answer says. fresh: checked within its cadence; due: within one and a half cadences; stale: later; unavailable: no answer now. Free; also at /status (HTML) and /status.json. Refreshed daily (live freshness: /status). Price: free. Answers in a summary view of about 2,500 tokens; view: \"full\" for every row. Confidence: The lowest current confidence among the datasets listed (each by its own route’s formula), 0 when one is unavailable. Freshness of the data behind each route; it does not check any single answer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "view": {
                "description": "summary (the default): the answer a model needs, budgeted; full: every row (a free answer stays capped).",
                "enum": ["summary", "full"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How fresh is each Distill dataset right now? For every dataset: the as_of and last check its answers carry, the refresh cadence, the next expected update, its current confidence and whether it is late"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "distill/example": {},
            "distill/route": "distill.status"
          },
          "digest": "sha256:6b51e7d84f858b48893c7ab61117ebf992236dca5c5aeb84652a5e134d16fa64"
        },
        {
          "name": "drug_nadac",
          "title": "What do US pharmacies pay for this drug? CMS’s National Average Drug Acquisition Cost (NADAC) per unit for an NDC, the generic’s NADAC for a brand and the weekly price history since January 2025, from CMS’s NADAC files on data.medicaid.gov",
          "description": "What do US pharmacies pay for this drug? CMS’s National Average Drug Acquisition Cost (NADAC) per unit for an NDC, the generic’s NADAC for a brand and the weekly price history since January 2025, from CMS’s NADAC files on data.medicaid.gov. From CMS’s weekly NADAC files on data.medicaid.gov (2025 on): the current per-unit NADAC of one NDC, its effective date and explanation codes, the corresponding generic’s NADAC for a brand, the range over NDCs with the same description, and every price period since January 2025. An NDC never listed answers 404 and is not charged; one no longer listed answers with listed: false and its last NADAC. Refreshed weekly (live freshness: /status). Price: $0.01 per call. Free tier: 3 free calls a day per IP, at most 3 rows per answer, taken by an unpaid call unless its _meta[\"distill/free-tier\"] is \"skip\". Answers in a summary view of about 3,000 tokens; view: \"full\" for every row. Confidence: Freshness only (the values are CMS’s, read deterministically): 1 until 9 days after the latest weekly file’s as-of date, then halving every 14 days. National Average Drug Acquisition Cost as CMS publishes it weekly: a survey average of what retail pharmacies pay per unit, not a retail price, a reimbursement rate, a quote or medical advice. See /terms.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ndc": {
                "description": "The NDC: 11 digits (00378410591) or dashed (0378-4105-91, 5-4-2, 5-3-2 or 4-4-2).",
                "pattern": "^(\\d{11}|\\d{4,5}-\\d{3,4}-\\d{1,2})$",
                "type": "string"
              },
              "view": {
                "description": "summary (the default): the answer a model needs, budgeted; full: every row (a free answer stays capped).",
                "enum": ["summary", "full"],
                "type": "string"
              }
            },
            "required": ["ndc"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What do US pharmacies pay for this drug? CMS’s National Average Drug Acquisition Cost (NADAC) per unit for an NDC, the generic’s NADAC for a brand and the weekly price history since January 2025, from CMS’s NADAC files on data.medicaid.gov"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "distill/example": {
              "ndc": "00378410591"
            },
            "distill/route": "drug.nadac"
          },
          "digest": "sha256:cc0e888d7799ff3c84b779cc2e405d94f1579b3ba0b47033d455baedc5961bd0"
        },
        {
          "name": "drug_nadac_search",
          "title": "Which NDCs match this drug name, and what do pharmacies pay for them? NADAC search by name (e.g. “atorvastatin 40”) with NDC counts and current per-unit cost ranges, from CMS’s weekly NADAC file",
          "description": "Which NDCs match this drug name, and what do pharmacies pay for them? NADAC search by name (e.g. “atorvastatin 40”) with NDC counts and current per-unit cost ranges, from CMS’s weekly NADAC file. Matches the words of a name (each as a prefix, e.g. \"atorvastatin 40\") against the NDC descriptions in the latest weekly NADAC file, best match first, and gives each description’s pricing unit, classification, number of NDCs, current per-unit NADAC range and up to five NDCs to look up with drug.nadac. Refreshed weekly (live freshness: /status). Price: $0.01 per call. Free tier: 3 free calls a day per IP, at most 3 rows per answer, taken by an unpaid call unless its _meta[\"distill/free-tier\"] is \"skip\". Answers in a summary view of about 3,000 tokens; view: \"full\" for every row. Confidence: Freshness only (the values are CMS’s, read deterministically): 1 until 9 days after the latest weekly file’s as-of date, then halving every 14 days. National Average Drug Acquisition Cost as CMS publishes it weekly: a survey average of what retail pharmacies pay per unit, not a retail price, a reimbursement rate, a quote or medical advice. See /terms.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "At most this many descriptions (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Drug name words, e.g. \"atorvastatin 40\" or \"insulin glargine\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "view": {
                "description": "summary (the default): the answer a model needs, budgeted; full: every row (a free answer stays capped).",
                "enum": ["summary", "full"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which NDCs match this drug name, and what do pharmacies pay for them? NADAC search by name (e.g. “atorvastatin 40”) with NDC counts and current per-unit cost ranges, from CMS’s weekly NADAC file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "distill/example": {
              "name": "atorvastatin 40"
