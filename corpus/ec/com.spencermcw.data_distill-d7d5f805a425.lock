        {
          "name": "hospital_prices",
          "title": "What does a procedure cost at hospitals near this ZIP? Cash price, gross charge and every insurer’s negotiated rate for a CPT, HCPCS or MS-DRG code at Colorado hospitals, normalized by Distill from the hospitals’ federally required price files",
          "description": "What does a procedure cost at hospitals near this ZIP? Cash price, gross charge and every insurer’s negotiated rate for a CPT, HCPCS or MS-DRG code at Colorado hospitals, normalized by Distill from the hospitals’ federally required price files. From the machine-readable standard-charge files hospitals must publish (45 CFR 180), parsed and normalized: for each hospital within the radius that posts the code, nearest first, the gross charge, the discounted cash price, the de-identified minimum and maximum, and every payer and plan’s negotiated dollar amount or percentage (with the v3.0 median, 10th and 90th percentile allowed amounts), payers canonicalized to a stable payer_id. Filters: payer, plan type, plan name text, setting, billing class. A summary gives nearest-rank statistics over the hospitals returned. Served states: Colorado. An area with no hospital posting the code answers 404 and is not charged. Refreshed monthly (live freshness: /status). Price: $0.02 per call. Free tier: 3 free calls a day per IP, at most 3 rows per answer, taken by an unpaid call unless its _meta[\"distill/free-tier\"] is \"skip\". Answers in a summary view of about 3,000 tokens; view: \"full\" for every row. Confidence: Mean over the returned rows (each rate; an item with no rate counts once) of normalize × quality × freshness. Normalize: the stored per-rate normalize confidence (payer canonicalization: rule 1, model 0.9, fallback 0.6; rate basis for rates with no dollar amount: rule 1, model 0.9, fallback 0.75; 1 for an item with no rate). Quality of the MRF: 1 valid against the v3.0 schema, 0.85 parsed with conformance errors, 0.7 parsed only after header repair. Freshness: 1 while the MRF’s last_updated_on is at most 365 days old, then halving every 180 days (0.5 with no date), times 1 within 14 days of our fetch, then halving every 30 days. Posted standard charges from hospital machine-readable files (45 CFR 180): posted rates, not a quote; not medical or financial advice. What you pay depends on your plan, your care and the hospital. See /terms.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "billing_class": {
                "description": "Optional: facility or professional (items posted for both always match).",
                "enum": ["facility", "professional"],
                "type": "string"
              },
              "code": {
                "description": "The billing code: CPT (5 characters, e.g. 99213), HCPCS Level II (a letter and 4 digits, e.g. J1885) or MS-DRG (3 digits, e.g. 470).",
                "pattern": "^[0-9A-Za-z]{3,5}$",
                "type": "string"
              },
              "code_type": {
                "description": "Optional: the code type. Inferred from the code’s shape when omitted.",
                "enum": ["CPT", "HCPCS", "MS-DRG"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the point (with lon).",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "How many hospitals to return, nearest first (default 10, at most 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude of the point (with lat).",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "payer": {
                "description": "Optional: a canonical payer_id (e.g. aetna, cigna, unitedhealthcare, anthem, medicare, medicaid). hospital.payers lists the payers with prices for a code.",
                "pattern": "^[a-z0-9_]{2,40}$",
                "type": "string"
              },
              "plan": {
                "description": "Optional: text the plan name (or payer name) contains as the hospital writes it, case-insensitive, e.g. \"PPO\" or \"Medicare Advantage\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "plan_type": {
                "description": "Optional: the canonical plan type.",
                "enum": ["commercial", "medicare_advantage", "medicaid", "medicare", "exchange", "tricare", "va", "workers_comp", "auto", "supplemental", "other", "unspecified"],
                "type": "string"
              },
              "radius_miles": {
                "description": "Search radius in miles (default 25, at most 100).",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "setting": {
                "description": "Optional: inpatient or outpatient (items posted for both always match).",
                "enum": ["inpatient", "outpatient"],
                "type": "string"
              },
              "view": {
                "description": "summary (the default): the answer a model needs, budgeted; full: every row (a free answer stays capped).",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "zip": {
                "description": "A 5-digit ZIP code (its Census ZCTA point). Give a zip, or lat and lon.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What does a procedure cost at hospitals near this ZIP? Cash price, gross charge and every insurer’s negotiated rate for a CPT, HCPCS or MS-DRG code at Colorado hospitals, normalized by Distill from the hospitals’ federally required price files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "distill/example": {
              "code": "A4550",
              "limit": 1,
              "payer": "medicare",
              "radius_miles": 10,
              "zip": "81052"
            },
            "distill/route": "hospital.prices"
          },
          "digest": "sha256:6bf16651eb5b6c822054852f90564384be8136fe5082fd486efdc77bbdc9b2fe"
        },
        {
          "name": "medicare_partd_coverage",
          "title": "Which Medicare Part D plans in this county cover this drug, at what tier and cost? Every PDP and Medicare Advantage drug plan with tier, prior authorization, step therapy, quantity limit, premium and copay, plan years 2026 and 2027, computed by Distill from CMS’s monthly formulary files",
          "description": "Which Medicare Part D plans in this county cover this drug, at what tier and cost? Every PDP and Medicare Advantage drug plan with tier, prior authorization, step therapy, quantity limit, premium and copay, plan years 2026 and 2027, computed by Distill from CMS’s monthly formulary files. From CMS’s monthly Part D formulary public use file: every stand-alone (PDP) and Medicare Advantage drug plan sold in the county (by SSA county code, or state and county name), whether its formulary covers the drug (RxCUI, or the NDC the file lists), and on what terms: tier, prior authorization, step therapy, quantity limit, negotiated-drug flag, the plan’s premium and deductible, and the 30-day initial-coverage cost sharing for that tier at each pharmacy type. Covering plans come lowest tier first, then lowest premium. Pass plan_year=2027 for open enrollment. Employer and PACE plans are not in the file. Refreshed monthly (live freshness: /status). Price: $0.02 per call. Free tier: 3 free calls a day per IP, at most 3 rows per answer, taken by an unpaid call unless its _meta[\"distill/free-tier\"] is \"skip\". Answers in a summary view of about 3,000 tokens; view: \"full\" for every row. Confidence: Freshness only (the plans and terms are read from the CMS file deterministically): 1 until 45 days after the served file’s date (CMS posts one a month), then halving every 30 days. Medicare Part D formulary and plan data as of the CMS public use file’s date (file_date), processed by Distill; the Medicare Plan Finder (medicare.gov/plan-compare) may have newer information. Not enrollment, coverage or medical advice; confirm with the plan. See /terms.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "County name, with state, e.g. Denver.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "county_code": {
                "description": "The SSA state-county code, e.g. 06150 (Denver, CO).",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "kind": {
                "description": "pdp, ma or all (default).",
                "enum": ["pdp", "ma", "all"],
                "type": "string"
              },
              "limit": {
                "description": "At most this many plans (default 20).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "ndc": {
                "description": "An 11-digit NDC as the formulary file lists it (one per RxCUI); prefer rxcui.",
                "pattern": "^\\d{11}$",
                "type": "string"
              },
              "plan_year": {
                "description": "The plan (benefit) year, e.g. 2027 for open enrollment (default: the current year).",
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              },
              "rxcui": {
                "description": "The drug’s RxNorm concept id (RxCUI), e.g. 617311 for atorvastatin 40 mg oral tablet.",
                "pattern": "^\\d{1,10}$",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code, with county.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "view": {
                "description": "summary (the default): the answer a model needs, budgeted; full: every row (a free answer stays capped).",
                "enum": ["summary", "full"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which Medicare Part D plans in this county cover this drug, at what tier and cost? Every PDP and Medicare Advantage drug plan with tier, prior authorization, step therapy, quantity limit, premium and copay, plan years 2026 and 2027, computed by Distill from CMS’s monthly formulary files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "distill/example": {
              "county": "Denver",
              "limit": 2,
              "plan_year": 2027,
              "rxcui": "617311",
              "state": "CO"
            },
            "distill/route": "medicare.partd_coverage"
          },
          "digest": "sha256:529b57dc66aa596546f26e6a8e3f72bae5cf9721e32cba2fec03a66ac35f3639"
