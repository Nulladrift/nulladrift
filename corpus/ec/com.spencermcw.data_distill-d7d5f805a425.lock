        {
          "name": "medicare_pfs_rate",
          "title": "What does Medicare pay for this CPT or HCPCS code at this ZIP? Physician Fee Schedule facility and non-facility allowed amounts with the RVUs and GPCIs behind them, any US ZIP or Medicare locality, 2025 on, computed by Distill from CMS’s quarterly RVU files",
          "description": "What does Medicare pay for this CPT or HCPCS code at this ZIP? Physician Fee Schedule facility and non-facility allowed amounts with the RVUs and GPCIs behind them, any US ZIP or Medicare locality, 2025 on, computed by Distill from CMS’s quarterly RVU files. From CMS’s quarterly relative value files (RVU25A on): the facility and non-facility allowed amounts for one code (and modifier) in the locality of a ZIP, ZIP+4 or MAC-locality id, with the RVUs, GPCIs and conversion factor (non-QP and QP) behind them, the OPPS cap, the limiting charge, the payment indicators and the same amounts in every release since 2025A. Pass exactly one of zip or locality. Codes CMS does not price (status other than A, R, T) answer with null amounts; unknown codes and ZIPs answer 404 and are not charged. Refreshed quarterly (live freshness: /status). Price: $0.01 per call. Free tier: 3 free calls a day per IP, at most 3 rows per answer, taken by an unpaid call unless its _meta[\"distill/free-tier\"] is \"skip\". Answers in a summary view of about 3,000 tokens; view: \"full\" for every row. Confidence: agreement × freshness. Agreement: for a 5-digit ZIP that CMS splits across localities by ZIP+4, the share of its ZIP+4 codes in the answered locality; 1 for a ZIP+4, a locality or a ZIP in one locality. Freshness: 1 until the first day of the calendar quarter after the CMS files were last checked, then halving every 30 days. The amounts themselves are exact (they agree with CMS’s carrier payment files to the cent). Medicare Physician Fee Schedule amounts computed from CMS’s published RVU, GPCI and conversion-factor files: what Original Medicare allows a participating clinician (before deductible and coinsurance), not what another payer pays; not a quote, not medical, billing or coding advice. See /terms. CPT® codes are served as codes only: their descriptors are AMA copyright and are never included (nor dental CDT descriptors). CPT is a registered trademark of the American Medical Association. HCPCS Level II descriptions are CMS’s.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The HCPCS Level II or CPT code, e.g. 99213, 70551 or G0439.",
                "pattern": "^[0-9A-Za-z]{5}$",
                "type": "string"
              },
              "date": {
                "description": "The date of service, YYYY-MM-DD (default: today, UTC): picks the release in force.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "locality": {
                "description": "A Medicare locality as MAC-locality, e.g. 04112-01 (Colorado).",
                "pattern": "^\\d{5}-\\d{2}$",
                "type": "string"
              },
              "modifier": {
                "description": "Optional modifier with its own RVUs: 26 (professional component), TC (technical component) or 53. Omit for the global service.",
                "pattern": "^[0-9A-Za-z]{2}$",
                "type": "string"
              },
              "release": {
                "description": "A quarterly release instead of a date, e.g. 2026D (A from 1 Jan, B Apr, C Jul, D Oct).",
                "pattern": "^\\d{4}[A-Da-d]$",
                "type": "string"
              },
              "setting": {
                "description": "Only this setting’s amount (default: both).",
                "enum": ["facility", "nonfacility"],
                "type": "string"
              },
              "view": {
                "description": "summary (the default): the answer a model needs, budgeted; full: every row (a free answer stays capped).",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "zip": {
                "description": "A 5-digit ZIP or ZIP+4 (80218 or 80218-1234).",
                "pattern": "^\\d{5}(-?\\d{4})?$",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What does Medicare pay for this CPT or HCPCS code at this ZIP? Physician Fee Schedule facility and non-facility allowed amounts with the RVUs and GPCIs behind them, any US ZIP or Medicare locality, 2025 on, computed by Distill from CMS’s quarterly RVU files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "distill/example": {
              "code": "99213",
              "zip": "80218"
            },
            "distill/route": "medicare.pfs_rate"
          },
          "digest": "sha256:69e646dac1fef7c17854e6658c1253288c528699edd54210cb0532e00effd113"
