          "digest": "sha256:7bedc5b4be2c543546799e37d55a926904bdd9750a071c0aa2d69cdf5d6ba955"
        },
        {
          "name": "get_firm",
          "title": "Get firm profile",
          "description": "Get the full profile for an investment adviser FIRM by CRD number:\nidentity, address, website, AUM band, total employees, how they charge\n(a list), any disclosure flag, state registrations (a list of\n{state, date}, date YYYY-MM-DD or null), office locations (private\nresidences are not listed: their count is in\n`private_residence_locations_withheld`, addresses withheld per SEC\nprivacy rules), prior/other names, fee details from their ADV Part 2A\nbrochure (marked as estimated when it is, and basis \"not extracted\" when\nno fee details were extracted), and `advisor_count`: how many\ninvestment adviser representatives we have on file for them\n(broker-dealer-only registrations are not counted; an empty roster does\nnot necessarily mean an empty firm — see the caveat when that happens).\nClient types are withheld (see client_types_note).\nState-registered-only firms get a reduced profile.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crd": {
                "type": "string"
              }
            },
            "required": ["crd"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get firm profile"
          },
          "behavior": {
            "destructive": false,
