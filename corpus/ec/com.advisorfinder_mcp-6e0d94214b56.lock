        {
          "name": "get_advisor",
          "title": "Get advisor profile",
          "description": "Get the full profile for an investment adviser representative (IAR) by\nCRD number — no need to search first if you already have it. Returns\nemployment history (current firm first, then previous), exams passed,\nthe states where they hold an investment-adviser registration\n(`advisory_states`; broker-dealer state registrations are reported\nseparately as a labeled count in `also_registered_as_broker`, because\nselling securities is not the same as giving investment advice),\nprofessional designations (always labeled\nself-reported — none of this data is independently verified), years in\nthe industry, and four-state disclosure status (never phrased as\n\"clean\"/\"safe\": none_reported / disclosed_no_detail / disclosed_with_detail\n/ unknown). Data is derived from SEC IAPD / FINRA BrokerCheck. All dates\nare YYYY-MM-DD. For an advisor who is also listed on AdvisorFinder,\n`advisorfinder_listing.self_reported` carries the credentials and years\nof experience from that profile, labeled as such. Each designation has a\n`source` (e.g. \"Form ADV Part 2B brochure supplement\"). When no\ndesignations are on file but the profile lists some,\n`designations_coverage_note` explains that the public data covers few\nadvisors; when both lists are present and not the same,\n`credential_sources_note` says so. Neither note is a finding against the\nadvisor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crd": {
                "type": "string"
              }
            },
            "required": ["crd"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get advisor profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
