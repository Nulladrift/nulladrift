          "digest": "sha256:2df9a8f6e960df3b06dae48b59280a0a9ad0de70c3499b989619f903b7cb8ecf"
        },
        {
          "name": "get_database_stats",
          "title": "Get database stats",
          "description": "Overall stats about our data: how many firms and advisors we cover,\nwhen each data source was last refreshed (vintages), and a full\nfour-state disclosure tally — INCLUDING the 'unknown' bucket (advisors\nwhere we simply don't have disclosure detail on file; that is not the\nsame as a clean record). Also states coverage scope explicitly: we do\nnot claim to cover the whole US advisor population, only SEC-registered\nfirms and their active reps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
