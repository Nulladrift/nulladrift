        },
        {
          "name": "search_firms",
          "title": "Search firms",
          "description": "Search SEC- and state-registered investment adviser FIRMS by name\nand/or state. Matches on the firm's primary name, legal name, or any\n\"also known as\" prior name on file. Returns, per match: CRD, name, city/\nstate, AUM band, `advisor_count` (the number of investment adviser\nrepresentatives on file for the firm in our data — broker-dealer-only\nregistrations are not counted; null for state-registered-only firms,\nwhich have no roster), and a link to the firm's SEC IAPD record.\nState-registered-only firms (not SEC-registered) are included but\nflagged — purely state-registered firms have no advisor rosters at all;\nstate-listed firms showing rosters are dual-registered. Exact name matches\nrank first (the firm's own name, then an \"also known as\" name), then names\nthat start with the search text (own names before \"also known as\" names),\nthen other matches. Inside each group, firms with a larger SEC AUM band\ncome first, then firms with more advisors on file (a state-registered-\nonly firm ranks as an undisclosed band with no advisors). A result can\ncarry `advisor_count_note` (no advisor records on file) or `unreadable_characters_note` (characters\nlost in the source data, shown as �). `total_matches` is the number\nof firms that match the filters. Counting stops at 10,000:\n`total_matches_capped: true` means more than 10,000 firms matched.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "type": "integer"
              },
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
