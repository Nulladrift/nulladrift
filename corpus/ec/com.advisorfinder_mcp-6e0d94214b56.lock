      "tools": [
        {
          "name": "check_advisor",
          "title": "Check an advisor",
          "description": "Quick yes/no-style verification of an advisor: is their registration\nactive, which states they hold an investment-adviser registration in\n(`advisory_states`, with any broker-dealer state registrations reported\nseparately as a labeled count in `also_registered_as_broker`), how long\nthey have been in the industry, and their four-state disclosure status.\nAccepts EITHER a CRD number (all digits) OR a name — optionally narrowed\nby firm/state to disambiguate common names. If a name matches more than\none advisor, returns the candidates with their CRD numbers instead of\nguessing.\nThis tool never returns a numeric risk score — only the underlying facts\n(registration status, disclosure status) so you can judge for yourself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "firm": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "name_or_crd": {
                "type": "string"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["name_or_crd"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an advisor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:a6e48f6629328955349b9c4ba46c9d4d9841f6639f277acd4a1c85918ee64441"
        },
        {
          "name": "find_bookable_advisors",
          "title": "Find bookable advisors",
          "description": "Search advisors listed on AdvisorFinder's marketplace — professionals\nwith public profiles you can view and contact directly. This searches\nonly AdvisorFinder members (a few hundred advisors), not the full\nSEC roster.\n\nAll filters are optional — browsing with none of them is fine, since this\ntool's scope is already narrow. `specialty` matches against the advisor's\nbio, client description, \"in their own words\" answers, and credential\nacronyms and names (case-insensitive substring; e.g. \"CFP\" finds CFP®\nholders). Returns, per member: their self-provided profile info (bio;\n`credentials` as [{acronym, name, status: \"self-reported\"}]; `education`\nas [{institution, degree, year}]; `pricing` as a list of {type, ...}\nentries such as {\"type\": \"aum\", \"min\": \"0.50\", \"max\": \"1.00\", \"unit\":\n\"percent of assets\"}, {\"type\": \"flat_fee\", \"min\", \"max\", \"frequency\"},\n{\"type\": \"hourly\", \"rate\"}, {\"type\": \"one_time\", \"cost\"} or\n{\"type\": \"fees_information\", \"link\"}, with values as listed on the\nprofile and formatting normalized (type/frequency lowercased, a trailing\n\"%\" removed, unset markers dropped; the \"percent of assets\" unit only\nwhen the listed values are plain numbers); minimum account size; allowed\nstates; `member_since` as YYYY-MM-DD; and more), a link to their full\nAdvisorFinder profile, AND regulatory facts for their CRD.\n`allowed_states` and `virtual_meetings_offered` are null when the member\ndid not fill them in: null means not stated on the profile, not \"none\".\nMembers whose CRD is in our SEC dataset get their registration status\nand four-state disclosure status (none_reported / disclosed_no_detail /\ndisclosed_with_detail / unknown) from that dataset — never softened.\nMembers whose CRD is NOT in our SEC dataset (typically state-registered\nor BD-side advisors) get the status `not_in_regulatory_dataset` with a\nlabeled note saying so and FINRA BrokerCheck / SEC IAPD verify links —\nnever presented as if clean. AUM and client-count figures are\nself-reported by the advisor, not regulatory data, and are always\nlabeled as such. Results are in alphabetical order by name; membership\nor payment has no effect on the order. `total_matches` is the number of\nmembers that match the filters. Being listed here is a business\nrelationship with AdvisorFinder, not an endorsement, and never affects\nhow any advisor ranks in search results. The marketplace listings can be\ntemporarily unavailable; in that case this tool returns\n`available: false` with no results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "limit": {
                "default": 20,
                "type": "integer"
              },
              "specialty": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find bookable advisors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
