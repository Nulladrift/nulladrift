        {
          "name": "search_advisors",
          "title": "Search advisors",
          "description": "Search SEC-registered investment adviser representatives (IARs) by\nname, firm, city, and/or state. No CRD number needed. At least one of\nname/firm/city/state is required — e.g. browse by city+state alone, or\nsearch by name.\n\nReturns, per match: CRD, name, the firm(s) they're linked to (with branch\ncity/state), a four-state disclosure status (none_reported /\ndisclosed_no_detail / disclosed_with_detail / unknown — never \"clean\"),\nand a link to the advisor's full SEC IAPD record. Data is derived from SEC\nIAPD / FINRA BrokerCheck registration feeds, not real-time. Exact name\nmatches rank first. `total_matches` is the number of advisors that match\nthe filters; `more_results_available` appears when more advisors match\nthan the limit returns. Counting stops at 10,000: `total_matches_capped:\ntrue` means more than 10,000 advisors matched.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "firm": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "limit": {
                "default": 20,
                "type": "integer"
              },
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search advisors"
