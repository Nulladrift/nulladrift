      },
      "transport": {
        "type": "http",
        "url": "https://api.youraitools.co/payguard/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "payguard",
        "title": "PayGuard",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "screen_address reports whether a crypto address appears in the OFAC SDN list of digital currency addresses. Informational screening, not legal advice.",
      "tools": [
        {
          "name": "screen_address",
          "title": "OFAC SDN screen of a crypto address",
          "description": "Checks one crypto address against the US Treasury OFAC SDN list of sanctioned digital currency addresses (refreshed daily). For 2 or more addresses use screen_batch (up to 50 per call, counts as one call). Accepts any chain (BTC, ETH and EVM chains, TRX, SOL, LTC, XMR, BCH, XRP, ZEC and more). Free: 30 calls/day per IP with full results (max 10/min; invalid input is not counted); after that the tool returns an error with the x402 pay URL ($0.001 USDC on Base, Polygon, Arbitrum One or Solana per call at https://api.youraitools.co/payguard/v1/address) or prepaid credits. Returns sanctioned (true/false), match_count, matches[] (entity, entity_type, programs, list_date, listed_currency), address (normalized), chain {guess, format, candidates, checksum_valid}, list_updated_at and free_tier usage. Read-only; informational screening, not legal advice.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "One blockchain address, e.g. \"0x8589427373D6D84E98730D7795D8f6f8731FDA16\" or \"bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh\": 20-140 letters/digits, optional URI prefix such as \"ethereum:\" or \"bitcoincash:\" (stripped); EVM hex and bech32 match case-insensitively, base58 exactly. The chain is detected automatically. Any chain is accepted; the SDN list covers Bitcoin, Ethereum and other EVM chains (Base, Arbitrum, BNB Chain, Polygon...), Tron, Solana, Litecoin, Monero, Bitcoin Cash/SV/Gold, Dash, Dogecoin, Ethereum Classic, XRP, Verge, Zcash and USDT/USDC addresses.",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1cdbd63e4e845898a1f8aee911cb2fc0e1d0c8927f3f350013b1cb4d68490dd"
        },
        {
          "name": "screen_batch",
          "title": "OFAC SDN screen of up to 50 crypto addresses",
          "description": "Checks 1-50 crypto addresses against the US Treasury OFAC SDN list in one call (counts as one call). Use it instead of repeated screen_address calls whenever you have several addresses (payee lists, counterparties, transaction inputs/outputs); use screen_address for a single one. Mixed chains allowed; one invalid entry rejects the whole call. Free: 30 calls/day per IP with full results (max 10/min; invalid input is not counted); after that the tool returns an error with the x402 pay URL ($0.01 USDC on Base, Polygon, Arbitrum One or Solana per call at https://api.youraitools.co/payguard/v1/batch) or prepaid credits. Returns count, sanctioned_count, any_sanctioned, list_updated_at and results[] in input order, each {input, address, sanctioned, match_count, matches[], chain}. Read-only; informational screening, not legal advice.",
          "inputSchema": {
            "properties": {
              "addresses": {
                "description": "1-50 blockchain addresses, one string per element, e.g. [\"0x8589427373D6D84E98730D7795D8f6f8731FDA16\", \"bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh\"]. Each: 20-140 letters/digits, optional URI prefix such as \"ethereum:\" or \"bitcoincash:\" (stripped); EVM hex and bech32 match case-insensitively, base58 exactly. Chains may be mixed (detected per address). Any chain is accepted; the SDN list covers Bitcoin, Ethereum and other EVM chains (Base, Arbitrum, BNB Chain, Polygon...), Tron, Solana, Litecoin, Monero, Bitcoin Cash/SV/Gold, Dash, Dogecoin, Ethereum Classic, XRP, Verge, Zcash and USDT/USDC addresses. More than 50 entries or any malformed one returns a bad_request error.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["addresses"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a95b84a62bd0d2408e0ac417b5f2ef19912aa370105a64807cabb5024651bf7a"
        }
      ],
      "digest": "sha256:cd60ecce3fa5c021d235893c52bbfe947f983878499795047b90730545473276"
    }
  }
}
