{
  "lockfileVersion": 2,
  "subjects": {
    "com.filtrous/mcp-catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://filtrous-mcp-catalog.filtrous.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "filtrous-mcp-catalog",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_price_and_lead_time",
          "description": "Get current price, availability, and (when permitted) stock for a SKU. KEYED tool — requires a valid API key. Tier pricing and lead time are placeholders until the Acumatica sync ships.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "sku": {
                "description": "The exact product SKU.",
                "type": "string"
              }
            },
            "required": ["sku"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get price and lead time"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:108aecd954a603a08abb88809fe4ccf4ceed926d525caed720b3090cb685019d"
        },
        {
          "name": "get_product_details",
          "description": "Get full details for one product by its handle: variants, SKUs, options, prices, images, and spec metafields. Open tool — no API key required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "handle": {
                "description": "The product handle (slug), e.g. from search_products.",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0bce54f7ea343b8713faf8103a08679ea3d497a25cdbc9259c408ce5fcd34c00"
        },
        {
          "name": "request_quote",
          "description": "Submit a quote request for one or more SKUs with buyer contact info. KEYED tool — requires a valid API key. Sales follows up out-of-band.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contact": {
                "additionalProperties": false,
                "properties": {
                  "company": {
                    "description": "Company name.",
                    "type": "string"
                  },
                  "email": {
                    "description": "Requester email.",
                    "type": "string"
                  },
                  "name": {
                    "description": "Requester name.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "phone": {
                    "description": "Phone number.",
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "items": {
                "description": "Line items to quote.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "quantity": {
                      "description": "Units requested.",
                      "exclusiveMinimum": 0,
                      "maximum": 100000,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "Product SKU.",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "sku"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "description": "Free-text context / use case.",
                "type": "string"
              }
            },
            "required": ["contact", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:150241f9771ac5f9a03038dd11f24d762586ada85b5439681979086e43481eb6"
        },
        {
          "name": "search_products",
          "description": "Search the Filtrous catalog by free text and/or spec terms (e.g. '0.22 micron PES syringe filter'). Returns matching products with title, handle, SKU, product_type, tags, price, and availability. Open tool — no API key required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text and/or spec search. Field filters like 'product_type:...' or 'tag:...' are also honored.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:97f76cc7733b1fc1d0e27b078d45f4631dff9bc21bd9e1a2c5f962fc381144d2"
        }
      ],
      "digest": "sha256:b9ac187af451a513a59f27e0b6861a96b37880a221fe2963e58e413f5114895f"
    }
  }
}
