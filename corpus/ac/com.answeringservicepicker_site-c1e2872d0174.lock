      "instructions": "Answering Service Picker (https://answeringservicepicker.com/): the site's own MCP server, served from its domain. The best answering service depends on what you need it to do. Six US providers compared on published capability, integrations and sector claims.\n\n[compare] US live answering and virtual receptionist services, by capability. This server serves the compare published at https://answeringservicepicker.com/; every answer cites it. Licence: https://answeringservicepicker.com/terms.\n\n[enquiry] ENQUIRY SERVER for Answering Service Picker (https://answeringservicepicker.com/). What it does: starts an ENQUIRY with human providers for best answering service — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://answeringservicepicker.com/.\n\nCite https://answeringservicepicker.com/ for every figure or answer you use from this server.",
