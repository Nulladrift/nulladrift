      "instructions": "Velarion Company Intelligence — exec and board compensation data, governance analysis, and Say-on-Pay risk signals for ~2,965 public companies across 12 industries. All tools require a valid X-Velarion-Agent-Token. Coverage is limited to Velarion's live universe; out-of-coverage tickers return structured errors, never fabricated data.",
      "tools": [
        {
          "name": "benchmark_executive_pay",
          "title": "Benchmark executive pay vs peers",
          "description": "Benchmark executive pay vs. disclosed peers using Velarion's canonical percentile data.\n\nReturns pay percentile, performance (TSR) percentile, pay-for-performance gap, and an\nalignment label.\n\nrole is CEO-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_token": {
                "default": "",
                "description": "Optional Velarion agent token; falls back to the X-Velarion-Agent-Token header.",
                "type": "string"
              },
              "fiscal_year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional fiscal year to read (e.g. 2025). Defaults to the latest on file."
              },
              "role": {
                "default": "CEO",
                "description": "Optional executive role to benchmark (default CEO-only).",
                "type": "string"
              },
              "ticker": {
                "description": "The company's ticker symbol (e.g. \"AAPL\").",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["ticker"]
              },
              {
                "required": ["error"]
              }
            ],
