        {
          "name": "generate_governance_alpha_card",
          "title": "Generate a governance alpha card",
          "description": "Generate a Governance Alpha Card for a company.\n\nComposite deterministic card: pay alignment (Velarion's own P4P-style estimate, modeled\non public peer-advisory methodology concepts — not licensed ISS data), governance scorecard, SoP risk band,\npeer quality, top risks/strengths. Requires the company to be in Velarion's coverage\nuniverse with current-period data.\n\nThis tool was built as the free sample of the GOVERNANCE-ALPHA-CARD product. The owner\nkilled that product (chat, 2026-09-24, verbatim \"kill 15 through 41 … keep those 3\";\ndocs/orders/ORDER_20260924_NON_AD7_KILL.md), so there is no longer a paid card to sample\nand no purchase path to offer. THE FREE TOOL STAYS (the order keeps every free page and\nfree tool; only the buy option goes). Each agent may draw a limited number of cards per\nUTC day; beyond that the tool returns free_tier_cap_reached and nothing to buy.\n\nStructured errors returned (not raised) for:\n- not_in_coverage: ticker outside the covered universe\n- not_deliverable: the company's current-period disclosure does not support a card\n- free_tier_cap_reached: daily free allowance spent (wait for 00:00 UTC)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_token": {
                "default": "",
                "description": "Optional Velarion agent token; falls back to the X-Velarion-Agent-Token header.",
                "type": "string"
              },
              "ticker": {
                "description": "The company's ticker symbol (e.g. \"AAPL\").",
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional fiscal year to read (e.g. 2025). Defaults to the latest on file."
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["ticker"]
              },
              {
                "required": ["error"]
              },
              {
                "required": ["status"]
              }
