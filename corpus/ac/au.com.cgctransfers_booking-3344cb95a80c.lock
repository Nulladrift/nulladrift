{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.cgctransfers/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cgctransfers.com.au/wp-json/cgc-gateway/v1/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "au.com.cgctransfers/booking",
        "title": "CGC Airport Transfers",
        "version": "1.3.12",
        "websiteUrl": "https://cgctransfers.com.au/ai-agent-gateway/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Quote and book private airport transfers with CGC Airport Transfers (Gold Coast, Brisbane, Byron Bay, Northern NSW). Prices come from the live booking engine: never estimate a fare. Every quote returns book_url, a pre-filled booking page: give it to the customer exactly as returned (its utm tags attribute the booking to an AI assistant); they confirm, accept the terms and pay there. A trip with stops on the way has no link yet: book it with request_booking. request_booking (key holders only) lodges the booking and returns a secure checkout_url for the customer to pay directly; no payment ever passes through this gateway, and nothing is held until that payment is made. Transfers run 24/7 by pre-booking except Christmas Day (25 December); check_availability answers for any date and time.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Whether CGC can take a pre-booked pickup at a given date and time. Transfers run 24/7 by pre-booking except Christmas Day (25 December). Standard rates apply 6am–9pm AEST; pickups between 9pm and 6am carry an after-hours fee, shown in the quote before booking. Same-day requests should phone 0416 131 285. Christmas Day and the booking engine's blackout windows are closed (available:false with the closure message); some windows close only some vehicles. Travel within 12 hours needs direct contact.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Travel date, YYYY-MM-DD (Australia/Brisbane)",
                "type": "string"
              },
              "pax": {
                "description": "Passenger count, 1-14",
                "type": "integer"
              },
              "time": {
                "description": "Pickup time, HH:MM 24h",
                "type": "string"
              }
            },
            "required": ["date", "time"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90725e9cd791508cb7e64635893056076f35682b036f0ef2796956b1b7bddfde"
        },
        {
          "name": "get_quote",
          "title": "Get a fixed-price quote",
          "description": "Exact fixed prices for a transfer between two locations, straight from the live booking engine. Per vehicle, AUD, GST and tolls included, locked at booking, no surge. If the route has no fixed price the response says so — never estimate a figure yourself. Every quote without stops includes book_url (and one per vehicle in book_urls): a pre-filled booking page the customer completes, accepts terms and pays on. Give the customer that link exactly as returned, utm tags included, so the booking is attributed to an AI assistant; pass date, time, passengers, return leg, luggage, child seats and flight here so the link carries them. With a date, closures are checked first: on Christmas Day (25 December) or inside a blackout window the response is available:false with the closure message and no prices. fares_aud are always ONE-WAY fares; with return_date the quote adds return_totals_aud, the whole return trip per vehicle (outbound plus the return leg at the booking form's return discount) — quote that for a return, never the one-way fare. If the return starts or ends somewhere else (in to one hotel, back from another), add return_pickup and/or return_dropoff: each trip is then priced at its own fare and the return discount comes off the cheaper trip, exactly as the booking form does. Stops on the way (up to 4 each way): add stops, and return_stops for the way back on a return. The booking form adds the detour through them, charged by the extra distance and the same for every vehicle, and the quote gives totals_aud (one way) or return_totals_aud (a return) with the stops in: quote those. A quote with stops has no book_url (the booking form's links can't carry stops yet): book it with request_booking. Give hotels, venues and businesses as the customer named them, without adding a suburb yourself: every place goes through the booking system's address lookup, and a named place given with a suburb is checked against where Google finds it and priced where it really is (place_corrected and address_check say what to tell the customer). An airport pickup can only be booked with the flight number they land on: ask for it with the other booking details.",
          "inputSchema": {
            "properties": {
              "bags": {
                "description": "Large bags (suitcases; a pram or stroller counts as one). Goes into book_url. The quote lists vehicles by passengers, so check the bags against the fleet in get_service_info: the Kia Carnival takes more when fewer people travel. With pax and bags, the Transporter is left out when the group has more large bags than it takes (up to 8 for 9-11 people): two vehicles take them.",
                "type": "integer"
              },
              "carry": {
                "description": "Carry-on bags",
                "type": "integer"
              },
              "date": {
                "description": "Travel date YYYY-MM-DD (goes into book_url; closures are checked)",
                "type": "string"
              },
              "dropoff": {
                "description": "Drop-off suburb, hotel or airport",
                "type": "string"
              },
              "flight": {
                "description": "Flight number, e.g. JQ430 (goes into book_url). An airport pickup is only booked with the flight number they land on.",
                "type": "string"
              },
              "oversized": {
                "description": "Surfboard, golf bag, bike box or similar (takes the space of three large bags, so the sedan drops out). Not for a pram or stroller: that is one large bag in bags, and it means the Carnival rather than the sedan.",
                "type": "boolean"
              },
              "pax": {
                "description": "Total passengers including children. With pax the quote lists only the vehicles that take the whole group, as the booking engine does: groups of 8 or more get the two-vehicle options and the 12-seater Transporter (up to 11 passengers, one vehicle for the whole group).",
                "type": "integer"
              },
              "pickup": {
                "description": "Pickup suburb, hotel or airport",
                "type": "string"
              },
              "return_date": {
                "description": "Return leg date YYYY-MM-DD, if a return: adds return_totals_aud (the whole return trip per vehicle)",
                "type": "string"
              },
              "return_dropoff": {
                "description": "Optional, with return_date: where the return trip drops off, if not the first trip's pickup. Defaults to the first trip reversed.",
                "type": "string"
              },
              "return_pickup": {
                "description": "Optional, with return_date: where the return trip picks up, if not the first trip's drop-off (e.g. a different hotel). Defaults to the first trip reversed.",
                "type": "string"
              },
              "return_stops": {
                "description": "Optional, with return_date: stops on the way back, in order, up to 4, same rules as stops. Not copied from stops: leave out for no stops on the way back.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "return_time": {
                "description": "Return leg pickup time HH:MM",
                "type": "string"
              },
              "seats": {
                "description": "Child seats as {index: qty}; index 0 rear-facing (0-3y), 1 forward-facing (6m-3y), 2 harnessed booster (3-6y), 3 booster with adult belt (6y+). $35 each.",
                "type": "object"
              },
              "stops": {
                "description": "Optional: stops on the way (drop someone off, a shop, a second hotel), in order, up to 4. Each a street address (number and street, suburb) or a hotel or venue name with its suburb, never just a suburb. The booking form adds the detour through them, charged by the extra distance and the same for every vehicle. On a return these are the stops on the way there. Leave out for none.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "time": {
                "description": "Pickup time HH:MM, 24h, Queensland time (goes into book_url)",
                "type": "string"
              },
              "vehicle": {
                "description": "Chosen vehicle: sedan | carnival | carnival_rav4 | two_carnivals | transporter (sets book_url; book_urls has all)",
                "type": "string"
              }
            },
            "required": ["dropoff", "pickup"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a fixed-price quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4af183edc49073517214145fdb608040c676a4ab3a5d168151aa97913f5c5dbb"
        },
        {
          "name": "get_service_info",
          "title": "Business information",
          "description": "CGC Airport Transfers business facts: contact, hours, fleet, inclusions and policies. Private pre-booked transfers, not a taxi or rideshare.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business information"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58c3aa4d7f8ec0bac04deb4c53ea7908740cc04a2dcbd65cfc03f79f1cb40889"
        },
        {
          "name": "request_booking",
          "title": "Request a booking",
          "description": "Lodge a booking. On success this returns a secure checkout_url: give it to the customer to pay directly (their card, never through you). No payment is ever taken through this tool itself. A pickup on a closed day or inside a blackout window is refused (accepted:false) before anything is lodged. Stops on the way (up to 4 each way): stops, and return_stops on a return, the same as the get_quote you quoted; the booking is made at the booking form's own total with the stops in it. An airport pickup needs flight, the flight number they land on, and a return whose way back starts at an airport needs return_flight. The one time there is no flight: the customer is dropping off a hire car at the airport first (hire_car true). Places are checked as in get_quote, and booked where they really are. Booking for someone else (the customer books and pays, another person travels): add passenger_name, passenger_mobile (the driver contacts this number) and passenger_email. When the booking is paid the passenger gets their own confirmation by email, without the price; the customer gets the full confirmation, the receipt and the pay link. Leave them out when the customer is travelling. Requires agent_key (contact admin@cgctransfers.com.au to obtain one).",
          "inputSchema": {
            "properties": {
              "agent_key": {
                "description": "Issued gateway key",
                "type": "string"
              },
              "carry_on": {
                "description": "Optional. Carry-on bags.",
                "type": "integer"
              },
              "child_seats": {
                "description": "Child seats required ($35 each, supplied and fitted). Prefer seat_qty, which prices the seats into the booking and pay link.",
                "type": "integer"
              },
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "dropoff": {
                "type": "string"
              },
              "email": {
                "description": "The customer's email: the pay link, the confirmation and the receipt go here",
                "type": "string"
              },
              "flight": {
                "description": "The flight number they land on (e.g. QF512, JQ 430). Required for an airport pickup (Gold Coast, Brisbane or Ballina airport): without it nothing is booked, unless hire_car is true. \"qf 512\" and \"Qantas 512\" are booked as QF512; anything that is not a flight number is turned back.",
                "type": "string"
              },
              "heard_about": {
                "description": "Optional. How the customer heard about CGC, from their own answer: one of the booking form's 'How did you hear about us?' options, exactly as written (Google search; Google ad; Bing / Microsoft search; ChatGPT; Claude; Other AI assistant (Gemini, Copilot, etc.); Booked with you before; Friend or family recommended you; Hotel / accommodation recommended you; Facebook / Instagram / social media; Other). Leave out if they didn't say. Never guess, and never pick an AI option just because the booking comes through an AI.",
                "type": "string"
              },
              "heard_other": {
                "description": "Optional. The customer's own words, up to 100 characters (e.g. 'saw your van at the airport'). The booking keeps them with an 'Other' answer.",
                "type": "string"
              },
              "hire_car": {
                "description": "True only when the customer is dropping off a hire car at the airport first, so there is no flight to land on: that airport pickup (or the way back from the airport) is then booked without a flight number, as the booking form's \"Continue without a flight number\" does. Never otherwise.",
                "type": "boolean"
              },
              "luggage": {
                "description": "Optional. Large suitcases (a pram or stroller counts as one). If left out, assumed to be what the chosen vehicle holds (never more than one per passenger).",
                "type": "integer"
              },
              "meet_greet": {
                "description": "Optional. Add the Brisbane Airport in-terminal meet and greet ($49). Gold Coast Airport pickups include it already.",
                "type": "boolean"
              },
              "name": {
                "description": "The customer's name: the person booking and paying (the passenger too, unless passenger_name is given)",
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "oversized": {
                "description": "Optional. Surfboard, golf bag, bike box or similar (takes the space of three large bags, so sedans drop out). Not for a pram or stroller: count it in luggage and book the Carnival, not the sedan.",
                "type": "boolean"
              },
              "passenger_email": {
                "description": "Optional, with passenger_name: the travelling passenger's email, exactly as given. When the booking is paid they get their own confirmation there, without the price. A value that is not an email address is refused (accepted:false) and nothing is booked.",
                "type": "string"
              },
              "passenger_mobile": {
                "description": "Optional, with passenger_name: the travelling passenger's mobile. The driver contacts this number on the day, so ask for it.",
                "type": "string"
              },
              "passenger_name": {
                "description": "Optional, only when someone else is travelling (the customer is booking for them): the travelling passenger's name. Leave out when the customer is travelling.",
                "type": "string"
              },
              "pax": {
                "type": "integer"
              },
              "phone": {
                "description": "The customer's mobile",
                "type": "string"
              },
              "pickup": {
                "type": "string"
              },
              "platform": {
                "description": "Which channel this booking comes from (attribution)",
                "enum": ["ChatGPT", "Claude", "SMS", "other"],
                "type": "string"
              },
              "return_date": {
                "description": "Optional, YYYY-MM-DD. With return_time, books the return leg on the same reservation (5% return discount applies).",
                "type": "string"
              },
              "return_dropoff": {
                "description": "Optional, only with return_date and return_time: where the return trip drops off, if not the first trip's pickup. Defaults to the first trip reversed.",
                "type": "string"
              },
              "return_flight": {
                "description": "Return trips whose way back starts at an airport: the flight number they land on for it (e.g. VA500). Required then, unless hire_car is true. Leave out otherwise.",
                "type": "string"
              },
              "return_pickup": {
                "description": "Optional, only with return_date and return_time: where the return trip picks up, if not the first trip's drop-off (in to one hotel, back from another). Defaults to the first trip reversed. With different return addresses each trip is priced at its own fare and the return discount comes off the cheaper trip, as on the booking form; use the same return_pickup and return_dropoff as the get_quote you quoted.",
                "type": "string"
              },
              "return_stops": {
                "description": "Optional, only with return_date and return_time: stops on the way back, in order, up to 4, same rules as stops. Not copied from stops: leave out for none.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "return_time": {
                "description": "Optional, HH:MM 24h, in 5-minute steps. Required if return_date is given.",
                "type": "string"
              },
              "seat_qty": {
                "additionalProperties": {
                  "type": "integer"
                },
                "description": "Child seats by type, priced into the booking and pay link ($35 each): {seat index: quantity}. Indices follow the booking form list: 0 rear-facing 0-3yrs, 1 forward-facing 6mths-3yrs, 2 harnessed booster 3-6yrs, 3 booster with adult seatbelt 6yrs+.",
                "type": "object"
              },
              "stops": {
                "description": "Optional: stops on the way, in order, up to 4, each a street address or a hotel or venue name with its suburb; use the same stops as the get_quote you quoted. One way, this is the booking form's Multi-stop; on a return these are the stops on the way there (its Multi-stop return). The booking carries the stops and is made at the booking form's own total.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "terms_accepted": {
                "description": "REQUIRED, must be true. Confirms the customer has been shown and has accepted the booking terms at https://cgctransfers.com.au/bookingtermsandconditions/ -- do not set this without an explicit yes from the customer.",
                "type": "boolean"
              },
              "time": {
                "description": "HH:MM 24h",
                "type": "string"
              },
              "vehicle": {
                "description": "Vehicle choice; defaults to sedan. transporter = the 12-seater Transporter (up to 11 passengers), one vehicle for a group too big for one Carnival; for 9-11 people it takes up to 8 large bags, so a group with more luggage books 2-carnivals (two Kia Carnivals). There is no trailer. get_quote with pax gives the live seat, child-seat and luggage limits. Any other value is refused (accepted:false, \"Unknown vehicle\"), never booked as a different vehicle.",
                "enum": ["sedan", "carnival", "carnival-rav", "2-carnivals", "transporter"],
                "type": "string"
              }
            },
            "required": ["agent_key", "date", "dropoff", "email", "name", "pax", "phone", "pickup", "terms_accepted", "time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0355892c8cb6726837690763b2aa58f1783d6ecce7386383e5c0febf43638753"
        }
      ],
      "digest": "sha256:330c595e11cc3c22efdabbee5f9bef17366e89efbbf5aebbfa4dd1e7095f37ef"
    }
  }
