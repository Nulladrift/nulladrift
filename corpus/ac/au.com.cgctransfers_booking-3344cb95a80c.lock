      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "au.com.cgctransfers/booking",
        "title": "CGC Airport Transfers",
        "version": "1.3.15",
        "websiteUrl": "https://cgctransfers.com.au/ai-agent-gateway/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Private pre-booked airport transfers with CGC Airport Transfers (Gold Coast, Brisbane, Byron Bay, Northern NSW). Prices come from the live booking engine: fixed per vehicle, in AUD, GST and tolls included, locked at booking; a route without a fixed price is answered without a figure. Price responses include book_url, a pre-filled booking page where the customer confirms the trip, accepts the terms and pays by card; its utm tags mark the booking as coming from an AI assistant. A trip with stops on the way has no book_url: the booking form at https://cgctransfers.com.au/book-now/ takes stops, and phone bookings are on 0416 131 285. No payment passes through this server, and nothing is held until the customer pays. Transfers run 24/7 by pre-booking, including Christmas Day; availability answers cover any date and time, holiday hours included. A holiday surcharge applies on Christmas Day, Boxing Day and Easter Sunday, included in the price before booking.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Whether CGC can take a pre-booked pickup at a given date and time. Transfers run 24/7 by pre-booking, including Christmas Day. Standard rates apply 6am–8:30pm AEST; pickups between 8:30pm and 6am carry an after-hours fee, shown in the price before booking. Holiday hours over Christmas and New Year 2026–27 (Queensland time): Christmas Eve until 6pm, Christmas Day 7am–8:30pm, Boxing Day 7am–8:30pm, New Year's Eve until 6pm, New Year's Day from 7am. A holiday surcharge applies on Christmas Day, Boxing Day and Easter Sunday, included in the price before booking. Same-day requests are taken by phone on 0416 131 285. The booking engine's closed days and closed windows (holiday hours included) answer available:false with the closure message; some windows close only some vehicles. Travel within 12 hours needs direct contact.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Travel date, YYYY-MM-DD (Australia/Brisbane)",
                "type": "string"
              },
              "pax": {
                "description": "Passenger count, 1-14",
                "type": "integer"
              },
              "time": {
                "description": "Pickup time, HH:MM 24h",
                "type": "string"
              }
            },
            "required": ["date", "time"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:afde40feb40956e49477f7c2ed47a55d3dd2098baf1a5633fb3821e9830a15e6"
        },
        {
          "name": "get_quote",
          "title": "Get a fixed-price quote",
          "description": "Fixed prices for a private transfer between two places, read from the live booking engine: per vehicle, in AUD, GST and tolls included, locked at booking, no surge. A route without a fixed price is answered without a figure. A trip without stops comes with book_url (and one per vehicle in book_urls): a pre-filled booking page where the customer completes the booking, accepts the terms and pays. Its utm tags mark the booking as coming from an AI assistant. The date, time, passengers, return leg, luggage, child seats and flight given here are carried in the link. With a date, closures are checked first: on a day the booking engine closes, or inside one of its closed windows (holiday hours included), the response is available:false with the closure message and no prices. On a holiday-surcharge date (Christmas Day, Boxing Day, Easter Sunday) the prices include the surcharge as the booking form charges it; holiday_surcharge and the notes give the amount. fares_aud are one-way fares. With return_date, return_totals_aud is the whole return trip per vehicle (the outbound fare plus the return leg, less the booking form's return discount). With return_pickup or return_dropoff (in to one hotel, back from another), each trip is priced at its own fare and the return discount comes off the cheaper trip, as on the booking form. Stops on the way (up to 4 each way): stops, and return_stops for the way back on a return; the booking form adds the detour through them, charged by the extra distance and the same for every vehicle, and totals_aud (one way) or return_totals_aud (a return) include it. A trip with stops has no book_url: the booking form at https://cgctransfers.com.au/book-now/ takes stops, and phone bookings are on 0416 131 285. Hotels, venues and businesses are looked up by name through the booking system's address lookup; a named place given with a suburb is checked against where Google finds it and priced where it is, and place_corrected and address_check report where a place was found. An airport pickup is booked only with the flight number the passenger lands on.",
          "inputSchema": {
            "properties": {
              "bags": {
                "description": "Large bags (suitcases; a pram or stroller counts as one). Goes into book_url. Vehicles are listed by passengers; each vehicle's luggage limits are in the business facts (the Kia Carnival takes more when fewer people travel). With pax and bags, the Transporter is left out when the group has more large bags than it takes (up to 8 for 9-11 people): two vehicles take them.",
                "type": "integer"
              },
              "carry": {
                "description": "Carry-on bags",
                "type": "integer"
              },
              "date": {
                "description": "Travel date YYYY-MM-DD (goes into book_url; closures are checked)",
                "type": "string"
              },
              "dropoff": {
                "description": "Drop-off suburb, hotel or airport",
                "type": "string"
              },
              "flight": {
                "description": "Flight number, e.g. JQ430 (goes into book_url). An airport pickup is booked only with the flight number the passenger lands on.",
                "type": "string"
              },
              "oversized": {
                "description": "Surfboard, golf bag, bike box or similar (takes the space of three large bags, so the sedan drops out). Not for a pram or stroller: that is one large bag in bags, and it means the Carnival rather than the sedan.",
                "type": "boolean"
              },
              "pax": {
                "description": "Total passengers including children. With pax the response lists only the vehicles that take the whole group, as the booking engine does: groups of 8 or more get the two-vehicle options and the 12-seater Transporter (up to 11 passengers, one vehicle for the whole group).",
                "type": "integer"
              },
              "pickup": {
                "description": "Pickup suburb, hotel or airport",
                "type": "string"
              },
              "return_date": {
                "description": "Return leg date YYYY-MM-DD, if a return: adds return_totals_aud (the whole return trip per vehicle)",
                "type": "string"
              },
              "return_dropoff": {
                "description": "Optional, with return_date: where the return trip drops off, if not the first trip's pickup. Defaults to the first trip reversed.",
                "type": "string"
              },
              "return_pickup": {
                "description": "Optional, with return_date: where the return trip picks up, if not the first trip's drop-off (e.g. a different hotel). Defaults to the first trip reversed.",
                "type": "string"
              },
              "return_stops": {
                "description": "Optional, with return_date: stops on the way back, in order, up to 4, same rules as stops. Not copied from stops; absent means no stops on the way back.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "return_time": {
                "description": "Return leg pickup time HH:MM",
                "type": "string"
              },
              "seats": {
                "description": "Child seats as {index: qty}; index 0 rear-facing (0-3y), 1 forward-facing (6m-3y), 2 harnessed booster (3-6y), 3 booster with adult belt (6y+). $35 each.",
                "type": "object"
              },
              "stops": {
                "description": "Optional: stops on the way (drop someone off, a shop, a second hotel), in order, up to 4. Each a street address (number and street, suburb) or a hotel or venue name with its suburb; a suburb on its own can't be measured. The booking form adds the detour through them, charged by the extra distance and the same for every vehicle. On a return these are the stops on the way there. Absent or empty: no stops.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "time": {
                "description": "Pickup time HH:MM, 24h, Queensland time (goes into book_url)",
                "type": "string"
              },
              "vehicle": {
                "description": "Chosen vehicle: sedan | carnival | carnival_rav4 | two_carnivals | transporter (sets book_url; book_urls has all)",
                "type": "string"
              }
            },
            "required": ["dropoff", "pickup"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a fixed-price quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
