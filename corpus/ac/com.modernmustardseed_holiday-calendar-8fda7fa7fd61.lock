{
  "lockfileVersion": 2,
  "subjects": {
    "com.modernmustardseed/holiday-calendar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://starter.modernmustardseed.com/holidays"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Holiday Calendar (example) by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "A U.S. federal holiday calendar with business-day arithmetic. list_federal_holidays gives a year of holidays with observed dates; next_federal_holidays finds the coming ones; check_business_day says whether a date is a business day; add_business_days and count_business_days do due-date math that skips weekends and observed federal holidays. Every tool is read-only, deterministic and makes no network calls.",
      "tools": [
        {
          "name": "add_business_days",
          "title": "Add business days",
          "description": "Move a number of U.S. business days forward or backward from a date, skipping weekends and observed federal holidays, for due dates, delivery windows and notice periods. The start date is not counted: 1 business day after a Friday is the next Monday, or Tuesday when that Monday is a holiday. Returns the resulting date and every holiday it skipped. Up to 1,000 business days either way.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business_days": {
                "description": "Business days to move, -1000 to 1000. Negative counts backward. 0 returns the start date if it is a business day, otherwise the next one.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "start_date": {
                "description": "The date to count from. It is not counted itself, written YYYY-MM-DD (for example 2026-11-26). Covers 2021 through 2100.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["business_days", "start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Add business days"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f85a978a2038c0b560b82948219f9ad581e83b3495dfa18817f487c2566d944"
        },
        {
          "name": "check_business_day",
          "title": "Check a business day",
          "description": "Check whether a date is a U.S. business day (a weekday that is not an observed federal holiday). Returns the weekday, the holiday observed that day if any, and the business days just before and just after it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "The date to check, written YYYY-MM-DD (for example 2026-11-26). Covers 2021 through 2100.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a business day"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17b2a527a8f436184f3ae2994c23a5dc9af27357c835406bd0ebb1f8d978cfc4"
        },
        {
          "name": "count_business_days",
          "title": "Count business days",
          "description": "Count the U.S. business days between two dates, both dates included, leaving out weekends and observed federal holidays. Returns the business day count, the weekend days, and each holiday that fell in the span. Spans up to 3,660 calendar days.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "end_date": {
                "description": "Last date of the span, counted if it is a business day, written YYYY-MM-DD (for example 2026-11-26). Covers 2021 through 2100.",
                "maxLength": 40,
                "type": "string"
              },
              "start_date": {
                "description": "First date of the span, counted if it is a business day, written YYYY-MM-DD (for example 2026-11-26). Covers 2021 through 2100.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["end_date", "start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Count business days"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad14f9455136310d67ec33e155406ffe5462d227a86ab4017ebdb3ce397db70f"
        },
        {
          "name": "list_federal_holidays",
          "title": "List federal holidays",
          "description": "List the eleven U.S. federal holidays for one calendar year (2021 through 2100): each holiday's name, its actual date and weekday, the date it is observed when it falls on a weekend (Saturday moves to the Friday before, Sunday to the Monday after), and the rule that sets it, from 5 U.S.C. 6103. Use it to answer which days federal offices close in a year.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "year": {
                "description": "Calendar year, 2021 through 2100.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List federal holidays"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a2457a288bde48a421b294680d1aa3136d3505bf4c0a9d274627d9c3530d2de"
        },
        {
          "name": "next_federal_holidays",
          "title": "Find the next federal holidays",
          "description": "Find the next one to eleven U.S. federal holidays observed on or after a date, with each one's observed date and how many calendar days away it is. Without from_date it starts from today's date in America/New_York and says which date it used.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "description": "How many upcoming holidays to return, 1 to 11. Defaults to 1.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "from_date": {
                "description": "Start looking on this date, inclusive, written YYYY-MM-DD (for example 2026-11-26). Covers 2021 through 2100.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the next federal holidays"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f67db93ac05bc64362103859c4320ea992d3d7d714983630bd506e0606c989e"
        }
      ],
      "digest": "sha256:73428dd289d9dcd6879f958e4def991eff4d63a3470b6e1b8390e7e561287f2f"
    }
  }
}
