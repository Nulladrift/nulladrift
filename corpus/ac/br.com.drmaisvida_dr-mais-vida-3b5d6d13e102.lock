      "transport": {
        "type": "http",
        "url": "https://mcp.drmaisvida.com.br/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dr-mais-vida",
        "title": "Dr. Mais Vida",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Dr. Mais Vida é um serviço brasileiro que explica exames de sangue em linguagem simples, a partir das diretrizes médicas brasileiras. Não faz diagnóstico, não prescreve e não substitui a consulta. Use find_exam_articles para achar a explicação de um exame, check_lab_result para comparar um valor com a faixa impressa no laudo da pessoa e ask_health_guidelines para dúvidas gerais. Para ler o laudo inteiro (PDF ou foto), sem conta e sem nada guardado, a pessoa usa https://www.drmaisvida.com.br/tools/lab-report. Responda em português.",
      "tools": [
        {
          "name": "ask_health_guidelines",
          "title": "Perguntar às diretrizes médicas",
          "description": "Responde uma dúvida geral de saúde ou de exame só com o que dizem as diretrizes médicas oficiais da base do Dr. Mais Vida, com a citação de cada afirmação e a fonte. Sem fonte segura, diz que não encontrou. Não usa dados da pessoa; não faz diagnóstico nem indica remédio ou dose.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "A pergunta, em português, até 400 caracteres.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99825ba36737fdada7bd7e50350251d8b7283b49aa33cb54378c34a814571403"
        },
        {
          "name": "check_lab_result",
          "title": "Comparar um resultado com a faixa do laudo",
          "description": "Diz se o valor de um exame está dentro, abaixo ou acima da faixa de referência impressa no laudo da pessoa, e aponta onde entender o resultado. Passe a faixa do próprio laudo (range_low e/ou range_high): ela muda de laboratório para laboratório, e o Dr. Mais Vida não usa uma faixa genérica. Não interpreta nem diagnostica.",
          "inputSchema": {
            "properties": {
              "exam": {
                "description": "O nome do exame como está no laudo, por exemplo \"Ferritina\".",
                "type": "string"
              },
              "range_high": {
                "description": "O limite de cima da faixa de referência do laudo, se houver.",
                "type": "number"
              },
              "range_low": {
                "description": "O limite de baixo da faixa de referência do laudo, se houver.",
                "type": "number"
              },
              "unit": {
                "description": "A unidade impressa, por exemplo \"ng/mL\".",
                "type": "string"
              },
              "value": {
                "description": "O resultado.",
                "type": "number"
              }
            },
            "required": ["exam", "value"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33dff7d73f9d071dd46fa498b88b7b3cf7671e79e68a5a87124efe01524a259f"
        },
        {
          "name": "find_exam_articles",
          "title": "Achar a explicação de um exame",
          "description": "Procura nos artigos do blog do Dr. Mais Vida (exames de sangue, colesterol, tireoide, vitaminas, rins, fígado, pressão) os que explicam um exame ou um resultado. Devolve até 5 artigos com título, endereço e resumo. Use com o nome do exame ou a dúvida, por exemplo \"ferritina baixa\" ou \"TSH alto\".",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "O exame ou a dúvida, em português.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56f6a27de8f3c28d3b46649f6e0c1e1d3e8323ed9db794b36c59e7bfb6f8c015"
        }
      ],
      "digest": "sha256:369bb89dacac0816f49e6b77050349d449ab26eb383d79f9bc9c718ff4d97969"
    }
  }
