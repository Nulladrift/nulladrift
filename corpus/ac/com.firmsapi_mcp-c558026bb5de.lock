  "subjects": {
    "com.firmsapi/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.firmsapi.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "firmsapi",
        "title": "FIRMSapi",
        "version": "1.0.0",
        "websiteUrl": "https://docs.firmsapi.com/mcp/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "FIRMSapi answers questions about U.S. CBP FIRMS codes (4-character codes for piers, container freight stations, bonded warehouses, foreign trade zones and exam sites) from the published CBP list, dated by meta.data_as_of. Each tool call is one API call on the key's monthly plan; invalid arguments, auth errors, quota_exceeded and server errors are not counted. Test keys (fapi_test_...) return a small fixture sample, are never counted and must not be used for filing. FIRMSapi has no connection to ACE: a passing validation is not ACE acceptance, so tell the user to confirm the code, bond status and port eligibility in ACE. Webhooks and change notifications are not available. About a third of codes are not a letter plus three digits: never reject a code for its shape.",
      "tools": [
        {
          "name": "find_nearby_firms_facilities",
          "title": "Find facilities near a point, code or address",
          "description": "List FIRMS facilities within radius_km of one origin, nearest first. Pass exactly one origin: lat and lon, code (that facility is left out of the results) or address (a US street address). meta.origin says which point was used. Facilities without coordinates are left out; test keys use approximate ones.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "code": "E430",
                "radius_km": 5
              }
            ],
            "properties": {
              "address": {
                "description": "Origin US street address.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "code": {
                "description": "Origin FIRMS code.",
                "pattern": "^[A-Za-z0-9]{4}$",
                "type": "string"
              },
              "include_deleted": {
                "default": false,
                "description": "Include deleted codes, ranked after active ones.",
                "type": "boolean"
              },
              "lat": {
                "description": "Origin latitude; pass with lon.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 20,
                "description": "Most facilities to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Origin longitude; pass with lat.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_km": {
                "default": 10,
                "description": "Search radius in km.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "types": {
                "description": "Only these facility types: 01 CFS, 02 FTZ, 03 pier/terminal, 04 bonded warehouse, 05 inspection facility, 06 importer premises, 07 DP site, 08 CBP admin, 09 CES, 10 rail/air terminal, 11 CBP test.",
                "items": {
                  "enum": ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find facilities near a point, code or address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3503c1ce780b82107ba85052654db703dd1e9832183994cf8eeb057446eb9138"
        },
        {
          "name": "get_cbp_port",
          "title": "Get a CBP port and its facilities",
          "description": "Get one CBP port and a page of its FIRMS facilities, ordered by code, without placeholders; active codes only unless include_deleted is true. For the next page pass cursor = meta.next_cursor (null on the last page); each page is one call.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "port": "4601",
                "types": ["03"]
              }
            ],
            "properties": {
              "cursor": {
                "description": "meta.next_cursor from the previous page.",
                "pattern": "^[A-Za-z0-9]{4}$",
                "type": "string"
              },
              "include_deleted": {
                "default": false,
                "description": "Include deleted codes, ranked after active ones.",
                "type": "boolean"
              },
              "limit": {
                "default": 100,
                "description": "Facilities per page.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "port": {
                "description": "4-digit CBP port code.",
                "pattern": "^[0-9]{4}$",
                "type": "string"
              },
              "types": {
                "description": "Only these facility types: 01 CFS, 02 FTZ, 03 pier/terminal, 04 bonded warehouse, 05 inspection facility, 06 importer premises, 07 DP site, 08 CBP admin, 09 CES, 10 rail/air terminal, 11 CBP test.",
                "items": {
                  "enum": ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["port"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a CBP port and its facilities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a04fffea12617284fd55c192701060c66c38f2d4a7273da169a136719596cec6"
        },
        {
          "name": "list_cbp_ports",
          "title": "List CBP ports",
          "description": "List every CBP port that has FIRMS codes, with name, state, region, facility_count and active_count, in one call.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {}
            ],
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List CBP ports"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c9b5c5d4e51e01cf2196017887118f217c98d186f6e98be6bfcff1c70c6f815"
        },
        {
          "name": "lookup_firms_code",
          "title": "Look up a FIRMS code",
          "description": "Get one FIRMS code's record: facility name, status, type, address, CBP port, location and the other codes at the same address. Deleted codes and placeholders (junk: true) come back with warnings. An unknown code is a not_found error, which still counts as a call.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "code": "E430"
              }
            ],
            "properties": {
              "code": {
                "description": "4-character FIRMS code.",
                "pattern": "^[A-Za-z0-9]{4}$",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a FIRMS code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2eb2a10e08e03bf7bac7f5867d28db31a573872fb046302dec2039a2dae5932f"
        },
        {
          "name": "search_firms_facilities",
          "title": "Search facilities by name or address",
          "description": "Search FIRMS codes by facility name and/or street address. Typo-tolerant; returns matches ranked by a 0-100 score, active codes only unless include_deleted is true. One call per search.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "query": "maher terminal elizabeth",
                "state": "NJ"
              }
            ],
            "properties": {
              "include_deleted": {
                "default": false,
                "description": "Include deleted codes, ranked after active ones.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Most matches to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "port": {
                "description": "4-digit CBP port code.",
                "pattern": "^[0-9]{4}$",
                "type": "string"
              },
              "query": {
                "description": "Facility name and/or street address.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "2-letter state.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "types": {
                "description": "Only these facility types: 01 CFS, 02 FTZ, 03 pier/terminal, 04 bonded warehouse, 05 inspection facility, 06 importer premises, 07 DP site, 08 CBP admin, 09 CES, 10 rail/air terminal, 11 CBP test.",
                "items": {
                  "enum": ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search facilities by name or address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:192446fd70373ca448c2a19f2d1bb2fd9dcd0c8cc8376e85cfe52e9f36b8c6c2"
        },
        {
          "name": "validate_firms_code",
          "title": "Check a FIRMS code before filing",
          "description": "Check a FIRMS code against the published CBP list before filing, in order: format, exists (ACE reject 158), active (159), in the stated port (164), type fits the use, not a placeholder. Returns valid, checks_passed, checks_failed, checks_skipped and checks_not_possible (bond status, FTZ zone ID, direct delivery, port clusters). valid: true is not ACE acceptance: confirm in ACE before filing. valid: false is a normal answer and counts as a call.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "code": "E430",
                "port": "4601",
                "use": "location_of_goods"
              }
            ],
            "properties": {
              "code": {
                "description": "The code as it appears in your system; a malformed code fails the format check.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "port": {
                "description": "4-digit CBP port of entry of the filing.",
                "maxLength": 8,
                "type": "string"
              },
              "use": {
                "description": "Intended use, for the type check: warehouse_entry needs type 04, ftz_admission 02, exam_site 09; location_of_goods excludes 07 and 08.",
                "enum": ["warehouse_entry", "ftz_admission", "exam_site", "location_of_goods"],
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a FIRMS code before filing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee8467b093a26d98ebd54b3cccfaa39736170fc03639d05e67674cba31ee17d7"
        }
      ],
      "digest": "sha256:44c4d2843303ac08804e3edccc8359f2526d07874517b9a0a27ad5c9cb2b0703"
    }
  }
