      "capabilities": {
        "tools": {}
      },
      "instructions": "blink-artifact try: publish a temporary HTML page without an account.\nPages are public to anyone with the link and expire after 7 days.\nAfter publishing, show the user the link (url) AND the claimUrl. Opening claimUrl and signing in moves the page into a free account so it is kept.\nKeep the key secret. To revise the same page, call update_html with its id and key instead of publishing again.\nA free account (https://artifact.blinkbrosai.com) adds private sharing, live co-editing, comments and more artifact types.",
      "tools": [
        {
          "name": "publish_html",
          "title": "Publish HTML",
          "description": "Publish a single self-contained HTML page (up to 512 KiB) without an account. It is public to anyone with the link and expires after 7 days. Returns { id, url, expiresAt (unix seconds), key, claimUrl }. Show the user url and claimUrl; keep key secret.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "html": {
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Publish HTML"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d7afa5eca97f651bfb8608f58f032c835fb500c6d1f9e16212777f6c0fda5ba"
        },
        {
          "name": "update_html",
          "title": "Update HTML",
          "description": "Replace the HTML of a page you published earlier with publish_html, using its id and key. The link and expiry stay the same. Fails with not_found for a wrong key and gone when the page expired, was removed or was claimed. Returns { id, url, expiresAt (unix seconds), key, claimUrl }. Show the user url and claimUrl; keep key secret.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "html": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "key": {
                "type": "string"
              }
            },
            "required": ["html", "id", "key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Update HTML"
          },
          "behavior": {
            "destructive": false,
