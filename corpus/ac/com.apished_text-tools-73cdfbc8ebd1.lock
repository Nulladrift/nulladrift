{
  "lockfileVersion": 2,
  "subjects": {
    "com.apished/text-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://apished.com/mcp/v1/text"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "apished-text",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "text_charat",
          "description": "Returns the 0-indexed character (rune) at index in text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "index": {
                "description": "0-indexed",
                "type": "integer"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["index", "text"],
            "type": "object"
          },
          "outputSchema": {
            "type": "string"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f332685961f11883000f222f4e6894e145ac351f0a573dcc535d1114eff75070"
        },
        {
          "name": "text_count",
          "description": "Counts non-overlapping occurrences of substring in text (rune-safe, not byte-based).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "substring": {
                "description": "must be non-empty",
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["substring", "text"],
            "type": "object"
          },
          "outputSchema": {
            "type": "integer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:423175edcdf2b3f1ef280e78c40aa4c123209b69fc6e67d486e8388b8a01683b"
        },
        {
          "name": "text_palindrome",
          "description": "Checks whether text reads the same forwards and backwards. ignoreCase/ignoreNonAlnum default false (strict, literal comparison); set both true for phrase-style palindromes like \"A man, a plan, a canal: Panama\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ignoreCase": {
                "type": "boolean"
              },
              "ignoreNonAlnum": {
                "type": "boolean"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "type": "boolean"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1d06cfc4474475abb4daf05e05ef944fb578882f59b463e754e6280e70b0f2c"
        },
        {
          "name": "text_reverse",
          "description": "Reverses text by Unicode code point (rune), not grapheme cluster.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "type": "string"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8cc084cfbcf96f7da2435b3b6d5a6eab9aa2338df3274e020e9ec510ea86b565"
        },
        {
          "name": "text_sort",
          "description": "Sorts text's characters or words alphabetically. by: \"chars\" (default, sorts runes, no separator) or \"words\" (splits on whitespace, rejoins with a single space).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "by": {
                "description": "chars (default) or words",
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "type": "string"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e5f784d87ba4575d3cc34b572ed793a80804efd7af6d70c829338f0ca93bde52"
        },
        {
          "name": "text_stats",
          "description": "Descriptive statistics for text: rune/byte/word/line counts, a unique-rune count, a letters/digits/spaces/punctuation/other breakdown, an exact per-character frequency table, and word-length min/max/average plus the actual shortest/longest word (ties resolve to the first occurrence).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "bytes": {
                "type": "integer"
              },
              "charFrequency": {
                "additionalProperties": {
                  "type": "integer"
                },
                "type": "object"
              },
              "charTypes": {
                "additionalProperties": false,
                "properties": {
                  "digits": {
                    "type": "integer"
                  },
                  "letters": {
                    "type": "integer"
                  },
                  "other": {
                    "type": "integer"
                  },
                  "punctuation": {
                    "type": "integer"
                  },
                  "spaces": {
                    "type": "integer"
                  }
                },
                "required": ["digits", "letters", "other", "punctuation", "spaces"],
                "type": "object"
              },
              "lines": {
                "type": "integer"
              },
              "runes": {
                "type": "integer"
              },
              "uniqueRunes": {
                "type": "integer"
              },
              "wordLengths": {
                "additionalProperties": false,
                "properties": {
                  "average": {
                    "type": "number"
                  },
                  "longest": {
                    "type": "string"
                  },
                  "max": {
                    "type": "integer"
                  },
                  "min": {
                    "type": "integer"
                  },
                  "shortest": {
                    "type": "string"
                  }
                },
                "required": ["average", "longest", "max", "min", "shortest"],
                "type": "object"
              },
              "words": {
                "type": "integer"
              }
            },
            "required": ["bytes", "charFrequency", "charTypes", "lines", "runes", "uniqueRunes", "wordLengths", "words"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b9885ef0618051aabab152563bb0c828ab3f09bd6cf01503ff1ce28d2877bc9"
        },
        {
          "name": "text_wordcount",
          "description": "Counts whitespace-delimited words in text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "type": "integer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6956e4b64559e4e9379aee3bcb37e54a1e6f25f108101d355e721c3d67bba299"
        }
      ],
      "digest": "sha256:af98a27411c3a1fe86fd3b93c106d79a1917d450e96f5ea6ee40745bf4b687d5"
    }
  }
}
