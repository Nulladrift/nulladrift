        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SIGN-IN REQUIRED. Every Datailo tool except datailo_connect and datailo_connect_verify (and datailo_account) needs a signed-in account with an email; registering is free (the beta plan) and takes one email, no password. Before the first data call, unless this connection is already signed in (OAuth or a key): ask the user for their email address, call datailo_connect(email=<their email>, language=<their language>), then right away datailo_connect_verify(request_id) with no code (it waits while they click Confirm in the email; if they read you the six-digit code, pass it). A call made without sign-in returns error sign_in_required with these same steps; after signing in, retry it with the same arguments. Datailo is one MCP connection to several professional data and workflow services. Call datailo_start_here first: it orients you on what is enabled, what is available, and the next step. The tool surface is fixed and flat — datailo_* tools only, never a child's own tool names. Speak to the user in THEIR language at every step; tools return machine states (state, next) for you to explain. Every call needs a signed-in account (free, one email), and signing in happens inside the chat: datailo_connect(email, language) sends one email with a confirm link and a six-digit code; the user clicks Confirm or tells you the code; then call datailo_connect_verify(request_id, code?) — with the code, or with no code right away: it waits for the click, so the user never has to come back and say they confirmed. The result contains `session`: pass session=<that value> on EVERY later Datailo call in the conversation, or a client that opens a fresh connection per call is anonymous again. For a sign-in that lasts across chats, the user reconnects Datailo with 'Sign in' (OAuth) in the connector.",
