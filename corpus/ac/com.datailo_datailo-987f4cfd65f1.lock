                "default": null,
                "description": "For settings: the switches to change, e.g. {\"email_feedback_replies\": false}. Omit to read them. email_digest: a periodic email summary of unread messages (off by default); email_feedback_replies: an email when the team replies to your own feedback (off by default: replies wait in your inbox); marketing: offers such as trial extensions or discounts (off by default; nothing of this kind is sent yet)",
                "title": "Settings"
              }
            },
