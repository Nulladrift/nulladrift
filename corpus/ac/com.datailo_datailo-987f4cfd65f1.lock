        {
          "name": "datailo_connect",
          "title": "Sign in (step 1 of 2)",
          "description": "Sign in, inside the chat (needed to enable services and call their tools). Send the user's email and the language you are speaking with them (e.g. 'lt', 'en', 'de'). Datailo sends ONE email in that language with a confirm link and a six-digit code, valid 15 minutes, and returns a request_id. Tell the user, in their language, to click Confirm in the email; then IMMEDIATELY call datailo_connect_verify(request_id) — it waits for their click, so the user never has to come back and say they clicked. The account is created on first confirmation. Nothing is charged and no card is needed.",
