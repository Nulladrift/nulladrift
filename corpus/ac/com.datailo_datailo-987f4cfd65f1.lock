              },
              "confirmed": {
                "default": false,
                "description": "action='reply': true once the person has seen and agreed the text",
                "title": "Confirmed",
                "type": "boolean"
              },
              "full": {
                "default": false,
                "description": "action='get': true returns every thread message whole (default: the latest whole, older ones shortened)",
                "title": "Full",
                "type": "boolean"
              },
              "ref": {
