{
  "lockfileVersion": 2,
  "subjects": {
    "com.legit2compute/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://legit2compute.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.legit2compute/mcp",
        "title": "legit2compute",
        "version": "1.0.0",
        "websiteUrl": "https://legit2compute.com/docs"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "legit2compute: hosted language models (OpenAI-compatible) and media generation (images, music, voice, sound effects, video, clips) on one API key, billed from prepaid credit. Start with account to see balance and pipelines. For text use chat (model \"l2c/auto\" is cheapest-that-fits). For media: generate, then get_job with wait_seconds until completed, then share the download links. Get a key (with trial credit) at https://legit2compute.com/developers.",
      "tools": [
        {
          "name": "account",
          "title": "Account and prices",
          "description": "Your legit2compute account: credit balance, the media pipelines your key can run with their estimated cost, and per-model token prices. Call this first to see what is available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5725d7a9b92b1044aaa758c8739380aba367bf19fc736b0a786c529ef3b49e0"
        },
        {
          "name": "chat",
          "title": "Ask a language model",
          "description": "Send a prompt (or a full OpenAI-style messages array) to a hosted language model and get the answer. Billed per token from your credit. Use model \"l2c/auto\" unless you need a specific one from list_models.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_tokens": {
                "maximum": 32768,
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "OpenAI chat messages: [{\"role\":\"system|user|assistant\",\"content\":\"...\"}].",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "model": {
                "description": "Model id from list_models. Default \"l2c/auto\".",
                "type": "string"
              },
              "prompt": {
                "description": "The user message. Ignored when messages is given.",
                "type": "string"
              },
              "system": {
                "description": "Optional system prompt (with prompt).",
                "type": "string"
              },
              "temperature": {
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0caf1511d43f06afbc72c5bea72fc3d7000ecf5e04a85eb27450067ac3bc1e2a"
        },
        {
          "name": "generate",
          "title": "Generate media",
          "description": "Start a media job: images, image edits, music and songs, cloned voice and narration (in other languages too), sound effects, video from text or an image, long video to short clips, transcripts, articles, podcasts. Returns a job_id at once; then call get_job. Billed from your credit when it runs. Pipelines and example input:\n- image_generate: {\"prompt\":\"a lighthouse at dawn, cinematic\"}\n- image_edit: {\"prompt\":\"make it night\",\"input_image\":\"<https URL or a previous output key>\"}\n- music_generate: {\"prompt\":\"warm lo-fi piano\",\"duration\":30,\"instrumental\":true}\n- voice_generate: {\"text\":\"Welcome back to the show.\",\"voice\":\"maple:happy\"} (optional \"language\":\"es\")\n- sound_effects: {\"text\":\"ocean waves on a rocky shore\",\"seconds\":6}\n- video_t2v: {\"prompt\":\"ocean waves at sunset\",\"seconds\":5}\n- video_i2v: {\"prompt\":\"slow push-in\",\"input_image\":\"<https URL or output key>\"}\n- full_clip: {\"url\":\"https://youtube.com/watch?v=...\",\"num_clips\":5}\n- transcribe_only: {\"url\":\"https://...\",\"language\":\"auto\"}\n- article_gen: {\"topic\":\"...\",\"tone\":\"neutral\"}\n- podcast_gen: {\"topic\":\"...\",\"minutes\":10}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input": {
                "description": "The pipeline input, e.g. {\"prompt\":\"...\"}.",
                "type": "object"
              },
              "pipeline": {
                "description": "One of the pipelines listed above (account shows which your key can run).",
                "type": "string"
              },
              "title": {
                "description": "Optional label for the job.",
                "type": "string"
              }
            },
            "required": ["input", "pipeline"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:06ab6a8d4da1ea6dae7f4d21f7ecbd61bcc16d47f46277c1f160ad837633fd26"
        },
        {
          "name": "get_job",
          "title": "Check a job",
          "description": "Status of a media job. When it is completed, the result files with download links. wait_seconds (up to 50) keeps checking until the job ends or the time is up. Never submit a job again because it is still running: it is still billed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "type": "string"
              },
              "wait_seconds": {
                "description": "Wait for the job to finish, up to this long. Default 0.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:566e8405c20d54071d0a095470f529c7f0e480f137eb116fa5f6774a593d4d1b"
        },
        {
          "name": "list_models",
          "title": "List language models",
          "description": "Every language model your key can call, with context length, tool support, modality (text or vision) and price. \"l2c/auto\" picks the cheapest model that fits each request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8de84e8215c8430bb334190dc0f0b12b20efedd73c8c8850141343cae87187bf"
        }
      ],
      "digest": "sha256:e876aff4f72053c7440ff81898c878673c477b24bf5d6881d0d9bd0f76f709fb"
    }
  }
}
