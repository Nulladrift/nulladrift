        {
          "name": "list_keys",
          "title": "List the row identifiers of a dataset",
          "description": "List the key identifiers of a dataset's rows (for example spec, grade, class, size, and the row position `line`) so lookup_value can address exactly one row. Returns identifiers only, never table values, at most 50 per call; `prefix` filters on the first key field. For pointer datasets it returns the key schema without rows.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "dataset_id": {
                "description": "Dataset id from find_dataset",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Maximum identifiers to return (default 20, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "prefix": {
                "description": "Only identifiers whose first key field starts with this text",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["dataset_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dataset_id": {
                "type": "string"
              },
              "key_fields": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "keys": {
                "items": {
                  "additionalProperties": {
                    "type": ["string", "number", "boolean"]
                  },
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "mode": {
                "enum": ["licensed_embedded", "pointer", "own"],
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["dataset_id", "key_fields", "keys", "mode", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the row identifiers of a dataset"
