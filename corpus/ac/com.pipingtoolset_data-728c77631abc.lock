        {
          "name": "find_dataset",
          "title": "Find a code dataset",
          "description": "Search the engineering code-table datasets by keyword (standard, table, quantity, material). Returns up to 10 matches, each with its id, title, standard, edition and table, whether lookups return a value or a pointer (table, row and column only), and the tier at which values are returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Keywords, e.g. 'B31.3 allowable stress A106' or 'support spacing'",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "standard": {
                "description": "Optional standard filter, e.g. 'ASME B31.1'",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "edition": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "mode": {
                      "enum": ["licensed_embedded", "pointer", "own"],
                      "type": "string"
                    },
                    "standard": {
                      "type": "string"
                    },
                    "table": {
                      "type": "string"
                    },
                    "tier_required": {
                      "enum": ["free", "pro", "proplus", "ultimate"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["edition", "id", "mode", "standard", "table", "tier_required", "title"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a code dataset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e2eb601716f9bc6e67d1361c1c1f1e683e66638329ed9135019e959fd7b0d8cb"
