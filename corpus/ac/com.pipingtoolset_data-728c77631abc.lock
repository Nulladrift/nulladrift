                          },
                          "unit": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["description", "name", "unit"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "edition": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "notes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "quantity": {
                      "type": "string"
                    },
                    "row_key": {
