        {
          "name": "get_aisc_shape",
          "title": "AISC shape properties",
          "description": "Return the dimensions and section properties of one AISC shape by designation (e.g. W8X31, HSS6X6X3/8, PIPE4STD, L4X4X1/2): weight, area, depth, flange and web dimensions, I, S, Z, r, J and Cw as applicable. Source: AISC Shapes Database v16.0; L, HSS and Pipe computed from nominal geometry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "designation": {
                "description": "AISC designation, spaces ignored, e.g. W8X31",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["designation"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
