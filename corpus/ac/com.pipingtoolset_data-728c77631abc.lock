      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Engineering code-table data with citations. Use find_dataset, then describe_dataset for the key fields, then lookup_value for one row and one column. Every value carries its standard, edition, table, row and column; confirm it against the printed page before issue. Pointer results name the table, row and column to read; they carry no value.",
      "tools": [
        {
          "name": "describe_dataset",
          "title": "Describe a code dataset",
          "description": "Describe one dataset: the key fields a lookup needs, the value columns with units and which need a temperature, the citation (standard, edition, table), whether lookups return a value or a pointer, the tier at which values are returned, and the daily lookup limits. Returns structure only, no table values.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "dataset_id": {
                "description": "Dataset id from find_dataset",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["dataset_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "caps": {
                "additionalProperties": false,
                "properties": {
                  "list_keys_max": {
                    "type": "number"
                  },
                  "list_keys_per_day": {
                    "type": "number"
                  },
                  "lookups_per_day": {
                    "type": "number"
                  }
                },
                "required": ["list_keys_max", "list_keys_per_day", "lookups_per_day"],
                "type": "object"
              },
              "citation": {
                "additionalProperties": false,
                "properties": {
                  "edition": {
                    "type": "string"
                  },
                  "standard": {
                    "type": "string"
                  },
                  "table": {
                    "type": "string"
                  },
                  "unit_system": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["edition", "standard", "table", "unit_system"],
                "type": "object"
              },
              "columns": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "needs_T": {
                      "type": "boolean"
                    },
                    "unit": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["description", "name", "needs_T", "unit"],
                  "type": "object"
                },
                "type": "array"
              },
              "dataset_id": {
                "type": "string"
              },
              "default_column": {
                "type": ["string", "null"]
              },
              "key": {
                "additionalProperties": false,
                "properties": {
                  "optional": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "description": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "type": {
                          "enum": ["string", "number"],
                          "type": "string"
                        }
                      },
                      "required": ["description", "name", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "required": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "description": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "type": {
                          "enum": ["string", "number"],
                          "type": "string"
                        }
                      },
                      "required": ["description", "name", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["optional", "required"],
                "type": "object"
              },
              "mode": {
                "enum": ["licensed_embedded", "pointer", "own"],
                "type": "string"
              },
              "tier_required": {
                "enum": ["free", "pro", "proplus", "ultimate"],
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "verify_at": {
                "type": "string"
              }
            },
            "required": ["caps", "citation", "columns", "dataset_id", "default_column", "key", "mode", "tier_required", "title", "verify_at"],
            "type": "object"
          },
