        {
          "name": "get_fixture_example",
          "title": "Worked example for a skill",
          "description": "Return one worked example case for a Piping Toolset plugin skill: the inputs, the expected outputs and the pass/fail status from the hand-checked calculation fixtures, with case names removed. `case` selects among the skill's cases (0-based; the result gives the count).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "case": {
                "description": "0-based case index (default 0)",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "skill": {
                "description": "Plugin skill slug (current names first; 0.9.x names stay accepted)",
                "enum": ["pipe-stress-check", "bolted-flange", "nozzle-load", "pipe-support", "load-case-builder", "stress-import", "pressure-design", "stress-screening", "iso-to-pcf"],
                "type": "string"
              }
            },
            "required": ["skill"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "case_count": {
                "type": "number"
              },
              "case_index": {
                "type": "number"
              },
              "expect": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "input": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "module": {
                "type": "string"
              },
              "skill": {
                "enum": ["pipe-stress-check", "bolted-flange", "nozzle-load", "pipe-support", "load-case-builder", "stress-import", "pressure-design", "stress-screening", "iso-to-pcf"],
                "type": "string"
              },
              "status": {
                "type": ["string", "null"]
              },
              "tol": {
                "type": ["number", "null"]
              }
            },
            "required": ["case_count", "case_index", "expect", "input", "module", "skill", "status", "tol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Worked example for a skill"
          },
          "behavior": {
            "destructive": false,
