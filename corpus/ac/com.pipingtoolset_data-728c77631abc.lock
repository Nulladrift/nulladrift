        {
          "name": "get_pipe_dimensions",
          "title": "Pipe OD and wall by schedule",
          "description": "Return the outside diameter and nominal wall thickness (in) for a nominal pipe size per ASME B36.10M / B36.19M: one schedule with its wall and inside diameter when `schedule` is given (e.g. 40, STD, XS, 80, 10S), otherwise the walls of every schedule listed at that size.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "nps": {
                "description": "Nominal pipe size, e.g. 6, 1-1/2, 3/4",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              },
              "schedule": {
                "description": "Schedule or weight class, e.g. 40, STD, XS, 160, 10S",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["nps"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "citation": {
                "additionalProperties": false,
                "properties": {
                  "edition": {
                    "type": "string"
                  },
                  "standard": {
                    "type": "string"
                  },
                  "table": {
                    "type": "string"
                  }
                },
                "required": ["edition", "standard", "table"],
                "type": "object"
              },
              "mode": {
                "const": "licensed_embedded",
                "type": "string"
              },
              "notice": {
                "type": ["string", "null"]
              },
              "nps": {
                "type": "string"
              },
              "od": {
                "type": "number"
              },
              "schedule": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "type": "number"
                      },
                      "label": {
                        "type": "string"
                      },
                      "wall": {
                        "type": "number"
                      }
                    },
                    "required": ["id", "label", "wall"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "tier_required": {
                "enum": ["free", "pro", "proplus", "ultimate"],
                "type": "string"
              },
              "unit": {
                "const": "in",
                "type": "string"
              },
              "verify_at": {
                "type": "string"
              },
              "walls": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "schedule": {
                          "type": "string"
                        },
                        "wall": {
                          "type": "number"
                        }
                      },
                      "required": ["schedule", "wall"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["citation", "mode", "notice", "nps", "od", "schedule", "tier_required", "unit", "verify_at", "walls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pipe OD and wall by schedule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
