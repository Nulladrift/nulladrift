                  "type": "string"
                },
                "type": "object"
              },
              "scope": {
                "enum": ["isogen", "caesar-safe"],
                "type": "string"
              }
            },
            "required": ["about", "groups", "scope"],
            "type": "object"
          },
          "annotations": {
