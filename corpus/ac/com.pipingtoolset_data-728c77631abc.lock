              "family": {
                "type": "string"
              },
              "properties": {
                "additionalProperties": {
                  "type": ["number", "string", "boolean", "null"]
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "source": {
                "enum": ["aisc-db", "computed"],
                "type": "string"
              }
