        {
          "name": "list_papers",
          "title": "List papers in a conference",
          "description": "Browse papers of one conference edition (e.g. conference=\"iclr\", year=2025, or year=2027 for ICLR under-review submissions). Defaults to slim rows (id, title, conference, year, decision, rating_avg, url, short topics) with up to 250 per page; pass fields=full for abstracts (max 25) or use get_paper. Optionally filter by acceptance type or topic slug. For keyword search use search_papers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "conference": {
                "description": "Conference slug, e.g. iclr",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from a previous call",
                "type": "string"
              },
              "decision": {
                "description": "Acceptance types to keep (case-insensitive exact match). Common values: Oral, Spotlight, Poster, Highlight, Findings, Main; ICLR 2027 also uses Under review, Desk reject, Withdrawn.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
