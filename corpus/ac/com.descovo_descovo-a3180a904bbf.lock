      },
      "instructions": "Descovo API - Discovery and execution tools.\n\nHOW TO USE (3 steps):\n1. search_endpoints(\"your intent\", constraints=[...], preferredTags=[...], tagPack=\"...\") - Choose the best operations with ranked alternatives\n2. get_endpoint_details_full(\"operationId\") - Get complete schema and examples for complex fields\n3. call_operation(\"operationId\", {body: {...}}) - Execute\n\nEXAMPLES:\n- \"find companies\" → search_endpoints(\"find AI companies in SF\", constraints=[\"country\", \"headcount\"]) → companySearch\n- \"get email\" → search_endpoints(\"reveal work email for known profile\") → syncQuickContactReveal\n- \"find people\" → search_endpoints(\"find VP engineering in fintech\") → peopleSearch\n- \"who is this\" → search_endpoints(\"match a person from name and company domain\") → personMatch\n\nAUTHENTICATION: If the MCP client was configured with an x-api-key header, authentication is automatic — do NOT ask the user for their API key and do NOT include apiKey in the request body. The key is forwarded from the client config. Only ask for an API key if a call returns a 403 Forbidden error.\n\nFOR WORKFLOWS AND CREDIT COSTS:\nRead llms://descovo.com/llms.txt for step-by-step guidance.\nFor API choice among similar operations, read llms://descovo.com/api-selector.\n",
      "tools": [
        {
          "name": "call_operation",
          "title": "Call an API operation",
          "description": "Execute any Descovo API operation by operationId.\n\nIMPORTANT:\n- apiKey is NOT required in the body if the MCP client sends an x-api-key header (most configs do). The backend auto-injects it.\n- Prefer search_endpoints() first when operation choice is ambiguous.\n- Use get_endpoint_details_full(operationId='...') first for complex/nested parameter shapes.\n\nArgs:\n    operationId: The operation ID to call\n    params: Parameters dict: {\"body\": {...}, \"path\": {...}, \"query\": {...}}\n\nReturns:\n    API response data or error details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "operationId": {
                "type": "string"
              },
              "params": {
                "default": null,
                "title": "Params"
              }
            },
            "required": ["operationId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
