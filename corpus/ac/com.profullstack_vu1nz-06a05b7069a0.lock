      "instructions": "vu1nz MCP server — public, read-only, stateless.\n\nUse `scan_repo` to scan any public GitHub repo's workflow files for\nCI/CD security issues. Use `threat_feed` for the live malicious-package\nfeed. Use `check_license` to look up subscription status for an org.\n\nWebhook tools (`list_webhooks`, `create_webhook`, `delete_webhook`,\n`test_webhook`, `webhook_deliveries`) need `Authorization: Bearer vk_live_...`\n(a vu1nz API key) on the MCP request.",
      "tools": [
        {
          "name": "check_license",
          "title": "Check License Status",
          "description": "Look up the vu1nz subscription status for a GitHub org. Bootstraps a 14-day free trial on first call. Returns ok, status (trialing/active/past_due/cancelled/exempt), days remaining, license_key, and upgrade URL.",
          "inputSchema": {
            "properties": {
              "github_org": {
                "description": "GitHub org login (e.g. 'acme-corp').",
                "type": "string"
              },
              "license_key": {
                "description": "Optional existing license_key for sanity check.",
                "type": "string"
              }
            },
            "required": ["github_org"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:751be503fb618e034f5f758478bb55a5f0514d44be9395b22e610eb0ae3986ac"
        },
        {
          "name": "create_webhook",
          "title": "Create Webhook",
          "description": "Add a webhook endpoint (public https URL). Returns the endpoint and its signing secret (shown once). Needs an API key.",
          "inputSchema": {
            "properties": {
              "description": {
                "type": "string"
              },
              "events": {
                "description": "Patterns: '*', 'scan.completed', 'scan.failed', 'scan.*'. Default all.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "https URL that receives signed CloudEvents.",
                "type": "string"
