        {
          "name": "payram_setup_plan",
          "title": "Plan a PayRam install (step by step)",
          "description": "Start here to install PayRam on a VPS. Returns an ordered, personalised plan — prepare server → install → claim admin + set public URL → wallets (incl. Smart Bridge review) → API key + first payment link → hardening → store/app integration — with who runs each step (agent shell vs human/dashboard), exact commands, what success looks like, and hard stops that need the human (cold wallet, mainnet spend, root-only settings). Ask the user first whether you can run commands on their server (access \"ssh\") or only chat with them (access \"human_runs_commands\": they run each command and paste the output back). Pass stage to resume mid-way; payram_doctor tells you the stage of a running server.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access": {
                "default": "ssh",
                "description": "ssh = you can run commands on the server yourself. human_runs_commands = you only chat: the human runs each command and pastes the output back. Ask the user which applies before planning.",
                "enum": ["ssh", "human_runs_commands"],
                "type": "string"
              },
              "domain": {
                "description": "Public hostname for the gateway, e.g. pay.example.com. Omit if you only have an IP for now.",
                "pattern": "^(?=.{1,253}$)([a-z0-9-]+\\.)+[a-z]{2,}$",
                "type": "string"
              },
              "integration": {
                "default": "none",
                "description": "What will take payments once the gateway is up",
                "enum": ["none", "website", "shopify", "woocommerce"],
                "type": "string"
              },
              "network": {
                "default": "testnet",
                "description": "testnet = free test coins (recommended first); mainnet = real money",
                "enum": ["testnet", "mainnet"],
                "type": "string"
              },
              "path": {
                "default": "agent",
                "description": "agent = headless CLI after a one-time interactive install; human = installer + web dashboard",
                "enum": ["agent", "human"],
                "type": "string"
              },
              "role": {
                "default": "merchant",
                "description": "merchant: Take payments for your own business (default). operator: Run PayRam as a platform for other merchants and earn a fee on their volume. Must be chosen before the first project; the role locks once role-specific data exists.",
                "enum": ["merchant", "operator"],
                "type": "string"
              },
              "ssl": {
                "description": "letsencrypt (needs domain), own_certificate, proxy (Cloudflare/your own reverse proxy terminates TLS), none. Default: letsencrypt with a domain, none without.",
                "enum": ["letsencrypt", "own_certificate", "proxy", "none"],
                "type": "string"
              },
              "stage": {
                "default": "fresh",
                "description": "Where you are now; the plan starts from the next step",
                "enum": ["fresh", "installed", "account_created", "wallet_ready", "payment_link_created"],
                "type": "string"
              },
              "wallet": {
                "default": "usdc_base",
                "description": "First deposit wallet: usdc_base (smart-contract wallet on Base, needs a little gas), btc (xpub, no gas), or both",
                "enum": ["usdc_base", "btc", "both"],
                "type": "string"
              }
