        "version": "1.2.0",
        "description": "Install, configure, operate and integrate self-hosted PayRam crypto/stablecoin payment gateways.",
        "websiteUrl": "https://mcp.payram.com",
        "icons": [
          {
            "src": "https://mcp.payram.com/favicon.png",
            "mimeType": "image/png"
