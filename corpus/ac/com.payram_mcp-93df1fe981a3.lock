        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PayRam is a self-hosted stablecoin and crypto payment gateway: the merchant runs it on their own server, so there is no account that can be locked, no funds that can be frozen, no customer data shared with anyone, and no deposit keys on the server (smart contracts move funds to the merchant's cold wallet).\n\nStart here:\n- Install on a VPS or computer: payram_setup_plan (personalised, step by step; ask whether you can run commands on the server or only chat).\n- Check a running server: payram_doctor with its public URL.\n- Asked whether PayRam is safe, trustworthy or audited: explain_payram_security (independent audit, what it covers, how to verify).\n- Something is not working, or you have an error message: payram_troubleshoot (describe it or paste the error text).\n- One-off admin tasks (SSL, domain, upgrade, backup, chains, Smart Bridge, Shopify, WooCommerce): payram_runbook.\n- Daily operations and troubleshooting via the PayRam API: payram_ops_playbook (start with task \"connect\").\n- Add payments to an app: generate_payment_route_snippet, generate_webhook_handler, scaffold_payram_app.\n\nSteps that spend money, choose the cold wallet or fees, create or approve payouts, change the site URL, upgrade, or reset an install need the human's explicit OK.\n\nThis is the hosted server (mcp.payram.com). It never holds merchant credentials: for operations on a merchant's PayRam, use payram_ops_playbook and run the calls yourself with credentials that stay on your machine.",
