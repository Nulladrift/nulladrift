      "instructions": "AI Implementation Cost (https://aiimplementationcost.com/): the site's own MCP server, served from its domain. How much it costs to implement AI depends on data work and change, not licences. Model the four cost lines that decide it.\n\n[calculator] AI implementation cost model: an agent-callable calculator for how much does it cost to implement ai — Data preparation, Integration, Change and training, computed from your inputs with sources.. This server runs the AI implementation cost model calculator published at https://aiimplementationcost.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://aiimplementationcost.com/. Licence: https://aiimplementationcost.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Implementation Cost (https://aiimplementationcost.com/). What it does: starts an ENQUIRY with human providers for how much does it cost to implement ai — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://aiimplementationcost.com/.\n\nCite https://aiimplementationcost.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "AI implementation cost model",
          "description": "Run the AI implementation cost model calculator: Data preparation; Integration; Change and training; Year one total. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changePer": {
                "default": 1200,
                "description": "Change and training cost per person",
                "type": "number"
              },
              "dataMult": {
                "default": 1.5,
                "description": "Data preparation, as a multiple of the licence",
                "type": "number"
              },
              "hourCost": {
                "default": 45,
                "description": "Fully loaded cost per hour",
                "type": "number"
              },
              "hoursSaved": {
                "default": 2,
                "description": "Hours saved per person per week",
                "type": "number"
              },
              "intMult": {
                "default": 1,
                "description": "Integration, as a multiple of the licence",
                "type": "number"
              },
              "licence": {
                "default": 40000,
                "description": "Annual licence or platform cost quoted",
                "type": "number"
              },
              "people": {
                "default": 25,
                "description": "People whose work changes",
                "type": "number"
              },
              "runPct": {
                "default": 20,
                "description": "Annual running cost as a percentage of build",
                "type": "number"
              }
            },
            "type": "object"
