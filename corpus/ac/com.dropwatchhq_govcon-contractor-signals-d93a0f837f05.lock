      "serverInfo": {
        "name": "govcon-contractor-signals",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "contractor_signals",
          "description": "Given a federal contractor NAME, return its acquisition-likelihood / rising-contractor signal profile: a 0-100 pattern-based score with full reasoning, plus award-velocity, multi-year trajectory, agency/NAICS mix, biggest win, set-aside footprint, and (if public) SEC EDGAR ticker + recent corporate-event filings. Built on PUBLIC USAspending.gov + EDGAR data. Probabilistic leading-signal estimate — NOT certainty, NOT insider/MNPI, NOT investment advice.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Contractor name, e.g. 'Palantir' or 'ECS Federal'.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1d32c11439697257101e8da4ecd7a84872b8f97acfa08ef6a9ddb6316515c91"
        },
        {
          "name": "rising_contractors",
          "description": "Return the current ranked 'Rising Contractors / Likely M&A Targets' feed — small/mid federal contractors showing the strongest leading acquisition signals, refreshed daily.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max rows (default 20).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:680f478bd173835baeca963977cb4c905f6516f474f8cdcf371a680de278b147"
        },
        {
          "name": "search_awards",
          "description": "Direct live search of US federal awards (USAspending.gov) by NAICS, agency, recipient, keyword, date and $ range.",
          "inputSchema": {
            "properties": {
              "agency": {
                "type": "string"
              },
              "end": {
                "type": "string"
              },
              "keyword": {
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "maxAmount": {
                "type": "number"
              },
              "minAmount": {
                "type": "number"
              },
              "naics": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recipient": {
                "type": "string"
              },
              "start": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24084fb3573603e66f3259ffb834093643629caaec2108a6363b702bfff6c7c7"
        }
      ],
