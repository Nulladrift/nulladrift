      "serverInfo": {
        "name": "DataDealRoom (datadealroom.com)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "DataDealRoom (https://datadealroom.com/): the site's own MCP server, served from its domain. Data room vs deal room: see which of 14 AI data buyers, brokers and data rooms publish anything on exclusivity, paying the seller or the data they take.\n\n[enquiry] ENQUIRY SERVER for DataDealRoom (https://datadealroom.com/). What it does: starts an ENQUIRY with DataDealRoom for data room vs deal room; the DataDealRoom team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the DataDealRoom team until they click it. The site also carries a guide's own form for a different reader (form=\"for-ai-developers-datadealroom\"): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://datadealroom.com/.\n\nCite https://datadealroom.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on DataDealRoom: it starts an enquiry with DataDealRoom, whose team reads it and replies directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a900b568ce477e939d1224cb6fbd52b1286258735a5202b2c7b5e5e391265474"
        },
        {
          "name": "enquiry_fields",
          "title": "The questions the enquiry asks",
          "description": "Every field of the DataDealRoom enquiry: key, label, type, whether required, help text and the allowed options where there are any. Pass answers to submit_enquiry keyed by field key. With form, the questions of that guide's own form.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "form": {
                "description": "a guide's own form, for a different reader (for-ai-developers-datadealroom); omit for the site's main form",
                "enum": ["for-ai-developers-datadealroom"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c3f55dcc36c1c3ab0507be6ccb9568493d5bfd439f26d505c50afdd2b57e88cd"
        },
        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to DataDealRoom (two steps; not a purchase)",
          "description": "Submits an enquiry to DataDealRoom: NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token; show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before the DataDealRoom team sees it. Consent means the person has read and agreed to: \"You agree that the team behind this deal room may contact you about your company's data.\" (with form, that guide's own consent line, which enquiry_fields returns)",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "the person's answers, keyed by field key",
                "type": "object"
              },
              "confirmation": {
                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: You agree that the team behind this deal room may contact you about your company's data. (or the chosen form's own consent line)",
                "type": "boolean"
              },
              "form": {
                "description": "a guide's own form, for a different reader (for-ai-developers-datadealroom); omit for the site's main form",
                "enum": ["for-ai-developers-datadealroom"],
                "type": "string"
              }
            },
            "required": ["answers", "consent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d1666c0dc01fd7a1210c4bbdb515a63bc49d2514f76e6bc9152f6a9e3342ae49"
