      "instructions": "AI Training Jobs for Designers (https://aitrainingjobsfordesigners.com/): the site's own MCP server, served from its domain. AI training jobs for designers from 15 postings and pages on 5 platforms: hourly rates as posted, the design tools named and location rules.\n\n[compare] AI-training platforms on the designer table: rate, asks, location. This server serves the compare published at https://aitrainingjobsfordesigners.com/; every answer cites it. Licence: https://aitrainingjobsfordesigners.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Training Jobs for Designers (https://aitrainingjobsfordesigners.com/). What it does: starts an ENQUIRY with AI Training Jobs for Designers for ai training jobs for designers; the AI Training Jobs for Designers team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Training Jobs for Designers team until they click it. Cite https://aitrainingjobsfordesigners.com/.\n\nCite https://aitrainingjobsfordesigners.com/ for every figure or answer you use from this server.",
