      "tools": [
        {
          "name": "ansr_golf_ev_engine",
          "description": "Deterministic 157,480-point Golf Expected Value (EV), Strokes Gained (SG), ShotCircleV2 Dispersion & National 2,005 Golf Courses (4,647 courses / 41,812 valid holes GPS; raw 41,825 rows, 13 anomalous rows quarantined / 全国2,005ゴルフ場・4,647コース・有効41,812ホール［原始41,825行・異常13行検疫除外済］) calculation engine tailored to 62 player skill scores (64 to 125 / 8 preset tiers from World Ranker to 90s) and 16 driving distance bands (180 to 330 yards). Supports 6 modes: \"ev\", \"sg\", \"dispersion\", \"strategy\", \"course_search\" (Japanese golf courses & hole GPS coordinates), and \"hole_strategy\" (hole-by-hole GPS GamePlan, bearing, SG=0 landing coordinates & tee/approach ShotCircle dispersion). [x402: $0.005 USDC | Apify: https://apify.com/andque/ansr-golf-strokes-gained-ev-engine]",
          "inputSchema": {
            "properties": {
              "coreScore": {
                "default": 81,
                "description": "Player benchmark score (64 to 125). Overrides skillLevel if specified.",
                "maximum": 125,
                "minimum": 64,
                "type": "integer"
              },
              "courseId": {
                "description": "[Mode \"course_search\" | \"hole_strategy\"] Exact course ID from ansr_course_profiles.",
                "type": "string"
              },
              "courseName": {
                "description": "[Mode \"course_search\" | \"hole_strategy\"] Sub-course name filter (e.g. \"Out\", \"In\", \"東\", \"西\").",
                "type": "string"
              },
              "currentDistanceYards": {
                "description": "[Mode \"strategy\"] Optional current distance to the hole in yards to compute required advance yardage.",
                "type": "number"
              },
              "distance": {
                "description": "[Mode \"ev\" | \"dispersion\"] Remaining distance to the pin (e.g. 150).",
                "type": "number"
              },
              "drivingDistance": {
                "default": 230,
                "description": "Player average driver distance in yards (rounded to nearest 10-yard band between 180 and 330).",
                "maximum": 330,
                "minimum": 180,
                "type": "number"
              },
              "end": {
                "description": "[Mode \"sg\"] Ending state after the shot: { distance, unit, lie } (use lie=\"hole_out\" or distance=0 when holed).",
                "properties": {
                  "distance": {
                    "type": "number"
                  },
                  "lie": {
                    "type": "string"
                  },
                  "unit": {
                    "enum": ["yards", "meters", "feet"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "facilityName": {
                "description": "[Mode \"course_search\" | \"hole_strategy\"] Golf facility name filter (e.g. \"ヒバリゴルフクラブ\").",
                "type": "string"
              },
              "holeNumber": {
                "description": "[Mode \"hole_strategy\"] Specific hole number (1-18). Omit to compute the full GamePlan for all holes in the course.",
                "maximum": 18,
                "minimum": 1,
                "type": "integer"
              },
              "includeHoles": {
                "default": true,
                "description": "[Mode \"course_search\"] Include hole-by-hole GPS coordinates and yardages.",
                "type": "boolean"
              },
              "isObRetee": {
                "default": false,
                "description": "[Mode \"sg\"] True if the shot went Out-of-Bounds (OB) requiring a re-tee (SG = -2.0).",
                "type": "boolean"
              },
              "lie": {
                "default": "fairway",
                "description": "[Mode \"ev\" | \"dispersion\"] Current ball lie.",
                "enum": ["tee", "teeShot", "fairway", "rough", "bunker", "trouble", "green", "fringe", "hole_out"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "[Mode \"course_search\"] Maximum courses to return (1-20, default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "default": "ev",
                "description": "Calculation mode: \"ev\" (Shot/Putt Expected Value & lie penalties), \"sg\" (Strokes Gained between start and end states), \"dispersion\" (ShotCircle landing dispersion ellipse & 8-level benchmarks), \"strategy\" (Target EV reverse distance lookup), \"course_search\" (Search 2,005 Japanese golf facilities / 4,647 courses / 41,812 valid holes [raw 41,825 rows; 13 anomalous rows quarantined] GPS data), or \"hole_strategy\" (Hole-by-hole GPS GamePlan, SG=0 landing coordinates & tee/approach dispersion for a real course).",
                "enum": ["ev", "sg", "dispersion", "strategy", "course_search", "hole_strategy"],
                "type": "string"
              },
              "penalty": {
                "default": 0,
                "description": "[Mode \"sg\"] Penalty strokes incurred on the shot (default 0).",
                "type": "number"
              },
              "queries": {
                "description": "Optional batch of up to 10 queries in a single request.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "description": "[Mode \"course_search\" | \"hole_strategy\"] Golf facility name, kana, or English substring (e.g. \"ヒバリゴルフクラブ\", \"Hibari\", \"ゴールド札幌\").",
                "type": "string"
              },
              "region": {
                "description": "[Mode \"course_search\"] Region filter (e.g. \"関東\", \"近畿\", \"九州\").",
                "type": "string"
              },
              "shape": {
                "default": "straight",
                "description": "[Mode \"dispersion\" | \"strategy\" | \"hole_strategy\"] Shot shape (\"straight\", \"fade\", or \"draw\").",
                "enum": ["straight", "fade", "draw"],
                "type": "string"
              },
              "skillLevel": {
                "description": "Optional preset skill level name or code: \"World Ranker\" (W↑: 68/300y), \"National Ranker\" (G↑: 70/270y), \"Professional\" (N↑: 72/270y), \"Scratch\" (0-: 75/250y), \"Under 5\" (5↓: 78/250y), \"Single\" (S↓: 81/230y), \"80s\" (8↓: 89/200y), \"90s\" (9↓: 98/200y).",
                "type": "string"
              },
              "stage": {
                "default": "approach",
                "description": "[Mode \"dispersion\"] Shot stage (\"tee\" or \"approach\").",
                "enum": ["tee", "approach"],
                "type": "string"
              },
              "start": {
                "description": "[Mode \"sg\"] Starting state before the shot: { distance, unit, lie }.",
                "properties": {
                  "distance": {
                    "type": "number"
                  },
                  "lie": {
                    "type": "string"
                  },
                  "unit": {
                    "enum": ["yards", "meters", "feet"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "state": {
                "description": "[Mode \"course_search\"] Prefecture filter (e.g. \"兵庫県\", \"千葉県\", \"北海道\").",
                "type": "string"
              },
              "targetEV": {
                "default": 3,
                "description": "[Mode \"strategy\"] Target Expected Value (strokes to hole out, e.g. 3.0) to reverse-solve for required remaining fairway distance.",
                "type": "number"
              },
              "unit": {
                "default": "yards",
                "description": "[Mode \"ev\" | \"dispersion\"] Distance unit (\"yards\", \"meters\", or \"feet\").",
                "enum": ["yards", "meters", "feet"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db82e4ab101c2eca8a8ffa655ba162a1dd7df254b05da555184bbe528b5522ba"
        },
        {
          "name": "ats_jobs",
          "description": "Normalized job postings from official Greenhouse, Lever, Ashby, and Japanese tech career boards in one JSON schema, with SHA-256 per-job delta status (new, changed, removed, unchanged). [x402: $0.006 USDC | Apify: https://apify.com/andque/ats-jobs-delta-feed]",
          "inputSchema": {
            "properties": {
              "boards": {
                "description": "List of ATS boards to scrape and compute delta for.",
                "items": {
                  "properties": {
                    "ats": {
                      "enum": ["greenhouse", "lever", "ashby"],
                      "type": "string"
                    },
                    "boardSlug": {
                      "type": "string"
                    }
                  },
                  "required": ["boardSlug"],
                  "type": "object"
                },
                "type": "array"
              },
              "includeDelta": {
                "default": false,
                "type": "boolean"
              },
              "includeDescriptionText": {
                "default": false,
                "type": "boolean"
              },
              "limit": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "maxJobs": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "maxJobsPerBoard": {
                "default": 100,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "onlyDeltaChanges": {
                "default": false,
                "type": "boolean"
              },
              "since": {
                "description": "Optional ISO-8601 timestamp (e.g. \"2026-11-22T00:00:00Z\") to replay all job delta events (new/changed/removed) observed since that timestamp. Defaults to a 24-hour retention window so multiple customers receive identical daily deltas.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f3013a72d37dda2a6764aa26cc38dba34587b8ba0ee93d277753eed8657029c4"
        },
        {
          "name": "audit_domain_spf_dmarc_deliverability",
          "description": "Audit SPF and DMARC DNS TXT policies (reject, quarantine, none, pct) and calculate a deterministic 0-100 email deliverability authentication score for 1 to 5 corporate domains. (Backed by domain-lookup | x402: $0.006 USDC | Apify: https://apify.com/andque/domain-email-stack-lookup)",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "List of 1 to 5 domain names to inspect per request (e.g. [\"cloudflare.com\", \"andque.com\"]). Requests with 6+ domains are rejected with HTTP 400.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "includeEmailPosture": {
                "default": true,
                "description": "Include SPF/DMARC parsing and deliverability scoring ($0.008 event)",
                "type": "boolean"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:004470b7039f70a4c8f8e619be3fd080bed233d5b819ed0a3e020d302dd8a2c6"
