        {
          "name": "audit_jp_vendor_onboarding_compliance",
          "description": "Perform automated Japanese vendor onboarding compliance verification: 13-digit Mod-9 check digit validation, active invoice issuer check, co-located address density check, and administrative publication check. (Backed by jp-entity-reputation | x402: $0.006 USDC | Direct x402 & X-MCP-API-Key)",
          "inputSchema": {
            "properties": {
              "amendmentsOnly": {
                "description": "In \"edinet_gc_amendments\" mode, when true returns only amended securities/quarterly/semi-annual reports (訂正報告書) with XBRL before/after element diff metadata.",
                "type": "boolean"
              },
              "companyScale": {
                "description": "In \"gov_qualification\" mode, statutory company scale (\"large\" 大企業, \"sme\" 中小企業, or \"micro\" 小規模企業).",
                "enum": ["large", "sme", "micro"],
                "type": "string"
              },
              "corporateNumber": {
                "description": "13-digit Japanese Corporate Number with valid NTA Mod-9 check digit (e.g. \"6010001269339\", \"3120001079845\").",
                "type": "string"
              },
              "corporateNumbers": {
                "description": "Batch of 1 to 1,000 13-digit Japanese Corporate Numbers.",
                "items": {
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "docId": {
                "description": "In \"edinet_gc_amendments\" mode, 8-character EDINET filing document ID (e.g. \"S100ABCD\").",
                "type": "string"
              },
              "domain": {
                "description": "Filter or lookup by normalized official corporate website host (e.g. \"andque.com\", \"iij.ad.jp\").",
                "type": "string"
              },
              "domains": {
                "description": "Batch of 1 to 1,000 corporate domains for counterparty batch verification.",
                "items": {
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "edinetCode": {
                "description": "In \"edinet_gc_amendments\" mode, 6-character FSA EDINET submitter code (e.g. \"E02144\").",
                "type": "string"
              },
              "entityName": {
                "description": "Organization or corporate legal name for Zero-PII OFAC SDN Entity sanctions screening.",
                "type": "string"
              },
              "entityNames": {
                "description": "Batch of 1 to 1,000 organization names for Zero-PII OFAC SDN Entity sanctions screening.",
                "items": {
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "excludeGoingConcern": {
                "description": "In \"screen\" / \"filter\" mode, when true excludes corporations with active EDINET Going Concern notes or Going Concern material events.",
                "type": "boolean"
              },
              "excludeHighDensity50Plus": {
                "description": "When true, excludes corporations registered at addresses with 50 or more co-located active corporations.",
                "type": "boolean"
              },
              "excludeLapsedLei": {
                "description": "In \"screen\" / \"filter\" mode, when true excludes corporations whose GLEIF LEI status is LAPSED.",
                "type": "boolean"
              },
              "excludeParrySpamObserved": {
                "description": "When true, excludes entities with observed PARRY unsolicited outbound domain/telephone matches, published administrative sanction records, or revoked/expired invoice registration.",
                "type": "boolean"
              },
              "excludeRecentEdinetAmendments": {
                "description": "In \"screen\" / \"filter\" mode, when true excludes corporations that filed recent amended securities reports on EDINET.",
                "type": "boolean"
              },
              "goingConcernOnly": {
                "description": "In \"edinet_gc_amendments\" mode, when true returns only corporate filings with statutory Going Concern notes (継続企業の前提に関する注記), Going Concern material events (重要事象等), or auditor Going Concern emphasis.",
                "type": "boolean"
              },
              "hasBicOnly": {
                "description": "In \"gleif_lei\" mode, when true returns only Japanese corporations with registered SWIFT BIC codes.",
                "type": "boolean"
              },
              "keyword": {
                "description": "Optional substring filter across corporate name, municipality, or domain.",
                "type": "string"
              },
              "lapsedOnly": {
                "description": "In \"gleif_lei\" mode, when true returns only Japanese corporations whose LEI annual renewal status is LAPSED.",
                "type": "boolean"
              },
              "lei": {
                "description": "20-character ISO 17442 Legal Entity Identifier (e.g. \"5493006W3QUS5LMH6R84\" for Toyota Motor Corporation).",
                "type": "string"
              },
              "leis": {
                "description": "Batch of 1 to 1,000 20-character ISO 17442 LEI codes.",
                "items": {
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "limit": {
                "default": 50,
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "maxAddressDensity": {
                "description": "Maximum number of active corporations registered at the same normalized building address (e.g. 49 or 50 to exclude high-density co-located addresses).",
                "minimum": 1,
                "type": "integer"
              },
              "maxNameChangeCount": {
                "description": "Maximum historical corporate name change count.",
                "minimum": 0,
                "type": "integer"
              },
              "maxRelocationCount": {
                "description": "Maximum historical head-office relocation count.",
                "minimum": 0,
                "type": "integer"
              },
              "minQualificationGrade": {
                "description": "Minimum statutory procurement qualification grade (\"A\" highest through \"D\") in \"gov_qualification\" or \"screen\" mode.",
                "enum": ["A", "B", "C", "D"],
                "type": "string"
              },
              "mode": {
                "default": "lookup",
                "description": "Query mode: \"lookup\" / \"batch\" for O(1) 13-digit corporate number or domain batch lookup (1 to 1,000), \"screen\" / \"filter\" for multi-condition corporate substance & co-located address density filtering, \"gleif_lei\" for ISO 17442 LEI / English corporate name / BIC / LAPSED lookup across Japanese LEI corporations, \"ofac_sanctions\" for Zero-PII U.S. Treasury OFAC organizational sanctions screening, \"gov_qualification\" for Digital Agency Unified Government Qualification (全省庁統一資格) A–D grade & company scale lookup across 16,247 qualified corporations, or \"edinet_gc_amendments\" for FSA EDINET API v2 Going Concern notes & amended securities report XBRL numeric diffs.",
                "enum": ["lookup", "batch", "screen", "filter", "gleif_lei", "ofac_sanctions", "gov_qualification", "edinet_gc_amendments"],
                "type": "string"
              },
              "prefecture": {
                "description": "Prefecture name or code (e.g. \"東京都\", \"大阪府\", \"13\").",
                "type": "string"
              },
              "prefectureCode": {
                "description": "2-digit JIS prefecture code (\"01\" to \"47\", e.g. \"13\" for Tokyo, \"27\" for Osaka).",
                "type": "string"
              },
              "qualificationGrade": {
                "description": "In \"gov_qualification\" mode, exact statutory procurement qualification grade (\"A\", \"B\", \"C\", or \"D\").",
                "enum": ["A", "B", "C", "D"],
                "type": "string"
              },
              "requireGleifLei": {
                "description": "In \"screen\" / \"filter\" mode, when true requires the corporation to hold an active or registered GLEIF LEI.",
                "type": "boolean"
              },
              "requireInvoiceRegistered": {
                "description": "When true, requires active NTA Qualified Invoice Issuer registration without revocation or expiration.",
                "type": "boolean"
              },
              "requireRealBusinessSignal": {
                "description": "When true, requires at least one verified public activity signal (government procurement award, subsidy approval, patent/trademark, permit certification, financial disclosure, or official corporate domain).",
                "type": "boolean"
              },
              "secCode": {
                "description": "In \"edinet_gc_amendments\" mode, 4- or 5-character Japanese securities code (e.g. \"7203\" or \"72030\").",
                "type": "string"
              },
              "walletAddress": {
                "description": "Crypto wallet address (EVM/Base/ETH 0x..., BTC, SOL, TRX, etc.) for OFAC SDN Digital Currency Address sanctions screening.",
                "type": "string"
              },
              "walletAddresses": {
                "description": "Batch of 1 to 1,000 crypto wallet addresses for pre-settlement OFAC sanctions screening.",
                "items": {
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
