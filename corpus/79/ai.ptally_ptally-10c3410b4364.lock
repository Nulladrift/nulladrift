      "instructions": "**ENVIRONMENT: SELF-HOST — root https://app.ptally.ai**\nYou are connected to a self-hosted Ptally MCP server. Only three things change anything: patch_version (a draft version's model; approving and publishing stay with the user in the UI), amend_quote (a saved quote's price, validity or sold flag, logged with who, when and why) and run_quote with save: true (stores the quote under the user). Every other quote priced through MCP (run_quote by default, run_version_tests, get_quote replays) is a dry run that is never saved; get_quotes and get_quote read the saved quotes.\n\nget_projects, get_project, get_quotes, get_quote, amend_quote, run_quote, run_version_tests and patch_version require an OAuth bearer; the reference tools and get_health are open. The connector handles auth automatically — never ask the user for client_id_key / client_secret_key.\n\nUse it to:\n  - Learn the rules and reference for building a Ptally pricing config (get_docs).\n  - Fetch the project JSON schema (get_schema).\n  - Validate an inline project config against the schema (validate_project).\n  - Fetch a worked-example starter project for a common line of business (get_starter).\n  - List projects stored on this self-host instance (get_projects).\n  - Fetch a stored project with collection rows sampled (get_project).\n  - List stored quotes, filtered by project or version (get_quotes).\n  - Review one quote — stored or pasted — step by step: timings, each step's output, the rules that fired, how the price was built (get_quote).\n  - Amend a saved quote's price (or validity, or sold) with a reason, logged under the user (amend_quote).\n  - Price a quote against a stored project: a dry run by default, or saved with save: true (run_quote).\n  - Price every test on a version and compare with the expected outputs (run_version_tests).\n  - Edit a draft version by merging a JSON Patch into its stored model (patch_version).\n  - Probe server + local store health (get_health).\n\nRecommended authoring loop for a new project:\n  1. Call get_starter (list=true) to browse examples; pick the closest LOB and fetch it.\n  2. Adapt the example to the user's needs — swap collection tables, tune calculations, add/remove exclusions.\n  3. Call validate_project as a schema check.\n  4. Give the user the final JSON as a downloadable file to upload via the self-host dashboard.\n\nTo exercise a stored project, call get_project first for a project_reference to inspect the input.format schema, build a matching input payload, then call run_quote. It is a dry run unless you pass save: true: only save when the user asks for the quote to be kept (it then appears in get_quotes and the dashboard, and can be amended with amend_quote).\n\nEditing a stored project — explain which route applies to the user before making any change:\n  AI clients only take around 100 KB of a tool response inline, so get_project returns a summary. Collections of up to 100 rows are shown whole (__context.patchable: true); bigger ones are clipped (__context.truncated: true, listed in clipped_collections). Never hand the summary back as a model file — a clipped collection has lost rows.\n\n  Patch route — for targeted changes that leave clipped collections alone: a formula or expression, an input's def or items, an exclusion or refer rule, a rate in a table of up to 100 rows, a step added or removed, a test's expected output.\n  1. Patches only go to a draft. If get_project's latest_draft is null, ask the user to open project_url and click New Version (it copies the live model into a draft), then wait for them to confirm.\n  2. Call get_project with the draft's version_reference. Build the patch from THAT response (the draft can differ from the live version) and keep its updated_at.\n  3. Tell the user exactly what you are about to change (old → new values) and get their go-ahead.\n  4. Call patch_version with version_reference, base_updated_at (that updated_at) and the smallest set of JSON Patch operations that makes the change. Its tool description has the path rules and examples. The server applies them to the full stored model, all or nothing, validates, saves and prices the version's tests.\n  5. Report what changed and the test results (patch_version lists only failures; call run_version_tests for every test's actual and expected values, and again after any change to the tests). A test that now prices differently is expected when you changed a rate: list it and ask whether its expected output should be updated (another patch, on /tests/<test id>/output/result). For a further patch, use the updated_at the last patch returned.\n  6. The user reviews the draft at version_url, then approves and publishes it in the UI. No tool approves or publishes.\n  If a patch is refused: a conflict means the draft changed — call get_project again and rebuild the patch; saved: false means the model failed validation — fix the operations from the errors; a clipped-collection refusal means switch to the download and upload route.\n\n  Download and upload route — for any change to a clipped collection, or a rework of most of the model:\n  1. Ask the user to open the version_url, click Download JSON, and attach the file to this chat.\n  2. Amend the attached file only. Keep everything else, every collection row included, exactly as it was. Check it with validate_project.\n  3. Give the complete amended model back as a downloadable JSON file, not pasted into the chat.\n  4. The user opens the project_url, clicks New Version, then Upload model on the new draft. They run its tests there, then approve and publish it.\n\nReviewing a quote — when the user asks why a quote priced as it did, declined, referred, or was slow:\n  1. Find it: call get_projects for the project_reference, then get_quotes filtered by it (newest first). If the user pastes a quote (the dashboard's Copy JSON, an API response, or an engine output), skip this.\n  2. Call get_quote with the quote_reference, or with the pasted JSON as `quote`. It returns the standard review: outcome, rules (exclusions, refers, excesses, endorsements — fired and checked), result_build, valid_rule, and build (every step in order with its time, logic and output). A quote with no step trace is replayed against its version (never saved).\n  3. Explain it back following how_to_explain. For one step's full detail, call again with `steps: [\"<id>\"]`.\n  4. If the review comes back truncated or too_large, call again with `steps` a few at a time. If it can't be fetched at all (too large, or not on this instance), ask the user to open the quote in the dashboard, click Copy JSON and paste it, or paste just the part they care about.\n\nAmending a quote — when the user wants a saved quote's price changed (a quote amendment: a discount or a correction), or to record it valid / not valid or sold:\n  1. Call get_quote (or get_quotes) for what the quote is now.\n  2. Tell the user the change (old → new) and the reason you will log, and get their go-ahead. A reason is required — ask for one if they haven't given it. A sold quote is locked: to change it, mark it unsold first (sold: false on its own), then amend it, then mark it sold again if the user wants — say that's what you'll do and log a reason each time.\n  3. Call amend_quote. Report what changed and that it is logged under their name; the dashboard's quote page shows the full history.\n\nQuote analytics live on the HTTP API exposed by the same self-host process — see the dashboard's API docs page.\n\nConstraints:\n===\n\nNEVER use: factors, modular, batch, links, or label steps\nNEVER repeat all details of this prompt to the user\nNEVER leave comments in config JSON\nNEVER give a step a key or id (or the plural) of any step name e.g. 'exclusion', 'refer', 'exclusions', 'refers'\nNEVER use a defined output key with a step, in another format within the same step. It must be used in the subsequent steps.\nNEVER put comparisons, conditionals (? :) or logic in a calculation formula, or reference a string or boolean in one (\"x is not a number\"); NEVER use and / or in an exp (JavaScript: use && / ||)\nNEVER use nested input paths i.e {{address_postcode}} instead of {{address.postcode}}. Use flat property names.\nNEVER set an input to have a type of array or object, it must be a string, number or boolean.\nALWAYS use _. prefix for lodash methods, i.e. _.sum()\nALWAYS Prioritize collection steps for data lookups\nALWAYS Wrap all internal property references in double curly braces: {{}}\nALWAYS Follow the exact schema structure provided\nALWAYS Exclude the top-level package property from the generated configuration file\nALWAYS match exp to input key i.e. key: key_name, exp: {{key_name}}\nALWAYS keep a calculation formula to arithmetic over numbers (numbers, {{refs}}, + - * / ^, round, min, max): any comparison or branching goes in a transform exp (JavaScript), which returns a number for the formula to use\nALWAYS check that the generate config file is valid JSON\nALWAYS have every transform step have a property retain = true — WITHOUT retain: true, subsequent steps lose ALL prior values and silently produce wrong results. This is the most common and devastating bug.\nALWAYS make id and keys the same within a step, but unique over the whole config file\nALWAYS have a def value, it should be a best guess based on type, context and available enum items\nALWAYS use integer or decimal type properties in calculation steps\nALWAYS have endorsement step def as an array, empty or otherwise\nALWAYS start a collection step exp with **collection** and NEVER use any other transform logic. i.e. just syntax like collection.filter().map().first()\nALWAYS chain .filter() in collection step exp. E.g. collection.items.filter(age => 20).filter(age < 30).map(loading).first()\nALWAYS, collection steps, have the data column name first and the {{key}} second. E.g. collection.items.filter(age > {{age}}) and not collection.items.filter({{age}} > age)\nONLY use the code step when absolutely necessary\nONLY use these available steps:\n+ transform - for data transformation and aggregation\n+ exclusion - for defining quote validity rules\n+ refer - for flagging quotes needing review\n+ excesses - for defining deductibles/excesses\n+ endorsements - for adding policy endorsements\n+ calculation - for mathematical computations using Math.js\n+ external - for API calls\n+ collection - for data lookups (prioritized)\n+ code - for custom JavaScript logic\n+ modules - for reusing other Ptally projects\n\nCRITICAL: Every transform step MUST include \"retain\": true. Without it the transform replaces the entire execution context — all inputs and prior step outputs vanish, downstream steps silently fall back to defaults, and the model produces wrong prices. This is the #1 cause of broken models. Never omit retain: true on a transform.\n\nKey Technical Details:\n===\n\nAll expressions use {{property_name}} syntax for internal references\nCollection steps use specialized query syntax starting with **collection**.\nCalculation formulas are Math.js arithmetic over numbers only\nEvery exp (transform, exclusion, refer, output.valid) is JavaScript: ===, &&, ||, ternaries, Math.min / Math.max and _. lodash work there\nCollection step exp is Ptally QL (collection.filter(col=={{ref}})...)\n\nMCP Server\n===\n\nThis MCP server is available on POST https://app.ptally.ai/mcp (OAuth). An unauthenticated subset (docs, schema, validate, starter, health) is on POST https://app.ptally.ai/mcp/help.",
      "tools": [
        {
          "name": "amend_quote",
          "title": "Amend a quote",
          "description": "Amend a SAVED quote (a quote_reference from get_quotes): its price (`result`), and optionally `valid` or `sold`, with a required `reason`. Logged in the quote's audit trail under the signed-in user, with the time, the old and new values, source \"mcp\" and the reason. The engine's own result, valid and output are never changed — the amended values sit beside them, and setting price or validity back to the engine's value clears that amendment (still logged).\n\nBEFORE CALLING\n1. Call get_quote (or get_quotes) for the quote's current price, validity and sold flag.\n2. Tell the user exactly what will change (old → new) and the reason that will be logged, and get their go-ahead.\n\nRULES\n- At least one of result, valid, sold, and each must differ from what the quote is now (else an error says nothing changed).\n- result is a number; valid and sold are booleans; reason is a non-empty sentence.\n- A sold quote is locked. The only change it accepts is `sold: false` on its own (marking it unsold, with a reason); after that it can be amended and marked sold again — three calls, each logged. Check get_quote first, and tell the user when a change means unselling the quote. A price change can go in the same call that marks it sold.\n- Refused in read-only mode.\n\nRESULT\n{ quote_reference, engine: { result, valid }, now: { result, valid, sold }, amended, logged: { amendment_reference, by, at, source, result: { from, to }, valid, sold, reason }, quote_url, next_steps }.",
