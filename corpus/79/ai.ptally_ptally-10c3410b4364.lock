        {
          "name": "patch_version",
          "title": "Edit a draft",
          "description": "Change a DRAFT version's stored model with an RFC 6902 JSON Patch, merged on the server. Use it for targeted edits; any change to a clipped collection (__context.patchable: false) goes through download and upload instead (see next_steps in get_project).\n\nBEFORE CALLING\n1. The version must be a draft: use get_project's latest_draft. If it is null, ask the user to click New Version on the project page (it copies the live model), then call get_project again.\n2. Call get_project with the draft's version_reference and build every path from that response. Pass its updated_at as base_updated_at.\n3. Tell the user what you will change (old → new) and get their go-ahead.\n\nPATHS (JSON Pointer)\n- Name steps, tests and other id'd array elements by id (else key) instead of index: /steps/<step id>/... and /tests/<test id>/... Ids survive other steps being inserted or removed in the same patch.\n- Model layout: /meta/..., /input/format/<input key>/... (format is an object keyed by input key), /steps/<id>/..., /output/format/<key>/..., /tests/<id>/...\n- Collection rows by index. Compressed collection ([[col1, col2, ...], [v1, v2, ...], ...]): index 0 is the header row, so the first data row is /collection/1, and a cell is /collection/<row>/<column index>. Uncompressed collection (array of row objects): the first row is /collection/0, and a cell is /collection/<row>/<column name>. Check __context.shape and __context.columns.\n- Append with \"-\" (/steps/-, /steps/<id>/collection/-). Insert at a numeric index; step order is execution order, so a new step goes after the steps whose outputs it reads.\n- Escape \"~\" as ~0 and \"/\" as ~1 inside a segment.\n\nEXAMPLES\n- Change a rate cell: {\"op\":\"replace\",\"path\":\"/steps/region_rates/collection/1/1\",\"value\":4.5}\n- Guard then change: [{\"op\":\"test\",\"path\":\"/steps/base_premium/formula\",\"value\":\"<current formula>\"},{\"op\":\"replace\",\"path\":\"/steps/base_premium/formula\",\"value\":\"<new formula>\"}]\n- Add a table row: {\"op\":\"add\",\"path\":\"/steps/type_factors/collection/-\",\"value\":[\"gravel\",1.1]}\n- Change an input default: {\"op\":\"replace\",\"path\":\"/input/format/bike_value/def\",\"value\":2000}\n- Insert a step as the 5th: {\"op\":\"add\",\"path\":\"/steps/4\",\"value\":{ ...full step object... }}\n- Update a test's expected price: {\"op\":\"replace\",\"path\":\"/tests/t01/output/result\",\"value\":46.1}\n- Add a test: {\"op\":\"add\",\"path\":\"/tests/-\",\"value\":{\"id\":\"young_rider\",\"name\":\"Young rider\",\"key\":\"young_rider\",\"input\":{ ...every input key... },\"output\":{\"result\":52.5,\"valid\":true}}}. Expectations go in output { result, valid }, even if older tests on the model keep them under result.\n\nRULES\n- Smallest change: replace a field, not a whole step; never the whole model (path \"\" is refused).\n- New or replaced steps follow the config constraints in the server instructions (retain: true on transforms, unique id = key, {{}} references, ...).\n- Don't send __context (it's stripped anyway). A clipped collection must stay exactly as stored — no edits, no removal, no replacement with the sample you saw. A patched collection may hold at most 100 rows.\n- All operations apply or none do. At most 200 per call.\n\nRESULT\n{ saved, updated_at, validation, tests: { total, passed, failed, unchecked, failures: [{ test, problems }] }, version_url, next_steps }. saved: false = schema validation failed, nothing stored — fix from validation.errors and retry. A conflict error = the draft changed since you read it — call get_project again and rebuild. Tests are priced after saving and don't block it: report failures and ask whether their expected outputs should change. For every test's actual vs expected values, call run_version_tests. For another patch, use the returned updated_at. Never approves or publishes — the user does that in the UI.",
          "inputSchema": {
            "properties": {
              "base_updated_at": {
                "description": "The draft's updated_at exactly as get_project (called with this version_reference) or the previous patch returned it. A mismatch means someone changed the draft since — the patch is refused.",
                "type": "string"
              },
              "operations": {
                "description": "RFC 6902 JSON Patch operations, applied in order to the full stored model, all or nothing. At most 200.",
                "items": {
                  "properties": {
                    "from": {
                      "description": "Source pointer for move and copy.",
                      "type": "string"
                    },
                    "op": {
                      "description": "test fails the whole patch unless the value at path equals value — use it to guard a change.",
                      "enum": ["add", "remove", "replace", "move", "copy", "test"],
                      "type": "string"
                    },
                    "path": {
                      "description": "JSON Pointer into the model, e.g. /steps/<step id>/formula or /steps/<step id>/collection/1/1. Array elements by id (else key) or index; \"-\" appends.",
                      "type": "string"
                    },
                    "value": {
                      "description": "New value for add, replace and test: any JSON (a number, string, row array, row object or whole step)."
                    }
                  },
                  "required": ["op", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "version_reference": {
                "description": "UUID of the draft version to patch: get_project's latest_draft.version_reference. Never a published or approved version.",
                "type": "string"
              }
            },
            "required": ["base_updated_at", "operations", "version_reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "ptally/requires_auth": true,
            "ptally/summary": "Makes changes to a draft version of a project, checks the result and prices its tests. Only drafts change; you still approve and publish in the dashboard. Rate tables over 100 rows can't be changed this way.",
            "swallow/requires_auth": true,
            "swallow/summary": "Makes changes to a draft version of a project, checks the result and prices its tests. Only drafts change; you still approve and publish in the dashboard. Rate tables over 100 rows can't be changed this way."
          },
          "digest": "sha256:0e0ea85e29fc52a06f4197bdd6090abfeae55b361fd58f44b44dbbc2f82a4a2e"
        },
        {
          "name": "run_quote",
          "title": "Try a quote",
          "description": "Price a quote against a stored project: a dry run by default, saved only with `save: true`. Takes `project_reference`, an optional `version_reference` (defaults to the latest live version; there is no fallback to drafts, so pass `version_reference` to price one — it must belong to the project and not be archived, else a tool error), and an `input` payload that matches the project's input schema. Runs the pricing engine and returns the quote envelope — `output`, `result`, `valid`, `status`, `error`, the engine's `errors` log, `exec_time_ms`, `dry_run: true` and a null `quote_reference` — WITHOUT persisting a quotes row. With `save: true` the quote is stored like a POST /quotes, under the signed-in user (an engine error is stored as an error quote), and the envelope carries `dry_run: false`, its `quote_reference`, `created_at` and `quote_url`; it then shows in get_quotes and the dashboard and can be amended with amend_quote. Only save when the user asks for the quote to be kept, not to try inputs. Saving is refused in read-only mode. Call get_project first to inspect `input.format` and build a valid input.",
          "inputSchema": {
            "properties": {
              "input": {
                "description": "Flat quote input object matching the project's input.format schema. Use get_project to discover the required keys.",
                "type": "object"
              },
              "project_reference": {
                "description": "UUID of the project to price against.",
                "type": "string"
              },
              "save": {
                "description": "Optional, default false (dry run, nothing stored). true stores the quote under the signed-in user and returns its quote_reference. Only when the user asks for the quote to be kept.",
                "type": "boolean"
              },
              "source": {
                "description": "Optional engine `source` label passed through to the model. Defaults to \"mcp\".",
                "type": "string"
              },
              "version_reference": {
                "description": "Optional. Specific non-archived version UUID of this project; defaults to the latest live version (no fallback to drafts).",
                "type": "string"
              }
            },
            "required": ["input", "project_reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "ptally/requires_auth": true,
            "ptally/summary": "Works out a price for a project from the details you give it. Nothing is saved unless you ask for it to be, so it's safe to try as often as you like.",
            "swallow/requires_auth": true,
            "swallow/summary": "Works out a price for a project from the details you give it. Nothing is saved unless you ask for it to be, so it's safe to try as often as you like."
          },
          "digest": "sha256:56bc72c68bbeb3da22ca7d65108052b7e20379b9c23b3aa388ebc6184581a4e6"
        },
        {
          "name": "run_version_tests",
          "title": "Run a version's tests",
          "description": "Price every test in a version's tests[] against that version's stored model and compare each with its expected output. Takes `version_reference` (any status but archived — a draft after patch_version, or a live version for a baseline). Runs against the stored model, so a patch saved a moment ago is included. A test passes when its result is within 0.005 of the expected result and its valid flag equals the expected valid. Expectations are read from output { result, valid }, or, when output has neither (tests imported from the hosted service), from result { result, valid }; `expected_from` says which. A test with neither is priced but unchecked (passed: null). Returns `{ project_reference, version_reference, version, status, updated_at, total, passed, failed, unchecked, results: [{ id, name, passed, expected: { result, valid }, expected_from, actual: { result, valid }, problems, errors }], version_url, next_steps }` — `problems` says why a test failed, `errors` is up to 5 of the engine's step errors for that run. Nothing is persisted. Use after patch_version, after adding or changing tests, or before a change to record the baseline. To change a test's expected output, patch_version on /tests/<test id>/output/result (drafts only) — output takes precedence over result.",
          "inputSchema": {
            "properties": {
              "version_reference": {
                "description": "UUID of the version whose tests to run — e.g. get_project's latest_draft.version_reference, or the version_reference patch_version returned.",
                "type": "string"
              }
            },
            "required": ["version_reference"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ptally/requires_auth": true,
            "ptally/summary": "Prices every test saved on a version and shows which ones match their expected price and which don't. Nothing is saved.",
            "swallow/requires_auth": true,
            "swallow/summary": "Prices every test saved on a version and shows which ones match their expected price and which don't. Nothing is saved."
          },
          "digest": "sha256:96278e355baed79836b90bb35b600f1620ab280b1d8a40deb9619aab669acab6"
        },
        {
          "name": "validate_project",
          "title": "Check a model for mistakes",
          "description": "Server-side schema validation of a project config. Returns { valid: true/false, errors: [...] } with the JSON path, keyword, and message for each issue. Prefer local validation against get_schema during authoring; use this as a ground-truth check, including on an amended model before handing it back to the user as a file. Pass exactly one of inline `project` or a base64-gzipped `project_gz` (if the inline form is too large for your client); passing neither or both returns an error result.",
          "inputSchema": {
            "properties": {
              "project": {
                "properties": {
                  "input": {
                    "type": "object"
                  },
                  "meta": {
                    "type": "object"
                  },
                  "output": {
                    "type": "object"
                  },
                  "steps": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "tests": {
                    "items": {
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "input": {
                          "type": "object"
                        },
                        "key": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "output": {
                          "properties": {
                            "result": {
                              "type": "number"
                            },
                            "valid": {
                              "type": "boolean"
                            }
                          },
                          "type": "object"
                        }
                      },
                      "required": ["id", "input", "key", "name", "output"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["input", "meta", "output", "steps"],
                "type": "object"
              },
              "project_gz": {
                "description": "Optional. Base64-encoded gzip of the project JSON, used as an alternative to inline `project` when the caller cannot fit the full payload in a single tool argument. Mutually exclusive with `project`. Pricing JSON typically compresses 5-10x.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ptally/requires_auth": false,
            "ptally/summary": "Checks a pricing model for mistakes and tells you what's wrong and where to find it.",
            "swallow/requires_auth": false,
            "swallow/summary": "Checks a pricing model for mistakes and tells you what's wrong and where to find it."
          },
          "digest": "sha256:0a6281a94fcfc404bc0a2b6c9dffe4b993a9eaa9a5ba3a015e848296274a99b4"
        }
