      "serverInfo": {
        "name": "com.ergini/hire",
        "title": "Ergini: hire an AI engineer",
        "version": "1.0.0",
        "description": "Match a problem to AI builds, see price ranges and case studies, and book a call with Ergin.",
        "websiteUrl": "https://ergini.com/hire/ai-assistant"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only facts about Ergin (Ergini), a senior freelance AI engineer in Pristina, Kosovo, who builds AI integrations, AI workflow automation, AI agents and MVPs for teams in Europe and North America. Use find_use_cases to match a problem to his use case library, get_use_case for one build in detail with its typical price, estimate_project for which service fits a description and its published range, list_services for all services and ranges, list_case_studies for shipped work, and book_call for the booking link. Every price is a published range, never a quote: the price for a specific project comes in writing after a free 30-minute call. Link the user to the URLs in the results rather than restating them from memory.",
      "tools": [
        {
          "name": "book_call",
          "title": "Book a call",
          "description": "Get the link to book a free 30-minute call with Ergin, what to prepare so the call is useful, and what happens after it. It does not book anything itself: give the user the link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Book a call"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d0b21313fc147c96582da951bc567af2409ca547474751ed52e65347b6624472"
        },
        {
          "name": "estimate_project",
          "title": "Estimate a project",
          "description": "Given a free-text project description, say which of Ergin's services fits, its published price range, the tier a build like it usually lands in and the closest use cases. This is a published range, never a quote: the real price comes in writing after a free 30-minute call. Matching is keyword-based, so a description that names the problem, the systems and the volume matches best.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "What should be built, in plain words: the problem, the systems involved, rough volumes. Leave out names, emails and other personal or confidential details.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate a project"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bdac1e5a3948d09ca0cc42c6b2d1c2215d0743bea1ea61b2f6c2b247854a623d"
        },
        {
          "name": "find_use_cases",
          "title": "Find matching use cases",
          "description": "Search Ergin's library of worked AI use cases (support agents, invoice and document automation, sales and lead handling, internal knowledge assistants, MCP servers, legacy rescue and more) for the ones closest to a problem. Pass the problem in plain words, ideally with the systems involved (for example 'supplier invoices arrive by email and get typed into Xero'). Returns the best matches with a one-line summary, the page URL and the typical price range. Follow up with get_use_case for details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many matches to return, 1 to 10. Defaults to 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The problem or task in plain words, with the systems involved if known.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find matching use cases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf53628cf7c7d7d8be5bd33cf22ab7a244f711d67fdfd851d5e92f6d73542115"
        },
        {
          "name": "get_use_case",
          "title": "Get one use case",
          "description": "Get one use case from Ergin's library by its slug (from find_use_cases, or the last part of its ergini.com/use-cases URL): the summary, what the AI does and what people still do, every system it touches, the service it is built as, its typical price tier from the published price table, and related use cases. A hub slug (such as 'finance' or 'shopify') returns the hub and its use cases instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The use case or hub slug, e.g. 'invoice-processing-automation', or its full URL.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one use case"
          },
          "behavior": {
