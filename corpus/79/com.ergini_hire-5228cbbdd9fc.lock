            "readOnly": true
          },
          "digest": "sha256:e57cd74b1a86d18cce992ad3a2742e4ed385b2e8d55286916bd6fd64379d491d"
        },
        {
          "name": "list_case_studies",
          "title": "List case studies",
          "description": "List the products Ergin has shipped and written up as case studies at ergini.com/work, each with the customer's problem in one line, the fix in one line and the page URL. Use it when the user asks for proof, past work or examples.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
