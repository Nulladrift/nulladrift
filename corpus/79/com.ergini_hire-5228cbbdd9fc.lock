            "readOnly": true
          },
          "digest": "sha256:03a142bdd5f86d438de04514e9094430b795e0b1861dc12fa779888c830fed4e"
        },
        {
          "name": "list_services",
          "title": "List services and price ranges",
          "description": "List the five services Ergin offers (AI agent development, AI integration, AI workflow automation, MVP development, embedded engineer), each with a one-line description, its page and its published price range and tiers, plus the hourly option and the free discovery call. Use it when the user asks what Ergin does or what his work costs in general.",
