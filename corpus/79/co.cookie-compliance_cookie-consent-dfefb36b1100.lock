                "additionalProperties": {},
                "description": "Partial overrides of huOptions.design (see help.explainConfigKey for valid keys).",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "globalCookie": {
                "type": "boolean"
              },
              "text": {
                "additionalProperties": {},
