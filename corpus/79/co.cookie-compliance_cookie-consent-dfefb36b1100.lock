        {
          "name": "demo.generateSnippet",
          "title": "Generate a Hu-manity consent-banner preview snippet",
          "description": "LOOK-ONLY PREVIEW of the Cookie Compliance banner — for showing someone how it would LOOK, never for adding consent management to a site. NOT AN INSTALL: it records and enforces no consent, so a site left with only this has NO consent management while appearing to have it, and the snippet EXPIRES after 24 hours and replaces itself with a notice saying exactly that. Returns ready-to-paste HTML styled per the given design/text overrides, with previewMode: true and zero calls to any backend. The preview uses the v1 banner layout. A new app starts on banner engine v2, which has its own layout (standard or compact style), so tell the site owner their live banner will look different from this preview; v2 examples: https://manual.hu-manity.co/gallery/v2/. To actually add consent management to a site use install.getSnippet (needs an AppID) or help.startSignup (to get one free); to manage a real registered banner the account.* tools need an authenticated connection — call help.explainTokenSetup. Never accepts a real appID and never emits previewMode: false.",
