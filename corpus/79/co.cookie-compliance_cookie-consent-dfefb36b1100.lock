        },
        {
          "name": "help.explainTokenSetup",
          "title": "Explain how the customer gets an API token to connect their real account",
          "description": "Returns how a Hu-manity customer connects their real account so the authenticated account.* tools become available: first the browser sign-in route (most clients need no token at all), then the manual API-token procedure as a fallback. Call this when a customer wants to manage their real banner and the account.* tools are not available. Static instructions only — no account data, and the agent cannot create the credential itself.",
