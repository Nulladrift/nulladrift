        {
          "name": "demo.suggestDesign",
          "title": "Make the consent banner match a site — derive and check its design",
          "description": "THE TOOL TO USE when the banner needs to look like the site it sits on. Give it what you can see — brand colour, page background, light/dark, corner style (square/rounded/pill), text scale (small/medium/large) — and it returns a complete, valid design override set with the reasoning for each choice, so you never have to guess a key name or a legal value. It also validates design values you already have, and checks every colour pair a visitor must actually read (body text and headings on the banner background, and button labels on the brand colour) against WCAG AA, picking body text colours by measured contrast and button labels white whenever white reaches 4.5:1 (otherwise the more legible colour). Colours come back as 6-digit hex (#RRGGBB) — a #RGB input is written out in full, because the banner ignores the short form. Themes: light/dark. A font is never derived: pass design.fontFamily (site/sans-serif/serif/system) only when the site owner has chosen one. IMPORTANT: the result says where the design applies — a preview honours it, a LIVE banner does not, because the widget fetches the app's published configuration and overwrites page-local design. To change a real banner use account.previewDesignChange then account.updateDesign, which need an authenticated connection — call help.explainTokenSetup. To see the design on a page without an account, pass it to demo.generateSnippet; to install the real banner use install.getSnippet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "brand": {
                "description": "Facts about the site's own look. Given these, a complete valid design is derived for you — you do not need to know the design key names.",
                "properties": {
                  "brandColor": {
                    "description": "The site's brand/accent colour as hex, e.g. \"#20c19e\" — becomes the banner's button and accent colour.",
                    "type": "string"
                  },
                  "cornerStyle": {
                    "description": "Button corner shape: square (0px), rounded (6px) or pill (25px, the widget default).",
                    "enum": ["square", "rounded", "pill"],
                    "type": "string"
                  },
                  "pageBackground": {
                    "description": "The page's background colour as hex, e.g. \"#0f1117\" — the banner surface is matched to it, and the theme is inferred from it if theme is omitted.",
                    "type": "string"
                  },
                  "textScale": {
                    "description": "Overall text size: small, medium (the widget default) or large.",
                    "enum": ["small", "medium", "large"],
                    "type": "string"
                  },
                  "theme": {
                    "description": "Force a light or dark banner. Inferred from pageBackground when omitted.",
                    "enum": ["light", "dark"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "design": {
                "additionalProperties": {},
                "description": "Explicit huOptions.design overrides to validate. Applied on top of anything derived from brand.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "type": "object"
          },
