        {
          "name": "help.authStatus",
          "title": "Check whether this connection is actually authenticated, and as what",
          "description": "THE TOOL TO USE before assuming a connection is authenticated. account.* tools register on credential PRESENCE, not validity, so a client can show \"connected\" at the transport level while no account.* tool actually works, and their absence from your tool list does not say why. This makes the one real check — the same credential exchange account.* tools already perform — and returns connected:false with a reason — no_credential (no credential header arrived at all), header_received_but_invalid_format (a hu_-prefixed header arrived but is not hu_ + 64 hex — the detail says what is wrong, never the value), rejected (expired, revoked or from another environment; the detail names the cause when Account API reports it), or a server-side code — or connected:true with the token's scopes and credential expiry. Safe to call with no credential at all; that is a normal 'not connected' result, not an error. Never accepts or echoes the token itself.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c9f626c282451720d356126a1262c9e2ebabf8f17d6cf534af5b684e8181cee0"
        },
        {
          "name": "help.explainConfigKey",
          "title": "Look up any banner setting — what it does, and whether changing it is a compliance decision",
          "description": "THE REFERENCE FOR THE BANNER'S SETTINGS, and the tool to call BEFORE proposing a change to a real app, so you name a setting that exists instead of guessing one. Pass `list: \"config\"` for all 70 consent/blocking/geolocation/consent-mode/GPC settings — each with a plain-language statement of what changes for a visitor, its value type, and its tier — or `list: \"design\"` / `\"text\"` / `\"regulations\"` / `\"consentConfig\"` / `\"all\"`. Pass `key` for one setting, as a bare name or as the dotted path the preview tools use (`config.blocking`, `config.regulations.gdpr`, `text.bodyText`). It tells you WHICH pair of account.* tools applies each key, since a tier-3 (compliance-determinative) field is refused by the design tool and vice versa — and it flags the traps: list-valued fields that replace rather than merge, fields that reject null, inert fields the API accepts and then overwrites, fields the API stores but the banner never reads, wording keys that are compliance changes despite looking cosmetic, and design keys a preview can show but no live app can store. Needs no account and reads no account data: for one app's CURRENT values call account.getDesign (authenticated — see help.explainTokenSetup).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "key": {
                "description": "One key to explain. Accepts a bare name (`blocking`, `bodyText`, `bannerBackground`) or a dotted path exactly as the preview tools take it (`config.blocking`, `config.regulations.gdpr`, `design.primaryColor`, `text.bodyText`, `consentConfig.*`). Every match is returned when a bare name exists in more than one vocabulary.",
                "type": "string"
              },
              "list": {
                "description": "Enumerate a whole vocabulary instead of explaining one key: `config` (the 70 BannerConfigJSON settings, each with its tier and consequence), `regulations`, `consentConfig`, `design`, `text`, `snippet` (the huOptions keys that go in the page, including `blocking`, plus preview-only keys that must never go in the page), or `all`. Use this to find out WHICH setting does what you want before naming one — start with `config` for anything about consent categories, geolocation, consent mode or GPC.",
                "enum": ["config", "regulations", "consentConfig", "design", "text", "snippet", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
