      "instructions": "GPU Collateral Loans (https://gpucollateralloans.com/): the site's own MCP server, served from its domain. GPU financing as the parties announced it: a register of each deal's amount, kind of debt, rate or spread, what secures it and its maturity.\n\n[compare] Announced GPU financings. This server serves the compare published at https://gpucollateralloans.com/; every answer cites it. Licence: https://gpucollateralloans.com/terms.\n\n[enquiry] ENQUIRY SERVER for GPU Collateral Loans (https://gpucollateralloans.com/). What it does: starts an ENQUIRY with GPU Collateral Loans for gpu financing; the GPU Collateral Loans team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the GPU Collateral Loans team until they click it. Cite https://gpucollateralloans.com/.\n\nCite https://gpucollateralloans.com/ for every figure or answer you use from this server.",
