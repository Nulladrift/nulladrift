  "subjects": {
    "com.auto-units/autoprint": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://autoprintstudio.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "AutoPrint",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AutoPrint: Print existing artwork on custom wall art, apparel, and gifts.\n\n- Print design: Prepares existing artwork or photos for printing on wall art, apparel, or personalized gifts. Requires artwork_url, a public HTTPS image link, and idea, the desired printed product, size, or style. Imports the supplied image without generating or changing artwork. Recommends a product and returns the artwork with a studio link to preview the product, choose a size, and order on AutoPrint's website. The tool does not generate images, place orders, or take payment. Start it with start_design, then call check_design with the id it returns; it usually takes under a minute.",
      "tools": [
        {
          "name": "check_design",
          "title": "Check a Print design",
          "description": "Where a Print design stands. When it is ready, the full result as text and a link to it on AutoPrint's site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The id start returned.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a Print design"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ad64e6d3f1d64524134fe8d98caed8b645b39d4df8596d0b75d60b1d05fe01c"
        },
        {
          "name": "start_design",
          "title": "Start a Print design",
          "description": "Prepares existing artwork or photos for printing on wall art, apparel, or personalized gifts. Requires artwork_url, a public HTTPS image link, and idea, the desired printed product, size, or style. Imports the supplied image without generating or changing artwork. Recommends a product and returns the artwork with a studio link to preview the product, choose a size, and order on AutoPrint's website. The tool does not generate images, place orders, or take payment.\n\nStarts the work and returns an id. It usually takes under a minute.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "artwork_url": {
                "description": "A public HTTPS link directly to an existing PNG, JPEG, or WebP image under 25 MB. AutoPrint uses this artwork without generating a replacement.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "idea": {
                "description": "The desired printed product, size, or style, such as 'a large framed print'. Describes the print, not new artwork to generate.",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["artwork_url", "idea"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a Print design"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6aaa5eb054240f81969ec386a78a75d7a2b6ea67b9c4f71c4177bf0b28f4b47a"
        }
      ],
      "digest": "sha256:4bdaaf049b4a61685c4e249c5bd508674f2c9d317ffe15a2be006dfb05615c1a"
    }
  }
}
