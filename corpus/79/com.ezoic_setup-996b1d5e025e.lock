{
  "lockfileVersion": 2,
  "subjects": {
    "com.ezoic/setup": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://setup-agent.ezoic.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Ezoic Setup",
        "title": "Ezoic Setup",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "ask",
          "description": "Ask the agent. Full pipeline (schema, queries, analysis). Sync within deadline_seconds; else {status:pending,job_id} — poll request_status/read_response. Pass a stable thread id (UUID) on every call for conversation context. The result carries thread_id, the thread actually used; re-send that value on later calls.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Bundle name. Inferred from the Host header when missing.",
                "type": "string"
              },
              "deadline_seconds": {
                "description": "Synchronous wait budget. Default 240.",
                "type": "number"
              },
              "message": {
                "description": "User prompt for the agent. Either `message` or the legacy `question` alias must be set.",
                "type": "string"
              },
              "question": {
                "description": "Legacy apples-compat alias for `message`. Ignored when `message` is set.",
                "type": "string"
              },
              "role": {
                "description": "Optional role override; defaults to admin for MCP callers.",
                "type": "string"
              },
              "thread": {
                "description": "Persistent conversation id. Either `thread` or the legacy `thread_id` alias must be set.",
                "type": "string"
              },
              "thread_id": {
                "description": "Legacy apples-compat alias for `thread`. Ignored when `thread` is set.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask the agent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eecef3ed06875ab487168c79b3aae32faccdf01188b10a5153802f3e77e161ae"
        },
        {
          "name": "help",
          "description": "Short orientation text for apples MCP callers.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Usage help"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84d2aa7543b06c9d55eca5ba1e7307c8f8b872801c4d935a1d47165bf9f1ee14"
        },
        {
          "name": "read_response",
          "description": "Stream a chunk of a pending ask() job's output.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "Job id returned by a prior ask() call.",
                "type": "string"
              },
              "offset": {
                "description": "Byte offset to start reading from. 0 for the beginning.",
                "type": "number"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read async response"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:787b1b08294b0b0bb33aeb9f39abafb9e29a6e871c22df68bba29eed74b2924e"
        },
        {
          "name": "request_status",
          "description": "Check the status of a pending ask() job.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "Job id returned by a prior ask() call that went async.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check async request status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94744cfa3bfe6a084e481cb694374d5e9d3699693c2afe59cc689fd211dfac60"
        }
      ],
