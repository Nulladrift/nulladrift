  "subjects": {
    "com.ezoic/setup": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://setup-agent.ezoic.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Ezoic Setup",
        "title": "Ezoic Setup",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "ask",
          "description": "Ask the agent. Full pipeline (schema, queries, analysis). Sync within deadline_seconds; else {status:pending,job_id} — poll request_status/read_response. Pass a stable thread id (UUID) on every call for conversation context. The result carries thread_id, the thread actually used; re-send that value on later calls.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Bundle name. Inferred from the Host header when missing.",
                "type": "string"
              },
              "deadline_seconds": {
                "description": "Synchronous wait budget. Default 240.",
                "type": "number"
              },
              "message": {
                "description": "User prompt for the agent. Either `message` or the legacy `question` alias must be set.",
                "type": "string"
              },
              "publisher_id": {
                "description": "Publisher the research is bound to. Only the dedicated research credential may send it; other callers are refused.",
                "type": "number"
              },
              "question": {
                "description": "Legacy apples-compat alias for `message`. Ignored when `message` is set.",
                "type": "string"
              },
              "role": {
                "description": "Optional role override; defaults to admin for MCP callers.",
                "type": "string"
              },
              "thread": {
                "description": "Persistent conversation id. Either `thread` or the legacy `thread_id` alias must be set.",
                "type": "string"
              },
              "thread_id": {
                "description": "Legacy apples-compat alias for `thread`. Ignored when `thread` is set.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask the agent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:52112f69cd990fd2f7d03d4dcc48d576f10d1c0ef28893d31682e86d7ff358d9"
        },
        {
          "name": "help",
          "description": "Short orientation text for apples MCP callers.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Usage help"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84d2aa7543b06c9d55eca5ba1e7307c8f8b872801c4d935a1d47165bf9f1ee14"
        },
        {
          "name": "read_response",
          "description": "Stream a chunk of a pending ask() job's output.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "Job id returned by a prior ask() call.",
                "type": "string"
              },
              "offset": {
                "description": "Byte offset to start reading from. 0 for the beginning.",
                "type": "number"
              },
              "publisher_id": {
                "description": "Publisher the research is bound to. Only the dedicated research credential may send it; other callers are refused.",
                "type": "number"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read async response"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92c85a1eb643b5bead4604c18488ef9887e9c896772467c6606bfb405815403c"
        },
        {
          "name": "request_status",
          "description": "Check the status of a pending ask() job.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "Job id returned by a prior ask() call that went async.",
                "type": "string"
              },
              "publisher_id": {
                "description": "Publisher the research is bound to. Only the dedicated research credential may send it; other callers are refused.",
                "type": "number"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check async request status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
