      "instructions": "Swapwire publishes dated facts about home-services contractor licenses, copied from public records: license status, bonds, insurance, discipline, complaints and city permits.\n\nCoverage:\n- California (state \"CA\", the default): C-20 (HVAC), C-36 (plumbing) and C-42 (sewer and septic) licenses based in Alameda and Contra Costa counties, from the CSLB file, refreshed weekly, with San Francisco permit records.\n- Other states (pass state): CO, CT, FL, IL, KS (Johnson County), MN, NY (mostly New York City), OR, PA (Philadelphia and Pittsburgh), TX, VA and WA contractor business licenses from each state's licensing agency (and New York City's), with discipline, complaint, bond and insurance records where the agency publishes them.\n- Permit-only states (pass state): AZ (Mesa, Phoenix, Scottsdale, Tempe), GA (DeKalb County), HI (Honolulu), LA (New Orleans), MA (Cambridge, Somerville), MI (Detroit), NC (Raleigh), NV (Las Vegas), OH (Cleveland, Columbus, Cincinnati) and TN (Nashville). These are businesses named as the contractor on city permits (record_type \"permits_only\"), with permit counts, outcomes and dates. Swapwire has no copy of these states' license records, so a status of \"Not copied\" says nothing about whether the business is licensed: give the user the license number printed on the permits, if any, and the state lookup link (verify_url).\n\nWhich tool:\n- The user names a contractor or describes a job (\"Diamond Plumbing in Concord\", \"my AC is blowing warm air in Oakland\"): search_licenses.\n- You have a license number, or want the full record for a match: get_license.\n- The user has a quote, invoice, contract, ad or truck photo: check_document, with the license number if you have it.\n- The user asks whether a record is typical for the area: get_area_stats.\n- The user asks what the rules are, not about one contractor (\"is 50% down legal\", \"do I need a permit to replace a water heater\", \"can a handyman do electrical\", \"do I need a license for drywall\"): get_rules, with the state and topic (and the job and city for permits). Do not answer a rules question with a list of contractors.\nA usual flow is search_licenses, then get_license on the match, then tell the user the license number, status, alerts, data date and CSLB link.\n\nUsing the data well:\n- A name match is not proof of identity. Give the user the license number you matched and ask them to confirm it with the contractor.\n- State the data date (data_as_of). For a decision being made today, link the agency's live record (source_record_url or verify_url).\n- No result means the license is not in this dataset. It does not mean the contractor is unlicensed: licenses held under a person's own name are not published.\n- A complaint is an allegation unless its outcome says otherwise. Records matched by business name rather than license number can belong to another business with the same name.\n- The data has no reviews and no prices for individual jobs. Do not infer quality from a missing record.\n- When the user says a contractor took a deposit, abandoned the job or left subcontractors unpaid, call get_license and use its recourse field: the license's own bond and surety, where to complain, and the state's guide.\n- For a gas smell, a carbon monoxide alarm or sparking wiring, tell the user to leave and call the utility or 911.",
      "tools": [
        {
          "name": "check_document",
          "title": "Check a quote, invoice or ad against a license",
          "description": "Check whether a contractor's quote, invoice, contract, business card, ad or truck photo matches a California license in this dataset. Send the document as text, as a PNG or JPEG image (base64), or both, plus the license number to check against (if the text shows a license number from the dataset, it is used). Returns a verdict (consistent, number_only, mismatch or unclear; number_only means only the license number matched, which anyone could copy), whether the business name and license number on the document match the record, whether the work described falls outside the license's classifications, whether the down payment asked for is over California's limit ($1,000 or 10% of the price, whichever is less), and the license's status, bond and workers' comp checks. The verdict is a reading of the document, not proof. The document is read by TypeSafe's Jev model and is not stored by Swapwire; remove a homeowner's personal details before sending if you can.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image_base64": {
                "description": "A photo or scan of the document, base64-encoded PNG or JPEG, up to 5 MB.",
                "type": "string"
              },
              "image_format": {
