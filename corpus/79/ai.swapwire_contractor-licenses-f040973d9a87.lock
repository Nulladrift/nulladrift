                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "unit": {
                      "type": "string"
                    },
                    "value_basis": {
                      "type": "string"
                    },
                    "value_listed_share": {
                      "description": "Permit series only: share of that place's home permits for the job that list a declared value at all, 0 to 1.",
                      "type": ["number", "null"]
                    }
