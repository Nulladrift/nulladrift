        {
          "name": "get_prices",
          "title": "Get home energy job costs from public program records",
          "description": "Median installed cost and the middle half (25th to 75th percentile) for heat pumps, solar, battery storage and weatherization, from public rebate, loan and incentive program records in Oregon, New York, Massachusetts, Connecticut and Delaware, statewide and by county or city. Each series says what the cost includes (usually before the rebate) and whether the program is income-qualified. Loan amounts are not prices. Use it to tell a user whether a quote is in the usual range, and cite the source.",
          "inputSchema": {
