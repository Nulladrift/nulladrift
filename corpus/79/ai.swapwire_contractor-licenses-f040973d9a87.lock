        {
          "name": "search_licenses",
          "title": "Search contractor licenses",
          "description": "Search contractor licenses (California by default; pass state for others) three ways. (1) By business name, as written on a quote, invoice, truck or website: typos, word forms (plumber/plumbing), missing words and Inc/LLC are handled, and other names on the CSLB record are matched too (other_business_names lists the ones that are business names). Each match has a match_level (exact, strong, partial) and says what it matched on. (2) By license number. (3) With no name, by trade and/or city to list licensed contractors. The trade can be a description of the job (\"my AC is blowing warm air\", \"sewage backing up\"); read_as says how it was read. Lists: clear licenses only by default, in a shuffled order fixed until the next data refresh, 10 per page, up to 5 pages. Lists are not rankings or recommendations. A name match is not proof of identity, so give the user the license number and ask them to confirm it with the contractor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City or ZIP code, e.g. \"Oakland\", \"Oakland, CA\" or \"94704\".",
                "type": "string"
              },
              "license": {
                "description": "CSLB license number, if you have one.",
                "type": "string"
              },
              "name": {
                "description": "Business name or part of it, e.g. \"Diamond Plumbing\". Leave out to list by trade and/or city.",
                "type": "string"
              },
              "page": {
                "description": "For lists: page number, default 1.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state code. Default CA. License records: CO, CT, FL, IL, KS, MN, NY, OR, PA, TX, VA, WA. City permit records only (record_type permits_only, no state license data): AZ, GA, HI, LA, MA, MI, NC, NV, OH, TN.",
                "type": "string"
              },
              "status": {
                "description": "For lists: clear (default) or all, which includes suspended and other licenses.",
                "enum": ["clear", "all"],
                "type": "string"
              },
              "trade": {
                "description": "Trade in plain words or a CSLB code, e.g. \"plumbing\", \"furnace\", \"water heater\", \"sewer line\", \"C-36\".",
                "type": "string"
              },
              "work": {
                "description": "California lists only: a kind of work from city permits, e.g. \"water heater\", \"heat pump\", \"sewer\". Lists only contractors with San Francisco permits for that work in the last five years.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Matches for a name or license number, or a shuffled list for a trade and city.",
            "properties": {
              "data_as_of": {
                "description": "Date the data was copied from the agency, YYYY-MM-DD.",
                "type": "string"
              },
              "matches": {
                "items": {
                  "properties": {
                    "business_name": {
                      "type": ["string", "null"]
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Other states: the id to pass to get_license.",
                      "type": "string"
                    },
                    "json_url": {
                      "type": ["string", "null"]
                    },
                    "license_number": {
                      "type": ["string", "null"]
                    },
                    "match_level": {
                      "description": "exact, strong or partial.",
                      "type": ["string", "null"]
                    },
                    "page_url": {
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "mode": {
                "description": "name, license or browse.",
                "type": "string"
              },
              "note": {
                "type": ["string", "null"]
              },
              "query": {
                "type": "object"
              },
              "read_as": {
                "description": "How a plain-language trade or job description was read."
              },
              "state": {
                "type": ["string", "null"]
              },
              "total": {
                "type": "integer"
              }
            },
            "type": "object"
          },
