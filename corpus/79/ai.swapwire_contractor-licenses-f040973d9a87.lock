        {
          "name": "get_license",
          "title": "Get a contractor license record",
          "description": "Full record for one contractor license by number: status, license types, bond, insurance, workers' comp, discipline, complaints and citations where published, city permits, and the agency source link. California is the default; pass state for others. Use this when you have a license number, or after search_licenses to read a match in full (use the id it returns).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "license_number": {
                "description": "License number as the agency prints it, or the id from search_licenses, e.g. \"1154967\" (CA) or \"CGC047089\" (FL).",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code. Default CA. License records: CO, CT, FL, IL, KS, MN, NY, OR, PA, TX, VA, WA. City permit records only (record_type permits_only, no state license data): AZ, GA, HI, LA, MA, MI, NC, NV, OH, TN.",
                "type": "string"
              }
            },
            "required": ["license_number"],
            "type": "object"
          },
          "outputSchema": {
            "description": "One license record, or found: false with a note. California records carry checks (license, bond, workers' comp) and alerts; other states carry status_class, actions and verify_url.",
            "properties": {
              "alerts": {
                "description": "Plain sentences for anything that is not ok.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": "array"
              },
              "business_name": {
                "type": ["string", "null"]
              },
              "caveat": {
                "type": ["string", "null"]
              },
              "checks": {
                "description": "California: one reading each of the license, bond and workers' comp, with a quotable detail sentence.",
                "type": "object"
              },
              "data_as_of": {
                "description": "Date the data was copied from the agency, YYYY-MM-DD.",
                "type": "string"
              },
              "found": {
                "description": "False when the license is not in this dataset. That does not mean the contractor is unlicensed.",
                "type": "boolean"
              },
              "license_number": {
                "type": ["string", "null"]
              },
              "note": {
                "description": "Why nothing was found, when found is false.",
                "type": "string"
              },
              "page_url": {
                "type": ["string", "null"]
              },
              "record_type": {
                "description": "license, or permits_only for businesses known only from city permits.",
                "type": ["string", "null"]
              },
              "source_record_url": {
                "description": "California: the live CSLB record.",
                "type": ["string", "null"]
              },
              "state": {
                "type": ["string", "null"]
              },
              "status": {
                "description": "Other states: the agency's own status.",
                "type": ["string", "null"]
              },
              "status_class": {
                "description": "Other states: active, inactive, expired, suspended, revoked or other.",
                "type": ["string", "null"]
              },
              "status_code": {
                "description": "California: CSLB status, e.g. CLEAR.",
                "type": ["string", "null"]
              },
              "verify_url": {
                "description": "Other states: the agency's live lookup.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
