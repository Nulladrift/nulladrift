                        "type": "string"
                      },
                      "confirm": {
                        "const": true,
                        "type": "boolean"
                      },
                      "expected_revision": {
                        "maximum": 9007199254740991,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "idempotency_key": {
                        "maxLength": 120,
                        "minLength": 8,
                        "pattern": "^[A-Za-z0-9._:-]+$",
                        "type": "string"
                      },
                      "reason": {
                        "default": "Answered from the native Project OS panel.",
