      "instructions": "2ools keeps AI-assisted projects understood, protected, and moving toward readiness across native AI workflows. It maintains source-free project continuity, versioned builds, attributable work, protected previews, and portable artifacts. Binary transfers use short-lived URLs so bytes never enter MCP model output. Private operating logic is never returned through MCP. First test an existing native 2ools tool. If it succeeds, this client is already authenticated: never start OAuth or ask the person to sign in. Only after a native call is rejected should the current client's native remote-MCP OAuth run with its callback or listener kept alive. Open that attempt's exact approval URL in this chat's embedded browser, ask once for sign-in or Authorize, and reuse that same pane after success. Never recommend the device flow, a user-visible terminal, or an external browser when an embedded browser exists. Once authenticated, call list_projects. The person's initiating intent wins over project count. Reuse an exact project ID or Project OS URL match. For Bring an existing project, resolve one unambiguous saved match, ask once if several are plausible, or—when none matches—describe the local project read-only and call register_existing_project only after the person approves the name, goal, current state, decisions, and next step. Registration starts no build and imports no source files. After resolving the exact record, call continue_project. If it reports approval_required, obtain the person's one-time project activation through its inline card, or ask once in plain text on hosts without MCP Apps, before calling activate_project. App-wide OAuth never implies this per-project choice. Open that exact Project OS in the same pane. For Start a new project, open /workspace?source=mcp&intent=new. Ask the person to sign in only when the pane's exact route is /login; /workspace, a chooser, and Project OS are authenticated app states. A working tool call is not completion until the intended app state is visibly open. Before substantive work on a saved assignment, call claim_work_assignment so Project OS moves it from Next to Now, then renew the returned lease with heartbeat_work_session while working. Never leave work you are actively performing in Next or ask the same active chat to click Continue again. For frontier product research, call get_project_intelligence and preserve findings with update_project_intelligence. Collect cited evidence before synthesis; synthetic reactions remain hypotheses, sparse search results never prove opportunity, and AI alone is not differentiation. After completing project work, end with its open_in_2ools link. The panel and AI converse through project state, so re-read continue_project or get_project_context after the person uses the panel. A local project folder is the subject, not setup material: inspect it read-only to describe the record and never modify files or git state to connect 2ools.",
