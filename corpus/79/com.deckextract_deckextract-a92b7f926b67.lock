{
  "lockfileVersion": 2,
  "subjects": {
    "com.deckextract/deckextract": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://deckextract.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "deckextract",
        "version": "1.3.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Call the `deckextract` tool with a DocSend or Papermark link to extract the deck; you get back a short-lived download link plus a readable `deckextract://deck/...` resource for the PDF/PPTX/ZIP. Pass `analyze: true` (part of DeckExtract for Funds) to also get structured deck data — company, team, round, metrics, market, competition. Some decks email a verification code or link to the viewer: the tool reply then includes the resume token(s) and the exact retry call. If a mail tool is connected (Gmail, Microsoft 365 / Outlook, AnyMailMCP, …), read the verification email from the inbox and retry the tool with it — no need to ask the user. Extractions typically take 15-90 seconds and need a signed-in account (the client prompts you to sign in on first use). Use `account_status` to check the current plan (free, Solo or Funds) and remaining monthly usage.",
      "tools": [
        {
          "name": "account_status",
          "title": "Check your DeckExtract account status",
          "description": "Returns the calling account's plan (free or Pro), whether it's signed in, and this month's extraction usage and remaining quota. Takes no input.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "authenticated": {
                "description": "Whether the caller is signed in",
                "type": "boolean"
              },
              "email": {
                "type": ["string", "null"]
              },
              "isPro": {
                "type": "boolean"
              },
              "monthlyLimit": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Free-plan monthly cap; null when unlimited"
              },
              "monthlyUsage": {
                "description": "Extractions used this calendar month",
                "type": "integer"
              },
              "plan": {
                "description": "'unlimited' is the Pro plan",
                "enum": ["anonymous", "free", "unlimited"],
                "type": "string"
              },
              "remaining": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Extractions left this month; null when unlimited"
              }
            },
            "required": ["authenticated", "isPro", "monthlyLimit", "monthlyUsage", "plan", "remaining"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4f8a95d89df157df0b2b93f3f2123efc075ac809a8dcebe2e53384b50a26c128"
        },
        {
          "name": "deckextract",
          "title": "Extract a DocSend or Papermark deck",
          "description": "Extract a deck from a DocSend or Papermark sharing link. Returns a temporary download URL and a readable `deckextract://deck/...` resource for the PDF/PPTX (or a ZIP for data rooms — a DocSend Space or Papermark data room counts as one extraction like any other link). Pass `analyze: true` (part of DeckExtract for Funds) to also return structured deck data. Decks that email the viewer a verification step return resume tokens with retry instructions: fetch the emailed 6-digit code and retry with `otp` + `otpSessionId` (Papermark), or retry with `url` set to the emailed confirmation link + `sessionId` (DocSend). Typical extraction takes 15-90 seconds; the public API is rate limited to 5 extractions per IP per 30 minutes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "analyze": {
                "description": "If true, also return structured analysis of the deck (company, team, round, metrics, market, competition). Part of DeckExtract for Funds.",
                "type": "boolean"
              },
              "email": {
                "description": "Email to present to email-gated decks. If omitted, an ephemeral address is generated automatically when the deck requires one.",
                "format": "email",
                "type": "string"
              },
              "format": {
                "description": "Output format (default 'pdf')",
                "enum": ["pdf", "pptx"],
                "type": "string"
              },
              "otp": {
                "description": "The 6-digit verification code the deck emailed to the viewer (requires_email_otp step). Send together with otpSessionId.",
                "type": "string"
              },
              "otpSessionId": {
                "description": "Resume token from a prior requires_email_otp reply. The parked session lives ~5 minutes; a wrong code returns a fresh token.",
                "type": "string"
              },
              "password": {
                "description": "Passcode for passcode-protected decks",
                "type": "string"
              },
              "sessionId": {
                "description": "Resume token from a prior requires_password or requires_email_confirmation reply. Echo it on the retry so the same viewer session is reused.",
                "type": "string"
              },
              "url": {
                "description": "The deck sharing link, e.g. https://docsend.com/view/... or https://papermark.com/view/... — on a requires_email_confirmation retry, pass the confirmation link from the verification email instead.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "analysis": {
                "description": "Structured deck analysis (present when analyze=true succeeded)"
              },
              "analysisError": {
                "description": "Set when extraction succeeded but analysis could not be produced",
                "type": "string"
              },
              "downloadUrl": {
                "description": "Temporary URL of the extracted deck",
                "type": "string"
              },
              "expiresAt": {
                "description": "ISO timestamp when the URL/resource expires",
                "type": "string"
              },
              "format": {
                "enum": ["pdf", "pptx", "zip"],
                "type": "string"
              },
              "note": {
                "description": "Pages the source had no image for, in plain words (e.g. DocSend counts its own trailing sign-up prompt as a page)",
                "type": "string"
              },
              "resourceUri": {
                "description": "MCP resource URI (deckextract://deck/...) to read the bytes via resources/read",
                "type": "string"
              },
              "sizeBytes": {
                "type": "integer"
              },
              "sourceUrl": {
                "type": "string"
              }
            },
            "required": ["downloadUrl", "expiresAt", "format", "resourceUri", "sizeBytes", "sourceUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5da6864bca9c9dcbecc853dda1d7ffc2885ecde1726f75bc10357b7cdab619e8"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "deckextract://deck/{file}",
          "name": "deck-file",
          "title": "Extracted deck file",
          "description": "The extracted PDF/PPTX/ZIP bytes for a completed extraction (valid ~1 hour).",
          "digest": "sha256:a9c0f124dd5b9f6b7dadd3d1193a410f57cd19e943a726fa1995e0826d2e86e4"
        }
      ],
      "digest": "sha256:5aa4c601e771dad9d302e31e497df95934f02579f3e404272c837ccee480df40"
    }
  }
}
