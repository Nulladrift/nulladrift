{
  "lockfileVersion": 2,
  "subjects": {
    "com.padelstayguide/padel-hotels": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://padelstayguide.com/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "padel-stay-guide",
        "title": "Padel Stay Guide",
        "version": "1.0.0",
        "description": "A directory of hotels and resorts with padel courts on the property, verified against a source.",
        "websiteUrl": "https://padelstayguide.com/",
        "icons": [
          {
            "src": "https://padelstayguide.com/favicon.svg",
            "mimeType": "image/svg+xml"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Padel Stay Guide: hotels and resorts with padel courts. Every hotel comes with the URL of its page on the site and the date its padel facts were last checked. A null field means no source the site read states it. Licence: CC BY 4.0, which asks for credit to Padel Stay Guide with a link.",
      "tools": [
        {
          "name": "get_padel_hotel",
          "title": "Get a hotel's padel details",
          "description": "Gets one hotel's padel details: courts, indoor or outdoor, guest access, coaching, racket rental and season, how sure we are the court exists and when we last checked, plus its official website and booking links. Use it when someone asks about a specific hotel, or to follow up a search result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hotel": {
                "description": "The hotel's slug or url from search_padel_hotels, or its name.",
                "type": "string"
              }
            },
            "required": ["hotel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a hotel's padel details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed7d4a08ab5d1c689e6ddb25899b872f2e79fcdd329e9058b39f800ec7749920"
        },
        {
          "name": "get_padel_month_ratings",
          "title": "Get the best months for padel",
          "description": "Rates each month for outdoor padel from climate averages: all day, morning or evening (midday too hot), midday (mornings and evenings cold), or cold or wet. Use it when someone asks when to go, or where to play in a given month. Give a country for its year and its regions', a month for every country that month, or both.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country name, e.g. \"Portugal\".",
                "type": "string"
              },
              "month": {
                "description": "1 for January to 12 for December. A month name works too.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the best months for padel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:21523361d000e4fa3ccdce589aa1edc0baab510b9c7f4d4fbc96ec4e23995a83"
        },
        {
          "name": "list_padel_destinations",
          "title": "List padel destinations",
          "description": "Lists the countries this site covers with the number of padel hotels in each, or the regions of one country. Use it to see where hotels with padel courts are listed, or to check a place name before searching. The names it returns work as country and region in search_padel_hotels.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "A country, to list its regions. Leave out to list every country.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List padel destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4a068c7668505d2c68107bff789409469186381362737b44865c89f93e74f44"
        },
        {
          "name": "search_padel_hotels",
          "title": "Search hotels with padel courts",
          "description": "Searches hotels and resorts with padel courts by place, number of courts, court type, coaching, guest access and more. Use it when someone wants somewhere to stay and play padel. Filters match stated facts: a hotel matches a filter when a source we read states that fact. Returns the number of matches, the top hotels with links, and a link to the full list on the site.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access": {
                "description": "free: included for guests. paid: court time costs extra.",
                "enum": ["free", "paid", "guests-only", "members-only"],
                "type": "string"
              },
              "bookable_online": {
                "description": "true for properties with an online booking link.",
                "type": "boolean"
              },
              "coaching": {
                "description": "true for properties stated to offer padel coaching.",
                "type": "boolean"
              },
              "country": {
                "description": "Country name, e.g. \"Spain\" or \"UK\".",
                "type": "string"
              },
              "court_type": {
                "description": "\"both\": the property has indoor and outdoor courts.",
                "enum": ["indoor", "outdoor", "both"],
                "type": "string"
              },
              "limit": {
                "description": "How many hotels to return, default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "min_confidence": {
                "description": "high: the property's own site states the court. medium: a directory and the property's site both mention padel.",
                "enum": ["medium", "high"],
                "type": "string"
              },
              "min_courts": {
                "description": "At least this many padel courts.",
                "minimum": 1,
                "type": "integer"
              },
              "property_type": {
                "description": "Kind of property.",
                "enum": ["hotel", "resort", "aparthotel", "apartment", "villa", "cabin", "campsite", "rural-house", "rural-hotel", "hostel", "residence", "inn", "complex", "other"],
                "type": "string"
              },
              "region": {
                "description": "Region in that country, e.g. \"Costa del Sol\". Needs country.",
                "type": "string"
              },
              "sort": {
                "description": "documented (default): best documented first. courts: most courts. checked: most recently verified.",
                "enum": ["documented", "courts", "checked", "name", "country"],
                "type": "string"
              },
              "text": {
                "description": "Words to find in the hotel name, city, region or country, e.g. \"Marbella\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search hotels with padel courts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3799b6806967fbc786e46be933e5b4811500cc92b1e0ce5643b05c351daf3e77"
        }
      ],
      "digest": "sha256:4e8e4a8ff282402574173cb8ea919ff629de5649fa4e3b43e79cbf834f1673f8"
    }
  }
}
