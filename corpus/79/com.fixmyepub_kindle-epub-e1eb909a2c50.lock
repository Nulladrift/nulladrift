{
  "lockfileVersion": 2,
  "subjects": {
    "com.fixmyepub/kindle-epub": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fixmyepub.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fixmyepub",
        "title": "FixMyEPUB",
        "version": "1.0.1",
        "websiteUrl": "https://fixmyepub.com/mcp-server/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FixMyEPUB answers questions about EPUB files and Amazon Send to Kindle: why a book is rejected, stuck, missing or has no cover, what an EPUBCheck error means, Kindle size limits, and fixed-layout EPUB code. It cannot receive files. To repair, re-cover, compress or edit an EPUB, give the reader the link in the tool result; those tools run in their browser and never upload the book. Re-cover, compress and edit are free. The repair check is free; downloading the repaired copy is a one-time $1.99 per book or $5.99 for 30 days of unlimited and batch repair.",
      "tools": [
        {
          "name": "explain_epub_error",
          "title": "Explain an EPUBCheck error",
          "description": "Explains an EPUBCheck code or validation message (for example PKG-007, RSC-005, OPF-003) or a Kindle conversion error: which layer of the EPUB is broken, why, and the repair steps in order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "The error code or the full message text",
                "maxLength": 2000,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain an EPUBCheck error"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef158403e4ca8499306689a73221f26b5112a90732ba34b7384e499268f7ca8b"
        },
        {
          "name": "find_epub_fix",
          "title": "Find the right EPUB fix",
          "description": "Given a Kindle or EPUB problem (rejected by Send to Kindle, no cover, want a new cover, file too large, wrong title or author, or validate before sending), returns the FixMyEPUB tool that fixes it, whether it is free, and a link. The tools run in the reader's browser; the book is never uploaded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "problem": {
                "description": "rejected | no_cover | change_cover | too_large | wrong_title_author | validate",
                "enum": ["rejected", "no_cover", "change_cover", "too_large", "wrong_title_author", "validate"],
                "type": "string"
              }
            },
            "required": ["problem"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the right EPUB fix"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48b35fb4c96c29b299ae3d2adf0b5d7ce74a4809a89372e8ec998b811d5422ba"
        },
        {
          "name": "generate_fixed_layout_code",
          "title": "Generate fixed-layout EPUB code",
          "description": "Generates EPUB 3 fixed-layout (pre-paginated) package metadata, the XHTML viewport tag and page CSS for a page size in pixels.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "height": {
                "description": "Page height in CSS pixels, e.g. 1600",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              },
              "orientation": {
                "default": "auto",
                "enum": ["auto", "portrait", "landscape"],
                "type": "string"
              },
              "spread": {
                "default": "auto",
                "enum": ["auto", "none", "landscape"],
                "type": "string"
              },
              "width": {
                "description": "Page width in CSS pixels, e.g. 1200",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["height", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate fixed-layout EPUB code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d403e2961df2c3b4909852733c594b008ddb05180ddaa5e284fd74fed65f23f1"
        },
        {
          "name": "kindle_epub_limits",
          "title": "Kindle EPUB limits and requirements",
          "description": "Facts about sending EPUB files to Kindle: size limits per route, cover requirements, DRM, and what Kindle reads from the EPUB (title, author, cover metadata).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Kindle EPUB limits and requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bed938bc191dac44da251b5a6db749a42e7e25bbe5fcd747f214bb3a19b5e6ca"
        },
        {
          "name": "send_to_kindle_troubleshoot",
          "title": "Send to Kindle troubleshooter",
          "description": "Diagnoses an Amazon Send to Kindle problem from its symptom and returns the most likely cause, what to do next and a guide link. Same decision rules as fixmyepub.com/tools/send-to-kindle-troubleshooter/.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "elapsed": {
                "description": "Time since sending: under15, under60 (15–60 min), day (1–24 h), overday",
                "enum": ["under15", "under60", "day", "overday"],
                "type": "string"
              },
              "in_cloud_library": {
                "description": "Is the book listed in the Amazon Content Library online?",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "other_epub_works": {
                "description": "Does another EPUB arrive normally through the same account and route?",
                "enum": ["yes", "no", "untested"],
                "type": "string"
              },
              "route": {
                "description": "How the file was sent",
                "enum": ["web", "email", "ios", "android", "app"],
                "type": "string"
              },
              "symptom": {
                "description": "failed = upload failed or Amazon rejected the file; processing = stuck processing; missing = Amazon says In library but the book cannot be found; cover = arrived without a cover; unavailable = \"temporarily unavailable\" message",
                "enum": ["failed", "processing", "missing", "cover", "unavailable"],
                "type": "string"
              }
            },
            "required": ["symptom"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Send to Kindle troubleshooter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9d853452ad76dbb1bb51d10ce406bcd084c0c86b785f88fb10a8029ebca5559"
        }
      ],
      "digest": "sha256:6f439567ed5a38dfb9982cb572f6b02c9d6152f533ea5b037966b26e2031eabe"
    }
  }
}
