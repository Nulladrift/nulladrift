        "url": "https://play.rowhousesoftware.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "playtable",
        "title": "Playtable",
        "version": "1.0.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {},
        "tools": {}
      },
      "instructions": "Playtable runs games in the chat. Flow: ask what the player wants to play (or suggest a starter), call create_game, then tell them the board is in the chat. When they say they've moved, or the board tells you it's your turn, call get_state, decide, and call take_turn with your moves and end_turn. Keep the game_id and agent_key from create_game.\nYou only see your own seat: never guess or ask for hidden cards. Run the rules the server doesn't enforce yourself, fairly. Use roll and pick for anything random, and secret for anything you must commit to (a word, a culprit, ship positions) so the player can check you at the end. Don't recreate branded games (names, art or characters from existing commercial games); offer an original or public-domain version instead.",
      "tools": [
        {
          "name": "create_game",
          "title": "Create a game",
          "description": "Set up any game to play in this chat: board games, card games, dice games, word and guessing games, mysteries. Describe it with the building blocks below, or pass starter for a ready one (tic-tac-toe, four-in-a-row, gomoku, checkers, reversi, crazy-eights, go-fish, twenty-one, pig, sea-battle, hangman, twenty-questions). The server keeps the board, deals and hides cards, rolls dice and enforces turns, so the player can trust the game. The player gets an interactive board in the chat (and a link to play in a browser or invite friends). Returns game_id and agent_key; keep both for get_state and take_turn. You run the rules that aren't built in.",
          "inputSchema": {
            "properties": {
              "about": {
                "description": "The rules in a few sentences, shown to the player. Write them so you can follow them too.",
                "type": "string"
              },
              "board": {
                "properties": {
                  "cells": {
                    "additionalProperties": true,
                    "description": "Starting cell marks: {\"B2\": {\"color\": \"#cde2fb\", \"label\": \"?\"}}",
                    "type": "object"
                  },
                  "cols": {
                    "maximum": 26,
                    "type": "integer"
                  },
                  "coords": {
                    "type": "boolean"
                  },
                  "pattern": {
                    "enum": ["plain", "checker", "lines"],
                    "type": "string"
                  },
                  "rows": {
                    "maximum": 26,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "counters": {
                "description": "Scores and tallies: \"score\", or {name, per_seat: false, start}.",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "deal": {
                "description": "Cards dealt to each hand at the start.",
                "type": "integer"
              },
              "deck": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "object"
                        }
                      ]
                    },
                    "type": "array"
                  }
                ],
                "description": "\"standard\" (52, ids like AS, 10H, QC), \"standard_jokers\", \"numbers:1-10x4\", or a list of card labels or {label, suit, rank}. Adds a face-down deck, a face-up table and a hidden hand per seat."
              },
              "dice": {
                "description": "Default die sides.",
                "type": "integer"
              },
              "first": {
                "description": "Seat name that goes first.",
                "type": "string"
              },
              "pieces": {
                "description": "Starting pieces.",
                "items": {
                  "properties": {
                    "at": {
                      "type": "string"
                    },
                    "color": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "owner": {
                      "description": "Seat name, or omit for neutral.",
                      "type": "string"
                    },
                    "shape": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "piles": {
                "items": {
                  "properties": {
                    "face": {
                      "enum": ["up", "down", "top", "owner"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "owner": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "rules": {
                "description": "Rules the server enforces for you.",
                "properties": {
                  "gravity": {
                    "type": "boolean"
                  },
                  "max_hand": {
                    "type": "integer"
                  },
                  "one_move": {
                    "description": "A place, move or play ends the turn by itself.",
                    "type": "boolean"
                  },
                  "place": {
                    "enum": ["empty", "any"],
                    "type": "string"
                  },
                  "win_line": {
                    "description": "n in a row wins.",
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "seats": {
                "description": "Players in turn order. Default: Player (human) then Agent (agent).",
                "items": {
                  "properties": {
                    "color": {
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["human", "agent"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "piece": {
                      "description": "What a click on an empty cell places for this seat.",
                      "properties": {
                        "color": {
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        },
                        "shape": {
                          "enum": ["disc", "square", "ring", "star", "diamond"],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "starter": {
                "description": "A ready-made game. Other fields here override its setup (for example seats).",
                "enum": ["tic-tac-toe", "four-in-a-row", "gomoku", "checkers", "reversi", "crazy-eights", "go-fish", "twenty-one", "pig", "sea-battle", "hangman", "twenty-questions"],
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "turns": {
                "description": "alternate (default): one seat at a time. free: anyone acts anytime (guessing games, puzzles).",
                "enum": ["alternate", "free"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://playtable/board.html",
            "openai/toolInvocation/invoked": "Table ready",
            "openai/toolInvocation/invoking": "Setting up the table",
            "ui": {
              "resourceUri": "ui://playtable/board.html"
            }
          },
          "digest": "sha256:ecf7c27fca6bb6c6ad014116c13f0afc55f8e36c866f558510742f1bc90c7efe"
        },
        {
          "name": "delete_game",
          "title": "Delete a game",
          "description": "Delete a game for good: the board, cards, log, secrets, seats and keys, and Playtable's record of it. Its link stops working. Only call this when the player asks. It needs the delete_code from the board in the chat where the game was made; you never get that code yourself, so ask the player to paste it. With a wrong code nothing is deleted. This can't be undone.",
          "inputSchema": {
            "properties": {
              "delete_code": {
                "description": "Starts with del_. The player copies it from the board.",
                "type": "string"
              },
              "game_id": {
                "type": "string"
              }
            },
            "required": ["delete_code", "game_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0ee725fd1a5a26658f655e209e2f716cd5b76a5686ff93418ae43f192caf7130"
        },
        {
          "name": "get_state",
          "title": "See the game",
          "description": "What your seat can see now: the board, your hand, public piles, scores, dice, secrets you hold and the recent log. Call it when the player says they've moved or it might be your turn.",
          "inputSchema": {
            "properties": {
              "agent_key": {
                "type": "string"
              },
              "as": {
                "description": "Which of your seats, when you play more than one.",
                "type": "string"
              },
              "game_id": {
                "type": "string"
              }
            },
            "required": ["agent_key", "game_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:edb48dbbdcb1a5c4968d0bb72cca1251d6bdf9c935c2431d70e0c1132bb54254"
        },
        {
          "name": "show_board",
          "title": "Show the board",
          "description": "Show the interactive board in the chat again, for example after a long conversation or when the player asks to see it.",
          "inputSchema": {
            "properties": {
              "agent_key": {
                "type": "string"
              },
              "game_id": {
                "type": "string"
              }
            },
            "required": ["agent_key", "game_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://playtable/board.html",
            "openai/toolInvocation/invoked": "Table ready",
            "openai/toolInvocation/invoking": "Setting up the table",
            "ui": {
              "resourceUri": "ui://playtable/board.html"
            }
          },
          "digest": "sha256:64e42a41bf21bdf0cc57c69ee6af9f6231098a7aace3f96101543a654ba1010e"
        },
        {
          "name": "take_turn",
          "title": "Make moves",
          "description": "Apply one or more actions for your seat, all or nothing: if any action is illegal, none happen and you get the reason. Usually end with end_turn. Action types and fields:\n- place {at: \"B3\"} or {column: \"D\"} with gravity; optional label, shape (disc, square, ring, star, diamond), color, kind, owner\n- move {from: \"B3\", to: \"C4\"} or {piece, to}; moving onto another player's piece takes it; optional label, kind\n- edit {at, owner?, label?, kind?, shape?, color?}: change a piece in place (flip, crown)\n- remove {at} or {piece}\n- mark {at, color?, label?}: paint or label a cell (hits, misses, letters)\n- draw {from?: \"deck\", to?: \"hand\", count?}\n- play {card, to?: \"table\", from?}: a card you can see, by id or label\n- give {card, to: seat}\n- shuffle {pile?}, collect {into?: \"deck\", from?: [piles]}: gather and reshuffle\n- roll {dice?: \"2d6\"}, pick {options: [...]}: server randomness, logged\n- score {counter?, seat?, add? | set?}\n- secret {name, value}: lock in hidden info (the word, the culprit, your fleet); reveal {name}\n- say {text}, end_turn {next?}, end_game {winner?, reason}, concede\nCells are column letter + row number from the top: A1 is the top left.",
          "inputSchema": {
            "properties": {
              "actions": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "type": {
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "agent_key": {
                "type": "string"
              },
              "as": {
                "type": "string"
              },
              "game_id": {
                "type": "string"
              }
            },
            "required": ["actions", "agent_key", "game_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cf2ee6348a1b41923a7184aef7324c90119627d2062d98427d4fe5db78784234"
        }
      ],
