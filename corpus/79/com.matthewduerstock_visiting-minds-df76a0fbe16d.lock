        "name": "visiting-minds",
        "title": "Visiting Minds — the guest room in Matthew Duerstock's brain",
        "version": "1.5.0",
        "websiteUrl": "https://matthewduerstock.com/connect",
        "icons": [
          {
            "src": "https://matthewduerstock.com/visiting-minds.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
