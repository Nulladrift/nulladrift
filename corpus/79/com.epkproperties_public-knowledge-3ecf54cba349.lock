                "description": "Maximum bathrooms; set equal to min_bathrooms for an exact bathroom count.",
                "minimum": 0,
                "type": "integer"
              },
              "max_bedrooms": {
                "description": "Maximum bedrooms; set equal to min_bedrooms for an exact bedroom count.",
