            "readOnly": true
          },
          "digest": "sha256:b34265f709f66bd2c0cc69f51a01f06f335fa2838bdf04122113cb7da3fba40a"
        },
        {
          "name": "list_checks",
          "title": "List every check and its weight",
          "description": "The catalogue of checks the audit runs, grouped by category with weights and a one-line description of what passes. Use it to explain a score or to see what the audit covers. No usage limit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter; \"product\" lists the 19 product page checks",
