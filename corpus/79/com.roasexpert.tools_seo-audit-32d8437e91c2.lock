        },
        {
          "name": "unlock_report",
          "title": "Unlock the full report with a work email",
          "description": "Unlocks a report: every failing and warning check with its detail and the fix written for the detected platform, plus the written summary. The email goes to ROAS Expert's CRM with the report link and gets at most one follow-up about the findings. Only call this with an email the user gave you for this purpose. No usage limit.",
