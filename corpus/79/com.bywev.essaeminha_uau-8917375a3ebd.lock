        "name": "uau",
        "title": "Uau · Essa é Minha",
        "version": "1.1.0",
        "websiteUrl": "https://essaeminha.bywev.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Essa é Minha é a loja de camisetas personalizadas da Camila (Campinas, SP), produzidas pela WĒV.\nVende a partir de 1 peça. A pessoa cria a estampa (frase, arte própria ou estampa da vitrine) no simulador do site, escolhe os tamanhos e paga por Pix ou cartão no Mercado Pago, ou conversa com a Camila pelo WhatsApp.\nFluxo sugerido: ver_catalogo → ver_disponibilidade → calcular_preco (com o CEP) → fechar_compra. fechar_compra é em duas chamadas: a primeira devolve o total; mostre ao comprador e, com o sim dele, chame de novo com confirmo_total igual a esse valor. Ela cria o pedido e devolve o Pix copia e cola e o link de cartão; quem paga é o comprador. Acompanhe com ver_pedido. Para arte própria em imagem, use montar_link_de_compra (o comprador envia a imagem no site). Grupos, eventos ou dúvidas: falar_com_a_camila.\nA Camila confere a arte com o comprador pelo WhatsApp antes de produzir. Só envie dados pessoais com a autorização do comprador.",
      "tools": [
        {
          "name": "calcular_preco",
          "title": "Calcular preço e frete",
          "description": "Preço pela tabela oficial para a quantidade total, com ou sem verso, e, com CEP, o frete dos Correios (PAC e SEDEX) e o prazo de produção.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cep": {
                "description": "Opcional. CEP de entrega com 8 números.",
                "type": "string"
              },
              "cor": {
                "description": "Opcional, para dizer o prazo pela disponibilidade.",
                "enum": ["Branca", "Preta", "Azul-marinho", "Cinza mescla", "Vermelha", "Off-white"],
                "type": "string"
              },
              "frente_e_verso": {
                "description": "true se estampar os dois lados (acréscimo por peça).",
                "type": "boolean"
              },
              "modelo": {
                "enum": ["masculino", "baby-long"],
                "type": "string"
              },
              "quantidade_por_tamanho": {
                "additionalProperties": {
                  "maximum": 999,
                  "minimum": 1,
                  "type": "integer"
                },
                "description": "Ex.: {\"P\": 2, \"M\": 3}",
                "type": "object"
              }
            },
            "required": ["modelo", "quantidade_por_tamanho"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5f4f8d50f995f807a8ef7a6225693116e6d6e4132b429dab471120f9351acdf9"
        },
        {
          "name": "falar_com_a_camila",
          "title": "Falar com a Camila",
          "description": "Link de WhatsApp com a Camila, já com a mensagem. Para grupos, eventos, prazos especiais ou dúvidas.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mensagem": {
                "maxLength": 800,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:45da3617579f23f23e0030694bef1f6a507ad843e86e958d883b465ecd88a1ac"
        },
        {
          "name": "fechar_compra",
          "title": "Fechar a compra",
          "description": "Cria o pedido e devolve o Pix copia e cola e o link de cartão do Mercado Pago. Duas etapas: sem confirmo_total, só calcula e devolve o total (nada é criado); com confirmo_total igual ao total e o sim do comprador, cria o pedido. Estampa por texto (frase); para arte em imagem use montar_link_de_compra.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cep": {
                "type": "string"
              },
              "comprador": {
                "additionalProperties": false,
                "properties": {
                  "cpf": {
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  },
                  "nome": {
                    "type": "string"
                  },
                  "whatsapp": {
                    "description": "Com DDD",
                    "type": "string"
                  }
                },
                "required": ["cpf", "email", "nome", "whatsapp"],
                "type": "object"
              },
              "confirmo_total": {
                "description": "Total que o comprador aprovou, em reais. Deixe vazio na primeira chamada.",
                "type": "number"
              },
              "cor": {
                "enum": ["Branca", "Preta", "Azul-marinho", "Cinza mescla", "Vermelha", "Off-white"],
                "type": "string"
              },
              "detalhes_da_arte": {
                "description": "Opcional: estilo, posição, referência. A Camila confere antes de produzir.",
                "maxLength": 1000,
                "type": "string"
              },
              "endereco": {
                "additionalProperties": false,
                "properties": {
                  "bairro": {
                    "type": "string"
                  },
                  "cidade": {
                    "type": "string"
                  },
                  "complemento": {
                    "type": "string"
                  },
                  "numero": {
                    "type": "string"
                  },
                  "rua": {
                    "type": "string"
                  },
                  "uf": {
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  }
                },
                "required": ["bairro", "cidade", "numero", "rua", "uf"],
                "type": "object"
              },
              "frente": {
                "additionalProperties": false,
                "properties": {
                  "cor_da_letra": {
                    "description": "Ex.: preta, branca, #865441",
                    "type": "string"
                  },
                  "frase": {
                    "maxLength": 70,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "frete": {
                "enum": ["pac", "sedex"],
                "type": "string"
              },
              "modelo": {
                "enum": ["masculino", "baby-long"],
                "type": "string"
              },
              "quantidade_por_tamanho": {
                "additionalProperties": {
                  "maximum": 999,
                  "minimum": 1,
                  "type": "integer"
                },
                "description": "Ex.: {\"P\": 2, \"M\": 3}",
                "type": "object"
              },
              "verso": {
                "additionalProperties": false,
                "properties": {
                  "cor_da_letra": {
                    "type": "string"
                  },
                  "frase": {
                    "maxLength": 70,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["cep", "comprador", "cor", "endereco", "frente", "modelo", "quantidade_por_tamanho"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
