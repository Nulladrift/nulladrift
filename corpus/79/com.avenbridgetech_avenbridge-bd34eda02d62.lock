        {
          "name": "open_invitation",
          "title": "Open an invitation",
          "description": "Open an invitation a business sent the user, using the invitation code from their message (8 letters and digits, e.g. K7Q2M8XD). Returns the business, what the invitation is about, its contact person and its current public documents with download links. Works before the user signs in. Documents shared only with the invited address open after that address confirms the invitation (the claim link in the result) and signs in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The invitation code, e.g. K7Q2M8XD.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Open an invitation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://avenbridge/card"
            }
          },
          "digest": "sha256:0951cc27e9466ad64a002c9668c2af9f0f5b8991b10b81d69720b723580cd619"
        },
        {
          "name": "request",
          "title": "Send a request to the business",
          "description": "Send a request to one business: anything the user wants that business to do. Each business lists the kinds of request it takes (list_my_businesses and the server instructions; by default quote, sample, document, reschedule, complaint, other). When the user wants a call or meeting and the business lists \"call\", use kind call: the user gets the business's booking page at once and picks a time there. Otherwise nothing is sent on the first call: it returns a preview of exactly what would go to the business's contact person, and a confirmation code. Show the whole preview to the user; only if they agree, call again with the same business and confirm set to the code. Then Avenbridge emails the request to the contact (with the user's email as reply-to) and sends the user a copy; the reply shows up in `status`. The same request sent again within a day is not sent twice. Before a quote or sample request, ask the user for the items in the business's request checklist (shown by list_my_businesses and in the server instructions) so the request arrives complete, and put them in details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business": {
                "description": "Name of the business as it appears in list_my_businesses. Used only when business_id is not given. Leave both out when the user has one business, or to search every business the user has.",
                "type": "string"
              },
              "business_id": {
                "description": "The business id exactly as given by list_my_businesses (for example yyigsmj5b7mcwxe7). Preferred: use it whenever you know it.",
                "type": "string"
              },
              "confirm": {
                "description": "The confirmation code from the preview. Only after the user has seen the preview and agreed; leave out on the first call.",
                "type": "string"
              },
              "context": {
                "description": "One line on what this is for, e.g. an order or project number. Optional.",
                "type": "string"
              },
              "details": {
                "description": "Everything the business needs, as the user stated it: quantities, part numbers, dates, the checklist items, what went wrong. Plain text.",
                "type": "string"
              },
              "kind": {
                "description": "One of the request kinds the business lists, e.g. quote, sample, call, other.",
                "type": "string"
              },
              "title": {
                "description": "One line, e.g. 'Quote for 500 × A-200 in 316 stainless'.",
                "type": "string"
              }
            },
            "required": ["details", "kind", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a request to the business"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
