        {
          "name": "list_my_businesses",
          "title": "List my businesses",
          "description": "List the businesses (suppliers) that share documents and approved answers with this user through Avenbridge: their ids, counts and any context from their invitation, such as a shipment or part number. Call it first when you do not know which business the user means or need a business_id.",
