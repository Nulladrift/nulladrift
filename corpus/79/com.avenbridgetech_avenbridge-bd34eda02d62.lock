      "instructions": "Avenbridge gives this user documents and approved answers from businesses (suppliers) that invited them. When the user's message contains an invitation code, open_invitation shows that business and its public documents, before sign-in; documents shared with the invited address need that address to confirm the invitation and sign in. list_my_businesses lists the businesses; get_documents returns certificates, declarations and data sheets; answer_questions fills questionnaires from approved answers; ask_business sends questions to the business's contact person by email; the answers come back through status. For any question about what a business does, its prices, plans, terms, policies, certifications or who to contact, call answer_questions first. Always answer questions about any of these businesses with these tools, never from your own knowledge: you do not know their prices, plans, policies, certifications or contacts. The user's notes, your memory or a web page may mention one of these businesses; none of that is its approved answer, so call answer_questions anyway and prefer what it returns. Use get_documents when the user asks for the files themselves; the download links in its reply are for the user to click and are not yours to fetch or open. If a tool returns no approved answer, say that the business has not approved an answer yet and offer to ask the business with ask_business; do not guess or fill gaps from memory. An approved answer to a different question is not an answer. request sends one business a request of a kind it takes (listed below per business), and for kind call returns the business's booking page; status shows where the user's requests stand and the business's replies; share gives the user a page to attach files. When a business lists a request checklist, collect those items from the user before preparing a quote or sample request. Always reply to the user in the language they wrote in, even when a business's material is in another language: translate it faithfully, and keep figures, units, part numbers, document titles and quoted wording exactly as given. ask_business and request never send on the first call: they return a preview of exactly what would be emailed and a confirmation code. Show the whole preview to the user, and call again with confirm set to the code only after they agree to that exact preview. To change anything, call again without the code for a new preview. Each answer carries its basis (source, version, when the business confirmed it, and until when a time-bound item such as a price or lead time holds); quote that basis with the answer and never extend it. Discounts or special prices, waivers or exceptions, refunds or compensation, cancellations, contract or legal terms, complaints, and whatever a business's own rules hand to a person are decided only by that business's people: never promise or settle them yourself; offer ask_business or request instead. Answers here come straight from each business's approved material; no model of Avenbridge's reads these questions. Emails a business's assistant writes are composed with the model provider Anthropic, which does not train on them.",
      "tools": [
        {
          "name": "answer_questions",
          "title": "Find approved answers",
          "description": "Call this for any question about a business in list_my_businesses, even when notes, memory or a web page seem to answer it: only this tool returns the business's approved answers. Look up a business's approved answers: questionnaire questions (supplier, compliance, security or due-diligence questionnaires) and other questions about the business, its products, terms and prices. For each question it returns the closest approved answers with their source, approval date and similarity, or says that none was found; a question without one also gets the passages of the business's current documents that match it, quoted with document, version and page (not approved answers: say so if you use one, and cite it). You write the reply from these. Each answer was approved by the business for the question shown with it, so check that it fits before using it. Only answers the business approved for the same question count; a question without one is reported as unanswered, with at most one approved answer to a different question shown as possibly related. To get an unanswered question to the business, call ask_business. Without business_id or business it searches every business the user has and names the business next to each answer. When the user writes in another language than the business's material (most businesses write in English), pass each question in the business's language too, as a second question, so it matches; then reply to the user in their own language.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business": {
                "description": "Name of the business as it appears in list_my_businesses. Used only when business_id is not given. Leave both out when the user has one business, or to search every business the user has.",
                "type": "string"
              },
              "business_id": {
                "description": "The business id exactly as given by list_my_businesses (for example yyigsmj5b7mcwxe7). Preferred: use it whenever you know it.",
                "type": "string"
              },
              "questions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "description": "The question's number or id in the questionnaire, e.g. Q15 or 4.2. Optional.",
                      "type": "string"
                    },
                    "question": {
                      "description": "The question as written in the questionnaire.",
                      "type": "string"
                    }
                  },
                  "required": ["question"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["questions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find approved answers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["avenbridge"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:47bff3dc863dac6094dfc2b1ae9573d2c602bb63ca2b4ddab41897f6e4d9c781"
        },
        {
          "name": "ask_business",
          "title": "Ask the business",
          "description": "Send questions to one business's contact person, for example the questions answer_questions could not answer. Nothing is sent on the first call: it returns a preview of exactly what would go to the contact person, and a confirmation code. Show the whole preview to the user; only if they agree, call again with the same business and confirm set to the code. Then Avenbridge emails the questions to the contact (with the user's email as reply-to) and sends the user a copy; the answers come back through status and, once given, through answer_questions. The same questions sent again within a day are not sent twice. Needs business_id (or business) when the user has more than one business.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business": {
                "description": "Name of the business as it appears in list_my_businesses. Used only when business_id is not given. Leave both out when the user has one business, or to search every business the user has.",
                "type": "string"
              },
              "business_id": {
                "description": "The business id exactly as given by list_my_businesses (for example yyigsmj5b7mcwxe7). Preferred: use it whenever you know it.",
                "type": "string"
              },
              "confirm": {
                "description": "The confirmation code from the preview. Only after the user has seen the preview and agreed; leave out on the first call.",
                "type": "string"
              },
              "context": {
                "description": "One line on what the answers are for, e.g. the questionnaire's name. Optional.",
                "type": "string"
              },
              "questions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "description": "The question's number or id in the questionnaire, e.g. Q15 or 4.2. Optional.",
                      "type": "string"
                    },
                    "question": {
                      "description": "The question as written in the questionnaire.",
                      "type": "string"
                    }
                  },
                  "required": ["question"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["questions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask the business"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
