          "digest": "sha256:38afc9a9e1289e2c8d0fcd3db2f26b2284652d224ecdd6dbf2e22d76b6e19212"
        },
        {
          "name": "share",
          "title": "Send files to the business",
          "description": "Give the user a page where they attach files for a business: drawings, filled forms, photos of a defect, specifications. Files cannot travel through this tool, so the page is the way; the link works for 15 minutes. With case_id the files attach to that request; without one, the page sends them to the business as a new request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business": {
                "description": "Name of the business as it appears in list_my_businesses. Used only when business_id is not given. Leave both out when the user has one business, or to search every business the user has.",
                "type": "string"
              },
              "business_id": {
                "description": "The business id exactly as given by list_my_businesses (for example yyigsmj5b7mcwxe7). Preferred: use it whenever you know it.",
                "type": "string"
              },
              "case_id": {
                "description": "The request the files belong to, from `status` or from a request you just prepared. Optional.",
                "type": "string"
              },
              "note": {
                "description": "One line on what the files are. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send files to the business"
          },
          "behavior": {
