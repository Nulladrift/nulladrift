          "digest": "sha256:fbbaf9564dab9b9da1ca3b0ee5e2cc14e6387d85f1a1a71a4957d1a506dff4da"
        },
        {
          "name": "get_documents",
          "title": "Get documents",
          "description": "Get the current versions of a business's shareable documents: certificates (ISO 9001 and others), compliance declarations (RoHS, REACH, conflict minerals), safety data sheets, data sheets and test reports. Filter by part number and/or document type. Returns version, issue and expiry dates, and a download link that works for 15 minutes. Without business_id or business it lists the documents of every business the user has, grouped by business.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business": {
                "description": "Name of the business as it appears in list_my_businesses. Used only when business_id is not given. Leave both out when the user has one business, or to search every business the user has.",
                "type": "string"
              },
              "business_id": {
                "description": "The business id exactly as given by list_my_businesses (for example yyigsmj5b7mcwxe7). Preferred: use it whenever you know it.",
                "type": "string"
              },
              "document_type": {
                "description": "Document types wanted, e.g. 'ISO 9001, RoHS'. Optional; leave out to list all.",
                "type": "string"
              },
              "part_number": {
                "description": "Part, model or article number, e.g. A-200. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get documents"
