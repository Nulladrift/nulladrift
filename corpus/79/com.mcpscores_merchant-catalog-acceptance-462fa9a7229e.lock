      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.mcpscores/merchant-catalog-acceptance",
        "title": "Merchant Catalog Acceptance",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Deterministic acceptance report for a supplied product catalog: validates price/currency/availability/URL formatting, GS1 GTIN checksums, and flags duplicate SKUs, duplicate GTINs, and grouped-variant collisions. Checks only the structured rows given in the request - no network calls, no brand or marketplace certification, no ISO 4217 currency list. Tool calls cost 0.05 USDC on Base. Initialization, tool discovery and unpaid price challenges are free. Send x402 v2 PAYMENT-SIGNATURE on the POST or params._meta['x402/payment']. Reuse the identical input and authorization when recovering a pending purchase; do not sign a fresh charge. Results are retained24hours. Validates only the structured rows supplied in the request - never fetches url, and never checks live marketplace or vendor status. currency is checked for exact three-uppercase-letter format only, not against the ISO 4217 currency code list. gtin is checked for digit format, length (8/12/13/14), and GS1 checksum only - this confirms the number is well-formed, not that it is assigned to a real product or that brand is a legitimate registered trademark. Duplicate SKU rows are always reported, even when two rows are byte-for-byte identical; nothing is silently deduplicated. A group_id used by only a single row is never an error by itself - collisions are only flagged when two or more rows share both the same group_id and an identical canonical attribute map. Bounded input: request body must serialize to at most 131072 bytes, at most 500 products, JSON nesting depth at most 12, and at most 20000 total JSON nodes. No network access, no persistence, and no external certification of any kind is performed. Results at most 96 KiB; retry identical input and authorization within 24 hours to recover a purchase.",
      "tools": [
        {
          "name": "merchant_catalog_acceptance",
          "description": "Deterministic acceptance report for a supplied product catalog: validates price/currency/availability/URL formatting, GS1 GTIN checksums, and flags duplicate SKUs, duplicate GTINs, and grouped-variant collisions. Checks only the structured rows given in the request - no network calls, no brand or marketplace certification, no ISO 4217 currency list. Price: 0.05 USDC per completed bounded job on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "products": {
                "items": {
                  "additionalProperties": false,
                  "description": "Submit the observed row as-is, including missing or invalid values. Row defects are reported by the job, not rejected by the tool schema.",
                  "properties": {
                    "attributes": {
                      "description": "Optional observed attribute map. Acceptance requires at most 50 string entries; keys at most 128 and values at most 256 characters."
                    },
                    "availability": {
                      "description": "Observed availability. Accepted values: in_stock, out_of_stock, preorder."
                    },
                    "brand": {
                      "description": "Optional observed brand. Acceptance requires a nonblank string of at most 256 characters."
                    },
                    "currency": {
                      "description": "Observed currency. Acceptance requires exactly three uppercase ASCII letters; no ISO registry lookup."
                    },
                    "group_id": {
                      "description": "Optional observed variant group. Acceptance requires a nonblank string of at most 128 characters."
                    },
                    "gtin": {
                      "description": "Optional observed GTIN. Acceptance requires a digit string of length 8, 12, 13 or 14 with a valid check digit. Leading zeros are significant."
                    },
                    "price": {
                      "description": "Observed price. Acceptance requires a canonical nonnegative decimal string with at most 15 integer and 6 fractional digits; numeric values are reported as defects."
                    },
                    "sku": {
                      "description": "Observed SKU. Acceptance requires a nonblank string of at most 128 characters."
                    },
                    "title": {
                      "description": "Observed title. Acceptance requires a nonblank string of at most 512 characters."
                    },
                    "url": {
                      "description": "Observed URL. Acceptance requires an absolute HTTP(S) URL without credentials, whitespace, controls or malformed percent escapes. Never fetched."
                    }
                  },
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "required_attributes": {
                "description": "Optional list of attribute keys that every row must supply in its attributes map.",
                "items": {
                  "maxLength": 128,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0588e4cb117b56f2b3fb7a9ffd4a9a1bf637471cf4633167d2a671ae20653681"
        }
      ],
      "digest": "sha256:0490605bb6ac0aa0c0e5c1278e1d618e3c6f392c714cf822b35afe5b927f0d2f"
    }
  }
}
