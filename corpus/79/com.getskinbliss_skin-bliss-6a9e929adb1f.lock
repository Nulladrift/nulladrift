      "instructions": "Skin Bliss reads skincare ingredient lists. Use it when someone asks about a skincare product, wants cosmetic products for a need, or wants to compare products.\nIt is not for identifying a rash, symptom or skin condition, or for choosing a treatment: those questions need no Skin Bliss search, and a doctor or dermatologist is the right pointer. Asking whether a product suits condition-prone skin (for example rosacea-prone) is a product question and in scope.\n\nHow to search:\n- A named product: search_products with query (name and/or brand), then get_product with the product's ref for details.\n- A need: use the filters instead of free text. Map the request:\n  - product type -> category (moisturizer, cleanser, actives for serums and treatments, toner, mask, exfoliator, suncare, body care, lip care, makeup for foundation, BB and CC cream and concealer, other for deodorant, shaving, perfume, sanitizer, nail and oral care); moisturizer leaves out eye creams unless the query says \"eye cream\"\n  - \"for dry / oily / combination / normal skin\" -> skin_type\n  - a concern -> concern: very_dry_skin, redness, sensitive_skin, fine_lines, wrinkles, dullness_texture (dull or rough skin), dark_spots (dark spots, post-acne marks), acne (breakouts), blackheads (blackheads, clogged pores), oil_pores (oiliness, visible pores), acne_prone (no pore-clogging ingredients), eczema_prone, rosacea_prone\n  - \"without X\" -> free_from (fragrance, parabens, silicones, sulfates, pegs, petroleum, phthalates, drying_alcohol, essential_allergens for strong allergens, microplastics)\n  - \"with X\" or \"strong X\" -> formula (barrier_support, barrier_lipids, sealing, hydration, soothing, antioxidants, brightening, ferments, peptides, retinoid, aha, bha, pha, oil_control, gentle_cleansing for cleansers that won't strip skin)\n  - \"drugstore\", \"affordable\", \"luxury\", \"pharmacy brand\", \"Korean\" -> brand_category (drugstore, masstige, prestige, luxury, pharmacy, professional, indie, natural for brands positioned as natural or organic, k_beauty, j_beauty, suncare)\n  - \"cruelty-free\" -> cruelty_free: true\n  - \"for men\", \"for my husband\" -> for_men: true. Without it (or men, shaving or beard in the query), lines marketed for men are left out.\n  - a child or teenager of a known age -> age_group: 11_or_under, 12_to_15 or 16_to_19. It leaves out the ingredients the Skin Bliss app avoids for that age and is never dropped. Say that it leaves out those ingredients; do not call the products safe for that age.\n- Combine filters; leave out what the person did not ask for. If nothing matches all filters, the search drops filters itself (brand type, supporting formula strengths, skin type, concern, then actives such as retinoid or bha; never ingredient exclusions) and lists them in relaxed.\n- Rinse-off products get no concern claims: cleansers, clay and mud masks, cleansing and most treatment masks, scrubs and shower gels. A concern filter returns only leave-on products (sheet and sleeping masks, peels, lotions). To find rinse-off products, leave out concern and use query (for example \"clay mask\"), skin_type, free_from and brand_category.\n- Results come back best first, at most 5. To compare products, call get_product for each.\n\nAbout the results:\n- A search shows the best matches only: 3, or up to 5 with limit. More products may match, so the number shown is not a total, and only the products returned come from Skin Bliss. Products found after dropping filters (listed in relaxed) match only partly.\n- Claims are worded by Skin Bliss's claim rules: \"May help ...\" is a hedged benefit, \"Has ... at a working dose\" states what the formula contains, \"Suits ...\" describes fit, not treatment.\n- Skin-type lines are relative: \"Suits dry skin better than most moisturizers\" compares the product with others of its own kind; it is not an absolute fit for every skin of that type.\n- watch_out lists what a product can make worse and pore-clogging notes; care lists patch-test, purging and sunscreen notes (reapply every 2 hours) for actives, sensitive skin and sunscreens.\n- The analysis reads the ingredient list and is not medical advice or a diagnosis. Some products are only in the Skin Bliss app.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get a Skin Bliss product",
          "description": "Get one Skin Bliss catalog product by the ref from search_products: what it suits and targets, its formula strengths, key ingredients, ingredient flags, things to watch out for and brand notes. Not for identifying a rash, symptom or skin condition, or for choosing a treatment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ref": {
                "description": "The product's ref from search_products",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "brand": {
                        "type": "string"
                      },
                      "brand_notes": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "care": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "category": {
                        "type": ["string", "null"]
                      },
                      "claims": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "contains": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "facts": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "formula": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "free_from": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "key_ingredients": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "name": {
                        "type": "string"
                      },
                      "note": {
                        "type": "string"
                      },
                      "ref": {
                        "type": "string"
                      },
                      "screens": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "spf": {
                        "type": ["number", "null"]
                      },
                      "suits": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "texture": {
                        "type": ["string", "null"]
                      },
                      "watch_out": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["brand", "brand_notes", "care", "category", "claims", "contains", "facts", "formula", "free_from", "key_ingredients", "name", "note", "ref", "screens", "spf", "suits", "texture", "watch_out"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1186522232df20e532f14f2ed4acc0f2ea0d0ab578195813fe47f8e11a6500ea"
        },
        {
          "name": "search_products",
          "title": "Search Skin Bliss products",
          "description": "Search the Skin Bliss skincare catalog by product name or brand, or by need: category, skin type, a skin concern the formula targets, ingredients to avoid, formula strengths such as barrier support or hydration, and brand type. Returns up to 5 products with what they suit, what their formula offers, and what to watch out for: the best matches, not every match. Use get_product for one product's details. Not for identifying a rash, symptom or skin condition, or for choosing a treatment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age_group": {
                "description": "Leaves out the ingredients the Skin Bliss app avoids for this age: 16_to_19 (retinoids, AHAs, vitamin C, tea tree and similar), 12_to_15 (also PHAs, peptides, vitamin C derivatives, zinc gluconate), 11_or_under (also BHA, benzoyl peroxide, sulfur and azelaic acid)",
                "enum": ["11_or_under", "12_to_15", "16_to_19"],
                "type": "string"
              },
              "brand_category": {
                "description": "Brand type and price level: drugstore (budget), masstige (mid-price), prestige, luxury, pharmacy (dermocosmetics), professional (clinic), indie, natural (brands positioned as natural or organic), k_beauty, j_beauty, suncare",
                "enum": ["drugstore", "masstige", "prestige", "luxury", "pharmacy", "professional", "indie", "natural", "k_beauty", "j_beauty", "suncare"],
                "type": "string"
              },
              "category": {
                "description": "Product type; actives = serums and treatments, makeup = foundation, BB and CC cream, concealer, other = deodorant, shaving, perfume, sanitizer, nail and oral care",
                "enum": ["moisturizer", "cleanser", "actives", "toner", "mask", "exfoliator", "suncare", "body care", "lip care", "makeup", "other"],
                "type": "string"
              },
              "concern": {
                "description": "A concern the product has a Skin Bliss claim for: very_dry_skin, redness, sensitive_skin, fine_lines, wrinkles, dullness_texture (dull or rough skin), dark_spots (dark spots, post-acne marks), acne (breakouts), blackheads (and clogged pores), oil_pores (oiliness, visible pores), acne_prone (no ingredients rated pore-clogging), eczema_prone, rosacea_prone. For the other concerns, products that can make it worse are left out; the three -prone ones are fit claims (no common triggers, barrier support, no pore-clogging ingredients). Rinse-off products (cleansers, clay and cleansing masks, scrubs) have no concern claims",
                "enum": ["very_dry_skin", "redness", "sensitive_skin", "fine_lines", "wrinkles", "dullness_texture", "dark_spots", "acne", "blackheads", "oil_pores", "eczema_prone", "rosacea_prone", "acne_prone"],
                "type": "string"
              },
              "cruelty_free": {
                "description": "Only brands known to be cruelty-free",
                "type": "boolean"
              },
              "for_men": {
                "description": "Only lines marketed for men. Without it, men's lines are left out unless the query names men, shaving or beards",
                "type": "boolean"
              },
              "formula": {
                "description": "What the formula must offer at a real dose: barrier_support, barrier_lipids (ceramides, cholesterol), sealing (occlusives), hydration, soothing, antioxidants, brightening, ferments, peptides, retinoid, aha, bha (salicylic acid), pha, oil_control, gentle_cleansing (cleansers that won't strip skin)",
                "items": {
                  "enum": ["barrier_support", "barrier_lipids", "sealing", "hydration", "soothing", "antioxidants", "brightening", "ferments", "peptides", "retinoid", "aha", "bha", "pha", "oil_control", "gentle_cleansing"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "free_from": {
                "description": "Ingredients the product must not contain; essential_allergens = strong allergens",
                "items": {
                  "enum": ["fragrance", "parabens", "silicones", "sulfates", "pegs", "petroleum", "phthalates", "drying_alcohol", "essential_allergens", "microplastics"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "limit": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Product name, brand, or both",
                "maxLength": 120,
                "type": "string"
              },
              "skin_type": {
                "description": "Products that suit this skin type better than most of their kind",
                "enum": ["dry", "oily", "combination", "normal"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "care": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "category": {
                      "type": ["string", "null"]
                    },
                    "claims": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "facts": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "formula": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "free_from": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "ref": {
                      "type": "string"
                    },
                    "suits": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "watch_out": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["brand", "care", "category", "claims", "facts", "formula", "free_from", "name", "ref", "suits", "watch_out"],
                  "type": "object"
                },
                "type": "array"
              },
              "relaxed": {
                "description": "Filters dropped to find matches; empty when every filter was applied",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["products", "relaxed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ee9751b0949434fd409d1089e11379d31f762f580a8cc6ffcb8898f523198ab6"
        }
      ],
      "digest": "sha256:5519d148606f3dd00d0ea956806989d2e43272896aae489c5dfbc6acc7abc513"
    }
