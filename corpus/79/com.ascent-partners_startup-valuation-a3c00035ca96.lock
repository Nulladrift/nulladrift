              "total_users": {
                "description": "Total users (buyers + sellers) in the period.",
                "type": "integer"
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "description": "Modelling assumptions applied.",
                "items": {
                  "type": "string"
                },
                "type": "array"
