        {
          "name": "valuation_comparables",
          "title": "Comparable Multiples",
          "description": "Market multiples from comparables: P/E, P/S, EV/EBITDA, EV/Revenue, and a regression-adjusted multiple. Method selects the ratio. Use when public comparables exist; for pre-revenue or private startups use valuation_core. Parameters apply per method: pe_ratio needs market_cap + net_income; ps_ratio needs market_cap + revenue; ev_ebitda needs enterprise_value + ebitda; ev_revenue needs enterprise_value + revenue; regression_multiple needs intercept + growth_rate + growth_coefficient (plus optional maturity/stage/geography terms). Only method is required; all other parameters are method-dependent, so supply those the selected method names and omit the rest (defaults apply where defined). Rate and decimal inputs are fractions (0.10 = 10%); probability and weight lists are in [0,1] and sum to 1. Returns value, method, inputs, assumptions, chapter, formula_number and calculation steps; pure arithmetic — no I/O and no external calls — rounded to 2 decimals, with no auth or rate limits. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "ebitda": {
                "description": "EBITDA, currency units.",
                "type": "number"
              },
              "enterprise_value": {
                "description": "Enterprise value (market cap + net debt), currency units.",
                "type": "number"
              },
              "geography": {
                "default": 0,
                "description": "Geography indicator.",
                "type": "number"
              },
              "geography_coefficient": {
                "default": 0,
                "description": "Regression slope on geography.",
                "type": "number"
              },
              "growth_coefficient": {
                "description": "Regression slope on growth (multiple points per unit growth).",
                "type": "number"
              },
              "growth_rate": {
                "description": "Revenue growth rate as a decimal (0.40 = 40%).",
                "type": "number"
              },
              "intercept": {
                "description": "Regression intercept β0 (base multiple).",
                "type": "number"
              },
              "market_cap": {
                "description": "Market capitalisation, currency units.",
                "type": "number"
              },
              "market_maturity": {
                "default": 0,
                "description": "Market maturity indicator.",
                "type": "number"
              },
              "maturity_coefficient": {
                "default": 0,
                "description": "Regression slope on market maturity.",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: pe_ratio = P/E = market cap / net income.; ps_ratio = P/S = market cap / revenue.; ev_ebitda = EV/EBITDA = enterprise value / EBITDA.; ev_revenue = EV/Revenue = enterprise value / revenue.; regression_multiple = Multiple = β0 + β1·g + β2·M + β3·S + β4·G.",
                "enum": ["pe_ratio", "ps_ratio", "ev_ebitda", "ev_revenue", "regression_multiple"],
                "type": "string"
              },
              "net_income": {
                "description": "Net income (earnings), currency units.",
                "type": "number"
              },
              "revenue": {
                "description": "Revenue for the period, currency units.",
                "type": "number"
              },
              "stage": {
                "default": 0,
                "description": "Company stage indicator.",
                "type": "number"
              },
              "stage_coefficient": {
                "default": 0,
                "description": "Regression slope on stage.",
                "type": "number"
              }
            },
            "required": ["method"],
            "type": "object"
          },
