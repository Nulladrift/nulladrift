        {
          "name": "valuation_capm",
          "title": "CAPM & Cost of Equity",
          "description": "Estimate the cost of capital: standard CAPM, startup-adjusted CAPM with size and illiquidity premiums, portfolio beta from weighted asset betas, and WACC blending after-tax cost of equity and debt. Method selects the formula. Use to derive the discount rate that feeds valuation_time_value and DCF models; for cross-border rates add valuation_international. Parameters apply per method: capm needs risk_free_rate + beta + market_return; startup_capm adds size_premium and liquidity_premium; portfolio_beta needs weights + betas, which must be equal length; wacc needs equity_value + debt_value + cost_of_equity + cost_of_debt + tax_rate. Only method is required; all other parameters are method-dependent, so supply those the selected method names and omit the rest (defaults apply where defined). Rate and decimal inputs are fractions (0.10 = 10%); probability and weight lists are in [0,1] and sum to 1. Returns value, method, inputs, assumptions, chapter, formula_number and calculation steps; pure arithmetic — no I/O and no external calls — rounded to 2 decimals, with no auth or rate limits. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "beta": {
                "description": "Systematic risk beta (market = 1.0).",
                "type": "number"
              },
              "betas": {
                "description": "Asset betas aligned with weights; typically 0.5–3.0 (market = 1.0).",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "cost_of_debt": {
                "description": "Pre-tax cost of debt Rd as a decimal.",
                "type": "number"
              },
              "cost_of_equity": {
                "description": "After-tax cost of equity Re as a decimal.",
                "type": "number"
              },
              "debt_value": {
                "description": "Market value of debt, in currency units.",
                "type": "number"
              },
              "equity_value": {
                "description": "Value of equity offered, currency units.",
                "type": "number"
              },
              "liquidity_premium": {
                "default": 0.03,
                "description": "Illiquidity premium as a decimal.",
                "type": "number"
              },
              "market_return": {
                "description": "Expected market return as a decimal (e.g. 0.10 for 10%).",
                "type": "number"
              },
              "market_risk_premium": {
                "description": "Market risk premium as a decimal (e.g. 0.06).",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: capm = E(R) = Rf + β·(E(Rm) - Rf).; startup_capm = r = Rf + β·MRP + size premium + illiquidity premium.; portfolio_beta = βp = Σ wᵢ·βᵢ.; wacc = WACC = (E/V)·Re + (D/V)·Rd·(1 − T).",
                "enum": ["capm", "startup_capm", "portfolio_beta", "wacc"],
                "type": "string"
              },
              "risk_free_rate": {
                "description": "Risk-free rate as a decimal (e.g. 0.04 for 4%).",
                "type": "number"
              },
              "size_premium": {
                "default": 0.05,
                "description": "Small-cap / size premium as a decimal.",
                "type": "number"
              },
              "tax_rate": {
                "default": 0.3,
                "description": "Effective tax rate as a decimal in [0,1].",
                "type": "number"
              },
              "weights": {
                "description": "Portfolio or factor weights, each in [0,1] and summing to 1 (same order as the paired value list).",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["method"],
            "type": "object"
          },
