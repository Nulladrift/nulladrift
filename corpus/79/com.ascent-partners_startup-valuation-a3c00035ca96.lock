        {
          "name": "valuation_biotech",
          "title": "Biotech Pipeline Valuation",
          "description": "Risk-adjusted biotech valuation: peak sales, decision-tree expected value, and full pipeline rNPV across drugs. Method selects the model. Use for pharma/drug pipelines; for hardware or deep tech use valuation_hardware. Parameters apply per method: peak_sales needs patient_population + penetration + price; decision_tree needs probabilities + terminal_value; pipeline needs drugs + discount_rate. Not for hardware or deep tech — for that use valuation_hardware. Only method is required; all other parameters are method-dependent, so supply those the selected method names and omit the rest (defaults apply where defined). Rate and decimal inputs are fractions (0.10 = 10%); probability and weight lists are in [0,1] and sum to 1. Returns value, method, inputs, assumptions, chapter, formula_number and calculation steps; pure arithmetic — no I/O and no external calls — rounded to 2 decimals, with no auth or rate limits. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "compliance": {
                "default": 1,
                "description": "Compliance / adherence rate as a decimal.",
                "type": "number"
              },
              "discount_rate": {
                "description": "Discount rate as a decimal (0.12 = 12%).",
                "type": "number"
              },
              "drugs": {
                "description": "Pipeline drugs: {peak_sales, multiple, p_success (0-1), years_to_peak}. All four keys are required per drug.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "method": {
                "description": "Formula to apply. Options: peak_sales = Peak = population × penetration × price × compliance.; decision_tree = EV = Π pᵢ × terminal value.; pipeline = V = Σ(peak sales × multiple × P_success) / (1+r)^n.",
                "enum": ["peak_sales", "decision_tree", "pipeline"],
                "type": "string"
              },
              "patient_population": {
                "description": "Target patient population treated per year.",
                "type": "number"
              },
              "penetration": {
                "description": "Market penetration as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "price": {
                "description": "Price per unit / treatment, currency units.",
                "type": "number"
              },
              "probabilities": {
                "description": "Probability of each outcome or stage, each in [0,1]; the list must sum to 1 where it is exhaustive.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "terminal_value": {
                "description": "Expected exit / terminal value, currency units.",
                "type": "number"
              }
            },
            "required": ["method"],
            "type": "object"
