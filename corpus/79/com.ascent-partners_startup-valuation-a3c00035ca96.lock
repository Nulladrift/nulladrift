              "method": {
                "description": "Formula to apply. Options: take_rate = Take rate = revenue / GMV.; gmv_multiple = Valuation = GMV × multiple.; buyer_retention = Retention = repeat buyers / base-period buyers.; network_density = Density = active buyers × active sellers / total users.",
                "enum": ["take_rate", "gmv_multiple", "buyer_retention", "network_density"],
                "type": "string"
              },
              "multiple": {
                "description": "Exit or market multiple applied to the metric.",
                "type": "number"
              },
              "revenue": {
                "description": "Revenue for the period, currency units.",
                "type": "number"
