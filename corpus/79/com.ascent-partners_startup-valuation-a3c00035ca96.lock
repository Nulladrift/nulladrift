        {
          "name": "valuation_time_value",
          "title": "Time Value of Money",
          "description": "Discount, compound, and forecast value over time: single future value PV, net present value of a cash-flow stream, annuity present value, discounted cash flow with a Gordon terminal value, constant-rate compound growth of revenue or cash flow, and the implied compound annual growth rate (CAGR). Method selects the formula. Use to convert future cash to today's value, to value a full forecast with a terminal value (dcf), to project a revenue or cash-flow series forward, or to derive the growth rate implied by two values; get the discount rate from valuation_capm or valuation_international. Parameters apply per method: present_value needs future_value + rate + periods; npv needs cash_flows + rate; annuity needs payment + rate + periods; dcf needs cash_flows + rate (optional: terminal_growth); compound_growth needs starting_value + growth_rate + periods; cagr needs starting_value + ending_value + periods. growth_rate must be greater than -1, cagr requires starting_value > 0 and periods > 0, and dcf requires rate greater than terminal_growth. Not for option values (use valuation_advanced) or for expected values over outcomes (use valuation_probability). Only method is required; all other parameters are method-dependent, so supply those the selected method names and omit the rest (defaults apply where defined). Rate and decimal inputs are fractions (0.10 = 10%); probability and weight lists are in [0,1] and sum to 1. Returns value, method, inputs, assumptions, chapter, formula_number and calculation steps; pure arithmetic — no I/O and no external calls — rounded to 2 decimals, with no auth or rate limits. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "cash_flows": {
                "description": "Cash flows by period, first element at t=1; negatives allowed for outflows.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "ending_value": {
                "description": "Value at t=n to compare against the starting value, in currency units.",
                "type": "number"
              },
              "future_value": {
                "description": "Future cash amount to discount, in currency units.",
                "type": "number"
              },
              "growth_rate": {
                "description": "Revenue growth rate as a decimal (0.40 = 40%).",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: present_value = PV = C / (1+r)^t.; npv = NPV = Σ Cₜ / (1+r)^t.; annuity = PV = P·[1-(1+r)^-n]/r.; compound_growth = V_n = V_0 (1+g)^n.; cagr = CAGR = (V_n / V_0)^(1/n) - 1.; dcf = DCF = Σ Cₜ/(1+r)^t + [C_n(1+g)/(r−g)]/(1+r)^n.",
                "enum": ["present_value", "npv", "annuity", "compound_growth", "cagr", "dcf"],
                "type": "string"
              },
              "payment": {
                "description": "Recurring payment per period, in currency units.",
                "type": "number"
              },
              "periods": {
                "description": "Number of compounding periods, must be ≥ 1 (may be fractional).",
                "type": "number"
              },
              "rate": {
                "description": "Per-period discount rate as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "starting_value": {
                "description": "Value at t=0 (revenue or cash flow) to grow forward, in currency units.",
                "type": "number"
              },
              "terminal_growth": {
                "default": 0,
                "description": "Perpetual growth rate g applied after the forecast window, as a decimal.",
                "type": "number"
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "description": "Modelling assumptions applied.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "chapter": {
                "description": "Source textbook chapter.",
                "type": "string"
              },
              "defaults_applied": {
                "description": "Optional parameters that were not supplied, so their documented defaults were used.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "error": {
                "description": "Error message when the call fails.",
                "type": "string"
              },
              "formula_number": {
                "description": "Source textbook formula number (e.g. '3.1').",
                "type": "string"
              },
              "inputs": {
                "description": "Echo of the normalised inputs used.",
                "type": "object"
              },
              "method": {
                "description": "Formula / method name that produced the result.",
                "type": "string"
              },
              "steps": {
                "description": "Intermediate steps for traceability.",
