      "instructions": "Startup valuation calculators: 14 tools covering probability, time value, CAPM, core pre-revenue methods, options, comparables, SaaS, marketplaces, fintech, biotech, hardware, international, stakeholder equity, and emerging methods. Select a formula with the `method` argument. Read the resource startup-valuation://methods for every method's required parameters, or use a prompt (value_pre_revenue_startup, value_saas_startup, model_funding_round) for a guided multi-method workflow.",
      "tools": [
        {
          "name": "valuation_advanced",
          "title": "Options & Scenario Analysis",
          "description": "Advanced techniques: Black-Scholes call value, binomial-tree option value, and scenario analysis. Method selects the technique. For a quick expected value over arbitrary outcome lists, prefer valuation_probability with method 'probability_weighted'; scenario_analysis here is for explicit named bull/base/bear scenario tables. Parameters apply per method: black_scholes and binomial need underlying + strike + risk_free_rate + volatility + time_to_maturity (binomial adds steps); scenario_analysis needs scenarios. Not for plain discounted cash flow — for that use valuation_time_value. Only method is required; all other parameters are method-dependent, so supply those the selected method names and omit the rest (defaults apply where defined). Rate and decimal inputs are fractions (0.10 = 10%); probability and weight lists are in [0,1] and sum to 1. Returns value, method, inputs, assumptions, chapter, formula_number and calculation steps; pure arithmetic — no I/O and no external calls — rounded to 2 decimals, with no auth or rate limits. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "method": {
                "description": "Formula to apply. Options: black_scholes = C = N(d₁)S - N(d₂)Ke^(-rT).; binomial = Cox-Ross-Rubinstein binomial option value.; scenario_analysis = E[V] = Σ pᵢ·Vᵢ over named scenarios.",
                "enum": ["black_scholes", "binomial", "scenario_analysis"],
                "type": "string"
              },
              "risk_free_rate": {
                "description": "Risk-free rate as a decimal (e.g. 0.04 for 4%).",
                "type": "number"
              },
              "scenarios": {
                "description": "Scenario objects: {name: str, probability: 0-1, value: currency}; probabilities should sum to 1.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "steps": {
                "default": 50,
                "description": "Binomial tree time steps (integer ≥ 1; higher = more accurate).",
                "type": "integer"
              },
              "strike": {
                "description": "Strike / exercise price K, currency units.",
                "type": "number"
              },
              "time_to_maturity": {
                "description": "Time to expiry in years T, must be ≥ 0.",
                "type": "number"
              },
              "underlying": {
                "description": "Underlying asset value S, currency units.",
                "type": "number"
              },
              "volatility": {
                "description": "Annualised volatility σ as a decimal (0.80 = 80%).",
                "type": "number"
              }
            },
            "required": ["method"],
            "type": "object"
