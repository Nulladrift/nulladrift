                "description": "Active buyers in the period.",
                "type": "integer"
              },
              "active_sellers": {
                "description": "Active sellers in the period.",
                "type": "integer"
              },
              "buyers_period_1": {
                "description": "Distinct buyers in the base period.",
                "type": "integer"
              },
              "buyers_repeat": {
                "description": "Distinct buyers from the base period who purchased again.",
                "type": "integer"
