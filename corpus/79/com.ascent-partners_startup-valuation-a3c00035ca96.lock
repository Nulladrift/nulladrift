        {
          "name": "valuation_core",
          "title": "Pre-Revenue Core Methods",
          "description": "The textbook's pre-revenue methods: Scorecard, Berkus, Risk-Factor Summation, VC Method (post- and pre-money), and exit terminal value. Use these first for early-stage startups. Method selects the formula, and each method names its own parameters: scorecard needs average_valuation + weights + scores; berkus takes five factor awards; risk_factor needs base_valuation + risk_ratings; vc_post_money needs terminal_value + target_return; vc_pre_money needs post_money + investment; terminal_value needs projected_revenue + multiple; triangulated needs the scorecard inputs plus terminal_value/target_return/investment. Routing: for SAFEs, tokens, ESG, network effects, or data-moat methods use valuation_emerging; for options or bull/base/bear scenario tables use valuation_advanced; for public-comparable multiples use valuation_comparables. Only method is required; all other parameters are method-dependent, so supply those the selected method names and omit the rest (defaults apply where defined). Rate and decimal inputs are fractions (0.10 = 10%); probability and weight lists are in [0,1] and sum to 1. Returns value, method, inputs, assumptions, chapter, formula_number and calculation steps; pure arithmetic — no I/O and no external calls — rounded to 2 decimals, with no auth or rate limits. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "average_valuation": {
                "description": "Average pre-revenue valuation for the sector, currency units.",
                "type": "number"
              },
              "base_valuation": {
                "description": "Pre-adjustment baseline valuation, currency units.",
                "type": "number"
              },
              "investment": {
                "description": "Amount invested, currency units.",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: scorecard = V = V_avg · Σ(wᵢ·sᵢ) across 7 factors.; berkus = V = Σ factor awards, each capped at $500K.; risk_factor = V = V_base + Σ(rᵢ·$250K) over 12 risks.; vc_post_money = Post = Terminal / target ROI.; vc_pre_money = Pre = Post - Investment.; terminal_value = Terminal = projected revenue × multiple.; triangulated = Runs Scorecard and the VC Method together and returns their mean.",
                "enum": ["scorecard", "berkus", "risk_factor", "vc_post_money", "vc_pre_money", "terminal_value", "triangulated"],
                "type": "string"
              },
              "multiple": {
                "description": "Exit or market multiple applied to the metric.",
                "type": "number"
              },
              "post_money": {
                "description": "Post-money valuation, currency units.",
                "type": "number"
              },
              "product_rollout": {
                "default": 0,
                "description": "Berkus award for product rollout / sales, 0 to 500,000.",
                "type": "number"
              },
              "projected_revenue": {
                "description": "Projected revenue at exit, currency units.",
                "type": "number"
              },
              "prototype": {
                "default": 0,
                "description": "Berkus award for prototype / technology, 0 to 500,000.",
                "type": "number"
              },
              "quality_team": {
                "default": 0,
                "description": "Berkus award for management team, 0 to 500,000.",
                "type": "number"
              },
              "risk_ratings": {
                "description": "12 risk factor ratings in [-2,2] (very low to very high); each unit shifts value ±250,000.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "scores": {
                "description": "Factor multipliers aligned with weights (1.0 = average, >1 above average).",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "sound_idea": {
                "default": 0,
                "description": "Berkus award for soundness of the idea, 0 to 500,000 (USD).",
                "type": "number"
              },
              "strategic_relationships": {
                "default": 0,
                "description": "Berkus award for strategic relationships, 0 to 500,000.",
                "type": "number"
              },
              "target_return": {
                "description": "VC target return multiple (e.g. 10 for a 10x target).",
                "type": "number"
              },
              "terminal_value": {
                "description": "Expected exit / terminal value, currency units.",
                "type": "number"
              },
              "weights": {
                "description": "Portfolio or factor weights, each in [0,1] and summing to 1 (same order as the paired value list).",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assumptions": {
                "description": "Modelling assumptions applied.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "chapter": {
                "description": "Source textbook chapter.",
                "type": "string"
              },
              "defaults_applied": {
                "description": "Optional parameters that were not supplied, so their documented defaults were used.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "error": {
                "description": "Error message when the call fails.",
                "type": "string"
              },
              "formula_number": {
                "description": "Source textbook formula number (e.g. '3.1').",
                "type": "string"
