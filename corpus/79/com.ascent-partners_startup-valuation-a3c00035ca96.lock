        {
          "name": "valuation_saas",
          "title": "SaaS Metrics & Valuation",
          "description": "SaaS unit economics and valuation: LTV, CAC, MRR, ARR, net revenue retention, magic number, Rule of 40, CAC payback, and ARR revenue-multiple valuation. Method selects the metric. Use for subscription software; for marketplace GMV metrics use valuation_marketplace and for payments/lending use valuation_fintech. Parameters apply per method: ltv needs arpu + gross_margin + churn_rate; cac needs sales_marketing_expense + new_customers; arr needs subscription_values; nrr needs starting_revenue + ending_revenue; revenue_multiple needs arr + revenue_multiple. Not for company-level pre-revenue value — for that use valuation_core. Only method is required; all other parameters are method-dependent, so supply those the selected method names and omit the rest (defaults apply where defined). Rate and decimal inputs are fractions (0.10 = 10%); probability and weight lists are in [0,1] and sum to 1. Returns value, method, inputs, assumptions, chapter, formula_number and calculation steps; pure arithmetic — no I/O and no external calls — rounded to 2 decimals, with no auth or rate limits. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "arpu": {
                "description": "Average revenue per user per month, currency units.",
                "type": "number"
              },
              "arr": {
                "description": "Annual recurring revenue, currency units.",
                "type": "number"
              },
              "arr_value": {
                "description": "Annual recurring revenue, currency units.",
                "type": "number"
              },
              "cac": {
                "description": "Customer acquisition cost per customer, currency units.",
                "type": "number"
              },
              "churn_rate": {
                "description": "Periodic churn rate as a decimal (0.02 = 2% per month).",
                "type": "number"
              },
              "ending_revenue": {
                "description": "Revenue from the same cohort at period end, currency units.",
                "type": "number"
              },
              "expansion_revenue": {
                "default": 0,
                "description": "Expansion revenue from the cohort in the period.",
                "type": "number"
              },
              "gross_margin": {
                "description": "Gross margin as a decimal (0.80 = 80%).",
                "type": "number"
              },
              "growth_rate": {
                "description": "Revenue growth rate as a decimal (0.40 = 40%).",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: ltv = LTV = ARPU × gross margin / churn.; cac = CAC = S&M expense / new customers.; mrr = MRR = ARR / 12 (reverse of ARR).; arr = ARR = Σ monthly subscriptions × 12.; nrr = NRR = (ending + expansion) / start; ending excludes expansion.; magic_number = Magic Number = net new ARR / prior-quarter S&M.; rule_of_40 = Score = growth rate + profit margin.; cac_payback = Months to recover CAC from gross profit.; revenue_multiple = Valuation = ARR × multiple.",
                "enum": ["ltv", "cac", "mrr", "arr", "nrr", "magic_number", "rule_of_40", "cac_payback", "revenue_multiple"],
                "type": "string"
              },
              "mrr_per_customer": {
                "description": "Monthly recurring revenue per customer, currency units.",
                "type": "number"
              },
              "net_new_arr": {
                "description": "Net new ARR added in the period, currency units.",
                "type": "number"
              },
              "new_customers": {
                "description": "Number of customers acquired in the period.",
                "type": "integer"
              },
              "profit_margin": {
                "description": "Profit margin as a decimal (0.15 = 15%).",
                "type": "number"
              },
              "revenue_multiple": {
                "description": "SaaS revenue multiple (e.g. 8 for 8x ARR).",
                "type": "number"
              },
              "sales_marketing_expense": {
                "description": "Sales & marketing spend for the period, currency units.",
                "type": "number"
              },
              "sm_expense_prior": {
                "description": "Sales & marketing expense in the prior period, currency units.",
                "type": "number"
              },
              "starting_revenue": {
                "description": "Revenue from the cohort at period start, currency units.",
                "type": "number"
              },
              "subscription_values": {
                "description": "Monthly subscription revenue per customer (summed x12 for ARR).",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
