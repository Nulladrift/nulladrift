        {
          "name": "valuation_fintech",
          "title": "Fintech Valuation",
          "description": "Value and size fintech business models: payment revenue, lending valuation, payment-processor DCF, and neobank customer-based valuation. Method selects the model. Use for payments, lending, and neobanks; for SaaS-style unit economics use valuation_saas. Parameters apply per method: payment_revenue needs transaction_volume + take_rate; lending needs loan_book + roe + pe_multiple; payment_processor adds growth_rate + discount_rate + terminal_multiple; neobank needs customers + arpu + gross_margin + churn_rate + pe_multiple. Only method is required; all other parameters are method-dependent, so supply those the selected method names and omit the rest (defaults apply where defined). Rate and decimal inputs are fractions (0.10 = 10%); probability and weight lists are in [0,1] and sum to 1. Returns value, method, inputs, assumptions, chapter, formula_number and calculation steps; pure arithmetic — no I/O and no external calls — rounded to 2 decimals, with no auth or rate limits. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "arpu": {
                "description": "Average revenue per user per month, currency units.",
                "type": "number"
              },
              "churn_rate": {
                "description": "Periodic churn rate as a decimal (0.02 = 2% per month).",
                "type": "number"
              },
              "customers": {
                "description": "Number of customers.",
                "type": "integer"
              },
              "discount_rate": {
                "description": "Discount rate as a decimal (0.12 = 12%).",
                "type": "number"
              },
              "gross_margin": {
                "description": "Gross margin as a decimal (0.80 = 80%).",
                "type": "number"
              },
              "growth_rate": {
                "description": "Revenue growth rate as a decimal (0.40 = 40%).",
                "type": "number"
              },
              "loan_book": {
                "description": "Outstanding loan book / principal, currency units.",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: payment_revenue = Revenue = volume × take rate.; lending = V = loan book × ROE × P/E - NPL reserves.; payment_processor = DCF of payment revenue with a terminal multiple.; neobank = Customer LTV × P/E applied to the customer base.",
                "enum": ["payment_revenue", "lending", "payment_processor", "neobank"],
                "type": "string"
              },
              "npl_reserves": {
                "default": 0,
                "description": "Non-performing loan reserves deducted, currency units.",
                "type": "number"
              },
              "pe_multiple": {
                "description": "Price/earnings multiple applied to earnings.",
                "type": "number"
              },
              "roe": {
                "description": "Return on equity as a decimal (0.20 = 20%).",
                "type": "number"
              },
              "take_rate": {
