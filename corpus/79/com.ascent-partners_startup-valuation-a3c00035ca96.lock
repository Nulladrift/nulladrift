                "type": "number"
              },
              "employee_option_scenarios": {
                "description": "Option scenarios: {probability: 0-1, fmv: currency, strike: currency, shares: int} per scenario; probabilities should sum to 1.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "enterprise_value": {
                "description": "Enterprise value (market cap + net debt), currency units.",
                "type": "number"
              },
              "equipment": {
                "default": 0,
                "description": "Equipment, currency units.",
                "type": "number"
              },
              "equity_value": {
                "description": "Value of equity offered, currency units.",
                "type": "number"
              },
              "fair_market_value": {
                "description": "Current fair market value per share, currency units.",
                "type": "number"
              },
              "inventory": {
                "default": 0,
                "description": "Inventory, currency units.",
                "type": "number"
              },
