        {
          "name": "valuation_emerging",
          "title": "Emerging & Alternative Methods",
          "description": "Modern and alternative valuation: SAFE conversion (discount, cap, expected value), token valuation (equation of exchange, NVT), ESG adjustments (rate, premium, discount), Metcalfe network value, data-moat value, and remote-first premium/NPV. Method selects the model. Use for SAFEs, tokens, ESG, network effects, data moats, and remote-first adjustments; for classic pre-revenue methods use valuation_core. Parameters apply per method: safe_discount needs series_a_price + discount; safe_cap needs cap + series_a_price; safe_expected needs investment + cap + discount + series_a_valuation + series_a_price; token_value needs transaction_volume + price_per_tx + velocity + supply; metcalfe needs n; esg_* need base_valuation + a score; data_moat needs data_volume + data_uniqueness + monetization_rate + competitive_advantage_years. Routing: for classic pre-revenue methods (Scorecard, Berkus, Risk-Factor Summation, VC Method) use valuation_core; for options or scenario tables use valuation_advanced; for public-comparable multiples use valuation_comparables. Only method is required; all other parameters are method-dependent, so supply those the selected method names and omit the rest (defaults apply where defined). Rate and decimal inputs are fractions (0.10 = 10%); probability and weight lists are in [0,1] and sum to 1. Returns value, method, inputs, assumptions, chapter, formula_number and calculation steps; pure arithmetic — no I/O and no external calls — rounded to 2 decimals, with no auth or rate limits. An unknown method, or a missing method-required parameter, returns an error instead of a value.",
          "inputSchema": {
            "properties": {
              "annual_savings": {
                "description": "Annual cost savings, currency units.",
                "type": "number"
              },
              "base_valuation": {
                "description": "Pre-adjustment baseline valuation, currency units.",
                "type": "number"
              },
              "cap": {
                "description": "SAFE valuation cap, currency units.",
                "type": "number"
              },
              "competitive_advantage_years": {
                "description": "Years the data moat is expected to last.",
                "type": "number"
              },
              "cost_savings_pct": {
                "default": 0.2,
                "description": "Cost savings as a fraction of baseline.",
                "type": "number"
              },
              "data_uniqueness": {
                "description": "Uniqueness / scarcity of the data in [0,1].",
                "type": "number"
              },
              "data_volume": {
                "description": "Volume of proprietary data held.",
                "type": "number"
              },
              "discount": {
                "description": "Conversion discount as a decimal (0.20 = 20% discount).",
                "type": "number"
              },
              "discount_per_point": {
                "default": 0.01,
                "description": "Valuation discount per ESG risk point as a decimal.",
                "type": "number"
              },
              "discount_rate": {
                "description": "Discount rate as a decimal (0.12 = 12%).",
                "type": "number"
              },
              "esg_opportunity_discount": {
                "default": 0,
                "description": "ESG opportunity discount subtracted from the rate.",
                "type": "number"
              },
              "esg_risk_premium": {
                "default": 0,
                "description": "ESG risk premium added to the rate, as a decimal.",
                "type": "number"
              },
              "esg_risk_score": {
                "description": "ESG risk score in points (higher = riskier).",
                "type": "number"
              },
              "esg_score": {
                "description": "ESG score in points (e.g. 0-100).",
                "type": "number"
              },
              "investment": {
                "description": "Amount invested, currency units.",
                "type": "number"
              },
              "k": {
                "description": "Number of events k for the Poisson probability P(X=k); integer ≥ 0.",
                "type": "integer"
              },
              "market_cap": {
                "description": "Market capitalisation, currency units.",
                "type": "number"
              },
              "method": {
                "description": "Formula to apply. Options: safe_discount = Price = Series A price × (1 - discount).; safe_cap = Price = cap / pre-money shares (cap-based).; safe_expected = Expected SAFE value across cap and discount outcomes.; token_value = Value = (volume × price) / (velocity × supply).; nvt_ratio = NVT = market cap / daily transaction volume.; esg_rate = r = base + ESG risk premium - ESG opportunity discount.; esg_premium = Valuation uplift = base × (1 + score × premium per point).; esg_discount = Valuation reduction = base × (1 - risk score × discount per point).; metcalfe = V = k · n².; data_moat = Discounted value of monetised proprietary data.; remote_npv = Perpetuity NPV = annual savings / discount rate.; remote_premium = Valuation premium from cost savings, talent access, and productivity.",
                "enum": ["safe_discount", "safe_cap", "safe_expected", "token_value", "nvt_ratio", "esg_rate", "esg_premium", "esg_discount", "metcalfe", "data_moat", "remote_npv", "remote_premium"],
                "type": "string"
              },
              "monetization_rate": {
                "description": "Fraction of data value monetisable as a decimal.",
                "type": "number"
              },
              "n": {
                "description": "Number of users or nodes in the network.",
                "type": "number"
              },
              "premium_per_point": {
                "default": 0.02,
                "description": "Valuation premium per ESG point as a decimal.",
                "type": "number"
              },
              "price_per_tx": {
                "description": "Protocol revenue per transaction, currency units.",
                "type": "number"
              },
              "productivity_gain": {
                "default": 0.05,
                "description": "Productivity gain as a decimal.",
                "type": "number"
              },
              "rate": {
                "description": "Per-period discount rate as a decimal (0.10 = 10%).",
                "type": "number"
              },
              "series_a_price": {
                "description": "Price per share in the next priced (Series A) round.",
                "type": "number"
              },
              "series_a_valuation": {
                "description": "Series A post-money valuation, currency units.",
                "type": "number"
              },
              "supply": {
                "description": "Circulating token supply.",
                "type": "number"
              },
              "talent_access_premium": {
                "default": 0.1,
