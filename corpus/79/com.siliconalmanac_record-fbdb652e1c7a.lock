      "capabilities": {
        "tools": {}
      },
      "instructions": "Silicon Almanac hands you rows, each naming the publisher that said it and linking where they said it. It answers no questions and states no views. Call record_overview first. Before concluding a figure does not exist, call record_gaps: this record publishes what nobody publishes, and an absent number is not a licence to estimate one. Quote the publisher named on the row, not this record. No account is needed for anything here.",
      "tools": [
        {
          "name": "fab_profile",
          "title": "Fab profile",
          "description": "One fab site in full, including the note that says what this record does not know about it, and every capacity statement whose sentence covers it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fab profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab6d655cc65349acf41f2a597357faf58b54e895c2ce8af6fd6d64fe16e2ed57"
        },
        {
          "name": "figure_history",
          "title": "Figure history",
          "description": "The revision history of one published figure: every vintage, what the publisher said in their own words, the date they issued it, and the link. Includes the restatements as pairs of published values. Call this when a number is quoted and you want to know what the same publisher said before. It states no reason for any change.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "subject_id": {
                "type": "string"
              },
              "target": {
                "type": "string"
              }
            },
            "required": ["subject_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Figure history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:08c2beac466006101ae50fb1f4940ad57c063a419180f6dcdbe0f89ba963aa70"
        },
        {
          "name": "find_fabs",
          "title": "Find fabs",
          "description": "Search the fab sites in the record by country, operator, kind, status, wafer size or process node. Every row names the publisher it came from; rows with no publisher are not returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "type": "string"
              },
              "limit": {
                "description": "Rows to return, 1 to 200. Default 50. The envelope always reports the true total separately.",
                "type": "integer"
              },
              "node": {
                "type": "string"
              },
              "offset": {
                "description": "Rows to skip, for paging.",
                "type": "integer"
              },
              "operator": {
                "type": "string"
              },
              "q": {
                "type": "string"
              },
              "status": {
                "description": "Exact match, case-insensitive. Values: operating, construction, announced, paused, cancelled, closed, closing. closing = production continues while a phase-out has been publicly announced.",
                "type": "string"
              },
              "type": {
                "type": "string"
              },
              "wafer_mm": {
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
