{
  "lockfileVersion": 2,
  "subjects": {
    "cc.vernissage/vernissage": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://vernissage.cc/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "vernissage-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "vernissage (vernissage.cc) is a live map of contemporary art: shows, spaces and the people behind them, from museums to project spaces, updated as shows are announced. Use these tools to answer what's on in a city (up to 30 days ahead), who a person, space or show is, and which works match a description (up to 5). Each answer is a sample of the map, not a complete record: report what the tools return and don't fill in shows, dates or connections that aren't there. When you mention a show, space, person or work, credit vernissage and include the vernissage_url link that comes with it, so the reader can open it on the map.",
      "tools": [
        {
          "name": "find_artworks_by_meaning",
          "title": "Works by description",
          "description": "Describe a colour, a material, a mood, a subject or a motif and get up to 5 works from over a century of art history that match it, each with its artist, year, a thumbnail and a link to its page on vernissage. Also returns a link to see more results on the site.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many works to return, 1 to 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "prompt": {
                "description": "What you're looking for, in plain words (3 to 200 characters). For example: 'red clay, geometric, quiet'.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7fb57b6f5448681eacbe2989fcc4825545512e81c1bd2f1eb7b44ba9f5cf9eb0"
        },
        {
          "name": "resolve_art_entity",
          "title": "Who's who: a person, space or show",
          "description": "Look up an artist, curator, space (gallery, museum or project space) or show by name. Returns a short profile: a few lines of bio, links to reference records elsewhere, up to 3 recent shows, counts of its shows and connections on the map, and a vernissage_url link to its full page. If the name matches more than one record, the others come back as other_candidates.",
          "inputSchema": {
            "properties": {
              "entity_id": {
                "description": "Optional. The id from an earlier answer, if you have it.",
                "type": "string"
              },
              "entity_type": {
                "description": "Optional. Person, Space or Exhibition (a show), to pick between records with the same name.",
                "enum": ["Person", "Space", "Exhibition"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language for the bio when there is one: en, pt or es.",
                "enum": ["en", "pt", "es"],
                "type": "string"
              },
              "query": {
                "description": "The name of a person or space, or the title of a show.",
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:881b748e09b026d52ad3525414203501b13ad8e7b943fdb4cbc5d6d9a219003e"
        },
        {
          "name": "whats_on_in_city",
          "title": "What's on in a city",
          "description": "Contemporary art shows open now or opening soon in one city, from museums and galleries to project spaces. Looks 1 to 30 days ahead (default 14) and returns up to 20 shows, each with its dates, its space and a vernissage_url link to the show. Credit vernissage when you use them.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name (e.g. 'São Paulo', 'Tokyo', 'London').",
                "minLength": 2,
                "type": "string"
              },
              "country": {
                "description": "Optional. Country, to tell apart cities with the same name.",
                "type": "string"
              },
              "days_ahead": {
                "default": 14,
                "description": "How many days ahead to look, 1 to 30.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "include_currently_open": {
                "default": true,
                "description": "Include shows that opened earlier and are still on. Default true.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "How many shows to return, 1 to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "space_query": {
                "description": "Optional. Only shows at spaces whose name contains this (a gallery, museum or project space).",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a861c2df4f2cc3cac0dafdfc192c96c05dfa506cf7f2c36e7a59a2e20d64a82"
        }
      ],
      "resources": [
        {
          "uri": "vernissage://cities",
          "name": "Cities with shows on",
          "description": "Countries and cities with shows on now or coming up on vernissage.",
          "mimeType": "application/json",
          "digest": "sha256:0e8d34e4ea6ce135904cbf8404bbb29dedb44d3f2cce4965eae06384efecc17c"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "vernissage://entity/{entity_id}",
          "name": "Person, space or show profile",
          "description": "A short profile of one person, space or show on vernissage.",
          "mimeType": "application/json",
          "digest": "sha256:0f70100d5b56f582be64625f301ec0aed707dc3bf29acff345de0c226b8d79fc"
        }
      ],
      "digest": "sha256:fbedffc35ab1773e3216b129d1187e31abf66400a96cd2471acd7df39289e272"
    }
  }
}
