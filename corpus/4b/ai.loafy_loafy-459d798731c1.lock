                "type": "string"
              },
              "loaf_shape": {
                "description": "How a sourdough bread was shaped: boule (round) or batard (oval). A baguette or a loaf pan bread is a bake_type of its own.",
                "enum": ["boule", "batard"],
                "type": "string"
