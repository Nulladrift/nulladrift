        {
          "name": "log_bake",
          "title": "Add a bake to my Loafy journal",
          "description": "Add a bake to the baker's Loafy bake journal: what was baked and when, the recipe figures, how it went and what to try next time. Returns the new entry with a link, where photos are added. The same bake sent again within two minutes returns the first entry instead of a second one, and a bake already in the journal changes with update_bake. Needs the baker's Loafy account.",
          "inputSchema": {
            "properties": {
              "add_ins": {
                "description": "What else went into the dough or onto it besides flour, water, starter, salt and yeast, comma-separated, each as its name and grams when the baker gave them, such as \"walnuts 80, raisins 60, hulled hemp seeds 30\"; names from the list: walnuts, hazelnuts, sunflower_seeds, pumpkin_seeds, sesame, flaxseeds, hemp_seeds, poppy_seeds, raisins, cranberries, olives, cheese, sun_dried_tomatoes, chocolate; anything else in the baker's words. A change names only the add-ins it adds or corrects; the others stay. \"walnuts 0\" takes walnuts out.",
                "type": "string"
              },
              "autolyse_minutes": {
                "description": "Minutes of an autolyse: the flour and water rested alone before the starter and the salt went in.",
                "maximum": 1440,
                "minimum": 0,
                "type": "integer"
              },
              "bake_level": {
                "description": "On a stove: the dial's level while baking.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "bake_minutes": {
                "description": "Minutes in the oven, whole minutes (90 seconds is 2); with two phases, the first.",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "bake_temp_celsius": {
                "description": "Oven temperature in °C; with two phases, the first (in a Dutch oven, with the lid on). A value above 300 °C is only plausible in a pizza or wood-fired oven.",
                "maximum": 550,
                "minimum": 50,
                "type": "integer"
              },
              "bake_type": {
                "default": "sourdough_bread",
                "description": "What was baked.",
                "enum": ["sourdough_bread", "pizza", "focaccia", "bagels", "brioche", "croissant", "baguettes", "loaf_pan_bread", "bread_rolls", "pan_bread", "tortilla", "naan", "flatbread", "other"],
                "type": "string"
              },
              "baked_on": {
                "description": "The day of the bake, as YYYY-MM-DD; today if left out.",
                "type": "string"
              },
              "baking_method": {
                "description": "What it was baked in: home_oven also for a Dutch oven, a stone or a tray in it.",
                "enum": ["home_oven", "pizza_oven", "wood_fired", "stove"],
                "type": "string"
              },
              "bulk_hours": {
                "description": "Hours of bulk fermentation.",
                "maximum": 48,
                "minimum": 0,
                "type": "number"
              },
              "bulk_temp_celsius": {
                "description": "Dough or room temperature during bulk, in °C.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "dough_rise_percent": {
                "description": "How much the dough grew during bulk fermentation, in percent.",
                "maximum": 300,
                "minimum": 0,
                "type": "integer"
              },
              "dry_yeast_percent": {
                "description": "Dry or instant yeast as a percentage of flour.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "flours": {
                "description": "The flours, comma-separated, each as the baker named it with its grams: the brand and name on the bag (\"Caputo Pizzeria 400\"; find_flours finds the exact one, then give it as flour:<id> 400), or the grain with the word on its bag (\"whole rye 100\", \"Weizenmehl Type 1050 300\", \"T65 500\"), the baker's own words about a flour in brackets after it (\"rye 100 (fresh-milled at the market)\"), a flour without grams alone. The old kinds still work: bread_flour, all_purpose, whole_wheat, rye, spelt, einkorn, durum, tipo_00, other.",
                "type": "string"
              },
              "fresh_yeast_percent": {
                "description": "Fresh yeast as a percentage of flour.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "fridge_proof_hours": {
                "description": "Hours the shaped dough proofed in the fridge.",
                "maximum": 72,
                "minimum": 0,
                "type": "number"
              },
              "hydration_percent": {
                "description": "Water as a percentage of flour.",
                "maximum": 120,
                "minimum": 40,
                "type": "integer"
              },
              "loaf_shape": {
                "description": "How a sourdough bread was shaped: boule (round) or batard (oval). A baguette or a loaf pan bread is a bake_type of its own.",
                "enum": ["boule", "batard"],
                "type": "string"
              },
              "next_time_notes": {
                "description": "What to try differently next time.",
                "type": "string"
              },
              "notes": {
                "description": "How the bake went, in the baker's words: only what no other parameter takes.",
                "type": "string"
              },
              "other_bake_type_description": {
                "description": "What was baked, in the baker's words, when bake_type is other.",
                "type": "string"
              },
              "ph_readings": {
                "description": "What the baker's pH meter read, comma-separated, each as its step and value, such as \"end_of_bulk 4.1, starter_ready 4.2\"; steps: starter_ready, mixing, end_of_bulk, shaping, before_proof, after_proof, after_bake. A change names only the steps it adds or corrects; the others keep their readings.",
                "type": "string"
              },
              "piece_weight_grams": {
                "description": "What one piece weighed when it was divided, in grams.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "pieces": {
                "description": "How many pieces the dough was divided into: loaves, rolls or pizza balls.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "pre_rest": {
                "description": "An autolyse, flour and water rested alone first, or a fermentolyse, everything mixed at once. A fermentolyse has no rest and no minutes.",
                "enum": ["autolyse", "fermentolyse"],
                "type": "string"
              },
              "preheat_level": {
                "description": "On a stove: the dial's level while the pan heated.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "preheat_temp_celsius": {
                "description": "How hot the oven was preheated, in °C. A value above 300 °C is only plausible in a pizza or wood-fired oven.",
                "maximum": 550,
                "minimum": 50,
                "type": "integer"
              },
              "problems": {
                "description": "What went wrong, comma-separated, from: dense_crumb, gummy_interior, no_oven_spring, flat_loaf, burnt_crust, pale_crust, bland_flavor, too_sour, didnt_rise, sticky_dough; anything else goes in the notes.",
                "type": "string"
              },
              "proof_rise_percent": {
                "description": "How much more the shaped dough grew during the proof, in percent.",
                "maximum": 300,
                "minimum": 0,
                "type": "integer"
              },
              "rating": {
                "description": "How it turned out, 1 to 5 stars.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "room_temp_proof_hours": {
                "description": "Hours the shaped dough proofed at room temperature.",
                "maximum": 24,
                "minimum": 0,
                "type": "number"
              },
              "salt_percent": {
                "description": "Salt as a percentage of flour.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "second_bake_minutes": {
                "description": "Minutes of that second phase, whole minutes.",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "second_bake_temp_celsius": {
                "description": "Oven temperature in °C of a second phase: with the lid off, or turned down. A value above 300 °C is only plausible in a pizza or wood-fired oven.",
                "maximum": 550,
                "minimum": 50,
                "type": "integer"
              },
              "starter": {
                "description": "The name of the baker's starter that went in, if any.",
                "type": "string"
              },
              "starter_percent": {
                "description": "Starter as a percentage of flour.",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "stretch_fold_count": {
                "description": "Sets of stretch and folds during bulk.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
