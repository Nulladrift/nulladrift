      "instructions": "Loafy is a free sourdough baking companion (loafy.ai) built on the open book The Sourdough Framework by Hendrik Kleinwächter. Its tools return the book itself: its contents, any chapter or section in full, and passages found by their words, each with its chapter's link. They also return answers to real questions from bakers, bread and pizza dough in grams, and Loafy's guided, timed journeys, each with a `url` to the same answer, recipe or journey on loafy.ai, where the timers run and progress is saved. Loafy's Bake Planner plans a bake backwards from when the bread should be ready (plan_sourdough_bake) and estimates bulk fermentation from several models (estimate_bulk_fermentation). Without a Loafy account, reading and searching the book and the answers is limited to 3 questions a day, every lookup within 15 minutes counting as one question; with an account it has no limit. The calculators, the guides and the book's table of contents need no account.",
      "tools": [
        {
          "name": "add_container",
          "title": "Add a container to Loafy",
          "description": "Add a container to the baker's Loafy account with its empty weight in grams, so Loafy can take it off when dough is weighed in it. Returns it with its id and a link. A name the baker already uses is not added again; that container comes back, and update_container changes it. Needs the baker's Loafy account.",
