        {
          "name": "calculate_pizza_dough",
          "title": "Pizza dough calculator",
          "description": "Calculate pizza dough in grams from the number of pizzas, the ball weight and hydration, with either fresh yeast or sourdough starter. Returns flour, water, salt, leavening and toppings, plus a link to the same recipe on loafy.ai. method_url is the step-by-step method to hand the baker. A loaf of bread is calculate_bread_dough. A value outside its range is corrected, and notes name it.",
          "inputSchema": {
            "properties": {
              "dough_type": {
                "default": "yeast",
                "description": "Leavened with fresh yeast or with sourdough starter.",
                "enum": ["yeast", "sourdough"],
                "type": "string"
              },
              "hydration_percent": {
                "default": 60,
                "description": "Water as a percentage of flour. 55-65 is easy to handle, above 70 is expert.",
                "maximum": 75,
                "minimum": 55,
                "type": "integer"
              },
              "oven": {
                "default": "home",
                "description": "home is a domestic oven, pizza an Ooni or Roccbox, wood a wood-fired oven.",
                "enum": ["home", "pizza", "wood"],
                "type": "string"
              },
              "pizzas": {
                "default": 4,
                "description": "How many pizzas.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "weight_per_pizza_g": {
                "description": "Dough ball weight in grams. Left out, it follows the oven: 250 g home, 270 g pizza oven, 280 g wood-fired.",
                "maximum": 350,
                "minimum": 50,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "description": "Pizza dough in grams.",
            "properties": {
              "ingredients": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Flour, water, salt and the leavening (fresh yeast or starter), in grams.",
