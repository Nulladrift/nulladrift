        {
          "name": "calculate_bread_dough",
          "title": "Bread dough calculator",
          "description": "Calculate a sourdough bread recipe in grams from loaf count, loaf size and hydration, with add-ins such as walnuts, raisins or seeds when the baker wants them. Returns flour, water, starter, salt and the add-ins, plus a link to the same recipe on loafy.ai where the baker can adjust it, bake it with \"Bake this\" and run the timers. Pizza dough is calculate_pizza_dough, and when to start a bake is plan_sourdough_bake. A value outside its range is corrected, and notes name it.",
          "inputSchema": {
            "properties": {
              "add_ins": {
                "description": "Add-ins for the dough, comma-separated, each as its name and its share of the flour in percent, such as \"walnuts 15, raisins 10\"; grams with \"g\" (\"walnuts 80 g\") are for the whole batch, and a name without a number takes 10 %. Names from the list: walnuts, hazelnuts, sunflower_seeds, pumpkin_seeds, sesame, flaxseeds, hemp_seeds, poppy_seeds, raisins, cranberries, olives, cheese, sun_dried_tomatoes, chocolate; anything else in the baker's words.",
                "type": "string"
              },
              "flours": {
                "description": "The flours, comma-separated, each as the baker named it with its share of all the flour in percent, such as \"Caputo Pizzeria 70, whole rye 30\": the brand and name on the bag, a token from find_flours, or the grain with the word on its bag. The first takes what the others leave. With flours, the whole grain follows from them and whole_grain_percent is not needed.",
                "type": "string"
              },
              "hydration_percent": {
                "default": 60,
                "description": "Water as a percentage of flour. The book recommends around 60 % for most flours; higher is more open but stickier.",
                "maximum": 100,
                "minimum": 55,
                "type": "integer"
              },
              "loaf_size_g": {
                "default": 500,
                "description": "Flour per loaf in grams, not the dough weight: 500 g of flour makes one standard loaf of about 860 g of dough. For a loaf of a given dough weight, the flour is about 58 % of it at 60 % hydration.",
                "maximum": 2000,
                "minimum": 50,
                "type": "integer"
              },
              "loaves": {
                "default": 1,
                "description": "How many loaves to bake.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "whole_grain_percent": {
                "default": 20,
                "description": "Share of the flour that is whole grain, the rest is bread flour.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "description": "A sourdough bread recipe in grams.",
            "properties": {
              "add_ins": {
                "description": "What goes into the dough besides flour, water, starter and salt, such as walnuts or seeds.",
                "items": {
                  "properties": {
                    "grams": {
                      "description": "Its weight for the batch, in grams.",
                      "type": "number"
                    },
                    "label": {
                      "description": "The baker's own add-in in their words.",
                      "type": "string"
                    },
                    "name": {
                      "description": "The add-in: one of Loafy's names, or \"other\" for the baker's own.",
                      "type": "string"
                    },
                    "note": {
                      "description": "Why its share is not the one asked for, when it is not.",
                      "type": "string"
                    },
                    "percent": {
                      "description": "Its share of the flour, in percent.",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "dough_per_loaf_g": {
                "description": "The dough of one loaf, in grams.",
                "type": "number"
              },
              "flours": {
                "description": "The baker's own flours, when they were given.",
                "items": {
                  "properties": {
                    "grams": {
                      "description": "Its flour, in grams.",
                      "type": "number"
                    },
                    "name": {
