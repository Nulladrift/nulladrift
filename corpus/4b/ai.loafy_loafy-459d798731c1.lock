        {
          "name": "plan_sourdough_bake",
          "title": "Bake Planner",
          "description": "Loafy's Bake Planner. Plan a sourdough bake backwards from when the bread should come out of the oven: when to feed the starter, mix, shape, proof in the fridge, preheat and bake, and how much starter suits the kitchen's temperature according to The Sourdough Framework. Returns the times and a link to the same plan in the Bake Planner on loafy.ai. The time is the baker's local date and time, such as 2026-10-24T10:00. The amounts of flour, water and starter are calculate_bread_dough; how long bulk fermentation takes at a given dough temperature and starter amount is estimate_bulk_fermentation.",
          "inputSchema": {
            "properties": {
              "bulk_hours": {
                "description": "Hours of bulk fermentation, if the baker knows their dough. Without it, the book's figure for the kitchen's temperature.",
                "maximum": 16,
                "minimum": 4,
                "type": "integer"
              },
              "cold_proof_hours": {
                "default": 12,
                "description": "Hours the shaped loaf proofs in the fridge. The book says 8 to 12.",
                "maximum": 24,
                "minimum": 8,
                "type": "integer"
              },
              "kitchen_temperature_c": {
                "default": 22,
                "description": "Kitchen temperature in °C, which sets how much starter to use.",
                "maximum": 32,
                "minimum": 15,
                "type": "integer"
              },
              "ready_at": {
                "description": "When the bread should come out of the oven, as the baker's local date and time, e.g. \"2026-10-24T10:00\".",
                "type": "string"
              }
            },
            "required": ["ready_at"],
            "type": "object"
          },
          "outputSchema": {
            "description": "A sourdough bake planned backwards from when the bread should be ready.",
            "properties": {
              "input": {
                "description": "The arguments as the tool used them, after any correction.",
                "properties": {},
                "type": "object"
              },
              "note": {
                "description": "A remark on the whole result, such as why nothing was found.",
                "type": "string"
              },
