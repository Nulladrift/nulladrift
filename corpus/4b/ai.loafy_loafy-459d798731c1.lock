        {
          "name": "estimate_bulk_fermentation",
          "title": "Bake Planner: bulk fermentation estimate",
          "description": "Loafy's Bake Planner. Estimate how long the bulk fermentation of a sourdough bread dough (from mixing until shaping) takes at a given dough temperature and starter amount. Returns a range from several models with each model's figure and source: Bill Wraith's rise-time model (2007/08), the Loafy bakers (his model scaled by how long the bulk fermentations Loafy's bakers logged took) and, where the book names one, the figure from The Sourdough Framework. Every time is theoretical: the dough is done when it has grown, as the result's note says. For a whole bake planned backwards from when the bread should be ready, use plan_sourdough_bake.",
          "inputSchema": {
            "properties": {
              "dough_temperature_c": {
                "description": "The dough's temperature in °C, measured in the dough. Convert °F: 72 °F is 22 °C.",
                "maximum": 30,
                "minimum": 10,
                "type": "number"
              },
              "salt": {
                "default": "yes",
                "description": "\"yes\" for a bread dough with about 2 % salt, \"no\" for a levain or the starter itself.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "starter_hydration_percent": {
                "default": 100,
                "description": "The starter's hydration in %: 100 for equal flour and water, 50 for a stiff one.",
                "maximum": 200,
                "minimum": 50,
                "type": "integer"
              },
              "starter_percent": {
                "description": "Starter as a percentage of the flour weight: 100 g of starter on 500 g of flour is 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["dough_temperature_c", "starter_percent"],
            "type": "object"
          },
          "outputSchema": {
            "description": "How long bulk fermentation takes, as several models see it: theoretical figures, not a timer.",
            "properties": {
              "dough_temperature_c": {
                "description": "The dough temperature the estimate is for, in °C.",
                "type": "number"
              },
              "from_hours": {
                "description": "The shortest time any model gives: when to start checking the dough.",
                "type": "number"
              },
              "inoculation_percent": {
                "description": "The flour already fermented, the flour in the starter, as a share of all the flour: what Bill Wraith's model counts.",
                "type": "number"
              },
              "input": {
                "description": "The arguments as the tool used them, after any correction.",
                "properties": {},
                "type": "object"
              },
              "models": {
                "description": "Every model that has a figure for this dough.",
                "items": {
                  "properties": {
                    "bakers": {
                      "description": "The bakers behind the Loafy bakers' figure.",
                      "type": "integer"
                    },
                    "bakes": {
                      "description": "The bakes behind the Loafy bakers' or the baker's own figure.",
                      "type": "integer"
                    },
                    "from_hours": {
                      "description": "Its time, or the start of its span.",
                      "type": "number"
                    },
                    "model": {
                      "description": "wraith, bakers, book or journal.",
                      "type": "string"
                    },
                    "name": {
                      "description": "The model.",
                      "type": "string"
                    },
                    "source": {
                      "description": "Where the model comes from.",
                      "type": "string"
                    },
                    "time": {
                      "description": "Its time in words.",
                      "type": "string"
                    },
                    "to_hours": {
                      "description": "The end of its span.",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "A remark on the whole result, such as why nothing was found.",
                "type": "string"
              },
