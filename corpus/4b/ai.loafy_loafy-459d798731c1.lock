        {
          "name": "update_bake",
          "title": "Change a bake in my Loafy journal",
          "description": "Change a bake in the baker's Loafy bake journal, by its id from list_my_bakes or log_bake: only the figures and notes given change, the rest stays, and a text given replaces the old text. No bake is deleted. Returns the bake with a link. Needs the baker's Loafy account.",
          "inputSchema": {
            "properties": {
              "add_ins": {
                "description": "What else went into the dough or onto it besides flour, water, starter, salt and yeast, comma-separated, each as its name and grams when the baker gave them, such as \"walnuts 80, raisins 60, hulled hemp seeds 30\"; names from the list: walnuts, hazelnuts, sunflower_seeds, pumpkin_seeds, sesame, flaxseeds, hemp_seeds, poppy_seeds, raisins, cranberries, olives, cheese, sun_dried_tomatoes, chocolate; anything else in the baker's words. A change names only the add-ins it adds or corrects; the others stay. \"walnuts 0\" takes walnuts out.",
                "type": "string"
              },
              "autolyse_minutes": {
                "description": "Minutes of an autolyse: the flour and water rested alone before the starter and the salt went in.",
                "maximum": 1440,
                "minimum": 0,
                "type": "integer"
              },
              "bake_level": {
                "description": "On a stove: the dial's level while baking.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "bake_minutes": {
                "description": "Minutes in the oven, whole minutes (90 seconds is 2); with two phases, the first.",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "bake_temp_celsius": {
                "description": "Oven temperature in °C; with two phases, the first (in a Dutch oven, with the lid on). A value above 300 °C is only plausible in a pizza or wood-fired oven.",
                "maximum": 550,
                "minimum": 50,
                "type": "integer"
              },
              "bake_type": {
                "description": "What was baked.",
                "enum": ["sourdough_bread", "pizza", "focaccia", "bagels", "brioche", "croissant", "baguettes", "loaf_pan_bread", "bread_rolls", "pan_bread", "tortilla", "naan", "flatbread", "other"],
                "type": "string"
              },
              "baked_on": {
                "description": "The day of the bake, as YYYY-MM-DD.",
                "type": "string"
              },
              "baking_method": {
                "description": "What it was baked in: home_oven also for a Dutch oven, a stone or a tray in it.",
                "enum": ["home_oven", "pizza_oven", "wood_fired", "stove"],
                "type": "string"
              },
              "bulk_hours": {
                "description": "Hours of bulk fermentation.",
                "maximum": 48,
                "minimum": 0,
                "type": "number"
