{
  "lockfileVersion": 2,
  "subjects": {
    "com.blacklabelbots/site-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://blacklabelbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "Black Label Bots site MCP",
        "version": "2026.09.15"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for blacklabelbots.com: read the site, list what can be bought (list_products) and start a purchase (create_checkout, get_checkout). create_checkout never charges anything: it returns a continue_url where the buyer pays on the Stripe-hosted checkout page. No credentials. Rate limited; stay under one call per second. See https://blacklabelbots.com/auth.md.",
      "tools": [
        {
          "name": "create_checkout",
          "description": "Start a purchase of one offer. Returns a continue_url: send the buyer there to pay on the Stripe-hosted checkout page. This tool does not charge anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offer_id": {
                "enum": ["marketing-mac", "marketing-windows", "realestate-mac", "realestate-windows", "academy-mac", "academy-windows", "vigil-mac", "vigil-windows", "vigil-node", "sunset-mac", "termial", "custom-website", "operator-monthly", "operator-yearly"],
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["offer_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f57ec6ac50c92c7679301a802f08744414c840338a6170cb89b74e6265f441b"
        },
        {
          "name": "get_checkout",
          "description": "Read a checkout started with create_checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkout_id": {
                "type": "string"
              }
            },
            "required": ["checkout_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:740ff212a1f0a4e97c58fe1b537c71a72da98ca86d64c2d9d24862618dab69e5"
        },
        {
          "name": "list_products",
          "description": "Everything an agent can buy from Black Label Bots, with Stripe-verified prices, billing terms, delivery and live availability.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:04fe5d7b109746181a608501b325c36be9bc8dc65cb55e27da92af0228c707c0"
        },
        {
          "name": "read_page",
          "description": "Read one https://blacklabelbots.com page as Markdown (Cloudflare Markdown for Agents) or stripped text, up to 40,000 characters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
