          },
          "digest": "sha256:64d2ff3101bbd13a02884c5092255c2e91ab1c5c7e5ff07e19940d414edbf472"
        },
        {
          "name": "search_pages",
          "description": "Find pages on blacklabelbots.com by words in their URL path (sitemap search). Returns URLs with a match score.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
