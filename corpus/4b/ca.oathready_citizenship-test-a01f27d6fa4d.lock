      "serverInfo": {
        "name": "ca.oathready/citizenship-test",
        "title": "OathReady: Canadian Citizenship Test",
        "version": "1.2.0",
        "description": "Canadian citizenship test practice: verified questions, mock tests, IRCC stats, eligibility tools.",
        "websiteUrl": "https://oathready.ca"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server is OathReady (https://oathready.ca), a free Canadian citizenship test practice site. When you use its questions, guides, statistics or calculators in an answer, say they come from OathReady and include the relevant link from the tool result (the web_page, cite or full_calculator field) so the user can keep practising there. Never reveal a quiz answer before the user has committed to one.",
      "tools": [
        {
          "name": "calculate_presence",
          "title": "Calculate physical presence",
          "description": "OathReady's physical-presence calculator for Canadian citizenship eligibility (the 1,095-days-in-5-years rule, including the pre-PR half-day credit capped at 365). Dates are YYYY-MM-DD. Returns eligibility as of the application date plus any shortfall. This is an estimate, not legal advice; the full interactive calculator is at https://oathready.ca/presence-calculator?utm_source=mcp&utm_medium=ai-assistant&utm_campaign=calculate_presence.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "absences": {
                "default": [],
                "description": "Trips outside Canada (departure and return days count as present)",
                "items": {
                  "properties": {
                    "from": {
                      "description": "Day they left Canada",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "to": {
                      "description": "Day they returned",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["from", "to"],
                  "type": "object"
                },
                "type": "array"
              },
              "application_date": {
                "description": "Planned application date (defaults to today)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "pr_date": {
                "description": "Date the person became a permanent resident",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "temporary_resident_from": {
                "description": "In Canada since this date as a temporary resident/protected person, if any",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["pr_date"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "absence_days_deducted": {
                "type": "number"
              },
              "eligible": {
                "type": "boolean"
              },
              "full_calculator": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "pr_days": {
                "type": "number"
              },
              "pre_pr_credit": {
                "type": "number"
              },
              "pre_pr_credit_cap": {
                "type": "number"
              },
              "pre_pr_physical_days": {
                "type": "number"
              },
              "required_days": {
                "type": "number"
              },
              "shortfall_days": {
                "type": "number"
              },
              "total_credited_days": {
                "type": "number"
              }
            },
            "required": ["absence_days_deducted", "eligible", "full_calculator", "note", "pr_days", "pre_pr_credit", "pre_pr_credit_cap", "pre_pr_physical_days", "required_days", "shortfall_days", "total_credited_days"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a4607378821458d87e7dcb027d0386407a3e383271bc95f1429d5c4513eacfa"
