        {
          "name": "check_answer",
          "title": "Check or look up an answer",
          "description": "Look up a question in OathReady's verified bank and optionally grade an answer to it. Accepts a question id (exact) OR remembered question text (fuzzy matched against all questions and their alternate phrasings). Typical uses: grading long after a question was fetched, or a user half-remembering a question from their real test and wanting the verified answer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answer": {
                "description": "The user's answer to grade, if they have one",
                "type": "string"
              },
              "language": {
                "description": "Language the answer (and question_text, if given) is written in; grading compares against that language's text",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "question_id": {
                "description": "The question id, e.g. q-042 (exact match)",
                "type": "string"
              },
              "question_text": {
                "description": "The question as the user remembers it (fuzzy matched); used when no id is given",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "correct_answer": {
                "type": "string"
              },
              "explanation": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "match_confidence": {
                "enum": ["exact_id", "high", "medium", "low"],
                "type": "string"
              },
              "other_possible_matches": {
                "description": "Runner-up matches when the text match was not certain",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "question": {
                      "type": "string"
                    },
                    "question_id": {
                      "type": "string"
                    }
                  },
                  "required": ["question", "question_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "question": {
                "type": "string"
              },
              "question_id": {
                "type": "string"
              },
              "web_page": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "your_answer_correct": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "null when no answer was provided to grade"
              }
            },
            "required": ["correct_answer", "explanation", "match_confidence", "other_possible_matches", "question", "question_id", "web_page", "your_answer_correct"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11ba538996c2c72d07f304c3782c66f964c1c99515c3da6fc5b5766de9a3e2cc"
        },
