          "description": "Safety score for an EVM or Solana token: contract/mint authority checks, holder concentration, on-chain liquidity depth, pool age and trade-flow flags. Use when you need to screen a token or mint address before interacting with it: contract or mint authority, holder concentration, liquidity depth, pool age. Example input: ?address=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913&chain=base. Returns: address, chain, score, risk_level, flags, onchain, liquidity, disclaimer (a heuristic screen, not financial advice).",
