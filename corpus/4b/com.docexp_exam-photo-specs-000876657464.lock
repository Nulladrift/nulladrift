          "inputSchema": {
            "properties": {
              "exam": {
                "description": "Exam name, e.g. \"NEET\", \"SSC\", \"JEE Main\", \"CTET\"",
                "type": "string"
              }
            },
            "required": ["exam"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9ddc13142eeb44e72beed51da27f8866d1496928c424d8af44031738e4115c31"
        },
        {
          "name": "get_passport_photo_size",
          "description": "Official passport or visa photo size for a country (US passport, US visa, Canada passport, UK passport), quoted from the issuing government page, with the source URL and the date checked.",
          "inputSchema": {
            "properties": {
              "document": {
                "description": "e.g. \"US passport\", \"US visa\", \"Canada\", \"UK passport\"",
                "type": "string"
              }
            },
            "required": ["document"],
            "type": "object"
          },
          "behavior": {
