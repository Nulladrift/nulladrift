        {
          "name": "list_editions",
          "description": "List the Quran text editions you can request: Arabic text, translations in many languages, tafsir and transliteration. Filter by language code (for example en, ur, fr) and/or type (translation, tafsir, quran, transliteration). Returns the ids to pass to the verse tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "ISO language code such as en, ur, fr, ar",
                "type": "string"
              },
              "query": {
                "description": "part of a name, for example sahih or maududi",
                "type": "string"
              },
              "type": {
                "description": "translation, tafsir, quran or transliteration",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": "integer"
              },
              "editions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "english_name": {
                      "type": "string"
                    },
                    "id": {
                      "description": "edition id to pass to the verse tools, for example en.sahih",
                      "type": "string"
                    },
                    "language": {
                      "description": "ISO language code",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "type": {
                      "description": "quran, translation, tafsir, transliteration and so on",
                      "type": "string"
                    }
                  },
                  "required": ["id", "language", "name", "type"],
                  "type": "object"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["count", "editions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List editions and translations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1308b7b31701e742091b33a329277cb00b61f3e5a34a11e247380f6b33d9d4c4"
        },
        {
          "name": "list_reciters",
          "description": "List reciters with audio recitations (recitation per ayah or per surah, mp3/ogg). Filter by language code, or by a name fragment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "ISO language code of the recitation, for example ar",
                "type": "string"
              },
              "query": {
                "description": "part of the reciter name, for example mishary",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": "integer"
              },
              "reciters": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "language": {
                      "type": "string"
                    },
                    "media": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "kbs": {
                            "type": "integer"
                          },
                          "mode": {
                            "description": "versebyverse (one file per ayah) or surahbysurah (one file per surah)",
                            "type": "string"
                          },
                          "type": {
                            "description": "mp3 or ogg",
                            "type": "string"
                          }
                        },
                        "required": ["kbs", "mode", "type"],
                        "type": "object"
                      },
                      "type": ["null", "array"]
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "language", "media", "name"],
                  "type": "object"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["count", "reciters"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
