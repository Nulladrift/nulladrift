      "serverInfo": {
        "name": "globalquran",
        "title": "Global Quran",
        "version": "1.0.0",
        "description": "Quran text, translations, tafsir and audio from globalquran.com",
        "websiteUrl": "https://globalquran.com"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Global Quran: the Quran text in Arabic with about 95 translations in 41 languages, tafsir and transliteration editions, and audio recitations.\nStart with list_editions to find edition ids (for example quran-simple for Arabic, en.sahih for an English translation). Verse tools default to Arabic plus Sahih International when no editions are given.\nA verse reference is surah:ayah, for example 2:255, or a global number from 1 to 6236.",
      "tools": [
        {
          "name": "get_audio_url",
          "description": "Get the audio file address for a recitation. With an ayah it returns that ayah (when the reciter has verse-by-verse recordings); without an ayah it returns the full surah file. Use list_reciters for reciter ids.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ayah": {
                "description": "ayah number inside the surah; leave out for the whole surah",
                "type": "integer"
              },
              "format": {
                "description": "mp3 or ogg; default is the best available",
                "type": "string"
              },
              "reciter": {
                "description": "reciter id from list_reciters, for example ar.alafasy",
                "type": "string"
              },
              "surah": {
                "description": "surah number 1 to 114",
                "type": "integer"
              }
            },
            "required": ["reciter", "surah"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "reciter": {
                "type": "string"
              },
              "scope": {
                "description": "ayah or surah",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["reciter", "scope", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a recitation audio link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2cdac44946bf530046730d71996472313908b148007faa03493fabc9d271c5b7"
        },
        {
          "name": "get_ayah",
          "description": "Get one ayah in one or more editions side by side, for example reference 2:255 with editions quran-simple and en.sahih. Reference is surah:ayah or a global ayah number (1 to 6236).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "editions": {
                "description": "edition ids, at most 5; default quran-simple and en.sahih",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "reference": {
                "description": "surah:ayah such as 2:255, or a global ayah number 1 to 6236",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "editions": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "verses": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ayah": {
                      "type": "integer"
                    },
                    "reference": {
                      "description": "surah:ayah",
                      "type": "string"
                    },
                    "surah": {
                      "type": "integer"
                    },
                    "texts": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "edition": {
                            "type": "string"
                          },
                          "text": {
                            "type": "string"
                          }
                        },
                        "required": ["edition", "text"],
                        "type": "object"
                      },
                      "type": ["null", "array"]
                    }
                  },
                  "required": ["ayah", "reference", "surah", "texts"],
                  "type": "object"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["editions", "verses"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an ayah"
          },
          "behavior": {
