      "serverInfo": {
        "name": "replenwise-preview",
        "title": "Replenwise reorder preview",
        "version": "1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Build net units sold per SKU per store-local day, subtracting cancellations and refunds from the original sales. For Shopify use orders plus inventory exports; for WooCommerce use the orders export and current stock; for a spreadsheet group sales by SKU and local date. Include zero-sales days. Never infer missing history as zero, clamp negative values or invent facts; ask the merchant to reconcile refunds when the export cannot establish net sales. Ask the merchant for lead times, review periods, minimum orders and case packs. Stock is the stock on hand at as_of. Ask about incoming orders and committed stock: this preview assumes neither is present. History must end the day before as_of and cover max(365,257+largest lead_time_days+review_period_days) days, at most 468. Quantities and order values are final: quote them exactly as returned, without rounding or changing them. A null quantity means no safe quantity was returned. ",
      "tools": [
        {
          "name": "get_upload_page",
          "title": "Get the preview upload page",
          "description": "Build net units sold per SKU per store-local day, subtracting cancellations and refunds from the original sales. For Shopify use orders plus inventory exports; for WooCommerce use the orders export and current stock; for a spreadsheet group sales by SKU and local date. Include zero-sales days. Never infer missing history as zero, clamp negative values or invent facts; ask the merchant to reconcile refunds when the export cannot establish net sales. Ask the merchant for lead times, review periods, minimum orders and case packs. Stock is the stock on hand at as_of. Ask about incoming orders and committed stock: this preview assumes neither is present. History must end the day before as_of and cover max(365,257+largest lead_time_days+review_period_days) days, at most 468. Quantities and order values are final: quote them exactly as returned, without rounding or changing them. A null quantity means no safe quantity was returned. For up to 500 SKUs, prepare two UTF-8 CSV files. sales.csv header: date,sku,units. Use one row per SKU per day, including zeros. stock.csv header: sku,as_of,start_date,stock_on_hand,lead_time_days,review_period_days,minimum_order,case_pack,unit_cost,timezone,currency,platform. Use one row per SKU and the same as_of, timezone, currency and platform on every row. unit_cost may be blank. The merchant can open the upload page URL and drop both files. Neither the files nor the preview are saved. The merchant can copy the result from the page and paste it back into this chat. There is no tool to read it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf615365a96428b8d4ad044ff3472391720e4fe7b9d9535a159cd2d8f4793d4e"
        },
        {
          "name": "preview_reorder",
          "title": "Preview a reorder plan",
          "description": "Build net units sold per SKU per store-local day, subtracting cancellations and refunds from the original sales. For Shopify use orders plus inventory exports; for WooCommerce use the orders export and current stock; for a spreadsheet group sales by SKU and local date. Include zero-sales days. Never infer missing history as zero, clamp negative values or invent facts; ask the merchant to reconcile refunds when the export cannot establish net sales. Ask the merchant for lead times, review periods, minimum orders and case packs. Stock is the stock on hand at as_of. Ask about incoming orders and committed stock: this preview assumes neither is present. History must end the day before as_of and cover max(365,257+largest lead_time_days+review_period_days) days, at most 468. Quantities and order values are final: quote them exactly as returned, without rounding or changing them. A null quantity means no safe quantity was returned. Send every selected SKU in a compact daily units array starting at start_date, up to 20 SKUs. Each array position is the next day. All amounts are in the store currency. No account or files are saved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "format": "date",
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "platform": {
                "enum": ["shopify", "woocommerce", "other"],
                "type": "string"
              },
              "skus": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "case_pack": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "lead_time_days": {
                      "maximum": 160,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "minimum_order": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "review_period_days": {
                      "maximum": 90,
                      "minimum": 7,
                      "type": "integer"
                    },
                    "sku": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "start_date": {
                      "format": "date",
                      "type": "string"
                    },
                    "stock_on_hand": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "unit_cost": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "units": {
                      "items": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "maxItems": 468,
                      "minItems": 365,
                      "type": "array"
                    }
                  },
                  "required": ["case_pack", "lead_time_days", "minimum_order", "review_period_days", "sku", "start_date", "stock_on_hand", "units"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "timezone": {
                "description": "IANA store time zone, for example America/New_York",
                "type": "string"
              }
            },
            "required": ["as_of", "currency", "platform", "skus", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f9d1c6b5a1bfdb195a4c728d287ed430b5cb18cd00b9691edcaef5b2a09a5c6"
        }
      ],
      "digest": "sha256:22deaa668bc63827c0244c5932168ceb759cb11708fdd4ca96950a658e21647c"
    }
  }
