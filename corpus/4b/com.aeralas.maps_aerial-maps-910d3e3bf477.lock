                  "scaleBar": {
                    "default": true,
                    "type": "boolean"
                  },
                  "titleBlock": {
                    "default": true,
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "pageSize": {
                "default": "tabloid",
                "enum": ["letter", "legal", "tabloid"],
                "type": "string"
              },
              "subjectParcel": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "properties": {
                      "at": {
                        "additionalItems": false,
                        "description": "[longitude, latitude] of a point on the property. Use when there is no street address, or when the state records none for its parcels.",
                        "items": [
                          {
                            "maximum": 180,
                            "minimum": -180,
                            "type": "number"
                          },
                          {
                            "maximum": 90,
                            "minimum": -90,
                            "type": "number"
                          }
                        ],
                        "maxItems": 2,
                        "minItems": 2,
                        "type": "array"
                      },
                      "label": {
                        "description": "Text for the outline, e.g. \"SITE\" or \"2.3 AC\".",
                        "maxLength": 80,
                        "type": "string"
                      },
                      "recenter": {
                        "default": true,
                        "description": "On a map located by address, centre the frame on the parcel instead of on the geocoded point, which sits on the road and can be a lot or two away. Has no effect when you give center: that frame is yours.",
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  }
                ],
                "default": false,
                "description": "Outline the property itself: finds its tax parcel and draws it as the subject property. With an address, the parcel is the one recorded at that street address; with center or subjectParcel.at, the one under that point. Available in the states listed under parcels in the docs. The check response says which parcel was picked (number, address, acres) so you can confirm it before buying. If none is found the map is still drawn, with a parcel_not_found warning."
              },
              "title": {
                "description": "Title block heading. Defaults to the address.",
                "maxLength": 200,
                "type": "string"
              },
              "titleBlockScale": {
                "default": 1,
                "description": "Size multiplier for the title block.",
                "maximum": 2,
                "minimum": 0.6,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
