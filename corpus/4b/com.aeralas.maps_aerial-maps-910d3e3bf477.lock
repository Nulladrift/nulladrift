        {
          "name": "make_map",
          "title": "Buy a print-ready map",
          "description": "Buy the print-resolution map. No wallet? Call it once: it returns a link to give your user, who pays $39 by card with no account, and an order id for check_order (preview_map returns the same link). With an x402 wallet it renders the map and returns a download link, priced by what the request asks for, in USDC: Backdrop $0.50, Labelled map $0.75, Site map $1.00 (get_service_info has the rule). The first call returns the payment requirements with the exact amount; sign and call again with the payment. Charged only if the render succeeds. Includes 7 days of free revisions via revise_map. With the mapId of a map already bought, adds what a dearer tier includes for the difference. Overlays and panel annotations are sold only by card ($39, which also opens the map in the editor): asked for here, make_map returns a card payment link instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
