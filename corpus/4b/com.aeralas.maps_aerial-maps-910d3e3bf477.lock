          "name": "check_order",
          "title": "Collect a map the user paid for by card (free)",
          "description": "When make_map could not be paid over x402, it returns a card payment link for the user and an order id. Call this with that order id after the user says they have paid: it returns the download link and a mapId for free revisions, or says the order is still awaiting payment.",
          "inputSchema": {
