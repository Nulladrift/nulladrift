      "serverInfo": {
        "name": "aeralas-maps",
        "title": "Aeralas Maps",
        "version": "1.1.0",
        "websiteUrl": "https://maps.aeralas.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Aeralas Maps makes print-ready 11x17 annotated aerial maps of US addresses for real estate, engineering and land development. Continental US, plus Hawaii and Alaska on regional frames; check_coverage (free) answers for any place. Typical flow: preview_map (free) lays the map out and returns a picture, a preview link, what was drawn and dropped, any warnings with their fix, and payUrl: give that link to the user, who sees the map and pays $39 by card with no account. Then check_order returns the print file, and revise_map changes it free for 7 days. check_map is the same without the picture. An agent with an x402 wallet can buy without the user instead: make_map, $0.50 to $1.00 by what is on the map.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check what can be drawn at a place (free)",
          "description": "Address or point in; imagery source and how sharp it prints, parcel availability and overlays out. Outside coverage it says so and what would work instead. One cheap call: use it before anything else when the place might not be covered. Continental US, plus Hawaii and Alaska on regional frames. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "A US street address, a city and state, or a ZIP code.",
                "maxLength": 200,
                "minLength": 5,
                "type": "string"
              },
              "center": {
                "additionalItems": false,
                "description": "[longitude, latitude] in WGS84. Alternative to address.",
                "items": [
                  {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  }
                ],
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              },
              "dpi": {
                "default": 200,
                "maximum": 300,
                "minimum": 150,
                "type": "integer"
              },
              "groundWidthM": {
                "default": 500,
                "description": "The frame you have in mind: how wide, in metres of ground.",
                "maximum": 40000,
                "minimum": 100,
                "type": "number"
              },
              "orientation": {
                "default": "portrait",
                "enum": ["portrait", "landscape"],
                "type": "string"
              },
              "pageSize": {
                "default": "tabloid",
                "enum": ["letter", "legal", "tabloid"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:38f1b5683abf2736c2404395642d30ab78a535ad546247087a0355b8e515ce94"
        },
        {
          "name": "check_map",
          "title": "Check a map layout (free)",
          "description": "Lay out the map and report what it had to compromise on -- overlapping labels, truncated text, annotations off the page -- each with the annotation, a code and the fix as data; plus the imagery quality, everything drawn (with its place on the ground and box on the page) and what was dropped. Returns no image. Free; iterate here before buying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "Continental US only, plus Hawaii and Alaska on regional frames (groundWidthM 3300 or more). Where to centre the map: a US street address with city and state (\"1750 Elm St, Manchester, NH\"), or just a city and state (\"Tualatin, OR\") or a ZIP code for a map of the area.",
                "maxLength": 200,
                "minLength": 5,
                "type": "string"
              },
              "annotations": {
                "description": "Callouts to draw. Placement, collision avoidance and leader lines are automatic.",
                "items": {
                  "properties": {
                    "aadt": {
                      "description": "Traffic count, for traffic_count.",
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "anchor": {
                      "description": "panel: top-left corner as fractions of the page. Omit to dock the panel beside the place it points at.",
                      "properties": {
                        "x": {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "y": {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["x", "y"],
                      "type": "object"
                    },
                    "at": {
                      "additionalItems": false,
                      "description": "[lon, lat]. Required for tenant_callout and traffic_count.",
                      "items": [
                        {
                          "maximum": 180,
                          "minimum": -180,
                          "type": "number"
                        },
                        {
                          "maximum": 90,
                          "minimum": -90,
                          "type": "number"
                        }
                      ],
                      "maxItems": 2,
                      "minItems": 2,
                      "type": "array"
                    },
                    "body": {
                      "description": "panel: a grid of logos, one large logo, a photo, or header only.",
                      "enum": ["logos", "logo", "photo", "none"],
                      "type": "string"
                    },
                    "boxColor": {
                      "description": "CSS colour for the label box fill.",
                      "maxLength": 40,
                      "pattern": "^(#[0-9a-f]{3,8}|[a-z]{3,20}|rgba?\\(\\s*[\\d.]+%?\\s*(,\\s*[\\d.]+%?\\s*){2,3}\\))$",
                      "type": "string"
                    },
                    "color": {
                      "description": "panel: header bar colour.",
                      "maxLength": 40,
                      "pattern": "^(#[0-9a-f]{3,8}|[a-z]{3,20}|rgba?\\(\\s*[\\d.]+%?\\s*(,\\s*[\\d.]+%?\\s*){2,3}\\))$",
                      "type": "string"
                    },
                    "id": {
                      "description": "Your id for this annotation. Echoed back in warnings so you can match them up.",
                      "maxLength": 64,
                      "type": "string"
                    },
                    "inkColor": {
                      "description": "CSS colour for the label text.",
                      "maxLength": 40,
                      "pattern": "^(#[0-9a-f]{3,8}|[a-z]{3,20}|rgba?\\(\\s*[\\d.]+%?\\s*(,\\s*[\\d.]+%?\\s*){2,3}\\))$",
                      "type": "string"
                    },
                    "label": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "logos": {
                      "items": {
                        "properties": {
                          "image": {
                            "description": "Your own logo as a data: URI (PNG, JPEG or WebP).",
                            "maxLength": 4000000,
                            "type": "string"
                          },
                          "name": {
                            "description": "Brand name, looked up for a public-domain logo.",
                            "maxLength": 80,
                            "type": "string"
                          },
                          "wikidata": {
                            "pattern": "^Q\\d+$",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "maxItems": 16,
                      "type": "array"
                    },
                    "markColor": {
                      "description": "CSS colour for the pin and leader line.",
                      "maxLength": 40,
                      "pattern": "^(#[0-9a-f]{3,8}|[a-z]{3,20}|rgba?\\(\\s*[\\d.]+%?\\s*(,\\s*[\\d.]+%?\\s*){2,3}\\))$",
                      "type": "string"
                    },
                    "monogram": {
                      "description": "subject_pin: up to three characters shown in the pin, e.g. initials.",
                      "maxLength": 3,
                      "type": "string"
                    },
                    "network": {
                      "description": "route_shield: interstate, US route or state route.",
                      "enum": ["I", "US", "SR"],
                      "type": "string"
                    },
                    "number": {
                      "description": "route_shield route number, e.g. \"5\" or \"99W\".",
                      "maxLength": 5,
                      "type": "string"
                    },
                    "offset": {
                      "description": "Move the label box relative to its pin, in preview pixels (the page is 1397 wide at 11x17 portrait). Setting this turns the auto-placer OFF for this annotation, so it is the fix for a label_overlap warning you want resolved a specific way.",
                      "properties": {
                        "dx": {
                          "maximum": 2000,
                          "minimum": -2000,
                          "type": "number"
                        },
                        "dy": {
                          "maximum": 2000,
                          "minimum": -2000,
                          "type": "number"
                        }
                      },
                      "required": ["dx", "dy"],
                      "type": "object"
                    },
                    "outline": {
                      "description": "panel: the offset frame. Default on.",
                      "type": "boolean"
                    },
                    "outlineColor": {
                      "maxLength": 40,
                      "pattern": "^(#[0-9a-f]{3,8}|[a-z]{3,20}|rgba?\\(\\s*[\\d.]+%?\\s*(,\\s*[\\d.]+%?\\s*){2,3}\\))$",
                      "type": "string"
                    },
                    "path": {
                      "description": "[[lon,lat],...] along the road. Required for road_label.",
                      "items": {
                        "additionalItems": false,
                        "items": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          }
                        ],
                        "maxItems": 2,
                        "minItems": 2,
                        "type": "array"
                      },
                      "minItems": 2,
                      "type": "array"
                    },
                    "photo": {
                      "description": "panel: a photo as a data: URI (PNG, JPEG or WebP), up to 8 MB.",
                      "properties": {
                        "image": {
                          "maxLength": 11000000,
                          "type": "string"
                        }
                      },
                      "required": ["image"],
                      "type": "object"
                    },
                    "polygon": {
                      "description": "[[lon,lat],...] ring. Required for subject_property.",
                      "items": {
                        "additionalItems": false,
                        "items": [
                          {
                            "type": "number"
                          },
                          {
                            "type": "number"
                          }
                        ],
                        "maxItems": 2,
                        "minItems": 2,
                        "type": "array"
                      },
                      "minItems": 3,
                      "type": "array"
                    },
                    "stat": {
                      "description": "panel: the figure in the header, e.g. \"100,000+ jobs\".",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "strokeScale": {
                      "description": "Multiplier on pin, leader and outline weights.",
                      "maximum": 4,
                      "minimum": 0.5,
                      "type": "number"
                    },
                    "stylePreset": {
                      "default": "light",
                      "description": "light reads on dark pavement and roofs in shadow; dark reads on bright roofs and sunlit parking; accent is survey orange, meant for the subject property only.",
                      "enum": ["light", "dark", "accent"],
                      "type": "string"
                    },
                    "sublabel": {
                      "description": "Second line, e.g. \"24,500 SF\".",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "textScale": {
                      "description": "Multiplier on text size. Lower it to clear a text_truncated warning.",
                      "maximum": 20,
                      "minimum": 0.6,
                      "type": "number"
                    },
                    "tier": {
                      "description": "place_label size class.",
                      "enum": ["city", "town", "village"],
                      "type": "string"
                    },
                    "type": {
                      "enum": ["tenant_callout", "subject_property", "road_label", "traffic_count", "place_label", "route_shield", "water_label", "subject_pin", "panel"],
                      "type": "string"
                    },
                    "width": {
                      "description": "panel: width as a fraction of the page.",
                      "maximum": 0.6,
                      "minimum": 0.1,
                      "type": "number"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "maxItems": 40,
                "type": "array"
              },
              "autoLabel": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "properties": {
                      "brandsOnly": {
                        "default": false,
                        "description": "Keep only recognised chains. A flyer wants anchors, not every barber.",
                        "type": "boolean"
                      },
                      "maxPlaces": {
                        "default": 8,
                        "maximum": 15,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "maxRoads": {
                        "default": 4,
                        "maximum": 8,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "maxShields": {
                        "default": 6,
                        "maximum": 12,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "maxTenants": {
                        "default": 10,
                        "maximum": 20,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "maxWater": {
                        "default": 4,
                        "maximum": 8,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "mode": {
                        "default": "auto",
                        "description": "site drafts tenants and road names; regional drafts cities, highway shields and water. auto picks regional for frames 3000 m wide or more.",
                        "enum": ["auto", "site", "regional"],
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                ],
                "default": false,
                "description": "Draft tenant callouts from open business data (Overture Maps) and road names from Census TIGER before drawing your own. Use this when you do not know what is at the location. Pass an object to control how many: fewer labels is the simplest cure for a crowded page."
              },
              "center": {
                "additionalItems": false,
                "description": "[longitude, latitude] in WGS84. Alternative to address. Continental US only, plus Hawaii and Alaska on regional frames (groundWidthM 3300 or more).",
                "items": [
                  {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  }
                ],
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              },
              "dpi": {
                "default": 200,
                "maximum": 300,
                "minimum": 150,
                "type": "integer"
              },
              "groundWidthM": {
                "default": 500,
                "description": "True ground width of the frame in meters. 500 fits a typical retail plaza; 20000-40000 makes a regional map, where autoLabel drafts cities, highway shields and water instead of tenants.",
                "maximum": 40000,
                "minimum": 100,
                "type": "number"
              },
              "imagerySourceId": {
                "description": "Imagery source id. Defaults to the sharpest source covering the frame.",
                "type": "string"
              },
              "labelScale": {
                "default": 1,
                "description": "Text size multiplier applied to every annotation that does not set its own textScale. Drop to ~0.8 to fit more labels; raise for a map read at arm’s length.",
                "maximum": 20,
                "minimum": 0.6,
                "type": "number"
              },
              "mapId": {
                "description": "Revise a map you already bought. Returned as X-Map-Id on your paid export. Re-exports are free for 7 days as long as the FRAME is unchanged — change labels, styling, overlays and page elements freely; changing address, center, groundWidthM, pageSize, orientation or dpi makes it a different map.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "orientation": {
                "default": "portrait",
                "enum": ["portrait", "landscape"],
                "type": "string"
              },
              "overlays": {
                "default": [],
                "description": "Thematic layers drawn under the annotations. A legend is added automatically. fema-flood: regulated floodplain (blank means no mapped hazard — FEMA draws Zone X with no symbol). nwi-wetlands: USFWS National Wetlands Inventory. parcels: tax parcel lines for every lot in the frame, on site maps up to 3 km wide, in the states listed under parcels in the docs.",
                "items": {
                  "enum": ["fema-flood", "nwi-wetlands", "parcels"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "pageElements": {
                "default": {
                  "insetZoomOut": 14,
                  "locatorInset": false,
                  "northArrow": true,
                  "scaleBar": true,
                  "titleBlock": true
                },
                "description": "Page furniture. Turn elements off to free up room for labels.",
                "properties": {
                  "insetZoomOut": {
                    "default": 14,
                    "description": "How many times wider than the frame the inset covers.",
                    "maximum": 60,
                    "minimum": 4,
                    "type": "number"
                  },
                  "locatorInset": {
                    "default": false,
                    "description": "A small USGS topo overview showing where this frame sits in the wider area, with the frame outlined on it. Worth the corner it costs whenever the reader may not know the town.",
                    "type": "boolean"
                  },
                  "northArrow": {
                    "default": true,
                    "type": "boolean"
                  },
                  "scaleBar": {
                    "default": true,
                    "type": "boolean"
                  },
                  "titleBlock": {
                    "default": true,
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "pageSize": {
                "default": "tabloid",
                "enum": ["letter", "legal", "tabloid"],
                "type": "string"
              },
              "subjectParcel": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "properties": {
                      "at": {
                        "additionalItems": false,
                        "description": "[longitude, latitude] of a point on the property. Use when there is no street address, or when the state records none for its parcels.",
                        "items": [
                          {
                            "maximum": 180,
                            "minimum": -180,
                            "type": "number"
                          },
                          {
                            "maximum": 90,
                            "minimum": -90,
                            "type": "number"
                          }
                        ],
                        "maxItems": 2,
                        "minItems": 2,
                        "type": "array"
                      },
                      "label": {
                        "description": "Text for the outline, e.g. \"SITE\" or \"2.3 AC\".",
                        "maxLength": 80,
                        "type": "string"
                      },
                      "recenter": {
                        "default": true,
                        "description": "On a map located by address, centre the frame on the parcel instead of on the geocoded point, which sits on the road and can be a lot or two away. Has no effect when you give center: that frame is yours.",
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  }
                ],
                "default": false,
                "description": "Outline the property itself: finds its tax parcel and draws it as the subject property. With an address, the parcel is the one recorded at that street address; with center or subjectParcel.at, the one under that point. Available in the states listed under parcels in the docs. The check response says which parcel was picked (number, address, acres) so you can confirm it before buying. If none is found the map is still drawn, with a parcel_not_found warning."
              },
              "title": {
                "description": "Title block heading. Defaults to the address.",
                "maxLength": 200,
                "type": "string"
              },
              "titleBlockScale": {
                "default": 1,
                "description": "Size multiplier for the title block.",
                "maximum": 20,
                "minimum": 0.6,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
