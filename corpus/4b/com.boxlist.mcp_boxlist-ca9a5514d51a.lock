        {
          "name": "match_for_two",
          "title": "Match for two",
          "description": "Find titles two people will both enjoy, from one to five titles each of them loves. Blends their two Taste Fingerprint™ profiles the way Boxlist's Watch together does, skips anything either is likely to dislike, and returns picks with a band for the pair and for each person, plus where their tastes agree and differ. Defaults to films and TV; books and games can be added. Anonymous, nothing stored.",
