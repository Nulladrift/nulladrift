                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 5,
                    "minItems": 1,
                    "type": "array"
                  },
                  "name": {
                    "description": "First name or label used in the answer (default \"Person A\"/\"Person B\"). Not stored.",
                    "maxLength": 40,
