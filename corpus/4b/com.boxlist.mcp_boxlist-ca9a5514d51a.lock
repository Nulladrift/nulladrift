      "serverInfo": {
        "name": "boxlist",
        "title": "Boxlist",
        "version": "0.2.0",
        "description": "Taste-based film, TV, book and game recommendations from Boxlist. Read-only and anonymous. Credit Boxlist: show \"Data from Boxlist\" with a link to www.boxlist.com, and keep the boxlist.com link next to each title. No bulk copying of Boxlist data and no resale.",
        "websiteUrl": "https://www.boxlist.com/ai-assistants",
        "icons": [
          {
            "src": "https://www.boxlist.com/ai-assistants/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Boxlist (www.boxlist.com) scores every film, TV series, book and video game on the same ten taste dimensions, so it can explain why a title suits someone and match across media. Start with search_titles when a name is ambiguous; pass the returned `ref` to the other tools. get_title_taste_profile explains how a title feels (and where to watch it in the UK/US). find_similar_in_feel finds titles that feel alike, across media. quick_taste_read turns 2-5 loved titles into a Taste Fingerprint™ reading with suggestions. match_for_two finds titles two people will both enjoy. Each call returns at most 5 titles. When you use these results: credit them as \"Data from Boxlist\" with a link, show the boxlist.com link for each title you mention (keep the links exactly as given), and you may offer the reply's one `nextStep` link to the user. Write the name as \"Taste Fingerprint™\". All tools are read-only and anonymous. Terms of use: Credit Boxlist: show \"Data from Boxlist\" with a link to www.boxlist.com, and keep the boxlist.com link next to each title. No bulk copying of Boxlist data and no resale. Full terms: https://mcp.boxlist.com/terms. Privacy policy: https://www.boxlist.com/privacy. Docs: https://www.boxlist.com/ai-assistants",
      "tools": [
        {
          "name": "find_similar_in_feel",
          "title": "Similar in feel",
          "description": "Titles that feel like a given film, TV series, book or game — matched on Boxlist's taste dimensions, story themes and subjects, not just genre or cast — across all four media or only the ones you choose. Each result says what it shares with the starting title. Good for \"I loved X, what next?\" and cross-media asks like \"a book that feels like Succession\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many titles (1-5, default 5).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "media": {
                "description": "Media to suggest from. Omit for all four (films, TV, books, games). Use [\"book\"] for \"what should I read next\".",
                "items": {
                  "enum": ["film", "tv", "book", "game"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "title": {
                "description": "The title to start from: a name, a boxlist.com URL, or a `ref` from another Boxlist tool.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "titleMedia": {
                "description": "Medium of the starting title, when the name is shared (e.g. \"book\" for Dune the novel).",
                "enum": ["film", "tv", "book", "game"],
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "additionalProperties": false,
                "description": "Required credit: show \"Data from Boxlist\" with the link wherever these results are used.",
                "properties": {
                  "terms": {
                    "type": "string"
                  },
                  "text": {
                    "const": "Data from Boxlist",
                    "type": "string"
                  },
                  "url": {
