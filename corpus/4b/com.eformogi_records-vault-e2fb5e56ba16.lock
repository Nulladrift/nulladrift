      "instructions": "Eformogi is a record of learning a student owns, witnessed by the adults who were there. verify_record checks one receipt id with no login. how_eformogi_works explains the product and the price list. read_spec reads the open protocol. Verifying one link is free, forever. With a personal key the family made: read_my_record reads the family's own items and signatures, draft_filing gives the verified rule skeleton for a state filing with the student's signed items, and request_signature mints a one-tap signing link for the adult who was there. get_application_facts assembles the facts a fellowship, a program, an employer, an activities list, or a service hours form asks for, from the record only, for the student to review and submit themselves. With a key the student issued for suggestions, suggest_item leaves one line, the student's own sentence exactly as they said it, waiting on the student's page; nothing is on the page until the student adds it themselves, so never say it was recorded. Never write anything as the student's own words.",
      "tools": [
        {
          "name": "how_eformogi_works",
          "title": "What Eformogi is and what it costs",
          "description": "What Eformogi is and what it costs: the thesis sentence and the pricing paragraph, verbatim, plus the key public pages.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
