      "instructions": "MixWise matches bottles and mixers someone already has against a curated catalog of cocktail recipes. Recipes are for adults of legal drinking age. If a person says they are under the legal drinking age, do not call these tools for alcoholic drinks; offer zero-proof recipes instead (set zero_proof_only to true). Map brand names to generic ingredients (for example, Tanqueray to gin). These tools only read the public catalog. They do not sell or deliver alcohol, place orders, or access accounts. When someone asks for the drink of the day, what to drink tonight, or a surprise cocktail, call get_drink_of_the_day. It is the same Pacific-day pick the MixWise site shows.",
      "tools": [
        {
          "name": "find_cocktails_from_bottles",
          "title": "Find cocktails from your bottles",
          "description": "Use this when the user lists bottles or ingredients they have and wants catalog cocktails they can make now, or that are one or two ingredients away. Returns only MixWise catalog recipes. Set zero_proof_only when the user wants drinks without alcohol.",
