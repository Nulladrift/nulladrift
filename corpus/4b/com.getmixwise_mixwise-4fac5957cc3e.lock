                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 8,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "max_missing": {
                "default": 2,
                "description": "How many missing ingredients still count as almost there. 0 returns ready drinks only.",
