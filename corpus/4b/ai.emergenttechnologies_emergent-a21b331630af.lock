              "path": {
                "description": "company = owns or runs a company; closed = the company closed; professional = lawyer, doctor, accountant, exec; partner = brings deals",
                "enum": ["company", "closed", "professional", "partner"],
                "type": "string"
              },
              "reach": {
                "description": "Partner path: how many companies they can reach",
                "enum": ["1-5", "6-20", "21-100", "100+"],
