        {
          "name": "estimate_payout",
          "title": "Estimate a data licensing payout",
          "description": "Returns the same indicative payout range the estimator at emergenttechnologies.ai/data-licensing shows for a company's headcount, years of records and headquarters, with the page's own caveats. It is a starting range from licensing partners' published formulas, not an offer. Inputs above the page's caps (1,000 people, 30 years) are shown at the cap, as on the page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "employees": {
                "description": "How many people work at the company",
                "maximum": 10000000,
                "minimum": 1,
                "type": "integer"
              },
              "headquarters": {
                "description": "Where the company is headquartered: us (default), canada, europe or other",
                "enum": ["us", "canada", "europe", "other"],
                "type": "string"
              },
              "years": {
                "description": "How many years of data the company has (usually years in business)",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["employees", "years"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "capped": {
                "type": "boolean"
              },
              "disclaimer": {
                "type": "string"
              },
              "display": {
                "type": "string"
              },
              "inputsUsed": {
                "additionalProperties": false,
