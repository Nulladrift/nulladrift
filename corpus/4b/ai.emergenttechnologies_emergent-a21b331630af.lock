                "type": "string"
              },
              "interest": {
                "description": "Company paths: license = license the records; refer = offer this to clients; both",
                "enum": ["license", "refer", "both"],
                "type": "string"
              },
              "language": {
                "description": "Language of most records",
                "enum": ["english", "not_english"],
                "type": "string"
