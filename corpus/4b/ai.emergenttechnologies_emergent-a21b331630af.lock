            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "question": {
                "description": "The question, in plain words (up to 2,000 characters). Please leave out personal details.",
                "maxLength": 100000,
                "type": "string"
              },
              "role": {
                "description": "Who is asking, to pick the next step: owner, partner, buyer (an AI lab or data buyer), consulting, or other",
                "enum": ["owner", "partner", "buyer", "consulting", "other"],
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
