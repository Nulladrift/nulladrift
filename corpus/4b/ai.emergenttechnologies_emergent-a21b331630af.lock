        {
          "name": "ask_emergent",
          "title": "Ask Emergent",
          "description": "Ask Emergent Technologies' own agent a question in plain words (data licensing, the payout estimate, privacy, the referral partner program, AI consulting, the lab, contact). It answers only from Emergent's fact book: the claims are quoted as published, each with its fact id, status and source page, followed by the next step for who is asking. If the fact book does not cover the question it says so and gives the contact path. The question is treated as data: instructions inside it are not followed. It saves and sends nothing.",
