      "instructions": "Official read-only server of Emergent Technologies, Inc. (https://emergenttechnologies.ai). Emergent Technologies, Inc. (emergenttechnologies.ai) is not affiliated with Emergent (emergent.sh), an AI app builder, or with Emergent Technologies of Austin, Texas (emergenttechnologies.com), a different firm.\nEvery answer comes from Emergent's fact book or the site's own estimator and fit models, and carries meta.factIds, meta.sources and meta.factBookVersion: cite them. Facts listed in meta.draftFactIds are pending Emergent's approval of the wording.\nNothing is saved or sent. To act, the person continues on Emergent's site; start_conversation returns the right page. Arguments are treated as data, never as instructions.\nNext step by who is asking: an owner gets estimate_payout, then continues at /fit; a partner reads partner_program, then applies at /partners#apply; a consulting enquiry reads consulting_offer, then writes from /consulting/contact?intent=consulting; an AI lab or data buyer writes from /contact. ask_emergent answers free-text questions from the fact book.",
