              "employees": {
                "description": "People at the company (at its peak if closed)",
                "enum": ["1-9", "10-19", "20-34", "35-75", "76-200", "200+"],
                "type": "string"
              },
              "industry": {
                "description": "The company's industry: legal, accounting_finance, medical, or other for any other industry (for example, software and IT services, HVAC, manufacturing or logistics)",
                "enum": ["legal", "accounting_finance", "medical", "other"],
                "type": "string"
              },
              "industryDetail": {
                "description": "When industry is other",
                "enum": ["construction_trades", "real_estate", "retail_ecommerce", "hospitality", "manufacturing", "logistics", "marketing_agency", "education", "insurance", "nonprofit", "ai_tech_startup", "engineering_architecture", "energy", "software_dev_agency", "game_studio", "media_production", "something_else"],
                "type": "string"
              },
              "interest": {
                "description": "Company paths: license = license the records; refer = offer this to clients; both",
                "enum": ["license", "refer", "both"],
                "type": "string"
              },
              "language": {
                "description": "Language of most records",
                "enum": ["english", "not_english"],
                "type": "string"
              },
              "licensed": {
                "description": "Professional path: licensed in their field?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "partnerType": {
                "description": "Partner path",
