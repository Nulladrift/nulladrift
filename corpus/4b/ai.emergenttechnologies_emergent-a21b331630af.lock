                    "role": {
                      "enum": ["answer", "case", "next-step"],
                      "type": "string"
                    },
                    "status": {
                      "enum": ["approved", "draft"],
                      "type": "string"
                    },
                    "topic": {
                      "enum": ["company", "licensing", "estimate", "privacy-consent", "partners", "consulting", "lab", "contact"],
                      "type": "string"
                    },
                    "url": {
                      "type": ["string", "null"]
