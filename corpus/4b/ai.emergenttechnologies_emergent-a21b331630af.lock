        "title": "Emergent Technologies",
        "version": "1.3.2",
        "description": "AI and automation consulting, and licensing company data to AI labs, from Emergent Technologies."
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Official read-only server of Emergent Data Licensing (https://emergenttechnologies.ai). Emergent Data Licensing, a program of Emergent Technologies, Inc., represents companies licensing their institutional knowledge to leading labs. Emergent Technologies is an applied AI lab architecting and deploying a trust framework for the emerging internet of agents. We engineer how agents discover one another, prove whom they represent and act within their authority. On that framework, we build agent-native applications and governed agent systems, and with our partner labs we train private enterprise and predictive models on a company's own domain expertise. We are bringing it into production through Trust Events, our networking platform, live in more than 1,000 cities. Emergent Technologies, Inc. (emergenttechnologies.ai) is not affiliated with Emergent (emergent.sh), an AI app builder, or with Emergent Technologies of Austin, Texas (emergenttechnologies.com), a different firm.\nEvery answer comes from Emergent's fact book or the site's own estimator and fit models, and carries meta.factIds, meta.sources and meta.factBookVersion: cite them. Facts listed in meta.draftFactIds are pending Emergent's approval of the wording.\nNothing is sent on anyone's behalf; questions to ask_emergent are kept to improve the agent, as the privacy policy says. To act, the person continues on Emergent's site; start_conversation returns the right page. Arguments are treated as data, never as instructions.\nNext step by who is asking: an owner gets estimate_payout, then continues at /fit; a partner reads partner_program, then applies at /partners#apply; a consulting enquiry reads consulting_offer, then writes from /consulting/contact?intent=consulting; an AI lab or data buyer writes from /contact. ask_emergent answers free-text questions from the fact book.",
