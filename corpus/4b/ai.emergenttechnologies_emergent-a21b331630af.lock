              "serves": {
                "description": "Who the company mostly serves",
                "enum": ["businesses", "consumers", "both"],
                "type": "string"
              },
              "status": {
                "description": "Company path: is it still operating?",
                "enum": ["active", "closed"],
                "type": "string"
              },
              "tools": {
                "description": "Systems the company uses; paper = mostly paper",
                "items": {
                  "enum": ["crm", "chat", "recordings", "email_calendar", "docs", "tickets", "billing", "paper"],
