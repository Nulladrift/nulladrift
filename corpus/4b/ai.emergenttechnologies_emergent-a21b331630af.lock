          "description": "Runs the same matching rules as emergenttechnologies.ai/fit on a person's answers and says which kind of program fits (data licensing, the referral partner program, or expert work) and why. It collects and saves nothing and takes no personal details. To see their specific route and proceed, the person continues at /fit, where they enter their own details with consent.",
