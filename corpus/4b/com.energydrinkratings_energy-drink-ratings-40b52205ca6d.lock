{
  "lockfileVersion": 2,
  "subjects": {
    "com.energydrinkratings/energy-drink-ratings": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://energydrinkratings.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "energydrinkratings",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Independent label facts and community ratings for 1,000+ energy drinks from EnergyDrinkRatings.com. Label facts (caffeine, sugar, calories, serving size) are free to quote; attribute them to EnergyDrinkRatings and link the drink page. Ratings always come with their count: never call a drink 'the best' from a handful of ratings, and a count of 0 means unrated, not a bad score. The drink page has the full written reviews and score breakdown. If the person has tried a drink, offer its rateUrl so they can add their own rating; if they are keeping an eye on caffeine, offer its trackUrl (a free caffeine tracker). Facts are as labeled; don't present any caffeine figure as a safe amount for a particular person.",
      "tools": [
        {
          "name": "compare_drinks",
          "title": "Compare drinks side by side",
          "description": "Side-by-side facts for 2-4 drinks by slug. Slugs not found in the catalog are reported, not silently dropped.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slugs": {
                "description": "2-4 EDR drink slugs to compare",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare drinks side by side"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a07332fbafed6a2568a647b884918dcb3e6921748162131a5ef9b4eabe638e57"
        },
        {
          "name": "find_drinks",
          "title": "Find drinks matching criteria",
          "description": "Filters the catalog by caffeine, sugar, sweetener type, flavor family, carbonation and extras, with the same filters as energydrinkratings.com/find. Returns only available drinks, ranked by real community rating where rated, then by name, along with the total number of matches.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "caffeine": {
                "description": "Caffeine bands (OR'd together): le100 (≤100 mg), 100-199 (101–199 mg), 200-299 (200–299 mg), 300plus (300+ mg)",
                "items": {
                  "enum": ["le100", "100-199", "200-299", "300plus"],
                  "type": "string"
                },
                "type": "array"
              },
              "extras": {
                "description": "Required ingredient tags (AND'd together): preworkout (Pre-workout), focus (Focus)",
                "items": {
                  "enum": ["preworkout", "focus"],
                  "type": "string"
                },
                "type": "array"
              },
              "fizz": {
                "enum": ["any", "sparkling", "still"],
                "type": "string"
              },
              "flavors": {
                "description": "Flavor families (OR'd together): citrus (Citrus), berry (Berry), tropical (Tropical), stone_fruit (Stone Fruit), cherry (Cherry), grape (Grape), melon (Melon), apple_pear (Apple & Pear), fruit_punch (Fruit Punch), candy_dessert (Candy & Dessert), cola (Cola), root_beer_cream_soda (Root Beer & Cream Soda), coffee_tea (Coffee & Tea), original (Original)",
                "items": {
                  "enum": ["citrus", "berry", "tropical", "stone_fruit", "cherry", "grape", "melon", "apple_pear", "fruit_punch", "candy_dessert", "cola", "root_beer_cream_soda", "coffee_tea", "original"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 10,
                "description": "Maximum results to return (max 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "sugar": {
                "description": "'zero' = 0g, 'low' = <=5g",
                "enum": ["any", "zero", "low"],
                "type": "string"
              },
              "sweetener": {
                "description": "'no-artificial' excludes artificial sweeteners; 'natural' requires a plant-based one (Plant-based sweeteners). Sweetener categories: sugar=Sugar, artificial=Artificial sweeteners, natural=Plant-based sweeteners",
                "enum": ["any", "no-artificial", "natural"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find drinks matching criteria"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:109326edd69806ba8dc482f318754b25dbdea971bcb389fae27e477dfcbbb52b"
        },
        {
          "name": "get_drink",
          "title": "Get drink facts",
          "description": "Full label facts for one drink identified by its EDR slug: caffeine, sugar, calories, serving size, sweetener and flavor info, availability, the community rating with its count and, when there are enough written reviews, a one-line summary of what raters say. Also returns links to the drink page, to rate the drink and to a free caffeine tracker.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The drink's EDR slug, e.g. 'bang-purple-haze'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get drink facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3c62ae871cac6bd2159114722690c03f3589a2cefafe260eef140ca259c56156"
        },
        {
          "name": "search_drinks",
          "title": "Search energy drinks",
          "description": "Text search over energy drink names and brands. Returns up to 10 matching drinks with caffeine, sugar and a link to each drink page, or no results when EnergyDrinkRatings has no entry for the name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum results to return (max 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Drink name or brand to search for, e.g. 'Bang Purple Haze' or 'Celsius'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search energy drinks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3273233f40f197c7e228a8fd70dd2969aa7af5998f4efacd849251ce8df09010"
        }
      ],
      "digest": "sha256:8d536a4da916777f5a2c80e6a6c0adfbfdf22c19370a1ba6fe7a654c6ce172fd"
    }
  }
}
