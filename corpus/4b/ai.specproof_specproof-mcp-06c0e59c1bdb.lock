      "instructions": "SpecProof serves 3GPP, IETF and MPEG specification text indexed from the published documents.\n\nEquations are preserved verbatim from the source specification and are delimited with $...$\n(inline) and $$...$$ (display) inside the text these tools return.\n\nWhen quoting or presenting an equation:\n  - Copy the stored string exactly, including its $ delimiters. Do not retype it, do not\n    reformat it across multiple lines, and do not convert it to \\( \\) or \\[ \\] form.\n    Retyping silently loses characters -- a dropped \"=\" turns a normative formula into\n    nonsense that still reads as an equation -- and the \\( \\) and \\[ \\] delimiters lose\n    their backslashes to markdown in most clients, which corrupts the equation on screen.\n  - If you need to explain an equation, quote it verbatim first, then describe it separately.\n  - A passage containing \"[equation image]\" marks an equation that could not be converted to\n    LaTeX. Say that it is unavailable rather than reconstructing it.\n\nOther notes:\n  - page_number is the chunk's position in the extracted text, not the specification's own\n    printed pagination. Cite clause numbers, which are authoritative; do not cite page numbers.\n  - Requirements carry req_uid, a version-stable identifier; req_key is not stable across\n    re-indexing and should not be persisted.\n",
      "tools": [
        {
          "name": "build_cross_spec_suite",
          "title": "Build Cross-Spec Suite",
          "description": "Assemble the normative requirements for one procedure across a spec AND the specs it\n    normatively references — a procedure like registration or handover is never described in a\n    single document. Returns a cited suite plan; feed the requirement_ids to generate_tests.\n\n    Args:\n        spec_base: The anchor spec, e.g. \"23502\" or \"38331\"\n        keyword: The procedure/topic, e.g. \"registration\", \"handover\", \"authentication\"\n        include_references: Also pull matching clauses from specs this one references (default: True)\n        limit: Max requirements in the plan (default: 20, max: 50)\n    ",
          "inputSchema": {
            "properties": {
              "include_references": {
                "default": true,
                "title": "Include References",
                "type": "boolean"
              },
              "keyword": {
                "title": "Keyword",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "spec_base": {
                "title": "Spec Base",
                "type": "string"
              }
            },
            "required": ["keyword", "spec_base"],
            "title": "build_cross_spec_suiteArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "build_cross_spec_suiteOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ffe4c0ca771511333ac336473deca08178e7d9b1f7e32b70358ec84e94398f2b"
        },
        {
          "name": "diff_spec_versions",
          "title": "Diff Spec Versions",
          "description": "Diff two versions of a specification at the NORMATIVE level: which requirements were\n    added, removed, or reworded. Not a textual diff — a clause that merely moved page or was\n    recased counts as unchanged.\n\n    Args:\n        spec_base: Spec identity without the version, e.g. \"38331\" or \"23501\"\n        from_version: Older version label, e.g. \"j20\" (default: the second-newest in the corpus)\n        to_version: Newer version label, e.g. \"j30\" (default: the newest in the corpus)\n        obligation: Only report changes at this strength — \"must\", \"must_not\", \"should\", \"should_not\", \"may\"\n        limit: Max requirements to list per bucket (default: 25)\n    ",
          "inputSchema": {
            "properties": {
              "from_version": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "From Version"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "obligation": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Obligation"
              },
              "spec_base": {
                "title": "Spec Base",
                "type": "string"
              },
              "to_version": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "To Version"
              }
            },
            "required": ["spec_base"],
            "title": "diff_spec_versionsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "diff_spec_versionsOutput",
            "type": "object"
          },
