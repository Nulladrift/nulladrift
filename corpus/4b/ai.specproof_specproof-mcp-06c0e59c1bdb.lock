        {
          "name": "generate_tests",
          "title": "Generate Conformance Tests",
          "description": "Generate a cited, runnable conformance test that verifies one normative requirement.\n\n    The test is grounded in the requirement sentence plus its surrounding clause from the\n    corpus, and every test cites the spec, section and page it enforces. If the requirement\n    is not testable (boilerplate, scope text), the generator abstains rather than inventing\n    a test.\n\n    Args:\n        requirement_id: The requirement's id, as shown by get_requirements\n        target: \"pytest\" for a runnable Python test module, or \"gherkin\" for a reviewable\n                .feature file (default: pytest)\n    ",
          "inputSchema": {
            "properties": {
              "requirement_id": {
                "title": "Requirement Id",
                "type": "integer"
              },
              "target": {
                "default": "pytest",
                "title": "Target",
                "type": "string"
              }
            },
            "required": ["requirement_id"],
            "title": "generate_testsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "generate_testsOutput",
            "type": "object"
