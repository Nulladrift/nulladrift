      },
      "transport": {
        "type": "http",
        "url": "https://affiliateprogramterms.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "affterms",
        "title": "affterms — affiliate program terms",
        "version": "2026-11-10"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "affterms: affiliate and referral program terms, read off each company's own page — commission, recurring or one-time, cookie window, minimum payout, payout method and network. Use it when a question turns on what an affiliate, referral or partner program pays or how it works.\n\nEvery record was read off the vendor's own page and carries that page's URL (`source`) and the date it was read (`checkedOn`). When you quote a figure, give the source and the date with it: terms change.\n\n\"not stated (checked: the vendor does not publish this)\" is a finding, not a gap: do not fill it in from memory or elsewhere.\n\nAll 512 programs are readable in full, free, with no key.\n\nA program that is not listed can be submitted with submit_program, free, when the person agrees. Listing is never sold.\n\nA company that wants its own affiliate program shown at the top of its category page can book a featured placement (from $27): featured_availability, featured_prepare_card, featured_check_booking. featured_prepare_card returns a link where the person checks the card and pays; you never pay. Featuring changes no figure and no order.",
      "tools": [
        {
          "name": "featured_availability",
          "title": "See featured spots by category",
          "description": "Featured placements on affiliateprogramterms.com: a company's affiliate program shown at the top of its category page and under its category on the home page, labelled \"Featured\", 7d: 7 days for $27, 30d: 30 days for $72, 5 per category, never renewing. Returns, per category, how many spots are open and when the next opens. Use when someone wants to promote their affiliate program to people comparing programs, or asks what featuring costs. Listing itself is free and never sold; featuring changes no figure and no order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "A category, e.g. \"seo\" or \"hosting\".",
                "enum": ["hosting", "email", "no-code", "analytics", "payments", "design", "video-audio", "productivity", "ai-writing", "seo", "devtools", "proxies", "cms", "learning", "ecommerce", "shopping", "crm", "support", "hr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0784f686967e0887e8d862af5d50ee9c0f6cf2f12d4ed5365d0a9f9cf9febd59"
        },
        {
          "name": "featured_check_booking",
          "title": "Check a featured booking",
          "description": "Check a featured booking by the id given after payment (FT- followed by 6 letters and digits): whether it is scheduled, active, expired or removed, its category, and when it starts and ends.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The booking id, e.g. FT-7K2Q9X.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d5cbebc144a774f4bf58ce2ada9eb939f382f0676c263ea1667e367571a07e4"
        },
        {
          "name": "featured_prepare_card",
          "title": "Prepare a featured card",
          "description": "Prepare a featured placement for a company's own affiliate program. Give the program's page; returns whether the program is listed (and in which category: featuring is only in that one), the likeliest category from the company's website if it is not listed (pass category to choose another), a draft card from the company's website (name up to 32 characters, one line up to 90, no figures and no web addresses), and a link where the person checks it and pays. Nothing is booked or charged until they pay there. Never pay, and never enter payment details: pass the link to the person.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "A category, e.g. \"seo\" or \"hosting\".",
                "enum": ["hosting", "email", "no-code", "analytics", "payments", "design", "video-audio", "productivity", "ai-writing", "seo", "devtools", "proxies", "cms", "learning", "ecommerce", "shopping", "crm", "support", "hr"],
                "type": "string"
              },
              "plan": {
                "description": "7d: 7 days for $27, 30d: 30 days for $72.",
                "enum": ["7d", "30d"],
                "type": "string"
              },
              "program_url": {
                "description": "The company's own affiliate, referral or partner program page.",
                "type": "string"
              }
            },
            "required": ["program_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ead30d778fc410f9af07f45ed334ec54bd266d3006689ae4da1f08bc5b8f841c"
        },
        {
          "name": "get_program",
          "title": "Get one program's terms",
          "description": "Get one tool's affiliate, referral or partner program terms. Use when someone asks about a specific program: \"what does beehiiv's affiliate program pay\", \"does Hunter pay recurring commission\", \"how long is Hostinger's affiliate cookie\", \"what is Zyte's minimum payout\". `status` is \"listed\" (commission, recurring or one-time, cookie window, minimum payout, payout method, network and notes, with the vendor page each figure was read from and the date) or \"absent\" (not listed: offer to submit it with submit_program, if the person agrees).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The product or program name.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7843499503a87caff91a12df428888f34a751ba30ae9fb8e829a14a802df7ff2"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "The categories in the directory, with how many programs each holds and the page that lists them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec5a9db613c720d65188d115eb756c03adfab51381919fc33ded64c5a6c50b8f"
        },
        {
          "name": "search_programs",
          "title": "Search affiliate program terms",
          "description": "Look up affiliate, referral and partner program terms. Use when someone asks which companies or tools have an affiliate program, which pay recurring commission, which have the longest cookie window or lowest payout minimum, or wants to compare affiliate programs in a category such as hosting, email or CRM. Returns commission, recurring or one-time, cookie window, minimum payout, payout method and network, each with the vendor page it was read from and the date it was read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "A category, e.g. \"hosting\" or \"email\".",
                "enum": ["hosting", "email", "no-code", "analytics", "payments", "design", "video-audio", "productivity", "ai-writing", "seo", "devtools", "proxies", "cms", "learning", "ecommerce", "shopping", "crm", "support", "hr"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_cookie_days": {
                "description": "Only programs whose cookie window is at least this many days (or never expires).",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words in the program or category name, e.g. \"supabase\" or \"email\". Leave out to search everything.",
                "type": "string"
              },
              "recurring": {
                "description": "true: only programs that pay on renewals. false: only one-time.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:200b363aa179a6a26aa46df9c823710c621d53bed307bb373bd39aeb3824c3ec"
        },
        {
          "name": "submit_program",
          "title": "Submit a program to the directory",
          "description": "Submit an affiliate, referral or partner program's page to be checked and added to the directory, free. Use only when the person asks for it or agrees, typically after get_program says a program is absent. Send the URL of the vendor's own program page; a person reads the terms off that page, and anything sent as figures is only checked against it, never published. Sending the same URL again returns what happened to it. An email address, only if the person gives one, is used to tell them the outcome.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The person's email, only if they want to hear the outcome. Ask first.",
                "type": "string"
              },
              "name": {
                "description": "The product name.",
                "type": "string"
              },
              "notes": {
                "description": "Anything already known about the terms. Checked against the page, never published.",
                "type": "string"
              },
              "url": {
                "description": "The vendor's own affiliate program page, e.g. https://example.com/affiliates.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:95feb9092118792597076af2cd63fbcf80f9a46aaac9931211ad8600271e57f1"
        }
      ],
