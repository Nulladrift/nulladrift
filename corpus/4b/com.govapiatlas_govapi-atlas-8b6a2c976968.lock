          "digest": "sha256:c12a6c51e1dd1f159741c43ca554667496129b2df22ab78d719dc2e96100aaba"
        },
        {
          "name": "search_gov_apis",
          "description": "Search the GovAPI Atlas index of public-sector open data APIs (Korea, US, UK, Japan, Taiwan, Germany, France, Australia, Canada, Singapore). Returns name, agency, category, last update and the official portal URL.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country code (default us)",
                "enum": ["kr", "us", "gb", "ja", "tw", "de", "fr", "au", "ca", "sg"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords, e.g. 'weather forecast', 'crime', '부동산'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
