      },
      "instructions": "Frontrunner is a public index of open jobs, read from employers' own career pages, with a written description of every posting. Use search_jobs for any request to find jobs; pass what the person said as `query`, plus filters when they were explicit. Use get_job to read one job in full before describing it in detail. Always give the person each job's `url`: that page is where they can read it, apply, or let Frontrunner apply for them.",
      "tools": [
        {
          "name": "get_job",
          "title": "Get job details",
          "description": "Read one job on Frontrunner in full: the written description, skills, years of experience, salary when known, whether it is still open, common questions, and the links to view and apply. Pass the url (or slug) that search_jobs returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job": {
                "description": "The job's Frontrunner URL (https://jobsfrontrunner.com/jobs/...) or its slug, exactly as search_jobs returned it.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "apply_with_frontrunner_url": {
                "description": "Sign up and let Frontrunner apply and reach the hiring team.",
                "type": "string"
              },
              "company": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "company_jobs_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "description": {
                "description": "The full description, written by Frontrunner from the employer's posting.",
                "type": "string"
              },
              "education": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "employment_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "experience_min_years": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The minimum years explicitly stated by the posting, or null when it does not state a positive minimum."
              },
              "faq": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "a": {
                      "type": "string"
                    },
                    "q": {
                      "type": "string"
                    }
                  },
                  "required": ["a", "q"],
                  "type": "object"
                },
                "type": "array"
              },
              "industry": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "location": {
                "anyOf": [
                  {
                    "type": "string"
