                          }
                        ]
                      }
                    },
                    "required": ["facts", "role"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "How the query was read: the role words, and the facts (place, pay, dates) taken from it."
              }
            },
            "required": ["jobs", "more_results_url", "notes", "page", "page_size", "total", "understood"],
            "type": "object"
          },
