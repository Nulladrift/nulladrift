        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search open jobs on Frontrunner by what the person wants, in plain words: role, skills, place, remote or on-site, seniority, pay, company, how recent. Covers the US, Canada, India, Europe and remote roles, read from employers' own career pages. Returns up to 24 jobs a page with title, company, place, salary when known, posted date and a link to each job on Frontrunner. Use it whenever someone asks to find, list or compare job openings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "employment_type": {
                "description": "Contract type. Any of: full-time (Full-time), part-time (Part-time), contract (Contract), internship (Internship).",
                "items": {
                  "enum": ["full-time", "part-time", "contract", "internship"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "location": {
                "description": "City, state or country, e.g. \"Bengaluru\", \"Texas\", \"Canada\".",
                "maxLength": 80,
                "type": "string"
              },
              "min_salary": {
                "description": "Lowest acceptable pay, written the way people say it: \"40 lpa\", \"$150k\", \"€70k\", \"3000 per month\".",
                "maxLength": 40,
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1.",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "posted_within_days": {
                "description": "Only jobs posted in the last N days. Rounded up to one of 1, 7, 14, 30.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the person is looking for, in their own words: role, skills, seniority, place, pay, company, how recent. Any language. Examples: \"senior data engineer in Hyderabad, 40 lpa\", \"remote product designer jobs in Europe\", \"jobs at Stripe\", \"entry level nursing jobs Toronto\". Leave empty to list the newest jobs.",
                "maxLength": 200,
                "type": "string"
              },
              "seniority": {
                "description": "Experience level. Any of: entry (Entry level), mid (Mid level), senior (Senior), lead (Lead & exec), manager (Manager), director (Director).",
                "items": {
                  "enum": ["entry", "mid", "senior", "lead", "manager", "director"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "sort": {
                "description": "relevance (best match, the default when there is a query), new (newest first) or pay (highest paying first).",
                "enum": ["relevance", "new", "pay"],
                "type": "string"
              },
              "work_mode": {
                "description": "Where the work happens. Any of: remote (Remote), hybrid (Hybrid), onsite (On-site).",
                "items": {
                  "enum": ["remote", "hybrid", "onsite"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "jobs": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "company": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "employment_type": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "location": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "posted": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Date the employer posted it, YYYY-MM-DD."
                    },
                    "salary": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "seniority": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "skills": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "summary": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The job on Frontrunner. Always give this link to the person.",
                      "type": "string"
                    },
                    "work_mode": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["company", "employment_type", "location", "posted", "salary", "seniority", "skills", "summary", "title", "url", "work_mode"],
                  "type": "object"
                },
                "type": "array"
              },
              "more_results_url": {
                "description": "The same search on Frontrunner, for the person to browse every result.",
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "page": {
