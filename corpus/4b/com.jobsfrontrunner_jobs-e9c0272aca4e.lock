                "type": "string"
              },
              "work_mode": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["apply_with_frontrunner_url", "company", "company_jobs_url", "description", "education", "employment_type", "experience_min_years", "faq", "industry", "location", "open", "posted", "salary", "seniority", "skills", "summary", "title", "url", "work_mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get job details"
