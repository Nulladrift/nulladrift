      },
      "transport": {
        "type": "http",
        "url": "https://api.brm-chronographes.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "brm-configurator",
        "title": "Configure a B.R.M",
        "version": "1.0.0",
        "websiteUrl": "https://brm-chronographes.com",
        "icons": [
          {
            "src": "https://api.brm-chronographes.com/mcp/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://api.brm-chronographes.com/mcp/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools to configure a made-to-order watch from B.R.M Chronographes (independent French watch manufacture, Magny-en-Vexin). Typical sequence: list_models, describe_model, validate_configuration, quote_configuration and render_configuration, then create_share_link. Prices from quote_configuration depend on the delivery country and are indicative. These tools take no payment. The purchase is completed by the user on brm-chronographes.com from configurator_url, or, when the user asks to order, prepared with create_order (ordering from the assistant is available): B.R.M then emails the user, and the order is only placed once the user confirms it from that email, choosing card, interest-free instalments, a deposit or bank transfer, and pays B.R.M on B.R.M's own secure payment page. The assistant never pays and never commits the user (get_order_status gives the state). Options that the configurator does not offer can be passed to the B.R.M team with submit_request (kind=special_request), only after the user agrees to share an email address. Option ids, prices and lead times come from the tools; lead times are published at lead_time.url, and no delivery date is promised.",
      "tools": [
        {
          "name": "create_order",
          "title": "Prepare an order the customer confirms by email",
          "description": "Prepares an order of this configured watch for the user. ONLY call it when the user explicitly asked you to order it and agreed to share their name, email and delivery address with B.R.M (user_consent=true). B.R.M then emails the user a summary with a 'Confirm my order' button; the order is placed ONLY after the user confirms it there (link valid 72 h), choosing card, interest-free instalments (Alma under EUR 2,000, Pledg from EUR 2,000, where available), a 20% deposit (watch from EUR 3,000) or bank transfer (EUR only), and pays B.R.M himself on B.R.M's secure payment page — no card or bank details go through this tool, and you never pay or commit the user. Relay message_for_user to the user. Do NOT say the order is placed, do NOT ask for payment details, NEVER promise a delivery date. The price is computed by B.R.M for the delivery country (currency and VAT follow the delivery country). Limited to a few orders per day per email. Pass an idempotency_key to make retries safe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "configuration": {
                "additionalProperties": false,
                "properties": {
                  "engraving": {
                    "description": "Optional engraving text (not priced, not rendered).",
                    "maxLength": 24,
                    "type": "string"
                  },
                  "model": {
                    "description": "model_id from list_models, e.g. 'v6-44-sa'.",
                    "type": "string"
                  },
                  "options": {
                    "description": "option_id values from describe_model. Unset components keep their default.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 40,
                    "type": "array"
                  }
                },
                "required": ["model"],
                "type": "object"
              },
              "customer": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "format": "email",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "first_name": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "last_name": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 30,
                    "type": "string"
                  }
                },
                "required": ["email", "first_name", "last_name"],
                "type": "object"
              },
              "idempotency_key": {
                "maxLength": 80,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["fr", "en", "de", "es", "it", "nl", "pt", "ja", "ko", "zh", "ar", "hi"],
                "type": "string"
              },
              "shipping_address": {
                "additionalProperties": false,
                "properties": {
                  "city": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "country": {
                    "description": "ISO-3166 alpha-2, e.g. 'US'.",
                    "pattern": "^[A-Za-z]{2}$",
                    "type": "string"
                  },
                  "line1": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "line2": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "postal_code": {
                    "maxLength": 16,
                    "type": "string"
                  },
                  "region": {
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "required": ["city", "country", "line1", "postal_code"],
                "type": "object"
              },
              "user_consent": {
                "const": true,
                "type": "boolean"
              }
            },
            "required": ["configuration", "customer", "shipping_address", "user_consent"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "confirmation": {
                "properties": {
                  "channel": {
                    "const": "email"
                  },
                  "valid_hours": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "created_at": {
                "format": "date-time",
                "type": "string"
              },
              "duplicate": {
                "type": "boolean"
              },
              "expires_at": {
                "description": "Deadline for the user's confirmation.",
                "format": "date-time",
                "type": "string"
              },
              "explanation": {
                "type": "string"
              },
              "idempotent_replay": {
                "type": "boolean"
              },
              "indicative_price": {
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "binding": {
                    "const": false
                  },
                  "currency": {
                    "type": "string"
                  },
                  "formatted": {
                    "type": "string"
                  },
                  "legal_notice": {
                    "type": ["string", "null"]
                  },
                  "shipping": {
                    "type": "number"
                  },
                  "vat_included": {
                    "type": "boolean"
                  },
                  "vat_rate_percent": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "is_order": {
                "const": false,
                "description": "Always false here: the order exists only after the user's confirmation."
              },
              "is_paid": {
                "type": "boolean"
              },
              "lead_time": {
                "description": "No firm number of weeks is given by this API: show `url` (the delivery page of brm-chronographes.com, in the user's language) for lead times.",
                "properties": {
                  "text": {
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "message_for_user": {
                "description": "Relay this to the user.",
                "type": "string"
              },
              "order_id": {
                "type": "string"
              },
              "rules_for_agent": {
                "type": "string"
              },
              "status": {
                "enum": ["awaiting_customer_confirmation", "confirming", "confirmed_awaiting_payment", "paid", "expired", "cancelled", "confirmation_email_failed", "needs_assistance"],
                "type": "string"
              }
            },
            "type": "object"
          },
