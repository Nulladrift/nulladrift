        {
          "name": "render_configuration",
          "title": "Render the watch",
          "description": "Composes the photographic rendering of the configured watch (JPEG). view 0 is the three-quarter view; 30 views (0-29) rotate the watch by 12° each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "configuration": {
                "additionalProperties": false,
                "properties": {
                  "engraving": {
                    "description": "Optional engraving text (not priced, not rendered).",
                    "maxLength": 24,
                    "type": "string"
                  },
                  "model": {
                    "description": "model_id from list_models, e.g. 'v6-44-sa'.",
                    "type": "string"
                  },
                  "options": {
                    "description": "option_id values from describe_model. Unset components keep their default.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 40,
                    "type": "array"
                  }
                },
                "required": ["model"],
                "type": "object"
              },
              "view": {
                "default": 0,
                "maximum": 29,
                "minimum": 0,
                "type": "integer"
              },
              "width": {
                "default": 900,
                "maximum": 1600,
                "minimum": 300,
                "type": "integer"
              }
            },
            "required": ["configuration"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "image_url": {
                "format": "uri",
                "type": "string"
              },
              "mime_type": {
                "const": "image/jpeg"
              },
              "note": {
                "type": "string"
              },
              "view": {
