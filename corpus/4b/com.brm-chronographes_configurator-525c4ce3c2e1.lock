        {
          "name": "list_models",
          "title": "List configurable B.R.M models",
          "description": "Returns the configurable watch models with base price (EUR incl. French VAT), diameter and a rendered picture of the default configuration.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "api_version": {
                "type": "string"
              },
              "currency_of_prices": {
                "const": "EUR"
              },
              "lead_time": {
                "description": "No firm number of weeks is given by this API: show `url` (the delivery page of brm-chronographes.com, in the user's language) for lead times.",
                "properties": {
                  "text": {
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "models": {
                "items": {
                  "properties": {
                    "base_price_eur": {
                      "type": "number"
                    },
                    "configurator_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "diameter_mm": {
                      "type": ["integer", "null"]
                    },
                    "image_url": {
                      "description": "Picture of the default configuration: JPEG rendering (view 0), or the configurator's WebP thumbnail for the 3D models.",
                      "format": "uri",
                      "type": ["string", "null"]
                    },
                    "model_id": {
                      "type": "string"
