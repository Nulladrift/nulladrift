                },
                "type": "object"
              },
              "preview_url": {
                "description": "Public page shared by every identical configuration; carries no user data.",
                "format": "uri",
                "type": ["string", "null"]
              },
              "total_price_eur": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a link that reopens this watch"
          },
          "behavior": {
