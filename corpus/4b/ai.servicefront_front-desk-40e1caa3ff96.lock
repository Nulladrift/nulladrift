            "readOnly": true
          },
          "digest": "sha256:354d8799f12bc9eb63184e538e40d13d9ed5c53ed74323dccdfeae56519f5853"
        },
        {
          "name": "searchBusinesses",
          "title": "Find a business's businessId by name",
          "description": "Find a verified ServiceFront business by name (or part of it) and get its businessId for the other tools. Returns up to 5 matches with name, trade, and front-desk URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "The business name, or part of it.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
