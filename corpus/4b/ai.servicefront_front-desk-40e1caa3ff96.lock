    "ai.servicefront/front-desk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://servicefront.ai/api/mcp/read"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "servicefront",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ServiceFront is the AI front desk for local service businesses (plumbers, HVAC, electricians, roofers, contractors). One server fronts every business: pass businessId (the business's ServiceFront slug, the label in <slug>.servicefront.ai) to every tool. Don't know the slug? Call searchBusinesses first. Facts come from owner-verified data only; absent fields are unconfirmed, never state them. This address only answers: none of its tools takes a customer's contact details. To be called back or to ask for a time, the customer goes to the business: its front desk page (origin in getBusinessInfo) or its confirmed phone. For a business owner shopping for a front desk, aboutServiceFront, getPricing, howToSetUp and sampleConversation answer about ServiceFront itself. None of them take a businessId.",
      "tools": [
        {
          "name": "aboutServiceFront",
          "title": "About ServiceFront",
          "description": "What ServiceFront is, for a service business owner (or their AI assistant) looking for an AI front desk: who it's for, how setup works, what it answers, and what it doesn't do yet. No input. For prices call getPricing; for a demo call sampleConversation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76aa3bc6db330ff6c08a1e33e5bccba08bed79851a44392ff4a819f39e36a7d2"
        },
        {
          "name": "getBusinessInfo",
          "title": "Get verified business info",
          "description": "Owner-verified facts for one business: trade, service area, hours, contact, services with confirmed prices. Absent fields are NOT owner-confirmed — don't state them as facts. No tool on this address takes a customer's contact details. To be called back or to ask for a time, the customer goes to the business: its front desk page (origin in the reply) or its confirmed phone.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "businessId": {
                "description": "The business's ServiceFront slug, the first label of its <slug>.servicefront.ai address. Find it with searchBusinesses if you only know the name.",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["businessId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24d8c32d3713a7fd488a8d8edd27f6a355af7868c9ab6e966590922a39d36346"
        },
        {
          "name": "getPricing",
          "title": "ServiceFront pricing",
          "description": "ServiceFront's own plans and limits (Free $0, Basic $59): what each includes and what's never charged for. No input. The same content as https://servicefront.ai/pricing.md.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ddedf7e8c53a88bca2bff014c5697b39126bc977b998faf438a511c0e4e4fc9a"
        },
        {
          "name": "getQuote",
          "title": "Get an owner-confirmed price",
          "description": "The owner-confirmed price for one of a business's services, by service name (ideally a name from getBusinessInfo). grounded:false means no confirmed price exists — never invent one; for an exact quote the customer asks the business on its front desk page (origin in getBusinessInfo) or calls its confirmed phone.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "businessId": {
                "description": "The business's ServiceFront slug, the first label of its <slug>.servicefront.ai address. Find it with searchBusinesses if you only know the name.",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              },
              "service": {
                "description": "The service to price — ideally one of the business's listed service names.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["businessId", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97c1e91ee952a51325a713ab23ce432a31220226a216e6c454a1a5f73f607b15"
        },
        {
          "name": "howToSetUp",
          "title": "Set up a ServiceFront front desk",
          "description": "How a service business owner sets up their own ServiceFront front desk: the steps, the <slug>.servicefront.ai address it goes live at, and the one-line widget for their website. No input. The owner signs up themselves; no tool creates an account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:647e6a599e00995da3c66100f8cd731e54d39d1585ee837bb99d88904f5b4f40"
        },
        {
          "name": "sampleConversation",
          "title": "Sample front-desk conversation for a trade",
          "description": "A sample conversation between a homeowner and a ServiceFront front desk in one trade: the question, the answer, urgency triage, and the captured lead. The business in it is a made-up example. Ready trades: plumbing; any other trade says it isn't ready yet and returns a ready trade's sample as a labeled stand-in.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "trade": {
                "description": "The owner's trade.",
                "enum": ["plumbing", "hvac", "electrical", "roofing", "landscaping", "cleaning", "pest-control", "general-contracting", "other"],
                "type": "string"
              }
            },
            "required": ["trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
