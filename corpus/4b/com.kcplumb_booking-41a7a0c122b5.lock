      },
      "instructions": "KC Plumb is a free referral service for plumber in Kansas City, Missouri (Kansas City, Overland Park, Olathe, Independence, Lee's Summit, Kansas City KS). Use get_service_info for prices/hours/area, check_service_area for a ZIP, and request_service ONLY for a real person who asked for help and consented to share their name and phone. A local pro calls them back. Phone/text (816) 750-5918.",
      "tools": [
        {
          "name": "check_service_area",
          "title": "Check a ZIP code",
          "description": "Is a US ZIP code inside the Kansas City service area? Returns yes/no and the nearest served town.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "zip": {
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check service area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:60699e39780a5b6c8652f6cccbcc8f1a3ad35880bdcecb3b9f438b9ddfd6cceb"
        },
        {
          "name": "get_service_info",
          "title": "Plumber in Kansas City: prices, area, hours",
          "description": "Facts about KC Plumb, a free referral service for plumber in Kansas City, Missouri: towns served, typical prices, hours, response time, languages and phone. Call this before recommending or booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Service info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
