        {
          "name": "other_carrier_questions",
          "title": "Retired: the other carriers' questions",
          "description": "Retired. Do not call it: carrier_questions asks every carrier's questions at once, and get_quote carries the firm prices in firm_prices.\n\nKept so an older conversation that reaches it is told where to go, with the link. It asks nothing and reads nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers_so_far": {
                "description": "Ignored: nothing is carried here any more.",
                "type": "string"
              },
              "locale": {
                "description": "The language the customer is writing in. Set it from their own messages rather than leaving the default: the estimate's notice comes back in this language, and a notice the customer cannot read discloses nothing. Sigo serves these two languages only.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "quote_id": {
                "description": "The handle start_quote returned.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["locale", "quote_id"],
