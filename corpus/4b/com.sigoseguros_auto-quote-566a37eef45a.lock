        },
        {
          "name": "start_quote",
          "title": "Start a car insurance quote",
          "description": "Step 2 of 3: call it once, with the collected next_question returned when ready_to_quote was true. It returns a quote_id for get_quote. If it answers quote_in_progress, do not call it again: read the quote_id you already have. Retrying the same call, after a timeout say, is safe: while its rating runs, the retry starts no second one and answers quote_in_progress.\n\nAsks Sigo's carriers for car insurance estimates. Carriers answer over tens of seconds, so this returns a quote_id straight away rather than waiting; read the prices with get_quote. Estimates are not binding: this does not select a policy, take payment or bind coverage. No browser is needed to get them: they come back in these tool calls, and the link in each one is where the customer continues if they want to buy.\n\nCall it once the details are gathered. Gather them a step at a time in conversation — listing every field up front reads as a form and loses people before the first answer.\n\nFor a customer who already has a quote and wants something changed, pass that quote's id as revise_of instead of starting over: the same person re-quoted, not a second one. A call for a customer who already quoted today and is still at their first round revises that quote even without revise_of — the result says revised_from_quote: true — so a forgotten id never makes a second application.\n\nThe same call carries the second round. Once the customer has answered what `next_question` asks with `stage: \"second_round\"` — address, VIN, ownership and lienholder, licence status and months held, occupation, education, prior coverage, excluded drivers, and each driver's document number in `drivers[].document.number` — send them all here with revise_of, and the carriers price the quote again on what they now know.\n\nThe address the second round asks for is where the car is kept, and it is checked against the ZIP the quote is running on. They disagree, and the answer is to correct whichever one is wrong — never to move the customer onto a ZIP in a state the car is not kept in.\n\nOne quote at a time per customer. If their previous quote is still being answered, this fails with quote_in_progress and a poll_after_seconds: say so, read the earlier quote with get_quote when that time has passed, then ask for this one again with revise_of. Two asks at once (\"the Civic and the Silverado\") are run one after the other, and each result's asked_for says which is which.\n\nApart from arguments the schema rejects, a refusal comes back with a code, a message for the customer and a next_step for you, which says what to do next and which tool, if any, to call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Second round only. The street address where the car is kept overnight — street and number; the ZIP already gave the city and the state. It is checked against that ZIP, and an address somewhere else is refused rather than quoted: this is the field that decides which state the policy is rated in. Where they work is not it."
              },
              "collected": {
                "description": "The `collected` next_question returned once `ready_to_quote` was true. Required: it is the record that every question was put to the customer. A call without it, or with one that still has questions pending, is refused with `questions_not_finished` and creates nothing.",
                "minLength": 1,
                "type": "string"
              },
              "correction_of": {
                "description": "Only when a previous call failed with `data_not_accepted`: pass the `correction_of` it returned, together with the corrected details. The quote is retried on the same record instead of starting a second one for the same person. Never invent this value.",
                "type": "string"
              },
              "drivers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "birthdate": {
                      "description": "YYYY-MM-DD. Age is what carriers rate on, so it is the date itself, never one worked out from an age.",
                      "type": "string"
                    },
                    "document": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "number": {
                              "anyOf": [
                                {
                                  "maxLength": 13,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "Second round only, as on sigoseguros.com: required there for every driver who is not excluded, and dropped if sent on a first quote. A Texas licence is 7 or 8 digits, a California one 1 letter and 7 digits, a Florida one 1 letter and 12 digits; any other is up to 12 characters."
                            },
                            "type": {
                              "description": "Offer all six. A customer without a US licence is quotable on a foreign licence, a consular ID (matrícula) or a passport, and offering fewer reads as being turned away. None of the six is a learner permit, and the type on its own is never read as a full licence: a permit holder is recorded with the type of the document they carry and with `license_status: \"learner-permit\"`, which is what the rater prices as a permit.",
                              "enum": ["us_license", "foreign_license", "us_id", "foreign_id", "consular_id", "passport"],
                              "type": "string"
                            }
                          },
                          "required": ["type"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The driver's identity document. Optional: a customer who declines is quoted without one."
                    },
                    "education": {
                      "anyOf": [
                        {
                          "enum": ["less-than-high-school", "high-school", "some-college", "bachelor-degree", "master-degree"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Second round only. Not asked for in California, which prohibits rating on it."
                    },
                    "excluded": {
                      "default": false,
                      "description": "True for a household member who is named but must not drive the car. They go on the policy as excluded rather than being left off it. Nobody prices them, so their gender and marital status are not needed — do not go back to the customer for personal details about someone who is not being rated.",
                      "type": "boolean"
                    },
                    "first_name": {
                      "description": "Up to 25 characters, which is what the carrier's form holds. A customer whose name does not fit is asked how they want it shortened — it goes on the policy, so it is their call and not a silent trim.",
                      "maxLength": 25,
                      "minLength": 1,
                      "type": "string"
                    },
                    "gender": {
                      "description": "The two values the rater maps; anything else is silently rated as male. It is a field on the carrier's rating form, so ask it as such rather than as a question about identity. Not asked for in California, which prohibits rating on it.",
                      "enum": ["male", "female"],
                      "type": "string"
                    },
                    "is_primary": {
                      "description": "Whether this is the driver who uses the car most. Exactly one driver is, and it is the customer who says which — carriers rate on it, so choosing for them quotes a household that may not be theirs. With more than one driver and nothing said about it, ask before quoting rather than assuming the first one.",
                      "type": "boolean"
                    },
                    "last_name": {
                      "description": "Up to 25 characters, same as the first name: ask rather than shorten it for them.",
                      "maxLength": 25,
                      "minLength": 1,
                      "type": "string"
                    },
                    "license_status": {
                      "anyOf": [
                        {
                          "enum": ["valid", "learner-permit", "suspended"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Whether that document is in force, and the only place a learner permit is ever recorded. Send it the moment the customer says it, first quote included: a permit holder goes down as 'learner-permit' and never as a full licence, and the rater prices them as a permit. A permit and a suspended licence are both quotable, so ask it plainly."
                    },
                    "marital_status": {
                      "description": "Offer all of them when asking. Carriers rate on it, and anything the rater does not recognise is silently rated as 'single', so a driver pushed into the nearest offered option is quoted on the wrong facts. Not asked for in California, which prohibits rating on it.",
                      "enum": ["single", "married", "widowed", "divorced", "separated"],
                      "type": "string"
                    },
                    "months_licensed": {
                      "anyOf": [
                        {
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Second round only. How many months they have held the document. Offer ranges — 1 to 4 years, 5 to 8, more than 8 — and send the middle of the one they pick, which is what the other Sigo channels send."
                    },
                    "occupation": {
                      "anyOf": [
                        {
                          "maxLength": 20,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Second round only. The rater's code, from `find_occupation` — never invented and never the customer's own words. Not asked for in California."
                    },
                    "relationship": {
                      "description": "How this driver relates to the main one. Leave it out for the main driver. A married customer's spouse goes on the quote as a driver with 'spouse'.",
                      "enum": ["spouse", "domestic-partner", "child", "parent", "sibling", "other-relative", "non-relative"],
                      "type": "string"
                    }
                  },
                  "required": ["birthdate", "first_name", "is_primary", "last_name"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "email": {
                "description": "Identifies the customer and is how Sigo reaches them about this quote. No phone number is collected here, so nothing can be called or texted from this channel — which is not the same as Sigo not calling: a customer who wants a call leaves their number in Sigo's own flow, through the link on their estimate, and an agent calls them.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "has_prior_insurance": {
                "description": "Whether the customer currently has car insurance.",
                "type": "boolean"
              },
              "is_homeowner": {
                "default": false,
                "type": "boolean"
              },
              "is_student": {
                "default": false,
                "type": "boolean"
              },
              "locale": {
                "description": "The language the customer is writing in. Set it from their own messages rather than leaving the default: the estimate's notice comes back in this language, and a notice the customer cannot read discloses nothing. Sigo serves these two languages only.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "prior_coverage_expiration": {
                "anyOf": [
                  {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Second round only. YYYY-MM-DD, when the current policy ends. Today is accepted; a date already past is refused: confirm it with the customer, and if their coverage really did end, they have no prior insurance to send."
              },
              "prior_coverage_months": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Second round only, and only for a customer who has insurance now. How long they have been covered: offer 6 months, 1 year, 3 years, 4 or more."
              },
              "revise_of": {
                "description": "When the customer wants a quote they already have run again with something changed — another deductible, another coverage, a detail they gave wrong: pass that quote's `quote_id` here, with the full details including the change. It re-quotes the same person instead of making them a second one. Never invent this value, and never use it for a different customer.",
                "type": "string"
              },
              "uninsured_motorist": {
                "description": "Whether to include uninsured-motorist protection — cover for when the other driver has no insurance. Ask it; it is the one add-on offered at this step and it changes the price.",
                "type": "boolean"
              },
              "vehicles": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "annual_mileage": {
                      "anyOf": [
                        {
                          "maximum": 50000,
                          "minimum": 1000,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Second round only, and only where next_question asked it (California). The customer's own estimate of miles per year, as a whole number: the figure they said or the round number they picked, never a range converted by the agent. The carrier has them attest to it."
                    },
                    "coverage_type": {
                      "enum": ["liability", "full_coverage"],
                      "type": "string"
                    },
                    "deductible": {
                      "anyOf": [
                        {
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Only meaningful with full_coverage. Ignored otherwise."
                    },
                    "lienholder": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "address": {
                              "anyOf": [
                                {
                                  "maxLength": 120,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "city": {
                              "anyOf": [
                                {
                                  "maxLength": 60,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "loan_number": {
                              "anyOf": [
                                {
                                  "maxLength": 40,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "name": {
                              "description": "The bank or finance company. Ask for this one; the rest is on the loan papers.",
                              "maxLength": 60,
                              "minLength": 1,
                              "type": "string"
                            },
                            "state": {
                              "anyOf": [
                                {
                                  "pattern": "^[A-Za-z]{2}$",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "zip_code": {
                              "anyOf": [
                                {
                                  "pattern": "^[0-9]{5}$",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            }
                          },
                          "required": ["name"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Second round only, and only for a financed or leased car: who holds the loan."
                    },
                    "make": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "model": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "ownership": {
                      "anyOf": [
                        {
                          "enum": ["owned", "financed", "leased"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Second round only. Whether the car is paid off, financed or leased."
                    },
                    "primary_use": {
                      "description": "What the car is mostly used for, in the rater's own five: pleasure, artisan (tools and a trade), commute (driving to work), farm, business. Ask with all five — the ones that are not 'pleasure' are what a carrier prices differently. None of them means driving for a transport app; that answer goes in `used_for_rideshare`.",
                      "enum": ["pleasure", "artisan", "commute", "farm", "business"],
                      "type": "string"
                    },
                    "used_for_rideshare": {
                      "default": false,
                      "description": "True when the customer says they drive the vehicle for a transport or delivery app — Uber, Lyft, DiDi, Uber Eats, DoorDash, Amazon Flex and the like. Do not ask for it: set it the moment they mention it, in any wording ('manejo para Uber', 'hago entregas con la app'). Unlike every other field here it stops the quote: no estimate is produced, because a personal auto policy priced for this use is a misrepresentation the carrier can void a claim over. The customer is answered with `rideshare_needs_agent` and the link a Sigo agent reaches them through.",
                      "type": "boolean"
                    },
                    "used_for_work": {
                      "default": false,
                      "description": "True when the customer says the vehicle is used for their work or business — deliveries, tools, a trade. Do not ask for it: set it when they bring it up. It changes nothing about the price and adds the notice their situation needs, because this is a personal auto quote and a vehicle used for a business may need a commercial policy. Driving for a transport app is not this: it has its own field, `used_for_rideshare`, and it is not quoted here at all.",
                      "type": "boolean"
                    },
                    "vin": {
                      "anyOf": [
                        {
                          "maxLength": 21,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Second round only. The VIN from the customer's registration or insurance card."
                    },
                    "year": {
                      "maximum": 2027,
                      "minimum": 1981,
                      "type": "integer"
                    }
                  },
                  "required": ["coverage_type", "make", "model", "primary_use", "year"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "zip_code": {
                "description": "The 5-digit ZIP code where the vehicle is kept. It determines the state.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["collected", "drivers", "email", "has_prior_insurance", "locale", "uninsured_motorist", "vehicles", "zip_code"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
