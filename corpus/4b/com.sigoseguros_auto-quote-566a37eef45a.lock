                            "excluded_people": {
                              "description": "How many people the carrier excluded from this price. Say so with the price when it is not zero; who they are is shown in the link, never here.",
                              "maximum": 9007199254740991,
                              "minimum": -9007199254740991,
                              "type": "integer"
                            },
                            "installment_amount": {
                              "description": "Per instalment after today; null for pay-in-full.",
                              "type": ["number", "null"]
                            },
                            "number_of_installments": {
                              "maximum": 9007199254740991,
                              "minimum": -9007199254740991,
                              "type": "integer"
                            },
                            "payment_method": {
                              "description": "The way of paying this price is valid on: card, ach or direct_bill. The customer confirms it in the link.",
                              "type": "string"
                            },
                            "requires_autopay": {
                              "description": "True when this price is only available with automatic payments. Say so with the price; the customer accepts autopay in the link before paying it.",
                              "type": "boolean"
                            },
                            "roadside_included": {
                              "description": "Whether roadside assistance is part of this price.",
                              "type": "boolean"
                            },
                            "term_months": {
                              "anyOf": [
                                {
                                  "maximum": 9007199254740991,
                                  "minimum": -9007199254740991,
                                  "type": "integer"
                                },
                                {
                                  "type": "null"
                                }
                              ]
