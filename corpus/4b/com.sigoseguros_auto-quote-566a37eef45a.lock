                    "description": "The ZIP code, exactly as the customer gave it.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "collected": {
                "description": "The `collected` from the previous call. Leave it out on the first question of a conversation and send it on every call after that: it carries everything answered so far, so nothing has to be repeated and nothing is lost.",
                "type": "string"
              },
              "locale": {
                "description": "The language the customer is writing in. Set it from their own messages rather than leaving the default: the estimate's notice comes back in this language, and a notice the customer cannot read discloses nothing. Sigo serves these two languages only.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "stage": {
                "default": "first_quote",
                "description": "Which stretch the conversation is in. `second_round` is for a customer who saw prices and wants to finish the application; it asks a different set, and the prices it leads to are still estimates.",
                "enum": ["first_quote", "second_round"],
                "type": "string"
