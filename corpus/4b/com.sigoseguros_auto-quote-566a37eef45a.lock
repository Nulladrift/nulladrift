                      "type": {
                        "description": "The value's shape. `mark` means send `true` once the matter is settled; the details themselves (a name, a VIN, a spouse) go to start_quote, not here.",
                        "enum": ["string", "integer", "boolean", "enum", "mark"],
                        "type": "string"
                      },
                      "values": {
