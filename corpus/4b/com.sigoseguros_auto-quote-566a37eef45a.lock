            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "collected": {
                "description": "The `collected` commercial_next_question returned when ready_to_submit was true.",
                "type": "string"
              },
              "locale": {
                "description": "The language the customer is writing in. Set it from their own messages: the questions come back in it, and the request is filed in it so the Sigo agent follows up in it.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["collected", "locale"],
            "type": "object"
