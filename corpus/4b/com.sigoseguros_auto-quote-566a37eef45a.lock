                        "type": "string"
                      },
                      "options": {
                        "description": "The firm prices the customer may pay now, lowest today's payment first. Each is a carrier's confirmed price, still subject to underwriting, eligibility, and state filing, and bought only in the link.",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "carrier_name": {
                              "type": "string"
                            },
                            "currency": {
                              "const": "USD",
