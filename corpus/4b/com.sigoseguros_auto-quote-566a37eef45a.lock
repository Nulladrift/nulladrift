                    "maximum": 50000,
                    "minimum": 1000,
                    "type": "integer"
                  },
                  "annual_mileage_settled": {
                    "const": true,
                    "description": "Second round, where asked. Send once every vehicle has its miles per year.",
                    "type": "boolean"
                  },
                  "birthdate": {
                    "description": "YYYY-MM-DD.",
                    "type": "string"
