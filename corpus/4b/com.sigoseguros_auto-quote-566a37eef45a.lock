      "serverInfo": {
        "name": "sigo-seguros",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "How to use this connector, in this order:\n1. next_question: call it until ready_to_quote is true, sending back the collected it returns each time and each answer under answer_as.key.\n2. start_quote: once, with that collected. It returns a quote_id.\n3. get_quote: with that quote_id, after poll_after_seconds, until more_carriers_pending is false. If start_quote answers quote_in_progress, never call start_quote again: the rating running is the one you started, and get_quote reads it.\nEvery refusal carries next_step, which says what to do; message is what the customer hears.\nA vehicle a business uses for its work is commercial auto, which is not quoted here: use commercial_next_question until ready_to_submit is true, then submit_commercial_application once.\nSigo Seguros is a licensed insurance agency and broker. It does not underwrite policies, does not pay claims, and is not an insurance carrier. This connector returns non-binding estimates for car insurance in the US states Sigo is licensed in. It cannot select a policy, take payment or bind coverage: a customer who wants to buy continues through the link included with each estimate.\n\nLanguage: the customer's own. Someone who writes in English is answered in English, start to finish; someone who writes in Spanish, in Spanish. Whichever it is, it goes in `locale` as well, because that is the language the estimate's notice comes back in — a disclosure the customer cannot read discloses nothing. Sigo serves these two languages and writes its notices in them, so a customer writing in a third is answered in whichever of the two they are likelier to read, and told which two those are, rather than left expecting service in a language Sigo does not have.\n\nHow Sigo is paid, because customers ask and the answer is not in the numbers: Sigo earns a commission from the carrier, and in almost every state where it sells, the customer pays a one-time broker fee for the agency's service. Whether there is one depends on the state — in Florida there is none — and `charges_broker_fee` on a quote says which case this customer is in, rather than leaving it to be assumed either way. The amounts in an estimate are the carrier's — its premium and its own charges — and Sigo's fee is not among them: it is itemised for the customer before they pay, in Sigo's own flow. No amount or percentage appears in anything this connector returns, and none can be worked out from it. An estimate is not the final cost of buying through Sigo.\n\nGathering the details is a conversation, not a form. Sigo's customers are working people, often quoting on a phone, and a wall of required fields is where they give up. `next_question` says what to ask now and what options to offer; ask that, wait for the answer, and ask it again — the order and the pace come from there rather than from judgement. What the customer already said is carried over, never asked twice. Plain language over insurance vocabulary.\n\nThe first estimates come from very little, so they are the opening and not the end. The quote is finished here: a second round — where the car is kept, the VIN, who owns it, the licence, what they do — prices the same application again, still as estimates, and then the chosen carrier's own declarations complete it. No price returned here is final: Sigo calculates the final quote in the link, after those declarations and before the customer pays. `to_final_quote` names the next call at every point, and following it is the default: it is what turns three rough numbers into the application the final quote is calculated on.\n\nThe link is the way out, not the way on. It is there for a customer who would rather finish on their own or who wants a Sigo agent to call them, and everything answered here is already on their application when they open it — so it is offered after the next step, not instead of it. Nothing in the connector promises a better price, and a carrier that has not answered is not a price: the list closes with what arrived.\n\nOne quote at a time for one customer. The carriers answer one question per person at a time, so a second quote started while the first is still being answered is refused with `quote_in_progress` rather than answered with the wrong prices. The customer hears what is happening — the earlier prices are still coming, the new question follows right after — and two asks made together are run one after the other, each labelled by its own `asked_for`, so a comparison lines up the right numbers.\n\nNobody is called from a car quote here, because a car quote takes no phone number — a fact about this channel, not about Sigo, whose agents call customers every day. A customer who asks to be called is told where to leave a number: the link on their estimate, which opens Sigo's own flow. Telling them Sigo does not call talks them out of the one thing this connector is for.\n\nCommercial auto is the one other thing this connector does, and it does not quote it. A contractor's truck, a delivery van, a tow truck or a fleet — any vehicle a business uses for its work — goes through `commercial_next_question`: a short intake, asked one question at a time in the website's own words, that ends with `submit_commercial_application` sending it to a Sigo agent, who follows up by email and quotes it with the carriers. It takes the business's name, a contact, a phone and an email for that follow-up, and never a social security number, a FEIN or a date of birth. There is no price, premium or fee to give for it, and no state or carrier to promise: any quote is subject to underwriting, eligibility and state filing. Someone who drives only for Uber, Lyft, DoorDash or Uber Eats is not commercial — its first question says so, and they go to `next_question`.\n\nEvery estimate carries a notice, and it reaches the customer as written, in the same answer as the price: it is one sentence, and the words in it — underwriting, eligibility, state filing — are the disclosure itself, not decoration on it. A summary of it is not that disclosure, which is why the field says so rather than leaving it to judgement.\n\nThe same holds for answers. A reply is read on a phone, between other things, so it is short and ends with one question or one step. Asked how to bring the price down, the answer comes from `price_levers` in the quote — what this step can actually change — and not from a list of every factor insurance prices on. What the levers do not cover is reviewed later with a Sigo agent, and saying so is a shorter and truer answer than re-quoting something that will come back the same.",
      "tools": [
        {
          "name": "answer_carrier_questions",
          "title": "File the customer's answers to the carrier's questions",
          "description": "After carrier_questions: file the answers, passing answers_so_far back each time, until the set is complete.\n\nSaves what the customer answered against their application, which is what moves it towards a final quote. Send every answer under the code it came back with, and only what the customer actually said.\n\nThis does not take payment, sign anything or bind coverage. Those happen in Sigo's own flow, through the link that comes back here.\n\nThe carrier takes its questions as a set, so answers are held until every one has been given. Pass the `answers_so_far` from the previous call back in, and only the new answer needs to go in `answers`. On the four-carrier path the whole pass is filed at once and next_call sends you to get_quote, where the firm prices land.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "description": "What the customer said, in their own answers. Never filled in on their behalf.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "description": "The question's code, exactly as it came back.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "value": {
                      "anyOf": [
                        {
                          "maxLength": 500,
                          "type": "string"
                        },
                        {
                          "type": "boolean"
                        }
                      ],
                      "description": "What the customer answered."
                    }
                  },
                  "required": ["code", "value"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "answers_so_far": {
                "description": "The `answers_so_far` from the previous call, when there was one. It carries what the customer already answered, so only the new answer needs to go in `answers`. It survives a re-quote: after start_quote with revise_of, send the same token with the new quote_id and the answers still stand, as long as the carrier is the same one. Nobody has to be asked twice.",
                "type": "string"
              },
              "chosen_quote_id": {
                "description": "The estimate the customer picked. Left out on the four-carrier path, as at carrier_questions.",
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "description": "The language the customer is writing in. Set it from their own messages rather than leaving the default: the estimate's notice comes back in this language, and a notice the customer cannot read discloses nothing. Sigo serves these two languages only.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "quote_id": {
                "description": "The handle start_quote returned.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["answers", "locale", "quote_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answered": {
                "description": "How many of the carrier's questions have an answer so far, counting the earlier turns.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "answers_so_far": {
                "description": "Everything answered up to now, to pass back on the next call so nothing is lost. Null once the carrier has the set and there is nothing left to carry.",
                "type": ["string", "null"]
              },
              "filed": {
                "description": "True once the carrier has the whole set. The carrier takes it whole or not at all, so answers are held until every required question has one.",
                "type": "boolean"
              },
              "next_call": {
                "description": "Exactly what to call next, with its arguments, when something follows here; null otherwise.",
                "type": ["string", "null"]
              },
              "next_step": {
                "additionalProperties": false,
                "description": "Paying and signing happen here, not in this conversation.",
                "properties": {
                  "action": {
                    "const": "continue_with_sigo",
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["action", "note", "url"],
                "type": "object"
              },
              "note": {
                "description": "What is done and what is still ahead, in the customer's language.",
                "type": "string"
              },
              "still_needed": {
                "description": "The codes of the required questions with no answer yet. Empty when the set is complete.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["answered", "answers_so_far", "filed", "next_call", "next_step", "note", "still_needed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
