        {
          "name": "carrier_questions",
          "title": "The carriers' own questions before a firm price",
          "description": "After the three steps, when to_final_quote.next_call names it: the questions of the estimate the customer picked, or of every carrier at once when get_quote carries firm_prices (then no chosen_quote_id). Then answer_carrier_questions.\n\nReturns the questions the carrier asks in the customer's state — attestations and disclosures the carrier words itself; on the four-carrier path, every carrier's, once. Say `preamble` first, then ask one `ask_together` block per turn, each question exactly as it is worded; they are not Sigo's questions to reword. Send the answers with `answer_carrier_questions`.\n\n`can_answer_here` is false where that carrier does not finish online, or the answers were already filed; a Sigo agent takes it, or get_quote has the prices. Either way the customer keeps the link: they can finish on the web at any point without losing what they have answered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chosen_quote_id": {
                "description": "The `quote_id` of the estimate the customer picked, from the list they were shown. Leave it out when get_quote answered with a `firm_prices` block: there the questions are the same for every carrier.",
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "description": "The language the customer is writing in. Set it from their own messages rather than leaving the default: the estimate's notice comes back in this language, and a notice the customer cannot read discloses nothing. Sigo serves these two languages only.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "quote_id": {
                "description": "The handle start_quote returned.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["locale", "quote_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ask_together": {
                "description": "Codes that can be put to the customer in one turn, grouped the way the carrier groups them. Ask each block as one message and send its answers together. A question with `depends_on` is in no block: it gets its own turn, after the one it hangs off. Empty when there is nothing to ask here.",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "can_answer_here": {
                "description": "False when there is nothing to ask here: the application is still missing details, the carrier does not finish online in this state, or the answers were already filed. Check `still_needed` and `note` to tell them apart.",
                "type": "boolean"
              },
              "next_step": {
                "additionalProperties": false,
                "description": "Where the customer finishes. Theirs at any point, not only at the end.",
                "properties": {
                  "action": {
                    "const": "continue_with_sigo",
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["action", "note", "url"],
                "type": "object"
              },
              "note": {
                "description": "How to put these, in the customer's language.",
                "type": "string"
              },
              "preamble": {
                "description": "Sigo's own words for the customer, to say as they are before the first question. Not one of the carrier's questions and not answered. Null when there is nothing to ask here.",
                "type": ["string", "null"]
              },
              "questions": {
                "description": "In the order the platform ranked them.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer_type": {
                      "description": "What kind of answer it takes, as the platform types it — `yes_no` on every question seen so far. Send a boolean for those; anything else goes as text.",
                      "type": "string"
                    },
                    "code": {
                      "description": "Send the answer back under this code.",
                      "type": "string"
                    },
                    "depends_on": {
                      "description": "The code of the question this one hangs off. Ask it only once that one is answered; null when it stands on its own.",
                      "type": ["string", "null"]
                    },
                    "required": {
                      "type": "boolean"
                    },
                    "wording": {
                      "description": "The carrier's own words, in the customer's language. Ask it as it is written: do not reword it, do not soften it, and do not turn it around. The customer is attesting to this for the record.",
                      "type": "string"
                    },
                    "wording_language": {
                      "description": "The language `wording` is in, which is the conversation's own. A carrier with no wording in it is not answered here at all: `can_answer_here` is false and a Sigo agent takes it.",
                      "enum": ["es", "en"],
                      "type": "string"
                    }
                  },
                  "required": ["answer_type", "code", "depends_on", "required", "wording", "wording_language"],
                  "type": "object"
                },
                "type": "array"
              },
              "still_needed": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "What the application still lacks, when that is why the questions are not here. An empty array means nothing is missing. Null means this is not about the application at all — either the questions came back, or the carrier does not finish online here."
              }
            },
            "required": ["ask_together", "can_answer_here", "next_step", "note", "preamble", "questions", "still_needed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
