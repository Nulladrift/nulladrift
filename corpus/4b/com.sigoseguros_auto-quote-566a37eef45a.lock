                "type": "boolean"
              },
              "disclaimer": {
                "description": "The notice every quote is subject to. Say it as written; it is the disclosure itself.",
                "type": "string"
              },
              "form_note": {
                "description": "The line to give the customer with form_url.",
                "type": "string"
              },
              "form_url": {
                "description": "The website's full commercial form, in the customer's language.",
                "type": "string"
              },
              "message": {
                "description": "What to tell the customer, as written.",
                "type": "string"
              },
              "reference": {
                "description": "Sigo's reference for the request. Not a quote and not a policy number.",
                "type": "string"
              },
              "status": {
                "const": "received",
                "description": "Sigo has the request. A Sigo agent follows up; nothing was quoted here.",
                "type": "string"
