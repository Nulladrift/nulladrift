        {
          "name": "find_occupation",
          "title": "Find the rater's code for a customer's job",
          "description": "Second-round helper, outside the three steps: turns the customer's words into the occupation code start_quote takes.\n\nTurns what the customer said they do into the carrier's own occupation codes. Call it before sending `occupation` on a driver: the catalogue is written in trade names and customers answer in their own, so the code is never something to guess at. Pick the entry that matches what they described and send its code.\n\nAn empty list means ask them another way rather than settle for the nearest thing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "The language the customer is writing in. Set it from their own messages rather than leaving the default: the estimate's notice comes back in this language, and a notice the customer cannot read discloses nothing. Sigo serves these two languages only.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "said": {
                "description": "What the customer said they do, in their own words — 'chofer', 'trabajo en construcción'.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["locale", "said"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "matches": {
                "description": "The rater's entries that fit, best first. Pick the one that matches what the customer described and send its `code` as the driver's `occupation`.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "What to do with this list, in the customer's language — including when it comes back empty.",
                "type": "string"
              }
            },
            "required": ["matches", "note"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
