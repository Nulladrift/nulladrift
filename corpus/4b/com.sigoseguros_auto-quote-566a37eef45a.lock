        {
          "name": "resolve_application_link",
          "title": "Read a Sigo link the customer already has",
          "description": "Outside the three steps: for a customer who arrives with a Sigo link they already have.\n\nSays what a Sigo link points at, how far that application has got, and the one thing the customer has to do next. Call it when someone shows up with a link — from an email, a text, or their own notes — and asks for help finishing.\n\nPass only the Sigo link or code they shared. It resolves the short link, the long one and a bare code.\n\nIt reads only: it opens nothing on the customer's behalf, and asking twice changes nothing. It reports no price, carrier or personal detail, because Sigo does not send any — whoever holds a link gets this same answer, so there is nothing here that identifies its owner. Say the `message` as given rather than composing one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "default": "es",
                "description": "The language to write the returned `message` in: the customer's own, es or en.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "pasted_link": {
                "description": "Only the Sigo link or code the customer shared (a sigoseguros.com link or a short code), not the rest of their message. Stray punctuation around it is fine; do not guess at a link the customer did not provide.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pasted_link"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "What to tell the customer, already written in their language. Say this rather than composing your own: it is the only description of the application Sigo has checked, and it deliberately states no price, carrier or personal detail because none was read.",
                "type": "string"
              },
              "next_step": {
                "description": "The single next action, as a value. `message` is the wording for it.",
                "type": "string"
              },
              "state": {
                "description": "How far the application has got. Coarse on purpose.",
                "enum": ["in_progress", "final_quote_ready", "signature_owed", "awaiting_binding", "needs_agent", "complete", "not_found"],
                "type": "string"
              },
              "url": {
                "description": "The link to hand back so the customer can continue, or null when nothing resolved. Use this URL rather than the one the customer pasted.",
                "type": ["string", "null"]
              }
            },
            "required": ["message", "next_step", "state", "url"],
            "type": "object"
          },
