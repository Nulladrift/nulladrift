                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "coverage_type": {
                          "enum": ["liability", "full_coverage"],
                          "type": "string"
                        },
                        "deductible": {
                          "anyOf": [
                            {
                              "maximum": 9007199254740991,
                              "minimum": -9007199254740991,
                              "type": "integer"
                            },
                            {
                              "type": "null"
