        },
        {
          "name": "commercial_next_question",
          "title": "The next commercial auto question to ask a business",
          "description": "Commercial auto, step 1 of 2: call it until ready_to_submit is true, sending back the collected it returns each time and each answer under answer_as.key. Then submit_commercial_application.\n\nFor a vehicle a business owns or uses for its work: a contractor's pickup, a delivery van, a box truck, a tow truck, a fleet. It takes the short intake Sigo's commercial form opens with, one question at a time in the customer's language, and a Sigo agent quotes it with the carriers afterwards. There is no estimate and no price here, and none to give: say any quote is subject to underwriting, eligibility and state filing.\n\nIts first question tells a business apart from someone who drives only for Uber, Lyft, DoorDash or Uber Eats. That is personal auto: route_to_personal turns true, nothing commercial is sent, and next_question takes it from there. When it is not clear which kind of customer this is, start here.\n\nAsk `ask` as the website words it, with its options, and wait for the answer. It never asks for a social security number, a FEIN or EIN, a date of birth or a licence number; do not collect them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answered": {
                "additionalProperties": false,
                "description": "Only what the customer said this turn, under answer_as.key. Everything earlier is in `collected`.",
                "properties": {
                  "business_name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "business_state": {
                    "description": "The state the business's physical address is in: its two-letter code (TX) or its name in English or Spanish (Texas, Nuevo México).",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "business_type": {
                    "enum": ["contractor", "delivery", "rideshare", "trucking", "towing", "homeServices", "foodTruck", "other"],
                    "type": "string"
                  },
                  "business_type_other": {
                    "description": "Only when business_type is `other`: what the business does, in the customer's words.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "contact_name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "email": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "filing_required": {
                    "enum": ["yes", "no", "notSure"],
                    "type": "string"
                  },
                  "for_hire": {
                    "type": "boolean"
                  },
                  "phone": {
                    "description": "A US number, as the customer gave it.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "radius": {
                    "enum": ["local", "intermediate", "longHaul"],
                    "type": "string"
                  },
                  "vehicle_count": {
                    "maximum": 99,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "vehicle_use": {
                    "description": "The first question: apps only, or a business.",
                    "enum": ["appDriver", "business"],
                    "type": "string"
                  },
                  "weight_class": {
                    "enum": ["light", "medium", "heavy"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "collected": {
                "description": "The `collected` from the previous call. Leave it out on the first question and send it on every call after that. It is not the quote flow's collected: the two do not mix.",
                "type": "string"
              },
              "locale": {
                "description": "The language the customer is writing in. Set it from their own messages: the questions come back in it, and the request is filed in it so the Sigo agent follows up in it.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["locale"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answer_as": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "key": {
                        "description": "The exact key to send this answer under in `answered` on the next call.",
                        "type": "string"
                      },
                      "type": {
                        "enum": ["string", "integer", "boolean", "enum"],
                        "type": "string"
                      },
                      "values": {
                        "description": "For `enum`: the only values accepted. values[i] is what options[i] means.",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["key", "type"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "How to send the answer back. Null once nothing is left to ask."
              },
              "ask": {
                "description": "The website's own wording of the question, in the customer's language. Put it to them as it is; do not reword the options.",
                "type": "string"
              },
              "collected": {
                "description": "Everything answered so far, this turn included. Send it back on the next call.",
                "type": "string"
              },
              "field": {
                "description": "The question being asked, by name; `none` when there is nothing left to ask.",
                "type": "string"
              },
              "next_step": {
                "anyOf": [
