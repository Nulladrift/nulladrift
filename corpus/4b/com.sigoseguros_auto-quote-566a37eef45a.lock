        {
          "name": "list_available_states",
          "title": "States where Sigo can quote",
          "description": "Before the flow, optional: where Sigo quotes. The flow itself is next_question, then start_quote once, then get_quote.\n\nThe US states Sigo Seguros is licensed to sell car insurance in, and what Sigo is. Ask this before collecting details, so a customer elsewhere is not taken through a full quote.\n\nThe state a policy is rated in comes from where the car is kept overnight, not from where the customer lives or works. Read `state_is_decided_by` before asking for a ZIP: a car kept outside these states is not quoted on a ZIP inside them, however close the customer commutes.\n\nSigo is an agency: it sells policies that carriers issue. The carrier pays it a commission, and in almost every state where it sells, the customer pays a one-time broker fee for the agency's service — in Florida there is none. Where there is one it is real and is itemised before anyone pays, in Sigo's own flow. Asked what Sigo charges — which customers ask before there is any quote — that is the answer, with no amount: saying Sigo charges nothing is false wherever it does charge, and the checkout will contradict it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "description": "The language the customer is writing in. Set it from their own messages rather than leaving the default: the estimate's notice comes back in this language, and a notice the customer cannot read discloses nothing. Sigo serves these two languages only.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["locale"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "carriers": {
                "additionalProperties": false,
                "properties": {
                  "catalogue_is_public": {
                    "const": false,
                    "description": "Sigo publishes no list of the carriers it works with: it varies by state and by quote. Which ones answered is known only once a quote has run, and only those may be named.",
                    "type": "boolean"
                  },
                  "note": {
                    "type": "string"
                  }
                },
                "required": ["catalogue_is_public", "note"],
                "type": "object"
              },
              "how_sigo_is_paid": {
                "description": "What to say when the customer asks what Sigo charges, in their language. No amount is in it.",
                "type": "string"
              },
              "state_is_decided_by": {
                "description": "Read this before asking for a ZIP. It says what decides the state a policy is rated in, in the customer's language, and it is the one thing this list does not say on its own.",
                "type": "string"
              },
              "states": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "maxLength": 2,
                      "minLength": 2,
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["carriers", "how_sigo_is_paid", "state_is_decided_by", "states"],
            "type": "object"
          },
