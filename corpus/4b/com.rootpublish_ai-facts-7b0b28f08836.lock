{
  "lockfileVersion": 2,
  "subjects": {
    "com.rootpublish/ai-facts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rootpublish.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "rootpublish-ai-facts-remote",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Checks what an AI assistant tells buyers about a company against the company's own pages. Order: buyer_questions; answer each question yourself with web search and show the answers; then company_statements; then verify_findings once per answer. Do not read the company's pages before answering.",
      "tools": [
        {
          "name": "buyer_questions",
          "description": "Start an AI facts check: returns the questions a buyer asks about a company. Answer them yourself, with web search, before reading anything from the company.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "The company or product name buyers use",
                "type": "string"
              },
              "depth": {
                "description": "full asks three questions (default); quick asks one",
                "enum": ["full", "quick"],
                "type": "string"
              },
              "offer": {
                "description": "The product or service to ask about",
                "type": "string"
              },
              "site": {
                "description": "The company's site, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:460baa1d29e5c36802219320f3f3ce19d33da65e2e97733f5ad9000da806ca96"
        },
        {
          "name": "company_statements",
          "description": "After you have answered the buyer questions: reads the company's pricing and service pages and returns its statements with instructions for comparing your answers.",
          "inputSchema": {
            "properties": {
              "company": {
                "type": "string"
              },
              "pages": {
                "description": "Paths of the pages that state prices and terms, e.g. [\"/pricing\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "site": {
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:431d1bb7d4f88618829af3c393bab160560150411bc0ab4fdec1d83b0c95ae7d"
        },
        {
          "name": "verify_findings",
          "description": "Keeps only the differences whose quotes are really in your answer and on the company's page, and finds the pages your answer cited that carry a wrong figure. Call once per answer.",
          "inputSchema": {
            "properties": {
              "answer": {
                "description": "One of your full answers, exactly as you wrote it",
                "type": "string"
              },
              "judgement": {
                "description": "Your findings for that answer as a JSON object",
                "type": "string"
              },
              "pages": {
                "description": "The pages returned by company_statements",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "site": {
                "type": "string"
              }
            },
            "required": ["answer", "judgement", "site"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4168d65076cfa5e6715410444aa60c12e3d9b5c2925768eeef7d0fb4a9b2d31a"
        }
      ],
      "digest": "sha256:61da5a438c0d080ee92b29cf1780cb3af0de2426f449bbc681ea36af66943a52"
    }
  }
}
