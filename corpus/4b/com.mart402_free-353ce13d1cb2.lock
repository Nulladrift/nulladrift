      },
      "instructions": "Read-only, free tools. Nothing here charges, asks for payment or moves money. Main use: check an x402 pay-per-call seller before you rely on it - search_x402_services searches Market402's measured index of x402 endpoints (weekly probes, 402 Score, delivery evidence) and operator_history shows one operator's 12-week track record. Also free: get_catalog (Mart402 product list and policies), get_sample (recorded sample outputs), quote_parse (exact price and page count of a PDF before any purchase) and portrait_precheck (whether a photo is usable for color analysis; no identification). Market402 and Mart402 are run by the same operator; the index applies one published methodology to every operator (https://market402.com/methodology). Docs: https://mart402.com/agents.md",
      "tools": [
        {
          "name": "get_catalog",
          "title": "Mart402 catalog (products, prices, policies)",
          "description": "Mart402 product catalog: all products, prices, payment config, error codes, rate limits. Free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "body": {
                "description": "JSON body of the underlying call (see /samples/{product} for each product's shape)"
              },
              "how_to_pay": {
                "type": "string"
              },
              "payment_required": {
                "description": "true when status is 402: body holds x402 payment terms, not a result. Pay and call again with x_payment",
                "type": "boolean"
              },
              "receipt_id": {
                "description": "set on paid results; free re-fetch via get_receipt",
                "type": "string"
              },
              "status": {
                "description": "HTTP status of the underlying call (200 result, 402 payment terms, 4xx input error)",
                "type": "integer"
              }
            },
            "required": ["body", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Mart402 catalog (products, prices, policies)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
