{
  "lockfileVersion": 2,
  "subjects": {
    "ai.selfe/registry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://selfe.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Selfe — The Registry",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Selfe — The Registry answers questions about places to stay, eat and do, and books them, for AI agents. Use discover_venues for an open question (ranked places with evidence, recommended areas, and live availability when a stay is given or stated), match_venues when the user means specific places (by id or by name, with live offers when given a stay), and book_venue with a place id and an offerId from either. Every tool returns structured JSON, NOT a rendered UI. Never invent prices, availability or amenities — quote only what the results carry, and when match returns candidates, ask the user which they mean. Selfe confirms a booking only when the guest approves it themselves, signed in to their Selfe account: when book_venue returns approval_required, give the guest approval.url, then book again with the approvalId once they have approved. An agent that can pay by card (a Stripe shared payment token) can instead book a stay itself, with no link, through UCP checkout: see https://selfe.ai/.well-known/ucp and /llms.txt.",
      "tools": [
        {
          "name": "book_venue",
          "description": "Reserve a venue offer grounded by match_venues. Pass entityId and the selected offerId. The guest must approve every booking themselves, signed in to their Selfe account: the first call returns status 'approval_required' with approval.url for the guest to open; once they have approved, call again with the same offer and approvalId. A signed mandate alone cannot confirm a booking. No money moves at this step. Returns a confirmation (bookingId) or a conversational next step. Structured JSON.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "Reserve one current offer for one entity. Its date, party and price are bound inside the sealed offer.",
            "properties": {
              "approvalId": {
                "description": "The approval the guest gave this offer in their own Selfe account, returned as approval.id when the booking first needed it. A booking is confirmed only with the guest's approval.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "entityId": {
                "description": "The place id returned by discover or match.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "mandate": {
                "additionalProperties": {},
                "description": "A signed AP2 Cart Mandate for a foreign caller, bound to this entity and offer.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "offerId": {
                "description": "The opaque, sealed offer id returned by match.",
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              },
              "render": {
                "description": "Ask for layout hints alongside the booking result. Optional.",
                "properties": {
                  "a2ui": {
                    "description": "Also return `ui`: an A2UI surface for the booking result. A hint; the result is complete without it.",
                    "type": "boolean"
                  },
                  "catalogs": {
                    "description": "A2UI catalog ids the caller can render.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": [],
                "type": "object"
              }
            },
            "required": ["entityId", "offerId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a room, table or activity"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aaf8c6248dd667122410fab45d363492ecef5b53186b2b78f2db50d91a263ae9"
        },
        {
          "name": "discover_venues",
          "description": "Search for places to stay, eat and do from a natural-language question. Returns ranked places, recommended areas, and — when you pass `stay` (or the question states dates and party) — live availability whose offer ids go straight to book_venue. Use match_venues instead when the user names a specific place. Structured JSON, not a rendered UI.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "assumeParty": {
                "description": "Optional. The party to check live availability for when the question names dates but nobody is counted (\"next weekend\"). The question's own party, `party` or `stay` always wins; `meta.queryValues.guests` stays empty, so the answer can say the party was assumed.",
                "properties": {
                  "adults": {
                    "description": "Number of adults.",
                    "exclusiveMinimum": 0,
                    "maximum": 30,
                    "type": "integer"
                  },
                  "children": {
                    "description": "Number of children.",
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "pets": {
                    "description": "Number of dogs (or other pets) travelling. Only stays whose booking system prices them are offered, at that price.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["adults"],
                "type": "object"
              },
              "pageSize": {
                "description": "Maximum number of results to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "party": {
                "description": "Who is travelling, when known without dates (children change what suits). Ignored when `stay` carries its own party.",
                "properties": {
                  "adults": {
                    "description": "Number of adults.",
                    "exclusiveMinimum": 0,
                    "maximum": 30,
                    "type": "integer"
                  },
                  "children": {
                    "description": "Number of children.",
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "pets": {
                    "description": "Number of dogs (or other pets) travelling. Only stays whose booking system prices them are offered, at that price.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["adults"],
                "type": "object"
              },
              "query": {
                "additionalProperties": false,
                "description": "The question: `text` in natural language, with optional `filter` to narrow results (catalogue, section, category, type, place).",
                "properties": {
                  "@context": {
                    "const": "https://agenticresourcediscovery.org/context/v1",
                    "description": "Optional ARD v0.91 JSON-LD context.",
                    "type": "string"
                  },
                  "filter": {
                    "additionalProperties": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "description": "Optional dot-path field filters; each value is an array of strings (OR within a field), e.g. {\"tags\":[\"spa\"]}.",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "text": {
                    "description": "Natural-language query, e.g. \"boutique hotels in London with a spa\".",
                    "maxLength": 2048,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["text"],
                "type": "object"
              },
              "render": {
                "description": "Ask for layout hints alongside the results. Delivery (one body or a stream) is chosen by the Accept header, not here.",
                "properties": {
                  "a2ui": {
                    "description": "Also return `ui`: an A2UI surface for the same results. A hint; the results are complete without it.",
                    "type": "boolean"
                  },
                  "catalogs": {
                    "description": "A2UI catalog ids the caller can render.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": [],
                "type": "object"
              },
              "stay": {
                "description": "Optional. When given, results are grounded in live availability and offers for these dates and party. When absent, dates and party written in the question still apply. A dog the question names (\"with our dog\") joins a party that does not count pets.",
                "properties": {
                  "checkIn": {
                    "description": "Arrival date, ISO YYYY-MM-DD.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "checkOut": {
                    "description": "Departure date, ISO YYYY-MM-DD.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "party": {
                    "properties": {
                      "adults": {
                        "description": "Number of adults.",
                        "exclusiveMinimum": 0,
                        "maximum": 30,
                        "type": "integer"
                      },
                      "children": {
                        "description": "Number of children.",
                        "maximum": 30,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "pets": {
                        "description": "Number of dogs (or other pets) travelling. Only stays whose booking system prices them are offered, at that price.",
                        "maximum": 10,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["adults"],
                    "type": "object"
                  }
                },
                "required": ["checkIn", "checkOut", "party"],
                "type": "object"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search places to stay, eat and do"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1cd8ec386df074e4ee9c391003fa5166239d2b5baab724c8ac84a7c7776a8b43"
        },
        {
          "name": "match_venues",
          "description": "Get full details for places the user already means — by id (from discover_venues) or by name, with an optional website and town to tell same-named places apart. Pass `stay` to get live rooms and offers whose offer ids go straight to book_venue. A name that fits several places returns candidates: ask the user which, never guess. Structured JSON, not a rendered UI.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "places": {
                "description": "The places to match: ids, or a name with optional website and location.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "id": {
                          "description": "A place id from discover or a previous match.",
                          "maxLength": 128,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["id"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "location": {
                          "description": "Town or area, to tell apart places with the same name.",
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        },
                        "name": {
                          "description": "The place name as the caller knows it.",
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        },
                        "website": {
                          "description": "The place's own website, if known; the strongest identity signal.",
                          "maxLength": 500,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 250,
                "minItems": 1,
                "type": "array"
              },
              "projection": {
                "description": "`detail` (default) is the full record; `listing` is the compact card a list page needs.",
                "enum": ["detail", "listing"],
                "type": "string"
              },
              "render": {
                "description": "Ask for layout hints alongside the results. Delivery (one body or a stream) is chosen by the Accept header, not here.",
                "properties": {
                  "a2ui": {
                    "description": "Also return `ui`: an A2UI surface for the same results. A hint; the results are complete without it.",
                    "type": "boolean"
                  },
                  "catalogs": {
                    "description": "A2UI catalog ids the caller can render.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": [],
                "type": "object"
              },
              "stay": {
                "description": "When given, each matched place carries its live rooms and offers for these dates and party.",
                "properties": {
                  "checkIn": {
                    "description": "Arrival date, ISO YYYY-MM-DD.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "checkOut": {
                    "description": "Departure date, ISO YYYY-MM-DD.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "party": {
                    "properties": {
                      "adults": {
                        "description": "Number of adults.",
                        "exclusiveMinimum": 0,
                        "maximum": 30,
                        "type": "integer"
                      },
                      "children": {
                        "description": "Number of children.",
                        "maximum": 30,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["adults"],
                    "type": "object"
                  }
                },
                "required": ["checkIn", "checkOut", "party"],
                "type": "object"
              }
            },
            "required": ["places"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get details for named places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96dce34e894a9f25ca9c3d46e90699ba0218e793dcc915cc88a0c10652b2f073"
        }
      ],
      "digest": "sha256:ee2c7170f4b5de82ba1d77e286ceeb7bf740aaf4c29bf36fde2876e4a472a9ef"
    }
  }
}
