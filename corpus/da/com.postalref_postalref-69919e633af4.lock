        {
          "name": "read_source",
          "title": "Read a USPS document",
          "description": "Read any document postalref holds page by page, as extracted, to quote it: a quote cites the revision's sha256, the PDF page and the words exactly. A text without pages, a web page or a product page, reads in parts, and a quote from one cites no page. Quote whole sentences, word for word, from a page's `text` or a `found` context, which shows the whole sentence around the words, or the lead-in with the list it opens. Read another page `found` lists by its `pdf` number, or a part by its number, as `page`. When the text ends mid-sentence or mid-list, `continued` gives the rest of it from `next`, cited by its own page; when it ends mid-table, or a list goes on past `continued`, read `next`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "document": {
                "description": "A document's id, the `id` search_documents and search_text give: a modeled one, such as pub-199 or impb-spec; node-4649 for another PostalPro file; postalpro-855 for a PostalPro product page; or a download such as pdf-pub52, dmm-505 or web-prc-mcs-2026-07.",
                "type": "string"
              },
              "find": {
                "description": "Words to find, as one phrase, or when no page has the phrase, each word anywhere on a page. Without `page`, the text read is the first pages that have them.",
                "maxLength": 200,
                "type": "string"
              },
              "page": {
                "description": "The first PDF page, sheet or part to read, counting from 1. Absent with `find`: the pages that have the words.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "pages": {
                "description": "How many to read, up to 5; 1 when absent.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "revision": {
                "description": "A revision's sha256, or its slug, such as 2026-07-02. The newest when absent.",
                "maxLength": 64,
