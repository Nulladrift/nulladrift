        {
          "name": "search_text",
          "title": "Search the text of documents",
          "description": "Search the text of every document postalref holds, or of one, for the pages that say the words, best first: those that say them as a phrase, then by how much of the page they are and how many of them it says side by side or close together, a table of contents last. A court's filing or a Justice Department release about a fraud case comes after USPS's own pages when one of those says every word, as Publication 52 and a release about a bulk mail fraud both say bulk mail permit; a case's name finds its records first. A document gives at most three pages while other documents' pages fill the list, and `more` gives each document a hit is from that has more pages with the words, and how many: search again with its id as `document` to rank only its pages. A page needn't have the words a question asks with, such as how, get or take. Each word is found in its forms, and a name also as the registry's other names for it, BCG for Business Customer Gateway or Post Office Box for PO Box, and a size as 4x6 or 4 x 6; a hit another wording found gives it as `by`. Each hit gives the id and page read_source reads, and the passage that says most of the words. Use it when no title names what you're looking for, as for a price in the Mail Classification Schedule or a rule in a DMM chapter. A hit's `context` is a whole sentence, list or row of the page unless it starts or ends with …: quote it with the hit's `id` and `page`, or give them to read_source as `document` and `page` for the sentences around it. When no hit answers, search again with the words an answer would say.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "document": {
                "description": "Only this document's pages, by the id a hit or search_documents gives: every page of it that says the words, up to `limit`. Every held document when absent.",
                "type": "string"
              },
              "limit": {
                "description": "At most this many pages; 10 when absent.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words a page says: a price, a rule, a size, a name. Each word is found in its forms: one or many, -ed, -ing, -able, -ous.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "hits": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "by": {
                      "type": "string"
                    },
                    "context": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "page": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "phrase": {
                      "type": "boolean"
                    },
                    "printed": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["context", "id", "label", "page", "phrase", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "match": {
                "enum": ["all", "some"],
                "type": "string"
              },
              "more": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "pages": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["id", "pages"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              },
              "total": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["hits", "match", "query", "total"],
