      "instructions": "postalref answers from USPS's PostalPro documents, each answer with the passage that says it. decode reads a package barcode or tracking number, or a letter's or flat's Intelligent Mail barcode; lookup gives a code's row and history; diff says what changed between editions; search finds codes, terms and specs; define says what USPS means by a name; search_documents finds any PostalPro document, with the id of each one postalref holds; search_text finds the pages of held documents that say some words; read_source reads a held document's text to quote. To answer a question, define its main term, then search_text the words an answer would say, such as a price, a rule or a name, or search_documents for what USPS publishes on it, and read_source the pages they give. Cite each sentence of an answer from words you read, copied exactly, with the document's id, the revision's sha256 and the PDF page, and leave out what no words you read say. When a page ends mid-sentence or mid-list, read `next`. Before saying postalref doesn't hold an answer, search_text again with other words, such as the term's other names and abbreviations, and read the documents a search lists.",
