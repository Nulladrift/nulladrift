      },
      "instructions": "MisCausas.cl. Estudio jurídico especializado en los procedimientos de la Ley 20.720. Expertos en liquidación voluntaria, reestructuración de deudas y recuperación financiera. Atiende en todo Chile a personas, empresas, acreedores, trabajadores y compradores de activos en liquidación. Estas herramientas entregan lo que publica www.miscausas.cl: servicios, honorarios, horas libres y el evaluador de deuda, cuya orientación es preliminar. Para que la persona pida una reunión, usa pedir_reunion y entrégale los enlaces: este servidor no reserva ni recibe datos personales.",
      "tools": [
        {
          "name": "consultar_precios",
          "title": "Honorarios de MisCausas",
          "description": "Honorarios publicados por MisCausas.cl para cada servicio (en UF o en pesos), cómo se convierte la UF y las condiciones: gastos de terceros, pago en cuotas, acompañamiento posterior.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Honorarios de MisCausas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f25138f4028671622da1f66dcb50c2f5ffa673ee211bda7c9bb1024f6529f40a"
        },
        {
          "name": "evaluar_situacion",
          "title": "Evaluador de deuda",
          "description": "El evaluador de deuda de MisCausas.cl: orienta hacia la vía de la Ley 20.720 que corresponde (renegociación, liquidación, reorganización, defensa). Llámalo con las respuestas que ya tengas; si falta una, devuelve la siguiente pregunta con sus opciones para hacérsela a la persona. La orientación es preliminar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cantidadDeudas": {
                "description": "¿Cuántas deudas tienes impagas por más de 90 días?",
                "enum": ["dos-o-mas", "una-o-menos", "inseguro"],
                "type": "string"
              },
              "capacidadPago": {
                "description": "¿Podrías destinar una parte de tus ingresos a un plan de pagos?",
                "enum": ["si", "inseguro", "no"],
                "type": "string"
              },
              "montoPersona": {
                "description": "¿Cuál es el monto total aproximado de tus deudas?",
                "enum": ["mas-80uf", "menos-80uf", "inseguro"],
                "type": "string"
              },
              "objetivoPersona": {
                "description": "¿Qué buscas principalmente?",
                "enum": ["ordenar-mantener", "liberar", "defender"],
                "type": "string"
              },
              "perfil": {
                "description": "¿Quién tiene las deudas?",
                "enum": ["persona", "empresa"],
                "type": "string"
              },
              "primeraCategoria": {
                "description": "¿Tributaste en primera categoría en los últimos 24 meses?",
                "enum": ["no", "si"],
                "type": "string"
              },
              "procesalEmpresa": {
                "description": "¿Los acreedores ya iniciaron demandas o una solicitud de liquidación forzosa?",
                "enum": ["sin-demanda", "con-demanda", "inseguro"],
                "type": "string"
              },
              "procesalPersona": {
                "description": "¿Te notificaron una demanda ejecutiva, embargo o liquidación forzosa?",
                "enum": ["sin-demanda", "con-demanda", "inseguro"],
                "type": "string"
              },
              "tamanoEmpresa": {
                "description": "¿Cuánto vende la empresa al año?",
                "enum": ["mype", "mayor", "inseguro"],
                "type": "string"
              },
              "viabilidad": {
                "description": "¿El negocio sigue siendo viable?",
                "enum": ["viable", "no-viable", "inseguro"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
