        {
          "name": "horas_disponibles",
          "title": "Horas libres para la consulta",
          "description": "Las próximas horas libres para la consulta con un abogado de MisCausas.cl (hora de Chile). Solo informa: la hora la toma la persona en la agenda o por WhatsApp (ver pedir_reunion).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
