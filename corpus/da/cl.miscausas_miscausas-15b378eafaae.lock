        },
        {
          "name": "pedir_reunion",
          "title": "Pedir una reunión",
          "description": "Entrega los enlaces para que la persona pida su consulta con MisCausas.cl: la agenda del sitio y un WhatsApp con el mensaje escrito. No reserva ni guarda datos; la persona envía el mensaje o elige la hora, y el estudio confirma la reunión con ella.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hora": {
                "description": "Una hora tal como la entrega horas_disponibles («jueves 20 a las 16:00»).",
                "maxLength": 60,
                "type": "string"
              },
              "procedimiento": {
                "description": "La vía que dio evaluar_situacion, para que el mensaje la mencione.",
                "enum": ["renegociacion", "liquidacion-voluntaria", "defensa-cobranzas", "reorganizacion", "reorganizacion-simplificada", "liquidacion-empresarial", "consulta"],
                "type": "string"
              }
            },
            "type": "object"
          },
