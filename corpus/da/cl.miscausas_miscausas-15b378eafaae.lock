        },
        {
          "name": "listar_servicios",
          "title": "Servicios de MisCausas",
          "description": "Lista los servicios legales de MisCausas.cl (insolvencia y deudas en Chile, Ley 20.720) por audiencia: personas, empresas, acreedores, trabajadores y compradores de activos. Incluye la página de cada servicio y su honorario «desde» cuando el estudio lo publica.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audiencia": {
                "description": "Filtra por audiencia. Sin este argumento se listan todas.",
                "enum": ["personas", "empresas", "acreedores", "trabajadores", "compradores"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
