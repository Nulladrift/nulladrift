        {
          "name": "compare_full",
          "title": "Compare any variants (paid)",
          "description": "Side-by-side localized specs for 2-4 variants from ANYWHERE in the 103,372-variant catalogue, in 20 languages. Paid per call with x402 (USDC) — $0.1 flat for the call. Not charged when an id is unknown.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "description": "Response language, one of the 20 published languages (en, ro, fr, de, es, it, sr, hr, pt, pl, cs, sk, hu, no, sv, el, bg, da, ar, tr). Spec labels and enum values come back translated. Default: en.",
                "enum": ["en", "ro", "fr", "de", "es", "it", "sr", "hr", "pt", "pl", "cs", "sk", "hu", "no", "sv", "el", "bg", "da", "ar", "tr"],
                "type": "string"
              },
              "variant_ids": {
                "description": "2 to 4 opaque variant ids from search_catalogue or filter_catalogue, e.g. ['v_1a2b3c4d', 'v_5e6f7a8b']",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["variant_ids"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "data": {
                "description": "One entry per requested variant, in the order asked",
                "items": {
                  "additionalProperties": {},
