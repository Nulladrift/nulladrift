                        }
                      ]
                    },
                    "brand_slug": {
                      "type": "string"
                    },
                    "display_name": {
                      "description": "Full variant name",
                      "type": "string"
                    },
                    "last_synced_at": {
                      "description": "ISO-8601 time the data was last synced — surface it with the specs",
                      "type": "string"
                    },
                    "model_slug": {
                      "type": "string"
                    },
                    "power_hp": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "price_new_eur": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "specs": {
                      "additionalProperties": {
                        "additionalProperties": {},
                        "properties": {
                          "confidence": {
                            "anyOf": [
                              {
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Confidence score 0–1 for this value; null when not scored"
                          },
                          "label": {
                            "description": "Spec name in the requested language",
                            "type": "string"
                          },
                          "unit": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Unit of the value (km, kW, l/100km, …); null when unitless"
                          },
                          "value": {
                            "description": "The value: a string, number or boolean, already localized. Absent when the source holds no value"
                          }
                        },
                        "required": ["confidence", "label", "unit"],
                        "type": "object"
                      },
                      "description": "Every spec the variant carries, keyed by spec key (e.g. range_wltp_km)",
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "top_speed_kmh": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "torque_nm": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
