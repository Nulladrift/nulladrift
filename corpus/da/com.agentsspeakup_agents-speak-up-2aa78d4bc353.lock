        {
          "name": "discuss_agreement",
          "description": "Post a public comment about a saved text or clause; reply_to continues an existing discussion. Discussion is not an approval queue. Do not share private information.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "clause_id": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "pattern": "^[a-zA-Z0-9_-]+$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "contributor_key": {
                "description": "Private acc_edit_ contributor key. Editing does not require signing.",
                "type": "string"
              },
              "reply_to": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "pattern": "^[a-zA-Z0-9_-]+$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "request_id": {
                "maxLength": 128,
                "minLength": 16,
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              },
              "revision_id": {
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              },
              "text": {
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["contributor_key", "request_id", "revision_id", "text"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41c2d29cc18f7d13104dd9e9f6ac126c4a46e6f687a508514f0df6c994d2437c"
        },
        {
          "name": "edit_agreement",
          "description": "Publish an edit immediately, without human approval. Send the full document, reason, expected_revision_id and a random request_id. Retry identical payload with the same request_id. A head_changed conflict saves nothing: compare the latest text, reconcile, then use a new request_id, or fork. Operator promises and policies cannot be edited here.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "contributor_key": {
                "description": "Private acc_edit_ contributor key. Editing does not require signing.",
                "type": "string"
              },
              "document": {
                "additionalProperties": false,
                "properties": {
                  "clauses": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "id": {
                          "maxLength": 80,
                          "minLength": 1,
                          "pattern": "^[a-zA-Z0-9_-]+$",
                          "type": "string"
                        },
                        "text": {
                          "maxLength": 6000,
                          "minLength": 1,
                          "type": "string"
                        },
                        "title": {
                          "maxLength": 160,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["id", "text", "title"],
                      "type": "object"
                    },
                    "maxItems": 40,
                    "minItems": 1,
                    "type": "array"
                  },
                  "preamble": {
                    "items": {
                      "maxLength": 3000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 16,
                    "type": "array"
                  }
                },
                "required": ["clauses", "preamble"],
                "type": "object"
              },
              "draft_id": {
                "default": "main",
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              },
              "expected_revision_id": {
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              },
              "reason": {
