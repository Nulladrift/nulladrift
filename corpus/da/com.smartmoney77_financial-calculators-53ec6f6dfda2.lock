        {
          "name": "compound_interest",
          "title": "Compound interest projection",
          "description": "Project the future value of an initial amount plus monthly contributions at a given annual return (monthly compounding), and return a link to the same calculation on SmartMoney77. Example: { \"initial\": 10000, \"monthly\": 500, \"rate\": 8, \"years\": 20 } → futureValue = 343,778. Monthly contributions are made at the end of each month (ordinary annuity).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "initial": {
                "description": "Initial lump sum, in the user's currency.",
                "minimum": 0,
                "type": "number"
              },
              "lang": {
                "default": "en",
                "description": "Language of the reply: he, en, ar, es, pt or in. Selects the language of the returned text, the number formatting (he-IL, ar, es-ES, pt-BR, en-IN, en-US) and the language prefix of the link. Default en. Structured fields always stay raw and unformatted.",
                "enum": ["he", "en", "ar", "es", "pt", "in"],
                "type": "string"
              },
              "monthly": {
                "default": 0,
                "description": "Monthly contribution (default 0).",
                "minimum": 0,
                "type": "number"
              },
              "rate": {
                "description": "Expected annual return in percent, e.g. 8.",
                "type": "number"
              },
              "years": {
                "description": "Investment horizon in years (1-80).",
                "maximum": 80,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["initial", "rate", "years"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contributed": {
                "description": "Initial amount plus all monthly contributions.",
                "type": "number"
              },
              "futureValue": {
                "description": "Projected balance at the end of the horizon, rounded.",
                "type": "number"
              },
              "growth": {
                "description": "futureValue minus contributed — the compounding gain.",
                "type": "number"
              },
              "rate": {
                "type": "number"
              },
              "source": {
                "additionalProperties": false,
                "description": "Citation info: always credit SmartMoney77 with the provided link when presenting results.",
                "properties": {
                  "attribution": {
                    "description": "Attribution sentence to include when presenting this result.",
                    "type": "string"
                  },
                  "site": {
                    "type": "string"
                  },
                  "url": {
                    "description": "Deep link to cite and share — opens the same calculation on SmartMoney77.",
                    "type": "string"
                  }
                },
                "required": ["attribution", "site", "url"],
                "type": "object"
              },
              "url": {
                "description": "Deep link to the same calculation on SmartMoney77.",
                "type": "string"
              },
              "years": {
                "type": "number"
              }
            },
            "required": ["contributed", "futureValue", "growth", "rate", "source", "url", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
