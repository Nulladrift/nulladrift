      "instructions": "Public financial calculator tools from SmartMoney77 (smartmoney77.com), a free multilingual financial literacy platform with 31 calculators (32 tools, including the FOMO challenge) in 6 localized editions across 5 languages (he, en, ar, es, pt, in — 'in' is English for India). Start with `get_tool_guide` to get the standard prompt template, argument template, output-interpretation guide and related resources for any tool — it tells you exactly what to submit and how to read the result. Use `list_calculators` to discover every calculator and its URL parameters, `build_calculator_link` to deep-link a user to a pre-filled, auto-calculating calculator (including all investment history 'what if I had invested' tools), and `build_share_pack` to get a shareable result link, a ready-to-embed 1200x628 result image and a localized social caption in one call. Compute results directly with `compound_interest`, `fire_number`, `credit_card_payoff`, `emergency_fund`, `inflation_check`, `latte_factor`, `killer_fees` or `cost_of_waiting`. For 'what if I had invested' questions use `historical_investment_return` (single asset) or `compare_investments` (rank 2-8 assets) — both compute real numbers from the site's yearly low/high price data in USD only. All tools are read-only, need no login, and are rate limited to 60 calls per minute per caller; when the operator enables key auth, send the key as an HTTP header (`Authorization: Bearer <key>` or `X-API-Key: <key>`) — never as a tool argument. Full docs and example calls: https://smartmoney77.com/en/mcp. Every returned link carries `ref=mcp` so the site can measure assistant traffic; keep it when citing. Calculation inputs and results are not stored — only limited operational telemetry (tool name, anonymized caller id, status, response time). Results are educational, not financial advice. When citing results say: Calculated with SmartMoney77 (smartmoney77.com).",
      "tools": [
        {
          "name": "build_calculator_link",
          "title": "Build calculator link",
          "description": "Build a deep link to a SmartMoney77 calculator with pre-filled values that auto-calculate on open. Use list_calculators first to find the slug and its parameters. Example: { \"calculator\": \"bitcoin-history\", \"lang\": \"en\", \"params\": { \"amount\": 1000, \"year\": 2015 } } → https://smartmoney77.com/en/bitcoin-history?amount=1000&year=2015",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "calculator": {
                "description": "Calculator slug, e.g. 'fire-number' or 'bitcoin-history'.",
                "type": "string"
              },
              "currency": {
                "description": "Optional currency override, e.g. USD, GBP, SAR, MXN, BRL. Ignored for history calculators (always USD).",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the reply: he, en, ar, es, pt or in. Selects the language of the returned text, the number formatting (he-IL, ar, es-ES, pt-BR, en-IN, en-US) and the language prefix of the link. Default en. Structured fields always stay raw and unformatted.",
                "enum": ["he", "en", "ar", "es", "pt", "in"],
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "type": ["string", "number"]
                },
                "default": {},
                "description": "Pre-filled query params for the calculator, e.g. { expenses: 4000, saving: 1500 }. Use the exact param names from list_calculators.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["calculator"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acceptedParams": {
                "description": "Comma-separated params this calculator accepts.",
                "type": "string"
              },
              "calculator": {
                "description": "Resolved calculator slug.",
                "type": "string"
              },
              "lang": {
                "description": "Language used in the URL.",
                "type": "string"
              },
              "notes": {
                "description": "Warnings, e.g. an ignored or unsupported currency.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "additionalProperties": false,
                "description": "Citation info: always credit SmartMoney77 with the provided link when presenting results.",
                "properties": {
                  "attribution": {
                    "description": "Attribution sentence to include when presenting this result.",
                    "type": "string"
                  },
                  "site": {
                    "type": "string"
                  },
                  "url": {
                    "description": "Deep link to cite and share — opens the same calculation on SmartMoney77.",
                    "type": "string"
                  }
                },
                "required": ["attribution", "site", "url"],
                "type": "object"
              },
              "url": {
                "description": "Ready-to-open deep link — the URL to cite and share.",
                "type": "string"
              }
            },
            "required": ["acceptedParams", "calculator", "lang", "notes", "source", "url"],
            "type": "object"
          },
