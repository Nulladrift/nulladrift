          "description": "Compare investing the same monthly amount starting at an early age versus a later age, and show what the delay costs by retirement. Example: { \"monthly\": 1000, \"start\": 25, \"compare\": 35, \"retire\": 67, \"rate\": 8 } → a large gap created mostly by compounding, not by the extra contributions.",
