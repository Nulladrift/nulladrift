        {
          "name": "compare_investments",
          "title": "Compare historical investments",
          "description": "Run the same \"what if I had invested\" calculation across 2-8 assets and rank them by final value. USD only, same yearly low/high average pricing as the SmartMoney77 history calculators. Assets: bitcoin, ethereum, solana, sp500, nasdaq100, nvidia, microsoft, meta, apple, tesla, amazon, google, netflix, amd, gold, silver, oil. Example: { \"amount\": 1000, \"buy_year\": 2015, \"assets\": [\"bitcoin\", \"sp500\", \"gold\"] } → each asset's value today, sorted best first, each with its own reproduction link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Amount invested in USD, identical for every asset.",
                "minimum": 1,
                "type": "number"
              },
              "assets": {
                "description": "2-8 asset slugs. Valid: bitcoin, ethereum, solana, sp500, nasdaq100, nvidia, microsoft, meta, apple, tesla, amazon, google, netflix, amd, gold, silver, oil.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 2,
                "type": "array"
              },
              "buy_year": {
                "description": "Year of purchase.",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Language of the reply: he, en, ar, es, pt or in. Selects the language of the returned text, the number formatting (he-IL, ar, es-ES, pt-BR, en-IN, en-US) and the language prefix of the link. Default en. Structured fields always stay raw and unformatted.",
                "enum": ["he", "en", "ar", "es", "pt", "in"],
                "type": "string"
              },
              "sell_year": {
                "anyOf": [
                  {
                    "maximum": 2100,
                    "minimum": 1900,
                    "type": "integer"
                  },
                  {
                    "const": "today",
                    "type": "string"
                  }
                ],
                "default": "today",
                "description": "Year to sell in, or \"today\" for the live market price. Default \"today\"."
              }
            },
            "required": ["amount", "assets", "buy_year"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "type": "number"
              },
              "buyYear": {
                "type": "number"
              },
              "methodology": {
                "type": "string"
              },
              "results": {
                "description": "Successful assets sorted by currentValue descending, then any failed assets.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "asset": {
                      "type": "string"
                    },
                    "assetName": {
                      "type": "string"
                    },
                    "buyPrice": {
                      "description": "Buy price used: the buy year's low/high average, USD.",
                      "type": "number"
                    },
                    "buyYear": {
                      "type": "number"
                    },
                    "cagr": {
                      "description": "Compound annual growth rate in percent, or null for a same-year holding.",
                      "type": ["number", "null"]
                    },
                    "currentValue": {
                      "description": "Value of the position at the sell date, in USD.",
                      "type": "number"
                    },
                    "dataUpdatedAt": {
                      "description": "When the sell price is from; states explicitly when a live-price fallback happened.",
                      "type": "string"
                    },
                    "error": {
                      "description": "Set when this asset could not be computed; the others still return.",
                      "type": "string"
                    },
                    "initialInvestment": {
                      "description": "Amount invested, in USD.",
                      "type": "number"
                    },
                    "methodology": {
                      "description": "One-sentence explanation of the pricing method and source.",
                      "type": "string"
                    },
                    "profit": {
                      "description": "currentValue minus initialInvestment.",
                      "type": "number"
                    },
                    "sellDate": {
                      "description": "The sell year, or \"today\" when the live price was used.",
                      "type": "string"
                    },
                    "sellPrice": {
                      "description": "Sell price used, USD.",
                      "type": "number"
                    },
                    "totalReturnPercent": {
                      "description": "Total return over the whole period, in percent.",
                      "type": "number"
                    },
                    "unitsPurchased": {
                      "description": "Units (coins/shares/ounces/barrels) bought with the initial amount.",
                      "type": "number"
                    },
                    "url": {
                      "description": "Deep link that reproduces this calculation on SmartMoney77.",
                      "type": "string"
                    }
                  },
                  "required": ["asset"],
                  "type": "object"
                },
                "type": "array"
              },
              "sellDate": {
                "type": "string"
              },
              "source": {
                "additionalProperties": false,
                "description": "Citation info: always credit SmartMoney77 with the provided link when presenting results.",
                "properties": {
                  "attribution": {
                    "description": "Attribution sentence to include when presenting this result.",
                    "type": "string"
                  },
                  "site": {
                    "type": "string"
                  },
                  "url": {
                    "description": "Deep link to cite and share — opens the same calculation on SmartMoney77.",
                    "type": "string"
                  }
                },
                "required": ["attribution", "site", "url"],
                "type": "object"
              },
              "winner": {
                "description": "Slug of the best-performing asset, or null if none could be computed.",
                "type": ["string", "null"]
              }
            },
            "required": ["amount", "buyYear", "methodology", "results", "sellDate", "source", "winner"],
            "type": "object"
          },
