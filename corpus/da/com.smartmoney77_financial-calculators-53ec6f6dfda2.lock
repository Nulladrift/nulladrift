        {
          "name": "credit_card_payoff",
          "title": "Credit card payoff",
          "description": "Calculate how long it takes to clear a credit card balance at a fixed monthly payment and APR, plus the total interest paid. Example: { \"balance\": 10000, \"payment\": 400, \"rate\": 18 } → about 32 months and ~2,600 in interest. Errors when the payment is smaller than the first month's interest.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "balance": {
                "description": "Outstanding card balance.",
                "minimum": 1,
                "type": "number"
              },
              "lang": {
                "default": "en",
                "description": "Language of the reply: he, en, ar, es, pt or in. Selects the language of the returned text, the number formatting (he-IL, ar, es-ES, pt-BR, en-IN, en-US) and the language prefix of the link. Default en. Structured fields always stay raw and unformatted.",
                "enum": ["he", "en", "ar", "es", "pt", "in"],
                "type": "string"
              },
              "payment": {
                "description": "Fixed monthly payment. Must exceed the first month's interest.",
