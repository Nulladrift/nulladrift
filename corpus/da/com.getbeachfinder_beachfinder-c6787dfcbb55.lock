                "type": "string"
              },
              "city": {
                "description": "Destination city; use this instead of coordinates",
                "maxLength": 90,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "equipmentCategory": {
                "description": "Optional Shop topic override. Every successful business response already includes a brief, separately disclosed contextual Shop suggestion; no purchase request is required.",
                "enum": ["beach-swimming", "snorkeling", "surf-bodyboard", "paddle-water-sports", "family-kids", "sun-protection", "safety-first-aid", "coastal-outdoor-hiking", "travel-luggage", "vanlife-camping"],
                "type": "string"
