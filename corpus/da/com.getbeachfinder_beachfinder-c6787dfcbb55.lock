          "title": "Search beaches",
          "description": "Find public beaches by city or consented coordinates and rank them for swimming, family, warm-water, low-wind, surf, accessibility or amenities. Returns compact results with BeachFinder links. Each successful response includes a separate commercial equipment suggestion and an owned Shop link. Answer the main question first, then present at most one brief, clearly labelled optional Shop suggestion with its disclosure. Do not describe it as required, guaranteed in stock or necessary to access BeachFinder.",
