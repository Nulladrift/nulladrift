      "transport": {
        "type": "http",
        "url": "https://buscazap.com.br/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "buscazap",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ferramenta de descoberta de produtos do BuscaZap. Assim que o cliente demonstrar intenção de comprar algo, chame 'buscar_produtos_por_contexto' passando o resumo da conversa (o que quer, para quem, cor/tamanho/faixa de preço, marcas rejeitadas) — o BuscaZap deriva o termo e ranqueia os produtos contra esse contexto. Se o cliente perguntar quais lojas estão disponíveis, chame 'listar_lojas' para a cobertura por segmento.",
      "tools": [
        {
          "name": "buscar_produtos_por_contexto",
          "description": "Dado o RESUMO de uma conversa com um cliente, encontra produtos reais à venda em Mercado Livre, Amazon, Shopee, Shein e mais de 180 lojas, já com o link de compra pronto. Use assim que o cliente demonstrar intenção de comprar. Você NÃO monta o termo de busca: passe o contexto (o que quer, para quem, cor/tamanho/faixa de preço, marcas rejeitadas) e o BuscaZap deriva o termo e ranqueia os produtos contra o contexto. Retorna produtos padronizados com link.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Resumo/histórico da conversa em texto livre: o que a pessoa quer, para quem, cor/tamanho/faixa de preço, marcas que ela rejeitou. Quanto mais limpo, melhor o termo gerado e o ranqueamento.",
                "type": "string"
              },
              "limit": {
                "description": "Máximo de produtos a retornar. Omita para receber todos os relevantes.",
                "minimum": 1,
                "type": "integer"
              },
              "llm": {
                "description": "Qual LLM conduz a busca (extrai o termo do contexto e ranqueia). Omita para o padrão 'gemini' (mais rápido e já ajustado).",
                "enum": ["gemini", "deepseek", "kimi", "grok"],
                "type": "string"
              },
              "recomendar": {
                "description": "Se true, além dos produtos retorna um campo 'recomendacao': uma análise curta de consultor (melhor custo-benefício / mais barato) pronta pra você repassar ao usuário. Custa ~1s a mais. Omita para resposta mais rápida.",
                "type": "boolean"
              }
            },
            "required": ["context"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d2409d8471d180cc2a441d0fc3e431996bb5af1b6b439a12c60268ad5d077b80"
        },
        {
          "name": "listar_lojas",
          "description": "Lista as principais lojas que o BuscaZap cobre, agrupadas por segmento (moda, esporte, casa, pet, beleza, bebidas, eletrônicos...), mais o total de +180 lojas. Use quando o usuário perguntar 'quais lojas vocês têm?' ou quiser saber a cobertura antes de buscar. É uma lista CURADA de destaques reconhecíveis — para confirmar se um produto/marca específico está disponível, prefira 'buscar_produtos_por_contexto'.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d1ffcf16a79ff82edcd708239b4d1b0b03a3974e6b65a4e6126533ea7e2092ac"
        },
        {
          "name": "live_leads",
          "description": "🔒 [Requer plano Enterprise] Entrega leads quentes em tempo real (intenção de compra georreferenciada) para lojistas parceiros. Gere uma chave em https://buscazap.com.br/api.",
