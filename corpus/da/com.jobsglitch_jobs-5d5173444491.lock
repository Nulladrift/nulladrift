{
  "lockfileVersion": 2,
  "subjects": {
    "com.jobsglitch/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jobsglitch.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "jobsglitch-jobs",
        "title": "JobsGlitch Jobs",
        "version": "1.1.0",
        "websiteUrl": "https://jobsglitch.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search and read over a million live jobs that JobsGlitch indexes straight from employers' own hiring systems. Every tool only reads, and no key is needed: without one, each address gets 30 tool calls a minute, 500 a day and up to 20 jobs a call. A free API key from https://jobsglitch.com/developer, sent as `Authorization: Bearer <key>`, removes the daily cap and returns up to 50 jobs a call.",
      "tools": [
        {
          "name": "find_similar_jobs",
          "title": "Find similar jobs",
          "description": "Returns up to 50 live jobs most like a given job, in the same format as search_jobs. Use it when someone likes a job and wants more options like it, or when a job is close but not quite right.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "Source job id (from search_jobs results)",
                "type": "string"
              },
              "k": {
                "default": 10,
                "description": "Number of similar jobs to return (max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locations": {
                "description": "Optionally limit similar jobs to these locations",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find similar jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:019b86c00048db641dabf466e5bef1da40f7b22171a88258fa0813c6893a710d"
        },
        {
          "name": "get_job_details",
          "title": "Get job details",
          "description": "Returns the full record of one job by its id: the complete description, responsibilities, qualifications, every listed skill, salary when listed, and the apply link on the employer's own career page. Use it after search_jobs when someone wants to know more about a specific listing.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "The job id returned by search_jobs",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get job details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ebcd8876105fcf5a53af6543edeaa52c756ff6de290793805c28b49dbed579ee"
        },
        {
          "name": "get_market_stats",
          "title": "Get job market stats",
          "description": "Returns job market counts from live listings, for one role or skill or for the whole index: total open jobs, remote jobs, jobs that list a salary, the top 10 hiring locations, the top 10 job categories, and how many jobs fall in each salary band. Use it when someone asks where a role is hiring, how much demand there is, or what a role typically pays.",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "Optional role or skill to narrow the stats, e.g. 'data engineer'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get job market stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:817ed9039401cc7e25d44e58e32579a7b0e1f4a21fbdd6e62a48cde3e466e6b0"
        },
        {
          "name": "get_platform_stats",
          "title": "Get JobsGlitch coverage",
          "description": "Returns what the JobsGlitch index covers: total live jobs, remote jobs, jobs that list a salary, top categories and locations, and the hiring systems jobs are collected from. Use it when someone asks how big or how fresh the job data is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get JobsGlitch coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b591960265c14e0712e545a2d2b47b2d4fdb815d030e2be0e50ce72c5b5b0499"
        },
        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search over a million live jobs that JobsGlitch indexes straight from employers' own hiring systems (Greenhouse, Lever, Workday, Ashby and others). Returns the number of matching jobs and up to 50 of them, each with its id, title, company, location, employment type, seniority, salary when listed, skills, a short summary, days since posting, and the apply link on the employer's own career page. Use it when someone asks about openings, wants jobs that fit a profile or skill set, or asks who is hiring at a company.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 90,
                "description": "Only jobs posted within this many days (max 365)",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "employment_type": {
                "description": "Filter by employment type",
                "enum": ["FULL_TIME", "PART_TIME", "CONTRACT", "INTERNSHIP"],
                "type": "string"
              },
              "expanded_skills": {
                "description": "Comma-separated skills used only to boost relevance ranking, not to filter — safe to pass a long list here (e.g. a full resume skill set) without risking zero results.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of results (max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locations": {
                "description": "Comma-separated locations, e.g. 'London,Remote'",
                "type": "string"
              },
              "max_salary": {
                "description": "Maximum annual salary in USD",
                "type": "integer"
              },
              "min_salary": {
                "description": "Minimum annual salary in USD",
                "type": "integer"
              },
              "q": {
                "description": "Search query in plain words, e.g. 'senior ML engineer fintech'",
                "type": "string"
              },
              "remote_friendly": {
                "description": "True to show only remote-friendly positions",
                "type": "boolean"
              },
              "seniority_level": {
                "description": "Filter by seniority level",
                "enum": ["intern", "junior", "mid", "senior", "lead", "director", "executive"],
                "type": "string"
              },
              "skills": {
                "description": "Comma-separated REQUIRED skills, e.g. 'python,pytorch,aws' — applied as a strict filter. Keep this short (1-4 skills); a long list can filter results to zero since every skill must match. For a broader or exploratory skill list, use expanded_skills instead, which only affects ranking.",
                "type": "string"
              },
              "sort_by": {
                "default": "relevance",
                "enum": ["relevance", "date"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91e7193f7d7bc04d7e1411a944649e93a54f4b6a16def4cd77a874266e70aaf1"
        }
      ],
      "digest": "sha256:8e0aeb92ad1b3fc282a5256ac21220c876afbf2cb1c80bb815f20ac88ea3e922"
    }
  }
}
