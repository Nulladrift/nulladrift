{
  "lockfileVersion": 2,
  "subjects": {
    "cards.octagon/ufc-cards": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.octagon.cards/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Octagon Cards",
        "version": "0.1.2",
        "websiteUrl": "https://octagon.cards/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Find the exact UFC card version before interpreting prices. Ask for missing identifying details. Separate saved estimates, exact-card sales and related comparisons. State dates, coverage limits and material differences. Do not invent missing prices, grading companies or confidence. Public catalogue reads only. Photo uploads and private collections are not supported. Results link to the Octagon card page and known sale sources.",
      "tools": [
        {
          "name": "get_ufc_card_comparables",
          "title": "Read comparable UFC card sales",
          "description": "Read up to eight selected comparable sales for an identified UFC card version, including match reasons and differences. Comparisons may include other parallels, releases or fighters. Related editions are not exact-card sales. Returns partial and unavailable status when applicable.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cardId": {
                "description": "The exact version's cardId returned by search_ufc_cards.",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cardId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read comparable UFC card sales"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:b906f40efdb3171a59fe0fca495750051735ac4b4c847bfd04cd53df24defe2a"
        },
        {
          "name": "get_ufc_card_evidence",
          "title": "Read a UFC card's estimate and sales",
          "description": "Read the saved estimate and recent recorded sales for one exact UFC card version identified by its catalogue cardId. Prices are USD. The estimate pools raw and graded sales and is not a physical-copy or grader-specific appraisal. Returns dates, known sale sources, a history truncation flag and an Octagon link. Missing estimates remain missing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cardId": {
                "description": "The exact version's cardId returned by search_ufc_cards.",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              },
              "salesLimit": {
                "default": 10,
                "description": "Maximum recent exact-card sales, newest first. This is not a complete market history.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cardId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a UFC card's estimate and sales"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:2a19f1ddb0ad810d5dbe390efac6d30a475fdc0ea0f55e63415704267bf5d04e"
        },
        {
          "name": "search_ufc_cards",
          "title": "Find a UFC card",
          "description": "Search Octagon's UFC catalogue by fighter, year, release, card number, parallel or print run. Returns matching edition IDs and links for card identification before a value lookup. A query can match several editions. Does not identify uploaded photos or search other sports.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum card identities. Each includes up to eight matching versions.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Collector search terms, for example '2025 Topps Chrome Marina Rodriguez 145 gold /50'.",
                "maxLength": 256,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a UFC card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:debc0be6a6a6c132c381c45d47a098610d35cbbc6ba5b9b3a6bc1a7dd7402c20"
        }
      ],
      "digest": "sha256:9bf5dbd0e7594e91dba440c853048fd38dcb8bb342268b4e5181ddfd2ea95608"
    }
  }
