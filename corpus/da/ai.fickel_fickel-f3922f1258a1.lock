      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "FICKEL",
        "title": "FICKEL",
        "version": "1.0.1",
        "websiteUrl": "https://fickel.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FICKEL is the custom promotional products app from FickelUSA, serving buyers nationwide across the U.S.: logo apparel, corporate team wear and branded merchandise for companies, HR teams, universities, healthcare, hospitality, manufacturing, tech teams and sponsored events. Use search_catalog and get_product to explore products. For most products that are not apparel or headwear, send the buyer to buy_url (the product’s own fickelusa.com page, the same link as the FICKELUSA.COM label in the FICKEL app) and have them complete the purchase there. FICKEL never takes payment. Apparel, headwear, and garments (tees, shirts, hoodies, sweatshirts, polos, jackets, hats, caps, beanies, bandanas, and other clothing) and screen-printed products need artwork review, so use request_quote (start an order) instead of buy_url for those items. request_quote is also available for custom or large orders. Most items start around 100 pieces, and requests sent through this tool start at 100 pieces. Only start an order request when the person you are helping asks for one and gives their own contact details. Prices are not listed through these tools: never state or estimate a price for apparel, caps or hats. Never promise a delivery, in-hand or event date or a rush order; production time is confirmed with the quote and proof. Every product has a plain web page at page_url that you can share with the person you are helping. Full product list: https://fickel.ai/llms-full.txt. FAQ: https://fickel.ai/faq.",
      "tools": [
        {
          "name": "buy_now",
          "title": "Get the Buy Now link for a FICKEL product",
          "description": "Get the steps to buy a product. For most products that are not apparel or headwear this returns buy_url, the exact fickelusa.com product page (the same link as the FICKELUSA.COM label in the FICKEL app). The buyer completes the purchase on that page. FICKEL does not take payment. If the product is apparel, headwear, or screen printed, buy_url is omitted and the steps point to request_quote so the artwork can be reviewed (most items start around 100 pieces).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product_id": {
                "description": "Product id from search_catalog (16 characters).",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the Buy Now link for a FICKEL product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c51d14bf62352c2bd2d50383048038b751e50150840072d72481afe7767665ed"
        },
        {
          "name": "get_product",
          "title": "Get a FICKEL product",
          "description": "Get one FickelUSA product by id: name, category, image (hero), images (full gallery), imageAlts, page_url, description, details, available colors and sizes, decoration methods, and how to buy. Most products that are not apparel or headwear include buy_url (the fickelusa.com page where the buyer completes the purchase). Apparel, headwear, and screen-printed products use request_quote instead, because the artwork is reviewed through a quote (most items start around 100 pieces). request_quote remains available for custom or large orders. FICKEL does not take payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id from search_catalog (16 characters).",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a FICKEL product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc458d6a1379a0266a7040ccb631195c058f69b0fd884bb6d6682f654ea30be6"
        },
        {
          "name": "request_quote",
          "title": "Start an order with FickelUSA",
          "description": "Start an order with the FickelUSA team for apparel, headwear, or a screen-printed product (artwork review) or for a custom or large order. Requests sent through this tool start at 100 pieces; most items start around 100 pieces. This only creates a pending request for the team to review: no order is confirmed, no payment is taken and nothing ships. Returns a reference number; FickelUSA confirms the details and pricing by email. For most products that are not apparel, headwear, or screen printed, use buy_now instead and have the buyer complete the purchase on the fickelusa.com page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company or organization name.",
                "maxLength": 120,
                "type": "string"
              },
              "contact_name": {
                "description": "Full name of the person starting the order.",
                "maxLength": 100,
                "type": "string"
              },
              "email": {
                "description": "Email address where FickelUSA should send the quote.",
                "maxLength": 254,
                "type": "string"
              },
              "imprint_notes": {
                "description": "Optional logo or imprint notes, e.g. \"1-color logo on left chest\".",
                "maxLength": 500,
                "type": "string"
              },
              "needed_by": {
                "description": "Optional date the buyer would like the items, YYYY-MM-DD. This is a request only: FickelUSA confirms timing with the quote and does not guarantee dates.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "notes": {
                "description": "Optional notes, e.g. sizes or colors. Links are removed.",
                "maxLength": 1000,
                "type": "string"
              },
              "product_id": {
                "description": "Product id from search_catalog.",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              },
              "quantity": {
                "description": "Number of pieces (100 or more for requests sent through this tool).",
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["company", "contact_name", "email", "product_id", "quantity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start an order with FickelUSA"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d44e3b91fed79e9fc65a70a1c2cf2f78bcfc2074152612dfc82d2d4babcc425a"
        },
        {
          "name": "search_catalog",
          "title": "Search the FICKEL catalog",
          "description": "Search FickelUSA custom promotional products (logo apparel, drinkware, bags, hats, pens and more). Plain words and natural requests both work (e.g. \"travel mug\", \"embroidered polo\", \"gifts for employees\", \"trade show giveaways\"). Returns up to 10 products with id, name, category, image, page_url (a plain product page to share), and — for most items that are not apparel or headwear — buy_url, the exact fickelusa.com product page where the buyer completes the purchase. FICKEL does not take payment. Apparel, headwear, and screen-printed products omit buy_url and use request_quote because the artwork is reviewed through a quote (most items start around 100 pieces). Use the id with get_product, buy_now, or request_quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many results to return (1 to 10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"travel mug\", \"embroidered polo\", \"tote bag\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the FICKEL catalog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8bd06a4d2eb34486216dec0ac3d27d6e93be231e0808616d28b65ee8eb2168d9"
        }
      ],
      "digest": "sha256:7e0a8f1429eec8eff1279c96dfbd026e743c2f8d9ff5ecf0deb477c3cd0f4794"
    }
  }
