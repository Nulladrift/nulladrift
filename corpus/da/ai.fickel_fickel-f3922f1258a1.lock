{
  "lockfileVersion": 2,
  "subjects": {
    "ai.fickel/fickel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fickel.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "FICKEL",
        "title": "FICKEL",
        "version": "1.0.0",
        "websiteUrl": "https://fickel.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FICKEL is the custom promotional products app from FickelUSA in Holland, Michigan: logo apparel, corporate team wear and branded merchandise for businesses, schools and teams. Use search_catalog and get_product to explore products, and request_quote to send a quote request to the FickelUSA team. The minimum order is 100 pieces. A quote request is not an order: no payment is taken, nothing is confirmed or shipped automatically, and FickelUSA follows up by email. Only send a quote request when the person you are helping asks for one and gives their own contact details. Prices are not listed; the quote reply includes pricing.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get a FICKEL product",
          "description": "Get one FickelUSA product by id: name, category, image, product page link and how to order (minimum 100 pieces, quote by email).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id from search_catalog (16 characters).",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a FICKEL product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:861dbc71a22ae2338631a5f69dbb6ee092e419ff02cb20ad31864c7a14d7d061"
        },
        {
          "name": "request_quote",
          "title": "Request a quote from FickelUSA",
          "description": "Send a quote request for a product to the FickelUSA team on behalf of the person you are helping. Minimum order is 100 pieces. This only creates a pending request: no order is placed, no payment is taken and nothing ships. Returns a reference number; FickelUSA follows up by email with pricing and next steps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company, school or organization name.",
                "maxLength": 120,
                "type": "string"
              },
              "contact_name": {
                "description": "Full name of the person requesting the quote.",
                "maxLength": 100,
                "type": "string"
              },
              "email": {
                "description": "Email address where FickelUSA should send the quote.",
                "maxLength": 254,
                "type": "string"
              },
              "imprint_notes": {
                "description": "Optional logo or imprint notes, e.g. \"1-color logo on left chest\".",
                "maxLength": 500,
                "type": "string"
              },
              "needed_by": {
                "description": "Optional date the items are needed, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "notes": {
                "description": "Optional notes, e.g. sizes or colors. Links are removed.",
                "maxLength": 1000,
                "type": "string"
              },
              "product_id": {
                "description": "Product id from search_catalog.",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              },
              "quantity": {
                "description": "Number of pieces (minimum 100).",
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["company", "contact_name", "email", "product_id", "quantity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a quote from FickelUSA"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:24d7eb660867f5fc840f7f86c6a3037dd76b7c3d43cc697f662452436809bc1d"
        },
        {
          "name": "search_catalog",
          "title": "Search the FICKEL catalog",
          "description": "Search FickelUSA custom promotional products (logo apparel, drinkware, bags, hats, pens and more). Returns up to 10 products with id, name, category, image and product page link. Use the id with get_product or request_quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many results to return (1 to 10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"travel mug\", \"embroidered polo\", \"tote bag\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the FICKEL catalog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f337382d4014ea1a5c38682d11487e00341105baaec02194e067216db35cad74"
        }
      ],
      "digest": "sha256:abfa4dcf9e0fcee778927653358cd1c17cddb8c55151c9852ee6ff0fa75beed5"
    }
  }
}
