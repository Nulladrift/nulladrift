{
  "lockfileVersion": 2,
  "subjects": {
    "ai.fickel/fickel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fickel.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "FICKEL",
        "title": "FICKEL",
        "version": "1.0.0",
        "websiteUrl": "https://fickel.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FICKEL is the custom promotional products app from FickelUSA in Holland, Michigan: logo apparel, corporate team wear and branded merchandise for businesses, schools and teams. Use search_catalog and get_product to explore products. For most products, send the buyer to buy_url (the product’s own fickelusa.com page, the same link as the FICKELUSA.COM label in the FICKEL app) and have them complete the purchase there. FICKEL never takes payment. Screen-printed products need artwork review, so use request_quote instead of buy_url for those items. request_quote is also available for custom or large orders (minimum 100 pieces). Only send a quote request when the person you are helping asks for one and gives their own contact details. Prices are not listed through these tools.",
      "tools": [
        {
          "name": "buy_now",
          "title": "Get the Buy Now link for a FICKEL product",
          "description": "Get the steps to buy a product. For most products this returns buy_url, the exact fickelusa.com product page (the same link as the FICKELUSA.COM label in the FICKEL app). The buyer completes the purchase on that page. FICKEL does not take payment. If the product is screen printed, buy_url is omitted and the steps point to request_quote so the artwork can be reviewed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product_id": {
                "description": "Product id from search_catalog (16 characters).",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the Buy Now link for a FICKEL product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed5e8f7773b8d0c2c3b64c9c1546ba8a1af553f0aa7bc78b35eba65613b6043d"
        },
        {
          "name": "get_product",
          "title": "Get a FICKEL product",
          "description": "Get one FickelUSA product by id: name, category, image, and how to buy. Most products include buy_url (the fickelusa.com page where the buyer completes the purchase). Screen-printed products use request_quote instead, because the artwork is reviewed. request_quote remains available for custom or large orders (minimum 100 pieces). FICKEL does not take payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id from search_catalog (16 characters).",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a FICKEL product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1087d367304fa39f52b48734a40469691bb5cecc768e95544a0964e34d3eea12"
        },
        {
          "name": "request_quote",
          "title": "Request a quote from FickelUSA",
          "description": "Send a quote request to the FickelUSA team for a screen-printed product (artwork review) or for a custom or large order. Minimum order is 100 pieces. This only creates a pending request: no order is placed, no payment is taken and nothing ships. Returns a reference number; FickelUSA follows up by email. For most other products, use buy_now instead and have the buyer complete the purchase on the fickelusa.com page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company, school or organization name.",
                "maxLength": 120,
                "type": "string"
              },
              "contact_name": {
                "description": "Full name of the person requesting the quote.",
                "maxLength": 100,
                "type": "string"
              },
              "email": {
                "description": "Email address where FickelUSA should send the quote.",
                "maxLength": 254,
                "type": "string"
              },
              "imprint_notes": {
                "description": "Optional logo or imprint notes, e.g. \"1-color logo on left chest\".",
                "maxLength": 500,
                "type": "string"
              },
              "needed_by": {
                "description": "Optional date the items are needed, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "notes": {
                "description": "Optional notes, e.g. sizes or colors. Links are removed.",
                "maxLength": 1000,
                "type": "string"
              },
              "product_id": {
                "description": "Product id from search_catalog.",
                "pattern": "^[0-9a-f]{16}$",
                "type": "string"
              },
              "quantity": {
                "description": "Number of pieces (minimum 100).",
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["company", "contact_name", "email", "product_id", "quantity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a quote from FickelUSA"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8a4f585816b4846119b50d4a8a5f6ce129699e1e28c296f54b1b1d985ec87304"
        },
        {
          "name": "search_catalog",
          "title": "Search the FICKEL catalog",
          "description": "Search FickelUSA custom promotional products (logo apparel, drinkware, bags, hats, pens and more). Returns up to 10 products with id, name, category, image, and — for most items — buy_url, the exact fickelusa.com product page where the buyer completes the purchase. FICKEL does not take payment. Screen-printed products omit buy_url and use request_quote because of the artwork. Use the id with get_product, buy_now, or request_quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many results to return (1 to 10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"travel mug\", \"embroidered polo\", \"tote bag\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the FICKEL catalog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ea478b9bd77d559b0206c1530a942c917f9297f41c90da4e274d75891205e55"
        }
      ],
      "digest": "sha256:55d83ecac35e29e088e71c26461bba5c07957e575d701cd161e18900ef6f6a69"
    }
  }
