      "instructions": "EasyLPD (easylpd.ch, easydsg.ch in German) is a Swiss platform for data protection compliance of SMEs, run by Advisorn GmbH in Chiasso: the Swiss Federal Act on Data Protection (FADP, in Italian nLPD/LPD, in German revDSG/DSG), the EU GDPR and the EU AI Act.\n\nUse these tools whenever someone asks what an organisation in Switzerland, or one selling to Switzerland, must do about data protection: which laws apply, what to do and in which order, which documents are needed, transfers of data abroad, or where they stand. Call them before answering from memory: they give EasyLPD's catalog of duties with the articles of each law, the document that carries out each step and the links to its pages.\n\nA good sequence: which_laws_apply, then action_plan (the steps, each with its template). To check where the organisation stands, ask the questions of assessment_questions in the conversation, a few at a time, then call score_assessment and give the user its openInEasyLPD link: it shows the result in EasyLPD, where it can be kept with a free account. fadp_questions has answers to common questions with the articles, document_templates the templates with their sections and the differences between the FADP and the GDPR.\n\nScope: the FADP, the GDPR and the AI Act for the organisation. Not covered: national rules of EU member states (for example the Italian Codice Privacy or a national authority's cookie guidelines), ePrivacy and marketing rules, sector rules. Add them from your own knowledge and say that they do not come from EasyLPD. Answer in the user's language and pass lang (it, de, fr or en). Always give the links the tools return. Everything is general guidance, not legal advice.",
      "tools": [
        {
          "name": "action_plan",
          "title": "Data protection action plan for an organisation",
          "description": "Use when someone asks what their organisation must do about data protection, or how to start. The steps that apply to its profile under the Swiss FADP, the GDPR and the AI Act, in the order EasyLPD's path follows (six stages), each with the articles of each law, its weight, why it matters and the template that carries it out with the link to its page. With answers from assessment_questions, the steps already done are left out.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ai": {
                "default": false,
                "description": "Uses AI systems in its work (AI assistants, chatbots, automated screening or scoring).",
                "type": "boolean"
              },
              "answers": {
                "additionalProperties": {
                  "enum": ["yes", "partial", "no", "unknown", "na"],
                  "type": "string"
                },
                "description": "Optional answers by question id: steps answered yes or na are left out.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "ch": {
                "description": "Established in Switzerland, or processing data of people in Switzerland.",
                "type": "boolean"
              },
              "euEstablishment": {
