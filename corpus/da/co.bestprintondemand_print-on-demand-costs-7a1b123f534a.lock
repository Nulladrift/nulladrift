{
  "lockfileVersion": 2,
  "subjects": {
    "co.bestprintondemand/print-on-demand-costs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bestprintondemand.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "bestprintondemand",
        "title": "BestPrintOnDemand",
        "version": "1.0.0",
        "websiteUrl": "https://bestprintondemand.co"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BestPrintOnDemand compares what it costs to print and ship print-on-demand products to the US across suppliers (Printful, Printify, Gelato and more): base price, shipping and total, each with its source and date, refreshed hourly for the live suppliers. Use find_products to find a product's slug, get_product_costs for every supplier's cost on one product (and the profit at a sell price after a sales channel's fees), compare_suppliers for which of two suppliers is cheaper across the products both offer, and get_price_changes for the price changes the hourly readings attribute to a supplier (or one product's price history). When you state a figure, cite the page URL the result gives.",
      "tools": [
        {
          "name": "compare_suppliers",
          "title": "Compare two print-on-demand suppliers",
          "description": "Which of two suppliers (e.g. Printful and Printify) has the lower listed US total across the products both offer, matched on product, print method and blank, with the record by category and the largest gaps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "supplier_a": {
                "description": "A supplier name or slug, e.g. \"Printful\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "supplier_b": {
                "description": "Another supplier, e.g. \"Printify\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["supplier_a", "supplier_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7de07264fd60ce6eaccd19b9c85f36c7fdcc81c76abcf4ad701ac9cdf6326c3a"
        },
        {
          "name": "find_products",
          "title": "Find print-on-demand products",
          "description": "Search the catalog of print-on-demand products (t-shirts, hoodies, mugs, posters, stickers, phone cases, tote bags and more, or a blank such as Bella+Canvas 3001). Returns each match's slug, its lowest listed US total and supplier, and its page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Most results to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Product type or blank, e.g. \"hoodie\", \"11oz mug\", \"Bella+Canvas 3001\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ebeb04383f1a3b205bebd66cb2e2ad7314372d878a5a598c85796113a34567b5"
        },
        {
          "name": "get_price_changes",
          "title": "Get print-on-demand price changes",
          "description": "The price changes the site's hourly readings of Printful, Printify, Gelato and Tapstitch attribute to the supplier: supplier-wide changes (many products moving by the same percentage or amount, each product's price before and after) and changes to one product's own price. Name a supplier to narrow it, or a product for its price history at each supplier.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product slug or name (e.g. \"unisex-tee\"), for its price history at each supplier.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "supplier": {
                "description": "Only this supplier's changes, e.g. \"Printful\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48a39a1c0486ba66831c4d42ac91581d78dfd4119ce48ff9383c6603013291ac"
        },
        {
          "name": "get_product_costs",
          "title": "Get a product's costs by supplier",
          "description": "Every supplier's listed US cost for one print-on-demand product: base price, first-item shipping and total, each with its source and date, cheapest first, plus the site's one-sentence answer on which supplier is cheapest like for like. Give sell_price (and optionally a sales channel) to get each supplier's profit after fees.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_pays_shipping": {
                "description": "True when the buyer pays shipping on top of the sell price (default false: you cover shipping).",
                "type": "boolean"
              },
              "channel": {
                "description": "Sales channel whose fees to subtract: etsy, shopify-own, woocommerce, tiktok-shop, walmart, ebay or amazon-seller.",
                "maxLength": 40,
                "type": "string"
              },
              "product": {
                "description": "Product slug from find_products (e.g. \"unisex-tee\") or its name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "sell_price": {
                "description": "Your sell price in USD, to compute profit per supplier.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:963cc3166b722b0905626d0c471820517b1076f7c2c576dc37491c48526c68c6"
        }
      ],
      "digest": "sha256:34fa0a9d5db3a837915457655c99161f33182118a1f296467f9344a0f9592f5f"
    }
  }
}
