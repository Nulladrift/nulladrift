        {
          "name": "cancel_compel",
          "description": "Cancel an in-progress compel. Dequeues it if still queued, otherwise cancels any active external (AI provider) tasks and transitions it to CANCELLED. Idempotent - cancelling an already-CANCELLED compel succeeds. Use to stop a mis-prompted or runaway job before it consumes more render minutes.",
          "inputSchema": {
            "properties": {
              "compel_id": {
                "description": "The compel ID to cancel",
                "type": "integer"
              }
            },
            "required": ["compel_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel a compel"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:76f06da3a0129cac88e482f9788dc14ab7e95a057ed33dee03b14b38447ee146"
        },
        {
          "name": "create_compel",
          "description": "Create a Compeller generation job from primary audio media and optional reference media. Returns compel id, status, and links to track progress and retrieve renderings.",
          "inputSchema": {
            "properties": {
              "artist_context": {
                "description": "Additional creative context about the artist or song",
                "type": "string"
              },
              "aspect_ratio": {
                "description": "Explicit aspect ratio override (takes precedence over target_platform).",
                "enum": ["16:9", "9:16", "1:1"],
                "type": "string"
              },
              "primary_media_id": {
                "description": "ID of the uploaded audio media to use as the primary track",
                "type": "integer"
              },
              "style": {
                "description": "Visual style. Use one of the exact ids returned by list_styles (e.g. \"Cinematic Realistic\", \"Anime / Manga\"). Omit to use the account default.",
                "enum": ["Cinematic Realistic", "Photo Realistic", "Cyberpunk", "Anime / Manga", "Film Noir", "Watercolor Painting", "Oil Painting", "3D Render / Pixar", "Retro 80s Synthwave", "Vintage Film Grain", "Comic Book / Pop Art", "Fantasy / Ethereal", "Horror / Dark Gothic", "Steampunk", "Neon Glow", "Minimalist / Abstract", "Surrealist", "Documentary", "Vaporwave", "Pencil Sketch", "Noir Detective", "Claymation / Stop Motion", "Studio Ghibli", "Baroque / Renaissance", "Lo-Fi / Grainy VHS", "Glitch Art / Digital", "Psychedelic"],
                "type": "string"
              },
              "target_platform": {
                "description": "Target platform; sets the aspect ratio when aspect_ratio is omitted.",
                "enum": ["tiktok", "reels", "shorts", "instagram", "square", "youtube", "web"],
                "type": "string"
              },
              "title": {
                "description": "Title for the compel",
                "type": "string"
              }
            },
            "required": ["primary_media_id", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create Compel from uploaded audio"
