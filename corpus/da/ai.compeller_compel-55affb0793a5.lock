        {
          "name": "launch_lighting_cue",
          "description": "Launch a starter lighting effect onto a stage as a live cue (e.g. \"gobo-cycle on the stage's 7R beams at speed 0.5\"). Pass effect_id (from list_lighting_effects) and optional variables to override effect defaults. Validation is loud: an unknown effect, a launch_contract whose bindings a stage cannot render, or a missing required field is rejected. Returns the active cue including its launch_id, resolved variables, and launch_contract for REACT. REACT executes the cue per-frame; the live strobe slider stays authoritative and is never raised by a launch.",
          "inputSchema": {
            "properties": {
              "effect_id": {
                "description": "COM-497 starter effect id from list_lighting_effects, e.g. \"gobo-cycle\"",
                "type": "string"
              },
              "launch_contract": {
                "description": "Advanced: an explicit launch_contract to launch instead of resolving one from effect_id.",
                "type": "object"
              },
              "stage_id": {
                "description": "The stage to launch onto (must belong to the authenticated account)",
                "type": "integer"
              },
              "variables": {
                "description": "Optional variable overrides (name -> value), e.g. {\"speed\": 0.5}. Defaults come from the effect.",
                "type": "object"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Launch lighting cue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
