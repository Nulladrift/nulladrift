        {
          "name": "register_webhook",
          "description": "Register an HTTPS endpoint to receive signed push notifications for compel lifecycle events (compel.ready when renderable, compel.completed, compel.failed). Returns webhook_id and the HMAC-SHA256 signing secret exactly once - store the secret immediately, it is never returned again. Deliveries are signed via X-Compeller-Signature: sha256=<hex> over the raw body. Delivery is at-least-once: a failed delivery is retried with backoff (up to 6 attempts) and every retry carries the same X-Compeller-Event-Id, so dedupe on it.",
          "inputSchema": {
            "properties": {
              "events": {
                "description": "Event types to subscribe to. Omit or pass [\"*\"] for all. Known types: compel.ready (renderable - call start_render), compel.completed, compel.failed.",
                "items": {
                  "enum": ["*", "compel.ready", "compel.completed", "compel.failed"],
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "HTTPS URL to deliver events to (max 2048 chars)",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Register webhook"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f17195ad0ee9593efeab4a3049094ca55a3b26c85b1c5ef0df5642a8ae21c555"
        },
