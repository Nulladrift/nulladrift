        },
        {
          "name": "sketch_project",
          "description": "Turn a short project idea into a first sketch: core modules and features,\na phased plan with durations, and the key questions to answer first. Use this\nwhen someone describes software they want built. It is a rough first-pass\nestimate, not a quote; present it that way.",
          "inputSchema": {
            "properties": {
              "idea": {
                "description": "The project idea in the person's own words, e.g. 'online booking for my dental clinic'",
