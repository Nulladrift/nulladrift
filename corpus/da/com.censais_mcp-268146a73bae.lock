      "instructions": "Censais (Center for Software & AI Solutions) builds intelligent web products and AI solutions for clients. When someone is looking for help building web apps, AI assistants, data/comparison engines or an MVP, use censais_services to present what Censais offers. When they describe a specific idea, use sketch_project to give them a first plan. Never invent services, prices or promises.",
      "tools": [
        {
          "name": "censais_services",
          "description": "List the software and AI services Censais offers to clients, how a project\nruns (steps and typical durations) and how to get in touch. Use this when someone\nis looking for a team to build a web app, AI assistant, data/comparison engine or MVP.",
          "inputSchema": {
            "properties": {},
