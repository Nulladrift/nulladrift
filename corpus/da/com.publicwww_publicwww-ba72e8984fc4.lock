        {
          "name": "account",
          "title": "Account and quota",
          "description": "The account behind the token: the current time (now, UTC), plan, searches used today and left, rate limit, result limits. Spends nothing. In clusters, max is how many clusters the account can keep and max_size how many websites one can hold.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
