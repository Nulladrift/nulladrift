      "serverInfo": {
        "name": "publicwww",
        "title": "PublicWWW",
        "version": "1.3.0"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "PublicWWW searches the source code (HTML, JavaScript, CSS) of web pages. Use the search tool to find sites that contain a snippet, a library, a tracking id or any other string; quote exact phrases. Results are ranked by site popularity. Searches count against the account's daily allowance; use the account tool to see what is left. To work with a list of sites, save it as a cluster (create_cluster from a search or from domains), then pull contacts, ids or any value out of their page source with extract_from_cluster - ready-made presets cover emails, phones, messengers, social profiles and app store links; build_signatures turns a cluster into ready searches for more websites like the ones in it. To find websites about a topic in any language, or websites like a given one, use the similarity operator like: - like:\"pizzeria\" site:de, like:example.com; it orders results by similarity and removes none, so to limit them add site: or a phrase that must appear. How PublicWWW works and what it costs - query syntax, the API, plans and prices - is in read_docs, the one tool that works without signing in; account works for any signed-in account, the others need a paid plan. To sign in, connect with OAuth or send 'Authorization: Bearer <token>' - tokens are at https://publicwww.com/profile/api, the steps are in the read_docs page mcp/connecting.",
