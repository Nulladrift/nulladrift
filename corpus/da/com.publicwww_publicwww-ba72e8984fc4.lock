        },
        {
          "name": "build_signatures",
          "title": "Build signatures of a cluster",
          "description": "Find signatures that lead to more websites like the ones in a cluster: their common platform, theme, plugin, tracker, network or owner. Each result is a ready search - pass its search (the query in double quotes) to the search tool to find more such websites. Best on a cluster made by one search or of one network; a mixed cluster may give none. Sorted best first; take the one with the highest in_cluster - how many of the websites looked at have the code (coverage: \"4 of 5\", in_all: every one of them), websites - rough count in the whole index (null when rarer than websites_max; the search gives the exact number), technology - its name when the code belongs to a technology we know. Spends nothing.",
          "inputSchema": {
            "properties": {
              "cluster": {
                "description": "Cluster id, from list_clusters or create_cluster.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cluster"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build signatures of a cluster"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d1c4f409d7917ac47c9ead408a92c3be4e319573995279b076c37b0ec0f507c"
        },
        {
          "name": "combine_clusters",
          "title": "Combine clusters",
          "description": "A new cluster from existing ones: 'and' - domains in every cluster, 'or' - in any of them, 'diff' - the first cluster minus the second (exactly two, order matters): clusters [7, 3] keeps the domains of 7 that are not in 3. Spends nothing.",
          "inputSchema": {
            "properties": {
              "clusters": {
                "description": "Cluster ids; for diff, [from, minus].",
                "items": {
                  "type": "integer"
                },
                "minItems": 2,
                "type": "array"
              },
              "name": {
                "type": "string"
              },
              "operation": {
                "enum": ["and", "or", "diff"],
                "type": "string"
              }
            },
            "required": ["clusters", "operation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Combine clusters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
