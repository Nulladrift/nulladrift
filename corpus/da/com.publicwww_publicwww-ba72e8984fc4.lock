        {
          "name": "create_cluster",
          "title": "Create a cluster",
          "description": "Save a list of websites as a cluster, to extract data from them or combine with other clusters. From a search: pass 'query' (PublicWWW syntax, as in the search tool) - the cluster takes the results up to the plan's limit, and it costs one search. With like: that is the plan's maximum, so pass limit. From a list: pass 'domains' - names or urls; only sites in the index are kept (a www. name missing from the index is looked up without the www), nothing is spent; if none is in the index, no cluster is created. 'dropped' in the answer counts what was left out: not_a_domain, duplicate, not_in_index, over_limit. The plan caps the size of a cluster. To keep only some of a cluster's sites, make a new one from those domains: it costs nothing.",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "Domains (or urls) to put into the cluster. Use either this or query.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "With query: take only the first N websites, in the search's own order (popularity, or similarity for like:). By default - up to the plan's limit. With depth: several pages of one website make one domain, and N counts domains.",
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Optional name; by default the query, or 'Upload'.",
                "type": "string"
              },
              "query": {
                "description": "Search whose results become the cluster, e.g. \"googletagmanager.com/gtm.js\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a cluster"
