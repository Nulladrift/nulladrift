        {
          "name": "extract_from_cluster",
          "title": "Extract data from a cluster",
          "description": "Pull values out of the page source of every website in a cluster: contacts, social profiles, analytics and tag ids, anything a regular expression can match. Easiest: name ready-made presets - email (email addresses from mailto: links), phone (phone numbers from tel: links and schema.org telephone), whatsapp (WhatsApp numbers (wa.me and click-to-chat links)), telegram (Telegram usernames (t.me and tg:// links)), viber (Viber numbers (viber:// links)), line (LINE account links (line.me)), facebook (facebook.com page links), instagram (instagram.com profile links), x (x.com and twitter.com profile links), linkedin (linkedin.com personal and company profile links), youtube (youtube.com channel links and video links (youtu.be, embed)), tiktok (tiktok.com profile links), pinterest (pinterest profile links), threads (threads profile links), bluesky (bsky.app profile links), discord (Discord server invite links), github (github.com user and organization profile links), google_play (Google Play app ids (package names)), app_store (App Store app ids). Or write regex: PCRE in slashes, the first capture group is the value (with no group, the whole match), e.g. /data-site-id=\"([0-9]+)\"/i. Up to 10 expressions, one column each. Works through the cluster in parts of up to 100 domains: call again with offset = next_offset until it is null. Costs extraction points: each website found in the index costs as many points as values found, 0.1 if none; the account tool shows the daily allowance. It reads every indexed page of a website, not only the home page. Every call is paid for, a repeat of the same websites too: keep the answer and go on from next_offset. The REST API gives the same as a file (format=csv). A worked example, from a niche to contacts: the read_docs page clusters/example-contacts.",
          "inputSchema": {
            "properties": {
              "cluster": {
                "description": "Cluster id, from list_clusters or create_cluster.",
                "minimum": 1,
                "type": "integer"
              },
              "include_empty": {
                "default": false,
                "description": "Also list websites where nothing matched.",
                "type": "boolean"
              },
              "limit": {
                "default": 100,
                "description": "Domains to go through in this call.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Where to start in the cluster; next_offset from the previous call.",
                "minimum": 0,
                "type": "integer"
              },
              "presets": {
                "description": "Ready-made expressions by name, e.g. [\"email\", \"phone\"]. Presets and regex together: up to 10.",
                "items": {
                  "enum": ["email", "phone", "whatsapp", "telegram", "viber", "line", "facebook", "instagram", "x", "linkedin", "youtube", "tiktok", "pinterest", "threads", "bluesky", "discord", "github", "google_play", "app_store"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "regex": {
                "description": "Your own expressions, e.g. [\"/hjid['\\\"]?\\\\s*[:=]\\\\s*([0-9]+)/\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["cluster"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
