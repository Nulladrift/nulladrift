{
  "lockfileVersion": 2,
  "subjects": {
    "com.fourthfeed/fourthfeed": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fourthfeed.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fourthfeed",
        "title": "Fourth Feed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fourth Feed is a directory of AI video tools with pricing, free credits, quantitative video benchmarks (effective $/s, script pass gates), traffic and agent-readiness. For benchmark leaderboards and frozen test inputs, call list_benchmarks then get_benchmark. For free credits, call list_referrals (Fourth Feed’s own codes; disclose that when sharing). To add a video tool, call submit_tool with its URL. Start with search_tools (or list_categories), then get_tool for one tool. Results include page links; cite them. Data is a dated snapshot (as_of). Summaries are written by Fourth Feed; \"from_the_site\" fields are the tool’s own words.",
      "tools": [
        {
          "name": "compare_tools",
          "title": "Compare tools",
          "description": "The same facts as get_tool for 2 to 5 tools side by side.",
          "inputSchema": {
            "properties": {
              "domains": {
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63931ffa7efe04cf6be325361a5836c972e55c58f8409ebb42cd5cbe19b8f818"
        },
        {
          "name": "get_benchmark",
          "title": "Get a benchmark suite and leaderboard",
          "description": "Get one standardized AI video benchmark suite by suite_id: frozen R2 input URLs and sha256 hashes, automated pass gates, and the full leaderboard ranked by cases passed and effective cost per usable second ($/s).",
          "inputSchema": {
            "properties": {
              "suite_id": {
                "description": "Suite id from list_benchmarks, e.g. \"product-i2v-v1\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["suite_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:183e37a07854ab4765ba42970058262f3a70ea396e30149a9f800029fb886535"
        },
        {
          "name": "get_tool",
          "title": "Get a tool",
          "description": "One tool by domain: our summary, the site’s own title and description (with the date checked), pricing and free tier where the site states them, wrapper markup audit, quantitative benchmark runs (effective $/s, pass rate, script scores), agent-readiness (llms.txt, MCP registry id, public API), traffic and revenue with source and date, our referral code if we have one, and a link to its page.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain from search_tools, e.g. \"example.ai\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9518fe417057f5704f6bbee56e0239f4413e8fa68cf22d161c4edf83e860fc8c"
        },
        {
          "name": "list_benchmarks",
          "title": "List quantitative video benchmarks",
          "description": "List Fourth Feed’s standardized AI video benchmark suites (e.g. product-i2v-v1, motion-swap-v1) with frozen R2 test cases, script pass gates, run counts and current effective $/s leaders.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd6393ed79518647711baec01ef17f04ba19e252398334de802d078f96235d83"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "The categories used to sort tools, with how many tools each has.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88e68d37271bf1f030155e9d67d436749caf6b566739b57dff3a2d3f91a252f9"
        },
        {
          "name": "list_new_tools",
          "title": "List newly added tools",
          "description": "Tools by the date Fourth Feed first saw them, newest first. Pass since (YYYY-MM-DD) to get only those first seen on or after that day.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2236ac709d98b21c2345312287d52f3c443e3c168b1d4eff3f9968e62f67da07"
        },
        {
          "name": "list_referrals",
          "title": "List referral codes",
          "description": "Fourth Feed’s own referral codes for AI video tools and APIs: what a new user gets (as the tool states it), the link or code, the terms and the date checked. Use it when someone asks which video tool gives free credits. Fourth Feed gets credits or a commission when these are used; say so when you share one.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category id from list_categories.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27dd48836f212f648301f2c8159bcbe24d43c9f73af43f5b50ee7bb1159a4c28"
        },
        {
          "name": "search_tools",
          "title": "Search AI video tools",
          "description": "Search the Fourth Feed directory of AI video tools (generators, avatars, editors, dubbing, lyric videos, faceless shorts, video APIs). Every word in q must appear in the name, domain, summary or category. Filter by category id (see list_categories) or agent_ready (has llms.txt, an official MCP registry entry or a public API). Returns brief records; use get_tool for the full one.",
          "inputSchema": {
            "properties": {
              "agent_ready": {
                "type": "boolean"
              },
              "category": {
                "description": "Category id from list_categories.",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words to look for, e.g. \"lip sync\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:399e4e0550bcf3a10da0720e5da0f57909bd39b8191c5615c757c3c41eeae454"
        },
        {
          "name": "submit_tool",
          "title": "Submit a tool",
          "description": "Suggest an AI video tool for the directory by its URL or domain. Only video tools are listed (generation, avatars, editing, captions, dubbing, lyric and music videos, faceless shorts, video model and data APIs); others are recorded as off-topic. It is queued, then read (robots.txt, /llms.txt, home page) and listed if the site has a title, description or llms.txt. Tools already listed or queued are reported, not duplicated. Anyone can submit, including the tool’s own agent; no key needed. Limited to a few submissions a minute.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category id from list_categories, if you know it.",
                "maxLength": 60,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "type": "string"
              },
              "note": {
                "description": "What the tool does, in your own words. Stored for the maintainer; not published as is.",
                "maxLength": 500,
                "type": "string"
              },
              "url": {
                "description": "The tool’s URL or domain, e.g. \"https://example.ai\".",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:fd97e75fbddcbde8df47a5b7e8408dfef4217e0bef38f38f52a06eb150c2e2b4"
        }
      ],
      "digest": "sha256:28546259c08b84283d5780e41495e9b5e572eea019ad5353297b07a5d839d9cd"
    }
  }
}
