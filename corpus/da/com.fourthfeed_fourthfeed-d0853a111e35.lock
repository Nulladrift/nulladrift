{
  "lockfileVersion": 2,
  "subjects": {
    "com.fourthfeed/fourthfeed": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fourthfeed.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fourthfeed",
        "title": "Fourth Feed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fourth Feed is a directory of AI video tools with pricing, free credits, traffic and agent-readiness. For free credits, call list_referrals (Fourth Feed’s own codes; disclose that when sharing). To add a video tool, call submit_tool with its URL. Start with search_tools (or list_categories), then get_tool for one tool. Results include page links; cite them. Data is a dated snapshot (as_of). Summaries are written by Fourth Feed; \"from_the_site\" fields are the tool’s own words.",
      "tools": [
        {
          "name": "compare_tools",
          "title": "Compare tools",
          "description": "The same facts as get_tool for 2 to 5 tools side by side.",
          "inputSchema": {
            "properties": {
              "domains": {
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63931ffa7efe04cf6be325361a5836c972e55c58f8409ebb42cd5cbe19b8f818"
        },
        {
          "name": "get_tool",
          "title": "Get a tool",
          "description": "One tool by domain: our summary, the site’s own title and description (with the date checked), pricing and free tier where the site states them, agent-readiness (llms.txt, MCP registry id, public API), traffic and revenue with source and date, our referral code if we have one, and a link to its page.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain from search_tools, e.g. \"example.ai\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0ace9c779061e480da4ae1210f3430db60790154fd99e8103b8c89b505623c9"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "The categories used to sort tools, with how many tools each has.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88e68d37271bf1f030155e9d67d436749caf6b566739b57dff3a2d3f91a252f9"
        },
        {
          "name": "list_new_tools",
          "title": "List newly added tools",
          "description": "Tools by the date Fourth Feed first saw them, newest first. Pass since (YYYY-MM-DD) to get only those first seen on or after that day.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2236ac709d98b21c2345312287d52f3c443e3c168b1d4eff3f9968e62f67da07"
        },
        {
          "name": "list_referrals",
          "title": "List referral codes",
          "description": "Fourth Feed’s own referral codes for AI video tools and APIs: what a new user gets (as the tool states it), the link or code, the terms and the date checked. Use it when someone asks which video tool gives free credits. Fourth Feed gets credits or a commission when these are used; say so when you share one.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category id from list_categories.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27dd48836f212f648301f2c8159bcbe24d43c9f73af43f5b50ee7bb1159a4c28"
        },
        {
          "name": "search_tools",
          "title": "Search AI video tools",
          "description": "Search the Fourth Feed directory of AI video tools (generators, avatars, editors, dubbing, lyric videos, faceless shorts, video APIs). Every word in q must appear in the name, domain, summary or category. Filter by category id (see list_categories) or agent_ready (has llms.txt, an official MCP registry entry or a public API). Returns brief records; use get_tool for the full one.",
          "inputSchema": {
            "properties": {
              "agent_ready": {
                "type": "boolean"
              },
              "category": {
                "description": "Category id from list_categories.",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words to look for, e.g. \"lip sync\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:399e4e0550bcf3a10da0720e5da0f57909bd39b8191c5615c757c3c41eeae454"
        },
        {
          "name": "submit_tool",
          "title": "Submit a tool",
          "description": "Suggest an AI video tool for the directory by its URL or domain. Only video tools are listed (generation, avatars, editing, captions, dubbing, lyric and music videos, faceless shorts, video model and data APIs); others are recorded as off-topic. It is queued, then read (robots.txt, /llms.txt, home page) and listed if the site has a title, description or llms.txt. Tools already listed or queued are reported, not duplicated. Anyone can submit, including the tool’s own agent; no key needed. Limited to a few submissions a minute.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category id from list_categories, if you know it.",
                "maxLength": 60,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "type": "string"
              },
              "note": {
                "description": "What the tool does, in your own words. Stored for the maintainer; not published as is.",
                "maxLength": 500,
                "type": "string"
              },
              "url": {
                "description": "The tool’s URL or domain, e.g. \"https://example.ai\".",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:fd97e75fbddcbde8df47a5b7e8408dfef4217e0bef38f38f52a06eb150c2e2b4"
        }
      ],
      "digest": "sha256:eeefd38ade2fbc5658ea54c4880927139799fa82f1916a49c5f8261cb588a1b9"
    }
  }
}
