      },
      "transport": {
        "type": "http",
        "url": "https://mcp.base64hub.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "base64hub-mcp",
        "title": "base64hub",
        "version": "1.1.0",
        "description": "Base64 encode, decode and validate tools, hosted at mcp.base64hub.com.",
        "websiteUrl": "https://base64hub.com/mcp/",
        "icons": [
          {
            "src": "https://base64hub.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://base64hub.com/web-app-manifest-512x512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Exact Base64 conversion. Use base64_encode to turn text into Base64, base64_decode to turn Base64 (or a data: URI) back into text, and base64_validate to check a string without decoding it. Results are computed exactly, so prefer these tools over converting by hand.",
      "tools": [
        {
          "name": "base64_decode",
          "title": "Base64 decode",
          "description": "Decode Base64 back to text. Accepts the standard and the URL-safe alphabet (even mixed), missing '=' padding, spaces and line breaks, and data URIs such as data:image/png;base64,... Returns the decoded UTF-8 text exactly. If the bytes are not valid UTF-8 (an image, compressed or encrypted data), says so and returns them as hex instead. Invalid input fails with the reason and the position of the offending character.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "description": "Base64 text or a data: URI.",
                "type": "string"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Base64 decode"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:80a7e132dbb0881bd14cd1f768f6f12150416dcadc61fc2e6c45e85b36572a56"
        },
        {
          "name": "base64_encode",
          "title": "Base64 encode",
          "description": "Encode text to Base64. The text is converted to UTF-8 bytes first, so any language and emoji work. Set url_safe for the URL- and filename-safe alphabet (- and _ instead of + and /, as in JWTs and URLs), padding=false to drop the trailing '=' characters, and wrap to break the output into lines (76 for MIME email). Returns only the Base64 string.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "padding": {
                "default": true,
                "description": "Add '=' padding at the end.",
                "type": "boolean"
              },
              "text": {
                "description": "Text to encode, taken as UTF-8.",
                "type": "string"
              },
              "url_safe": {
                "default": false,
                "description": "Use the URL-safe alphabet (- and _, RFC 4648 section 5).",
                "type": "boolean"
              },
              "wrap": {
                "default": 0,
                "description": "Insert a line break after every N output characters. 0 = one line, 76 = MIME.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Base64 encode"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b81b34b01976668a7a916cc2ea6e0b9513ac0116d63a38e904347e51bb1eb2f1"
        },
        {
          "name": "base64_validate",
          "title": "Base64 validate",
          "description": "Check whether a string is valid Base64 and describe it, without returning the decoded content. Uses the same lenient rules as base64_decode. Returns JSON: valid, variant (standard if + or / occurs, url if - or _ occurs, mixed if both, either if neither), padded (whether the '=' padding is complete) and bytes (decoded size); or valid: false with the error base64_decode would report, such as the offending character and its position.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "description": "The string to check. A data: URI is accepted too.",
                "type": "string"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "bytes": {
                "minimum": 0,
                "type": "integer"
              },
              "error": {
                "type": "string"
              },
              "padded": {
                "type": "boolean"
              },
              "valid": {
                "type": "boolean"
              },
              "variant": {
                "enum": ["standard", "url", "mixed", "either"],
                "type": "string"
              }
            },
            "required": ["valid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Base64 validate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db745768e6fe7df4a15290abd616f9c0c61b01c4eb6c9d625dd8cd77826c8815"
        }
      ],
      "digest": "sha256:7246df5fb562fcba4359506a07bb811ad990457f2fb0d9dffe9ba1e68991b5c9"
    }
  }
}
