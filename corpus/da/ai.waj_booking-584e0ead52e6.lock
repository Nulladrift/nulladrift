      },
      "instructions": "WAJ Booking covers salons, spas, barbers, beauty clinics and other businesses on WAJ that take bookings through AI assistants: their services, prices, professionals and open times, and a link to book. search_businesses finds a business by name, service or area (nearest first when latitude and longitude are given); its `business` value identifies the business in the other tools. A booking goes find_available_times, then the customer's choice of time, then get_booking_link with that date and time. The link opens the business's booking site with those choices made; the customer enters their details and confirms there, and pays there if the business asks. Nothing is booked or held through this server, and no tool takes a name, phone number or payment details. Times are the business's local time; prices are in its currency.",
      "tools": [
        {
          "name": "find_available_times",
          "title": "Available times",
          "description": "Open start times for a service or package at a branch, for one day or up to 7 consecutive days, with any professional or a chosen one. Times are local to the branch. These are the times the business's booking website offers; they are not held.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "branch": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Branch id or name. Required when the business has more than one branch.",
                "title": "Branch"
              },
              "business": {
                "description": "The business's `business` value, as given in search results.",
                "maxLength": 100,
                "minLength": 1,
                "title": "Business",
                "type": "string"
              },
              "date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "First day to search, YYYY-MM-DD, in the branch's local calendar. Defaults to today.",
                "title": "Date"
              },
              "end_date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last day to search (inclusive), at most 6 days after date. Defaults to date.",
                "title": "End Date"
              },
              "option": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Option id or name, required when the service has options.",
                "title": "Option"
              },
              "package": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Package id or name, instead of service.",
                "title": "Package"
              },
              "service": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Service id or name. Give this or package.",
                "title": "Service"
              },
              "staff": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Professional's staff id or name. Omit for any professional.",
                "title": "Staff"
              }
            },
            "required": ["business"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Available times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3fdf95e3c535c429f4b5780e0a4879636140606bb76b7789ef28827bab29199e"
        },
        {
          "name": "get_booking_link",
          "title": "Booking link",
          "description": "A link to the business's booking website with the branch, service or package, professional and, optionally, an open start time pre-selected (the time is re-checked first). The booking, the customer's details and any payment are completed on the website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "branch": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Branch id or name to pre-select.",
                "title": "Branch"
              },
              "business": {
                "description": "The business's `business` value, as given in search results.",
                "maxLength": 100,
                "minLength": 1,
                "title": "Business",
                "type": "string"
              },
              "date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Day of the chosen start time, YYYY-MM-DD, branch local. Give with time.",
                "title": "Date"
              },
              "language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Site language code: en, ar, tr, ru or de. Defaults to the business's default language.",
                "title": "Language"
              },
              "option": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Option id or name of the service, used to check the time when the service has options. The customer still picks the option on the site.",
                "title": "Option"
              },
              "package": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Package id or name to pre-select instead of a service.",
                "title": "Package"
              },
              "service": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Service id or name to pre-select. Give this or package, or neither for the plain booking page.",
                "title": "Service"
              },
              "staff": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Professional's staff id or name to book with.",
                "title": "Staff"
              },
              "time": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Chosen start time, HH:MM (24h), branch local, one of the business's open start times. Give with date; needs a service or package.",
                "title": "Time"
              }
            },
            "required": ["business"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Booking link"
          },
          "behavior": {
