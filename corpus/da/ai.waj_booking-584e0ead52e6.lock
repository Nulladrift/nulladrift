        {
          "name": "list_services",
          "title": "Services and prices",
          "description": "Services and packages that can be booked online, grouped by category, with duration in minutes and price in the business currency (options, offers and lowest price where they apply). Filter by branch, category or text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "branch": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Branch id or name. Omit to list the services of every branch.",
                "title": "Branch"
              },
              "business": {
                "description": "The business's `business` value, as given in search results.",
                "maxLength": 100,
                "minLength": 1,
                "title": "Business",
                "type": "string"
