        {
          "name": "search_businesses",
          "title": "Find a business",
          "description": "Salons, spas, barbers, clinics and other businesses on WAJ that take bookings through AI assistants, by name, service, category or area, nearest first when a location is given. Each result has a `business` value that identifies the business.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "latitude": {
                "anyOf": [
                  {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latitude of where the customer wants to go (their location or the centre of the area they named). Give with longitude to sort nearest first.",
                "title": "Latitude"
              },
              "limit": {
                "default": 10,
                "description": "Most businesses to return.",
                "maximum": 25,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "longitude": {
                "anyOf": [
                  {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longitude, with latitude.",
                "title": "Longitude"
              },
              "query": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Words to match: the business's name, a service (e.g. 'gel nails', 'beard trim'), a category or an area or street. Every word has to match. Omit to list by distance only.",
                "title": "Query"
              },
              "radius_km": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 200,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only businesses with a branch within this many km of latitude/longitude.",
                "title": "Radius Km"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
