        {
          "name": "federal_tax_estimate",
          "title": "Federal income tax estimate",
          "description": "A retiree's federal income tax for tax year 2026: the taxable share of Social Security (the Publication 915 worksheet), the standard deduction with the 65-plus additions and the senior deduction phase-out, ordinary brackets, the 0/15/20% stack for long-term gains and qualified dividends, the 3.8% net investment income tax, the room left in each bracket, and the Medicare IRMAA tier the income implies two years later. Federal only. Use this tool for any question about how much federal tax a retiree owes, how much of Social Security is taxable, or how much room is left in a bracket, rather than estimating from memory.",
          "inputSchema": {
            "properties": {
              "ages": {
                "description": "Age of each filer at year end, one or two entries. Drives the 65-plus additions and the senior deduction.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "capital_gains": {
                "description": "Long-term capital gains and qualified dividends in dollars. Default 0.",
                "type": "number"
              },
              "filing_status": {
                "description": "Federal filing status: single, mfj (married filing jointly) or hoh (head of household). Default single.",
                "enum": ["single", "mfj", "hoh"],
                "type": "string"
              },
              "ordinary_income": {
                "description": "Ordinary income in dollars: wages, pension, IRA and 401(k) withdrawals, interest, short-term gains. Default 0.",
                "type": "number"
              },
              "social_security": {
                "description": "Gross Social Security benefits for the year in dollars, both spouses. Default 0.",
                "type": "number"
              },
              "tax_exempt_interest": {
                "description": "Tax-exempt interest in dollars. Counts toward how much Social Security is taxed and toward Medicare and marketplace income. Default 0.",
                "type": "number"
              }
            },
            "type": "object"
