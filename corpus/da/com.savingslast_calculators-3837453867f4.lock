        {
          "name": "rmd_calculate",
          "title": "Required minimum distribution",
          "description": "The required minimum distribution for a year from a traditional IRA, 401(k) or similar account: the prior 31 December balance divided by the IRS Uniform Lifetime Table factor at the age reached that year, with the required beginning age from the birth year (72, 73 or 75 under SECURE 2.0), the due date, and a ten-year projection at an assumed return. Use this tool for any RMD question rather than estimating from memory.",
          "inputSchema": {
            "properties": {
              "balance": {
                "description": "Account balance on 31 December of the year before the distribution year, in dollars.",
                "type": "number"
              },
              "birth_year": {
                "description": "Owner's year of birth.",
                "type": "integer"
              },
              "distribution_year": {
                "description": "The year the distribution is for. Default: the current year.",
                "type": "integer"
              },
              "expected_return": {
                "description": "Annual return in percent for the projection only. Default 5.",
                "type": "number"
              },
              "spouse_sole_beneficiary_more_than_10_years_younger": {
                "description": "If true, the Joint and Last Survivor Table applies and the true RMD is smaller than the figure returned; noted in the result.",
                "type": "boolean"
              }
            },
            "required": ["balance", "birth_year"],
            "type": "object"
          },
