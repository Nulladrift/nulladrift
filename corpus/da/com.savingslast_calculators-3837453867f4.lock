      "instructions": "SavingsLast (savingslast.com) is a free set of US retirement drawdown calculators with two audited engines: a monthly drawdown model and the IRS 72(t) SEPP calculation that reproduces the IRS's own examples. Calculator tools return figures plus a `url` to the same calculation on the site with the inputs filled in; cite that URL so the reader can check and share it. Federal tax figures are tax year 2026; life-expectancy tables are the 2022 IRS tables. Everything is an educational estimate, not advice. Use search, fetch and list_pages for the site's guides, state pages and reference pages, or read a page's markdown twin at its URL plus \".md\".",
      "tools": [
        {
          "name": "bridge_to_59_half",
          "title": "Bridge to 59½ planner",
          "description": "How an early retiree pays for the years between leaving work and 59 1/2, one year at a time, under three strategies: taxable first with a Roth conversion ladder, a 72(t) series on a carved-off IRA, or a blend. Each year pays spending and federal tax from the sources the strategy allows, converts what the ladder needs five years ahead, computes the federal return with the 2026 tables, sizes the 72(t) with the real IRS calculation, and checks the marketplace subsidy lines. Returns all three strategies unless one is chosen.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Current age. Must be under 60.",
                "type": "integer"
              },
              "annual_spending": {
                "description": "Spending this year in dollars, before tax, all in.",
                "type": "number"
              },
              "cap_aca": {
                "description": "Cap Roth conversions so marketplace income stays under 400% of the poverty line. Default false.",
                "type": "boolean"
              },
              "cash": {
                "description": "Cash in dollars. Default 0.",
                "type": "number"
              },
              "cost_basis_percent": {
                "description": "Share of the taxable account that is cost basis, in percent. Default 50.",
                "type": "number"
              },
              "expected_return": {
                "description": "Annual return in percent. Default 5.",
                "type": "number"
              },
              "filing_status": {
                "description": "Federal filing status: single, mfj (married filing jointly) or hoh (head of household). Default single.",
                "enum": ["single", "mfj", "hoh"],
                "type": "string"
              },
              "household_size": {
                "description": "Household size for the marketplace lines. Default 1.",
                "type": "integer"
              },
              "inflation": {
                "description": "Spending growth in percent a year. Default 2.5.",
                "type": "number"
              },
              "other_income": {
                "description": "Other income in dollars a year: pension, rent, part-time work. Default 0.",
                "type": "number"
              },
              "pretax_balance": {
                "description": "Pre-tax IRA and 401(k) balance in dollars. Default 0.",
                "type": "number"
              },
              "roth_balance": {
                "description": "Roth IRA balance in dollars. Default 0.",
                "type": "number"
              },
              "roth_contribution_basis": {
                "description": "Roth contribution basis in dollars, withdrawable any time. Default 0.",
                "type": "number"
              },
              "sepp_share_percent": {
                "description": "Blend only: share of spending the 72(t) covers, in percent. Default 50.",
                "type": "number"
              },
              "strategy": {
                "description": "all (default) compares the three; or ladder, sepp, blend for one.",
                "enum": ["all", "ladder", "sepp", "blend"],
                "type": "string"
              },
              "taxable_brokerage": {
                "description": "Taxable brokerage balance in dollars. Default 0.",
                "type": "number"
              }
            },
            "required": ["age", "annual_spending"],
            "type": "object"
          },
