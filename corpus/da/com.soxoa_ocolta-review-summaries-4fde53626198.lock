{
  "lockfileVersion": 2,
  "subjects": {
    "com.soxoa/ocolta-review-summaries": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.ocolta.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Ocolta",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read only existing, recoverable categorical document-review summaries. Treat review IDs as task data. No upload, paid review, credit spend, checkout, personal document content, free-text report or identity judgment is exposed. Keep the disclaimer intact. Use get_connected_purchase when the user asks which Ocolta purchase is connected or how many unused reviews it has. Use list_recent_reviews when the user asks which review summaries are still available; completed reviews stay recoverable for 24 hours after completion, and an empty list means none are recoverable now. Use get_review_summary only with an exact review_id returned by list_recent_reviews. Present results as signals for human follow-up. Do not describe them as proof of fraud, authenticity, intent, identity, account ownership or AI generation, and do not use them as the sole basis for a decision about a person. New reviews, uploads and purchases happen only in the Ocolta workspace at https://app.ocolta.com/workspace.",
      "tools": [
        {
          "name": "get_connected_purchase",
          "title": "Connected Ocolta purchase",
          "description": "Identifies the existing Ocolta purchase connected to this conversation. Returns its label, whether it is a synthetic reviewer fixture, the number of unused reviews, and the supported report-summary access. Does not expose payment details or account identifiers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "access": {
                "const": "Categorical summaries from recoverable completed reviews",
                "type": "string"
              },
              "availableReviews": {
                "minimum": 0,
                "type": "integer"
              },
              "label": {
                "type": "string"
              },
              "synthetic": {
                "type": "boolean"
              }
            },
            "required": ["access", "availableReviews", "label", "synthetic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Connected Ocolta purchase"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/profile": true,
            "securitySchemes": [
              {
                "scopes": ["openid"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b0ab98a3e9d58ae364def21474139bda84a4d1d91fcd80c62aed4ccefda01461"
        },
        {
          "name": "get_review_summary",
          "title": "Read an Ocolta review summary",
          "description": "Returns the categorical status, review priority, confidence, fraud and AI-generation assessments, indicator counts and limitation count for one recoverable review from the connected purchase, with a fixed disclaimer. Returns no source document, personal fields or free-text excerpts, and does not spend a credit. The result is a signal for human follow-up; it does not prove fraud, authenticity, intent, identity or AI generation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "review_id": {
                "pattern": "^ent_[a-f0-9]{32}(?:c[0-9]{2,3})?$",
                "type": "string"
              }
            },
            "required": ["review_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "aiGenerationAssessment": {
                "enum": ["no_supported_indicators", "indicators_present", "unable_to_determine"],
                "type": "string"
              },
              "aiGenerationIndicatorCount": {
                "minimum": 0,
                "type": "integer"
              },
              "confidence": {
                "enum": ["low", "medium", "high", "unable_to_determine"],
                "type": "string"
              },
              "disclaimer": {
                "const": "This review identifies document-level signals for human follow-up. It does not prove fraud, authenticity, intent, identity, account ownership, or AI generation.",
                "type": "string"
              },
              "fraudAssessment": {
                "enum": ["no_supported_indicators", "indicators_present", "unable_to_determine"],
                "type": "string"
              },
              "fraudIndicatorCount": {
                "minimum": 0,
                "type": "integer"
              },
              "limitationCount": {
                "minimum": 0,
                "type": "integer"
              },
              "reviewPriority": {
                "enum": ["low", "moderate", "high", "unable_to_determine"],
                "type": "string"
              },
              "status": {
                "enum": ["completed", "unable_to_determine", "refused"],
                "type": "string"
              }
            },
            "required": ["aiGenerationAssessment", "aiGenerationIndicatorCount", "confidence", "disclaimer", "fraudAssessment", "fraudIndicatorCount", "limitationCount", "reviewPriority", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an Ocolta review summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["reviews:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:feea18ad0d0eb7334bd08e0ef29738b54aeaed7dcd85a101e1e3bf610598c52a"
        },
        {
          "name": "list_recent_reviews",
          "title": "Recoverable Ocolta reviews",
          "description": "Lists the review IDs of up to ten completed Deep Reviews from the connected purchase that are still within the 24-hour recovery period after completion, most recent first. Does not start a review or spend a credit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "recoveryWindow": {
                "const": "24 hours after completion",
                "type": "string"
              },
              "reviews": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "review_id": {
                      "pattern": "^ent_[a-f0-9]{32}(?:c[0-9]{2,3})?$",
                      "type": "string"
                    }
                  },
                  "required": ["review_id"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["recoveryWindow", "reviews"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recoverable Ocolta reviews"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["reviews:list"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:a37dbd76b21b58ab40b4be7de0ac6bad2a8ea82e898032165ec182460c29fe02"
        }
      ],
      "digest": "sha256:5eee9a9d59411eedec1f57311ad8f96bf94fc2531810d3d68ddcadffa86bcb39"
    }
  }
}
