      },
      "transport": {
        "type": "http",
        "url": "https://lunonis.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lunonis",
        "title": "Lunonis Astrology",
        "version": "1.0.0",
        "websiteUrl": "https://lunonis.com/developers/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Lunonis calculates real natal charts (tropical zodiac, Placidus houses) and synastry from a birth date, time and city.\nTo get a chart ask the user for the birth date, the birth time if they know it, and the birth city, then call natal_chart.\nIf a result has status \"ambiguous_place\", show the candidates, ask which one and call again with that candidate's id as place.\nUse only the values returned; never invent or recompute placements. Without a birth time there is no rising sign or houses: say so.\nPresent astrology as reflection, not prediction or advice. Give the user the returned links.",
      "tools": [
        {
          "name": "compatibility",
          "title": "Compatibility (synastry)",
          "description": "Compare two people's charts (synastry) from their birth data. Returns the overall tone (flowing, mixed or charged), whether the Sun elements match, the classic pairings (Venus-Mars, Sun-Moon, Moon-Moon, Venus-Venus), the tightest Moon, Venus, Mars and Sun contacts between the two charts, and a link to the free full comparison on lunonis.com. Counted aspects only: there is no compatibility score. Nothing is stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "personA": {
                "description": "First person",
                "properties": {
                  "date": {
                    "description": "Birth date, YYYY-MM-DD (1900-2100)",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "place": {
                    "description": "Birth city name (e.g. \"Lviv\" or \"Lviv, Ukraine\"), or a place id from search_places. A name shared by several cities returns candidates to choose from.",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "time": {
                    "description": "Birth time, 24-hour HH:MM local time. Omit if unknown: the rising sign and houses are then left out, never guessed.",
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  }
                },
                "required": ["date", "place"],
                "type": "object"
              },
              "personB": {
                "description": "Second person",
                "properties": {
                  "date": {
                    "description": "Birth date, YYYY-MM-DD (1900-2100)",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "place": {
                    "description": "Birth city name (e.g. \"Lviv\" or \"Lviv, Ukraine\"), or a place id from search_places. A name shared by several cities returns candidates to choose from.",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "time": {
                    "description": "Birth time, 24-hour HH:MM local time. Omit if unknown: the rising sign and houses are then left out, never guessed.",
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  }
                },
                "required": ["date", "place"],
                "type": "object"
              }
            },
            "required": ["personA", "personB"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compatibility (synastry)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e0ada52051397c0a6f947ceb7bbca18959660c052984e1cf9182d39e17d9148"
        },
        {
          "name": "natal_chart",
          "title": "Natal chart",
          "description": "Calculate a real natal (birth) chart from a birth date, optional birth time and a city. Returns the Sun, Moon and rising signs, every planet with sign, degree and house, the five tightest aspects, an element and modality summary, and a link to the free full chart with the wheel on lunonis.com. Calculated in-house with an ephemeris (tropical zodiac, Placidus houses); nothing is stored. If the city name matches several places it returns status \"ambiguous_place\" with candidates: ask the user which one, then call again with that id as place.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Birth date, YYYY-MM-DD (1900-2100)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "lang": {
                "description": "Language of the returned links (site language code). Default en.",
                "enum": ["en", "es", "pt", "fr", "de", "it", "pl", "tr", "ja", "zh", "uk"],
                "type": "string"
              },
              "place": {
                "description": "Birth city name (e.g. \"Lviv\" or \"Lviv, Ukraine\"), or a place id from search_places. A name shared by several cities returns candidates to choose from.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "time": {
                "description": "Birth time, 24-hour HH:MM local time. Omit if unknown: the rising sign and houses are then left out, never guessed.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              }
            },
            "required": ["date", "place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Natal chart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:110f13c796bfec07087d2918c5c4654d773a0d6ed04d0595381147b7c1126d2e"
        },
        {
          "name": "search_places",
          "title": "Search places",
          "description": "Find birth cities by name. Returns up to 6 candidates { id, name, region, country }, the biggest first. Use it to disambiguate a city, then pass the chosen id as the place of natal_chart or compatibility.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "City name, at least 2 characters (e.g. \"Paris\")",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03b4353500314cf7b9b50cda80983a60a1695154d5635dc73ae03b588f7ea611"
        }
      ],
      "digest": "sha256:db746b02a61e3fab684dceaaa86d775f6b3e2f5143bb7b0352971c6657847bc5"
    }
  }
