            }
          },
          "digest": "sha256:02786f182f87504e57f8c7f6ee87333d5278046dafb7f30d0607dcc49aa77d64"
        },
        {
          "name": "search",
          "title": "Search Kineticist",
          "description": "Look up anything pinball on Kineticist: \"who is Steve Ritchie?\", \"tell me about Spooky Pinball\", \"Kineticist articles about Pinburgh\". Searches everything on Kineticist: games, news articles, places to play, manufacturers, people, mods, Hype Index entries and creators. Returns up to 10 matches, best first, each with its type, title, a short subtitle and `url` (its page on kineticist.com). Pass `type` to look in one kind only. For game details use get_game_details; for any other result, pass its url to `get`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "What to look for, e.g. \"Steve Ritchie\", \"Stern\", \"Pinburgh\"",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "description": "Only this kind of result",
                "enum": ["game", "article", "location", "manufacturer", "person", "mod", "hype", "promoter"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Kineticist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://kineticist/card.html",
            "ui": {
              "resourceUri": "ui://kineticist/card.html"
            }
          },
          "digest": "sha256:e112d87caba037514ed53e1c4c0fe083569db1c0a4f9072481781f937cf4469d"
        },
        {
          "name": "search_pinball_games",
          "title": "Search pinball games",
          "description": "Find pinball machines: \"what Stern machines are in production right now?\", \"what pinball games has Stern made?\", \"pinball games from 1992\". `in_production` filters to machines Kineticist lists as currently made. Searches and filters the Kineticist pinball game database. Supports text search, manufacturer filtering, year ranges, production status, and sorting. Returns game names, slugs, manufacturers, fun scores, edition counts, and each game's page URL on kineticist.com (link it when citing a game). `newest_edition_year` is the year the newest edition came out, not the year production ended; `in_production` says whether the game is still made.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "in_production": {
                "description": "Filter to only games currently in production (true) or out of production (false)",
                "type": "boolean"
              },
              "limit": {
                "description": "Results per page (1-100, default 25)",
                "type": "number"
              },
              "manufacturer": {
                "description": "Filter by manufacturer name or slug (fuzzy match — 'stern' works)",
                "type": "string"
              },
              "q": {
                "description": "Text search by game name (fuzzy, 2+ chars). Natural language works — 'that stern game with dinosaurs' will find Godzilla.",
                "type": "string"
              },
              "sort": {
                "description": "Sort field. Prefix with - for descending. Options: name, first_manufacture_year, average_fun_score, ratings_count",
                "type": "string"
              },
              "year_from": {
                "description": "Minimum manufacture year",
                "type": "number"
              },
              "year_to": {
                "description": "Maximum manufacture year",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search pinball games"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://kineticist/card.html",
            "ui": {
              "resourceUri": "ui://kineticist/card.html"
            }
          },
          "digest": "sha256:2fe78ff8eab06c0b41c8098f5bab8cbd105b4e668cc0b16e267a8d85a566c0cd"
        },
        {
          "name": "whats_new",
          "title": "What's new in pinball",
          "description": "What's new in pinball: \"what's new in pinball this week?\", \"latest pinball news\", \"what's climbing the Hype Index?\". The latest Kineticist news articles (headline, date, summary and link; `members_section` means part of the article is for members; `games` lists the machines an article covers, get_game_details with a game's slug returns its editions, prices and design team; a release announced in the last few days may not have its new editions in the database yet, so check the edition dates against the article before quoting prices), new videos, podcasts and posts from the pinball creators Kineticist follows (`from_creators`: title, creator, format, date, summary, link), and Kineticist's Hype Index ranking (the current top 10 and this week's biggest climbers; `change_this_week` and `up` are places moved on the index since a week ago, positive is up, and a missing change means there's no rank from a week ago). This covers the week in pinball; each article and creator item carries its link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "creators": {
                "description": "How many creator items to list (default 8). Ask for more, up to 40, for a full roundup of the window",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "days": {
                "description": "How far back to look for news, in days (default 7)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What's new in pinball"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://kineticist/card.html",
            "ui": {
              "resourceUri": "ui://kineticist/card.html"
            }
          },
          "digest": "sha256:6a4c3d7ae592f7cd2939ff2158b6c2ccafb3ffee5e0e76a0efff0e7fb5c8a645"
        },
        {
          "name": "where_to_play",
          "title": "Find where to play",
          "description": "Where to play pinball, or a specific machine: \"where can I play Godzilla near 97214?\", \"where can I play pinball in Chicago?\", \"pinball bars in Portland\". Finds pinball venues near a place: a postal code (\"60601\", \"SW1A 1AA\" with country gb) or a city (\"Chicago\", \"Portland, OR\"). Pass `game` (name or slug) to find venues that have that machine. Returns up to 10 venues, nearest first, with city, distance in miles, machine count, venue kind (bar, arcade…) and `url`, the venue's page on kineticist.com (link it; it has the address and full machine list). `searched` says which place distances are measured from (\"central Chicago, IL\" is the city centre; \"(middle of our venues there)\" means a smaller city placed by its venues); `note` says when these are the nearest anywhere rather than nearby. Machine lists come from Pinball Map and can lag.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Two-letter country code for postal codes outside the US (gb, ca, de…). Default us.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "game": {
                "description": "Only venues that have this game: a name (\"Godzilla\") or slug (godzilla-2021)",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "place": {
                "description": "Postal code or city, e.g. \"60601\", \"Chicago\", \"Portland, OR\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find where to play"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://kineticist/card.html",
            "ui": {
