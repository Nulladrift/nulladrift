        {
          "name": "kineticist_delete_comment",
          "title": "Delete your comment",
          "description": "Delete one of the member's own comments. The comment disappears from the page; this cannot be undone. Someone else's comment answers not found. Needs the member signed in to Kineticist from this app; an API key can't delete. Acts on the caller's own Kineticist account (the signed-in member, or the API key owner). Agents that make many calls per task use up a free account's daily allowance quickly.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "commentId": {
                "description": "The comment's id.",
