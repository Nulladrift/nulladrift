        {
          "name": "where_to_play",
          "title": "Find where to play",
          "description": "Where to play pinball, or a specific machine: \"where can I play Godzilla near 97214?\", \"where can I play pinball in Chicago?\", \"pinball bars in Portland\". Finds pinball venues near a place: a postal code (\"60601\", \"SW1A 1AA\" with country gb) or a city (\"Chicago\", \"Portland, OR\"). Pass `game` (name or slug) to find venues that have that machine. Returns up to 10 venues, nearest first, with city, distance in miles, machine count, venue kind (bar, arcade…) and `url`, the venue's page on kineticist.com (link it; it has the address and full machine list). `searched` says which place distances are measured from (\"central Chicago, IL\" is the city centre; \"(middle of our venues there)\" means a smaller city placed by its venues); `note` says when these are the nearest anywhere rather than nearby, or when no game has exactly the name asked. A game name that fits several machines answers for the best match (`game`, with its year) and lists the rest in `other_matches`; pass one's slug as `game` to ask about that one. Machine lists come from Pinball Map and can lag.",
