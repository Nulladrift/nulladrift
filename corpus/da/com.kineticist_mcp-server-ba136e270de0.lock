        },
        {
          "name": "list_game_files",
          "title": "List a game's files",
          "description": "Find a pinball manual or schematic: \"where's the Firepower manual?\", \"schematics for Fish Tales\". Lists a pinball game's downloadable files (manuals, ROMs, schematics, parts lists, bulletins) grouped by the machine each file is for. Each file line ends with a one-line description of what sets it apart (edition, print, language, format) when the title alone doesn't say. Use it to answer 'which file is for which machine' — e.g. Firepower's page also carries Taito's Fire Action files, and this tool tells them apart. Pass `machine` (trm_ id, slug, UUID or OPDB machine id) to narrow to one machine. Lists metadata only and ends with the game page's Documentation link; downloading a file needs a free Kineticist account on that page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Game slug or ID",
                "type": "string"
              },
              "machine": {
                "description": "Optional machine filter: trm_ id, slug, UUID or OPDB machine id",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List a game's files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
