        {
          "name": "get_game_credits",
          "title": "Get a game's design team",
          "description": "Who designed a pinball machine: \"who designed Medieval Madness?\", \"who designed Attack from Mars?\", \"who did the art for Twilight Zone?\". Returns the full credited team, not just the lead designer. The design team for a pinball game — designer, artist, programmer, mechanical engineer, sound designer, animator, etc. Each credit includes the person's name and role. Every row carries `role` (slug, e.g. \"design\"), `role_name` (display name, e.g. \"Design\"), and, only where several people share a role on the game, `is_lead: true` on the first chair (no is_lead means no ranking, not \"not the lead\"). Read `role_name` for human display; `role` is the stable slug for filtering. A row with an `edition` (name, slug) credits that person for that edition of the game only, such as the artist of a licensed foreign copy; rows without one cover the whole game. Each person carries `url`, their page on kineticist.com, and `game_url` is the game's page (link them when citing).",
          "inputSchema": {
