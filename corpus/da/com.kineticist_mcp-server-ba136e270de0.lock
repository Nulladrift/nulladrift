        {
          "name": "kineticist_create_list",
          "title": "Create a list",
          "description": "Create a list, optionally with items already in it. entityType decides what the list holds and defaults to game; items are ids of that type (games as gm_… or bare UUIDs) with an optional note each, up to 500. A list can have up to 50 per member; over the limit the call is refused and says so. Returns the list's id, slug and kineticist.com url. Public by default; pass isPublic false for a private list. Acts on the caller's own Kineticist account (the signed-in member, or the API key owner). Agents that make many calls per task use up a free account's daily allowance quickly.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "body": {
                "description": "Longer text shown on the list page (up to 5,000 characters).",
                "maxLength": 5000,
                "type": "string"
              },
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "description": {
                "description": "A short description (up to 500 characters).",
                "maxLength": 500,
                "type": "string"
              },
              "entityType": {
                "description": "What the list holds. Default game.",
                "enum": ["game", "location", "hype_theme", "promoter_item"],
                "type": "string"
              },
              "isPublic": {
                "description": "Default true. false makes it private to the member.",
                "type": "boolean"
              },
              "items": {
                "description": "Items to add, in order.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "What to put in the list: a game id (gm_… or the bare UUID), a location id (loc_…), a Hype Index theme id (hyp_…), or a community item id, matching the list's type.",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "note": {
                      "description": "A note shown with this item.",
                      "maxLength": 500,
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "maxItems": 500,
                "type": "array"
              },
              "listType": {
                "description": "ranked shows numbers in order; collection (the default) doesn't.",
