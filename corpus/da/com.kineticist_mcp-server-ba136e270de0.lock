      "serverInfo": {
        "name": "kineticist",
        "title": "Kineticist",
        "version": "1.5.0",
        "description": "Pinball machines, places to play, designers, news and the Hype Index from Kineticist.",
        "websiteUrl": "https://www.kineticist.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Kineticist (kineticist.com) is a pinball publication and database. These tools cover pinball machines and their editions, list prices (MSRP) and production status; design credits; places to play near a postal code or city, and which venues have a given machine; manufacturers, designers and other people; recent pinball news and creator videos; and Kineticist's Hype Index of pinball themes.\n\nWhich tool: where_to_play for places to play; whats_new for recent pinball news, new videos and podcasts from pinball creators, and Hype Index moves; search_pinball_games and get_game_details for machines, their editions, prices and production status; get_game_credits for who designed a game; list_game_files for manuals and schematics; search for anything else on the site, then get to read a result's page.\n\nAnswers include kineticist.com page links (url); cite them when using Kineticist's data. News results are summaries, and the full story is at the article link.\n\nA creator video or news tag can name a homebrew, another manufacturer's game or an unreleased one, so a game named there may not have its own entry in the database.\n\nA game named with slashes, like \"Family Guy / Shrek\", is one playfield sold under several themes, grouped on purpose.",
      "tools": [
        {
          "name": "get",
          "title": "Read a Kineticist page",
          "description": "Read what Kineticist says about something: \"what does Kineticist say about Logan Arcade?\", or any www.kineticist.com link. Reads a Kineticist page by its link, as markdown: a game, Hype Index entry, place to play, manufacturer, person, mod or creator. News articles come back as headline, date, summary and link only; the full article is at the link. Use the `url` from search or another tool.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "A www.kineticist.com page link, e.g. https://www.kineticist.com/people/steve-ritchie",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Kineticist page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://kineticist/card.html",
            "ui": {
              "resourceUri": "ui://kineticist/card.html"
            }
          },
          "digest": "sha256:77f39a29bedc456c75bbdfe482e36775d3a6caf72690838b87a1028b1acc66e0"
        },
        {
          "name": "get_game_credits",
          "title": "Get a game's design team",
          "description": "Who designed a pinball machine: \"who designed Medieval Madness?\", \"who designed Attack from Mars?\", \"who did the art for Twilight Zone?\". Returns the full credited team, not just the lead designer. The design team for a pinball game — designer, artist, programmer, mechanical engineer, sound designer, animator, etc. Each credit includes the person's name and role. Every row carries `role` (slug, e.g. \"design\"), `role_name` (display name, e.g. \"Design\"), and, only where several people share a role on the game, `is_lead: true` on the first chair (no is_lead means no ranking, not \"not the lead\"). Read `role_name` for human display; `role` is the stable slug for filtering. Each person carries `url`, their page on kineticist.com, and `game_url` is the game's page (link them when citing).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Game slug or ID",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a game's design team"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://kineticist/card.html",
            "ui": {
              "resourceUri": "ui://kineticist/card.html"
            }
          },
          "digest": "sha256:201997d2ff700b107fb1715470b5ffe0e84184164907288ec896e301d0437988"
        },
        {
          "name": "get_game_details",
          "title": "Get game details",
          "description": "Price, production status and details of a pinball machine: \"how much is the Godzilla Premium, and is it still made?\", \"how much is the Jurassic Park Premium?\", \"what is Godzilla pinball?\". Includes each edition's list price (MSRP) and whether the machine is in production. Full details for one game including editions (Pro/Premium/LE with pricing), images, tags, description, and rules links. `url` is the game's page on kineticist.com (link it when citing); remakes carry their own `url`. Editions that belong to a remake are listed under that remake. `best_image` (when present) is the one picture to show for the game: its URL, what it shows (backglass, photo, cabinet, flyer or playfield) and its size. Accepts slug (godzilla-2021), OPDB group ID (weeP), or OPDB machine ID (GweeP-MW95j). Use ?include=credits to also get the design team. `newest_edition_year` is the year the newest edition came out, not the year production ended; `in_production` says whether the game is still made.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Game slug, OPDB ID, or Kineticist game ID",
                "type": "string"
              },
              "include_credits": {
                "description": "Include design team credits (designer, artist, programmer, etc.)",
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get game details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
