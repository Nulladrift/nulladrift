        {
          "name": "kineticist_add_to_list",
          "title": "Add to a list",
          "description": "Add one item to the end of one of the member's lists, with an optional note. The id must be the kind the list holds (a games list takes games). Adding something already on the list changes nothing and the answer says so. A list holds up to 500 items. Can't be used on the system lists (Want to Play, Want to Own, Favorites, Following). Acts on the caller's own Kineticist account (the signed-in member, or the API key owner). Agents that make many calls per task use up a free account's daily allowance quickly.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "id": {
                "description": "What to put in the list: a game id (gm_… or the bare UUID), a location id (loc_…), a Hype Index theme id (hyp_…), or a community item id, matching the list's type.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "listId": {
                "description": "The list's id (from kineticist_get_my_lists).",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "llm_model": {
