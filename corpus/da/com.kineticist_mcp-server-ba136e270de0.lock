        {
          "name": "where_to_play",
          "title": "Find where to play",
          "description": "Where to play pinball, or a specific machine: \"where can I play Godzilla near 97214?\", \"where can I play pinball in Chicago?\", \"pinball bars in Portland\". Finds pinball venues near a place: a postal code (\"60601\", \"SW1A 1AA\" with country gb) or a city (\"Chicago\", \"Portland, OR\"). Pass `game` (name or slug) to find venues that have that machine. Returns up to 10 venues, nearest first, with city, distance in miles, machine count, venue kind (bar, arcade…) and `url`, the venue's page on kineticist.com (link it; it has the address and full machine list). `searched` says which place distances are measured from (\"central Chicago, IL\" is the city centre; \"(middle of our venues there)\" means a smaller city placed by its venues); `note` says when these are the nearest anywhere rather than nearby, or when no game has exactly the name asked. A game name that fits several machines answers for the best match (`game`, with its year) and lists the rest in `other_matches`; pass one's slug as `game` to ask about that one. Machine lists come from Pinball Map and can lag.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "country": {
                "description": "Two-letter country code for postal codes outside the US (gb, ca, de…). Default us.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "game": {
                "description": "Only venues that have this game: a name (\"Godzilla\") or slug (godzilla-2021). A slug pins one machine.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "llm_model": {
                "description": "The model identifier you are running as, for example \"claude-opus-4-8\" or \"gpt-5.2\". Pass \"unknown\" if you are not certain. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "place": {
                "description": "Postal code or city, e.g. \"60601\", \"Chicago\", \"Portland, OR\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
