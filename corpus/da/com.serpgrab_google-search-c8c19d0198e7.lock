{
  "lockfileVersion": 2,
  "subjects": {
    "com.serpgrab/google-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.serpgrab.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "serpgrab",
        "version": "0.1.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "google_maps_search",
          "title": "Google Maps search",
          "description": "Businesses and places from Google Maps, 20 per page: name, type, rating and review count, price, address, phone, hours, website, coordinates and place_id. Put the place in the query (\"plumber in denver co\") or pass ll. Each page is one billed search.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Two-letter country code Google searches from (gl), e.g. \"us\", \"gb\", \"de\". Default \"us\".",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "language": {
                "description": "Interface language (hl), e.g. \"en\", \"de\", \"pt-BR\". Default \"en\".",
                "maxLength": 7,
                "minLength": 2,
                "type": "string"
              },
              "ll": {
                "description": "Map position as \"@latitude,longitude,zoomz\", e.g. \"@30.2672,-97.7431,14z\".",
                "pattern": "^@-?\\d{1,2}(\\.\\d+)?,-?\\d{1,3}(\\.\\d+)?,\\d{1,2}(\\.\\d+)?z$",
                "type": "string"
              },
              "page": {
                "description": "Results page, 20 places each. Default 1.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"pizza in austin tx\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:608f8c607b8a0274a5a711c7ea4078d7229623bfca480256cdea1e238266a3f9"
        },
        {
          "name": "google_search",
          "title": "Google search",
          "description": "Real-time Google web results: title, URL, date and snippet for each result, plus the AI Overview, answer box, knowledge panel, local pack, ads and \"People also ask\" when Google shows them. Question-style queries (\"how do I...\", \"what is...\") usually get an AI Overview. Each page read is one billed search, so use pages=1 unless you need more. Usually 2-6 s per page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Two-letter country code Google searches from (gl), e.g. \"us\", \"gb\", \"de\". Default \"us\".",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "language": {
                "description": "Interface language (hl), e.g. \"en\", \"de\", \"pt-BR\". Default \"en\".",
                "maxLength": 7,
                "minLength": 2,
                "type": "string"
              },
              "location": {
                "description": "Search as if from this place, e.g. \"Austin, Texas, United States\". Leave out for a country-wide search.",
                "type": "string"
              },
              "pages": {
                "description": "Result pages to read (about 10 results each), 1-3. Default 1.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The search, as typed into Google.",
                "minLength": 1,
                "type": "string"
              },
              "time": {
                "description": "Only results from the past hour, day, week, month or year.",
                "enum": ["hour", "day", "week", "month", "year"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a5c5d270ade88757382439890da26313070bf4dce280ea620495198399629f91"
        }
      ],
      "digest": "sha256:f9e7fe0d61a82c03152d34a3017e9800c2a94efb279b5451d97c1246941fc1b9"
    }
  }
}
