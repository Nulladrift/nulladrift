        {
          "name": "get_opportunity",
          "description": "Get one SAM.gov notice in full: description, response deadline, set-aside, NAICS and PSC codes, place of performance, contracting office, points of contact, award details for award notices, and the public sam.gov link. Also lists other active notices with the same solicitation number, such as earlier versions, amendments, or awards (with awardee and amount).\n\nPass the 32-character notice ID from search results, or a solicitation number (returns its most recently posted current notice, preferring the solicitation over award notices and justifications). Attachments are not retrieved; open the sam.gov link for them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "notice_id": {
                "description": "32-character SAM.gov notice ID.",
                "pattern": "^[0-9a-fA-F]{32}$",
                "type": "string"
              },
              "solicitation_number": {
                "description": "Solicitation number, used when notice_id is not given.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Opportunity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c247cd75aa7200486ae1e8b466517b3bc6dc8a0ac50e43d7c88886d291e5fb16"
        },
        {
          "name": "search_entities",
          "description": "Answer SAM registration and socioeconomic questions: women-owned/WOSB/EDWOSB, veteran-owned/SDVOSB, HUBZone, 8(a), and small business. Search the monthly public extract by UEI, CAGE, name, NAICS and state; filters combine. any_naics includes secondary codes. Search defaults Active; UEI/CAGE includes inactive. Use the labeled business or SBA code filters below. For NAICS-specific small-business status, request assertions or All and check sbaSmallBusiness; 2X means for-profit, not small. Codes and active registration do not prove current SBA certification; check certificationExitDate and confirm SBA/SAM.gov status. Public-display opt-outs are excluded. Up to 10 records/page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "any_naics": {
                "anyOf": [
                  {
                    "pattern": "^[0-9]{2,6}$",
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  }
                ],
                "description": "Any listed NAICS, 2-6 digits."
              },
              "business_type_code": {
                "description": "SAM business-type codes; ownership is generally self-selected, not SBA certification. Common codes: A2=Woman-Owned Business; 8W=Women-Owned Small Business; A5=Veteran-Owned Business; QF=Service-Disabled Veteran-Owned Business; 23=Minority-Owned Business; 27=Self Certified Small Disadvantaged Business; 8C=Women-Owned Small Business (WOSB) Joint Venture eligible under the WOSB Program; 8D=Economically Disadvantaged Women-Owned Small Business (EDWOSB) Joint Venture; JV=Service-Disabled Veteran-Owned Business Joint Venture; JX=Self-Certified HUBZone Joint Venture; JS=Small Business Joint Venture; FR=Asian-Pacific American Owned; QZ=Subcontinent Asian (Asian-Indian) American Owned; OY=Black American Owned; PI=Hispanic American Owned; NB=Native American Owned; OW=American Indian Owned; 05=Alaskan Native Corporation Owned Firm; 8U=Native Hawaiian Organization Owned Firm; 1B=Tribally Owned Firm; 1E=Indian Economic Enterprise; 1S=Indian Small Business Economic Enterprise; XY=Indian Tribe (Federally Recognized); HK=Community Development Corporation Owned Firm; HQ=DOT Certified DBE; A7=AbilityOne Non-Profit Agency; 1D=Small Agricultural Cooperative; A8=Non-Profit Organization; H2=Community Development Corporation; HB=Historically Black College or University; 1A=Minority Institution; HS=Tribal College; GW=Hispanic Servicing Institution. Other official 2-character business codes are accepted.",
                "maxLength": 2,
                "type": "string"
              },
              "cage_code": {
                "description": "Exact 5-character CAGE code.",
                "pattern": "^[A-Za-z0-9]{5}$",
                "type": "string"
              },
              "include_sections": {
                "description": "Public sections only. Defaults to entityRegistration + coreData; entityRegistration is always included.",
                "items": {
                  "enum": ["entityRegistration", "coreData", "assertions", "All"],
                  "type": "string"
                },
                "type": "array"
              },
              "legal_business_name": {
                "description": "Partial legal or DBA name; punctuation, spacing, ampersands and common company suffixes are normalized. Zero results include separately labeled possible name matches; names alone do not confirm identity.",
                "maxLength": 200,
                "type": "string"
              },
              "page": {
                "default": 0,
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "primary_naics": {
                "anyOf": [
                  {
                    "pattern": "^[0-9]{2,6}$",
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  }
                ],
                "description": "Designated primary NAICS, 2-6 digits."
              },
              "purpose_of_registration": {
                "enum": ["Z1", "Z2", "Z3", "Z4", "Z5"],
                "type": "string"
              },
              "registration_status": {
                "description": "A=Active (search default), E=expired (displayed as Inactive).",
                "enum": ["A", "E"],
                "type": "string"
              },
              "sba_business_type_code": {
                "description": "SBA source codes: A6=SBA Certified 8(a) Program Participant; JT=SBA Certified 8(a) Joint Venture; XX=SBA Certified HUBZone Firm; A4=SBA Certified Small Disadvantaged Business (No longer Active); A9=SBA-Certified Women-Owned Small Business; A0=SBA-Certified Economically Disadvantaged Women-Owned Small Business. A4 is retired. These are monthly source codes, not proof of current certification; check certificationExitDate and confirm with SBA.",
                "enum": ["A6", "JT", "XX", "A4", "A9", "A0"],
                "type": "string"
              },
              "size": {
                "default": 10,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "state_code": {
                "description": "Physical address state, 2-letter USPS code.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "uei": {
                "description": "Exact 12-character UEI.",
                "pattern": "^[A-Za-z0-9]{12}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Entities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce8626acb113a2ec302c53c71a6697c63853273ec69b4d3eae6967b74b3da88d"
        },
        {
          "name": "search_exclusions",
          "description": "Check SAM.gov public exclusion/debarment records by UEI, CAGE, or name. Filters combine. Searches the dated public extract, which is not a complete exclusion history; inactive or terminated historical records may be absent. Every result identifies the source file and date. No matches in the extract is not a live clearance or eligibility determination; confirm current status on SAM.gov.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cage_code": {
                "description": "5-character CAGE; exact match.",
                "pattern": "^[A-Za-z0-9]{5}$",
                "type": "string"
              },
              "classification": {
                "enum": ["Firm", "Individual", "Vessel", "Special Entity Designation"],
                "type": "string"
              },
              "country": {
                "description": "3-character ISO alpha-3 country code, e.g. USA.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "entity_name": {
                "description": "Partial firm or individual name; punctuation, spacing, ampersands and common company suffixes are normalized, including first/middle/last names. Zero results include separately labeled possible name matches; names alone do not confirm identity.",
                "maxLength": 200,
                "type": "string"
              },
              "excluding_agency_code": {
                "maxLength": 100,
                "type": "string"
              },
              "exclusion_program": {
                "enum": ["Reciprocal", "NonProcurement", "Procurement"],
                "type": "string"
              },
              "page": {
                "default": 0,
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "size": {
                "default": 10,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "state_province": {
                "maxLength": 100,
                "type": "string"
              },
              "uei": {
                "description": "12-character Unique Entity ID; exact match.",
                "pattern": "^[A-Za-z0-9]{12}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Exclusions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97ecd9a7efcbe7f38a4c1832d3c822151e67df04d5d21041c7e596dc547744b3"
        },
        {
          "name": "search_opportunities",
          "description": "Search active SAM.gov contract opportunity notices: solicitations, combined synopses, presolicitations, sources sought, special notices, award notices, and justifications.\n\nAll filters combine. Keyword search covers titles and full descriptions. By default, only the latest version of each amended notice is included. Notices whose response deadline has passed are left out, except award notices and justifications; notices with no deadline are also included. Set include_past_deadlines to true to include other past-deadline notices. Results are sorted by soonest deadline, with notices that have no deadline last. Returns up to 100 notices per call with the total match count; use offset to page. Use get_opportunity for a notice's full description and contacts.\n\nData is SAM.gov's public daily file of active notices, not live SAM.gov. Archived notices and attachments are not included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "Text matched against the department, sub-tier, and office names, e.g. Army, Veterans Affairs, NSWC Dahlgren. Field activities post under their own office names, so a command name matches only its headquarters office (NAVSEA matches NAVSEA HQ, not NSWC or NUWC offices).",
                "maxLength": 200,
                "type": "string"
              },
              "deadline_from": {
                "description": "Earliest response deadline date, YYYY-MM-DD, in the deadline's own time zone.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "deadline_to": {
                "description": "Latest response deadline date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include_earlier_versions": {
                "default": false,
                "description": "Include earlier versions of amended notices. SAM.gov's file lists every version of a notice as its own row; by default only the latest version of each is included.",
                "type": "boolean"
              },
              "include_past_deadlines": {
                "default": false,
                "description": "Include notices whose response deadline has already passed. SAM.gov keeps notices active for a while after the deadline; by default they are left out. Award notices and justifications are always included, even when they list a past deadline, and so are notices with no deadline.",
                "type": "boolean"
              },
              "keywords": {
                "description": "Words that must all appear in the title or full description. Put exact phrases in double quotes, e.g. zero trust \"cloud migration\". Word endings are matched loosely (bridge matches bridges).",
                "maxLength": 300,
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "naics_codes": {
                "description": "NAICS codes or prefixes (2 to 6 digits); a prefix such as 5415 matches every code under it.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "notice_types": {
                "description": "Current notice types to include. Omit for all types.",
                "items": {
                  "enum": ["Solicitation", "Combined Synopsis/Solicitation", "Presolicitation", "Sources Sought", "Special Notice", "Award Notice", "Justification", "Justification and Approval (J&A)", "Modification/Amendment/Cancel", "Consolidate/(Substantially) Bundle", "Sale of Surplus Property"],
                  "type": "string"
                },
                "type": "array"
              },
              "office_state": {
                "description": "Two-letter state code of the contracting office. Filled in on nearly every notice, but an office's state is not always where the work happens.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "place_of_performance_state": {
                "description": "Two-letter state code for the place of performance. Most notices leave the place of performance blank, so results also report how many more notices have a contracting office in that state (see office_state).",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "posted_from": {
                "description": "Earliest posted date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "posted_to": {
                "description": "Latest posted date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "psc_codes": {
                "description": "Product and service codes or prefixes, e.g. D3 or R425.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "set_aside_codes": {
                "description": "SAM.gov set-aside codes, e.g. SBA (total small business), 8A, SDVOSBC, WOSB, HZC. NONE means the notice says no set-aside was used.",
                "items": {
                  "enum": ["SBA", "SBP", "8A", "8AN", "HZC", "HZS", "SDVOSBC", "SDVOSBS", "WOSB", "WOSBSS", "EDWOSB", "EDWOSBSS", "VSA", "VSS", "ISBEE", "IEE", "BICiv", "LAS", "ESB", "NONE"],
                  "type": "string"
                },
                "type": "array"
              },
              "solicitation_number": {
                "description": "Exact solicitation number.",
                "maxLength": 100,
                "type": "string"
              },
              "sort": {
                "default": "deadline",
                "description": "deadline: soonest response deadline first. newest: most recently posted first. relevance: best keyword match first (needs keywords).",
                "enum": ["deadline", "newest", "relevance"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Opportunities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1c85ce5b94ddbad116f747eaef27c2c75fb91137dae64bf0e4adcdc2ba5991b"
        },
        {
          "name": "summarize_opportunities",
          "description": "Count active SAM.gov notices grouped by agency, sub-tier, office, NAICS, PSC, set-aside, notice type, place-of-performance state, contracting office state, or posted month. Accepts the same filters as search_opportunities, e.g. counts of open solicitations under one NAICS by set-aside, or which agencies posted the most sources sought notices this quarter.\n\nCounts cover active notices in SAM.gov's public daily file, including notices posted in earlier fiscal years that remain active. This is not a complete historical archive; archived notices are not included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "Text matched against the department, sub-tier, and office names, e.g. Army, Veterans Affairs, NSWC Dahlgren. Field activities post under their own office names, so a command name matches only its headquarters office (NAVSEA matches NAVSEA HQ, not NSWC or NUWC offices).",
                "maxLength": 200,
                "type": "string"
              },
              "deadline_from": {
                "description": "Earliest response deadline date, YYYY-MM-DD, in the deadline's own time zone.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "deadline_to": {
                "description": "Latest response deadline date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "group_by": {
                "description": "Field to group counts by.",
                "enum": ["agency", "sub_tier", "office", "naics", "psc", "set_aside", "notice_type", "place_of_performance_state", "office_state", "posted_month"],
                "type": "string"
              },
              "include_earlier_versions": {
