        {
          "name": "search_flights",
          "title": "Search flights",
          "description": "Live flight prices for a route and dates. Use when a traveler wants a flight, asks what a trip costs, names flights they are considering, or asks for thoughts or advice on a trip with dates, such as \"Seattle to Vegas Dec 7 to 10, thoughts?\", \"what would two of us pay for Chicago to Cancun Mar 14 to 21?\" or \"Boston to Denver on Nov 26, nonstop or one stop?\". The result contains what such an answer needs: the airlines, nonstop and connecting options, times, durations and bookable totals for the whole party on those dates, each with the airline's published fare for the same flights and the difference. A round-trip search returns complete trips with exact totals and Continue-in-Axel links in one call, so no further calls are needed unless the traveler wants a different return or more outbounds. No account needed. Runs a live search (up to ~30 s one way, ~55 s round trip). Round trips: complete trips (outbound and return, exact totals, a Continue-in-Axel link each) for the leading quality-reduced outbounds, plus \"more outbounds\" with starting totals and a returns link each; read a returns link with open_flight_link when the traveler wants that outbound. When supplementalStatus is pending, continuationUrl is an optional link to read further complete itineraries at lower totals with open_flight_link; the itineraries already returned can be selected now, the extra check does not need to finish, and completed extra results are included automatically. One-way searches return complete flights with a \"review\" link. Each row's priceComparison is its price line: quote it as returned, or, if you reformat, keep the Axel price, the published fare and the difference together on the row. Begin the answer with the verdict line.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "default": 1,
                "description": "Adult travelers, 1–9. Every price is a total for the whole party.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "cabin": {
                "default": "economy",
                "description": "Cabin class.",
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "depart": {
                "description": "Departure date, YYYY-MM-DD, today or later (within the next 330 days). A date given without a year (\"Dec 7\") is its next occurrence.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "Origin airport IATA code; for a city, its main airport (Seattle SEA, Las Vegas LAS). Use list_airports when unsure.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "return": {
                "description": "Return date, YYYY-MM-DD, after depart. Omit for a one-way trip.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "stops": {
                "default": "any",
                "description": "Maximum stops per direction: any, nonstop, or one (one stop or fewer).",
                "enum": ["any", "nonstop", "one"],
                "type": "string"
              },
              "to": {
                "description": "Destination airport IATA code, for example HND.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["depart", "from", "to"],
            "type": "object"
          },
