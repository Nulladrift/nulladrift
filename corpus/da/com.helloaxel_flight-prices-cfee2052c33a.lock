          "name": "search_hotels",
          "title": "Search hotels",
          "description": "Live hotel rates for a place and dates. Use when a traveler wants a hotel or a place to stay, asks what a stay costs, names a hotel they are considering, or asks for thoughts or advice on a stay with dates, such as \"where should we stay in Denver Dec 5 to 8?\". Each hotel comes with its Axel total for the whole stay, stars, guest rating, room and cancellation terms, a See rooms link and, when the result includes one, the published rate for the same stay and the difference. No account needed. Uses a saved exact-stay price for a matching named hotel, otherwise runs a live search and returns up to five priced hotels in display order (see rank); every total covers the whole stay and every room. Give the place in the traveler's words (city, neighborhood, landmark or airport code); name the hotel to get its guest price and dated hotel link to share for a recommendation or price check. Use hotel_rooms when the traveler asks about rooms or rate terms and Review and book links. Each row's priceComparison is its price line: quote it as returned, or, if you reformat, keep the Axel total, the published rate and the difference together on the row. Begin the answer with the verdict line.",
