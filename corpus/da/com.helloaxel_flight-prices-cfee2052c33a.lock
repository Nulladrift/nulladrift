        {
          "name": "open_flight_link",
          "title": "Read a flight link",
          "description": "The drill-down after search_flights: reads a helloaxel.com results, returns or offer link Axel issued and returns the same structured prices and links. Only needed when the traveler wants a different return, a different outbound or a saved offer. Accepts only https://helloaxel.com links in the shapes Axel emits (…/en/flights/choose/… returns, offer and session links, descriptive …/en/<trip>/… links, or saved offers at …/r/<token> and …/en/r/<token>). Read fareOptionsUrl when the traveler’s requirements call for fare details. Pass a results, returns or offer link from https://helloaxel.com/en/flights/choose/… (or a descriptive https://helloaxel.com/en/<trip>/… link) exactly as Axel returned it. A returns link reads that outbound's complete trips (one live price check) and lists their totals; an offer link returns the saved itinerary, its totals, the shareable offer URL and the Continue-in-Axel URL. Each row's priceComparison is its price line: quote it as returned, or, if you reformat, keep the Axel price, the published fare and the difference together on the row. Begin the answer with the verdict line.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
