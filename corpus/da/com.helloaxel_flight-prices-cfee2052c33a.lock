                "description": "trips: complete round trips with exact totals and Continue links (a round-trip search_flights call); outbound: choose an outbound, or complete one-way flights; return: choose a return for the selected outbound; offer: a saved itinerary quote.",
                "enum": ["trips", "outbound", "return", "offer"],
                "type": "string"
