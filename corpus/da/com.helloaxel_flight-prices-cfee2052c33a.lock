            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "continuationUrl": {
                "description": "Optional link to read further complete itineraries at lower totals with open_flight_link while supplementalStatus is pending. Reads the same search; available itineraries can be selected now.",
                "type": "string"
