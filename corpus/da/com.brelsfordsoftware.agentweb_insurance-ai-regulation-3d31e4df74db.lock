{
  "lockfileVersion": 2,
  "subjects": {
    "com.brelsfordsoftware.agentweb/insurance-ai-regulation": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentweb.brelsfordsoftware.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agentweb",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "dataset_provenance",
          "description": "Return the dataset's source, as-of date, coverage counts, and per-field confidence. Call this before relying on any answer, to check how current the underlying data is and which fields are primary-source verified.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fa745feba3cfb88686de6a0760bdd808fc129217430d0c2dee4a0e94f2963f31"
        },
        {
          "name": "list_jurisdictions",
          "description": "List US jurisdictions by regulatory posture. Use posture 'adopted_model_bulletin' for states that adopted the NAIC model bulletin, 'own_framework' for states running their own insurance-specific AI framework (CA, CO, NY, TX), or omit for all.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "posture": {
                "description": "adopted_model_bulletin = adopted the NAIC bulletin; own_framework = runs its own insurance-specific AI framework (CA, CO, NY, TX); no_model_bulletin = has not adopted it but has other tracked AI-related insurance activity. Omit for all.",
                "enum": ["adopted_model_bulletin", "own_framework", "no_model_bulletin"],
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD). Only jurisdictions that acted on or after this date. Use for questions like 'which states adopted in 2025?'",
                "type": "string"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD), inclusive upper bound",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:52c2eabf63706cc521d421e3c8dca48163ff159543200db51753baa6332dda4e"
        },
        {
          "name": "lookup_jurisdiction",
          "description": "Look up one US jurisdiction's insurance-AI regulatory posture: whether it adopted the NAIC model bulletin, runs its own framework, or has other AI-related insurance legislation, with citations, dates and status. Call this when asked what a specific state requires, whether a state adopted the NAIC AI model bulletin, or what AI insurance legislation a state has. Note: not adopting the bulletin does NOT mean a state is unregulated — check other_activity in the response.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "jurisdiction": {
                "description": "Two-letter code or full name, e.g. 'CO' or 'Colorado'",
                "type": "string"
              }
            },
            "required": ["jurisdiction"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c98642c1377578997c1c8c82de60801659a83fd8c838284be2c90ed59ddb2961"
        }
      ],
      "digest": "sha256:c52e8b1630a9ac4f2754f17dafa5f4ea19588331f56d5a9771f8a21b4a019402"
    }
  }
}
