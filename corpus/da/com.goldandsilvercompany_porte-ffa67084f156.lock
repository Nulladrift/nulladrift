        {
          "name": "rappel_expert",
          "title": "Être rappelé par l'agence",
          "description": "Asks the Gold & Silver Company team to call the person back. ONLY when the person explicitly asks for it and gives their own number in international format (+32…; BE FR NL LU DE GB CH ES IT PT). Optional: subject (max 200 characters, quoted to the team, never interpreted), slot (matin | apres_midi | indifferent). Call back during opening hours, as soon as possible, no time commitment. Number kept 30 days at most (GDPR 6.1.b): relay the `information` sentence. Limits apply.",
          "inputSchema": {
            "properties": {
              "creneau": {
                "description": "Preferred slot (optional).",
                "enum": ["matin", "apres_midi", "indifferent"],
                "type": "string"
              },
              "langue": {
                "description": "Language of the answer (default fr).",
                "enum": ["fr", "en", "nl", "de"],
                "type": "string"
              },
              "sujet": {
                "description": "Short subject of the call (optional, max 200 characters).",
                "maxLength": 200,
                "type": "string"
              },
              "telephone": {
                "description": "Phone number in international format (+32…).",
                "type": "string"
              }
            },
            "required": ["telephone"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "creneau": {
                "type": "string"
              },
              "enregistre": {
                "type": "boolean"
              },
              "identifiant": {
