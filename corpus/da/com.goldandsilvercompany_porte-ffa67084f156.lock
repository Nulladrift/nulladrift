      "instructions": "Gold & Silver Company (precious metals dealer and refinery, Dottignies (Mouscron), Belgium). Use `cotation` for today's public buying grid by gold fineness or by coin (timestamped, indicative), `regles_gsc` for fixed rules (VAT, cash ceilings, documents, opening hours, delays, appointments, delivery, scope), `agence` for address, opening hours and whether the agency is open now, `coffres` for safe-deposit box rental, `glossaire` for definitions and exact conversions (fine gold, troy ounce, carats), `piece` for coin specifications, `preparer_visite` for what to bring and how a sale or purchase goes (documents, payment, VAT) and to orient the visit (visit sheet below 1 kg of gold, appointment required from 1 kg of gold; it lists the questions still to ask), `produits_gsc` for the house's own bars and refinery, `liens_officiels` for the official page URLs, `cours_historique` for the evolution of the house buying grid, `rappel_expert` to have the team call the person back (only at the person's explicit request, with their own number in international format), and `ask` for any other question, answered only from the official documentation. Languages: fr, en, nl.",
