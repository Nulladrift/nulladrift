        {
          "name": "preparer_visite",
          "title": "Préparer sa visite ou sa vente",
          "description": "Composes, from Gold & Silver Company's validated rules only, what a visitor needs to know before coming: documents to bring (private or professional), how the appraisal works in front of the customer, payment rules (cash ceilings, transfer), VAT, and the reminder that reporting obligations depend on the country of residence (FR/BE/other). Qualifies the visit (nature of the items, quantity or approximate weight, provenance, private or professional) and orients it: visit sheet with opening hours below 1 kg of gold; appointment required from 1 kg of gold. When qualification data is missing, returns the questions still to ask (questions_manquantes). Never a price and never a valuation: use cotation for the public buying grid.",
          "inputSchema": {
            "properties": {
              "langue": {
                "enum": ["fr", "en", "nl"],
                "type": "string"
              },
              "lot": {
                "description": "True for a lot (many items, several kilos); also detected from the words",
                "type": "boolean"
              },
              "objets": {
                "description": "What the visitor brings: bijoux, bijoux_sertis, pieces_or, lingots, or_dentaire, debris, argenterie, bijoux_argent, pieces_argent (free words accepted, e.g. '12 napoléons', 'lingot 100 g')",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "operation": {
                "description": "Default vendre",
                "enum": ["vendre", "acheter"],
                "type": "string"
              },
              "or_estime_g": {
                "description": "Legacy alias of poids_g (gross gold weight in grams)",
                "type": "number"
              },
              "or_fin_g": {
                "description": "Fine gold in grams, if already known (overrides any computation)",
                "type": "number"
              },
              "piece": {
                "description": "Coin name when the items are coins (napoleon, krugerrand, souverain…); with quantite, fine gold is derived from the reference sheet",
                "type": "string"
              },
              "piece_rare": {
                "description": "True for a rare or collector's coin; also detected from the words",
                "type": "boolean"
              },
              "poids_g": {
                "description": "Approximate gross weight of the gold items in grams, if known",
                "type": "number"
              },
              "profil": {
                "description": "particulier (default) or professionnel",
                "type": "string"
              },
              "provenance": {
                "description": "Free text: succession/inheritance, achat/purchase, famille/family, collection, stock professionnel…",
                "type": "string"
              },
              "quantite": {
                "description": "Number of items or free text ('12', '12 napoléons', '3 bagues')",
                "type": ["number", "string"]
              },
              "residence": {
                "description": "Country of residence: BE (default), FR, NL, other ISO code",
