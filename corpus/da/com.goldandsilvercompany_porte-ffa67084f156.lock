          "name": "cotation",
          "title": "Grille de rachat du jour",
          "description": "Today's public buying grid of Gold & Silver Company, timestamped: gold by fineness (9K, 14K, 18K, 22K in EUR per gram; 24K/999 refers to the live rate) or by coin/bar (napoleon_20f, pesos_50, argent_lingot_1kg in EUR per piece). Optional weight in grams or number of pieces gives an indicative amount; `objets` quotes several items in one call with a total. The firm price is set at the office after weighing and fineness check. Source: the public grid on the website, never internal tools.",
