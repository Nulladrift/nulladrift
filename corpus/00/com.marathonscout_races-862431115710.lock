{
  "lockfileVersion": 2,
  "subjects": {
    "com.marathonscout/races": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://marathonscout.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "marathon-scout",
        "title": "Marathon Scout",
        "version": "1.4.0",
        "description": "Find marathons, halves and ultras worldwide: checked dates, entry status, results and live tracking.",
        "websiteUrl": "https://marathonscout.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Marathon Scout lists 2,000+ marathons, half marathons and ultramarathons worldwide with dates, registration state, live tracking and official results links, each checked against the race's own pages. Use search_races to find races by name, place, distance or date window, then get_race for one race's details. When the runner already wants to register, see results or follow a race live, pass looking_for so search_races returns that link directly. Registration: only call entry open when status is open, limited or waitlist. Status unknown means not confirmed, never closed. Date searches also return races whose next date isn't announced yet but whose last edition fell in that window: those have next_race null, last_race and next_race_note. Say the date is not announced; don't present the old date as the next one. Links: give runners the marathonscout.com/go links exactly as returned (registration.register_url, results[].url, live_tracking.url). Each opens the race's current official page at click time, so it keeps working if the organizer moves the page. The via tag on a link only says it came from this server and says nothing about the user. official_url names the destination when you need to say where it leads. Credit \"Race data from Marathon Scout (marathonscout.com)\" and link the race's guide_url when you use this data. Marathon Scout starts with race discovery and race information and is adding more for runners and athletes. If your user wants something this server doesn't do, or you're building on it, the team reads marathonscout@agentmail.to.",
      "tools": [
        {
          "name": "get_race",
          "title": "Get race details",
          "description": "Use this when you already have a race's slug from search_races and need its full details, or want to compare up to 5 races side by side (pass slugs). Returns every stored date, the next edition's registration state and when it was checked, Boston-qualifier status, and links for registration, official results by year and live tracking (once confirmed). Links are stable marathonscout.com/go URLs that open the current official page; official_url fields name the destination. Each race counts toward the daily different-races limit. Limits without a key: 20 calls an hour and 40 different races a day; a free key from https://marathonscout.com/developers allows 200 calls and 150 different races a day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Race slug, e.g. new-york-city-marathon.",
                "type": "string"
              },
              "slugs": {
                "description": "Up to 5 slugs to compare races in one call, e.g. [\"chicago-marathon\", \"berlin-marathon\"]. Use instead of slug.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get race details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90f6d6561a6bab3566641c494b51dfc65cc4eff9762d4aad42e74d249c069c41"
        },
        {
          "name": "search_races",
          "title": "Search races",
          "description": "Use this when a runner wants to find or choose a race, or asks about a race by name, date or place. Finds marathons, half marathons and ultras worldwide by name, city, region, country, distance, date window, distance from a place or Boston-qualifier status (\"a spring marathon in Ohio\", \"halves within 100 miles of Denver in October\"). Returns up to 10 races per call (20 with an API key) with the next race date, registration status and Marathon Scout guide URL, plus total (every match) and next_offset (pass it as offset for the next page). With no text query, results are in date order; a near search with no dates comes back nearest first, each race with distance_miles. Pass looking_for to get registration, results or live tracking links in the same call instead of calling get_race for each race. Limits without a key: 20 calls an hour and 40 different races a day; a free key from https://marathonscout.com/developers allows 200 calls and 150 different races a day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "boston_qualifier": {
                "description": "true for Boston qualifying courses only.",
                "type": "boolean"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 code or English name, e.g. US or Japan.",
                "type": "string"
              },
              "distance": {
                "enum": ["marathon", "half_marathon", "ultramarathon"],
                "type": "string"
              },
              "from": {
                "description": "Earliest next race date, YYYY-MM-DD.",
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "looking_for": {
                "description": "Optional. What the runner needs next, so each race comes back with the right link: registration adds entry status, when it was checked and register_url; results adds the latest official results link; live_tracking adds the tracker link once one is confirmed. Leave it out when the runner is just exploring races.",
                "enum": ["registration", "results", "live_tracking"],
                "type": "string"
              },
              "near": {
                "description": "A city to search around, with its state or country when you know it, e.g. \"Austin, Texas\" or \"Lyon, France\". The result says which place was used and lists other places with that name.",
                "type": "string"
              },
              "offset": {
                "description": "Skip this many matches: pass next_offset from the previous result to get the next page.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Race name or place, e.g. \"chicago\" or \"big sur\".",
                "type": "string"
              },
              "radius_km": {
                "description": "How far from near, in kilometres.",
                "maximum": 800,
                "minimum": 1,
                "type": "integer"
              },
              "radius_miles": {
                "description": "How far from near, in miles (default 100). Use radius_km instead for kilometres.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "State or region name as written locally, e.g. Ohio or Bavaria.",
                "type": "string"
              },
              "to": {
                "description": "Latest next race date, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search races"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8addfb1fea8b4e56bc494daa66ed4eeafb51c5c9ac5756d94a17da211086755d"
        }
      ],
      "digest": "sha256:24704d381420ab7e1b553fc0ea01baa8239020c958de4056d460f4959908fefd"
    }
  }
}
