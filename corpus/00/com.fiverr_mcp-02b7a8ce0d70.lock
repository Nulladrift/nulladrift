        },
        {
          "name": "talk_to_mira",
          "title": "Talk to Mira",
          "description": "Talk to Mira, Fiverr's headhunter, and return her reply.\n\nUSE THIS when the user asks for help with the hiring itself, not just\nto see people: writing or scoping a brief for a project, getting\nquotes, what the work would cost, choosing between options (agencies,\nfreelancers, approaches), working out what kind of talent a project\nneeds (\"no idea what kind of developer I need\"), or whether to\noutsource at all. It covers any kind of work, from a designer,\ndeveloper, video editor or translator through an accountant, a\nmarketer, a lawyer to review a contract, a bookkeeper, a voice actor:\nwhat makes it Mira's is that the user wants help with the hiring\nitself. Also use it after find_freelancers results when the user takes\nthe Mira offer, or says the results don't fit and adds more about the\nproject. Once a hiring conversation is underway, the user's further\nmessages about it go here too, their answers to Mira's questions\nincluded.\n\nUSE find_freelancers INSTEAD when the user wants to find, browse or\ncompare freelancers, or describes a need or a problem without asking\nfor help with the hiring itself (\"find me a python developer\", \"my\nsite looks dated\", \"I need a logo for my coffee shop\"). A budget or\ndeadline alone does not make it a Mira conversation. Also when the\nuser, during a Mira conversation, asks to see freelancers right now:\nsearch with what they told Mira, and tell them in one line that Mira's\nbrief stays open.\n\nSEND ONLY WHAT MIRA NEEDS: the user's own words about the work they\nwant done. Never the rest of the conversation, never what they said\nabout other topics, and no personal details they have not chosen to\ntell Mira (contact details, account numbers, passwords or anything\nelse sensitive). If a message mixes the hiring need with other things,\nsend only the part about the need. When the user moves to Mira from\nsearch results, send their own description of the project, from\nearlier in the chat too, plus what they just added.\n\nMira runs the real conversation server-side, with the live Fiverr\nmarket behind her, so anything you improvise both contradicts her and\nnever reaches her.\n\nPass those words VERBATIM as ``message``. A ``status`` of\n\"working\" with a non-empty reply is NORMAL: Mira answered and her team\nis still updating the brief in the background; do not wait or mention\nit. Only when ``reply`` says she is still working: on a card host the\ncard picks her reply up itself, so add nothing; with no card, call\nthis again after a moment with an EMPTY ``message`` and the returned\n``turnId`` as ``turn_id``, which picks up her reply and sends nothing.\n\nWhen the result carries ``briefReady``, the brief is ready: call\ntake_brief_to_mira to give the user the way on to Fiverr. If Mira talks\nabout approving the brief or starting her search, that is the same\nstep: it happens in Mira on Fiverr, through take_brief_to_mira. A\n``state`` of \"moved\" means the user already took this conversation to\nFiverr: nothing was sent, so relay the reply and its link.\n\nOne conversation is one hiring need: never mention projects, and if\nthe user wants to hire for a second, unrelated role, suggest they start\na new conversation for it.\n\nWHAT THE USER SEES: on a host that renders the Mira card (Claude.ai,\nClaude Desktop, ChatGPT) the card shows ``reply`` as Mira's own\nmessage and any ``widget`` (her question) with its answer options as\nbuttons, and the user answers in the card itself. So do NOT repeat\nthe reply, the question or its options: one short line pointing at\nthe card is the most to add, and usually nothing is right. The\nresult's ``assistantNote`` says the same. Only on a host with no card\n(a terminal, the API) relay ``reply`` VERBATIM as Mira's words, and\nlist a widget's ``options`` after it as plain text (one short line\neach, by their labels). If the user answers one of her questions in\nchat instead, send that answer here as the next ``message``.\n\n``widget_id`` and ``option_id`` are filled by the Mira card itself when\nthe user taps an answer in it. Leave both empty.\n\nWORKSPACE KEY: this connector has no sign-in, so every reply carries workspaceKey and every call passes it back as workspace_key. Leave it empty only on the first talk_to_mira of a conversation, which starts the workspace. Every other Mira tool refuses a call without it, and a later talk_to_mira without it starts another, empty workspace. Never invent a key.",
          "inputSchema": {
            "properties": {
              "message": {
                "title": "Message",
                "type": "string"
              },
              "option_id": {
                "default": "",
                "title": "Option Id",
                "type": "string"
              },
              "turn_id": {
                "default": "",
                "title": "Turn Id",
                "type": "string"
              },
              "widget_id": {
                "default": "",
                "title": "Widget Id",
                "type": "string"
              },
              "workspace_key": {
                "default": "",
                "description": "The workspaceKey an earlier reply in this conversation returned. Send \"\" only on the first talk_to_mira of a conversation, which starts the workspace.",
                "title": "Workspace Key",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "talk_to_miraDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Talk to Mira"
          },
          "behavior": {
