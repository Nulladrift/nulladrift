        {
          "name": "take_brief_to_mira",
          "title": "Continue in Mira",
          "description": "Sign in or sign up on Fiverr once the brief is ready, and the brief goes with them.\n\nWHEN TO CALL IT: as soon as a talk_to_mira result carries ``briefReady``,\nand whenever the user wants to move on from the brief: see who could\ndo the work, get quotes, approve the brief, hire. Finding and hiring\nthe people happens in Mira on Fiverr, not in this chat, and this is\nthe way there. Offer it once when the brief becomes ready; never push\nthe user to sign in before they want to move on.\n\nIF THE USER DECLINES TO SIGN IN but still wants to see freelancers\nnow, call find_freelancers with the ``summary`` this tool returned as\n``brief``, its budget fact as the budget filter and its timing fact as\nthe delivery time (skip any with a null value). Do this only when they\nask; never offer search in place of signing in.\n\nWhat it returns, by ``state``:\n- \"ready\": ``signInUrl``, a link that signs the user in to Fiverr (a\n  new user signs up on the same page) and moves this conversation's\n  brief into their account, where Mira opens it ready to go. It works\n  for one day; call this again for a fresh one.\n- \"brief_not_ready\": Mira still needs a few details. Keep the\n  conversation going with talk_to_mira and call this again once a result\n  carries ``briefReady``.\n- \"moved\": the user already signed in and the brief is in their\n  account. ``openUrl`` opens it in Mira.\n- \"no_conversation\": Mira has nothing from this user yet. Send their\n  request to talk_to_mira first.\nBefore the move it also carries the brief: ``title``, ``summary``,\n``facts`` (talent, timing and budget; a null ``value`` is one the user\nhas not settled) and every section in ``brief``.\n\nWHAT THE USER SEES: on a card host the card shows the brief (its\ntitle, summary, talent, timing and budget), a \"Sign up to continue\"\nbutton that opens the link and a \"View brief\" button that opens the\nwhole brief inside the card (once moved, an \"Open in Mira\" button\ninstead). So do not paste the link or the brief again; one short line\npointing at the button is enough. Before the brief is ready the card\nshows the brief so far with NO sign-up button, so do not mention one.\nWith no card, give the user the link yourself as a clickable link,\nwith one line on what it does: they sign up or sign in with Fiverr and\ntheir brief comes with them.\n\nWORKSPACE KEY: this connector has no sign-in, so every reply carries workspaceKey and every call passes it back as workspace_key. Leave it empty only on the first talk_to_mira of a conversation, which starts the workspace. Every other Mira tool refuses a call without it, and a later talk_to_mira without it starts another, empty workspace. Never invent a key.",
          "inputSchema": {
            "properties": {
              "workspace_key": {
                "default": "",
                "description": "The workspaceKey an earlier reply in this conversation returned. Send \"\" only on the first talk_to_mira of a conversation, which starts the workspace.",
                "title": "Workspace Key",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "take_brief_to_miraDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Continue in Mira"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://mira/card/a16c338968b1",
            "openai/toolInvocation/invoked": "Sign-in link ready",
            "openai/toolInvocation/invoking": "Getting your sign-in link",
            "ui": {
