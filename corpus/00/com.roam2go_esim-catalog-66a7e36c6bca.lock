      "instructions": "Search Roam2Go travel eSIM data plans (218 countries and territories, plus 17 regional and global plans) and get a direct purchase link. Prices include VAT. Always check each plan's \"activation\" field to tell the customer when validity starts: \"first-usage\" starts on first connection at the destination, \"installation\" starts when the eSIM is installed, and \"unknown\" means you should not state either — the purchase email always says which one applies. When showing how much data a plan includes, always use the \"data_label\" field verbatim (e.g. \"500 MB\", \"5 GB\", \"unlimited\"); never show the raw \"data_gb\" number, which is an exact binary fraction and reads wrong (500 MB is 0.48828125 GB). Give the customer the links in the language they are writing in: each plan has \"product_urls\" and \"checkout_urls\" with the same page and the same purchase link in ca, es, en, fr, it, de and pt; use \"en\" for any other language (\"product_url\" and \"checkout_url\" are the English ones). Describe unlimited plans as they are, in positive terms, with that plan's own \"fair_use\" figures (do not label them as a \"fair use\" policy or \"FUP\"): \"gb_per_day\" GB per day at full speed (show values below 1 in MB), then \"speed_after_mbps\" Mbps (do not add \"until the daily reset\": some plans have further lower steps), and \"never_cut\": true means the connection is never cut off. When \"no_daily_quota\" is true there is no daily quota: say \"unlimited, up to <speed_after_mbps> Mbps for the whole trip, no daily quota\". When \"gb_per_day\" is null and \"no_daily_quota\" is not true, say only \"unlimited, up to <speed_after_mbps> Mbps\" (plus \"never cut off\" when \"never_cut\" is true) and never mention a daily allowance or reset. If \"fair_use\" is null, or one of its values is null, do not state that figure. When a plan's \"voice\" field is not null, always say whether the calls are local only (\"international_calls\": false = calls within the destination country only; true = international calls with a US-based +1 number; null = do not state it).",
