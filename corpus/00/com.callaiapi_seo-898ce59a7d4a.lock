        {
          "name": "domain_check_results",
          "title": "Read a domain check",
          "description": "Progress and per-domain verdicts of a check started with domain_check_start: verdict, reason, first archive year, stable years, Baidu results, referring domains and spam score. A check can take minutes; rows stay pending until their steps finish. Reading is free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "description": "The \"next\" value of the previous page.",
                "type": "integer"
              },
              "check_id": {
                "description": "The id from domain_check_start.",
                "type": "string"
              },
              "limit": {
                "description": "Rows per page, up to 200 (default 50).",
                "type": "integer"
              },
              "verdict": {
                "description": "Only rows with this verdict.",
                "enum": ["pending", "ok", "suspect", "bad", "error"],
                "type": "string"
              }
            },
            "required": ["check_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
