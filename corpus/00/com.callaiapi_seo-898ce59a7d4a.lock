              "device": {
                "description": "Default desktop.",
                "enum": ["desktop", "mobile"],
                "type": "string"
              },
              "keyword": {
                "description": "Search query. Supports operators such as site:example.com.",
                "type": "string"
              },
              "language_code": {
                "description": "Language code, e.g. en (default), de, fr, ja, es, pt, zh-CN.",
                "type": "string"
              },
              "location_code": {
                "description": "DataForSEO location code. 2840 = United States (default), 2826 = UK, 2276 = Germany, 2250 = France, 2392 = Japan, 2356 = India, 2076 = Brazil.",
                "type": "integer"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
