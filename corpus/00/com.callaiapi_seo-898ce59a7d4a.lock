          "digest": "sha256:35b609ab5b58bbb1adb610f4f9c29d40126053ca3ed977bc6ef7b910829851e1"
        },
        {
          "name": "domain_check_start",
          "title": "Start a domain check",
          "description": "Checks up to 100 domains (for buying expired or used domains): web archive history, Baidu index and backlinks, ending in a clean, suspect or rejected verdict with reasons. Charged per domain, about $0.02. Set dry_run first to see the exact cost and show it to the user. Runs in the background; read progress with domain_check_results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domains": {
                "description": "Domains to check (max 100).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "dry_run": {
                "description": "Only return the cost; nothing is started or charged.",
                "type": "boolean"
              },
              "rules": {
                "description": "Optional pass rules; anything left out uses the defaults. Fields: tlds (string[]), firstSeenBy (year), minStableYears, noHistory (pass|suspect|reject), minBaiduIndexed (0–10), minReferringDomains, maxSpamScore (0–100).",
                "type": "object"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
