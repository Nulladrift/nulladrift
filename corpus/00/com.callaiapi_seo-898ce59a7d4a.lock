        {
          "name": "dataforseo_request",
          "title": "Any DataForSEO v3 endpoint",
          "description": "Calls any DataForSEO v3 endpoint directly when no dedicated tool fits (Google Maps, YouTube, Amazon keywords, Google Trends, LLM mentions, WHOIS, technologies, task_post/task_get and more). Body and response follow the DataForSEO v3 docs at https://docs.dataforseo.com/v3/. Billed at the endpoint's DataForSEO price; task_get and tasks_ready calls are free. Always set a limit or filters: endpoints without them can be expensive.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "Array of task objects for POST requests.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "method": {
                "description": "POST for live and task_post endpoints (default), GET for task_get and tasks_ready.",
                "enum": ["POST", "GET"],
                "type": "string"
              },
              "path": {
                "description": "Path below /v3/, e.g. \"serp/google/maps/live/advanced\" or \"serp/google/organic/task_get/advanced/<task_id>\".",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
