      "serverInfo": {
        "name": "callai-seo",
        "title": "CallAI SEO Data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CallAI SEO tools return live search data (Google/Bing SERP, keyword volume and difficulty, competitor rankings, backlinks, on-page audits) from DataForSEO, plus site checks and domain history. Every tool call needs an API key. DataForSEO tools are billed to the account that owns it, pay-as-you-go, and each result reports billed_usd. Tools described as free need the key but no balance, within a daily allowance. Prefer the dedicated tools; use dataforseo_request only when none fits, and always set a limit. Default market is location_code 2840 (United States) with language_code en; pass both for other markets. Batch keywords into one keyword_overview call instead of one call per keyword.",
      "tools": [
        {
          "name": "backlinks_summary",
          "title": "Backlink profile summary",
          "description": "Backlink totals for a domain: domain rank (0–1000), backlinks, referring domains, nofollow share, broken backlinks, spam score and first-seen date. About $0.02 per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "target": {
                "description": "Domain such as example.com.",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:773cd25083a58ac2fe59bfa84c804fb1851b27fe06ceef93b00ef7ae23cd0f12"
        },
        {
          "name": "bing_serp",
          "title": "Bing SERP",
          "description": "Live Bing organic search results for a keyword in a given country and language: ranks, titles, URLs, snippets. Billed per call (about $0.002 for depth 10).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "depth": {
                "description": "Number of results to fetch, 10–100 (default 10). Cost grows with depth.",
                "type": "integer"
