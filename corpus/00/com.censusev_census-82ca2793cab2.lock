      },
      "instructions": "Census EV lists electric and plug-in hybrid vehicles for sale in the United States. Call list_models to learn make and model spellings; search_listings to find cars (give a zip for nearby results; its breakdown summarises every match, and detail=full returns every field); get_listing for one car's full record and price history; compare_listings to set two to five cars side by side by VIN; battery_warranty for a model year's battery warranty and whether it is in force at a mileage; market_snapshot for a model's counts, median asking prices by year and price trend. A car's seller.url forwards through censusev.com to the dealer's own page, which is where the car is bought; seller.name and seller.domain say where it leads. last_seen is the day a car was last seen for sale. battery_warranty on a get_listing or compare_listings record is that car's own battery-warranty standing, as its page gives it. asking_vs_similar says whether the asking price is below, typical of or above similar cars on Census EV, listed now or in the last 30 days; it compares asking prices, is not an appraisal, and is absent when a car could not be compared, which includes new cars. Facts marked estimated are not the manufacturer's own figure, and an absent field is one the site does not know. Results are as of the as_of timestamp.",
      "tools": [
        {
          "name": "battery_warranty",
          "title": "Battery warranty by model year",
          "description": "The manufacturer's high-voltage battery warranty for a make, model and model year, as the Census EV warranty checker gives it: the term in years and miles (with the trims each term covers where the terms differ by trim), whether it is still in force at an odometer reading where that can be established, the battery capacity the warranty guarantees, and whether coverage transfers to a later owner. A term is marked estimated when it is not the manufacturer's own figure. Returns established: false and no term when the versions of that model year disagree or have not been researched. Includes the model's battery-warranty fact sheet on censusev.com where one exists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "make": {
                "description": "Make, e.g. \"Kia\". Case, spacing and common short forms (\"Chevy\", \"VW\") are accepted.",
                "type": "string"
              },
              "mileage": {
                "description": "Odometer reading in miles. With it, status says whether the warranty is in force where that can be established.",
                "minimum": 0,
                "type": "integer"
              },
              "model": {
                "description": "Model, e.g. \"EV6\". Punctuation and spacing are ignored.",
                "type": "string"
              },
              "year": {
                "description": "Model year, e.g. 2023.",
                "type": "integer"
              }
            },
            "required": ["make", "model", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Battery warranty by model year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f329c6cab1eac4e8e40b553d9e0a4e845b525f46206d21dd777cf85e39cacd56"
        },
        {
          "name": "compare_listings",
          "title": "Compare listings",
          "description": "Two to five listings by VIN, side by side: for each, its full record with its asking-price history, battery_warranty and asking_vs_similar where they exist. VINs with no live listing are returned in not_found, and any that could not be read in time in unavailable. Results are as of the `as_of` timestamp.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vins": {
                "description": "2 to 5 VINs.",
                "items": {
                  "description": "17-character VIN.",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["vins"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d66a3eff3d7859d435972f5654afa72755ffcf2be77aa1fa0c21c60fd77fc241"
        },
        {
          "name": "get_listing",
          "title": "Get one listing by VIN",
          "description": "One listing by VIN: every field of the search record plus its asking-price history on this seller, and battery_warranty, this car's high-voltage battery warranty as its Census EV page gives it: status (for example \"Expired\" or \"In force · 38,200 mi or 3+ yr left\"), in_force, and estimated when the term is not the manufacturer's own figure. battery_warranty is absent where the page gives no verdict for the car. asking_vs_similar (\"below\", \"typical\" or \"above\") compares the asking price with similar cars on Census EV: the same version and model year within 40,000 miles, adjusted for mileage, counting cars listed now and cars no longer listed in the last 30 days at their last asking price. It compares asking prices and is not an appraisal. \"below\" and \"above\" need a gap of at least $1,000 that is also wider than the usual spread of asking prices for that version: for most cars about 3 to 7% over for \"above\" and about 5 to 9% under for \"below\", more where few similar cars are known, and \"below\" must still hold with any one similar car left out. Otherwise it is \"typical\". Absent when the car could not be compared: new or under 2,000 miles, no asking price or mileage, a disclosed buyback or branded title, fewer than 3 similar cars, similar cars that are not all one version, or an asking price so far under them that the gap is more than 30% of it. The seller link forwards through censusev.com to the dealer's own page for the car.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vin": {
                "description": "17-character VIN.",
                "type": "string"
              }
            },
            "required": ["vin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one listing by VIN"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7509e45db1b7440f2ff87b04852d6869387e8ee76569e0c20bab17d3f9251b8d"
        },
        {
          "name": "list_models",
          "title": "List makes and models",
          "description": "Every make and model with live listings, with counts, in the exact spellings the listing search accepts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "make": {
                "description": "Limit the list to one make, e.g. \"Kia\". Omit for every make.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List makes and models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93db9bda185f6e43f09bdb239f7f94cb0e2a245a2390516884a41b1f5100093a"
        },
        {
          "name": "market_snapshot",
          "title": "Model market snapshot",
          "description": "Figures for one model as Census EV publishes them on its model page and its market page: how many are for sale and as of when; cars for sale and median asking price by model year; the mileage-adjusted asking price of a used one at 40,000 miles with its 30- and 60-day change; and the share of used ones no longer listed 30 days after they appeared, with the window it was measured over. A figure is null or absent where the site prints none, because too few cars stand behind it or it could not be read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "make": {
                "description": "Make, e.g. \"Hyundai\". Case, spacing and common short forms (\"Chevy\", \"VW\") are accepted.",
                "type": "string"
              },
              "model": {
                "description": "Model, e.g. \"Ioniq 5\". Punctuation and spacing are ignored.",
                "type": "string"
              }
            },
            "required": ["make", "model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Model market snapshot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87b3c3600406f6fceb141eb7407aa35a2bf6da8e6befdbed94b5e505e4ba66f6"
        },
        {
          "name": "search_listings",
          "title": "Search EV listings",
          "description": "Search every electric and plug-in hybrid vehicle listed for sale in the United States that Census tracks — new, used and certified, from dealers' own sites and manufacturer inventory. Returns matching listings with price, mileage, location, the seller's name and website, a seller link that forwards through censusev.com to the dealer's own page for the car, and the EV facts the site stands behind (battery kWh, EPA range, charge port, heat pump, DC fast charging), each marked estimated when it is not the manufacturer's own figure. Also returns a breakdown of every matching car, not only the returned page: cars per model year, cars per trim (top 8, when every match is one model), and the lowest, median and highest asking price. Each record carries last_seen, the day the car was last seen for sale. asking_vs_similar (\"below\", \"typical\" or \"above\") compares the asking price with similar cars on Census EV: the same version and model year within 40,000 miles, adjusted for mileage, counting cars listed now and cars no longer listed in the last 30 days at their last asking price. It compares asking prices and is not an appraisal. \"below\" and \"above\" need a gap of at least $1,000 that is also wider than the usual spread of asking prices for that version: for most cars about 3 to 7% over for \"above\" and about 5 to 9% under for \"below\", more where few similar cars are known, and \"below\" must still hold with any one similar car left out. Otherwise it is \"typical\". Absent when the car could not be compared: new or under 2,000 miles, no asking price or mileage, a disclosed buyback or branded title, fewer than 3 similar cars, similar cars that are not all one version, or an asking price so far under them that the gap is more than 30% of it. Inventory is as of the `as_of` timestamp in the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "Comma-separated: \"suv\", \"sedan\", \"truck\", \"van\", \"hatchback\".",
                "type": "string"
              },
              "charge_port": {
                "description": "Comma-separated: \"NACS\", \"CCS1\", \"CHAdeMO\".",
                "type": "string"
              },
              "condition": {
                "description": "Comma-separated: \"new\", \"used\", \"certified\".",
                "type": "string"
              },
              "detail": {
                "description": "How much of each record to return. Default \"compact\", which leaves out id (the VIN in lower case), image_url, location.zip, location.lat, location.lng, previous_price_usd, price_changed_at, listed_on and first_seen. \"full\" returns every field.",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "drive": {
                "description": "Comma-separated: \"AWD\", \"RWD\", \"FWD\".",
                "type": "string"
              },
              "heat_pump": {
                "description": "Only cars known to have (yes) or not have (no) a heat pump. Cars where it is not established match neither, and are counted in not_established.heat_pump.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "kind": {
                "description": "Battery-electric or plug-in hybrid. A car whose kind is not established matches neither; the result counts those in not_established.kind.",
                "enum": ["BEV", "PHEV"],
                "type": "string"
              },
              "kwh_min": {
                "description": "Minimum battery capacity in kWh.",
                "type": "integer"
              },
              "limit": {
                "description": "Results to return, 1 to 100. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "description": "Make, e.g. \"Tesla\", \"Hyundai\".",
                "type": "string"
              },
              "mileage_max": {
                "description": "Maximum odometer reading in miles. Cars with no stated mileage are excluded when this is given.",
                "type": "integer"
              },
              "model": {
                "description": "Model, e.g. \"Model Y\", \"Ioniq 5\". Punctuation and spacing are ignored.",
                "type": "string"
              },
              "offset": {
                "description": "Results to skip, for paging. Default 0.",
                "minimum": 0,
                "type": "integer"
              },
              "price_max": {
                "description": "Maximum asking price in USD. Cars with no real asking price are excluded when a price bound is given.",
                "type": "integer"
              },
              "price_min": {
                "description": "Minimum asking price in USD.",
                "type": "integer"
              },
              "radius_mi": {
                "description": "Search radius around zip, in miles. Default 100.",
                "type": "integer"
              },
              "range_min": {
                "description": "Minimum EPA range in miles (electric-only for a plug-in hybrid).",
                "type": "integer"
              },
              "sort": {
                "description": "Result order. distance needs a zip. Default: distance when a zip is given, otherwise price_asc.",
                "enum": ["price_asc", "price_desc", "mileage_asc", "year_desc", "newest", "distance"],
                "type": "string"
              },
              "state": {
                "description": "Comma-separated two-letter state codes, e.g. \"CA,OR\".",
                "type": "string"
              },
              "year_max": {
                "description": "Latest model year to include.",
                "type": "integer"
              },
              "year_min": {
                "description": "Earliest model year to include, e.g. 2022.",
                "type": "integer"
              },
              "zip": {
                "description": "5-digit US ZIP; results are limited to radius_mi of it and sorted by distance unless sort is given.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search EV listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
