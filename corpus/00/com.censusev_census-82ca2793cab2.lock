{
  "lockfileVersion": 2,
  "subjects": {
    "com.censusev/census": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://censusev.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "census",
        "title": "Census EV",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Census lists electric and plug-in hybrid vehicles for sale in the United States. Call list_models to learn make and model spellings, search_listings to find cars (give a zip for nearby results), get_listing for one car's price history. Every record carries the dealer's own page in seller.url; send people there to buy. Facts marked estimated are not the manufacturer's own figure. Results are as of the as_of timestamp.",
      "tools": [
        {
          "name": "get_listing",
          "title": "Get one listing by VIN",
          "description": "One listing by VIN: the search record plus its asking-price history on this seller.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vin": {
                "description": "17-character VIN.",
                "type": "string"
              }
            },
            "required": ["vin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one listing by VIN"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b9b9a5a0bb589719616a9b6d6408103b278a3e3c720a026a527c896baba4089"
        },
        {
          "name": "list_models",
          "title": "List makes and models",
          "description": "Every make and model with live listings, with counts. Use it to learn the exact make and model spellings before searching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "make": {
                "description": "Limit the list to one make, e.g. \"Kia\". Omit for every make.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List makes and models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2cd47656f192adf04069ec323169bf078fcb2a738e1beb7774adc68d00722f2f"
        },
        {
          "name": "search_listings",
          "title": "Search EV listings",
          "description": "Search every electric and plug-in hybrid vehicle listed for sale in the United States that Census tracks — new, used and certified, from dealers' own sites and manufacturer inventory. Returns matching listings with price, mileage, location, the dealer's own page, and the EV facts the site stands behind (battery kWh, EPA range, charge port, heat pump, DC fast charging), each marked estimated when it is not the manufacturer's own figure. Inventory is as of the `as_of` timestamp in the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "Comma-separated: \"suv\", \"sedan\", \"truck\", \"van\", \"hatchback\".",
                "type": "string"
              },
              "charge_port": {
                "description": "Comma-separated: \"NACS\", \"CCS1\", \"CHAdeMO\".",
                "type": "string"
              },
              "condition": {
                "description": "Comma-separated: \"new\", \"used\", \"certified\".",
                "type": "string"
              },
              "drive": {
                "description": "Comma-separated: \"AWD\", \"RWD\", \"FWD\".",
                "type": "string"
              },
              "heat_pump": {
                "description": "Only cars known to have (yes) or not have (no) a heat pump. Cars where it is not established match neither.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "kind": {
                "description": "Battery-electric or plug-in hybrid.",
                "enum": ["BEV", "PHEV"],
                "type": "string"
              },
              "kwh_min": {
                "description": "Minimum battery capacity in kWh.",
                "type": "integer"
              },
              "limit": {
                "description": "Results to return, 1 to 100. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "description": "Make, e.g. \"Tesla\", \"Hyundai\".",
                "type": "string"
              },
              "mileage_max": {
                "description": "Maximum odometer reading in miles. Cars with no stated mileage are excluded when this is given.",
                "type": "integer"
              },
              "model": {
                "description": "Model, e.g. \"Model Y\", \"Ioniq 5\". Punctuation and spacing are ignored.",
                "type": "string"
              },
              "offset": {
                "description": "Results to skip, for paging. Default 0.",
                "minimum": 0,
                "type": "integer"
              },
              "price_max": {
                "description": "Maximum asking price in USD. Cars with no real asking price are excluded when a price bound is given.",
                "type": "integer"
              },
              "price_min": {
                "description": "Minimum asking price in USD.",
                "type": "integer"
              },
              "radius_mi": {
                "description": "Search radius around zip, in miles. Default 100.",
                "type": "integer"
              },
              "range_min": {
                "description": "Minimum EPA range in miles (electric-only for a plug-in hybrid).",
                "type": "integer"
              },
              "sort": {
                "description": "Result order. distance needs a zip. Default: distance when a zip is given, otherwise price_asc.",
                "enum": ["price_asc", "price_desc", "mileage_asc", "year_desc", "newest", "distance"],
                "type": "string"
              },
              "state": {
                "description": "Comma-separated two-letter state codes, e.g. \"CA,OR\".",
                "type": "string"
              },
              "year_max": {
                "description": "Latest model year to include.",
                "type": "integer"
              },
              "year_min": {
                "description": "Earliest model year to include, e.g. 2022.",
                "type": "integer"
              },
              "zip": {
                "description": "5-digit US ZIP; results are limited to radius_mi of it and sorted by distance unless sort is given.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search EV listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97d72e072ead2a199c0baba02919fcd634b2a46ff68c9b553dad194aa9c206f8"
        }
      ],
      "digest": "sha256:e8e142e7a3391d12a5483dcdde30d7683d78c8515fb78175bcf5c3d48027f06c"
    }
  }
}
