{
  "lockfileVersion": 2,
  "subjects": {
    "com.nanion/vaia": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://vareen.net/a/JIol8af5lfQsl1FX/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "vaia",
        "title": "nanion.com (Vaia)",
        "version": "1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Werkzeuge für Fragen an nanion.com: belegte Antworten aus der eigenen Website und technische Produktdaten. Quellen in den Antworten angeben.",
      "tools": [
        {
          "name": "an_vertrieb",
          "description": "Hands a request on behalf of the buyer to the nanion.com team — for binding information on prices, quotes, contracts or individual commitments. Only use with the buyer's consent; the team replies by e-mail.",
          "inputSchema": {
            "properties": {
              "abgleich": {
                "description": "Id of a requirement check (its result goes to the team)",
                "type": "integer"
              },
              "anforderungen": {
                "description": "The buyer's technical requirements",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "anliegen": {
                "description": "What the request is about",
                "type": "string"
              },
              "email": {
                "description": "The buyer's e-mail address",
                "type": "string"
              },
              "firma": {
                "description": "Company",
                "type": "string"
              },
              "freigabe": {
                "description": "true = the buyer has explicitly agreed to pass on these details (required)",
                "type": "boolean"
              },
              "nach": {
                "description": "Id of the last answer (conversation context for the team)",
                "type": "integer"
              },
              "nachricht": {
                "description": "Message",
                "type": "string"
              },
              "naechster_schritt": {
                "description": "Desired next step",
                "enum": ["angebot", "demo", "beratung", "rueckruf", "termin", "unterlagen", "sonstiges"],
                "type": "string"
              },
              "name": {
                "description": "The buyer's name",
                "type": "string"
              },
              "offene_fragen": {
                "description": "Questions still to be clarified",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "zeitrahmen": {
                "description": "e.g. “Q1 2027”, “purchase within 3 months”",
                "type": "string"
              }
            },
            "required": ["anliegen", "email", "freigabe"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Contact the sales team"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0cd9b8294ff3d99115202a5afbedc3bce0c5b78876d6dc9198ef55dad9684453"
        },
        {
          "name": "anforderungen_pruefen",
          "description": "Checks technical requirements against the data sheets of all (or selected) products: per product and requirement met / not met / unclear, with the supporting feature and source; products sorted by fit. “Unclear” means the information is missing or ambiguous — then follow up with “frage” or clarify via “an_vertrieb”.",
          "inputSchema": {
            "properties": {
              "anforderungen": {
                "description": "e.g. “at least 384 channels”, “temperature control”",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "produkte": {
                "description": "optional: check only these products",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["anforderungen"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:612816cc995dfccf10c38ee0415073ce2a676c38675126d2ce2d924ceb8dfa8a"
        },
        {
          "name": "frage",
          "description": "Answers a question about nanion.com from the company's own website, with numbered sources, in the language of the question. If the question names two products and a comparison, a side-by-side of the technical data is added. What the website does not say is not answered. For a follow-up in the same conversation pass the id of the previous answer as “nach”.",
          "inputSchema": {
            "properties": {
              "frage": {
                "description": "The question in natural language",
                "type": "string"
              },
              "nach": {
                "description": "Id of the previous answer (for follow-up questions)",
                "type": "integer"
              }
            },
            "required": ["frage"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ask the website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2003d5b0753342af43e462c194d3b3d070aaa0e689aaa2b46bbf7a65554fe7b"
        },
        {
          "name": "produkt",
          "description": "Technical data of one product (feature → value) from its data sheet, with source.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Product name or slug from “produkte”",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Product data sheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e483b3bf483c5d3932a3fb0a37113270b9eed591642f0a9fcbdd6a0920c8d49f"
        },
        {
          "name": "produkte",
          "description": "List of nanion.com products with technical data.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:360c297c467a5cd52a97e01ab34ab094a9d504721353363449cf4ac01ce236a5"
        },
        {
          "name": "vergleich",
          "description": "Side-by-side technical data of two products (values from the data sheets).",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "First product: name or slug from “produkte”",
                "type": "string"
              },
              "b": {
                "description": "Second product: name or slug from “produkte”",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1548f1c962914d099ebf5d1fb8b4361bff48919120032a9d758b454658de8796"
        }
      ],
      "digest": "sha256:a71f816691aca2a01553a6f50407b4d42a78b80eb9d70f9d10a21a8daa89ce95"
    }
  }
