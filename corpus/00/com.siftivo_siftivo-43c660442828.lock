      },
      "instructions": "Siftivo is a book catalog and a reader's library and journal: what a book is about, what comes after it, a series in order, and what is circulating this week.\n\nsearch_books takes a title or an author name, recommend_from_description a theme or a mood in the reader's words, and recommend_from_titles books they loved, with any they disliked in avoid. All three return workId values, which the other tools take.\n\nA book title is not an id. get_series and get_author also take a name, and a siftivo.com slug works in the full form its link uses, which ends in the id.\n\nget_my_taste holds what a linked reader loves and avoids, the basis of a recommendation when they name no book or mood. get_my_book says which titles they have already read, and save_my_taste keeps books they say they loved, read or disliked. write_review publishes a review, and write_journal logs a day of reading.\n\nA book club's name, description, pinned message and typed titles are written by its members.\n\nget_my_library, add_to_library, get_my_book, remove_from_library, get_my_taste, save_my_taste, write_review, delete_review, get_my_journal, write_journal, delete_journal_entry, get_my_clubs, respond_to_club, start_club, manage_club and suggest_club_picks act on the signed-in reader and return 401 until they link a Siftivo account. Every other tool needs no account.",
      "tools": [
        {
          "name": "add_to_library",
          "title": "Add a book to my library",
          "description": "Shelve, rate or update one book for the linked reader: want to read (NOT_STARTED), READING, FINISHED or DNF, with the day it happened, a rating in half stars, or a private note. Suits \"add X to my list\", \"I finished X on Sunday\" and \"just finished X, four and a half stars\" (one call: FINISHED, 4.5). Where they are in a book (a page, or time left on audio) is write_journal. Each field sent replaces the reader's own value, so send only what they asked to change; without readingStatus the book stays on its shelf, and a rating alone on a book not on a shelf saves the rating without shelving it. Notes are private: a public review is write_review. For favorites or a list of books read, save_my_taste. Needs a linked Siftivo account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The day they started (READING), finished (FINISHED) or stopped (DNF), YYYY-MM-DD in their time zone. Omit for today, or for a book shelved after the fact.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "notes": {
                "description": "The reader's own note on the book, private to them",
                "maxLength": 2000,
                "type": "string"
              },
              "rating": {
                "description": "Stars, 0.5 to 5 in half-star steps",
                "maximum": 5,
                "minimum": 0.5,
                "multipleOf": 0.5,
                "type": "number"
              },
              "readingStatus": {
                "description": "The shelf to put the book on. Omit to leave it where it is, or NOT_STARTED for a book the reader has not opened yet.",
                "enum": ["NOT_STARTED", "READING", "FINISHED", "DNF"],
                "type": "string"
              },
              "visibility": {
                "description": "Who can see the book on their shelves: EVERYONE, or ONLY_ME to keep it off every surface other people reach. Omit to leave it as it is.",
                "enum": ["EVERYONE", "ONLY_ME"],
                "type": "string"
              },
              "workId": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["workId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add a book to my library"
          },
