        {
          "name": "write_journal",
          "title": "Write in my reading journal",
          "description": "Log a day of reading in the linked reader's journal, one entry per book per day, for up to 10 books. Each takes the reader's local date and a note, a position, or both. Position is page for print or ebook, or minutesLeft for audio; a listener's \"4 hours in\" is totalMinutes minus 240, so it needs the runtime. A Kindle percent goes in the note. A book keeps one unit: a day in the other one comes back unit_differs and logs nothing until switchUnit is true. A note on a day that has one is added under it unless replaceNote is true. A book not on a shelf moves to Reading. Finishing is add_to_library. Notes are private and hold only the reader's words. Needs a linked Siftivo account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entries": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "book": {
                      "description": "A title, \"Title by Author\", or a workId. Books the reader is reading now match first.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "date": {
                      "description": "A day in the reader's own time zone, YYYY-MM-DD",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "minutesLeft": {
                      "description": "Minutes of audio left at the end of that day",
                      "maximum": 20000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "note": {
                      "description": "The reader's own words for the day. A page or time this call could not log stays out of it.",
                      "maxLength": 5000,
                      "type": "string"
                    },
                    "page": {
                      "description": "Page reached that day, for a print or ebook copy",
                      "maximum": 20000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "replaceNote": {
                      "description": "True only when the reader asked to replace that day's note rather than add to it",
                      "type": "boolean"
                    },
                    "switchUnit": {
                      "description": "True only when the reader confirmed moving the book between pages and time",
                      "type": "boolean"
                    },
                    "totalMinutes": {
                      "description": "The audiobook's runtime in minutes",
                      "maximum": 20000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "totalPages": {
                      "description": "Pages in the reader's copy",
                      "maximum": 20000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "trackBy": {
                      "description": "How the reader follows this book: pages for print or ebook, time for audio",
                      "enum": ["pages", "time"],
                      "type": "string"
                    }
                  },
                  "required": ["book", "date"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Write in my reading journal"
          },
          "behavior": {
