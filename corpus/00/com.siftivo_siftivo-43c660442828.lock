        {
          "name": "manage_club",
          "title": "Run a book club",
          "description": "For a club's host or moderator: set or finish the book, open or close a poll, set or cancel the next meeting, or post a pinned message from the host. Suits \"set up a vote between these three\", \"we meet the 14th at Noor's\", \"we finished it\" and \"ask the club this question\". Say what you're about to post before posting. Every member is notified, and the result says how many. place is a place's name, never a street address. Removing members and closing a club are done in the app.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "book": {
                "additionalProperties": false,
                "description": "For set_book",
                "properties": {
                  "author": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "title": {
                    "description": "Only for a book search_books cannot find",
                    "maxLength": 300,
                    "type": "string"
                  },
                  "workId": {
                    "description": "From search_books or a recommendation",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "books": {
                "description": "For open_poll",
                "items": {
                  "$ref": "#/properties/book"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "choose": {
                "description": "For close_poll: the optionId that becomes the next read",
                "type": "string"
              },
              "closesAt": {
                "description": "For open_poll, ISO 8601",
                "type": "string"
              },
              "club": {
                "description": "The club: its siftivo.com/c/ link, its code, or the clubId another club tool returned",
                "minLength": 1,
                "type": "string"
              },
              "do": {
                "enum": ["set_book", "finish_book", "open_poll", "close_poll", "set_meeting", "cancel_meeting", "post_pinned"],
                "type": "string"
              },
              "place": {
                "description": "For set_meeting: a place's name",
                "maxLength": 200,
                "type": "string"
              },
              "startsAt": {
                "description": "For set_meeting, ISO 8601. Moves the next meeting if there is one",
                "type": "string"
              },
              "text": {
                "description": "For post_pinned, approved by the reader",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "timezone": {
                "description": "For set_meeting, IANA",
                "type": "string"
              },
              "url": {
                "description": "For set_meeting: a video link",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["club", "do"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
