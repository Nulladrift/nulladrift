          "digest": "sha256:15615b6993f555820834fb5e5e6b3dde8ffae11d9488f2543d07913ab463e60a"
        },
        {
          "name": "write_review",
          "title": "Write a review",
          "description": "Publish the linked reader's review of a book, under their name on its siftivo.com page and to their followers. Suits \"post this as my review of X\" and \"change my review of X\". The text is the reader's own words, or a draft they approved word for word, and is never padded to reach the minimum. It takes 50 to 10,000 characters and a star rating, sent here or already on file. If they already reviewed the book in different words, the result shows that review and changes nothing unless replaceExisting is true. A star rating alone is add_to_library. Needs a linked Siftivo account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "containsSpoilers": {
                "description": "True when the reader says the review gives away the plot",
                "type": "boolean"
              },
              "rating": {
                "description": "Stars, 0.5 to 5 in half-star steps",
                "maximum": 5,
                "minimum": 0.5,
                "multipleOf": 0.5,
                "type": "number"
              },
              "replaceExisting": {
                "default": false,
                "description": "True only when the reader asked to replace the review they already wrote",
                "type": "boolean"
              },
              "reviewText": {
                "description": "The review, in the reader's own words",
                "maxLength": 10000,
                "minLength": 1,
                "type": "string"
              },
              "workId": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reviewText", "workId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Write a review"
