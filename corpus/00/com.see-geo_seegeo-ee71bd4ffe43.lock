{
  "lockfileVersion": 2,
  "subjects": {
    "com.see-geo/seegeo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://see-geo.com/mcp/anonymous"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "seegeo",
        "version": "1.0.4"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SeeGeo audits websites for AI readability: whether ChatGPT, Claude, Gemini, Perplexity and Google's AI features can find, read, understand and cite a site. This is the no-account endpoint: crawler_check is free to use, audit_site runs one full graded audit per network per day (about 20–40 seconds) and returns a public report link, get_audit re-reads it. For more audits, history and usage, connect to https://see-geo.com/mcp with a free account's API key or via OAuth. Grades are calibrated against 107 real small-business sites; a single audit measures readiness, not whether assistants currently recommend the business.",
      "tools": [
        {
          "name": "audit_site",
          "title": "Audit a website for AI visibility",
          "description": "Runs SeeGeo's full audit of a domain — crawler access for 16 AI bots, technical basics, structured data, content extractability, off-site presence, entity clarity — and returns the grade (A–F), category scores and the findings with fixes. Takes 20–40 seconds; waits by default. If the wait runs out the result says so — call get_audit with the id. Re-auditing the same domain within ten minutes returns the earlier result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "A public hostname or URL, e.g. example.com or https://www.example.com/pricing (the host is used).",
                "minLength": 1,
                "type": "string"
              },
              "timeoutSeconds": {
                "default": 50,
                "description": "How long to wait before returning the in-progress audit (default 50, inside most clients' 60-second tool timeout; raise it if your client allows longer calls). If it runs out, call get_audit with the returned id.",
                "maximum": 140,
                "minimum": 10,
                "type": "integer"
              },
              "wait": {
                "default": true,
                "description": "Wait for the audit to finish (default). If false, returns the id to poll with get_audit.",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Audit a website for AI visibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:46c8fbb72b827157ed6541e10f45bb71ba46c057807beebc507eca75c6ae27a2"
        },
        {
          "name": "crawler_check",
          "title": "Which AI crawlers can read this domain?",
          "description": "Reads robots.txt for each AI crawler (GPTBot, ClaudeBot, PerplexityBot, Google-Extended…) and fetches the homepage as GPTBot, OAI-SearchBot, ClaudeBot and PerplexityBot to see whether a bot wall blocks them. A few seconds; does not count as an audit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "A public hostname or URL, e.g. example.com or https://www.example.com/pricing (the host is used).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Which AI crawlers can read this domain?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:23b63b1d796419cc41400c8bcf4c3bac6785144c8dda7384676bf69c8f6ab4cc"
        },
        {
          "name": "get_audit",
          "title": "Read an audit by id",
          "description": "Returns an audit's status while it runs, or its grade, category scores and findings when done. Set includeReport to get the full report object with evidence.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The audit id from audit_site or list_audits.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "includeReport": {
                "default": false,
                "description": "Include the full report JSON (large) in structuredContent.",
                "type": "boolean"
              },
              "maxFindings": {
                "default": 12,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an audit by id"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:94eb302ef2da294de5a5c27b8be0c710d618ea70f8bd0f85028946eba373b99b"
        }
      ],
      "digest": "sha256:8794eae24a7f22644e613a207e5695ea8451a13fa7c3820fe3f5c4633f3f9dd3"
    }
  }
}
