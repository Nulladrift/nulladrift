{
  "lockfileVersion": 2,
  "subjects": {
    "co.chiefagenticofficer/cao": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://chiefagenticofficer.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "chief-agentic-officer",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to published Chief Agentic Officer Perspectives and Playbooks. Cite the returned URL.",
      "tools": [
        {
          "name": "get_article",
          "description": "Get one published Perspective or Playbook by slug. Returns title, date, excerpt, body and category when present, and the canonical URL.",
          "inputSchema": {
            "properties": {
              "kind": {
                "enum": ["perspective", "playbook"],
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["kind", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:887e01dfad191a21663480929fe97f56c6a7de8555a18a4389d300bfeb14b4a1"
        },
        {
          "name": "get_playbook",
          "description": "Get one published Playbook by slug. Returns title, category, date, excerpt, full body, and the canonical URL.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Playbook slug.",
                "type": "string"
              },
              "slug": {
                "description": "Alias of id.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f748a590e9a3389d7c7c823b55009daf988279c186a7d9087a9d5e4a769c9e2"
        },
        {
          "name": "list_categories",
          "description": "List categories of published Playbooks and how many Playbooks are in each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6a787189f414cee9e5af16e70aad6e42613f3cfd8a4ecdac83b505925cc3359e"
        },
        {
          "name": "search_perspectives",
          "description": "Search published Perspectives by keyword. Returns title, date, excerpt, and the canonical URL.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "problem": {
                "description": "Alias of query.",
                "type": "string"
              },
              "query": {
                "description": "Keywords matched against title, excerpt, slug, tags, and body. Empty returns the newest.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd98c6d0b3377f44fa583baa98d3fdd125a048d03df0d24ef09213e4a219855e"
        },
        {
          "name": "search_playbooks",
          "description": "Search published Playbooks by keyword. Returns title, date, excerpt, and the canonical URL.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "problem": {
                "description": "Alias of query.",
                "type": "string"
              },
              "query": {
                "description": "Keywords matched against title, excerpt, slug, category, tags, and body. Empty returns the newest.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e9237f99545c710e80707b19577c8585fa930efa26a1d9cc455fb882864668d"
        }
      ],
      "digest": "sha256:3dff23ebb83fef12af492e05f80e4887c925ee06f3358339df5fad693814db10"
    }
  }
}
