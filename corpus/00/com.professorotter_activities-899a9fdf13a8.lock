        {
          "name": "make_word_search",
          "title": "Make a word search from a spelling list",
          "description": "Turn a list of 4 to 20 words, like a child's spelling list, into a word search they can play in the chat, with a link to print it as a PDF with an answer key. Paste the list as one string or pass the words as an array. A word longer than the level's grid makes the grid grow to fit it. If the list breaks a rule (too few words, a word over 20 letters, a word inside another), the error says what to fix.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "level": {
                "description": "easy: 12×12, words run right, down or diagonally down. challenge: 15×15, every direction. expert: 18×18, every direction. A longer word grows the grid to fit, up to 20×20. Defaults to easy.",
                "enum": ["easy", "challenge", "expert"],
                "type": "string"
              },
              "seed": {
                "description": "Grid layout. The same words and seed give the same grid. Leave out for a new layout.",
                "maximum": 2147483647,
                "minimum": 0,
                "type": "integer"
              },
              "title": {
                "description": "Title printed on the sheet, up to 80 characters. Defaults to \"Custom Word Search\".",
                "maxLength": 80,
                "type": "string"
              },
              "words": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 100,
                    "type": "array"
                  },
                  {
                    "maxLength": 4000,
                    "type": "string"
                  }
                ],
                "description": "The spelling words, 4 to 20, letters only: an array, or one string with the words separated by commas or new lines."
              }
            },
            "required": ["words"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "directions": {
                "type": "string"
              },
              "grid": {
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "level": {
                "enum": ["easy", "challenge", "expert"],
                "type": "string"
              },
              "levelName": {
                "type": "string"
              },
              "pdfUrl": {
                "type": "string"
              },
              "playUrl": {
                "type": "string"
              },
              "seed": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "size": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "title": {
                "type": "string"
              },
