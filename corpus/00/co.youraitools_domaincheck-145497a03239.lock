        "name": "domaincheck",
        "title": "DomainCheck",
        "version": "0.1.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "check_domain reports whether a domain exists, how old it is and how its email is configured; check_email reports whether an address is valid, disposable or undeliverable.",
      "tools": [
        {
          "name": "check_domain",
          "title": "Check a domain (DNS + email auth)",
          "description": "Check a domain before your agent trusts a link, a sender or a counterparty: does it exist, where does its mail go, SPF and DMARC policy, nameservers, DNSSEC. Free tier (preview). For registration age, registrar, parking detection and a 0-100 risk score use the paid x402 endpoint /v1/domain.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain, URL or email address",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a2da876abe650964726f5b08f378f3c27c0739c97b4d1a50ca07f776dcc4c572"
        },
        {
          "name": "check_email",
          "title": "Check an email address (syntax + disposable)",
          "description": "Check an email address an agent is about to store, email or trust: syntax, disposable / throwaway provider, role account, free webmail. Free tier (no network). For MX, mail auth, domain age and a verdict (valid | risky | undeliverable) use the paid x402 endpoint /v1/email.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Email address",
