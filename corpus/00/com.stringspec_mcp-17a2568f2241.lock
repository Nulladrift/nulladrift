{
  "lockfileVersion": 2,
  "subjects": {
    "com.stringspec/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://stringspec.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "stringspec",
        "title": "StringSpec",
        "version": "1.0.0",
        "websiteUrl": "https://stringspec.com/connect/"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "StringSpec: lab measurements of 791 tennis strings (stiffness, tension loss, energy return, spin potential, friction, elongation), with retail prices. Use get_string for one named string, compare_strings for two or three, recommend_strings when a player describes what they want (spin, comfort or arm pain, control, power, tension hold, durability, feel), and search_strings to filter or sort by brand, material, gauge, a measurement or price. Lower stiffness is softer and kinder on the arm; lower tension loss holds tension longer. Present measurements as measurements and estimates (playable life, tension advice) as estimates. Give the StringSpec url when the user wants the full page.",
      "tools": [
        {
          "name": "compare_strings",
          "title": "Compare tennis strings",
          "description": "Side-by-side measurements, percentiles, prices and buy links for 2 or 3 strings by name, with the StringSpec comparison page when there are two.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "names": {
                "description": "Two or three string names.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare tennis strings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://stringspec/compare-v1.html",
            "ui": {
              "resourceUri": "ui://stringspec/compare-v1.html"
            }
          },
          "digest": "sha256:b2f749cfd7dc3bc8c85969ee2d7fc999246de951adb3de691ad84113c1a8253c"
        },
        {
          "name": "get_string",
          "title": "Get one tennis string",
          "description": "Everything StringSpec has on one string, found by name (misspellings and missing gauges are fine): every measurement with its database percentile, elongation at 40, 51 and 62 lb, an estimated playable life, a tension adjustment versus the player's usual, how it ranks for each playing need (spin, comfort, control, power, tension hold, durability, feel), the closest alternatives, the retail price and a buy link. When the name matches several strings it returns the best match and lists the others.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The string's name, e.g. \"Luxilon ALU Power 16L\" or \"RPM Blast\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one tennis string"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f02b9937a0cae103b0ba76551fd6de52a7dddb0b9be86d608476741d3494b456"
        },
        {
          "name": "recommend_strings",
          "title": "Recommend tennis strings for a player",
          "description": "Rank the database for what a player wants, with StringSpec's string finder: one main need and an optional second one (spin (More spin and shape), comfort (Easier on my arm), control (More control, less launch), power (More power and depth), hold (Plays the same for longer), durable (Lasts longer before it breaks), feel (Best feel and touch)), adjusted for the racquet (string pattern, head size, frame stiffness) and with a material ruled out if asked. Returns a shortlist with a 0-100 fit, why each string fits, its price and buy link, and the finder link with the same answers filled in. For arm or elbow pain use need \"comfort\", and avoid \"poly\" when the player wants no polyester.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "also": {
                "description": "An optional second need, weighted lower than the first.",
                "enum": ["spin", "comfort", "control", "power", "hold", "durable", "feel"],
                "type": "string"
              },
              "avoid": {
                "description": "gut (no natural gut), poly (no polyester), polyonly (polyester only).",
                "enum": ["gut", "poly", "polyonly"],
                "type": "string"
              },
              "frame": {
                "description": "Frame feel: flex (flexible, arm-friendly), avg, stiff (stiff and powerful).",
                "enum": ["flex", "avg", "stiff"],
                "type": "string"
              },
              "head": {
                "description": "Head size: small (under 98 sq in), mid (98-100), large (100 and up).",
                "enum": ["small", "mid", "large"],
                "type": "string"
              },
              "limit": {
                "description": "Shortlist length (default 8).",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "The main thing the player wants.",
                "enum": ["spin", "comfort", "control", "power", "hold", "durable", "feel"],
                "type": "string"
              },
              "pattern": {
                "description": "String pattern: open (16x19 or more open) or dense (18x20 or tighter).",
                "enum": ["open", "dense"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend tennis strings for a player"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:007c2bd3214a01a7f7d3c01d258af5e3bf18cce5b3e01ebcb772d8a0ad1edf20"
        },
        {
          "name": "search_strings",
          "title": "Search tennis strings",
          "description": "Search 791 lab-measured tennis strings by name, brand, material and gauge, sorted by a measurement or by price. Each result carries stiffness (lb/in), tension loss (%), energy return (%), spin potential, ball bite and string friction, each with its percentile in the database, plus the current retail price, a buy link and the StringSpec page. Returns at most 10 strings; narrow the filters rather than asking for more.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name, e.g. \"Babolat\", \"Luxilon\", \"Solinco\".",
                "maxLength": 60,
                "type": "string"
              },
              "gauge": {
                "description": "Gauge label. A higher number is thinner, and an \"L\" gauge is thinner than its base (17L is thinner than 17).",
                "enum": ["16", "17", "16L", "18", "15L", "17L", "15", "19", "18L", "20"],
                "type": "string"
              },
              "include_discontinued": {
                "description": "Include strings no longer sold (default false).",
                "type": "boolean"
              },
              "limit": {
                "description": "How many to return (default 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "material": {
                "description": "Construction family. Polyester is the stiff spin-friendly monofilament; Nylon covers synthetic gut and multifilaments; Gut is natural gut.",
                "enum": ["Polyester", "Nylon", "Nylon/Polyester", "Gut", "Nylon/Polyurethane", "Nylon/Zyex", "Nylon/Polyolefin", "Polyolefin"],
                "type": "string"
              },
              "max_price_usd": {
                "description": "Only strings with a retail set price at or under this, in USD. Strings without a price are excluded when this is set.",
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Words from the string's name, e.g. \"alu power\", \"hyper-g\", \"rpm blast\".",
                "maxLength": 80,
                "type": "string"
              },
              "sort": {
                "description": "popular (a retailer's units-sold order, default), softest, stiffest, most_spin, best_tension_hold, most_power (energy return), cheapest.",
                "enum": ["popular", "softest", "stiffest", "most_spin", "best_tension_hold", "most_power", "cheapest"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search tennis strings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6e420e8f7a2e7f60125fff9e837a8c77d1584a39c27008ea0bec077861dc730"
        }
      ],
      "resources": [
        {
          "uri": "ui://stringspec/compare-v1.html",
          "name": "compare-v1",
          "title": "String comparison",
          "description": "Side-by-side view of 2 or 3 strings from compare_strings: price, and one bar per measurement showing the share of tested strings each one beats.",
          "mimeType": "text/html;profile=mcp-app",
          "digest": "sha256:f644ed9efe9f02ec67a5e8d6da161b4ece0403fd5811469af77f3950c06a5636"
        }
      ],
      "digest": "sha256:a839f0c5e5c8d60474d7fae101233465773fba7da9e294d3afe8773d52cde2a9"
    }
  }
}
