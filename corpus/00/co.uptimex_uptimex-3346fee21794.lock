      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "UptimeX watches the uptime of URLs. Use these tools to manage the user's monitors for them. To create a monitor you need at least a `url`. Optional fields: name (defaults to the host), method (HEAD by default; auto-switches to GET when content_rules are set), interval_sec (plan minimum: 300s free / 60s pro), expect_status (exact code; omit for any 2xx/3xx), content_rules (up to 4 body checks), request_headers (up to 4, for auth), request_body (write methods only — checks run on a schedule, so point writes at test data or a dedicated test route, never real customer writes), fail_threshold, recover_threshold. Fill missing details from the conversation, the user's memory/context, or by asking one or two concise questions — prefer sensible defaults over interrogating. A bare URL is enough to start. Call list_monitors first to avoid duplicates. Briefly confirm what you'll add before creating, and report the resulting status afterward. You can also update_monitor (partial edits, incl. enabled:false to pause) and delete_monitor. If create fails with monitor_limit the user is at their plan cap — tell them.",
      "tools": [
        {
          "name": "create_monitor",
          "description": "Create a monitor. Returns the created monitor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_domain": {
                "description": "Look up the domain's registration expiry via RDAP and warn before it lapses. Off by default.",
                "type": "boolean"
              },
              "check_ssl": {
                "description": "https only: report a certificate/TLS failure as a distinct SSL problem instead of a generic connection error. Off by default.",
                "type": "boolean"
              },
              "content_rules": {
                "description": "Up to 4 body rules (text_contains/text_absent/json_field).",
                "type": "array"
              },
              "expect_status": {
                "description": "Exact status required; null/0 = any 2xx/3xx.",
                "type": ["integer", "null"]
              },
              "fail_threshold": {
                "type": "integer"
              },
              "follow_redirects": {
                "description": "Follow 3xx redirects and judge the final response. Off (default) treats a 3xx as reachable.",
                "type": "boolean"
              },
              "interval_sec": {
                "description": "Check interval; floored to plan minimum (free 300, pro 60).",
                "type": "integer"
              },
              "method": {
                "description": "HEAD (default) is forced to GET when content_rules are set.",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "recover_threshold": {
                "type": "integer"
              },
              "request_body": {
                "description": "Body for write methods (POST/PUT/PATCH/DELETE); rejected with GET/HEAD. Sent with EVERY scheduled check — use test data, not real customer writes. application/json unless a Content-Type header overrides.",
                "type": "string"
              },
              "request_headers": {
                "description": "Up to 4 request headers ({name,value,type?}).",
                "type": "array"
              },
              "slow_ms": {
                "description": "Latency at/above this counts as 'slow'.",
                "type": "integer"
              },
              "timeout_ms": {
                "description": "Request timeout, clamped 1000–60000.",
                "type": "integer"
              },
              "url": {
                "description": "Target URL (http/https, public host).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b863db43cecf887e7338f9b435bfaa42c4236329202f592f61e5e59f89a5942"
        },
