{
  "lockfileVersion": 2,
  "subjects": {
    "com.adriansaxton/aacf": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aacf.adriansaxton.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "aacf",
        "title": "AI Adoption Controls Framework",
        "version": "1.2.1"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only access to the AI Adoption Controls Framework (AACF): controls for organisations adopting AI, their Level 3 criteria, and cross-references to standards such as ISO/IEC 42001, the NIST AI RMF and the EU AI Act. Start with get_framework_info. Cross-references are coverage, not a compliance finding. For a self-assessment, use the self_assessment prompt: questions and rules come from this server, answers stay with the user. Cite results with the attribution in each result's cite field (CC BY-SA 4.0).",
      "tools": [
        {
          "name": "get_assessment_questions",
          "title": "Self-assessment questions",
          "description": "Questions, evidence and the applicable Level 3 criteria for one domain (or a published profile), for a self-assessment the user's own assistant runs. Pass the overlays that apply to the organisation. Answers are never sent to this server. Call with no domain to list the domains.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "Domain code or name",
                "type": "string"
              },
              "overlays": {
                "description": "Overlay codes that apply, for example ['PUB', 'GEN']",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "profile": {
                "description": "A published profile, when available",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c8552c7f2873661a20c89f4b7ab61a0f789d3ce6c9bf75828413b42d2e045ce"
        },
        {
          "name": "get_control",
          "title": "Get a control",
          "description": "One control in full: objective, rationale, level descriptors 1 to 5, Level 3 criteria (with the overlays they apply to), questions, evidence, guidance, owners, dependencies and cross-references.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Control ID, for example GOV-01 or SEC-03",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:debb2b8fe3cb1a702978af6fe1656474469897d05ac11f68ca30f507e96aae4a"
        },
        {
          "name": "get_framework_info",
          "title": "Framework overview",
          "description": "Version, scale, overlays, owner roles, lifecycle stages, the cross-referenced standards and how to cite AACF. Call this first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1ba5b07ede1a6bd5028b91b9f4f1f0de06b91d789eedf1758abd54f47bea051"
        },
        {
          "name": "get_mapping",
          "title": "Which controls cover a standard's item",
          "description": "Reverse lookup: the controls that address an item of a standard, with strength (direct or partial) and confidence. A ref that is a prefix (for example 6.1) returns every item under it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ref": {
                "description": "Item in that standard, for example 6.1.2, A.6.2.3, Art. 14 or LLM01:2026",
                "type": "string"
              },
              "standard": {
                "description": "Standard key or name, for example ISO42001, 'ISO/IEC 42001', EUAIA, OWASPLLM",
                "type": "string"
              }
            },
            "required": ["ref", "standard"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9743b8dddf771b153486fb23e800980f03cf4e19a4de684df8226ecd39d0379"
        },
        {
          "name": "get_scoring_rules",
          "title": "Scoring rules",
          "description": "The assessor rulebook: scope, statuses, how to place a level (Level 3 needs every applicable criterion met; never round up), evidence, targets and how to report.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16e38350626753867ffc4e95d28abd7def090a880fbc22d9733d9fbaaca671c8"
        },
        {
          "name": "get_standard_coverage",
          "title": "Coverage of a standard",
          "description": "Every cross-referenced item of one standard, the controls covering each, and summary counts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "standard": {
                "description": "Standard key or name, for example NISTRMF",
                "type": "string"
              }
            },
            "required": ["standard"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92afefde31f69146f114637b69c734220a77bea017e4b4dfe185d3a81d810ff3"
        },
        {
          "name": "list_domains",
          "title": "List domains and controls",
          "description": "Every domain with its summary and the ID and title of each control in it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b4d864cd923b3b5aecb8b362bccb37448a4743c810ed992d1bd36281051436a"
        },
        {
          "name": "search_controls",
          "title": "Search controls",
          "description": "Find controls by words in their title, objective, rationale, criteria or questions, optionally filtered by domain, overlay, owner role or lifecycle stage. Returns summaries; use get_control for detail.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "Domain code or name, for example GOV or Governance",
                "type": "string"
              },
              "lifecycle_stage": {
                "description": "Lifecycle stage key, for example deploy",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "overlay": {
                "description": "Overlay code: PUB, PRV, HIR, GEN, AGT or BLD",
                "type": "string"
              },
              "owner_role": {
                "description": "Owner role key, for example ai_governance_lead",
                "type": "string"
              },
              "text": {
                "description": "Words that must all appear, for example 'human oversight'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b498b760dd3c776ca4e992c4a3c9666fa97fdc3c0a94b6fbd1ee88a0f380d75"
        }
      ],
      "prompts": [
        {
          "name": "self_assessment",
          "title": "Run an AACF self-assessment",
          "description": "Guides your assistant through a self-assessment against AACF, scored on your side.",
          "arguments": [
            {
              "name": "domain",
              "description": "Start with this domain (code or name); otherwise ask the user",
              "required": false
            }
          ],
          "digest": "sha256:b754eed442e33238aae8372ff601b180605f996ffae87eb7ac6d21905055feec"
        }
      ],
      "digest": "sha256:997d190c447ce87e2598f03b3b27a1d72fe9d5475f682f4c45c0d16b3032c1ee"
    }
  }
}
