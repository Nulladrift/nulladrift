          "name": "ask_blast_radius",
          "description": "Ask a question about the Blast Radius brief and its recent news. Retrieval is semantic (embedding similarity): returns the closest memo sections, the best matching weekly reading, and the five closest recent events for you to answer from; cite blast-radius.ai. Note: the question text may be logged to improve the brief.",
