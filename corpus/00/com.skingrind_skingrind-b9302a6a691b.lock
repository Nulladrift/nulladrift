        {
          "name": "search_skins",
          "title": "Search CS2 skins",
          "description": "Search and filter Counter-Strike 2 weapon skins by name, weapon, rarity, collection or case. Returns skin names, rarities, wear ranges and the cheapest current listing price in cents. Use get_skin_detail for a single skin with per-wear prices.",
          "inputSchema": {
            "properties": {
              "collection": {
                "description": "Collection slug.",
                "type": "string"
              },
              "crate": {
                "description": "Case or capsule slug.",
                "type": "string"
              },
              "page": {
                "description": "Page number.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page, 1 to 25. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "rarity": {
                "description": "Rarity name, for example \"Covert\", \"Classified\", \"Restricted\", \"Mil-Spec Grade\".",
                "type": "string"
              },
              "search": {
                "description": "Free-text skin name search, for example \"Redline\". Used alone it also returns matching weapons; combined with any other argument it filters the paginated skin list instead.",
                "type": "string"
              },
              "sort": {
                "description": "Result ordering. Defaults to name. \"popularity\" ranks by listing quantity.",
                "enum": ["name", "rarity", "price_asc", "price_desc", "popularity"],
                "type": "string"
              },
              "souvenir": {
                "description": "Only skins available as Souvenir.",
                "type": "boolean"
              },
              "stattrak": {
                "description": "Only skins available as StatTrak.",
                "type": "boolean"
              },
              "weapon": {
                "description": "Weapon slug, for example \"ak-47\" or \"desert-eagle\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
