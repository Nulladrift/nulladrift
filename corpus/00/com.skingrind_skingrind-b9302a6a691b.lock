          "digest": "sha256:e15ee94e586eb5f1503867206b07a6722fccd325cccd7a5ba46d7492d44e6e5d"
        },
        {
          "name": "get_case_roi_ranking",
          "title": "Get CS2 case ROI ranking",
          "description": "Rank Counter-Strike 2 cases by expected return on opening. Each entry gives the case price, expected value, return in basis points and the chance of an opening being profitable, all computed from current listing prices plus the key price. Cases whose contents are not sufficiently priced are excluded.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:18b8651c4e6f2006418147a8b19f39719d48d06b6074690c51157afaf789217a"
        },
        {
          "name": "get_skin_detail",
          "title": "Get CS2 skin detail",
          "description": "Get one Counter-Strike 2 skin with its float range, per-wear prices, collections and cases. Optionally includes the catalog Trade Up context: which rarity tier the skin sits in and what it can be traded up into.",
          "inputSchema": {
            "properties": {
              "include_tradeup_context": {
                "description": "Include the catalog Trade Up context for this skin. This is contract math derived from the collection, not scanner output.",
                "type": "boolean"
              },
              "skin_slug": {
                "description": "Skin slug, for example \"redline\".",
                "type": "string"
              },
              "weapon_slug": {
                "description": "Weapon slug, for example \"ak-47\".",
                "type": "string"
              }
            },
            "required": ["skin_slug", "weapon_slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:89b1c0636478073b200426ada51d53d0f73968ee2707767ea26a5f9508dcae83"
        },
        {
          "name": "get_tradeup_preview",
          "title": "Get CS2 Trade Up preview",
          "description": "Get the free preview of the SkinGrind Trade Up scanner: the featured Trade Ups with their full recipes, the number of contracts currently active, and locked teasers for recent finds showing their economics and when they unlock. Every input has to be bought at or below its target float, and the costs are hourly price estimates, so the response carries execution_notes explaining what to verify before buying. Full recipes for the whole feed need a SkinGrind account and the authenticated server.",
          "inputSchema": {
            "properties": {
              "type": {
                "description": "Which Trade Up feed to preview: \"profitable\" for contract Trade Ups, \"knife\" for knife and glove Trade Ups, or \"all\". Defaults to all.",
                "enum": ["profitable", "knife", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f12c6470894efa83bf4b47c4a056ea5ebdcf3fec500fe802f7b1b89f34bfa31f"
        },
        {
          "name": "search_cosmetics",
          "title": "Search CS2 cosmetic items",
          "description": "Search Counter-Strike 2 cosmetic items that are not weapon skins: stickers, charms, agents, patches, graffiti and music kits. Returns names and cheapest listing prices, or one item with its full detail including per-marketplace prices.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Which kind of cosmetic item to search.",
                "enum": ["stickers", "charms", "agents", "patches", "graffiti", "music-kits"],
                "type": "string"
              },
              "page": {
                "description": "Page number.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page, 1 to 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Free-text item name search.",
                "type": "string"
              },
              "slug": {
                "description": "Item slug. When set, returns that single item with full detail.",
                "type": "string"
              },
              "sort": {
                "description": "Result ordering. Defaults to name.",
                "enum": ["name", "price_asc", "price_desc"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a35f371c6d8d9096006f834c8bffc2e64b3ff88bc170626815d8f439e23ba7b3"
