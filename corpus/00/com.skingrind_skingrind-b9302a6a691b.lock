      "instructions": "SkinGrind is a Counter-Strike 2 skin database and market analysis service.\n\nThis server exposes read-only reference data: skins and their prices, collections,\ncases with their drop odds and expected return, Armory rotation tiles, cheap-skin\nbargain listings, and cosmetic items (stickers, charms, agents, patches, graffiti,\nmusic kits).\n\nPrices come from CSFloat listings and are refreshed hourly. All money values are\ninteger cents. Rates are basis points where a field name ends in _bps. Case odds\nfollow the standard CS2 tier weights.\n\nTrade Up data on this server is limited to the free preview: the featured Trade Ups\nand locked teasers for recent finds. Full recipes require a SkinGrind account and\nare served by the authenticated server at /mcp/pro.\n\nA Trade Up recipe is not just a list of skins. Every input carries a target_float\nand has to be bought at a float at or below it, since a higher float moves the\ncontract average and can drop the outcome into a worse wear. Every price is the\ncheapest listing seen at the last refresh, and the listing that meets the float\nrequirement is often dearer, so the real cost can run above the quoted one. Give\nthe float ceiling alongside each input and tell the user to check live prices and\nfloats before buying. The preview response repeats this in its execution_notes\nfield.\n\nThis is informational only, not financial advice and not a gambling service.\nOutcomes are random within fixed probabilities, so a contract can lose money\neven when its expected value is positive.\n\nSkinGrind is not affiliated with Valve Corporation.",
      "tools": [
        {
          "name": "browse_bargains",
          "title": "Browse cheap CS2 skins",
          "description": "Find cheap Counter-Strike 2 skins grouped into price-threshold pages, for example AK-47 skins under 10 dollars or the cheapest knives. Without a slug it lists every available page; with a slug it returns the skins on that page with their current cheapest listing price.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Bargain page slug, for example \"ak-47-skins-under-10-dollars\" or \"cheapest-knives\". Omit to list every available page.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6f568c3412c714004a1a1a126cfcffeeaa4b61650cc98764ad9afc84f86f30a4"
        },
        {
          "name": "browse_cases",
          "title": "Browse CS2 cases",
          "description": "List Counter-Strike 2 cases, capsules and souvenir packages, or get one container with its contents plus its drop odds and expected opening value. Odds use the standard CS2 tier weights and are renormalised over the tiers actually present.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page, 1 to 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Free-text container name search.",
                "type": "string"
              },
              "slug": {
                "description": "Container slug. When set, returns that container with its contents and opening odds instead of the list.",
                "type": "string"
              },
              "sort": {
                "description": "List ordering: newest, oldest or name. For a single container the contents order: rarity, name, price_asc or price_desc.",
                "type": "string"
              },
              "type": {
                "description": "Filter the list by container type.",
                "enum": ["weapon_case", "souvenir_package", "autograph_capsule", "sticker_capsule", "graffiti_box", "sticker_collection"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4faa7efd2adc903c3a6b039ebc9978fdfca322bda5529d843aa299f1a1dd0e69"
        },
        {
          "name": "browse_collections",
          "title": "Browse CS2 collections",
          "description": "List Counter-Strike 2 collections, or get one collection with its contents. Optionally includes the collection Trade Up map: which rarity tiers exist in the collection and what each tier can produce. That map is catalog contract math, not scanner output.",
          "inputSchema": {
            "properties": {
              "include_tradeup_map": {
                "description": "Only with slug. Adds the collection Trade Up map showing each rarity tier and its possible outputs.",
                "type": "boolean"
              },
              "page": {
                "description": "Page number.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page, 1 to 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Free-text collection name search.",
                "type": "string"
              },
              "slug": {
                "description": "Collection slug. When set, returns that collection with its contents instead of the list.",
                "type": "string"
              },
              "sort": {
                "description": "List ordering: newest, oldest or name. For a single collection the contents order: rarity, name, price_asc or price_desc.",
                "type": "string"
              },
              "type": {
                "description": "Filter the list by what the collection contains.",
                "enum": ["skin", "sticker", "charm", "agent"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:77da974249bcd78beb2cdb59ae47c365ad7013ee9c4881c29743033c1e8f22b3"
        },
        {
          "name": "get_armory_roi",
          "title": "Get CS2 Armory rotation value",
          "description": "List the current Counter-Strike 2 Armory rotation tiles with their credit cost and expected value, or get one tile with every item it can produce and the rarity weighting. Use this to compare what Armory credits are worth across the current rotation.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Armory tile slug. When set, returns that tile with its full item list instead of the rotation overview.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
