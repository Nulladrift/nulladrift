{
  "lockfileVersion": 2,
  "subjects": {
    "com.promptfrenzy/promptfrenzy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.promptfrenzy.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "promptfrenzy",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PromptFrenzy turns a photo or an idea into an AI image or video using prompts that have already been tested. Search first, read the prompt to learn which inputs it needs, then generate. Browsing is free; generating runs on the user's PromptFrenzy account and needs their API key as a Bearer token.",
      "tools": [
        {
          "name": "animate",
          "description": "Turn a finished PromptFrenzy image generation into a short video clip. Needs the user's API key, and their plan must allow video.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "generation_id": {
                "description": "Id of a ready image generation.",
                "type": "string"
              },
              "motion": {
                "description": "Optional camera-move hint, e.g. 'slow zoom in'.",
                "type": "string"
              }
            },
            "required": ["generation_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9775624a67bc148d900adb89e215db5b79d810a78f4f905120f14367a3cd0816"
        },
        {
          "name": "generate",
          "description": "Run a PromptFrenzy prompt on the user's account and start a render. Returns a generation id immediately — poll get_generation for the result. Spends the user's credits, so it needs their PromptFrenzy API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image_url": {
                "description": "Public https URL of the user's photo, for prompts where needs_photo is true.",
                "type": "string"
              },
              "prompt_id": {
                "description": "Prompt id from search_prompts.",
                "type": "string"
              },
              "text_variables": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Values for the prompt's text inputs, keyed by the input name.",
                "type": "object"
              }
            },
            "required": ["prompt_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7e2a141532d2dc36eb3e510b5e26ba6a0baf28be6b27dade14969ee25ae5df54"
        },
        {
          "name": "get_generation",
          "description": "Check whether a PromptFrenzy generation has finished and get its image or video URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "generation_id": {
                "description": "Id returned by generate or animate.",
                "type": "string"
              }
            },
            "required": ["generation_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:07bcb93123311af03d9a9ffa02eff9e72a7f0bb12f7664c2e295ec605a2ea405"
        },
        {
          "name": "get_prompt",
          "description": "Read one PromptFrenzy prompt: what it makes, which model it runs on, what it costs in credits, and which inputs it needs (a photo, a name, …). The prompt TEXT itself is returned only when an API key is supplied.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Prompt id from search_prompts.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:05a5f1073c187d9f251b6579618ab143238b9aeb6a7801fd872fc2460cfad81f"
        },
        {
          "name": "search_prompts",
          "description": "Search the PromptFrenzy library for a tested AI image or video prompt (toy/LEGO/plushie versions of a photo, portraits, posters, product shots, character sheets, animations). Returns titles, what each prompt needs as input, its credit cost and its page URL. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many results (default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user wants to make, in their own words.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:05c4e9bb66d31d972440b4c86efa2cbc0e78a767b77c2b787ca74a46d5ae11ce"
        }
      ],
      "digest": "sha256:9272a171ad7e2540c017c5ed1c2bcbb1ea549900381fc120c9756f261cad1d82"
    }
  }
}
