        {
          "name": "convert_currency",
          "title": "Currency conversion (GBP/EUR/USD/TRY)",
          "description": "Converts an amount between GBP, EUR, USD and TRY with the exchange rates Evlek stores (refreshed daily) and returns all four equivalents. Currency conversion only: no payment plan, deposit or instalment schedule, tax, fee or acquisition-cost estimate, no advice. Rates older than 24 hours are flagged as stale; beyond 72 hours (or when none are stored) no conversion is produced (FX_UNAVAILABLE).",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Amount to convert: a property price, a monthly rent, any amount from 1 up. Not a deposit or an instalment plan.",
                "maximum": 10000000000,
                "minimum": 1,
                "type": "number"
              },
              "currency": {
                "description": "Currency of the amount. Default GBP. Lower case, symbols (£ € $ ₺) and names (pound, euro, dollar, lira) are read.",
                "enum": ["GBP", "EUR", "USD", "TRY"],
                "type": "string"
              },
              "locale": {
                "description": "Language of the answer and the number format. Pass the language the user writes in. Default en.",
                "enum": ["tr", "en", "ru", "de", "ar"],
                "type": "string"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amounts": {
                "properties": {
                  "EUR": {
                    "type": "number"
                  },
                  "GBP": {
                    "type": "number"
                  },
                  "TRY": {
                    "type": "number"
                  },
                  "USD": {
                    "type": "number"
                  }
                },
                "required": ["EUR", "GBP", "TRY", "USD"],
                "type": "object"
              },
              "assumedCurrency": {
                "description": "True when no currency was given and GBP was assumed.",
                "type": "boolean"
              },
              "code": {
                "description": "Present on a soft refusal (FX_UNAVAILABLE) and on invalid arguments (INVALID_PARAMS).",
                "type": "string"
              },
              "contentLocale": {
                "enum": ["tr", "en", "ru", "de", "ar"],
                "type": "string"
              },
              "dataSource": {
                "type": "string"
              },
              "fx": {
                "properties": {
                  "ageHours": {
                    "description": "Whole hours since the rates were stored.",
                    "type": "number"
                  },
                  "asOf": {
                    "description": "When the rates were stored (ISO 8601, UTC).",
                    "type": "string"
                  },
                  "base": {
                    "enum": ["GBP"],
                    "type": "string"
                  },
                  "rates": {
                    "description": "Units of each currency per 1 GBP, as stored.",
                    "properties": {
                      "EUR": {
                        "type": "number"
                      },
                      "GBP": {
                        "type": "number"
                      },
                      "TRY": {
                        "type": "number"
                      },
                      "USD": {
                        "type": "number"
                      }
                    },
                    "required": ["EUR", "GBP", "TRY", "USD"],
                    "type": "object"
                  },
                  "source": {
                    "enum": ["stored_current_rates"],
                    "type": "string"
                  },
                  "stale": {
                    "description": "True when the rates are older than 24 hours (at most 72 hours: older ones are refused).",
                    "type": "boolean"
                  }
                },
                "required": ["ageHours", "asOf", "base", "rates", "source", "stale"],
                "type": "object"
              },
              "inputCurrency": {
                "enum": ["GBP", "EUR", "USD", "TRY"],
                "type": "string"
              },
              "issues": {
                "items": {
                  "properties": {
                    "allowedValues": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "code": {
                      "type": "string"
                    },
                    "field": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "suggestion": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "field", "message"],
                  "type": "object"
                },
                "type": "array"
              },
              "priceGBP": {
                "description": "The amount in GBP (the same number as amounts.GBP).",
                "type": "number"
              },
              "rateAgeHours": {
                "description": "FX_UNAVAILABLE with reason too_old: how old the stored rates are, in hours.",
                "type": "number"
              },
              "reason": {
                "enum": ["unavailable", "too_old"],
                "type": "string"
              },
              "retryable": {
                "type": "boolean"
              },
              "stale": {
                "description": "True when the stored rates are older than 24 hours.",
                "type": "boolean"
              },
              "usesStoredRate": {
                "type": "boolean"
              },
              "warnings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "field": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
