      "instructions": "Evlek: live Northern Cyprus (KKTC/TRNC) property listings for sale and long-term rent, and asking-price market statistics, from evlek.app. Read-only. Holiday rentals, contact details, valuations, and investment or legal advice are not provided.",
      "tools": [
        {
          "name": "compare_listings",
          "title": "Compare Evlek listings",
          "description": "Compare 2 to 4 public Evlek listings side by side in the user's language: price, price per m² (only when the built area is believable), rooms, bathrooms, built area and plot area (always separate), location, furnishing, key features and data-quality notes, plus a few descriptive highlights (lowest price, largest indoor area, most recently listed). `ids` takes listing ids (UUID), listing numbers (EVL-100464) or evlek.app listing links, in any mix; the order you give is kept. Sale and rent listings are never ranked against each other: a mixed request is shown in two groups with a warning. A reference that is unknown or no longer public is listed in `missingIds` with code NOT_FOUND (this is not an error). Descriptive facts only: no valuation and no recommendation. Pass the user's language as `locale` (tr, en, ru, de or ar).",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "2 to 4 listings, in any mix of ids, numbers and links. The order is kept.",
                "items": {
                  "description": "A listing id (UUID), a listing number (EVL-100464) or an evlek.app listing link.",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "locale": {
                "description": "Language of the answer and of the links. Pass the language the user writes in. Default en.",
                "enum": ["tr", "en", "ru", "de", "ar"],
                "type": "string"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Absent on a comparison. NOT_ENOUGH_LISTINGS when fewer than two of the requested listings are available; SEARCH_BACKEND_UNAVAILABLE, INVALID_PARAMS or INTERNAL_ERROR otherwise.",
                "type": "string"
              },
              "compared": {
                "description": "The listings that were compared, in the order of the request.",
                "items": {
                  "properties": {
                    "areaBasis": {
                      "description": "'gross' when areaSqm is a gross figure (not the indoor area; no price per m² is derived from it); 'net' only when the publisher stated the area is net (Evlek does not measure it); null when the basis is not stated, or there is no built area.",
                      "enum": ["net", "gross", null],
                      "type": ["string", "null"]
                    },
                    "areaLabel": {
                      "type": ["string", "null"]
                    },
                    "areaSqm": {
                      "description": "The BUILT area in m², as the listing page shows it: null on land (see plotM2) and when the page withholds the figure (a plot-looking number on a small home, a closed area too small for its rooms); otherwise shown even when areaSuspect is true. A gross figure says so in areaBasis.",
                      "type": ["number", "null"]
                    },
                    "areaSuspect": {
                      "type": "boolean"
                    },
                    "areaText": {
                      "type": ["string", "null"]
                    },
                    "bathrooms": {
                      "type": ["number", "null"]
                    },
                    "bedrooms": {
                      "type": ["number", "null"]
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "cityLabel": {
                      "type": ["string", "null"]
                    },
                    "contentLocale": {
                      "enum": ["tr", "en", "ru", "de", "ar"],
                      "type": "string"
                    },
                    "currency": {
                      "type": ["string", "null"]
                    },
                    "dataQuality": {
                      "properties": {
                        "areaSuspect": {
                          "type": "boolean"
                        },
                        "areaSuspectReasons": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "flags": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "missingFields": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "priceOutlier": {
                          "type": "boolean"
                        },
                        "titleRoomMismatch": {
                          "type": "boolean"
                        }
                      },
                      "type": "object"
                    },
                    "district": {
                      "type": ["string", "null"]
                    },
                    "featureKeys": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "furnished": {
                      "enum": ["yes", "no", "unknown"],
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "listedAt": {
                      "type": ["string", "null"]
                    },
                    "listingNumber": {
                      "type": ["number", "null"]
                    },
                    "listingRef": {
                      "type": ["string", "null"]
                    },
                    "localeFallback": {
                      "type": "boolean"
                    },
                    "monthlyRentGbp": {
                      "type": ["number", "null"]
                    },
                    "notes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "officeName": {
                      "type": ["string", "null"]
                    },
                    "plotM2": {
                      "type": ["number", "null"]
                    },
                    "price": {
                      "type": "number"
                    },
                    "priceGbp": {
                      "type": ["number", "null"]
                    },
                    "pricePerSqmGbp": {
                      "description": "GBP per m², by the listing page's own rule: null whenever the built area is flagged suspect, withheld, or gross (areaBasis 'gross'), and on land below 150 m².",
                      "type": ["number", "null"]
                    },
                    "propertyType": {
                      "type": ["string", "null"]
                    },
                    "propertyTypeLabel": {
                      "type": ["string", "null"]
                    },
                    "rentPeriod": {
                      "enum": ["month", null],
                      "type": ["string", "null"]
                    },
                    "roomLabel": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "transaction": {
                      "enum": ["sale", "rent"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "transaction", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "contentLocale": {
                "description": "The language every link resolved to; null when the listings differ (see compared[].contentLocale).",
                "enum": ["tr", "en", "ru", "de", "ar", null],
                "type": ["string", "null"]
              },
              "count": {
                "type": "number"
              },
              "dataSource": {
                "type": "string"
              },
              "groups": {
                "description": "The compared listings by transaction (sale and rent are never ranked against each other).",
                "items": {
                  "properties": {
                    "ids": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "transaction": {
                      "enum": ["sale", "rent"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "insights": {
                "items": {
                  "properties": {
                    "code": {
                      "enum": ["cheapest", "largest_closed_area", "newest"],
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "listingRef": {
                      "type": ["string", "null"]
                    },
                    "text": {
                      "type": "string"
                    },
                    "transaction": {
                      "enum": ["sale", "rent"],
                      "type": "string"
                    },
                    "value": {
                      "type": ["number", "string"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "isEstimate": {
                "type": "boolean"
              },
              "issues": {
                "items": {
                  "properties": {
                    "allowedValues": {
                      "items": {
                        "type": ["string", "number"]
                      },
                      "type": "array"
                    },
                    "code": {
                      "type": "string"
                    },
                    "field": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "suggestion": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "locale": {
                "enum": ["tr", "en", "ru", "de", "ar"],
                "type": "string"
              },
              "localeFallback": {
                "description": "True when at least one link opens a page in another language than requested.",
                "type": "boolean"
              },
              "metricType": {
                "type": "string"
              },
              "missing": {
                "type": "number"
              },
              "missingIds": {
                "description": "One NOT_FOUND entry per requested reference that names no public listing.",
                "items": {
                  "properties": {
                    "code": {
