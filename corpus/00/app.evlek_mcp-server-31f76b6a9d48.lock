        {
          "name": "search",
          "title": "Search Evlek property listings",
          "description": "For research and citation lookups (deep research): free-text search of live Northern Cyprus (KKTC/TRNC) property listings on Evlek, in Turkish, English, Russian, German or Arabic. Returns matching listings as id/title/url, newest first (sale and rent as two groups when the query names neither). The answer language follows the language of the query. OpenAI deep-research compatible format, for research and citation clients. Use when: the caller only has a free-text query (\"2+1 apartment in Kyrenia under 150000 pounds\", \"EVL-100464\"). Not for: structured filters, paging or choosing the answer language.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Free-text property search query",
