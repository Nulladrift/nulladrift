        {
          "name": "market_stats",
          "title": "Northern Cyprus market statistics",
          "description": "Market statistics for Northern Cyprus from asking prices of active public listings (not sales, valuations or forecasts). No city = the island by city; one city = its districts; several = side by side; city + district = a district profile. Sale and rent are reported separately. Each figure has activeCount (public listings in scope) and sampleCount (the cleaned sample behind the statistic); below 10 sampled listings it is withheld. Pass locale.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City names in any language, e.g. [\"Girne\"]. One gives its districts, two or more are compared (max 6). Omit for the whole island.",
                "items": {
                  "description": "A city name, e.g. Girne, Kyrenia, Gazimağusa, Famagusta.",
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "district": {
                "description": "A district, village or region (Alsancak, Long Beach, Karpaz) for a profile. The city is inferred when the name is unambiguous.",
                "type": "string"
              },
              "locale": {
                "description": "Language of the answer text, number formats and links (default en). Pass the language the user is writing in.",
                "enum": ["tr", "en", "ru", "de", "ar"],
                "type": "string"
              },
              "propertyType": {
                "description": "Limit to property types or groups, e.g. [\"apartment\"] or [\"house\"]. Price statistics cover residential types only.",
                "items": {
                  "description": "A property type (apartment, villa, penthouse, studio, ...) or a group (house, land, commercial).",
                  "type": "string"
                },
                "type": "array"
              },
              "transaction": {
                "description": "'sale' or 'rent' (long-term). Omit for both: they are reported separately and never mixed.",
                "enum": ["sale", "rent"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "additionalDeals": {
                "description": "The other deal when both were asked for: the same rows as `cities`.",
                "items": {
                  "additionalProperties": true,
                  "description": "{ type, cities } with the same city rows as `cities`.",
                  "type": "object"
                },
                "type": "array"
              },
              "asOf": {
                "type": ["string", "null"]
              },
              "cities": {
                "items": {
                  "properties": {
                    "activeCount": {
                      "description": "Every public listing in the scope (any property type).",
                      "type": "number"
                    },
                    "city": {
                      "description": "Official Turkish name.",
                      "type": "string"
                    },
                    "cityId": {
                      "type": "string"
                    },
                    "cityName": {
                      "description": "Display name in the answer language.",
                      "type": "string"
                    },
                    "confidence": {
                      "enum": ["limited", "medium", "stronger", null],
                      "type": ["string", "null"]
                    },
                    "count": {
                      "description": "Legacy alias of sampleCount.",
                      "type": "number"
                    },
                    "districts": {
                      "items": {
                        "additionalProperties": true,
                        "description": "district, districtId and the same statistic fields.",
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "districtsTotal": {
                      "type": "number"
                    },
                    "exclusions": {
                      "additionalProperties": true,
                      "description": "nRaw, nUnique, nDuplicates, nIqrExcluded, nOtherExcluded and nNotIndexEligible (= activeCount - nRaw); null when the engine has no waterfall.",
                      "type": ["object", "null"]
                    },
                    "lowSample": {
                      "type": "boolean"
                    },
                    "medianPrice": {
                      "type": ["number", "null"]
                    },
                    "medianPricePerSqm": {
                      "description": "Sale only.",
                      "type": ["number", "null"]
                    },
                    "p25Price": {
                      "type": ["number", "null"]
                    },
                    "p75Price": {
                      "type": ["number", "null"]
                    },
                    "provenance": {
                      "additionalProperties": true,
                      "description": "publishers, agencies, maxAgencyShare, singleSource.",
                      "type": "object"
                    },
                    "sampleCount": {
                      "description": "The cleaned sample the statistic is based on. Not an active count.",
                      "type": "number"
                    },
                    "status": {
                      "description": "Capped at preliminary when one office dominates the sample (statusNote single_office).",
                      "enum": ["proven", "preliminary", "collecting"],
                      "type": "string"
                    },
                    "statusNote": {
                      "type": ["string", "null"]
                    },
                    "topDistrict": {
                      "type": ["string", "null"]
                    },
                    "topDistrictMedianPrice": {
                      "type": ["number", "null"]
                    },
                    "withheldReason": {
                      "enum": ["insufficient_sample", "no_value", "not_indexed", "region_scope", null],
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "code": {
                "description": "On a soft answer: INVALID_LOCATION, OUT_OF_SCOPE or SEARCH_BACKEND_UNAVAILABLE.",
                "type": "string"
              },
              "contentLocale": {
                "type": "string"
              },
              "dataAsOf": {
                "type": ["string", "null"]
              },
              "dataSource": {
                "enum": ["live_active_listings", "daily_snapshot"],
                "type": "string"
              },
              "district": {
                "additionalProperties": true,
                "description": "District profile: sale and rent statistics, personas, asking-rent ratio and listing details.",
                "type": "object"
              },
              "isEstimate": {
                "type": "boolean"
              },
              "issues": {
                "items": {
                  "additionalProperties": true,
                  "description": "code, field, message and, where there is one, allowedValues and suggestion.",
                  "type": "object"
                },
                "type": "array"
              },
              "locale": {
                "type": "string"
              },
              "localeFallback": {
                "type": "boolean"
              },
              "methodology": {
                "type": "string"
              },
              "metricType": {
                "type": "string"
              },
              "mode": {
                "enum": ["overview", "city", "comparison", "district"],
                "type": "string"
              },
              "suggestions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "totals": {
                "additionalProperties": true,
                "description": "Per deal: activeCount and sampleCount summed over the scope.",
                "type": "object"
              },
              "transaction": {
                "enum": ["sale", "rent", null],
                "type": ["string", "null"]
              },
              "type": {
                "description": "The deal of `cities` (sale when both were asked for).",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "warnings": {
                "items": {
                  "additionalProperties": true,
                  "description": "code, field and message.",
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
