                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "retryable": {
                "description": "True when the search backend could not answer (code SEARCH_BACKEND_UNAVAILABLE).",
                "type": "boolean"
