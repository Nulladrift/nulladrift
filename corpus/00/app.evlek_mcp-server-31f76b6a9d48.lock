                    "type": "array"
                  },
                  "contractType": {
                    "type": "string"
                  },
                  "currency": {
                    "enum": ["GBP", "EUR", "USD", "TRY"],
                    "type": "string"
                  },
                  "district": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "features": {
