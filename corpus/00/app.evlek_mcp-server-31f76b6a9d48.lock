        {
          "name": "search_listings",
          "title": "Search Northern Cyprus property listings",
          "description": "Use this when the user wants to find or see property listings; results are shown with real photos in the Evlek widget. Search live Evlek property listings for sale and long-term rent in Northern Cyprus (KKTC/TRNC; prices in GBP unless a currency is given; 2+1 means bedrooms 2) with structured filters: transaction, city, district, property type, bedrooms, price, areas, amenities, nearby university. Pass the user's language as `locale` (tr|en|ru|de|ar): the text, amenity names, number formats and links follow it. Returns at most 10 listings per call, each as one readable line (type, place, price, rooms, area, a deterministic sentence, data notes, canonical link) plus a structured card; continue with the `nextCursor` of a group. Without `transaction`, listings for sale and for rent come as two separate groups, each with its own cursor that is only valid together with that group's transaction. Place names in any language are resolved; an unknown place returns suggestions instead of results. An amenity that cannot be filtered on is reported as not applied. Returns advertised asking-price and listing facts only: not a valuation, verification of property-specific claims, forecast, ranking or recommendation.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Structured search over active Evlek property listings in Northern Cyprus (sale and long-term rent; holiday lets are not offered). Every field is optional; a listing must match ALL the fields you set. `transaction` is required when you filter or sort by price or page with `cursor`. At most 10 listings are returned per call; continue with `cursor`. Sort orders: newest = latest first (default), price-low = cheapest first, price-high = most expensive first, price-per-sqm-asc = lowest price per m², area-large / area-small = largest / smallest closed area, nearest-uni = closest to a university. Pass `locale` in the language the user writes in.",
            "properties": {
              "areaMax": {
                "description": "Maximum closed (built, indoor) area in m², inclusive.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "areaMin": {
                "description": "Minimum CLOSED (built, indoor) area in m², inclusive. For plots and gardens use landAreaMin instead.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "availableNow": {
                "description": "Rentals only: true = can be moved into immediately. Without `transaction` the search is limited to rent.",
                "type": "boolean"
              },
              "bathroomsMin": {
                "description": "Minimum number of bathrooms, inclusive (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "bbox": {
                "additionalProperties": false,
                "description": "Map rectangle in Northern Cyprus, WGS84 degrees: {west, south, east, north}. For \"this map area\" only; otherwise use city and district.",
                "properties": {
                  "east": {
                    "description": "Right edge, longitude in decimal degrees. Must be larger than west.",
                    "maximum": 34.65,
                    "minimum": 32.7,
                    "type": "number"
                  },
                  "north": {
                    "description": "Top edge, latitude in decimal degrees. Must be larger than south.",
                    "maximum": 35.78,
                    "minimum": 34.95,
                    "type": "number"
                  },
                  "south": {
                    "description": "Bottom edge, latitude in decimal degrees (34.95 to 35.78). Must be smaller than north.",
                    "maximum": 35.78,
                    "minimum": 34.95,
                    "type": "number"
                  },
                  "west": {
                    "description": "Left edge, longitude in decimal degrees (32.7 to 34.65). Must be smaller than east.",
                    "maximum": 34.65,
                    "minimum": 32.7,
                    "type": "number"
                  }
                },
                "required": ["east", "north", "south", "west"],
                "type": "object"
              },
              "bedrooms": {
                "additionalProperties": false,
                "description": "Bedrooms as an object: {\"exact\": 3}, {\"min\": 2} or {\"min\": 2, \"max\": 4}; integers 0-20. Use exact for \"a 3-bedroom\".",
                "properties": {
                  "exact": {
                    "description": "Exact number of bedrooms; 0 means a studio. Cannot be combined with min or max.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "max": {
                    "description": "Maximum number of bedrooms, inclusive.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "min": {
                    "description": "Minimum number of bedrooms, inclusive.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "billsIncluded": {
                "description": "Rentals only: true = the rent includes utility bills. Without `transaction` the search is limited to rent.",
                "type": "boolean"
              },
              "city": {
                "description": "City names in any language, e.g. [\"Girne\"] or [\"Kyrenia\", \"Famagusta\"]; ANY match counts. Towns and villages go in `district`.",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "contractType": {
                "description": "Contract type. Rentals: 'monthly', 'semester' or 'yearly'. Sales: 'cash' or 'installment'. Must fit `transaction`.",
                "enum": ["monthly", "semester", "yearly", "cash", "installment"],
                "type": "string"
              },
              "currency": {
                "default": "GBP",
                "description": "Currency of priceMin and priceMax: GBP (default), EUR, USD or TRY. Converted to GBP on the server at the current Evlek rate.",
                "enum": ["GBP", "EUR", "USD", "TRY"],
                "type": "string"
              },
              "cursor": {
                "description": "Pass the previous `nextCursor` with the SAME filters, sort and transaction. Opaque: never build or edit it. Requires `transaction`.",
                "maxLength": 1024,
                "minLength": 16,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "district": {
