          "listChanged": true
        }
      },
      "instructions": "Get the upscaling information before creating an asynchronous image upscaling task, then repeat get_upscale_task about every 5 seconds until its status is succeeded or failed. Reuse the same idempotency key when retrying the same creation request.",
      "tools": [
        {
          "name": "get_upscale_info",
          "title": "Get image upscaling information",
          "description": "Check top-level balance and can_create_tasks, available output tiers, prices, and input limits before creating paid tasks.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "balance": {
                    "type": "number"
                  },
                  "can_create_tasks": {
                    "type": "boolean"
                  },
                  "engine": {
                    "const": "physics",
                    "type": "string"
                  },
                  "formats": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "max_file_size_bytes": {
                    "type": "number"
                  },
                  "tiers": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "available": {
                          "type": "boolean"
                        },
                        "credits": {
                          "type": "number"
                        },
                        "resolution_tier": {
                          "enum": [2, 4, 8, 16],
                          "type": "number"
                        }
                      },
                      "required": ["available", "credits", "resolution_tier"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["balance", "can_create_tasks", "engine", "formats", "max_file_size_bytes", "tiers"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "additionalProperties": {},
                    "properties": {
                      "code": {
                        "type": "string"
                      },
                      "message": {
                        "type": "string"
                      }
                    },
                    "required": ["code", "message"],
                    "type": "object"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
