        },
        {
          "name": "get_upscale_task",
          "title": "Get an image upscaling task",
          "description": "Read an account-owned task in pending, processing, succeeded, or failed state with top-level credits_remaining. Repeat this tool call about every 5 seconds until the task reaches succeeded or failed; each call reads the stored database state without polling the image provider. A successful result includes a temporary download_url and expires_at.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "description": "The UUID returned when creating an upscaling task.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "credits_charged": {
                    "type": "number"
                  },
                  "credits_remaining": {
                    "type": "number"
                  },
                  "download_url": {
                    "pattern": "^https:\\/\\/",
                    "type": "string"
                  },
                  "error_code": {
                    "type": "string"
                  },
                  "expires_at": {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  },
                  "resolution_tier": {
                    "enum": [2, 4, 8, 16],
                    "type": "number"
                  },
                  "status": {
                    "enum": ["pending", "processing", "succeeded", "failed"],
                    "type": "string"
                  },
                  "task_id": {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$",
                    "type": "string"
                  }
                },
                "required": ["credits_charged", "credits_remaining", "resolution_tier", "status", "task_id"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "additionalProperties": {},
