        {
          "name": "match_bouquet_photo",
          "title": "Match bouquet photo",
          "description": "Use this tool when the user provides a photo of a bouquet or flower arrangement and wants to find visually similar products available through Blumee. Identifies the flowers and colours in the photo (Pl@ntNet + vision model) and returns the closest real offers. Send the photo as image_file (attached file), image_url (public https) or image_base64 — exactly one. If you can see the photo but cannot pass it to this tool, call search_flower_offers with your own description instead. Takes ~5-15 s.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "image_base64": {
                "description": "Base64 of the image file, for programmatic clients only (max 8 MB decoded).",
                "maxLength": 11184875,
                "type": "string"
              },
              "image_file": {
                "additionalProperties": false,
                "description": "The photo the user attached (ChatGPT fills this automatically from the attachment).",
                "properties": {
                  "download_url": {
                    "format": "uri",
                    "maxLength": 4096,
                    "type": "string"
                  },
                  "file_id": {
                    "maxLength": 256,
                    "minLength": 1,
                    "type": "string"
                  },
                  "file_name": {
                    "maxLength": 512,
                    "type": "string"
                  },
                  "mime_type": {
                    "maxLength": 128,
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "image_url": {
                "description": "Public https URL of the photo (JPEG, PNG, WebP or HEIC, max 8 MB).",
                "format": "uri",
                "maxLength": 4096,
                "type": "string"
