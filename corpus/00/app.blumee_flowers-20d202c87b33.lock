      "instructions": "Blumee compares flower bouquets and potted plants from partner online shops that deliver anywhere in Germany. Prices are in EUR; titles and descriptions are German. Use search_flower_offers for anything the user describes in words, match_bouquet_photo when they show a photo of a bouquet, browse_catalog to filter by exact attributes or shop, and get_flower_offer for details and the same bouquet at other shops/sizes. Always give the user the buy_url of an offer as the link to order it (it opens the partner shop via Blumee); url is the Blumee page describing it. Never invent offers, prices or links. Prices and availability come from the shops and may change; the shop page is authoritative.",
      "tools": [
        {
          "name": "browse_catalog",
          "title": "Browse catalog",
          "description": "List offers by exact attributes: flower, colour, occasion, shop, price range, delivery time, with sorting and paging. Use this to answer \"what does shop X have\", \"cheapest tulips\", or to page through everything matching a filter. The first call (no cursor) also returns available_values — the valid flower, colour, occasion and shop values. For free-form wishes use search_flower_offers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "colors": {
                "description": "Colour values exactly as listed in available_values.colors.",
                "items": {
                  "maxLength": 32,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "cursor": {
                "description": "next_cursor from a previous browse_catalog call, for the next page.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "flowers": {
                "description": "German flower names exactly as listed in available_values.flowers (e.g. \"Rose\", \"Tulpe\").",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "limit": {
                "description": "How many offers to return (default 8, max 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_delivery_days": {
                "description": "Latest acceptable delivery, in days from today, for an address in Germany (1 = tomorrow). If the user names a date, convert it to days. Hard filter on the shop-stated delivery time.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_eur": {
                "description": "Upper price limit in EUR, inclusive. Hard filter.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "min_price_eur": {
                "description": "Lower price limit in EUR. Hard filter.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "occasions": {
                "description": "Occasion keywords, e.g. \"birthday\", \"valentines\", \"Geburtstag\". Matched as substrings.",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "shops": {
                "description": "Shop names exactly as listed in available_values.shops.",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "sort": {
                "description": "Result order. Default mixes shops.",
                "enum": ["default", "price_asc", "price_desc", "newest"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
