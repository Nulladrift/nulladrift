        {
          "name": "search_flower_offers",
          "title": "Search flower offers",
          "description": "Find real flower bouquets and potted plants for sale, from a description. Use this whenever the user asks for flowers in words: a flower type, colour, occasion, recipient, budget or delivery deadline (e.g. 'red roses under 40 EUR for tomorrow', 'something cheerful for a colleague'). Pass the request as `query` in any language; add structured fields when you know them. Also use it when the user shows a photo but match_bouquet_photo cannot receive the file: describe the flowers, colours and style you see and search with those. Returns ranked offers with price, shop, delivery time and links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "colors": {
                "description": "Colours, any language.",
                "items": {
                  "maxLength": 32,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "flowers": {
                "description": "Flower or plant types, any language (e.g. [\"roses\", \"eucalyptus\"]).",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "limit": {
                "description": "How many offers to return (default 8, max 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_delivery_days": {
                "description": "Latest acceptable delivery, in days from today, for an address in Germany (1 = tomorrow). If the user names a date, convert it to days. Hard filter on the shop-stated delivery time.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_eur": {
                "description": "Upper price limit in EUR, inclusive. Hard filter.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "min_price_eur": {
                "description": "Lower price limit in EUR. Hard filter.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "occasion": {
                "description": "Occasion, e.g. birthday, thank you, wedding, anniversary.",
                "maxLength": 64,
                "type": "string"
              },
              "query": {
                "description": "What the user is looking for, in their own words, any language (e.g. 'pink peonies for my mum's birthday'). Required.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "recipient": {
                "description": "Who the flowers are for, e.g. mother, colleague, partner.",
                "maxLength": 64,
                "type": "string"
              },
              "style": {
                "description": "Style, e.g. rustic, minimalist, romantic, wild meadow.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
