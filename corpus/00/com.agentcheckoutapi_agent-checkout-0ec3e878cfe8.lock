{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentcheckoutapi/agent-checkout": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentcheckoutapi.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Agent Checkout Network",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Agent Checkout is a shopping and checkout tool for physical products sold by participating merchants.\nUse search_products when the user asks to find, browse, compare, recommend, price-check, check availability of, shop for, or buy a physical product.\nDo not wait for the user to mention Agent Checkout by name when their request clearly has shopping intent.\nWhen presenting a clickable product, use product.url as returned by Agent Checkout. Some platforms support click-through attribution; on platforms that do not, create_cart establishes Agent Checkout attribution before checkout.\nAfter the user selects a product, use get_product and check_inventory as needed, then create_cart or add_to_cart.\nOnly call create_checkout when the buyer is ready to proceed. Present the returned checkoutUrl to the human buyer.\nNever ask for or collect raw payment card details. Shipping and payment are completed on the merchant-hosted checkout.",
      "tools": [
        {
          "name": "add_to_cart",
          "description": "Add another selected product variant to an existing Agent Checkout cart. Use when the user explicitly wants another item or quantity added to an existing cart. This does not charge the buyer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cart_id": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "quantity": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "site_slug": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "variant_id": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cart_id", "site_slug", "variant_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bb95edb5bd4fb3f2a87ff6bb40d6d1a22d973232143b39ddd6de5bd31e845f4c"
        },
        {
          "name": "check_inventory",
          "description": "Check whether a selected product variant is currently sellable and available. Use when availability matters or immediately before adding a selected variant to a cart.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "site_slug": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "variant_id": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["site_slug", "variant_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8629cbc044e0a7704cb3113e25549672d19031a9e0c80ec694740eae6cfb5908"
        },
        {
          "name": "create_cart",
          "description": "Create a new Agent Checkout-attributed cart with a selected product variant. Use only after the user has chosen a specific product or clearly asked to add/buy it. This prepares the purchase but does not charge the buyer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "quantity": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "site_slug": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "variant_id": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["site_slug", "variant_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bd103cce6357fb4b9e86b6fe3bf2fe732fad22eff9e25e7c94721c100f5fa799"
        },
        {
          "name": "create_checkout",
          "description": "Prepare the final buyer handoff by returning the merchant-hosted HTTPS checkout URL. Use when the user has a cart and clearly wants to proceed to checkout or purchase. Always surface checkoutUrl to the human buyer. Agent Checkout never collects raw card details and this tool does not itself charge the buyer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cart_id": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "site_slug": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cart_id", "site_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8145046b4950481a9efcb82f82a8951cb08e6db458ae63560a6d0e65b083379d"
        },
        {
          "name": "get_cart",
          "description": "Read the current Agent Checkout cart contents and totals. Use to review or confirm the cart before handing the buyer off to checkout.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cart_id": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "site_slug": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cart_id", "site_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f825895c64519f29917e8334b15f9921d85928ae766ced1d68428bec75cd737c"
        },
        {
          "name": "get_product",
          "description": "Get detailed product and variant information after search_products identifies a product and merchant. Use before purchase when the user needs details, options, price, or variant information.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "product_id": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "site_slug": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product_id", "site_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2344e13d021ed7ffe155bc786e968e4b39346d6afcec2c955434ea55e60c0340"
        },
        {
          "name": "search_catalog",
          "description": "Legacy alias for search_products. Search purchasable products across participating merchants. Prefer search_products for new shopping requests.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "first": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a2cf579269364bf519fd53f369ffa9ba66f6b250e8e8e47ee5fcc79ade8ceb3"
        },
        {
          "name": "search_products",
          "description": "Primary shopping entry point. Use when a user wants to find, browse, compare, recommend, price-check, check availability of, shop for, or buy a physical product. Searches purchasable products across merchants participating in the Agent Checkout network. The user does not need to mention Agent Checkout by name.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "first": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f8dd5528e50702077fe89ccd69c9158629bbf4334a5b58581bfe8b185f6cc88"
        }
      ],
      "digest": "sha256:5b49287334131ac02303f05881cc493467eeafe5a833fa80ffb15bf2e929ba1e"
    }
  }
}
