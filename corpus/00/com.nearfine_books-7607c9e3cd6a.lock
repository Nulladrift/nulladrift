        },
        "logging": {},
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Near Fine searches booksellers around the world for a book, and returns every offer that can reach the buyer's country, with shipping and prices in the buyer's currency. Use search_books with an ISBN for an exact edition or with title and author keywords, plus anything the buyer asks for, such as a first edition or a price cap. Use list_sources to see which booksellers serve a country. When nothing suits, offer an alert: set_alert watches the search for six months and emails the buyer once when a new listing turns up with everything the query asks for. The first alert tool the buyer uses asks them to sign in to Near Fine. list_alerts shows their alerts and what each found, and cancel_alert cancels one. They can also set an alert themselves on the search_url page. Once signed in, the buyer's favourite booksellers carry favourite: true in search_books and list_sources: say when one of them has a copy and how it compares with the cheapest, rather than preferring it. When the buyer wants to tell Near Fine something, such as a wrong price or a missing bookseller, send_feedback sends it to the people who run it, once the buyer has seen the exact message and agreed. Never send feedback unasked.",
      "tools": [
        {
          "name": "cancel_alert",
          "title": "Cancel an alert",
          "description": "Cancel one of the person's alerts on Near Fine by its id, from list_alerts or set_alert, deleting it as its Delete button on Near Fine does. The first time, they sign in. Returns the cancelled alert and the person's plan.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The alert’s id",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:214afdecfe2981abf23edcfe8733a6f0790e5eb5727b4631ec45dc7620cec176"
        },
        {
          "name": "list_alerts",
          "title": "List alerts",
          "description": "List the person's alerts on Near Fine. The first time, they sign in. Finds come first, then alerts being checked, then the rest, newest first. Each has its id, query, country, status, when it was set, last checked and runs until, a link to it on Near Fine, how many times it has emailed a find and when it last did, and, once it has found a listing, the cheapest it last found: its title, seller, condition, price and shipping in the person's currency, and the URL to buy it. Statuses: pending (noting what's listed already), live (watching, as a Pro alert stays after a find), found (emailed a find and stopped), ended (the person got the book or stopped it), expired (ran its six months) and paused (the plan has room for fewer alerts). Also returns the person's plan.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea776555c663f2d65f34b641ead7fe584b5c8fb6be2701768603a2ba0944d75b"
        },
        {
          "name": "list_sources",
          "title": "List sources",
          "description": "List the bookseller catalogs Near Fine searches, each with its bookseller and the countries it serves. Pass a country to see only the sources that serve buyers there. When the buyer has signed in, their favourite booksellers carry favourite: true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Only list sources serving buyers in this country (ISO 3166-1 alpha-2)",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:260ce52f5c7c944f7484e1a137980531021a6cb1d573bb0fbfb6950b3a336932"
        },
        {
          "name": "search_books",
          "title": "Search books",
          "description": "Search for a book across every bookseller Near Fine covers for the buyer's country, ebook and audiobook stores included; list_sources names them. Shops' ebooks and audiobook downloads are offered only in their own country. Pass an ISBN-10 or ISBN-13 for an exact edition, or title and author keywords. The query can also carry a price cap, as in \"under $40\" or \"max 30 €\" (in the buyer's currency when it names none), and ask for a first edition, a signed copy, a dust jacket, a hardcover or a paperback, as in \"wolf hall signed first edition under £200\", or for an ebook or audiobook alone. Offers over the cap, counting known shipping, and offers in other formats than the one asked for are left out; criteria reports what was read. Pass seller to see only some booksellers' offers, by name or part of one, or by a shop's own name in another script. Returns offers sorted cheapest first, those with unpublished shipping from abroad after every known total, each with title, seller, condition (new, used or a grade such as very good, ebook or audiobook), the seller's own grade where given, the edition's publisher and year where the bookseller gives them, price and shipping in the seller's currency, the same in the buyer's currency when it differs, and the URL to buy. Shipping is left out where the shop doesn't publish it. Each offer may carry a match from 0 to 1: how sure a decision model is that the listing is the book searched for rather than a study guide, summary, adaptation or another book that shares a word. A copy of the ISBN searched for has 1, and on a keyword search one the model doubts takes its best match for the same book elsewhere. Offers below 0.5 are left out and counted in doubtful. When the query asks for attributes, each offer carries verdicts: true where the decision model, reading the listing and any filter the bookseller applied, confirms the listing claims it, false where it doesn't, and left out where unjudged. Also reports which sources answered, failed or timed out, a cover image of the best match, an amazon_url that opens the same search on the buyer's Amazon site, and a search_url that opens it on Near Fine, where the buyer can set an alert and get an email when a new listing turns up with everything the query asks for. When the buyer has signed in and favours some booksellers, offers from those carry favourite: true; say when one of them has a copy and how far it is from the cheapest, rather than preferring it. A search takes a few seconds.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Country the buyer is in, as an ISO 3166-1 alpha-2 code such as US, GB or DE. Defaults to US.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "query": {
                "description": "ISBN-10, ISBN-13 (hyphens and spaces allowed) or title and author keywords, optionally with a price cap and attributes such as \"first edition under $40\"",
                "type": "string"
              },
              "seller": {
                "description": "Only these booksellers' offers, each named as the offers' seller names it or by part of the name, such as \"World of Books\", or \"abe\" for every AbeBooks site. A whole name means that seller alone.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://nearfine/results-card"
            },
            "ui/resourceUri": "ui://nearfine/results-card"
          },
          "digest": "sha256:561e9143d7ddd76239124bb9c8f3b36a47d5c6563139a7ad62d4b3f34b9111a7"
        },
        {
          "name": "send_feedback",
          "title": "Send feedback",
          "description": "Send feedback from the person to the people who run Near Fine, such as a wrong price, a dead link, a missing bookseller or a search that found the wrong book. Use it only when the person asks to send feedback or agrees when you offer. Never send feedback on your own initiative. Before sending, show the person the exact message and wait for their approval. Put no personal details in it. Pass an email address only if the person chooses to give one for a reply. Pass the query or search_url it's about, if there is one. The email we get says it came from an assistant. Returns what was sent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "An email address for a reply, only if the person chose to give one",
                "type": "string"
              },
              "message": {
                "description": "The feedback, exactly as the person approved it",
                "maxLength": 4000,
                "type": "string"
              },
              "query": {
                "description": "The search the feedback is about, as passed to search_books",
                "type": "string"
              },
              "search_url": {
                "description": "The search_url from search_books that the feedback is about",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:48dc4009a556103b98a81fd5d884b19486ac2eb0e83b7e86eae43036bb006023"
        },
        {
          "name": "set_alert",
          "title": "Set an alert",
          "description": "Set an alert on a search for the person. The first time, they sign in to Near Fine. Near Fine checks the alert for six months and emails them when a new listing turns up with everything the query asks for, such as a first edition, a signed copy or a price cap. On the Pro plan the alert keeps watching after a find and emails again when newer listings turn up; on other plans it stops after one email. The query reads as search_books reads it. Listings there already never count: the alert stays pending until its first check has noted them. Setting an alert that's already set keeps it as it is. Returns the alert, with its status and its link on Near Fine, and the person's plan: how many alerts it allows, how many are in use and how often each is checked. A full plan comes back as an error; paid plans, at plans_url, have more.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Country the book has to reach, as an ISO 3166-1 alpha-2 code such as US, GB or DE",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "query": {
                "description": "ISBN or title and author keywords, with anything the person wants beyond the book, as in \"wolf hall signed first edition under £200\"",
                "type": "string"
              }
            },
            "required": ["country", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3391c1e6c87b0c792a7147380972e656fd1229cadcf6f602d36753fb50e1bfac"
        }
      ],
