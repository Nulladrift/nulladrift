      "serverInfo": {
        "name": "nearfine",
        "title": "Near Fine",
        "version": "1.0.0",
        "websiteUrl": "https://nearfine.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "logging": {},
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Near Fine searches booksellers around the world for a book, and returns every offer that can reach the buyer's country, with shipping and prices in the buyer's currency. Use search_books with an ISBN for an exact edition or with title and author keywords, plus anything the buyer asks for, such as a first edition or a price cap. Use list_sources to see which booksellers serve a country. When nothing suits, offer an alert: set_alert watches the search for six months and emails the buyer once when a new listing turns up with everything the query asks for. The first alert tool the buyer uses asks them to sign in to Near Fine. list_alerts shows their alerts and what each found, and cancel_alert cancels one. They can also set an alert themselves on the search_url page.",
      "tools": [
        {
          "name": "cancel_alert",
          "title": "Cancel an alert",
          "description": "Cancel one of the person's alerts on Near Fine by its id, from list_alerts or set_alert, deleting it as its Delete button on Near Fine does. The first time, they sign in. Returns the cancelled alert and the person's plan.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The alert’s id",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:214afdecfe2981abf23edcfe8733a6f0790e5eb5727b4631ec45dc7620cec176"
        },
        {
          "name": "list_alerts",
          "title": "List alerts",
          "description": "List the person's alerts on Near Fine. The first time, they sign in. Finds come first, then alerts being checked, then the rest, newest first. Each has its id, query, country, status, when it was set, last checked and runs until, a link to it on Near Fine, how many times it has emailed a find and when it last did, and, once it has found a listing, the cheapest it last found: its title, seller, condition, price and shipping in the person's currency, and the URL to buy it. Statuses: pending (noting what's listed already), live (watching, as a Pro alert stays after a find), found (emailed a find and stopped), ended (the person got the book or stopped it), expired (ran its six months) and paused (the plan has room for fewer alerts). Also returns the person's plan.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea776555c663f2d65f34b641ead7fe584b5c8fb6be2701768603a2ba0944d75b"
        },
        {
          "name": "list_sources",
          "title": "List sources",
          "description": "List the bookseller catalogs Near Fine searches, each with the countries it serves. Pass a country to see only the sources that serve buyers there.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Only list sources serving buyers in this country (ISO 3166-1 alpha-2)",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e35a0521259d752d0d656cbcb3ba4f301b4962430005796a270324be543a62d"
        },
        {
          "name": "search_books",
          "title": "Search books",
          "description": "Search for a book across every bookseller Near Fine covers for the buyer's country, ebook and audiobook stores included; list_sources names them. Shops' ebooks and audiobook downloads are offered only in their own country. Pass an ISBN-10 or ISBN-13 for an exact edition, or title and author keywords. The query can also carry a price cap, as in \"under $40\" or \"max 30 €\" (in the buyer's currency when it names none), and ask for a first edition, a signed copy, a dust jacket, a hardcover or a paperback, as in \"wolf hall signed first edition under £200\", or for an ebook or audiobook alone. Offers over the cap, counting known shipping, and offers in other formats than the one asked for are left out; criteria reports what was read. Returns offers sorted cheapest first, unpublished shipping from abroad counting as the price again, each with title, seller, condition (new, used, ebook or audiobook), price and shipping in the seller's currency, the same in the buyer's currency when it differs, and the URL to buy. Shipping is left out where the shop doesn't publish it. Each offer may carry a match from 0 to 1: how sure a decision model is that the listing is the book searched for rather than a study guide, summary, adaptation or another book that shares a word. Offers below 0.2, which rarely are, are left out and counted in doubtful. When the query asks for attributes, each offer carries verdicts: true where the decision model, reading the listing and any filter the bookseller applied, confirms the listing claims it, false where it doesn't, and left out where unjudged. Also reports which sources answered, failed or timed out, a cover image of the best match, an amazon_url that opens the same search on the buyer's Amazon site, and a search_url that opens it on Near Fine, where the buyer can set an alert and get an email when a new listing turns up with everything the query asks for. A search takes a few seconds.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Country the buyer is in, as an ISO 3166-1 alpha-2 code such as US, GB or DE. Defaults to US.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "query": {
                "description": "ISBN-10, ISBN-13 (hyphens and spaces allowed) or title and author keywords, optionally with a price cap and attributes such as \"first edition under $40\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://nearfine/results-card"
            },
            "ui/resourceUri": "ui://nearfine/results-card"
          },
          "digest": "sha256:5a53c4e1f4d20a6bbbd25917654b463a986edf170b527b755e9f756adf3ee84c"
        },
        {
          "name": "set_alert",
          "title": "Set an alert",
          "description": "Set an alert on a search for the person. The first time, they sign in to Near Fine. Near Fine checks the alert for six months and emails them when a new listing turns up with everything the query asks for, such as a first edition, a signed copy or a price cap. On the Pro plan the alert keeps watching after a find and emails again when newer listings turn up; on other plans it stops after one email. The query reads as search_books reads it. Listings there already never count: the alert stays pending until its first check has noted them. Setting an alert that's already set keeps it as it is. Returns the alert, with its status and its link on Near Fine, and the person's plan: how many alerts it allows, how many are in use and how often each is checked. A full plan comes back as an error; paid plans, at plans_url, have more.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Country the book has to reach, as an ISO 3166-1 alpha-2 code such as US, GB or DE",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "query": {
                "description": "ISBN or title and author keywords, with anything the person wants beyond the book, as in \"wolf hall signed first edition under £200\"",
                "type": "string"
              }
            },
            "required": ["country", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3391c1e6c87b0c792a7147380972e656fd1229cadcf6f602d36753fb50e1bfac"
        }
