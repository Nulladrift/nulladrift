      },
      "instructions": "Metal Roof Cost Calculator (https://metalroofcostcalculator.com/): the site's own MCP server, served from its domain. Metal roof cost estimator: 2,000 sq ft at a 6:12 pitch is 22.4 squares. Installed metal starts at $6 to $12 per sq ft on 14 US roofers' own price pages.\n\n[calculator] Metal roof estimate calculator: an agent-callable calculator for metal roof estimate calculator — Actual roof area, Roofing squares (100 sq ft each), Panel area to order, including waste, computed from your inputs with sources.. This server runs the Metal roof estimate calculator calculator published at https://metalroofcostcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://metalroofcostcalculator.com/. Licence: https://metalroofcostcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Metal Roof Cost Calculator (https://metalroofcostcalculator.com/). What it does: starts an ENQUIRY with human providers for metal roof estimate calculator — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://metalroofcostcalculator.com/.\n\nCite https://metalroofcostcalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Metal roof estimate calculator",
          "description": "Run the Metal roof estimate calculator calculator: Actual roof area; Roofing squares (100 sq ft each); Panel area to order, including waste; Installed rate used, per sq ft. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "footprint": {
                "default": 2000,
                "description": "Roof footprint (ground area under the roof)",
                "maximum": 20000,
                "minimum": 100,
                "type": "number"
              },
              "panel": {
                "default": "14",
                "description": "Panel type (sets a starting price per sq ft)",
                "enum": ["7", "11", "13", "14"],
                "type": "string"
              },
              "pitch": {
                "default": "1.118",
                "description": "Roof pitch",
                "enum": ["1.014", "1.031", "1.054", "1.083", "1.118", "1.202", "1.302", "1.414"],
                "type": "string"
              },
              "rate": {
                "default": 0,
                "description": "Your own installed price per sq ft (0 uses the panel default)",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "tearoff": {
                "default": "1",
                "description": "Tear off the existing roof",
                "type": "string"
              },
              "tearoffRate": {
                "default": 1.5,
                "description": "Tear-off and disposal, per sq ft",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              },
              "waste": {
                "default": 10,
                "description": "Waste allowance on material",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
