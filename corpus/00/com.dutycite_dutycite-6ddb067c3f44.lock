{
  "lockfileVersion": 2,
  "subjects": {
    "com.dutycite/dutycite": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dutycite.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dutycite-mcp",
        "title": "DutyCite",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DutyCite: US import duty calculator. hts_search and hts_lookup are free. calculate_duty costs $0.02/call and needs an API key sent as \"Authorization: Bearer <key>\". Results are informational, not customs brokerage.",
      "tools": [
        {
          "name": "calculate_duty",
          "title": "Calculate US import duty stack",
          "description": "Paid ($0.02/call, needs API key). Full US duty stack for an import: ordinary/FTA duty, Section 232, Section 301 (China lists + 2026 forced-labor action), Section 338, plus MPF and HMF fees. Every line cites its legal source and effective date. Informational only; not customs brokerage or a binding classification.",
          "inputSchema": {
            "properties": {
              "claim_preference": {
                "description": "Apply FTA special rate if eligible (goods must qualify as originating)",
                "type": "boolean"
              },
              "customs_value": {
                "description": "Customs (transaction) value in USD",
                "type": "number"
              },
              "entry_type": {
                "default": "auto",
                "enum": ["formal", "informal", "auto"],
                "type": "string"
              },
              "hts": {
                "description": "8- or 10-digit HTSUS code",
                "type": "string"
              },
              "mode": {
                "default": "ocean",
                "enum": ["ocean", "air", "truck", "rail", "mail", "other"],
                "type": "string"
              },
              "options": {
                "properties": {
                  "auto_part": {
                    "type": "boolean"
                  },
                  "metal_weight_pct": {
                    "type": "number"
                  },
                  "mhd_vehicle_part": {
                    "type": "boolean"
                  },
                  "uk_melted": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "origin": {
                "description": "Country of origin, ISO alpha-2 (CN, VN, DE...)",
                "type": "string"
              },
              "quantity": {
                "description": "Quantity for specific (per-unit) rates",
                "type": "number"
              },
              "unit": {
                "description": "Unit of quantity, e.g. kg, liters, doz, number",
                "type": "string"
              }
            },
            "required": ["customs_value", "hts", "origin"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99a64a54e4107ccea892f0423b55540d76fa07d98d01f974f9b94231a0f2e76b"
        },
        {
          "name": "hts_lookup",
          "title": "Look up one HTSUS code",
          "description": "Free. Get the description, units, and general / special (FTA) / column 2 rates for an HTSUS code (4-10 digits).",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "HTSUS code, e.g. 6109.10.00.12",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b25ef383d2a80e117d90b095165320dc8cde965143eb343daf3931a43418c2e8"
        },
        {
          "name": "hts_search",
          "title": "Search US tariff codes (HTSUS)",
          "description": "Free. Search the current US Harmonized Tariff Schedule by keyword or code prefix. Returns 8/10-digit codes with descriptions and base (MFN) duty rates.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords (e.g. \"cotton t-shirts men\") or code prefix (e.g. \"6109\")",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9610a54e5a6871558460225ea9484928472926e2398981ea16ca30a7471e377a"
        }
      ],
      "digest": "sha256:6edb4f62113e8c7d13f90e89e09e2f99526b35669bc2ba09be27f4c3e70c60eb"
    }
  }
}
