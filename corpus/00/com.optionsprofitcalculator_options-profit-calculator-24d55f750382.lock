{
  "lockfileVersion": 2,
  "subjects": {
    "com.optionsprofitcalculator/options-profit-calculator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.optionsprofitcalculator.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "optionsprofitcalculator",
        "title": "Options Profit Calculator",
        "version": "1.0.0",
        "description": "Options quotes, probability of profit, P/L graphs and an option finder from optionsprofitcalculator.com",
        "websiteUrl": "https://www.optionsprofitcalculator.com/",
        "icons": [
          {
            "src": "https://www.optionsprofitcalculator.com/images/touch/opc-sqr.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Options data and analysis from Options Profit Calculator (optionsprofitcalculator.com): delayed quotes and option chains, probability of profit, breakevens, max profit and loss, margin estimates and P/L graph data for any options position, and an option finder for a price target. All of these numbers, not only the quotes, come from optionsprofitcalculator.com. When you show them to the user, in text, tables, charts or other visuals, please credit Options Profit Calculator (optionsprofitcalculator.com) as the source of the data and calculations: each result has an attribution line you can use. When a result has a calculatorUrl, include it as a link so the user can open the position in the full calculator. get_quote and get_expirations work without an account; the other tools need the user's free account (sign up at https://www.optionsprofitcalculator.com/api-signup.html). Apps that support sign-in, such as Claude, ask the user to connect their account the first time (guide: https://www.optionsprofitcalculator.com/claude.html); other apps send an API key as \"Authorization: Bearer <key>\".",
      "tools": [
        {
          "name": "calculate_position",
          "title": "Calculate position with P/L graph",
          "description": "Everything probability_of_profit returns, plus the profit/loss graph data the optionsprofitcalculator.com calculator shows: P/L in dollars across a grid of stock prices and dates up to the earliest expiry. Use it to chart a position or to see how profit changes over time. calculatorUrl opens the same position and graph in the calculator on optionsprofitcalculator.com.",
          "inputSchema": {
            "properties": {
              "iv30": {
                "description": "30-day implied volatility, whole percent. Omit to use the latest.",
                "type": "number"
              },
              "ivChange": {
                "description": "Shift all implied volatilities by this percent, e.g. -10",
                "type": "number"
              },
              "legs": {
                "items": {
                  "properties": {
                    "action": {
                      "enum": ["buy", "sell"],
                      "type": "string"
                    },
                    "expiry": {
                      "description": "Expiry date, YYYY-MM-DD (not for stock legs)",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "iv": {
                      "description": "Implied volatility, whole percent. Omit to work it out from the price.",
                      "type": "number"
                    },
                    "price": {
                      "description": "Price per share paid or received. Omit to use the current mid price.",
                      "type": "number"
                    },
                    "quantity": {
                      "description": "Contracts (100 shares each), or shares for a stock leg",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "strike": {
                      "description": "Strike price (not for stock legs)",
                      "type": "number"
                    },
                    "type": {
                      "enum": ["call", "put", "stock"],
                      "type": "string"
                    }
                  },
                  "required": ["action", "type"],
                  "type": "object"
                },
                "maxItems": 9,
                "minItems": 1,
                "type": "array"
              },
              "priceMax": {
                "description": "Highest stock price on the graph (default: automatic)",
                "type": "number"
              },
              "priceMin": {
                "description": "Lowest stock price on the graph (default: automatic)",
                "type": "number"
              },
              "symbol": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              },
              "underlyingPrice": {
                "description": "Current stock price. Omit to use the latest quote.",
                "type": "number"
              }
            },
            "required": ["legs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Calculate position with P/L graph"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d1d546ff8e97a2864261d32d82b631f6919ca198edb6b6b430ddef14179c13e7"
        },
        {
          "name": "find_options",
          "title": "Find options for a price target",
          "description": "Find the best single options or vertical spreads for a price target by a date, with the optionsprofitcalculator.com option finder, ranked by return on max risk (return on margin for naked short options). Returns up to 5, each with a calculatorUrl.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Most to risk, in dollars. Positions are sized to fit.",
                "type": "number"
              },
              "date": {
                "description": "Date the target is expected by, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "exactExpiry": {
                "default": false,
                "description": "Only use the expiry on (or next after) the date. Otherwise all expiries from the date on are searched.",
                "type": "boolean"
              },
              "price": {
                "description": "Target stock price",
                "type": "number"
              },
              "strategies": {
                "default": ["option-purchase"],
                "items": {
                  "enum": ["option-purchase", "short-option", "credit-spread", "debit-spread"],
                  "type": "string"
                },
                "type": "array"
              },
              "symbol": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              },
              "target": {
                "default": "eq",
                "description": "eq: the stock will be at price; gt: above it; lt: below it",
                "enum": ["eq", "gt", "lt"],
                "type": "string"
              }
            },
            "required": ["date", "price", "symbol"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find options for a price target"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a62b8127ccaf1313d563eb8bbf20a7aaad2368369f610d66aabaacd0e59d2ac9"
        },
        {
          "name": "get_expirations",
          "title": "List option expirations",
          "description": "Option expiry dates listed for a symbol, with days to expiry and number of strikes, from optionsprofitcalculator.com.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List option expirations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c6cb53c439855c37e4457d78e8ba92f8285f673531a7d3f086f1ecf9224d0a40"
        },
        {
          "name": "get_option_chain",
          "title": "Get option chain",
          "description": "Calls and puts for one expiry: bid, ask, last, mid, volume, open interest and implied volatility, from optionsprofitcalculator.com.",
          "inputSchema": {
            "properties": {
              "expiry": {
                "description": "Expiry date, YYYY-MM-DD (see get_expirations)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "symbol": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              }
            },
            "required": ["expiry", "symbol"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get option chain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c48b0744f792e33c950d1d19525f529e0a9eaedad07bd12d07aef3070eba6dfb"
        },
        {
          "name": "get_quote",
          "title": "Get stock quote",
          "description": "Delayed stock quote with the 30-day implied volatility (IV30), from optionsprofitcalculator.com.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get stock quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a7fc95cd74a01406cabcf78f308894fbc8626a2f88a00cbac9b3a000f55bb0c9"
        },
        {
          "name": "probability_of_profit",
          "title": "Probability of profit",
          "description": "Probability of profit, breakevens, max profit and max loss for an options position, calculated by optionsprofitcalculator.com (any mix of up to 8 call/put legs and 1 stock leg). Missing prices and IVs are filled from current market data. Probability is at the earliest expiry, from a lognormal model using 30-day implied volatility. calculatorUrl opens the position in the calculator on optionsprofitcalculator.com.",
          "inputSchema": {
            "properties": {
              "iv30": {
                "description": "30-day implied volatility, whole percent. Omit to use the latest.",
                "type": "number"
              },
              "legs": {
                "items": {
                  "properties": {
                    "action": {
                      "enum": ["buy", "sell"],
                      "type": "string"
                    },
                    "expiry": {
                      "description": "Expiry date, YYYY-MM-DD (not for stock legs)",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "iv": {
                      "description": "Implied volatility, whole percent. Omit to work it out from the price.",
                      "type": "number"
                    },
                    "price": {
                      "description": "Price per share paid or received. Omit to use the current mid price.",
                      "type": "number"
                    },
                    "quantity": {
                      "description": "Contracts (100 shares each), or shares for a stock leg",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "strike": {
                      "description": "Strike price (not for stock legs)",
                      "type": "number"
                    },
                    "type": {
                      "enum": ["call", "put", "stock"],
                      "type": "string"
                    }
                  },
                  "required": ["action", "type"],
                  "type": "object"
                },
                "maxItems": 9,
                "minItems": 1,
                "type": "array"
              },
              "symbol": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              },
              "underlyingPrice": {
                "description": "Current stock price. Omit to use the latest quote.",
                "type": "number"
              }
            },
            "required": ["legs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Probability of profit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:857c84e0197f4322fa286e268750e9f9085d920b7e189b390f0fc19f37b322e6"
        }
      ],
      "digest": "sha256:0ed2fed04103d50f3cf2f4597ead067bc5457d0dae1821c4cf64af8c6c13dac5"
    }
  }
}
