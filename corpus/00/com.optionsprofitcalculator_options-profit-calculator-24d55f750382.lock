{
  "lockfileVersion": 2,
  "subjects": {
    "com.optionsprofitcalculator/options-profit-calculator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.optionsprofitcalculator.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "optionsprofitcalculator",
        "title": "Options Profit Calculator",
        "version": "1.3.0",
        "description": "Probability of profit, breakevens and P/L graphs for options positions from optionsprofitcalculator.com",
        "websiteUrl": "https://www.optionsprofitcalculator.com/",
        "icons": [
          {
            "src": "https://www.optionsprofitcalculator.com/images/touch/opc-sqr.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Options calculations from Options Profit Calculator (optionsprofitcalculator.com): probability of profit, breakevens, max profit and loss, margin estimates and P/L graph data for any options position, plus the positions, symbols and put/call ratio of calculations made on the site. This server has no market data: probability_of_profit and calculate_position need the current stock price and the price of every option leg, from the user or another source. If you don't have them, ask the user. Each result has an attribution line naming the source. Results for a position have a calculatorUrl that opens that position in the interactive calculator on optionsprofitcalculator.com, with its full P/L chart and table: include it as a link when you discuss a position, so the user can open it and explore other prices and dates. get_popular_strategies, get_popular_symbols and get_put_call_ratio work without an account; the position tools need the user's free account (sign up at https://www.optionsprofitcalculator.com/api-signup.html). Apps that support sign-in, such as Claude, ask the user to connect their account the first time (guide: https://www.optionsprofitcalculator.com/claude.html); other apps send an API key as \"Authorization: Bearer <key>\".",
      "tools": [
        {
          "name": "calculate_position",
          "title": "Calculate position with P/L graph",
          "description": "Everything probability_of_profit returns, plus the profit/loss graph data the optionsprofitcalculator.com calculator shows: P/L in dollars across a grid of stock prices and dates up to the earliest expiry. Use it to chart a position or to see how profit changes over time. This tool has no market data: give the current stock price and the price of every option leg (from the user or another source). Implied volatility is worked out from each price. calculatorUrl opens the same position and graph in the calculator on optionsprofitcalculator.com.",
          "inputSchema": {
            "properties": {
              "iv30": {
                "description": "30-day implied volatility, whole percent, used for the probability. Omit to use the average implied volatility of the option legs.",
                "type": "number"
              },
              "ivChange": {
                "description": "Shift all implied volatilities by this percent, e.g. -10",
                "type": "number"
              },
              "legs": {
                "items": {
                  "properties": {
                    "action": {
                      "enum": ["buy", "sell"],
                      "type": "string"
                    },
                    "expiry": {
                      "description": "Expiry date, YYYY-MM-DD (not for stock legs)",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "iv": {
                      "description": "Implied volatility, whole percent. Omit to work it out from the price.",
                      "type": "number"
                    },
                    "price": {
                      "description": "Price per share paid or received. Required for call and put legs. For a stock leg, omit to use underlyingPrice.",
                      "type": "number"
                    },
                    "quantity": {
                      "description": "Contracts (100 shares each), or shares for a stock leg",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "strike": {
                      "description": "Strike price (not for stock legs)",
                      "type": "number"
                    },
                    "type": {
                      "enum": ["call", "put", "stock"],
                      "type": "string"
                    }
                  },
                  "required": ["action", "type"],
                  "type": "object"
                },
                "maxItems": 9,
                "minItems": 1,
                "type": "array"
              },
              "priceMax": {
                "description": "Highest stock price on the graph (default: automatic)",
                "type": "number"
              },
              "priceMin": {
                "description": "Lowest stock price on the graph (default: automatic)",
                "type": "number"
              },
              "symbol": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              },
              "underlyingPrice": {
                "description": "Current stock price",
                "type": "number"
              }
            },
            "required": ["legs", "underlyingPrice"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Calculate position with P/L graph"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:82ea3635f742236c0dc8550aff0ca640185a28bfee3451a6de251f4a1c862da4"
        },
        {
          "name": "get_popular_strategies",
          "title": "Get popular strategies",
          "description": "Options positions most often calculated by visitors to optionsprofitcalculator.com over the last day, week or month (e.g. NVDA long call, 170 strike, 2026-11-13), each with its legs, the number of visitors who calculated it and a calculatorUrl. Positions with an expired leg are left out.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "default": "week",
                "description": "day: today so far; week: the last 7 days; month: the last 30 days (New York dates)",
                "enum": ["day", "week", "month"],
                "type": "string"
              },
              "symbol": {
                "description": "Only positions on this ticker (optional)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get popular strategies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:33c83249af9b0b873c01cdb550fc925c17bfb922ad2c263125b2c517d56f5f29"
        },
        {
          "name": "get_popular_symbols",
          "title": "Get popular symbols",
          "description": "Ticker symbols most often calculated by visitors to optionsprofitcalculator.com over the last day, week or month.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "default": "week",
                "description": "day: today so far; week: the last 7 days; month: the last 30 days (New York dates)",
                "enum": ["day", "week", "month"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get popular symbols"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c32c9121e9105aca1ea72dc8cc7c0351124b4b71fa827966ca214115458ad1ea"
        },
        {
          "name": "get_put_call_ratio",
          "title": "Get put/call ratio",
          "description": "Put/call ratio of the option legs in calculations made by visitors to optionsprofitcalculator.com over the last day, week or month, site-wide or for one symbol. Reflects site activity, not market volume.",
          "inputSchema": {
            "properties": {
              "period": {
                "default": "week",
                "description": "day: today so far; week: the last 7 days; month: the last 30 days (New York dates)",
                "enum": ["day", "week", "month"],
                "type": "string"
              },
              "symbol": {
                "description": "Ticker symbol, e.g. AAPL (optional; site-wide when left out)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get put/call ratio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e2febc11b3caf5edeb1ccb83b6b7200f02ca15d4dc7e2bb291bb236e1e9265e"
        },
        {
          "name": "probability_of_profit",
          "title": "Probability of profit",
          "description": "Probability of profit, breakevens, max profit and max loss for an options position, calculated by optionsprofitcalculator.com (any mix of up to 8 call/put legs and 1 stock leg). This tool has no market data: give the current stock price and the price of every option leg (from the user or another source). Implied volatility is worked out from each price. Probability is at the earliest expiry, from a lognormal model using 30-day implied volatility. calculatorUrl opens the position in the calculator on optionsprofitcalculator.com.",
          "inputSchema": {
            "properties": {
              "iv30": {
                "description": "30-day implied volatility, whole percent, used for the probability. Omit to use the average implied volatility of the option legs.",
                "type": "number"
              },
              "legs": {
                "items": {
                  "properties": {
                    "action": {
                      "enum": ["buy", "sell"],
                      "type": "string"
                    },
                    "expiry": {
                      "description": "Expiry date, YYYY-MM-DD (not for stock legs)",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "iv": {
                      "description": "Implied volatility, whole percent. Omit to work it out from the price.",
                      "type": "number"
                    },
                    "price": {
                      "description": "Price per share paid or received. Required for call and put legs. For a stock leg, omit to use underlyingPrice.",
                      "type": "number"
                    },
                    "quantity": {
                      "description": "Contracts (100 shares each), or shares for a stock leg",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "strike": {
                      "description": "Strike price (not for stock legs)",
                      "type": "number"
                    },
                    "type": {
                      "enum": ["call", "put", "stock"],
                      "type": "string"
                    }
                  },
                  "required": ["action", "type"],
                  "type": "object"
                },
                "maxItems": 9,
                "minItems": 1,
                "type": "array"
              },
              "symbol": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              },
              "underlyingPrice": {
                "description": "Current stock price",
                "type": "number"
              }
            },
            "required": ["legs", "underlyingPrice"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Probability of profit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c1cada45eae57ca16a30de6da03c00444558698490ff1b677ce464f355c2d065"
        }
      ],
      "digest": "sha256:b7a6ab52280354a48f8fc3e08bf41740b584a46c7516c22109956cc14f4bc36e"
    }
  }
