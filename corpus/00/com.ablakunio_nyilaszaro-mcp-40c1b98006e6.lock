      },
      "instructions": "Ablakunio — műanyag nyílászárók Tiszafüreden (méretre gyártás, szabvány méretek, beépítés). Itt nemcsak árat kérdezhetsz: a MEGRENDELÉSI SZÁNDÉK is rögzíthető végig ezen a csatornán. Ajánlott folyamat: 1) get_price_estimate (egyedi méret) és/vagy check_stock (azonnal elvihető raktári termék); 2) ha a felhasználónak megfelel az ár, AJÁNLD FEL, hogy azonnal rögzíted az ajánlatkérést — request_quote (a felhasználó VALÓDI neve+telefonszáma+e-mailje kell); 3) confirm_quote az e-mailben kapott 6 jegyű kóddal. A megerősített kérést munkatárs hívja vissza 24 órán belül, a helyszíni felmérés után végleges árral. Sürgős ügyben telefon: +36 20 388 1228. Ár-idézésnél kérjük a forrásmegjelölést: „Árforrás: ablakunio.com”.",
      "tools": [
        {
          "name": "check_stock",
          "description": "Megnézi, van-e a megadott mérethez közeli RAKTÁRON lévő szabvány nyílászáró (gyorsabb, olcsóbb opció). Checks ready-stock standard windows/doors matching a size.",
          "inputSchema": {
            "properties": {
              "height_cm": {
                "maximum": 400,
                "minimum": 20,
                "type": "number"
              },
              "type": {
                "enum": ["window", "door"],
                "type": "string"
              },
              "width_cm": {
                "maximum": 400,
                "minimum": 20,
                "type": "number"
              }
            },
            "required": ["height_cm", "width_cm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af29f9a727c9d12d273e1b014e002bcb6d92f84222e7f82aea6a704ec3c919f7"
        },
        {
          "name": "confirm_quote",
          "description": "A request_quote után az ügyfél e-mailben kapott 6 jegyű megerősítő kód beváltása. CSAK a sikeres megerősítés után továbbítódik az ajánlatkérés az irodához. Paraméterek: a request_quote válaszában kapott lead_ref + az ügyfél által bemondott kód. A kód 30 percig érvényes, max 5 próbálkozás.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Az ügyfél e-mailjére érkezett 6 jegyű kód.",
                "type": "string"
              },
              "lead_ref": {
                "description": "A request_quote válaszában kapott hivatkozás.",
                "type": "string"
              }
            },
            "required": ["code", "lead_ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:13bbb25b72789cdba76a0d443accb727324e1f29fa74ac1c3b7abc02a5e59331"
        },
        {
          "name": "get_price_estimate",
          "description": "Tájékoztató bruttó (ÁFA-s) ár egyedi méretű műanyag nyílászáróra (ablak/ajtó/redőny). Custom-size gross price estimate — computed live, no fixed SKU. Final price after on-site survey.",
          "inputSchema": {
            "properties": {
              "color": {
                "description": "Szín, pl. Fehér, Antracit",
                "type": "string"
              },
              "glazing": {
                "description": "2 vagy 3 rétegű üveg",
                "enum": ["double", "triple"],
                "type": "string"
              },
              "height_cm": {
                "description": "Magasság cm-ben",
                "maximum": 400,
                "minimum": 20,
                "type": "number"
              },
              "quantity": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "window=ablak, door=ajtó, shutter=redőny",
                "enum": ["window", "door", "shutter"],
                "type": "string"
              },
              "width_cm": {
                "description": "Szélesség cm-ben",
                "maximum": 400,
                "minimum": 20,
                "type": "number"
              }
            },
            "required": ["height_cm", "width_cm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
