          "digest": "sha256:61d554616f17c13ab5dec51513863d8f37a129034e7d70d0efd19e2d99f54759"
        },
        {
          "name": "list_inventory",
          "description": "Listázza az aktuálisan raktáron lévő szabvány nyílászárókat és párkányokat bruttó árral. Lists current ready-stock items with retail prices.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
