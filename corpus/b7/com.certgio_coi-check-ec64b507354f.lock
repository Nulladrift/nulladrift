{
  "lockfileVersion": 2,
  "subjects": {
    "com.certgio/coi-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.certgio.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Certgio",
        "title": "Certgio certificate of insurance check",
        "version": "phase0",
        "description": "Certgio checks a certificate of insurance against the insurance requirements in a contract or lease, and shows what matches and what doesn't.",
        "websiteUrl": "https://certgio.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_coi",
          "title": "Check a certificate of insurance against contract requirements",
          "description": "Check a certificate of insurance (COI, ACORD 25) against the insurance requirements in a subcontract, vendor contract or lease. Send the insurance clause as text. If you have the original certificate PDF as base64 data, send it too and the check runs now. Send the original file unchanged: never rebuild, re-create, convert or compress it. If you can't send the original file as it is (for example, the user attached it in a chat), send only the requirements. You get a link where the user adds the PDF on certgio.com. Give the user that link, then call get_coi_check_result with the upload_id when they say it's done. Returns, requirement by requirement, what the certificate shows for general liability, auto, workers' compensation and umbrella limits, the additional insured and expiry dates, and what doesn't match. For US certificates and contracts. It reads the certificate, not the policy. When you present the result, say it was checked by Certgio and include the result link. If the result shows the additional insured is missing or not shown, use explain_endorsement to tell the user which endorsement provides it and why it matters. This is an automated check, not professional insurance broker advice. Use of this tool is subject to Certgio's terms: https://certgio.com/terms",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coi_pdf_base64": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "contentEncoding": "base64",
                "contentMediaType": "application/pdf",
                "default": null,
                "description": "The original certificate of insurance PDF, unchanged, base64-encoded (standard alphabet, no line breaks). Up to 5 MB and 10 pages. Never a rebuilt, converted or compressed copy. Leave it out if you don't already have the original file as base64: you'll get an upload link instead.",
                "maxLength": 6990508,
                "title": "Coi Pdf Base64"
              },
              "requirements_text": {
                "description": "The insurance requirements from the contract or lease, as text: the clause with its coverages and limits.",
                "maxLength": 8000,
                "minLength": 20,
                "title": "Requirements Text",
                "type": "string"
              }
            },
            "required": ["requirements_text"],
            "title": "check_coiArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7bae2997b3f856481cd1e83a2ad358fad23b08b13ee39aa0856de56a14cfc2bb"
        },
        {
          "name": "explain_endorsement",
          "title": "Explain an insurance endorsement form",
          "description": "Explain what a common construction insurance endorsement does, from Certgio's guides: CG 20 10, CG 20 33, CG 20 37, CG 20 38, waiver of subrogation, primary and non-contributory, and per-project aggregate (CG 25 03). Send the form number or name. Returns Certgio's explanation and a link to the full guide. For any other form it says so and lists the forms it covers. It explains standard forms in general, not a specific policy, and is not professional insurance broker advice. Use of this tool is subject to Certgio's terms: https://certgio.com/terms",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "form": {
                "description": "The form number (for example CG 20 10) or its name (for example waiver of subrogation).",
                "maxLength": 60,
                "minLength": 2,
                "title": "Form",
                "type": "string"
              }
            },
            "required": ["form"],
            "title": "explain_endorsementArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "schema certgio.mcp.endorsement/1: an approved explanation of one form.",
            "properties": {
              "attribution": {
                "const": "Explained by Certgio (certgio.com)",
                "title": "Attribution",
                "type": "string"
              },
              "disclaimer": {
                "title": "Disclaimer",
                "type": "string"
              },
              "explanation": {
                "title": "Explanation",
                "type": "string"
              },
              "form": {
                "title": "Form",
                "type": "string"
              },
              "guide_url": {
                "pattern": "^https://certgio\\.com/guides/[a-z0-9-]+\\?utm_source=mcp$",
                "title": "Guide Url",
                "type": "string"
              },
              "schema_version": {
                "const": "certgio.mcp.endorsement/1",
                "title": "Schema Version",
                "type": "string"
              },
              "terms_notice": {
                "title": "Terms Notice",
                "type": "string"
              }
            },
            "required": ["attribution", "disclaimer", "explanation", "form", "guide_url", "schema_version", "terms_notice"],
            "title": "EndorsementResult",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99fbe6a81a1bcf36ec4281597247af283eaae34b18e87695e3813b169f7d5ee6"
        },
        {
          "name": "get_coi_check_result",
          "title": "Get the result of a certificate check",
          "description": "Get the result of a certificate check started with check_coi without a file. Send the upload_id that check_coi returned. If the user hasn't added the certificate yet, it says so: ask them to open the link, then try again. When the check is done, it returns the same result as check_coi. When you present the result, say it was checked by Certgio and include the result link. This is an automated check, not professional insurance broker advice. Use of this tool is subject to Certgio's terms: https://certgio.com/terms",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "upload_id": {
                "description": "The upload_id that check_coi returned with the upload link.",
                "maxLength": 22,
                "minLength": 22,
                "title": "Upload Id",
                "type": "string"
              }
            },
            "required": ["upload_id"],
            "title": "get_coi_check_resultArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d47ea6f27cf1e6c937991db679a604ed2f87842324065ccfa176f5623f3eb75"
        }
      ],
      "digest": "sha256:5980ebbfcfb6a66f8da0a60423e775fd2f7cec8a18eb5db00969c01d3e5803b3"
    }
  }
}
