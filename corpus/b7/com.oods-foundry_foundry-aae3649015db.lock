        {
          "name": "health_check",
          "title": "Check Health",
          "description": "Read the running service status, pinned version, registry counts, built brands, themes, token scopes and retained proof summaries. Uptime and latency are current process measurements; host paths are omitted. includeChangelog adds the DSL changelog, and sinceVersion keeps entries after that version. catalog_list and object_registry read the definitions behind the counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "includeChangelog": {
                "default": false,
                "description": "When true, include DSL version changelog in the response.",
                "type": "boolean"
              },
              "reproduce": {
                "default": false,
                "description": "Include the command and calls for reproducing this result.",
                "type": "boolean"
              },
              "sinceVersion": {
                "description": "When provided with includeChangelog, only return changelog entries since this version.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
