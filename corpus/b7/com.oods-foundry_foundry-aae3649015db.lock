        {
          "name": "viz_render",
          "title": "Render Chart",
          "description": "Draw and certify a chart from inline data. Provide chartType and encodings with rows, a pattern with its own data, or an intent to recommend a tabular chart. Brand and theme apply to drawing and certification. The compact reply contains hashes, warnings and certification; output.svg adds the SVG drawing, includeA11y adds the table and narrative, and includeNormalizedSpec adds its specification. Request SVG when a displayed chart is needed. Up to 500 rows; optional outputs still share the 100,000-character reply bound. artifact_certify returns the same drawing and checks for an input in chart.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a11yEquivalence": {
                "default": true,
                "description": "Check Vega-Lite accessible equivalents (default true). Errors stop rendering; warnings are returned. ECharts-primary scaffolds are not checked here.",
                "type": "boolean"
              },
              "brand": {
                "default": "A",
                "description": "Token brand for drawing and certification.",
                "enum": ["A", "B"],
                "type": "string"
              },
              "chartType": {
                "description": "Chart family; Cartesian types need rows and encodings, others their named input. Omit to suggest from rows.",
                "enum": ["bar", "line", "area", "scatter", "heatmap", "treemap", "sunburst", "sankey", "force_graph", "choropleth", "bubble_map", "flow_map", "chord"],
                "type": "string"
              },
              "chord": {
                "description": "Chord input: {nodes:[{name}],links:[{source,target,value}]}; links refer to node names; each directed pair must be unique.",
                "type": "object"
              },
              "description": {
                "description": "Optional override for the synthesized accessibility description. When omitted, a non-empty description is generated from the encodings.",
                "type": "string"
              },
