          },
          "digest": "sha256:daa6f976c4c6db39a0ab94ab0cbb29e60af88afa929ee8aa1bce3585a78e0d45"
        },
        {
          "name": "object_registry",
          "title": "Read Object Registry",
          "description": "Read objects from the pinned registry. action list returns names, traits and field counts; domain, trait and maturity filter them, and includeInternal adds internal objects. action show requires name and returns its composed definition; context narrows view extensions. registry_snapshot provides an overview; design_preview looks up recorded screens.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Read object definitions from the pinned registry.",
            "properties": {
              "action": {
                "description": "List objects or show one composed definition.",
                "enum": ["list", "show"],
                "type": "string"
              },
              "context": {
                "description": "Optional: filter view_extensions to a single context (e.g. 'detail', 'list', 'form', 'timeline', 'card', 'inline')",
                "type": "string"
              },
              "domain": {
                "description": "Filter to objects in a specific domain (e.g. 'core.identity', 'saas.billing')",
                "type": "string"
              },
              "includeInternal": {
                "default": false,
                "description": "Also list OODS Foundry's internal (non-business) objects, after the business objects. Without it they are left out and hiddenInternal counts them.",
                "type": "boolean"
              },
              "maturity": {
                "description": "Filter by metadata maturity level",
                "enum": ["draft", "alpha", "beta", "stable"],
                "type": "string"
              },
              "name": {
                "description": "Object name to look up (e.g. 'User', 'Product', 'Invoice')",
                "pattern": "^[A-Za-z][A-Za-z0-9_-]*$",
                "type": "string"
              },
              "reproduce": {
                "default": false,
                "description": "Include the command and calls for reproducing this result.",
                "type": "boolean"
              },
              "trait": {
                "description": "Filter to objects composing a given trait (e.g. 'Priceable', 'lifecycle/Stateful')",
                "type": "string"
              }
            },
            "required": ["action"],
            "title": "object_registry input",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read Object Registry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b7b30a7631b8a470ceb146146aec968405fe752b778f63f821d6917c5bd3a5c"
        },
        {
          "name": "registry_snapshot",
          "title": "Snapshot Registry",
          "description": "Read the registry summary: active objects and traits, loaded names, loader issues, etag and generatedAt. detail full includes definitions; names narrows them. includeInternal adds internal objects. Replies larger than 100,000 characters are refused with their size. object_registry reads one composed object; catalog_list reads components.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Bulk-read recorded mappings plus live shipped and registered team traits and objects. Reports definition loader issues, including shadowed names. The default summary leaves out each trait's and object's schema, parameters, view extensions, semantics, tokens and metadata; detail full returns them, optionally only for named traits and objects. Draft preferred_terms, disambiguation_decisions and capabilities are not snapshot outputs.",
            "properties": {
              "detail": {
                "default": "summary",
                "description": "summary (default), or full definitions, best with names.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "includeInternal": {
                "default": false,
                "description": "Also list OODS Foundry's internal (non-business) objects, after the business objects. Without it they are left out and registry.hiddenInternal counts them.",
                "type": "boolean"
              },
              "names": {
                "description": "Exact trait and object names; misses go in notFound.",
                "items": {
                  "description": "One trait or object name, such as Stateful or Subscription.",
                  "minLength": 1,
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "reproduce": {
                "default": false,
                "description": "Include the command and calls for reproducing this result.",
                "type": "boolean"
              }
            },
            "title": "registry_snapshot input",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Snapshot Registry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ec08253cd866707e5e875083d60e707e6092effd22fa088aecbda4226035eb4"
        },
        {
          "name": "structured_data_fetch",
          "title": "Fetch Structured Data",
          "description": "Read the tokens or manifest dataset. Full data is the default; detail summary returns section counts and the first page call. page reads lossless JSON Pointer entries; pageSize defaults to 10, at most 100, also bounded by size. meta.next continues and meta.full requests full data. includePayload false returns metadata; listVersions lists dates, version selects one, and ifNoneMatch returns matched true without unchanged payload. catalog_list reads components.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Read a pinned registry dataset or list its available versions.",
            "properties": {
              "dataset": {
                "description": "Registry dataset to return.",
                "enum": ["tokens", "manifest"],
                "type": "string"
              },
              "detail": {
                "description": "Dataset only. summary returns section counts and the call for page 1; full (default) preserves the dataset.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "ifNoneMatch": {
                "description": "Return matched=true without payload when the ETag matches.",
                "minLength": 8,
                "type": "string"
              },
              "includePayload": {
                "default": true,
                "description": "When false, omit payload even if no ETag match occurs.",
                "type": "boolean"
              },
              "listVersions": {
                "default": false,
                "description": "When true, return available version dates instead of payload.",
                "type": "boolean"
              },
              "page": {
                "description": "Dataset only: read a 1-based page of lossless JSON Pointer entries, each reply below 100,000 characters. Omit for full data.",
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "description": "Dataset entries per page, default 10, also bounded by serialized size. Reply meta gives next and full calls.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "reproduce": {
                "default": false,
                "description": "Include the command and calls for reproducing this result.",
                "type": "boolean"
              },
              "version": {
                "description": "Request a specific date-stamped version (e.g., '2026-02-24'). Omit for latest. Applies to dataset mode only.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["dataset"],
            "title": "structured_data_fetch input",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch Structured Data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11939e3ab6dd3fe6ed4534cfe5c424d0346dc4af7b67eddf3214b778bbef61d5"
        },
