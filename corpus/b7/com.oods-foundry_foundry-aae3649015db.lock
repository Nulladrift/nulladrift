        "version": "0.13.0",
        "icons": [
          {
            "src": "https://oods-foundry.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only tools at version 0.13.0, hosted by oods-foundry.com. Replies stay within 100,000 characters; a larger one is refused with its size and a narrower call. Reproduction details are included only with reproduce true. Chart replies are compact by default; output can add SVG, an accessible table and narrative, or the normalized specification. design_preview looks up recorded screens; artifact_certify draws and certifies the input in chart.",
      "tools": [
        {
          "name": "artifact_certify",
          "title": "Certify Chart",
          "description": "Draw and certify a chart from the input in chart, using matching data, brand and theme. Returns the same result as viz_render: hashes, warnings and the certification verdict, including accessibility equivalence, determinism, contrast and accuracy. Optional chart.output fields add SVG, the accessible table and narrative, or the normalized specification. A verdict can be conformant false; each pillar explains its result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chart": {
                "additionalProperties": false,
                "description": "A viz_render input to certify.",
                "properties": {
                  "a11yEquivalence": {
                    "default": true,
                    "description": "Check Vega-Lite accessible equivalents (default true). Errors stop rendering; warnings are returned. ECharts-primary scaffolds are not checked here.",
                    "type": "boolean"
                  },
                  "brand": {
                    "default": "A",
                    "description": "Token brand for drawing and certification.",
                    "enum": ["A", "B"],
                    "type": "string"
                  },
                  "chartType": {
                    "description": "Chart family; Cartesian types need rows and encodings, others their named input. Omit to suggest from rows.",
                    "enum": ["bar", "line", "area", "scatter", "heatmap", "treemap", "sunburst", "sankey", "force_graph", "choropleth", "bubble_map", "flow_map", "chord"],
                    "type": "string"
                  },
                  "chord": {
                    "description": "Chord input: {nodes:[{name}],links:[{source,target,value}]}; links refer to node names; each directed pair must be unique.",
                    "type": "object"
                  },
                  "description": {
                    "description": "Optional override for the synthesized accessibility description. When omitted, a non-empty description is generated from the encodings.",
                    "type": "string"
                  },
                  "encodings": {
                    "additionalProperties": false,
                    "description": "Cartesian bindings: each needs field; optional type, aggregate, title, format (d3-format), currency (ISO 4217).",
                    "properties": {
                      "color": {
                        "description": "Field name or binding.",
                        "type": ["string", "object"]
                      },
                      "detail": {
                        "description": "Field name or binding.",
                        "type": ["string", "object"]
                      },
                      "shape": {
                        "description": "Field name or binding.",
                        "type": ["string", "object"]
                      },
                      "size": {
                        "description": "Field name or binding.",
                        "type": ["string", "object"]
                      },
                      "x": {
                        "description": "Field name or binding.",
                        "type": ["string", "object"]
                      },
                      "y": {
                        "description": "Field name or binding.",
                        "type": ["string", "object"]
                      }
                    },
                    "type": "object"
                  },
                  "geo": {
                    "description": "Inline geojson or topojson with topoObjectName, rows, join and valueField; optional point or flow fields. tool_schema gives the full contract.",
                    "type": "object"
                  },
                  "hierarchy": {
                    "description": "Treemap/sunburst: {type:\"nested\",data:{name,value,children}} or {type:\"adjacency_list\",data:[{id,parentId,value}]}. See full schema.",
                    "type": "object"
                  },
                  "id": {
                    "description": "Optional stable identifier for the produced spec.",
                    "type": "string"
                  },
                  "intent": {
                    "description": "Structured request: goal, measures and dimensions, with optional chartFamily; uses rows instead of explicit chartType and encodings.",
                    "type": "object"
                  },
                  "name": {
                    "description": "Optional human-friendly chart title.",
                    "type": "string"
                  },
                  "network": {
                    "description": "Force graph: nodes [{id,group}] and links [{source,target,value}], at most 250 nodes.",
                    "type": "object"
                  },
                  "opacity": {
                    "description": "Constant mark opacity for Cartesian charts only; omission keeps renderer defaults.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "output": {
                    "additionalProperties": false,
                    "description": "Optional outputs.",
                    "properties": {
                      "height": {
                        "description": "Drawing height in pixels.",
                        "maximum": 2000,
                        "minimum": 100,
                        "type": "integer"
                      },
                      "includeA11y": {
                        "default": false,
                        "description": "Include the accessible data table and narrative.",
                        "type": "boolean"
                      },
                      "includeNormalizedSpec": {
                        "default": false,
                        "description": "Include the normalized chart specification.",
                        "type": "boolean"
                      },
                      "svg": {
                        "default": false,
                        "description": "Include the SVG drawing, for displaying the chart.",
                        "type": "boolean"
                      },
                      "width": {
                        "description": "Drawing width in pixels.",
                        "maximum": 2000,
                        "minimum": 100,
                        "type": "integer"
                      }
                    },
                    "required": [],
                    "type": "object"
                  },
                  "pattern": {
                    "description": "Exact registered pattern identity; preserves source data and presentation. Cannot combine with chartType, data, intent or identity/presentation overrides.",
                    "enum": ["pattern:viz:bubble-distribution", "pattern:viz:correlation-matrix", "pattern:viz:correlation-scatter", "pattern:viz:detail-overview-bar", "pattern:viz:diverging-bar", "pattern:viz:drilldown-stacked-bar", "pattern:viz:facet-small-multiples-line", "pattern:viz:facet-target-band", "pattern:viz:focus-context-line", "pattern:viz:grouped-bar", "pattern:viz:histogram", "pattern:viz:layered-line-area", "pattern:viz:multi-series-line", "pattern:viz:running-total-area", "pattern:viz:simple-bar", "pattern:viz:stacked-100-bar", "pattern:viz:stacked-area-projection", "pattern:viz:stacked-bar", "pattern:viz:target-band-line", "pattern:viz:time-grid-heatmap", "pattern:viz:waterfall"],
                    "type": "string"
                  },
                  "rows": {
                    "description": "Inline flat data rows.",
                    "items": {
                      "additionalProperties": true,
                      "description": "rows item.",
                      "type": "object"
                    },
                    "maxItems": 500,
                    "minItems": 1,
                    "type": "array"
                  },
                  "sankey": {
                    "description": "Sankey input: {nodes:[{name}],links:[{source,target,value}]}; links refer to node names. Use chartType:\"sankey\".",
                    "type": "object"
                  },
                  "strictFields": {
                    "default": false,
                    "description": "Warn about unresolved fields and unmatched map joins (OODS-V131/V134). Default false preserves existing behavior.",
                    "type": "boolean"
                  },
                  "theme": {
                    "default": "light",
                    "description": "Colour theme for drawing and certification.",
                    "enum": ["light", "dark", "hc"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "reproduce": {
                "default": false,
                "description": "Include the command and calls for reproducing this result.",
                "type": "boolean"
              }
            },
            "required": ["chart"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Certify Chart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f5671ad282e15cf692f92bf83c33a5fbbf8f98f447e5fc7347bca934f5a6287"
        },
        {
          "name": "catalog_list",
          "title": "List Components",
          "description": "Read components a page at a time. category, trait, context and status filter the list; status describes the HTML renderer. detail is brief by default, or full when filtering; summary includes tags, contexts, regions and traits. Brief and summary allow up to 200 entries; full clamps pageSize to 10 and reports the adjustment. totalCount, hasMore and nextPage describe pagination. object_registry reads objects instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Filter components by category (e.g., 'core', 'lifecycle', 'visual')",
                "type": "string"
              },
              "context": {
                "description": "Filter components by context (e.g., 'detail', 'list')",
                "type": "string"
              },
              "detail": {
                "description": "Defaults to brief unfiltered, full with filters. Both defaults are paged (filtered: 10 entries). summary adds tags, contexts, regions and traits; full includes evidence. Explicit detail without paging preserves the unbounded legacy request.",
                "enum": ["brief", "summary", "full"],
                "type": "string"
              },
              "includeInternal": {
                "default": false,
                "description": "Also list OODS Foundry's internal (non-business) objects in registry.objects, after the business objects. Without it they are left out and registry.hiddenInternal counts them.",
                "type": "boolean"
              },
              "page": {
                "description": "1-based page index for pagination.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "description": "Components per page. Filtered calls without detail default to 10; nextPage gives the next call.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "reproduce": {
                "default": false,
                "description": "Include the command and calls for reproducing this result.",
                "type": "boolean"
              },
              "status": {
                "description": "Filter by legacy static-HTML status only: 'stable' = mapped HTML renderer; 'planned' = HTML fallback. Consult productReality.surfaces for React/Vue, generated-consumer and maturity evidence.",
                "enum": ["stable", "beta", "planned"],
                "type": "string"
              },
              "trait": {
                "description": "Filter components by trait (e.g., 'Editable', 'Searchable')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Components"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fecc53627d37806ff88008e4d1ffd27419839090f877989fe3615f50188ef61"
        },
        {
