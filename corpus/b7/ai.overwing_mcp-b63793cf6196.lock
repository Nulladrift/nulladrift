        {
          "name": "beacon_report",
          "title": "Read a reachability report (Overwing Beacon)",
          "description": "The report for a check started with beacon_start. The first call runs the check. With an Overwing key on the connection: score (0 to 100), verdict (yes, partly, no), the find / read / use answers, every check with what was found and a fix when it did not pass, and top_fixes ranked by value. With no key, the summary of the same report: score, verdict, the three answers and the first fix (access=summary). Answers 202 while the check is running (ask again in a few seconds). No key needed for the summary.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The check id from beacon_start",
                "pattern": "^bcn_[A-Za-z0-9_-]{16}$",
                "type": "string"
