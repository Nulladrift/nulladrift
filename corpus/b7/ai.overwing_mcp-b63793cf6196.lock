        {
          "name": "preflight_check",
          "title": "Check a Solana transaction before signing it (Overwing Preflight)",
          "description": "Call this before signing any Solana transaction. Overwing Preflight simulates the unsigned transaction against the chain as it is now, works out what it would take from the wallet you name (SOL, tokens, and control of its token accounts) and answers allow or refuse against your policy, with every reason. Sign only if decision is \"allow\". Treat a refusal, an error, or anything else as do not sign. A verdict describes one moment and covers a transaction that lands within about two minutes, so sign and send at once or check again. This tool takes the serialized transaction and a policy; it never needs a private key and must never be given one. One check counts as one evaluation. Needs an organization key.",
          "inputSchema": {
            "properties": {
              "policy": {
                "additionalProperties": false,
                "description": "What the transaction may take from the wallet. Anything the policy does not allow is refused. Give max_sol_out or max_sol_out_lamports, never both.",
                "properties": {
                  "allow_delegation": {
                    "description": "Whether a spending approval on one of the wallet's token accounts is acceptable. Default false.",
                    "type": "boolean"
                  },
                  "allowed_programs": {
                    "description": "When given, every program the transaction runs, top-level or inner, must be listed.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 64,
                    "minItems": 1,
                    "type": "array"
                  },
                  "max_sol_out": {
                    "description": "The most SOL the transaction may take from the wallet, fees included. 0 allows none.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "max_sol_out_lamports": {
                    "description": "The same limit as a whole number of lamports, as an integer or a string of digits.",
                    "type": ["integer", "string"]
                  },
                  "max_token_out": {
                    "additionalProperties": {
                      "type": ["integer", "string"]
                    },
                    "description": "Atomic units that may leave, by mint address. A mint not listed may not leave at all.",
                    "type": "object"
                  },
                  "min_token_in": {
                    "additionalProperties": {
                      "type": ["integer", "string"]
                    },
                    "description": "Atomic units that must arrive, by mint address. Use it for a swap's minimum output.",
                    "type": "object"
                  },
                  "wallet": {
                    "description": "The public address to protect, in base58. It must sign the transaction. Never a private key.",
                    "maxLength": 44,
                    "minLength": 32,
                    "type": "string"
                  }
                },
                "required": ["wallet"],
                "type": "object"
              },
              "transaction": {
                "description": "The serialized Solana transaction in base64, legacy or v0, signed or unsigned. Signatures are ignored.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["policy", "transaction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Check a Solana transaction before signing it (Overwing Preflight)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:caf8400acee4996bec1e99190a835f7469fc4a294c0de5cf5d253748ce56a4d9"
        },
