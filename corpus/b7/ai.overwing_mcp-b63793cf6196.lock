        {
          "name": "atlas_verify_registration",
          "title": "Verify and publish a registration (Overwing Atlas)",
          "description": "Look for the proof at the operator's domain: the DNS TXT record or the file that atlas_register_agent asked for. Found: the entry is published in the registry, or held for a person when the operator name already belongs to someone. Not found: an error saying what was looked for; DNS changes can take a few minutes, and calling again is safe. Needs an organization key.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The registration id from atlas_register_agent",
                "pattern": "^areg_[A-Za-z0-9_-]{16}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": false,
            "title": "Verify and publish a registration (Overwing Atlas)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:693f2b5e2188a3805c99da08d475dd0194eea81c8f7d38c778e2c9229600ac4c"
        },
        {
