        {
          "name": "atlas_lookup",
          "title": "Identify a user agent (Overwing Atlas)",
          "description": "Say what a User-Agent string claims to be and whether the claim can be trusted, from the Overwing Atlas registry of AI crawlers, fetchers and browser agents. Returns the claimed agent, operator, purpose class, verification method (Web Bot Auth signature, user-agent string only, or unattributable) and a trust note. Works with no API key: 10 lookups a day. With a key, metered per day by Atlas tier: free 100, Pro 10,000, Team 100,000. Use it when deciding whether to serve, block, or pay-gate a request, or to understand who is hitting a site.",
          "inputSchema": {
            "properties": {
              "user_agent": {
                "description": "The User-Agent header value to identify",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["user_agent"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Identify a user agent (Overwing Atlas)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:919f5a1f8c4d500fd4033a823675ec0aed00fd2501a9fae9468ed4ac24e7c0ee"
        },
        {
          "name": "atlas_register_agent",
          "title": "Register your agent (Overwing Atlas)",
          "description": "Add an agent or crawler you operate to the Overwing Atlas registry, free, so a site that looks up its User-Agent learns who runs it. Give the agent's name, the operator (the company or person running it), the operator's domain, and the token the User-Agent carries (the product name, such as AcmeBot). The answer carries one value to publish at that domain, as a DNS TXT record or as a file under /.well-known, to prove control of it; then call atlas_verify_registration. A token may not match, contain, or sit inside one already in the registry. This proves control of the domain, not that any given request is yours: the entry is listed as user-agent only unless key_directory_url is a Web Bot Auth key directory on that domain. Only register agents you or your operator actually run. Needs an organization key.",
          "inputSchema": {
            "properties": {
              "description": {
                "maxLength": 600,
                "type": "string"
              },
              "domain": {
                "description": "The operator's domain, e.g. acme.com. Control of it must be proved",
                "maxLength": 255,
                "minLength": 4,
                "type": "string"
              },
              "follows_robots_txt": {
                "type": "boolean"
              },
              "key_directory_url": {
                "description": "A Web Bot Auth key directory on the operator's domain",
                "maxLength": 500,
                "type": "string"
              },
              "name": {
                "description": "The agent's name, e.g. AcmeBot",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "operator": {
                "description": "The company or person that runs the agent",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "policy_url": {
                "description": "An https page describing the agent",
                "maxLength": 500,
                "type": "string"
              },
              "purpose": {
                "default": "other",
                "enum": ["training_crawl", "search_index", "user_fetch", "browser_agent", "coding_agent", "api_agent", "other"],
                "type": "string"
              },
              "tokens": {
                "description": "The product name the User-Agent carries, e.g. [\"AcmeBot\"]",
                "items": {
                  "maxLength": 60,
                  "minLength": 5,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "user_agent": {
                "description": "The full User-Agent string the agent sends; it must contain a token",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["domain", "name", "operator", "tokens"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Register your agent (Overwing Atlas)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d41f64eff546f8f9646d66c2bb043b18005546566b8637bbb047d45dc4ff096a"
        },
        {
