        {
          "name": "feedback",
          "title": "Tell Overwing what went wrong",
          "description": "Send one message to the people who run Overwing: a verdict you think was wrong, an error you could not act on, a payment you could not make, a tool that did not do what its description says. Read by a person, not answered automatically; give a contact if you want an answer. No key needed.",
          "inputSchema": {
            "properties": {
              "about": {
                "description": "What it concerns: a tool name, a path, a product. Optional.",
                "maxLength": 300,
                "type": "string"
              },
              "contact": {
                "description": "Where an answer can reach you or the person you work for: an email, a URL, an agent name. Optional.",
                "maxLength": 200,
                "type": "string"
              },
              "evaluation_id": {
                "description": "The id of the evaluation in question, if any.",
                "maxLength": 64,
                "type": "string"
              },
              "message": {
                "description": "What happened and what you expected.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Tell Overwing what went wrong"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
