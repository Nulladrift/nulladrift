                "minLength": 2,
                "type": "string"
              },
              "policy": {
                "description": "Optional: max_per_call_usd (default 0.05), new_payee_max_usd (0.01), allowed_networks, allowed_payees, blocked_payees, allow_testnets, max_price_drift (0.25).",
                "type": "object"
              },
              "requested_url": {
                "description": "The URL you asked for and got the 402 from.",
                "maxLength": 2000,
                "type": "string"
              }
