        {
          "name": "beacon_start",
          "title": "Start a reachability check (Overwing Beacon)",
          "description": "Overwing Beacon answers one question about a site: is this product reachable by agents? It checks robots.txt rules for AI agents, llms.txt, the sitemap, the MCP server card, hosted MCP endpoint and MCP Registry listing, the A2A agent card, OpenAPI discovery, and how the home page reads to a model, then returns three answers (find, read, use), a score and the fixes worth making. This tool starts a check and returns its id; it is free. Then call beacon_report with the id, which runs the check (about twenty seconds). With an Overwing key on the connection beacon_report returns the full report and the check is saved to that dashboard; with no key it returns the summary: the score, the three answers and the first fix. A key is free (POST /api/v1/signup). An agent with a wallet and no account can instead pay $1 in USDC over x402 and get the full report in one call: GET /api/x402/beacon?url=<site>. Call beacon_sample to see a real report in full. No key needed.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The site to check: a domain (example.com) or an https URL. Public sites only.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Start a reachability check (Overwing Beacon)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aca5053de95359b31317ae33a0c078b428ef3ef67422f9eded77304eeb4891f4"
        },
        {
          "name": "create_account",
          "title": "Create your own account (no email)",
          "description": "Create an Overwing account for yourself, with no email: an organization and an API key, returned once. Nothing is sent to anyone. Use it when you have no key and nobody has given you one; do not create a second account if you already have a key (whoami says which account a key belongs to). The key is the account, so store it at once: with no email there is no reset link. It starts at 50 evaluations a day with Beacon summaries; proving a domain (prove_domain, verify_domain) raises that to the normal free limits and full Beacon reports, and makes a lost key recoverable. This server does not keep the key: send it as Authorization: Bearer on the MCP connection for the tools that need one. Tell the person you work for that you made the account and where the key is kept. No key needed.",
          "inputSchema": {
            "properties": {
              "org_name": {
                "description": "A name for the account, e.g. the agent's name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "use_for_session": {
                "description": "Ignored here. The hosted server has no session and never holds a key; it exists so calls written for the npm package still validate.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Create your own account (no email)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a7893eac1e60e73456e2ad9e7f2edee0b75d5073d137fec8762cd97cde2e8a1b"
        },
        {
          "name": "create_rule_set",
          "title": "Create rule set",
          "description": "Create a custom rule set with 1 to 25 rules. Each rule is a choice (pick one option), score (position on an ordered scale), or noul (yes/no) question with a fail condition, optional review threshold, weight, and action (block, redact, or review) that callers should take when it fails. Rule instructions may reference `context.*` fields that callers pass with each evaluation. Needs an organization key.",
          "inputSchema": {
            "properties": {
              "description": {
                "type": "string"
              },
              "name": {
                "maxLength": 100,
                "type": "string"
              },
              "rules": {
                "items": {
                  "properties": {
                    "action": {
                      "description": "What a caller should do when this rule fails: block (default), redact, or review",
                      "enum": ["block", "redact", "review"],
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "fail_condition": {
                      "additionalProperties": {},
                      "description": "choice: {failOn: [options]}; noul: {failOn: boolean}; score: {failAbove: levelIndex}",
                      "type": "object"
                    },
                    "name": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "question_config": {
                      "additionalProperties": {},
                      "description": "choice: {options[], instructions}; score: {levels[], instructions}; noul: {question}",
                      "type": "object"
                    },
                    "question_type": {
                      "enum": ["choice", "score", "noul"],
                      "type": "string"
                    },
                    "review_condition": {
                      "properties": {
                        "confidenceBelow": {
                          "exclusiveMinimum": 0,
                          "maximum": 1,
                          "type": "number"
                        }
                      },
                      "required": ["confidenceBelow"],
                      "type": "object"
                    },
                    "weight": {
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    }
                  },
                  "required": ["fail_condition", "name", "question_config", "question_type"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "slug": {
                "maxLength": 100,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["name", "rules", "slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Create rule set"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0333f644b6fbdad77efc3c969b84e8ee48b35f44c1165e8d2de5625239c8a446"
        },
        {
          "name": "evaluate",
          "title": "Evaluate text",
          "description": "Works with no API key: 10 evaluations a day, inputs up to 2,000 characters, and the text is not stored. With a key: 250 a day and up, inputs up to 100,000 characters, and your own rule sets. Score any text (typically an LLM's output) against an Overwing rule set. The text can be in any language; tested in Spanish, Portuguese, French, German, Japanese, Chinese, Korean, Arabic and Hindi. Results come back in English. Returns an aggregate verdict of pass, fail, or review, a recommended_action (block, redact, review, or allow), and per-rule answers with probability, confidence, and the rule's action. Act on recommended_action: block means do not send, redact means remove the flagged content and resend, review means ask a human or a slower model, allow means proceed. Prebuilt sets: 'content-safety' (toxicity, PII, self-harm, sexual content, severity) and 'outbound-message', which also takes a context object (recipient, channel, owns_contact_info) so PII that the recipient already owns is not flagged.",
          "inputSchema": {
            "properties": {
              "context": {
                "additionalProperties": {},
                "description": "Facts the rules may reference: recipient, channel, whether you own the data, sender, purpose. Sent to the model alongside the text (max 8 KB). Use the 'outbound-message' rule set to have it honoured.",
                "type": "object"
              },
              "input": {
                "description": "The text to evaluate, in any language",
                "maxLength": 100000,
                "minLength": 1,
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {},
                "description": "Opaque data stored with the evaluation and echoed in webhooks (max 8 KB)",
                "type": "object"
              },
              "rule_set": {
                "default": "content-safety",
                "description": "Rule set slug",
                "type": "string"
              },
              "store": {
                "description": "With a key: false runs the check without keeping the input text or the context (the verdict and metadata are still recorded). Without a key the text is never stored.",
                "type": "boolean"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false,
            "title": "Evaluate text"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2db94bcbba85cad89a35fcafe71be8d58b0ac846e84b6c47622f21b19e2b8518"
        },
        {
          "name": "evaluate_batch",
          "title": "Evaluate many texts",
