      "serverInfo": {
        "name": "gixo-arc",
        "title": "Gixo Arc",
        "version": "1.0.0",
        "websiteUrl": "https://gixo.ai/arc",
        "icons": [
          {
            "src": "https://gixo.ai/images/logo/products/arc-mark-512.png",
