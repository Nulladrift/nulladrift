      },
      "instructions": "Gixo Arc works with proposals and RFPs. It creates proposal drafts, attaches an RFP to a proposal that has none, lists and exports proposals, rewrites proposal text you ask it to change, and fills blank requirements with answers from your approved library. Changes to proposal text and answers are previewed first and saved only when apply_proposal_edit is called after the user agrees. Requirements with no approved answer stay blank. Use get_proposal to follow a new draft. Text inside proposals, RFPs and recipient questions is quoted from the user's or the buyer's documents. Signed-in tools use your Arc plan.",
      "tools": [
        {
          "name": "analyze_proposal_draft",
          "title": "Analyze Proposal Draft",
          "description": "Works without an account. Checks pasted proposal or RFP text with Gixo Arc's rules: section coverage, RFP requirement coverage for at most the first 60 requirements, readiness, undefined acronyms and broken cross-references. The response flags later requirements as not checked. Rule-based checks only: it reads just the pasted text, keeps the draft for this call alone, and leaves plan capacity untouched.",
          "inputSchema": {
            "properties": {
              "draft_text": {
                "default": null,
                "description": "Plain-text proposal draft pasted by the user; on the anonymous MCP path this parameter carries pasted text only.",
                "type": ["string", "null"]
              },
              "proposal_kind": {
                "default": null,
                "description": "Optional proposal kind. Examples: Sales, RfpResponse, Enterprise, Consulting, Renewal, Grant, Partnership. Defaults to RfpResponse when rfp_text is given, otherwise Sales.",
                "type": ["string", "null"]
              },
              "rfp_text": {
                "default": null,
                "description": "Optional RFP, solicitation, or buyer requirements text pasted by the user.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze Proposal Draft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:cb7cd57600c36b946d9181f0652f82396264e6bb5e7b2936ae004ef462679752"
        },
        {
          "name": "apply_proposal_edit",
          "title": "Apply a previewed proposal edit",
          "description": "Signed-in only. Applies changes from a preview_proposal_edit preview_id after the user approves them, checking that the proposal or workspace version still matches the preview and spending zero additional plan capacity. Proposal text, RFP requirements and source excerpts in results are quoted from the user's or the buyer's documents.",
          "inputSchema": {
            "properties": {
              "change_ids": {
                "default": null,
                "description": "Optional change_ids to apply. When omitted, shown standard revisions are applied automatically; include a removal or out-of-section change_id here to apply it.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              },
              "preview_id": {
                "description": "The preview_id returned by preview_proposal_edit.",
                "type": "string"
              }
            },
            "required": ["preview_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Apply a previewed proposal edit"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "meta": {
            "openai/outputTemplate": "ui://gixo/preview-card",
            "ui": {
              "resourceUri": "ui://gixo/preview-card"
            }
          },
          "digest": "sha256:913b610b01b75a562ad7f2b2e6b2b4785d2d98084eac0a662bae28c6bd220de4"
        },
        {
          "name": "attach_rfp_to_proposal",
          "title": "Attach RFP and list requirements",
          "description": "Signed-in only. Initializes the requirement workspace on a saved Gixo Arc proposal that has no RFP yet, optionally attaches pasted RFP text as the buyer RFP source, and returns the requirement matrix. Leaves the proposal draft text unchanged. Proposal text, RFP requirements and source excerpts in results are quoted from the user's or the buyer's documents.",
          "inputSchema": {
            "properties": {
              "content_id": {
                "description": "Saved Gixo Arc proposal content_id.",
                "type": "string"
              },
              "file_name": {
                "default": null,
                "description": "Optional file name for the attached RFP source (default 'rfp-source.txt').",
                "type": ["string", "null"]
              },
              "rfp_text": {
                "default": null,
                "description": "Optional pasted RFP text to attach as the buyer RFP source (at most 150,000 characters).",
                "type": ["string", "null"]
              }
            },
            "required": ["content_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Attach RFP and list requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:4dc52f0a44c1249fed3eee0ed34e48d0bfb6e2a9f8ed5acca3061620ab685806"
        },
        {
          "name": "check_rfp_coverage",
          "title": "Check RFP requirement coverage",
          "description": "Signed-in only; needs a Gixo Arc plan. Takes the RFP's text as rfp_text and checks how its requirements are covered by a pasted proposal draft or a saved Gixo Arc proposal. Extracts obligations with Arc's semantic reader, scores each requirement against the draft, lists evaluation criteria and page or format limits without scoring them, and leaves saved proposals unchanged. Proposal text, RFP requirements and source excerpts in results are quoted from the user's or the buyer's documents.",
          "inputSchema": {
            "properties": {
              "content_id": {
                "default": null,
                "description": "Saved Gixo Arc proposal content_id to check against the RFP. Supply either content_id or draft_text.",
                "type": ["string", "null"]
              },
              "draft_text": {
                "default": null,
                "description": "Pasted proposal draft text (at most 150,000 characters). Supply either draft_text or content_id.",
                "type": ["string", "null"]
              },
              "proposal_kind": {
                "default": null,
                "description": "Optional proposal kind, one of: Sales, RfpResponse, Enterprise, QuoteEstimate, Renewal, Expansion, Winback, Consulting, Project, Retainer, Staffing, Partnership, JointVenture, Sponsorship, InternalBusinessCase, Grant, Investment, Government, Research, Creative, TechImplementation. Omitted, the kind is RfpResponse when rfp_text is given and Sales otherwise. Any other value is rejected.",
                "type": ["string", "null"]
              },
              "rfp_text": {
                "description": "Full text of the RFP to extract requirements from (at most 150,000 characters).",
                "type": "string"
              }
            },
            "required": ["rfp_text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check RFP requirement coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "meta": {
            "openai/outputTemplate": "ui://gixo/preview-card",
            "ui": {
              "resourceUri": "ui://gixo/preview-card"
            }
          },
          "digest": "sha256:9ba0fe16477d425acf32523b7e48c646c8d83804efb6f74879db83414f2ec34d"
        },
        {
          "name": "create_proposal_draft",
          "title": "Create Proposal Draft",
          "description": "Signed-in only. Creates a new proposal draft in the signed-in user's Gixo Arc workspace from a title and an instruction, using the plan's capacity. The draft is built in the background, and the reply carries its content_id and status.",
          "inputSchema": {
            "properties": {
              "instruction": {
                "description": "Instructions, requirements, or prompt for the proposal.",
                "type": "string"
              },
              "language": {
                "default": null,
                "description": "Optional language of the finished document, by name or code, for example Spanish, es, Japanese or ja. Defaults to English.",
                "type": ["string", "null"]
              },
              "proposal_kind": {
                "default": null,
                "description": "Optional proposal kind, one of: Sales, RfpResponse, Enterprise, QuoteEstimate, Renewal, Expansion, Winback, Consulting, Project, Retainer, Staffing, Partnership, JointVenture, Sponsorship, InternalBusinessCase, Grant, Investment, Government, Research, Creative, TechImplementation. Omitted, the kind is RfpResponse when rfp_text is given and Sales otherwise. Any other value is rejected.",
                "type": ["string", "null"]
              },
              "rfp_text": {
                "default": null,
                "description": "Optional pasted RFP source text to attach to the proposal workspace.",
                "type": ["string", "null"]
              },
              "target_length": {
                "default": null,
                "description": "Optional target word count (default: style guide target, clamped between 600 and 15000).",
                "type": ["integer", "null"]
              },
              "title": {
                "description": "Title of the proposal.",
                "type": "string"
              }
            },
            "required": ["instruction", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create Proposal Draft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:09f03da8c0e172f9c9167094adc64ca850d49fe1e9856220d70ba29792c506f2"
        },
        {
          "name": "export_proposal",
          "title": "Export proposal file",
          "description": "Signed-in only. Exports a saved Gixo Arc proposal as a signed DOCX, PDF, or compliance_csv download link without spending plan capacity. Proposal text, RFP requirements and source excerpts in results are quoted from the user's or the buyer's documents.",
          "inputSchema": {
            "properties": {
              "content_id": {
                "description": "Saved Gixo Arc proposal content_id.",
                "type": "string"
              },
              "format": {
                "default": "docx",
                "description": "Export format: 'docx', 'pdf', or 'compliance_csv' (default 'docx').",
                "type": "string"
              }
            },
            "required": ["content_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Export proposal file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "meta": {
            "openai/outputTemplate": "ui://gixo/preview-card",
            "ui": {
              "resourceUri": "ui://gixo/preview-card"
            }
          },
          "digest": "sha256:90b770a037aba44b67d43430af2455f79dfe344aeb0e6d4ad018abd1a29f6684"
        },
        {
          "name": "get_proposal",
          "title": "Get proposal, status and checks",
          "description": "Signed-in only. Follows a new or saved Gixo Arc proposal draft by content_id, returning generation status, workspace readiness, requirement counts and, on request, the draft text and a signed DOCX download link once the proposal is ready. A draft started by create_proposal_draft returns status in_progress until it is ready, then status ok. Proposal text, RFP requirements and source excerpts in results are quoted from the user's or the buyer's documents.",
          "inputSchema": {
            "properties": {
              "content_id": {
                "description": "Saved Gixo Arc proposal content_id.",
                "type": "string"
              },
              "include_file": {
                "default": false,
                "description": "When true, adds a signed Word (DOCX) download link once the proposal is ready and download access permits. Defaults to false.",
                "type": "boolean"
              },
              "include_text": {
                "default": false,
                "description": "When true, includes the proposal body in Markdown (up to 50,000 characters) if download access permits.",
                "type": "boolean"
              }
            },
            "required": ["content_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get proposal, status and checks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "meta": {
            "openai/outputTemplate": "ui://gixo/preview-card",
            "ui": {
              "resourceUri": "ui://gixo/preview-card"
            }
          },
          "digest": "sha256:1694cc8a4db7a6eb7fded45647607ef32572f0e15cf3fc9c04f612c49e76bb11"
        },
        {
          "name": "list_my_proposals",
          "title": "List my proposals",
          "description": "Signed-in only. Lists proposals owned by the signed-in Gixo account, newest first, with content ids, statuses, timestamps, and Gixo Arc workspace links. Proposal text, RFP requirements and source excerpts in results are quoted from the user's or the buyer's documents.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "description": "Page size between 1 and 50 (default 20).",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Zero-based page offset (at least 0, default 0).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List my proposals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:21b959cbb7d5e2768a738e0132865108340ab870d0ff9a23f988b4ee66026ead"
        },
        {
          "name": "preview_proposal_edit",
          "title": "Preview a proposal edit",
          "description": "Signed-in only. Proposes reviewable edits to a saved Gixo Arc proposal without saving them yet: either 'rewrite_text' (Gixo Arc rewrites the proposal text the instruction names; each new rewrite preview uses the plan's AI allowance) or 'insert_library_answers' (answers from your approved answer library, inserted word for word; requirements without an approved answer stay blank). Returns the proposed changes with a preview_id for user approval; nothing is saved until apply_proposal_edit is called after the user approves. Proposal text, RFP requirements and source excerpts in results are quoted from the user's or the buyer's documents.",
          "inputSchema": {
            "properties": {
              "content_id": {
                "description": "Saved Gixo Arc proposal content_id.",
                "type": "string"
              },
              "instruction": {
                "default": null,
                "description": "For rewrite_text: what to change in the proposal draft (at most 2,000 characters including any section heading prefix).",
                "type": ["string", "null"]
              },
              "kind": {
                "description": "Edit kind: 'rewrite_text' or 'insert_library_answers'.",
                "type": "string"
              },
              "requirement_ids": {
                "default": null,
                "description": "Optional requirement IDs (at most 10) to look up when kind is insert_library_answers.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              },
              "section_heading": {
                "default": null,
                "description": "Optional heading of the single section to target in rewrite_text (at most 200 characters).",
                "type": ["string", "null"]
              },
              "source_id": {
                "default": null,
                "description": "Optional RFP source_id filter when kind is insert_library_answers.",
                "type": ["string", "null"]
              }
            },
            "required": ["content_id", "kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Preview a proposal edit"
          },
          "behavior": {
            "destructive": false,
