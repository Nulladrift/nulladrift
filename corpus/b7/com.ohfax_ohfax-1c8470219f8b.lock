        {
          "name": "get_fax_status",
          "title": "Check fax status",
          "description": "Current delivery state of a fax: awaiting_payment, paid, submitted, sending, delivered, or failed. Failed faxes include a reason you can act on.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fax_id": {
                "type": "string"
              }
            },
            "required": ["fax_id"],
            "type": "object"
