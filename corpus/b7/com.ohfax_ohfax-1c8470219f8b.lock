        {
          "name": "quote_fax",
          "title": "Get the price of a fax",
          "description": "Returns the price: $2.00 per fax by card for up to 100 pages (flat, no per-page charge); prepaid balance or MPP stablecoin: $0.02 per page. Also validates the number and PDF and returns a quote_id and payment link. Free; sends nothing. Call before send_fax.",
