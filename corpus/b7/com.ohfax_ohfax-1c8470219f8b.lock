          },
          "digest": "sha256:d4b7bdfecdf6c0f21b36f3e303d9d6847a978f050574a23f843d2466e55a794a"
        },
        {
          "name": "quote_fax",
          "title": "Get the price of a fax",
          "description": "Returns the price: $2.00 per fax by card for up to 100 pages (flat, no per-page charge); prepaid balance or MPP stablecoin: $0.02 per page. Also validates the number and PDF and returns a quote_id and payment link. Free; sends nothing. Call before send_fax.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "document_base64": {
                "description": "Base64-encoded PDF, as an alternative to document_url.",
                "type": "string"
              },
              "document_url": {
                "description": "Publicly reachable URL of a PDF.",
                "type": "string"
              },
              "to": {
                "description": "Destination fax number. US and Canada only.",
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the price of a fax"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8e9254468f42b751d993fa6e7dd5168c1592b6e6a50132421c8e645b9122e940"
        },
        {
          "name": "send_fax",
          "title": "Send a fax (costs money)",
          "description": "Returns the authorization instructions for sending a previously quoted fax. THIS ACTION COSTS MONEY AND CANNOT BE UNDONE: paying the returned link transmits a real document to a real fax machine. This tool itself does not charge you — it returns the price and a payment link, and the fax is only sent once you deliberately pay that link. Confirm the cost is acceptable before paying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "quote_id": {
                "description": "A quote_id from quote_fax.",
                "type": "string"
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a fax (costs money)"
          },
