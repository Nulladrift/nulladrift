            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "document_base64": {
                "description": "Base64-encoded PDF, as an alternative to document_url.",
                "type": "string"
              },
              "document_url": {
                "description": "Publicly reachable URL of a PDF.",
                "type": "string"
              },
              "to": {
                "description": "Destination fax number. US and Canada only.",
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
