      },
      "instructions": "Convoca reúne las convocatorias abiertas de premios y concursos literarios en castellano y en catalán, sobre todo de España, recogidas cada día de fuentes públicas, y sigue cada premio hasta el libro que lo ganó. Para «¿a qué me puedo presentar?», buscar_convocatorias; para un premio concreto, buscar_premios y ver_premio; para quién ganó, palmares o libros_premiados. Al responder, enlaza la página del premio en Convoca y sus bases: mandan siempre las bases. Un dato null no consta en la fuente: no lo des por un no.",
      "tools": [
        {
          "name": "buscar_convocatorias",
          "title": "Buscar convocatorias abiertas",
          "description": "Busca convocatorias de premios y concursos literarios con el plazo abierto: por texto, género, lengua, plazo, edad de quien escribe, cuota, dotación y ámbito. Devuelve primero las que cierran antes, con su página en Convoca y sus bases. Un null no consta en la fuente. Cada convocatoria dice en por_comprobar qué filtro pasa solo porque el dato no consta (compruébalo en las bases), y fuera_por_no_constar cuenta las que un filtro dejó fuera por no tener el dato. Para verlas todas, sigue con el cursor «siguiente»; con breve, cada una en pocos campos, y ver_convocatoria la amplía.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ambito": {
                "description": "Ámbito del concurso según la fuente. Las que no lo dicen se quedan.",
                "enum": ["España", "Latinoamérica", "Internacional"],
                "type": "string"
              },
              "breve": {
                "default": false,
                "description": "Cada convocatoria en pocos campos (id, título, cierre, dotación, enlaces y lo que queda por comprobar). ver_convocatoria da el resto.",
                "type": "boolean"
              },
              "cierra_antes_de": {
                "description": "AAAA-MM-DD: solo las que cierran ese día o antes.",
                "format": "date",
                "type": "string"
              },
              "cursor": {
                "description": "El «siguiente» de la respuesta anterior, para seguir por donde iba, con los mismos filtros.",
                "maxLength": 300,
                "type": "string"
              },
              "edad": {
                "description": "Edad de quien escribe: quita las que piden otra edad. Las que no dicen edad se quedan.",
                "maximum": 120,
                "minimum": 5,
                "type": "integer"
              },
              "genero": {
                "description": "cuento es relato y microrrelato; teatro incluye guion; ensayo incluye investigación; periodismo, artículos. Las bases que dicen «narrativa» sin más salen con cuento y con novela. La literatura para la infancia no es un género: pide para_la_infancia.",
                "enum": ["poesia", "novela", "cuento", "teatro", "comic", "ensayo", "periodismo", "traduccion", "no_ficcion", "obra_publicada", "otro"],
                "type": "string"
              },
              "incluir_por_designacion": {
                "default": false,
                "description": "Incluir premios a los que no se presenta una misma, porque las candidaturas las proponen terceros.",
                "type": "boolean"
              },
              "lengua": {
                "description": "Lengua en la que se puede escribir la obra.",
                "enum": ["castellano", "catala", "galego", "euskera", "ingles"],
                "type": "string"
              },
              "limite": {
                "default": 15,
                "description": "Cuántas devolver como mucho (15 si no se dice).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "para_la_infancia": {
                "description": "Solo las de literatura para niños y jóvenes (temática «infantil»). Un concurso donde escriben menores no lo es: eso se pide con edad.",
                "type": "boolean"
              },
              "premio_minimo": {
                "description": "Dotación mínima en euros.",
                "minimum": 0,
                "type": "integer"
              },
              "sin_cuota": {
                "description": "Quita las que piden pagar por presentarse. Las que no dicen nada de la cuota se quedan, con «cuota» en por_comprobar: casi todas las que hablan de la cuota son gratis, pero hay que mirarlo en las bases.",
                "type": "boolean"
              },
              "solo_sin_residencia": {
                "description": "Solo las que no piden residir en un sitio concreto.",
                "type": "boolean"
              },
              "tema_libre": {
                "description": "Quita las que acotan el tema: las que tienen un tema en palabras o una etiqueta de tema. Las que no dicen nada del tema se quedan, con «tema» en por_comprobar. «infantil» no acota: dice quién lee, no de qué trata.",
                "type": "boolean"
              },
              "texto": {
                "description": "Palabras del título o de quien convoca, p. ej. «Sant Jordi» o «Ayuntamiento de Elche».",
                "maxLength": 120,
                "type": "string"
