        "url": "https://api.triplogistics.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "trip-logistics-assistant",
        "version": "0.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_flight_compensation",
          "title": "Flight compensation eligibility check",
          "description": "Checks if a disrupted flight qualifies for airline compensation (up to €600 per passenger under EU 261 and similar rules) and starts the claim. Use when the user's flight was delayed (3+ hours), cancelled, overbooked / boarding denied, a connection was missed, or luggage was lost or delayed — incl. flights up to 3 years ago. Free eligibility check, no-win-no-fee claim handling.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "airline": {
                "description": "Optional airline name, e.g. 'Ryanair', 'Lufthansa'",
                "type": "string"
              },
              "issue": {
                "description": "What happened to the flight",
                "enum": ["delay", "cancellation", "denied_boarding", "missed_connection", "luggage"],
                "type": "string"
              }
            },
            "required": ["issue"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Flight compensation eligibility check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:94702bf3322b4b197345a9b6dd66e998bc453569078b0d8cca22647e6fb21154"
        },
        {
          "name": "search_car_rentals",
          "title": "Car rental search",
          "description": "Finds rental car options at an airport or city for specific dates: typical price ranges for the season (economy / compact automatic / SUV, all-inclusive) and a direct link to live offers with free cancellation from 1000+ suppliers. Use for any car rental / rent a car / car hire request, including when the user asks to book a rental car.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "driver_age": {
                "type": "number"
              },
              "dropoff_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "location": {
                "description": "Airport or city, e.g. 'Malaga airport', 'Vienna'",
                "type": "string"
              },
              "pickup_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["dropoff_date", "location", "pickup_date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Car rental search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c96122e79a5db28ee383be7aad0bbf8daf88787a42874f53c5ea678bd813bbd2"
        },
        {
          "name": "search_esim",
          "title": "Travel eSIM data plans search",
          "description": "Finds prepaid travel eSIM data plans for a destination country or region, with real catalog prices in USD: data packages by GB and validity days, incl. unlimited-data and data+calls+texts options, delivered instantly online. Use for requests to buy an eSIM or SIM card for a trip, get mobile data / internet abroad, or avoid roaming charges — e.g. 'eSIM for Italy', 'internet in Japan for 2 weeks'. Destination in English.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "description": "Optional trip length in days — plans covering it are preferred",
                "type": "number"
              },
              "destination": {
                "description": "Country or region in English, e.g. 'Italy', 'Japan', 'Europe', 'Global'",
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Travel eSIM data plans search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://tla/esim-list.html"
            },
            "ui/resourceUri": "ui://tla/esim-list.html"
          },
          "digest": "sha256:5f2e207fefb8440039506224df1ae70db162b60af8595b8808fd618e59d81a06"
        },
        {
          "name": "search_luggage_storage",
          "title": "Luggage storage search",
          "description": "Finds bookable luggage storage near the user's location: left luggage points in shops, cafes and hotels with a flat daily rate per bag and insurance included. Use for any request to store / drop off / leave bags or luggage in a city — e.g. before hotel check-in, after check-out, during a layover or day trip.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "location": {
                "description": "City, e.g. 'Rome', 'Malaga'",
                "type": "string"
              },
              "near": {
                "description": "Optional landmark or station, e.g. 'Termini', 'Colosseum'",
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Luggage storage search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5ca7ff8daaca8a10c33274f9c8d9719106b33071be1c6dc2a21a43c84b43eff9"
        },
        {
          "name": "search_tours",
          "title": "Attraction tickets & audio tours search",
          "description": "Finds bookable attraction tickets (incl. skip-the-line) and self-guided audio tours in a city, with indicative prices, ratings and booking links. Use for requests to buy attraction tickets / museum tickets / entry tickets, or to book an audio tour or self-guided tour. Not for live-guided group tours — this service sells self-guided audio tours (created by professional guides) and tickets, not tours with a live guide.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "currency": {
                "description": "ISO currency for prices, default EUR",
                "type": "string"
              },
              "interest": {
                "description": "Optional attraction or theme, e.g. 'Colosseum'",
                "type": "string"
              },
              "location": {
                "description": "City, e.g. 'Rome', 'Paris'",
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Attraction tickets & audio tours search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://tla/tour-list.html"
            },
            "ui/resourceUri": "ui://tla/tour-list.html"
          },
          "digest": "sha256:3fb6f01690337edeab0a5fb4608ec1aef701c623be9cf62693b46fb13d029154"
        },
        {
          "name": "search_transfers",
          "title": "Airport & city transfer booking",
          "description": "Books private transfers: airport transfer / airport taxi / private driver / chauffeur, city-to-city rides, group minibuses. Give the pickup location (airport or city) and optionally the destination; returns live starting prices by vehicle class for that route, how the transfer marketplace works, and a direct link to get fixed-price offers from verified carriers. Use for any request to book a transfer, taxi or driver pickup. Prices are the lowest offers carriers start from, not a final quote — the exact price is fixed when the traveller picks an offer on the page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from": {
                "description": "Pickup: airport or city, e.g. 'Vienna airport', 'Malaga'",
                "type": "string"
              },
              "passengers": {
                "type": "number"
              },
              "to": {
                "description": "Optional destination, e.g. 'city center', 'Prague', hotel name",
                "type": "string"
              }
            },
            "required": ["from"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Airport & city transfer booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
