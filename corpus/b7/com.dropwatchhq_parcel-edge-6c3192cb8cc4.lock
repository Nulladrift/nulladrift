        {
          "name": "exemption_flags",
          "description": "Non-conclusory exemption-contradiction FLAGS: parcels where a residential/homestead exemption coexists with a NON-OWNER-OCCUPANT owner of record (Allegheny: HOMESTEADFLAG=HOM + corporate owner; Cook: residential parcel deeded to an LLC/corp/trust grantee; Philadelphia: single-family homestead exclusion + entity owner; Travis TX: active 10% homestead appraisal cap on a homesite parcel + LLC owner; Fulton GA: homestead ExCode + entity owner; Harris TX: LLC/corporate owner on a residential parcel — owner-type watchlist, HCAD publishes no homestead boolean to confirm). Candidate improper exemptions for exemption-audit / recovery contractors (~30% contingency of recovered liens). Full owner/exemption EVIDENCE CHAIN. NEVER a fraud verdict — the contractor confirms occupancy. Counties: cook-il, allegheny-pa, philadelphia-pa, travis-tx, harris-tx, fulton-ga.",
          "inputSchema": {
            "properties": {
              "county": {
                "description": "County (default allegheny-pa — densest). Only counties exposing an in-table exemption/owner field support this stream.",
                "enum": ["cook-il", "allegheny-pa", "philadelphia-pa", "travis-tx", "harris-tx", "fulton-ga"],
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "minTier": {
                "enum": ["high", "medium", "low"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2c63efc0009a0d2faa360eb0e5f0b60d5c1d1f52b56a8d90d4c1836647f484ee"
        },
        {
          "name": "lien_bundle_report",
          "description": "INVESTOR DESK (paid, $0.50 USDC/call; free preview): per-parcel tax-deed title-research report for a single Allegheny County PA PIN. Returns every UNSATISFIED County/School/Municipal tax lien on the parcel bundled into one surviving-lien stack with a per-taxing-body split + total, the tax-year span (a long tail signals a likely JUDICIAL 'free & clear' sale; a short one an UPSET sale where the buyer takes SUBJECT to surviving liens), and the PA statutory redemption posture (72 P.S. §5860 — PA has no general post-sale redemption; the risk is surviving liens). The cross-join a tax-deed investor pays $150–500/parcel for. CANDIDATE title input, NOT a title opinion — confirm sale type + named lienholders with the county/counsel before bidding.",
          "inputSchema": {
            "properties": {
              "pin": {
                "description": "Allegheny County PIN (parcel ID), e.g. 0138S00120000000.",
                "type": "string"
              }
            },
            "required": ["pin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ea06facf603fe73dc890937e71f0558de1de7ce574d21efb1ff7ef9e05d9403"
        },
        {
          "name": "overassessment_leads",
          "description": "Scored, dated, deadline-stamped COMMERCIAL property-tax over-assessment leads. Each lead is a parcel whose assessor implied-market value EXCEEDS its most recent CLEAN arm's-length sale price — a candidate over-payment a contingency tax-appeal firm pursues. Counties that publish a public sale price: cook-il, allegheny-pa, philadelphia-pa, king-wa, maricopa-az. (Texas/Georgia counties are non-disclosure — over-assessment is an honest null there; use exemption_flags instead.) Candidates from PUBLIC data; the firm confirms valuation. Not legal/valuation advice.",
          "inputSchema": {
            "properties": {
              "county": {
                "description": "County (default cook-il).",
                "enum": ["cook-il", "allegheny-pa", "philadelphia-pa", "king-wa", "travis-tx", "harris-tx", "maricopa-az", "fulton-ga"],
                "type": "string"
              },
              "limit": {
                "description": "Max leads (default 25).",
                "type": "number"
              },
              "minRatio": {
                "description": "Min over-assessment ratio (default 1.15).",
                "type": "number"
              },
              "minTier": {
                "description": "Min confidence tier (default high).",
                "enum": ["high", "medium", "low"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e295a1608586e8bdf892f9bc666ea00e8466a10a8ccb3fb6bb5458911f00a2c7"
        },
