          "name": "construction_window_leads",
          "description": "Fresh ASSESSABLE construction permits (funded builds) entering the permit→financing window — prospects for hard-money / construction lenders racing the permit-to-loan gap. HONEST: loan-absence is UNVERIFIED (no current free per-parcel mortgage feed); this is a time-boxed absence-window WATCHLIST, re-checked as financing appears. Cook County. Permit amount, age, window status, applicant, work description.",
