        {
          "name": "stalled_surety",
          "description": "STALLED-PROJECT candidates for SURETY / DRAW-CONTROL firms + the exposed construction lender. Each is a large ASSESSABLE building permit (real funded build) whose status is still NOT CLOSED well PAST its size-appropriate build window — an issued-but-never-finaled permit (no certificate-of-occupancy proxy reached). Built off the SAME nightly Cook Assessor Permits pull; the permit carries its own status field. Permit amount, age, expected build window, overdue days/%, current status. HONEST: 'stalled' is a STATUS+RECENCY inference, NOT a verified work-stoppage (paperwork lag / phased builds / slow finaling can also leave a permit OPEN) — the surety/draw-control firm confirms on the ground. Counties that do NOT expose permit status return an honest null for this stream; Cook does, so it ships here. Cook County.",
          "inputSchema": {
            "properties": {
              "county": {
                "description": "County (cook-il; only counties exposing permit status support this stream).",
                "enum": ["cook-il"],
                "type": "string"
              },
