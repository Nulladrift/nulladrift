          "digest": "sha256:511b926ae4ce5f2c771a7e0e7ce3a69d6a69b0af196da65ded842b0068012474"
        },
        {
          "name": "get_full_persona",
          "title": "Get Full Persona",
          "description": "Load a product's complete persona definition. PREMIUM (license).\n\nTypical input {\"slug\": \"inbox-commander\"} returns {\"slug\": ...,\n\"persona\": \"<full persona text>\"}.\n\nReturns the persona text alone, with no skill bodies. Use when the caller\nneeds the product's voice and operating rules only. Not when skills are\nalso wanted - get_full_product returns persona and every skill in one\ncall. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown slug '<value>'\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Product slug exactly as returned by search_catalog.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Full Persona"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
