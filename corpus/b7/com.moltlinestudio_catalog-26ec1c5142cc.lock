        },
        {
          "name": "get_full_product",
          "title": "Get Full Product",
          "description": "Load one product in full: persona plus every skill's instructions. PREMIUM (license).\n\nTypical input {\"slug\": \"inbox-commander\"} returns {\"slug\": ...,\n\"name\": ..., \"persona\": ..., \"skills\": [{\"name\": ..., \"instructions\":\n...}], \"free_skill\": {...}}.\n\nReturns persona plus every skill for one product. Use when the caller\nwants the whole product. Not for a single skill (get_full_skill) and not\nfor a bundle of products (get_full_kit). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown slug '<value>'\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Product slug exactly as returned by search_catalog.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Full Product"
          },
          "behavior": {
