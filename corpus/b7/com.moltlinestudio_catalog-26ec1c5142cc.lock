              "tags": []
            }
          },
          "digest": "sha256:e92ff8ee656e9fd1630f099b50e9ef63a7ed4f1bedd244125c0d0e2221d292b1"
        },
        {
          "name": "upgrade_info",
          "title": "Upgrade Info",
          "description": "Explain how to unlock full personas, paid skills, and kits. FREE.\n\nTakes no arguments. Returns {\"message\": ..., \"how\": ..., \"free_tier\":\n...} describing the upgrade path and what stays free.\n\nUse when a premium tool has been refused or the caller asks what a plan\ncovers. Not for per-bundle or per-product pricing (list_kits,\npreview_product). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
