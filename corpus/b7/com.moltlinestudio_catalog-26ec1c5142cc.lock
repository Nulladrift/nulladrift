        },
        {
          "name": "get_full_skill",
          "title": "Get Full Skill",
          "description": "Load one paid skill's complete instructions from a product. PREMIUM (license).\n\nTypical input {\"slug\": \"inbox-commander\", \"skill_name\": \"email-triage\"}\nreturns {\"slug\": ..., \"skill\": ..., \"instructions\": \"<full\nskill text>\"}.\n\nReturns one named skill, selected by skill_name. Use after preview_product\nhas shown the skill list and the caller wants one specific paid skill. Not\nfor the free gateway skill, which get_free_skill returns with no plan, and\nnot for every skill at once (get_full_product). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown slug '<value>'\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "skill_name": {
                "description": "Exact skill name as shown in preview_product's \"skills\"\nlist for that product.",
                "type": "string"
              },
              "slug": {
                "description": "Product slug exactly as returned by search_catalog.",
                "type": "string"
              }
            },
            "required": ["skill_name", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Full Skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:86cce6b18df2c9e0e5fcb8c654bc1402d3e3965a9fb0b65a26e50694400196b7"
        },
        {
          "name": "list_kits",
          "title": "List Kits",
          "description": "List the 12 themed kits with pricing and member products. FREE.\n\nTakes no arguments. Returns a list of kit objects, each {\"slug\": ...,\n\"name\": ..., \"price_usd\": N, \"tagline\": ..., \"members\": [\"product-slug\",\n...], \"availability\": ...}. Use a kit's slug with get_full_kit (premium).\nKits are not sold standalone on any marketplace: price_usd is the bundle's\nreference value, and All-Access is how a caller actually unlocks one.\n\nUse when the caller asks about bundles or bundle pricing. Not for\nindividual products (search_catalog) and not for a kit's full contents\n(get_full_kit). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Kits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:08f205626c80f724c833540d3dffc128e4907e1fcc67bc9b4ab7229b3e69941c"
        },
        {
          "name": "preview_product",
          "title": "Preview Product",
          "description": "Preview one product: metadata, persona teaser, and paid-skill teasers. FREE.\n\nTypical input {\"slug\": \"inbox-commander\"} returns {\"slug\": ...,\n\"name\": ..., \"tagline\": ..., \"persona_preview\": ..., \"skills\":\n[{\"name\": ..., \"preview\": ...}], \"free_skill\": ..., \"note\": ...}.\n\nReturns teasers only, never full text. Use to judge a product before\ncommitting. Not for the complete persona or skill bodies\n(get_full_persona, get_full_product), and not when the caller wants\ninstructions they can act on now (get_free_skill). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown slug '<value>'\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Product slug exactly as returned by search_catalog or\nrecommend_products, e.g. \"inbox-commander\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Preview Product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:de9b58e22b7a634044d0aaa101883478943478bd99a05540ba5b9ed053148917"
        },
        {
          "name": "recommend_products",
          "title": "Recommend Products",
          "description": "Recommend catalog products for a need described in plain language. FREE.\n\nTypical input {\"need\": \"help answering customer support emails\"} returns\n{\"need\": ..., \"recommendations\": [{\"slug\": ..., \"name\": ..., \"why\": ...,\n\"area\": ..., \"try_free\": \"<free skill name>\"}], \"next\": \"...\"}.\n\nUse when the caller describes a problem instead of naming a product;\nranking is by fit to the described need. Not for exact keyword or slug\nlookups (search_catalog). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum recommendations; values outside 1-10 are clamped.\nDefault 5.",
                "type": "integer"
              },
              "need": {
                "description": "The job or problem in plain language, a few words or a\nsentence, e.g. \"help answering customer support emails\".",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:29124750bdcce516ce70e1276e6d71f881d27f4eb57b307e5a504f1e27260314"
        },
        {
          "name": "search_catalog",
          "title": "Search Catalog",
          "description": "Search all 138 catalog products by keyword and/or focus area. FREE.\n\nTypical input {\"query\": \"email inbox\", \"limit\": 5} returns a ranked list\nof product objects [{\"slug\": ..., \"name\": ..., \"area\": ..., \"segment\":\n..., \"tagline\": ...}]. An empty query with an area set browses that area.\n\nUse when the caller names a keyword, product, or focus area to look up.\nNot for bundles (list_kits) and not for plain-language problem statements,\nwhich recommend_products ranks by fit rather than keyword match. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "default": "",
                "description": "Optional focus-area filter; one of \"productivity\",\n\"developertools\", \"personalassistant\", \"creative\",\n\"industryspecific\", \"educational\". Empty means all areas.",
                "type": "string"
              },
              "limit": {
                "default": 15,
                "description": "Maximum results to return; values outside 1-100 are clamped.\nDefault 15.",
                "type": "integer"
              },
              "query": {
                "default": "",
                "description": "Space-separated keywords matched against name, tagline, slug,\nand segment, e.g. \"email inbox\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Catalog"
          },
          "behavior": {
