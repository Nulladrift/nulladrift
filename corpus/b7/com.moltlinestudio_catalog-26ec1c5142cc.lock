      },
      "instructions": "Moltline Studio's catalog of 138 OpenClaw personas & skills and 12 kits. Free: search_catalog, preview_product, get_free_skill, list_kits, upgrade_info. Premium (paid plan): get_full_persona, get_full_skill, get_full_product, get_full_kit.",
      "tools": [
        {
          "name": "get_free_skill",
          "title": "Get Free Skill",
          "description": "Load a product's free gateway skill with its complete instructions. FREE.\n\nTypical input {\"slug\": \"inbox-commander\"} returns {\"slug\": ...,\n\"skill\": \"<skill name>\", \"instructions\": \"<full skill text>\"}.\n\nReturns exactly one skill - the product's free gateway skill - chosen\nautomatically from the slug, with no plan required. Use when the caller\nwants usable instructions immediately. Not for the product's other skills:\nthose are named and need get_full_skill with a skill_name, which requires\na paid plan. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown slug '<value>'\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Product slug exactly as returned by search_catalog,\ne.g. \"inbox-commander\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Free Skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:3a09f56c5e1259fae2361283da2ff0739f94d6a32146e701b42142f4726a434a"
        },
        {
          "name": "get_full_kit",
          "title": "Get Full Kit",
          "description": "Load a themed kit and every member product in full. PREMIUM (license).\n\nTypical input {\"slug\": \"founder-kit\"} returns {\"slug\": ..., \"name\": ...,\n\"products\": [{\"slug\": ..., \"name\": ..., \"persona\": ..., \"skills\":\n[...]}, ...]}.\n\nReturns every member product of one bundle in full, so the payload is\nlarge. Use only after list_kits has confirmed the kit slug. Not for a\nsingle product (get_full_product). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown kit '<value>'\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Kit slug exactly as returned by list_kits, e.g. \"founder-kit\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Full Kit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
