{
  "lockfileVersion": 2,
  "subjects": {
    "app.shotlee/shotlee": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.shotlee.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "shotlee",
        "title": "Shotlee",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools over Shotlee’s public content: reconstitution/syringe-unit arithmetic and search over the GLP-1, peptide and hormone article corpus. Dosing output is arithmetic, not medical advice.",
      "tools": [
        {
          "name": "calculate_reconstitution",
          "title": "Calculate peptide reconstitution and syringe units",
          "description": "Given a lyophilized vial size, a volume of bacteriostatic water and a target dose, return the resulting concentration, the volume to draw, and the reading on a U-100 insulin syringe. Use for peptide and compounded GLP-1 dosing arithmetic.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bac_water_ml": {
                "description": "Bacteriostatic water added, in mL",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "dose_mg": {
                "description": "Target dose, in mg (1 mg = 1000 mcg)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "vial_mg": {
                "description": "Peptide in the vial, in mg",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["bac_water_ml", "dose_mg", "vial_mg"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5488a5ccb4750191f0b4fce475ccc393713c8468ad651a96ba3f72949ebab0c8"
        },
        {
          "name": "get_article",
          "title": "Get a Shotlee article as Markdown",
          "description": "Fetch the full text of one article by its slug, as returned by search_articles. For a non-English locale, pass either the English slug or the translated slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "enum": ["en", "ar", "de", "es", "fr", "hi", "id", "it", "pl", "pt", "ru", "zh", "ja", "nl"],
                "type": "string"
              },
              "slug": {
                "description": "Article slug, e.g. \"naltrexone-ozempic-for-alcohol-cravings-explained\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:597f2a531efca7f2e6e957f9f69a7aa21a85f4c974ca59f58545e8b46090164e"
        },
        {
          "name": "search_articles",
          "title": "Search Shotlee articles",
          "description": "Search the English blog corpus by keyword and return matching articles with their titles and canonical URLs, newest first. Every keyword must appear in the title or slug. Use to find Shotlee coverage of a drug, peptide, side effect or topic.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords, e.g. \"ozempic nausea\"",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f70ea133a669a49b50d9e7e7bc572040cebf68c1109442a24d9756a007405cf1"
        }
      ],
      "digest": "sha256:4be84c8ac6532dc6796d6862c5bc23e0e50b98de5f9d61b105b2018277259af4"
    }
  }
}
