                "type": "number"
              },
              "opportunity_id": {
                "type": "string"
              },
              "power_kw": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "risk_profile": {
                "enum": ["conservative", "balanced", "aggressive"],
                "type": "string"
              }
            },
            "required": ["deadline", "energy_kwh", "opportunity_id", "power_kw", "risk_profile"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
