                  },
                  "latest_end": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "max_price_eur_mwh": {
                    "maximum": 10000,
                    "minimum": -1000,
                    "type": "number"
                  },
                  "must_run_continuously": {
                    "const": true,
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "deadline": {
                "format": "date-time",
                "type": "string"
              },
              "energy_kwh": {
