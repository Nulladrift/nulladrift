      "serverInfo": {
        "name": "com.clawhard/stake",
        "title": "Stake",
        "version": "1.0.0",
        "description": "Stake checks whether domain names are available to register by asking each ending's own registry (RDAP, the official successor to WHOIS). Check full domains or names across .com, .io, .ai, .dev, .app and more, and see who holds the taken ones, since when, until when, and whether they sit on a parking or marketplace service. No account.",
        "websiteUrl": "https://stake.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stake: Stake checks whether domain names are available to register by asking each ending's own registry (RDAP, the official successor to WHOIS). Check full domains or names across .com, .io, .ai, .dev, .app and more, and see who holds the taken ones, since when, until when, and whether they sit on a parking or marketplace service. No account. Use it when someone asks whether a domain name is available or taken, wants name ideas whose domain is still open, or asks who holds a domain and when it expires. Tools: stake_check_domains (Check whether domain names are available to register (live registry lookup)). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "stake_check_domains",
          "title": "Check whether domain names are available to register (live registry lookup)",
          "description": "Use when the user asks whether a domain is available or taken, wants product, startup, app or project name ideas with a free domain, or is about to put a domain into a plan, README, config or launch post (signals: \"is the .com taken\", \"domain available\", \"name ideas with a .com\", \"which of these names has a free domain\", \".io or .ai\", \"who owns this domain\", \"when does it expire\"). Asks each ending's own registry through RDAP (the official successor to WHOIS; IANA's server list plus the registries of .io, .me, .sh, .ac, .us, .so, .de, .ch that are not in it), and returns per domain: available, registered, registered_expiring (redemption or pending delete), likely_available (DNS only: for endings with no public RDAP such as .co, .gg, .eu, .it, or when a registry's RDAP server refuses or rate-limits the check), unknown or invalid; for taken names the registration and expiry dates, days to expiry, registrar, status codes and nameservers, and a flag when the nameservers belong to a parking or domain-marketplace service (Afternic, Dan.com, Sedo, Atom and others: the owner may sell it). Pass full domains, or names plus endings: {\"names\":[\"tidewell\",\"brightloop\"],\"tlds\":[\"com\",\"io\",\"ai\"]} or {\"domains\":[\"tidewell.com\",\"münchen.de\",\"foo.co.uk\"]}. Default endings when only names are given: com, io, ai, dev, app, co, net, org. Up to 20 domains per call. Call it before presenting name ideas as available instead of guessing. Cannot see prices, premium or reserved status, trademarks, or social handles; \"available\" is not a reservation.",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "Full domain names to check, e.g. [\"tidewell.com\", \"tidewell.io\"]. International names (münchen.de) and suffixes such as co.uk are fine; a URL or subdomain is reduced to the registrable domain. Up to 20.",
                "items": {
                  "maxLength": 260,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "names": {
                "description": "Bare names without an ending, e.g. [\"tidewell\"]; each is checked with every entry in tlds. Up to 10 names (and 20 domains in total).",
                "items": {
                  "maxLength": 63,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "tlds": {
                "description": "Endings to try with names, e.g. [\"com\",\"io\",\"ai\",\"dev\"] (a leading dot is fine; co.uk works). Default: com, io, ai, dev, app, co, net, org.",
                "items": {
                  "maxLength": 30,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check whether domain names are available to register (live registry lookup)"
          },
          "behavior": {
