        {
          "name": "get_api_v1_jobs_search",
          "title": "Search",
          "description": "search jobs Group: jobs. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companyIds": {
                "description": "Specific company LinkedIn IDs to filter results (comma-separated)\nExamples: 2499210,1337,104085107\nFormat: comma-separated numbers",
                "title": "companyIds",
                "type": "string"
              },
              "experience": {
                "description": "The required experience level for the job\nAvailable Options:\n\n internship - Student internships\n\n entry_level - 0-2 years experience (Junior roles)\n\n associate - 2-4 years experience\n\n mid_senior - 4-8 years experience (Mid-level to Senior)\n\n director - 8+ years experience (Director level and above)\n\nExample: experience=entry_level,mid_senior",
                "title": "experience",
                "type": "string"
              },
              "geoId": {
                "description": "LinkedIn's internal geographic identifier (optional)\nExamples: 103644278,102571732\nNote: Usually auto-detected from location",
                "title": "geoId",
                "type": "string"
              },
              "jobTypes": {
                "description": "jobTypes (comma-separated)\nThe type of employment you're looking for\nAvailable Options:\n\n full_time - Full-time positions\n\n part_time - Part-time positions\n\n contract - Contract-based work\n\n temporary - Temporary assignments\n\n internship - Internship opportunities\n\n volunteer - Volunteer positions\n\nExample: jobTypes=full_time,contract",
                "title": "jobTypes",
                "type": "string"
              },
              "keyword": {
                "description": "The job title, skills, or keywords to search for\nExamples: software engineer,nodejs developer,data scientist,product manager",
                "example": "nodejs",
                "title": "keyword",
                "type": "string"
              },
              "location": {
                "description": "The city, state, or region where you want to find jobs\nExamples: San+Francisco, New+York+City, London, Remote\nFormat: Use + for spaces: San+Francisco+Bay+Area",
                "title": "location",
                "type": "string"
              },
              "regions": {
                "description": "Specific region codes for targeted search (optional)\nExamples: 102571732,103743442",
                "title": "regions",
                "type": "string"
              },
              "salary": {
                "description": "salary\nMinimum salary range you're targeting\nAvailable Options:\n\n any - Any salary (default)\n\n 40k - $40,000+ per year\n\n 60k - $60,000+ per year\n\n 80k - $80,000+ per year\n\n 100k - $100,000+ per year\n\n 120k - $120,000+ per year\n\nExample: salary=100k",
                "title": "salary",
                "type": "string"
              },
              "start": {
                "description": "*The starting index for pagination (0-based)*\nDefault: 0 (first page)\nIncrement by: 25 per page (LinkedIn's default page size)\nExample: start=25 (second page), start=50 (third page)",
                "example": "0",
                "title": "start",
                "type": "string"
              },
              "timePosted": {
                "description": "How recently the job was posted\nAvailable Options:\n\n any - Any time (default)\n\n 24h - Past 24 hours\n\n 1week - Past week\n\n 1month - Past month\n\nExample: timePosted=1week",
                "example": "any",
                "title": "timePosted",
                "type": "string"
              },
              "workArrangement": {
                "description": "The work location arrangement\nAvailable Options:\n\n onsite - Office-based work\n\n remote - Fully remote work\n\n hybrid - Combination of office and remote\n\nExample: workArrangement=remote,hybrid",
                "title": "workArrangement",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa702dd276086648c24ae02314ad8c6f3be9af8ffc23ecb2b09a02c477a60a6f"
