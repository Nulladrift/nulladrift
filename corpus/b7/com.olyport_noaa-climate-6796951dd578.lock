      "tools": [
        {
          "name": "find_stations",
          "description": "Find NOAA weather stations in an area.\n\n    Returns a list of weather stations with their IDs, names, coordinates,\n    and active date ranges. Use the station IDs with get_climate_data.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'NY').\n        county_fips: Five-digit county FIPS code (e.g. '36061' for Manhattan).\n        dataset: Dataset ID to filter stations that have data in this dataset.\n                 Default is 'GHCND' (daily summaries).\n        limit: Maximum number of stations to return (default 25, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "dataset": {
                "default": "GHCND",
                "title": "Dataset",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              }
            },
            "title": "find_stationsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "find_stationsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d72958f2fb6f9a3a0b1facf4b6a00ed023a158e8e5e86315a8ca7f971f1e6b6f"
        },
        {
          "name": "get_climate_data",
          "description": "Get climate observations from NOAA Climate Data Online.\n\n    Returns historical weather measurements such as temperature, precipitation,\n    and snowfall. You must provide either a station_id or a FIPS code to\n    identify the location, and a date range.\n\n    Args:\n        station_id: NOAA station identifier (e.g. 'GHCND:USW00094728' for Central Park).\n        fips: FIPS code for county or state (e.g. '36' for New York state, '36061' for Manhattan).\n        dataset: Dataset ID. Common values: 'GHCND' (daily summaries), 'GSOM' (monthly),\n                 'GSOY' (annual), 'NORMAL_DLY' (daily normals). Default is 'GHCND'.\n        start_date: Start date in YYYY-MM-DD format. Required for most datasets.\n        end_date: End date in YYYY-MM-DD format. Required for most datasets.\n        data_types: Comma-separated data type IDs to filter. Common types:\n                    TMAX (max temp), TMIN (min temp), TAVG (avg temp),\n                    PRCP (precipitation), SNOW (snowfall), SNWD (snow depth),\n                    AWND (avg wind speed). If omitted, all available types are returned.\n        limit: Maximum number of records to return (default 100, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "data_types": {
                "default": null,
                "title": "Data Types",
                "type": "string"
              },
              "dataset": {
                "default": "GHCND",
                "title": "Dataset",
                "type": "string"
              },
              "end_date": {
                "default": null,
                "title": "End Date",
                "type": "string"
              },
              "fips": {
                "default": null,
                "title": "Fips",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "title": "Limit",
                "type": "integer"
              },
              "start_date": {
                "default": null,
                "title": "Start Date",
                "type": "string"
              },
              "station_id": {
                "default": null,
                "title": "Station Id",
                "type": "string"
              }
            },
            "title": "get_climate_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_climate_dataOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5b4e07b30582106069be97e6b2f1917d55477aeaceac84beef0a1849a8f3d253"
        },
        {
          "name": "get_climate_normals",
          "description": "Get 30-year climate normal values for a NOAA weather station.\n\n    Climate normals are averages computed over the most recent 30-year period\n    (currently 1991-2020). They represent typical conditions for a location\n    and are useful for comparing current conditions to historical baselines.\n\n    Args:\n        station_id: NOAA station identifier (e.g. 'GHCND:USW00094728').\n                    Use find_stations to look up station IDs.\n        data_types: Comma-separated normal data type IDs to filter. Common types:\n                    DLY-TMAX-NORMAL (avg daily max temp), DLY-TMIN-NORMAL (avg daily min temp),\n                    DLY-TAVG-NORMAL (avg daily temp), DLY-PRCP-PCTALL-GE001HI (precip probability),\n                    MTD-PRCP-NORMAL (monthly precip), ANN-TMAX-NORMAL (annual max temp).\n                    If omitted, all available normals are returned.\n    ",
          "inputSchema": {
            "properties": {
              "data_types": {
                "default": null,
                "title": "Data Types",
                "type": "string"
              },
              "station_id": {
                "title": "Station Id",
                "type": "string"
              }
            },
            "required": ["station_id"],
            "title": "get_climate_normalsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_climate_normalsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6388e2cf4077c7806abcb3e046237bf51d8d222b8315ccdf607d094847c4ecc9"
        }
      ],
      "digest": "sha256:aeb65f1c736125146f8e745cb2d728389672950b6b209c4998b82f99a0644203"
    }
  }
