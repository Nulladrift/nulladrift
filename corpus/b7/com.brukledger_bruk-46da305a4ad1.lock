            "additionalProperties": false,
            "properties": {
              "amount": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "destination": {
                "description": "XRP Ledger r-address",
                "type": "string"
              },
              "destination_tag": {
                "minimum": 0,
                "type": "integer"
              },
              "issuer": {
                "description": "XRP Ledger r-address",
                "type": "string"
              },
