        {
          "name": "payment_watch",
          "title": "Payment Watch",
          "description": "Payment arrival alert: watches an XRP Ledger address for up to 24 hours and POSTs a signed webhook when a matching payment is final (validated, tesSUCCESS, delivered amount checked), or a watch.expired event if none arrives. Payments that land during restarts are still caught. Useful when waiting on an incoming payment without polling. The first call each day returns the real answer without payment. After that, about $0.05 via x402 (USDC on Base, or XRP / RLUSD on the XRP Ledger). A payment watch is paid from the first call. Bad input and ledger outages are never charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "XRP Ledger r-address",
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "destination_tag": {
                "minimum": 0,
                "type": "integer"
              },
              "hours": {
