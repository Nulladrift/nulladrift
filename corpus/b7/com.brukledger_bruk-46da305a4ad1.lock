      "instructions": "Verified XRP Ledger answers with proof. The first paid-tool call each day returns the real answer without payment; the next call that day returns the x402 price. Retry a priced call with params._meta['x402/payment']. A payment watch is paid from the first call. Free tools: free_send_check (one per day), list_services, get_sample, learn_about_bruk.",
      "tools": [
        {
          "name": "free_send_check",
          "title": "Free daily send check",
          "description": "Free, one per user per day. Before sending XRP or a token on the XRP Ledger: will the payment fail (missing destination tag, unfunded or deleted account, no trust line, wrong issuer) and what should you double-check? Returns the verdict, blockers, and cautions from a validated ledger. The paid send_check adds the full evidence and has no daily limit.",
