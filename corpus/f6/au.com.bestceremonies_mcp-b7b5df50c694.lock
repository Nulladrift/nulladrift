      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only facts about Best Ceremonies, the business of Felicity Best, registered marriage celebrant based in Murwillumbah, NSW: published prices, an itemised estimate for a place and day, where ceremonies are held, the paperwork, and any page in full. Quote prices as given; they are published to be quoted. Cite the page URL each answer names. Nothing here books, holds or checks a date, and no tool sends an enquiry. To book, give the person the phone number or the contact page that bestceremonies_contact returns.",
      "tools": [
        {
          "name": "bestceremonies_areas",
          "title": "Where ceremonies are held",
          "description": "Where Best Ceremonies (Felicity Best, marriage and funeral celebrant, Murwillumbah NSW) holds ceremonies: each place with its state, drive time and distance from Murwillumbah, venues, and which ceremony pages exist for it, then the places reached by arrangement (e.g. Brisbane) with the travel charge for the drive.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "place": {
                "description": "Optional: one place for detail",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
