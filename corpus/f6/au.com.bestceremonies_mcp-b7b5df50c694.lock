        "title": "Best Ceremonies",
        "version": "1.0.0",
        "description": "Prices, travel estimates, areas and paperwork for Best Ceremonies, a celebrant near Murwillumbah.",
        "websiteUrl": "https://bestceremonies.com.au/agents/",
        "icons": [
          {
            "src": "https://bestceremonies.com.au/icon-512.png",
