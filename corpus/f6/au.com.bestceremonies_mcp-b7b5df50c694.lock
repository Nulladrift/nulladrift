        {
          "name": "bestceremonies_estimate",
          "title": "Estimate a ceremony's total",
          "description": "Itemised total for one ceremony: the tier's fee for the day, travel beyond the included kilometres, witnesses supplied, booking fee and balance. Arithmetic is the same as the estimator on the prices page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "day": {
                "description": "weekday = Monday to Thursday, weekend = Friday to Sunday",
                "enum": ["weekday", "weekend"],
                "type": "string"
              },
              "km": {
                "description": "One-way road kilometres from Murwillumbah, if the place is not listed",
                "type": "number"
              },
              "place": {
                "description": "One of the site's places, e.g. Byron Bay, Gold Coast, Scenic Rim, or a further-afield one such as Brisbane; or omit and give km",
                "type": "string"
              },
              "service": {
                "description": "Service id or name, e.g. weddings, elopements, legals-only, funerals",
                "type": "string"
              },
              "tier": {
                "description": "Tier name when the service has more than one; defaults to the first",
                "type": "string"
              },
              "witnesses": {
                "description": "Witnesses to supply (marriage ceremonies only)",
                "maximum": 2,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
