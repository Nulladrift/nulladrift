        },
        {
          "name": "get_sample_data",
          "title": "Get Sample Data",
          "description": "100 REAL rows from a Dataplex product's primary table — the same governed views sold on Snowflake and Databricks. No signup needed. Use this to evaluate schema and content quality.",
          "inputSchema": {
            "properties": {
              "max_rows": {
                "default": 25,
                "description": "Number of sample rows to return (1-100, default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Product identifier (e.g. 'cms_data_feeds', 'npi_registry', 'cdc_public_health'). Call list_products to get valid slugs.",
