          "digest": "sha256:cd33dbf0f6450402ddbb1dd30a52341c5aa2b9418b2db5f605fbcd7e36fc877c"
        },
        {
          "name": "get_product_details",
          "title": "Get Product Details",
          "description": "Full metadata for one Dataplex product: description, key facts, tables, temporal coverage, update frequency, feed or dataset catalog preview (CMS, CDC), price, docs, Snowflake Marketplace listing.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product identifier (e.g. 'cms_data_feeds', 'npi_registry', 'cdc_public_health'). Call list_products to get valid slugs.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
