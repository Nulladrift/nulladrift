{
  "lockfileVersion": 2,
  "subjects": {
    "com.dataplex-consulting/healthcare-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.dataplex-consulting.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dataplex-healthcare-data",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only catalog of Dataplex healthcare data products with real 100-row samples. Start with list_products or search_health_datasets; plan queries with get_data_dictionary (columns + validated SQL); evaluate with get_sample_data; get purchase/trial paths with get_access_options.",
      "tools": [
        {
          "name": "get_access_options",
          "description": "Every way to get full access to a Dataplex product: Snowflake Marketplace, Databricks, free trial, docs, human contact.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:540ee6232f698b2d4f8b2e444023859d8015fc5650c529fa78995d5ac133a587"
        },
        {
          "name": "get_data_dictionary",
          "description": "Column-level data dictionary for one Dataplex product: tables, columns with types and descriptions, temporal coverage, and validated SQL including the non-obvious query patterns (current-release filters, dedupe flags, text-encoded numbers). Pass table to get one table's columns; enough to plan an analysis before subscribing.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              },
              "table": {
                "description": "Optional table or view name, e.g. HOSPITAL_GENERAL_INFORMATION",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:baf51c229307650fa8f52472882711d269a203f7d2004aecfded8ede047478ee"
        },
        {
          "name": "get_pricing",
          "description": "Machine-readable pricing for all Dataplex products: monthly price, free-trial link, Snowflake Marketplace listing URL.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:516d25d2186e882365a7ffa6fb838ce6edba808631fb7a66f9d48b36433a801d"
        },
        {
          "name": "get_product_details",
          "description": "Full metadata for one Dataplex product: description, key facts, tables, temporal coverage, update frequency, feed or dataset catalog preview (CMS, CDC), price, docs, Snowflake Marketplace listing.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b20f36560edd2d3efe444f74cb5136189591cc1ec67470e9b0f62bddc015bf9d"
        },
        {
          "name": "get_sample_data",
          "description": "100 REAL rows from a Dataplex product's primary table — the same governed views sold on Snowflake and Databricks. No signup needed. Use this to evaluate schema and content quality.",
          "inputSchema": {
            "properties": {
              "max_rows": {
                "default": 25,
                "type": "integer"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7ace1b32827e564b82279ffd870154ca1392901f1ba8139ad10d59da76a64723"
        },
        {
          "name": "get_snowflake_trial_sql",
          "description": "Copy-paste SQL for an agent INSIDE a Snowflake account to mount a Dataplex listing and start querying trial data in minutes — no browser, no sales call.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4c959371e6593dd317030d02cc29865f8a605faa118b5ba130a69bad8365635"
        },
        {
          "name": "list_products",
          "description": "List all Dataplex healthcare data products: CMS provider, facility, nursing home and prior authorization compliance data, FDA adverse events (FAERS/MAUDE), CDC public health statistics, NPPES NPI provider records, hospital and Medicaid spending. Returns slug, name, one-liner, price, and links for each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d86529e98f34872ae694819b32bc30f6f378cdeff9358e476e552cc40b43226"
        },
        {
          "name": "search_health_datasets",
          "description": "Search Dataplex healthcare datasets by keyword (e.g. 'Medicare physician spending', 'nursing home compliance', 'prior authorization CMS-0057', 'FDA adverse events', 'NPI provider', 'CDC drug overdose deaths'). Matches product names and descriptions, 300+ CMS feed titles, 1,500+ CDC dataset names, and column names; returns matching products with the specific feeds, datasets and columns that matched.",
          "inputSchema": {
            "properties": {
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de2bfe1257b65ff164e883aa63590795f98a5064df4a84da5b63a41008ec931d"
        }
      ],
      "digest": "sha256:35bb50ab60227e2ee7f8c513cdbb227d9d71170d5aa6026d2323e16ae1459093"
    }
  }
}
