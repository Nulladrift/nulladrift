      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only catalog of Dataplex healthcare data products with real 100-row samples. All tools are read-only. Workflow: (1) list_products or search_health_datasets to find products and get their slugs; (2) get_product_details or get_data_dictionary for schema and validated SQL; (3) get_sample_data to evaluate real rows; (4) get_access_options or get_snowflake_trial_sql for purchase/trial paths.",
      "tools": [
        {
          "name": "get_access_options",
          "title": "Get Access Options",
          "description": "Every way to get full access to a Dataplex product: Snowflake Marketplace, Databricks, free trial, docs, human contact.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product identifier (e.g. 'cms_data_feeds', 'npi_registry', 'cdc_public_health'). Call list_products to get valid slugs.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7cc40138e8d1a321291bbf9aeeeb5c0ec20a05109491ef0efd776b1982fe7f8"
        },
        {
          "name": "get_data_dictionary",
          "title": "Get Data Dictionary",
          "description": "Column-level data dictionary for one Dataplex product: tables, columns with types and descriptions, temporal coverage, and validated SQL including the non-obvious query patterns (current-release filters, dedupe flags, text-encoded numbers). Pass table to get one table's columns; enough to plan an analysis before subscribing.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product identifier (e.g. 'cms_data_feeds', 'npi_registry', 'cdc_public_health'). Call list_products to get valid slugs.",
                "type": "string"
              },
              "table": {
                "description": "Table or view name to get columns for, e.g. 'HOSPITAL_GENERAL_INFORMATION'. Omit to get a table index with column counts.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfc55939518903e3af76216bf40fc84ea0c892e98e34ecde4b68b10c8b3eb606"
        },
        {
          "name": "get_pricing",
          "title": "Get Pricing",
          "description": "Machine-readable pricing for all Dataplex products: monthly price, free-trial link, Snowflake Marketplace listing URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
