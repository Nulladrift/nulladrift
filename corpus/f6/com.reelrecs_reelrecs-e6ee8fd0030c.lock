        {
          "name": "get_watchplus_context",
          "title": "Understand our Watch+ tastes",
          "description": "Explore the selected accepted group members' accessible tastes. Returns liked and less-liked examples and descriptive patterns. Supply up to ten resolved title IDs for each person's predicted rating, saved rating, Watch+ interest/pass and relevant saved references, including evidence beyond the overview examples. Helps explain shared appeal, differences, reservations and compromises. Profiles respect existing privacy and blocks. Missing evidence is unknown. Similar saved titles illustrate content overlap; they do not explain the scoring model's causes. Requires watchplus:read; cannot read strangers, pending invitations, private chats or change anything.",
          "inputSchema": {
            "properties": {
              "request": {
                "additionalProperties": false,
                "properties": {
                  "group_id": {
                    "description": "Copy a group_id from get_my_watchplus_groups; a group name or an email is not an identifier.",
                    "maxLength": 64,
                    "minLength": 1,
                    "title": "Group Id",
                    "type": "string"
                  },
                  "member_ids": {
                    "description": "Copy member_ids from this group's roster for the people watching now. Empty means everyone, up to eight. Do not infer who is watching from membership alone.",
                    "items": {
                      "pattern": "^wm[1-9]\\d{0,18}$",
                      "type": "string"
                    },
                    "maxItems": 8,
                    "title": "Member Ids",
                    "type": "array"
                  },
                  "title_ids": {
                    "description": "Optional resolved titles to compare for these people. Retrieves relevant saved likes and dislikes across their accessible history, alongside each person's prediction, saved rating and Watch+ vote.",
                    "items": {
                      "pattern": "^tt\\d{5,12}$",
                      "type": "string"
                    },
                    "maxItems": 10,
                    "title": "Title Ids",
                    "type": "array"
                  }
                },
                "required": ["group_id"],
                "title": "GroupContextRequest",
                "type": "object"
              }
            },
