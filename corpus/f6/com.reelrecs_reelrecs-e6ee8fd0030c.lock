        {
          "name": "get_my_ratings",
          "title": "Browse and look up my saved ratings",
          "description": "Use for my ratings, all the movies and shows I rated, understand my taste, what I loved or disliked, and have I rated this title. Omit title_ids to browse the viewer's full rated list, independently of bookmarks. Browse with an optional title fragment, kind, highest/lowest/title sort, and next_offset; up to 50 titles per page. For a requested full-history taste analysis, read all pages and use both high and low ratings with the returned descriptions, genres, subgenres and tags. Curate a few picks using that evidence; personal predictions are secondary when requested. Alternatively supply up to ten resolved title_ids to check saved ratings or confirmed absence for those specific titles. Requires ratings:read. Saved ratings, audience scores and personal predictions are distinct. A successful lookup confirms the connection. Cannot read another account or change ratings.",
          "inputSchema": {
            "properties": {
              "request": {
                "additionalProperties": false,
                "properties": {
                  "kind": {
                    "default": "any",
                    "enum": ["any", "movie", "show"],
                    "title": "Kind",
                    "type": "string"
                  },
                  "limit": {
                    "default": 12,
                    "description": "Rated titles per page. Use up to fifty and follow next_offset for a requested full-history taste analysis.",
                    "maximum": 50,
                    "minimum": 1,
                    "title": "Limit",
                    "type": "integer"
                  },
                  "offset": {
                    "default": 0,
                    "description": "Use next_offset to continue through the rated list.",
                    "minimum": 0,
                    "title": "Offset",
                    "type": "integer"
                  },
                  "query": {
                    "default": "",
                    "description": "Optional title fragment to search across all rated titles when title_ids is empty.",
                    "maxLength": 120,
                    "title": "Query",
                    "type": "string"
                  },
                  "sort": {
                    "default": "title",
                    "description": "Browse alphabetically, highest ratings first, or lowest ratings first. Use both high and low ratings when exploring taste.",
                    "enum": ["title", "highest", "lowest"],
                    "title": "Sort",
                    "type": "string"
                  },
                  "title_ids": {
                    "description": "Optional specific titles to check, including whether they are unrated. Omit to browse the viewer's rated movies and shows without knowing their IDs.",
                    "items": {
                      "pattern": "^tt\\d{5,12}$",
                      "type": "string"
                    },
                    "maxItems": 10,
                    "title": "Title Ids",
                    "type": "array"
                  }
                },
                "title": "RatingsRequest",
                "type": "object"
              }
            },
            "required": ["request"],
