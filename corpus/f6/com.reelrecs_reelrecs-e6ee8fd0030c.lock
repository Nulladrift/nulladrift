                    "items": {
                      "pattern": "^tt\\d{5,12}$",
                      "type": "string"
                    },
                    "maxItems": 100,
                    "title": "Exclude Ids",
                    "type": "array"
                  },
                  "genres": {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 5,
                    "title": "Genres",
