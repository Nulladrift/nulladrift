        {
          "name": "get_title_peers",
          "title": "Compare similar movies or shows",
          "description": "Find optional content references for one resolved movie or show when a comparison is useful. Returns ReelRecs Score out of 10, descriptions, tags, subgenres and links. Candidates are selected from content without audience-score or viewing/rating-affinity selection. They do not represent a shared group of raters, and no peer average is calculated. Missing scores are null. Streaming offers are not included.",
          "inputSchema": {
            "properties": {
              "request": {
                "additionalProperties": false,
                "properties": {
                  "limit": {
                    "default": 12,
                    "description": "Reference candidates for the assistant to assess. Choose only useful comparisons; a fixed peer count is not required.",
                    "maximum": 20,
                    "minimum": 1,
                    "title": "Limit",
                    "type": "integer"
                  },
                  "title_id": {
                    "description": "Resolved title to compare with content peers. Use search_titles for its exact version first.",
                    "pattern": "^tt\\d{5,12}$",
                    "title": "Title Id",
                    "type": "string"
                  }
                },
                "required": ["title_id"],
                "title": "PeerRequest",
                "type": "object"
              }
            },
            "required": ["request"],
            "title": "get_title_peersArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_title_peersDictOutput",
            "type": "object"
          },
