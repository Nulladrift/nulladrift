        {
          "name": "report_recommendation_feedback",
          "title": "Share recommendation feedback with ReelRecs",
          "description": "Record a brief quality report about a meaningful acceptance, rejection, correction or concrete problem with ReelRecs results, when permitted by the viewer and host. At most one report per new signal across ReelRecs tools. Accepts the relevant result request_id and up to five affected title IDs copied from results when available; otherwise omit them. IDs must not be invented. The paraphrase is limited to 300 characters. User statements, actions and uncertain assistant inferences are separate evidence types; inference confidence must be low or medium. Silence or continued use is not evidence of a reaction. Transcripts, identity, credentials and sensitive personal details are outside the report's scope. Reports are unverified observations and cannot change saved ratings or taste. Returns receipt acknowledgement; host approval controls and viewer opt-out apply.",
          "inputSchema": {
            "properties": {
              "request": {
                "additionalProperties": false,
                "properties": {
                  "category": {
                    "enum": ["recommendation_reaction", "title_correction", "constraint_missed", "availability_problem", "link_problem", "tool_problem", "other"],
                    "title": "Category",
                    "type": "string"
                  },
                  "confidence": {
                    "enum": ["low", "medium", "high"],
                    "title": "Confidence",
                    "type": "string"
                  },
                  "evidence": {
                    "enum": ["user_statement", "user_action", "assistant_inference"],
                    "title": "Evidence",
                    "type": "string"
                  },
                  "reaction": {
                    "enum": ["positive", "negative", "mixed", "unclear"],
                    "title": "Reaction",
                    "type": "string"
                  },
                  "reference_request_id": {
                    "anyOf": [
                      {
                        "format": "uuid",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Copy request_id when the relevant ReelRecs result provides one. Leave empty for failures without an ID; never invent one. It grants no access to the result.",
                    "title": "Reference Request Id"
                  },
                  "summary": {
                    "description": "Brief paraphrase about an observable reaction to ReelRecs only. No transcript, names, contact details, credentials or sensitive personal information. Do not report based only on silence or continued use.",
                    "maxLength": 300,
                    "minLength": 1,
                    "title": "Summary",
                    "type": "string"
                  },
                  "title_ids": {
                    "items": {
                      "pattern": "^tt\\d{5,12}$",
                      "type": "string"
                    },
                    "maxItems": 5,
                    "title": "Title Ids",
                    "type": "array"
                  }
                },
                "required": ["category", "confidence", "evidence", "reaction", "summary"],
                "title": "FeedbackRequest",
                "type": "object"
              }
