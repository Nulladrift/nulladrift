        {
          "name": "recommend_for_group",
          "title": "Find something we will enjoy together",
          "description": "Choose what the accepted Watch+ members watching together might enjoy tonight. Resolve the group and people with get_my_watchplus_groups first. Returns up to twelve compact candidates for the assistant to curate into two or three, with rich title details, audience ReelRecs Score, separate per-person Rec Score predictions, saved ratings, Watch+ votes and related likes/dislikes. Prioritizes balanced fit and current interest by default; focus=all_titles explores the library. Pass votes lower priority without changing predictions. Excludes known seen titles unless allow_rewatch. Send mood_preferences when the viewer expresses a feeling; it orders a wider eligible shortlist using stored mood levels. Keep positive/disliked references and streaming filters when known. If you find alternatives through charts, use get_watchplus_context for those titles and the same people before making group picks. Do not demand a questionnaire or conclude the service has nothing from a thin shortlist. Predictions require fresh completed scores; missing coverage never means agreement. Requires watchplus:read and current accepted membership. Privacy and blocks are checked again before returning.",
          "inputSchema": {
            "$defs": {
              "Constraints": {
                "additionalProperties": false,
                "properties": {
                  "country": {
                    "default": "US",
                    "description": "Two-letter availability country, such as US or GB. Use known location; US is the default. Does not establish availability unless providers are also supplied.",
                    "pattern": "^[A-Z]{2}$",
                    "title": "Country",
                    "type": "string"
                  },
                  "exclude_ids": {
                    "description": "Resolved titles to leave out, including a viewer's 'seen it' reaction. Keep earlier constraints when refining. For disliked-title affinities, use avoid_seed_ids on recommend_titles or recommend_for_me instead.",
                    "items": {
                      "pattern": "^tt\\d{5,12}$",
                      "type": "string"
                    },
                    "maxItems": 100,
                    "title": "Exclude Ids",
                    "type": "array"
                  },
                  "genres": {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 5,
                    "title": "Genres",
                    "type": "array"
                  },
                  "kind": {
                    "default": "any",
                    "enum": ["any", "movie", "show"],
                    "title": "Kind",
                    "type": "string"
                  },
                  "languages": {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 5,
                    "title": "Languages",
                    "type": "array"
                  },
                  "max_episode_minutes": {
                    "anyOf": [
                      {
                        "maximum": 600,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Maximum runtime per episode in minutes. Does not describe a whole season or restrict films.",
                    "title": "Max Episode Minutes"
                  },
                  "max_movie_minutes": {
                    "anyOf": [
                      {
                        "maximum": 600,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Maximum film runtime in minutes. Does not restrict series; set kind=movie for a movie-only request.",
                    "title": "Max Movie Minutes"
                  },
                  "offer_types": {
                    "items": {
                      "enum": ["subscription", "free", "ads", "rent", "buy"],
                      "type": "string"
                    },
                    "title": "Offer Types",
                    "type": "array"
                  },
                  "providers": {
                    "description": "Streaming providers to require. Country and offer_types filter availability only when providers are supplied.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 5,
                    "title": "Providers",
                    "type": "array"
                  },
                  "variety": {
                    "default": false,
                    "title": "Variety",
                    "type": "boolean"
                  },
                  "year_from": {
                    "anyOf": [
                      {
                        "maximum": 2100,
                        "minimum": 1870,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Earliest original release year. A series uses its first-release year, not the year of a returning season or addition to a service.",
                    "title": "Year From"
                  },
                  "year_to": {
                    "anyOf": [
                      {
                        "maximum": 2100,
                        "minimum": 1870,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Latest original release year.",
                    "title": "Year To"
                  }
                },
                "title": "Constraints",
                "type": "object"
              }
            },
            "properties": {
              "request": {
                "additionalProperties": false,
                "properties": {
                  "allow_rewatch": {
                    "default": false,
                    "title": "Allow Rewatch",
                    "type": "boolean"
                  },
                  "avoid_seed_ids": {
                    "description": "Titles the viewer disliked. Reduces candidates closer to these than to the positive references. This differs from exclude_ids, which only hides exact titles. Uses exact versions; a title dislike alone does not specify an unwanted theme.",
                    "items": {
                      "pattern": "^tt\\d{5,12}$",
                      "type": "string"
                    },
                    "maxItems": 3,
                    "title": "Avoid Seed Ids",
                    "type": "array"
                  },
                  "constraints": {
                    "$ref": "#/$defs/Constraints"
                  },
                  "focus": {
                    "default": "tonight",
                    "description": "tonight gives current trending choices priority alongside shared taste. all_titles explores the wider library. Explicit title or mood references guide either choice.",
                    "enum": ["tonight", "all_titles"],
                    "title": "Focus",
                    "type": "string"
                  },
                  "group_id": {
                    "description": "Copy a group_id from get_my_watchplus_groups; a group name or an email is not an identifier.",
                    "maxLength": 64,
                    "minLength": 1,
                    "title": "Group Id",
                    "type": "string"
                  },
                  "intent": {
                    "default": "loved",
                    "description": "Evidence emphasis: watched for viewing, loved for ratings, into for topics and mood references. The general title neighborhood is shared. This field does not establish viewer history; qualities express the experience wanted.",
                    "enum": ["watched", "loved", "into"],
                    "title": "Intent",
                    "type": "string"
                  },
                  "limit": {
                    "default": 12,
                    "description": "Candidate shortlist size for the assistant to choose from, not the number to show the viewer. Usually retrieve twelve and present two or three fitting choices.",
                    "maximum": 12,
                    "minimum": 1,
                    "title": "Limit",
                    "type": "integer"
                  },
                  "member_ids": {
                    "description": "Copy member_ids from this group's roster for the people watching now. Empty means everyone, up to eight. Do not infer who is watching from membership alone.",
                    "items": {
                      "pattern": "^wm[1-9]\\d{0,18}$",
                      "type": "string"
                    },
                    "maxItems": 8,
                    "title": "Member Ids",
                    "type": "array"
                  },
                  "mood_preferences": {
                    "additionalProperties": {
                      "enum": ["low", "moderate", "high"],
                      "type": "string"
                    },
                    "description": "Optional soft viewing preferences inferred from what the viewer says, up to four feelings. For cozy and not sad, use calmness=high, warmth=high, sadness=low. Wonder means awe=high; a little tension means tension=moderate. Uses stored mood data without a text encoder. Preserve these through refinement. Do not ask the viewer for scores or infer a required genre. Unknown profiles remain eligible; this is not a content-safety filter or a guarantee.",
                    "maxProperties": 4,
                    "propertyNames": {
                      "enum": ["amusement", "joy", "calmness", "warmth", "hope", "tension", "fear", "sadness", "anger", "disgust", "awkwardness", "awe", "romance", "nostalgia", "poignancy"]
                    },
                    "title": "Mood Preferences",
                    "type": "object"
                  },
                  "qualities": {
                    "default": "",
                    "description": "The experience wanted now: mood, tone, pace, themes and qualities to avoid, in natural language. Preserve refinements such as absorbing but not draining or more playful. This request does not change saved taste.",
                    "maxLength": 300,
                    "title": "Qualities",
                    "type": "string"
                  },
                  "seed_ids": {
                    "description": "Resolved positive reference titles. These can be viewer likes or assistant-chosen examples of a requested mood. A reference alone does not establish that the viewer watched or liked it.",
                    "items": {
                      "pattern": "^tt\\d{5,12}$",
                      "type": "string"
                    },
                    "maxItems": 3,
                    "title": "Seed Ids",
                    "type": "array"
                  },
                  "use_saved_services": {
                    "default": false,
                    "description": "Use only the connected viewer's saved services when no providers are supplied. Does not reveal other members' subscriptions.",
                    "title": "Use Saved Services",
                    "type": "boolean"
                  }
                },
                "required": ["group_id"],
                "title": "GroupRecommendRequest",
                "type": "object"
              }
            },
            "required": ["request"],
            "title": "recommend_for_groupArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "recommend_for_groupDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find something we will enjoy together"
          },
          "behavior": {
