      "instructions": "Pay-per-call web, email, domain, security, code and image tools. Each call costs a fraction of a cent in USDC on Base via x402; a failed call (bad input, site blocked bots) is never charged. Image tools are free with free: \"1\" (lower limits). Pick the tool by job: email_verify before sending email; site_check to judge if a domain is legit; markdown for a page's main content; meta for declared facts (price, rating, dates); diff to watch a page; dns/certs/redirects for infrastructure; robots for crawler rules; rss for latest posts; github_tree before reading a repo; image_upload then image_edit for lossless edits (every edit re-renders from the original).",
