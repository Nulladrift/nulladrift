        {
          "name": "code",
          "title": "Versioned code workspace (never lose work)",
          "description": "Keep a code project (one or many files) with full version history, private to the paying wallet. Every edit (exact find-and-replace, a line range, add or remove a file) makes a new version with a diff; branch from any version. action=store $0.005 up to 1 MB (then $0.005 per MB), kept 30 days, renewable. edit, get, diff, list, delete $0.0025. Store by POST JSON {files: {\"path\": \"content\"}}. Up to 50 MB, 500 files, 500 versions per project. The price depends on the inputs, as described above (USDC on Base, x402); you're only charged when the call succeeds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "store, edit, get, diff, list, renew, or delete",
                "examples": ["list"],
                "type": "string"
              },
              "against": {
                "description": "Version to compare with (diff; default: the version it was based on)",
                "type": "integer"
              },
              "all": {
                "description": "1 = replace every match of find, not just a unique one (edit)",
                "type": "string"
              },
              "bytes": {
                "description": "Project size in bytes (store/renew over 1 MB)",
                "type": "integer"
              },
              "end_line": {
                "description": "Last line to replace (edit by line range)",
                "type": "integer"
              },
              "find": {
                "description": "Exact text to replace (edit)",
                "type": "string"
              },
              "from": {
                "description": "Version to build on (default: latest; 0 = original)",
                "type": "integer"
              },
              "path": {
                "description": "File inside the project (edit, get)",
                "type": "string"
              },
              "project": {
                "description": "project id (everything except store/list)",
                "type": "string"
              },
              "remove": {
                "description": "1 = delete the file at path (edit)",
                "type": "string"
              },
              "replace": {
                "description": "Replacement text (edit)",
                "type": "string"
              },
              "start_line": {
                "description": "First line to replace (edit by line range)",
                "type": "integer"
              },
              "text": {
                "description": "New text for the line range (edit)",
                "type": "string"
              },
              "version": {
                "description": "Version to read (get, diff)",
                "type": "integer"
              }
