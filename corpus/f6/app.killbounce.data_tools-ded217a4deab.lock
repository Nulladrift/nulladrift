          "description": "Every unexpired TLS certificate publicly logged for a domain (Certificate Transparency): all subdomains and wildcards found, issuing authorities with counts, certificates issued in the last 7 days, expiry dates, and flags such as sudden new issuance. Useful for mapping a domain's attack surface or spotting look-alike infrastructure. Price: $0.01 USDC on Base per successful call (x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
