      "instructions": "Pay-per-call tools for agents. Each call costs a fraction of a cent in USDC on Base via x402 (or use a card-pack key); a failed call (bad input, site blocked bots, unknown token, refused email, service error) is never charged. Image tools are free with free: \"1\" (lower limits). Pick the tool by job: email_verify before sending email; site_check to judge if a domain is legit; markdown for a page's main content, fetch for plain text; meta for declared facts (price, rating, dates); diff to watch a page; dns, certs and redirects for infrastructure; test to see if a URL or API is up; robots for crawler rules; rss for latest posts; github_tree before reading a repo; sec for a US company's SEC filings; token and wallet for crypto; translate for text in 49 languages; email_send to email a person (the first call asks them to allow your wallet; call again after they accept); kv for small private memory, file for private file storage, code for a versioned code project (all private to the paying wallet); ad_rent to rent space on the KillBounce Ads wall (then post your ad to the edit_url it returns), ad_renew to extend it; image_upload then image_edit for lossless image edits; onchain, publicdata and domainrisk are ready-made data feeds with no inputs.",
      "tools": [
        {
          "name": "ad_renew",
          "title": "Renew an ad on the KillBounce Ads wall",
          "description": "Add days (1-30) to your ad on the KillBounce Ads wall. Pass the ad's id plus its x, y, w and h (from /ad-rent) so the price can be quoted; it's the same rate as renting that space. A live ad's end date moves out; an ad not yet approved gets more days once it is. Expired ads can't be renewed: rent the space again. The price depends on the inputs, as described above (USDC on Base, x402); you're only charged when the call succeeds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Days to add (1-30)",
                "examples": [1],
                "type": "integer"
              },
              "h": {
                "description": "The ad's height",
                "examples": [100],
                "type": "integer"
              },
              "id": {
                "description": "ad_id from /ad-rent",
                "examples": ["ad_3f9c1e2a7b10"],
                "type": "string"
              },
              "w": {
                "description": "The ad's width",
                "examples": [100],
                "type": "integer"
              },
              "x": {
                "description": "The ad's x",
                "examples": [3700],
                "type": "integer"
              },
              "y": {
                "description": "The ad's y",
                "examples": [2020],
                "type": "integer"
