      "instructions": "Sourcer's Desk: a 20-year recruiter's sourcing playbook,\nas tools. generate_boolean_search turns a role description into\nproduction-grade LinkedIn x-ray and open-web resume search strings —\nexpanded title variants, practitioner \"shibboleth\" skill terms, area-code\nlocation groups, engine word-limit handling. Built by a working recruiter;\nblind-evaluated 10/10 against a bare frontier LLM.\n\nA limited number of free calls are pooled per day across all MCP users.\nBeyond that: the pay-per-call API (x402, ~$0.02/call) or the Sourcer's\nDesk Chrome extension (the full desk: projects, real-format email\ndiscovery, CSV export).",
      "tools": [
        {
