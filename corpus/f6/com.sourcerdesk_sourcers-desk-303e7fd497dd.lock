          "description": "Generate recruiter-grade boolean search strings for a role: LinkedIn x-ray + open-web resume search, with expanded titles and practitioner skill terms from a 20-year sourcing playbook. Takes 1-3 minutes. role_description is required; location is a city/metro.",
