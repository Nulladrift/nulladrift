{
  "lockfileVersion": 2,
  "subjects": {
    "ai.opencurrent/kr-calendar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opencurrent.ai/mcp/kr-calendar"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "kr-calendar",
        "title": "Korea Business Days & Holidays",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Korean public holidays (incl. substitute and election holidays) and business-day math. Coverage 2026-01-01..2027-12-31. Use for deadlines, delivery dates, SLAs and scheduling in Korea. Public holidays (관공서 공휴일) for 2026-2027 from KASI calendar data, plus Labor Day 2026-05-01 (law amended April 2026). Temporary holidays declared later by the government are added when announced. Business days = weekdays that are not public holidays; company-specific days off are not included.",
      "tools": [
        {
          "name": "kr_add_business_days",
          "title": "Add Korean business days",
          "description": "The date that is N business days after (or before, if negative) a date in Korea. The start date itself is not counted. Use for deadlines like 'within 5 business days'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "YYYY-MM-DD (Korea date)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days": {
                "maximum": 500,
                "minimum": -500,
                "type": "integer"
              }
            },
            "required": ["date", "days"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e57618ff6f05646f3c5fc290452d4e10ce906436e85a4de5ddd431e1c401a8d"
        },
        {
          "name": "kr_business_days_between",
          "title": "Count Korean business days",
          "description": "Count business days in Korea between two dates, both inclusive (weekends and public holidays excluded).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "YYYY-MM-DD (Korea date)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD (Korea date)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "businessDays": {
                "type": "number"
              }
            },
            "required": ["businessDays"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1450f377d42fad443c3c438b363a25afe2452bf2ddffa4f1385e0fea89de8132"
        },
        {
          "name": "kr_day_info",
          "title": "Is this a business day in Korea?",
          "description": "For one date in Korea: weekday, weekend, public holiday name (Korean and English), and whether it is a business day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "YYYY-MM-DD (Korea date)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "businessDay": {
                "type": "boolean"
              },
              "date": {
                "type": "string"
              }
            },
            "required": ["businessDay", "date"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b18811a44226f13edd4628d4508d85ef49d579fd9fb06e1d114dfb9058140d8"
        },
        {
          "name": "kr_holidays",
          "title": "Korean public holidays in a range",
          "description": "List Korean public holidays (관공서 공휴일) between two dates, including substitute holidays (대체공휴일).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "YYYY-MM-DD (Korea date)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD (Korea date)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "holidays": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "nameEn": {
                      "type": "string"
                    },
                    "substitute": {
                      "type": "boolean"
                    }
                  },
                  "required": ["date", "name", "nameEn", "substitute"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["holidays"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ab6055ce12d6fc7dd01e1df741ef562e60d6d977fd10252d0314562db86621a"
        }
      ],
      "digest": "sha256:345d9a27711cfdd9a5e70620ea9f1f870affef91583dde28ba572124956554a6"
    }
  }
}
