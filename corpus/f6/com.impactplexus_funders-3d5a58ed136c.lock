              "pagination": {
                "additionalProperties": false,
                "properties": {
                  "has_more": {
                    "type": "boolean"
                  },
                  "page": {
                    "minimum": 1,
                    "type": "integer"
                  },
                  "page_size": {
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["has_more", "page", "page_size"],
                "type": "object"
