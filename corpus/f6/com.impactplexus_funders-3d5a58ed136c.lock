        {
          "name": "funder_profile",
          "title": "Get public funder profile",
          "description": "Return one funder's plain-language profile, computed from active global observations. Each fact carries its public source name and the date it was last verified.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "funder_slug": {
                "description": "Public URL slug from a funder_search result. Not an internal database identifier.",
                "maxLength": 160,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["funder_slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "cause_areas": {
                "items": {
                  "description": "Adding a value is a minor contract change; removing or renaming one is a major change (§38.2).",
                  "enum": ["animal_welfare", "arts_culture", "civil_society", "community_development", "education", "environment", "health", "human_services", "indigenous_community", "philanthropy", "religion", "research_science", "sport_recreation"],
                  "type": "string"
                },
                "type": "array"
              },
              "facts": {
                "items": {
                  "additionalProperties": false,
                  "description": "One plain-language fact with its public source. Never carries a score, tier, confidence or lineage.",
                  "properties": {
                    "last_verified_date": {
                      "format": "date",
                      "type": "string"
                    },
                    "source_name": {
                      "type": "string"
                    },
                    "statement": {
                      "type": "string"
                    }
                  },
                  "required": ["last_verified_date", "source_name", "statement"],
                  "type": "object"
                },
                "type": "array"
              },
              "geography": {
                "type": "string"
              },
              "jurisdiction": {
                "enum": ["CA", "US"],
                "type": "string"
              },
              "last_verified_date": {
                "description": "Most recent verification date across the facts shown.",
                "format": "date",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "region_codes": {
                "items": {
                  "pattern": "^(CA|US)-[A-Z]{2}$",
                  "type": "string"
                },
                "type": "array"
              },
              "size_band": {
                "description": "Average annual giving over the last five reported years, in the funder's reporting currency. small is under 100,000; medium is 100,000 to 1,000,000; large is over 1,000,000; unknown means no public giving figure. Band limits are proposed and must be confirmed before G0 freeze.",
                "enum": ["small", "medium", "large", "unknown"],
                "type": "string"
              },
              "slug": {
                "maxLength": 160,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "source_names": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "description": "Plain-language narrative only.",
                "type": "string"
              },
              "website_url": {
                "description": "The funder's own website, if public.",
                "format": "uri",
                "type": ["string", "null"]
              }
            },
            "required": ["cause_areas", "facts", "geography", "jurisdiction", "last_verified_date", "name", "region_codes", "size_band", "slug", "source_names", "summary", "website_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get public funder profile"
          },
          "behavior": {
            "destructive": false,
