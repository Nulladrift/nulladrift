        {
          "name": "funder_search",
          "title": "Search public funders",
          "description": "Find funders by jurisdiction, cause area, size band and region. Results are ordered by how much each funder has given toward the requested cause and region in its recent public filings: larger, steadier and more widely giving funders first; funders that give mostly to one recipient or to their own related organizations, and donation platforms that pass donors' directed gifts through, come later; ties by name, then slug. This orders public giving records; it is not a fit assessment for any organization. Use the slug of a result with funder_profile to read the full profile.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cause_area": {
                "description": "Canonical cause area. Values match the platform taxonomy (core/cra_to_canonical.py, core/ntee_to_canonical.py).",
                "enum": ["animal_welfare", "arts_culture", "civil_society", "community_development", "education", "environment", "health", "human_services", "indigenous_community", "philanthropy", "religion", "research_science", "sport_recreation"],
                "type": "string"
              },
              "jurisdiction": {
                "description": "Country of operation or grantmaking (CA or US).",
                "enum": ["CA", "US"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 20,
                "description": "Results per page, 1 to 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "region_code": {
                "description": "ISO 3166-2 province or state code, for example CA-ON or US-WA. Matches funders and opportunities that serve that region, including national ones.",
                "pattern": "^(CA|US)-[A-Z]{2}$",
                "type": "string"
              },
              "size_band": {
                "description": "Funder size by average annual giving over the last five reported years. See the SizeBand schema for band limits.",
                "enum": ["small", "medium", "large", "unknown"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cause_areas": {
                      "items": {
                        "description": "Adding a value is a minor contract change; removing or renaming one is a major change (§38.2).",
                        "enum": ["animal_welfare", "arts_culture", "civil_society", "community_development", "education", "environment", "health", "human_services", "indigenous_community", "philanthropy", "religion", "research_science", "sport_recreation"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "geography": {
                      "description": "Plain-language service area for display.",
                      "type": "string"
                    },
                    "jurisdiction": {
                      "enum": ["CA", "US"],
                      "type": "string"
                    },
                    "last_verified_date": {
                      "format": "date",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "region_codes": {
                      "description": "Regions served. Empty means national or not stated.",
                      "items": {
                        "pattern": "^(CA|US)-[A-Z]{2}$",
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "size_band": {
                      "description": "Average annual giving over the last five reported years, in the funder's reporting currency. small is under 100,000; medium is 100,000 to 1,000,000; large is over 1,000,000; unknown means no public giving figure. Band limits are proposed and must be confirmed before G0 freeze.",
                      "enum": ["small", "medium", "large", "unknown"],
                      "type": "string"
                    },
                    "slug": {
                      "maxLength": 160,
                      "minLength": 1,
                      "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                      "type": "string"
                    },
                    "source_names": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "summary": {
                      "description": "Plain-language narrative only.",
                      "type": "string"
