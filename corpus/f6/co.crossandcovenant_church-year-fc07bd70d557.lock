{
  "lockfileVersion": 2,
  "subjects": {
    "co.crossandcovenant/church-year": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://crossandcovenant.co/api/mcp/church-year"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "church-year-cross-covenant",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "The Western church year (seasons, colors, feasts, Easter and Orthodox Pascha) and the Sunday lectionary of the 1979 Book of Common Prayer, with public-domain Bible text. All tools are read-only.",
      "tools": [
        {
          "name": "plan_sermon_series",
          "title": "Plan a sermon series",
          "description": "Lays out a run of Sundays from a start date: each Sunday's name, season, color, lectionary year and appointed readings from the 1979 Book of Common Prayer lectionary, the seasons the run crosses, feasts that fall on those Sundays, and every book read on three or more consecutive Sundays, with the longest such run named as a possible series spine. Rule-based, no generated text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "focus": {
                "description": "Look for the series spine in one reading only: first, second, gospel or psalm.",
                "enum": ["first", "second", "gospel", "psalm"],
                "type": "string"
              },
              "start_date": {
                "description": "First date of the series, YYYY-MM-DD. A weekday starts at the next Sunday.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "weeks": {
                "description": "Number of Sundays, 1 to 26.",
                "maximum": 26,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["start_date", "weeks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan a sermon series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb18586f5e7743290e38aaba044704fe4e37db0e3d86e0dd59dd53330ae4bb01"
        },
        {
          "name": "readings_for_sunday",
          "title": "Readings for a Sunday or feast",
          "description": "Returns the appointed Bible readings (first reading, psalm, second reading, gospel, with the alternatives) for a Sunday or major feast from the three-year Sunday lectionary of the 1979 Book of Common Prayer, which is public domain. Give a date (a weekday without its own lessons moves to the next Sunday) or an occasion such as \"advent-1\", \"proper-23\", \"easter-day\" or \"christmas-day\" with a year of A, B or C. With include_text, adds the passage text from the World English Bible or King James Version, both public domain. Citations only, never another translation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Date in YYYY-MM-DD form. Defaults to the next Sunday, Mountain Time.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include_text": {
                "description": "Also return the text of the first set of readings. Default false.",
                "type": "boolean"
              },
              "occasion": {
                "description": "Lectionary occasion instead of a date, for example \"advent-1\", \"lent-3\", \"proper-12\", \"trinity\", \"all-saints\".",
                "enum": ["advent-1", "advent-2", "advent-3", "advent-4", "christmas-day", "christmas-1", "holy-name", "christmas-2", "epiphany", "epiphany-1", "epiphany-2", "epiphany-3", "epiphany-4", "epiphany-5", "epiphany-6", "epiphany-7", "epiphany-8", "epiphany-last", "ash-wednesday", "lent-1", "lent-2", "lent-3", "lent-4", "lent-5", "palm-sunday", "holy-monday", "holy-tuesday", "holy-wednesday", "maundy-thursday", "good-friday", "holy-saturday", "easter-day", "easter-monday", "easter-tuesday", "easter-wednesday", "easter-thursday", "easter-friday", "easter-saturday", "easter-2", "easter-3", "easter-4", "easter-5", "easter-6", "ascension", "easter-7", "pentecost", "trinity", "proper-1", "proper-2", "proper-3", "proper-4", "proper-5", "proper-6", "proper-7", "proper-8", "proper-9", "proper-10", "proper-11", "proper-12", "proper-13", "proper-14", "proper-15", "proper-16", "proper-17", "proper-18", "proper-19", "proper-20", "proper-21", "proper-22", "proper-23", "proper-24", "proper-25", "proper-26", "proper-27", "proper-28", "proper-29", "st-andrew", "st-thomas", "st-stephen", "st-john", "holy-innocents", "confession-of-st-peter", "conversion-of-st-paul", "presentation", "st-matthias", "st-joseph", "annunciation", "st-mark", "st-philip-and-st-james", "visitation", "st-barnabas", "nativity-of-st-john-the-baptist", "st-peter-and-st-paul", "independence-day", "st-mary-magdalene", "st-james", "transfiguration", "st-mary-the-virgin", "st-bartholomew", "holy-cross", "st-matthew", "st-michael-and-all-angels", "st-luke", "st-james-of-jerusalem", "st-simon-and-st-jude", "all-saints", "thanksgiving"],
                "type": "string"
              },
              "translation": {
                "description": "Translation for the text: \"web\" (World English Bible, default) or \"kjv\".",
                "enum": ["web", "kjv"],
                "type": "string"
              },
              "year": {
                "description": "Lectionary year for an occasion. Defaults to the year now in use.",
                "enum": ["A", "B", "C"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Readings for a Sunday or feast"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33a6518783967796fc945f5e11fcef2567d461a1c2cc21694bc84fa04776a955"
        },
        {
          "name": "season_for_date",
          "title": "Season for a date",
          "description": "Returns where a date falls in the Western church year: the season (Advent, Christmas, Epiphany, Lent, Holy Week, Easter, or the season after Pentecost, also called Ordinary Time), the week of the season, the day's observance and liturgical color, the church year and its lectionary year (A, B or C), and that year's Western Easter and Orthodox Pascha. Defaults to today in Mountain Time.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Date in YYYY-MM-DD form, years 1583 to 4099. Defaults to today in Mountain Time.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Season for a date"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae71f0b147aab1237f700d2f3b0aff5d3a938945f02f1b1524d7f1c8258a2da1"
        },
        {
          "name": "upcoming_feast_days",
          "title": "Upcoming feast days",
          "description": "Lists the dated feasts, fasts and holy days in a window: Ash Wednesday, Holy Week, Easter, Ascension, Pentecost, Trinity, Christ the King, Advent, Christmas, the Epiphany, the feasts of our Lord, apostles and evangelists, with each day's color. Applies the 1979 Book of Common Prayer rules that move a feast off a Sunday or out of Holy Week and Easter Week. Optionally includes Orthodox Pascha, Julian-calendar Christmas and Reformation Day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "description": "Length of the window in days, 1 to 400. Default 60.",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "First date of the window, YYYY-MM-DD. Defaults to today in Mountain Time.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include_other_traditions": {
                "description": "Include Orthodox Pascha, Julian-calendar Christmas and Reformation Day. Default true.",
                "type": "boolean"
              },
              "include_saints_days": {
                "description": "Include apostles', evangelists' and other saints' days. Default true.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Upcoming feast days"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66b2ecc779d1953060894dca247e6cb933e3bb7de4d1b4caed3951399dba1447"
        }
      ],
      "digest": "sha256:37fefe143628d3519b6edd2ed25e6e7d6e04ea053c79e9a5c2327559f780f1cd"
    }
  }
}
