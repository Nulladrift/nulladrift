{
  "lockfileVersion": 2,
  "subjects": {
    "com.agent-manifest/amp-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "sse",
        "url": "https://mcp.agent-manifest.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-manifest-protocol",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "You are connected to the official Agent Manifest Protocol (AMP) MCP server. Use fetch_manifest_by_domain to discover /.well-known/agent-manifest.json (and fallbacks) for any API origin. Use validate_manifest_syntax before trusting manifest JSON. Use check_agent_permissions before calling an API operation to see if it matches declared endpoints, auth, payment, and agent_notes constraints. AMP complements MCP: MCP carries tools; AMP declares what remote agents/APIs allow, cost, and how to authenticate.",
      "tools": [
        {
          "name": "check_agent_permissions",
          "title": "Check action against AMP manifest constraints",
          "description": "Given an intended HTTP action (method + path or full URL) and a manifest, determine whether the action aligns with declared endpoints, authentication, payment onboarding, rate limits, and language in agent_notes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Intended operation, e.g. \"POST /baking/validate-mix\", \"GET /health\", or \"POST https://api.example.com/v1/search\".",
                "minLength": 1,
                "type": "string"
              },
              "intends_unauthenticated": {
                "description": "Set true if the agent plans to call the API without credentials.",
                "type": "boolean"
              },
              "manifest": {
                "additionalProperties": {},
                "description": "Parsed AMP manifest object (agentmanifest-0.2 or agentmanifest-0.3).",
                "type": "object"
              },
              "payment_onboarded": {
                "description": "Set true if AMP payment onboarding is already complete for this API.",
                "type": "boolean"
              }
            },
            "required": ["action", "manifest"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:37316c3713ae31f5ac3e57f9d90e526928bf14656b77b28df95f0625b3a998a0"
        },
        {
          "name": "fetch_manifest_by_domain",
          "title": "Fetch AMP manifest by domain",
          "description": "Resolve an API origin from a domain (e.g. \"bakebase.agent-manifest.com\"), try standard AMP discovery URLs, and return parsed manifest JSON plus metadata.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "API hostname or URL origin without a path, e.g. \"example.com\", \"api.example.com\", or \"https://bakebase.agent-manifest.com\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5f98f0014e034d80c7cc2835cb22c81a30055a74a7c5abec7d09f3cff497a13"
        },
        {
          "name": "validate_manifest_syntax",
          "title": "Validate AMP manifest JSON Schema",
          "description": "Validate a manifest JSON string or object against the official AMP JSON Schema for its spec_version (agentmanifest-0.2 or agentmanifest-0.3). Returns errors or a success_token.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "manifest": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": {},
                    "description": "Parsed AMP manifest object (agentmanifest-0.2 or agentmanifest-0.3).",
                    "type": "object"
                  }
                ],
                "description": "Either a JSON string of the manifest, or a parsed manifest object with spec_version, name, endpoints, etc."
              }
            },
            "required": ["manifest"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b181481b5bf1e1b83f01ccac5be000453259bec3e0a73e8f356d9e0299988dc"
        }
      ],
      "digest": "sha256:8cb335e9bcac04175ad899cadb481b1fc98c924cb84ada71d0f2cfeda34d26cd"
    }
  }
}
