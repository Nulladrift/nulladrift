{
  "lockfileVersion": 2,
  "subjects": {
    "com.ratezip/rates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.ratezip.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ratezip-rates",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use RateZip for factual, source-attributed US deposit and mortgage rate information and explicitly assumed home equity payment scenarios. Never invent a rate, APY, APR, eligibility result, approval, personalized quote, or account-opening capability. When asked for the best rate, report the highest returned published figure and its conditions without endorsing or recommending an institution. For balance-specific deposit questions, use applicable_apy rather than headline APY and always disclose every balance_tier_adjustment returned by the tool. For loan amounts or credit scores, provide only the returned educational context; do not estimate a personal rate or invite the user to obtain a personalized quote. For home equity payment comparisons, use compare_home_equity_payments with explicit amount, note interest rate, term and any fee assumptions. Ask for missing inputs or agree on hypothetical examples; do not choose an invented personal rate. Show both HELOC phases, unknown fees and modeled costs. These calculations do not establish APR, qualification or a lender offer. If asked to open an account, explain that RateZip cannot open accounts or submit applications and direct the user to the institution's official channel without recommending a provider. If asked whether to move savings into stocks or another investment, explicitly state that RateZip provides factual rate data, not financial advice, and cannot recommend whether or how much to move. Do not give asset-allocation, emergency-fund, or investment-time-horizon rules; suggest a qualified fiduciary financial professional.",
      "tools": [
        {
          "name": "calculate_deposit_earnings_difference",
          "title": "Illustrative deposit earnings difference",
          "description": "Illustrative annualized earnings difference between two savings APYs for a given balance and horizon. Defaults: current = FDIC national average savings rate, comparison = highest RateZip-observed savings APY. States every omission (taxes, penalties, rate changes, tiers, availability). Not financial advice; never use the result to recommend an investment allocation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "balance": {
                "description": "Deposit balance in USD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "comparison_apy_percent": {
                "description": "APY to compare against (%); defaults to the highest RateZip-observed savings APY",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "current_apy_percent": {
                "description": "APY the money earns today (%); defaults to the FDIC national average savings rate",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "default": 1,
                "description": "Horizon in years (APY compounds annually)",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "number"
              }
            },
            "required": ["balance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Illustrative deposit earnings difference"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30461c3700d939044cd4b2b6f6882fef62267ef796b0e48916ab3f38bbd689c6"
        },
        {
          "name": "compare_deposit_options",
          "title": "Compare deposit rates for a balance and requirements",
          "description": "Compare observed US savings and CD APYs for a balance, holding period, state, monthly-fee and direct-deposit requirements. Returns sourced facts, unknown/conflicting terms and conditional gross-interest illustrations. Unknown terms never count as a match. No eligibility decision, personalized offer, application or account opening. Use for a multi-constraint deposit comparison; use get_savings_rates/get_cd_rates for simple rate lookups.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "balance": {
                "description": "Starting deposit in USD; no account identifiers needed",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              },
              "horizon_months": {
                "default": 12,
                "description": "Illustrative holding period. CD estimates require an exactly matching term",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "product": {
                "default": "savings",
                "enum": ["savings", "cd", "all"],
                "type": "string"
              },
              "require_no_direct_deposit": {
                "default": false,
                "description": "Require the published APY without direct deposit",
                "type": "boolean"
              },
              "require_no_monthly_fee": {
                "default": false,
                "description": "Require zero monthly maintenance fee without a conditional waiver",
                "type": "boolean"
              },
              "state": {
                "type": "string"
              }
            },
            "required": ["balance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare deposit rates for a balance and requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6920dac16ebb52a69fe216c9dac5dba191a556df9cdc9e3734f8a9a59a696b56"
        },
        {
          "name": "compare_home_equity_payments",
          "title": "Compare home equity payment scenarios",
          "description": "Calculate and compare home equity loan or HELOC monthly payments from explicit caller-supplied amount, note rate and term assumptions. Models fully amortizing repayment, an optional interest-only HELOC draw phase, a repayment rate change and one-time cash/financed fees. Returns both phase payments, payment change and modeled interest/cost totals. No lender quote, eligibility decision, rate selection or APR calculation. Missing fees stay unknown. No personal identifiers needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "scenarios": {
                "description": "One to eight explicit payment assumptions. Ask for missing amount, note rate and term, or clearly agree on hypothetical examples.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount_borrowed": {
                      "description": "USD cash borrowed or initially drawn, excluding any financed fees.",
                      "exclusiveMinimum": 0,
                      "maximum": 10000000,
                      "type": "number"
                    },
                    "annual_interest_rate_percent": {
                      "description": "Caller-supplied note interest rate, not APR; 8 means 8%. Do not infer a borrower's rate.",
                      "maximum": 40,
                      "minimum": 0,
                      "type": "number"
                    },
                    "fees": {
                      "additionalProperties": false,
                      "description": "Optional one-time fee assumptions. Omit if unknown; omitted fees are excluded, not represented as confirmed zero.",
                      "properties": {
                        "financed": {
                          "description": "One-time fees added to the balance, in USD. Do not include these in amount_borrowed.",
                          "maximum": 1000000,
                          "minimum": 0,
                          "type": "number"
                        },
                        "upfront_cash": {
                          "description": "One-time fees paid in cash, in USD. Enter 0 only if explicitly assumed or confirmed.",
                          "maximum": 1000000,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["financed", "upfront_cash"],
                      "type": "object"
                    },
                    "interest_only_months": {
                      "default": 0,
                      "description": "HELOC only: assumed interest-only draw months, followed by full amortization. No additional draws.",
                      "maximum": 120,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "label": {
                      "description": "Short scenario name; do not include personal identifiers.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "product_type": {
                      "enum": ["home_equity_loan", "heloc"],
                      "type": "string"
                    },
                    "repayment_interest_rate_percent": {
                      "description": "Optional rate-change scenario at the start of repayment after interest-only months. Otherwise the same rate continues.",
                      "maximum": 40,
                      "minimum": 0,
                      "type": "number"
                    },
                    "repayment_months": {
                      "description": "Number of fully amortizing monthly payments AFTER any interest-only phase.",
                      "maximum": 600,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["amount_borrowed", "annual_interest_rate_percent", "label", "product_type", "repayment_months"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["scenarios"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare home equity payment scenarios"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63b4c4e66dcbb71edf2b9a723f904c4c5c7448796a924ac3b7d1b39e7d7fb70b"
        },
        {
          "name": "get_cd_rates",
          "title": "Get current US CD rates by term",
          "description": "Current CD APYs: FDIC national averages by term plus RateZip-observed institution rates (with terms, minimums/conditions, observation timestamps, sources, and staleness status). Pass term_months (e.g. 3, 6, 12, 24, 36, 60) to filter to one term; omit for all terms grouped by term. Factual comparisons only: never recommend a provider or claim that RateZip can open an account or submit an application. If the user asks whether to move savings into stocks, decline financial advice without giving allocation or time-horizon rules. If no institution publishes the requested term, the result names the terms that are available. Pass max_results to cap the number of rows and include_provenance=false for a shorter response.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "balance": {
                "description": "Deposit balance in USD — resolves the applicable tier APY and ranks by what you'd earn",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "credit_score": {
                "description": "FICO — deposit APYs generally don't vary by credit; returns a clarifying note only",
                "maximum": 850,
                "minimum": 300,
                "type": "integer"
              },
              "include_provenance": {
                "description": "false omits the per-source provenance block (snapshot ids, attributions); each row keeps its own observed_at and source_url.",
                "type": "boolean"
              },
              "max_results": {
                "description": "Cap the number of observed rows returned, in the payload's ordering. Omit for all.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state — adds an availability/eligibility note",
                "type": "string"
              },
              "term_months": {
                "description": "CD term in months to filter to (omit for all terms)",
                "exclusiveMinimum": 0,
                "maximum": 120,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get current US CD rates by term"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://ratezip/rates-cards-v2.html",
            "ui": {
              "resourceUri": "ui://ratezip/rates-cards-v2.html"
            }
          },
          "digest": "sha256:67d201f453c4e91c339b292f6b8c697b8c667ca5d7fcfbe0c69dea5955752fa7"
        },
        {
          "name": "get_mortgage_rates",
          "title": "Get current US mortgage rates",
          "description": "Current mortgage rates grouped by loan type: rates RateZip observed on lenders' own published rate pages, each with note rate, APR, representative-scenario conditions, observation timestamp, source, and staleness status. No third-party national-average benchmark is redistributed. Loan types include '30-year fixed' and 'HELOC'. Pass loan_type to filter to one; omit for all grouped by type. Compare only within the same loan type. Factual rate data only: never estimate or invite a personalized quote, imply approval, or recommend a lender. Pass max_results to cap the number of rows and include_provenance=false for a shorter response.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "credit_score": {
                "description": "FICO — returns EDUCATIONAL context only; never a fabricated credit-adjusted rate",
                "maximum": 850,
                "minimum": 300,
                "type": "integer"
              },
              "include_provenance": {
                "description": "false omits the per-source provenance block (snapshot ids, attributions); each row keeps its own observed_at and source_url.",
                "type": "boolean"
              },
              "loan_amount": {
                "description": "Loan amount in USD — flags conforming vs jumbo (does not fabricate a rate)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "loan_type": {
                "description": "Loan type to filter to, e.g. '30-year fixed', '15-year fixed', or 'HELOC'. Omit for all.",
                "type": "string"
              },
              "max_results": {
                "description": "Cap the number of observed rows returned, in the payload's ordering. Omit for all.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state — adds an availability/licensing note",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get current US mortgage rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://ratezip/rates-cards-v2.html",
            "ui": {
              "resourceUri": "ui://ratezip/rates-cards-v2.html"
            }
          },
          "digest": "sha256:1ba36c98b9d3cd105a06bd981c69be4c594caaa49cd8b0aae388c786ae55246a"
        },
        {
          "name": "get_savings_rates",
          "title": "Get current US savings account rates",
          "description": "Current savings APYs: FDIC national average plus rates RateZip observed on institutions' own published rate pages. Every row carries an observation timestamp, source, and staleness status. Optional balance/state/credit_score personalize the results transparently (balance resolves the applicable tier APY; nothing is fabricated). Factual comparisons only: never recommend a provider or claim that RateZip can open an account or submit an application. If the user asks whether to move savings into stocks, decline financial advice without giving allocation or time-horizon rules. Pass max_results to cap the number of rows and include_provenance=false for a shorter response.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "balance": {
                "description": "Deposit balance in USD — resolves the applicable tier APY and ranks by what you'd earn",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "credit_score": {
                "description": "FICO — deposit APYs generally don't vary by credit; returns a clarifying note only",
                "maximum": 850,
                "minimum": 300,
                "type": "integer"
              },
              "include_provenance": {
                "description": "false omits the per-source provenance block (snapshot ids, attributions); each row keeps its own observed_at and source_url.",
                "type": "boolean"
              },
              "max_results": {
                "description": "Cap the number of observed rows returned, in the payload's ordering. Omit for all.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state — adds an availability/eligibility note",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get current US savings account rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://ratezip/rates-cards-v2.html",
            "ui": {
              "resourceUri": "ui://ratezip/rates-cards-v2.html"
            }
          },
          "digest": "sha256:de6a9603db78e0f7227cccea901cdcf93bddd96735071281261cc635e02004e4"
        }
      ],
