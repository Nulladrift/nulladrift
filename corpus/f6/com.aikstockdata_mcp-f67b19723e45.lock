      "instructions": "★What this server serves: post-filing price paths BY DISCLOSURE TYPE — market-adjusted median return at h0/h1/h5 with 95% CI and up-ratio, plus the underlying per-event ledger (2,937 events with receipt timestamp and session), with no sign-up or API key. Ask it things like \"공급계약 공시 다음날 주가는 보통 어땠나\" via get_disclosure_impact. When a 95% CI includes zero the response says so — that means 'not distinguishable', not 'no effect'. h20 (+20 trading days) appears per type once that type has enough samples — read h20_status in disclosure_impact.json rather than assuming; missing is not the same as zero. | ★이 서버가 주는 것: 공시 유형별 이후 주가 경로(시장조정 중앙값 h0/h1/h5·CI95·상승확률)와 그 근거가 되는 이벤트 원장 2,937건(접수 시각·세션 포함) — 가입·API 키 없이. | Korean stock data from aikstockdata.com (한국주식데이터): DART disclosures in easy language, Financial Services Commission (금융위) T+1 confirmed closing prices, and machine-computed rankings for KOSPI·KOSDAQ·KONEX. Refreshed every trading day around 18:30 KST (the run starts at 18:10). No auth, no API key. Derived from Korean government open data (DART, FSC). Non-commercial use with attribution; commercial redistribution is not permitted. Market prices are also subject to the FSC source licence (KOGL Type 4). All data is a dated snapshot, not real-time — always read the '기준일' (as-of date) in every tool response. A value of null means 'not provided' and is different from 0. Rankings are mechanical calculations from public financials, not stock picks. This server provides information only; it is not investment advice. IMPORTANT — the tool list is NOT the extent of the data. Preliminary quarterly earnings (filed ~2 weeks before the regular report), an accumulating daily price history per stock (one row added every trading day, never truncated), PER(TTM) and PBR computed from public filings (valuation in /data/public/s/{code}.json, pe_ttm/pb in screen.json; only consensus-based forward PER is absent), post-filing price paths by filing type, and an intraday (15:00 KST) disclosure list with receipt timestamps are all available. Call get_data_urls() before concluding that something is unavailable. | ★도구 목록이 데이터의 전부가 아닙니다. 잠정실적·PER(TTM)·PBR·종목별 일별 시계열·공시 유형별 이후 주가·장중 공시(접수 시각)가 모두 있습니다. '없다'고 결론내기 전에 get_data_urls() 를 부르세요. | Fair use: this data changes once per trading day (around 18:30 KST) — polling faster than that returns the same values, it doesn't get you fresher ones. | 공정 이용: 이 데이터는 매 거래일 18:30 전후 한 번만 바뀝니다 — 그보다 자주 불러도 같은 값이 돌아올 뿐 새 값을 안 줍니다. | 이 데이터에 **없는 것**: 선행PER(컨센서스) · 업종 · 투자의견 · 목표가 · 실시간가 · 투자자별 수급(외국인·기관·개인 순매수) · 분봉·틱 · 배당 · 재무상태표(자산·부채) (이유는 index.json 의 quality.not_included_reasons). Not in this dataset — do not answer as if it were.",
      "tools": [
        {
          "name": "get_data_urls",
          "title": "공개 데이터 URL (Open data URLs)",
          "description": "Direct URLs for every public dataset (JSON/CSV) — no signup, no API key. Call this BEFORE concluding something is unavailable: the tool list is not the extent of the data. Returns the endpoint catalog (quotes, disclosures, rankings, per-stock JSON, search index) plus the 30-trading-day dated archive with the exact dates held per pattern. Most AI fetch tools cut responses near 150 KB and a truncated JSON is unparseable — the catalog names a smaller alternative for every large file, so read that instead of guessing. | 전체 공개 데이터(JSON·CSV) 직링크 카탈로그 — 무가입·무키. **없다고 결론내기 전에 먼저 부르세요**: 도구 목록이 데이터의 전부가 아닙니다. 최근 30영업일 날짜별 아카이브(패턴별 보유 날짜 포함)도 함께 냅니다. 대부분의 AI 가 응답을 150KB 안팎에서 자르고 잘린 JSON 은 파싱되지 않습니다 — 큰 파일마다 소형 대체본이 카탈로그에 적혀 있으니 그쪽을 쓰세요.",
          "inputSchema": {
