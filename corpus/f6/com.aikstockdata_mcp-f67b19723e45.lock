        {
          "name": "get_history",
          "title": "종목 일별 시세 (Daily price history)",
          "description": "Answers \"is this stock near its high or deep in a drawdown, and is volume unusual?\" — the stock's accumulated daily CLOSES, plus period high/low, drawdown from the high, and volume vs the 60-day average. Close-based (this history file carries daily closes only; the latest day's high/low is in the stock file), so it will differ from an HTS 52-week range. | \"전 구간 고점 대비 얼마나 빠졌나·거래량이 평소보다 많나\"에 답합니다 — 보유 구간 전체의 **종가 기준** 고저·낙폭·거래량 배수. 장중 고저가 아니라 HTS 52주 범위와 다를 수 있습니다.",
