        {
          "name": "get_disclosure_impact",
          "title": "공시 유형별 이후 주가 (Post-filing price path)",
          "description": "Answers \"what usually happened after this kind of filing?\" — median MARKET-ADJUSTED return at +1/+5/+20 trading days per DART filing type (+20 only where that type has enough samples — see h20_status), with 95% intervals, sample window and n. A historical record, not a forecast. Coverage: every listed stock in the FSC price feed (no ETFs/ETNs); markets and counts are in index.json coverage and in each response footer. | \"이 공시 나오면 보통 어땠나\"에 답합니다 — 공시 유형별로 접수 이후 1·5·20거래일 뒤까지(20거래일은 표본이 찬 유형만) 시장 등락을 뺀 수익률 중앙값·95% 구간·표본기간. 과거 기록이며 예측·추천이 아닙니다.",
          "inputSchema": {
            "properties": {
              "label": {
                "description": "filing type in Korean, e.g. 배당 결정 | 공시 유형(선택)",
