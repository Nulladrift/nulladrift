        },
        {
          "name": "get_disclosures",
          "title": "공시 목록 (Disclosures with receipt times)",
          "description": "Answers \"what was filed, and when exactly?\" — DART filings with RECEIPT TIME (HH:MM) and session (pre-open / intraday / after-close), filterable by date, type and importance. OpenDART's filing-list API returns the receipt date only; we add the HH:MM. About half of tracked filings arrive AFTER the close (daily counts: /data/public/press_owl_filings.csv), so that day's price move is not a reaction to them. date=today serves the 15:00 intraday collection (no importance scores yet); any other date serves the ranked list of the last 7 days. | \"무슨 공시가 몇 시에 났나\"에 답합니다 — 접수 시각(HH:MM)과 장 구분까지. 공개 공시 목록 API(OpenDART)는 접수 날짜까지만 줍니다 — 시:분은 저희가 모읍니다. 날짜·유형·중요도로 거를 수 있습니다. 추적 유형 기준 **절반 안팎이 장 마감 후** 접수라(날짜별은 press_owl_filings.csv) 그날 등락은 그 공시의 반응이 아닙니다. date=오늘이면 15:00 장중 수집본(아직 중요도 점수 없음), 다른 날짜면 최근 7일 상위 목록입니다.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYYMMDD (예: 20260910). \"today\" 도 받습니다 — 오늘(KST)로 풀어 장중 수집본을 줍니다. 생략하면 최근 7일 중요도 상위 목록입니다. | YYYYMMDD, or \"today\" for the intraday snapshot; omit for the last 7 days by importance.",
                "type": "string"
              },
              "include_unlisted": {
                "description": "장중 수집본에서 비상장 법인·우리가 발행하지 않는 종목의 공시(채권 신고서 등)까지 볼지. 기본 false — 상장 종목(in_universe)만. | include filings of unlisted issuers in the intraday snapshot (default false)",
                "type": "boolean"
