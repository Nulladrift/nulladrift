          "title": "실적 캘린더 (Earnings calendar & new filings)",
          "description": "Answers \"who has filed this quarter's results, who hasn't, and what came in since last time?\" — filed / not-yet lists against the statutory deadline, plus a diff of filings new since the previous publish. Built for stateless agents: polling this replaces a webhook. | \"누가 냈고 누가 아직인가 · 지난번 이후 새로 뜬 건 뭔가\"에 답합니다. 법정 마감 D-day 와 직전 발행 대비 신규 목록까지. 상태를 못 들고 다니는 에이전트를 위한 도구입니다.",
