              "limit": {
                "description": "Default 25, max 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "line_id": {
                "description": "From get_answering_line.",
                "maxLength": 64,
                "type": "string"
              }
            },
