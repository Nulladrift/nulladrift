      "serverInfo": {
        "name": "odile",
        "title": "Odile answering lines: a phone line that answers for your app",
        "version": "0.7.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Odile answering lines give an app or a business a phone line that answers: a phone assistant picks up the calls forwarded from the business's own number, takes messages and bookings, and tells the owner. try_answering_line creates a free test line to hear it; get_answering_line_offer reads the packs and billing rules; set_up_answering_line starts a real line, which is built once the owner pays on Stripe's page; get_answering_line lists the owner's lines, and get_line_calls and get_line_messages read what each line took; get_sip_address connects a phone system over SIP; buy_pack tops up a line that already exists; get_receptionist_benchmark reads Odile Labs' published test calls of AI phone answering products. Pausing, editing or closing a line happens in the owner console at https://odilelabs.com/owner. This endpoint carries only the answering-line tools: Odile Direct is at https://odilelabs.com/mcp/direct and every Odile tool is at https://odilelabs.com/mcp.",
      "tools": [
        {
          "name": "buy_pack",
          "title": "Checkout link for Formats credits, meeting minutes, phone minutes, resolved conversations, Plate API photos or legacy calls",
          "description": "Returns a one-time Stripe checkout link for a prepaid pack, to top up something that already exists; to start a new answering line use set_up_answering_line. The customer opens the link and pays on Stripe's own page, and this connection never sees the card. Only call it when the customer asked to buy, and tell them the price first. product picks what is bought: 'line_minutes' (phone minutes for an After Hours line; line_id required; min40: 40 minutes for $10; min200: 200 minutes for $50), 'line_outcomes' (resolved conversations for an outcome line; line_id required; out50: 50 resolved conversations for $24.50; out200: 200 resolved conversations for $98), 'direct' (Direct credits: direct100c, direct1000, direct10000), 'formats' (Odile Formats credits: small, medium, large), 'photos' (Plate API photo credits: starter: 1000 photos for $10; growth: 5000 photos for $45; scale: 20000 photos for $160), 'minutes' (meeting minutes, only where Meeting Notes is on) or 'calls' (legacy per-call lines only; line_id required). For line products the pack must match the line's billing_mode. What was paid is added within a minute of payment, whatever device paid it. Nothing renews. Needs a signed-in connection with the billing:checkout permission; rate limited per account. Returns { checkout_url, product, pack, price_cents, units, unit, then }.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "line_id": {
                "description": "For product 'calls', 'line_minutes' or 'line_outcomes': the line_id from get_answering_line.",
                "maxLength": 64,
                "type": "string"
              },
              "pack": {
                "description": "The pack id: formats small | medium | large; minutes m200 | m600 | m2000; calls calls10 | calls50; phone minutes min40 | min200; outcomes out50 | out200; photos starter | growth | scale; direct direct100c | direct1000 | direct10000.",
                "maxLength": 20,
                "type": "string"
              },
              "product": {
                "description": "'formats' credits, meeting 'minutes', phone 'line_minutes', resolved 'line_outcomes', Plate API 'photos', legacy answered 'calls' or 'direct' Direct credits.",
                "enum": ["formats", "minutes", "calls", "line_minutes", "line_outcomes", "photos", "direct"],
                "type": "string"
              }
            },
            "required": ["pack", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
