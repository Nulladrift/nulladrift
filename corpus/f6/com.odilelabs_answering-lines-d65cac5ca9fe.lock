          "digest": "sha256:cc00972871ae6854f2b311104d9cd43aa36f80aba643b97d44b956d93eff9760"
        },
        {
          "name": "try_answering_line",
          "title": "Try an answering line free: a test number and code",
          "description": "Create a test call so you can hear an After Hours answering line before anything is set up: it returns a shared test phone number and a 4-digit code (valid 24 hours, up to 5 calls). Calling the number and keying the code reaches a phone assistant answering as the business you describe, and hear_url plays the same assistant in a browser. Nothing is booked, sent or charged on a test line, and it is not a real line: for one on the business's own number use set_up_answering_line. business_name and trade are required; trade sets what the assistant knows to ask, and area, hours, services and timezone shape what it says. Needs a signed-in account (any permissions); limited to 3 test lines a day per account, and rate limited. Returns { sandbox, test_number, test_number_e164, test_code, hear_url, expires_at, calls_allowed, how }.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "area": {
                "description": "Town or area, e.g. \"Wellington, FL\".",
                "maxLength": 100,
                "type": "string"
              },
              "business_name": {
                "description": "The name the receptionist answers as, e.g. \"Alvarez Plumbing\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "hours": {
                "description": "Opening hours in words, e.g. \"Mon-Fri 8 AM to 5 PM, closed weekends\".",
                "maxLength": 400,
                "type": "string"
              },
              "services": {
                "description": "Services, e.g. [\"drain cleaning\", \"water heaters\"].",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "timezone": {
                "description": "IANA timezone, default America/New_York.",
                "maxLength": 80,
                "type": "string"
              },
              "trade": {
                "description": "The kind of business; it sets what the receptionist knows to ask.",
                "enum": ["vet", "garage", "lock", "hvac", "plumbing", "roofing", "electrical", "pest", "appliance", "bail", "hotel"],
                "type": "string"
              }
            },
            "required": ["business_name", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
