      "serverInfo": {
        "name": "odile",
        "title": "Odile answering lines: a phone line that answers for your app",
        "version": "0.7.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Odile answering lines give an app or a business a phone line that answers: a phone assistant picks up the calls forwarded from the business's own number, takes messages and bookings, and tells the owner. Call (561) 375-2995 to hear the receptionist. get_answering_line_offer reads the packs and billing rules; set_up_answering_line starts a real line, which is built once the owner pays on Stripe's page; get_answering_line lists the owner's lines, and get_line_calls and get_line_messages read what each line took; get_line_call_transcript reads one owned call and returns a private expiring listen link when available; update_answering_line saves the supported owner settings; create_sip_address creates or retrieves private SIP credentials; buy_line_pack tops up an existing line. get_receptionist_benchmark reads Odile Labs' published test calls of AI phone answering products. pause_answering_line and resume_answering_line keep the prepaid balance and number. close_answering_line ends answering and keeps the unused balance recorded; use the owner console at https://odilelabs.com/owner for other settings and billing. This endpoint carries only the answering-line tools: Odile Direct is at https://odilelabs.com/mcp/direct and every Odile tool is at https://odilelabs.com/mcp.",
      "tools": [
        {
          "name": "buy_line_pack",
          "title": "Top up an existing answering line",
          "description": "Return a checkout link to top up one existing answering line with a prepaid pack. Use only after the owner asks to buy and approves the price from get_answering_line_offer; get_answering_line supplies line_id and billing_mode. Choose line_minutes, line_outcomes or legacy calls to match that line. For a new line use set_up_answering_line; other products use their own product endpoint. The owner pays on Stripe; this tool never sees a card or charges it directly. Needs billing:checkout and ownership of the line; rate limited per account. Returns checkout_url, product, pack, price_cents, units, unit and payment instructions. Nothing renews.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "line_id": {
                "description": "An existing line_id from get_answering_line owned by this account.",
                "maxLength": 64,
                "type": "string"
              },
              "pack": {
                "description": "Pack id from get_answering_line_offer; legacy calls use calls10 or calls50.",
                "maxLength": 20,
                "type": "string"
              },
              "product": {
                "description": "Match billing_mode: minutes → line_minutes, outcomes → line_outcomes, legacy calls → calls.",
                "enum": ["line_minutes", "line_outcomes", "calls"],
                "type": "string"
              }
            },
            "required": ["line_id", "pack", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1014a1ef92bf6bfefd671060f23f46993e7ac8020347d7ab128802eaacd1819b"
        },
        {
          "name": "close_answering_line",
          "title": "Close your prepaid answering line",
          "description": "End answering on a prepaid phone line you own. This is permanent through these controls: ask hello@odilelabs.com about reopening or the unused balance, which stays recorded without a charge, refund or forfeiture. Use line_id and the phone number from get_answering_line, then require the owner’s approval, confirm: true and its last four digits. The existing carrier close operation redirects the number to a no-longer-in-service message, clears its fallback and SMS URLs and closes its SIP address; the number is kept, never released. Calls still reaching this Worker hear “This line is closed.” on carrier routes and cannot start AI or use balance. One owner email is queued with the surface and time; no text is sent. Already closed returns already; setting-up, agency and subscription lines are refused with their management path. SIP-only lines without a phone number need support. Requires lines:manage; the same lease, fresh ownership check and account/line rate limits as pause_answering_line. Returns status, closed_at, balance_kept, already, email_queued and any warning.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirm": {
                "const": true,
                "description": "The owner explicitly approved permanently ending answering and keeping the unused balance recorded.",
                "type": "boolean"
              },
              "last4": {
                "description": "The last four digits of this answering line’s phone number, not the owner’s mobile.",
                "pattern": "^\\d{4}$",
                "type": "string"
              },
              "line_id": {
                "description": "An owned line_id from get_answering_line.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["confirm", "last4", "line_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bba8fb8448e7fa286212227380806aa20faca18aa049381397ee69fda3bed52c"
        },
        {
          "name": "create_sip_address",
          "title": "Create or retrieve an answering-line SIP address",
          "description": "Create (first call) or read the SIP address and private trunk credentials for one of the signed-in owner's answering lines, so the owner's phone system can send calls to the line over SIP, with no phone number, instead of forwarding a number. For the line's number and forwarding codes use get_answering_line. Pass the line_id from get_answering_line; a line that is still being set up returns an error. Returns { alias, sip_uri, sip_uri_tls, username, password }; keep the username and password private. The address is created once and repeat calls return the same one. SIP calls use the line's normal balance with no separate SIP charge. Needs lines:manage; rate limited per account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "line_id": {
                "description": "From get_answering_line.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["line_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
