        {
          "name": "get_answering_line_offer",
          "title": "After Hours answering line, prepaid minutes or resolved conversations: the offer",
          "description": "Read the available answering-line packs and billing rules before choosing a purchase. Use set_up_answering_line for the first pack and a new line, or buy_line_pack to top up an existing line. This is public product information, not your own balance or status (get_answering_line); takes no arguments, changes nothing and contacts no business. Returns minute/outcome packs, billing rules, zero-balance rules, supported countries and terms_url from the same tables as checkout.",
