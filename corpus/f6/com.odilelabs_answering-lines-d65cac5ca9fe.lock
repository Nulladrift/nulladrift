        {
          "name": "set_up_answering_line",
          "title": "Set up an After Hours answering line (prepaid minutes or resolved conversations)",
          "description": "Start a new answering line by returning the first-pack checkout link; the line is built only after the owner pays. Nothing is built or bought until the owner pays: this returns a Stripe checkout link for the first pack, and once it is paid the line is set up automatically and its number and forwarding codes are emailed to the account's address. Only call it after showing the owner https://odilelabs.com/terms and getting a yes (owner_confirmed_terms true). The packs and billing rules are in get_answering_line_offer; a line that already exists is read with get_answering_line and topped up with buy_line_pack (product 'line_minutes' or 'line_outcomes', matching its billing_mode), not set up twice. United States only: business_phone and owner_mobile take any common US format with the area code and are stored as E.164, and Canadian area codes are refused. hours keys are day names (Monday, monday or mon); a day left out is closed, and omitting hours means Monday to Friday, 9 to 5. Messages reach the owner by email and the owner console; texts stay off until the owner switches them on there. Needs a signed-in connection with the lines:manage permission; limited to 3 set-ups a day per account, and rate limited. Returns { setup_id, status: 'awaiting payment', business_name, business_phone, pack, billing_mode, minutes or outcomes, price_cents, checkout_url, then }.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_name": {
                "description": "The business name callers should hear, e.g. \"Alvarez Plumbing\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "business_phone": {
                "description": "The business number callers dial today (US, with area code, any common format such as (561) 555-0123). The owner forwards it to the new line.",
                "maxLength": 40,
                "type": "string"
              },
              "city": {
                "description": "The town the business is in, e.g. \"Wellington, FL\". The receptionist says it when a caller asks where you are.",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Only US for now.",
                "enum": ["US"],
                "type": "string"
              },
              "description": {
                "description": "What the business does, in one line; this is what it tells callers.",
                "maxLength": 300,
                "type": "string"
              },
              "extra": {
                "description": "Anything else the receptionist should know.",
                "maxLength": 600,
                "type": "string"
              },
              "hours": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "properties": {
                        "close": {
                          "maxLength": 12,
                          "type": "string"
                        },
                        "open": {
                          "maxLength": 12,
                          "type": "string"
                        }
                      },
                      "required": ["close", "open"],
                      "type": "object"
                    },
                    {
                      "const": "closed",
                      "type": "string"
                    }
                  ]
                },
                "description": "Opening hours by day name, e.g. {\"Monday\": {\"open\": \"8:00 AM\", \"close\": \"5:00 PM\"}, \"Sunday\": \"closed\"}. A day left out is closed. Omit entirely for Monday to Friday, 9 to 5.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "languages": {
                "description": "Languages besides English the receptionist switches to when a caller does.",
                "items": {
                  "enum": ["es", "pt", "fr", "tr", "ru", "de"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "owner_confirmed_terms": {
                "description": "true ONLY after you showed the owner https://odilelabs.com/terms and they said yes. Anything else is refused.",
                "type": "boolean"
              },
              "owner_mobile": {
                "description": "The owner's own mobile (US, with area code): their calls to the line are never charged.",
                "maxLength": 40,
                "type": "string"
              },
              "pack": {
                "description": "The first pack: min40: 40 minutes; min200: 200 minutes; out50: 50 resolved conversations; out200: 200 resolved conversations. Amounts and billing rules: get_answering_line_offer.",
                "enum": ["min40", "min200", "out50", "out200"],
                "type": "string"
              },
              "services": {
                "description": "Up to 12 services, e.g. [\"drain cleaning\", \"water heaters\"].",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "tz": {
                "description": "IANA time zone for opening hours. If omitted, inferred from the business phone area code when unambiguous.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["business_name", "business_phone", "owner_confirmed_terms", "owner_mobile", "pack"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
