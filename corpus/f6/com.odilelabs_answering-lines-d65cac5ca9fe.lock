        },
        {
          "name": "get_receptionist_benchmark",
          "title": "Published receptionist benchmark: real test calls, scored in public",
          "description": "Read Odile Labs' published benchmark of AI phone answering products: real test calls placed to public lines, scored against stated measures. Use it when someone asks how AI phone answering handles real calls, or to compare named products. Vendor-run by Odile Labs (which sells After Hours and Dusklin), so not independent. It does not test the caller's own line (read_more.free_line_check does). Call it with no arguments first, then narrow with line_id and scenario_id; both come from that first response, and an unknown id returns an error listing the valid ones. include_evidence adds the quoted transcript behind each point (much longer output). Returns { source, latest (the newest test, 18 Oct 2026: answered in the caller's language, per line, or null), date, calls, minutes (date/calls/minutes: the full 24-28 Sep test the lines and scores below come from), run_by, limitations, fairness_note, scenarios[{id,name,brief}], lines[{id, vendor, business, kind, answers_as, list_price, ranked, points, possible, by_scenario{<scenario_id>:{points, possible, answered, first_words_s, ai_disclosed_unprompted, reply_language, price_quoted, measures}}}], read_more }. Needs no sign-in; reads a published file and changes nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "include_evidence": {
                "default": false,
                "description": "Default false: each scenario's measures come back as strings like 'yes: <measure>'. true: measures come back as [{measure, score (0 or 1), evidence (quoted transcript)}] (much longer output).",
                "type": "boolean"
              },
              "line_id": {
                "description": "Only this tested line, e.g. 'afterhours-plumbing', 'afterhours-vet', 'rosie', 'myaifrontdesk' or 'dialzara'. Omit for every line.",
                "maxLength": 40,
                "type": "string"
              },
              "scenario_id": {
                "description": "Only this scenario: 'emergency' (leak after hours), 'booking' (book a slot), 'price' (price probe), 'disclosure' (are you real?) or 'spanish' (caller in Spanish). Omit for all.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5dfa0cd4c9c2106ca03e1e97b1965c7485d7283d163731528dc3a8f16eceae25"
        },
        {
          "name": "get_sip_address",
          "title": "Your line's SIP address",
          "description": "Create (first call) or read the SIP address and private trunk credentials for one of the signed-in owner's answering lines, so the owner's phone system can send calls to the line over SIP, with no phone number, instead of forwarding a number. For the line's number and forwarding codes use get_answering_line. Pass the line_id from get_answering_line; a line that is still being set up returns an error. Returns { alias, sip_uri, sip_uri_tls, username, password }; keep the username and password private. The address is created once and repeat calls return the same one. SIP calls use the line's normal balance with no separate SIP charge. Needs lines:manage; rate limited per account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "line_id": {
                "description": "From get_answering_line.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["line_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8cb49d082c73d169cda2368de0be5830d2f1f6bf32385ce092f38ee57499373b"
        },
        {
          "name": "set_up_answering_line",
          "title": "Set up an After Hours answering line (prepaid minutes or resolved conversations)",
          "description": "Start setting up an After Hours answering line for the signed-in owner's business: a phone assistant that answers calls forwarded from the business's own number and takes messages and bookings for the owner. Nothing is built or bought until the owner pays: this returns a Stripe checkout link for the first pack, and once it is paid the line is set up automatically and its number and forwarding codes are emailed to the account's address. Only call it after showing the owner https://odilelabs.com/terms and getting a yes (owner_confirmed_terms true). The packs and billing rules are in get_answering_line_offer; a line that already exists is read with get_answering_line and topped up with buy_pack (product 'line_minutes' or 'line_outcomes', matching its billing_mode), not set up twice. United States only: business_phone and owner_mobile take any common US format with the area code and are stored as E.164, and Canadian area codes are refused. hours keys are day names (Monday, monday or mon); a day left out is closed, and omitting hours means Monday to Friday, 9 to 5. Messages reach the owner by email and the owner console; texts stay off until the owner switches them on there. Needs a signed-in connection with the lines:manage permission; limited to 3 set-ups a day per account, and rate limited. Returns { setup_id, status: 'awaiting payment', business_name, business_phone, pack, billing_mode, minutes or outcomes, price_cents, checkout_url, then }.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_name": {
                "description": "The business name callers should hear, e.g. \"Alvarez Plumbing\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "business_phone": {
                "description": "The business number callers dial today (US, with area code, any common format such as (561) 555-0123). The owner forwards it to the new line.",
                "maxLength": 40,
                "type": "string"
              },
              "city": {
                "description": "The town the business is in, e.g. \"Wellington, FL\". The receptionist says it when a caller asks where you are.",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Only US for now.",
                "enum": ["US"],
                "type": "string"
              },
              "description": {
                "description": "What the business does, in one line; this is what it tells callers.",
                "maxLength": 300,
                "type": "string"
              },
              "extra": {
                "description": "Anything else the receptionist should know.",
                "maxLength": 600,
                "type": "string"
              },
              "hours": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "properties": {
                        "close": {
                          "maxLength": 12,
                          "type": "string"
                        },
                        "open": {
                          "maxLength": 12,
                          "type": "string"
                        }
                      },
                      "required": ["close", "open"],
                      "type": "object"
                    },
                    {
                      "const": "closed",
                      "type": "string"
                    }
                  ]
                },
                "description": "Opening hours by day name, e.g. {\"Monday\": {\"open\": \"8:00 AM\", \"close\": \"5:00 PM\"}, \"Sunday\": \"closed\"}. A day left out is closed. Omit entirely for Monday to Friday, 9 to 5.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "languages": {
                "description": "Languages besides English the receptionist switches to when a caller does.",
                "items": {
                  "enum": ["es", "pt", "fr", "tr", "ru", "de"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "owner_confirmed_terms": {
                "description": "true ONLY after you showed the owner https://odilelabs.com/terms and they said yes. Anything else is refused.",
                "type": "boolean"
              },
              "owner_mobile": {
                "description": "The owner's own mobile (US, with area code): their calls to the line are never charged.",
                "maxLength": 40,
                "type": "string"
              },
              "pack": {
                "description": "The first pack: min40: 40 minutes; min200: 200 minutes; out50: 50 resolved conversations; out200: 200 resolved conversations. Amounts and billing rules: get_answering_line_offer.",
                "enum": ["min40", "min200", "out50", "out200"],
                "type": "string"
              },
              "services": {
                "description": "Up to 12 services, e.g. [\"drain cleaning\", \"water heaters\"].",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "tz": {
                "description": "IANA time zone for opening hours. If omitted, inferred from the business phone area code when unambiguous.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["business_name", "business_phone", "owner_confirmed_terms", "owner_mobile", "pack"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
