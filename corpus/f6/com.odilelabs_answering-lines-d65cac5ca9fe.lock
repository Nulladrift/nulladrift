        },
        {
          "name": "get_line_messages",
          "title": "One line's recent messages",
          "description": "List the messages the answering line took from callers for one of the signed-in owner's own lines, newest first. Each item has id, at (ISO), name, phone, message and urgent, so it holds callers' names and phone numbers. Pass the line_id from get_answering_line; limit sets the page size, and to read further back pass the previous result's next_before as before (next_before is null when there is nothing older). It reaches back through at most the 500 most recent messages. The calls themselves, with duration and summary, are in get_line_calls. Needs lines:manage; changes nothing; rate limited per account.",
          "inputSchema": {
