{
  "lockfileVersion": 2,
  "subjects": {
    "ai.bluerate/loan-officers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.bluerate.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bluerate",
        "title": "bluerate: find US mortgage loan officers",
        "version": "1.0.0",
        "websiteUrl": "https://www.bluerate.ai/developers"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "bluerate (www.bluerate.ai) lists licensed US mortgage loan officers, with their NMLS IDs, the states they are licensed in, loan types, languages and client reviews.\n\nUse search_loan_officers when someone asks for a mortgage loan officer, mortgage broker or lender in a US state, city or ZIP code, optionally for a loan type (FHA, VA, USDA, conventional, jumbo, non-QM) or a language. Use get_loan_officer for one loan officer's full profile by NMLS ID.\n\nAlways give the user each loan officer's url: it is their bluerate profile, where the user can read reviews and request a callback. When the user wants a loan officer to call them, use request_callback and give the user the confirmationUrl it returns; never ask the user for their phone number or email, they enter those on that bluerate page. The answers carry no phone numbers or email addresses. The data is a daily snapshot (asOf). bluerate does not quote rates through these tools.",
      "tools": [
        {
          "name": "get_loan_officer",
          "title": "Get a loan officer's profile",
          "description": "Returns one loan officer's bluerate.ai profile by NMLS ID: name, company, licensed states, loan types, languages, about text, up to 3 client reviews, FAQs and url: the loan officer's public bluerate profile, where people request a callback. Contains no phone numbers or email addresses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "nmls": {
                "description": "The loan officer's NMLS ID, digits only, for example 123456: the nmls field of a search result.",
                "type": "string"
              }
            },
            "required": ["nmls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a loan officer's profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ecd9150db06a7ce4d351671dd43cca703c4bb673f49a66f420714d1c9513eca5"
        },
        {
          "name": "request_callback",
          "title": "Request a call back from a loan officer",
          "description": "Creates a one-time bluerate.ai link (confirmationUrl, valid for 24 hours) for asking a loan officer listed on bluerate.ai to call back. The person who wants the call opens the link, enters their own phone number and email, agrees to be contacted and submits; only then is the loan officer notified. Phone numbers and email addresses are not accepted here. Takes the loan officer's NMLS ID and, optionally, the person's name, state and loan purpose to prefill the page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "borrowerName": {
                "description": "The user's name, if they gave it, to prefill the page. They can change it there.",
                "type": "string"
              },
              "loanPurpose": {
                "description": "What the loan is for.",
                "enum": ["purchase", "refinance", "cash_out"],
                "type": "string"
              },
              "nmls": {
                "description": "The loan officer's NMLS ID, digits only: the nmls field of a search result or profile.",
                "type": "string"
              },
              "state": {
                "description": "The US state of the property, two-letter code, for example CA.",
                "type": "string"
              }
            },
            "required": ["nmls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a call back from a loan officer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:81ccdbfb562548e6d6b79f8fa8b9fe372533c6bd0832d1ed2fdd3efd86ea4e93"
        },
        {
          "name": "search_loan_officers",
          "title": "Find mortgage loan officers",
          "description": "Searches licensed US mortgage loan officers listed on bluerate.ai by state, optionally near a city or ZIP code, for a loan type (conventional, FHA, VA, USDA, jumbo, non-QM) or by a language they speak. Returns up to 10 loan officers, each with name, NMLS ID, company, office city, licensed states, loan types, languages, number of reviews and url: the loan officer's public bluerate profile, where people read reviews and request a callback. Also returns total (how many match) and moreResultsUrl (the full list on bluerate). Results are filtered by state license, not office location; city and zip only rank nearby offices first. Results contain no phone numbers or email addresses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, for example San Jose. Puts loan officers with an office there first; does not filter.",
                "type": "string"
              },
              "language": {
                "description": "A language the loan officer speaks, as a name (Spanish, Chinese) or a code (es, zh).",
                "type": "string"
              },
              "limit": {
                "description": "How many loan officers to return, 1 to 10. Default 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "loanType": {
                "description": "Only loan officers who do this loan type in the state. Leave it out for every loan type.",
                "enum": ["conventional", "fha", "va", "usda", "jumbo", "non_qm"],
                "type": "string"
              },
              "state": {
                "description": "US state as a two-letter code, for example CA or TX. Full names like California also work.",
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code, for example 94105. Puts loan officers with an office there first; does not filter.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find mortgage loan officers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2e7cfe517d6e0f480df5b511af0ebeb6819003ee94354cd590847d0c1aaa91b"
        }
      ],
      "digest": "sha256:312354fe2e71cef26c24a7d8c9545493a34d5107d4b1cd1341ab1ec0665f20b3"
    }
  }
}
