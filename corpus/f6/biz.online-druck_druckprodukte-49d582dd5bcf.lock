      "instructions": "Dieser Server gehört zu Online-Druck.biz (auch online-druck.biz, Online-Druck, ODB), einer Online-Druckerei für Geschäftskunden (B2B). Er dient dazu, Druckprodukte zu suchen, zu konfigurieren und zu bepreisen, z. B. „Buch drucken“, „Flyer bestellen“, „Broschüre drucken lassen“, „Hardcover Buch A4 244 Seiten“.\n\nWerkzeuge: search_catalog sucht mit einer Anfrage im Katalog, der deutsch ist, und liefert SKUs. lookup_catalog löst bekannte SKUs, Shop-Produkt-IDs und Produkt-URLs auf. list_categories nennt die Warengruppen; ihre id begrenzt search_catalog über category_id. get_product liefert zu einer SKU alle Optionsgruppen mit Klartext, die Standardkonfiguration, Produktionszeiten, Datenchecks und Auflagengrenzen. configure_product prüft eine Konfiguration (SKU und die Änderungen gegenüber der Standardkonfiguration als options/text) und liefert Preis (netto, inkl. Versand), Lieferzeit und den fertigen Produktlink; bei Konflikten oder unsicherer Zuordnung kommt der Status needs_clarification mit Alternativen oder Kandidaten. price_scale stellt Preis und Link für bis zu 5 Auflagen nebeneinander. get_print_specifications liefert zu einer Konfiguration die Maßvorgaben für die Druckdaten (Formate mit Beschnitt, Rückenbreite, Download der Maßvorgabe).\n\nRegeln: Preise sind Nettopreise (B2B) in Cent (EUR) zuzüglich MwSt., Versand inklusive; Ab-Preise sind keine Preise der konfigurierten Variante. Ohne delivery_country gelten Preis und Link für Lieferung nach Deutschland, inkl. Versand. delivery_country von configure_product und price_scale (wenn angeboten; ISO-Code oder Name aus den Ländern des Produkts) bepreist ein anderes Lieferland inkl. Versand dorthin, der Link öffnet den Shop mit diesem Land. Geliefert wird europaweit, weltweit auf Anfrage; das Lieferland lässt sich auch auf der Produktseite im Shop wählen. Der Server liest nur: Es gibt keine Bestellung über diesen Server, der Kauf läuft über den Produktlink im Shop. Produktlinks erzeugt der Server in den Antworten von configure_product und price_scale; sie tragen die geprüfte Konfiguration, selbst gebaute Links nicht.\n\nThis server belongs to Online-Druck.biz (also online-druck.biz, Online-Druck, ODB), a German online print shop for business customers (B2B). It serves to find, configure and price print products, e.g. \"print a book\", \"order flyers\".\n\nTools: search_catalog searches the catalog, which is German, with a query and returns SKUs. lookup_catalog resolves known SKUs, shop product IDs and product URLs. list_categories names the categories; their id narrows search_catalog via category_id. get_product returns all option groups of a SKU in plain text, the default configuration, production times, data checks and quantity limits. configure_product checks a configuration (SKU and the changes against the default configuration as options/text) and returns price (net, including shipping), delivery time and the finished product link; on conflicts or uncertain assignments the status is needs_clarification with alternatives or candidates. price_scale shows price and link for up to 5 quantities side by side. get_print_specifications returns the print file specifications of a configuration (sizes with bleed, spine width, download of the specification file).\n\nRules: prices are net (B2B) in cents (EUR), excluding VAT, including shipping. Without delivery_country, price and link apply to delivery within Germany, including shipping. delivery_country of configure_product and price_scale (if offered; ISO code or name from the countries of the product) prices another delivery country including shipping there, and the link opens the shop with that country. The shop delivers across Europe, worldwide on request; the delivery country can also be chosen on the product page in the shop. The server is read-only; purchases happen via the product link in the shop. The server generates product links in the answers of configure_product and price_scale; they carry the checked configuration, links built by hand do not.",
      "tools": [
        {
          "name": "configure_product",
          "title": "Produkt konfigurieren und bepreisen / Configure and price a product",
          "description": "Konfiguriert ein Druckprodukt von Online-Druck.biz (online-druck.biz, Online-Druck, ODB), prüft die Kombination gegen den Konfigurator und liefert Preis und einen vorkonfigurierten Produktlink. Eingabe sind die SKU und nur die Änderungen gegenüber der Standardkonfiguration: options (Optionsname -> Wert in Klartext oder Zahl, z. B. {\"Format\": \"DIN A4 hoch\", \"Seitenanzahl\": \"244\"}) und/oder text (Freitext, z. B. \"Hardcover A4 244 Seiten beidseitig farbig, 100 Stück\"). Unzulässige Kombinationen kommen mit zulässigen Alternativen zurück, unsichere Zuordnungen mit Kandidaten (status needs_clarification). Preis: netto in Cent, zzgl. MwSt., inkl. Versand, nur Produktionszeit Standard; weitere Produktionszeiten bepreist extra_production_times (zählt gegen das Rate-Limit). Der Link nennt die vollständige Konfiguration; der Server erzeugt ihn, er wird nie aus Eingaben übernommen. Ist der Preis nicht rechtzeitig da, kommen Link und Ab-Preis; ein erneuter Aufruf liefert den Preis dann meist sofort. Ohne delivery_country gelten Preis und Link für Lieferung nach Deutschland, inkl. Versand. delivery_country (wenn angeboten; ISO-Code oder Name aus den Ländern des Produkts) bepreist ein anderes Lieferland inkl. Versand dorthin, der Link öffnet den Shop mit diesem Land. Geliefert wird europaweit, weltweit auf Anfrage; das Lieferland lässt sich auch auf der Produktseite im Shop wählen.\n\nConfigures a print product of Online-Druck.biz (online-druck.biz, Online-Druck, ODB), checks the combination against the configurator and returns price and a pre-configured product link. Input is the SKU and only the changes against the default configuration: options (option name -> value as plain text or number) and/or text (free text). Invalid combinations come back with allowed alternatives, uncertain assignments with candidates (status needs_clarification). Price: net in cents, excluding VAT, including shipping, production time Standard only; extra_production_times prices further production times (counts against the rate limit). The link carries the complete configuration; the server generates it and never takes it from input. If the price is not ready in time you get the link and the from-price; calling again usually returns the price at once. Without delivery_country, price and link apply to delivery within Germany, including shipping. delivery_country (if offered; ISO code or name from the countries of the product) prices another delivery country including shipping there, and the link opens the shop with that country. The shop delivers across Europe, worldwide on request; the delivery country can also be chosen on the product page in the shop.",
