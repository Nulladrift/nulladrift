        {
          "name": "search_catalog",
          "title": "Druckprodukte suchen / Search print products",
          "description": "Sucht Druckprodukte im Katalog von Online-Druck.biz (online-druck.biz, Online-Druck, ODB): Bücher, Broschüren, Flyer, Faltblätter und mehr. Der Katalog ist deutsch: Anfragen auf Deutsch liefern die besten Treffer; `language` \"en\" (wenn angeboten) stellt die Stoppwörter auf Englisch um. Typische Anfragen: „Buch drucken“, „Flyer bestellen“, „Hardcover Buch A4 244 Seiten“. Liefert je Aufruf 5 Treffer mit SKU, Titel, Beschreibung, Produktlink, Bild und Ab-Preis (netto, inkl. Versand); weitere Treffer über den cursor. Die SKU eines Treffers ist die Eingabe von get_product.\n\nSearches the catalog of Online-Druck.biz (online-druck.biz, Online-Druck, ODB), a German online print shop: books, brochures, flyers, folded leaflets and more. The catalog is German: German queries give the best hits; `language` \"en\" (if offered) switches the stop words to English. Typical queries: \"print a book\", \"order flyers\". Returns 5 hits per call with SKU, title, description, product link, image and from-price (net, including shipping); more hits via cursor. The SKU of a hit is the input of get_product.",
