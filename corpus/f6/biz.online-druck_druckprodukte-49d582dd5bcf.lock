        {
          "name": "get_print_specifications",
          "title": "Maßvorgaben für Druckdaten / Print file specifications",
          "description": "Liefert die Maßvorgaben für die Druckdaten einer Konfiguration eines Druckprodukts von Online-Druck.biz (online-druck.biz, Online-Druck, ODB): je Teilprodukt (z. B. Umschlag, Inhalt) Seitenzahl, Endformat und Datenformat mit Beschnitt und Zugaben in mm, Beschnitt in mm und einen Download-Link der Maßvorgabe, dazu die Rückenbreite in mm. Die Eingaben sind wie bei configure_product: SKU und nur die Änderungen gegenüber der Standardkonfiguration als options und/oder text, dazu quantity. Die Konfiguration wird gegen den Konfigurator geprüft; ist sie ungültig oder unklar, kommen keine Maßvorgaben, sondern der Status invalid oder needs_clarification mit Alternativen bzw. Kandidaten. Status configurator_unavailable: der Konfigurator hat nicht rechtzeitig geantwortet. Status no_specifications: das Produkt hat keine Maßvorgaben. Kein Preis und kein Produktlink.\n\nReturns the print file specifications of one configuration of a print product of Online-Druck.biz (online-druck.biz, Online-Druck, ODB): per part (e.g. cover, content) page count, trimmed size and document size with bleed and extras in mm, bleed in mm and a download link of the specification file, plus the spine width in mm. Input as in configure_product: SKU and only the changes against the default configuration as options and/or text, plus quantity. The configuration is checked against the configurator; if it is invalid or unclear there are no specifications but the status invalid or needs_clarification with alternatives or candidates. Status configurator_unavailable: the configurator did not answer in time. Status no_specifications: the product has no specifications. No price and no product link.",
