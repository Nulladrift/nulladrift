                "description": "Optional: Sprache der Anfrage, Standard \"de\" (wählt die Stoppwortlisten). Der Katalog ist deutsch; deutsche Anfragen geben die besten Treffer / Optional language of the query, default \"de\" (selects the stop word lists). The catalog is German; German queries give the best hits",
                "enum": ["de", "en"],
                "type": "string"
              },
              "max_price_cents": {
                "description": "Optional: Ab-Preis höchstens, in Cent netto / Optional maximum from-price in cents",
                "type": "integer"
              },
              "min_price_cents": {
                "description": "Optional: Ab-Preis mindestens, in Cent netto / Optional minimum from-price in cents",
                "type": "integer"
              },
              "query": {
                "description": "Suchanfrage auf Deutsch, z. B. \"Hardcover Buch A4 244 Seiten\" / Search query in German",
