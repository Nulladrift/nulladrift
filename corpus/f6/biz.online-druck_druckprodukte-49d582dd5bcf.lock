        {
          "name": "list_categories",
          "title": "Warengruppen auflisten / List categories",
          "description": "Listet die Warengruppen (Kategorien) von Online-Druck.biz (online-druck.biz, Online-Druck, ODB) mit der Zahl der Produkte, die meisten zuerst, z. B. „Bücher“, „Hefte“, „Klappkarten“, „Kalender“. Mit query lässt sich nach einem Teil des Namens filtern. Die id einer Warengruppe ist die category_id für search_catalog und begrenzt eine Suche auf diese Warengruppe.\n\nLists the categories of Online-Druck.biz (online-druck.biz, Online-Druck, ODB) with the number of products, best filled first, e.g. books, booklets, folded cards, calendars. query filters by part of the name. The id of a category is the category_id of search_catalog, which narrows a search to one category.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Optional: höchstens so viele Warengruppen, Standard 50 / Optional maximum number, default 50",
                "maximum": 150,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional: Teil des Namens, z. B. \"Buch\" / Optional part of the name",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "categories": {
                "description": "Warengruppen, die meisten Produkte zuerst / categories, best filled first",
                "items": {
                  "properties": {
                    "id": {
                      "description": "category_id für search_catalog / category_id for search_catalog",
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
