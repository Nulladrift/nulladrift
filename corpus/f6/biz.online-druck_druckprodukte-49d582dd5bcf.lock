        {
          "name": "price_scale",
          "title": "Staffelpreise / Price scale",
          "description": "Stellt die Nettopreise einer Konfiguration bei Online-Druck.biz (online-druck.biz, Online-Druck, ODB) für mehrere Auflagen nebeneinander, z. B. 100, 250, 500 Stück. Die Konfiguration wird einmal geprüft (wie bei configure_product: options oder text mit den Änderungen, sonst Standardkonfiguration); je Auflage kommen Nettopreis, Bruttopreis, Preis je Stück, Lieferzeit und der fertige Produktlink mit genau dieser Auflage. Höchstens 5 Auflagen je Aufruf. Preise sind netto zzgl. MwSt., inkl. Versand nach Deutschland; delivery_country (wenn angeboten; ISO-Code oder Name) bepreist ein anderes Lieferland des Produkts inkl. Versand dorthin. Auflagen außerhalb der Grenzen des Produkts werden genannt, nicht bepreist. Fehlt quantities, kommt kein Preis: die Antwort hat den Status quantities_missing und nennt die Standardauflage und die Grenzen des Produkts (quantity.default, min, max). Ist die Konfiguration ungültig oder unklar, kommt kein Preis, sondern der Status invalid mit den Gründen.\n\nShows the net prices of one configuration of Online-Druck.biz (online-druck.biz, Online-Druck, ODB) for several quantities side by side, e.g. 100, 250, 500 pieces. The configuration is checked once (as in configure_product: options or text with the changes, otherwise the default configuration); per quantity you get net price, gross price, unit price, delivery time and the finished product link with exactly this quantity. At most 5 quantities per call. Prices are net, excluding VAT, including shipping to Germany; delivery_country (if offered; ISO code or name) prices another delivery country of the product including shipping there. Quantities outside the limits of the product are named, not priced. If quantities is missing there is no price: the answer has the status quantities_missing and names the standard quantity and the limits of the product (quantity.default, min, max). If the configuration is invalid or unclear there is no price, but the status invalid with the reasons.",
