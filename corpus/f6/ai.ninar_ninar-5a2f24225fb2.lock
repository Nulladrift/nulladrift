      "tools": [
        {
          "name": "audit_brand_visibility",
          "title": "Verify whether an entity is a real competitor",
          "description": "Check whether a brand or entity surfaced by an AI engine is a genuine competitor in your category (e.g. is 'Banner Life' actually a mortgage insurance competitor to Enact?). Uses dual-model verification with automatic escalation on disagreement. Returns a confirmed/rejected decision, confidence score, reasoning, and audit trail. Pro plan or higher required.",
          "inputSchema": {
            "properties": {
              "entity": {
                "description": "Entity name to adjudicate, e.g. 'Banner Life', 'Enact Solar'.",
                "type": "string"
              },
              "raw_evidence": {
                "description": "Source text the entity appeared in. Should contain 'raw_answer_excerpt' and optionally 'entity_sentence' and 'source_probe_id'.",
                "properties": {
                  "entity_sentence": {
                    "type": "string"
                  },
                  "raw_answer_excerpt": {
                    "type": "string"
                  },
                  "source_probe_id": {
                    "type": "string"
                  }
                },
                "required": ["raw_answer_excerpt"],
                "type": "object"
              },
              "taxonomy_id": {
                "description": "Taxonomy registry to validate against. Default: pmi.v1",
                "type": "string"
              }
            },
            "required": ["entity", "raw_evidence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit a brand entity via System of Record adjudication"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:df8e7a033833feb5a869921e9b00b7610e464ea152c2f2934fadc5ce9cf61c9c"
        },
        {
          "name": "generate_content",
          "title": "Generate AI-optimized content for a gap",
          "description": "Generate AI-optimized content (FAQ, about copy, use cases, differentiators) for the gaps in your latest scan. Returns full content text inline — no need to visit the dashboard. Pro plan or higher required. Pass gap_type='all' to get every block in one call.",
          "inputSchema": {
            "properties": {
              "gap_type": {
                "description": "Which content block to generate. Use 'all' for everything in one call.",
                "enum": ["faq", "about", "use_cases", "differentiators", "all"],
                "type": "string"
              }
            },
            "required": ["gap_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Generate AI-optimized content for a gap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d12c264c0e28825090ff366d9830328014ebc121fff014ca0a8d03e59c287124"
        },
        {
          "name": "get_latest_score",
          "title": "Get my latest AI Visibility Index score",
          "description": "Get the AI Visibility Index (0-100) for the signed-in user's most recently scanned brand, broken down by engine. Requires a free Ninar account (no credit card).",
          "inputSchema": {
            "properties": {},
            "type": "object"
