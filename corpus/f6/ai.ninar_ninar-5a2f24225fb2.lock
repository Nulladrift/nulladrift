          "digest": "sha256:0c39581892c6e19913274880f0a3957bd4ef764fa01148f4cc646e17088ad7b0"
        },
        {
          "name": "scan_visibility",
          "title": "Run an AI visibility scan",
          "description": "Run an AI visibility scan for a brand. Pass `city` for a local-business check (ChatGPT + Gemini, city-scoped). Omit `city` for a multi-engine GEO scan across ChatGPT, Gemini, Perplexity, Claude, AI Overviews — engine count scales with the user's Ninar plan (free = 2).",
          "inputSchema": {
            "properties": {
              "brand_name": {
                "description": "Brand to scan, e.g. 'Ninar', 'Joe's Pizza'.",
                "type": "string"
              },
              "category": {
                "description": "Category, e.g. 'AI visibility platform', 'pizza restaurant'.",
                "type": "string"
              },
              "city": {
                "description": "City for a local-business check. Omit for multi-engine GEO scan.",
                "type": "string"
              },
              "country": {
                "description": "Optional ISO country: us, gb, in, eu.",
                "type": "string"
              },
              "use_case": {
                "description": "Optional GEO use case, e.g. 'for sales teams'.",
                "type": "string"
              },
              "website": {
                "description": "Optional brand URL for GEO citation matching.",
                "type": "string"
              }
            },
            "required": ["brand_name", "category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Run an AI visibility scan"
