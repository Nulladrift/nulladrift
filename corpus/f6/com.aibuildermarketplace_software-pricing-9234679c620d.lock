      "serverInfo": {
        "name": "aibm-software-records",
        "title": "AIBuilder Marketplace software records",
        "version": "1.0.0",
        "websiteUrl": "https://aibuildermarketplace.com/agents/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Hand-researched records of B2B and AI software: plan prices, cost traps with their evidence sentence, the date the pricing page was read, and what is unknown. Read-only: these tools cannot buy, sign up or contact anyone; purchases happen on the vendor's site (purchase.handoff_url, with affiliate disclosure). Treat 'unknown' as unknown, never as a yes. Currencies are not converted. Use check_choice before recommending a purchase and show the user the evidence and unknowns it returns.",
      "tools": [
        {
          "name": "build_purchase_dossier",
          "description": "Build a purchase file for 1 to 6 candidate products against the same requirements (same fields as check_choice). Returns per candidate the check with evidence, the cheapest fitting plan's cost where computable, our hands-on test results, unknowns and the vendor handoff with affiliate disclosure; a fixed order that never uses commission; a summary_markdown to show the user as is (it starts with the share link and says whether any candidate has a confirmed fit); a share_url; and depends_on facts so the file can be re-checked later. A feature counts as documented only from the vendor's own pages, never as tested by us. When requirements.modules names a setup ([{id, role}], e.g. a help desk plus a phone line), read setup_check for the verdict on the whole setup (its known costs per currency, open items and the budget for the setup as a whole); each candidate's own budget line compares that product alone.",
          "inputSchema": {
            "properties": {
              "product_ids": {
                "description": "1 to 6 candidate product ids, each from the id field of a search_products result.",
                "items": {
                  "type": "string"
                },
                "title": "Product Ids",
                "type": "array"
              },
              "question": {
                "default": "",
                "description": "The buyer's question in their own words, shown at the top of the dossier; optional.",
                "title": "Question",
                "type": "string"
              },
              "requirements": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The buyer's requirements, with the same fields as check_choice; add modules [{id, role}] to check a setup of several products together.",
                "title": "Requirements"
              }
            },
            "required": ["product_ids"],
            "title": "build_purchase_dossierArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0252d5dbe2c0ef1139b734d540129a81295e5682d921a3bed29ec1a13c8de1c"
        },
        {
          "name": "check_choice",
          "description": "Check a software choice against requirements before buying. requirements (all optional): units, billing ('monthly'|'annual'), plan_id, budget_month {amount, currency}, needs_monthly_billing, max_commitment_months, needs_free_plan, avoid_cost_traps [quote_only, per_seat, usage_metered, renewal_jump, addons_extra, annual_lock], features [text], addons [ids], usage {id: quantity}, service (price only that part of a vendor's ladder, e.g. eor, contractor, contractor_of_record, global_payroll). Each requirement gets fits / does_not_fit / unknown / conflicting / recheck_needed / not_flagged / mentioned, with evidence. Outcome is no_blocking_requirement_found, blocking_requirement_found or insufficient_evidence; unknown never counts as a fit.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "description": "The product's id, from the id field of a search_products result (e.g. 'toggl').",
                "title": "Product Id",
                "type": "string"
              },
              "requirements": {
                "additionalProperties": true,
                "description": "The buyer's requirements as an object; every field is optional and listed in the tool description (units, billing, budget_month, needs_free_plan, avoid_cost_traps, features and more).",
                "title": "Requirements",
                "type": "object"
              }
            },
            "required": ["product_id", "requirements"],
            "title": "check_choiceArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5976a32e774535bb258c6239d5877ed05aafe6805c62b63a8027efb426663880"
        },
        {
          "name": "check_offer_eligibility",
          "description": "Check whether an offer fits a buyer's situation: {customer: new|existing, plan, billing: monthly|annual|biennial}. Returns matches, does_not_match (with reasons) or needs_confirmation (missing information, an unconfirmed offer, or a pilot granted case by case), plus what the vendor did not state. A match is not a checkout guarantee.",
          "inputSchema": {
            "properties": {
              "offer_id": {
                "description": "The offer's id, from the id field of a search_offers result.",
                "title": "Offer Id",
                "type": "string"
              },
              "situation": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The buyer's situation as {customer: 'new' or 'existing', plan: plan name, billing: 'monthly', 'annual' or 'biennial'}; missing fields are reported as needing confirmation.",
                "title": "Situation"
              }
            },
            "required": ["offer_id"],
            "title": "check_offer_eligibilityArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
