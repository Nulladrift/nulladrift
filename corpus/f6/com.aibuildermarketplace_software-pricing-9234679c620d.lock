          "digest": "sha256:6f676508b5f45e396e6f4e5755304bf18cb150261bd98406d07be3ef9615a2e0"
        },
        {
          "name": "compare_offer_costs",
          "description": "Compare 1 to 3 offers on the same billing term and period. prices maps offer_id to the monthly price the buyer would pay for that product without the offer (same currency as the vendor). Returns fit and cost per offer: pay today, cost over the period with and without the offer, saving, or why it cannot be calculated (credits, a longer trial, unknown duration).",
          "inputSchema": {
            "properties": {
              "billing": {
                "default": "monthly",
                "description": "Billing term to compare on: 'monthly', 'annual' or 'biennial'.",
                "enum": ["monthly", "annual", "biennial"],
                "title": "Billing",
                "type": "string"
              },
              "months": {
                "default": 12,
                "description": "Period to compare over, in months (default 12).",
                "title": "Months",
                "type": "integer"
              },
              "offer_ids": {
                "description": "1 to 3 offer ids, each from the id field of a search_offers result.",
                "items": {
                  "type": "string"
                },
                "title": "Offer Ids",
                "type": "array"
              },
              "prices": {
                "additionalProperties": true,
                "description": "The monthly price the buyer would pay without the offer, as {offer_id: amount}, in the vendor's currency.",
                "title": "Prices",
                "type": "object"
              },
              "situation": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Same as check_offer_eligibility: {customer, plan, billing}; optional.",
                "title": "Situation"
              }
            },
            "required": ["offer_ids", "prices"],
            "title": "compare_offer_costsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
