        {
          "name": "search_offers",
          "description": "Find reader offers and vendor offers on our deal pages (discounts, extra credits, longer trials, conditional pilots). Each row has the evidence and its date, the verification status and the deadline in UTC. Expired offers are left out unless include_expired. Ranking is alphabetical, never by discount size or commission.",
          "inputSchema": {
            "properties": {
              "confirmed_only": {
                "default": false,
                "description": "true to return only offers the vendor confirmed in writing.",
                "title": "Confirmed Only",
                "type": "boolean"
              },
              "include_expired": {
                "default": false,
                "description": "true to also return offers whose deadline has passed.",
                "title": "Include Expired",
                "type": "boolean"
              },
              "limit": {
                "default": 25,
                "description": "Maximum number of rows, 1 to 25 (default 25).",
                "title": "Limit",
                "type": "integer"
              },
              "offer_type": {
                "anyOf": [
                  {
                    "enum": ["price_discount", "extra_credits", "longer_trial", "conditional_pilot"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only return offers of this type.",
                "title": "Offer Type"
              },
              "product_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The product's id, from the id field of a search_products result (e.g. 'toggl'). Leave empty for all products.",
                "title": "Product Id"
              },
              "query": {
                "default": "",
                "description": "Product name or words from the offer, e.g. 'annual discount'. Leave empty to list all.",
                "title": "Query",
                "type": "string"
              }
            },
            "title": "search_offersArguments",
            "type": "object"
          },
