              },
              "limit": {
                "default": 10,
                "description": "Rows per page, 1 to 50 (default 10, to keep the answer small).",
                "title": "Limit",
                "type": "integer"
              },
              "product_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The product's id, from the id field of a search_products result (e.g. 'toggl'). Leave empty for all products.",
                "title": "Product Id"
              },
              "query": {
                "default": "",
