      "instructions": "Answer from PreShiftIQ's tool results only. Add no images, vendor names or examples that the results do not contain, and make no recommendation. State counts only as a tool returns them. Do not retype or abridge a vendor roster; for the full list, point to the card's Show all vendors, or its See all covered vendors where the host has no full screen, or, with no card, the category's page the result names.",
      "tools": [
        {
          "name": "answer_question",
          "title": "Answer an assessment question",
          "description": "Records one answer to the next question of a PreShiftIQ assessment in this conversation, in the conversation handle, and returns the next question, the updated handle and the next step. PreShiftIQ stores no answer from this tool and records the call without its arguments; it counts, per day, how often each question is asked and answered, with no handle, person or address in the count. Answers given here are kept only if the client continues to preshiftiq.com, signs in and agrees there.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "handle": {
                "maxLength": 8192,
                "minLength": 1,
                "pattern": "^v1\\.[A-Za-z0-9_-]{1,32}\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "question_id": {
                "maxLength": 36,
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              },
              "value": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 1,
                    "pattern": "^[^\\u0000-\\u001F\\u007F]+$",
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 200,
                      "minLength": 1,
                      "pattern": "^[^\\u0000-\\u001F\\u007F]+$",
                      "type": "string"
                    },
                    "maxItems": 60,
                    "minItems": 1,
                    "type": "array",
                    "uniqueItems": true
                  }
                ]
              }
            },
            "required": ["handle", "question_id", "value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "answered": {
                "minimum": 0,
                "type": "integer"
              },
              "handle": {
                "type": "string"
              },
              "next_question": {
                "anyOf": [
                  {
                    "type": "null"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "options": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "code": {
                              "type": "string"
                            },
                            "label": {
                              "type": "string"
                            }
                          },
                          "required": ["code", "label"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "position": {
                        "minimum": 1,
                        "type": "integer"
                      },
                      "question_id": {
                        "type": "string"
                      },
                      "text": {
                        "type": "string"
                      },
                      "type": {
                        "enum": ["single_select", "multi_select"],
                        "type": "string"
                      }
                    },
                    "required": ["options", "position", "question_id", "text", "type"],
                    "type": "object"
                  }
                ]
              },
              "next_step": {
                "additionalProperties": false,
                "properties": {
                  "action": {
                    "enum": ["answer_next_question", "open_start_url"],
                    "type": "string"
                  },
                  "reason": {
                    "enum": ["question", "cap", "exhausted", "follow_up_skipped", "handle_restarted"],
                    "type": "string"
                  },
                  "text": {
                    "type": "string"
                  }
                },
                "required": ["action", "reason", "text"],
                "type": "object"
              },
              "start_url": {
                "type": "string"
              }
            },
            "required": ["answered", "handle", "next_question", "next_step", "start_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Answer an assessment question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "icons": [
            {
