        {
          "name": "get_public_catalog",
          "title": "List covered vendors in one category",
          "description": "Lists the vendors PreShiftIQ covers in one vertical, alphabetically, as catalog coverage only, with no participation status; the client's matches come from the engine's scoring of their completed assessment, and from vendors the client adds by name after a check against their stated requirements. Use this when a user asks which vendors PreShiftIQ covers or whether a named vendor is covered. Returns the roster and the URL to start an assessment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vertical_id": {
                "enum": ["tms", "dock-scheduling", "eld", "carrier-vetting", "fleet-management", "supply-chain-procurement", "yard-management"],
                "type": "string"
              }
            },
            "required": ["vertical_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_page_url": {
                "type": "string"
              },
              "coverage_statement": {
                "type": "string"
              },
              "delisting_policy": {
                "type": "string"
              },
              "display_name": {
                "type": "string"
              },
              "live_vendor_count": {
                "minimum": 0,
                "type": "integer"
              },
