              "mimeType": "image/png",
              "sizes": ["64x64"]
            }
          ],
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:d4a3b853bfeea4ea85fbe1093a9632947a26707f7a9ad52f5cb42150274f128f"
