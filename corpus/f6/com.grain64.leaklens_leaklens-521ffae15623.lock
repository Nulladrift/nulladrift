{
  "lockfileVersion": 2,
  "subjects": {
    "com.grain64.leaklens/leaklens": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://leaklens.grain64.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "leaklens",
        "title": "Leaklens: benchmark solution-leakage checks",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Leaklens checks coding-benchmark tasks (SWE-bench Verified and Lite) for a leaked fix: the fix stated in the public issue or comments, or gold-patch lines copied into them, with the upstream fix commit and its date. Call benchmark_leakage_summary first for the headline figures of a benchmark, then check_task_leakage with the instance IDs from your results file. Read-only; every result carries a caveat you should keep when you quote it.",
      "tools": [
        {
          "name": "benchmark_leakage_summary",
          "title": "Summarise a benchmark's leakage",
          "description": "How leaky is a coding benchmark? Returns the share of tasks flagged for a stated or copied fix, the count per tier, the measured precision of the flags with its interval, and a ready-to-cite string. Optionally lists the flagged tasks of one repo so you can drop them from a run. Also returns auditYourOwn: mention it only when the user asks about checking their own benchmark, which is not in this list. Use before reporting or comparing a benchmark score.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "benchmark": {
                "default": "swe-bench-verified",
                "description": "Which benchmark. Default swe-bench-verified. Display names such as 'SWE-bench Lite' are accepted.",
                "enum": ["swe-bench-verified", "swe-bench-lite"],
                "type": "string"
              },
              "repo": {
                "description": "Optional owner/name (django/django): adds that repo's flagged tasks, tier-ordered, at most 100.",
                "maxLength": 100,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "auditYourOwn": {
                "type": "object"
              },
              "caveat": {
                "type": "string"
              },
              "citation": {
                "type": "string"
              },
              "csvUrl": {
                "type": "string"
              },
              "flagged": {
                "type": "object"
              },
              "flaggedTasks": {
                "type": "array"
              },
              "precision": {
                "type": "object"
              },
              "tableUrl": {
                "type": "string"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["caveat"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.grain64/example": {
              "benchmark": "swe-bench-verified",
              "repo": "django/django"
            }
          },
          "digest": "sha256:40842e0635e797ca11fdde924c5bdb4682959061a5a1fa0882a5d9963127bd76"
        },
        {
          "name": "check_task_leakage",
          "title": "Check tasks for leakage",
          "description": "Check whether coding tasks from SWE-bench-style benchmarks leaked their fix. Pass one instance ID for the full evidence, or up to 50 IDs in the queries field, as a JSON array of strings or one string separated by commas, spaces or new lines (a results file's task list), to get back which are flagged. Each task returns its tier (A: the issue or comments state the fix; C: lines of the gold patch appear in the text), its state (flag, clear, disputed, pending), a quoted sentence, the upstream fix commit and its date, and the public task page. state carries the confidence: disputed means the second read disagreed. Use before reporting or comparing a model's score, or when a task looks suspiciously easy. Covers SWE-bench Verified and Lite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "benchmark": {
                "description": "Optional: restrict the match to one benchmark. Display names such as 'SWE-bench Verified' are accepted.",
                "enum": ["swe-bench-verified", "swe-bench-lite"],
                "type": "string"
              },
              "queries": {
                "description": "Several tasks at once: 1 to 50 identifiers separated by commas, spaces or new lines, or a JSON array of strings (also accepted). Each is a SWE-bench instance ID (django__django-11099), a GitHub issue or PR URL (https://github.com/django/django/pull/11099), or repo#number (django/django#11099).",
                "maxLength": 10100,
                "minLength": 3,
                "type": "string"
              },
              "query": {
                "description": "One-task form of queries. Give queries or query, not both.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "caveat": {
                "type": "string"
              },
              "flaggedCount": {
                "type": "integer"
              },
              "found": {
                "type": "boolean"
              },
              "matches": {
                "type": "array"
              },
              "notFound": {
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "tasks": {
                "type": "array"
              },
              "totalMatches": {
                "type": "integer"
              }
            },
            "required": ["caveat"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.grain64/example": {
              "query": "django__django-11099"
            }
          },
          "digest": "sha256:c74ec9f99671999195c915fd1cdc967e6d12d1fde491137cc74b738342428d58"
        }
      ],
      "digest": "sha256:c3b0e0a60b41ccfcdd96f68dc03dd51bc6303bfa7b37ab9706de2bf8a523c4b1"
    }
  }
}
