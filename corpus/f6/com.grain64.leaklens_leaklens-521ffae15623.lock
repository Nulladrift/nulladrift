{
  "lockfileVersion": 2,
  "subjects": {
    "com.grain64.leaklens/leaklens": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://leaklens.grain64.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "leaklens",
        "title": "Leaklens: benchmark solution-leakage checks",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Leaklens checks coding-benchmark tasks (SWE-bench Verified and Lite) for a leaked fix: the fix stated in the public issue or comments, or gold-patch lines copied into them, with the upstream fix commit and its date. Call benchmark_leakage_summary first for the headline figures of a benchmark, then check_task_leakage with the instance IDs from your results file. Read-only; every result carries a caveat you should keep when you quote it.",
      "tools": [
        {
          "name": "benchmark_leakage_summary",
          "title": "Summarise a benchmark's leakage",
          "description": "How leaky is a coding benchmark? Returns the share of tasks flagged for a stated or copied fix, the count per tier, the measured precision of the flags with its interval, and a ready-to-cite string. Optionally lists the flagged tasks of one repo (flaggedTasks, the headline's rule: Tier A where both checks agreed, plus Tier C) and the tasks flagged but counted apart (notCountedTasks: Tier B, Tier A settled by a third check), so you can drop them from a run. asOf is an ISO date; the display date is inside citation. Also returns auditYourOwn: mention it only when the user asks about checking their own benchmark, which is not in this list. Use before reporting or comparing a benchmark score.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "benchmark": {
                "default": "swe-bench-verified",
                "description": "Which benchmark. Default swe-bench-verified. Display names such as 'SWE-bench Lite' are accepted.",
                "enum": ["swe-bench-verified", "swe-bench-lite"],
                "type": "string"
              },
              "repo": {
                "description": "Optional owner/name (django/django): adds that repo's flagged tasks, tier-ordered, at most 100.",
                "maxLength": 100,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "auditYourOwn": {
                "type": "object"
              },
              "caveat": {
                "type": "string"
              },
              "citation": {
                "type": "string"
              },
              "csvUrl": {
                "type": "string"
              },
              "flagged": {
                "type": "object"
              },
              "flaggedTasks": {
                "type": "array"
              },
              "notCountedTasks": {
                "type": "array"
              },
              "precision": {
                "type": "object"
              },
              "tableUrl": {
                "type": "string"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["caveat"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.grain64/example": {
              "benchmark": "swe-bench-verified",
              "repo": "django/django"
            }
          },
          "digest": "sha256:24493579d6047cc5257afa99a0f390ebfa1e57045cdd34f4402b92e1d998ec79"
        },
        {
          "name": "check_task_leakage",
          "title": "Check tasks for leakage",
          "description": "Check whether coding tasks from SWE-bench-style benchmarks leaked their fix. Pass one instance ID for the full evidence, or up to 50 IDs in the queries field, as a JSON array of strings or one string separated by commas, spaces or new lines (a results file's task list), to get back which are flagged. Each task returns its tier, state and agreement, countedInHeadline, a one-clause why, a quoted sentence (disputedQuote when the checks disagreed), the upstream fix commit and its date, and the public task page. flaggedCount and countedInHeadline use the benchmark headline's rule: Tier A where both checks agreed, plus Tier C. Tier B (pointerCount) and Tier A settled by a third check (settledCount) keep state flag but are counted apart, as on the site. tier: A (the issue or comments state the fix); B (the text points to the exact file, function or line to change, without giving the change); C (lines of the gold patch appear in the text); none (no quoted evidence found); pending (not checked yet). state: flag (Tier A, B or C); clear (no quoted evidence and no link to the fix); disputed (the checks disagreed and at least one found something; not a flag, never read as clear); link (no quoted evidence, but the issue text or discussion links the pull request that is the fix); pending (not checked yet). agreement: agreed (both checks agreed); split (the two checks disagreed; the lower reading is shown); tiebreak (a third check settled a disagreement); n/a (Tier C, a string match, needs no second check). Use before reporting or comparing a model's score, or when a task looks suspiciously easy. Covers SWE-bench Verified and Lite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "benchmark": {
                "description": "Optional: restrict the match to one benchmark. Display names such as 'SWE-bench Verified' are accepted.",
                "enum": ["swe-bench-verified", "swe-bench-lite"],
                "type": "string"
              },
              "queries": {
                "description": "Several tasks at once: 1 to 50 identifiers separated by commas, spaces or new lines, or a JSON array of strings (sent as an array, or JSON-encoded in this string). Each is a SWE-bench instance ID (django__django-11099), a GitHub issue or PR URL (https://github.com/django/django/pull/11099), or repo#number (django/django#11099).",
                "maxLength": 10100,
                "minLength": 3,
                "type": "string"
              },
              "query": {
                "description": "One-task form of queries. Give queries or query, not both.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "type": ["string", "null"]
              },
              "asOfByBenchmark": {
                "type": "object"
              },
              "caveat": {
                "type": "string"
              },
              "disputedCount": {
                "type": "integer"
              },
              "flaggedCount": {
                "type": "integer"
              },
              "found": {
                "type": "boolean"
              },
              "linkCount": {
                "type": "integer"
              },
              "matches": {
                "type": "array"
              },
              "notFound": {
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "pointerCount": {
                "type": "integer"
              },
              "settledCount": {
                "type": "integer"
              },
              "tasks": {
                "type": "array"
              },
              "totalMatches": {
                "type": "integer"
              }
            },
            "required": ["caveat"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.grain64/example": {
              "query": "django__django-11099"
            }
          },
          "digest": "sha256:4d70b9bcf72407e756bb13d1d201708bd7c1c77a611248f8fd1ccdb9cb10405c"
        }
      ],
      "digest": "sha256:ce32520be0ff496753d26c2b30c3470a0c874927a1660da875a492ed0b8b6723"
    }
  }
}
