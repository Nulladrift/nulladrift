{
  "lockfileVersion": 2,
  "subjects": {
    "com.loc8id/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.loc8id.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "loc8id",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "collection_add_loc8id",
          "description": "Add one or more existing Loc8IDs (by their short code) to a collection, given the collection's name or ID. Use this after loc8id_create/loc8id_create_many when the user wants the new locations filed into a collection. Adding a Loc8ID you don't own to your collection is a Pro feature.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "collection_id_or_name": {
                "description": "The collection's name (as the user knows it) or its UUID.",
                "type": "string"
              },
              "loc8ids": {
                "description": "Loc8ID short codes (e.g. \"R7K3P\") — not UUIDs.",
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["collection_id_or_name", "loc8ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1cba513dcf288cc5732d9f36a59f7da9c76b15918db2668523ba9ba269a24307"
        },
        {
          "name": "collection_create",
          "description": "Create a new (private by default) collection in the authenticated user's account. Use this when the user asks to group locations together, e.g. \"put these in a collection called...\". A Pro-plan feature — fails with a clear plan_required error on a free account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "description": {
                "maxLength": 1000,
                "type": "string"
              },
              "name": {
                "maxLength": 50,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76b69cf75bb9fa5ad5708280b42b022d7897c878fe435e89088421598aad7535"
        },
        {
          "name": "collection_get",
          "description": "Retrieve a collection and its Loc8IDs, by name or by ID. Use this when the user asks to see an existing collection, e.g. \"show me my Ontario Trips collection\". Read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "collection_id_or_name": {
                "description": "The collection's name (as the user knows it) or its UUID.",
                "type": "string"
              }
            },
            "required": ["collection_id_or_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bdfb81057edc9e3e939180c3740c42c8d7d2a9587a8736f972db7ead05be793c"
        },
        {
          "name": "loc8id_create",
          "description": "Create an actual Loc8ID in the authenticated user's Loc8ID account. Use this whenever the user asks to create, save, pin, bookmark, or generate a Loc8ID for a real place. Never construct a loc8id.com/... URL yourself — always call this tool so the location is actually saved to the user's account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "alias": {
                "description": "Custom vanity slug — Premium only.",
                "maxLength": 50,
                "minLength": 3,
                "pattern": "^[a-z0-9][a-z0-9-]*[a-z0-9]$",
                "type": "string"
              },
              "description": {
                "maxLength": 1000,
                "type": "string"
              },
              "latitude": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "name": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e825ded8159e9a21116bac43fd98d3c9a61a05254eacfaac01700231d4f94cbb"
        },
        {
          "name": "loc8id_create_many",
          "description": "Create multiple actual Loc8IDs in the authenticated user's account in one call. Use this instead of calling loc8id_create repeatedly when the user asks to save several places at once (e.g. \"save these eight landmarks\"). Returns which ones succeeded and which failed — a failure on one location does not stop the rest.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "locations": {
                "items": {
                  "$schema": "https://json-schema.org/draft/2020-12/schema",
                  "additionalProperties": false,
                  "properties": {
                    "alias": {
                      "description": "Custom vanity slug — Premium only.",
                      "maxLength": 50,
                      "minLength": 3,
                      "pattern": "^[a-z0-9][a-z0-9-]*[a-z0-9]$",
                      "type": "string"
                    },
                    "description": {
                      "maxLength": 1000,
                      "type": "string"
                    },
                    "latitude": {
                      "maximum": 90,
                      "minimum": -90,
                      "type": "number"
                    },
                    "longitude": {
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    },
                    "name": {
                      "maxLength": 100,
                      "type": "string"
                    }
                  },
                  "required": ["latitude", "longitude"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["locations"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5c94ada07502a58e8bd1bd307038a97e501b99488b1207f35da300f7c5c17b78"
        },
        {
          "name": "loc8id_get",
          "description": "Look up an existing Loc8ID by its short code, custom alias, or a pasted loc8id.com URL. Read-only — does not modify anything. Works for any public Loc8ID, not just the caller's own.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "loc8id": {
                "description": "A short code (e.g. \"R7K3P\"), a custom alias, or a full loc8id.com URL.",
                "type": "string"
              }
            },
            "required": ["loc8id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4ca0168f94fc57fb646979bfe9f5abb625679c510a698667d237fa00863e127d"
        },
        {
          "name": "loc8id_search",
          "description": "Search the authenticated user's own Loc8IDs by short code, custom alias, name, or description. Results are returned most recently created first. Read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional substring to match against code, alias, name, or description.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5742e28ed3b8854202f04dbe28c63016dbf6c5918e873a9bbc9db95037916ebd"
        },
        {
          "name": "loc8id_update",
          "description": "Update the name and/or description of a Loc8ID owned by the authenticated user. Omitted fields remain unchanged. This never changes the coordinates or short code.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["name"]
              },
              {
                "required": ["description"]
              }
            ],
            "properties": {
              "code": {
                "description": "The short code, custom alias, or pasted loc8id.com URL to update.",
                "type": "string"
              },
              "description": {
                "maxLength": 1000,
                "type": "string"
              },
              "name": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a86e564c8cf0a86d55b40eddb5485f55558945f650cf3478358127e69b7ca55"
        }
      ],
      "digest": "sha256:f24fd8408e9d96febe8f6f2bbc0ce79cfac94187b0ba453e60c8d11b437ee1d8"
    }
  }
}
