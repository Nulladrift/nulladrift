        {
          "name": "crypto_prices",
          "title": "crypto prices",
          "description": "Live token prices computed from on-chain DEX pools (Uniswap V3, PancakeSwap V3, Orca Whirlpools) on Ethereum, Base, Arbitrum, Optimism, Polygon, BNB Chain and Solana, with pool depth, confidence and 24h change; plus an Aave V3 yield screener (supply/borrow APY and market size per asset). No third-party price feed: every figure is derived from public chain state. Paid ($0.001, x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "change_24h": {
                "description": "Include 24h price change (EVM)",
                "type": "boolean"
              },
              "tokens": {
                "description": "Comma-separated, max 10: symbols (ETH, BTC, SOL, BNB, POL, ARB, OP, USDC, USDT, DAI, LINK, UNI, AAVE) or chain:address (base:0x..., solana:<mint>)",
                "type": "string"
              },
              "yields_chain": {
                "description": "Also return Aave V3 supply/borrow APY for every market on this chain",
                "enum": ["ethereum", "base", "arbitrum", "optimism", "polygon", "bsc"],
                "type": "string"
              }
            },
            "type": "object"
          },
