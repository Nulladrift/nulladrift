        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ISHOB is a machine-readable knowledge archive. Use search_archive / list_topics / get_catalog_page (free) to find resource ids, then get_document / get_fulltext / get_references (x402-paid, USDC) to retrieve content. Every record carries license and attribution that must be preserved.",
      "tools": [
        {
          "name": "company_snapshot",
          "title": "company snapshot",
          "description": "Company snapshot in one call for any SEC-registered company: fundamentals and ratios from the latest annual report (revenue, margins, growth, debt, cash flow, EPS), SEC profile (industry, exchange, state, fiscal year), recent filings (latest 10-K / 10-Q, 8-K events, insider-trading activity in 90 days) and the official website's health (uptime, TLS expiry, email security, registration). Sources: SEC EDGAR (public domain), Wikidata (CC0). Paid ($0.05, x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Optional website to check instead of the one on record",
                "type": "string"
              },
              "ticker": {
                "description": "Ticker of an SEC-registered company, e.g. AAPL, MSFT, BRK-B",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
