        },
        {
          "name": "contract_abi",
          "title": "contract abi",
          "description": "Verified smart-contract ABI (+ optional Solidity/Vyper source) for Ethereum, Base, Arbitrum, Optimism, Polygon and BNB Chain from the open Sourcify registry: compiler, deployment, read/write function and event signatures, and proxy resolution to the implementation ABI. Unverified contracts return 404 (not charged). Paid ($0.001, x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Contract address",
                "type": "string"
              },
              "chain": {
                "description": "EVM chain",
                "enum": ["ethereum", "base", "arbitrum", "optimism", "polygon", "bsc"],
                "type": "string"
              },
              "include_source": {
                "description": "Include verified source files (up to 600k characters)",
                "type": "boolean"
              },
              "resolve_proxy": {
                "description": "Also return the implementation ABI of a proxy",
                "type": "boolean"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
