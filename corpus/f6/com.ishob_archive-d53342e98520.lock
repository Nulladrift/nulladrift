        {
          "name": "generate_barcode",
          "title": "generate barcode",
          "description": "Generate a barcode or QR code as SVG or PNG: QR, DataMatrix, PDF417, Code 128, Code 39, EAN-13, EAN-8, UPC-A, ISBN-13, ITF and GS1-128. EAN/UPC/ISBN check digits are computed (or verified, never silently replaced). QR and DataMatrix support colours, square/rounded/dot styles and (QR) a centre logo from an https URL. Every format is verified scannable. Returns SVG text or base64 PNG plus a data URI ready to embed in HTML, PDF or labels. Paid ($0.001, x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "background": {
                "description": "Background colour #RRGGBB",
                "type": "string"
              },
              "color": {
                "description": "Foreground colour #RRGGBB",
                "type": "string"
              },
              "ec": {
                "description": "QR error correction level (H when a logo is used)",
                "enum": ["L", "M", "Q", "H"],
                "type": "string"
              },
              "format": {
                "description": "Output image format",
                "enum": ["svg", "png"],
                "type": "string"
              },
              "height_mm": {
                "description": "Bar height for linear barcodes, in mm",
                "type": "number"
              },
              "include_text": {
                "description": "Print the human-readable text under linear barcodes",
                "type": "boolean"
              },
              "logo_url": {
                "description": "QR only: https URL of a PNG/JPEG/WebP logo (max 200 KB) placed in the centre",
                "type": "string"
              },
              "scale": {
                "description": "Size: pixels per module (2D) or bar-width step (1D); default 4 (SVG) / 8 (PNG)",
                "type": "integer"
              },
              "style": {
                "description": "Module style (qrcode, datamatrix)",
                "enum": ["square", "rounded", "dots"],
                "type": "string"
              },
              "text": {
                "description": "Data to encode (URL, text, digits for EAN/UPC/ISBN...)",
                "type": "string"
              },
              "type": {
                "description": "Barcode format",
                "enum": ["qrcode", "datamatrix", "pdf417", "code128", "code39", "ean13", "ean8", "upca", "isbn13", "itf", "gs1_128"],
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
