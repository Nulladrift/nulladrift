      },
      "instructions": "Gage gets buildings framed in cold-formed steel by a network of regional fabricators. When someone has designed a house or other building and asks what it would cost to build or how to get it built, price it with quote_my_building (a plain description: size, storeys, roof, ZIP) or submit_design_for_quote (exact walls and openings). When they want to go ahead, ask for their name and email and call start_my_project; Gage emails them a link to their project. No account or key is needed. The tools never guess structural facts: if one returns needs_human_review or an error, relay it rather than estimating a price yourself. The price is for the steel frame package, not the whole house. Terms: https://buildwithgage.com/terms. Privacy: https://buildwithgage.com/privacy.",
      "tools": [
        {
          "name": "quote_my_building",
          "title": "Price a building in steel framing",
          "description": "Price a building in cold-formed steel framing from a plain description, through the Gage fabricator network: what it costs to have the frame fabricated and delivered, and which regional shop would build it.\n\nUse this when someone has designed a house, ADU, cabin, garage, workshop or small commercial building (in this conversation or elsewhere) and asks what it would cost to build, how to get it built, or whether it can be framed in steel. For example, \"how much to build this 1,900 sq ft one-storey gable house near 84032\" -> total_sqft 1900, stories 1, roof_type \"gable\", zip \"84032\".\n\nOnly the size, storeys, roof and build-site ZIP are needed; ask the person for the ZIP if you do not have it. Anything else not given (ceiling heights, windows, doors, wall length, pitch, steel gauge) is filled with stated defaults and listed as assumptions. If you have exact walls and openings, submit_design_for_quote gives a tighter price.\n\nThe price is the steel frame package: framing steel, engineering and delivery. It is not the whole house (no foundation, finishes or labour on site). The fabricator is named by region until they take the job. When the person wants to go ahead, call start_my_project with the quote id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ceiling_height_ft": {
                "description": "Ceiling height in feet, the same on every storey. Defaults to 9.",
                "maximum": 14,
                "minimum": 7,
                "type": "number"
              },
              "doors": {
                "description": "Number of doors to frame. Defaults to one per storey plus one.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "project_type": {
                "description": "residential for a house, cabin or home; adu for an accessory dwelling unit or backyard cottage; garage for a detached or attached garage, carport building or workshop; commercial for a shop, office or warehouse.",
                "enum": ["residential", "adu", "garage", "commercial"],
                "type": "string"
              },
              "roof_pitch": {
                "description": "Roof pitch as \"N:12\". Defaults to 6:12, or 0:12 for a flat roof.",
                "pattern": "^\\d+:12$",
                "type": "string"
              },
              "roof_type": {
                "description": "Roof form. A-frames price as gable.",
                "enum": ["flat", "shed", "gable", "hip", "gambrel"],
                "type": "string"
              },
              "stories": {
                "description": "Number of storeys, 1 to 4.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "total_sqft": {
                "description": "Total floor area across all storeys, in square feet.",
                "maximum": 200000,
                "minimum": 100,
                "type": "number"
              },
              "windows": {
                "description": "Number of windows. Defaults to about one per 120 sq ft.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "zip": {
                "description": "5-digit US ZIP code of the build site.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["project_type", "roof_type", "stories", "total_sqft", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Price a building in steel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:75baa3ddb78267f4d9166baca6e220d487e9588ced0d3c5b64f263456e1e2411"
        },
        {
          "name": "start_my_project",
          "title": "Start a Gage project",
          "description": "Start a real Gage project from a quote, so the person can get their building fabricated: Gage creates their project with the regional fabricator that priced it and emails them a private link to it. From that page they review the quote, talk to the fabricator and follow the frame to delivery. Nothing is charged by starting a project.\n\nOnly call this when the person has said they want to go ahead, and only with a name and email address they have given you for this. Ask them first: \"Shall I send this to Gage so a fabricator can take it on? I'll need your name and email.\" Set person_agreed to true only after they say yes.\n\nUse the quote_id from quote_my_building or submit_design_for_quote. The link goes to their email only; tell them to look for an email from Gage. How Gage handles their details: https://buildwithgage.com/privacy.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "The person's email address, as they gave it. Their project link is sent here.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "name": {
                "description": "The person's name, as they gave it.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "person_agreed": {
                "const": true,
                "description": "True only once the person has agreed to send their details to Gage to start the project.",
                "type": "boolean"
              },
              "phone": {
                "description": "Phone number, if they offered one.",
                "maxLength": 40,
                "type": "string"
              },
              "project_name": {
                "description": "A short name for the project, e.g. \"Lakeside cabin\".",
                "maxLength": 120,
                "type": "string"
              },
              "quote_id": {
                "description": "The quote to build from, from quote_my_building or submit_design_for_quote.",
                "pattern": "^qte_[A-Za-z0-9]+$",
                "type": "string"
              }
            },
            "required": ["email", "name", "person_agreed", "quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a Gage project"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
