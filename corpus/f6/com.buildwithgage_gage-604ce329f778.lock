        {
          "name": "submit_design_for_quote",
          "title": "Submit a design for a CFS fabrication quote",
          "description": "Submit a building design to Gage and get back a real, buildable cold-formed steel (CFS) framing quote from the Gage fabricator network.\n\nUse this when you have generated or been given a floor plan or 3D house model and need to know what it costs to frame in steel, who would fabricate it, and how it breaks into panels.\n\nGive it structured geometry (levels, walls as start/end points, openings, roof) plus the build site ZIP and project type. It reduces the model to the quoting engine's inputs, checks whether the design can actually be auto-panelized, and returns:\n  - a structural feasibility flag,\n  - an itemized quote (steel, transport, engineering, subtotal, confidence band, fabricator and lead time),\n  - a downloadable preliminary panelization package (panel count, panel footage and totals; the panel-by-panel schedule goes to the Gage fabricator that takes the job).\n\nIt refuses rather than guesses. Geometry that is invalid or outside what the engine prices comes back as a structured error; a design that is legible but needs a structural decision (curved walls, a header over 12 ft, a cantilevered storey, tall walls) comes back with status \"needs_human_review\" and no price. A quote is only ever returned for a design that passed every check.\n\nPricing, tonnage and fabricator routing are computed by Gage API v1, not by this tool. Panelization output is preliminary and unstamped; stamped shop drawings are issued by the assigned fabricator after a quote is accepted.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "design": {
                "properties": {
                  "geometry": {
                    "description": "Inline structured geometry. Preferred.",
                    "properties": {
                      "levels": {
                        "description": "One entry per storey, ground floor first.",
                        "items": {
                          "properties": {
                            "floor_to_ceiling": {
                              "description": "Floor-to-ceiling height, in geometry.units. API v1 accepts 7-14 ft.",
                              "exclusiveMinimum": 0,
                              "type": "number"
                            },
                            "footprint_area": {
                              "description": "Enclosed floor area in geometry.units squared. Omit to have it traced from the closed exterior wall loop.",
                              "exclusiveMinimum": 0,
                              "type": "number"
                            },
                            "index": {
                              "description": "Storey index, 0 = ground floor.",
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            },
                            "name": {
                              "type": "string"
                            },
                            "walls": {
                              "items": {
                                "properties": {
                                  "curved": {
                                    "description": "Set true for any arc or non-straight run. Curved CFS walls are not auto-panelized and route to human engineering.",
                                    "type": "boolean"
                                  },
                                  "end": {
                                    "description": "Plan coordinate [x, y] in geometry.units, measured on the wall centreline.",
                                    "items": [
                                      {
                                        "type": "number"
                                      },
                                      {
                                        "type": "number"
                                      }
                                    ],
                                    "type": "array"
                                  },
                                  "height": {
                                    "description": "Wall height, in geometry.units. Defaults to the level floor_to_ceiling.",
                                    "exclusiveMinimum": 0,
                                    "type": "number"
                                  },
                                  "id": {
                                    "description": "Caller-supplied wall id, echoed back in the panel schedule.",
                                    "type": "string"
                                  },
                                  "load_bearing": {
                                    "description": "Defaults to true for exterior walls, false for interior.",
                                    "type": "boolean"
                                  },
                                  "openings": {
                                    "default": [],
                                    "items": {
                                      "properties": {
                                        "height": {
                                          "description": "Rough opening height, in geometry.units.",
                                          "exclusiveMinimum": 0,
                                          "type": "number"
                                        },
                                        "id": {
                                          "description": "Caller-supplied id, echoed back in the panel schedule.",
                                          "type": "string"
                                        },
                                        "offset": {
                                          "description": "Distance from the wall start point to the near jamb, in geometry.units. Supply it when you want panel seams checked against opening positions.",
                                          "minimum": 0,
                                          "type": "number"
                                        },
                                        "sill_height": {
                                          "description": "Height from finished floor to the sill, in geometry.units.",
                                          "minimum": 0,
                                          "type": "number"
                                        },
                                        "type": {
                                          "description": "Opening type. API v1 counts windows and doors; everything that is not a window is counted as a door because it still needs a header and full-height jambs.",
                                          "enum": ["window", "door", "garage_door", "sliding_door", "cased_opening"],
                                          "type": "string"
                                        },
                                        "width": {
                                          "description": "Rough opening width, in geometry.units.",
                                          "exclusiveMinimum": 0,
                                          "type": "number"
                                        }
                                      },
                                      "required": ["height", "type", "width"],
                                      "type": "object"
                                    },
                                    "type": "array"
                                  },
                                  "start": {
                                    "description": "Plan coordinate [x, y] in geometry.units, measured on the wall centreline.",
                                    "items": [
                                      {
                                        "type": "number"
                                      },
                                      {
                                        "type": "number"
                                      }
                                    ],
                                    "type": "array"
                                  },
                                  "type": {
                                    "default": "exterior",
                                    "enum": ["exterior", "interior"],
                                    "type": "string"
                                  }
                                },
                                "required": ["end", "start"],
                                "type": "object"
                              },
                              "minItems": 1,
                              "type": "array"
                            }
                          },
                          "required": ["floor_to_ceiling", "index", "walls"],
                          "type": "object"
                        },
                        "minItems": 1,
                        "type": "array"
                      },
                      "roof": {
                        "description": "Roof form drives a large share of the steel tonnage, so it is required rather than assumed.",
                        "properties": {
                          "overhang": {
                            "description": "Eave overhang, in geometry.units. Informational.",
                            "minimum": 0,
                            "type": "number"
                          },
                          "pitch": {
                            "description": "Rise over 12 run, e.g. \"6:12\". Use \"0:12\" for flat.",
                            "pattern": "^\\d{1,2}:12$",
                            "type": "string"
                          },
                          "type": {
                            "enum": ["flat", "shed", "gable", "hip", "gambrel"],
                            "type": "string"
                          }
                        },
                        "required": ["pitch", "type"],
                        "type": "object"
                      },
                      "units": {
                        "default": "ft",
                        "enum": ["ft", "in", "m", "mm"],
                        "type": "string"
                      }
                    },
                    "required": ["levels", "roof"],
                    "type": "object"
                  },
                  "model_ref": {
                    "description": "Reference to a hosted model file.",
                    "properties": {
                      "format": {
                        "description": "Only geometry_json (this schema, serialised) is machine-readable in v1. Other formats return unsupported_design_format.",
                        "enum": ["geometry_json", "ifc", "ifcxml", "glb", "gltf", "dxf", "dwg", "rvt", "skp", "pdf"],
                        "type": "string"
                      },
                      "sha256": {
                        "description": "Optional integrity check on the fetched file.",
                        "pattern": "^[0-9a-f]{64}$",
                        "type": "string"
                      },
                      "url": {
                        "description": "HTTPS URL the server can fetch. Must be readable without credentials.",
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "required": ["format", "url"],
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "options": {
                "properties": {
                  "include_panelization": {
                    "default": true,
                    "description": "Generate the panel schedule package when the design is feasible.",
                    "type": "boolean"
                  },
                  "max_panel_length_ft": {
                    "description": "Longest shippable panel. Defaults to the server setting (12 ft).",
                    "exclusiveMinimum": 0,
                    "maximum": 40,
                    "type": "number"
                  },
                  "stud_spacing_in": {
                    "description": "Stud spacing on centre. Defaults to 24 in, matching the engine tonnage model.",
                    "exclusiveMinimum": 0,
                    "maximum": 48,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "project": {
                "properties": {
                  "gauge_spec": {
                    "description": "Steel gauge. Omit only if unknown: the quote then states 18ga as an explicit, disclosed assumption.",
                    "enum": ["25ga", "20ga", "18ga", "16ga"],
                    "type": "string"
                  },
                  "jurisdiction": {
                    "properties": {
                      "ahj": {
                        "description": "Authority having jurisdiction, if known.",
                        "type": "string"
                      },
                      "city": {
                        "type": "string"
                      },
                      "code_cycle": {
                        "description": "Governing code, e.g. \"IRC 2021\" or \"IBC 2021\". Recorded on the submission and surfaced in the compliance block.",
                        "type": "string"
                      },
                      "state": {
                        "maxLength": 2,
                        "minLength": 2,
                        "type": "string"
                      },
                      "zip": {
                        "description": "5-digit US ZIP of the build site. Drives fabricator routing and freight.",
                        "pattern": "^\\d{5}$",
                        "type": "string"
                      }
                    },
                    "required": ["zip"],
                    "type": "object"
                  },
                  "load_zone": {
                    "description": "Site loads. Omitting these means the quote carries no snow/wind/seismic uplift and is flagged as such.",
                    "properties": {
                      "seismic": {
                        "description": "Seismic design category. D and E apply a multiplier.",
                        "enum": ["A", "B", "C", "D", "E"],
                        "type": "string"
                      },
                      "snow_psf": {
                        "description": "Ground snow load. Above 50 psf the engine applies a tonnage multiplier.",
                        "maximum": 300,
                        "minimum": 0,
                        "type": "number"
                      },
                      "wind_mph": {
                        "description": "Ultimate design wind speed. Above 130 mph the engine applies a multiplier.",
                        "maximum": 250,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "square_footage_sqft": {
                    "description": "Declared total floor area. Cross-checked against the geometry; a large mismatch routes to human review.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "stories": {
                    "description": "Declared storey count. Cross-checked against the geometry.",
                    "maximum": 8,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "target_date": {
                    "description": "Desired delivery date. Informational, not priced.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "type": {
                    "description": "garage prices as residential framing and is labelled a garage.",
                    "enum": ["residential", "commercial", "adu", "garage"],
                    "type": "string"
                  }
                },
                "required": ["jurisdiction", "type"],
                "type": "object"
              }
            },
            "required": ["design", "project"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
