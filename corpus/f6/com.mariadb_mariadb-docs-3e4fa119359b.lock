{
  "lockfileVersion": 2,
  "subjects": {
    "com.mariadb/mariadb-docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mariadb.com/docs/~gitbook/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mariadb.com/docs/~gitbook/mcp",
        "title": "MariaDB Documentation MCP Server",
        "version": "0.28.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "getPage",
          "description": "Fetch the full markdown content of a specific documentation page from MariaDB Documentation. Use this when you have a page URL and want to read its content. Accepts full URLs (e.g. https://mariadb.com/docs/getting-started). Since `searchDocumentation` returns partial content, use `getPage` to retrieve the complete page when you need more details. The content includes links you can follow to navigate to related pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The URL of the page to fetch",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get page content"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:86b5d32f4749e92411d367582b221b81f77427882202348da1f5f821faebfe54"
        },
        {
          "name": "searchDocumentation",
          "description": "Search across the documentation to find relevant information, code examples, API references, and guides. Use this tool when you need to answer questions about MariaDB Documentation, find specific documentation, understand how features work, or locate implementation details. The search returns contextual content with titles and direct links to the documentation pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c1e890cdece0ce1c707665a797484055e64c7bac103bf0586b02df8f1493e086"
        },
        {
          "name": "sendFeedback",
          "description": "Report an issue in the documentation of MariaDB Documentation so the team can fix it. Use it whenever, while helping a user, you come across content that is outdated, contradictory, missing information, or otherwise unhelpful. Also use it when the user themselves reports a problem with the docs, even if you could not verify it yourself. If it's your own observation, do a quick sanity check that the issue is real before reporting — no need to exhaustively re-read the page. Send one call per distinct issue and do not report the same issue twice in a conversation. Do not use this tool to confirm that a page is accurate; it is for reporting problems only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Explain the issue in full, as if writing to a documentation maintainer who never saw this conversation. Describe what is wrong, where on the page it appears (quote the exact sentence or section title when possible), what the user was trying to do, and, when relevant, what the correct or expected information should be. Write a few clear, specific sentences in English. Never include personal or confidential information from the conversation. Up to 2048 characters.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "goal": {
                "description": "The broader end goal you were ultimately trying to accomplish (as/on behalf of the user) when you hit this issue. Gives the team the context you were working towards. Optional.",
                "maxLength": 1024,
                "type": "string"
              },
              "pageUrl": {
                "description": "The full URL of the page the issue is about (e.g. https://mariadb.com/docs/getting-started), so the finding is linked to the exact page.",
                "type": "string"
              }
            },
            "required": ["content", "pageUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:21c5cec28d998157d8961dc331969316618f98400853c529d0483a81e1fb4ed7"
        }
      ],
      "digest": "sha256:5b57ddc3d0a71b391a63356418cba4816c671db110eebaeb10d42b3346647dc9"
    }
  }
}
