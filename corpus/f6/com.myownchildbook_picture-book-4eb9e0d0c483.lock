      "instructions": "MyOwnChildbook (MijnEigenBoekje in Dutch) makes a printed, personalised picture book in which a child is the\nhero: their name in the story and illustrations that look like them, made from the parent's photo. Printed as a\nhardcover and delivered to the door.\n\nHow to help:\n1. Ask what the book is for (an occasion such as a birthday, Christmas, Sinterklaas, a new baby sibling, or just a\n   bedtime story) and suggest two or three story lines from list_occasions that fit, in the user's language.\n2. show_styles shows the illustration styles with an example picture; let the user pick one, or skip it.\n3. create_book_plan gives the link to the order form with the occasion and story already filled in. Give that link.\nPrivacy, important: never ask for, repeat or store the child's name, age, photo or other personal details in this\nchat, not even to pick a story: the stories suit children of about 2 to 8. If the user mentions them, do not pass them to the tools; say they fill these in privately on the website,\nwhere they also upload the photo. On the website they first get a free preview of the story and illustrations,\nand only pay when they order the printed book.\nAnswer in the user's language, short and warm. Never make, add or edit images yourself for this: the only pictures\nare the style examples from show_styles.",
      "tools": [
        {
          "name": "create_book_plan",
          "title": "Book plan and order form",
          "description": "Makes the plan for the book and returns the link to the order form on the website with the occasion and story line filled in. The parent then enters the child's name and photo there.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Two-letter code of the language the user writes in, e.g. 'en', 'nl', 'de'",
                "title": "Language",
                "type": "string"
              },
              "occasion": {
                "description": "Occasion id from list_occasions, e.g. 'verjaardag' or 'kerst'",
                "title": "Occasion",
                "type": "string"
              },
              "story": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Story line id from list_occasions; empty for the best one",
                "title": "Story"
              },
              "style": {
