        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "blaze-sports-intel",
        "version": "4.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Blaze Sports Intel MCP provides read-only NCAA Division I college baseball scores, standings, rankings, schedules, match detail, traditional player stats, and sourced web context. Availability is bounded by supported source records. Responses include meta.source, meta.fetched_at, and meta.timezone (America/Chicago); use those fields to state provenance and freshness.",
      "tools": [
        {
          "name": "bsi_get_match_detail",
          "description": "Get detailed information about a specific college baseball game including venue, weather, win predictions, play-by-play, and team stats. Use a match ID from the scoreboard.",
          "inputSchema": {
            "properties": {
              "matchId": {
                "description": "Highlightly match ID (from scoreboard results). e.g., \"993144\".",
                "type": "string"
              }
            },
            "required": ["matchId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0a9851af572a749b2390a471f7f5ee0f35eb9a31ae953dafde7516fe0874b3b9"
        },
        {
          "name": "bsi_get_player_stats",
          "description": "Search supported source records for a college baseball player by name. Returns identity, team, position, and traditional batting or pitching stats when the source provides them.",
          "inputSchema": {
            "properties": {
              "player": {
                "description": "Player name (e.g., \"Jac Caglianone\", \"Charlie Condon\").",
                "type": "string"
              },
              "team": {
                "description": "Team name to disambiguate when multiple players share a name. Optional.",
                "type": "string"
              }
            },
            "required": ["player"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e059ab8c734b88cf039e8e76defd7b4cb762d370b72c4ccf0abea78771d84bee"
        },
        {
          "name": "bsi_get_rankings",
          "description": "Get the national college baseball Top 25 returned by the rankings source. Includes rank, team, record, movement, source, and fetch time.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2007c83988cdae023ff33659cffc8ffe92b757206663d205838bed11d659401f"
        },
        {
          "name": "bsi_get_scoreboard",
          "description": "Get college baseball scores and game results returned by the configured providers. Includes team names, scores, venue, game status, source, and fetch time.",
          "inputSchema": {
            "properties": {
              "conference": {
                "description": "Filter by conference (e.g., \"SEC\", \"Big 12\", \"ACC\"). Optional.",
                "type": "string"
              },
              "date": {
                "description": "Date in YYYY-MM-DD format. Defaults to today (America/Chicago).",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7609793244a68c40266c3eb36f2939225aa64b2c270af0fc51877e0c6ef6d4fa"
        },
        {
          "name": "bsi_get_standings",
          "description": "Get current college baseball conference standings including wins, losses, win percentage, runs scored, runs allowed, run differential, streak, and games back.",
          "inputSchema": {
            "properties": {
              "conference": {
                "description": "Conference name (e.g., \"SEC\", \"Big 12\", \"ACC\", \"Big Ten\"). Optional; omit for all conferences.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c43eab1835641af6cf4d8706d93269d8dd38356267ec54352c92060db1d1709d"
        },
        {
          "name": "bsi_get_team_schedule",
          "description": "Get schedule records returned for a college baseball team, including past results and upcoming games when the source provides them.",
          "inputSchema": {
            "properties": {
              "team": {
                "description": "Team name or slug (e.g., \"texas\", \"lsu\", \"florida-state\").",
                "type": "string"
              }
            },
            "required": ["team"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e4582f7f4e8b29831df135591056dfeb178b3fc43b2506cca4270a484046ab18"
        },
        {
          "name": "bsi_search_intel",
          "description": "Search the open web for college-baseball news, scouting reports, beat-writer coverage, and analytical commentary. Use this when a question needs narrative context. Defaults to trusted college-baseball domains and returns the provider in response metadata.",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "Optional allowlist of domains to search within. Defaults to trusted college-baseball sources. Pass [] to search the open web.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Max results to return. Default 5, min 1, max 10.",
                "type": "number"
              },
              "query": {
                "description": "Natural-language search query (e.g., \"Texas Longhorns baseball weekend series recap\", \"Charlie Condon draft stock 2026\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
