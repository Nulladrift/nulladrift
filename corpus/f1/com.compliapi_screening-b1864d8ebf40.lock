        {
          "name": "screen_name",
          "title": "Screen a name",
          "description": "Screen a person, company, vessel or aircraft name against the primary names and\naliases on the sanctions lists with name coverage (OFAC SDN and Consolidated, UN\nSecurity Council, EU, UK, Swiss SECO, Canada, Australia DFAT, French Trésor, Japan MOF).\nFuzzy, order- and accent-insensitive; each match has a 0-100 `score` and `reasons`.\n`type` restricts to one party type. `birth_date` (YYYY, YYYY-MM or YYYY-MM-DD)\nexcludes listed individuals whose birth dates all disagree; `country` (ISO code or\nname) ranks matches by listed nationality/address/flag; `id_number` (passport, national\nID or registration number) ranks a party listing that document first. `threshold`: minimum score\n(50-100, default 85). `lists`: optional comma-separated list slugs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birth_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "id_number": {
