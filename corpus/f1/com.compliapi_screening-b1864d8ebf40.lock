        {
          "name": "screen_name",
          "title": "Screen a name",
          "description": "Screen a person, company, vessel or aircraft name against the primary names and\naliases on the sanctions lists with name coverage (OFAC SDN and Consolidated, UN\nSecurity Council, EU, UK, Swiss SECO, Canada, Australia DFAT, New Zealand, French Trésor, Japan MOF)\nand on the US export-control and debarment lists (`us_csl`: BIS Entity List, Denied\nPersons, Unverified, Military End User; ITAR Debarred; State nonproliferation\nsanctions), whose matches set `flagged`, never `sanctioned`, and carry no party type.\nIt also checks FinCEN's special measures (`us_fincen_special_measures`: institutions of\nprimary money laundering concern under Section 311 and related statutes), flagged, never\nsanctioned; `metadata.status` is `final` or `proposed`.\nFuzzy, order- and accent-insensitive; each match has a 0-100 `score` and `reasons`.\n`type` restricts to one party type. `birth_date` (YYYY, YYYY-MM or YYYY-MM-DD)\nexcludes listed individuals whose birth dates all disagree; `country` (ISO code or\nname) ranks matches by listed nationality/address/flag; `id_number` (passport, national\nID or registration number) ranks a party listing that document first. `threshold`: minimum score\n(50-100, default 85). `lists`: optional comma-separated list slugs. `limit`: maximum\nmatches (1-25, default 10). `ref`: optional reference of your own, echoed and recorded\non the audit trail.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birth_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
