      "instructions": "Sanctions and financial-crime screening. Screen names (people, companies, vessels, aircraft), crypto addresses, emails, websites, government IDs, ship IMO numbers/MMSIs and aircraft registrations across multiple source lists — US OFAC SDN, FBI Lazarus Group addresses, Israel NBCTF seizures, the French Trésor register, Japan MOF sanctions, the EU consolidated list, the UK Sanctions List (FCDO), the Swiss SECO sanctions list, the UN Security Council Consolidated List, Canada's Consolidated Autonomous Sanctions List, Australia's DFAT Consolidated List, ransomwhe.re ransomware addresses, the ScamSniffer and MetaMask crypto phishing-domain blocklists (websites only), Tornado Cash association lists (depositors/relayers, plus an opt-in withdrawal-recipient list), and the addresses frozen by the stablecoin issuers Tether (USDT) and Circle (USDC, plus EURC on Ethereum and Base) on Ethereum, TRON and the main EVM networks, and by Paxos (PYUSD, USDP, USDG) on Ethereum. Every match names its list; `sanctioned` means a government sanctions list matched, `flagged` also covers crime-intelligence and risk-exposure lists. Name screening (screen_name) fuzzy-matches primary names and aliases on the OFAC SDN and Consolidated, UN Security Council, EU, UK, Swiss SECO, Canadian, Australian DFAT, New Zealand, French Trésor and Japan MOF lists, plus the US export-control and debarment lists (BIS Entity List, Denied Persons, Unverified, Military End User; ITAR Debarred; State nonproliferation sanctions) and FinCEN's special measures against institutions of primary money laundering concern (Section 311 and related) — both set `flagged`, never `sanctioned` — with a 0-100 score and reasons per match. Ships (screen_vessel: IMO number or MMSI) and aircraft (screen_aircraft: registration, serial number or Mode S code) are screened by exact identifier. Country designations are OFAC's; the FATF black and grey lists are checked only when `lists` names `fatf` (flagged, never sanctioned). VPN detection and IP geolocation are utilities; inspect_ip does both plus the country screen in one call. PEP screening (screen_pep) checks a person's name against the OpenSanctions politically-exposed-persons dataset with scored matching.",
