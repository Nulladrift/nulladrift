              "lists": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "name": {
                "type": "string"
              },
              "threshold": {
                "default": 85,
                "type": "number"
              },
              "type": {
                "anyOf": [
                  {
                    "enum": ["individual", "entity", "vessel", "aircraft"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
