{
  "lockfileVersion": 2,
  "subjects": {
    "com.neuronto/x402-payments-facilitator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pay.neuronto.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "neuronto-payments",
        "title": "Neuronto Payments: x402 facilitator",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "buy_credits",
          "description": "How to buy Neuronto credits, the one prepaid balance for every paid Neuronto call (searches past the free allowance, multi-step discovery, the change feed, publisher monitoring, gateway fees): the packs, what each thing costs, and the x402 URL to pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pack": {
                "enum": ["1", "5", "20", "50"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:636192fef209b2ae7d4b4b5fa6e2554d4e7d3992c3368dd8ead51bfe81e47a69"
        },
        {
          "name": "facilitator_status",
          "description": "What this x402 facilitator can settle right now: the live networks and schemes, whether the echo merchant is serving, the state of address screening, observed availability and settlement counts. Call this before advertising a price, because a network that cannot settle is withdrawn here first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f64aa4ee1ba10e92643c7d5ebdfffd1bb02bba752b198050928b0f3b847a6001"
        },
        {
          "name": "find_paid_resource",
          "description": "Search the catalogue of resources that have been paid for through this facilitator: the URL, the terms, the method, and the input and output shapes where the merchant published them. A resource is listed only after a real settlement and a probe, so nothing here is a claim by its owner.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "description": "CAIP-2 network to restrict to.",
                "type": "string"
              },
              "query": {
                "description": "Words to match in the URL or description.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28ecc902ef0c8da777c78bd9d3c3b39a0ac4a90cd2637919dc66fdce66c69806"
        },
        {
          "name": "integration_snippet",
          "description": "Working code to start charging for a route through this facilitator, in the language and framework you name, plus a live URL to test the client against. Copy it as it is; the only thing to change is the wallet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "framework": {
                "enum": ["express", "hono", "next", "fastapi"],
                "type": "string"
              },
              "language": {
                "enum": ["typescript", "python"],
                "type": "string"
              },
              "role": {
                "description": "server to charge for a route, client to pay for one.",
                "enum": ["server", "client"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:11904352adaeb8e8be620b5dbc137ee084e14c9ff6dead0ebc4ce5827cd6d4d5"
        },
        {
          "name": "monetize_api",
          "description": "Put an existing HTTPS API behind x402 without changing its code: returns a paid URL that answers 402 with your price, forwards paid calls to your API, and settles each payment straight to your wallet. 1,000 paid calls a month free, then 1% from prepaid credits. Pass your key, or omit it and a new one is returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "type": "string"
              },
              "key": {
                "description": "Your Neuronto key (nc_ or nk_). Omit to get one.",
                "type": "string"
              },
              "name": {
                "description": "What buyers see, for example 'Weather API'.",
                "type": "string"
              },
              "pay_to": {
                "description": "Your EIP-55 checksummed wallet address.",
                "type": "string"
              },
              "price_usd": {
                "description": "Price per call in US dollars, paid in USDC.",
                "maximum": 100,
                "minimum": 0.001,
                "type": "number"
              },
              "upstream": {
                "description": "Your API's https base URL.",
                "type": "string"
              }
            },
            "required": ["name", "pay_to", "price_usd", "upstream"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:96832482aa1909430ee35a53ee83e71c860ab0c45f6cfc9d64daee1ba52d6348"
        },
        {
          "name": "settlement_price",
          "description": "What a settlement costs through this facilitator, per network, with the basis it was computed from. Free while the service is in launch pricing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "network": {
                "description": "CAIP-2 network, for example eip155:8453. Omit for every network.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c99510c7ed6fe5707edfaabcbc8690f224b2ccd7cc91ec7c3a2e7a662b6c6b6a"
        }
      ],
      "digest": "sha256:6f9ed1a7f80aef8c0b78bfa3cd8cb77d1e94908d4e0a8b804c1c5f1d2bc71283"
    }
  }
}
