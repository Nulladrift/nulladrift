                "default": null,
                "description": "An incumbent by name or UEI, e.g. \"Leidos\".",
                "title": "Company"
              },
              "limit": {
                "default": 20,
                "description": "How many contracts to return, 1-50 (default 20).",
                "title": "Limit",
                "type": "integer"
              },
              "min_value": {
                "default": 1000000,
                "description": "Smallest current contract value in dollars (default 1,000,000).",
                "title": "Min Value",
                "type": "number"
              },
              "months": {
                "default": 12,
                "description": "Contracts ending within this many months, 1-24 (default 12).",
                "title": "Months",
                "type": "integer"
              },
              "naics": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A NAICS code or industry words, e.g. \"541512\" or \"janitorial\".",
                "title": "Naics"
              },
              "q": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
