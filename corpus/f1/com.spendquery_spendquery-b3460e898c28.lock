        {
          "name": "browse_codes",
          "title": "Browse industry and product codes",
          "description": "Browse what the government buys, with contract spend. kind: psc (products and services)\n    | naics (industries). No group and no query -> the groups (PSC: services by letter, e.g. D =\n    IT services, R = professional support; products by 2 digits, e.g. 84 = clothing and\n    individual equipment; NAICS: 2-digit sectors), largest first. group -> the codes in it.\n    query -> codes whose name contains the words. Default year: last complete fiscal year.\n    Use a code or its name in a plan's psc / naics filter.",
          "inputSchema": {
            "properties": {
              "fiscal_year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Federal fiscal year (October-September), e.g. 2025; default the last complete one.",
                "title": "Fiscal Year"
              },
              "group": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A group to list the codes in: a PSC letter or 2-character group (e.g. \"D\", \"84\") or a 2-digit NAICS sector (e.g. \"54\").",
                "title": "Group"
              },
              "kind": {
                "default": "psc",
                "description": "psc (products and services) or naics (industries).",
                "enum": ["psc", "naics"],
                "title": "Kind",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Most rows to return, 1-200.",
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Words in a code's name, e.g. \"body armor\", \"janitorial\".",
                "title": "Query"
              }
            },
            "title": "browse_codesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse industry and product codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
