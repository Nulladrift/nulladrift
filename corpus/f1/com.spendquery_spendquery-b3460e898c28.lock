        {
          "name": "find_bid_portals",
          "title": "Find where a state, county or city posts its bids",
          "description": "Where to bid in a place: the state's, county's or city's own bid / procurement portal,\n    the platform it runs on (Bonfire, OpenGov, DemandStar, PlanetBids, BidNet Direct...), its open\n    bids list when known (open_bids_url: give that link first), department bid pages (more_links),\n    where vendors register, and the levels above it (a city's county and state). Covers every state and\n    territory, every county with a county government and the cities and towns of 10,000+; a smaller place gets its state's\n    portal. status: confirmed (the bid page was checked), listed (added by hand; the site blocks\n    automated checks) or site_only (only the official site so far: say the bid page isn't\n    confirmed; no site means no working official website was found, so point to the county and\n    state instead). in_spendquery: sources whose bids or contracts search_local_bids already has.\n    certification_and_help: the state's own small-business certifications (Texas HUB, Virginia\n    SWaM...; empty when it has none) and the national help (APEX Accelerators, SBDCs, SBA\n    certifications). For a city, open_federal_notices_url lists the open SAM.gov notices performed\n    there (search_notices with state and city gives them as data).\n    SpendQuery links to these portals; it doesn't copy their bids.",
          "inputSchema": {
            "properties": {
              "place": {
                "description": "A state, county or city as people write it: \"Simi Valley, CA\", \"Ventura County, California\", \"Texas\".",
                "title": "Place",
                "type": "string"
              }
            },
            "required": ["place"],
            "title": "find_bid_portalsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find where a state, county or city posts its bids"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0117555eee78b9ecb0d50d3b56768b257d1942cabc6a1b79bef02b89cafcafa3"
