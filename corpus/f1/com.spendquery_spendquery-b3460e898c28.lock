      "instructions": "SpendQuery answers questions about US federal spending (USAspending.gov prime\nawards: contracts, grants, loans, direct payments). Amounts are obligations (money committed),\nnot outlays.\n\nHow to answer a question:\n1. Call get_catalog once: it lists metrics, dimensions, analyses, the QueryPlan JSON schema,\n   planning rules and worked examples for federal questions (section=\"states\" for state,\n   county and city checkbooks).\n2. Write a QueryPlan in business terms (e.g. filters [{\"dimension\": \"agency\", \"values\": [\"DoD\"]}]).\n   Put names as the user said them; the server resolves them. Use search_codes /\n   search_recipients when you need to check a name, code or company first, and browse_codes\n   to explore products/services (PSC) or industries (NAICS) with their spend.\n3. Call run_plan. If status is \"clarify\", ask the user the returned question.\n4. Report the answer with its caveats; mention that amounts are obligations.\n\nThings that trip planners up:\n- A company's total comes from run_plan with a company filter (it rolls up subsidiaries).\n  search_recipients' obligations are one registration's own money: a parent UEI often has\n  little or none of its own (it can even be negative), because the money sits on its units.\n- Give fiscal_years. Without them a plan sums every loaded year, including the year in\n  progress (see coverage in run_plan's reply; Defense publishes about 90 days late).\n- award_category is singular: \"contract\" or \"assistance\". Growth is analysis \"compare\" with\n  baseline_years. \"Businesses only\" is a filter (business_type / recipient_type), not a field.\n- Company and recipient rankings leave out payments with no recipient ID (aggregate payments\n  to individuals); the answer says how much was left out.\n- For one contract notice (fit, incumbent, deadline, what changed), call get_notice with its id.\n  For small-business size, size_standard; to find a company's NAICS codes, naics_finder; for\n  which GWACs or IDIQs carry an industry's money, vehicle_match.\n- Where a state, county or city posts its own bids (portal, platform, vendor registration):\n  find_bid_portals (\"Simi Valley, CA\"); its bids themselves, where SpendQuery loads them:\n  search_local_bids.\n- Within a distance of a place (\"40 miles of Los Angeles\", \"near 93065\"): search_notices with\n  near + miles for open notices (each with its miles); for money, run_plan with a filter\n  {\"dimension\": \"near\", \"values\": [\"40 miles of Los Angeles, CA\"]} (the counties in the circle).\n- State, county and city bids and contracts (not federal awards): search_local_bids. SBIR and\n  STTR awards and who received them (SBA's SBIR.gov records since 1983): sbir_awards. The FAR\n  and DFARS: search_far, then get_far_section. Federal grant opportunities open on Grants.gov\n  (or forecast), by topic and who may apply: grant_opportunities. Who does a kind of work as\n  prime and as subcontractor, and prime -> subcontractor pairs (teaming leads):\n  primes_and_subcontractors.\n- One-step tools that need no QueryPlan: search_notices (open SAM.gov notices by words, NAICS,\n  place, set-aside, agency), company_profile (one company's federal profile), recompetes\n  (contracts ending soon, with the incumbent) and award_prices (typical award sizes and GSA labor\n  rates, for pricing). Prefer them to run_plan for those questions.\n- For a bid / no-bid memo on a notice, the open work a company qualifies for, market research\n  for a requirement, or a sources-sought reply, the prompts bid_no_bid, qualified_work,\n  market_research and sources_sought_reply give the steps.\n- Each API key has a daily call limit; replies over HTTP carry X-Quota-Limit,\n  X-Quota-Remaining and X-Quota-Reset (seconds to 00:00 UTC).",
      "tools": [
        {
          "name": "award_prices",
          "title": "Look up typical award sizes and labor rates",
          "description": "For pricing a bid: what contracts in an industry (and state) are typically worth over the\n    last three complete fiscal years (percentiles of award values by kind: definitive contracts,\n    purchase orders, orders under vehicles; by set-aside and competition), and GSA schedule\n    ceiling hourly rates (CALC+) for a labor category. Never a suggested price.",
          "inputSchema": {
            "properties": {
              "labor_category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A labor category for GSA ceiling rates, e.g. \"senior software engineer\".",
                "title": "Labor Category"
              },
              "naics": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A NAICS code, 2-6 digits, e.g. \"561720\".",
                "title": "Naics"
              },
              "small_business_rates": {
                "default": false,
                "description": "Labor rates of small businesses only.",
                "title": "Small Business Rates",
                "type": "boolean"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A state code to narrow award sizes, e.g. \"VA\".",
                "title": "State"
              }
            },
            "title": "award_pricesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up typical award sizes and labor rates"
