        {
          "name": "recompetes",
          "title": "Find contracts coming up for re-bid",
          "description": "The recompete pipeline: contracts ending in the next months with the incumbent, value,\n    how they were bought (offers received, set-aside, vehicle) and the likeliest follow-on\n    SAM.gov notice when one is posted, soonest ending first. Filters take names as people say\n    them (VA, 541512, IT services, Leidos).",
          "inputSchema": {
            "properties": {
              "agency": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "An agency, bureau or office, e.g. \"Army\", \"VA\".",
                "title": "Agency"
              },
              "company": {
                "anyOf": [
                  {
                    "type": "string"
                  },
