      "serverInfo": {
        "name": "pumpfun-replay",
        "title": "Backtest your past pump.fun picks on the bonding curve and PumpSwap",
        "version": "0.1.0",
        "websiteUrl": "https://replay.loopholetape.com/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "This server replays the past picks of a pump.fun trading bot against the trades that really happened on the chain. Give try_from_wallet a public wallet address to compare the newest entry it can price among its first three eligible buys, or use check_picks on a document first, then replay_first_pick for a free sample, and read how_to_buy_a_full_run before paying for a whole document, which is done with a plain HTTP request and not through this endpoint. The replay inserts the bot's order and keeps everyone else's orders as they were, so it is a calculation on public records and no advice on what to trade.",
      "tools": [
        {
          "name": "check_picks",
          "title": "Check a picks document",
          "description": "Call this first, and it is free. Give the picks document of a pump.fun trading bot, and it says whether the replay would take it, with a sentence that names what to change if not, and whether its first pick fits the free sample. It checks the optional landing rate and sample size or send log without reading the chain.",
