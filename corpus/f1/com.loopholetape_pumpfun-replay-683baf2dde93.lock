{
  "lockfileVersion": 2,
  "subjects": {
    "com.loopholetape/pumpfun-replay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://replay.loopholetape.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "pumpfun-replay",
        "title": "Replay for pump.fun bots",
        "version": "0.1.0",
        "description": "Replays the past picks of a pump.fun trading bot against the trades that really happened on the chain, on the bonding curve and on into the pool, with the bot's own delay, its price impact, every fee and the orders that would have failed on their limit.",
        "websiteUrl": "https://replay.loopholetape.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This server replays the past picks of a pump.fun trading bot against the trades that really happened on the chain. Use check_picks on a document first, then replay_first_pick for a free sample, and read how_to_buy_a_full_run before paying for a whole document, which is done with a plain HTTP request and not through this endpoint. The replay inserts the bot's order and keeps everyone else's orders as they were, so it is a calculation on public records and no advice on what to trade.",
      "tools": [
        {
          "name": "check_picks",
          "title": "Check a picks document",
          "description": "Call this first, and it is free. Give the picks document of a pump.fun trading bot, and it says whether the replay would take it, with a sentence that names what to change if not, and whether its first pick fits the free sample. It does not look at the chain.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "document": {
                "additionalProperties": false,
                "properties": {
                  "picks": {
                    "description": "The picks to replay. Each one is replayed by itself, so two picks on the same coin do not feel each other.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "decision": {
                          "description": "The moment the bot decided. A whole number is a Unix time in seconds and means the start of that second. An object with slot and index means directly after the transaction at that position in the slot.",
                          "oneOf": [
                            {
                              "minimum": 0,
                              "type": "integer"
                            },
                            {
                              "additionalProperties": false,
                              "properties": {
                                "index": {
                                  "minimum": 0,
                                  "type": "integer"
                                },
                                "slot": {
                                  "minimum": 0,
                                  "type": "integer"
                                }
                              },
                              "required": ["index", "slot"],
                              "type": "object"
                            }
                          ]
                        },
                        "exit": {
                          "description": "The rule by which the bot sells: after a holding time, or at a rise or a fall with a time limit.",
                          "oneOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "seconds": {
                                  "maximum": 3600,
                                  "minimum": 0,
                                  "type": "integer"
                                },
                                "type": {
                                  "const": "time"
                                }
                              },
                              "required": ["seconds", "type"],
                              "type": "object"
                            },
                            {
                              "additionalProperties": false,
                              "properties": {
                                "down_bps": {
                                  "maximum": 10000,
                                  "minimum": 1,
                                  "type": "integer"
                                },
                                "max_seconds": {
                                  "maximum": 3600,
                                  "minimum": 0,
                                  "type": "integer"
                                },
                                "type": {
                                  "const": "threshold"
                                },
                                "up_bps": {
                                  "minimum": 1,
                                  "type": "integer"
                                }
                              },
                              "required": ["down_bps", "max_seconds", "type", "up_bps"],
                              "type": "object"
                            }
                          ]
                        },
                        "id": {
                          "description": "Your own name for the pick, different for each pick of a document.",
                          "maxLength": 128,
                          "minLength": 1,
                          "type": "string"
                        },
                        "mint": {
                          "description": "The coin's mint address in base58.",
                          "maxLength": 44,
                          "minLength": 32,
                          "type": "string"
                        },
                        "slippage_bps": {
                          "description": "The slippage the bot allows, in hundredths of a percent.",
                          "maximum": 10000,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "stake_lamports": {
                          "description": "What the bot puts in, with fees included, in lamports.",
                          "maximum": 100000000000,
                          "minimum": 1000000,
                          "type": "integer"
                        }
                      },
                      "required": ["decision", "exit", "id", "mint", "slippage_bps", "stake_lamports"],
                      "type": "object"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "type": "array"
                  },
                  "settings": {
                    "additionalProperties": false,
                    "description": "How the bot's own orders behave. Every field is optional and has the default given here.",
                    "properties": {
                      "base_fee": {
                        "default": 5000,
                        "description": "Network fee of one transaction in lamports.",
                        "minimum": 0,
                        "type": "integer"
                      },
                      "delay_ms": {
                        "default": 800,
                        "description": "Milliseconds from the bot's decision to the landing of its order, rounded up to whole slots.",
                        "maximum": 10000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "placement": {
                        "default": "last",
                        "description": "Where in its landing slot the order sits: after the recorded transactions of the slot (last), or before them (first, after_trigger).",
                        "enum": ["last", "first", "after_trigger"],
                        "type": "string"
                      },
                      "priority_fee": {
                        "default": 0,
                        "description": "Priority fee of one transaction in lamports.",
                        "minimum": 0,
                        "type": "integer"
                      },
                      "quiet_seconds": {
                        "default": 60,
                        "description": "Seconds without a real trade after which the replay treats a coin as no longer trading.",
                        "maximum": 86400,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "slot_ms": {
                        "default": 400,
                        "description": "Length of one slot in milliseconds.",
                        "maximum": 10000,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "tip": {
                        "default": 0,
                        "description": "Tip paid with one transaction in lamports.",
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  }
                },
                "required": ["picks"],
                "type": "object"
              }
            },
            "required": ["document"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a picks document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a06282f73dbed0e11b60dcdf1278458553e5a90bf7c5e06f8b61aca9708926d6"
