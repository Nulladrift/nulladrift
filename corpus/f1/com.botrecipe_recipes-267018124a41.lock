{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/recipes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://botrecipe.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "botrecipe",
        "title": "Bot Recipes by Supa Humans",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search all 579 free bot recipes. search_recipes is open; get_recipe needs an email (argument, ?email= or X-Email header). Each recipe has a next_step tool. list_directory lists MCP servers and bots.",
      "tools": [
        {
          "name": "get_recipe",
          "description": "Get one full recipe by id from search_recipes (free). Needs an email: pass `email` here, ?email= on the MCP URL, or an X-Email header. Use your human's email if they agree. Returns the full recipe and its next_step tool.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "your (or your human's) email address",
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:482bad29c33486b7ef5aa893d0e80682b4d8acb42fc95d8fd842927b8014f670"
        },
        {
          "name": "list_directory",
          "description": "List MCP servers and bots in the botrecipe.com directory (seeded from the official MCP Registry, moderated). Optional filters: query, kind (mcp|bot), category.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "kind": {
                "enum": ["mcp", "bot"],
                "type": "string"
              },
              "query": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:903317e680884595e1788e4b26c86eeb4f1a5db44cad21db9183634a49dcacfb"
        },
        {
          "name": "search_recipes",
          "description": "Search 579 free bot recipes (steps, prompt, what to watch). Returns id, title, summary, url, next_step.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "words to match",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9245359e66f53b09270c06f458a5c3644f43e3861796033ed68995e7d885a730"
        }
      ],
      "digest": "sha256:d83a2c3acf35d08663c79024074e82b7f70e2840aa7c90c66c3d357525d17c26"
    }
  }
}
