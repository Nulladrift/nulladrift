      "serverInfo": {
        "name": "unmerge",
        "title": "Unmerge",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Unmerge splits a flat image into named transparent layers (PNG each), filling in what was hidden. Use split_into_layers with an image URL or base64; it costs 1 credit per layer returned. If it returns status \"processing\", call get_layers with the project id. Layer URLs expire after one hour; the workspace_url opens the layers in the browser, where the user can export a PSD.",
      "tools": [
        {
          "name": "get_credits",
          "title": "Credits left",
          "description": "Credits available on this Unmerge account. One credit is one layer returned.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:551f0d3383b11c527743a7e51cb181e147eb7abaca2a159dc2bd021742264871"
        },
        {
          "name": "get_layers",
          "title": "Get the layers of a split",
          "description": "Status of a split. When ready, returns every layer with its name, position and a PNG download URL valid for one hour. Free.",
          "inputSchema": {
            "properties": {
              "project_id": {
                "description": "The id returned by split_into_layers.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "wait_seconds": {
                "description": "How long to wait for the result before returning, 0 to 50 seconds.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1974cee905dddb45bf7c3f3edb2866190c97061927d71dc7a4b59dba90876460"
        },
        {
          "name": "split_into_layers",
          "title": "Split an image into layers",
          "description": "Split a flat image (PNG, JPG or WebP) into named transparent layers, with the hidden parts behind objects filled in. Costs 1 credit per layer returned (at most 17); the account needs at least 5 credits to start. Pass the image as a public https URL or as base64. Waits up to 50 seconds; if it is still processing, call get_layers later.",
          "inputSchema": {
            "properties": {
              "image_base64": {
                "description": "The image as base64, with or without a data: prefix. Use when there is no URL.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of the image.",
                "format": "uri",
                "type": "string"
              },
              "prompt": {
                "description": "Optional: what to separate, in plain words, e.g. \"the cat, the sofa and the background\". Leave empty to let the model decide.",
                "maxLength": 500,
                "type": "string"
              },
              "wait_seconds": {
                "description": "How long to wait for the result before returning, 0 to 50 seconds.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e534bd6e48dd04fa911138627444a02ba6557c8938b60d17e6ff79dfb3586c40"
        },
        {
          "name": "unlock_layers",
          "title": "Unlock layers",
          "description": "For a split with status needs_credits: pay the extra credits owed (shown as credits.owed) so the layer files become available. Charges once even if called again.",
          "inputSchema": {
            "properties": {
              "project_id": {
                "description": "The id returned by split_into_layers.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
