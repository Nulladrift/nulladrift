{
  "lockfileVersion": 2,
  "subjects": {
    "ch.fedlex-connector/fedlex-connector": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fedlex-connector.ch/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fedlex-connector",
        "version": "1.0.0",
        "icons": [
          {
            "src": "https://fedlex-connector.ch/logo.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://fedlex-connector.ch/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          },
          {
            "src": "https://fedlex-connector.ch/favicon-32.png",
            "mimeType": "image/png",
            "sizes": ["32x32"]
          },
          {
            "src": "https://fedlex-connector.ch/favicon-16.png",
            "mimeType": "image/png",
            "sizes": ["16x16"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_article",
          "description": "Retrieve a single article when you already know the EXACT article number (e.g. from a cross-reference). Do NOT call this tool repeatedly to search for provisions — use get_law_text instead to fetch the full act or a section and locate relevant articles in the text.",
          "inputSchema": {
            "properties": {
              "article": {
                "description": "Article number (e.g. '3', '28a', '41')",
                "type": "string"
              },
              "date": {
                "description": "Consolidation date in YYYY-MM-DD format. Defaults to the latest available version.",
                "type": "string"
              },
              "language": {
                "description": "Language (default: de)",
                "enum": ["fr", "de", "it"],
                "type": "string"
              },
              "rs_number": {
                "description": "RS/SR number (e.g. '210' for CC, '220' for CO, '311.0' for CP)",
                "type": "string"
              }
            },
            "required": ["article", "rs_number"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f6b0686adca4af7199060de73df10eddfecbe47f10df5a11f0f137b6a1b6373"
        },
        {
          "name": "get_law_text",
          "description": "Retrieve the official consolidated text of a Swiss federal act (or a specific title/chapter) directly from Fedlex (fedlex.admin.ch). This is the PRIMARY tool for answering Swiss law questions — always start here. Fetch the full act or a specific section, then locate relevant provisions in the returned text. Prefer this over get_article unless you already know the exact article number.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language (default: de)",
                "enum": ["fr", "de", "it"],
                "type": "string"
              },
              "page": {
                "description": "Page number for paginated results (default: 1). Large acts are split across multiple pages.",
                "type": "number"
              },
              "rs_number": {
                "description": "RS/SR number (e.g. '210' for CC, '220' for CO)",
                "type": "string"
              },
              "section": {
                "description": "Limit to a specific title, chapter, or part (e.g. 'Titre huitième', 'Zweiter Teil'). If omitted, returns the full act.",
                "type": "string"
              }
            },
            "required": ["rs_number"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:147934c41f80aca14c49bacd38a234bb3e2d4cac607a246d1d972fa7f1b8c9b1"
        },
        {
          "name": "list_amendments",
          "description": "List consolidation version dates for a Swiss federal act. Returns the dates each consolidated version took effect.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language for amendment titles (default: de)",
                "enum": ["fr", "de", "it"],
                "type": "string"
              },
              "rs_number": {
                "description": "RS/SR number",
                "type": "string"
              },
              "since": {
                "description": "Start date in YYYY-MM-DD format (default: 1 year ago)",
                "type": "string"
              }
            },
            "required": ["rs_number"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c719236c2a26c6d3bf594993216d846233a8eced7a56879dd39d8cad9db5ca1a"
        },
        {
          "name": "search_by_title",
          "description": "Search Swiss federal legislation titles in the Classified Compilation (RS/SR) on Fedlex. Use to find the RS number of a law when you know its name but not its number. Searches titles only, not article content. Returns only acts currently in force.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language for results (default: de)",
                "enum": ["fr", "de", "it"],
                "type": "string"
              },
              "query": {
                "description": "Keywords to match against act titles (e.g. 'code civil', 'protection des données')",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:848afa87e3d57f801d4c151e158a401bd1e755f08fe51e197d5432b712d27e05"
        }
      ],
      "digest": "sha256:1ebcf4634ce123c043ac6260153771842b00a70f3529ac84f8936eac2826dc0b"
    }
  }
}
