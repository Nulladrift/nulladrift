          "digest": "sha256:e42b5b22e985370a91b7f87663a9c4050b8c3d1b29dda2d064f69298ef9b8df9"
        },
        {
          "name": "get_glossary",
          "title": "Glossário yoruba",
          "description": "O glossário do site (mais de 70 termos: Odu, Aché, ebó, babalawo, patakí…), com as variantes de grafia do Candomblé, da Santería e da Nigéria. Sem `term` devolve tudo, por seção; com `term` devolve só os verbetes que casam.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "pt-BR",
                "description": "Idioma da resposta: pt-BR (base), en, es.",
