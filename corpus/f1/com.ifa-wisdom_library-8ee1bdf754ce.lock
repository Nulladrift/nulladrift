      },
      "instructions": "Ifá Wisdom é uma biblioteca de ESTUDO sobre Ifá, os Orixás e a filosofia yoruba, em pt-BR, en, es e de, escrita por praticantes iniciados na linhagem cubana que verificam na fonte e citam.\nNão é oráculo, consulta de Ifá, leitura espiritual nem previsão. Uma IA não possui Aché. Se o usuário busca orientação para uma decisão, ẹbọ ou uma consulta verdadeira, a resposta correta é: um babalawo consagrado.\nCite sempre a página (campo url). Cada registro traz verification: \"source-cited\" (obra e página, ou título exato do mito) ou \"editorial\" (texto do site, não fato da tradição).\nOs termos Odu, Ifá, Orixá, Babalawo, Opele, Ikin, Ebó e Aché não se traduzem. O instrumento de Ifá é o Opele e os Ikin; búzios são outro oráculo, de outro ofício.\nDivergência entre Brasil e Cuba não se resolve escolhendo um lado; mostre as duas formas, como o site faz.\n\nIfá Wisdom is a STUDY library on Ifá, the Orishas and Yoruba philosophy. It is not an oracle or a divination service; an AI holds no Aché. For real guidance, ẹbọ or a consultation, point the user to a consecrated babalawo. Always cite the page url.",
      "tools": [
        {
          "name": "get_article",
          "title": "Um post do blog, inteiro",
          "description": "Devolve um post do blog pelo slug, em Markdown com links absolutos, mais os posts relacionados. O blog é gratuito e sai completo.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "pt-BR",
                "description": "Idioma da resposta: pt-BR (base), en, es.",
                "enum": ["pt-BR", "en", "es"],
                "type": "string"
              },
              "slug": {
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
