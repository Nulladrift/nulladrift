        {
          "name": "search_library",
          "title": "Buscar na biblioteca do Ifá Wisdom",
          "description": "Busca por termo em toda a biblioteca: os 256 Odus (nomes yorubá e lucumí), os Orixás (grafias do Brasil, de Cuba e da Nigéria), os Estudos, os posts do blog e o glossário. Devolve os melhores resultados com a URL da página. Use antes de get_odu / get_orixa / get_article quando não souber o slug.",
