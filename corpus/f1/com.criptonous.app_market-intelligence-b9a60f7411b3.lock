      "instructions": "CriptoNous sells crypto market intelligence to AI agents over x402. Start with temple_catalog (public). precision_score is public audit math (Brier, reliability, historical backtest), not a trade. Paid flow: temple_request_tribute → pay exact USDC → temple_verify → temple_consume_pass. Tools other than temple_catalog and precision_score need an agent API key (Authorization: Bearer <key>). Analysis only, no trade execution. NFA — Inteligencia de mercado / análisis. No es consejo financiero ni orden de compra/venta.",
      "tools": [
