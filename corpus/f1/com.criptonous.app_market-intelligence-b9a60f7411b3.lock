          "name": "precision_score",
          "title": "Auditable precision score",
          "description": "Puntaje auditable del ledger vivo (Brier, log-loss, 10 bins, Wilson, moneda 50 % y persistencia) y el backtest histórico si ya se calculó. Sin % públicos si n < 30. No es en vivo. NFA.",
