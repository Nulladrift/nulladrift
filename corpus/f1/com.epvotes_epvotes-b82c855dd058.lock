    "com.epvotes/epvotes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://epvotes.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "com.epvotes/epvotes",
        "title": "EP Votes",
        "version": "1.0.0",
        "description": "European Parliament roll-call votes, MEP records and dossiers from official records.",
        "websiteUrl": "https://epvotes.com/ai",
        "icons": [
          {
            "src": "https://epvotes.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://epvotes.com/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "EP Votes answers questions about the European Parliament from stored official records: how MEPs and political groups voted in roll calls, what a dossier (legislative procedure) is and where it stands in Parliament, and what Parliament voted on a given day.\nTypical path: search_parliament to find a dossier or MEP, then get_dossier, get_mep or get_vote. Use list_votes for \"what did Parliament vote this week / on a day\". Use compare_groups to compare political groups across recent votes.\nEvery result carries a url on epvotes.com and an official sourceUrl. Cite the url so readers can check the record. Report figures exactly as returned; do not infer outcomes, attendance or positions that a result does not state.\nEP Votes covers recorded roll-call votes and stored European Parliament records of the 10th term (since July 2024) and earlier roll calls; coverage is not complete. A Parliament stage is not the status of the whole EU procedure.",
      "tools": [
        {
          "name": "compare_groups",
          "title": "Compare political groups",
          "description": "Use this when the user wants to compare how two or three European Parliament political groups voted across recent final votes on texts (amendments left out), e.g. \"how often did EPP and S&D vote the same way\". Groups: The Left, S&D, Greens/EFA, Renew, EPP, ECR, PfE, ESN.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Optional start date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "groups": {
                "description": "Two or three group names, e.g. [\"EPP\", \"S&D\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              },
              "limit": {
                "default": 25,
                "description": "Newest votes to compare.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Optional end date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["groups"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare political groups"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Read compare political groups",
            "openai/toolInvocation/invoking": "Reading compare political groups"
          },
          "digest": "sha256:793928763c2059c777d0dc0ca37e3d2379604933a2a21e29f54cea34fcd38e0a"
        },
        {
          "name": "get_dossier",
          "title": "Get a dossier",
          "description": "Use this when the user asks about one European Parliament dossier (procedure): what it is, its type, lead committee, rapporteurs, the steps so far in Parliament, its plenary votes, and the Legislative Observatory summary. Takes a procedure reference such as \"2023/0212(COD)\" or an id such as \"2023-0212\" (use search_parliament first if you only know the title).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dossier": {
                "description": "Procedure reference \"2023/0212(COD)\" or id \"2023-0212\".",
                "maxLength": 120,
                "type": "string"
              },
              "votes_page": {
                "default": 1,
                "description": "Page of plenary votes, 50 per page.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["dossier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a dossier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Read get a dossier",
            "openai/toolInvocation/invoking": "Reading get a dossier"
          },
          "digest": "sha256:25011d77275cc9006690a41633ba27850dd234a3664d7f6e37a6ae77bc5991e4"
        },
        {
          "name": "get_mep",
          "title": "Get an MEP's record",
          "description": "Use this when the user asks about one Member of the European Parliament: country, political group, committees, how often they vote with their group, where they broke with it, and their recent roll-call votes. Takes an MEP id or a name. Set topic to keep only votes whose label, agenda item topic or dossier title contains those words (e.g. \"digital euro\", \"Mercosur\"). Set from and to to read one period; page through all votes of the term with page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Optional: only votes on or after this day, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "mep": {
                "description": "The MEP id (e.g. \"124834\") or name (e.g. \"Martin Sonneborn\").",
                "maxLength": 120,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page of votes, 25 per page, newest first (400 pages reach 10,000 votes; use from and to for older votes of a busy term).",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Optional: only votes on or before this day, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "topic": {
                "description": "Optional: only votes whose label, agenda item topic or dossier title contains these words.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["mep"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an MEP's record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Read get an mep's record",
            "openai/toolInvocation/invoking": "Reading get an mep's record"
          },
          "digest": "sha256:10c8ffc315ce65226145f10c7bbcf74a09fed68f3195de19793ae5d041c517ed"
        },
        {
          "name": "get_vote",
          "title": "Get a roll-call vote",
          "description": "Use this when you need the result of one European Parliament roll-call vote: totals, the split by political group and by country, the dossier it belongs to, and optionally how individual MEPs voted. Takes a vote id from list_votes, get_dossier or get_mep (or an epvotes.com/votes/<id> url). Set members to a group (e.g. \"EPP\", \"S&D\") or a country code (e.g. \"DE\", \"FRA\") to list those MEPs' votes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "members": {
                "description": "Optional: list individual MEP votes for one political group or one country. \"all\" lists every MEP.",
                "maxLength": 40,
                "type": "string"
              },
              "vote_id": {
                "description": "The numeric vote id, e.g. \"198885\".",
                "type": "string"
              }
            },
            "required": ["vote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a roll-call vote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Read get a roll-call vote",
            "openai/toolInvocation/invoking": "Reading get a roll-call vote"
          },
          "digest": "sha256:84013366cd78bc94667798d2f5d1bd27a4c1ff383d5db3a981b30d6855820bf0"
        },
        {
          "name": "list_votes",
          "title": "List plenary votes",
          "description": "Use this when the user asks what the European Parliament voted on a sitting day, this week, between two dates or on a subject, e.g. \"what did Parliament vote today\" or \"votes on Ukraine in October\". Without arguments it returns the latest sitting day; with only a query it searches the last 92 days. Votes are grouped by agenda item; each item has its deciding (final) vote with result and totals and the ids of its other votes for get_vote. Lists at most 40 items.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "day": {
                "description": "One sitting day, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "Start of a date range, YYYY-MM-DD (with to).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "query": {
                "description": "Keep only agenda items whose topic, title or vote labels contain these words, e.g. \"psychosocial\".",
                "maxLength": 120,
                "type": "string"
              },
              "this_week": {
                "description": "All votes of the current week.",
                "type": "boolean"
              },
              "to": {
                "description": "End of a date range, YYYY-MM-DD (with from).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List plenary votes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Read list plenary votes",
            "openai/toolInvocation/invoking": "Reading list plenary votes"
          },
          "digest": "sha256:114177ed5304611abf64f4ac3edfaa4ac9dcf505422ba469dee1a5848d519b18"
        },
        {
          "name": "search_parliament",
          "title": "Search the Parliament",
          "description": "Use this when you need to find a European Parliament dossier (legislative or non-legislative procedure), an MEP, a committee, a political group or an EP document by name, topic or reference, and you do not know its id yet. Returns up to 15 matching records with their ids and epvotes.com urls; pass an id to get_dossier or get_mep next. Matches words in titles and names (e.g. \"digital euro\", \"Metsola\", \"ECON\", \"2023/0212(COD)\"). Do not use it for votes of a day; use list_votes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Words to match: a dossier title, procedure reference, MEP name, committee code or document number.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "default": "any",
                "description": "Limit the search to one kind of record.",
                "enum": ["any", "dossier", "mep", "committee", "group", "document"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Parliament"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Read search the parliament",
            "openai/toolInvocation/invoking": "Reading search the parliament"
          },
          "digest": "sha256:3db9f1a93a30286d1deb6717cce859b485493ccfb12e59bd42392974450c6041"
        }
      ],
      "digest": "sha256:c0ddb14163e0dee228ca6557404377ba779ed416ec6a603eccb82c9af21077d9"
    }
  }
