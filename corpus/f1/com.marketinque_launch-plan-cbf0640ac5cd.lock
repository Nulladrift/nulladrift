      "instructions": "marketinque gives an agent a SaaS launch plan (443 steps in a tree with prerequisites) and a directory index (958 places that give a startup a backlink; 95 free and dofollow, most with the submission page on record) as tools. This connection is the FREE tier: read the plan and the index, and keep the founder's progress in marketinque.json in their repository (pass its done/not_applicable lists to next_steps). Project features (the idea queue, kit, dossier, signals, nightly routine) are for marketinque customers and open by waitlist; join_waitlist puts the founder on it, only with their explicit yes. The sourced marketing library is here too: search_knowledge (claims, topics, plays, terms), get_topic, get_play, search_plays and define_term. Two jobs, two prompts: get-backlinks (submit the product to directories) and launch-plan (work the next unlocked steps). Run one; each says exactly what to do and what never to do in the browser: no accounts, no passwords, no CAPTCHAs, no final submit — those are the founder's.",
