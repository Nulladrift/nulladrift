          "title": "Define a marketing term",
          "description": "The short definition of a marketing term from the library: the 28 glossary terms (MQL, CAC, dark funnel…), the 19 marketing disciplines and the 9 funnel frameworks (AIDA, AARRR, the flywheel…). Exact name or slug matches come first, then partial ones. Each match has its kind, definition, page URL and related pages. Read-only; no side effects.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "term": {
                "description": "The term, e.g. \"MQL\", \"demand generation\", \"bowtie\".",
