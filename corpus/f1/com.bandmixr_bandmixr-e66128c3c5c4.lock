        {
          "name": "create_song",
          "title": "Create a song",
          "description": "Creates a new song in Bandmixr for mixing stems and opens the studio with its upload box. The genre and the mastering style are the ones the person names (other and streaming when they name none). Mixing and mastering are part of it: they start by themselves once the stems are uploaded and the person has confirmed the labels in the studio.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "genre": {
                "description": "Genre of the song. rock_indie = rock / indie; pop = pop; acoustic = acoustic, singer-songwriter; hip_hop_grime = hip hop, rap, trap, grime; electronic = electronic, EDM, house, techno; reggae_dub = reggae / dub; orchestral = orchestral, film score; metal = metal; jazz = jazz; blues = blues; funk_soul = funk / soul / R&B; punk = punk; other = anything else or not sure (balanced, genre-neutral).",
                "enum": ["rock_indie", "pop", "acoustic", "hip_hop_grime", "electronic", "reggae_dub", "orchestral", "metal", "jazz", "blues", "funk_soul", "punk", "other"],
                "type": "string"
              },
              "mix": {
                "description": "false = upload now, mix later (default true: mix once the labels are confirmed).",
                "type": "boolean"
              },
              "preset": {
                "description": "Mastering style. streaming = optimized for Spotify and Apple Music; optimal = balanced (\"Standard\"); loud = maximum punch and loudness.",
                "enum": ["streaming", "optimal", "loud"],
                "type": "string"
