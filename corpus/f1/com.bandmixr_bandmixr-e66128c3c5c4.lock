            "properties": {
              "labels": {
                "items": {
                  "properties": {
                    "label": {
                      "description": "What is on the stem. kick = kick drum; snare = snare drum; hihat = hi-hat; toms = toms; overheads = drum overheads (cymbals and the whole kit from above); room_mics = drum room mics; drum_bus = all drums on one track (drum mix or drum loop); percussion = percussion (shaker, congas, claps, tambourine); bass_electric = electric bass guitar; bass_acoustic = upright or acoustic bass; bass_synth = synth bass or 808; guitar_electric_clean = clean electric guitar; guitar_electric_distorted = distorted or overdriven electric guitar; guitar_acoustic = acoustic guitar (steel strings); guitar_nylon = nylon-string or classical guitar; piano = piano; organ = organ; synth_pad = synth pad; synth_lead = synth lead; keys_other = other keys (Rhodes, e-piano, keyboard); vocal_lead = lead vocal (the main sung vocal); vocal_backing = backing vocals, harmonies or ad-libs; vocal_rap = rap vocal; strings = strings (violin, cello, string section); brass = brass (trumpet, trombone, horns); woodwinds = woodwinds (flute, sax, clarinet); instrumental = full instrumental or beat (everything but the vocals on one stereo track); ambient = ambience, effects, textures or noise; other = something else, or not sure.",
                      "enum": ["kick", "snare", "hihat", "toms", "overheads", "room_mics", "drum_bus", "percussion", "bass_electric", "bass_acoustic", "bass_synth", "guitar_electric_clean", "guitar_electric_distorted", "guitar_acoustic", "guitar_nylon", "piano", "organ", "synth_pad", "synth_lead", "keys_other", "vocal_lead", "vocal_backing", "vocal_rap", "strings", "brass", "woodwinds", "instrumental", "ambient", "other"],
                      "type": "string"
                    },
                    "stemId": {
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["label", "stemId"],
                  "type": "object"
                },
                "maxItems": 64,
                "minItems": 1,
                "type": "array"
              },
              "songId": {
                "description": "The song id from list_songs or create_song.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["labels", "songId"],
            "type": "object"
          },
          "annotations": {
