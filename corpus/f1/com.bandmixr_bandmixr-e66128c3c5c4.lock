      "instructions": "Bandmixr is an online mixing and mastering service for musicians. master_song opens the Bandmixr studio for a finished song: the song is checked in the browser and a 30-second mastered preview plays next to the original; the full master needs a Bandmixr account. check_mix opens the same studio focused on the report (loudness, true peak, clipping, stereo image, tonal balance). Songs dropped into the studio are analyzed in the browser, not uploaded, for the check. Mixing stems needs the person to connect their Bandmixr account: create_song (or open_song_studio for an existing song) opens the studio, where the person uploads the stems and checks their labels. Labels decide how each stem is mixed, so only the person can confirm them, in the studio. mix_and_master mixes and masters by itself once the labels are confirmed; start_mastering masters a finished mix. There is one master, at the release loudness of the genre. adjust_mix changes a finished mix the way the person asks after listening: a stem louder, quieter or muted, its place from left to right, its width, more or less reverb, its tone (brighter, fuller, less boomy), punch, drive, echo and other effects. It keeps every earlier change and makes the mix and the master again; get_song_status shows the current settings of every stem. The studio's Mix tab has the mixer with live faders and effects (\"Open the mixer\"); downloads are on the song page on bandmixr.com. get_account shows the plan and its limits. Guiding the person: audio files go into the studio, never into the chat (you cannot pass on attached audio), so ask them to drop the stems or the song into the studio. When the mix of a song made from stems is ready, say in one sentence that they can listen in the studio and ask you for changes in plain words, with two or three examples (\"vocals a bit louder\", \"more reverb on the guitar\", \"drums punchier\"), or open the mixer themselves. A wish for the whole song (louder, brighter, more bass overall) has no setting of its own: change the stems that cause it, or suggest mastering to a reference track in the studio (Creator and Pro plans).",
      "tools": [
        {
          "name": "adjust_mix",
          "title": "Change the mix",
          "description": "Changes a song mixed from stems the way the person asks after listening. Per stem: volume, mute, position (left to right), reverb (space), stereo width, tone (brightness, body, mids, low cut, air, high cut), punch, drive (warmth or crunch), chorus, phaser, flanger, tremolo and echo. Only what a change names is changed; everything else on the stem stays as it is. Every value replaces the current one, so start from the settings get_song_status shows (with the stem ids and file names) for \"a bit more\" or \"less\". A position or width for a stem that cannot be moved or widened (canMove, canWiden) is refused. One call takes all the changes for a song. The changes are heard in the next mix, which Bandmixr makes with the master right away: quick when the song needs no new draft, about as long as the first mix when it does (a reverb Bandmixr cannot turn on that stem, or a stem placed the older way). The studio shows the progress and plays the new version, which replaces the earlier version made in the chat (downloaded versions and mixes made on the website stay).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "changes": {
                "items": {
                  "properties": {
                    "chorus": {
                      "description": "Chorus: a thicker, shimmering double. About 0.2 is a little, 0.5 clearly, 0.8 a lot; 0 removes it.",
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "drive": {
                      "description": "Drive (saturation): warm = gentle \"Warmth\" (the Simple view's word), crunch = audible distortion. About 0.2 is a little, 0.5 clearly, 0.8 a lot; 0 removes it.",
                      "properties": {
                        "amount": {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "kind": {
                          "enum": ["warm", "crunch"],
                          "type": "string"
                        }
                      },
                      "required": ["amount", "kind"],
                      "type": "object"
                    },
                    "echo": {
                      "description": "Echo (delay): slapback = one short echo, needs no tempo; eighth, dotted (dotted eighths), quarter and pingPong (bounces left and right) follow the song's tempo, so the song needs one. About 0.2 is a little, 0.5 clearly, 0.8 a lot; 0 removes it.",
                      "properties": {
                        "amount": {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "kind": {
                          "enum": ["slapback", "eighth", "dotted", "quarter", "pingPong"],
                          "type": "string"
                        }
                      },
                      "required": ["amount", "kind"],
                      "type": "object"
                    },
                    "flanger": {
                      "description": "Flanger: a jet-like sweep. About 0.2 is a little, 0.5 clearly, 0.8 a lot; 0 removes it.",
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "muted": {
                      "description": "true = leave the stem out of the mix; false = bring it back.",
                      "type": "boolean"
                    },
                    "pan": {
                      "anyOf": [
                        {
                          "anyOf": [
                            {
                              "maximum": 1,
                              "minimum": -1,
                              "type": "number"
                            },
                            {
                              "const": "auto",
                              "type": "string"
                            }
                          ],
                          "description": "Where the stem sits from left to right: -1 hard left, 0 center, 1 hard right, or \"auto\" for where Bandmixr places it. \"A bit to the left\" is about -0.2 to -0.3, \"left\" about -0.6. It replaces the current value (get_song_status shows it)."
                        },
                        {
                          "enum": ["left", "center", "right"],
                          "type": "string"
                        }
                      ],
                      "description": "Where the stem sits from left to right: -1 hard left, 0 center, 1 hard right, or \"auto\" for where Bandmixr places it. \"A bit to the left\" is about -0.2 to -0.3. The plain words \"left\", \"center\" and \"right\" are taken as -0.6, 0 and 0.6. It replaces the current value (get_song_status shows it)."
                    },
                    "phaser": {
                      "description": "Phaser: a sweeping, swirling sound. About 0.2 is a little, 0.5 clearly, 0.8 a lot; 0 removes it.",
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "punch": {
                      "description": "Punch: more attack and impact, for drums, bass, rhythm parts. About 0.2 is a little, 0.5 clearly, 0.8 a lot; 0 removes it.",
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "reverb": {
                      "description": "Reverb, the \"Space\" of the Simple view, against the reverb Bandmixr gave the stem: default = Bandmixr's own; none = dry; low = about half; medium = about one and a half times; high = a lot (the most).",
                      "enum": ["default", "none", "low", "medium", "high"],
                      "type": "string"
                    },
                    "stemId": {
                      "description": "The stem id from get_song_status.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "tone": {
                      "description": "Tone (EQ). Name only the parts that change; 0 takes a part away.",
                      "properties": {
                        "air": {
                          "description": "Air: shine and sparkle at the very top. About 0.2 is a little, 0.5 clearly, 0.8 a lot; 0 removes it.",
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "highCut": {
                          "description": "High cut: takes away the top, darker and softer. About 0.2 is a little, 0.5 clearly, 0.8 a lot; 0 removes it.",
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "highs": {
                          "description": "Highs, the \"Brightness\": -1 darker and duller to 1 brighter and crisper. 0 = as Bandmixr made it.",
                          "maximum": 1,
                          "minimum": -1,
                          "type": "number"
                        },
                        "lowCut": {
                          "description": "Low cut: takes away low end and rumble. About 0.2 is a little, 0.5 clearly, 0.8 a lot; 0 removes it.",
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "lows": {
                          "description": "Lows, the \"Body\" of the website's Simple view: -1 thinner to 1 fuller. 0 = as Bandmixr made it.",
                          "maximum": 1,
                          "minimum": -1,
                          "type": "number"
                        },
                        "mids": {
                          "description": "Mids: -1 less to 1 more presence in the middle (boxy, nasal, honky). 0 = as Bandmixr made it.",
                          "maximum": 1,
                          "minimum": -1,
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "tremolo": {
                      "description": "Tremolo: the volume pulses. About 0.2 is a little, 0.5 clearly, 0.8 a lot; 0 removes it.",
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "volumeDb": {
                      "description": "The stem's new level against Bandmixr's own balance in dB: 0 = Bandmixr's balance, +3 = 3 dB louder, -6 = 6 dB quieter. It replaces the current value (get_song_status shows it). So \"a bit louder\" from +2 is +4. About 1 to 2 dB is \"a bit\", 3 to 4 dB \"clearly\", 6 dB \"a lot\".",
                      "maximum": 12,
                      "minimum": -24,
                      "type": "number"
                    },
                    "width": {
                      "description": "Stereo width against what Bandmixr made: 1 = as Bandmixr made it, 0 = mono, 2 = widest. \"Wider\" is about 1.3 to 1.5. It replaces the current value (get_song_status shows it).",
                      "maximum": 2,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["stemId"],
                  "type": "object"
                },
                "maxItems": 64,
                "minItems": 1,
                "type": "array"
              },
              "songId": {
                "description": "The song id from list_songs or create_song.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["changes", "songId"],
            "type": "object"
          },
