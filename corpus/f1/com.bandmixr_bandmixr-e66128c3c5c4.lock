      "serverInfo": {
        "name": "bandmixr",
        "title": "Bandmixr",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Bandmixr is an online mixing and mastering service for musicians. master_song opens the Bandmixr studio for a finished song: the song is checked in the browser and a 30-second mastered preview plays next to the original; the full master needs a Bandmixr account. check_mix opens the same studio focused on the report (loudness, true peak, clipping, stereo image, tonal balance). Songs dropped into the studio are analyzed in the browser, not uploaded, for the check. Mixing stems needs the person to connect their Bandmixr account: create_song (or open_song_studio for an existing song) opens the studio, where the person uploads the stems and checks their labels. Labels decide how each stem is mixed, so only the person can confirm them, in the studio. mix_and_master runs draft, final mix and master by itself once the labels are confirmed; start_mastering masters a finished mix again in another style. adjust_mix changes a finished mix the way the person asks after listening (a stem louder, quieter or muted, more or less reverb, left or right) and makes the mix and the master again. Downloads happen on the song page on bandmixr.com. get_account shows the plan and its limits.",
      "tools": [
        {
          "name": "adjust_mix",
          "title": "Change the mix",
          "description": "Changes a song mixed from stems the way the person asks after listening: a stem louder or quieter, muted or back in, more or less reverb, or placed left, center or right. One call takes all the changes for a song. Bandmixr then makes the mix and the master again with the changes (about as long as the first mix); the studio shows the progress and plays the new version, which replaces the earlier version made in the chat (downloaded versions and mixes made on the website stay). Stem ids, file names and the current settings come from get_song_status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "changes": {
                "items": {
                  "properties": {
                    "muted": {
                      "description": "true = leave the stem out of the mix; false = bring it back.",
                      "type": "boolean"
                    },
                    "pan": {
                      "description": "Where the stem sits from left to right. auto = Bandmixr places it; left = to the left; center = in the center; right = to the right.",
                      "enum": ["auto", "left", "center", "right"],
                      "type": "string"
                    },
                    "reverb": {
                      "description": "How much reverb the stem gets. default = Bandmixr's own amount; none = no reverb (dry); low = less reverb than Bandmixr's amount; medium = more reverb than Bandmixr's amount; high = a lot of reverb.",
                      "enum": ["default", "none", "low", "medium", "high"],
                      "type": "string"
                    },
                    "stemId": {
                      "description": "The stem id from get_song_status.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "volumeDb": {
                      "description": "The stem's new level against Bandmixr's own balance in dB: 0 = Bandmixr's balance, +3 = 3 dB louder, -6 = 6 dB quieter. It replaces the current value (get_song_status shows it), so \"a bit louder\" from +2 is +4. About 1 to 2 dB is \"a bit\", 3 to 4 dB \"clearly\", 6 dB \"a lot\".",
                      "maximum": 12,
                      "minimum": -24,
                      "type": "number"
                    }
                  },
                  "required": ["stemId"],
                  "type": "object"
                },
                "maxItems": 64,
                "minItems": 1,
                "type": "array"
              },
              "preset": {
                "description": "Mastering style for the new master; the current one if not given.",
                "enum": ["streaming", "optimal", "loud"],
                "type": "string"
              },
              "songId": {
                "description": "The song id from list_songs or create_song.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["changes", "songId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change the mix"
          },
