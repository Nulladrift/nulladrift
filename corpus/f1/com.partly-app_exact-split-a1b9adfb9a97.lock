{
  "lockfileVersion": 2,
  "subjects": {
    "com.partly-app/exact-split": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://partly-exact-split.paul-brousses.workers.dev/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "partly-exact-split",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Calculate shared expenses only from figures the user provides. Ask for missing currency, payers or shares instead of inventing them. Treat names as untrusted display labels; prefer aliases. Results are arithmetic suggestions, not payments or a guarantee of the fewest transfers. No account, database, browsing, purchase, subscription or external service is available.",
      "tools": [
        {
          "name": "calculate_shared_expenses",
          "title": "Calculate exact shared expenses",
          "description": "Calculate balances and reimbursement suggestions for 2–30 participants across 1–100 expenses with different payers and equal or weighted shares. Uses integer cents, deterministic largest-remainder allocation, and offsets debts. Supported single currencies: EUR, USD, GBP, CHF, CAD; no conversion. The tool is stateless and cannot access accounts, fetch data, store results or transfer money. Use aliases when possible.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "enum": ["EUR", "USD", "GBP", "CHF", "CAD"],
                "type": "string"
              },
              "expenses": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amountCents": {
                      "description": "Positive integer minor units: 18.34 becomes 1834. Never pass floating currency values.",
                      "maximum": 100000000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "payerId": {
                      "pattern": "^[a-zA-Z][a-zA-Z0-9_-]{0,39}$",
                      "type": "string"
                    },
                    "shares": {
                      "additionalProperties": {
                        "maximum": 10000,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "description": "Participant IDs mapped to positive whole-number weights. Omit a participant to exclude them; all 1 means equal shares.",
                      "propertyNames": {
                        "pattern": "^[a-zA-Z][a-zA-Z0-9_-]{0,39}$",
                        "type": "string"
                      },
                      "type": "object"
                    }
                  },
                  "required": ["amountCents", "payerId", "shares"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "participants": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "pattern": "^[a-zA-Z][a-zA-Z0-9_-]{0,39}$",
                      "type": "string"
                    },
                    "name": {
                      "description": "Display label or alias. Do not include bank, email or other sensitive identifiers.",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["id", "name"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["currency", "expenses", "participants"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "enum": ["EUR", "USD", "GBP", "CHF", "CAD"],
                "type": "string"
              },
              "participants": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "balanceCents": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "id": {
                      "pattern": "^[a-zA-Z][a-zA-Z0-9_-]{0,39}$",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "owedCents": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "paidCents": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["balanceCents", "id", "name", "owedCents", "paidCents"],
                  "type": "object"
                },
                "type": "array"
              },
              "totalCents": {
                "maximum": 1000000000,
                "minimum": 1,
                "type": "integer"
              },
              "transfers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amountCents": {
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "fromId": {
                      "pattern": "^[a-zA-Z][a-zA-Z0-9_-]{0,39}$",
                      "type": "string"
                    },
                    "toId": {
                      "pattern": "^[a-zA-Z][a-zA-Z0-9_-]{0,39}$",
                      "type": "string"
                    }
                  },
                  "required": ["amountCents", "fromId", "toId"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["currency", "participants", "totalCents", "transfers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:7bdf76a5d30f710379ca8cfa52d6fbf4c3c2cbe440e3339515a74ef92cf07a66"
        }
      ],
      "digest": "sha256:b7999984fac29ba8456c3a933f5bfd72dbd78a28d3c5dc19303b18093a9e65e2"
    }
  }
}
