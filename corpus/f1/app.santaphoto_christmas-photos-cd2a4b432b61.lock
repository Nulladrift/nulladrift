          },
          "digest": "sha256:95cfe39de978fb3d0d5d06d68a05950b17e298609fbf1f6c57f20ff3e74f0b5b"
        },
        {
          "name": "get_style",
          "title": "Get a Christmas style",
          "description": "Details of one style: example results, the plain photo the preview was made from, supported aspect ratios and how many photos it takes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Style id from list_styles.",
                "maxLength": 40,
                "type": "string"
              },
              "locale": {
                "description": "Language for names, descriptions and links. Defaults to en.",
                "enum": ["en", "zh", "es", "de", "fr", "pt", "it", "nl", "pl"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
