        },
        {
          "name": "list_styles",
          "title": "List Christmas styles",
          "description": "List the AI Christmas styles: photo scenes, card designs and profile-picture (PFP) looks. Each has a preview image and a link that opens the generator with that style selected.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language for names, descriptions and links. Defaults to en.",
                "enum": ["en", "zh", "es", "de", "fr", "pt", "it", "nl", "pl"],
                "type": "string"
              },
              "mode": {
                "description": "photo, card or pfp. Omit for all.",
                "enum": ["photo", "card", "pfp"],
                "type": "string"
              },
              "trendingOnly": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
