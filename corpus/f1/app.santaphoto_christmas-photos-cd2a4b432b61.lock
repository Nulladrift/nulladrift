      },
      "serverInfo": {
        "name": "santaphoto",
        "title": "SantaPhoto",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SantaPhoto (https://santaphoto.app) turns people's own photos into AI Christmas photos, Christmas cards and Christmas profile pictures (PFPs). These tools browse its styles, free downloadable PFPs and card templates, and prices. They cannot generate images: to make one, give the user the generatorUrl from list_styles, get_style or create_photo_link, where they upload their photos and sign in. Users may upload photos of themselves, consenting adults, their own children and their pets; never suggest uploading other people's children or public figures.",
      "tools": [
        {
          "name": "create_photo_link",
          "title": "Create a generator link",
          "description": "A link that opens the generator with a style selected. The user uploads their own photos there and signs in to create the image.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language for names, descriptions and links. Defaults to en.",
                "enum": ["en", "zh", "es", "de", "fr", "pt", "it", "nl", "pl"],
                "type": "string"
              },
              "style": {
                "description": "Style id from list_styles.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["style"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57633adf03e7e30518f1c31726555c6a0a2ae2511ea54a2679a770f46ba53990"
        },
        {
          "name": "get_pricing",
          "title": "Get pricing",
          "description": "Credit packs (one-time, no subscription) and how many credits each image costs by resolution.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language for names, descriptions and links. Defaults to en.",
                "enum": ["en", "zh", "es", "de", "fr", "pt", "it", "nl", "pl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
