{
  "lockfileVersion": 2,
  "subjects": {
    "ai.opencurrent/kr-sms-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opencurrent.ai/mcp/kr-sms"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "kr-sms-check",
        "title": "Korea SMS Length & Ad Rules Check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Before sending a text message (문자) to Korean recipients: count bytes (SMS up to 90, LMS up to 2,000; Korean 2 bytes, ASCII 1) and check the legal display rules for advertising messages under Korea's Network Act Art. 50 and its Enforcement Decree Annex 6: (광고) at the start with sender name and phone, free opt-out at the end, no tampered (광고) label, and separate consent for 21:00-08:00 sending. Format checks only, not legal advice.",
      "tools": [
        {
          "name": "kr_ad_sms_check",
          "title": "Check a Korean advertising text message",
          "description": "Check a Korean marketing text message against the display rules of the Network Act Art. 50 and Enforcement Decree Annex 6, and the night-time (21:00-08:00 KST) separate-consent rule when send_at is given. Returns each check with the legal basis.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "send_at": {
                "description": "Korea time HH:MM",
                "maxLength": 5,
                "type": "string"
              },
              "text": {
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "passed": {
                "type": "boolean"
              }
            },
            "required": ["passed"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61aa9512b2f62f4c5983d05690da4fe7cdc0a3ac4242f98d69346fef591c9020"
        },
        {
          "name": "kr_sms_length",
          "title": "Korean SMS/LMS byte count",
          "description": "Count message bytes as Korean carriers do (Korean/CJK 2 bytes, ASCII 1) and tell whether it fits SMS (90 bytes) or LMS (2,000 bytes). Flags emoji and other characters that may break in SMS.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "text": {
                "maxLength": 5000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bytes": {
                "type": "number"
              },
              "type": {
                "type": "string"
              }
            },
            "required": ["bytes", "type"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c996064ed3981d6221d40a05a57ea7f3d52790d76ce4dee7c7d4ada5d029d498"
        }
      ],
      "digest": "sha256:fe7e1561b3fe147b84d12c1fb0bd884bc6e48ff780e3dcb56637f0edc927e37f"
    }
  }
}
