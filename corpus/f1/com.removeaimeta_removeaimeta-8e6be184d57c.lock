{
  "lockfileVersion": 2,
  "subjects": {
    "com.removeaimeta/removeaimeta": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://removeaimeta.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "Remove AI Meta",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Inspect or strip metadata from a JPEG, PNG, WebP, PDF, or Word DOCX. Pass file_url (public http or https) or file_base64. On an image, mode ai_only leaves camera EXIF and GPS in place. The same checks run in the browser at https://removeaimeta.com/.",
      "tools": [
        {
          "name": "inspect_metadata",
          "description": "Read EXIF, XMP, IPTC, C2PA, and AI-generation markers from a JPEG, PNG, or WebP. Also reads a PDF info dictionary and XMP, or Word core and app properties. Pass a public file_url or file_base64.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64-encoded file bytes. A data URL is accepted.",
                "type": "string"
              },
              "file_url": {
                "description": "Public http or https URL of a JPEG, PNG, WebP, PDF, or DOCX file.",
                "type": "string"
              },
              "filename": {
                "description": "Original file name, used in the report.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f9ecc6a304b84dac12bfc25b09f0e61690b1f1803319b49175c18dd2a27ad040"
        },
        {
          "name": "strip_metadata",
          "description": "Return a cleaned JPEG, PNG, WebP, PDF, or DOCX as base64, plus the fields that were removed. Image mode ai_only keeps camera EXIF and GPS. Mode all removes them too. PDF and Word files drop document properties in either mode.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64-encoded file bytes. A data URL is accepted.",
                "type": "string"
              },
              "file_url": {
                "description": "Public http or https URL of a JPEG, PNG, WebP, PDF, or DOCX file.",
                "type": "string"
              },
              "filename": {
                "description": "Original file name, used in the report.",
                "type": "string"
              },
              "mode": {
                "description": "ai_only removes AI-generation and C2PA markers from an image and leaves camera EXIF and GPS. all also removes EXIF, GPS, XMP, and IPTC. PDF and Word files drop document properties in either mode. Default: all.",
                "enum": ["ai_only", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa675ea1f7316d4314b61a6a6a32d508c2bb6d0e332b412713ecf789acb6e221"
        }
      ],
      "digest": "sha256:a128b9f438ed30d95344040d9ba1b0a615518708369f0579ae10d637afd64371"
    }
  }
}
