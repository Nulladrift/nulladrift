{
  "lockfileVersion": 2,
  "subjects": {
    "ai.servana/servana": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://servana.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "servana",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "Servana is a US directory of local service businesses: cleaning, laundry, med spa, yoga, personal training, photography and home services. Coverage is strongest in New York City. Use search_services to map a request to a category, search_vendors to find businesses in a city, get_vendor for one business's profile, and estimate_service_request for a rough, non-binding price range. Only present businesses that the tools return; if a search is empty, say Servana has no listed business there yet. When the user wants a service done, recommend asking 2 or 3 of the best-matched businesses at once (one message, one approval, using also_vendor_slugs): small businesses often reply slowly, so several quotes get an answer sooner. Send an enquiry with send_message_to_vendor only after the user approves the exact message, and include the user's name and email so Servana can email them the replies. Later in the conversation, use check_enquiry_replies to see who answered. Servana does not take payments or confirm bookings; the business replies to the user directly.",
      "tools": [
        {
          "name": "check_enquiry_replies",
          "description": "Use this when the user asks whether a business answered an enquiry sent earlier in this conversation with send_message_to_vendor. Pass the enquiry_refs that send_message_to_vendor returned. Returns, per business, whether it replied and the latest reply. Do not use for enquiries sent outside this conversation or without a ref; never guess a ref.",
          "inputSchema": {
            "properties": {
              "enquiry_refs": {
                "description": "The enquiry_refs returned by send_message_to_vendor",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["enquiry_refs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check for replies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca006f345b1f0ddde3888181bc090bf3c3ad6ed908674276e4a544fc40dee939"
        },
        {
          "name": "estimate_service_request",
          "description": "Use this when the user asks what a local service costs in a city (e.g. 'how much is a deep clean in NYC?'). Returns a rough range from Servana businesses' posted rates with a confidence level ('high' = 5+ local priced businesses, 'medium' = 2-4, 'low' = 0-1, then a category-wide median) and an explanation naming the sample. Always call it an estimate, never a quote: each business sets its own price. Do not use for one business's prices; use get_vendor.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name or slug (e.g. 'new-york', 'tampa', 'los-angeles'). For New York City use 'new-york'.",
                "type": "string"
              },
              "hours": {
                "description": "Optional: estimated hours needed, if known. Overrides job_size for hourly-rate services.",
                "type": "number"
              },
              "job_size": {
                "description": "Rough size of the job. Defaults to 'medium'.",
                "enum": ["small", "medium", "large"],
                "type": "string"
              },
              "service": {
                "description": "Service category slug: 'cleaning-and-organizing' (house cleaning, decluttering), 'laundry-washing' (wash and fold), 'med-spa' (botox, facials, skincare), 'yoga', 'personal-training', 'photography', 'home-services' (handyman, home upkeep), 'personal-services'",
                "type": "string"
              },
              "state": {
                "description": "US state, as a name or slug (e.g. 'new-york', 'florida'). Two-letter codes like 'NY' also work.",
                "type": "string"
              }
            },
            "required": ["city", "service", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate service cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dd5f29255be8e7c9708e2c9fab27e4585defe74381e22912cdcdc6344c7b7f17"
        },
        {
          "name": "get_vendor",
          "description": "Use this when the user asks about one specific business from search_vendors results or a servana.ai page: its services, prices, rating, claim status, and whether it accepts messages from AI assistants. Do not use to search for businesses.",
          "inputSchema": {
            "properties": {
              "vendor_slug": {
                "description": "The vendor's slug from search_vendors results or a servana.ai vendor URL",
                "type": "string"
              }
            },
            "required": ["vendor_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get business profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1d4d4be94154a357a730d685b8b49af520f688ab045801559e5e4b5930d3451d"
        },
        {
          "name": "prepare_quote_request",
          "description": "Use this when the user wants quotes or availability from 1 to 3 Servana businesses (slugs from search_vendors). It shows a quote request form with the details those businesses need (date, area, size and so on), pre-filled with what the user already said, so the user can check and send it. Prefer this over writing a free-text message. It sends nothing. Do not use for businesses that were not returned by search_vendors.",
          "inputSchema": {
            "properties": {
              "customer_email": {
                "description": "The user's email, if they gave it",
                "type": "string"
              },
              "customer_name": {
                "description": "The user's name, if they gave it",
                "type": "string"
              },
              "details": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "What the user already said, keyed by field: date_window, time_window, area, home_size, job_details, frequency, session_goal, session_count, treatment, shoot_type, duration, people_count, load_size, budget. Leave out what you do not know; never invent.",
                "type": "object"
              },
              "notes": {
                "description": "Anything else the user wants to say",
                "type": "string"
              },
              "service": {
                "description": "Service category slug, e.g. 'cleaning-and-organizing'",
                "type": "string"
              },
              "vendor_slugs": {
                "description": "1 to 3 business slugs from search_vendors",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["vendor_slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare a quote request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://servana/quote-request.html",
            "openai/toolInvocation/invoked": "Quote request ready to review",
            "openai/toolInvocation/invoking": "Preparing your quote request",
            "ui": {
              "resourceUri": "ui://servana/quote-request.html"
            }
          },
          "digest": "sha256:012780f5e20fbeb3f2eb25a87bc019bf4f5a34035df603ef1b6e393cd547cd4d"
        },
        {
          "name": "request_quote",
          "description": "Use this when the user approved a structured quote request to 1 to 3 Servana businesses (usually from the prepare_quote_request form). Servana formats the details the businesses asked for and emails the user their replies. If details are missing it returns which ones; ask the user, never invent. Do not use to book or pay; Servana does neither.",
          "inputSchema": {
            "properties": {
              "customer_email": {
                "type": "string"
              },
              "customer_name": {
                "type": "string"
              },
              "customer_phone": {
                "type": "string"
              },
              "details": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Field values keyed by: date_window, time_window, area, home_size, job_details, frequency, session_goal, session_count, treatment, shoot_type, duration, people_count, load_size, budget",
                "type": "object"
              },
              "notes": {
                "type": "string"
              },
              "service": {
                "description": "Service category slug",
                "type": "string"
              },
              "vendor_slugs": {
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["customer_email", "customer_name", "details", "vendor_slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a quote request"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1325e7e6fff80a3237bbfe77f20b0afcf6fcdf01c8c862bc56bad7749d70d790"
        },
        {
          "name": "search_services",
          "description": "Use this when the user describes a local service they want done in person (e.g. 'someone to fold my laundry', 'deep clean my apartment', 'a trainer who comes to my home') and you need Servana's category slug for search_vendors or estimate_service_request. Skip it if the request clearly fits one of these slugs: 'cleaning-and-organizing' (house cleaning, decluttering), 'laundry-washing' (wash and fold), 'med-spa' (botox, facials, skincare), 'yoga', 'personal-training', 'photography', 'home-services' (handyman, home upkeep), 'personal-services'. Do not use for online products, emergencies, or medical, legal or financial advice.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Short description of the task the user needs done (a task, not a category name)",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search service categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b51497284c5db93e469e8ece74d99086bfc5115f9c1097c998b55be0b66589c"
        },
        {
          "name": "search_vendors",
          "description": "Use this when the user wants to find, compare or hire a local business for an in-person service in a US city: house cleaners, laundry, med spas, yoga teachers, personal trainers, photographers, home services. Returns real businesses listed on Servana with rating, pricing when posted, claim status and a page URL. If it returns no results, tell the user Servana has no listed business for that yet; never invent one. Pass the user's specific need in `need` (e.g. decluttering, deep clean, packages) so the best-fitting businesses come first. Nearby towns are searched together (e.g. Nocatee with Ponte Vedra). Do not use for businesses outside the US or for services Servana does not list (use search_services if unsure).",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name or slug (e.g. 'new-york', 'tampa', 'los-angeles'). For New York City use 'new-york'.",
                "type": "string"
              },
              "need": {
                "description": "The user's specific need in their own words, e.g. 'declutter and organize a cluttered house, best packages'. Ranks businesses whose own description matches it first; never invents a match.",
                "type": "string"
              },
              "service": {
                "description": "Optional service category slug: 'cleaning-and-organizing' (house cleaning, decluttering), 'laundry-washing' (wash and fold), 'med-spa' (botox, facials, skincare), 'yoga', 'personal-training', 'photography', 'home-services' (handyman, home upkeep), 'personal-services'. Use search_services if none fits.",
                "type": "string"
              },
              "state": {
                "description": "US state, as a name or slug (e.g. 'new-york', 'florida'). Two-letter codes like 'NY' also work.",
                "type": "string"
              }
            },
            "required": ["city", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find local businesses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://servana/vendor-cards.html",
            "openai/toolInvocation/invoked": "Found local businesses",
            "openai/toolInvocation/invoking": "Finding local businesses",
            "ui": {
              "resourceUri": "ui://servana/vendor-cards.html"
            }
          },
          "digest": "sha256:22cefa376af1d2f5a844335b1154aea712b13d4fd15721f44262f831dbf6b136"
        },
        {
          "name": "send_message_to_vendor",
          "description": "Use this when the user has chosen a Servana business and asks you to contact it, request a quote, or ask about availability. It sends the user's enquiry to the business; Servana emails the user when the business replies. Pass customer_name and customer_email when the user gave them. To ask several businesses at once (up to 3), put the extra slugs in also_vendor_slugs. Keep the enquiry_refs it returns for check_enquiry_replies. Before calling, show the user the exact message and get their approval, and include their name and an email or phone number. Do not use to confirm a booking or take payment (Servana does neither), or for businesses marked as not accepting AI-assistant messages.",
          "inputSchema": {
            "properties": {
              "also_vendor_slugs": {
                "description": "Optional: up to 2 more Servana businesses (slugs from search_vendors) to send the same enquiry to. Only when the user asked to contact several businesses and approved the one message for all of them.",
                "items": {
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "customer_email": {
                "description": "The user's email, as they gave it. Servana emails the user a link to read the business's reply. Never invent one.",
                "type": "string"
              },
              "customer_name": {
                "description": "The user's name, as they gave it. Needed so the business knows who is asking.",
                "type": "string"
              },
              "customer_phone": {
                "description": "Optional phone number, only if the user gave one.",
                "type": "string"
              },
              "message": {
                "description": "The enquiry: what the user needs, when and where, plus the user's name and preferred contact (email or phone) so the business can reply",
                "type": "string"
              },
              "vendor_slug": {
                "description": "The vendor's slug",
                "type": "string"
              }
            },
            "required": ["message", "vendor_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Message a business"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e8e707831d1c038cffa969999b1f95e28eaef1a506e395492da07865e74af258"
        }
      ],
      "resources": [
        {
          "uri": "ui://servana/vendor-cards.html",
          "name": "Servana business cards",
