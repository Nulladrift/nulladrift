      "serverInfo": {
        "name": "sigaoli",
        "title": "Sigao Li — personal MCP server",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only structured access to Sigao Li's professional profile (sigaoli.com): who he is, full CV, and project case studies. Content is bilingual (en/zh). To reach Sigao for anything beyond this data, email him (see get_profile).",
      "tools": [
        {
          "name": "get_case_study",
          "title": "Get case study",
          "description": "Full text of one project case study by slug (challenge / approach / impact). Call with an unknown slug to get the list of valid slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the returned content ('en' or 'zh').",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "slug": {
                "description": "Case study slug, e.g. \"gisphere-llm\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4ec0b0f8cb8dcb265df4dc6b58d9555727c24831baa9c867c9fa9006173c173e"
        },
