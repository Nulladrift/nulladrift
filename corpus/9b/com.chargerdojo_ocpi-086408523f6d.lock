            "additionalProperties": false,
            "properties": {
              "after": {
                "description": "Cursor from a previous call. Omit to start at the first check.",
                "minimum": 0,
                "type": "integer"
              },
              "module": {
                "description": "The module, as chargerdojo_list_conformance_suites names it.",
                "enum": ["booking", "cdrs", "chargingprofiles", "commands", "credentials", "hubclientinfo", "locations", "payments", "scenario_commands", "scenario_commands_211", "scenario_commands_23", "scenario_credentials", "scenario_locations", "scenario_locations_211", "scenario_locations_23", "scenario_pt_e2e_23", "scenario_pt_rejections_23", "scenario_ptp_e2e", "scenario_ptp_partial", "scenario_ptp_rejections", "scenario_session", "scenario_session_211", "scenario_session_23", "scenario_tariffs_cdr", "scenario_tokens", "scenario_tokens_211", "scenario_tokens_23", "sessions", "tariffs", "tokens", "versions"],
                "type": "string"
