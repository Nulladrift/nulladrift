        {
          "name": "get_human_design_centers_id",
          "title": "Look up a Human Design center by id",
          "description": "Look up the static reference data for one of the nine Human Design centers by its id: the display name, whether it is a motor or awareness center, and what it means both defined and undefined. A pure reference endpoint with no birth data required.",
          "inputSchema": {
            "examples": [
              {
                "id": "sacral"
              }
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "id": {
                "description": "Center id. One of head, ajna, throat, g, heart, sacral, solar-plexus, spleen, root.",
                "enum": ["head", "ajna", "throat", "g", "heart", "sacral", "solar-plexus", "spleen", "root"],
                "example": "sacral",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "awareness": {
                "type": "boolean"
              },
              "definedMeaning": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "motor": {
                "type": "boolean"
              },
              "name": {
                "type": "string"
              },
              "nameLocalized": {
                "type": "string"
              },
              "undefinedMeaning": {
                "type": "string"
              }
            },
            "required": ["awareness", "definedMeaning", "id", "motor", "name", "undefinedMeaning"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
