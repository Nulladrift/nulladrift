        {
          "name": "post_human_design_channels",
          "title": "Calculate the defined Human Design channels",
          "description": "Calculate the defined channels for a birth moment. A channel is defined when both of its gates are activated, and it wires together the two centers it connects. Returns each defined channel with its gates, name, circuit family, and connected centers, plus the full set of centers those channels define. Built for bodygraph rendering and definition analysis.",
          "inputSchema": {
            "examples": [
              {
                "date": "1990-07-15",
                "time": "13:00:00",
                "timezone": "America/New_York"
              }
            ],
            "properties": {
              "compact": {
                "default": false,
