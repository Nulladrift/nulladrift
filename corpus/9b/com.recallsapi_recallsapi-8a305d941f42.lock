{
  "lockfileVersion": 2,
  "subjects": {
    "com.recallsapi/recallsapi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.recallsapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "recallsapi",
        "title": "recallsapi.com: US product, food, drug, device and vehicle recalls",
        "version": "0.1.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "US recall lookups. Use check_product first with whatever the user has (name and brand, barcode, model, NDC, lot); search_recalls for topics; check_vehicle for cars. Always show the source link. Get an API key at https://recallsapi.com.",
      "tools": [
        {
          "name": "check_product",
          "title": "Check a product for recalls",
          "description": "Is this product recalled? Give whatever you have: a product name and brand, a UPC/EAN/GTIN barcode, a model number, an NDC drug code or a lot code. Returns matching recalls from 9 US agencies (CPSC, FDA, NHTSA, US Coast Guard, FAA and more) with a confidence level (exact, strong, possible), the reasons for each match and the agency source link, plus early-warning signals from 5 sources (NHTSA investigations, CPSC violation notices, SEC filings, Prop 65 notices, SaferProducts.gov incident reports) that name the same model, vehicle or brand. A signal is not a recall.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand or manufacturer, e.g. \"Hatch\"",
                "type": "string"
              },
              "lot": {
                "description": "Lot or batch code",
                "type": "string"
              },
              "model": {
                "description": "Model or part number",
                "type": "string"
              },
              "name": {
                "description": "Product name or description, e.g. \"Hatch Rest sound machine\"",
                "type": "string"
              },
              "ndc": {
                "description": "National Drug Code, any dashed layout",
                "type": "string"
              },
              "receipt": {
                "description": "true adds a signed receipt: a dated record of what recallsapi.com held for this check, stored for 400 days and fetchable at its verify_url. It is not a safety certification.",
                "type": "boolean"
              },
              "upc": {
                "description": "UPC, EAN or GTIN barcode digits",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6e641d17eacad460355f57df1c643b6b0e7b644c33d29a6ef8a613af9a133098"
        },
        {
          "name": "check_vehicle",
          "title": "Check a vehicle for recalls",
          "description": "NHTSA recall campaigns for a vehicle, by 17-character VIN (decoded with NHTSA vPIC) or by make, model and year, plus live NHTSA consumer complaint counts for that make, model and year (not verified by NHTSA, not a safety determination). Give either vin, or make, model and year. Campaigns are filed for a make, model and year (model level); whether a campaign includes a vehicle, and whether its repair is done, is held in the vehicle maker's records, and any dealer of the make can check it with the VIN, free.",
          "inputSchema": {
            "properties": {
              "make": {
                "description": "Vehicle make. Give either vin, or make, model and year.",
                "type": "string"
              },
              "model": {
                "description": "Vehicle model. Give either vin, or make, model and year.",
                "type": "string"
              },
              "vin": {
                "description": "17-character VIN. Give either vin, or make, model and year.",
                "type": "string"
              },
              "year": {
                "description": "Model year. Give either vin, or make, model and year.",
                "maximum": 2100,
                "minimum": 1949,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:088da0cded62576ee1977f9300fbee7da859dcc96f6f6226dc518aa751c800f1"
        },
        {
          "name": "get_recall",
          "title": "Get one recall",
          "description": "Full record for one recall id (for example \"cpsc-24116\", \"fda-H-1339-2026\", \"nhtsa-26V631000\", \"fsis-001-2016\"), with every identifier and the agency source link.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:35d289e77d97ad0f97271692216f9381a9e4843ed9bd8aa0140d9a4209578bf9"
        },
        {
          "name": "search_recalls",
          "title": "Search recalls",
          "description": "Full-text search across recall records from 9 US agencies (CPSC, FDA, NHTSA, US Coast Guard, FAA and more), newest and most relevant first. Filter by category and date.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["consumer_product", "food", "drug", "device", "vehicle", "vehicle_equipment", "tire", "child_seat", "meat_poultry", "boat", "aircraft", "manufactured_home", "respirator", "mine_equipment", "unclassified", "cosmetic", "tobacco", "biologic", "veterinary"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search, e.g. \"listeria deli meat\" or \"Takata airbag\"",
                "type": "string"
              },
              "since": {
                "description": "Earliest recall date, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c342ca2def2d12b844121de4c7d1b19ca160f2cda2316ff0df208c2682f1ab1"
        }
      ],
      "digest": "sha256:b3e9a19f8b4424ad65a1bf10dd813449fb56595ddf82184f73b6992dd827a3d5"
    }
  }
}
