                  },
                  "required": ["message"],
                  "type": "object"
                },
                "type": "array"
              },
              "cta": {
                "additionalProperties": {},
                "properties": {
                  "text": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["text", "url"],
                "type": "object"
              },
              "disclosure": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["ok", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Crear una alerta"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d3ae4afe20af350773a84e7985cdb2b74979e2e7a4639ed4422c73af8a08b67f"
