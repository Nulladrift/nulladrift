        {
          "name": "alertas_crear",
          "title": "Crear una alerta",
          "description": "Crea una alerta de subastas (criterios, tipos de aviso, cadencia, canales). Requiere cuenta verificada (scope `alertas:write`). Envía un correo de confirmación al crearla. Límite de alertas y canales según el plan (`ajustes`). Los mismos criterios se pueden previsualizar sin crear nada.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cadencia": {
                "description": "`instant` requiere plan Pro (si no, pasa a `daily`)",
                "enum": ["instant", "daily", "weekly"],
                "type": "string"
              },
              "canales": {
                "description": "`inapp` siempre; `email`; `push`/`telegram`/`webhook` según el plan",
                "items": {
                  "enum": ["inapp", "email", "push", "telegram", "webhook"],
                  "type": "string"
                },
                "type": "array"
              },
              "criterios": {
                "additionalProperties": false,
                "description": "Filtros que debe cumplir una subasta para disparar la alerta: provincias, municipios, tipo de inmueble, precio, superficie y ocupación.",
                "properties": {
                  "discountMinPct": {
                    "description": "Descuento mínimo sobre tasación (%): requiere plan Pro",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "endingWithinDays": {
                    "description": "Para el tipo `ending`: días antes del fin",
                    "maximum": 365,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "keywords": {
                    "description": "Palabras clave (máx. 10×40). NO filtran por zona: usa provincia/municipio",
                    "items": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "m2Max": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "m2Min": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "municipalityKeys": {
                    "description": "Claves `provincia:municipio` (de `estadisticas_publicas`)",
                    "items": {
                      "description": "Clave `provincia:municipio` (de `estadisticas_publicas`)",
                      "pattern": "^[a-z0-9-]+:[a-z0-9-]+$",
                      "type": "string"
                    },
                    "maxItems": 100,
                    "type": "array"
                  },
                  "occupied": {
                    "description": "Solo ocupadas (true) o solo libres (false)",
                    "type": "boolean"
                  },
                  "priceDropMinPct": {
                    "description": "Para el tipo `price_drop`: bajada mínima (%)",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "priceMax": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "priceMin": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "propertyTypes": {
                    "description": "Valores EXACTOS del recurso `subastech://tipos-de-inmueble`",
                    "items": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "provinceSlugs": {
                    "description": "Slugs de provincia",
                    "items": {
                      "description": "Slug en minúsculas (p. ej. `madrid`)",
                      "pattern": "^[a-z0-9-]{1,80}$",
                      "type": "string"
                    },
                    "maxItems": 60,
                    "type": "array"
                  },
                  "scoreMin": {
                    "description": "Scoring mínimo (0-100): requiere plan Pro",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "nombre": {
                "description": "Nombre de la alerta",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "quiet_hours": {
                "additionalProperties": false,
                "description": "Franja en la que no se envían avisos. `paused` la desactiva; `from` y `to` en formato HH:MM; `days` con 0 = domingo … 6 = sábado.",
                "properties": {
                  "days": {
                    "description": "0 = domingo … 6 = sábado",
                    "items": {
                      "maximum": 6,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "maxItems": 7,
                    "type": "array"
                  },
                  "from": {
                    "description": "HH:MM",
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  "paused": {
                    "type": "boolean"
                  },
                  "to": {
                    "description": "HH:MM",
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "tipos": {
                "description": "`new`, `price_drop`, `ending`, `status`",
                "items": {
                  "enum": ["new", "price_drop", "ending", "status"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["cadencia", "canales", "criterios", "nombre", "tipos"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "ajustes": {
                "items": {
