          "description": "Antes de crear una alerta: cuántas subastas coinciden ahora con los criterios, una muestra y avisos con `fix` aplicable (criterios sospechosos). Requiere cuenta (scope `alertas:read`). Los criterios avanzados (`scoreMin`, `discountMinPct`) requieren plan Pro; si no, se ignoran y se informa en `ajustes`.",
