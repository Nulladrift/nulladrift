      "instructions": "Subastech: subastas judiciales de inmuebles en España (datos del BOE). Las herramientas públicas devuelven datos oficiales del BOE (dirección, valores, fechas, resultado) y SIEMPRE la URL de la ficha en app.subastech.com: cítala. El scoring, veredicto, cargas, ROI, valoración e intervinientes requieren cuenta y plan (Pro o superior); si una herramienta devuelve `locked`, explica al usuario qué plan lo desbloquea y enlaza `upgradeUrl`. Usa `buscar_subastas` para explorar, `subasta` para una ficha, `informe` (con sesión) para el análisis. Nunca inventes valores: si un campo es null, dilo. Parte del análisis del informe se genera con IA (ver https://app.subastech.com/ia).",
      "tools": [
        {
          "name": "alertas_activar",
          "title": "Activar o pausar una alerta",
          "description": "Activa o pausa una alerta tuya sin borrarla. Requiere cuenta verificada (scope `alertas:write`).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "activa": {
                "description": "`true` reanuda la alerta; `false` la pausa sin borrarla.",
                "type": "boolean"
              },
              "id": {
                "description": "Identificador de la alerta (de `alertas_listar`).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["activa", "id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "activa": {
                "type": "boolean"
              },
              "cta": {
                "additionalProperties": {},
                "properties": {
                  "text": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["text", "url"],
                "type": "object"
              },
              "disclosure": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Activar o pausar una alerta"
          },
