        },
        {
          "name": "sendFeedback",
          "description": "Report a problem with a page of the headlesslaw corpus to its maintainers: text that differs from the official source, a broken or wrong link, missing content or an outdated status. One call per distinct problem. Reports are reviewed by the maintainers and never published. Do not include personal or confidential information.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Explain the issue in full, as if writing to a documentation maintainer who never saw this conversation. Describe what is wrong, where on the page it appears (quote the exact sentence or section title when possible), what the user was trying to do, and, when relevant, what the correct or expected information should be. Write a few clear, specific sentences in English. Never include personal or confidential information from the conversation. Up to 2048 characters.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "goal": {
                "description": "The broader end goal you were ultimately trying to accomplish (as/on behalf of the user) when you hit this issue. Gives the team the context you were working towards. Optional.",
                "maxLength": 1024,
                "type": "string"
              },
              "pageUrl": {
                "description": "The full URL of the page the issue is about (e.g. https://www.headlesslaw.com//getting-started), so the finding is linked to the exact page.",
                "type": "string"
              }
            },
            "required": ["content", "pageUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send feedback"
