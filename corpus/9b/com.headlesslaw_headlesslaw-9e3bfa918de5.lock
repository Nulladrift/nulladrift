        },
        {
          "name": "search",
          "description": "Deterministic search over the provisions and documents of the corpus (citation resolver first, then keyword and semantic legs fused by rank). Returns provision objects with their URLs, match basis, status/version/check line, as_of, coverage and limits; a zero is never returned without what was searched.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "A date YYYY-MM-DD.",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor of a previous answer.",
                "type": "string"
              },
              "level": {
                "description": "L1, L2 or L3.",
                "type": "string"
              },
              "limit": {
                "description": "Results per page (1–50, default 10).",
                "type": "number"
              },
              "query": {
                "description": "Words or a citation.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "regime": {
                "description": "An act's short slug, e.g. mica, dora, mifid2.",
                "type": "string"
              },
              "release": {
                "description": "Optional release id (or its first 8+ hex characters) to pin a multi-call task to one release; releases stay available for 24 hours after they leave the live position. Outside that window the answer is release_unavailable (isError), naming the current release — never silently another release.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
