        },
        {
          "name": "get_relations",
          "description": "The relations of a provision on a date: Level 2 acts that implement it, Level 3 documents that explain it, provisions that cite it, defined terms it uses, amending acts and corrigenda — each with its basis, method and evidence (public keys only: the legal basis as the document states it, the consolidation, the corrigendum and its URL, the source object). Inverse edges are computed; targets are resolved on as_of. A relation starts on the date its source text exists (for a Q&A answer, the register's date of the answer); a source without a stated date has src_from null.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "A date YYYY-MM-DD.",
                "type": "string"
              },
              "direction": {
                "description": "in or out.",
                "type": "string"
              },
              "ref": {
                "description": "A page address (https://www.headlesslaw.com/… or a path such as /mica/articles/75) or a citation (\"Art 75(3) MiCA\", \"Article 75(3) of Regulation (EU) 2023/1114\", \"2025/298\", a CELEX number).",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "release": {
                "description": "Optional release id (or its first 8+ hex characters) to pin a multi-call task to one release; releases stay available for 24 hours after they leave the live position. Outside that window the answer is release_unavailable (isError), naming the current release — never silently another release.",
                "type": "string"
              },
              "type": {
                "description": "One of implements, answers, guides, refers_to, uses_term, amended_by, corrected_by, related_annex.",
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get relations"
