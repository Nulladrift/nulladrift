        {
          "name": "searchDocumentation",
          "description": "Search the headlesslaw corpus: the verbatim text of EU financial and digital regulation (Level 1 acts, their Level 2 technical standards and Level 3 guidelines and Q&As) and the definitions. Returns matching passages, each with its page title and page address. Use getPage with a returned address to read the whole page. Results are the official text as published on the site, without commentary.",
