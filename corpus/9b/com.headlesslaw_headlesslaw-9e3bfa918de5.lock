        {
          "name": "resolve_citation",
          "description": "Resolve a citation string to the provision (or act) it names, with its URL. Citation-shaped input only; nothing is ranked. Forms: 'Art 75(3)(a) MiCA', 'point (a) of Article 75(3) MiCA', 'Article 75 paragraph 3 MiCA', 'Recital 22 MiCA', 'Recital (22) MiCA', 'recital 22 of Regulation (EU) 2023/1114', 'MiCA Recital 22', 'Annex I MiCA', 'Annex III to Regulation (EU) …', '<act>:recital:<n>', '<act>:annex:<n>' (Roman or Arabic), CELEX numbers; act names as usually written (MiCA/MiCAR, MiFID II/MiFID 2, TFR …). A recital or annex resolves only when the release serves it; otherwise not_resolved, naming the act.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "citation": {
                "description": "E.g. \"Art 75(3) MiCA\", \"Article 75(3) of Regulation (EU) 2023/1114\", \"2025/298\", \"32023R1114\".",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "release": {
                "description": "Optional release id (or its first 8+ hex characters) to pin a multi-call task to one release; releases stay available for 24 hours after they leave the live position. Outside that window the answer is release_unavailable (isError), naming the current release — never silently another release.",
                "type": "string"
              }
            },
            "required": ["citation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Resolve a citation"
