        {
          "name": "get_provision",
          "description": "One provision (article, annex, recitals) as structured units with its status, version, check, applicability, official source — today or as it stood on as_of (time travel: text in force on that date, or an explicit state such as not_available_for_date or update_pending; never the current text in place of a past one). Each unit's `text` is plain Unicode; raised/lowered wording as the official text prints it (10 with a superscript 25, K with a subscript CCP) is a mark in the unit's `marks`: [{kind: superscript | subscript, start, end}], Unicode code-point offsets into `text` (empty when none); the page Markdown carries it as <sup>/<sub>. A date with no text (date_state not_yet_adopted, not_available_for_date, absent) is a normal answer, not an error.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "A date YYYY-MM-DD.",
                "type": "string"
              },
              "ref": {
                "description": "A page address (https://www.headlesslaw.com/… or a path such as /mica/articles/75) or a citation (\"Art 75(3) MiCA\", \"Article 75(3) of Regulation (EU) 2023/1114\", \"2025/298\", a CELEX number).",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "release": {
                "description": "Optional release id (or its first 8+ hex characters) to pin a multi-call task to one release; releases stay available for 24 hours after they leave the live position. Outside that window the answer is release_unavailable (isError), naming the current release — never silently another release.",
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
