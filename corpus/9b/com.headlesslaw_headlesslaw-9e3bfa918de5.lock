          "digest": "sha256:732174986a9524391e9ad33d04db25dbb8d3a0ea1662fa53930c3cf8a9ab3557"
        },
        {
          "name": "get_definition",
          "description": "A defined term in its governing act: the defining provision's text, its URL and the definition page. `text` is the definition without the page's list of provisions that use the term; `used_in` gives their count and the page that lists them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "act": {
                "description": "Optional act slug to choose between acts defining the same term.",
                "type": "string"
              },
              "release": {
                "description": "Optional release id (or its first 8+ hex characters) to pin a multi-call task to one release; releases stay available for 24 hours after they leave the live position. Outside that window the answer is release_unavailable (isError), naming the current release — never silently another release.",
                "type": "string"
              },
              "term": {
                "description": "The term, e.g. \"crypto-asset\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
