      },
      "instructions": "headlesslaw serves the verbatim text of EU financial and digital regulation with its official sources. Use search or searchDocumentation to find provisions, resolve_citation for a citation, get_provision or getPage for the text (get_provision takes as_of for a past date), list_versions and compare for its history, get_relations for its Level 2 and Level 3 instruments, citations and amendments, get_definition for a defined term. Every answer names its release, as_of, coverage and limits. The text is not legal advice and carries no commentary.",
      "tools": [
        {
          "name": "compare",
          "description": "Word-level comparison of a provision between two dates, both sides with their dates, consolidations, official sources and check status; a side we hold no text for says so. The ops carry plain text; each change's `from_marks` / `to_marks` give the raised/lowered wording (superscript / subscript) of the two sides as code-point offsets into the concatenated eq+del (from) and eq+ins (to) text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "A date YYYY-MM-DD.",
                "type": "string"
              },
              "ref": {
                "description": "A page address (https://www.headlesslaw.com/… or a path such as /mica/articles/75) or a citation (\"Art 75(3) MiCA\", \"Article 75(3) of Regulation (EU) 2023/1114\", \"2025/298\", a CELEX number).",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "release": {
                "description": "Optional release id (or its first 8+ hex characters) to pin a multi-call task to one release; releases stay available for 24 hours after they leave the live position. Outside that window the answer is release_unavailable (isError), naming the current release — never silently another release.",
                "type": "string"
              },
              "to": {
                "description": "A date YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["from", "ref", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two versions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cea3b3b7fa1dc335c4091143e572eaa726e0354d66940d980450eead88a63a5f"
        },
        {
          "name": "getPage",
          "description": "Fetch the full Markdown of one page of the headlesslaw corpus by its address (for example https://www.headlesslaw.com/mica/articles/3). The page carries the verbatim official text, its status line and its official source, plus links to related provisions and documents that you can follow with getPage. Addresses returned by searchDocumentation work here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The URL of the page to fetch",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get page content"
          },
          "behavior": {
            "destructive": false,
