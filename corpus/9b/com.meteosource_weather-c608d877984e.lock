                    "minimum": -90,
                    "title": "Lat",
                    "type": "number"
                  },
                  "lon": {
                    "default": null,
                    "description": "Longitude in decimal degrees",
                    "maximum": 180,
                    "minimum": -180,
                    "title": "Lon",
                    "type": "number"
                  },
                  "place_id": {
                    "default": null,
                    "description": "Meteosource place identifier",
                    "title": "Place Id",
                    "type": "string"
