{
  "lockfileVersion": 2,
  "subjects": {
    "com.meteosource/weather": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.meteosource.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "meteosource",
        "title": "Meteosource Weather",
        "version": "",
        "description": "Weather forecasts, severe-weather alerts and historical weather archive."
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Weather data tools backed by the Meteosource API. Typical flow:\n1. Resolve locations with search_places (name/postal code -> place_id).\n2. Use get_forecast for current conditions and forecasts (batch up to 20\n   locations; use the `variables` filter to keep responses small).\n3. Use get_alerts for official severe-weather warnings (cheap, poll-friendly).\n4. Use get_weather_history for past weather with daily/monthly aggregation;\n   `normals=true` adds long-term normals and records for comparison.\n5. Use get_air_quality for smog / pollutant forecasts (hourly, ~4 days).\n6. Use get_solar_production / get_wind_production for the output of a PV\n   system or a wind farm, up to 20 years back and 4 days ahead; sites are\n   lat/lon plus the installation, no place_id.\nTime series come back as tables: `columns` listed once and `rows` as arrays\nin column order (nested fields flattened: wind_speed, probability_storm).\nFeature availability depends on the caller's subscription, which the server\nreads from their API key: the free tier has no alerts, no minutely data and\nno historical archive, and how far back the archive reaches without the paid\nhistorical add-on depends on the plan (startup 7 days, standard 1 year,\nrenewables 3 years, byvalue 366 days at most). A key is on one tier, as the\nkey service reports it: the two production tools need it to be renewables,\nwhich in turn has no weather endpoints.\n",
      "tools": [
        {
          "name": "get_air_quality",
          "description": "Hourly air-quality (smog) forecast for up to 20 locations, about 4 days ahead.\n\n    Columns: `air_quality` (index, 1 = good, higher = worse) and pollutant\n    surface concentrations — default pm10, pm25, no2_surface, so2_surface,\n    ozone_surface; also available via `variables`: co_surface, no_surface,\n    ozone_total, aerosol_550, dust_550nm, dust_mixing_ratio_05. Output is a\n    table per location (`columns` once, `rows` as arrays), trimmed to `hours`.\n    Not available on the free tier.\n    ",
          "inputSchema": {
            "$defs": {
              "LocationIn": {
                "description": "A single location: either a Meteosource place_id (from search_places)\nor a lat/lon pair. An optional label is echoed back in results.",
                "properties": {
                  "label": {
                    "default": null,
                    "description": "Optional human-readable name echoed in results",
                    "title": "Label",
                    "type": "string"
                  },
                  "lat": {
                    "default": null,
                    "description": "Latitude in decimal degrees",
                    "maximum": 90,
                    "minimum": -90,
                    "title": "Lat",
                    "type": "number"
                  },
                  "lon": {
                    "default": null,
                    "description": "Longitude in decimal degrees",
                    "maximum": 180,
                    "minimum": -180,
                    "title": "Lon",
                    "type": "number"
                  },
                  "place_id": {
                    "default": null,
                    "description": "Meteosource place identifier",
                    "title": "Place Id",
                    "type": "string"
                  }
                },
                "title": "LocationIn",
                "type": "object"
              }
            },
            "properties": {
              "hours": {
                "default": 48,
                "title": "Hours",
                "type": "integer"
              },
              "locations": {
                "items": {
                  "$ref": "#/$defs/LocationIn"
                },
                "title": "Locations",
                "type": "array"
              },
              "timezone": {
                "default": "auto",
                "title": "Timezone",
                "type": "string"
              },
              "variables": {
                "default": null,
                "items": {
                  "type": "string"
                },
                "title": "Variables",
                "type": "array"
              }
            },
            "required": ["locations"],
            "title": "get_air_qualityArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bca9d1d42ac54294cf60f2db92ea4616745a6c0ff4c7c9cadfb37d6ca4980de5"
        },
        {
          "name": "get_alerts",
          "description": "Official weather warnings (severe weather alerts) for up to 20 locations.\n\n    Returns only locations that currently have an active alert, with event\n    type, severity, validity window and headline — an empty list means all\n    clear. Cheap to call frequently; designed for monitoring/polling.\n    Coverage: USA, EU countries and Canada. Requires the startup tier or\n    higher (not available on the free tier).\n    ",
          "inputSchema": {
            "$defs": {
              "LocationIn": {
                "description": "A single location: either a Meteosource place_id (from search_places)\nor a lat/lon pair. An optional label is echoed back in results.",
                "properties": {
                  "label": {
                    "default": null,
                    "description": "Optional human-readable name echoed in results",
                    "title": "Label",
                    "type": "string"
                  },
                  "lat": {
