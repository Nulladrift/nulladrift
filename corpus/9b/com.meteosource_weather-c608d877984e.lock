              },
              "locations": {
                "items": {
                  "$ref": "#/$defs/LocationIn"
                },
                "title": "Locations",
                "type": "array"
              }
            },
            "required": ["locations"],
            "title": "get_alertsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b9385131668b3877b5929e84d79b71e653801a5414cfa4831c2a3a0f8031ed1"
        },
        {
          "name": "get_forecast",
          "description": "Weather forecast for up to 20 locations in one call.\n\n    Sections (comma-separated): 'current' (now), 'hourly' (up to 168 h ahead,\n    trimmed to `hours`), 'daily' (up to 30 days ahead, trimmed to `days`),\n    'minutely' (precipitation minute-by-minute, higher tiers), 'alerts'\n    (official weather warnings, startup tier and above), or 'all'.\n    Use `variables` to keep only specific fields (e.g. [\"temperature\", \"wind\",\n    \"precipitation\", \"probability\", \"irradiance\"]) and reduce output size —\n    recommended when querying many locations. Timezone defaults to each\n    location's local time; units default per-country ('metric' forces SI).\n    Forecast horizon depends on the subscription tier (free: 7 days).\n\n    Output: time series (hourly, daily, minutely) are tables — `columns`\n    listed once and `rows` as arrays in column order; nested API groups are\n    flattened with underscores (wind_speed, probability_storm,\n    cloud_cover_total). `units` is given once at the top level when it is\n    the same for every location.\n    ",
          "inputSchema": {
            "$defs": {
              "LocationIn": {
                "description": "A single location: either a Meteosource place_id (from search_places)\nor a lat/lon pair. An optional label is echoed back in results.",
                "properties": {
                  "label": {
                    "default": null,
                    "description": "Optional human-readable name echoed in results",
                    "title": "Label",
                    "type": "string"
                  },
                  "lat": {
                    "default": null,
                    "description": "Latitude in decimal degrees",
                    "maximum": 90,
                    "minimum": -90,
                    "title": "Lat",
                    "type": "number"
                  },
                  "lon": {
                    "default": null,
                    "description": "Longitude in decimal degrees",
                    "maximum": 180,
                    "minimum": -180,
                    "title": "Lon",
                    "type": "number"
                  },
                  "place_id": {
                    "default": null,
                    "description": "Meteosource place identifier",
                    "title": "Place Id",
                    "type": "string"
                  }
                },
                "title": "LocationIn",
                "type": "object"
              }
            },
            "properties": {
              "days": {
                "default": 7,
                "title": "Days",
                "type": "integer"
              },
              "hours": {
                "default": 48,
                "title": "Hours",
                "type": "integer"
              },
              "language": {
                "default": "en",
                "title": "Language",
                "type": "string"
              },
              "locations": {
                "items": {
                  "$ref": "#/$defs/LocationIn"
                },
                "title": "Locations",
                "type": "array"
              },
              "sections": {
                "default": "current,daily",
                "title": "Sections",
                "type": "string"
              },
              "timezone": {
                "default": "auto",
                "title": "Timezone",
                "type": "string"
              },
              "units": {
                "default": "auto",
                "title": "Units",
                "type": "string"
              },
              "variables": {
                "default": null,
                "items": {
                  "type": "string"
                },
                "title": "Variables",
                "type": "array"
              }
            },
            "required": ["locations"],
            "title": "get_forecastArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d139b97e1b77a924e9698b49f1b854ad105a01f1dae7beda3aed0e4da65b31c"
        },
        {
          "name": "get_solar_production",
          "description": "Production of photovoltaic systems, past and forecast, for up to 20 sites.\n\n    Each site is lat + lon plus the installation: module_kw (installed kWp;\n    use 1 to get specific yield per kWp), inverter_kw (defaults to module_kw),\n    tilt (degrees from horizontal, default 30) and orientation (azimuth the\n    modules face, clockwise from north: 180 = south, the default). Dates are\n    YYYY-MM-DD, inclusive, from up to 20 years back to 4 days ahead, so one\n    call can cover last week's actual weather and the coming days. The\n    renewables plan includes the last 3 years; older days need the paid\n    historical add-on, otherwise the API refuses them (\"historical data this\n    old\"), reported per site.\n    Granularity: 'hourly' (power at each full hour, max 14 days per call),\n    'daily' or 'monthly' (energy, max 366 days per call — call repeatedly for\n    multi-year yield; past days are cached so repeats are cheap).\n    Columns: production_kw = output of the system at that hour (an\n    instantaneous value); production_kwh = energy of the day or month, summed\n    from those hourly values; production_max_kw = its peak.\n    `variables` adds the weather behind the production: irradiance (ghi, dni,\n    dhi in W/m2 hourly; ghi/dni/dhi_sum_wh_m2 daily and monthly), temperature,\n    cloud_cover, humidity, dew_point, pressure, snowfall (flag per hour;\n    snowfall_hours daily and monthly).\n    Each site+day costs one API request on first fetch; a single call is\n    capped at 400 site-days — split longer ranges into multiple calls.\n    Needs a key on the renewables tier.\n\n    Output: `columns` once at the top level; each site has `rows` as arrays\n    in column order.\n    ",
          "inputSchema": {
            "$defs": {
              "SolarSiteIn": {
                "description": "A photovoltaic installation: where it stands and how it is built.\nThe defaults of tilt and orientation are the API's own; they are always\nsent, so a cached day can never depend on a default the API changed.",
                "properties": {
                  "inverter_kw": {
                    "default": null,
                    "description": "Inverter power in kW; defaults to module_kw",
                    "exclusiveMinimum": 0,
                    "title": "Inverter Kw",
                    "type": "number"
                  },
                  "label": {
                    "default": null,
                    "description": "Optional human-readable name echoed in results",
                    "title": "Label",
                    "type": "string"
                  },
                  "lat": {
                    "description": "Latitude in decimal degrees",
                    "maximum": 90,
                    "minimum": -90,
                    "title": "Lat",
                    "type": "number"
                  },
                  "lon": {
                    "description": "Longitude in decimal degrees",
                    "maximum": 180,
                    "minimum": -180,
                    "title": "Lon",
                    "type": "number"
                  },
                  "module_kw": {
                    "description": "Installed module power in kW (kWp); use 1 for specific yield per kWp",
                    "exclusiveMinimum": 0,
                    "title": "Module Kw",
                    "type": "number"
                  },
                  "orientation": {
                    "default": 180,
                    "description": "Azimuth the modules face, in degrees clockwise from north: 90 = east, 180 = south, 270 = west",
                    "maximum": 360,
                    "minimum": 0,
                    "title": "Orientation",
                    "type": "integer"
                  },
                  "tilt": {
                    "default": 30,
                    "description": "Tilt of the modules from horizontal in degrees: 0 = flat, 90 = vertical",
                    "maximum": 90,
                    "minimum": 0,
                    "title": "Tilt",
                    "type": "integer"
                  }
                },
                "required": ["lat", "lon", "module_kw"],
                "title": "SolarSiteIn",
                "type": "object"
              }
            },
            "properties": {
              "date_from": {
                "title": "Date From",
                "type": "string"
              },
              "date_to": {
                "title": "Date To",
                "type": "string"
              },
              "granularity": {
                "default": "daily",
                "title": "Granularity",
                "type": "string"
              },
              "sites": {
                "items": {
                  "$ref": "#/$defs/SolarSiteIn"
                },
                "title": "Sites",
                "type": "array"
              },
              "timezone": {
                "default": "auto",
                "title": "Timezone",
                "type": "string"
              },
              "units": {
                "default": "metric",
                "title": "Units",
                "type": "string"
              },
              "variables": {
                "default": null,
                "items": {
                  "type": "string"
                },
                "title": "Variables",
                "type": "array"
              }
            },
            "required": ["date_from", "date_to", "sites"],
            "title": "get_solar_productionArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e69a00aa7fa71335f0ff093e15c342bc948ce6c278ffe464156d2679f89ddbd1"
        },
        {
          "name": "get_weather_history",
          "description": "Historical weather (archive) with server-side aggregation.\n\n    The archive holds 20 years, but how much of it a key may read depends on\n    its plan: startup includes the last 7 days, standard the last year,\n    premium and flexi all 20 years; byvalue reaches 366 days back and no\n    further. Older days need Meteosource's paid historical add-on (billed per\n    location and day); without it the API refuses such a day with \"not\n    allowed to access historical data this old\", reported per location, so\n    start inside the plan's range. Dates are YYYY-MM-DD, inclusive.\n    Granularity: 'hourly' (raw hours, max 14 days per call), 'daily'\n    (per-day min/max/avg/sum statistics, max 366 days) or 'monthly'\n    (folded from daily, max 366 days per call — call repeatedly for\n    multi-year analyses; results are cached so repeats are cheap).\n    Variables (default: temperature, precipitation, wind): cape, cloud_cover,\n    dew_point, evaporation, feels_like, humidity, irradiance, ozone,\n    precipitation, precipitation_type, pressure, soil_temperature,\n    surface_temperature, temperature, weather, wind, wind_distribution.\n    Aggregations per variable: temperature min/max/avg, precipitation sum,\n    wind speed avg + gusts max, irradiance sum in Wh/m2 (useful for PV\n    analysis), weather = most frequent code of the day, precipitation_types =\n    kinds seen that day (e.g. \"rain,snow\"; \"none\" when dry) — use weather and\n    precipitation_type to document what happened (snow, fog, thunderstorm).\n    wind_distribution (daily/monthly; for wind-turbine siting) = hours per\n    10 m wind-speed bin (wind_hours_0_2 … wind_hours_10_plus) and\n    wind_power_density_w_m2 = 1/2 * 1.225 * mean(v^3) at 10 m — scale to hub\n    height yourself (the API has no hub-height wind).\n    `normals=true` (daily/monthly) adds long-term columns for each calendar\n    day: temperature_normal_avg/min/max, temperature_record_min/max,\n    wind_normal_speed, wind_record_gusts, precipitation_normal_sum and\n    precipitation_normal_probability — compare a period with its normal in\n    one call. Each location+day costs one API request on first fetch;\n    a single call is capped at 400 location-days — split longer ranges\n    into multiple calls. Not available on the free tier (startup+).\n\n    Output: `columns` once at the top level; each location has `rows` as\n    arrays in column order (a year of daily rows is ~15 kB).\n    ",
          "inputSchema": {
            "$defs": {
              "LocationIn": {
                "description": "A single location: either a Meteosource place_id (from search_places)\nor a lat/lon pair. An optional label is echoed back in results.",
                "properties": {
                  "label": {
                    "default": null,
                    "description": "Optional human-readable name echoed in results",
                    "title": "Label",
                    "type": "string"
                  },
                  "lat": {
                    "default": null,
                    "description": "Latitude in decimal degrees",
                    "maximum": 90,
                    "minimum": -90,
                    "title": "Lat",
                    "type": "number"
                  },
                  "lon": {
                    "default": null,
                    "description": "Longitude in decimal degrees",
                    "maximum": 180,
                    "minimum": -180,
                    "title": "Lon",
                    "type": "number"
                  },
                  "place_id": {
                    "default": null,
                    "description": "Meteosource place identifier",
                    "title": "Place Id",
                    "type": "string"
                  }
                },
                "title": "LocationIn",
                "type": "object"
              }
            },
            "properties": {
              "date_from": {
                "title": "Date From",
                "type": "string"
              },
              "date_to": {
                "title": "Date To",
                "type": "string"
              },
              "granularity": {
                "default": "daily",
                "title": "Granularity",
                "type": "string"
              },
              "locations": {
                "items": {
                  "$ref": "#/$defs/LocationIn"
                },
                "title": "Locations",
                "type": "array"
              },
              "normals": {
                "default": false,
                "title": "Normals",
                "type": "boolean"
              },
              "timezone": {
                "default": "auto",
                "title": "Timezone",
                "type": "string"
              },
              "units": {
                "default": "metric",
                "title": "Units",
                "type": "string"
              },
              "variables": {
                "default": null,
                "items": {
                  "type": "string"
                },
                "title": "Variables",
                "type": "array"
              }
            },
            "required": ["date_from", "date_to", "locations"],
            "title": "get_weather_historyArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0936ff72bfaa0b10697b4f3bfac3b608c23407c22144e8380d9c5c5a0777b3fa"
        },
        {
          "name": "get_wind_production",
          "description": "Production of wind farms, past and forecast, for up to 20 sites.\n\n    Each site is lat + lon plus the farm: turbine_model (catalogue below),\n    exactly one of turbine_count or total_capacity (MW), hub_height (metres,\n    default 100) and roughness of the surrounding terrain (water, open,\n    farmland — the default, suburban, urban). Dates are YYYY-MM-DD, inclusive,\n    from up to 20 years back to 4 days ahead, so one call can cover last\n    week's actual weather and the coming days. The renewables plan includes\n    the last 3 years; older days need the paid historical add-on, otherwise\n    the API refuses them (\"historical data this old\"), reported per site.\n    Granularity: 'hourly' (power at each full hour, max 14 days per call),\n    'daily' or 'monthly' (energy, max 366 days per call — call repeatedly for\n    multi-year yield; past days are cached so repeats are cheap).\n    Columns: production_mw = output of the whole farm at that hour (an\n    instantaneous value); production_mwh = energy of the day or month, summed\n    from those hourly values; production_max_mw = its peak.\n    `variables` adds the weather behind the production: wind (10 m above\n    ground, not hub height: wind_10m_speed, wind_10m_gusts and wind_10m_angle\n    hourly; speed avg/max and gusts max daily and monthly), temperature,\n    dew_point, pressure.\n    Turbine catalogue (series + rotor diameter in m / rated power in kW):\n    Adwen AD116/5000; Enercon E48/800, E-53/800, E-70/2000, E-70/2300,\n    E-82/2000, E-82/2300, E-82/2350, E-82/3000, E-92/2350, E-101/3050,\n    E-101/3500, E-115/3000, E-115/3200, E-126/4200, E-126/7500, E-126/7580,\n    E-141/4200; Eno ENO100/2200, ENO114/3500, ENO126/3500; GE GE100/2500,\n    GE103/2750, GE120/2500, GE120/2750, GE130/3200; Nordex N90/2500,\n    N100/2500, N117/2400, N131/3000, N131/3300, N131/3600; Senvion MM92/2050,\n    MM100/2000, S104/3400, S114/3200, S114/3400, S122/3000, S122/3200,\n    S126/6150, S152/6330; aerodyn SCD168/8000; Siemens SWT113/2300,\n    SWT113/3200, SWT120/3600 (the default), SWT130/3300, SWT130/3600,\n    SWT142/3150; Vestas V80/2000, V90/2000, V90/2000/GS, V90/3000, V100/1800,\n    V100/1800/GS, V112/3000, V112/3075, V112/3300, V112/3450, V117/3300,\n    V117/3450, V117/3600, V126/3000, V126/3300, V126/3450, V164/8000,\n    V164/9500; Vensys VS112/2500.\n    Each site+day costs one API request on first fetch; a single call is\n    capped at 400 site-days — split longer ranges into multiple calls.\n    Needs a key on the renewables tier.\n\n    Output: `columns` once at the top level; each site has `rows` as arrays\n    in column order.\n    ",
          "inputSchema": {
            "$defs": {
              "WindSiteIn": {
                "description": "A wind farm: where it stands and which turbines it runs. The farm's\nsize is either a number of turbines or a total capacity, never both (the\nAPI takes exactly one). Defaults are the API's own and are always sent,\nfor the same reason as on SolarSiteIn.",
                "properties": {
                  "hub_height": {
                    "default": 100,
                    "description": "Hub height in metres",
                    "exclusiveMinimum": 0,
                    "title": "Hub Height",
                    "type": "integer"
                  },
                  "label": {
                    "default": null,
                    "description": "Optional human-readable name echoed in results",
                    "title": "Label",
                    "type": "string"
                  },
                  "lat": {
                    "description": "Latitude in decimal degrees",
                    "maximum": 90,
                    "minimum": -90,
                    "title": "Lat",
                    "type": "number"
                  },
                  "lon": {
                    "description": "Longitude in decimal degrees",
                    "maximum": 180,
                    "minimum": -180,
                    "title": "Lon",
                    "type": "number"
                  },
                  "roughness": {
                    "default": "farmland",
                    "description": "Terrain around the site",
                    "enum": ["water", "open", "farmland", "suburban", "urban"],
                    "title": "Roughness",
                    "type": "string"
                  },
                  "total_capacity": {
                    "default": null,
                    "description": "Total capacity of the farm in MW; give this or turbine_count, not both",
                    "exclusiveMinimum": 0,
                    "title": "Total Capacity",
                    "type": "number"
                  },
                  "turbine_count": {
                    "default": null,
                    "description": "Number of turbines; give this or total_capacity, not both",
                    "minimum": 1,
                    "title": "Turbine Count",
                    "type": "integer"
                  },
                  "turbine_model": {
                    "default": "SWT120/3600",
                    "description": "Turbine model from the catalogue in the tool description",
                    "title": "Turbine Model",
                    "type": "string"
