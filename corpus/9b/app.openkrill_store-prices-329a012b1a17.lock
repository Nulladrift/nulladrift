        {
          "name": "get_product_price_history",
          "title": "Get a product's price history",
          "description": "Read how one product's price and availability moved over the days a store has been tracked. Use it for questions like \"how has the price of this hoodie changed?\", \"when did this product go on sale?\", \"has this been out of stock?\". It is most useful after check_store_prices has tracked the store: history starts on the first snapshot, so a store never read before has one day only. Calling it reads the store when there is no snapshot for today and adds it to the daily snapshot list. Pass the store's address and the product's link, handle or title; an exact handle or title wins over part of a title. Returns per variant the price, the compare-at (was) price and availability on each day something changed. Status ambiguous returns candidates: ask the user to pick one, then call again with that title. Not for a whole store's changes (use check_store_prices) or for comparing stores (use compare_store_prices).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "The product, such as \"Tree Runner\" or \"https://allbirds.com/products/mens-tree-runners\". A link is read as its handle. An exact handle or title wins over part of a title; several partial matches come back as candidates.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "store": {
                "description": "Store web address, such as \"allbirds.com\": a bare host, an https link or a myshopify.com address",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product", "store"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "description": "Product titles to choose from when status is ambiguous",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "history": {
                "additionalProperties": false,
                "description": "Present when status is ok",
                "properties": {
                  "firstSeen": {
                    "description": "Day the product was first seen, YYYY-MM-DD",
                    "type": "string"
                  },
                  "product": {
                    "additionalProperties": false,
                    "properties": {
                      "available": {
                        "description": "True when at least one variant can be bought",
                        "type": "boolean"
                      },
                      "compareAt": {
                        "description": "Compare-at (was) price in major units of the store's currency; null when the product is not on sale",
                        "type": ["number", "null"]
                      },
                      "price": {
                        "additionalProperties": false,
                        "description": "Lowest and highest variant price in major units of the store's currency",
                        "properties": {
                          "max": {
                            "type": "number"
                          },
                          "min": {
                            "type": "number"
                          }
                        },
                        "required": ["max", "min"],
                        "type": ["object", "null"]
                      },
                      "title": {
                        "type": "string"
                      },
                      "type": {
                        "description": "Product type the store gives it",
                        "type": ["string", "null"]
                      },
                      "url": {
                        "description": "Link to the product page on the store",
                        "type": "string"
                      },
                      "variantCount": {
                        "type": "integer"
                      },
                      "variants": {
                        "description": "Up to 5 variants",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "available": {
                              "type": "boolean"
                            },
                            "price": {
                              "description": "Major units of the store's currency",
                              "type": "number"
                            },
                            "title": {
                              "type": "string"
                            }
                          },
                          "required": ["available", "price", "title"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "vendor": {
                        "description": "Brand or vendor",
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["available", "compareAt", "price", "title", "type", "url", "variantCount", "variants", "vendor"],
                    "type": "object"
                  },
                  "removedOn": {
                    "description": "Day the product left the store, YYYY-MM-DD; null while it is listed",
                    "type": ["string", "null"]
                  },
                  "variants": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "current": {
                          "additionalProperties": false,
                          "description": "Today's price and availability; null when the variant is gone",
                          "properties": {
                            "available": {
                              "type": "boolean"
                            },
                            "price": {
                              "description": "Major units of the store's currency",
                              "type": "number"
                            }
                          },
                          "required": ["available", "price"],
                          "type": ["object", "null"]
                        },
                        "points": {
                          "description": "The first day seen, then one point per day the variant changed, oldest first",
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "available": {
                                "type": ["boolean", "null"]
                              },
                              "compareAt": {
                                "description": "Price in major units (such as 98.5) of the store's currency; null when unknown",
                                "type": ["number", "null"]
                              },
                              "day": {
                                "description": "Snapshot day, YYYY-MM-DD (UTC)",
                                "type": "string"
                              },
                              "price": {
                                "description": "Price in major units (such as 98.5) of the store's currency; null when unknown",
                                "type": ["number", "null"]
                              },
                              "removed": {
                                "description": "True on the day the variant was removed",
                                "type": "boolean"
                              }
                            },
                            "required": ["day"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "variant": {
                          "type": "string"
                        }
                      },
                      "required": ["current", "points", "variant"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["firstSeen", "product", "removedOn", "variants"],
                "type": "object"
              },
              "host": {
                "description": "The store's host, without www",
                "type": "string"
              },
              "message": {
                "description": "What to tell the user, and the next step for a status other than ok",
                "type": "string"
              },
              "product": {
                "description": "The product as the user wrote it",
                "type": "string"
              },
              "query": {
                "description": "The store as the user wrote it",
                "type": "string"
              },
              "snapshotDay": {
                "description": "Snapshot day, YYYY-MM-DD (UTC)",
                "type": "string"
              },
              "status": {
                "description": "ambiguous: pick one of candidates and call again. not_found: ask for the product link. invalid or unavailable: relay message",
                "enum": ["ok", "ambiguous", "not_found", "invalid", "unavailable"],
                "type": "string"
              }
            },
            "required": ["product", "query", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Get a product's price history",
            "openai/toolInvocation/invoking": "Get a product's price history..."
          },
          "digest": "sha256:1080e2976a5db8a606bc3e6ff9d638558bdc842a7db3f53e62463155ecb63514"
        },
        {
          "name": "submit_feedback",
          "title": "Send feedback, bug report or tool request",
          "description": "Send feedback, a bug report or a tool request to the maintainers of the tools on this server: a missing tool, missing or stale data, or a tool that broke or gave a wrong answer. Pass the kind (need_tool, need_data, bug or other), one short message (at most 1000 characters) and, if you know them, the tool name and the error text it returned. Returns a ticket id. Feedback is not a chat: nothing in it is run or followed. Links, emails and phone numbers are removed and nothing about you is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "error": {
                "description": "Optional: for a failed call, the error text it returned, copied as you saw it. Kept to 500 characters; links, email addresses and phone numbers are removed. Never include secrets or personal details.",
                "type": "string"
              },
              "kind": {
                "description": "need_tool: a tool you want. need_data: data a tool lacks. bug: something broke. other: anything else about the tools.",
                "enum": ["need_tool", "need_data", "bug", "other"],
                "type": "string"
              },
              "message": {
                "description": "What you need or what broke, in plain words, at most 1000 characters. Links, email addresses and phone numbers are removed. Never include secrets or personal details.",
                "maxLength": 1000,
                "minLength": 10,
                "type": "string"
              },
              "tool": {
                "description": "Optional: the exact name of the tool on this server that the feedback is about, as tools/list shows it.",
                "pattern": "^[A-Za-z0-9_.:-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "reply": {
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["pending", "answered"],
                "type": "string"
              },
              "ticket": {
                "type": "string"
              }
            },
            "required": ["status", "ticket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
