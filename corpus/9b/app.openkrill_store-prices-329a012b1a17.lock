        {
          "name": "compare_store_prices",
          "title": "Compare prices and find gaps across stores",
          "description": "Compare product prices between two online stores to find price gaps and margin differences. Use it for questions like \"compare prices between allbirds.com and allbirds.co.uk\" or \"which store sells this item cheaper?\". Pass source_store (the benchmark) and target_store addresses. Products are paired by title by default; use match_by \"handle\" for two regional stores of one brand. Other currencies are converted into the target currency with the latest ECB reference rate unless fx_rate is given. Returns matched pairs with both prices, the gap and percent spread (positive when the target store is dearer), stock, links and the landed gap: the gap left after the shipping and duty allowances per item. Status no_matches means no product paired: try another match_by, a shorter query or a lower min_gap_pct. It adds both stores to the daily snapshot list. Not for one store's changes (use check_store_prices) or one product's history (use get_product_price_history).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duty_allowance": {
                "description": "Duty per item in the target currency, subtracted from landed_gap. When set, it replaces the EU flat duty of include_landed_duty. When omitted, duty is 0 unless include_landed_duty is true.",
                "minimum": 0,
                "type": "number"
              },
              "fx_rate": {
                "description": "Manual rate: units of the target currency per 1 unit of the source store currency, such as 0.86 for USD to GBP. Same direction as fx_conversion.rate. Default: the latest ECB reference rate.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "include_landed_duty": {
                "default": false,
                "description": "Subtract the flat EU duty on low-value parcels (3 EUR per item, Council Regulation (EU) 2026/382, converted to the target currency) from landed_gap. duty_allowance replaces it when set.",
                "type": "boolean"
              },
              "match_by": {
                "default": "title",
                "description": "How products are paired: \"title\" (title without case or punctuation, the default), \"handle\" (the /products/ URL slug, best for two regional stores of one brand) or \"sku\" (first variant name).",
                "enum": ["title", "sku", "handle"],
                "type": "string"
              },
              "min_gap_pct": {
                "default": 0,
                "description": "Keep only pairs whose price gap, in either direction, is at least this percent of the converted source price, such as 15. Default 0 keeps every pair.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Optional text filter for product title, brand, or category, such as \"runner\" or \"sneaker\".",
                "maxLength": 200,
                "type": "string"
              },
              "shipping_allowance": {
                "default": 0,
                "description": "Shipping cost per item in the target currency, subtracted from landed_gap. Default 0.",
                "minimum": 0,
                "type": "number"
              },
              "source_store": {
                "description": "Store address of the benchmark store, such as \"mysneakerstore.com\": a bare host, an https link or a myshopify.com address.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "target_currency": {
                "description": "ISO 4217 code to convert prices into, such as \"USD\", \"EUR\" or \"GBP\". Default: the target store currency.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "target_store": {
                "description": "Store address of the store compared with the benchmark, such as \"allbirds.com\". Its currency is the default output currency.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["source_store", "target_store"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "disclaimer": {
                "type": "string"
              },
              "fx_conversion": {
                "additionalProperties": false,
                "description": "The rate used to convert source prices; absent when status is unavailable",
                "properties": {
                  "base_currency": {
                    "description": "Source store currency",
                    "type": "string"
                  },
                  "provider": {
                    "description": "ECB reference rate, manual override, or same currency",
                    "type": "string"
                  },
                  "quote_currency": {
                    "description": "Currency prices are converted into",
                    "type": "string"
                  },
                  "rate": {
                    "description": "Units of quote_currency per 1 unit of base_currency",
                    "type": "number"
                  },
                  "rate_date": {
                    "description": "Day of the rate, YYYY-MM-DD",
                    "type": "string"
                  }
                },
                "required": ["base_currency", "provider", "quote_currency", "rate", "rate_date"],
                "type": ["object", "null"]
              },
              "matches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "duty_adjusted_margin": {
                      "description": "price_gap minus duty, in major units of target_currency; null when no duty applies",
                      "type": ["number", "null"]
                    },
                    "landed_gap": {
                      "description": "price_gap minus the shipping and duty allowances per item, in major units of target_currency",
                      "type": "number"
                    },
                    "price_gap": {
                      "description": "target_price minus source_price_converted; positive when the target store is dearer, in major units of target_currency",
                      "type": "number"
                    },
                    "price_gap_pct": {
                      "description": "price_gap as a percent of source_price_converted",
                      "type": "number"
                    },
                    "rate": {
                      "description": "Units of target_currency per 1 unit of source_currency",
                      "type": "number"
                    },
                    "rate_date": {
                      "description": "Day of the rate, YYYY-MM-DD",
                      "type": "string"
                    },
                    "rate_source": {
                      "type": "string"
                    },
                    "source_currency": {
                      "type": "string"
                    },
                    "source_in_stock": {
                      "type": "boolean"
                    },
                    "source_price": {
                      "description": "Lowest source price, in major units of source_currency",
                      "type": "number"
                    },
                    "source_price_converted": {
                      "description": "Source price converted with rate, in major units of target_currency",
                      "type": "number"
                    },
                    "source_price_local": {
                      "description": "Same as source_price",
                      "type": "number"
                    },
                    "source_url": {
                      "type": "string"
                    },
                    "target_currency": {
                      "type": "string"
                    },
                    "target_in_stock": {
                      "type": "boolean"
                    },
                    "target_price": {
                      "description": "Lowest target price, in major units of target_currency",
                      "type": "number"
                    },
                    "target_url": {
                      "type": "string"
                    },
                    "title": {
                      "description": "Source product title",
                      "type": "string"
                    }
                  },
                  "required": ["duty_adjusted_margin", "landed_gap", "price_gap", "price_gap_pct", "rate", "rate_date", "rate_source", "source_currency", "source_in_stock", "source_price", "source_price_converted", "source_price_local", "source_url", "target_currency", "target_in_stock", "target_price", "target_url", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "description": "What to tell the user, and the next step for a status other than ok",
                "type": "string"
              },
              "source_store": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "description": "ISO 4217 code the prices are compared in for this store",
                    "type": ["string", "null"]
                  },
                  "host": {
                    "description": "The store's host, without www",
                    "type": "string"
                  },
                  "snapshot_date": {
                    "description": "Snapshot day used, YYYY-MM-DD; null when the store was not read",
                    "type": ["string", "null"]
                  }
                },
                "required": ["currency", "host", "snapshot_date"],
                "type": "object"
              },
              "status": {
                "description": "partial: a catalog was too large to read in full. no_matches: no pairs, follow message. unavailable: a store or exchange rate could not be read, relay message",
                "enum": ["ok", "partial", "no_matches", "unavailable"],
                "type": "string"
              },
              "summary": {
                "additionalProperties": false,
                "properties": {
                  "avg_gap_pct": {
                    "description": "Mean absolute price_gap_pct",
                    "type": "number"
                  },
                  "cheaper_at_source": {
                    "description": "Pairs where the source store is cheaper",
                    "type": "integer"
                  },
                  "cheaper_at_target": {
                    "description": "Pairs where the target store is cheaper",
                    "type": "integer"
                  },
                  "currency": {
                    "description": "Currency of the gaps; absent when status is unavailable",
                    "type": "string"
                  },
                  "matches_found": {
                    "type": "integer"
                  },
                  "max_gap_pct": {
                    "description": "Largest absolute price_gap_pct",
                    "type": "number"
                  },
                  "total_source_products": {
                    "description": "Source products read (up to 250, after query)",
                    "type": "integer"
                  },
                  "total_target_products": {
                    "description": "Target products read (up to 250, after query)",
