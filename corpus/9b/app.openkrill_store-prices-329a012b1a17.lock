      "instructions": "Store Price Tracker: Track an online store's prices. Use check_store_prices when the user asks what an online store sells, what it charges, or what changed on it; pass each store's web address as the user wrote it, up to five. Use get_product_price_history when the user asks how one product's price or stock moved; pass the store and the product's link, handle or title. Use compare_store_prices to compare prices between two stores, find price gaps or margins, or see which store sells an item cheaper. All three tools add a store they read to the daily snapshot list. The first read of a store has no changes: say that changes show up from the next daily snapshot. Link each product's url and never guess prices. Only Shopify stores with a public product feed can be read. Next step by status: invalid, ask for the store address, such as allbirds.com; unavailable, relay the message and do not retry the same store in this chat; stale, show the data and say it is from the last snapshot; not_found, ask for the product link; ambiguous, show the candidates and call again with the title the user picks; no_matches, follow the message (another match_by, a shorter query or a lower min_gap_pct); partial, say that some products may be missing. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "check_store_prices",
          "title": "Check a store's products and price changes",
          "description": "Read an online store's products, prices and availability, and what changed since its previous daily snapshot. Use it for questions like \"track competitor prices on allbirds.com\", \"what did gymshark.com change?\", \"what is new or sold out at this store?\". Pass store addresses, up to 5: a bare host such as \"allbirds.com\", an https link to any page of the store, or a myshopify.com address. Works only for Shopify stores that publish their public product feed (/products.json). Calling it adds the store to a daily snapshot list, so its history builds up. Optional: query (text in a product's title, brand, type or handle), limit. Returns per store a status, the snapshot date, product count, currency, change counts and lists of new, removed, repriced and restocked or sold-out variants, plus matching products. The first snapshot has no changes. Not for one product's history (use get_product_price_history) or for comparing two stores (use compare_store_prices).",
