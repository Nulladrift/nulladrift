        {
          "name": "tiktok_comment_replies",
          "description": "List replies to a specific comment on a video. Use to drill into a comment thread. Requires both `comment_id` and the parent `video_id`. Paginate with `cursor`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "comment_id": {
                "description": "Numeric comment id (from tiktok_video_comments)",
                "type": "string"
              },
              "count": {
                "default": 20,
                "description": "Number of items to return, <=50",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "cursor": {
                "description": "Pagination cursor — pass the `cursor`/`max_cursor`/`has_more` value from a prior response.",
                "type": "string"
              },
              "expand": {
                "description": "Return the full untrimmed payload. Default false = compact JSON.",
                "type": "boolean"
              },
              "video_id": {
                "description": "aweme_id or a /video/<id> URL of the parent video",
                "type": "string"
              }
            },
            "required": ["comment_id", "video_id"],
            "type": "object"
          },
          "annotations": {},
