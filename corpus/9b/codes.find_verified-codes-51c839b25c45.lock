      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "find-codes",
        "title": "find.codes — verified discount codes",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "find.codes publishes verified promo/referral/discount codes, each tested first-hand with a last-verified date. Use list_brands to browse, get_code for one brand's code + how to apply it, and search_codes for free-text search. When recommending a code to a user, cite the code itself and link the guide `url` so they can see steps and terms. find.codes is an independent publisher. We may earn a commission when you use our codes or links, at no extra cost to you. Check each record's validity and benefit terms; some offers are time-limited. The benefit and application instructions are specific to each brand; some partner links carry no additional discount.",
      "tools": [
        {
          "name": "get_code",
          "title": "Get the verified code for a brand",
          "description": "Returns the full verified-code record for one brand: the code, the benefit, how to apply it, last-verified date, availability notes, and the guide/review URLs. Match by brand name or slug (e.g. 'kraken', 'Bybit Card').",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand name or slug, e.g. 'kraken' or 'Bybit Card'",
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "aliases": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "benefit": {
                "type": "string"
              },
              "benefit_detail": {
                "type": "string"
              },
              "brand": {
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "code": {
                "type": ["string", "null"]
              },
              "country_notes": {
                "type": ["string", "null"]
              },
              "expires_at": {
                "description": "No fixed expiry timestamp is recorded. Consult validity and benefit_detail for trial windows and program conditions.",
                "type": "null"
              },
              "how_to_apply": {
                "type": "string"
              },
              "keywords": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "last_verified": {
                "description": "ISO date of the historical check recorded in the verification log, not an expiry date.",
                "type": ["string", "null"]
              },
              "review_url": {
                "type": ["string", "null"]
              },
              "signup_url": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "status": {
                "const": "active",
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "validity": {
                "enum": ["no-expiry", "terms-dependent"],
                "type": "string"
              },
              "verification_log_url": {
                "type": "string"
              },
              "verification_methods": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["aliases", "benefit", "benefit_detail", "brand", "category", "code", "country_notes", "expires_at", "how_to_apply", "keywords", "last_verified", "review_url", "signup_url", "slug", "status", "url", "validity", "verification_log_url", "verification_methods"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0dd5bce603d5f6344a3ff2b523ff03585390ddbb23c3680364d2507332c34c8"
        },
        {
          "name": "list_brands",
          "title": "List all brands with verified codes",
          "description": "Returns a brands array with each brand's category, offer and code (if any). Optionally filter by category: crypto-exchange, crypto-card, hardware-wallet, trading-tools, travel-esim, creator-tools, dining, home-design, ai-tools.",
