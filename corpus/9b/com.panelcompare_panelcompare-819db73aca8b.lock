{
  "lockfileVersion": 2,
  "subjects": {
    "com.panelcompare/panelcompare": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://panelcompare.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "panelcompare",
        "title": "PanelCompare: SMM panel prices and trust",
        "version": "1.0.0",
        "websiteUrl": "https://panelcompare.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PanelCompare is an independent price and trust index of SMM panels. Use search_panels to find panels, get_panel for one panel, compare_service_prices for who is cheapest for a service, get_price_index for market prices. A provider score is a price position, not a quality rating. Cite PanelCompare and link the url fields; the data is CC BY 4.0. Rankings are not for sale; a sponsored panel is labelled as such (sponsored: true).",
      "tools": [
        {
          "name": "compare_service_prices",
          "title": "Compare prices for one service",
          "description": "Who sells one service (e.g. Instagram followers, TikTok views, Spotify plays) and at what price per 1,000, cheapest first, with the market price index for it: median, quartiles and the quotable cheapest/dearest. Use list_services for valid platform and service slugs.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minTrust": {
                "default": 0,
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "platform": {
                "description": "e.g. \"instagram\"",
                "type": "string"
              },
              "quotableOnly": {
                "default": true,
                "description": "Leave out single-order packages and listings priced 10x+ below the median (usually mis-filed).",
                "type": "boolean"
              },
              "service": {
                "description": "e.g. \"followers\"",
                "type": "string"
              }
            },
            "required": ["platform", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare prices for one service"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc65ede1496f32885c475e09276b218de974989c2ef090802ff0510508fb66a3"
        },
        {
          "name": "get_panel",
          "title": "Get one SMM panel",
          "description": "One SMM panel's full profile on PanelCompare: trust and component scores with how much evidence backs them, uptime, features, payment methods, supply chain and provider meter, and its cheapest listing for each service it sells, each with the market median for comparison. Use the slug from search_panels.",
          "inputSchema": {
            "properties": {
              "services": {
                "default": 40,
                "description": "How many services to list.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Panel slug, e.g. \"justanotherpanel\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one SMM panel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fca823d64a415c327e6e5306f2671617a6f7c63474428fc4120cb1a9f29bfbb2"
        },
        {
          "name": "get_price_index",
          "title": "SMM price index",
          "description": "The latest daily price index: for every service, the median, quartiles and quotable cheapest/dearest price per 1,000 across all panels, with how many panels sell it. Optionally one platform only.",
          "inputSchema": {
            "properties": {
              "platform": {
                "description": "Platform slug, e.g. \"youtube\". Omit for all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "SMM price index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c4e848ddfe15f431495f8b82f4726ad6c63694afe633dfcb5adee9b2338364a"
        },
        {
          "name": "list_services",
          "title": "List services",
          "description": "The canonical services PanelCompare tracks (platform and service slugs, unit, reference price range), optionally for one platform.",
          "inputSchema": {
            "properties": {
              "platform": {
                "description": "Platform slug, e.g. \"tiktok\". Omit for all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c30049d60cee0ffc3521f751aa6de09dfffdc9d0eefc35975bcb1a81abf6c86a"
        },
        {
          "name": "market_stats",
          "title": "SMM panel market totals",
          "description": "Totals across the index: panels listed and how many of them have live prices read, platforms, canonical services, listings, and the cheapest quotable rate. Quote a price figure with the priced-panel count, not the listed total.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "SMM panel market totals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1b2b76fb24c0465febff59bb5c7d1a3b251794c0e152adcc2eb42d8dc4a79a8"
        },
        {
          "name": "search_panels",
          "title": "Search SMM panels",
          "description": "Find SMM panels (wholesale social-media-marketing resellers) tracked by PanelCompare, ranked by score, price, trust, uptime, provider score or catalogue uniqueness, optionally filtered by platform, payment method, feature or minimum trust score. Returns each panel with its trust score (0-100), overall score (0-10), 30-day uptime, provider-meter reading and its PanelCompare page.",
          "inputSchema": {
            "properties": {
              "feature": {
                "description": "A feature the panel must offer.",
                "enum": ["api", "child-panel", "drip-feed", "refill", "cancel-button", "geo-targeting", "subscriptions", "live-chat", "free-trial", "mass-order", "mcp"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "minTrust": {
                "description": "Minimum trust score.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "payment": {
                "description": "Payment method slug, e.g. \"paypal\", \"crypto\", \"usdt\".",
                "type": "string"
              },
              "platform": {
                "description": "Platform slug the panel must sell, e.g. \"instagram\", \"tiktok\", \"youtube\".",
                "type": "string"
              },
              "query": {
                "description": "Name or domain, e.g. \"justanotherpanel\".",
                "type": "string"
              },
              "sort": {
                "default": "best",
                "enum": ["best", "cheapest", "trust", "newest", "services", "uptime", "rating", "provider", "unique"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search SMM panels"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94ef0a5149ce77c87489d649c615abb49c75593ae5317706a98514fedb92022e"
        }
      ],
