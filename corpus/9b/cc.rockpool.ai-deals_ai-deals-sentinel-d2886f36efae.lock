        {
          "name": "get_offer",
          "description": "Full record for one provider's offer, matched by provider or offer name: limits, caveats, deal_type, offer_status, access (what the first call needs, such as api-key or credit-card; or null, which is not a sign that no card is needed), expires_at, source_url, verified_at and verified_days_ago. offer_status is available, retired, unverified, or none (checked, and no free API path was found). Covers questions such as whether a provider has a free API, whether its free tier is still on as of verified_at, what its free limits are, and whether a card is needed. On no match it returns the nearest candidates rather than an empty result.",
