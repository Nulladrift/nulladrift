                    "type": "integer"
                  },
                  "HTTP_ERR": {
                    "type": "integer"
                  },
                  "OK": {
                    "type": "integer"
                  },
                  "SKIP": {
                    "type": "integer"
                  },
                  "SLOW": {
                    "type": "integer"
                  },
                  "measured": {
                    "type": "integer"
                  },
