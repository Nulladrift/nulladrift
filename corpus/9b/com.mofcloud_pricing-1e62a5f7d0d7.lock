        {
          "name": "compare_providers",
          "title": "Cheapest server per cloud",
          "description": "For a given machine shape (vCPU/memory/GPU/charge-type), return the single cheapest instance from EACH cloud provider, ordered cheapest-first. Best for 'which cloud is cheapest for X'. Dedicated-core only unless include_burstable is set.",
