        {
          "name": "compare_eip",
          "title": "Compare public IP cost",
          "description": "Compare the monthly USD cost of a public IP (EIP/弹性公网IP) across clouds, per region. Default scope 'eip_bound' = the IP cost while ATTACHED to a running instance: AWS/GCP/Azure charge ~$3.65/mo ($0.005/h) for every public IPv4, and Volcengine/UCloud charge a smaller fee; clouds ABSENT from the result give a bound IP for FREE (AlibabaCloud, TencentCloud, BaiduCloud, Huawei standard EIP) — absent means free, not missing data. Scope 'eip_idle' instead returns the penalty rate for an unbound/reserved IP. Pair with compare_egress + compare_bandwidth for a server's full public-network cost.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "continent": {
                "description": "NA, SA, EU, AS, AF, or OC",
                "type": "string"
              },
              "country": {
                "description": "ISO country code, e.g. US, SG",
                "type": "string"
              },
              "limit": {
                "description": "max rows (default 20, cap 50)",
                "type": "integer"
              },
              "near": {
                "description": "free-text place to find nearby regions, e.g. Singapore",
                "type": "string"
              },
              "provider": {
                "description": "cloud provider; omit for all",
                "type": "string"
              },
              "radius_km": {
                "description": "radius in km for 'near' (default 1000)",
                "type": "number"
              },
              "region": {
                "description": "exact region code, e.g. ap-southeast-1",
                "type": "string"
              },
              "scope": {
                "description": "'eip_bound' (default, IP attached to a running instance) or 'eip_idle' (unbound/reserved penalty rate)",
                "type": "string"
              },
              "sort_desc": {
                "description": "sort most-expensive first (default cheapest first)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
