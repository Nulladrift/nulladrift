              "include_burstable": {
                "description": "also return burstable (CPU credits/baseline: AWS t3, Azure B, Alibaba t6, Huawei t6/at7) and shared-core (GCP e2-micro, Linode/Vultr shared CPU) instances; excluded by default because their price buys a CPU baseline, not a full core",
                "type": "boolean"
