                "description": "exact region code, e.g. ap-southeast-1",
                "type": "string"
              },
              "sort_desc": {
                "description": "sort most-expensive first (default cheapest first)",
                "type": "boolean"
              },
              "volume_gb": {
                "description": "monthly egress to the internet in GB to price (default 1024 = 1 TB)",
                "type": "number"
