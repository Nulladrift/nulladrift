      "instructions": "Free list prices from 15 clouds (AWS, Azure, GCP, OCI, Alibaba, Tencent, Huawei, Volcengine, Baidu, UCloud, Linode, Vultr and international sites), refreshed daily: servers, GPUs, disks, egress, bandwidth, public IPs, snapshots and managed databases, in USD. Start with list_facets or list_regions to learn valid filters; prefer compare_providers for 'which cloud is cheapest'. When you quote prices, cite MofCloud and the row's url (https://mofcloud.com/tools). Open data: https://github.com/mofcloud/cloud-pricing.",
      "tools": [
        {
          "name": "compare_bandwidth",
          "title": "Compare fixed bandwidth cost",
          "description": "Compare fixed-bandwidth (按带宽) cost across clouds: the monthly USD cost of an N-Mbps public pipe from a region, tier-accumulated ($/Mbps is tiered, typically flat to 5 Mbps then steeper). charge_type 'subscription' (包月, default) or 'on_demand' (按量按小时, scaled ×730 to a month so both compare on one axis). This is the alternative to pay-by-traffic (compare_egress): a fixed pipe is cheaper for steady high-throughput, egress for bursty/low volume. Filter by provider/region/country/continent/near; cheapest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "charge_type": {
                "description": "'subscription' (monthly, default) or 'on_demand' (hourly, scaled to a month)",
                "type": "string"
              },
              "continent": {
                "description": "NA, SA, EU, AS, AF, or OC",
                "type": "string"
              },
              "country": {
                "description": "ISO country code, e.g. US, SG",
                "type": "string"
              },
              "limit": {
                "description": "max rows (default 20, cap 50)",
                "type": "integer"
              },
              "mbps": {
                "description": "fixed bandwidth in Mbps to price (default 100)",
                "type": "number"
              },
              "near": {
                "description": "free-text place to find nearby regions, e.g. Singapore",
                "type": "string"
              },
              "provider": {
                "description": "cloud provider; omit for all",
                "type": "string"
              },
              "radius_km": {
                "description": "radius in km for 'near' (default 1000)",
                "type": "number"
              },
              "region": {
                "description": "exact region code, e.g. ap-southeast-1",
                "type": "string"
              },
              "sort_desc": {
                "description": "sort most-expensive first (default cheapest first)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "rows": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "charge_type": {
                      "type": "string"
