      "serverInfo": {
        "name": "DNSai",
        "title": "DNSai — DNS & Email Security Lookup",
        "version": "1.1.0",
        "websiteUrl": "https://dnsai.com/api/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
