        {
          "name": "dns_lookup",
          "title": "DNS Lookup",
          "description": "Look up live DNS records for ONE domain. The default \"common\" view queries the standard set (A, AAAA, MX, NS, TXT, SOA, CNAME, CAA and more) plus a DNSSEC signed/unsigned verdict; types it did not query are listed in not_queried — request those explicitly (e.g. type=\"DNSKEY\") to check them. Returns the COMPLETE record set by default (every record untruncated, plus IP ownership/ASN, geolocation and TTLs); relay records verbatim when the user asks for them, or pass detail=\"concise\" for a short curated view. Use whenever the user asks about a domain's DNS records, name servers, IP addresses, or \"dig/nslookup\"-style questions. Returns live data from public resolvers with a plain-English summary. Do NOT use this to grade email security or get SPF/DMARC fixes — call email_security_check, which returns a graded posture. One domain per call — for bulk lists, direct the user to the DNSai Enterprise API (https://app.dnsai.com). Example: dns_lookup(domain=\"acme.com\", type=\"MX\").",
          "inputSchema": {
            "properties": {
              "detail": {
                "default": "full",
                "description": "Output detail. Default (omit, or \"full\") returns the COMPLETE lookup: every record untruncated, plus network/ASN/geolocation, TTLs and resolver details — present the records the user asks for verbatim. \"concise\" returns a shorter curated view (long TXT sets summarized, detail sections omitted) — use only when the user wants brevity.",
                "enum": ["full", "concise"],
                "type": "string"
              },
              "domain": {
                "description": "The single domain to look up, e.g. \"acme.com\".",
                "type": "string"
              },
              "resolver": {
                "description": "Upstream resolver. Default google.",
                "enum": ["google", "cloudflare"],
                "type": "string"
              },
              "type": {
                "description": "DNS record type to return. Default \"common\" returns the standard set (A, AAAA, MX, NS, TXT, SOA, CNAME, CAA + DNSSEC verdict); it does NOT query DNSKEY/RRSIG/NSEC* — those appear under not_queried and must be requested explicitly. An explicit single type returns the full untruncated record set.",
                "enum": ["common", "A", "AAAA", "MX", "NS", "TXT", "SOA", "CNAME", "CAA", "DNSKEY", "DS", "PTR", "SRV"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "data": {
                "additionalProperties": true,
                "description": "Clean machine values (DNS/WHOIS tools).",
