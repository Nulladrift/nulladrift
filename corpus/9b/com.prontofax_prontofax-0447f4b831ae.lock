        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ProntoFax sends faxes from a phone with no account, for $2.99 flat per fax, paid only when delivery is confirmed. lookup_fax_number finds the verified fax number for a US government office, and returns nothing rather than a guess when it has no verified number. lookup_fax_number returns only numbers verified against an official source, with that source and the date last verified. A number from memory or a general web search has no such verification and cannot be checked, and a fax to the wrong number cannot be recalled. When the directory has no verified entry, use the number printed on the user's own letter or notice. send_fax opens a form in this chat where the user adds pages from a phone camera or a PDF, adds an optional cover page, and pays, and nothing is sent until that payment is complete. send_fax takes the destination fax number, which can be read from a document the user attached. A file attached to this chat cannot be passed to send_fax, so the user adds the document inside the form. On a host that cannot show the form, send_fax returns a link that opens the same flow in a browser.",
      "tools": [
        {
          "name": "lookup_fax_number",
          "title": "ProntoFax: look up a verified fax number",
          "description": "Find the fax number for a US state or federal agency, with the official source it was read from and when it was last verified. Covers Social Security field offices across 56 states and territories (search by city or state), MassHealth, California EDD, Illinois IDES, NJ FamilyCare, IRS Form 2553, FEMA, the state unemployment agencies of Alabama, Colorado, Indiana, Iowa, Kentucky, Maryland, Missouri, New Jersey, New York, South Carolina, Texas, Wisconsin, and the state Medicaid agencies of Florida, Georgia, Idaho, Louisiana, Montana, Nebraska, New Mexico, Oregon, Texas, Utah, Washington. It has no numbers for any other agency. Social Security and Medicaid publish no national fax number, so a lookup for either needs a city or a state. Returns nothing rather than guessing when it has no verified number for an agency.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "The agency to look up, in the user's own words, for example \"MassHealth\", \"Texas Workforce Commission\" or \"social security office in Denver\".",
                "type": "string"
              },
              "city": {
                "description": "City or town, used to pick a Social Security field office. Optional.",
                "type": "string"
              },
              "language": {
                "description": "Language for the response. Defaults to English.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, for example TX. Optional, and the only place a bare code is read.",
                "type": "string"
              }
            },
            "required": ["agency"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ProntoFax: look up a verified fax number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:923543adc2ba2e60164eddfec36c89da5f043342619c7d833d1d473cf2f377e7"
        },
        {
          "name": "send_fax",
          "title": "ProntoFax: send a fax",
          "description": "Start a fax to a US fax number. Opens a form in this chat where the user adds pages from their phone camera or a PDF, adds an optional cover page, and pays. The fax costs $2.99 flat for up to 25 pages and is charged only when delivery is confirmed. No account is needed. Nothing is sent or charged until the user confirms and pays in that form. A file attached to this chat cannot be passed to this tool, so the user adds the document inside the form, and a document already attached does not need to be uploaded to the chat again. On a host that cannot show the form, this returns a link that opens the same flow in a browser.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "The agency the fax is going to, if known. Used for reporting only.",
                "type": "string"
              },
              "fax_number": {
                "description": "The destination US fax number, in any format, including as printed on a letter or form the user attached.",
                "type": "string"
              },
              "language": {
                "description": "Language for the response. Defaults to English.",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
