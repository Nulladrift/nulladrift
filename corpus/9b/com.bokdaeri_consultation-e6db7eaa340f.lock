          "name": "get_consultation_service_info",
          "title": "복대리 상담 이용 안내",
          "description": "Explain Bokdaeri consultation fees, privacy and the request process without creating a draft.\n\n복대리는 법률 상담을 원하는 이용자와 한국 변호사를 연결하고, 상담 요청의 진행 상태와 수락 여부를 안내하는 서비스입니다. 상담의 공개 비용·이용 방법·개인정보 제공 범위를 안내합니다. 도구 열기나 서비스 질문에는 이 도구를 쓰고 초안이나 접수를 만들지 않습니다.",
