          "description": "Apply the exact confirmed change only with current permission and the server action.\n\n이용자가 확인한 수정안 또는 철회안을 유효한 관리 위임으로 변호사 수락 전에 적용합니다. 미리보기 ID와 예상 버전을 검증하며 같은 요청을 재시도하면 같은 결과를 반환합니다. 적용 내용이 참여 변호사에게 공개되거나 알림 처리가 발생할 수 있습니다.",
