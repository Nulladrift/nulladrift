          "title": "복대리 상담 수정·철회 준비",
          "description": "Prepare an edit or withdrawal preview without applying it.\n\n사용자가 접수한 상담의 수정·철회를 요청했을 때 변경안만 준비합니다. 먼저 가능 여부와 현재 버전을 조회하세요. edit은 대화에서 확인한 변경 후 전체 요약·유형·단계를 넣고 withdraw는 이 세 필드를 생략합니다. edit은 after.summary, withdraw는 철회 대상인 before.summary를 그대로 인용하세요. 앞선 대화에 같은 요약이 있어도 이번 확인 안내에 포함합니다. 변경 전후·비용 유지 또는 철회 효과와 아직 적용 전이라는 사실을 설명한 뒤 반환된 next_action을 따르세요: confirm_in_chat이면 사용자의 명확한 동의 응답을 받은 뒤 apply_consultation_change를, confirm_on_web이면 복대리 확인 링크를 안내합니다.",
