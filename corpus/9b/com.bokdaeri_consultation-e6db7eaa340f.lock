        {
          "name": "begin_contact_change",
          "title": "복대리 연락처 변경 시작",
          "description": "Open verification for changing the default contact or one pending consultation contact.\n\n이용자가 연락받을 번호를 바꾸고 싶을 때 복대리의 새 번호 확인 화면을 엽니다. purpose=default는 앞으로 신청하는 상담에 쓸 번호, purpose=request는 지정한 대기 중 상담 한 건의 연락처입니다. 먼저 둘 중 무엇인지 한 번 확인한 뒤 호출하세요. 새 번호의 문자 인증과 적용은 화면에서 이용자가 직접 하며 이 도구는 번호를 바꾸지 않습니다. 인증번호는 받지 않습니다.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "phone": {
