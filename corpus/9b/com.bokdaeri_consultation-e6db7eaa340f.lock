        {
          "name": "begin_consultation_permission",
          "title": "복대리 AI 상담 신청·관리 권한 설정",
          "description": "Open the user consent page for AI consultation permission without granting it automatically.\n\n사용자가 에이전트의 상담 신청·수락 전 수정·철회 권한을 설정하거나 갱신하려 할 때 복대리 동의 화면만 엽니다. 기존 번호 인증은 유지하며 필요한 경우에만 화면에서 인증합니다. 이 도구는 권한 부여·상담 접수·수정·철회를 하지 않습니다. 동의는 이용자가 화면에서 직접 하며, 돌아오면 연결 상태의 allowed_actions를 조회합니다. 응답의 current_permission은 화면을 열기 전 이 연결의 현재 권한 상태입니다.",
