          "title": "복대리 상담 요청 준비",
          "description": "Prepare or revise a consultation preview from the user facts without submitting it.\n\n상담할 실제 주제·상황과 이번 상담의 명확한 신청 지시가 모두 있을 때만 준비합니다. 도구 열기·앱 연결·사용법 문의·번호 인증·포괄적 위임 설정은 이번 상담의 신청 지시가 아닙니다. 앞선 대화의 사실을 먼저 사용하고, 신청 의사는 있지만 내용이 없으면 “어떤 문제로 변호사 상담을 받고 싶으신가요?”라고 한 번 물은 뒤 답을 기다립니다. 주제와 내용이 충분하면 추가 문진을 강제하지 않습니다. 사건 유형·진행 단계·내용을 추측하거나 글자 수를 채우기 위해 일반 신청 문장을 만들지 마세요. 초안과 최종 전달 미리보기를 준비합니다. 요약·비용·제공 범위를 보여주고 응답을 기다리세요. 단, 서버 next_action.kind가 handoff이면 별도 채팅 승인 없이 웹 최종 확인으로 안내합니다. 같은 journey_id/expected_journey_revision으로 수정합니다. 보류 해제는 사용자가 명시적으로 재개한 경우에만 resume:true를 사용합니다. 인증·접수는 시작하지 않습니다.",
