        "type": "http",
        "url": "https://api.pagespool.com/mcp/ocrmypdf/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pagespool-ocrmypdf",
        "version": "1",
        "websiteUrl": "https://pagespool.com/connect#ocrmypdf"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_ocr_result",
          "title": "Check an OCR job",
          "description": "Check an OCR job you queued with `ocr_pdf`.\n\nReturns `job_id` and `status` (`queued`, `running`, `succeeded` or\n`failed`). A succeeded job includes `download_url`, a link to the\nsearchable PDF that works for 60 minutes without an API key: give it\nto the user. A failed job includes `error` (one sentence) and `code`.\nResults are deleted 7 days after submission. Requires an API key.\n\nCredits: free. This tool is not metered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "The `job_id` returned by `ocr_pdf`.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an OCR job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:bdcf8718c88f2fcc3b5e9b59163af2eb4400b1ebb090afe663cc35b1bee845f0"
        },
        {
          "name": "ocr_pdf",
          "title": "OCR a scanned PDF or image",
          "description": "Queue a scanned PDF, PNG or JPEG for OCR with OCRmyPDF and Tesseract.\n\nThe result is the same document with a searchable text layer, as PDF/A\nby default. Pass the file as base64 in `content_base64` (up to 4 MB) or\nas a download link in `file` (up to 25 MB), and its name in `filename`.\nUp to 200 pages; an image is one page.\n\nReturns `job_id`, `status`, `pages` and `credits`. Call\n`get_ocr_result` with the `job_id` until `status` is `succeeded` or\n`failed`; a job is stopped after 15 minutes.\n\nRequires an API key. Costs 2 credits per page, charged now and\nrefunded if the job fails. The result is kept for 7 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_base64": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The file content, base64-encoded. Up to 4 MB before encoding."
              },
              "deskew": {
                "default": false,
                "description": "Straighten crooked pages. Not with mode=redo.",
                "type": "boolean"
              },
              "file": {
                "default": null,
                "description": "The file as a download link, instead of `content_base64`. In ChatGPT, pass the user's uploaded file here. Other clients can set `download_url` to a public https URL.",
                "properties": {
                  "download_url": {
                    "description": "A public https URL of the file.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "An identifier for the file. ChatGPT sets it; other clients may pass any label, such as the file name.",
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "filename": {
                "description": "The file name with its extension: .pdf, .png, .jpg or .jpeg.",
                "type": "string"
              },
              "language": {
                "default": "eng",
                "description": "The document's language: eng, deu, spa or fra.",
                "enum": ["eng", "deu", "spa", "fra"],
                "type": "string"
              },
              "mode": {
                "default": "skip",
                "description": "Pages that already have text: skip them (the default), redo an earlier OCR layer, or force OCR on every page as an image.",
                "enum": ["skip", "redo", "force"],
                "type": "string"
              },
              "output_type": {
                "default": "pdfa",
                "description": "pdfa (PDF/A-2b, the default) or pdf.",
                "enum": ["pdfa", "pdf"],
                "type": "string"
              },
              "rotate_pages": {
                "default": false,
                "description": "Turn pages that are upside down or sideways.",
                "type": "boolean"
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "OCR a scanned PDF or image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/fileParams": ["file"],
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:e79c6d0de96062e28a058e1969dbc0f94bb8a9106bf3ef3e48093d597b8cc231"
        }
      ],
      "digest": "sha256:5be7c1bc49a3d4c9bb210ea379d7c0685c799a3ab4a6403a97db7b09e26e35c2"
    }
  }
}
