        },
        {
          "name": "estimate_ivf_cost",
          "title": "Estimate what IVF costs in the US",
          "description": "A US IVF cost estimate built only from cited line items (the base cycle, medications, anesthesia, embryo freezing, a frozen transfer, genetic testing and other add-ons), with a low, typical and high figure per cycle and for several cycles, and the source of each line.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cycles": {
                "description": "How many egg retrieval cycles to plan for (default 1).",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "include": {
                "description": "Optional line items to count beside the base cycle. Leave out for the usual set (medications, anesthesia, freezing and a frozen transfer).",
                "items": {
                  "enum": ["meds", "anesthesia", "icsi", "pgt", "freeze", "fet"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate what IVF costs in the US"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aeb77b66de29146db6a9a5cb50441f7d4d428a670fe4d806c32c992cc9ecc87e"
        },
        {
          "name": "fertility_clinic_doctors",
          "title": "The doctors US fertility clinics list",
          "description": "The doctors US fertility clinics list on their own websites, by name exactly as the clinic writes it, with the role it gives each, the page and the date it was read. Give a state (optionally a city) for every clinic there that lists its doctors, or a doctor's name to find the clinic whose site lists that doctor. Doctors move between practices: the date says when the clinic's page was read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Optional city to narrow the list (for example Phoenix).",
                "type": "string"
              },
              "doctor": {
                "description": "Optional doctor's name, or part of it (for example Malizia), searched in every state when no state is given.",
                "type": "string"
              },
              "state": {
                "description": "A US state: its two-letter code (TX) or its name (Texas). DC counts as a state here.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
