        {
          "name": "employer_ivf_coverage",
          "title": "Does an employer cover IVF",
          "description": "Whether a US employer's own benefit documents say it covers IVF or fertility treatment, with the dollar or cycle limit, who runs the benefit, and a verbatim quote and link to the document. Covers the large employers IVFcost.co has read; says so when an employer publishes nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employer": {
                "description": "The employer's name, for example Walmart or Google.",
                "type": "string"
              }
            },
            "required": ["employer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
