      "serverInfo": {
        "name": "ivfcost",
        "title": "IVFcost.co",
        "version": "1.0.0",
        "websiteUrl": "https://ivfcost.co"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "IVFcost.co's US fertility cost data: the self-pay IVF prices clinics post on their own websites, a cited IVF cost estimate, each state's IVF insurance law, IVF grants taking applications now, and which employers cover IVF. Every answer names its sources and the date they were read and links the IVFcost.co page with the full detail. Figures are published prices and rules, not quotes or medical, insurance or financial advice.",
      "tools": [
        {
          "name": "clinics_taking_a_plan",
          "title": "Which insurance plans fertility clinics say they take",
          "description": "The insurers and fertility benefits (Progyny, Carrot, WINFertility, Maven, Aetna, Cigna, UnitedHealthcare and others) US fertility clinics name on their own websites as in network or accepted, for one state, optionally only the clinics that name one plan. Each answer gives the clinic's own words, its page and the date it was read. A plan a clinic takes can still leave IVF out: the plan's own fertility benefit decides that.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan": {
                "description": "Optional insurer or fertility benefit to filter by (for example Progyny, Aetna, TRICARE).",
                "type": "string"
              },
              "state": {
                "description": "A US state: its two-letter code (TX) or its name (Texas). DC counts as a state here.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which insurance plans fertility clinics say they take"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0a8dec5a912ad01e79b9ce588fc35f4a217697f931b4a5b53204f9c85f404445"
        },
        {
          "name": "embryo_adoption_cost",
          "title": "Embryo adoption (embryo donation) cost: posted fees",
          "description": "What US embryo donation (embryo adoption) programs and clinics post on their own pages as their fees, each quoted with its page: application, program, matching and home study fees, what a first transfer adds up to where a program posts enough to tell, clinics' donated-embryo cycle prices, and the national live-birth rate per donated-embryo transfer in CDC data.",
