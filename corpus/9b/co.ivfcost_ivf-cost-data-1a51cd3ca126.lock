          "title": "What at-home fertility tests cost",
          "description": "Self-pay prices of the tests a fertility workup or a cycle uses, each from the seller's own page: AMH (egg supply) tests including lab blood tests ordered online, at-home semen tests (with what clinics and labs post for a lab semen analysis), LH ovulation tests or hCG pregnancy tests. Lowest price first, with what each measures.",
