        "tools": {}
      },
      "instructions": "SubmitMap is a directory of startup launch platforms. Use qualify_project to find where a product can be submitted and what is missing, then get_platform for the submission steps. Filling the forms is the account half: the per-form brief, the playbooks and submission tracking all need a token from https://submitmap.com/docs/setup/. When something here goes wrong, do not leave the maker with the error: the reference is at https://submitmap.com/docs/, and anything the docs do not cover, a playbook that no longer matches the real form, a limit that counted wrongly, a tool that keeps failing, goes to https://submitmap.com/support/?topic=agent, which takes a message with or without an account.",
      "tools": [
        {
          "name": "create_project",
          "description": "Store a product on the account. Before asking the maker anything, use what you can already see: a README, package metadata, the site's own copy and title, an assets or public folder. A maker working in their product's repository should be able to say 'add my product to SubmitMap' and get a filled-in project back, with questions only about what is genuinely not there. Fill in as much as you can, leave the rest, and come back with update_project. Facts drive what it qualifies for; the pack is what you will paste into forms later. Ask about images early: most platforms want a square logo and many want a cover, and every asset in the pack is two fields, the public address (logoUrl) and the file on the maker's machine (logoFile), because a form uploads the file and only the address can be shown back to them.",
          "inputSchema": {
            "properties": {
              "facts": {
                "description": "Same shape qualify_project takes: stage, pricingModel, categories, and the booleans. It is also where the two answers that decide a run order live once the maker has given them (`goal`, `budget`, and `launchAt` if they named a date), which is what stops the next session asking again. Leave domainRating out: the url is measured against Ahrefs on the way in and the measured number is what gets stored, so a guess here is overwritten anyway.",
                "properties": {
                  "categories": {
                    "description": "Every audience and form factor this product belongs to, not just the main one. A product is often several at once, and one missing tag is one directory it never hears about: a repository holding a browser extension and a web app is `extension` and `web`, and an open-source AI dev tool is `open-source`, `ai` and `dev`. Look at what the product actually ships before you answer: a manifest.json means `extension`, an ios or android target means `mobile`, a public repository means `open-source`, an mcp server is `mcp`, a workspace with several of those means all of them. Then answer what it is commercially, which is a separate question and the one most runs lose platforms on: most launch boards say what they take by who ships it, not by what it runs on, so a subscription mobile app is `mobile` and `saas`, anything a solo maker or small team shipped is `indie`, and something sold to companies is `b2b`. Leaving those off does not make the run safer, it makes it shorter. Tags: agent-skill, ai, b2b, christian, community, content, design, dev, directory, extension, free, hardware, indie, local, marketing, marketplace, mcp, mobile, no-code, open-source, prelaunch, productivity, saas, turkish-founders, web.",
                    "items": {
                      "enum": ["agent-skill", "ai", "b2b", "christian", "community", "content", "design", "dev", "directory", "extension", "free", "hardware", "indie", "local", "marketing", "marketplace", "mcp", "mobile", "no-code", "open-source", "prelaunch", "productivity", "saas", "turkish-founders", "web"],
                      "type": "string"
                    },
