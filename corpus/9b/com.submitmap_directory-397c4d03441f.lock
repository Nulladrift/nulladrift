        {
          "name": "record_submission",
          "description": "Log what happened to the dashboard: the listing URL, when it was sent, when it goes live. Call it as soon as a submission lands, before you ask for the next brief, including when it is only queued for review, and including when you are not sure it landed: that is what `attempted` is for. The next brief on this project is refused until this call is made. A platform that needs the maker (a captcha, a login, a payment, a file, an address to confirm) is recorded as `planned` with a note saying what you need from them: that hands it back without claiming an outcome, and frees the run to carry on. If the live platform did not match what the brief said, put the difference in `differsFromRecord`. This costs nothing on any plan and no status costs more than another, so record what actually happened: the brief was what spent the tracked platform, and leaving the row wrong now only makes the run harder to follow.",
          "inputSchema": {
            "properties": {
              "differsFromRecord": {
                "description": "Only when the live platform did not match the brief or the platform record: say what differed, in one line, as fact. A price where the record said free, a sign-in or phone check it did not mention, a field it did not list, a submit page that moved, an audience it does not accept. We read these and fix the record, so the next maker is not sent into the same wall. Leave it out when everything matched.",
                "type": "string"
              },
              "launchAt": {
                "description": "ISO 8601, if it is scheduled.",
                "type": "string"
              },
              "listingUrl": {
                "description": "The product's URL on that platform.",
                "type": "string"
              },
              "note": {
                "description": "Required with `planned`: what you need from the maker, in one line they can act on.",
                "type": "string"
              },
              "platformSlug": {
                "type": "string"
              },
              "projectId": {
                "description": "Omit it when the account has one project, which is the free tier.",
                "type": "string"
              },
              "status": {
                "description": "Use `attempted` when the form was sent and you cannot prove it arrived: the tab died, the connection dropped, the page never came back. It is not a lesser `submitted`, it is the honest one, and it carries the verification the platform record describes so somebody can settle it later. Never re-send a form to find out; every platform has a way to check without submitting twice. Use `planned`, with a note, to hand a platform back to the maker when it is waiting on them. A first record is `submitted`, `attempted` or `planned`: `live`, `rejected` and `needs_changes` come after one of those.",
                "enum": ["planned", "attempted", "submitted", "live", "rejected", "needs_changes"],
                "type": "string"
              },
              "submittedAt": {
                "description": "ISO 8601.",
                "type": "string"
              }
            },
            "required": ["platformSlug", "status"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:70433f0364ca8393902ef927b3420b09a5cd71bbc674bb0e058d5651b86264f2"
        },
