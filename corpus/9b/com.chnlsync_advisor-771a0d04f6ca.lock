{
  "lockfileVersion": 2,
  "subjects": {
    "com.chnlsync/advisor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.chnlsync.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "CHNLSYNC Sync",
        "version": "0.2.1",
        "websiteUrl": "https://chnlsync.com"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Sync is CHNLSYNC's IT advisor for business technology decisions (connectivity, UCaaS, contact center, security). A human broker reviews every recommendation; Sync never names suppliers or quotes pricing on its own. Use check_copper_retirement for copper/POTS retirement status, ask_sync_advisor to consult the advisor on the user's behalf, and request_broker_callback (with the user's explicit consent) to hand off to a human broker.",
      "tools": [
        {
          "name": "ask_sync_advisor",
          "title": "Ask the Sync advisor",
          "description": "Consult CHNLSYNC's advisor about the user's IT environment.\n\nFirst call: omit session_id/session_token and provide company_name plus\npain (a plain-language description of what is not working) — a private\nadvisor workspace is created and its credentials are returned. Later\ncalls: pass session_id, session_token AND conversation_id back to continue\nthe same conversation. Persist all three privately across turns. Incomplete\ncontinuation handles are rejected before any write; recover the previous\ntool result instead of creating another workspace. Never automatically retry\na failed write: it may already have been recorded.\nReplies never contain supplier names or pricing — those come only after\na human broker review, via the claim_url or a requested callback.",
          "inputSchema": {
            "properties": {
              "company_name": {
                "anyOf": [
                  {
                    "maxLength": 255,
                    "minLength": 1,
                    "pattern": "\\S",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Company name; required for a new workspace."
              },
              "conversation_id": {
                "anyOf": [
                  {
                    "pattern": "^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Returned conversation ID; required for follow-up turns."
              },
              "message": {
                "description": "The user's technology question; no secrets.",
                "maxLength": 8000,
                "minLength": 1,
                "pattern": "\\S",
                "type": "string"
              },
              "pain": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "minLength": 1,
                    "pattern": "\\S",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What is not working; required for a new workspace."
              },
              "session_id": {
                "anyOf": [
                  {
                    "pattern": "^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Returned workspace ID; required for continuation."
              },
              "session_token": {
                "anyOf": [
                  {
                    "maxLength": 512,
                    "minLength": 1,
                    "pattern": "^\\S+$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Returned private token; required with session_id."
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "description": "An advisor reply with the complete handle needed to continue safely.",
            "properties": {
              "assistant_message": {
                "description": "Buyer-safe advisor response.",
                "title": "Assistant Message",
                "type": "string"
              },
              "claim_url": {
                "description": "Private claim link; share only with the workspace owner.",
                "title": "Claim Url",
                "type": "string"
              },
              "conversation_id": {
                "description": "Pass back with both session credentials next turn.",
                "format": "uuid",
                "title": "Conversation Id",
                "type": "string"
              },
              "disclosure": {
                "description": "Human review precedes supplier and pricing disclosure.",
                "title": "Disclosure",
                "type": "string"
              },
              "environment_summary": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Initial workspace summary.",
                "title": "Environment Summary"
              },
              "follow_up_questions": {
                "description": "Questions that clarify the user's needs.",
                "items": {
                  "type": "string"
                },
                "title": "Follow Up Questions",
                "type": "array"
              },
              "missing_info": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Initial information gaps.",
                "title": "Missing Info"
              },
              "review_status": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Current human-review status, when available.",
                "title": "Review Status"
              },
              "session_id": {
                "description": "Workspace handle to retain with conversation_id.",
                "format": "uuid",
                "title": "Session Id",
                "type": "string"
              },
              "session_token": {
                "description": "Private credential; retain, never publish.",
                "minLength": 1,
                "title": "Session Token",
                "type": "string"
              }
            },
            "required": ["assistant_message", "claim_url", "conversation_id", "disclosure", "follow_up_questions", "review_status", "session_id", "session_token"],
            "title": "AdvisorResponse",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Ask the Sync advisor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:c6b281723f5452ec6af8015a9d15944f0bf38fb039700193ed6c10805c78ab3b"
        },
        {
          "name": "check_copper_retirement",
          "title": "Check copper retirement status",
          "description": "Look up US copper/POTS retirement program status by carrier and state.\n\nDeterministic read of CHNLSYNC's FCC-sourced dataset (CC BY 4.0 — cite\nthe returned source_url). ``carrier`` accepts display names like \"AT&T\",\n\"Lumen\", \"Frontier\"; ``state`` is a two-letter abbreviation. Omit both\nfor the full dataset.",
          "inputSchema": {
            "properties": {
              "carrier": {
                "anyOf": [
                  {
                    "maxLength": 255,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Carrier display name, e.g. AT&T."
              },
              "state": {
                "anyOf": [
                  {
                    "pattern": "^[A-Za-z]{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Two-letter US state, e.g. TX."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "CopperFiling": {
                "description": "One reviewed public filing with its own dates and primary-source link.",
                "properties": {
                  "carrier": {
                    "description": "Carrier named by the filing.",
                    "title": "Carrier",
                    "type": "string"
                  },
                  "docket": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "FCC docket identifier, when available.",
                    "title": "Docket"
                  },
                  "filed_at": {
                    "anyOf": [
                      {
                        "format": "date-time",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Filing timestamp, when known.",
                    "title": "Filed At"
                  },
                  "filer": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Filing organization, when known.",
                    "title": "Filer"
                  },
                  "geography_detail": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Geographic scope from the source.",
                    "title": "Geography Detail"
                  },
                  "granted_at": {
                    "anyOf": [
                      {
                        "format": "date-time",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Grant timestamp, when known.",
                    "title": "Granted At"
                  },
                  "kind": {
                    "description": "Application, public notice, grant or carrier notice.",
                    "title": "Kind",
                    "type": "string"
                  },
                  "retirement_effective_at": {
                    "anyOf": [
                      {
                        "format": "date-time",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Effective date, when established.",
                    "title": "Retirement Effective At"
                  },
                  "source_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Primary-source filing URL, when available.",
                    "title": "Source Url"
                  },
                  "state": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "State when known; null is not nationwide coverage.",
                    "title": "State"
                  }
                },
                "required": ["carrier", "docket", "filed_at", "filer", "geography_detail", "granted_at", "kind", "retirement_effective_at", "source_url", "state"],
                "title": "CopperFiling",
                "type": "object"
              },
              "CopperRecord": {
                "description": "State-level carrier program status, not an address-specific deadline.",
                "properties": {
                  "carrier": {
                    "description": "Normalized carrier identifier.",
                    "title": "Carrier",
                    "type": "string"
                  },
                  "notes": {
                    "description": "Scope and limitations of the state-level entry.",
                    "title": "Notes",
                    "type": "string"
                  },
                  "retirement_date": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Filed retirement date, or null when not established.",
                    "title": "Retirement Date"
                  },
                  "state": {
                    "description": "Two-letter US state abbreviation.",
                    "title": "State",
                    "type": "string"
                  },
                  "status": {
                    "description": "Program status.",
                    "enum": ["date_filed", "program_active"],
                    "title": "Status",
                    "type": "string"
                  }
                },
                "required": ["carrier", "notes", "retirement_date", "state", "status"],
                "title": "CopperRecord",
                "type": "object"
              }
            },
            "description": "Citable program data and separately dated, reviewed filings.",
            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "As-of date of static records, not of latest_filings.",
                "title": "As Of"
              },
              "latest_filings": {
                "description": "Up to 20 reviewed matching filings.",
                "items": {
                  "$ref": "#/$defs/CopperFiling"
                },
                "title": "Latest Filings",
                "type": "array"
              },
              "license": {
                "const": "CC BY 4.0",
                "description": "Reuse license; attribution is required.",
                "title": "License",
                "type": "string"
              },
              "records": {
                "description": "Carrier/state entries matching the filters.",
                "items": {
                  "$ref": "#/$defs/CopperRecord"
                },
                "title": "Records",
                "type": "array"
              },
              "source": {
                "description": "Source methodology and limitations.",
                "title": "Source",
                "type": "string"
              },
              "source_url": {
                "description": "Attribution URL for the published dataset.",
                "title": "Source Url",
                "type": "string"
              }
            },
            "required": ["as_of", "latest_filings", "license", "records", "source", "source_url"],
            "title": "CopperResponse",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check copper retirement status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:2ba1c1117f241475803a87b89eda316924221c11b706c8388cf5220f33d5c7d5"
        },
        {
          "name": "request_broker_callback",
          "title": "Request a human broker callback",
          "description": "Ask a CHNLSYNC human broker to contact the user about their case.\n\nOnly call this with the user's explicit consent to share their name and\nemail with CHNLSYNC. Requires the session credentials returned by\nask_sync_advisor. The result's ``book_url`` is an optional scheduling\nlink you may offer the user as a next step (\"pick a time now\"); the\ncallback is already queued and a broker will reach out either way, so\nnever present booking as required or as a confirmed appointment. Do not\nautomatically retry after a timeout: the request may already be recorded.",
          "inputSchema": {
            "properties": {
              "contact_email": {
                "description": "Email the user explicitly consented to share.",
                "maxLength": 255,
                "minLength": 3,
                "pattern": "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$",
                "type": "string"
              },
              "contact_name": {
                "description": "Name the user consented to share.",
                "maxLength": 255,
                "minLength": 1,
                "pattern": "\\S",
                "type": "string"
              },
              "session_id": {
                "description": "Workspace ID returned by the advisor.",
                "pattern": "^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$",
                "type": "string"
              },
              "session_token": {
                "description": "Private workspace credential.",
                "maxLength": 512,
                "minLength": 1,
                "pattern": "^\\S+$",
                "type": "string"
              }
            },
            "required": ["contact_email", "contact_name", "session_id", "session_token"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Recorded callback acknowledgement; this is not a confirmed appointment.",
            "properties": {
              "book_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional scheduling link; booking is not required.",
                "title": "Book Url"
              },
              "disclosure": {
                "description": "Human-review disclosure supplied by the backend.",
                "title": "Disclosure",
                "type": "string"
              },
              "status": {
                "const": "received",
                "description": "Callback request recorded, not yet completed.",
                "title": "Status",
                "type": "string"
              }
            },
            "required": ["book_url", "disclosure", "status"],
            "title": "CallbackResponse",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a human broker callback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:51ca8a10d07ad28d04f81c697ea972afcaf2644f7a4f5a6518dd7350c8b4b48f"
        }
      ],
      "digest": "sha256:0a6b958b5bb7959b5fc1065673f113251ab716c33a93cd58d6c11407a4b2de28"
    }
  }
}
