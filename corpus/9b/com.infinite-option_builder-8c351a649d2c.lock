{
  "lockfileVersion": 2,
  "subjects": {
    "com.infinite-option/builder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.infinite-option.com/v1/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "infinite-option",
        "title": "Infinite Option",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Infinite Option (https://infinite-option.com) fertigt Bauteile nach CAD-Datei (3D-Druck, CNC, Blech) und bietet den Infinite CAD Builder, ein CAD-Programm im Browser. Dieser Server ist nur lesend: Er nennt Verfahren, Materialien und fertige Bauteile und gibt Links zum Preisrechner und in den Builder. Preise entstehen erst auf der Website.",
      "tools": [
        {
          "name": "get_builder_link",
          "title": "Link in den Infinite CAD Builder",
          "description": "Returns a link that opens the Infinite CAD Builder in the browser: empty, with a ready-made part (template), with one of its tools, or with a sentence already filled into its \"Text zu 3D\" input (the user still has to confirm it; nothing is executed by the link). Use at most one of template, tool, text. With template you may add values (dimensions from list_part_templates, within their limits) so the part opens with these dimensions already filled in. Read-only, creates nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "template": {
                "description": "Id of a ready-made part from list_part_templates.",
                "enum": ["flange", "plate", "sleeve", "gear"],
                "type": "string"
              },
              "text": {
                "description": "German sentence for the \"Text zu 3D\" input, e.g. \"Quader 40 x 20 x 10\" or \"Bohrung 8 mm, 12 mm tief\".",
                "maxLength": 300,
                "type": "string"
              },
              "tool": {
                "description": "handzeichnung = from a hand sketch, ansichten = from drawing views, text = describe in words, volumenkoerper = mesh to solid, foto = from photos.",
                "enum": ["handzeichnung", "ansichten", "text", "volumenkoerper", "foto"],
                "type": "string"
              },
              "values": {
                "additionalProperties": {
                  "type": ["number", "string", "boolean"]
                },
                "description": "Only with template: dimensions by parameter key from list_part_templates, e.g. {\"module\": 2, \"teeth\": 24} for template gear. Numbers in mm, within the listed limits.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:325317a3226fdc1f421acaedcda2bef36e2555ef75d4855360835950fd7feaf4"
        },
        {
          "name": "get_price_link",
          "title": "Link zum Preisrechner",
          "description": "Returns the link where a customer uploads a CAD file (STEP, STL, 3MF, DXF) to see prices and order online, plus the steps. This server does not calculate prices itself. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8d4d7b89b7b6c15e5e579ab93b3acc73e9062f664fce325d713cd8b9d815f57"
        },
        {
          "name": "list_part_templates",
          "title": "Fertige Bauteile im Infinite CAD Builder",
          "description": "Lists the ready-made parametric parts of the Infinite CAD Builder (a CAD program that runs in the browser), with their adjustable dimensions and a link that opens each part in the builder. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d39c67b6d75da2d06a6a8a0b129d4a3d729cfdb1bac129ecc41e6d23d1bad3aa"
        },
        {
          "name": "list_services",
          "title": "Verfahren und Materialien",
          "description": "Lists what Infinite Option (infinite-option.com, Germany) manufactures from a customer CAD file: processes (3D printing, CNC, sheet metal) with the materials currently offered, accepted file formats, and where to get a price. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a11eddaf7437660c7b817b255ed3d8d543878ac44a0c568164ec52da9d82e942"
        }
      ],
