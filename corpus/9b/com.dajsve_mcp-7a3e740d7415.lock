        {
          "name": "search_offers",
          "title": "Search Dajsve offers",
          "description": "Search current offers aggregated by dajsve.com. Use Croatian search terms. Returns Dajsve offer details and a clickUrl that takes the user to the original merchant offer.",
          "inputSchema": {
            "properties": {
              "request": {
                "description": "Search and filter parameters.",
                "properties": {
                  "categories": {
                    "description": "Optional category IDs, names or URL slugs.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "latitude": {
                    "description": "Optional latitude used together with longitude and radiusKm.",
                    "type": ["number", "null"]
                  },
                  "limit": {
                    "description": "Maximum number of offers to return, from 1 to 20. Default is 10.",
                    "type": "integer"
                  },
                  "longitude": {
                    "description": "Optional longitude used together with latitude and radiusKm.",
                    "type": ["number", "null"]
                  },
                  "maxPrice": {
                    "description": "Optional maximum price in EUR.",
                    "type": ["number", "null"]
                  },
                  "minPrice": {
                    "description": "Optional minimum price in EUR.",
                    "type": ["number", "null"]
                  },
                  "query": {
                    "description": "Croatian free-text search query. Leave empty only when requesting newest, popular or best-discount offers.",
                    "type": "string"
                  },
                  "radiusKm": {
                    "description": "Optional search radius in kilometres, from 1 to 300.",
                    "type": ["integer", "null"]
                  },
                  "sort": {
                    "description": "Sort: relevance, newest, popular, best_discount, price_asc, price_desc or discount_desc.",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
