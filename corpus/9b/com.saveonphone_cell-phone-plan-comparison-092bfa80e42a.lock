        {
          "name": "search_plans",
          "title": "Search phone plans",
          "description": "Search all published plans by carrier/name/network/budget/data. Results include next_offset for pagination. Catalog prices retain original dates and conditions; verified_only limits results to detailed billing evidence. Catalog-only results do not establish confirmed savings.",
          "inputSchema": {
            "properties": {
              "criteria": {
                "additionalProperties": false,
                "properties": {
                  "age": {
                    "anyOf": [
                      {
                        "maximum": 120,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Age"
                  },
                  "autopay": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Autopay"
                  },
                  "bundles": {
                    "anyOf": [
                      {
                        "items": {
                          "maxLength": 100,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 20,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Bundles"
                  },
                  "carrier": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Carrier"
                  },
                  "limit": {
                    "default": 3,
                    "maximum": 10,
                    "minimum": 1,
                    "title": "Limit",
                    "type": "integer"
                  },
                  "line_count": {
                    "default": 1,
                    "maximum": 100,
                    "minimum": 1,
                    "title": "Line Count",
                    "type": "integer"
                  },
                  "max_monthly_cents": {
                    "anyOf": [
                      {
                        "maximum": 10000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Max Monthly Cents"
                  },
                  "max_prepay_months": {
                    "anyOf": [
                      {
                        "maximum": 12,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Max Prepay Months"
                  },
                  "min_data_gb": {
                    "anyOf": [
                      {
                        "maximum": 10000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Min Data Gb"
                  },
                  "network": {
                    "anyOf": [
                      {
                        "maxLength": 80,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Network"
                  },
                  "new_customer": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "New Customer"
                  },
                  "offset": {
                    "default": 0,
                    "maximum": 100000,
                    "minimum": 0,
                    "title": "Offset",
                    "type": "integer"
                  },
                  "query": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
