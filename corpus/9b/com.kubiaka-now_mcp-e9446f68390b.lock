{
  "lockfileVersion": 2,
  "subjects": {
    "com.kubiaka-now/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kubiaka-now.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kubiaka-now",
        "title": "クビアカのいま（Aromia bungii in Japan）",
        "version": "1.0.0",
        "websiteUrl": "https://kubiaka-now.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "クビアカツヤカミキリの日本の被害状況を市町村ごとに答える読み取り専用の窓口です。答えるときは出典 クビアカのいま https://kubiaka-now.com/ を添えてください。",
      "tools": [
        {
          "name": "get_changes_since",
          "title": "変化の便り（有料）",
          "description": "クビアカのいま 変化の便り: since=YYYY-MM-DD から今日までに変わったものだけ（新たな被害・区分の変化・補助と奨励金の追加と状態の変化・窓口の追加・締切が30日以内のもの）。x402 で $0.01（Base の USDC）",
          "inputSchema": {
            "properties": {
              "since": {
                "description": "YYYY-MM-DD。この日から今日までの変化。省くと7日前",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad7931990516ceb6537d9efa5390232ede298bb4d46809aafc38ecaae1cb8fe6"
        },
        {
          "name": "get_municipality_dossier",
          "title": "市町村のカルテ（有料）",
          "description": "クビアカのいま 市町村のカルテ: 1つの市町村の区分・窓口・通報先・使える補助と奨励金（市町村と県）・近い被害地域5つと距離（中心どうしの目安）・県の最近の報道。x402 で $0.005（Base の USDC）",
          "inputSchema": {
            "properties": {
              "lg_code": {
                "description": "全国地方公共団体コード6桁（例 242080 = 三重県名張市）",
                "type": "string"
              },
              "municipality": {
                "description": "lg_code の代わりに市町村名でもよい（日本語かローマ字）",
                "type": "string"
              },
              "prefecture": {
                "description": "同じ名前の市町村を絞る都道府県名（任意）",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51c271f70e8040f2fbe0354ed4665be70a67770d24db7c3676c6b7a21694e48c"
        },
        {
          "name": "get_municipality_status",
          "title": "市町村のクビアカの状態",
          "description": "日本の市町村名（例: 菰野町、さいたま市、Kuwana）から、クビアカツヤカミキリの被害の状態、その市町村で新たに見つかった被害、使える奨励金・補助を返す",
          "inputSchema": {
            "properties": {
              "municipality": {
                "description": "市町村名。日本語かローマ字。市・町・村は付けても付けなくてもよい",
                "type": "string"
              },
              "prefecture": {
                "description": "都道府県名（同じ名前の市町村を絞るとき。任意）",
                "type": "string"
              }
            },
            "required": ["municipality"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:36cddc21b914b6729131cbed951550b511b8d2f3a14d72a57ae4f054bb5e1cd5"
        },
        {
          "name": "list_new_detections",
          "title": "新たに被害が見つかった地域",
          "description": "国の一覧（2026年9月11日）のあとに新たに被害が見つかった市町村の一覧。日付・内容・出典つき",
          "inputSchema": {
            "properties": {
              "prefecture": {
                "description": "都道府県名で絞る（任意）",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87f32a24b70cc514c49ca3ef244a18489b24c7304a8d7cc47c30aed666cc5b25"
        },
        {
          "name": "list_rewards_and_subsidies",
          "title": "奨励金・報奨金と伐採の補助",
          "description": "成虫を捕まえた人への奨励金・報奨金と、木の持ち主が使える防除・伐採の補助。受付の状態と確かめた日つき",
          "inputSchema": {
            "properties": {
              "only_open": {
                "description": "受付中だけにする（既定 true）",
                "type": "boolean"
              },
              "prefecture": {
                "description": "都道府県名で絞る（任意）",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:525d28fbefd2f330b76e28a3b0da46dabf07f9b78080b5e908795f6895e6bd36"
        }
      ],
      "digest": "sha256:5f4176f2b49a736a6a48981a0ac3bde1f23df80f306e9291483e863e34746575"
    }
  }
}
