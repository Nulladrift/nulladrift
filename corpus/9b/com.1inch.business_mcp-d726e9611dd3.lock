      "instructions": "1inch Business MCP Server — provides SDK examples and documentation search.\n\n## SDK Examples\nFor code implementations, use list_examples + get_example:\n- Intent/Fusion swaps: \"@1inch-examples/intent-swap\" (EVM: src/evm/, Solana: src/solana/)\n- Limit orders: \"@1inch-examples/limit-order\"\n- Cross-chain swaps: \"@1inch-examples/cross-chain-swap\"\n\n## Documentation Search\nUse search for API endpoint details not covered by examples. Always prefer example code over documentation snippets.\n\n## Authentication\nInitialize HTTP 200 is **not** login — that is the mcp-free / anonymous identity. Public tools work without a real org. Paid tools need a real organization (OAuth or API key), not mcp-free.\nAll tools are always listed so you know they exist. Some require OAuth to run:\n- **Public (no auth):** search, list_examples, get_example, aqua (analytics actions need nothing — write actions need a WalletConnect-verified wallet that signed the 1inch Terms of Use).\n- **Public (no auth), when enabled:** walletconnect — non-custodial wallet pairing/signing available to every user, including unauthenticated.\n- **Requires OAuth:** authenticate, swap, orderbook, product_api (and debug when enabled).\n**Before** paid tools, call `authenticate`. If the host returns HTTP 401, complete OAuth (`mcp_auth` / connect this server), then call `authenticate` again until it returns `{ authenticated: true, ... }`. Do not treat a PaymentRequired / x402 tool result as login. Do not skip `authenticate` because initialize succeeded.\n\n## Swap Workflow\nUse the \"swap\" tool to execute token swaps (requires authentication). Two approaches:\n- **Shortcut**: Call swap directly (omit quoteOnly). Omit preferredType to let the tool pick a type, or set preferredType (classic, fusion, crosschain) to choose explicitly. Set dstChain for cross-chain.\n- **Full flow**: Call swap with quoteOnly=true to compare quotes and receive a recommended type, then execute with the chosen preferredType.\n\nThe response includes a nextSteps array — follow those instructions to complete the swap:\n- Classic: sign the tx with eth_sendTransaction, wait for receipt. If an approve step is returned, sign that first, then call swap again.\n- Fusion/cross-chain: sign the typedData with eth_signTypedData_v4, then call swap again with signedOrder and orderHash to submit.\n\n## Limit orders (Orderbook)\nUse the \"orderbook\" tool (requires authentication) for limit orders. Recommended flow:\n1. **build**: Provide maker/taker assets, amounts, maker address → server builds order, returns EIP-712 typedData to sign.\n2. **create**: After signing typedData, submit with orderHash + signature + orderData.\nAlso supports list (query orders) and cancel (on-chain cancellation guidance). No SDK needed on the client.\n\n## Product API\nUse the \"product_api\" tool to call any 1inch product API endpoint (Portfolio, Orderbook, Spot Price, Token, Gas Price, etc.) with the user's OAuth credentials. Requires authentication — call authenticate first; initialize 200 is still anonymous.\n\n## Aqua positions\nUse the \"aqua\" tool for 1inch Aqua positions (shared-liquidity market making). Analytics actions are read-only and need no OAuth. Write actions (non-custodial — the user's wallet signs): create_position (preview first, then confirmed:true), close_position. Without OAuth they require a connected WalletConnect wallet that passed screening and signed the 1inch Terms of Use. When tos_acceptance_required: write to the user that they must sign, then immediately call walletconnect accept_terms in the same turn (you trigger the signing). Pass walletSessionToken on those writes after MCP session rotation. create_position refuses to approve when the wallet cannot fund the legs (insufficient_funds). build_swap is B2B-only. Read the resource file://1inch-mcp/guides/aqua-workflow for examples and maker flows.\n\n## WalletConnect\nUse the \"walletconnect\" tool to pair with the user's EVM and/or Solana wallet for signatures and transactions. No authentication is required — it is non-custodial and the user approves every request in their own wallet. Unauthenticated callers should persist the `walletSessionToken` returned by `connect` and pass it back on later calls to keep the session across MCP session rotation. For swap and orderbook, optional execute=true can submit or sign in one step when a WalletConnect session is active.",
      "tools": [
        {
          "name": "aqua",
          "description": "1inch Aqua (shared-liquidity market making): position analytics plus maker position writes.\n\nWrite actions (OAuth, or WalletConnect + signed 1inch ToS (pass walletSessionToken after MCP session rotation); non-custodial — the user's wallet signs): create_position (two-phase: call once for a preview + previewRef, then again with confirmed:true), close_position (confirmed:true; closing is permanent). Anonymous writes execute only via WalletConnect (execute=false is rejected).\n\nREQUIRED: \"action\" — read actions (no OAuth): maker_stats, list_maker_strategies, strategy_overview, strategy_activity, strategy_volume, list_opened.\n\nRead the resource file://1inch-mcp/guides/aqua-workflow for per-action examples, priceRange semantics, and maker position flows. Raw HTTP: product_api with path \"/aqua/v1.0/strategies/...\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "description": "Invalid or missing \"action\" parameter. Must be one of: \"maker_stats\", \"list_maker_strategies\", \"strategy_overview\", \"strategy_activity\", \"strategy_volume\", \"list_opened\", \"create_position\", \"close_position\". Example: { \"action\": \"maker_stats\", \"address\": \"0x...\" }",
                "enum": ["maker_stats", "list_maker_strategies", "strategy_overview", "strategy_activity", "strategy_volume", "list_opened", "create_position", "close_position"],
                "type": "string"
              },
              "address": {
                "description": "Maker EVM address (maker_stats, list_maker_strategies).",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "app": {
                "description": "App / AquaSwapVMRouter address (strategy_* reads, close_position).",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "chainId": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "items": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "type": "array"
                  }
                ],
                "description": "EVM chain ID (number) for single-strategy / write actions, or an array of chain IDs for list/stats filters."
              },
              "confirmed": {
                "description": "create_position: omit to preview, pass true with previewRef to encode (create_position is two-phase: call without confirmed to receive a preview and previewRef (no calldata); review it, then call again with the same parameters, the returned openingPrice, previewRef, and confirmed: true to encode.). close_position: must be true. Closing is permanent. The position stops quoting and moves to Closed. Your tokens stay in your wallet.",
                "type": "boolean"
              },
              "cursor": {
                "description": "Opaque pagination cursor from a previous response.",
                "minLength": 1,
                "type": "string"
              },
              "execute": {
                "description": "Optional. When a WalletConnect session is active, defaults to true: the transaction is sent via the wallet (user confirms the prompt). Authenticated sessions may set execute=false to return calldata only. Anonymous sessions always execute via WalletConnect (execute=false is rejected). Set execute=true to require WalletConnect (errors if not connected).",
                "type": "boolean"
              },
              "feeBpsIn": {
                "description": "Optional taker fee in basis points for create_position (1-500).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "granularity": {
                "description": "Volume series bucket (strategy_volume).",
                "enum": ["1h", "1d", "1m", "1y"],
                "type": "string"
              },
              "limit": {
                "description": "Page size for list/activity/volume actions.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "maker": {
                "description": "Maker EVM address (strategy_* reads, create_position).",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "openingPrice": {
                "description": "Opening price as a positive decimal string (token1 per token0, whole units). An XYC position opens at amount1 / amount0, so the preview derives it from the leg amounts when both tokens' decimals are known and rejects a value that disagrees with the legs. Optional on the preview call; required on the confirm call — echo the value the preview returned.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "previewRef": {
                "description": "Short-TTL preview reference returned by the create_position preview call. Pass it back together with confirmed: true to encode; a stale, used, or mismatched ref is refused (no silent re-encode).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "priceRange": {
                "description": "Optional concentrated-liquidity range for create_position (rawPriceMin/rawPriceMax in 1e18).",
                "properties": {
                  "rawPriceMax": {
                    "description": "Maximum raw price P = tokenGt/tokenLt in 1e18 fixed point.",
                    "minLength": 1,
                    "pattern": "^\\d+$",
                    "type": "string"
                  },
                  "rawPriceMin": {
                    "description": "Minimum raw price P = tokenGt/tokenLt in 1e18 fixed point.",
                    "minLength": 1,
                    "pattern": "^\\d+$",
                    "type": "string"
                  }
                },
                "required": ["rawPriceMax", "rawPriceMin"],
                "type": "object"
              },
              "sort": {
                "description": "Sort direction for list/activity/volume (asc|desc).",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "status": {
                "description": "Filter by lifecycle status for list_maker_strategies (e.g. [\"open\"]).",
                "items": {
                  "enum": ["open", "closed"],
                  "type": "string"
                },
                "type": "array"
              },
              "strategy": {
                "description": "Encoded strategy/order bytes (close_position).",
                "pattern": "^0x(?:[a-fA-F0-9]{2})+$",
                "type": "string"
              },
              "strategyHash": {
                "description": "Strategy hash (strategy_* reads, close_position).",
                "pattern": "^0x[a-fA-F0-9]{64}$",
                "type": "string"
              },
              "tokens": {
                "anyOf": [
                  {
                    "items": {
                      "properties": {
                        "amount": {
                          "description": "Amount to deploy in the token's smallest units (e.g. 1000000 for 1 USDC).",
                          "minLength": 1,
                          "pattern": "^\\d+$",
                          "type": "string"
                        },
                        "token": {
                          "description": "ERC-20 token address (no native 0xeee… / zero address).",
                          "pattern": "^0x[a-fA-F0-9]{40}$",
                          "type": "string"
                        }
                      },
                      "required": ["amount", "token"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "items": {
                      "pattern": "^0x[a-fA-F0-9]{40}$",
                      "type": "string"
                    },
                    "type": "array"
                  }
                ],
                "description": "create_position: exactly two legs [{ token, amount }, { token, amount }] (amount in smallest units, as a string). close_position: array of token addresses to withdraw."
              },
              "walletSessionToken": {
                "description": "Optional durable WalletConnect token from walletconnect connect. Anonymous writes must pass it after MCP session rotation (or after any walletconnect call that already used it on this session). Ignored for authenticated callers. Treat as a secret.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
