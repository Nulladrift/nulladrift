        {
          "name": "debug",
          "description": "[Requires authentication] Call the authenticate tool first to start or confirm 1inch Business login (initialize 200 is still anonymous). If authenticate or this tool returns HTTP 401, complete OAuth, then retry. Look up production API request logs for your 1inch Business organization to troubleshoot integration issues. Results are always scoped to your authenticated organization.\n\nTwo modes:\n1) By request id: pass requestId (the x-request-id header returned on 1inch API responses). Optionally narrow startTime/endTime (defaults: last 24 hours ending now).\n2) Logs in a time window: omit requestId and pass both startTime and endTime (RFC3339). Optionally set logLevel (\"info\", \"warn\", or \"error\") to filter by severity; omit to return all levels.\n\nLimits: each call covers at most a 24-hour window; how far back you can query depends on your plan's log retention.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "endTime": {
                "description": "RFC3339 end of query window. Defaults to now when omitted.",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Max log lines (max 100)",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "logLevel": {
                "description": "Filter by log level: \"info\", \"warn\", or \"error\". Omit to return all levels. Only applies to time-window mode (ignored when requestId is set).",
                "enum": ["info", "warn", "error"],
                "type": "string"
              },
              "requestId": {
                "description": "Production x-request-id (or correlation id) to find logs for. When set, searches JSON logs for this value scoped to your organization.",
                "maxLength": 128,
                "minLength": 8,
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              },
              "startTime": {
                "description": "RFC3339 start of query window. With requestId, defaults to 24h before endTime.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Request log lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:177f7927df839397f97bffa88e74056f2e33074d5e9f8b27c03c7e6901691f64"
        },
