        {
          "name": "orderbook",
          "description": "[Requires authentication] Call the authenticate tool first to start or confirm 1inch Business login (initialize 200 is still anonymous). If authenticate or this tool returns HTTP 401, complete OAuth, then retry. Limit orders via the 1inch Orderbook API (v4.1).\n\nIMPORTANT: The \"action\" parameter is REQUIRED. Must be one of: \"build\", \"create\", \"list\", \"cancel\".\n\nActions with example parameters:\n\n1. build (recommended first step):\n   { \"action\": \"build\", \"chain\": 1, \"makerAsset\": \"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48\", \"takerAsset\": \"0xdAC17F958D2ee523a2206206994597C13D831ec7\", \"makingAmount\": \"1000000\", \"takingAmount\": \"990000\", \"makerAddress\": \"0x...\" }\n   Optional: expirationSeconds (default 604800 = 7 days). With an active WalletConnect session, the order is signed and submitted automatically (set execute=false to return typed data only).\n\n2. create (after signing typedData from build):\n   { \"action\": \"create\", \"chain\": 1, \"orderHash\": \"0x...\", \"signature\": \"0x...\", \"orderData\": { ... } }\n\n3. list (query orders):\n   - By maker: { \"action\": \"list\", \"chain\": 1, \"listMode\": \"by_maker\", \"makerAddress\": \"0x...\" }\n   - By hash:  { \"action\": \"list\", \"chain\": 1, \"listMode\": \"by_hash\", \"orderHash\": \"0x...\" }\n   - Browse:   { \"action\": \"list\", \"chain\": 1, \"listMode\": \"all\", \"limit\": 10 }\n\n4. cancel (inspect + guidance):\n   { \"action\": \"cancel\", \"chain\": 1, \"orderHash\": \"0x...\" }\n\nTypical flow: build -> sign typedData -> create (or one build call when WalletConnect is connected — order signed and submitted automatically).\nThe maker asset may require a one-time ERC-20 approval for the Limit Order Protocol; it costs native gas even though the limit order itself is gasless. When a build response includes an \"approval\" block, tell the user upfront (approval.estimatedCost holds the estimated cost in native units) and broadcast the included approveTx before signing. With WalletConnect, the approve is sent automatically — \"approvalTxSent\": true means the first wallet prompt was the one-time approval.\nRequires authentication. For raw HTTP access, use product_api.\n\n**x402:** when plan quota is exhausted, a call returns a PaymentRequired result: a build is priced for the **whole call** (one flat price, however many 1inch API calls it makes), list, cancel and create per call. Retry the same call once with the signed payment in _meta[\"x402/payment\"] — see file://1inch-mcp/guides/x402-payments. A paid build returns the typedData to sign (no WalletConnect execution); submit it with create.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "description": "Invalid or missing \"action\" parameter. Must be one of: \"build\", \"create\", \"list\", \"cancel\". Example: { \"action\": \"list\", \"chain\": 1, \"listMode\": \"by_maker\", \"makerAddress\": \"0x...\" }",
                "enum": ["build", "create", "list", "cancel"],
                "type": "string"
              },
              "chain": {
                "description": "Chain ID (number, e.g. 1 for Ethereum). Required for every action.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "cursor": {
                "description": "list: pagination cursor from a previous response.",
                "type": "string"
              },
              "execute": {
                "description": "Optional. When a WalletConnect session is active, defaults to true: sign typedData and submit the order via the wallet (user confirms prompts). Set execute=false to return typed data for signing elsewhere. Set execute=true to require WalletConnect (errors if not connected).",
                "type": "boolean"
              },
              "expirationSeconds": {
                "description": "build: optional order expiration in seconds from now (default 604800 = 7 days).",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "limit": {
                "description": "list: page size (number, default 100, max 500).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "listMode": {
                "description": "list: required. by_maker (needs makerAddress), by_hash (needs orderHash), or all.",
                "enum": ["by_maker", "by_hash", "all"],
                "type": "string"
              },
              "makerAddress": {
                "description": "Maker wallet address (0x + 40 hex). build: required (the address that signs). list by_maker: required.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "makerAsset": {
                "description": "build: required — maker asset token address (0x...) or symbol (e.g. USDC). list: optional address filter.",
                "minLength": 1,
                "type": "string"
              },
              "makingAmount": {
                "description": "build: required — amount of maker asset to sell in smallest units (e.g. 1000000 for 1 USDC), as a string to avoid precision loss.",
                "minLength": 1,
                "pattern": "^\\d+$",
                "type": "string"
              },
              "order": {
                "description": "create (legacy): full signed order payload. Prefer orderHash + signature + orderData after build.",
                "properties": {
                  "data": {
                    "additionalProperties": {},
                    "description": "Limit order fields: makerAsset, takerAsset, maker, makingAmount, takingAmount, salt, extension, makerTraits, etc.",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "orderHash": {
                    "description": "Hash of the limit order typed data (EIP-712)",
                    "pattern": "^0x[a-fA-F0-9]+$",
                    "type": "string"
                  },
                  "signature": {
                    "description": "Signature from signTypedData / eth_signTypedData_v4",
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["data", "orderHash", "signature"],
                "type": "object"
