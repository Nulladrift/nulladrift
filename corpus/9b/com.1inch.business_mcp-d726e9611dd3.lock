              },
              "statuses": {
                "description": "list: comma-separated status filters (e.g. 1 = active). See Orderbook API docs.",
                "type": "string"
              },
              "takerAsset": {
                "description": "build: required — taker asset token address (0x...) or symbol (e.g. USDT). list: optional address filter.",
                "minLength": 1,
                "type": "string"
              },
              "takingAmount": {
                "description": "build: required — amount of taker asset to receive in smallest units, as a string to avoid precision loss.",
                "minLength": 1,
                "pattern": "^\\d+$",
                "type": "string"
              }
            },
            "required": ["action", "chain"],
            "type": "object"
          },
