        {
          "name": "swap",
          "description": "[Requires authentication] Call the authenticate tool first to start or confirm 1inch Business login (initialize 200 is still anonymous). If authenticate or this tool returns HTTP 401, complete OAuth, then retry. Swap tokens via 1inch. Supports classic (on-chain), Fusion (intent/gasless), and cross-chain swaps. Omit preferredType and the tool picks a type for you; set preferredType (classic, fusion, crosschain) to choose explicitly.\n\nWhen quoteOnly returns a `recommended` type and that type is available, present **only** that type to the user. Do not mention, compare, or suggest other swap types unless the user explicitly asks to compare alternatives.\n\nERC-20 source tokens may require a one-time approval transaction before the swap can proceed; the approval costs native gas on the source chain even for gasless Fusion/cross-chain swaps. When a response includes an `approval` block, tell the user upfront (approval.estimatedCost holds the estimated cost in native units).\n\nUsage modes:\n1. **Quote** (quoteOnly=true): Returns only one swap type and its quote. If you pass `preferredType` explicitly (classic, fusion, or crosschain), the response returns that exact type (when a quote for it is available). If `preferredType` is omitted, the tool compares classic, Fusion, and cross-chain internally and picks the best one. The chosen type is echoed as `recommended`.\n2. **Execute** (default): Returns data to sign. Response type depends on swap mode:\n   - Classic → {type:\"classic\", step:\"approve\"|\"swap\", tx:{to,data,value}} → sign with eth_sendTransaction, wait for receipt. If step=\"approve\", sign the approve tx first, then call swap again for the actual swap tx.\n   - Fusion → {type:\"fusion\", orderHash, typedData} → sign typedData with eth_signTypedData_v4, then call this tool again with signedOrder=<signature> and orderHash.\n   - Cross-chain → {type:\"crosschain\", orderHash, typedData, srcChain, dstChain} → same as Fusion: sign typedData, then submit with signedOrder.\n3. **Submit** (signedOrder=<sig>): Submit a previously signed Fusion/cross-chain order. Returns {status:\"submitted\", orderHash}.\n\nFlows:\n- **Full flow**: quote first (quoteOnly=true), then execute with chosen preferredType, then sign + submit.\n- **Shortcut**: skip the quote — call directly without quoteOnly. Omit preferredType to let the tool pick a type, or set preferredType explicitly. Set dstChain for cross-chain.\n\nResponses that require on-chain transactions link to a guide. Use the product_api tool with path=\"/web3/{chainId}\" to broadcast (see linked guide for body format).\n\n**x402:** when plan quota is exhausted, quotes and same-chain swaps return a PaymentRequired result priced for the **whole call** (one flat price per mode, however many 1inch API calls the tool makes). Retry the same call once with the signed payment in _meta[\"x402/payment\"] — see file://1inch-mcp/guides/x402-payments. Paid calls return unsigned payloads (no WalletConnect execution); submit a signed order with signedOrder. Cross-chain execution and cross-chain submits are not payable with x402.\n\nWith an active WalletConnect session (`walletconnect` action=connect), swap execution is automatic by default: classic approve/swap txs, Fusion/cross-chain sign-and-submit, and native escrow sends are prompted in the user’s wallet — no manual broadcast or separate submit step. Set `execute=false` to receive unsigned payloads instead. Set `execute=true` to require WalletConnect (fails if not connected).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Amount in wei/smallest unit. Pass large amounts as a string to avoid precision loss.",
                "minLength": 1,
                "pattern": "^\\d+$",
                "type": "string"
              },
              "chain": {
                "description": "Chain ID (e.g. 1 for Ethereum, 8453 for Base)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "dst": {
                "description": "Destination token address or symbol (e.g. ETH, 0x...)",
                "type": "string"
              },
              "dstChain": {
                "description": "Destination chain for cross-chain swap",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "execute": {
                "description": "Optional. When a WalletConnect session is active, defaults to true: classic approve/swap txs, Fusion/cross-chain EIP-712 sign+submit, and native escrow sends are handled via the wallet (user confirms prompts). Set execute=false to opt out and receive unsigned calldata or manual signing steps. Set execute=true to require WalletConnect (errors if not connected).",
                "type": "boolean"
              },
              "from": {
                "description": "Wallet address executing the swap",
                "type": "string"
              },
              "gasPrice": {
                "description": "Network gas price in wei (optional; omit for fast default)",
                "type": "string"
              },
              "orderHash": {
                "description": "Order hash for submit mode",
                "type": "string"
              },
              "preferredType": {
                "description": "Preferred swap type; the tool picks one if omitted",
                "enum": ["classic", "fusion", "crosschain"],
                "type": "string"
              },
              "preset": {
                "description": "Order preset for fusion/cross-chain: fast (quicker fill), medium, slow (better rate)",
                "enum": ["fast", "medium", "slow"],
                "type": "string"
              },
              "quoteOnly": {
                "description": "If true, return quote comparison only (no tx/order)",
                "type": "boolean"
              },
              "signedOrder": {
                "description": "Signed EIP-712 order (submit mode)",
                "type": "string"
              },
              "slippage": {
                "description": "Slippage tolerance in % (default 0.5)",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "src": {
                "description": "Source token address or symbol (e.g. USDC, 0x...)",
                "type": "string"
              }
            },
            "required": ["amount", "chain", "dst", "from", "src"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "title": "Swap quote & execute"
          },
          "behavior": {
            "destructive": true,
