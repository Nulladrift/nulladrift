                  "type": "string"
                },
                "type": "object"
              },
              "orderHash": {
                "description": "0x-prefixed order hash. create: from the build response. list by_hash and cancel: required.",
                "pattern": "^0x[a-fA-F0-9]+$",
                "type": "string"
              },
              "signature": {
                "description": "create: EIP-712 signature from signing the typedData returned by build.",
                "minLength": 1,
                "type": "string"
              },
              "sortBy": {
                "description": "list: sort field for endpoints that support it.",
                "enum": ["createDateTime", "takerRate", "makerRate", "makerAmount", "takerAmount"],
