      "instructions": "searchnapply: job search for the connected user. Every tool needs the user's searchnapply account (OAuth); nothing works anonymously. The steps follow a job search in order.\n1. SEARCH. Gather a role and a location, then call job_postings_search. Say which role and location were understood when they differ from the user's words. job_postings_search_fields explains a field the user did not spell out.\n2. SHOW. When a search finds postings: in a chat app (Claude, ChatGPT) call job_postings_search_widget_render with their ids, unasked; in a terminal or coding agent list them as text: title - company - location - salary if present - link. If the widget fails, list as text; never drop results.\n3. WIDEN. One job is often filed under neighbouring roles, for example SDET, QA engineer and test engineer. When results are thin, offer a search or a monitor for a neighbouring role the user would accept.\n4. READ. job_postings_get_full_description reads chosen postings in full, before judging or tailoring.\n5. TAILOR. \"Tailor my resume to each of these postings\": read each in full and profile_get once, follow its resume rules, write one resume per posting and offer the cover letter. profile_update changes the profile only after the user agrees.\n6. APPLY. searchnapply itself submits no application and writes no document. \"Help me apply to these postings\": give each its postingUrl and offer the host's agent mode; never say it applied.\n7. WATCH. Only when the user asks to be kept informed: monitor_create saves a search; monitor_list finds a monitor; monitor_get shows what it collected; monitor_review_widget_render shows its new postings as a list in a chat app; monitor_decide records the user's decisions; monitor_update edits it; monitor_delete only when the user asks.\nACCOUNT. The tools work on every plan, Free included, within its daily call limit; subscription_get tells the plan, its limit and usage; subscription_links gives the plans and account pages. A result naming no plan means none is active: give pricingUrl and stop. \"Your searchnapply connection expired\" means the user must reconnect. feedback_send only when the user asks or agrees.\nTRUTH. Report only what a tool returned; never invent a posting, salary, company or field.\nCOSTS. About 170 tokens per posting summary, 3020 per 20-row page, 1100 for a full posting, 1410 for a profile (o200k_base, measured).",
