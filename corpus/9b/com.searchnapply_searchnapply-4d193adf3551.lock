                "description": "The 1-based page returned.",
                "type": "integer"
              },
              "pageSize": {
                "description": "How many postings a page holds.",
                "type": "integer"
              },
              "postings": {
                "description": "The matching postings, one summary each.",
                "items": {
                  "properties": {
                    "company": {
                      "description": "The hiring company.",
                      "type": "string"
                    },
                    "department": {
                      "description": "The department the posting's role belongs to.",
                      "properties": {
                        "label": {
                          "description": "The department's name.",
                          "type": "string"
                        },
                        "slug": {
                          "description": "The department slug the department field takes.",
                          "type": "string"
                        }
                      },
                      "required": ["label", "slug"],
                      "type": "object"
                    },
                    "employmentType": {
                      "description": "The employment type, in the employmentType field's vocabulary.",
                      "type": "string"
                    },
                    "experienceLevel": {
                      "description": "The experience level, in the experience field's vocabulary.",
                      "type": "string"
                    },
                    "id": {
                      "description": "The posting id to pass to job_postings_get_full_description.",
                      "type": "integer"
                    },
                    "locationCount": {
                      "description": "How many locations the posting names in total.",
                      "type": "integer"
                    },
                    "locations": {
                      "description": "Up to five location names of the posting.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "matchedVia": {
                      "description": "Which match found the row: exact, title or family.",
                      "type": "string"
                    },
                    "postingUrl": {
                      "description": "The company's own posting, where the user applies.",
                      "type": "string"
                    },
                    "publishedAt": {
                      "description": "When the company published the posting.",
                      "format": "date-time",
                      "type": "string"
                    },
                    "salary": {
                      "description": "The published salary.",
                      "properties": {
                        "currency": {
                          "description": "The currency code the amounts are in.",
                          "type": "string"
                        },
                        "max": {
                          "description": "The highest published amount.",
                          "type": "number"
                        },
                        "min": {
                          "description": "The lowest published amount.",
                          "type": "number"
                        },
                        "period": {
                          "description": "The time the amounts cover, such as year or hour.",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "shortDescription": {
                      "description": "A one-line digest of the duties and skills, in the company's words.",
                      "type": "string"
                    },
                    "title": {
                      "description": "The job title as the company wrote it.",
                      "type": "string"
                    },
                    "workFormat": {
