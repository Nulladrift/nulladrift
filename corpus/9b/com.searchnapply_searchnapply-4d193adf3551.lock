        {
          "name": "subscription_get",
          "title": "Get my subscription",
          "description": "Purpose: Read the user's searchnapply subscription, its daily call limit and what was used today; a value that is unknown is left out.\nWhen: The user asks about their subscription, or why a tool stopped answering.\nCost: About 50 tokens.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "description": "The user's plan.",
            "properties": {
              "limits": {
                "description": "The plan's limits; absent when Billing did not answer.",
                "properties": {
                  "callsPerDay": {
                    "description": "How many tool calls the plan allows a day.",
                    "type": "integer"
                  }
                },
                "required": ["callsPerDay"],
                "type": "object"
              },
              "plan": {
                "description": "The plan as Billing reports it.",
                "type": "string"
              },
              "renewsAt": {
                "description": "The date the plan renews; present only when it renews.",
                "type": "string"
              },
              "status": {
                "description": "The subscription status as Billing reports it.",
                "type": "string"
              },
              "trialEndsAt": {
                "description": "When the introductory period ends, if any.",
                "type": "string"
              },
              "usage": {
                "description": "Today's usage.",
                "properties": {
                  "dailyLimitReached": {
                    "description": "True when today's calls are spent; absent when Billing did not say.",
                    "type": "boolean"
                  },
                  "tokensResetAt": {
                    "description": "The date the token allowance resets; absent when Billing does not report it.",
                    "type": "string"
                  },
                  "tokensUsedPercent": {
                    "description": "The share of the month's token allowance used, in percent; absent when Billing does not report it.",
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["plan", "status", "usage"],
            "type": "object"
          },
          "annotations": {
