        {
          "name": "job_postings_search",
          "title": "Search job postings",
          "description": "Purpose: Find job postings that fit the user's role, location and fields, with a short summary per posting.\nWhen: The user describes work they want; gather role and location first; in a chat app show results with job_postings_search_widget_render, unasked, and in a terminal as text.\nCost: About 170 tokens per posting and 3020 for 20 postings.",
          "inputSchema": {
            "examples": [
              {
                "department": "software-it",
                "experience": {
                  "min": "Mid level"
                },
                "locations": ["Austin, TX"],
                "pageSize": 20,
                "titleText": "QA engineer"
              }
            ],
            "properties": {
              "companies": {
                "description": "Company names; a posting from any of them is kept.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "datePosted": {
                "description": "How recently the posting was published; leave it out for any date.",
                "enum": ["past24h", "pastWeek", "pastMonth"],
                "type": "string"
              },
              "department": {
                "description": "One department slug, to narrow a title that spans departments; call job_postings_search_fields for what each one holds.",
                "enum": ["administrative", "agriculture-environment", "arts-media-entertainment", "community-social-services", "construction-skilled-trades", "consulting-strategy", "customer-service", "design", "education", "engineering", "executive-general-management", "finance-accounting", "healthcare", "hospitality-food", "human-resources", "legal", "manufacturing-production", "marketing-communications", "operations-supply-chain", "other", "personal-care-services", "product-management", "protective-services-military", "sales", "science-research", "software-it", "transportation"],
                "type": "string"
              },
              "employmentType": {
                "description": "Employment type to keep.",
                "enum": ["Full-time", "Part-time", "Contract", "Temporary", "Internship", "Volunteer", "Per diem", "Other"],
                "type": "string"
              },
              "excludeKeywords": {
                "description": "Words that must not appear in the title or the text, 1 to 10 words.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "experience": {
                "description": "Experience level to keep, as exactly one of exact or min.",
                "properties": {
                  "exact": {
                    "description": "Keep this experience level only.",
                    "enum": ["Internship", "Entry level", "Junior", "Mid level", "Senior", "Lead", "Staff", "Principal", "Director", "Executive"],
                    "type": "string"
                  },
                  "min": {
                    "description": "Keep this experience level and every level above it.",
                    "enum": ["Internship", "Entry level", "Junior", "Mid level", "Senior", "Lead", "Staff", "Principal", "Director", "Executive"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "includeFamily": {
                "default": false,
                "description": "Also return postings from the resolved role's wider family; false, the default, keeps the exact role only.",
                "type": "boolean"
              },
              "includeNoSalary": {
                "default": true,
                "description": "Keep postings that publish no salary; true by default.",
                "type": "boolean"
              },
              "keywords": {
                "description": "Words that must appear in the posting's text.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "locationTypes": {
                "description": "Workplace types to keep.",
                "items": {
                  "enum": ["Remote", "Hybrid", "OnSite"],
                  "type": "string"
                },
                "type": "array"
              },
              "locations": {
                "description": "Location names in plain words, each read as the closest known location, so check resolvedLocations for what was actually searched.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "page": {
                "default": 1,
                "description": "The 1-based page number.",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "default": 20,
                "description": "Postings per page, 1 to 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "salaryMax": {
                "description": "Highest yearly salary to keep, in US dollars after the same conversion.",
                "type": "number"
              },
              "salaryMin": {
                "description": "Lowest yearly salary to keep, in US dollars after each posting's published salary is converted.",
                "type": "number"
              },
              "sortBy": {
                "description": "Result order; job_postings_search_fields explains each value.",
                "enum": ["smart", "newest"],
                "type": "string"
              },
              "titleText": {
                "description": "Words of the job title, matched to one of searchnapply's known roles (resolvedRole.display names it), else matched against posting titles.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "One page of job postings matching the search.",
            "properties": {
              "facets": {
                "description": "How the matches split by department; absent on a narrowed or empty search.",
                "properties": {
                  "departments": {
                    "description": "The largest departments among the matches, with their counts.",
                    "items": {
                      "properties": {
                        "count": {
                          "description": "How many matching postings the department holds.",
                          "type": "integer"
                        },
                        "label": {
                          "description": "The department's name.",
                          "type": "string"
                        },
                        "slug": {
                          "description": "The department slug the department field takes.",
                          "type": "string"
