        {
          "name": "profile_get",
          "title": "Get my profile",
          "description": "Purpose: Read the user's profile, section by section, with the rules for a tailored resume or cover letter; an empty section is unfilled.\nWhen: Before you tailor a resume or cover letter, or when the user asks what their profile holds.\nCost: About 1410 tokens for a filled profile.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "description": "The user's profile and the rules for a tailored resume or cover letter.",
            "properties": {
              "message": {
                "description": "Present when the profile is empty: where the user fills it in.",
                "type": "string"
              },
              "profile": {
                "description": "The profile document, section by section, as searchnapply stores it."
              },
              "resumeRules": {
                "description": "The rules to follow when writing a tailored resume or cover letter, one rule per line.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["profile", "resumeRules"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
