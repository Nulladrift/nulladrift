        {
          "name": "profile_update",
          "title": "Update my profile",
          "description": "Purpose: Replace whole sections of the user's profile with what the user asked to change.\nWhen: The user asks to add, fix or remove something in their profile, not on your own initiative.\nCost: About 1410 tokens for the profile that comes back.",
          "inputSchema": {
            "examples": [
              {
                "sections": {
                  "summary": {
                    "text": "Backend engineer with ten years of distributed systems work."
                  }
                }
              }
            ],
            "properties": {
              "sections": {
                "description": "The profile sections to replace, each in the shape profile_get returns it.",
                "properties": {
                  "certifications": {
                    "description": "Every certification entry the section keeps, each with its id when it already exists.",
                    "type": "array"
                  },
                  "contacts": {
                    "description": "Email, phone and location, as the profile's contacts carry them.",
                    "type": "object"
                  },
                  "educations": {
                    "description": "Every education entry the section keeps, each with its id when it already exists.",
                    "type": "array"
                  },
                  "experiences": {
                    "description": "Every job entry the section keeps, each with the id it was read with when it already exists.",
                    "type": "array"
                  },
                  "languages": {
                    "description": "Every language entry the section keeps, each with its id when it already exists.",
                    "type": "array"
                  },
                  "projects": {
                    "description": "Every project entry the section keeps, each with its id when it already exists.",
                    "type": "array"
                  },
                  "skills": {
                    "description": "The skill items, as the profile's skills carry them.",
                    "type": "object"
                  },
                  "socialLinks": {
                    "description": "Every link entry the section keeps, each with its id when it already exists.",
                    "type": "array"
                  },
                  "summary": {
                    "description": "The summary text and the about-me text, as the profile's summary carries them.",
                    "type": "object"
                  },
                  "userInfo": {
                    "description": "Name and headline, as the profile's userInfo carries them.",
                    "type": "object"
                  }
                },
                "type": "object"
              }
            },
            "required": ["sections"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The profile after the sections were replaced.",
            "properties": {
              "changed": {
                "description": "The sections that were written.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "profile": {
                "description": "The profile document as searchnapply stores it after the writes."
              }
            },
            "required": ["changed", "profile"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update my profile"
          },
          "behavior": {
