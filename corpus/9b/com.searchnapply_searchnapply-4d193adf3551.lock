        {
          "name": "monitor_update",
          "title": "Update a job monitor",
          "description": "Purpose: Change a saved monitor without losing what it collected or what the user decided; send only what changes, since everything else stays as saved.\nWhen: The user wants a different title, location, company, keyword or field on a saved monitor.\nCost: About 160 tokens for the saved monitor.",
          "inputSchema": {
            "examples": [
              {
                "companies": ["Contoso"],
                "monitorId": 12
              }
            ],
            "properties": {
              "companies": {
                "description": "Company names; a posting from any of them is kept, and leaving them out watches the whole market.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "datePosted": {
                "description": "How recently the posting was published; leave it out for any date.",
                "enum": ["past24h", "pastWeek", "pastMonth"],
                "type": "string"
              },
              "department": {
                "description": "One department slug, to narrow a title that spans departments; call job_postings_search_fields for what each one holds.",
                "enum": ["administrative", "agriculture-environment", "arts-media-entertainment", "community-social-services", "construction-skilled-trades", "consulting-strategy", "customer-service", "design", "education", "engineering", "executive-general-management", "finance-accounting", "healthcare", "hospitality-food", "human-resources", "legal", "manufacturing-production", "marketing-communications", "operations-supply-chain", "other", "personal-care-services", "product-management", "protective-services-military", "sales", "science-research", "software-it", "transportation"],
                "type": "string"
              },
              "employmentType": {
                "description": "Employment type to keep.",
                "enum": ["Full-time", "Part-time", "Contract", "Temporary", "Internship", "Volunteer", "Per diem", "Other"],
                "type": "string"
              },
              "excludeKeywords": {
                "description": "Words that must not appear in the title or the text, 1 to 10 words.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "experience": {
                "description": "Experience level to keep, given as exact, since a monitor keeps one level and no lowest level.",
                "properties": {
                  "exact": {
                    "description": "Keep this experience level only.",
                    "enum": ["Internship", "Entry level", "Junior", "Mid level", "Senior", "Lead", "Staff", "Principal", "Director", "Executive"],
                    "type": "string"
                  },
                  "min": {
                    "description": "Keep this experience level and every level above it.",
                    "enum": ["Internship", "Entry level", "Junior", "Mid level", "Senior", "Lead", "Staff", "Principal", "Director", "Executive"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "includeFamily": {
                "description": "Also return postings from the resolved role's wider family; leave it out to keep the monitor's current setting.",
                "type": "boolean"
              },
              "includeNoSalary": {
                "description": "Keep postings that publish no salary; true by default.",
                "type": "boolean"
              },
              "keywords": {
                "description": "Words that must appear in the posting's text.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "locationTypes": {
                "description": "Workplace types to keep.",
                "items": {
                  "enum": ["Remote", "Hybrid", "OnSite"],
                  "type": "string"
                },
                "type": "array"
              },
              "locations": {
                "description": "Real location names, each read as the closest known location; check monitor.locations in the result for what it watches.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "monitorId": {
                "description": "The monitor id from monitor_list.",
                "type": "integer"
              },
              "salaryCurrency": {
                "description": "A three-letter currency code that only labels the monitor.",
                "type": "string"
              },
              "salaryMax": {
                "description": "Highest yearly salary to keep, in US dollars after the same conversion.",
                "type": "number"
              },
              "salaryMin": {
                "description": "Lowest yearly salary to keep, in US dollars after each posting's published salary is converted.",
                "type": "number"
              },
              "titleText": {
                "description": "Words of the job title, matched to one of searchnapply's known roles (resolvedRole.display names it), which the monitor then watches.",
                "type": "string"
              }
            },
            "required": ["monitorId"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The saved monitor.",
            "properties": {
              "monitor": {
                "description": "The monitor as saved.",
                "properties": {
                  "companies": {
                    "description": "Companies the monitor keeps; empty for the whole market.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "counts": {
                    "description": "The monitor's counts.",
                    "properties": {
                      "applied": {
                        "description": "The triage state over ALL of those postings (found and family alike), so New + Applied + Skipped == FoundTotal + FamilyTotal.",
                        "type": "integer"
                      },
                      "familyTotal": {
                        "description": "The postings matched in the family lane, under the same cap. FoundTotal and FamilyTotal partition every posting the monitor holds.",
                        "type": "integer"
                      },
                      "foundTotal": {
                        "description": "The postings matched in the exact and title lanes, under the monitor's per-user cap.",
                        "type": "integer"
                      },
                      "new": {
                        "description": "The triage state over ALL of those postings (found and family alike), so New + Applied + Skipped == FoundTotal + FamilyTotal.",
                        "type": "integer"
                      },
                      "skipped": {
                        "description": "The triage state over ALL of those postings (found and family alike), so New + Applied + Skipped == FoundTotal + FamilyTotal.",
                        "type": "integer"
                      }
                    },
                    "required": ["applied", "familyTotal", "foundTotal", "new", "skipped"],
                    "type": "object"
                  },
                  "createdAt": {
                    "description": "When the monitor was saved, in UTC.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "datePosted": {
                    "description": "How recently a kept posting was published.",
                    "type": "string"
                  },
                  "department": {
                    "description": "The department the monitor narrows to.",
                    "properties": {
                      "label": {
                        "description": "The department's name.",
                        "type": "string"
                      },
                      "slug": {
                        "description": "The department slug the department field takes.",
                        "type": "string"
                      }
                    },
                    "required": ["label", "slug"],
                    "type": "object"
                  },
                  "employmentType": {
                    "description": "The employment type the monitor keeps.",
                    "type": "string"
                  },
                  "excludeKeywords": {
                    "description": "Words that drop a posting whose title or text carries one.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "experienceLevel": {
                    "description": "The experience level the monitor keeps.",
                    "type": "string"
                  },
                  "id": {
                    "description": "The monitor id the other monitor tools take.",
                    "type": "integer"
                  },
                  "includeFamily": {
                    "description": "True when the role's wider family is watched too.",
                    "type": "boolean"
                  },
                  "includeNoSalary": {
                    "description": "True when postings without a salary are kept.",
                    "type": "boolean"
                  },
                  "keywords": {
                    "description": "Words a kept posting's text carries.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "locationTypes": {
                    "description": "Workplace types the monitor keeps.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "locations": {
                    "description": "The locations the monitor watches, as resolved.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "salaryCurrency": {
                    "description": "The currency code that labels the monitor.",
                    "type": "string"
                  },
                  "salaryMax": {
                    "description": "The highest yearly salary kept.",
                    "type": "number"
                  },
                  "salaryMin": {
                    "description": "The lowest yearly salary kept.",
                    "type": "number"
                  },
                  "titleText": {
                    "description": "The title the monitor watches: the resolved role's name, or the words given.",
                    "type": "string"
                  }
                },
                "required": ["companies", "counts", "excludeKeywords", "id", "includeFamily", "includeNoSalary", "keywords", "locationTypes", "locations"],
                "type": "object"
              },
              "resolvedRole": {
                "description": "The role the title words were read as; absent when no role matched.",
                "properties": {
                  "ambiguous": {
                    "description": "True when the title names several departments.",
                    "type": "boolean"
                  },
                  "candidates": {
                    "description": "The departments an ambiguous title could mean; present only when ambiguous.",
                    "items": {
                      "description": "One department an ambiguous title could mean.",
                      "properties": {
                        "department": {
                          "description": "The department slug of the role, for the department field.",
                          "type": "string"
                        },
                        "label": {
                          "description": "The role's name.",
                          "type": "string"
                        }
                      },
                      "required": ["label"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "department": {
                    "description": "The department the role belongs to.",
                    "properties": {
                      "label": {
                        "description": "The department's name.",
                        "type": "string"
                      },
                      "slug": {
                        "description": "The department slug the department field takes.",
                        "type": "string"
                      }
                    },
                    "required": ["label", "slug"],
                    "type": "object"
                  },
                  "display": {
                    "description": "The role's name, which the search ran on.",
                    "type": "string"
                  }
                },
                "required": ["ambiguous", "display"],
                "type": "object"
              },
              "titleNote": {
                "description": "Present when no role matched: the title words are matched against posting titles.",
                "type": "string"
              },
              "unrecognizedLocations": {
                "description": "The location names that matched no known location and were left out.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["monitor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update a job monitor"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["monitors.manage"],
                "type": "oauth2"
              }
            ]
          },
