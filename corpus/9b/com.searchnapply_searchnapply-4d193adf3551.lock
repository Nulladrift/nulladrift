        {
          "name": "job_postings_search_fields",
          "title": "Explain search fields",
          "description": "Purpose: Explain every search field and its values, and map job departments to their families and titles.\nWhen: Before you pick a field the user did not spell out, or when a search result is ambiguous.\nCost: About 710 tokens for the field list and about 2370 for the departments breakdown.",
          "inputSchema": {
            "examples": [
              {
                "field": "department",
                "value": "software-it"
              }
            ],
            "properties": {
              "field": {
                "description": "Which field to explain; leave it out for every field, or use department for the department map.",
                "enum": ["department", "employmentType", "experienceLevel", "locationTypes", "datePosted", "sortBy", "pagination"],
                "type": "string"
              },
              "value": {
                "description": "A department slug, only with field department, to read that department's every family and role.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "The search fields explained, or the department map.",
            "properties": {
              "department": {
                "description": "One department with every family and role; present for a department value.",
                "properties": {
                  "exampleTitles": {
                    "description": "Two typical job titles of the department.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "families": {
                    "description": "Every family in the department with its roles.",
                    "items": {
                      "properties": {
                        "label": {
                          "description": "The family's name.",
