          "description": "One place, one day: fish activity score (`bite`) and best windows, go/marginal/no verdict per discipline (shore, boat, rock, kayak, spearfishing) with reasons, tide, sun, moon and solunar periods, wind and sea summary, water-clarity estimate, and how fresh the forecast is. Use for \"is tomorrow good for…\", \"why is Saturday poor\", \"too rough today?\", \"water temperature now\" (include hourly). Peskio has no current or slack-water data: never infer them from tide times. Thermocline and temperature at 5–30 m are in subsurface: a model estimate for some Mediterranean places in Spain and France, null elsewhere; when null, say Peskio does not have them and never infer them. Visibility at depth is unknown. Include a clickable link to the returned place.url with its query string unchanged. State the returned planning disclaimer when giving GO/marginal/NO; never assess whether a crossing, dive or trip is safe.",
