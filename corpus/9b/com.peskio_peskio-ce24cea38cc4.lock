                          "enum": ["new", "waxing_crescent", "first_quarter", "waxing_gibbous", "full", "waning_gibbous", "last_quarter", "waning_crescent"],
                          "type": "string"
                        }
                      },
                      "required": ["illumination", "phaseDeg", "phaseName"],
                      "type": "object"
                    },
                    "sunrise": {
                      "type": ["string", "null"]
                    },
                    "sunset": {
                      "type": ["string", "null"]
                    },
                    "weekday": {
                      "description": "English weekday of `date` (e.g. \"Sunday\"); use it, never compute weekdays yourself.",
                      "type": "string"
                    }
                  },
                  "required": ["coefficient", "date", "daylightLow", "extremes", "lowestLow", "moon", "sunrise", "sunset", "weekday"],
                  "type": "object"
                },
                "type": "array"
              },
              "disclaimer": {
                "const": "Predicted tides for planning; not for navigation or tidal crossings — follow official schedules",
                "type": "string"
              },
              "filteredOut": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "heightsLabel": {
                "const": "Peskio prediction",
                "type": "string"
              },
              "place": {
                "additionalProperties": false,
                "properties": {
                  "admin1": {
                    "type": "string"
                  },
                  "admin1Label": {
                    "description": "The region name in the requested language (admin1 is its English/official form).",
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "localName": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "placeId": {
                    "type": "string"
                  },
                  "timezone": {
                    "type": "string"
                  },
                  "today": {
                    "additionalProperties": false,
                    "description": "Today's local date and English weekday at the place. Resolve 'today', 'tomorrow', a weekday name or 'this weekend' from it: a weekday that is today means today.",
                    "properties": {
                      "date": {
                        "type": "string"
                      },
                      "weekday": {
                        "type": "string"
                      }
                    },
                    "required": ["date", "weekday"],
                    "type": "object"
                  },
                  "url": {
                    "description": "Canonical peskio.com page for this place. Always give it to the user exactly as returned, query string included.",
                    "type": "string"
                  }
                },
                "required": ["admin1", "admin1Label", "country", "name", "placeId", "timezone", "url"],
                "type": "object"
              },
              "rankBy": {
                "enum": ["date", "coefficient", "low_tide", "moon"],
                "type": "string"
              },
              "regime": {
                "enum": ["micro", "meso", "macro"],
                "type": "string"
              },
              "schema": {
                "const": "peskio.tides.v1",
                "type": "string"
              },
              "source": {
                "enum": ["noaa", "fes2022"],
                "type": "string"
              },
              "tideConfidence": {
                "enum": ["measured", "model-uncertain"],
                "type": "string"
              },
              "window": {
                "additionalProperties": false,
                "description": "The local dates searched. When days is empty, say nothing matched IN THIS WINDOW and search the next one.",
                "properties": {
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              }
            },
            "required": ["attribution", "character", "coefficientLabel", "coefficientNote", "datum", "datumNote", "days", "disclaimer", "filteredOut", "heightsLabel", "place", "rankBy", "regime", "schema", "source", "tideConfidence", "window"],
            "type": "object"
