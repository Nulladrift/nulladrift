      },
      "instructions": "Peskio gives tide times, fishing conditions and water-clarity estimates for Europe, North Africa and US coasts. When the user names a place, call places_search first and pass the returned placeId to the other tools. All times are local to the place and carry their UTC offset. Include a clickable Markdown link for each recommended place using its returned url exactly, including the full query string. Returned place names can be ambiguous across regions. Peskio does not return exact coordinates for these ranked results, so an exact-location map is unavailable. For a specific date, tell the user to pick it in the page's day strip. Every figure is a Peskio estimate for planning. Never present it as official, and never use it for navigation or safety decisions (diving, sailing, tidal crossings): give the information and say so. Never ask the user for GPS coordinates or an address. For \"near me\" questions call spots_find_best without a placeId; if that fails, ask for a town or beach name. Temperature at depth and thermocline come only from conditions_get_day's subsurface field, a model estimate for some Mediterranean places; when it is null they are unavailable: say so, and never infer a depth value from surface temperature or seasonal averages. Visibility at depth is unknown. Peskio cannot assess whether sailing, diving or tidal crossings are safe. Do not recommend proceeding or offer a vessel/crew safety assessment. GO/marginal/NO are fishing conditions ratings for planning, not safety. Keep fish activity scores (`bite`) separate from discipline conditions scores. Do not use Peskio tools for inland weather, recipes or bookings. If a value is missing, say Peskio does not have it; never guess.",
      "tools": [
        {
          "name": "conditions_compare_days",
          "title": "Compare days at a place",
          "description": "Rank up to 7 consecutive days at one place by fish activity score (`bite`, the default), verdict (overall or for one discipline) or water clarity, with tide coefficient, lowest low, moon and a wind/wave headline per day. Use for \"best day to fish this weekend\", \"today or Thursday?\", \"clearest day this week\". Name the days with `dates` and let the server resolve them: \"this weekend\" -> dates: [\"weekend\"]; \"today or Thursday\" -> dates: [\"today\", \"thursday\"]; or use from + days for a run of days. Days with no weather forecast (beyond the ~14-day horizon, or not available) are marked astroOnly and rank last for verdict and clarity. Include a clickable link to place.url exactly as returned, including the query string. GO/marginal/NO are conditions ratings for planning, not safety; say so. The fish activity score estimates fish activity, not abundance, and is not a discipline conditions score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "audience": {
                "default": "angler",
                "description": "Who the answer is for.",
                "enum": ["angler"],
                "type": "string"
              },
              "dates": {
                "description": "Specific days to compare, resolved at the place: YYYY-MM-DD, 'today', 'tomorrow', an English weekday (the next one, today included) or 'weekend' (the coming Saturday and Sunday; from today if it is Saturday, just today if Sunday). Overrides from/days.",
                "items": {
                  "anyOf": [
                    {
                      "description": "Local date at the place: YYYY-MM-DD, or 'today', 'tomorrow' or an English weekday ('saturday' = the next one, today included). Prefer the words over computing dates yourself.",
                      "pattern": "^(\\d{4}-\\d{2}-\\d{2}|[tT]oday|[tT]omorrow|[mM]onday|[tT]uesday|[wW]ednesday|[tT]hursday|[fF]riday|[sS]aturday|[sS]unday)$",
                      "type": "string"
                    },
                    {
                      "enum": ["weekend", "Weekend"],
                      "type": "string"
                    }
                  ]
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array"
              },
              "days": {
                "default": 7,
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "discipline": {
                "description": "Fishing discipline: shore, boat, rock, kayak or spearfishing.",
                "enum": ["shore", "boat", "rock", "kayak", "spearfishing"],
                "type": "string"
              },
              "from": {
                "description": "First local date (YYYY-MM-DD or a day word); default today.",
                "pattern": "^(\\d{4}-\\d{2}-\\d{2}|[tT]oday|[tT]omorrow|[mM]onday|[tT]uesday|[wW]ednesday|[tT]hursday|[fF]riday|[sS]aturday|[sS]unday)$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "The user's language (ISO 639-1; one of Peskio's 15, otherwise 'en'). Picks the peskio.com page language and local place names; answer in the user's language yourself.",
                "enum": ["en", "es", "fr", "ca", "el", "it", "tr", "ar", "no", "sv", "da", "pt", "de", "nl", "hr"],
                "type": "string"
              },
              "placeId": {
                "description": "Peskio place id returned by places_search, e.g. \"es:es-3108877\". Never invent one.",
                "pattern": "^[a-z]{2}:[a-zA-Z0-9_.:-]{1,100}$",
                "type": "string"
              },
              "rankBy": {
                "default": "bite",
                "enum": ["bite", "verdict", "visibility"],
                "type": "string"
              }
            },
            "required": ["placeId"],
            "type": "object"
          },
