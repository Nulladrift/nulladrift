        {
          "name": "tides_get_table",
          "title": "Tide table",
          "description": "Tide times, heights and Peskio coefficient estimates for one place over up to two weeks, with sunrise, sunset, daylight low tides and moon phase. Use for tide times, spring/neap tides, grandes marées, pêche à pied, tidal islands and boat launching. Heights are in metres above the stated datum. Information only: for tidal crossings, tell the user to follow the official crossing schedule. Peskio has no tidal-current or slack-water data: never derive them from these times. Explicitly label coefficients as Peskio estimates in the user language (French: estimation Peskio). Include a clickable link to place.url exactly as returned, query string included.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Alias of `from` (the name the other Peskio tools use); `from` wins when both are given.",
                "pattern": "^(\\d{4}-\\d{2}-\\d{2}|[tT]oday|[tT]omorrow|[mM]onday|[tT]uesday|[wW]ednesday|[tT]hursday|[fF]riday|[sS]aturday|[sS]unday)$",
                "type": "string"
              },
              "daylightLowOnly": {
                "default": false,
                "description": "Keep only days with a low tide in daylight.",
                "type": "boolean"
              },
              "days": {
                "default": 7,
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "First local date: YYYY-MM-DD, 'today', 'tomorrow' or an English weekday (the next one, today included); default today at the place.",
                "pattern": "^(\\d{4}-\\d{2}-\\d{2}|[tT]oday|[tT]omorrow|[mM]onday|[tT]uesday|[wW]ednesday|[tT]hursday|[fF]riday|[sS]aturday|[sS]unday)$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "The user's language (ISO 639-1; one of Peskio's 15, otherwise 'en'). Picks the peskio.com page language and local place names; answer in the user's language yourself.",
                "enum": ["en", "es", "fr", "ca", "el", "it", "tr", "ar", "no", "sv", "da", "pt", "de", "nl", "hr"],
                "type": "string"
              },
              "minCoefficient": {
                "description": "Keep only days whose Peskio coefficient is at least this. Grandes marées: 95. Pêche à pied: 70.",
                "maximum": 120,
                "minimum": 20,
                "type": "integer"
              },
              "placeId": {
                "description": "Peskio place id returned by places_search, e.g. \"es:es-3108877\". Never invent one.",
                "pattern": "^[a-z]{2}:[a-zA-Z0-9_.:-]{1,100}$",
                "type": "string"
              },
              "rankBy": {
                "description": "coefficient = biggest first; low_tide = lowest low first; moon = closest to new/full moon first. Omit for date order.",
                "enum": ["coefficient", "low_tide", "moon"],
                "type": "string"
              }
            },
            "required": ["placeId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": "string"
              },
              "character": {
                "enum": ["semidiurnal", "diurnal"],
                "type": "string"
              },
              "coefficientLabel": {
                "const": "Peskio estimate",
                "type": "string"
              },
              "coefficientNote": {
                "type": "string"
              },
              "datum": {
                "enum": ["MLLW", "MSL", "LAT_APPROX"],
                "type": "string"
              },
              "datumNote": {
                "type": "string"
              },
              "days": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "coefficient": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The day's coefficient, computed from the day's first high and first low (the site's rule) -- not an average of the per-high coefficients in `extremes`, which can differ from it on the same day."
                    },
                    "date": {
                      "type": "string"
                    },
                    "daylightLow": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "heightM": {
                              "type": "number"
                            },
                            "time": {
                              "type": "string"
                            }
                          },
                          "required": ["heightM", "time"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "extremes": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "coefficient": {
                            "anyOf": [
                              {
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Peskio estimate for this high tide (paired with the preceding low); null on lows."
                          },
                          "heightM": {
                            "type": "number"
                          },
                          "time": {
                            "type": "string"
                          },
                          "type": {
                            "enum": ["high", "low"],
                            "type": "string"
                          }
                        },
                        "required": ["coefficient", "heightM", "time", "type"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "lowestLow": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "heightM": {
                              "type": "number"
                            },
                            "time": {
                              "type": "string"
                            }
                          },
                          "required": ["heightM", "time"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "moon": {
                      "additionalProperties": false,
                      "properties": {
