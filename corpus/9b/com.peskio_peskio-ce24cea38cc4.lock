                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "km": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "required": ["km", "name", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "place": {
                "additionalProperties": false,
                "properties": {
                  "admin1": {
                    "type": "string"
                  },
                  "admin1Label": {
                    "description": "The region name in the requested language (admin1 is its English/official form).",
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "kind": {
                    "type": ["string", "null"]
                  },
                  "localName": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "placeId": {
                    "type": "string"
                  },
