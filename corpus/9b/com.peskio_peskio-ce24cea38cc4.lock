        {
          "name": "places_get_profile",
          "title": "Place profile",
          "description": "What a place is: tide regime and range, coast exposure and which wind/swell directions it is sheltered from or exposed to, distance to the nearest river mouth, nearby places and landmarks. Use for \"is X sheltered from a north wind?\", \"big or small tides here?\" and \"near a river mouth?\". Does not cover species, depth or dive sites.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "The user's language (ISO 639-1; one of Peskio's 15, otherwise 'en'). Picks the peskio.com page language and local place names; answer in the user's language yourself.",
                "enum": ["en", "es", "fr", "ca", "el", "it", "tr", "ar", "no", "sv", "da", "pt", "de", "nl", "hr"],
                "type": "string"
              },
              "placeId": {
                "description": "Peskio place id returned by places_search, e.g. \"es:es-3108877\". Never invent one.",
                "pattern": "^[a-z]{2}:[a-zA-Z0-9_.:-]{1,100}$",
                "type": "string"
              }
            },
            "required": ["placeId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "around": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "km": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "placeId": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["km", "name", "placeId", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "attribution": {
                "type": "string"
              },
              "coast": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "exposedTo": {
                        "anyOf": [
                          {
                            "items": {
                              "enum": ["N", "NE", "E", "SE", "S", "SW", "W", "NW"],
                              "type": "string"
                            },
                            "type": "array"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Wind/swell directions (from) with open water: these reach the place. null = unknown: say so; never infer shelter or exposure."
                      },
                      "exposure": {
                        "enum": ["open", "semi", "sheltered", "enclosed"],
                        "type": "string"
                      },
                      "facing": {
                        "type": ["string", "null"]
                      },
                      "quality": {
                        "enum": ["good", "coarse", "island-small", "enclosed", "inland", "unknown"],
                        "type": "string"
                      },
                      "shelteredFrom": {
                        "anyOf": [
                          {
                            "items": {
                              "enum": ["N", "NE", "E", "SE", "S", "SW", "W", "NW"],
                              "type": "string"
                            },
                            "type": "array"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Directions (from) the place is sheltered from. null = unknown."
                      }
                    },
                    "required": ["exposedTo", "exposure", "facing", "quality", "shelteredFrom"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "disciplines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "discipline": {
                      "enum": ["shore", "boat", "rock", "kayak", "spearfishing"],
