        {
          "name": "places_search",
          "title": "Find a place",
          "description": "Resolve a town, beach, harbour or cove name to Peskio placeIds (Europe, North Africa and US coasts). Call this first whenever the user names a place, then pass the placeId to the other tools. candidates[0] is the best match: when `ambiguous` is false, use it without asking (a harbour or beach listed after a town of the same name is part of that place). Ask which one the user means only when `ambiguous` is true (the same name in different regions). Never ask the user for coordinates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code, lower case, to restrict to one country.",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "The user's language (ISO 639-1; one of Peskio's 15, otherwise 'en'). Picks the peskio.com page language and local place names; answer in the user's language yourself.",
                "enum": ["en", "es", "fr", "ca", "el", "it", "tr", "ar", "no", "sv", "da", "pt", "de", "nl", "hr"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The place name as the user wrote it, optionally with its region.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ambiguous": {
                "description": "true = ask the user which candidate they mean (same name in different regions, or no exact match).",
                "type": "boolean"
              },
              "attribution": {
                "type": "string"
              },
              "candidates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "admin1": {
                      "type": "string"
                    },
                    "admin1Label": {
                      "description": "The region name in the requested language (admin1 is its English/official form).",
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "localName": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "placeId": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["admin1", "admin1Label", "country", "kind", "name", "placeId", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "exact": {
                "description": "A candidate carries the searched name (in any of its languages) and it is candidates[0]. false = Peskio does not have that place; candidates are only similar names.",
                "type": "boolean"
              },
              "schema": {
                "const": "peskio.places.v1",
                "type": "string"
              }
            },
            "required": ["ambiguous", "attribution", "candidates", "exact", "schema"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
