        {
          "name": "find_matching_print_products",
          "title": "Find 4OVER4 products that go together",
          "description": "Finds 4OVER4 print products that pair with one product, such as letterhead and envelopes with business cards or stickers with packaging; use it when someone asks what goes with a print product. For products like it use find_similar_products; for a whole campaign use marketing_kit. Requires the product slug. Returns the recommended pairing products with slug, name and From price. Customer phrases: \"what goes with these business cards\", \"matching envelopes for my invitations\".",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product slug, from the slug field of a show_products, recommend or find_similar_products result, e.g. standard-business-cards.",
