        {
          "name": "delivery_by_zip",
          "title": "4OVER4 delivery date",
          "description": "Gives the in-hands date for one 4OVER4 print product, with an estimate for a US ZIP code when given one; use it when someone asks when their business cards, flyers, banners or other prints would arrive. For a price use configure_product; for shipping methods in general use search_knowledge. Requires the product slug; the ZIP code and quantity are optional. Returns production days, a shipping estimate and the in-hands date. Customer phrases: \"when would 500 flyers arrive in 10001\", \"how fast can I get banners\".",
