      "serverInfo": {
        "name": "4over4",
        "title": "4OVER4",
        "version": "2.0.0",
        "description": "4OVER4.COM, a US online print shop: find print products, price them live, get delivery dates and printing help, and read your own orders after you sign in. Ordering happens on www.4over4.com.",
        "websiteUrl": "https://www.4over4.com",
        "icons": [
          {
            "src": "https://www.4over4.com/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Use this server when someone wants custom printing from 4OVER4, a US online print shop: business cards, flyers, postcards, banners, stickers, labels, packaging, signs or invitations; a live print price; a delivery date; file setup, bleed or print term questions; or, after sign-in, their own 4OVER4 orders. Prices, delivery and orders are live from 4OVER4. Payment happens only on www.4over4.com. A customer's own orders need that customer's 4OVER4 sign-in. Cancelling gives a link and cancels nothing here. Product and price results carry 4OVER4's own configurator card, product photos and pages, and a priced result carries its 4OVER4 cart link, which works like the card's Checkout on 4OVER4. Artwork: the 4OVER4 cart takes the order before any file, and the customer uploads the print file on www.4over4.com at checkout, now or later (Upload Your Files Now Or Later); 4OVER4 receives no print file through a chat, so pricing and ordering need none. A file shared in this chat is not sent to 4OVER4 and does not change the product, size or quantity the customer picked.",
      "tools": [
        {
          "name": "calculate_print_bleed",
          "title": "4OVER4 print bleed calculator",
          "description": "Calculates the full file size with bleed and the safe area for a 4OVER4 print at a trim size; use it when someone asks how much bleed a print file needs. For what bleed means use search_knowledge; for a product's complete setup use get_print_file_setup. Requires trim width and height in inches; bleed defaults to 0.125 inches per side and DPI to 300. Returns the file size in inches and pixels and the safe area. Customer phrases: \"how much bleed for 3.5x2 cards\".",
          "inputSchema": {
            "properties": {
              "bleedIn": {
                "description": "Bleed per side in inches. Default 0.125.",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "dpi": {
                "description": "Resolution in dots per inch. Default 300.",
                "maximum": 2400,
                "minimum": 36,
                "type": "integer"
              },
              "heightIn": {
                "description": "Trim height in inches, e.g. 2.",
                "maximum": 2000,
                "minimum": 0.1,
                "type": "number"
              },
              "widthIn": {
                "description": "Trim width in inches, e.g. 3.5.",
                "maximum": 2000,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["heightIn", "widthIn"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "description": "The full file size with bleed and the safe-area inset."
              },
              "link": {
                "description": "The page on www.4over4.com to continue on: order, upload and checkout happen there.",
                "type": "string"
              },
              "summary": {
                "description": "The facts of the result in plain sentences.",
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
