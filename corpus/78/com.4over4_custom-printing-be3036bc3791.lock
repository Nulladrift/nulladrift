        {
          "name": "show_products",
          "title": "Find 4OVER4 print products",
          "description": "Finds 4OVER4 custom print products (business cards, flyers, postcards, banners, stickers, labels, packaging and more) by words, category, budget or goal; use it when someone asks what 4OVER4 has for a print need. For a price use configure_product; for a goal with no product use recommend. All inputs are optional. Returns products with slug, name, From price, rating, 4OVER4's own photo (image_url) and page (url); use those photos, not pictures from other sites. Customer phrases: \"soft touch business cards\", \"cheapest flyers\", \"signs for a real estate office\".",
          "inputSchema": {
            "properties": {
              "angle": {
                "description": "Industry, occasion, finish, material or shape paired with productType, e.g. wedding.",
                "maxLength": 120,
                "type": "string"
              },
              "category": {
                "description": "Category slug, e.g. business-cards, postcards, flyers.",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "description": "Most products to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "maxTotal": {
                "description": "Budget for the whole order in USD. An estimate that ignores volume discounts.",
                "minimum": 1,
                "type": "number"
              },
              "productType": {
                "description": "Product type paired with angle, e.g. postcards.",
                "maxLength": 80,
                "type": "string"
              },
              "qty": {
                "description": "Number of printed pieces, e.g. 500.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free words: an industry, occasion, finish, material, shape or product, e.g. \"die cut stickers\".",
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "description": "Result order: most reviewed, lowest From price, highest rated or newest.",
                "enum": ["popular", "cheapest", "top_rated", "newest"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "description": "A product grid: slug, name, From price, rating, review count, product link."
