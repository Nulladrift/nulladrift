        {
          "name": "create_checkout",
          "title": "Start a 4OVER4 checkout (UCP)",
          "description": "Starts a 4OVER4 checkout for print items, which the buyer finishes and pays on www.4over4.com; use it when the buyer is ready to order printing with UCP. UCP create_checkout (2026-04-08): a checkout session from line_items, or from a cart with cart_id. It is requires_escalation: 4OVER4 is paid only by the buyer: the continue_url adds the lines to the buyer's own 4OVER4 cart and opens www.4over4.com/checkout, where the buyer uploads artwork now or later, ships and pays.",
          "inputSchema": {
            "properties": {
              "checkout": {
                "properties": {
                  "attribution": {
                    "type": "object"
                  },
                  "buyer": {
                    "type": "object"
                  },
                  "cart_id": {
                    "type": "string"
                  },
                  "context": {
                    "type": "object"
                  },
                  "line_items": {
                    "description": "Full replacement. item.id is a catalog product id (its default configuration) or variant id (exactly that configuration, quantity tier included); quantity is how many such print jobs.",
                    "items": {
                      "properties": {
                        "item": {
                          "properties": {
                            "id": {
                              "type": "string"
                            }
                          },
                          "required": ["id"],
                          "type": "object"
                        },
                        "quantity": {
                          "maximum": 10,
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["item", "quantity"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "signals": {
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "meta": {
                "description": "Request metadata.",
                "properties": {
                  "idempotency-key": {
                    "description": "Retry key; required by complete_checkout and cancel_checkout.",
                    "type": "string"
                  },
                  "ucp-agent": {
                    "properties": {
                      "profile": {
                        "description": "URL of the platform's UCP profile.",
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "required": ["profile"],
                    "type": "object"
                  }
                },
                "required": ["ucp-agent"],
                "type": "object"
              }
            },
            "required": ["checkout", "meta"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "continue_url": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "expires_at": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "line_items": {
                "type": "array"
              },
              "links": {
                "type": "array"
              },
              "messages": {
                "type": "array"
              },
              "status": {
                "type": "string"
              },
              "totals": {
                "type": "array"
              },
              "ucp": {
                "type": "object"
              }
            },
            "required": ["ucp"],
            "type": "object"
          },
