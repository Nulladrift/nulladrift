        {
          "name": "configure_product",
          "title": "Price a 4OVER4 print product",
          "description": "Prices one 4OVER4 print product live (business cards, flyers, postcards, banners, stickers or any other) for a quantity, size, paper, finish and turnaround; use it when someone asks what a print job costs or which options it has. For a quantity ladder use price_breaks; for dates use delivery_by_zip. Requires the product slug. Returns the live total and per-piece price, sizes, quantity tiers, turnarounds, options, an order link and a cart link, shown as 4OVER4's own configurator card with its photo; show that card instead of building another form. Customer phrases: \"how much for 500 glossy business cards\", \"16pt postcards in 3 days\".",
          "inputSchema": {
            "properties": {
              "attributes": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Option choices: each key is an option group label and each value is a string from that group's choices in the options field of a result, e.g. {\"Ink Color\": \"4/4\", \"Paper Type\": \"16pt Gloss Cover\", \"Rounded Corners\": \"Yes\"}.",
                "type": "object"
              },
              "mailing": {
                "description": "true prices direct mail and Every Door Direct Mail options, postage included.",
                "type": "boolean"
              },
              "qty": {
                "description": "Number of printed pieces, e.g. 500.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "size": {
                "description": "Size in inches as width x height, e.g. 4x6 or 2x3.5; a round size is its diameter both ways plus circle, e.g. 2x2 circle.",
                "maxLength": 80,
                "type": "string"
              },
              "slug": {
                "description": "Product slug, from the slug field of a show_products, recommend or find_similar_products result, e.g. standard-business-cards. A category slug such as business-cards prices its main product.",
                "type": "string"
              },
              "turnaroundDays": {
                "description": "Turnaround in business days, e.g. 3.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "description": "The live price (total and per piece) for the chosen quantity, size, options and turnaround, plus sizes, quantity tiers, turnarounds and options."
              },
              "link": {
                "description": "The page on www.4over4.com to continue on: order, upload and checkout happen there.",
                "type": "string"
              },
              "summary": {
                "description": "The facts of the result in plain sentences.",
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
