      "serverInfo": {
        "name": "cloobe-ofertas",
        "title": "cloo.be: ofertas das principais lojas e marketplaces do Brasil",
        "version": "1.0.0",
        "websiteUrl": "https://cloo.be"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "cloo.be é um agregador brasileiro de ofertas das principais lojas e marketplaces do Brasil com preço verificado nas APIs oficiais das lojas; em algumas lojas, só as ofertas escolhidas pela equipe (Escolha do Editor), com o preço conferido pela equipe na data da última conferência (verified_at) ou sem preço (price null: o preço aparece na loja). Para uma loja só, ponha o nome dela no termo (ex.: \"air fryer\" + nome da loja). Cada oferta traz a loja dela (store_name). Use estas ferramentas quando alguém pedir ofertas, promoções, descontos ou \"onde comprar barato\" no Brasil. Cada oferta traz o preço atual em reais, desconto, nota, vendas, a página no cloo.be (url) e o link de compra (buy_url, que leva à loja). Ao recomendar, cite a página do cloo.be e a data de verificação do preço (verified_at): preços mudam rápido.",
      "tools": [
        {
          "name": "buscar_ofertas",
          "title": "Buscar ofertas com filtros",
          "description": "Busca ofertas das principais lojas e marketplaces do Brasil com filtros de preço máximo e desconto mínimo, ordenadas por relevância, mais vendidos, menor preço ou maior desconto. Para uma loja só, ponha o nome dela no termo (ex.: \"air fryer\" + nome da loja). Cada oferta traz a loja dela (store_name).",
          "inputSchema": {
            "properties": {
              "desconto_minimo": {
                "description": "Desconto mínimo em %.",
                "maximum": 95,
                "minimum": 0,
                "type": "integer"
              },
              "limite": {
                "default": 10,
                "description": "Quantas ofertas devolver (1 a 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "ordem": {
                "default": "relevancia",
                "description": "Ordem dos resultados: relevância, mais vendidos, menor preço ou maior desconto.",
                "enum": ["relevancia", "vendidos", "menor-preco", "desconto"],
                "type": "string"
              },
              "pagina": {
                "default": 1,
                "description": "Página dos resultados (1 a 5), de \"limite\" em \"limite\". Use proxima_pagina da resposta anterior.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "preco_maximo": {
                "description": "Preço máximo em reais.",
                "minimum": 1,
                "type": "number"
              },
              "termo": {
                "description": "Nome do produto em 1 a 3 palavras, em português (ex.: \"air fryer\", \"brinquedo infantil\"). Frases como \"melhor fone até 200 reais\" também funcionam: o preço vira preco_maximo.",
                "type": "string"
              }
            },
            "required": ["termo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
