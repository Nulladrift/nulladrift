        },
        {
          "name": "cupons_de_desconto",
          "title": "Cupons de desconto válidos",
          "description": "Cupons de desconto dos vendedores válidos agora (hoje os cupons só vêm do AliExpress, a única loja que os informa pela API), cada um com código, valor, compra mínima, validade e a oferta em que vale. Filtro opcional por produto ou categoria. Bom para \"tem cupom para X?\".",
          "inputSchema": {
