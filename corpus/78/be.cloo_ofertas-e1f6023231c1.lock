          "title": "Detalhes da oferta",
          "description": "Detalhes de uma oferta pelo id (ou pela URL da página no cloo.be): preço atual, preço anterior, desconto, nota, vendas, data da verificação e a página da oferta no cloo.be, onde a pessoa compra.",
