      "serverInfo": {
        "name": "cloobe-ofertas",
        "title": "cloo.be: ofertas das principais lojas e marketplaces do Brasil",
        "version": "1.0.0",
        "websiteUrl": "https://cloo.be"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "cloo.be é um agregador brasileiro de ofertas das principais lojas e marketplaces do Brasil com preço verificado nas APIs oficiais das lojas; em algumas lojas, só as ofertas escolhidas pela equipe (Escolha do Editor), com o preço conferido pela equipe na data da última conferência (verified_at) ou sem preço (price null: o preço aparece na loja). Use estas ferramentas quando alguém pedir ofertas, promoções, descontos ou \"onde comprar barato\" no Brasil. Cada oferta traz o preço atual em reais, desconto, nota, vendas e a página no cloo.be (url). A resposta não informa a loja: indique sempre a página do cloo.be, onde a pessoa vê a loja, o histórico de preço e compra. Para dizer se o preço caiu de verdade, use reason e price_history (preço habitual e quanto hoje está abaixo ou acima dele), medidos pelo histórico do cloo.be; discount é o desconto anunciado pela loja. Ao recomendar, cite a página do cloo.be e a data de verificação do preço (verified_at): preços mudam rápido.",
      "tools": [
        {
          "name": "buscar_ofertas",
          "title": "Buscar ofertas com filtros",
          "description": "Busca ofertas das principais lojas e marketplaces do Brasil com filtros de preço máximo e desconto mínimo, ordenadas por relevância, mais vendidos, menor preço ou maior desconto. Cada oferta traz um id e a página dela no cloo.be (url): é lá que a pessoa vê em que loja está, o histórico de preço e o botão de compra.",
          "inputSchema": {
            "properties": {
              "desconto_minimo": {
                "description": "Desconto mínimo em %.",
                "maximum": 95,
                "minimum": 0,
                "type": "integer"
              },
              "limite": {
                "default": 10,
                "description": "Quantas ofertas devolver (1 a 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "ordem": {
                "default": "relevancia",
                "description": "Ordem dos resultados: relevância, mais vendidos, menor preço ou maior desconto.",
                "enum": ["relevancia", "vendidos", "menor-preco", "desconto"],
                "type": "string"
              },
              "pagina": {
                "default": 1,
                "description": "Página dos resultados (1 a 5), de \"limite\" em \"limite\". Use proxima_pagina da resposta anterior.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "preco_maximo": {
                "description": "Preço máximo em reais.",
                "minimum": 1,
                "type": "number"
              },
              "termo": {
                "description": "Nome do produto em 1 a 3 palavras, em português (ex.: \"air fryer\", \"brinquedo infantil\"). Frases como \"melhor fone até 200 reais\" também funcionam: o preço vira preco_maximo.",
                "type": "string"
              }
            },
            "required": ["termo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9a7e39c1b8081b80f5b100c3e9caf394a80bc6c9bda82721ce02d569ded29663"
        },
        {
          "name": "cupons_de_desconto",
          "title": "Cupons de desconto válidos",
          "description": "Cupons de desconto dos vendedores válidos agora, cada um com código, valor, compra mínima, validade e a oferta em que vale (a página do cloo.be mostra a loja). Filtro opcional por produto ou categoria. Bom para \"tem cupom para X?\".",
          "inputSchema": {
            "properties": {
              "categoria": {
                "description": "Categoria (opcional).",
                "enum": ["casa-e-decoracao", "beleza", "moda-feminina", "moda-masculina", "eletrodomesticos", "esportes-e-lazer", "saude", "celulares-e-acessorios", "audio", "automotivo", "pets", "maes-e-bebes", "alimentos-e-bebidas", "computadores-e-acessorios", "calcados-masculinos", "calcados-femininos", "acessorios-de-moda", "cameras-e-drones", "moda-infantil", "papelaria", "livros-e-revistas", "bolsas-femininas", "bolsas-masculinas", "hobbies-e-colecoes", "relogios", "games-e-consoles", "viagem-e-malas"],
                "type": "string"
              },
              "limite": {
                "default": 10,
                "description": "Quantas ofertas devolver (1 a 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "termo": {
                "description": "Produto em 1 a 3 palavras (opcional). Sem termo, os melhores cupons do momento.",
                "type": "string"
              }
            },
            "type": "object"
          },
