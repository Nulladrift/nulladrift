  "lockfileVersion": 2,
  "subjects": {
    "al.host/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://host.al/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "host-al",
        "title": "Host.al — .al domains, VPS and servers in Albania",
        "version": "1.0.1",
        "websiteUrl": "https://host.al/en/developers/",
        "icons": [
          {
            "src": "https://host.al/wp-content/uploads/2024/04/cropped-Group-1171274800-192x192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Host.al is the largest .al domain registrar (AKEP and ICANN accredited) and runs its own datacenter in Tirana, Albania (AS213683). Use check_domain to see if a domain is free (live answer from the registrar system), get_domain_prices for prices and who may register each .al extension, list_products for VPS, dedicated servers, colocation, IP transit, hosting with EUR prices, and get_order_link to give the user a cart link at my.host.al. Ordering and payment happen in the user's browser; these tools never buy anything.",
      "tools": [
        {
          "name": "check_domain",
          "title": "Check domain availability",
          "description": "Live check whether domains are free to register, with prices (EUR) for 1-3 years and a cart link. Works for .al, .com.al, .net.al, .org.al, .edu.al and international extensions sold by Host.al (.com, .net, .org, .eu, .io ...). Up to 10 domains per call.",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "Domain names to check (1-10), each with its extension, e.g. [\"mybrand.al\", \"mybrand.com.al\", \"mybrand.com\"]. \"https://\" and \"www.\" are removed automatically.",
                "items": {
                  "description": "A full domain name with its extension, e.g. \"mybrand.al\"",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check domain availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7e777f3dd42b272e0c1df5dac05440c20c2f58d56e08d1b44d4976dc4c4f7be5"
        },
        {
          "name": "get_company_info",
          "title": "About Host.al",
          "description": "Facts about Host.al: accreditation (AKEP, ICANN), number of .al domains, datacenter in Tirana, network AS213683 and peering, locations, certifications, contact and support.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "About Host.al"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:14ef342c235a6df334ad7cd9c5b492fd8f7af0b65a207a47d488a0b66be6a095"
        },
        {
          "name": "get_domain_prices",
          "title": "Domain prices and rules",
          "description": "Registration and transfer prices (EUR) per extension, and who may register each .al extension (e.g. .al: anyone from any country; .com.al: Albanian companies or foreign brands via free local presence).",
          "inputSchema": {
            "properties": {
              "tld": {
                "description": "Optional, e.g. \".al\" or \"com.al\"; omit for all",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Domain prices and rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a85a75b7abd6990690e9bed97afed4e5e8b8c3897e37d1a1804ef9e6f4a2f1b8"
        },
        {
          "name": "get_order_link",
          "title": "Cart link for the user",
          "description": "A link that opens the Host.al cart (my.host.al) with a domain registration/transfer or a product already added. Give it to the user: they sign in and pay there.",
          "inputSchema": {
            "properties": {
              "action": {
                "default": "register",
                "description": "With \"domain\": \"register\" for a new domain (use when check_domain says available), \"transfer\" to move a domain the user already owns to Host.al.",
                "enum": ["register", "transfer"],
                "type": "string"
              },
              "domain": {
                "description": "Domain to register or transfer",
                "type": "string"
              },
              "product_id": {
                "description": "Product id (pid) from list_products",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Cart link for the user"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:254801bd8273a4245294bc92475c9d2a70fb192bb747041d85be5b8807b23d9f"
        },
        {
          "name": "list_products",
          "title": "Hosting and server products",
          "description": "Host.al products with EUR prices, billing cycle, specs, location and order link: VPS (Tirana, Skopje, Kansas City), dedicated servers (Tirana, Skopje, Thessaloniki, Nuremberg, Kansas City), colocation in Tirana, IP transit 1/10 Gbps, free BGP session for your ASN, IPv4 lease, web hosting, SSL, Exchange e-mail.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional product type: web-hosting, vps, dedicated-server, colocation, ip-transit, network (free BGP session for your ASN, IPv4 lease), ssl or email. Omit for all products.",
                "enum": ["web-hosting", "vps", "dedicated-server", "colocation", "ip-transit", "network", "ssl", "email"],
                "type": "string"
              },
              "location": {
                "description": "City or country, e.g. \"Tirana\", \"Albania\", \"Greece\"",
                "type": "string"
              },
              "max_price_eur": {
                "description": "Only plans at or below this price (per billing period)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Hosting and server products"
          },
