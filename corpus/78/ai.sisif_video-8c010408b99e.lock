{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sisif/video": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sisif.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "sisif",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Generate short videos from a text prompt. Generation is asynchronous: generate_video returns a video id immediately, then poll get_video_status until it is READY or ERROR.",
      "tools": [
        {
          "name": "generate_video",
          "title": "Generate a video",
          "description": "Generate a short video from a text prompt. Costs $1.00 per 5-second 540x960 clip, payable by card over the Machine Payments Protocol -- no account needed. Returns immediately with a video id; rendering takes 30-90 seconds, so poll get_video_status until it is READY or ERROR.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration": {
                "default": 5,
                "description": "Duration of the video in seconds (5-60)",
                "maximum": 60,
                "minimum": 5,
                "type": "integer"
              },
              "image": {
                "description": "Optional https URL or base64 photo. When set, the clip is that photo animated for one purchase: duration and resolution are locked to the clip offer.",
                "type": "string"
              },
              "negative_prompt": {
                "description": "Negative prompt to avoid certain content",
                "maxLength": 500,
                "type": "string"
              },
              "payment_credential": {
                "description": "Machine Payments Protocol credential answering the challenge from an earlier payment_required result. Omit it when calling with an API key that has credits.",
                "type": "string"
              },
              "prompt": {
                "description": "Text prompt describing the video you want to generate",
                "maxLength": 1000,
                "type": "string"
              },
              "resolution": {
                "default": "540x960",
                "description": "Quality tier key (540x960 or 720x1280). These are tier identifiers, not the output size. On the Wan backend 540x960 renders at 480x832 and is stored upscaled to 540x960, and 720x1280 produces 720x1280 portrait. Read output_width/output_height on the video for the actual dimensions. Omitting the field selects 540x960. The 180x320 and 360x640 tiers are retired: they produced the same 480x832 file as 540x960 and are no longer accepted.",
                "enum": ["540x960", "720x1280"],
                "type": "string"
              },
              "seed": {
                "description": "Random seed for reproducibility",
                "type": "integer"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:941e5a3e739b22bc6f0133aba1b68aa9ff8a1390df40c19af0bfb5f0f483c665"
        },
        {
          "name": "get_video_status",
          "title": "Check a video",
          "description": "Read the state of one video you started. Returns PENDING, PROCESSING, READY or ERROR, and the file URL once it is READY. Requires the API key that owns it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "video_id": {
                "description": "The id generate_video returned.",
                "type": "integer"
              }
            },
            "required": ["video_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a836391c7db6025ee27e4f58f7f27f048e227cd2de9c72916bac99926ddbe1fd"
        },
        {
          "name": "list_videos",
          "title": "List your videos",
          "description": "List the videos belonging to the calling API key, newest first. Requires an API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "How many videos to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "Keep only videos in this state.",
                "enum": ["PENDING", "QUEUED", "RETRYING", "PROCESSING", "READY", "ERROR", "REFUNDED"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eb900484295dbb83a4cc6f567b6c6841e58eed67cf3f1eaadc61d146c35985a2"
        }
      ],
      "digest": "sha256:29a00b1a69dfc59738017cf4d7628b8315b294b41df09741b23d301d5f4e27eb"
    }
  }
}
