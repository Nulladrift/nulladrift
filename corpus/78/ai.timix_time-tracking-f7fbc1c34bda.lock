        {
          "name": "bulk_create_time_reports",
          "title": "Create time entries in bulk",
          "description": "Create multiple time entries in one call. Supply an 'entries' array where each item has subtask_id, date (YYYY-MM-DD), and hours (> 0 and ≤ 24); optionally start_time (HH:mm; when omitted, the entry goes after your last entry that day and after the batch's other entries — 09:00 on a day with nothing logged) and text. Entries are always attributed to you. Returns per-item results (partial failures are reported rather than aborting the batch). Max 50 entries.",
          "inputSchema": {
            "properties": {
              "entries": {
                "description": "List of time entries to create (max 50).",
                "items": {
                  "properties": {
                    "date": {
                      "description": "Date of the work (YYYY-MM-DD).",
                      "type": "string"
                    },
                    "hours": {
                      "description": "Hours worked (> 0 and ≤ 24).",
                      "type": "number"
                    },
                    "start_time": {
                      "description": "Optional start time in 24-h HH:mm. When omitted, the entry goes after your last entry that day, after entries on cards still waiting for confirmation, and after this batch's other entries (09:00 on a day with nothing logged). To change a card that is still waiting for confirmation, propose its change in full (every entry it holds, each at the start_time it has there; a batch card with bulk_create_time_reports) and tell the user to cancel the old card.",
                      "type": "string"
                    },
                    "subtask_id": {
                      "description": "Id of the subtask to log time against.",
                      "type": "string"
                    },
                    "text": {
                      "description": "Optional description (max 1000 characters).",
                      "type": "string"
                    }
                  },
                  "required": ["date", "hours", "subtask_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "idempotency_key": {
                "description": "Optional caller-supplied key; retrying with the same key returns the original result instead of acting twice.",
                "type": "string"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create time entries in bulk"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:48cbd6ccdb0ea607771a747fb3adc67671ab116a7bb357bf310bcaed31516433"
        },
        {
          "name": "bulk_update_cost_rates",
          "title": "Bulk update cost rates",
          "description": "Apply an organization-wide adjustment to every member's hourly COST rate, effective from a date. Supply EITHER adjustment_percentage (e.g. 5 to raise all rates by 5%, -3 to cut 3%) OR fixed_amount (add this amount to every rate, e.g. 10 raises a 100 rate to 110), not both. The organization is fixed by your context - never pass an organization id. Rate values are never echoed back.",
          "inputSchema": {
            "properties": {
              "adjustment_percentage": {
                "description": "Percentage to adjust every rate by (e.g. 5 = +5%, -3 = -3%). Provide this OR fixed_amount, not both.",
                "type": "number"
              },
              "effective_from": {
                "description": "Date the adjusted rates take effect (YYYY-MM-DD) (required).",
                "type": "string"
              },
              "fixed_amount": {
                "description": "Amount to ADD to every member's current rate (e.g. 10 raises a 100 rate to 110), the same as the web page's Fixed Amount Increase. Provide this OR adjustment_percentage, not both.",
                "type": "number"
              },
              "idempotency_key": {
                "description": "Optional caller-supplied key; retrying with the same key returns the original result instead of acting twice.",
                "type": "string"
              }
            },
            "required": ["effective_from"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Bulk update cost rates"
