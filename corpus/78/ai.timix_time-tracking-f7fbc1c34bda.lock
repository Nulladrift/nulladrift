        {
          "name": "assign_user_to_project",
          "title": "Assign user to project",
          "description": "Assign a member to a project so they can see it and log time against its tasks. Identify the member by email (preferred) or by org_user_id, and the project by project_id (discover ids with find_billing_work - never ask the user for an id). The organization is fixed by your context.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Email of the member to assign (preferred). Provide this OR org_user_id.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional caller-supplied key; retrying with the same key returns the original result instead of acting twice.",
                "type": "string"
              },
              "org_user_id": {
                "description": "Organization-user id of the member to assign. Provide this OR email.",
                "type": "string"
              },
              "project_id": {
                "description": "Id of the project to assign the member to (required). Must be a project in your organization.",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Assign user to project"
          },
          "behavior": {
