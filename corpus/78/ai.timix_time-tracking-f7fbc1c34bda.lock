        {
          "name": "find_billing_work",
          "title": "Find billing work",
          "description": "Find the projects, tasks and subtasks in your organization where time can be tracked. Pass a name fragment as query to search customer, project, task and subtask names at once: every matching subtask comes back in `matches` with its full path (customer > project > task > subtask) and its subtask_id - then the subtasks of every customer of that name, and, when no subtask or task has that name, the subtasks of every project of that name. When two or more of the activities found have the same name (\"General\" under two clients), `choose_one` says where each one is: ask the user which one they mean, unless they already said. Use this to locate where to record work. Returns ids and names only.",
          "inputSchema": {
            "properties": {
              "max_results": {
                "description": "Optional maximum number of rows to return (1-50, default 50).",
                "type": "integer"
              },
              "project_id": {
                "description": "Optional project id to drill into. When supplied, returns that project's tasks and subtasks.",
                "type": "string"
              },
              "query": {
                "description": "Optional case-insensitive name fragment. It matches customer, project, task and subtask names: `projects` lists the projects whose own name or customer's name matches, and `matches` lists every subtask whose own name or task's name matches, with its full path and subtask_id, then every subtask of the customers whose name matches - and, when no subtask or task has that name, every subtask of the projects whose own name matches. With project_id, it filters that project's tasks and returns that project's matching subtasks in `matches`.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find billing work"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b6a7e7dbbb450e4b0c9a1ac15d159dacee4da8188490b671fb766cea3d4ba0e"
        },
