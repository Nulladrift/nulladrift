        {
          "name": "assign_user_to_customer",
          "title": "Assign user to customer",
          "description": "Assign an organization member to a billing customer so they can see that customer and all its projects. Requires the org_user_id (discover it with get_project_team or get_employee_timesheet) and the customer_id. The organization is fixed by your context — never pass an organization id. You cannot target a user more privileged than yourself (Owner is not targetable by Admin).",
          "inputSchema": {
            "properties": {
              "customer_id": {
                "description": "Id of the customer to assign the user to.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional caller-supplied key; retrying with the same key returns the original result instead of acting twice.",
                "type": "string"
              },
              "org_user_id": {
                "description": "Id of the OrganizationUser to assign (not the Firebase user id — use get_project_team to discover it).",
                "type": "string"
              }
            },
            "required": ["customer_id", "org_user_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Assign user to customer"
          },
          "behavior": {
