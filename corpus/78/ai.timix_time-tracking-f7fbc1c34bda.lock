      },
      "instructions": "Timix time-tracking and billing tools. The organization and acting user are fixed by your API key — never pass an organization id. Logged time entries are drafts; other writes take effect immediately. Every action is limited to the permissions of your role.",
      "tools": [
        {
          "name": "approve_timesheet",
          "title": "Approve timesheet",
          "description": "Approve a submitted timesheet period for a team member. The period and its time reports transition to Approved. Use confirm=true to proceed. Requires Manager or Admin/Owner role (Finance is excluded — timesheet approval is PM work, not finance).",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Set true to perform the action. Omit or false returns a preview only — nothing is written.",
                "type": "boolean"
              },
              "idempotency_key": {
                "description": "Optional caller-supplied key; retrying with the same key returns the original result instead of acting twice.",
                "type": "string"
              },
              "submission_period_id": {
                "description": "Id of the submission period to approve (from get_pending_approvals or list_approval_history).",
                "type": "string"
              }
            },
            "required": ["submission_period_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Approve timesheet"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ffd3460165d9b5e7ee0ed934714de76916a78906940439f5355f0446f30566fd"
