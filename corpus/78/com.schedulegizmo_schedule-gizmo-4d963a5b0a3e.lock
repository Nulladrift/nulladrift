          },
          "digest": "sha256:82de53a719e32232e2ab76c2a9055653d4e9b56036f3e66f042af4bc2a616252"
        },
        {
          "name": "make_schedule",
          "title": "Make a schedule page",
          "description": "Turn a schedule written as Schedule Gizmo text into a finished one-page schedule. Returns a view link (to look at, print and send) and an edit link (to change it in the maker), plus anything to fix. Use this whenever the user wants a staff rota, shift pattern, day timeline, agenda, festival lineup, what's-on poster, weekly planner, month calendar or year planner. Write the text first with get_format_guide if you are unsure of the format. If the result lists errors, fix the text and call again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "The schedule as Schedule Gizmo text: one line per person, shift, session or event, with optional settings lines such as title:, week:, date:, start:.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
