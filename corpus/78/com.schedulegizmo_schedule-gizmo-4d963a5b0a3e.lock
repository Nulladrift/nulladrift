        },
        {
          "name": "list_templates",
          "title": "List schedule templates",
          "description": "Ready-made schedule templates (shift patterns such as Pitman, DuPont and 24/48; staff rotas for restaurants, cafés, retail, dental offices, security and warehouses; year planners; wedding plans; event agendas), each with its Schedule Gizmo text to start from and a page that explains it. Optionally filter by a word such as 'pitman' or 'wedding'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "search": {
                "description": "Optional word to filter by, e.g. 'restaurant'.",
