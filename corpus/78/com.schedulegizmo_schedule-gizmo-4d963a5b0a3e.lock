      "instructions": "Schedule Gizmo turns plain text into clean one-page schedules (rotas, shift patterns, agendas, lineups, planners). Read get_format_guide, write the schedule as Schedule Gizmo text, then call make_schedule and give the user the View link.",
      "tools": [
        {
          "name": "get_format_guide",
          "title": "Get the schedule format guide",
          "description": "How to write Schedule Gizmo text for each schedule type (staff rota, day timeline, rotation, event agenda, what's-on poster, festival lineup, personal week, month calendar, year planner), with examples and optional settings. Read it before writing a schedule.",
