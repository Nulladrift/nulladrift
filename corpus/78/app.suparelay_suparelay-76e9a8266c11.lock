    "app.suparelay/suparelay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://suparelay.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Suparelay",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Suparelay is international calling from the browser: any phone number in the world, with no app and no SIM card, and the person called answers on their normal phone. These tools let the person make a call from this chat: they return the price per minute and a Call link that opens the Suparelay dialer with the number ready. When someone wants to call a number or a country, use them, show the price, then offer the Call link. The call itself runs in the browser on suparelay.app, so the tools spend no credit.",
      "tools": [
        {
          "name": "get_call_price",
          "title": "Get call price",
          "description": "Helps the person call a phone number anywhere in the world with Suparelay: returns the price per minute and a Call link that opens the Suparelay browser dialer with the number ready. Use it when the person wants to call a phone number or asks what a call to it costs. Pass the number in E.164 format with the country code, such as +33142868200. The person talks on the call in the browser; this tool does not dial.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "llm_model": {
                "description": "The model identifier you are running as, for example \"claude-opus-4-8\" or \"gpt-5.2\". Pass \"unknown\" if you are not certain. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "number": {
                "description": "The phone number in E.164 format, such as +33142868200",
                "format": "e164",
                "pattern": "^\\+[1-9]\\d{6,14}$",
                "type": "string"
              }
            },
            "required": ["context", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get call price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://suparelay/price-card-v1.html"
            },
            "ui/resourceUri": "ui://suparelay/price-card-v1.html"
          },
          "digest": "sha256:9d5cb958a9b798ccaffda08f596a7b6299a58d3b27a13ea72f148a18c91dd030"
        },
        {
          "name": "get_country_call_prices",
          "title": "Get country call prices",
          "description": "Helps the person call a country with Suparelay: returns the landline and mobile prices per minute and a Call link that opens the Suparelay browser dialer. Use it when the person wants to call a country or asks what calls to it cost, without a phone number. Pass the two-letter ISO country code, such as IN. The person talks on the call in the browser; this tool does not dial.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "A few words on why you are calling this tool, for the server developer's analytics. Describe people and things by role, such as \"a customer\". Do not quote the user or include names, emails, or other personal details.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "country": {
                "description": "The two-letter ISO 3166-1 country code, such as IN",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "llm_model": {
                "description": "The model identifier you are running as, for example \"claude-opus-4-8\" or \"gpt-5.2\". Pass \"unknown\" if you are not certain. Recorded for the server developer's analytics.",
                "type": "string"
              }
            },
            "required": ["context", "country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get country call prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://suparelay/price-card-v1.html"
            },
            "ui/resourceUri": "ui://suparelay/price-card-v1.html"
          },
          "digest": "sha256:36ff63e7ba68dd325a3000010cd0fd7a120019b6e59e0cc55935a322a6cbe0fd"
        }
      ],
      "resources": [
        {
          "uri": "ui://suparelay/price-card-v1.html",
          "name": "Suparelay price card",
          "description": "Shows a call price and a Call button",
          "mimeType": "text/html;profile=mcp-app",
          "digest": "sha256:ee95946cfe055b5d3686c2430bfdf19fad3781eaa8cf6427da7a6eda46c627d6"
        }
      ],
