{
  "lockfileVersion": 2,
  "subjects": {
    "ai.ironscout/ironscout": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.ironscout.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ironscout",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_market_snapshot",
          "title": "Get caliber market snapshot",
          "description": "Caliber-level price distribution (median, p25, p75, min, max) over a rolling window. Purely descriptive statistics with methodology and sample counts; never a forecast or recommendation. Accepts the canonical caliber name or a common alias (for example \"5.56\" or \".223\" for \".223/5.56\"); `list_calibers` gives the canonical names. Returns `error_v1` `NOT_FOUND` when no snapshot exists for the caliber/window. When `extremaSuppressedByPolicy` is `true`, `min`, `max` and both `segments.*.min` / `segments.*.max` are `null` BY POLICY rather than for lack of data: that caliber's published extremes are withheld pending revalidation. The median, quartiles, `p95`, segment medians and counts remain valid and complete — `p95` is a percentile over the whole window rather than a single observation, so it is not withheld. Do not infer or substitute a floor for those calibers, and do not treat `p95` as a stand-in for the withheld `max`. This is distinct from `dataStatus: \"INSUFFICIENT_DATA\"`, which means the sample was too thin to compute anything.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "caliber": {
                "description": "Canonical caliber or a common alias, e.g. \"9mm\", \"5.56\". See list_calibers.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "windowDays": {
                "anyOf": [
                  {
                    "const": 7,
                    "type": "number"
                  },
                  {
                    "const": 30,
                    "type": "number"
                  }
                ],
                "description": "Rolling window in days. 7 or 30; defaults to 30."
              }
            },
            "required": ["caliber"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d7f6d0d5d7d175af9dac494efcf705b3e537507a5fb54912b608c5112262613b"
        },
        {
          "name": "get_product",
          "title": "Get product detail",
          "description": "Fetch a single canonical product by its `canonicalProductId`, with current per-retailer offers. Descriptive only. Returns an `error_v1` body with `NOT_FOUND` if the id is unknown.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "canonicalProductId": {
                "description": "Canonical product id (CUID) from search results.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["canonicalProductId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3e020d6839ba70b3719cf4d353be5cce91ebc843294e26adb6c74251ef946643"
        },
        {
          "name": "list_calibers",
          "title": "List canonical calibers",
          "description": "Enumerate every canonical caliber IronScout recognizes, each flagged with whether a current market snapshot exists and its sample count. Calibers without a snapshot are still listed (with `hasSnapshot: false`).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2360b7344c3576699e2a939157b005e325e863e4c42f7c5cf0fb39f16d8cb6a3"
        },
        {
          "name": "list_retailers",
          "title": "List eligible retailers",
          "description": "List currently eligible/visible retailers. Ineligible retailers are omitted entirely (fail-closed, ADR-005). Descriptive directory only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cc1f19f1650b14a91c4078b43d7fc19721bea6eeb97974e3db2b5e9819d85acb"
        },
        {
          "name": "search_offers",
          "title": "Search ammunition offers",
          "description": "Search canonical ammunition products and their current per-retailer offers. Results are descriptive only — prices, availability, $/round, observation time, and provenance, with no verdicts, scores, or recommendations. Use each offer's `outUrl` for outbound links (do not rewrite it). `sort` is a mechanical ordering, never a judgement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "caliber": {
                "description": "Canonical caliber, e.g. \"9mm\" or \".223/5.56\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "case": {
                "description": "Case material, e.g. \"Brass\", \"Steel\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "grain": {
                "description": "Bullet weight in grains.",
                "exclusiveMinimum": 0,
                "maximum": 2000,
                "type": "integer"
              },
              "inStock": {
                "description": "When true, only products with in-stock offers are returned.",
                "type": "boolean"
              },
              "page": {
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "integer"
              },
              "pageSize": {
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "integer"
              },
              "q": {
                "description": "Free-text query over product name/brand/description.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "roundCountMax": {
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "integer"
              },
              "roundCountMin": {
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "integer"
              },
              "sort": {
                "description": "Mechanical ordering only. Defaults to pricePerRoundAsc.",
                "enum": ["pricePerRoundAsc", "pricePerRoundDesc", "observedAtDesc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4b1afb5c33ac863aee97f526035eb956a229068aaff86b656ebf2be97fe496a8"
        }
      ],
      "digest": "sha256:43363710753cd89a09c0a3acb7132e1113ba22701b82ccd7b6d1d771f914e815"
    }
  }
}
