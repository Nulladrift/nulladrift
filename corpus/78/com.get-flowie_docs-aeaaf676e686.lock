          "name": "docs_search",
          "description": "Search the Flowie Exchange API documentation and return the most relevant pages with their URLs and descriptions. Use this first when you need to find where something is documented.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "description": "Max results (default 8).",
                "type": "integer"
