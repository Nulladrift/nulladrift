      },
      "instructions": "Documentation for the Flowie Exchange API — one REST API for compliant electronic invoicing across 47 countries (Peppol, France PA/PPF, Italy SDI, Saudi Fatoora, India GST IRP, Malaysia MyInvois). Use search_docs to find the right page, read_page to read it as markdown, list_endpoints to see the API surface, and get_openapi for the machine-readable contract. To use Flowie itself, connect one of the product MCP servers (copy-ready setup: https://docs.get-flowie.com/mcp.md): the App server https://back.p2p-flowie.com/agent-hub/mcp for a person using the Flowie app through an assistant (sign in, no API key), or the API server https://back.p2p-flowie.com/exchange/mcp for e-invoicing integrations (sign in or an flw_live_ key). Both support OAuth discovery, dynamic client registration and PKCE. Staging hosts are on https://back.flowie.ink, where a sandbox key needs no signup: POST https://back.flowie.ink/exchange/v1/sandbox/bootstrap",
      "tools": [
        {
          "name": "docs_get_auth_guide",
          "description": "Return the authentication walkthrough for agents: how to get a sandbox key with no signup, how a user hands an agent scoped access, error handling and revocation.",
          "inputSchema": {
            "properties": {
              "section": {
                "description": "Optional section to return: discover, register, claim, use, errors, revocation.",
                "enum": ["discover", "register", "claim", "use", "errors", "revocation"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Authentication walkthrough"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b8dd3f2e7d7db93b16001223ce20a1633a30e311958f3432c43225f7db121227"
        },
        {
          "name": "docs_list_endpoints",
          "description": "List the API's operations (method, path, summary) from the OpenAPI contract, optionally filtered by a substring of the path or summary.",
          "inputSchema": {
            "properties": {
              "filter": {
                "description": "Optional substring filter, e.g. 'documents' or 'lifecycle'.",
                "type": "string"
              },
              "format": {
                "default": "list",
                "description": "'list' for method/path/summary lines (default), or 'openapi' for the raw OpenAPI definition.",
                "enum": ["list", "openapi"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Max operations (default 50).",
                "type": "integer"
              },
              "path": {
                "description": "With format=openapi, return just this path, e.g. /v1/documents/send.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List API endpoints"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
