        {
          "name": "sandbox_create_credential",
          "description": "Mint a working sandbox API key with no signup and no human in the loop. Returns an apiKey (flw_test_...), an organizationId, a seeded company with a Peppol id, and suggested next steps. Sandbox data is synthetic and never reaches a real network - never send real personal data to it. This key gives no access to any real account.",
          "inputSchema": {
            "properties": {
              "includeNextSteps": {
                "default": true,
                "description": "Include the suggested next-step instructions in the result. Default true. Set false when you already know the flow and only want the credential.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a sandbox credential"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e3dfb3666b2e663b79348c8df9c9140a50656cd057a399dab9468c367affa07"
        }
