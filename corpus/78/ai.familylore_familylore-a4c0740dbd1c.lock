      "tools": [
        {
          "name": "ask_letter",
          "title": "Ask the letter",
          "description": "Ask FamilyLore a question about one page in the person's account: what a phrase meant then, who someone was, what the letter says about something. The answer comes with the letter's lines it rests on, or says that the letter doesn't say. Use it with a page id from read_letter, my_letters or get_reading, once the page has been read. Questions the reading already answers (who is named, what the translation says) need no call.",
          "inputSchema": {
            "properties": {
              "page_id": {
                "description": "The page's id, from read_letter, my_letters or get_reading",
                "title": "Page Id",
                "type": "string"
              },
              "question": {
                "description": "The question about the letter, in the person's words",
                "maxLength": 500,
                "minLength": 1,
                "title": "Question",
                "type": "string"
              }
            },
            "required": ["page_id", "question"],
            "title": "ask_letterArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Allowance": {
                "properties": {
                  "left": {
                    "description": "Pages left to read",
                    "title": "Left",
                    "type": "integer"
                  },
                  "period": {
                    "description": "today: a free account, counted by the day",
                    "enum": ["today", "this_month"],
                    "title": "Period",
                    "type": "string"
                  },
                  "resets_on": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "The day the month's pages come back (Pacific), if known",
                    "title": "Resets On"
                  },
                  "text": {
                    "description": "The allowance as the Account page says it",
                    "title": "Text",
                    "type": "string"
                  },
                  "total": {
                    "description": "The pages the allowance holds",
                    "title": "Total",
                    "type": "integer"
                  }
                },
                "required": ["left", "period", "text", "total"],
                "title": "Allowance",
                "type": "object"
              },
              "Line": {
                "properties": {
                  "line_index": {
                    "description": "The line's place in the reading, from 0 (as the reading's word boxes count)",
                    "title": "Line Index",
                    "type": "integer"
                  },
                  "text": {
                    "description": "The line as the reading shows it",
                    "title": "Text",
                    "type": "string"
                  }
                },
                "required": ["line_index", "text"],
                "title": "Line",
                "type": "object"
              }
            },
            "properties": {
              "allowance": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/Allowance"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Pages left, as the Account page counts them"
              },
              "answer": {
                "description": "FamilyLore's answer, in the language the page is translated into",
                "title": "Answer",
                "type": "string"
              },
              "asked_on": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
