                },
                "required": ["download_url", "file_id"],
                "title": "OpenAIFile",
                "type": "object"
              }
            },
            "properties": {
              "language": {
                "anyOf": [
                  {
                    "enum": ["ru_uk", "de_kurrent", "yi", "en"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The letter's language, if the person says it or it is plain: ru_uk = Russian or Ukrainian, de_kurrent = German (Kurrent or Sütterlin), yi = Yiddish, en = English (old cursive). Leave it out and FamilyLore tells.",
                "title": "Language"
