      },
      "instructions": "Use this when a user asks whether they need a visa to travel to another country or when they ask about required travel documents. When the tools are available, it can also apply for an arrival card on the traveler's behalf: start with check_requirements, before asking the traveler anything else.",
      "tools": [
        {
          "name": "visa_availability",
          "title": "Visa Availability Tool",
          "description": "Provides visa availability for a given country, destination, and currency",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "The currency of the user; ISO 4217 code",
                "type": "string"
              },
              "destination": {
                "description": "The destination country; ISO 3166-1 alpha-2 code",
                "type": "string"
              },
              "nationality": {
                "description": "The nationality of the user; ISO 3166-1 alpha-2 code",
                "type": "string"
              }
            },
            "required": ["currency", "destination", "nationality"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Visa Availability Tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/locale": "en-US",
            "openai/outputTemplate": "ui://ivisa/visa-availability.html",
            "openai/toolInvocation/invoked": "Found visa availability information",
            "openai/toolInvocation/invoking": "Checking visa availability...",
            "openai/widgetDescription": "Renders a widget that displays visa availability for a given nationality, destination, and currency",
            "ui": {
              "resourceUri": "ui://ivisa/visa-availability.html"
            }
          },
