{
  "lockfileVersion": 2,
  "subjects": {
    "com.simplorg/simplorg": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.simplorg.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "simplorg",
        "title": "SimplOrg: Easy Org Chart",
        "version": "0.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SimplOrg creates org charts that open in the SimplOrg web editor at simplorg.com.\ncreate_org_chart builds a chart from a list of people and returns a link to it. Each person has a unique id; reports_to holds the id of their manager and is omitted for top-level people.\nread_org_chart returns the people and reporting lines of an existing SimplOrg chart link, so the chart can be changed and created again with create_org_chart.",
      "tools": [
        {
          "name": "create_org_chart",
          "title": "Create org chart",
          "description": "Create an org chart from a list of people and get a link that opens it in the SimplOrg editor. Up to 500 people. The link stays valid for 30 days; after opening it the user can save or share the chart from SimplOrg.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "people": {
                "description": "Everyone on the chart, in any order.",
                "items": {
                  "properties": {
                    "also_reports_to": {
                      "description": "ids of additional (dotted-line / matrix) managers, drawn as dashed lines.",
                      "items": {
                        "maxLength": 64,
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "department": {
                      "description": "Department or team, shown as a colored tag.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "id": {
                      "description": "Short unique id for this person, e.g. \"ceo\" or \"p12\". Used only for reports_to references.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "name": {
                      "description": "Full name (or role name if the person is unknown, e.g. \"Open position\").",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "reports_to": {
                      "description": "id of this person's direct manager. Omit for top-level people.",
                      "maxLength": 64,
                      "type": "string"
                    },
                    "title": {
                      "description": "Job title, e.g. \"Head of Sales\".",
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "required": ["id", "name"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["people"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:dc4cb48335c106fbb837653225144e5a0de98a099c22dd532aac0a3553521169"
        },
        {
          "name": "read_org_chart",
          "title": "Read org chart",
          "description": "Read the people and reporting lines from a SimplOrg chart link (an AI-created link or a share link). Use it to update an existing chart: edit the returned list and pass it to create_org_chart.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "link": {
                "description": "A simplorg.com link to the chart.",
                "maxLength": 200000,
                "type": "string"
              }
            },
            "required": ["link"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62fc7dbdd59626879c62409653b4457152e2365c526c528299ec708dd6dbc981"
        }
      ],
      "digest": "sha256:fe7134ba630823f65fc16458d480010b6d0053f29dcce9fee35b686fa0700454"
    }
  }
}
