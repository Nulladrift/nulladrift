      "serverInfo": {
        "name": "aiseparations",
        "title": "AI Separations",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AI Separations turns artwork into press-ready screen-print color separations: spot inks, per-ink film positives, halftones, white underbase. Start with estimate_screens (free, no key) to see what an image breaks into. separate_image runs the full engine: with no key it returns a small preview; pass free_email for one full separation per email (plates delivered by email); pass api_key for metered use (1 credit per separation — keys at https://www.aiseparations.com/separation-api/). To buy credits on a user's behalf call buy_credits with their email and a pack; it returns a Stripe Checkout link for the user to pay, after which the key is emailed to them and separate_image works with it.",
      "tools": [
        {
          "name": "buy_credits",
          "title": "Buy a credit pack (hosted checkout)",
          "description": "Start a purchase of an AI Separations credit pack for the user and return a Stripe Checkout link. Packs: credits_sample ($29, 10 separations), credits_shop ($99, 50). Credits never expire; 1 credit = 1 full separation via separate_image. Requires the user's email: the API key is emailed there after payment. Nothing is charged by this tool — the user pays on the returned link.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The buyer's email — receipt and API key go here",
                "type": "string"
              },
              "pack": {
                "description": "Which credit pack (default credits_sample)",
                "enum": ["credits_sample", "credits_shop"],
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cc61eeec7c86facdf2f972e4224ce957d5e7c9372d19d03aace6f67812baf01a"
        },
        {
          "name": "check_credits",
          "title": "Check credit balance",
          "description": "Check the remaining separation credits on an AI Separations API key. Free.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "The API key to check",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bbb1cc1682e22191ebb5e9e041faa4ca5e0776b718933d5645d219aeebaa4d5c"
        },
        {
          "name": "estimate_screens",
          "title": "Estimate screens (free)",
          "description": "FREE, no key needed. Analyze artwork for screen printing: how many spot-color screens it needs, the detected ink colors (with named ink matches), whether it's flat/vector or photographic, and whether screen printing or DTF is the better process. Use this first on any logo or design.",
          "inputSchema": {
            "properties": {
              "garment": {
                "description": "Shirt the art prints on: \"dark\" (black, default), \"light\" (white), a color name (Navy, Royal, Red, Maroon, Forest, Gold, Heather Grey, Charcoal, ...) or a hex like \"#1f2a44\". The separation is solved against that exact shirt color.",
                "type": "string"
              },
              "image_b64": {
                "description": "Base64 (or data URL) of the artwork — alternative to image_url",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of the artwork (PNG/JPG, max 12 MB)",
                "type": "string"
              },
              "underbase": {
                "description": "Print a white underbase (default: on for shirts darker than mid-grey)",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:63e7c4380f174020f4e8b7c7abc58db878de9062516327ba4c8025c52358d650"
        },
        {
          "name": "get_pricing",
          "title": "Pricing & plans",
          "description": "AI Separations pricing: free first separation, API credit packs, monthly plans, and the $179 one-time desktop app — with direct purchase links.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
