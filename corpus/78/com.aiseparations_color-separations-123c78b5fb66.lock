          "digest": "sha256:a66780af1e90f1f37d767d81609cb1e021c81036c873d7a717d29e4993835d63"
        },
        {
          "name": "separate_image",
          "title": "Run a full color separation",
          "description": "Run the real separation engine on artwork: detected spot inks, one grayscale film-positive plate per ink (halftoned, dot-gain compensated, white underbase on dark garments) plus a composite print preview. With no key: free small preview. With free_email: ONE full separation per email address, plates delivered by email, no watermark. With api_key: metered (1 credit), plates emailed to deliver_email.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "AI Separations API key (metered, 1 credit)",
                "type": "string"
              },
              "colors": {
                "description": "Force this many inks (omit = auto-detect)",
                "maximum": 12,
                "minimum": 2,
                "type": "integer"
              },
              "deliver_email": {
                "description": "Where to email the full-resolution plates zip (defaults to free_email)",
                "type": "string"
              },
              "free_email": {
                "description": "Email for the one-per-email FREE full separation — plates are sent there",
                "type": "string"
              },
              "garment": {
                "description": "Shirt the art prints on: \"dark\" (black, default), \"light\" (white), a color name (Navy, Royal, Red, Maroon, Forest, Gold, Heather Grey, Charcoal, ...) or a hex like \"#1f2a44\". The separation is solved against that exact shirt color.",
                "type": "string"
              },
              "image_b64": {
                "description": "Base64 (or data URL) of the artwork — alternative to image_url",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of the artwork (PNG/JPG, max 12 MB)",
                "type": "string"
              },
              "mode": {
                "description": "index = one ink per square pixel, no halftone; gray = one screen (black ink on light shirts, white on dark); sim = simulated process (default), spot = solid spot colors for flat logos, cmyk = 4-color process, dtf = DTG/DTF print file prep",
                "enum": ["sim", "spot", "index", "cmyk", "gray", "dtf"],
                "type": "string"
              },
              "palette": {
                "description": "Exact ink hex codes to separate to (optional)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "underbase": {
                "description": "Print a white underbase (default: on for shirts darker than mid-grey)",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
