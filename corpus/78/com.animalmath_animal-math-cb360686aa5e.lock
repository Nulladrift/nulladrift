      "serverInfo": {
        "name": "animal-math",
        "title": "Animal Math",
        "version": "1.0.0",
        "websiteUrl": "https://animalmath.com/use-with-chatgpt-claude/",
        "icons": [
          {
            "src": "https://animalmath.com/images/icons/favicon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://animalmath.com/images/icons/favicon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Animal Math (animalmath.com) has free printable math worksheets, worksheet makers, quizzes, teaching tools and full-year curricula for Pre-K to 5th grade, for teachers and parents. Everything is free and needs no account. Use search_resources to find things (by topic words, grade, kind or a standard code); get_maker_settings and build_maker_link for a worksheet maker set up a certain way; get_curriculum and get_lesson for curriculum units and lessons; and make_set_link to give one short link to several things at once (a lesson, a week of practice). Give only links these tools return, and prefer the short set link when there is more than one thing.",
      "tools": [
        {
          "name": "build_maker_link",
          "title": "Link to a worksheet maker",
          "description": "A checked link that opens an Animal Math worksheet maker set up with the given settings, the settings in words, and anything it could not use. Also gives the maker's set item, to put it in a set with make_set_link.",
          "inputSchema": {
            "properties": {
              "maker": {
                "description": "The maker's slug: telling-time.",
                "type": "string"
              },
              "settings": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Setting id to value, from get_maker_settings; a value by its id or its words: {\"mode\": \"drawHands\", \"minuteIncrement\": \"15\", \"answerKey\": 1}. headerText sets the worksheet's title.",
                "type": "object"
              }
            },
            "required": ["maker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Link to a worksheet maker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc32e78a4e22e578b5d2028cae20dd559738aa0d8ec54ba657e366317772e92f"
        },
        {
          "name": "get_curriculum",
          "title": "Curriculum units and lessons",
          "description": "Animal Math's free full-year math curricula, kindergarten to 5th grade. Without a grade: the list. With a grade: its units and lessons by number (every lesson has a lesson plan, an exit ticket and practice). With a unit too: that unit's lessons in detail and its pre-check, review and test.",
          "inputSchema": {
            "properties": {
              "grade": {
                "description": "A grade: pk, k, 1, 2, 3, 4 or 5 (\"kindergarten\" and \"3rd grade\" work too).",
                "type": "string"
              },
              "unit": {
                "description": "A unit's number.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Curriculum units and lessons"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:957e6b2833d6bd0d837291518f6dfbe51f98cea14b88f3da9953e65a864a2b8a"
        },
        {
          "name": "get_lesson",
          "title": "One curriculum lesson",
          "description": "What one curriculum lesson uses: its goal, its lesson plan page, and the worksheets, maker settings, tool, quiz and exit ticket its plan names, each with its link. To give a teacher the whole lesson in one link, pass its set item to make_set_link.",
          "inputSchema": {
            "properties": {
              "grade": {
                "description": "A grade: pk, k, 1, 2, 3, 4 or 5 (\"kindergarten\" and \"3rd grade\" work too).",
                "type": "string"
              },
              "lesson": {
                "description": "The lesson's number as get_curriculum lists it: 4.3.",
                "type": "string"
              }
            },
            "required": ["grade", "lesson"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One curriculum lesson"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c69fc9dedf69f2885b09d72dd33119d4727b2066b97ea882cc058a3c2b63098c"
        },
        {
          "name": "get_maker_settings",
          "title": "Worksheet maker settings",
          "description": "Every setting of one Animal Math worksheet maker, with its values and default, for build_maker_link. A maker draws new worksheets every time (find makers with search_resources, kind maker).",
          "inputSchema": {
            "properties": {
              "maker": {
                "description": "The maker's slug, as search_resources gives it (generators/<slug>): telling-time.",
                "type": "string"
              }
            },
            "required": ["maker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Worksheet maker settings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4016dad22951c2688aad5c77d59e652ac29bfd2c0e72c60e571a8f6549e1b611"
        },
        {
          "name": "make_set_link",
          "title": "Make a set link",
          "description": "One short link (animalmath.com/s/<code>) to a set of Animal Math resources: printables (or some of their pages), makers set up, quizzes at a level, tools and whole curriculum lessons, split into days if wanted. The set page shows them all and makes one PDF of the printables. Checked here: items not found come back with a suggestion, and the short link is made once every item is found. Give the teacher the short link.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "In place of items: each day's items, for a plan of several days (Day 1, Day 2, ...).",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "maxItems": 10,
                "type": "array"
              },
              "items": {
                "description": "Set items, as the other tools give them: printables/<slug>, printables/<slug>/pages=2;5, generators/<slug>/<id>=<value>/..., quizzes/<slug>/level=<id>, tools/<slug>, curriculum/<grade>/<lesson> (curriculum/3rd-grade/4.2).",
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "note": {
                "description": "A line under the title, for the teacher.",
                "maxLength": 300,
                "type": "string"
              },
              "title": {
                "description": "The set's title: \"Week 3: Telling Time\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make a set link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e6f1b25c4b9b761ad6f6d06a97dd337d61723fc4911aa717b753bf2132dc4854"
        },
        {
          "name": "search_resources",
          "title": "Find Animal Math resources",
          "description": "Search Animal Math's free printables (worksheet packs, unit tests, exit tickets, lesson plans), worksheet makers, quizzes and teaching tools for Pre-K to 5th grade by topic words, grade, kind or a standard code. Each result has its page link and its set item for make_set_link; quizzes list their levels. Use it before giving any Animal Math link.",
          "inputSchema": {
            "properties": {
              "grade": {
                "description": "A grade: pk, k, 1, 2, 3, 4 or 5 (\"kindergarten\" and \"3rd grade\" work too).",
                "type": "string"
              },
              "kind": {
                "description": "Only this kind. A printable is a ready-made PDF pack; a maker (worksheet generator) draws new sheets with chosen settings.",
                "enum": ["printable", "maker", "quiz", "tool"],
                "type": "string"
              },
              "limit": {
                "description": "How many results (12 unless given).",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Topic words as a teacher says them: \"subtraction with regrouping\", \"telling time to the half hour\", \"fractions on a number line\".",
                "type": "string"
              },
              "standard": {
                "description": "A standard's code: 1.OA.C.6 (Common Core), 3.4A (Texas TEKS), MA.2.NSO.2.1 (Florida B.E.S.T.), AC9M2N06 (Australian Curriculum), Y2.M.9 (England, our numbering of its National Curriculum), NZ.Y2.N.3 (New Zealand, our numbering of its curriculum), 3.B1.2 (Ontario); Virginia, Georgia, Indiana, Oklahoma, South Carolina and codes of the other Canadian provinces too.",
                "type": "string"
              },
              "standard_set": {
                "description": "The set a code is from, when it could be more than one: common core, texas, florida, virginia, georgia, indiana, oklahoma, south carolina, australia, england, new zealand, or a Canadian province (ontario, british columbia, alberta, ...).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Animal Math resources"
          },
          "behavior": {
            "destructive": false,
