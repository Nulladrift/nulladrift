{
  "lockfileVersion": 2,
  "subjects": {
    "com.helloai/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://helloai.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "helloai",
        "version": "2.14.85"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Hello, AI is a curated directory of six frontier AI models with LMArena text-overall Elo, list prices and context windows. Use recommend_models to rank models for a task (coding, reasoning, overall, daily use) with optional cost, context and provider filters. score is an ordering aid, not a quality measure: compare scores only between calls that share the same meta.scoring version, snapshot and matched_category. Models listed under unrated have no usable Elo of their own and are never ranked. Data is updated weekly; get_status reports freshness.",
      "tools": [
        {
          "name": "get_model",
          "title": "Get one model",
          "description": "One tracked model's full record by id (claude, fable, muse, gemini, qwen, grok) or exact name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Model id or exact name",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83af4c1028627a05789e75f2a36ac7be191aa51a9174a030ad0bea24f40e661b"
        },
        {
          "name": "get_status",
          "title": "Data freshness and version",
          "description": "Data freshness, app version, model and article counts, the scoring version and snapshot fingerprint, and the rate limit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8dd947d54b7f6c77c1bdd0631e452678b945c6b411bca34fdd992fbdcefab44"
        },
        {
          "name": "list_articles",
          "title": "List recent articles",
          "description": "Recent Hello, AI articles, newest first: title, date, category, excerpt and URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Articles to return, 1 to 50. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abc940c973abf1eaaceb60c6666712b80498b58695a57b6669f23c84f4c35f8d"
        },
        {
          "name": "list_categories",
          "title": "List use-case categories",
          "description": "The curated use-case categories with their curator-chosen leader and a one-paragraph insight. The leader is a hand-set label, not derived from Elo.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dcf9eb58c4241ee653a3fef914c820b08fb40591abae75d213319d19f5b84c5f"
        },
        {
          "name": "list_models",
          "title": "List tracked models",
          "description": "All tracked models with full records: Elo and its provenance (elo_source), prices per million tokens, context window, strengths, description. rated is false when the stored Elo is a predecessor's, missing or stale.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "Provider name, case-insensitive substring match.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83e01109d521f1dc7a61dfcb8738f4ec5943bc0e170bf514c426875c1de5d04b"
        },
        {
          "name": "recommend_models",
          "title": "Recommend models for a task",
          "description": "Rank Hello, AI's tracked frontier models for a task. Same scoring as GET /api/recommend: task match 40%, Elo 35%, input cost 15%, context 10% (Elo 55%, cost 25%, context 20% when no task matches). Only rated models rank; unrated ones are listed separately. score is an ordering aid, not a quality measure.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 3,
                "description": "How many ranked rows to return, 1 to 10. Default 3.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_cost": {
                "description": "Maximum USD per 1 million input tokens; models above it are excluded.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_context": {
                "description": "Minimum context window in tokens; models below it are excluded.",
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "description": "Provider name, case-insensitive exact match (for example Anthropic, Google, xAI).",
                "type": "string"
              },
              "task": {
                "description": "Use case, matched against the category names: Overall Preference, Coding & Engineering, Hard Reasoning & Science, Honest Daily Use. Examples: coding, reasoning, overall, daily.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:107fee9e976e06b213ecf199a85507dc34e07ec3648d03c091c0d0f150270db1"
        }
      ],
      "digest": "sha256:6885b808233315ea06e6bab5690e4cd4d4c34879e22178ad8222cab37602ed14"
    }
  }
}
