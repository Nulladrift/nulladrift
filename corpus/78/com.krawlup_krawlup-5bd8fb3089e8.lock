        {
          "name": "compare_products",
          "description": "All your products side by side — lifetime or windowed (today / 7d / 30d / 90d) unique visitors, views, revenue totals with refunds netted, average revenue per conversion, revenue per visitor, and scan scores, sorted by any of them. Windowed numbers are computed exactly the way the dashboard computes them (same events, same windows), so they match the product page; lifetime visitors are the leaderboard's HLL estimate (~1.6%) and lifetime revenue comes from the payments ledger. Products and scores are always included; visitor columns and windowed revenue need the website_analytics subscription facility, revenue columns need analytics_conversion — gated columns come back null with a note instead of failing the call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Max products returned. Default 50.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "order": {
                "description": "Sort direction. Default: desc (biggest / newest first).",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "range": {
                "description": "Metric window. lifetime = all-time totals; the others are ROLLING windows over the last N UTC days ending today (each includes today so far) — like the dashboard, they are not calendar-day buckets.",
                "enum": ["lifetime", "today", "7d", "30d", "90d"],
                "type": "string"
              },
              "sortBy": {
                "description": "Column to sort by. Products missing the chosen metric sort last. Default: visitors.",
                "enum": ["visitors", "views", "revenue", "conversions", "avgRevenue", "score", "performance", "recent"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
