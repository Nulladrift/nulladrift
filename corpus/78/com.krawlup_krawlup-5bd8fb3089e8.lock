      "tools": [
        {
          "name": "add_product",
          "description": "Add a product from just its URL: krawlup scrapes the site (name, tagline, description, icons) and adds it to the founder's dashboard. Every other field is optional — explicit values override the scrape. Adding NEVER publishes — the product is private until the founder (or set_product_public) publishes it. Requires the submit permission.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "categories": {
                "description": "Up to three category ids (or slugs/names) from check_launch_readiness. Optional — the founder can tag the product later.",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "description": {
                "description": "Short description (max 600 characters). Omit to use the scraped description.",
                "maxLength": 600,
                "type": "string"
              },
              "name": {
                "description": "Product name (max 40 characters). Omit to use the scraped site title.",
                "maxLength": 40,
                "type": "string"
              },
              "tagline": {
                "description": "One-line tagline (max 120 characters). Omit to use the scraped site description.",
                "maxLength": 120,
                "type": "string"
              },
              "twitterUsername": {
                "description": "The product's X/Twitter handle (bare handle or profile URL)",
                "type": "string"
              },
              "url": {
                "description": "The product website URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
