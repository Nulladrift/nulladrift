        {
          "name": "search_all",
          "description": "Search every Agentorist vertical at once — the answer to \"what's on?\".\n\nUse this when the user's request spans verticals or doesn't clearly name\none (\"what's on tonight\", \"anything to do in Boston?\", \"Friday night\nplans\"). For specific single-vertical queries (\"movies tonight\",\n\"Italian restaurants\"), `search_all` auto-narrows to the hinted vertical\nso you don't waste calls.\n\nReturns `results_by_vertical` keyed by movies/events/local, plus\n`total_count` and `bookable_total` for quick summaries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_client": {
                "default": "",
                "description": "Optional — name of the calling agent.",
                "type": "string"
              },
              "locale": {
                "default": "",
                "description": "Optional BCP-47 locale ('en-US', 'fr-FR', 'de-DE', etc.).\nForwarded to verticals that localise their response (experiences).",
                "type": "string"
              },
              "location": {
                "description": "City, postcode, or \"lat,lng\".",
                "type": "string"
              },
              "query": {
                "description": "Natural-language query. Empty string is fine (= browse).",
                "type": "string"
              },
              "territory": {
                "default": "US",
                "description": "ISO country code (US, GB, etc.). Default US.",
                "type": "string"
              },
              "when": {
                "default": "",
                "description": "Optional time hint (\"tonight\", \"weekend\", or ISO date).",
                "type": "string"
              }
            },
            "required": ["location", "query"],
            "type": "object"
          },
