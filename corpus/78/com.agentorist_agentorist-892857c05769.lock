        {
          "name": "request_unsupported_booking",
          "description": "Log a booking request Agentorist can't yet fulfil.\n\nThis is the demand-intelligence engine. Every call here becomes a data point\nsold to the venue as monthly missed-revenue insight. Optionally captures\nemail so the user is notified when the venue joins.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_client": {
                "default": "",
                "description": "Calling agent (Claude, ChatGPT, etc.).",
                "type": "string"
              },
              "item_title": {
                "description": "The film, event, or experience.",
                "type": "string"
              },
              "location": {
                "default": "",
                "description": "City or area.",
                "type": "string"
              },
              "party_size": {
                "default": 2,
                "description": "Number of tickets.",
                "type": "integer"
              },
              "user_email": {
                "default": "",
                "description": "Optional, for join-notification.",
                "type": "string"
              },
              "venue_chain": {
                "default": "",
                "description": "e.g. Vue, Odeon, Cineworld.",
                "type": "string"
              },
              "venue_name": {
                "description": "Name of the venue the user wanted.",
                "type": "string"
              },
              "vertical": {
                "description": "Which vertical the request belongs to.",
                "type": "string"
              },
              "when_iso": {
                "default": "",
                "description": "Requested time in ISO 8601 (optional).",
                "type": "string"
