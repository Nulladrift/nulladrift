        {
          "name": "match_phrase",
          "description": "Find a phrase in YOUR supplied timed words; no ASR, external call or charge.\n\n        Supply text/start_seconds/end_seconds for each word, from your own audio\n        analysis. Timing is not verified by LyricPatch. Preview before generating;\n        ask which occurrence when ambiguous. Do not invent a transcript/timestamps.\n        ",
          "inputSchema": {
            "$defs": {
              "SuppliedTranscriptWord": {
                "additionalProperties": false,
                "properties": {
                  "end_seconds": {
                    "exclusiveMinimum": 0,
                    "maximum": 900,
                    "title": "End Seconds",
                    "type": "number"
                  },
                  "start_seconds": {
                    "maximum": 900,
                    "minimum": 0,
                    "title": "Start Seconds",
                    "type": "number"
                  },
                  "text": {
                    "maxLength": 100,
                    "minLength": 1,
                    "title": "Text",
                    "type": "string"
                  }
                },
                "required": ["end_seconds", "start_seconds", "text"],
                "title": "SuppliedTranscriptWord",
                "type": "object"
              }
            },
            "properties": {
              "project_id": {
                "format": "uuid",
                "title": "Project Id",
                "type": "string"
              },
              "target_phrase": {
                "maxLength": 300,
                "minLength": 1,
                "title": "Target Phrase",
                "type": "string"
              },
              "words": {
                "items": {
                  "$ref": "#/$defs/SuppliedTranscriptWord"
                },
                "maxItems": 5000,
                "minItems": 1,
                "title": "Words",
                "type": "array"
              }
            },
            "required": ["project_id", "target_phrase", "words"],
            "title": "match_phraseArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "match_phraseDictOutput",
            "type": "object"
          },
