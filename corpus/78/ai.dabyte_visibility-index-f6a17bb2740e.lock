        "name": "dabyte-ai-visibility",
        "title": "DABYTE AI Visibility Index",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Open weekly AI-visibility data for SaaS & AI tools: share of answer across ChatGPT, Perplexity and Gemini. All data is CC BY 4.0; cite the domain when reusing numbers.",
      "tools": [
        {
          "name": "get_brand_visibility",
          "title": "Look up one brand",
          "description": "One brand's standing in the current DABYTE release: share of answer per engine, rank, quadrant, how many panel prompts name it, and which ones.\n\nUse this when a specific brand is named. Takes a slug, not a display name — call list_tracked_brands first if you are unsure, or read the slug from get_visibility_index.\n\nAn unknown slug is not a failure to hide: the error names every valid slug, so a second attempt can succeed. A brand absent from the index has not been measured at all, which is different from a measured zero. Only SaaS & AI tools brands are tracked. For the field as a whole use get_visibility_index; for this brand over time, get_history.\n\nRe-measured weekly, so the same call returns the same figures until the next release. Data is CC BY 4.0 and free: no key, no account, no rate limit — cite the release date and dabyte.ai when quoting a number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Brand slug, lowercase with hyphens — 'slack', 'coinbase', 'monday-com'. Not the display name.",
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "brand": {
                "description": "Brand name as published.",
                "type": "string"
              },
              "commercial_intent": {
                "description": "How commercially loaded the brand's category demand is.",
                "type": "number"
              },
              "engines": {
                "description": "Engines measured in this release.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "is_client": {
                "description": "Whether the brand is a client of the publisher. Placement cannot be bought; this flag makes that checkable.",
                "type": "boolean"
              },
              "measured_at": {
                "description": "Date of this release, ISO 8601.",
                "type": "string"
              },
              "niche_title": {
                "type": "string"
              },
              "panel_version": {
                "description": "Prompt panel version. Figures from different versions are not comparable.",
                "type": "integer"
              },
              "per_engine": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Share of answer per engine, same scale.",
                "type": "object"
              },
              "prompts": {
                "description": "Panel prompts in which the brand is named.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "quadrant": {
                "description": "Position on visibility against commercial intent.",
                "type": "string"
              },
              "rank": {
                "description": "Position in this release, 1 = most named.",
                "type": "integer"
              },
              "slug": {
                "description": "Identifier used by get_brand_visibility.",
                "type": "string"
              },
              "visibility_score": {
                "description": "Share of answer, percent of panel prompts naming the brand.",
                "type": "number"
              }
            },
            "required": ["brand", "measured_at", "rank", "slug", "visibility_score"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up one brand"
          },
          "behavior": {
