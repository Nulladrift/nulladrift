          "digest": "sha256:2988098ca63176920a025b6b6292fbdea24dd4c0e244b1baa476c295fefd4f7c"
        },
        {
          "name": "list_tracked_brands",
          "title": "List tracked brands and slugs",
          "description": "The names and slugs of every brand in the DABYTE index — a lookup table, nothing else. No scores, no ranks.\n\nUse it for two things: to turn a brand name into the slug get_brand_visibility needs, and to answer whether a brand is tracked at all.\n\nDo NOT use it when you want figures — get_visibility_index returns the same brands with their full measurements in a single call, so calling this one first is a wasted round trip. Absence here means the brand is not measured, not that it scores zero. Covers SaaS & AI tools only; the sibling index at dablock.ai covers the other niche.\n\nRe-measured weekly, so the same call returns the same figures until the next release. Data is CC BY 4.0 and free: no key, no account, no rate limit — cite the release date and dabyte.ai when quoting a number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "brands": {
                "items": {
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["brand", "slug"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["brands"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List tracked brands and slugs"
          },
          "behavior": {
