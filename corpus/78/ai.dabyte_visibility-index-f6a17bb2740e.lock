            "readOnly": true
          },
          "digest": "sha256:3f701db52535a55c315c3a5e6f86cfb929d2ffe157d32c30f02a82d394b8bdd3"
        },
        {
          "name": "get_history",
          "title": "Full measurement time series",
          "description": "Every DABYTE release ever published, as a series per brand: share of answer at each weekly measurement with the date and panel version it was taken under.\n\nUse this for any question about change — is a brand rising, when did it enter the index, how volatile is the category.\n\nTwo limits decide whether an answer is honest. Figures are comparable only WITHIN a panel version: the panel is frozen between releases and a version change alters the denominator, so a difference across that boundary is not a trend. And small moves sit inside language-model noise: since panel v3 (2026-08-10) each prompt runs three times per engine per release and the figure is the share of runs; earlier releases ran each prompt once, so one mention on one engine was a whole scale step there. Either way a one-step movement should not be reported as a gain or a loss. Call get_methodology for the exact step size. For the current release alone use get_visibility_index.\n\nRe-measured weekly, so the same call returns the same figures until the next release. Data is CC BY 4.0 and free: no key, no account, no rate limit — cite the release date and dabyte.ai when quoting a number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "measurements": {
                "items": {
                  "properties": {
                    "measured_at": {
                      "type": "string"
                    },
                    "panel_version": {
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "series": {
                "additionalProperties": {
                  "type": "array"
                },
                "description": "Per brand slug, the share of answer at each release.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Full measurement time series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8fceec844639ac5b08199de88e9be993b67333eaa3847541b0bcd5ce53a9048"
        },
        {
          "name": "get_methodology",
          "title": "How the index is measured",
          "description": "The rules behind every figure this server returns: the exact prompt panel and its version, which engines were measured, how share of answer is scored and rounded, the resolution of the scale in percentage points, and the editorial firewall and ownership disclosure.\n\nCall this before quoting a number as evidence, before comparing two releases, or whenever a user asks how the measurement was made or who publishes it. It is the only tool that tells you how much of a difference is meaningful, which is what stops a one-step wobble being reported as a movement.\n\nIt returns rules, not figures — no brand appears in the response. For figures use get_visibility_index or get_brand_visibility; for the series, get_history. The panel is public and frozen between releases, so every published number can be recomputed by a third party from the archive at https://dabyte.ai/archive/.\n\nRe-measured weekly, so the same call returns the same figures until the next release. Data is CC BY 4.0 and free: no key, no account, no rate limit — cite the release date and dabyte.ai when quoting a number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "engines": {
                "description": "Engines measured in this release.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "license": {
                "type": "string"
              },
              "measured_at": {
                "description": "Date of this release, ISO 8601.",
                "type": "string"
              },
              "niche_title": {
                "type": "string"
              },
              "panel_version": {
                "description": "Prompt panel version. Figures from different versions are not comparable.",
                "type": "integer"
              },
              "prompt_panel": {
                "description": "The exact prompts, verbatim.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "publisher": {
                "type": "string"
              },
              "resolution": {
                "description": "Percentage points one mention on one engine is worth.",
                "type": "string"
              },
              "scoring": {
                "description": "How share of answer is computed.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How the index is measured"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85a5699a0d11480c38d82c35cbc8f3ba9e032ff4766338243da538634840f217"
        },
        {
          "name": "get_visibility_index",
          "title": "DABYTE AI Visibility Index — full table",
          "description": "The whole current release in one call: every tracked brand in SaaS & AI tools with its rank, share of answer overall and per engine, commercial intent and quadrant. Share of answer is the percentage of a fixed panel of category buyer prompts in which an engine names the brand.\n\nUse this when the question is about the field — who leads, who is absent, how the category looks. It is one response of roughly 8 KB for 20 brands, so prefer it over calling get_brand_visibility repeatedly.\n\nDo NOT use it for one named brand (get_brand_visibility is the direct answer), for movement over time (get_history holds the series; a single release cannot show a trend), or to audit a website's own AI visibility — this is a measured dataset about third-party brands, not a site audit. Covers SaaS & AI tools only; the sibling index at dablock.ai covers the other niche.\n\nRe-measured weekly, so the same call returns the same figures until the next release. Data is CC BY 4.0 and free: no key, no account, no rate limit — cite the release date and dabyte.ai when quoting a number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "engines": {
                "description": "Engines measured in this release.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "entries": {
                "items": {
                  "properties": {
                    "brand": {
                      "description": "Brand name as published.",
                      "type": "string"
                    },
                    "commercial_intent": {
                      "description": "How commercially loaded the brand's category demand is.",
                      "type": "number"
                    },
                    "is_client": {
                      "description": "Whether the brand is a client of the publisher. Placement cannot be bought; this flag makes that checkable.",
                      "type": "boolean"
                    },
                    "per_engine": {
                      "additionalProperties": {
                        "type": "number"
                      },
                      "description": "Share of answer per engine, same scale.",
                      "type": "object"
                    },
                    "quadrant": {
                      "description": "Position on visibility against commercial intent.",
                      "type": "string"
                    },
                    "rank": {
                      "description": "Position in this release, 1 = most named.",
                      "type": "integer"
                    },
                    "slug": {
                      "description": "Identifier used by get_brand_visibility.",
                      "type": "string"
                    },
                    "visibility_score": {
                      "description": "Share of answer, percent of panel prompts naming the brand.",
                      "type": "number"
                    }
                  },
                  "required": ["brand", "rank", "slug", "visibility_score"],
                  "type": "object"
