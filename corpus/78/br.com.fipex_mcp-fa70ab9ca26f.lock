{
  "lockfileVersion": 2,
  "subjects": {
    "br.com.fipex/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.fipex.com.br/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fipeX",
        "title": "fipeX",
        "version": "2.21.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "compare_prices",
          "description": "Compare the latest FIPE price and history of up to 10 vehicles side by side. Each spec is \"model-slug,fuel-slug,year\"; separate specs with semicolons.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vehicle_specs": {
                "description": "up to 10 vehicles, each \"model-slug,fuel-slug,year\", separated by semicolons (e.g. \"argo,flex,2022;onix,flex,2022\")",
                "type": "string"
              }
            },
            "required": ["vehicle_specs"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4ab8caa6f35ec1673c693d8abacc02c2854286fdac7c7a3b3319b42f3ae4db7"
        },
        {
          "name": "get_price",
          "description": "Get the latest FIPE price for one vehicle, identified by model_slug + fuel_acronym + year, or by model_id + fuel_id + year. Year is \"2022\" (a model year) or \"zero\" (0 km / brand new).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fuel_acronym": {
                "description": "single-letter fuel acronym, e.g. \"g\" gasoline, \"e\" ethanol, \"f\" flex, \"d\" diesel",
                "type": "string"
              },
              "fuel_id": {
                "description": "fuel UUID (alternative to fuel_acronym)",
                "type": "string"
              },
              "model_id": {
                "description": "model UUID (alternative to model_slug)",
                "type": "string"
              },
              "model_slug": {
                "description": "model slug, e.g. \"argo\" (pair with fuel_acronym)",
                "type": "string"
              },
              "year": {
                "description": "model year like \"2022\", or \"zero\" for 0 km / brand new",
                "type": "string"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d20f507f642c3957fd98479f510ffb142fc486e1a1b13675ed63ae8cdf4da8aa"
        },
        {
          "name": "get_price_history",
          "description": "Get the monthly FIPE price history for one vehicle, identified by model_id + fuel_id + year. Year is \"2022\" (a model year) or \"zero\" (0 km / brand new).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fuel_id": {
                "description": "fuel UUID (from search_vehicles)",
                "type": "string"
              },
              "model_id": {
                "description": "model UUID (from search_vehicles)",
                "type": "string"
              },
              "year": {
                "description": "model year like \"2022\", or \"zero\" for 0 km / brand new",
                "type": "string"
              }
            },
            "required": ["fuel_id", "model_id", "year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a4a22ca35208fe68c6677bcde5c343e2e087c89a16b078feecc90b9294a2952"
        },
        {
          "name": "search_vehicles",
          "description": "Search Brazilian FIPE vehicles by free-text query (make, model, year, fuel). Returns matching vehicles with their slugs and IDs — the entry point that resolves names into the identifiers get_price, get_price_history and compare_prices need.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "results per page, 1-50, defaults to 10",
                "type": "integer"
              },
              "page": {
                "description": "1-based page number, defaults to 1",
                "type": "integer"
              },
              "price_max": {
                "description": "maximum current price in BRL (reais), inclusive (e.g. 78000)",
                "type": "number"
              },
              "price_min": {
                "description": "minimum current price in BRL (reais), inclusive (e.g. 50000)",
                "type": "number"
              },
              "query": {
                "description": "free-text search over make, model, year and fuel (e.g. \"fiat argo 2022 flex\"). Make names in the query are hard-filtered automatically",
                "type": "string"
              },
              "vehicle_type": {
                "description": "filter by vehicle type: carro, moto or caminhao",
                "type": "string"
              },
              "year_max": {
                "description": "maximum model year, inclusive",
                "type": "integer"
              },
              "year_min": {
                "description": "minimum model year, inclusive (e.g. 2006). 0 km vehicles have no year and are excluded by year filters; search them with 'zero km' in the query",
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac3d0ff004837d41d1584cb1117c735bce77ba5bcd48247b3985ae7fd15f11ff"
        }
      ],
      "digest": "sha256:64334ccebf2af230567cbcf58971a3b6b603ad632f647b3ad2890ffd7b06a0f7"
    }
  }
}
