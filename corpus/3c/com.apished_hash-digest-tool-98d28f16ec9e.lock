{
  "lockfileVersion": 2,
  "subjects": {
    "com.apished/hash-digest-tool": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://apished.com/mcp/v1/hash"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "apished-hash",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "hash_digest",
          "description": "Computes a hash digest of input (decoded per encoding: \"text\" default, \"base64\", or \"hex\") using algo: md5, sha1, sha256, sha512, or crc32. Returns the digest as lowercase hex.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "algo": {
                "description": "md5, sha1, sha256, sha512, or crc32",
                "type": "string"
              },
              "encoding": {
                "description": "text (default), base64, or hex",
                "type": "string"
              },
              "input": {
                "description": "data to hash, encoded per encoding",
                "type": "string"
              }
            },
            "required": ["algo", "input"],
            "type": "object"
          },
          "outputSchema": {
            "type": "string"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62c097e6fa64445c1aa741ad82b12db442ef203883f1bc5414799a6fb7c7bef3"
        },
        {
          "name": "hash_hmac",
          "description": "Computes an HMAC of input (decoded per encoding) using algo: md5, sha1, sha256, or sha512 (crc32 isn't offered — it's a checksum, not a cryptographic primitive HMAC composes with). key is used as its raw UTF-8 bytes, not decoded per encoding. Returns the MAC as lowercase hex.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "algo": {
                "description": "md5, sha1, sha256, or sha512",
                "type": "string"
              },
              "encoding": {
                "description": "text (default), base64, or hex",
                "type": "string"
              },
              "input": {
                "description": "data to authenticate, encoded per encoding",
                "type": "string"
              },
              "key": {
                "description": "secret key, used as raw UTF-8 bytes",
                "type": "string"
              }
            },
            "required": ["algo", "input", "key"],
            "type": "object"
          },
          "outputSchema": {
            "type": "string"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef45f856eaff75eaa118352fc7d16356d3e5e9f51b58fc79754643b10adc2887"
        }
      ],
      "digest": "sha256:1105b36e1c394bfdc4df06017e334698b7519d1fcdd2193b6e1a753741077359"
    }
  }
}
