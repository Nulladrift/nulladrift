        {
          "name": "search_locksmiths",
          "description": "Find vetted, licensed locksmiths near a location.\n\n    Use this first when a user needs a locksmith. Returns a ranked list of\n    human-vetted providers (featured first) with id, name, city, services,\n    rating, verified/featured flags, phone, and a profile URL.\n\n    Args:\n        location: A 5-digit US ZIP code (preferred) or a US city name.\n        service:  Optional job type, e.g. \"lockout\", \"automotive\", \"residential\",\n                  \"commercial\", \"rekey\", \"install\", \"safe\".\n        urgency:  Optional, e.g. \"emergency\", \"today\", \"scheduled\".\n        budget:   Optional free-text budget hint.\n        limit:    Max results to return (1-20, default 5).\n\n    Note: price and ETA are NOT pre-listed — they are confirmed by the locksmith\n    after you call request_quote. Do not invent prices or ETAs.\n    ",
          "inputSchema": {
            "properties": {
              "budget": {
                "default": "",
                "title": "Budget",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "title": "Limit",
                "type": "integer"
              },
              "location": {
                "title": "Location",
                "type": "string"
              },
              "service": {
