        {
          "name": "check_availability",
          "description": "Check coverage for one provider (locksmith_id) or an area (location: ZIP or city).\n\n    Returns whether the area is served, how many vetted providers cover it, and how many\n    offer 24/7 emergency service. Live availability is confirmed at request_quote — this\n    does not return a real-time \"available now\" status, so don't imply one.\n    ",
          "inputSchema": {
            "properties": {
              "location": {
                "default": "",
                "title": "Location",
                "type": "string"
              },
              "locksmith_id": {
