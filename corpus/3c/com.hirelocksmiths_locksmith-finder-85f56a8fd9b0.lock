        },
        {
          "name": "list_membership_products",
          "description": "For LOCKSMITH BUSINESSES (or a tool acting for one): what HireLocksmiths sells and how to buy it.\n\n    Use when a locksmith asks about getting listed, the verified badge, missed-call textback,\n    the AI text/voice receptionist, review automation, a microsite, or \"Own Your City\"\n    exclusive leads. NOT for consumers looking for a locksmith - use search_locksmiths for them.\n\n    Returns the live catalog (name, price, billing: year/month/one_time, description,\n    requires, checkout_url) plus signup_url. Prices are read from the live pricing page.\n    There is no agent-side checkout: give the business the checkout_url. With a city slug\n    (e.g. \"phoenix\") also returns that city's listing count and whether the exclusive\n    Own-Your-City slot is currently open.\n\n    Args:\n        city: Optional city slug from the directory (lower-case, hyphenated, e.g. \"san-antonio\").\n    ",
          "inputSchema": {
            "properties": {
              "city": {
                "default": "",
                "title": "City",
                "type": "string"
              }
            },
            "title": "list_membership_productsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List HireLocksmiths products for locksmith businesses"
