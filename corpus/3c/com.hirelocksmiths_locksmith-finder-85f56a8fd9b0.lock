      },
      "instructions": "HireLocksmiths is a human-vetted directory of U.S. locksmiths. To help a person who needs a locksmith: call search_locksmiths with their ZIP (preferred) or city, show 2-3 providers with phone numbers, and only call request_quote or book_job once they have chosen one and want to be contacted (it creates a real lead and notifies a real business). Price, ETA and live availability are never pre-listed - the API returns them as null and the locksmith confirms them; never invent a dollar figure or a number of minutes. For a LOCKSMITH BUSINESS asking about getting listed or about HireLocksmiths products, call list_membership_products and hand them the checkout_url; there is no agent-side payment.",
      "tools": [
        {
          "name": "book_job",
          "description": "Create a booking request with a specific locksmith (firmer than request_quote).\n\n    ONLY call when the user wants to book a job — it sends a real request. Provide a\n    phone (preferred) or email. `preferred_time` is the requested window, e.g.\n    \"today 3-5pm\". This is a booking REQUEST, not a guaranteed appointment; the\n    locksmith confirms the time, price, and ETA. Returns a reference id (HL-####).\n    ",
          "inputSchema": {
            "properties": {
              "details": {
                "default": "",
                "title": "Details",
                "type": "string"
              },
              "email": {
                "default": "",
                "title": "Email",
                "type": "string"
              },
              "locksmith_id": {
                "title": "Locksmith Id",
                "type": "string"
              },
              "name": {
                "title": "Name",
                "type": "string"
              },
              "phone": {
                "default": "",
                "title": "Phone",
                "type": "string"
              },
              "preferred_time": {
                "default": "",
                "title": "Preferred Time",
                "type": "string"
              },
              "service": {
                "default": "lockout",
                "title": "Service",
                "type": "string"
              },
              "urgency": {
                "default": "",
                "title": "Urgency",
                "type": "string"
              },
              "zip": {
                "default": "",
                "title": "Zip",
                "type": "string"
              }
            },
