{
  "lockfileVersion": 2,
  "subjects": {
    "co.productize/business-valuation": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://productize.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "productize-valuation",
        "title": "Business valuation calculator",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "One tool, value_business. It needs the kind of business, the revenue and the profit before tax for the last 12 months. All figures are US dollars. The sale data is from the US. The method and the sources are at https://productize.co/business-valuation-calculator/",
      "tools": [
        {
          "name": "value_business",
          "title": "Business valuation estimate",
          "description": "Estimates what a buyer might pay for a small agency, productized service, consultancy or software (SaaS) business. Returns a worst case, a base case and a best case in US dollars, from published US sale prices. An estimate, not a formal valuation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "churn": {
                "description": "Software only. Customers lost each month: low (under 2%), mid (2% to 5%), high (over 5%).",
                "enum": ["low", "mid", "high"],
                "type": "string"
              },
              "founder_dependence": {
                "description": "How much the business needs its founder for sales, client contact and decisions: low (it runs without the founder), mid, high (it needs the founder for everything).",
                "enum": ["low", "mid", "high"],
                "type": "string"
              },
              "growth": {
                "description": "Revenue in the last 12 months: down (it dropped), flat (flat or up less than 10%), up (up 10% to 30%), fast (up more than 30%).",
                "enum": ["down", "flat", "up", "fast"],
                "type": "string"
              },
              "owner_pay": {
                "description": "What the owner took in salary, bonuses and personal costs in the same 12 months. 0 when not given.",
                "type": "number"
              },
              "profit": {
                "description": "Profit before tax for the last 12 months, after the owner's pay. A loss is a negative number.",
                "type": "number"
              },
              "recurring": {
                "description": "Service businesses only. Share of revenue on retainer, subscription or contract: low (under 30%), mid (30% to 60%), high (over 60%).",
                "enum": ["low", "mid", "high"],
                "type": "string"
              },
              "revenue": {
                "description": "Revenue for the last 12 months, in US dollars.",
                "type": "number"
              },
              "top_client": {
                "description": "Share of revenue from the biggest client: low (under 15%), mid (15% to 25%), high (over 25%).",
                "enum": ["low", "mid", "high"],
                "type": "string"
              },
              "type": {
                "description": "The kind of business. A productized service sells a fixed scope for a fixed price.",
                "enum": ["agency", "productized", "consultancy", "saas"],
                "type": "string"
              }
            },
            "required": ["profit", "revenue", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business valuation estimate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:08326be92e1997198e265408032584ca920ecee4bb396101921aae0f97ec4c25"
        }
      ],
      "digest": "sha256:7c29dbcb0fed4914a10818a9e3394460c1102d1243fe65f58b8473ce193bb349"
    }
  }
}
