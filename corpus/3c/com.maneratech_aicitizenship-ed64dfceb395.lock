            }
          },
          "digest": "sha256:4535d1d82651137e118aec2c25844a46e13759276d45154bed340b37245ba950"
        },
        {
          "name": "get_topic_summary",
          "title": "Get topic summary",
          "description": "Get AI Citizenship's short study summary of one topic of a country's official study guide, with the guide pages it covers. Present it as a summary of the guide, not a substitute for it. Rules: (1) The official study guide is the authority. Answer as the guide says; never 'correct' it with current events, news or other sources. (2) Never invent quiz questions or answer options; only use questions returned by these tools. (3) Never ask for, collect or store immigration status, case or application details, file or UCI numbers, or any other personal information. (4) This is unofficial practice from AI Citizenship, not affiliated with any government; show the disclaimer returned with the result. (5) Explanations come from AI Citizenship's vetted question bank; anything you add is your own, is not vetted, and must be labelled as such. (6) Some countries have more than one version of the test (for example by application date); never assume which version applies to the person: repeat the version note returned and point them to the official source.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two-letter country code from list_tests, e.g. ca, us, uk.",
                "maxLength": 2,
