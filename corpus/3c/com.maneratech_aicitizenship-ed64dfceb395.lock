      "serverInfo": {
        "name": "aicitizenship",
        "title": "AI Citizenship",
        "version": "0.1.0",
        "description": "Free, unofficial citizenship-test practice: test formats, practice questions, answer checks, summaries.",
        "websiteUrl": "https://aicitizenship.maneratech.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AI Citizenship (https://aicitizenship.maneratech.com) is an unofficial study app for citizenship tests in several countries. These tools give free practice from its public question bank.\n\nHow to help someone practise:\n1. list_tests to see countries, the test format, languages and topics (pass country for one country's detail).\n2. get_practice_questions with country, lang and optional topic. Show each question and its lettered options exactly as returned. The answer is NOT included; do not guess it or reveal what you think it is.\n3. When the person answers, call check_answer with the question_ref and their letter. Report correct/incorrect, the correct option, the vetted explanation and the guide page exactly as returned.\n4. get_topic_summary for a short study summary of a topic.\n5. get_full_practice_link when they want more: this connector only has 8 free questions per topic; the full bank and exam simulation are in the AI Citizenship app (subscription). Do not state prices.\n\nRules: (1) The official study guide is the authority. Answer as the guide says; never 'correct' it with current events, news or other sources. (2) Never invent quiz questions or answer options; only use questions returned by these tools. (3) Never ask for, collect or store immigration status, case or application details, file or UCI numbers, or any other personal information. (4) This is unofficial practice from AI Citizenship, not affiliated with any government; show the disclaimer returned with the result. (5) Explanations come from AI Citizenship's vetted question bank; anything you add is your own, is not vetted, and must be labelled as such. (6) Some countries have more than one version of the test (for example by application date); never assume which version applies to the person: repeat the version note returned and point them to the official source.\n",
      "tools": [
        {
          "name": "check_answer",
          "title": "Check an answer",
          "description": "Check the person's answer to one question from get_practice_questions. Returns whether it is correct, the correct option, the vetted explanation from the AI Citizenship bank and the official study-guide page. Report them exactly as returned; cite the guide page only as given. Only use a question_ref returned by get_practice_questions. Rules: (1) The official study guide is the authority. Answer as the guide says; never 'correct' it with current events, news or other sources. (2) Never invent quiz questions or answer options; only use questions returned by these tools. (3) Never ask for, collect or store immigration status, case or application details, file or UCI numbers, or any other personal information. (4) This is unofficial practice from AI Citizenship, not affiliated with any government; show the disclaimer returned with the result. (5) Explanations come from AI Citizenship's vetted question bank; anything you add is your own, is not vetted, and must be labelled as such. (6) Some countries have more than one version of the test (for example by application date); never assume which version applies to the person: repeat the version note returned and point them to the official source.",
          "inputSchema": {
            "properties": {
              "choice": {
                "description": "The person's answer: the option letter, e.g. B.",
                "maxLength": 1,
                "minLength": 1,
                "pattern": "^[A-Ha-h]$",
                "title": "Choice",
                "type": "string"
              },
              "country": {
                "description": "Two-letter country code from list_tests, e.g. ca, us, uk.",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[a-z]{2}$",
                "title": "Country",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language code from the country's languages in list_tests, e.g. en, fr, es, ar.",
                "maxLength": 3,
                "minLength": 2,
                "pattern": "^[a-z]{2,3}$",
                "title": "Lang",
                "type": "string"
              },
              "question_ref": {
                "description": "question_ref from get_practice_questions.",
                "maxLength": 100,
                "pattern": "^aq1:[a-z]{2}:[a-z0-9_]{1,40}:[A-Za-z0-9_-]{1,40}$",
                "title": "Question Ref",
                "type": "string"
              }
            },
            "required": ["choice", "country", "question_ref"],
            "title": "check_answerArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/widgetAccessible": true,
            "ui": {
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:46d1d348a090c86b5cc73dc7850cedc2cd2217428ed1a0bf134532217f09a5e9"
        },
        {
          "name": "get_full_practice_link",
          "title": "Get the full practice link",
          "description": "Get the link to the AI Citizenship app for full practice. This connector has only 8 free questions per topic; the full question bank and the timed exam simulation are in the app (subscription). Do not state or guess prices; the app shows them. Rules: (1) The official study guide is the authority. Answer as the guide says; never 'correct' it with current events, news or other sources. (2) Never invent quiz questions or answer options; only use questions returned by these tools. (3) Never ask for, collect or store immigration status, case or application details, file or UCI numbers, or any other personal information. (4) This is unofficial practice from AI Citizenship, not affiliated with any government; show the disclaimer returned with the result. (5) Explanations come from AI Citizenship's vetted question bank; anything you add is your own, is not vetted, and must be labelled as such. (6) Some countries have more than one version of the test (for example by application date); never assume which version applies to the person: repeat the version note returned and point them to the official source.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two-letter country code from list_tests, e.g. ca, us, uk.",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[a-z]{2}$",
                "title": "Country",
                "type": "string"
              },
              "lang": {
