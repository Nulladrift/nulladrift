                "description": "Language code from the country's languages in list_tests, e.g. en, fr, es, ar.",
                "maxLength": 3,
                "minLength": 2,
                "pattern": "^[a-z]{2,3}$",
                "title": "Lang",
                "type": "string"
              }
            },
            "required": ["country"],
            "title": "get_full_practice_linkArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc82cb88d3681d8ecaa42519aa00f14ff1eaf3967c0827c8ef98e31c9fc80af3"
        },
        {
          "name": "get_practice_questions",
          "title": "Get practice questions",
          "description": "Get up to 8 free multiple-choice practice questions for a country's citizenship test, in the chosen language, optionally for one topic. Each question has a question_ref and lettered options. The correct answer and the explanation are NOT included: do not guess or hint the answer. Show questions and options exactly as returned; after the person answers, call check_answer with the question_ref and their letter. Rules: (1) The official study guide is the authority. Answer as the guide says; never 'correct' it with current events, news or other sources. (2) Never invent quiz questions or answer options; only use questions returned by these tools. (3) Never ask for, collect or store immigration status, case or application details, file or UCI numbers, or any other personal information. (4) This is unofficial practice from AI Citizenship, not affiliated with any government; show the disclaimer returned with the result. (5) Explanations come from AI Citizenship's vetted question bank; anything you add is your own, is not vetted, and must be labelled as such. (6) Some countries have more than one version of the test (for example by application date); never assume which version applies to the person: repeat the version note returned and point them to the official source.",
          "inputSchema": {
            "properties": {
              "count": {
                "default": 5,
                "description": "How many questions (1-8).",
                "maximum": 8,
                "minimum": 1,
                "title": "Count",
                "type": "integer"
              },
              "country": {
                "description": "Two-letter country code from list_tests, e.g. ca, us, uk.",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[a-z]{2}$",
                "title": "Country",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language code from the country's languages in list_tests, e.g. en, fr, es, ar.",
                "maxLength": 3,
                "minLength": 2,
                "pattern": "^[a-z]{2,3}$",
                "title": "Lang",
                "type": "string"
              },
              "topic": {
                "anyOf": [
                  {
                    "maxLength": 40,
                    "pattern": "^[a-z0-9_]{1,40}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional topic id from list_tests.",
                "title": "Topic"
              }
            },
            "required": ["country"],
            "title": "get_practice_questionsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
