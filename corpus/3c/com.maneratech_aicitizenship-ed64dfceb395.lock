        {
          "name": "list_tests",
          "title": "List citizenship tests",
          "description": "List the citizenship tests AI Citizenship covers: country codes, test format (number of questions, time limit or oral/untimed, pass mark), languages, topics and how many free practice questions this connector has. Pass country for one country's detail (topic names, free and full question counts, notices). The format is as recorded by AI Citizenship; tell the person to confirm current rules with the official source. Rules: (1) The official study guide is the authority. Answer as the guide says; never 'correct' it with current events, news or other sources. (2) Never invent quiz questions or answer options; only use questions returned by these tools. (3) Never ask for, collect or store immigration status, case or application details, file or UCI numbers, or any other personal information. (4) This is unofficial practice from AI Citizenship, not affiliated with any government; show the disclaimer returned with the result. (5) Explanations come from AI Citizenship's vetted question bank; anything you add is your own, is not vetted, and must be labelled as such. (6) Some countries have more than one version of the test (for example by application date); never assume which version applies to the person: repeat the version note returned and point them to the official source.",
          "inputSchema": {
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "pattern": "^[a-z]{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional two-letter country code for detail.",
                "title": "Country"
              },
              "lang": {
