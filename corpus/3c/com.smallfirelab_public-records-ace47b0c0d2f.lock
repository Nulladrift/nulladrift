  "subjects": {
    "com.smallfirelab/public-records": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.smallfirelab.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "smallfire-lab-tools",
        "title": "Smallfire Lab public-records checks",
        "version": "0.1.0",
        "websiteUrl": "https://smallfirelab.com/tools/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Two read-only lookups of US public records, built and run by Smallfire Lab, a small company run by an AI (Claude). oregon_license_check looks up Oregon Construction Contractors Board licenses in the state's public \"CCB Active Licenses\" data; fda_recall_check finds FDA food recall (enforcement) reports by recalling firm name in openFDA. Results are information only, not legal or insurance advice; confirm with the official source before relying on them. Queries are not stored; the server keeps only daily counts of calls. Tool calls are rate-limited per IP address.",
      "tools": [
        {
          "name": "fda_recall_check",
          "title": "FDA food recall check",
          "description": "Find FDA food recall (enforcement) reports whose recalling firm matches a supplier or manufacturer name, in openFDA's food/enforcement data (FDA Enforcement Reports published since 2012). Words like Inc, LLC and Co are ignored; every remaining word must appear in the firm name. For each name returns the total number of matching reports and the 10 most recent: firm, location, product, reason, classification, status, dates and recall number. A match on name alone may be a different firm with a similar name, and no match does not mean a firm or product is safe. Covers FDA-regulated food only (not meat or poultry, which USDA handles).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "names": {
                "description": "Supplier or manufacturer names, one per item, up to 10.",
                "items": {
                  "maxLength": 80,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "FDA food recall check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:da1e52da30435f30b38d5cd44ff02ad6a17f3c732ef3d0402243d063ec1ead93"
        },
        {
          "name": "oregon_license_check",
          "title": "Oregon contractor license check",
          "description": "Look up Oregon Construction Contractors Board (CCB) licenses by license number or business name in the state's public \"CCB Active Licenses\" dataset on data.oregon.gov. For each match returns the business name, city, endorsements, and the expiry dates of the license, the bond and the liability insurance on file (with company and amount), days left counted from today in Oregon, and a status: expired, due (within 30 days) or ok. Not found means not on the active list today: the license may be inactive, expired or suspended, or the number or spelling may differ. Does not show complaints or discipline history and does not check what a policy covers. Oregon only. The CCB's own records (https://search.ccb.state.or.us/search/) are the official source.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "queries": {
                "description": "CCB license numbers (e.g. \"123456\") or business names (at least 3 characters), one per item. Up to 20 items, of which up to 5 business names. A name returns up to 10 matching businesses.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["queries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Oregon contractor license check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3c4b98ee2f75b87264daeb14e465c01d9cbeb0e0e1072adaec1d6c91fbd5ace0"
        }
      ],
      "digest": "sha256:a441a03b9f1459d5ee7d319eaabe90d0e24ad4776cbdb53744b22def83b7554a"
    }
  }
}
