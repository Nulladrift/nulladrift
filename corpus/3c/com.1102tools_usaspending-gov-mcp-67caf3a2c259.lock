        {
          "name": "autocomplete_naics",
          "description": "Autocomplete lookup for NAICS codes.\n\n    Accepts partial codes ('541') or keywords ('software'). Returns matching\n    NAICS entries with code and description.\n\n    Minimum 2 characters required. Short queries silently match substrings\n    inside parenthetical notes (e.g. 'x' matches 'except') and produce\n    nonsense results, so we require 2+ chars.\n\n    exclude_retired defaults to True. The upstream NAICS taxonomy still\n    returns codes retired in 2012/2017/2022; these are almost never what\n    callers want. Set exclude_retired=False to include them.\n    ",
          "inputSchema": {
            "properties": {
              "exclude_retired": {
                "default": true,
                "title": "Exclude Retired",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "search_text": {
                "title": "Search Text",
                "type": "string"
              }
            },
            "required": ["search_text"],
            "title": "autocomplete_naicsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "autocomplete_naicsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Autocomplete NAICS"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d446dbc0e289597abb83712579b11febf52739e45988298285c315ed8c3e0f1b"
        },
        {
          "name": "autocomplete_psc",
          "description": "Autocomplete lookup for Product/Service Codes (PSC).\n\n    Use exact four-character codes ('R499', 'D302') or description keywords\n    ('professional', 'application'). Returns matching PSC entries with\n    code and description. Two-character families such as 'D3' can return\n    no autocomplete matches even when their descendant codes exist.\n    For partial PSC families or prefix expansion, use get_psc_filter_tree()\n    instead: path='Service/D/D3/' lists the D3 descendants; start with\n    path='Service/A/' to discover and drill into an AJ family.\n\n    Minimum 2 characters required. Single-character queries return first-N\n    alphabetical results from the upstream API (useless for matching) and\n    empty strings return HTTP 400.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "search_text": {
                "title": "Search Text",
                "type": "string"
              }
            },
