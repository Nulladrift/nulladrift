        {
          "name": "spending_by_category",
          "description": "Aggregate spending by a dimension (top vendors, top agencies, top NAICS, etc.).\n\n    The 'category' parameter controls the grouping dimension. Common uses:\n    - category='recipient': top vendors for a filter set (vendor landscape analysis)\n    - category='awarding_subagency': which contracting offices within an agency\n    - category='naics': which work categories got the most spending\n    - category='psc': which product/service codes got the most spending\n    - category='state_territory': geographic distribution\n    - category='cfda': grant assistance listings\n\n    Note: recipient category returns vendor names in ALL CAPS and may contain\n    duplicates (subsidiaries, rebrands, re-registrations). For precise market\n    share, apply name normalization to the returned 'name' field.\n\n    At least one filter is required. An unfiltered call would silently\n    aggregate the entire USASpending database (all years, all agencies),\n    which is never what a caller wants.\n\n    date_type controls the transaction date window. Omitted (the default)\n    or 'action_date', it selects transaction actions inside the window.\n    'date_signed' selects the associated award's first signing date;\n    'last_modified_date' selects transaction update dates. 'new_awards_only'\n    retains in-window actions associated with awards first signed in the\n    window. These are transaction obligation totals, not new-award counts:\n    use new_awards_over_time for counts. Award search/count tools use a\n    different default interval-overlap rule.\n    date_type needs time_period_start and/or time_period_end.\n\n    program_numbers filters assistance awards by assistance listing (CFDA)\n    number, e.g. ['93.778'] for Medicaid; use it with award_type='grants',\n    'loans', 'direct_payments', or 'other'. autocomplete_cfda() finds numbers\n    by program name.\n    ",
          "inputSchema": {
            "properties": {
              "award_type": {
                "anyOf": [
                  {
                    "enum": ["contracts", "idvs", "grants", "loans", "direct_payments", "other"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Award Type"
              },
              "awarding_agency": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Awarding Agency"
              },
              "awarding_subagency": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Awarding Subagency"
