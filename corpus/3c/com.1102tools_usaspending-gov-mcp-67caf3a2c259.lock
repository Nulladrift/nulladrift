        {
          "name": "get_agency_awards",
          "description": "Get one obligation total and transaction count for an agency's awards\n    in a fiscal year.\n\n    The total covers ALL award types together (contracts, IDVs, grants,\n    loans, direct payments, other), so for most civilian agencies it is far\n    larger than contract spending (VA FY2026: $313B here vs $84B contracts).\n    For the split by award type use get_agency_obligations_by_award_category().\n    toptier_code is auto-padded to 3 digits if a shorter numeric value is\n    supplied.\n\n    fiscal_year defaults to the last completed fiscal year, not the current\n    one (USAspending's own default, which right after October 1 holds only a\n    few days of data). The answer always carries fiscal_year.\n    ",
          "inputSchema": {
            "properties": {
              "fiscal_year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Fiscal Year"
              },
              "toptier_code": {
                "title": "Toptier Code",
                "type": "string"
              }
            },
