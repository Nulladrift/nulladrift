            "title": "autocomplete_pscArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "autocomplete_pscDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Autocomplete PSC"
          },
          "behavior": {
            "destructive": false,
