      "instructions": "Dryos serves real, reconciled data — US power markets (ERCOT, MISO, PJM, SPP, CAISO, NYISO, ISO-NE), weather, and building permits — collected live from the source. Every stream is checked against the source it came from.\n\nHow to answer a question:\n1. list_streams to find the stream (filter by domain, operator or a word).\n2. describe_stream to read its columns, entity column, measure and unit.\n3. find_entities to look up a node, zone or station name. Never guess one: names are verbatim, inner spaces included (`ALDENE  230 KV  T-10`).\n4. query_stream for rows. Past a day or so of five-minute data, pass interval (15m, 1h, 1d, all) and agg (avg, min, max, sum) instead of raw rows. Each bucket carries `samples`; a low count is a collection gap, not a quiet hour. For the current value at every node, zone or station, pass newest=true: one row per entity at its most recent interval, rather than guessing a row limit.\n\nBuilding an app: every query_stream result carries `restUrl`, the same request as a plain GET against the public REST API. Relative times (start=-24h) stay relative in it, so it keeps working. Give that URL to whoever is wiring the data into their code rather than re-deriving one.\n\nRules that prevent wrong answers:\n- Every timestamp is UTC. interval_start_utc is the start of the interval. Convert only for display: ERCOT and SPP are US Central; MISO is EST all year (never EDT); PJM, NYISO and ISO-NE are US Eastern with daylight saving; CAISO is US Pacific.\n- start is inclusive, end exclusive.\n- Forecasts keep every publication. By default each interval's newest vintage is returned; never average vintages together.\n- Null means the source did not report it — never zero.\n- where filters a text column (`column=value`; repeat one column for OR, different columns AND). search is a case-insensitive substring (`column:text`).\n- Cite the stream slug and the interval timestamps behind any number you report.\n",
      "tools": [
        {
          "name": "column_values",
          "title": "List a column's values",
          "description": "The distinct values of one text column, most rows first — what a filter can be.\n\n    Args:\n        slug: The stream.\n        column: A text column from describe_stream (not the entity — use find_entities).\n        where: Filters as `column=value`, the same as query_stream's.\n        search: `column:text`, a case-insensitive substring.\n        limit: At most this many (1–500).\n    ",
          "inputSchema": {
