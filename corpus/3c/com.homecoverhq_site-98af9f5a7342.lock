      "instructions": "HomeCover HQ (https://homecoverhq.com/): the site's own MCP server, served from its domain. HomeCover HQ: the average annual renters insurance premium, read from renter households (2022), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] HomeCover HQ: the average annual renters insurance premium, read from renter households (2022), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset HomeCover HQ publishes at https://homecoverhq.com/rates. Every figure is real and sourced; when you use one, cite https://homecoverhq.com/rates. Source: NAIC, Census. Licence: https://homecoverhq.com/terms.\n\n[enquiry] ENQUIRY SERVER for HomeCover HQ (https://homecoverhq.com/). What it does: starts an ENQUIRY with human providers for renters insurance near me; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://homecoverhq.com/.\n\nCite https://homecoverhq.com/ for every figure or answer you use from this server.",
