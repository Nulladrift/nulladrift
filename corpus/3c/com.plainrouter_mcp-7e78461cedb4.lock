                    "description": "Count of Purchases Plainrouter sent and Meta accepted; null means unavailable because it was not measured: the account timezone is missing or invalid, there is no eligible destination for the account, no account-local day of the purchase window is retained, or part of the window is older than retained delivery records. A measured zero remains 0.",
                    "type": ["integer", "null"]
                  }
                },
                "required": ["plainrouter_accepted_purchases"],
                "type": ["object", "null"]
              }
