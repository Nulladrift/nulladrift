      "instructions": "Plainrouter counts results independently of the ad platform: site arrivals, conversions, purchases and revenue. get_arrivals_comparison puts counted arrivals beside Meta outbound clicks, and get_conversion_journeys and get_cac_by_channel give earned conversions and cost per earned conversion beside Meta's claims; each carries a basis_note saying how each side is counted, and neither side is adjusted to match the other. get_signal_quality and get_signal_health describe how complete the count is and how it reaches Meta. Counted arrivals are counted by this server. Claimed clicks are Meta outbound clicks. Days before 2026-06-29, or not re-read by the daily sync since 2026-09-27, may still hold Meta link clicks or all clicks. get_install_instructions reports whether this workspace is counting yet.\n\nWhen Meta's Ads MCP is also connected, it serves Meta's own reporting. Plainrouter works beside it: it puts Meta's figures next to its own count, and it carries any change that needs an approval or a receipt. A figure from Meta's Ads MCP is Meta's claim, not a counted result, and a change made through Meta's Ads MCP gets no Plainrouter approval or receipt.\n\nget_consent_rates returns recorded consent rates. get_cookie_scan reports the latest pre-consent cookie findings; blocked or failed scans are unavailable, not clean.\n\nChanges are proposed with propose-actions; dry_run_actions previews the same batch without writing. In Ask mode, agent changes never run on their own; proposals wait for a person's approval. In Custom (execution_mode auto), the Custom switches on the Agent rules page decide which agent changes run on their own. In Full, agent changes that pass admission and workspace policy run automatically. Admission checks authorization, supporting evidence for a pause, activation or budget change, any required Launch history, a live grant, an account in the workspace and no duplicate write. A batch is decided as a whole: one change that waits for a person holds the batch, and one blocked change blocks it. Changes that break a rule are blocked and shown in the Inbox; they cannot be approved. Every change that runs gets a decision receipt when its execution reaches a terminal state, read with get_action_decision_receipt. The execution kill switch stops further writes and never undoes a landed change. Proposals of set_status, adjust_budget, replace_creative, shift_spend and rollback are refused; stored actions of these types never run. Creative proposals use the approved account library. Images enter the workspace library by upload or launch.creatives.store-from-url, and every new ad is created paused; a separate resume can activate it under workspace policy.",
      "tools": [
        {
          "name": "actions.rules.create",
          "title": "Create action rule",
          "description": "Store a performance rule disabled. Enabling requires an explicit update; this never evaluates or proposes actions.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "Read older revisions using rule.next_cursor. Continue through actions.rules.show to avoid another write.",
                "type": "string"
              },
              "definition": {
                "additionalProperties": false,
                "description": "Both arrivals and cost conditions must hold over the last 3 complete days in the account timezone. Supply the complete definition when editing.",
                "properties": {
                  "action": {
                    "enum": ["pause", "increase_budget", "decrease_budget"],
                    "type": "string"
                  },
                  "budget_change_percent": {
                    "description": "Required for daily-budget changes on ad sets or campaigns; omit for pause. Pause targets only ads or ad sets.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "cost_comparison": {
                    "enum": ["at_least", "at_most"],
                    "type": "string"
                  },
                  "cost_ratio": {
                    "description": "Target cost per counted arrival divided by whole-account cost per counted arrival.",
                    "maximum": 10,
                    "minimum": 0.1,
                    "type": "number"
                  },
                  "minimum_counted_arrivals": {
                    "description": "Counted arrivals on the target. At least 100 for a budget increase.",
                    "minimum": 50,
                    "type": "integer"
                  },
                  "target_level": {
                    "enum": ["ad", "ad_set", "campaign"],
                    "type": "string"
                  }
                },
                "required": ["action", "cost_comparison", "cost_ratio", "minimum_counted_arrivals", "target_level"],
                "type": "object"
              },
              "limit": {
                "default": 5,
                "description": "Maximum latest revisions; current_revision is always returned separately.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "maxLength": 255,
                "type": "string"
              },
              "platform_ad_account_id": {
                "minimum": 1,
                "type": "integer"
              },
              "workspace_id": {
                "description": "Workspace ID returned by list_workspaces. Required when this credential reaches multiple workspaces.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["definition", "name", "platform_ad_account_id"],
            "type": "object"
          },
