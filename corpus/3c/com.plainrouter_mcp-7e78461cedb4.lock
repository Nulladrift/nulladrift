        {
          "name": "propose-actions",
          "title": "Propose actions",
          "description": "Propose a batch of budget, status, upload, or creative-duplication actions for the approved ad account. In Ask mode, agent changes never run on their own; proposals wait for a person's approval. In Custom (execution_mode auto), the Custom switches on the Agent rules page decide which agent changes run on their own. In Full, agent changes that pass admission and workspace policy run automatically. Rule violations are blocked and shown in the Inbox, and cannot be approved. The execution kill switch stops further writes and never undoes a landed change. Dispatch still requires a live grant, an account in the workspace, and no duplicate write. Proposals of set_status, adjust_budget, replace_creative, shift_spend and rollback are refused; stored actions of these types never run. Meta target proposals freeze counted_evidence over the last seven completed account-local days for display only. Evidence may cite get_inventory_metrics leaf fields for the proposed target: Meta inline link clicks, counted arrivals and Purchase count/value at that target’s own level. Spend, impressions, child-object rows, containers, ratios and other action types are refused.",
