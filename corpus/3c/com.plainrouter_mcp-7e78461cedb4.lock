        {
          "name": "get_performance",
          "title": "Get performance",
          "description": "Admissible proposal evidence: reconciliation meta_reported shows Meta dataset event totals beside gateway_verified events Plainrouter sent and Meta accepted. The separate purchases block shows Meta-reported Purchase counts under the account attribution setting beside Plainrouter accepted server-side Purchase counts, with its completed account-local window start and end dates and no purchase gap or status. purchases.plainrouter_accepted_purchases is null when it was not measured: the account timezone is missing or invalid, the account has no eligible destination, no account-local day of the purchase window is retained, or part of the window is older than retained delivery records; null means unavailable, while 0 is a measured zero. Includes stored daily Meta spend and delivery metrics. platform_claimed_clicks means Meta outbound clicks. Days before 2026-06-29, or not re-read by the daily sync since 2026-09-27, may still hold Meta link clicks or all clicks.\npurchases.basis_note explains how the two counts differ.\nbasis_note explains how the two counts differ.",
          "inputSchema": {
            "properties": {
              "account_id": {
                "description": "Advertising account ID. Signals reads use the workspace Meta destination when omitted; other tools may require an ID when multiple accounts are active.",
                "minimum": 1,
                "type": "integer"
              },
              "days": {
                "default": 7,
                "description": "Number of reporting days to compare, from 1 to 90.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "workspace_id": {
                "description": "Workspace ID returned by list_workspaces. Required when this credential reaches multiple workspaces.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "purchases": {
                "properties": {
