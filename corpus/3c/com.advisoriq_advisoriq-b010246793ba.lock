        {
          "name": "ria_market_stats",
          "title": "RIA market data",
          "description": "Market data on independent wealth management RIAs for the US or one state, as on AdvisorIQ's industry and state pages: number of firms, total and median regulatory assets under management, accounts, size bands, fee types and the other figures AdvisorIQ tracks, each with its definition, for the latest snapshot and, for SEC-registered firms (the history), the one a year earlier. Segment narrows it: all (default, SEC and state registered), sec or state. Set include_bd_affiliated for all wealth firms, wirehouses and other broker-dealer affiliated firms included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_bd_affiliated": {
                "description": "Optional, default false: also cover broker-dealer affiliated wealth firms (wirehouses, broker-dealers and their advisory arms, banks), which AdvisorIQ lists apart from independent RIAs",
