        {
          "name": "search_ria_firms",
          "title": "Find an RIA firm",
          "description": "Find independent wealth management RIAs (SEC or state registered) in AdvisorIQ's directory by part of the firm's name, its CRD number or SEC 801- number, or its main office city, optionally within one state. Returns at most 25 firms, best name matches first and then by assets, each with CRD, city, state, registration, regulatory assets under management and its AdvisorIQ page. Set include_bd_affiliated to also search broker-dealer affiliated wealth firms such as the wirehouses. Asset managers, private fund managers and pension consultants are not in the directory. Use it to get the CRD for get_ria_firm. Firm-level data only: it never returns individual advisers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_bd_affiliated": {
                "description": "Optional, default false: also cover broker-dealer affiliated wealth firms (wirehouses, broker-dealers and their advisory arms, banks), which AdvisorIQ lists apart from independent RIAs",
