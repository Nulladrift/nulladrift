        {
          "name": "get_ria_firm",
          "title": "One RIA firm's profile",
          "description": "One independent wealth management RIA's figures from its Form ADV, by CRD number: registration and status, location, website, regulatory assets under management (discretionary and not), accounts, clients and client types, employees and adviser representatives, fee types, services, affiliations, custody, whether it reported disclosures, growth over 1, 3 and 5 years, its national and state ranks among independent RIAs, and its yearly history from the SEC's files. A broker-dealer affiliated wealth firm (a wirehouse, a broker-dealer's advisory arm, a bank's) is returned only with include_bd_affiliated, ranked among all wealth firms. Asset managers and other firms outside wealth management are not in the directory. One firm per call; find the CRD with search_ria_firms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crd": {
                "description": "The firm's Organization CRD number, or its AdvisorIQ page URL",
                "type": ["integer", "string"]
              },
              "include_bd_affiliated": {
                "description": "Optional, default false: also cover broker-dealer affiliated wealth firms (wirehouses, broker-dealers and their advisory arms, banks), which AdvisorIQ lists apart from independent RIAs",
                "type": "boolean"
              }
            },
            "required": ["crd"],
            "type": "object"
          },
          "annotations": {
