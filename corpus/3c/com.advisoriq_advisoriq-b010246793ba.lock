      "capabilities": {
        "tools": {}
      },
      "instructions": "Continuing education requirements for US financial advisors (CFP, CIMA, CPWA, RMA, CIMC, CFA and state IAR CE), a CE calculator, compliance deadlines, AdvisorIQ webinars, replays and research, and AdvisorIQ's RIA directory: firm-level Form ADV data on independent wealth management RIAs, with broker-dealer affiliated wealth firms such as the wirehouses when a call sets include_bd_affiliated (firm search, one firm's profile, national and state rankings, market data); asset managers are not in it. Every answer carries the official source and checked date of each figure and a ready citation string with the AdvisorIQ page address: use it. These tools refuse rather than guess when a rule is not confirmed, so an error means AdvisorIQ does not state that; do not fill the gap from memory. Requirements are summaries; the designation body or state regulator has the final word.",
      "tools": [
        {
          "name": "ce_calculate",
          "title": "Calculate CE owed",
          "description": "What an advisor owes this cycle for a set of designations, with the deadline and days left, computed by the same engine as AdvisorIQ's CE calculator. CFP, CIMA, CPWA, RMA and American College (ChFC, CLU, RICP and others) cycles depend on the advisor's own dates: pass period_ends (for example {\"CFP\": \"2027-06\"} for a CFP cycle ending June 2027, or a full YYYY-MM-DD date; an American College period always ends December 31). IAR needs the state where the advisor is registered. FINRA is not calculated: its Regulatory Element is assigned content with no hour count (use ce_requirements). A line whose rule is not confirmed is refused, not estimated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "designations": {
                "description": "Designation codes, e.g. [\"CFP\", \"IAR\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "period_ends": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Cycle end per designation code, YYYY-MM or YYYY-MM-DD",
                "type": "object"
              },
              "state": {
                "description": "Two-letter code or name of the state of IAR registration",
                "type": "string"
              }
            },
            "required": ["designations"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate CE owed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c31c5944753023c3029b619df7170ab27018ab2883520d3cad110fdc34880a0d"
        },
        {
          "name": "ce_requirements",
          "title": "CE requirements for a designation",
          "description": "The continuing education rule for one designation as AdvisorIQ has confirmed it from the body that sets it: hours or credits per cycle, category minimums (ethics and others), how the cycle is set, carryover, any version taking effect later, each with its source URL, a short quote and the date checked, plus the questions still open. Designations: CFP, CIMA, CPWA, RMA, CIMC, CFA, The American College's ChFC, CLU, RICP, CAP, CASL, ChSNC, CLF, FSCP, TPCP, WMCP and DAFCP, IAR (state IAR CE; use iar_ce_state for one state), or FINRA (registered representatives; MQP for FINRA's Maintaining Qualifications Program). IWI returns CIMA, CPWA, RMA and CIMC together; American College returns all of The College's designations; FINRA's guide key returns FINRA and MQP. FINRA's Regulatory Element has no hour count: its answer has measure \"assigned\" and no total, never a number of hours. Refuses when the rule is not confirmed; never guesses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "designation": {
                "description": "CFP, CIMA, CPWA, RMA, CIMC, CFA, ChFC, CLU, RICP (or another American College designation), IAR, FINRA, MQP, IWI or American College",
                "type": "string"
              }
            },
            "required": ["designation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CE requirements for a designation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:adfc81d2e9b00552188a102d889a3f299d8afaaa97898d1493daedd80026822b"
        },
        {
          "name": "compliance_deadlines",
          "title": "Compliance deadlines",
          "description": "Confirmed regulatory and CE deadlines for advisers and their firms between two dates (default: today to a year out), each with the rule that sets the date, its official source and the date checked. Filter with applies_to: ria (investment adviser firms), iar (investment adviser representatives), rep (FINRA registered representatives), 13f (13F filers), private_funds (private fund advisers). Deadlines not yet confirmed are withheld and counted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "applies_to": {
                "description": "Audiences; any match",
                "items": {
                  "enum": ["ria", "iar", "rep", "13f", "private_funds"],
                  "type": "string"
                },
                "type": "array"
              },
              "from": {
                "description": "YYYY-MM-DD, default today (Eastern)",
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD, default one year after from",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compliance deadlines"
          },
          "behavior": {
