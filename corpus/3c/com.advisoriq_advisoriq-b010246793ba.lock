          "title": "RIA rankings",
          "description": "A ranking of independent wealth management RIAs, national or within one state, as AdvisorIQ computes it from Form ADV (for example the largest by assets, or the fastest growing), with how it is computed. Returns up to 100 firms (default 25) with rank, CRD, city, state, value and, for growth rankings, the starting value. Set include_bd_affiliated for the ranking of all wealth firms, wirehouses and other broker-dealer affiliated firms included. An unknown metric returns the list of rankings.",
          "inputSchema": {
            "additionalProperties": false,
