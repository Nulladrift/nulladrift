        {
          "name": "list_categories",
          "title": "Lister les catégories",
          "description": "Liste les catégories du catalogue de destockage-habitat.com et leur nombre d'offres, un niveau à la fois : sans parent, les catégories de premier niveau ; avec parent, ses sous-catégories. Le path rendu se passe tel quel en category à search_products, ou en parent pour descendre d'un niveau.",
