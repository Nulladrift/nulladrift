        {
          "name": "search_products",
          "title": "Chercher des offres",
          "description": "Cherche des offres de matériaux de construction, bricolage et aménagement en déstockage vendues sur destockage-habitat.com (France), par mots-clés (nom, marque, référence, EAN), catégorie, prix, mode de livraison ou code postal. Rend le prix particulier TTC, le stock, les villes de retrait et le lien vers la fiche, où se fait l'achat. Les offres réservées aux professionnels sortent sans prix.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Chemin exact de catégorie, tel que rendu dans category_path (ex. « Peinture > Peinture de rénovation »).",
                "maxLength": 200,
                "type": "string"
              },
              "delivery": {
                "default": "any",
                "description": "any : tout ; deliverable : livrable ; pickup : à retirer.",
                "enum": ["any", "deliverable", "pickup"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Prix maximal, en euros TTC. Écarte les offres réservées aux pros.",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Prix minimal, en euros TTC. Écarte les offres réservées aux pros.",
                "minimum": 0,
                "type": "number"
              },
              "page": {
                "default": 0,
                "description": "Page de résultats, à partir de 0.",
                "maximum": 1999,
                "minimum": 0,
                "type": "integer"
              },
              "postal_code": {
                "description": "Code postal français : offres à retirer autour de ce lieu (offres déstock seulement, comme sur le site).",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "query": {
                "description": "Mots-clés : nom, marque, référence ou EAN.",
                "maxLength": 200,
                "type": "string"
              },
              "radius_km": {
                "default": 20,
                "description": "Rayon autour du code postal, en km.",
                "enum": [10, 20, 50, 100],
                "type": "integer"
              }
