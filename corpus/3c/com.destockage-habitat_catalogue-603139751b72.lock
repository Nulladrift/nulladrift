      "instructions": "Catalogue des offres en déstockage de destockage-habitat.com (matériaux de construction, bricolage, aménagement, France). Prix particuliers TTC ; l'achat se fait sur le site, par le lien de chaque offre.",
      "tools": [
        {
          "name": "get_delivery_options",
          "title": "Frais de port d'une offre",
          "description": "Rend les modes de livraison et de retrait d'une offre de destockage-habitat.com (offer_id rendu par search_products) vers un code postal français : transporteur, prix TTC pour la quantité demandée, dates de livraison estimées, ville du retrait. Une offre réservée aux professionnels sort sans frais.",
          "inputSchema": {
            "properties": {
              "offer_id": {
                "description": "Identifiant de l'offre (offer_id de search_products).",
                "pattern": "^\\d{1,12}(-\\d{1,12})?$",
                "type": "string"
              },
              "postal_code": {
                "description": "Code postal français de livraison.",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "quantity": {
                "description": "Quantité strictement supérieure à 0, dans l'unité de vente de l'offre (price.per_unit), au plus le stock. Défaut : 1.",
                "maximum": 10000000,
                "type": "number"
              }
            },
            "required": ["offer_id", "postal_code"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "description": "Pourquoi la liste est vide, le cas échéant.",
                "type": ["string", "null"]
              },
              "offer_id": {
                "type": "string"
              },
              "options": {
                "items": {
                  "properties": {
                    "carrier": {
                      "type": "string"
                    },
                    "max_delivery_date": {
                      "description": "Date AAAA-MM-JJ.",
                      "type": "string"
                    },
                    "min_delivery_date": {
                      "description": "Date AAAA-MM-JJ.",
                      "type": "string"
                    },
                    "pickup_cities": {
                      "description": "Villes du retrait (type pickup), jamais l'adresse.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "price_tax_incl": {
                      "description": "Frais de port TTC, en euros, pour la quantité demandée.",
                      "type": "number"
                    },
                    "type": {
                      "enum": ["delivery", "pickup"],
                      "type": "string"
                    }
                  },
                  "required": ["carrier", "max_delivery_date", "min_delivery_date", "pickup_cities", "price_tax_incl", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "postal_code": {
                "type": "string"
              },
              "pro_notice": {
                "type": ["string", "null"]
              },
              "pro_reserved": {
                "description": "Vrai : offre réservée aux professionnels, frais visibles avec un compte pro sur le site.",
                "type": "boolean"
              },
              "quantity": {
                "type": "number"
              },
              "unit": {
                "type": ["string", "null"]
              },
              "url": {
                "description": "Fiche de l'offre, où se fait l'achat.",
                "type": ["string", "null"]
              }
            },
            "required": ["offer_id", "options", "postal_code", "pro_reserved", "quantity"],
            "type": "object"
          },
