      "instructions": "Goal Race is a public race calendar, and for a person who signs in, their own race calendar and training log.\n\n**No account needed.** search_races, get_race, list_race_filters find and open races for anyone, with no sign-in. For example: \"a 50k trail race in Spain in May\", \"Hyrox in London\", \"Spartan Beast near Munich this autumn\", \"obstacle races in Italy in May\", \"a HYROX near Amsterdam this spring\".\n\n**Account needed.** Every other tool reads or writes the person's own calendar (saved races, sessions, notes, blocks, profile) and needs a free Goal Race account. When one of them is called without an account, the app shows a sign-in card. Once the person says they have signed in, call the same tool again: the call is not retried by itself. A sign-in error on one of these means \"not signed in\", never \"not connected\": the connector works and race search still answers. Asked whether Goal Race is connected, answer from search_races, and say signing in is only needed to save races or read their own calendar.\n\n**Units with no account.** Distances and climb are metric (metres and km); show them the way the person writes.\n\n**Dates.** Every date in and out of these tools is a local calendar date (YYYY-MM-DD) in the user's own time zone. get_calendar returns that date, the weekday and the local time: resolve \"today\", \"tomorrow\", \"Sunday\" and \"race week\" against it, never against your own clock. When it reports timezone_is_default, the user has not set a time zone and every date is a guess — ask where they are and save it with update_profile before you trust one.\n\n**Reading.** get_calendar is the one call for where the user is, what is planned and which races are coming. get_training_log is what they actually did. Say a day back with its weekday (\"Saturday 16 May\"), not the number alone.\n\n**Writing.** add_sessions takes a whole week in one call, and dry_run: true shows it before anything is written. remove_sessions, remove_race and delete_note cannot be undone: name what will go and confirm, unless the user has clearly asked for it already. remove_sessions previews first whenever it would take more than one session.\n\n**Training blocks.** When the user describes what they are working on for a stretch of weeks (\"the next six weeks I focus on speed\", \"until Spartan Beast\"), offer add_block: a name, the dates, one line of goal. The sessions are still added separately with add_sessions — a block never owns them. Blocks may run alongside each other, but only one is the day's main block; add_block refuses a second one and names the block in the way. get_calendar and get_training_log say which block the day sits in and which week of it, so review the week against the block's goal.\n\n**Races.** search_races finds anything the site lists, get_race opens one, save_race puts it on the user's list, add_custom_race covers a race the site does not list. Link a race's url when you mention it. A race already on the list is changed with update_race (signed up, the date moved, another wave), never removed and added again: that loses its notes, plans and links. get_trip is one race on the user's list in depth; save_trip_plan keeps what was planned for it (race plan, fuelling, gear, travel, stay), so it is there next time.\n\n**The athlete.** get_profile is where the user lives, their time zone, their units and the kinds of race they look for; update_profile changes them when the user says so.\n\n**Google Calendar.** Where the user has it connected, the session tools write there too, update_race moves the race's event, and remove_race deletes it. Never put the same session into Google through another tool as well, or the user gets it twice.\n\n**Reading a result.** Empty fields are left out rather than sent as null, and `unknown` names them: a missing distance is unknown, never zero. Handles are named for what they open — session_id, note_id, race_slug, race_id.",
      "tools": [
        {
          "name": "add_block",
          "title": "Start a training block",
          "description": "Put a training block on the calendar: a named stretch of weeks with one goal — 'Weight loss, 9 Nov to 28 Feb', 'Calf strength', 'Speed & power, 6 weeks'. Use it when the user says what they are working on for a run of weeks, or builds to a race. The sessions themselves are still add_sessions: a block never owns them, it says what the weeks are for. Send weeks (how many it runs) or end_date. Any weekday may start it. Blocks may run alongside each other, but a day has one main block: with main true this refuses if another main block covers the same days, and names it. Set main false for the one that runs alongside (\"strength held at maintenance\"). All dates are the user's local calendar dates (YYYY-MM-DD) in their own time zone. Requires signing in.",
          "inputSchema": {
            "properties": {
              "colour": {
                "description": "The band's tick colour, from the calendar's session palette. Default 'run'.",
                "enum": ["run", "strength", "ocr", "hike", "bike", "swim", "mobility", "carries", "boulder", "stairs", "grey"],
                "type": "string"
              },
              "end_date": {
                "description": "Last day, YYYY-MM-DD. Send this or weeks.",
                "type": "string"
              },
              "goal": {
                "description": "One line, e.g. '5 x 1 km at 4:30/km by week 6'. Max 200 characters. Optional.",
                "type": "string"
              },
              "main": {
                "description": "True (default) for the block these weeks belong to; false for one running alongside it.",
                "type": "boolean"
              },
              "name": {
                "description": "What the user calls it, e.g. 'Weight loss', 'Speed & power'. Max 80 characters.",
                "type": "string"
              },
              "notes": {
                "description": "The progression, the weekly rules, what is held at maintenance. Markdown allowed. Optional.",
                "type": "string"
              },
              "race_id": {
                "description": "The race this block builds to (race_id from get_calendar). Optional.",
                "type": "string"
              },
              "start_date": {
                "description": "First day, YYYY-MM-DD. Defaults to today.",
                "type": "string"
              },
              "weeks": {
                "description": "How many weeks it runs from start_date. Send this or end_date.",
                "type": "number"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a training block"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
