          "digest": "sha256:bfdd310687f9b74bc522bc41e85cf0bc2ca23df7494c8fb49dde7b15e1fd104d"
        },
        {
          "name": "add_custom_race",
          "title": "Add a race we do not list",
          "description": "Put a race search_races does not list (a trail race, a road marathon, a local event, anything) on the user's Goal Race list, the same list save_race writes to. Search first; use this only when the race is not in the results. A race the site does list still goes in as that race (linked to its page, with the status and format you pass), and the result says so in listed_race: tell the user. A date is required: a race without one has no place on a calendar. When the organiser has not announced it, ask the user for their best guess and pass date_confirmed: false — the race then goes in with status 'monitoring', and nothing writes 'TBC' into the title. status is one of wishlist, registered, monitoring, booking, estimating: 'wishlist' by default, 'registered' when the user has already signed up. A race already on the user's list (get_calendar shows it) is changed with update_race, not added again. One race per call. All dates are the user's local calendar dates (YYYY-MM-DD) in their own time zone. Requires signing in.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Race day, YYYY-MM-DD. Required.",
                "type": "string"
              },
              "date_confirmed": {
                "description": "False when the date is the user's guess rather than the organiser's announcement. Default true.",
                "type": "boolean"
              },
              "format": {
                "description": "Wave or distance the user picked, e.g. '42K'. Omit when they did not say.",
                "type": "string"
              },
              "location": {
                "description": "Town and country, e.g. 'Chamonix, France'. Omit when unknown.",
                "type": "string"
              },
              "not_listed": {
                "description": "Only after this tool answered with a listed race the user says is a different one: true adds the race as typed. Leave out otherwise.",
                "type": "boolean"
              },
              "status": {
                "description": "'wishlist': On the list, not signed up. The default. 'registered': Signed up and paid. 'monitoring': Watching it: the date or the registration is not settled yet. 'booking': Booking travel and beds for it. 'estimating': Working out what it will cost.",
                "enum": ["wishlist", "registered", "monitoring", "booking", "estimating"],
                "type": "string"
              },
              "title": {
                "description": "Race name as the user says it, year included if they said it. Max 200 chars. No 'TBC'.",
                "type": "string"
              },
              "url": {
                "description": "The organiser's page, absolute http(s) url. Omit when unknown.",
                "type": "string"
              }
            },
            "required": ["date", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a race we do not list"
