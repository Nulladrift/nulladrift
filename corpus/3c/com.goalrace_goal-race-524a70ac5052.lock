        {
          "name": "add_sessions",
          "title": "Add training sessions",
          "description": "Put one or more training sessions on the user's calendar in a single call: a list of up to 30, each with at least a date. dry_run: true returns what would be written, with the weekday of each day and the sessions already there, and writes nothing. Pick the closest type from the list and put the workout itself in notes. A whole training block is add_training_plan, not this. Where the user has Google Calendar connected, each session is written there too. All dates are the user's local calendar dates (YYYY-MM-DD) in their own time zone. Requires signing in.",
          "inputSchema": {
            "properties": {
              "dry_run": {
                "description": "True shows what would be written and writes nothing.",
                "type": "boolean"
              },
              "sessions": {
                "description": "The sessions to add, in any order.",
                "items": {
                  "properties": {
                    "date": {
                      "description": "Local date, YYYY-MM-DD.",
                      "type": "string"
                    },
                    "distance_m": {
                      "description": "Planned distance in metres (10 km = 10000).",
                      "type": "number"
                    },
                    "duration_min": {
                      "description": "Planned duration in minutes.",
                      "type": "number"
                    },
                    "elevation_m": {
                      "description": "Planned vertical gain in metres.",
                      "type": "number"
                    },
                    "notes": {
                      "description": "The workout: sets, paces, what to focus on.",
                      "type": "string"
                    },
                    "tags": {
                      "description": "Short lowercase labels, e.g. ['hills', 'key'].",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "time": {
                      "description": "Start time HH:mm on a 24-hour clock, e.g. '07:00'.",
                      "type": "string"
                    },
                    "title": {
                      "description": "Short title, e.g. 'Hill repeats'. Defaults to the type.",
                      "type": "string"
                    },
                    "type": {
                      "description": "Session type.",
                      "enum": ["run", "ocr", "boulder", "strength", "carries", "hike", "stairs", "bike", "swim", "mobility", "rest", "other"],
                      "type": "string"
                    }
                  },
                  "required": ["date"],
                  "type": "object"
                },
                "type": "array"
