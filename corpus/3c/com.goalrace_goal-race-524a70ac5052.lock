        {
          "name": "update_race",
          "title": "Change a race on the list",
          "description": "Change one race already on the user's list, in place: the status (\"I signed up\" → registered), the race day (\"it moved to 12 June\"), the wave or distance, the town, the organiser's url. Pass race_id from get_calendar and only the fields that change. The race stays the same race on the list: its notes, saved plans, links, hotels, flights and sessions are kept, so never remove_race and add it again to change it. A new date moves the end date with it; sessions stay where they are (offer update_session if the plan counted back from race day). Where the user has Google Calendar connected, the race's event follows. All dates are the user's local calendar dates (YYYY-MM-DD) in their own time zone. Requires signing in.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "New race day, YYYY-MM-DD.",
                "type": "string"
              },
              "date_confirmed": {
                "description": "False when the new date is the user's guess: a race on the list as 'wishlist' becomes 'monitoring'; any other status stays.",
                "type": "boolean"
              },
              "end_date": {
                "description": "New last day, YYYY-MM-DD, for a race over several days. Omit to keep the race's length.",
                "type": "string"
              },
              "format": {
                "description": "Wave or distance, e.g. 'Sprint 5K'. Replaces the one in the name; '' takes it off.",
                "type": "string"
              },
              "location": {
                "description": "Town and country, e.g. 'Chamonix, France'.",
                "type": "string"
              },
              "race_id": {
                "description": "id of the race on the user's list, from get_calendar.",
                "type": "string"
              },
              "race_slug": {
                "description": "brand/year/slug from get_calendar, when there is no race_id.",
                "type": "string"
              },
              "status": {
                "description": "'wishlist': On the list, not signed up. The default. 'registered': Signed up and paid. 'monitoring': Watching it: the date or the registration is not settled yet. 'booking': Booking travel and beds for it. 'estimating': Working out what it will cost.",
                "enum": ["wishlist", "registered", "monitoring", "booking", "estimating"],
                "type": "string"
              },
              "url": {
                "description": "The organiser's page, absolute http(s) url. '' clears it.",
                "type": "string"
              }
