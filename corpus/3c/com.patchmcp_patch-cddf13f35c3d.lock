      "instructions": "Start with get_capabilities for account management and permissions. Patch MCP lets you place real phone calls from the selected outbound number, using the default number when number_id is omitted. If place_call returns caller_id_not_verified, share verification_url and ask the user to complete caller ID verification there, then retry their call. Never collect verification codes in chat. Use get_phone_number without number_id for the default outbound caller ID; it returns phone_number in E.164 format and caller_id_status. With the phone workspace enabled, list_phone_numbers lists available sources; pass number_id to place_call to choose an enabled, published outbound number. Use place_call with a precise objective (include names, dates, times, quantities and acceptable fallbacks). Supply the optional callee local IANA timezone in timezone when known from reliable context (for example America/Chicago). If omitted, Patch uses phone-prefix timezone metadata when it identifies one zone, otherwise America/Chicago. Phone metadata can be inaccurate for moved or ported numbers. If the client supports MCP Events webhooks, subscribe to call.resolved for the final result (call.completed reports hangup earlier). Otherwise poll get_call with wait_seconds until the status is terminal and read the resolution. Calls use the optional place_call.locale (for example en-US, es-MX, pt-BR, fr, it, ru, pl, uk, ro, nl, de), otherwise the selected source’s published language in the phone workspace, then the supported account locale or en-US. The objective and context may use another language. The resolved locale, language and voice are returned by place_call and get_call. The locale applies only to that call; the selected language stays fixed for the entire call. Calling supports Central America, Europe, North America, and South America, subject to route availability. place_call checks route availability and returns an estimated one-minute provider cost when a call is placed. Free calls require both the connected caller ID and destination to be US/Canadian; calls involving any other number require a paid plan from the first call. Calls are private by default. Use set_call_visibility only when the user explicitly asks to publish or make a call private; public calls have permanent token-free links accessible to anyone while public. Always offer the listen_url to the user. Never place calls to emergency services, and relay policy rejections to the user instead of retrying. The default opening says who the voice agent is calling for and states the call's purpose. Use get_agent and update_agent for active number settings and inbound greeting/instructions. Patch internal system prompts and outbound greeting/instructions are not exposed through MCP; use place_call objective and context for call-specific facts. Changes apply directly to new calls. Call facts are added automatically. The recording disclosure belongs in the first spoken turn that advances the objective, whether asking a question, making a request, or giving task-related details. Brief introductory chatter or an acknowledgment of a request to hold may come first. Naturally include “on a recorded line” in the introduction or response, using a natural equivalent in the selected call language. There is no separate opening or agent_instructions argument on place_call. If place_call fails with user_name_required, ask your user what name to give and call again with it in user_name — it is stored on the account for future calls. Calls can go out at any time of day, any day of the week; the user is responsible for fair use. Call availability and duration depend on the connected account entitlement. Usage estimates are rechecked before dialing. When a call is unavailable, explain the returned reason, remaining allowance and reset time without repeated retries. If the call response includes upgrade_url, share that link so the user can choose a plan. With billing:manage and user authorization, use preview_subscription_change to show the exact charges, recurring terms and limits, then execute_subscription_change only after approval of that quote, passing user_authorized=true to record that approval; otherwise share the payment link. Never infer permission to spend.",
