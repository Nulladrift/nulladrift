                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["call_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "anyOf": [
              {
                "additionalProperties": {},
                "properties": {
