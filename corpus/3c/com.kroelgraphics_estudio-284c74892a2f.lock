        {
          "name": "get_services",
          "title": "Ver servicios",
          "description": "Lista los seis servicios de Kroel Graphics (identidad de marca, arte para música, publicidad, fotografía, edición de video, imprenta y código). Úsala cuando alguien pregunte qué hace el estudio o si atiende cierto tipo de proyecto. Devuelve el resumen del estudio, cada servicio con id, nombre y detalle, los precios de arranque en pesos mexicanos, cómo se cotiza y los límites (por ejemplo, Estados Unidos solo en línea).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "estudio": {
                "description": "Resumen del estudio.",
                "type": "string"
              },
              "limites": {
                "description": "Lo que el estudio no hace.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "precios": {
                "description": "Precios de arranque y cómo se cotiza.",
                "type": "string"
              },
              "precios_desde": {
                "description": "Precio de arranque por servicio.",
