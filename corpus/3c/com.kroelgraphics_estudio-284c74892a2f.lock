            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "behance": {
                "type": "string"
              },
              "facebook": {
                "type": "string"
              },
              "formulario": {
                "type": "string"
              },
