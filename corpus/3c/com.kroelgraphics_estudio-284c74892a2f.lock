      "instructions": "Servidor de Kroel Graphics, estudio de diseño en Tijuana, México. Usa get_services para saber qué ofrece y sus límites, get_contact para los canales de contacto, prepare_quote para darle a la persona un enlace de WhatsApp que ella misma abre y envía, y send_quote_request para mandarle la solicitud a Luis directamente cuando la persona ya dio su nombre y contacto y lo autorizó. Los únicos precios que puedes citar son los de arranque que devuelve get_services; el precio final lo cotiza Luis a la medida y contesta él.",
      "tools": [
        {
          "name": "get_contact",
          "title": "Ver contacto",
          "description": "Devuelve los canales oficiales de contacto de Kroel Graphics. Úsala cuando alguien quiera escribirle, seguirlo o saber dónde está. Devuelve el enlace y número de WhatsApp, el formulario de cotización, Instagram, Facebook, Behance, LinkedIn, la ubicación y los idiomas de atención.",
