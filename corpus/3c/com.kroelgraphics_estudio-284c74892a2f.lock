          "digest": "sha256:369fe78be44f0eeb2e78301932de46aeb475563e571e9be561aaba7ad14ef0c9"
        },
        {
          "name": "send_quote_request",
          "title": "Enviar solicitud de cotización",
          "description": "Envía a Luis una solicitud de cotización a nombre de una persona, con su permiso. Úsala cuando la persona ya dio su nombre, un contacto (WhatsApp o correo) y lo que necesita, y quiere que Luis le escriba. Devuelve un id, el estado \"recibida\" y la dirección para consultarlo. La respuesta no trae precio: Luis contesta después con la cotización exacta. Con prueba=true valida sin guardar nada.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agente": {
                "description": "Nombre del asistente que la envía.",
                "type": "string"
              },
              "contacto": {
                "description": "WhatsApp, teléfono o correo de la persona.",
                "type": "string"
              },
              "detalle": {
                "description": "Qué necesita (mínimo 10 caracteres).",
                "type": "string"
              },
              "fecha": {
                "description": "Para cuándo lo necesita.",
                "type": "string"
              },
              "nombre": {
                "description": "Nombre de la persona que solicita.",
                "type": "string"
              },
              "presupuesto": {
                "description": "Presupuesto aproximado, si lo dio.",
                "type": "string"
              },
              "prueba": {
                "description": "true = solo validar, sin guardar ni avisar a nadie.",
                "type": "boolean"
              },
              "servicio": {
                "description": "Servicio de interés (nombres de get_services).",
                "type": "string"
              }
            },
            "required": ["contacto", "detalle", "nombre"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "recibida_en": {
                "type": "string"
              },
              "sandbox": {
                "type": "boolean"
              },
              "siguiente_paso": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "status_url": {
                "type": "string"
              }
            },
            "required": ["id", "status"],
            "type": "object"
          },
