        {
          "name": "prepare_quote",
          "title": "Preparar cotización",
          "description": "Arma el mensaje de una solicitud de cotización para Kroel Graphics. Úsala cuando la persona ya decidió pedir precio y tienes su nombre y su idea. Devuelve el texto del mensaje y un enlace de WhatsApp con ese texto ya escrito. No envía nada: la persona debe abrir el enlace y confirmar el envío.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fecha": {
                "description": "Fecha de entrega deseada.",
                "type": "string"
              },
              "idea": {
                "description": "Descripción del proyecto.",
                "type": "string"
              },
              "nombre": {
                "description": "Nombre de quien solicita.",
                "type": "string"
              },
              "presupuesto": {
                "description": "Presupuesto aproximado (opcional).",
                "type": "string"
              },
              "servicios": {
                "description": "Servicios que necesita (nombres de get_services).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["idea", "nombre"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "enlace": {
                "description": "Enlace de WhatsApp con el mensaje escrito.",
                "type": "string"
              },
              "mensaje": {
                "description": "Texto de la solicitud.",
                "type": "string"
              },
              "nota": {
                "type": "string"
              }
            },
            "required": ["enlace", "mensaje"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
