        {
          "name": "consultas",
          "title": "Consultas: índices, dólar, imposto e fundos",
          "description": "Consultas de dado: juros, inflação e outros índices, o dólar, as regras do imposto, os fundos e onde guardar dinheiro — o que já aconteceu e o que o mercado precifica, sem previsão.\nChame com 'consulta' e, se ela pedir, 'argumentos'; sem os argumentos que ela precisa, a resposta diz o que falta.\nConsultas:\n- premissas_de_mercado: Mostra os dados de mercado que o Jabs usa hoje nas contas: CDI, Selic, IPCA em 12 meses, TR, juros prefixados e IPCA+ e dolar, com data e fonte.\n- cotacao_do_dolar: O dolar de hoje (PTAX), quanto variou no mes, no ano e em 12 meses, e a volatilidade. Argumentos: moeda.\n- dolar_no_passado: Quanto um valor em reais passado para dolar numa data teria hoje: o dolar parado e o dolar em Treasury de curto prazo, contra o mesmo dinheiro no CDI, sem custos nem imposto. Argumentos: de, valor.\n- taxa_equivalente: A taxa que EMPATA com um papel de renda fixa em outro papel ou indexador, ja sem o imposto: 'qual CDB empata com uma LCA de 95% do CDI que vence em 2028?', 'a partir de quantos % do CDI um CDB ganha da LCA?', 'LCI de 92% do CDI equivale a quanto num CDB?', 'que prefixado vale o mesmo que IPCA + 6%?'. Argumentos: produto, indexador, taxa, vencimento, alvo_produto, alvo_indexador.\n- projecao_de_valor: Quanto um valor vale numa data FUTURA pelo que o mercado precifica hoje: corrigido pela inflacao esperada (IPCA implicito nos titulos do Tesouro) e aplicado no CDI esperado. Argumentos: ate, valor.\n- regras_de_imposto: A tabela vigente de um imposto sobre investimentos ou salario, com a lei. Argumentos: tema.\n- panorama_da_classe: Como os fundos de uma classe renderam num periodo: a mediana, a distribuicao do retorno, da volatilidade e do Sharpe, e quantos bateram o CDI. Argumentos: classe, meses.\n- tabela_do_itcmd: A TABELA do ITCMD (imposto sobre heranca e doacao) de UM estado: as faixas, as aliquotas e a lei estadual. Argumentos: uf, tipo.\n- reserva_de_emergencia: RESERVA DE EMERGENCIA: de quanto ela deve ser -- de 3 a 6 meses do gasto, numa tabela, sem formulario. Argumentos: gasto_mensal, ja_guardado, renda_mensal, ordem.\n- onde_guardar: ONDE GUARDAR dinheiro que se pode precisar a qualquer hora: poupanca, Tesouro Reserva e CDB de liquidez diaria lado a lado, o rendimento ja sem imposto em 1 mes, 6 meses, 1 e 2 anos (ou ate a data dita). Argumentos: valor, ate, meta.\n- comecar_a_investir: POR ONDE COMECAR A INVESTIR: a ordem (1 mes do gasto de colchao, a divida cara, a reserva de emergencia, os objetivos pelo prazo), quanto do valor da pessoa vai a cada passo e onde fica cada prazo pelo tipo de investimento, sem indicar papel. Argumentos: valor, gasto_mensal, renda_mensal, tem_divida_cara, ja_tem_reserva.\n- curva_de_mercado: O CDI e o IPCA que o mercado precifica hoje, ano a ano ou mês a mês, e o juro real entre eles: a curva prefixada e a inflação implícita do Tesouro, com o que se supõe depois do último vencimento. Argumentos: anos, mensal.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "argumentos": {
                "additionalProperties": true,
                "description": "Os argumentos da consulta, se ela pedir.",
                "type": "object"
              },
              "consulta": {
                "description": "Qual consulta, da lista da descrição.",
                "enum": ["premissas_de_mercado", "cotacao_do_dolar", "dolar_no_passado", "taxa_equivalente", "projecao_de_valor", "regras_de_imposto", "panorama_da_classe", "tabela_do_itcmd", "reserva_de_emergencia", "onde_guardar", "comecar_a_investir", "curva_de_mercado"],
                "type": "string"
