          "description": "Aposentadoria: INSS, previdência privada e quanto juntar para parar.\nChame primeiro só com 'calculadora' para receber o formulário dela; depois, com 'calculadora' e 'dados', para a conta.\nCalculadoras:\n- aposentadoria: Aposentadoria: quanto juntar e quando dá para parar. Responde: Para parar na idade escolhida, guarde por mês.\n- beneficio_do_inss: Quanto vou receber do INSS. Responde: O INSS pagaria por mês, em dinheiro de hoje.\n- contribuir_ao_inss: Pagar INSS por conta: 5 %, 11 % ou 20 %. Responde: No plano de 11 %, o que você paga volta em.\n- compare_plans: PGBL ou VGBL: qual deixa mais no fim. Responde: No resgate, o melhor dos planos deixa.\n- liberdade_financeira: Liberdade financeira: quanto juntar para viver de renda. Responde: Seu número da liberdade.",
