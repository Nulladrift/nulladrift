          "description": "Dívidas e empréstimos: quitar, trocar ou organizar dívidas, e o custo dos juros.\nChame primeiro só com 'calculadora' para receber o formulário dela; depois, com 'calculadora' e 'dados', para a conta.\nCalculadoras:\n- payoff_amount: Quitar, amortizar ou trocar a dívida de banco. Responde: Saldo para quitar hoje.\n- minha_taxa_e_alta: Minha taxa de juros é alta? Responde: Sua taxa passa da média do mercado, ao mês, em.\n- overdraft_cost: Quanto o cheque especial ou o rotativo custa. Responde: O que a dívida cobra em um mês, juros e IOF.\n- debt_swap: Trocar as dívidas caras por um empréstimo. Responde: A diferença entre os dois caminhos, até o fim do crédito novo.\n- qual_divida_primeiro: Qual dívida pagar primeiro. Responde: Somando as dívidas, você deve hoje.\n- superendividamento: Estou superendividado? Responde: Depois das parcelas de consumo, sobram por mês.\n- payroll_loan_margin: Quanto posso pegar de consignado. Responde: O maior empréstimo que a parcela livre paga.\n- antecipar_recebimento: Antecipar FGTS, restituição ou 13º. Responde: Antecipar custa.\n- emprestar_a_familiar: Emprestar a um familiar. Responde: Parcela por mês.",
