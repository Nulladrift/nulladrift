        {
          "name": "fundos",
          "title": "Fundos: a ficha na CVM e os documentos",
          "description": "Fundos de investimento brasileiros (FIF, FII, FIDC, FIP, Fiagro) pelo que está registrado na CVM: quem administra, gere, custodia e audita, público-alvo, classificação, patrimônio, a taxa de fato cobrada, e os documentos do fundo (regulamento, anexos, fatos relevantes, assembleias, demonstrações), com link e leitura do texto.\nConsultas:\n- buscar: acha o fundo. Argumento: texto (nome, gestora, administrador ou CNPJ).\n- ficha: a ficha de um fundo. Argumento: cnpj (ou texto, se o nome achar um só). Vários de uma vez: cnpjs (lista, até 25), e a resposta é uma tabela com um fundo por linha.\n- documentos: os documentos de um fundo, com o link de cada um. Argumentos: cnpj; tipo (opcional: 'regulamento', 'fato relevante'...).\n- ler_documento: o texto de um documento. Argumentos: cnpj; arquivo (o da lista de documentos; sem ele, o regulamento vigente); busca (uma palavra ou expressão: volta só os trechos que a têm, ex.: 'limite', 'taxa de performance'); pagina (de onde continuar).\n- limites: os limites de enquadramento de um fundo, de três fontes: o que ele declarou à CVM (extrato, em tabela), os quadros de limite do regulamento vigente (o texto das páginas, com o alinhamento do PDF, para você montar a tabela e citar a página) e o que a Resolução CVM 175 permite para o público do fundo, com o artigo. Argumento: cnpj. Vários de uma vez: cnpjs (lista, até 25) — aí vem só o declarado à CVM, numa tabela com um fundo por linha; os quadros do regulamento são de um fundo por chamada (cada um tem páginas de texto).\n- comparar: de 2 a 10 fundos lado a lado, uma coluna por fundo: as características e os limites do regulamento agrupados em categorias comuns (emissor, tipo de ativo, operações), com a página. Argumentos: cnpjs; assunto (opcional: tudo, caracteristicas, limites, emissor, ativos, operacoes ou uma categoria, como credito_privado); so_diferencas (opcional). 'não achado' não quer dizer proibido.\n- carteira: um fundo, os limites contra a carteira agregada do último mês em que ele tem todas as posições abertas na CVM: o peso por categoria e o maior emissor de cada classe, com a situação. É indício, não parecer de enquadramento. Argumento: cnpj.\nNão há histórico: é sempre o cadastro e os documentos mais recentes.\nQuanto gasta: buscar, ficha, documentos e limites com cnpjs, uma conta; limites de um fundo, comparar, carteira e ler_documento, que trazem o que o Jabs leu nos regulamentos, 10 contas por fundo. Sem chave, essas vão até 30 fundos por dia; com chave, até 500 fundos diferentes por dia.",
