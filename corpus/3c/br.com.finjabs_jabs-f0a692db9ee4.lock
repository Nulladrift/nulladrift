          "description": "Compras, carro e viagem: À vista ou parcelado, carro, câmbio e onde economizar.\nChame primeiro só com 'calculadora' para receber o formulário dela; depois, com 'calculadora' e 'dados', para a conta.\nCalculadoras:\n- cash_or_installments: À vista ou parcelado. Responde: Quanto a forma mais barata economiza, a valor de hoje.\n- carro_ou_aplicativo: Carro, moto ou transporte. Responde: Quanto o lado mais barato economiza por mês.\n- trocar_de_carro: Quando trocar de carro. Responde: Ficar com o carro por este tempo custa menos por mês.\n- consortium_vs_financing: Consórcio ou financiamento. Responde: O consórcio sai mais barato se você for contemplado em até.\n- custo_do_cambio: O câmbio da viagem: espécie, cartão ou conta global. Responde: O meio mais barato medido.\n- compra_internacional: Imposto na compra internacional. Responde: Total com os impostos.\n- spending_profile: Onde economizar. Responde: Acima da família típica, por mês.",
