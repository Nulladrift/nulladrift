          "description": "Empresa e autônomo: abrir e manter a firma, funcionário, preço, maquininha e impostos.\nChame primeiro só com 'calculadora' para receber o formulário dela; depois, com 'calculadora' e 'dados', para a conta.\nCalculadoras:\n- clt_or_pj: CLT, PJ ou autônomo. Responde: Como PJ você fica no bolso, por mês, em relação ao CLT.\n- company_opening_cost: Quanto custa abrir uma empresa. Responde: Abrir a empresa custa.\n- company_running_cost: Quanto custa manter a firma por mês. Responde: Manter a firma custa, por mês.\n- pro_labore_ou_dividendos: Pró-labore ou dividendos. Responde: A mais no bolso por mês, contra o nível seguinte.\n- clt_employee_cost: Quanto custa um funcionário (empresa ou doméstico). Responde: O funcionário custa, por mês.\n- preco_de_venda: Preço de venda e ponto de equilíbrio. Responde: Preço de venda por unidade.\n- maquininha: Taxa da maquininha e antecipação. Responde: Quanto entra de verdade.\n- retencoes_na_nota: Nota fiscal de serviço: quanto cai na conta. Responde: Cai na conta.\n- parcelamento_fiscal: Parcelar o imposto atrasado da empresa. Responde: A diferença de juros entre parcelar na Receita e pegar o empréstimo.\n- cbs_ibs_no_simples: IBS e CBS: dentro ou fora do DAS. Responde: Diferença por mês entre recolher fora e dentro do DAS.",
