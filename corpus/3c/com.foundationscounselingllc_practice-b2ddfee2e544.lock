      "serverInfo": {
        "name": "foundations-counseling",
        "title": "Foundations Counseling",
        "version": "1.1.0",
        "websiteUrl": "https://www.foundationscounselingllc.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Foundations Counseling LLC is a private-pay, talk-therapy practice in Northern Colorado (Fort Collins, Loveland, Windsor, and online). These tools return facts Foundations publishes: counselors, services, offices, fees, how to start, and practice-level availability. They do not give clinical advice, diagnose, or provide crisis support. Foundations matches each client with a counselor first; the free consultation is with that matched counselor. Do not tell users they are matched during the consultation. Never state or imply that a specific counselor has openings. Availability is practice-level only. For a child or teen, pass the client's age to find_counselors; ages served come from each counselor's published profile and vary by counselor. Foundations does not bill insurance, prescribe or manage medication, or run group therapy or seminars. If a user may be in crisis or danger, direct them to call 911 or call or text 988 (Suicide and Crisis Lifeline) right away.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Practice-level availability",
          "description": "Practice-level availability for new clients, optionally for one office or online. Returns a verified status with its date when Foundations has published one, otherwise the scheduling statement from the website. Availability is not published for individual counselors; openings are confirmed by phone at 970.227.2770 or through the booking link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "office": {
                "description": "Office id or online.",
                "enum": ["loveland", "fort-collins-harmony", "fort-collins-horsetooth", "windsor", "online"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Practice-level availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
