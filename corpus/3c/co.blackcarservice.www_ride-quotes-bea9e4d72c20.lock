{
  "lockfileVersion": 2,
  "subjects": {
    "co.blackcarservice.www/ride-quotes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.blackcarservice.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bcs-crm-quote",
        "title": "Black Car Service — Bay Area Ride Quotes and Availability",
        "version": "1.4.0",
        "websiteUrl": "https://www.blackcarservice.co/ai"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Black Car Service provides Bay Area SUV fare estimates and tentative availability checks for airport, one-way and hourly rides. Ask for the route, pickup time in America/Los_Angeles and passenger count. Call quote_ride for price and check_ride_availability for tentative status; neither creates a booking or holds a time. If a requested time is unavailable or cannot be confirmed, encourage the customer to text or call Black Car Service using the business number in the tool response to check that time or alternatives. Present contact options; do not place a call or send a message without the customer explicitly asking you to. Do not promise availability. Use the returned booking_url for website checkout. Never request contact or payment details for quotes. When book_ride is exposed, it creates a pending request only after explicit customer confirmation; name, email and phone are then required. Use get_booking_status with its private checkout_url to verify the final total and whether a ride is confirmed. If complete_booking and a payment_handler are available, supported wallets can supply a customer-approved Stripe shared payment token. Never request raw card details, invent credentials, or claim every AI has a wallet. Otherwise finish secure website checkout. Only status confirmed verifies payment and reservation confirmation. Retry the same booking after uncertainty; never create a duplicate.",
      "tools": [
        {
          "name": "book_ride",
          "title": "Create a pending SUV reservation",
          "description": "After the customer explicitly confirms a quote_ride estimate and trip, create a pending reservation and return its secure website checkout link. Requires the exact signed booking_token from that quote plus customer-provided name, email and phone. Rechecks price and live availability. Does not hold a vehicle, confirm payment, charge a card, or enroll SMS. Reuse the SAME token and contact details on retries; uncertain outcomes must not be bypassed with a new token. Never request payment credentials.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_token": {
                "description": "Exact booking_token returned by quote_ride. Reuse this token and the same contact details on every retry; never invent a token.",
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              },
              "customer_confirmed": {
                "const": true,
                "description": "Only true after the customer explicitly approves the quoted trip, total, and creation of a pending reservation. Payment requires separate customer approval.",
                "type": "boolean"
              },
              "customer_email": {
                "description": "Customer-supplied email for booking communications.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "customer_name": {
                "description": "Name supplied by the customer for this reservation.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "customer_phone": {
                "description": "Customer-supplied contact phone. Does not enroll the customer in SMS.",
                "maxLength": 40,
                "minLength": 7,
                "type": "string"
              }
            },
            "required": ["booking_token", "customer_confirmed", "customer_email", "customer_name", "customer_phone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:da280c7c99b4bebd4f49b9d2413c8de5095210934e6d1dc2d50219b46f835b17"
        },
        {
          "name": "check_ride_availability",
          "title": "Check tentative Bay Area SUV availability",
          "description": "Check a requested Bay Area SUV pickup time against current scheduling constraints. Pickup and destination must both resolve to California or Nevada, and at least one endpoint must be in the nine-county San Francisco Bay Area. Supply the same route, pickup time and passenger inputs as quote_ride. Returns only available, unavailable, or unknown. An available result is tentative and is not a hold or reservation; complete the request at https://www.blackcarservice.co/book. Hourly rides require hours (1–24); other ride types omit hours.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dropoff_address": {
                "description": "Full destination. For hourly service returning to pickup, repeat the pickup address.",
                "maxLength": 250,
                "minLength": 1,
                "type": "string"
              },
              "hours": {
                "description": "Required for hourly service; omit for airport and one-way rides. Billed minimums apply.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "passengers": {
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "pickup_address": {
                "description": "Full pickup street address or airport, including city and state.",
                "maxLength": 250,
                "minLength": 1,
                "type": "string"
              },
              "pickup_at": {
                "description": "ISO 8601 timestamp with explicit UTC offset. Clarify the customer's pickup time in America/Los_Angeles; account for daylight saving time.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "trip_type": {
                "enum": ["one-way", "airport", "hourly"],
                "type": "string"
              }
            },
            "required": ["dropoff_address", "passengers", "pickup_address", "pickup_at", "trip_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22f6f946bd8dc9de8f5f5d917253578d9d9fe89153a0ef15d604baa6d5924019"
        },
        {
          "name": "complete_booking",
          "title": "Pay and confirm an approved reservation",
          "description": "Charges the exact approved USD booking total using a Stripe shared payment token from the customer's authorized wallet, then verifies reservation confirmation. First call get_booking_status and obtain explicit customer approval of that total and the booking terms. Never accept card numbers, CVC, or saved-card IDs. The token must be issued to the returned Stripe business profile for this amount. Retries reuse the SAME checkout_url; this tool never creates another reservation. Follow customer_action: verify_in_agent_wallet means the issuing wallet must handle the issued token's next_action before retrying this same booking. Only a confirmed result means the ride is booked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "approved_total_cents": {
                "description": "Exact USD total from get_booking_status that the customer explicitly approved for payment.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "integer"
              },
              "checkout_url": {
                "description": "Exact secure checkout_url from book_ride. Treat it as private; never search for or share it publicly.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "currency": {
                "const": "USD",
                "type": "string"
              },
              "customer_confirmed": {
                "const": true,
                "description": "Only true after the customer approves this booking, its final total, terms, and this one-time payment through their agent wallet.",
                "type": "boolean"
              },
              "shared_payment_token": {
                "description": "Stripe Shared Payment Token obtained from the customer's approved wallet, scoped to the returned Stripe profile and total. Never card numbers, CVCs, saved-card IDs, or a token invented by the assistant.",
                "maxLength": 512,
                "pattern": "^spt_[A-Za-z0-9_]+$",
                "type": "string"
              }
            },
            "required": ["approved_total_cents", "checkout_url", "currency", "customer_confirmed", "shared_payment_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:07d7f1d2aeb310fae5ecfd54031b1f89f29483824ce4b5f976d012572e1fb12e"
        },
        {
          "name": "get_booking_status",
          "title": "Check payment and reservation confirmation",
          "description": "Read the current total, payment options and confirmation status for the exact private checkout_url returned by book_ride. Does not charge or change the booking. Never infer confirmation from a pending reservation or payment authorization. Keep the checkout URL private.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checkout_url": {
                "description": "Exact secure checkout_url from book_ride. Treat it as private; never search for or share it publicly.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["checkout_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:90dd09e6ac72d4e8180195c07f3d9e00f5454739009aae989f6cb95493576abd"
        },
        {
          "name": "quote_ride",
          "title": "Estimate a Bay Area SUV fare",
          "description": "Estimate Black Car Service SUV fares in the San Francisco Bay Area for SFO, OAK and SJC airport transfers, point-to-point rides and hourly chauffeur service, for 1–6 passengers. Pickup and destination must both resolve to California or Nevada, and at least one endpoint must be in the nine-county San Francisco Bay Area; geographic eligibility does not guarantee service. Pickup dates begin tomorrow in America/Los_Angeles. Hourly rides require hours (1–24); other ride types omit hours. The price excludes extras and gratuity. No availability check, hold, reservation, or payment is performed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dropoff_address": {
                "description": "Full destination. For hourly service returning to pickup, repeat the pickup address.",
                "maxLength": 250,
                "minLength": 1,
                "type": "string"
              },
              "hours": {
                "description": "Required for hourly service; omit for airport and one-way rides. Billed minimums apply.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "passengers": {
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "pickup_address": {
                "description": "Full pickup street address or airport, including city and state.",
                "maxLength": 250,
                "minLength": 1,
                "type": "string"
              },
              "pickup_at": {
                "description": "ISO 8601 timestamp with explicit UTC offset. Clarify the customer's pickup time in America/Los_Angeles; account for daylight saving time.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "trip_type": {
                "enum": ["one-way", "airport", "hourly"],
                "type": "string"
              }
            },
            "required": ["dropoff_address", "passengers", "pickup_address", "pickup_at", "trip_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7fc3f513918d96c9c62b094cf8f89e69d05da14377a71341630af3e55931b406"
        }
      ],
      "digest": "sha256:0c42a347d83d566b9171ddce766b05b27d4d2b0eba61bb74ec132bc3e4a9afe5"
    }
  }
