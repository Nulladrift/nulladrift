        {
          "name": "create_draft",
          "title": "Create a draft (store not changed)",
          "description": "Create a NEW item (e.g. a bundle offer or a popup campaign) as a draft. Nothing changes on the store until the merchant publishes it. Use the field names from get_write_guide. Popups also has kind 'shop' for one-time shop actions (a Manual code in Shopify Discounts, deleting expired codes, the own sending domain, resetting a test sign-up), each run once when published; some of those CAN'T be undone after publishing: deleteExpiredCodes, resetTestSignup and removing the sending domain (the preview card says so). Translate (kind 'translations'), Accessibility and Page Speed (kind 'shop') work the same way: one-time actions with item.action, run once when published; long ones are started and return a job id. Their guides and preview cards mark the ones that CAN'T be undone (e.g. a translation run, restoring a backup, deleting shopper reports, restoring original images, clearing Page Speed's 404 list, disconnecting Search Console).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app": {
                "description": "Which EA app: sticky_cart = EA • Sticky Cart (cart drawer, sticky add-to-cart bar, quick buy, cart upsells, rewards / free-shipping goals, every editor setting incl. custom CSS / HTML and templates, cart A/B tests, cart translations, checkout payment / shipping method rules); bundles = EA • Bundles & Upsell (bundle deals, quantity breaks, upsell popups, checkout upsells); popups = EA • Email Popups (spin-to-win wheel and email / SMS sign-up popup campaigns); translate = EA • Auto Translate (store translation and language selector); accessibility = EA • Accessibility (accessibility widget and store accessibility scans); page_speed = EA • SEO & Page Speed (speed optimisations and SEO); free_shipping_bar = EA • Free Shipping Bar (free shipping progress bar); rewards_bar = EA • Gift & Rewards Bar (gift and rewards progress bar); announcement_bar = EA • Announcement Bar (announcement bar); countdown_bar = EA • Countdown Bar (countdown timer bar)",
                "enum": ["sticky_cart", "bundles", "popups", "translate", "accessibility", "page_speed", "free_shipping_bar", "rewards_bar", "announcement_bar", "countdown_bar"],
                "type": "string"
              },
              "item": {
                "description": "The new item, in the write-guide field names.",
                "type": "object"
              },
              "kind": {
                "type": "string"
              },
              "store": {
                "description": "Which connected store (its myshopify address, e.g. other-store.myshopify.com). Leave it out for the default store; list_stores shows them.",
                "type": "string"
              }
            },
            "required": ["app", "item"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
