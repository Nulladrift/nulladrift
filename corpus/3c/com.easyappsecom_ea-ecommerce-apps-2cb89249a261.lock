          "name": "delete_item",
          "title": "Delete an item (on publish, can be undone)",
          "description": "Delete an item (a Bundles offer, a popup campaign, a bar). The delete is saved as a draft with a preview card and happens when it is published (the merchant's Publish click, or publish_draft where AI publishing is allowed); until then the item stays live and the draft can be discarded. A published delete can be undone (undo_publish restores the item). Call this only when the merchant asked for it in this conversation and pass their words in `user_request`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app": {
                "description": "Which EA app: sticky_cart = EA Sticky Add to Cart Drawer (cart drawer, sticky add-to-cart bar, quick buy, cart upsells, rewards / free-shipping goals, every editor setting incl. custom CSS / HTML and templates, cart A/B tests, cart translations, checkout payment / shipping method rules); bundles = EA Bundles & Quantity Breaks (bundle deals, quantity breaks, upsell popups, checkout upsells); popups = EA Email Popup & Spin Wheel (spin-to-win wheel and email / SMS sign-up popup campaigns); translate = EA AI Language Translate (store translation and language selector); accessibility = EA Accessibility ADA WCAG EAA (accessibility widget and store accessibility scans); page_speed = EA SEO & Page Speed Optimizer (speed optimisations and SEO); free_shipping_bar = EA Free Shipping Bar & Upsell (free shipping progress bar); rewards_bar = EA Rewards Bar & Free Gifts (gift and rewards progress bar); announcement_bar = EA Announcement Bar Banner (announcement bar); countdown_bar = EA Countdown Timer Bar (countdown timer bar)",
                "enum": ["sticky_cart", "bundles", "popups", "translate", "accessibility", "page_speed", "free_shipping_bar", "rewards_bar", "announcement_bar", "countdown_bar"],
                "type": "string"
              },
