{
  "lockfileVersion": 2,
  "subjects": {
    "com.slashyear/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://slashyear.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "slashyear",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sourced history. Every entry is a sentence quoted verbatim from a specific English Wikipedia revision and carries that revision id, so a claim built on it stays checkable. Years use astronomical numbering: -43 is 44 BCE. Reuse is free under CC BY-SA 4.0; cite the article and revision id.",
      "tools": [
        {
          "name": "check_claim",
          "description": "Check one dated sentence against the record before stating it. Leaders, Billboard No. 1 singles and Nobel Prizes get a structured check that can return 'supported' or 'contradicted' with the source. Other claims are matched against the dated entries and the answer says where the record dates sentences holding the claim's key words (matched_same_year, matched_other_years, ...), with the entries as evidence.",
          "inputSchema": {
            "properties": {
              "claim": {
                "description": "e.g. 'Richard Nixon was president of the United States in 1975'",
                "type": "string"
              }
            },
            "required": ["claim"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:78f04481e7a7183bc9c2b9ed9a6b7af8966d8e0900a38ae14af5deff49c9bdfb"
        },
        {
          "name": "convert_dollars",
          "description": "Inflation-adjust U.S. dollars between years with the BLS CPI-U (1913 onward). Omit to_year for the latest published month.",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "number"
              },
              "from_year": {
                "type": "integer"
              },
              "to_year": {
                "description": "optional; default is the latest CPI month",
                "type": "integer"
              }
            },
            "required": ["amount", "from_year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fb1ab0cbb6459924730ad0c7338899428637a10f82711e8906547354878e401"
        },
        {
          "name": "get_country",
          "description": "One country's dated record, century by century, harvested from the per-country year articles English Wikipedia writes separately ('1969 in Japan') and never indexes together. Use this when the question is about a nation rather than a year or a subject.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "country name or slug, e.g. 'Japan', 'south-africa'",
                "type": "string"
              },
              "from_year": {
                "description": "earliest year; astronomical numbering",
                "type": "integer"
              },
              "limit": {
                "description": "default 200, max 2000",
                "type": "integer"
              },
              "to_year": {
                "description": "latest year",
                "type": "integer"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24f48ddda75f7d9d61aec07bc93a857fb594ccb4e51677c1ba58e39a263d1157"
        },
        {
          "name": "get_day",
          "description": "One calendar day across every recorded year — what happened on 4 July in all of them. This aggregate exists in no single encyclopedia article.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "'july-4', 'July 4', '07-04' or any 'YYYY-MM-DD'",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a202428c42fa9104d175b4d76da2ceb9dada07c068170bfe295adbbec31146b"
        },
        {
          "name": "get_disagreements",
          "description": "Where two sources slashyear checks against each other disagree: leaders' terms (Wikipedia lists vs Wikidata), birth and death dates (Wikipedia year articles vs Wikidata), Nobel Prizes (Nobel API vs Wikidata). Useful before trusting either source.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "default 50, max 500",
                "type": "integer"
              },
              "person": {
                "description": "optional: name to look for",
                "type": "string"
              },
              "section": {
                "description": "optional: leaders, life_years, life_days or nobel",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5288ea668211cd71e65fb2f1a3af069bc08ed5161eb935b04ead90fc5e4c01f0"
        },
        {
          "name": "get_leaders",
          "description": "Who led a country (or every country) in a year, 1800-2025: heads of state, heads of government and ruling-party leaders, in the order they held the post. Each name is quoted from Wikipedia's list of state leaders (revision id given) and kept only where the person's Wikidata record holds the same post over the same years, so a missing name means the sources disagree, not that the post was empty.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "optional: country or state name, e.g. 'Brazil', 'Ottoman Empire', 'Soviet Union'. Omit for every state",
                "type": "string"
              },
              "year": {
                "description": "1800 to 2025",
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c7eb42b93fe5eca7060a3fa12511fd6eeffb94ab111c96728a08499cb48d4df"
        },
        {
          "name": "get_nobel_prizes",
          "description": "Nobel laureates for a year (1901 on) or for a category across years, from the Nobel Prize API and kept only where Wikidata records the same prize in the same year.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Physics, Chemistry, Physiology or Medicine, Literature, Peace, Economic Sciences",
                "type": "string"
              },
              "name": {
                "description": "optional: laureate name to find",
                "type": "string"
              },
              "year": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b8276f990146ef3883780793d81c498f38118dc8d8d79fa5c6b3093d607f922"
        },
        {
          "name": "get_number_one_song",
          "description": "The Billboard Hot 100 No. 1 single on a given date (1958-08-04 onward): the first chart issue dated on or after that day, quoted from a cited Wikipedia revision.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62d91e59b9b0dbf2755e7f33c469a096a9285352cc92489312d91fa89bed367c"
        },
        {
          "name": "get_official_series",
          "description": "Official data series by year from the agencies that publish them, each cross-checked against a second copy: U.S. unemployment, federal funds rate, GDP, population, federal debt, Mauna Loa CO2, global temperature anomaly, Fed exchange rates. Omit series to list them.",
          "inputSchema": {
            "properties": {
              "from_year": {
                "type": "integer"
              },
              "series": {
                "description": "series id from the list, e.g. 'unemployment_rate'",
                "type": "string"
              },
              "to_year": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f72e89bb4d9a604ade3e3194ca4db139aab4c91e44d0326b8686feecf7f48a3"
        },
        {
          "name": "get_timeline",
          "description": "One subject's whole record in date order: every dated entry across all years in which Wikipedia's editors linked to it, with its Wikidata id for joining to other datasets.",
          "inputSchema": {
            "properties": {
              "from_year": {
                "type": "integer"
              },
              "limit": {
                "description": "default 100, max 1000",
                "type": "integer"
              },
              "subject": {
                "description": "subject name or slug, e.g. 'Byzantine Empire' or 'byzantine-empire'",
                "type": "string"
              },
              "to_year": {
                "type": "integer"
              }
            },
            "required": ["subject"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1179eff5d308eae10e959665eb1000654ad29dc0de24b42690be0b1b915a41d4"
        },
        {
          "name": "get_world_on_date",
          "description": "The world on one date in a single answer: the dated entries for that exact day, births and deaths that day, every state's office holders that year, the Billboard Hot 100 No. 1 in force, U.S. prices and CPI, world population, official series (unemployment, rates, GDP, debt, CO2, temperature), Federal Reserve exchange rates for that day, and that year's Nobel Prizes. Each part carries its source; parts no source covers are absent.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD, e.g. 1969-07-20",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f17e85bf908fc64a014d7804e67e2501fa139badeeb685a4228c19ed703198df"
        },
        {
          "name": "get_year",
          "description": "Everything the record holds for one year: the headline summary and every dated entry, grouped by subject, each with its source revision.",
          "inputSchema": {
            "properties": {
              "year": {
                "description": "astronomical numbering: 1969, or -43 for 44 BCE",
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:46998e0903b4676a79e1e1cb26ee0d0d8b81859e98f66dcec3852228b41c8db6"
        },
        {
          "name": "get_year_facts",
          "description": "What a year (1800-2025) looked like in numbers, from outside sources rather than encyclopedia prose: world population, U.S. CPI and what a dollar then is worth now, average U.S. prices (gas, eggs, bread, milk, houses, income, minimum wage), who led the major powers, and the Billboard Hot 100 No. 1 songs. Every figure carries its source. For any other country's leaders use get_leaders.",
          "inputSchema": {
            "properties": {
              "year": {
                "description": "1800 to 2025",
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4703edcbb37b17d1e3fa25dc89ec156fa366081033e0435db025427e2eb705d4"
        },
        {
          "name": "list_countries",
          "description": "Browse the countries that have a record of their own, largest first.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "default 100, max 500",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9c8a21206255726c24ec538f98d9f5d0b339816935400def2d3dda1925f8ca40"
        },
        {
          "name": "list_subjects",
          "description": "Browse the subjects that have a timeline, largest record first.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "default 50, max 500",
                "type": "integer"
              },
              "starts_with": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5da7dc51cd5ded7cd2711a4daf0264a202bff5ec3ae68d9c4eabbf2f03d532c2"
        },
        {
          "name": "search_history",
          "description": "Full-text search across every dated entry in the historical record, plus the subjects that match. Each entry is a sentence quoted verbatim from a numbered English Wikipedia revision and carries that revision id, so an answer built on it can cite a source that will still say the same thing next year. Use this whenever you need a dated fact.",
          "inputSchema": {
            "properties": {
              "from_year": {
                "description": "earliest year; astronomical numbering, so -43 means 44 BCE",
                "type": "integer"
              },
              "limit": {
                "description": "maximum entries to return (default 25, max 200)",
                "type": "integer"
              },
              "query": {
                "description": "words to find, e.g. 'volcanic eruption' or 'Constantinople'",
                "type": "string"
              },
              "to_year": {
                "description": "latest year",
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9eca358c76d2992a8816db3029c6d24e5a96ce48cbe361dcf424a86706b8eae2"
        }
      ],
      "digest": "sha256:30bb2a18c6b9c63dd4178915354f6e30c864d820081c66924d50575c307493c6"
    }
  }
}
