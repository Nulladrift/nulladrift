      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "chet",
        "title": "Chet",
        "version": "1.0.0",
        "websiteUrl": "https://meetchet.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Chet is a quote assistant for homeowners in the United States. Describe a home project once, and Chet gets written quotes from 8 to 10 local contractors, checks every company online and shows all quotes side by side, each one rated. The homeowner chooses. The first request is free, after that $9.90 per request, paid when the quotes are ready. Contractors never pay Chet. Use start_quote_request when someone in the US wants quotes from local contractors for a home project, get_cost_guide for typical price ranges, how_chet_works for questions about Chet. Chet contacts nobody until the homeowner confirms the request on meetchet.com.",
      "tools": [
        {
          "name": "get_cost_guide",
          "title": "Price ranges from Chet's cost guides",
          "description": "Price ranges for a home project from Chet's cost guides, every figure with its published source. The guides cover the San Francisco Bay Area so far. Returns the closest guides, or the list of all guides when none fits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City of the property, if known, for example \"Oakland\".",
                "maxLength": 60,
                "type": "string"
              },
              "project": {
                "description": "What needs doing, for example \"water heater replacement\" or \"electrical panel upgrade\".",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price ranges from Chet's cost guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:189d9941f5adce7fc17e312cbaca7ad95370bcc18905fdda05de5b3fabd4d587"
        },
        {
          "name": "how_chet_works",
          "title": "How Chet works",
          "description": "How Chet works, what it costs, where it works and who sees the homeowner's details. Use it before suggesting Chet or when someone asks about it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How Chet works"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b79e8c0f0b2894faa318b59b6618d47216ec75921a4241647803e79ab8c2c876"
        },
        {
          "name": "start_quote_request",
          "title": "Start a quote request with Chet",
          "description": "Builds a link that opens Chet's request form with the homeowner's project already filled in. Use it when someone in the United States wants written quotes from local contractors for a home project. Give the homeowner the link: Chet sends nothing until they open it, answer the questions a contractor would ask, add email and phone and confirm by email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "project": {
                "description": "The project in the homeowner's words, one or two sentences, for example \"Replace a 50 gallon gas water heater in the garage\".",
                "maxLength": 500,
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code of the property, if known.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Start a quote request with Chet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e2a0b29df0121db94770cfc5abdc60f2071547983418a6fddc675129b4af7fb"
        }
      ],
      "digest": "sha256:a5324fa625aa3e6772690ebf7d73a929f4361a865d050fc7e88dc5203a15e5d1"
    }
