{
  "lockfileVersion": 2,
  "subjects": {
    "ca.airiskmanagement/shadow-ai-list": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ailist.airiskmanagement.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "shadow-ai-list",
        "title": "Shadow AI List",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Shadow AI List is a maintained, risk-ranked registry of AI tools (the 'AI Exposure Index'). Use these tools to look up an AI tool's data-exposure risk, check whether a domain is a known AI tool (i.e. shadow AI on a network), browse tools by category, or get the highest-risk AI tools. Coverage is the free top 100 of the registry.",
      "tools": [
        {
          "name": "check_domain_against_registry",
          "title": "Check if a domain is shadow AI",
          "description": "Check whether a domain or subdomain belongs to a known AI tool - i.e. whether traffic to it is shadow AI. Returns the tool and its risk if matched. Covers the free top 100.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "A domain or URL, e.g. 'chat.openai.com' or 'https://cursor.sh'.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2352b648313532c68123884b5187d9fe1e930243ab56d7319e606d13d24e0724"
        },
        {
          "name": "get_top_risky_ai",
          "title": "Get the highest-risk AI tools",
          "description": "Get the highest-risk AI tools by AI Exposure Index risk score. Returns name, domain, category, and risk score + band. Covers the free top 100.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many (default 10, max 25).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cbad28709046940a099586a3717b839e80e26eddb1d840a7257fdea9508b1bed"
        },
        {
          "name": "list_shadow_ai",
          "title": "List AI tools",
          "description": "List AI tools from the registry, optionally filtered by category. Returns name, domain, category, and risk band. Covers the free top 100.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter (e.g. 'coding', 'chatbot', 'meeting_transcription').",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 25, max 100).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90747c656d04d7d14c2a4326675e270adf38533863f1ddeb050bac85c2dd6b99"
        },
        {
          "name": "lookup_ai_tool_risk",
          "title": "Look up an AI tool's risk",
          "description": "Look up an AI tool by name, vendor, or domain and return its AI Exposure Index risk score, risk band, category, and whether it trains on user data. Covers the free top 100.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Tool name, vendor, or domain (e.g. 'Cursor', 'OpenAI', 'cursor.sh').",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3cfabe06043f875447eb12723c45998c8d6d6c04d29c68a4db32b8c47a81c3d7"
        }
      ],
      "digest": "sha256:4e61039f850c95aa76ba42ff0b0d8357078ca4e4b5c2c987ba2201a246087749"
    }
  }
}
