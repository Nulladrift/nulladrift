{
  "lockfileVersion": 2,
  "subjects": {
    "app.loutre/loutre": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.loutre.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "loutre",
        "title": "Loutre",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Loutre hosts mock APIs built from an OpenAPI or Swagger document, TypeScript types, a Postman, Insomnia or Bruno collection, a HAR file, a json-server db.json, curl commands or a GraphQL schema (Pro).\nTypical flow: create_mock with the document → the URL answers immediately (https://<slug>.loutre.run) with realistic, coherent data.\nEvery request can be driven by headers: x-loutre-status (forced status), x-loutre-delay (latency in ms), x-loutre-count (size of a list, 0 for the empty state), x-loutre-message (message of an error), x-loutre-seed (another variant of the data).\nPermanent behaviour is set with set_behavior, set_response (hand-written body) and add_rule (conditional responses). Named scenarios (set_behavior with scenarios: { \"outage\": { status: 500 } }) apply per request with the x-loutre-scenario header, or to every request with activeScenario.\nPOST/PUT/PATCH/DELETE writes are persisted (stateful mocks), reset_state forgets them.\nKeep the ownerToken returned by create_mock to change a mock created without an account; with an account API token in Authorization, everything is automatic.",
      "tools": [
        {
          "name": "add_rule",
          "description": "Add a conditional response to a route: when the request matches the conditions (query, header, path param, body field), the mock answers with this status, body and latency. Rules are evaluated in order, the first match wins; x-loutre-* headers keep priority.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "JSON body of the response"
              },
              "latencyMs": {
                "maximum": 30000,
                "minimum": 0,
                "type": "number"
              },
              "name": {
                "description": "Human-readable label of the rule",
                "maxLength": 60,
                "type": "string"
              },
              "ownerToken": {
                "description": "Owner token received at creation (not needed when the account is connected with an API token)",
                "type": "string"
              },
              "route": {
                "description": "Route identifier, lowercase method: \"get:/users/{id}\"",
                "type": "string"
              },
              "slug": {
                "description": "Subdomain of the mock, e.g. \"brisk-otter\"",
                "pattern": "^[a-z0-9-]{1,63}$",
                "type": "string"
              },
              "status": {
                "maximum": 599,
                "minimum": 100,
                "type": "integer"
              },
              "when": {
                "additionalProperties": false,
                "description": "Every condition must hold",
                "properties": {
                  "body": {
                    "additionalProperties": {},
                    "description": "Expected JSON body fields, by dotted path (customer.email)",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "header": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "Expected headers",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "param": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "Expected path parameters ({id})",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "query": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "Expected query parameters",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              }
            },
            "required": ["route", "slug", "when"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4a2cb65b31c70ffa9b09f3a4c65b62cd0e0b12a3bea952b27cf405d61a69c1a6"
        },
        {
          "name": "call_mock",
          "description": "Call a route of the mock like an HTTP client would and return the status, the x-loutre-* headers and the body. The headers x-loutre-status, x-loutre-delay, x-loutre-count, x-loutre-message and x-loutre-seed are honoured; latency is not awaited, it is reported in delayMs. Writes (POST, PUT, PATCH, DELETE) are persisted when persistent state is on. For a GraphQL mock, POST to its GraphQL path with the body { \"query\": \"…\", \"variables\": { … } }; mutations are persisted the same way.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "accessKey": {
                "description": "Access key (lk_…) of a private mock you do not own",
                "type": "string"
              },
              "body": {
                "description": "JSON body for POST, PUT, PATCH"
              },
              "headers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Request headers, including x-loutre-*",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "method": {
                "default": "GET",
                "enum": ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS", "QUERY"],
                "type": "string"
              },
              "ownerToken": {
                "description": "Owner token received at creation (not needed when the account is connected with an API token)",
                "type": "string"
              },
              "path": {
                "description": "Path with its query string: \"/users/42?expand=orders\"",
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Subdomain of the mock, e.g. \"brisk-otter\"",
                "pattern": "^[a-z0-9-]{1,63}$",
                "type": "string"
              }
            },
            "required": ["method", "path", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3eb1c4633c9c19b5176d54695200456f85c4d1368e1f1b9fce493228874715c0"
        },
