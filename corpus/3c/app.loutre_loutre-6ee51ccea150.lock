            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26044b38f21c6adf50daff62d1787aebc8828b18f1554e9571b45a7f27b69b3b"
        },
        {
          "name": "create_mock",
          "description": "Create a hosted mock from an OpenAPI 3.0/3.1 or Swagger 2.0 document (YAML or JSON), from TypeScript types (interfaces, types, enums: CRUD routes derived, or a route map type keyed like \"GET /users\") or from a Postman v2 collection, an Insomnia export (v4 JSON or v5 YAML), a Bruno collection (JSON export, or .bru files one after the other), a HAR file (headers and cookies are dropped, data is generated), a json-server db.json (records served as they are), curl commands, or a GraphQL schema (SDL or introspection JSON; Pro plan: queries, mutations and introspection answered on POST /graphql). OpenAPI 3.2 is read too. Give the document in `spec`, or its public address in `url` (then the mock re-reads it every six hours and follows changes). Returns the URL, the route list and an ownerToken to keep for later changes. Data is realistic and coherent, generated once. Without an account the mock lives seven days.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "auto": {
                "description": "With url: re-read every six hours (default true)",
                "type": "boolean"
              },
              "locale": {
                "description": "Language of names, addresses, texts and error messages (default: the request's language, else English)",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "seed": {
                "description": "Data seed, for reproducible data sets",
                "maxLength": 64,
                "type": "string"
              },
              "slug": {
                "description": "Desired subdomain (Pro plan)",
                "maxLength": 63,
                "type": "string"
              },
              "spec": {
                "description": "The full document, verbatim: OpenAPI, Swagger, TypeScript types, a Postman, Insomnia or Bruno collection, a HAR file, a db.json or curl commands",
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Public URL of the document, instead of spec",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:88dd19f53a3e1353786b62cb183084a4bb195bfd0007d28eb807b8d624839981"
        },
