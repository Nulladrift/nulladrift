        {
          "name": "set_behavior",
          "description": "Change a mock's behaviour: default status, latency, jitter, error rate, persistent writes, and per route status, latency, hand-written bodies, rules. Merge semantics: missing keys are kept, null clears.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ownerToken": {
                "description": "Owner token received at creation (not needed when the account is connected with an API token)",
                "type": "string"
              },
              "patch": {
                "additionalProperties": false,
                "description": "Same fields as PATCH /mocks/:slug/behavior: a missing key is kept, null clears",
                "properties": {
                  "activeScenario": {
                    "description": "Scenario applied to every request without an x-loutre-scenario header; null deactivates",
                    "type": ["string", "null"]
                  },
                  "errorRate": {
                    "anyOf": [
                      {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Share of requests that return an error"
                  },
                  "graphqlPath": {
                    "description": "GraphQL mocks only: the path the endpoint answers on, /graphql by default (e.g. /api/graphql); null restores /graphql",
                    "type": ["string", "null"]
                  },
                  "jitter": {
                    "anyOf": [
                      {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Random latency variation (0.3 = ± 30 %)"
                  },
                  "latencyMs": {
                    "anyOf": [
                      {
                        "maximum": 30000,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "proxy": {
                    "description": "Base URL of a real backend: routes the schema does not describe are forwarded there; null removes",
                    "type": ["string", "null"]
                  },
                  "routes": {
                    "anyOf": [
                      {
                        "additionalProperties": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "bodies": {
                                  "anyOf": [
                                    {
                                      "additionalProperties": {},
                                      "propertyNames": {
                                        "type": "string"
                                      },
                                      "type": "object"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "description": "Status → hand-written JSON body; null removes"
                                },
                                "errorRate": {
                                  "anyOf": [
                                    {
                                      "maximum": 1,
                                      "minimum": 0,
                                      "type": "number"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                },
                                "latencyMs": {
                                  "anyOf": [
                                    {
                                      "maximum": 30000,
                                      "minimum": 0,
                                      "type": "number"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                },
                                "rules": {
                                  "anyOf": [
                                    {
                                      "items": {},
                                      "type": "array"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "description": "Conditional rules (see add_rule); the list replaces the existing one"
                                },
                                "status": {
                                  "anyOf": [
                                    {
                                      "maximum": 599,
                                      "minimum": 100,
                                      "type": "integer"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ]
                                }
                              },
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Settings per route identifier"
                  },
                  "scenarios": {
                    "anyOf": [
                      {
                        "additionalProperties": {
                          "anyOf": [
                            {},
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Named bundles of settings (same fields as this patch minus scenarios and proxy), applied per request with the x-loutre-scenario header or with activeScenario; null removes"
                  },
                  "stateful": {
                    "description": "Persistent writes (true by default)",
                    "type": ["boolean", "null"]
                  },
                  "status": {
                    "anyOf": [
                      {
                        "maximum": 599,
                        "minimum": 100,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Forced status for the whole mock; null to remove"
                  }
                },
                "type": "object"
              },
              "slug": {
                "description": "Subdomain of the mock, e.g. \"brisk-otter\"",
                "pattern": "^[a-z0-9-]{1,63}$",
                "type": "string"
