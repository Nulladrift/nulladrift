{
  "lockfileVersion": 2,
  "subjects": {
    "ai.tokenos/dapp-builder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tokenos.ai/api/mcp/apps/dapp-builder"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tokenos-dapp-builder",
        "title": "AI dApp Builder by TokenOS — plan and build Solana & EVM apps",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use when the user wants to build, generate or prototype a dApp, Web3 app, token site, NFT mint page, DAO, marketplace or on-chain game, or asks which AI model to build with. Call plan_dapp with the user's own description; include chain if they mention one. Before calling plan_dapp, check the request is specific: if it is vague (e.g. “build an app”, “make me a dapp”, “build an app please”), do not call the tool — ask the user what the app should do and for whom and wait for their answer. If plan_dapp returns a too-vague error, do the same. Never invent an idea on their behalf or retry plan_dapp with your own wording. Share the returned TokenOS link so they can build it.",
      "tools": [
        {
          "name": "plan_dapp",
          "title": "Plan a dApp build",
          "description": "Turn the user's app idea into a spec (features, pages, components, data model, Web3 integrations, stack, steps, credit estimate) with a pre-filled TokenOS IDE link. Only call with the user's own description — if the request is vague (e.g. “build an app”), ask the user what the app should do and for whom first; never invent an idea.",
          "inputSchema": {
            "properties": {
              "chain": {
                "enum": ["solana", "base", "robinhood", "ethereum", "arbitrum"],
                "type": "string"
              },
              "features": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "idea": {
                "description": "The user's own words: what the app should do and for whom (never invented by the assistant)",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "style": {
                "description": "Visual direction, e.g. dark neon, minimal light",
                "type": "string"
              }
            },
            "required": ["idea"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan a dApp build"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Build plan ready",
            "openai/toolInvocation/invoking": "Drafting the build plan",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:e7c3dd95880d9ed6b05b890487ca869d7409fdea3945ba76da4a56914c565626"
        },
        {
          "name": "recommend_models",
          "title": "Recommend AI models",
          "description": "Pick the best, balanced and cheapest frontier models from the live TokenOS roster for a build task, with price multipliers.",
          "inputSchema": {
            "properties": {
              "task": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
