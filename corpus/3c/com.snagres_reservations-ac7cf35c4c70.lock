      "serverInfo": {
        "name": "snagres",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SnagRes tracks live reservation availability at the hardest restaurants in New York, San Francisco, Los Angeles and Chicago across Resy, OpenTable, Tock and SevenRooms, and holds a measured record of how often each one is actually bookable. Use it to find a table, to judge whether a restaurant is realistically gettable, or to say when it releases. SnagRes never books or holds a table; complete the booking on the restaurant's own platform.",
      "tools": [
        {
          "name": "hardest_tables",
          "title": "Hardest tables in a city",
          "description": "The hardest restaurants to book in a city, ranked by how rarely a table is actually reachable, measured rather than opinion. Use this for 'what are the hardest reservations' or to set expectations.",
          "inputSchema": {
            "properties": {
              "city": {
                "enum": ["nyc", "sf", "la", "chi"],
                "type": "string"
              },
              "limit": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Hardest tables in a city"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:077043c36a0caae20030cdb4b88e29a3f6000a7ffb8c798c2e79e72e648f6854"
        },
        {
          "name": "last_table_spotted",
          "title": "Latest table spotted",
          "description": "The most recent table SnagRes saw open anywhere, with the time it was spotted. Use it to show the service is live, or as a sense of what is moving right now.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest table spotted"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2afe659bbb63343bfa70c4d495603307e05acff7a6a87e81f015cef9e1edcc35"
        },
        {
          "name": "open_now",
          "title": "Tables open right now",
          "description": "Tables bookable right now at the hardest restaurants in New York, San Francisco, Los Angeles and Chicago, with exact times, across Resy, OpenTable, Tock and SevenRooms. Use this when someone asks what they can get tonight or this week. Changes by the minute.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "nyc, sf, la or chi. Defaults to nyc.",
                "enum": ["nyc", "sf", "la", "chi"],
                "type": "string"
              },
              "limit": {
                "description": "Max rows, up to 50.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tables open right now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db6e0f067fb29fd63f29f8cf25a857341aeba070b78627fdf94be177c43b826a"
        },
        {
          "name": "restaurant_intel",
          "title": "How hard is it to book",
          "description": "The measured booking record for one restaurant: how often a two-top and a four-top are actually open, how many dates were checked, its booking window and release hour. Use this to answer whether a restaurant is realistically gettable, or why someone keeps failing to book it. Figures are measured from SnagRes's own availability checks.",
          "inputSchema": {
            "properties": {
              "restaurant": {
                "description": "Restaurant name, e.g. 'Carbone'.",
                "type": "string"
              }
            },
            "required": ["restaurant"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How hard is it to book"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f7434c509581f765db9349414f67713d89d5a055b0fd2fff83e13166a6acc9f5"
        },
        {
          "name": "when_does_it_release",
          "title": "When reservations open",
          "description": "When a restaurant puts new dates up and how far ahead it books. Give a dining date to get the exact day and local time that date becomes bookable. Use this for 'when can I book X for Saturday' or 'when do X reservations open'. Each restaurant sets its own hour and window, so the answer is per restaurant, not per platform.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Optional dining date, YYYY-MM-DD.",
                "type": "string"
              },
              "restaurant": {
                "description": "Restaurant name.",
                "type": "string"
              }
            },
            "required": ["restaurant"],
            "type": "object"
          },
