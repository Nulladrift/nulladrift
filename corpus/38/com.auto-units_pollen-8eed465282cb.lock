{
  "lockfileVersion": 2,
  "subjects": {
    "com.auto-units/pollen": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pollensites.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Pollen",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Pollen: Agent-ready sites for your product and business. Draft a page you can host anywhere.\n\n- draft page: Make a standalone landing-page draft from public business copy: name (1–120 characters), brief (1–2000), optional headline (up to 160) and style (editorial, studio or bold). Saves the draft as a guest draft and returns its id; check_draft returns the HTML immediately. No account, contact details, publishing, payment or messages. The styles include their own artwork: editorial is Portfolio, studio is SaaS and bold is Consumer. Pollen's particle animation is not included. Start it with start_draft, then call check_draft with the id it returns; it usually takes a moment.",
      "tools": [
        {
          "name": "check_draft",
          "title": "Check a draft page",
          "description": "Where a draft page stands. When it is ready, the full result as text and a link to it on Pollen's site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The id start returned.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a draft page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5f3333f721f86950a84b34a12b86d8660174fe7558992671374c2a6d73e2687"
        },
        {
          "name": "start_draft",
          "title": "Start a draft page",
          "description": "Make a standalone landing-page draft from public business copy: name (1–120 characters), brief (1–2000), optional headline (up to 160) and style (editorial, studio or bold). Saves the draft as a guest draft and returns its id; check_draft returns the HTML immediately. No account, contact details, publishing, payment or messages. The styles include their own artwork: editorial is Portfolio, studio is SaaS and bold is Consumer. Pollen's particle animation is not included.\n\nStarts the work and returns an id. It usually takes a moment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "brief": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "headline": {
                "default": "",
                "maxLength": 160,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "style": {
                "default": "editorial",
                "enum": ["editorial", "studio", "bold"],
                "type": "string"
              }
            },
            "required": ["brief", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a draft page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cdaacd6dc81497468751d5268311301a8b1fea94cefb3b113470d757bf955840"
        }
      ],
      "digest": "sha256:ecba341373e6ae4f861bb10b26dcd42e24e2a41723905375e8649016577e9d9c"
    }
  }
}
