        {
          "name": "calcular_custo_baba",
          "title": "Calcular custo de contratação",
          "description": "Calcula o custo mensal e anual estimado de contratação doméstica com salário bruto e transporte informados. Aceita UF sem salarioBruto para calcular um exemplo com a referência estadual vigente na tabela do site. Retorna fontes e premissas; a estimativa não é proposta salarial nem substitui convenção coletiva.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "diasUteisMes": {
                "description": "Dias úteis no mês; se não informado, 22.",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "salarioBruto": {
                "description": "Salário bruto mensal em reais.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "uf": {
                "description": "Sigla da unidade federativa, por exemplo SP.",
