      "instructions": "Ajude a encontrar perfis públicos de babás por cidade/UF e a estimar custo de contratação ou salário líquido. Para buscar, use apenas cidade e UF informadas pela pessoa nesta conversa; peça o que faltar, inclusive quando ela disser 'perto de mim'. Não use memórias da conta nem localização presumida. A busca não mede distância ou proximidade; não diga que pesquisou perfis sem chamar a ferramenta. Não infira compatibilidade, disponibilidade individual ou recomendação. Para UI, use a ferramenta mostrar correspondente após os dados. Os números vêm das ferramentas, nunca de conta própria.",
      "tools": [
        {
          "name": "buscar_babas_publicas",
          "title": "Buscar babás com perfil público",
          "description": "Consulta perfis públicos consentidos por cidade e UF informadas pela pessoa na conversa. Retorna perfis por publicação recente, sem ranking de qualidade. Não aceita CEP, bairro ou coordenadas, não calcula distância e não infere localização. Diferencia lista vazia de falha técnica.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cidade": {
                "description": "Cidade brasileira informada pela pessoa, sem endereço ou bairro.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "uf": {
                "description": "Sigla da unidade federativa, por exemplo SP.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["cidade", "uf"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
