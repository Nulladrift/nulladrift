{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kaiv/is-it-down": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.kaiv.ai/api/bridge/mcp/is-it-down-a0a9031c"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "Is It Down",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "\"Is It Down\" is a governed MCP server hosted by Kaiva Bridge. Tools carry a JSON Schema for both input and, where the source documents one, output. Read inputSchema before calling rather than guessing argument names. Every tool here is read-only unless its annotations say otherwise — check readOnlyHint and destructiveHint before calling. A failed call returns isError with a machine-readable `error` code and a message saying whether to fix the arguments, wait, or stop retrying.",
      "tools": [
        {
          "name": "check_all_services",
          "title": "Check All Services",
          "description": "Is anything I depend on broken right now?\n\nChecks every supported provider in parallel and returns a one-sentence summary plus per-service detail. Use this first: it answers the whole question in one call. Optionally narrow with ?services=github,npm. A provider whose status page cannot be read is reported as \"unknown\", never as healthy.",
          "inputSchema": {
            "properties": {
              "services": {
                "description": "Optional comma-separated slugs to narrow the check, e.g. \"github,npm,cloudflare\". Omit to check all.",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "all_operational": {
                "description": "True only when every checked service reports no known problems AND every status page was reachable.",
                "type": "boolean"
              },
              "checked": {
                "description": "How many services were checked.",
                "type": "integer"
              },
              "degraded": {
                "description": "Slugs with a minor incident open.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "down": {
                "description": "Slugs with a major or critical incident open.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "services": {
                "description": "Full per-service detail.",
                "items": {
                  "properties": {
                    "cached": {
                      "description": "Whether this answer came from the 45 second cache rather than a fresh fetch.",
                      "type": "boolean"
                    },
                    "description": {
                      "description": "The provider's own one-line summary, when it publishes one.",
                      "nullable": true,
                      "type": "string"
                    },
                    "healthy": {
                      "description": "True when operational, false when degraded or down, null when unknown.",
                      "nullable": true,
                      "type": "boolean"
                    },
                    "indicator": {
                      "description": "Raw statuspage.io indicator: none, minor, major or critical.",
                      "nullable": true,
                      "type": "string"
                    },
                    "meaning": {
                      "description": "Plain-language reading of the state, safe to show a user verbatim.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Human name of the provider.",
                      "type": "string"
                    },
                    "reachable": {
                      "description": "Whether the status page itself answered.",
                      "type": "boolean"
                    },
                    "service": {
                      "description": "The slug that was checked.",
                      "type": "string"
                    },
                    "state": {
                      "description": "Normalised state. \"unknown\" means the status page could not be read, NOT that the service is down.",
                      "enum": ["operational", "degraded", "down", "unknown"],
                      "type": "string"
                    },
                    "status_page": {
                      "description": "URL a human can open to read the full incident history.",
                      "type": "string"
                    },
                    "updated_at": {
                      "description": "When the provider last updated the page (ISO 8601).",
                      "nullable": true,
                      "type": "string"
                    }
                  },
                  "required": ["meaning", "name", "reachable", "service", "state"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "description": "One sentence answering \"is anything broken right now\", safe to show verbatim.",
                "type": "string"
              },
              "unknown": {
                "description": "Slugs whose status page could not be read.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["all_operational", "checked", "services", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check All Services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d687a4c7fdd98cfa13961371ad68be9bfe2e8e70830e0339b2784cec5318c989"
        },
        {
          "name": "check_service_status",
          "title": "Check Service Status",
          "description": "Current incident state for one named service.\n\nReturns the normalised state (operational, degraded, down, unknown), the provider's own description, and a link to the full status page. Use when you already know which provider you care about.",
          "inputSchema": {
            "properties": {
              "service": {
                "description": "Slug of the service to check. One of: github, npm, cloudflare, anthropic, openai, vercel, netlify, render, supabase, mongodb, digitalocean, docker, circleci, sentry, datadog, twilio, atlassian, bitbucket, discord, hashicorp.",
                "enum": ["github", "npm", "cloudflare", "anthropic", "openai", "vercel", "netlify", "render", "supabase", "mongodb", "digitalocean", "docker", "circleci", "sentry", "datadog", "twilio", "atlassian", "bitbucket", "discord", "hashicorp"],
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cached": {
                "description": "Whether this answer came from the 45 second cache rather than a fresh fetch.",
                "type": "boolean"
              },
              "description": {
                "description": "The provider's own one-line summary, when it publishes one.",
                "nullable": true,
                "type": "string"
              },
              "healthy": {
                "description": "True when operational, false when degraded or down, null when unknown.",
                "nullable": true,
                "type": "boolean"
              },
              "indicator": {
                "description": "Raw statuspage.io indicator: none, minor, major or critical.",
                "nullable": true,
                "type": "string"
              },
              "meaning": {
                "description": "Plain-language reading of the state, safe to show a user verbatim.",
                "type": "string"
              },
              "name": {
                "description": "Human name of the provider.",
                "type": "string"
              },
              "reachable": {
                "description": "Whether the status page itself answered.",
                "type": "boolean"
              },
              "service": {
                "description": "The slug that was checked.",
                "type": "string"
              },
              "state": {
                "description": "Normalised state. \"unknown\" means the status page could not be read, NOT that the service is down.",
                "enum": ["operational", "degraded", "down", "unknown"],
                "type": "string"
              },
              "status_page": {
                "description": "URL a human can open to read the full incident history.",
                "type": "string"
              },
              "updated_at": {
                "description": "When the provider last updated the page (ISO 8601).",
                "nullable": true,
                "type": "string"
              }
            },
            "required": ["meaning", "name", "reachable", "service", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Service Status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:30fcca5e0af9ab0d0cc7395f27231b5d9ac0fa020d36f56cebff5d1fea79dc49"
        },
        {
          "name": "list_supported_services",
          "title": "List Supported Services",
          "description": "Which services can be checked.\n\nLists every supported slug with its human name and status page URL. The list is fixed; arbitrary URLs are not accepted.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "services": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "service": {
                      "description": "Slug to pass as ?service=",
                      "type": "string"
                    },
                    "status_page": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Supported Services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:deb842586bfeeb16028aba7a007c035a3dac1920d3e8ae6bbf54f105817b8afa"
        }
      ],
      "digest": "sha256:77c86d6748c9c11528d15db3ca319d0ef460824139fcfde765529c2c34714c3b"
    }
  }
