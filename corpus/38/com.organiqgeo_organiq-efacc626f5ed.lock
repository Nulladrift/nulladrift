      "instructions": "Organiq: Google Search Console data (read-only Google access) (plus GA4 sessions from AI assistants, Bing Webmaster, CrUX Core Web Vitals, URL inspections, sitemaps and the imported AI Overviews impressions report) for the properties connected to the signed-in account; synced daily into Organiq's own database.\nUnits: clicks/impressions: integers; ctr: fraction 0–1 (0.052 = 5.2%); position: impression-weighted average, lower is better; dates: yyyy-mm-dd. (Note: ctr here is a fraction; some other tools report 0–100.)\nsite accepts displayName, Search Console siteUrl, numeric id or a unique substring; list_sites shows the options. Default period: 28 days ending on the last synced date (Search Console lags ~3 days); every response states the period and comparison used.\nTool groups: performance (summary, top queries/pages, time series, one query/page, ranking changes, position bands, brand, folders, long tail, sampling), opportunities (CTR curve, decay, cannibalization, quick wins, striking distance), statistics (anomalies, change points, forecast), ai (GA4 sessions, query shapes, AI Overviews impressions), technical (Core Web Vitals, indexing tracker, indexing requests, inspections, sitemaps), bing, site_audit (get_site_audit, get_audit_issue, find_internal_link_opportunities, request_site_audit), reports (generate_seo_report, get_weekly_digest). get_capabilities lists every tool with when to use it.\nPublic tools without sign-in: get_capabilities, get_ctr_benchmark, check_connection, check_ai_access (check_ai_access reads one public web page of any site: robots.txt for AI robots, llms.txt and JSON-LD; it needs no property and stores nothing). Other tools require an account; without credentials the HTTP layer answers 401 and the client starts OAuth (https://organiqgeo.com/connect/claude) or an API key can be used (https://organiqgeo.com/connect/claude-code). site=\"demo\" is the exception: it answers without sign-in with fictional data of a demonstration site (read-only; the setup tools, request_indexing and request_site_audit do not run on it).\nSearch Console is connected in that OAuth sign-in: the Google login asks for read-only Search Console and GA4 access, creates the Organiq account when there is none and imports the verified properties (one property is activated automatically; with several, the consent screen asks which one). Guide: https://organiqgeo.com/connect/search-console. GA4, Bing and branded terms are set per property by the setup tools (list_ga4_properties, set_ga4_property, set_bing_site, set_bing_key, set_branded_terms; they need the mcp:write scope or an API key with the write scope and write only Organiq settings, never Search Console, GA4 or Bing) or by the user in the panel (\"Integrações\" block at https://app.organiqgeo.com/site/<id>, id from list_sites); guides: https://organiqgeo.com/connect/ga4 and https://organiqgeo.com/connect/bing. The Bing API key is generated by the user in Bing Webmaster Tools and pasted in the chat. request_indexing (mcp:write) queues URLs for IndexNow and, if the user turned it on for the property, the Google Indexing API (which only sends pages with JobPosting or BroadcastEvent structured data, as Google requires; other URLs are checked at send time and listed in get_indexing_requests as skipped with google_not_eligible); it writes only to Organiq and the engines, never to Search Console, and the routes are set in the panel (\"Indexação do site\" at https://app.organiqgeo.com/site/<id>/indexacao). get_capabilities lists them under setup, and check_connection reports which are missing per property.\nSite audit: get_site_audit, get_audit_issue and find_internal_link_opportunities read the latest finished crawl of the property's own site (HTML only, robots.txt respected): page and traffic health scores with the formula, issues by impressions of the affected pages, internal link suggestions from Search Console queries. request_site_audit (mcp:write) queues a new crawl, writes only to Organiq and is refused while one is open or the last finished under 24 hours ago; the audit also runs weekly. Without an audit the read tools state that and point to request_site_audit.\nPrompts: the public skills (ai-traffic, cannibalization, content-decay, geo-audit, optimization-cycle, quick-wins, site-audit, weekly-report) are available as MCP prompts (prompts/list), each with an optional `site` argument.\nErrors are JSON: { error: { code, message, nextStep, docsUrl } }; rate_limited includes retryAfterSeconds; plan_limit means the account plan does not cover the request (history window, GEO add-on) and points to the plans page. plan_limit is not returned while the open launch (all features without a card) is active. Docs: https://organiqgeo.com/docs",
      "tools": [
        {
          "name": "analyze_cannibalization",
          "title": "Query cannibalization",
          "description": "Queries where 2+ pages of the property compete for the same search in the period. Per cluster: totals, Shannon entropy of impressions across pages (bits; higher = more even split = worse; level high >= 1.5, medium >= 1.0), normalized (0–1), winner (most clicks; tie: best position) and the contenders with clicks/impressions/ctr/position/impressionShare. Sorted by entropy and impressions. Protocol/host/hash variants of one URL are canonical hygiene, not cannibalization; brand + home + deep page is usually sitelinks. Use when asked which page should rank for a keyword. / Canibalização de queries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "all (default); branded = only queries containing one of the property's branded_terms; non-branded = the rest. Needs branded terms set on the property in the Organiq panel, otherwise invalid_argument with the panel URL. / Marca × sem marca.",
                "enum": ["all", "branded", "non-branded"],
                "type": "string"
              },
              "country": {
                "description": "Country as ISO-3166-1 alpha-3, as in Search Console: bra, usa, prt, arg.",
                "pattern": "^[a-zA-Z]{3}$",
                "type": "string"
              },
              "days": {
                "description": "Window length in days (default 28). Ignored when startDate and endDate are both given. / Janela em dias.",
                "maximum": 540,
                "minimum": 1,
                "type": "integer"
              },
              "device": {
                "description": "Device.",
                "enum": ["MOBILE", "DESKTOP", "TABLET"],
                "type": "string"
              },
              "endDate": {
                "description": "End yyyy-mm-dd. Default: last synced date of the property (Search Console lags ~3 days; never \"today\"). Every response states the period used. / Fim; padrão = última data sincronizada.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Clusters (default 50).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "minImpressions": {
                "description": "Minimum cluster impressions (default 10; large sites 100).",
                "minimum": 1,
                "type": "integer"
              },
              "minPages": {
                "description": "Minimum pages per query (default 2).",
                "minimum": 2,
                "type": "integer"
              },
              "pageContains": {
                "description": "Only pages whose URL contains this text (case-insensitive), e.g. \"/blog/\".",
                "type": "string"
