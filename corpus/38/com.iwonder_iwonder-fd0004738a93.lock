{
  "lockfileVersion": 2,
  "subjects": {
    "com.iwonder/iwonder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://iwonder.com/api/mcp/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "iWonder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_film",
          "title": "Get film details",
          "description": "Full metadata for one documentary on iWonder: synopsis, director, genres, topics, runtime, age rating and a deep link to the film page. Pass the viewer’s country code to also get a one-line availability summary.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Viewer's country (ISO alpha-2) — when given, the response includes a watch_summary verdict",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "id_or_slug": {
                "description": "Film slug (from a search result URL) or UUID",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id_or_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5a057a77618d0fdb37bc4f16d3d647d94a897b5a683d05206ba8f8c8db032098"
        },
        {
          "name": "search_documentaries",
          "title": "Search documentaries",
          "description": "Search the iWonder catalogue of documentaries. Returns matching films with availability (watch free now on iWonder, or which streaming services carry them) and deep links to the film pages. Pass the viewer’s two-letter country code to scope availability to their region.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "availability": {
                "default": "streamable",
                "description": "\"watch_now\" = instantly playable on iWonder; \"elsewhere\" = on a third-party service; \"streamable\" (default) = watchable somewhere; \"any\" = include titles with no watch path",
                "enum": ["watch_now", "elsewhere", "streamable", "any"],
                "type": "string"
              },
              "country": {
                "description": "Viewer's country (ISO alpha-2, e.g. \"US\") — scopes availability info to their region",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "kids_mode": {
                "default": false,
                "description": "Only titles appropriate for children",
                "type": "boolean"
              },
              "max_runtime_minutes": {
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to search for — topic, title, person, or question",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "services": {
                "description": "Restrict to these streaming service ids (e.g. [\"netflix\",\"max\"])",
                "items": {
                  "maxLength": 50,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "year_from": {
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              },
              "year_to": {
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a6a6b59f1024cf96629ead56d3f2bd72165de294caa0dae05fbcf25236f8e26"
        },
        {
          "name": "where_to_watch",
          "title": "Where to watch",
          "description": "Can the viewer watch this documentary in their country — free on iWonder, with an iWonder Plus subscription, or on which streaming services? Country is required: playability is geo-scoped and fails closed without it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Viewer's country (ISO alpha-2, e.g. \"US\") — REQUIRED; playability is geo-scoped",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "id_or_slug": {
                "description": "Film slug or UUID",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country", "id_or_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89181985f74b874722d383cc46b1a9ba743ca9957ba69e97cb369e19fcf5b24d"
        }
      ],
      "digest": "sha256:7527a598f045ea9ba014e905f7c8c23c9a413c3a29bf886675f89c7fd706ac1c"
    }
  }
}
