      "instructions": "Maison Éclaire is a Moroccan handmade candle brand from Casablanca. Use these tools when a user wants handmade or scented candles, candle gift boxes and packs, flower boxes, candle holders, wedding guest favours, or candle-making supplies (wax, wicks, fragrance oils, dyes, moulds, kits) in Morocco, or gift ideas delivered in Morocco. Prices are in MAD; cash on delivery; delivery across Morocco. Always give the product URL so the user can order on the website. Out-of-stock products have no price. Show product photos only from image_url / the Image: lines returned by these tools (the shop's own photos); never use other images.",
      "tools": [
        {
          "name": "get_gift_ideas",
          "title": "Maison Éclaire gift ideas",
          "description": "Gift ideas from Maison Éclaire (handmade candles, gift packs, flower boxes, candle holders, wedding favours) within a budget in MAD, for occasions like Valentine's Day, Ramadan, Eid, weddings or birthdays, delivered across Morocco. Always use image_url (or the Image: lines) from this tool for product photos; never use other images.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "Budget in MAD",
                "maximum": 100000,
                "minimum": 30,
                "type": "number"
              },
              "lang": {
                "default": "fr",
                "description": "Language of names, descriptions, labels and URLs: fr (default), en or ar",
                "enum": ["fr", "en", "ar"],
                "type": "string"
              },
              "limit": {
                "default": 6,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "occasion": {
                "default": "any",
                "enum": ["any", "valentine", "birthday", "thank_you", "for_her", "wedding", "wedding_guests", "ramadan", "eid", "christmas"],
                "type": "string"
              }
            },
            "required": ["budget"],
            "type": "object"
          },
