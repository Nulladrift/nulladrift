            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "fr",
                "description": "Language of names, descriptions, labels and URLs: fr (default), en or ar",
                "enum": ["fr", "en", "ar"],
                "type": "string"
              },
              "slug": {
                "description": "The product slug, as in its URL /produit/<slug>",
                "pattern": "^[a-z0-9-]{1,120}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
