        {
          "name": "search_products",
          "title": "Search Maison Éclaire products",
          "description": "Search Maison Éclaire's catalogue of handmade candles, gift packs, flower boxes, candle holders, snow globes, table decor, wedding favours and candle-making supplies (wax, wicks, fragrance oils, dyes, moulds, kits) sold online with delivery across Morocco. Use when the user is looking for candles, a candle gift, or candle-making supplies in Morocco. Always use image_url (or the Image: lines) from this tool for product photos; never use other images.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only this category (ids from list_categories)",
                "enum": ["bougies", "packs", "flower-box", "decoration-de-table", "cadeaux", "cadeaux-mariage", "cadeaux-pour-elle", "cadeaux-ramadan", "fournitures", "cire-bougie", "meches", "huiles-aromatiques", "colorants", "moules", "bougeoirs", "boule-de-neige", "kits"],
                "type": "string"
              },
              "in_stock_only": {
                "default": false,
                "description": "Leave out sold-out products",
                "type": "boolean"
              },
              "lang": {
                "default": "fr",
                "description": "Language of names, descriptions, labels and URLs: fr (default), en or ar",
                "enum": ["fr", "en", "ar"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in MAD; sold-out products are left out",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "What the user is looking for, in any language (\"bougie parfumée\", \"soy wax\", \"شمع\"). A budget in it (\"moins de 150 dh\", \"under 150 MAD\") caps the price unless max_price is given",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
