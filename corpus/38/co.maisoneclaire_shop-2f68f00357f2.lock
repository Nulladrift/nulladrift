        {
          "name": "get_product",
          "title": "Get a Maison Éclaire product",
          "description": "Full details of one Maison Éclaire product by its slug (from search_products or a /produit/<slug> URL): localized name and description, price and variant prices when in stock, photos and product URL. Always use image_url (or the Image: lines) from this tool for product photos; never use other images.",
