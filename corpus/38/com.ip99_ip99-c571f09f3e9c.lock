        "name": "ip99",
        "title": "IP99 IP risk & geolocation",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "IP risk and geolocation lookup. Free without an API key: 500 lookups per day per client IP and 60 per minute; higher limits with an API key sent as the X-API-Key header (https://ip99.com/en/pricing). Scores measure the freshness of verifiable risk evidence, not the probability that an address is an attacker; a score of 0 with evidence_state=none means no evidence is held, not that the address is safe.",
      "tools": [
        {
          "name": "ip_risk_lookup",
          "title": "IP risk & geolocation lookup",
          "description": "Look up the risk profile and geolocation of an IPv4 or IPv6 address. Returns a 0-100 risk score measuring the freshness and strength of verifiable risk evidence (proxy, VPN, dial-up pool, cloud phone, datacenter), the evidence state, network (ASN, usage type) and geographic attribution. The score is NOT a probability that the address is an attacker. Free tier: 500 lookups per day per client IP and 60 per minute; higher limits with an API key sent as the X-API-Key header (https://ip99.com/en/pricing).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ip": {
                "description": "The IPv4 or IPv6 address to look up, e.g. 8.8.8.8 or 2001:4860:4860::8888.",
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
