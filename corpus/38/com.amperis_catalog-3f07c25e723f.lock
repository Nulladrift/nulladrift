        },
        {
          "name": "find_products",
          "title": "Find products by specification",
          "description": "Filter the catalogue by numeric specifications, category and words. Each requirement is a quantity with a unit and a minimum and/or maximum, e.g. {\"unit\":\"A\",\"min\":200} for at least 200 A of test current, {\"unit\":\"kg\",\"max\":10} for at most 10 kg, {\"unit\":\"kV\",\"min\":12}. A product meets \"min\" when its specifications reach that value, and \"max\" when they go down to it. \"spec\" optionally limits a requirement to specification rows whose label contains that text (e.g. \"current\", \"weight\"). Products without any figure in that unit are left out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional. Category URL or part of its name.",
                "maxLength": 300,
                "type": "string"
              },
              "include_discontinued": {
                "description": "Default false.",
                "type": "boolean"
              },
              "lang": {
                "description": "Language of the catalogue content. Default: es.",
                "enum": ["es", "en", "fr", "pt", "it", "de"],
                "type": "string"
              },
              "requirements": {
                "description": "Numeric requirements.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "max": {
                      "type": "number"
                    },
                    "min": {
                      "type": "number"
                    },
                    "spec": {
                      "description": "Optional. Only specification rows whose label contains this text (English or the chosen language).",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "unit": {
                      "description": "Unit with or without prefix: A, mA, kA, V, kV, Ω, mΩ, µΩ, W, kW, VA, kVA, Hz, kg, g, mm, m, °C, pC, nF, s, ms, bar, ppm...",
                      "maxLength": 10,
                      "type": "string"
                    }
                  },
                  "required": ["unit"],
                  "type": "object"
                },
                "maxItems": 6,
                "type": "array"
              },
              "words": {
                "description": "Optional. Words that must all appear in the product page (e.g. \"Bluetooth IP67\").",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "number"
              },
              "products": {
                "items": {
                  "properties": {
                    "category": {
                      "type": ["string", "null"]
                    },
                    "datasheet": {
                      "type": ["string", "null"]
                    },
                    "description": {
                      "type": "string"
                    },
                    "matches": {
                      "items": {
                        "properties": {
                          "product_range": {
                            "type": "string"
                          },
                          "rows": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "unit": {
                            "type": "string"
                          }
                        },
                        "required": [],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find products by specification"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b458af928b2f3894cc5d3b9be09d157a2a8531b3ba2acc1e53288f198fff7a51"
