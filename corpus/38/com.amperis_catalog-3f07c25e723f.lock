        {
          "name": "search_catalog",
          "title": "Search the Amperis catalogue",
          "description": "Search over amperis.com (product pages, categories, technical articles and glossary). Give the need or the model in natural language, e.g. \"micro-ohmmeter 200 A for circuit breaker contacts\" or \"AMIC-10K1\". Figures with units in the query (\"200 A\", \"12 kV\") are compared with the product specifications. Returns the best matching pages with title, URL, type and an excerpt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the catalogue content. Default: es.",
                "enum": ["es", "en", "fr", "pt", "it", "de"],
                "type": "string"
              },
              "query": {
                "description": "What to look for, in any of the six languages.",
                "maxLength": 600,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query_lang": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "category": {
                      "type": ["string", "null"]
                    },
                    "datasheet": {
                      "type": ["string", "null"]
                    },
                    "excerpt": {
                      "type": "string"
                    },
                    "meets": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "misses": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "rank": {
                      "type": "number"
                    },
                    "title": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["product", "category", "article"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["rank", "title", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Amperis catalogue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
