        {
          "name": "get_product",
          "title": "Get one product",
          "description": "Full content of one product page as Markdown: key data, advantages, applications, specification table and FAQ, plus its category, datasheet PDF and the URL of the same page in the other languages. The specification table also comes as data. Identify the product by its URL (preferred) or by model or name, e.g. \"RMO-H\" or \"Shark 100\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the catalogue content. Default: es.",
                "enum": ["es", "en", "fr", "pt", "it", "de"],
                "type": "string"
              },
              "product": {
                "description": "Product URL on amperis.com, or model / name.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
