      "instructions": "Public, read-only catalogue of Amperis Products S.L. (Lugo, Spain): test, measurement and diagnostic equipment for electrical substations (insulation, transformers, circuit breakers and SF6, power quality, thermal and corona cameras, partial discharge, relays, batteries), plus the engineering calculators of amperis.com (IEEE/IEC formulas). Content is available in es, en, fr, pt, it and de through the \"lang\" argument. Amperis sells on quotation, so the catalogue contains no prices; how_to_request_quote returns the contact details and a pre-filled contact form link.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Side-by-side table of the specifications of 2 to 4 products (by URL, model or name), with the rows aligned by label, plus each one's description and datasheet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the catalogue content. Default: es.",
                "enum": ["es", "en", "fr", "pt", "it", "de"],
                "type": "string"
              },
              "products": {
                "description": "Product URLs, models or names.",
                "items": {
                  "maxLength": 300,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "products": {
                "items": {
                  "properties": {
                    "category": {
                      "type": ["string", "null"]
                    },
                    "datasheet": {
                      "type": ["string", "null"]
                    },
                    "description": {
                      "type": "string"
                    },
                    "discontinued": {
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "rows": {
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "values": {
                      "items": {
                        "type": ["string", "null"]
                      },
                      "type": "array"
                    }
                  },
                  "required": ["label", "values"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["products", "rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare products"
          },
          "behavior": {
