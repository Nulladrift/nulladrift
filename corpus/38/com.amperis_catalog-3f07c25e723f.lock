        {
          "name": "how_to_request_quote",
          "title": "How to request a quotation",
          "description": "Contact details of Amperis and the contact page in the given language. Amperis has no public price list: quotations, delivery times and availability are given on request. With \"product\" (and optionally quantity and country) it also returns a link to the contact form with the request already written; the person reviews it and sends it from amperis.com. Nothing is sent by this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional. Destination country.",
                "maxLength": 60,
                "type": "string"
              },
              "lang": {
                "description": "Language of the catalogue content. Default: es.",
                "enum": ["es", "en", "fr", "pt", "it", "de"],
                "type": "string"
              },
              "product": {
                "description": "Optional. Product URL, model or name.",
                "maxLength": 300,
                "type": "string"
              },
              "quantity": {
                "description": "Optional.",
                "maximum": 999,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "contact_page": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "form_url": {
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "product": {
                "type": ["string", "null"]
              }
            },
            "required": ["contact_page", "email", "phone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to request a quotation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f5e1e1e8f53d16131762e9c2ffee3754f382a7920c4cb3ba07a7c4d9cd7007b"
        },
        {
          "name": "list_calculators",
          "title": "List engineering calculators",
          "description": "The engineering calculators of amperis.com (insulation resistance IEEE 43, winding resistance, batteries IEEE 485/450, dissolved gas analysis IEC 60599/IEEE C57.104, moisture in oil, SF6, bushing tan delta, earthing IEEE 80, transformer loading IEEE C57.91, power quality, cable sizing, insulating liquids IEC 61620, transformer tests IEC 60076-1, motors IEC 60034-1). Without \"calculator\": the list with their operations. With \"calculator\": every operation with its parameters, the input fields it reads and the notes of the formula (notes are in Spanish).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calculator": {
                "description": "Optional. Calculator id from the list.",
                "maxLength": 40,
                "type": "string"
              },
              "lang": {
                "description": "Language of the catalogue content. Default: es.",
                "enum": ["es", "en", "fr", "pt", "it", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculators": {
                "items": {
                  "properties": {
                    "about": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "operations": {
                      "items": {
                        "properties": {
                          "fields": {
                            "type": "object"
                          },
                          "name": {
                            "type": "string"
                          },
                          "notes": {
                            "type": "string"
                          },
                          "params": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          }
                        },
                        "required": ["name"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["calculators"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List engineering calculators"
          },
          "behavior": {
