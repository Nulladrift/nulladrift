        {
          "name": "run_calculator",
          "title": "Run an engineering calculator",
          "description": "Runs one operation of an amperis.com calculator with the same formulas as its web page and returns the result as JSON. Call list_calculators with the calculator id first to see the operation names, their parameters and the input fields. \"input\" is either a list of the positional parameters, or, for operations that take one object (parameter \"e\"), that object with the fields named in list_calculators.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calculator": {
                "maxLength": 40,
                "type": "string"
              },
              "input": {
                "anyOf": [
                  {
                    "maxItems": 16,
                    "type": "array"
                  },
                  {
                    "type": "object"
                  }
                ],
                "description": "Positional arguments (array) or the input object."
              },
              "lang": {
                "description": "Language of the catalogue content. Default: es.",
                "enum": ["es", "en", "fr", "pt", "it", "de"],
                "type": "string"
              },
              "operation": {
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["calculator", "input", "operation"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calculator": {
                "type": "string"
              },
              "operation": {
                "type": "string"
              },
              "page": {
                "type": "string"
              },
              "result": {}
            },
            "required": ["calculator", "operation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Run an engineering calculator"
          },
          "behavior": {
            "destructive": false,
