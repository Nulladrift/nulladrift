        {
          "name": "add_memory",
          "title": "Remember something",
          "description": "Save a memory entry Besidka uses in future chats. Besidka refuses sensitive topics (health, religion, politics and similar) and never stores ids, card numbers, passwords or keys. Requires signing in (memory:write).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "body": {
                "description": "The fact to remember, up to 4096 bytes",
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              },
              "category": {
                "description": "profile, preferences, areas, topics or people",
                "enum": ["profile", "preferences", "areas", "topics", "people"],
                "type": "string"
              },
              "description": {
                "description": "One-line summary used as the memory index",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "projectId": {
                "description": "Save to this project memory instead of your account",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "description": "Short one-line title",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["body", "category", "description", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
