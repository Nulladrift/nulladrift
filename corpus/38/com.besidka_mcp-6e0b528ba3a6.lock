        {
          "name": "create_artifact",
          "title": "Create an artifact",
          "description": "Save content you wrote as a new Besidka artifact (version 1) in your library and return its id and a link to open it in Besidka. Use it when the user asks for an artifact, asks to save content in Besidka, or wants an app, interactive page, quiz, game or document to keep there; otherwise answer diagrams and code in your reply. Artifacts run in a sandbox without network access, so the content must be self-contained. html and react artifacts already load Tailwind CSS 4 and daisyUI 5 with the Besidka theme: style with their class names and theme colours, never link a CDN or external fonts. It counts against your artifact storage and uses none of your API keys. React artifacts need the React artifacts feature. Requires signing in (artifacts:write).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content": {
                "description": "The full content, up to 200000 characters",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              },
              "kind": {
                "description": "html: one self-contained HTML document with inline JS, styled with daisyUI and Tailwind classes; react: one JSX module whose default export is a component; svg: one SVG image; mermaid: one Mermaid diagram; markdown: a Markdown document",
                "enum": ["html", "react", "svg", "mermaid", "markdown"],
                "type": "string"
              },
              "title": {
                "description": "A short title, up to 120 characters",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["content", "kind", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
