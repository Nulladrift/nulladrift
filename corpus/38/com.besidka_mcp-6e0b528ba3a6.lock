        },
        {
          "name": "add_project_text",
          "title": "Add text to a project",
          "description": "Add text to the knowledge of one of your Besidka projects, as one item (name and text) or up to 10 items in one call (items). This is the route for documents: send a spreadsheet as CSV or a markdown table, one item per sheet or per file, named after the source (for example timesheet-2026-09.csv); slides as markdown with one heading per slide; a PDF or Word document as markdown. Besidka does not accept the binary file itself through MCP, so read or extract the content first. Text identical to an existing item is refused (in a batch it is listed under skipped). Requires signing in (projects:write).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "items": {
                "description": "Up to 10 items added in one call, for example one per month. The text of all items together is limited to 200000 characters. Use instead of name and text",
                "items": {
                  "properties": {
                    "name": {
                      "description": "File name or title, for example timesheet-2026-09.csv",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "text": {
                      "description": "Plain text, CSV or markdown of this item",
                      "maxLength": 200000,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name", "text"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "description": "File name or title of a single item, for example notes.md. Use together with text, instead of items",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "projectId": {
                "description": "Project id from list_projects or create_project",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "text": {
                "description": "Plain text, CSV or markdown of a single item, up to 200000 characters. Use together with name, instead of items",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["projectId"],
            "type": "object"
          },
