        {
          "name": "prepare_mockup",
          "title": "Prepare a mockup",
          "description": "Turn a product photo (media-library fileId or imageUrl) into a ready mockup: segments the printable surface, places the print quad for the surface type and stores the mask and wrinkle maps. Returns warpNode (patch for addNode type \"warp\") and mockup (set baseId to the photo layer). area / areas[] add print areas on one photo; scene relights or re-stages the photo first (returns baseUrl). Costs credits (segment, depth, image-edit for a scene), reported as creditsCharged; nothing is charged if a step fails. See MOCKUPS in the creative-authoring guide.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Name of this print area, e.g. \"Front\". Stored on mockup.area; the editor lists a photo's areas by it.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "areas": {
                "description": "More print areas on the same photo (each is its own warp layer sharing the photo and wrinkles). +1 segment op each. Returned in areas[].",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "description": "Area name: \"Back\", \"Sleeve\", \"Pocket\", \"Label\" or your own.",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maskPrompt": {
                      "description": "What to segment for this area, e.g. \"the left sleeve\". Defaults from the label.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["label"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "baseBox": {
                "description": "Where you will place the base image layer in the artboard (CSS box). Default: 0,0 at the photo's pixel size. The returned warp box is computed against it.",
                "properties": {
                  "h": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "w": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "x": {
                    "type": "number"
                  },
                  "y": {
                    "type": "number"
                  }
                },
                "required": ["h", "w", "x", "y"],
                "type": "object"
              },
              "behindGlass": {
                "description": "The print sits behind glass (a poster in a shop window or a glazed frame): keep the glass's reflections over it (blend.reflect 0.3, mockup.glassBlack measured). Screens get this by default. Costs nothing extra.",
                "type": "boolean"
              },
              "enhance": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  }
                ],
                "description": "Enhance photo detail: AI-upscale the photo first so cloth texture holds up when zoomed (+1 upscale op). true = auto (4x up to 1024 px, else 2x); 2 or 4 picks the factor (2 is safer on flat cotton, where 4x can invent cloth bands). Returns the new baseUrl."
              },
              "fileId": {
                "description": "Media-library file id of the product photo (from upload_media). Use this or imageUrl.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "imageUrl": {
                "description": "URL of the product photo. Prefer a media-library URL (upload_media first): the base layer renders from this URL.",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              },
              "maskPrompt": {
                "description": "What to segment, e.g. \"the t-shirt\", \"the mug body\", \"the phone screen\". Defaults per surface.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "occluderPrompt": {
                "description": "What sits in front of the print, e.g. \"the hand\" or one of hand, strap, cord, hair, sleeve: the print hides behind it (+1 segment op).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "points": {
                "description": "Optional clicks (0..1 of the photo) to steer segmentation: label 1 = include, 0 = exclude.",
                "items": {
                  "properties": {
                    "label": {
                      "anyOf": [
                        {
                          "const": 0,
                          "type": "number"
                        },
                        {
                          "const": 1,
                          "type": "number"
                        }
                      ]
                    },
                    "x": {
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "y": {
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["label", "x", "y"],
                  "type": "object"
                },
                "maxItems": 32,
                "minItems": 1,
                "type": "array"
              },
              "printEffect": {
                "description": "Print technique: screenPrint, dtg, embroidery, puff, foil (each sets its look preset and shading), or none (default).",
                "enum": ["none", "screenPrint", "dtg", "embroidery", "puff", "foil"],
                "type": "string"
              },
              "recolor": {
                "additionalProperties": false,
                "description": "Recolour the product (inside the segmented mask) on every render, e.g. a white tee printed navy. Costs nothing extra.",
                "properties": {
                  "color": {
                    "description": "Target colour: \"#1e3a8a\", \"rgb(30 58 138)\", or a binding such as \"{{ color }}\" / \"{{ brand.colors.primary }}\" resolved per render.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "keepLum": {
                    "description": "true keeps the photo's own brightness (hue and saturation change only); false (default) takes the colour's own tone with the photo's folds and light.",
                    "type": "boolean"
                  },
                  "strength": {
                    "description": "0..1 mix over the original photo. Default 1.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["color"],
                "type": "object"
              },
              "scene": {
                "additionalProperties": false,
                "description": "Relight the photo or place the product in a new setting with AI before segmenting (+1 image-edit op, 3 credits by default). The returned baseUrl is the new photo; mockup.originalBaseSrc keeps the original.",
                "properties": {
                  "preset": {
                    "description": "Relight (keeps the photo's geometry): studio-soft, spotlight, sunlit-blinds, window-light, golden-hour, overcast. New setting: concrete-wall, cafe, marble-counter, linen-table, street.",
                    "enum": ["studio-soft", "spotlight", "sunlit-blinds", "window-light", "golden-hour", "overcast", "concrete-wall", "cafe", "marble-counter", "linen-table", "street"],
                    "type": "string"
                  },
                  "prompt": {
                    "description": "A short note in plain words, added to the preset (e.g. \"warmer, light from the right\"); alone it relights the photo.",
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "strength": {
                "description": "How far wrinkles push the print, in photo px. Default per surface (fabric 12, paper 4).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "surface": {
                "description": "What the print lands on: fabric (garments, bags), screen (phones, laptops — emissive, no shading), paper (posters, books), rigid (boxes, signs, caps), label (mugs, cans, bottles).",
                "enum": ["fabric", "screen", "paper", "rigid", "label"],
                "type": "string"
              },
              "wrinkles": {
                "description": "Estimate depth and derive wrinkle displacement so the print follows folds (+1 depth op). Default: on for fabric; set true for crumpled paper.",
                "type": "boolean"
              }
            },
            "required": ["surface"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
