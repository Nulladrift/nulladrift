        {
          "name": "render_template",
          "title": "Render a creative",
          "description": "Render a creative template to a file and return its URL. Stills: png, webp, svg, pdf. Video: mp4, webm, gif, or zip for a frame sequence. Pass `variables` for the template's variables, `variation` for a saved variation, `brand` (name, brandId or URL of a brand in your space) to render under another brand for this render only — the template keeps its own, nothing is written — and `brandVariant` to render under a campaign (e.g. [\"xmas\"]). The result says what it cost: `creditsCharged` and `balanceAfter`. Renders are logged and fire the render.completed webhook.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Render under ANOTHER brand of your space for this render only — a brandId, brand name or the brand's website URL (looked up, never fetched or created). The template keeps its own brand, so renders of one template under several brands do not race and nothing is written. Another space's brand is BRAND_NOT_FOUND; a name matching several brands is BRAND_AMBIGUOUS (pick a candidate brandId).",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "brandTokens": {
                "additionalProperties": {},
                "description": "Brand token values to render with, REPLACING the resolved brand entirely. For \"render exactly these colours\" — usually you want brand or brandVariant instead. Exclusive with brand.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "brandVariant": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 15,
                    "type": "array"
                  }
                ],
                "description": "Brand campaign variant ids (e.g. [\"xmas\"]) to render under. Replaces what the brand has applied, so the output is deterministic."
              },
              "brandVariantMode": {
                "description": "add = layer brandVariant on top of what the brand already has applied. Default replace.",
                "enum": ["replace", "add"],
                "type": "string"
              },
              "clickUrl": {
                "description": "html5 only, required: absolute http(s) destination the ad opens on click.",
                "maxLength": 4096,
                "type": "string"
              },
              "dpi": {
                "description": "pdf only: print resolution. Page size = pixels × 72 / dpi points (a 1200×1800 px label at 300 is a 4×6 in page). Default: the template's exportDefaults.dpi, else 300 on a print-size template (A4, Letter, business card, 4×6 label…), else 72 (1 px = 1 pt).",
                "maximum": 1200,
                "minimum": 72,
