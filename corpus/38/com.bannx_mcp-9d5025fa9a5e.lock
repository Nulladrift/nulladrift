                      {
                        "enum": ["creative", "video", "doc", "html-ad", "mockups", "backgrounds"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Output type the gallery files it under: creative (stills/designs), video, doc (PDFs)."
                  },
                  "isPremium": {
                    "description": "PLATFORM ADMIN ONLY. Marks the template as premium (paid plans). Anyone else gets a 403 and nothing is written.",
                    "type": "boolean"
                  },
                  "motion": {
                    "anyOf": [
                      {
                        "enum": ["auto", "animated", "still"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Whether the template is animated (offers video export and plays on its page). auto (default) detects keyframes, video/audio, compositions, scene transitions, time-based shaders (u_time) and $time/$frame bindings; animated / still override detection. The video length is the scene durations (updateScene { duration }). null resets to auto."
                  },
                  "name": {
                    "description": "Template name.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "pageFlow": {
                    "anyOf": [
                      {
