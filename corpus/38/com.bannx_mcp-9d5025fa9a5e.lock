        {
          "name": "create_social_post",
          "title": "Schedule or publish a social post",
          "description": "Post text and optional media (a render_template `url` in `mediaUrls`, or `fileIds` from upload_media / render_template; several files = one multi-image post, in order) to connected accounts. Set exactly one of `scheduledAt` (future ISO datetime) or `publishNow: true`; prefer scheduling and confirm with the user first. OPT-IN: the key must list this tool and its owner be owner/admin/editor. If the space requires approval for API keys, status is \"pending_approval\" until a person approves it in bannx (agents cannot); unapproved by its time it expires, so tell the user.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fileIds": {
                "description": "Media library file ids (upload_media's `fileId`, or render_template's `fileId` / `pageUrls[].fileId`) to attach to every channel, in order — several images post as a carousel (at most the platform's media.maxCount from list_social_accounts).",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "firstComment": {
                "description": "A comment posted under the post right after it is live, on platforms that support it.",
                "maxLength": 60000,
                "type": "string"
              },
              "mediaUrls": {
                "description": "Hosted URLs of files already in this space's media library: a render_template or upload_media `url`. Any other URL is refused; nothing is fetched.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "publishNow": {
                "description": "true to publish immediately. Give this OR scheduledAt, never both. Publishing is public and cannot be undone by bannx.",
                "type": "boolean"
              },
              "scheduledAt": {
                "description": "ISO 8601 datetime (e.g. 2026-11-02T09:30:00Z) in the future. Give this OR publishNow, never both.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                "type": "string"
