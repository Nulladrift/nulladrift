      "instructions": "bannx renders designs (stills, PDFs, short videos, social posts) from editable templates plus data. You design through operations on a document model, never by hand-writing markup.\nOrder of work: 1) get_guide \"creative-authoring\" before the first create_template / apply_template_ops of a session (the op vocabulary, the scene frame, coordinates, stills vs motion), plus \"template-expressions\" when binding data and \"brand-tokens\" when styling from a brand. 2) resolve_brand / get_brand for the brand the design is for; search_icons (not whole icon collections) for glyphs; list_shader_presets only when a shader background is wanted. 3) create_template (new) or apply_template_ops (edit, dryRun: true to preview); read its results and warnings and fix before rendering. 4) render_template (pages: \"all\" for carousels) — it costs credits; then publish_template for the public page, create_social_post to post.\nReading: whoami (space, key scopes), list_templates (this space), get_template (a template's render inputs: variables, variations, samples), get_template_document (its layer tree with node ids, live), list_public_templates / get_public_template (the gallery, as design references). Deleting: delete_template_nodes removes layers or scenes inside a template; delete_template removes the whole template for good. Media: upload_media. Mockups: prepare_mockup. History: save_template_version before a large edit batch, list_template_versions to list, restore_template_version to go back (the current state is saved first). Workspace shaders: list_shaders / create_shader / update_shader — raw shader source is only accepted there, never in a node patch.\nVariables are the template's inputs: declare them in create_template / apply_template_ops and bind them in layers ({{ name }}) — a declared variable no layer reads is reported as unbound and ignored by renders. Expressions have no method calls: slice(list, 0, 3), not list.slice(0, 3).",
      "tools": [
        {
          "name": "apply_template_ops",
          "title": "Edit a creative",
          "description": "Apply a batch of operations in order and persist — all or nothing: if any op fails nothing is written and the error names the op. Add, move and restyle nodes, add scenes, set keyframes. addNode { ref: \"card\" } lets later ops in the batch use \"$card\"; addNode also nests children: [...], so a tree can be built and animated in one call. dryRun: true checks without writing. Returns per-op results, refs → node ids and a layer summary (snapshot: \"full\" for every prop). See the creative-authoring guide for the operation vocabulary.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "dryRun": {
                "description": "Validate and apply the batch on a scratch copy and return the would-be results, refs and snapshot without writing anything (settings are not applied either).",
                "type": "boolean"
              },
              "note": {
                "description": "Optional: a few words on what this batch is for (\"Tightening the headline\"). Shown next to your cursor to people who have the template open; plain text, cut to 48 characters.",
                "maxLength": 80,
                "type": "string"
              },
              "operations": {
                "default": [],
                "description": "Batch of operations, applied in order and ALL-OR-NOTHING: the whole batch is validated first (schema, refs, every node id exists) and if any op fails nothing is written — the error names the op index, type and path. Build a tree in ONE call with client refs: addNode { ref: \"card\", … } then \"$card\" wherever a node id goes later in the same batch (parentId, nodeId, targetId, nodeIds, componentId, instance override keys, a mockup warp's mockup.baseId, variation keys \"$card.fill\"); the result maps refs → real ids. addNode also takes nested children: [{ type, props, ref?, children? }] (the parent must be a frame/board). Ops: setVariables (declare/update/remove template variables: { variables: [{ name, type: string|number|boolean|color|image|richtext|signature|code|shader|array|object, label, default, hidden? (helper variable: off the public form, bulk columns and API docs, still resolvable/overridable) }], remove, samples: [{ id?, name, values }] (≤10 sample value sets for previews), removeSamples }), setVariations (named override sets — dark mode, seasonal looks — in single-/multi-select groups: { groups: [{ name, type: single-select|multi-select }], variations: [{ id?, name, group, enabled, overrides: { \"<nodeId>.<prop path>\": value | null }, replaceOverrides }], remove, removeGroups }; render one or a stack with render_template { variation }), addNode, updateNode, moveNode, addScene, updateScene, setActiveScene, setArtboard, setKeyframes, clearKeyframes, setMainFrame, extractFrameToScene, groupIntoBoard, stageNode, selectNodes, setTime, setPlayback. Reusable parts: a frame with isComponent is a master; addNode { type: \"instance\", props: { componentId, overrides, timeOffset } } places it (see COMPONENTS in the creative-authoring guide). A {{ name }} bound in a layer without a declaration is auto-declared as a string (result lists autoDeclaredVariables) — declare explicitly for the right type, label and default. For an icon, addNode { type: \"svg\", props: { icon: \"ph:house\", w, h, x, y } } — the name resolves to markup. Copy with emphasis (a highlighted word, a bold price) = one text node bound to a richtext variable whose value carries <b>/<i>/<mark>/<font color> markup — see RICH TEXT in the creative-authoring guide. May be empty when only settings are passed.",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "maxItems": 300,
                "type": "array"
              },
              "settings": {
                "additionalProperties": false,
                "description": "Template metadata to set in the same call: name, description, exportDefaults, sizes, credentials (verified documents), and (platform admins only) slug, format, category, featuredOrder, isPremium. Written only after the operations all succeed; an unauthorized field fails the whole call with nothing written. Publishing is not done here (platform admins list a template in the gallery with publish_template).",
                "properties": {
                  "category": {
                    "anyOf": [
                      {
                        "maxLength": 80,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Gallery category, one of: social-media, carousels, marketing, ads, ecommerce, business, brand-guidelines, og-image, certificate, event, product, finance, documents, logistics, publishing, developer, career, occasion, food, real-estate, automotive, travel, sports, education, backgrounds. null clears."
                  },
                  "credentials": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "enabled": {
                            "type": "boolean"
                          },
                          "expiresInDays": {
                            "maximum": 3650,
                            "minimum": 1,
                            "type": "integer"
                          },
                          "expiresVariable": {
                            "maxLength": 64,
                            "minLength": 1,
                            "type": "string"
                          },
                          "kind": {
                            "enum": ["certificate", "idcard", "badge"],
                            "type": "string"
                          },
                          "photoVariable": {
                            "maxLength": 64,
                            "minLength": 1,
                            "type": "string"
                          },
                          "publicFields": {
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "label": {
                                  "maxLength": 60,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "variable": {
                                  "maxLength": 64,
                                  "minLength": 1,
                                  "type": "string"
                                }
                              },
                              "required": ["label", "variable"],
                              "type": "object"
                            },
                            "maxItems": 12,
                            "type": "array"
                          },
                          "subjectKeyVariable": {
                            "maxLength": 64,
                            "minLength": 1,
                            "type": "string"
                          },
                          "title": {
                            "maxLength": 80,
                            "type": "string"
                          }
                        },
                        "required": ["enabled", "kind"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Verified documents: every real render issues a document with a public verify page (bannx.com/verify/<id>; bind a qrcode payload to \"{{ credential.url }}\"). { enabled, kind: certificate|idcard|badge, title?, publicFields: [{ variable, label }] (≤ 12), photoVariable? (image variable, idcard/badge), expiresVariable? | expiresInDays?, subjectKeyVariable? }. Every variable named must be declared (a setVariables op in the same call counts). A published template needs publish_template again before API renders issue. null turns it off. See VERIFIED DOCUMENTS in the creative-authoring guide."
                  },
                  "description": {
                    "anyOf": [
                      {
                        "maxLength": 2000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "What the template is for (gallery card + search). null clears."
                  },
                  "exportDefaults": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "dpi": {
                            "maximum": 1200,
                            "minimum": 72,
                            "type": "integer"
                          },
                          "format": {
                            "enum": ["png", "svg", "pdf", "mp4", "webm", "gif", "zip", "html5"],
