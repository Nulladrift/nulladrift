                    "description": "The download the template page offers first: { format: png|svg|pdf|mp4|webm|gif|zip|html5, scale?, fps?, network? (HTML5 ad network id), dpi? (PDF print resolution 72–1200: page = px × 72 / dpi pt; unset = 300 on print sizes, else 72) }. Unset/null follows the artboard size: ad sizes → html5 (google-ads), document sizes → pdf, video sizes → mp4, otherwise png. get_template reports the resolved value as exportDefaults."
