        {
          "name": "create_shader",
          "title": "Create a shader",
          "description": "Create and sandbox-vet a WGSL shader; rejection saves nothing and returns errors to fix. Write fn mainImage(uv: vec2f) -> vec4f; uv starts top-left. Use bare u_time, u_resolution and input names; numeric inputs need min/max. Colors: array<vec4f, maxItems> plus <name>Count (maxItems 2-8). Images: type texture with a default URL; sample with textureSample(name, nameSampler, uv); nameSize gives pixel dimensions. Place via apply_template_ops addNode { type: \"shader\", props: { shaderId } }.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "maxLength": 500,
                "type": "string"
              },
              "inputs": {
                "default": [],
                "items": {
                  "properties": {
