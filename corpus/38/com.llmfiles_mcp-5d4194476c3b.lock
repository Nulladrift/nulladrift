{
  "lockfileVersion": 2,
  "subjects": {
    "com.llmfiles/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://llmfiles.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "llmfiles",
        "title": "LlmFiles",
        "version": "1.50.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LlmFiles converts documents (PDF, DOCX, PPTX, XLSX, CSV, HTML, EPUB, JSON, XML, YAML, RTF, ZIP and 24 formats in total) to clean Markdown for LLMs and RAG. Call check_pdf first when a PDF converter has failed on a file: it says per page whether the text layer is missing, so you know whether OCR is needed. Nothing is stored: the file is converted in memory and the response is the result. Free tier: 25 conversions per day per IP, 25 MB per file.",
      "tools": [
        {
          "name": "check_pdf",
          "title": "Check whether a PDF has a text layer",
          "description": "Per-page verdict for a PDF: text, scan (a picture with no text), empty, encrypted or broken, plus the exact command to fix it (ocrmypdf --skip-text for a mixed file, --redo-ocr for a full scan, qpdf --decrypt for a password). Use it when a PDF conversion returned no text. Free — this check does not use the quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_base64": {
                "description": "The PDF, base64-encoded.",
                "type": "string"
              },
              "filename": {
                "description": "PDF file name, e.g. paper.pdf",
                "type": "string"
              }
            },
            "required": ["content_base64", "filename"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1a97e6d2c528fc3b6196cb9c1edc3f973eeaab6a8fbc096bd1c5a53c73cd1bf"
        },
        {
          "name": "convert_file",
          "title": "Convert a document to Markdown",
          "description": "Convert one file to Markdown, locally on LlmFiles (nothing is kept). Pass the file contents base64-encoded together with its name: the extension picks the converter, so `report.docx` and `report.pdf` take different paths. HTML pages are stripped of navigation, sidebars and ¶ permalinks by default. Returns the Markdown as text; documents without a text layer (scanned PDF, binary junk) come back as an error with the reason, and no quota is charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_base64": {
                "description": "The file itself, base64-encoded (a data: URL prefix is accepted).",
                "type": "string"
              },
              "filename": {
                "description": "File name with extension, e.g. report.docx or notes.json — the extension decides which converter runs.",
                "type": "string"
              },
              "strip_nav": {
                "default": true,
                "description": "HTML only: true drops menus, sidebars, footers and ¶ permalinks and keeps article text; false converts the page as it is.",
                "type": "boolean"
              }
            },
            "required": ["content_base64", "filename"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:284b99e6a1785b2d5561a94c6ed00be144efadcea79a17f51dda7e95a855d3d0"
        },
        {
          "name": "list_formats",
          "title": "List accepted file formats",
          "description": "Every extension LlmFiles accepts and what it becomes in Markdown. Call it when unsure whether a format is supported before asking a user for a file.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b32cd888b5427c928f2d1245ed4d1ea283fa89859a68f6f65e18f90e3ac37a46"
        }
      ],
      "digest": "sha256:4902256c928699ba485857befbf278276e34c16e58f27b6122c5ff342cce3ed1"
    }
  }
}
