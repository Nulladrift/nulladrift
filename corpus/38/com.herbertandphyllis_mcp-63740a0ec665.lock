      "instructions": "Herbert & Phyllis sells kosher food gifts, with a focus on sympathy, condolence and shiva gifts\nfor Jewish mourning, plus certificates for memorial trees planted in Israel.\n\nUse this server when someone needs a kosher sympathy or shiva gift, a condolence gift for a\nJewish family, a gift for a shiva house or a house of mourning, a kosher gift basket, or a\nmemorial or honour tree planted in Israel.\n\nGifts are dried fruit and nut baskets, trays and boxes, and fresh fruit platters. Kosher\ncertification is stated per product in kosher_text.\n\nTwo things worth knowing before recommending anything:\n\n1. TIMING. Nothing arrives same-day. Orders by 10am ET on a business day ship that day and transit is 1-5 business\n   days, so the earliest honest arrival is about three days out. A shiva usually lasts seven\n   days from the burial, so check the date with check_delivery before promising it will arrive\n   in time. Never tell someone a gift will reach a shiva house tomorrow.\n\n2. THE FRESH PLATTERS cannot be shipped. They are hand-delivered in the New York City area\n   only. Everything else ships anywhere in the United States. Use must_ship_nationwide on\n   search_gifts to exclude them when the recipient is elsewhere.\n\nMemorial tree certificates arrive by email within minutes and have no delivery date at all,\nwhich makes them the one option that works when a shiva has already begun or a funeral is\ntomorrow. Order trees with create_tree_checkout_link, not create_checkout_link.\n\nPrices and stock come from the live shop. Nothing here is invented: when no product matches,\nthe tools return an empty result with the reason rather than a near miss.",
      "tools": [
        {
          "name": "check_delivery",
          "title": "Check delivery",
          "description": "Whether a product can reach a destination and the earliest date it can honestly arrive. Orders by 10am ET on a business day ship that day and transit is 1-5 business days by zone, so the soonest arrival is about three days out — never tomorrow.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "product_key": {
                "description": "A product id or slug from search_gifts.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "requested_date": {
                "description": "The date it must arrive by, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["product_key"],
            "type": "object"
          },
          "outputSchema": {
