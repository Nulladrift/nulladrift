        {
          "name": "get_order_status",
          "title": "Order status",
          "description": "Status and tracking for ONE order. Both the order number and the email the order was placed with are required, and both must match — a token alone cannot look up an order. Returns the same answer for \"no such order\" and \"not your order\", so order numbers cannot be probed. Never returns the street address, phone number or card message.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "buyer_email": {
                "description": "The email the order was placed with.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "order_number": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "maxLength": 20,
                    "type": "string"
                  }
                ],
                "description": "The number on the confirmation email, e.g. 10432."
              }
            },
            "required": ["buyer_email", "order_number"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "carrier": {
                "type": ["string", "null"]
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "quantity": {
                      "type": "number"
                    }
                  },
                  "required": ["name", "quantity"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": ["string", "null"]
              },
              "order_number": {
                "type": "number"
              },
              "paid": {
