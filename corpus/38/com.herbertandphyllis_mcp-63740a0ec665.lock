                    "type": "string"
                  },
                  "message": {
                    "type": ["string", "null"]
                  },
                  "printed_copy_to": {
                    "type": ["string", "null"]
                  },
                  "tree_count": {
                    "type": "number"
                  }
                },
                "required": ["dedication", "emailed_to", "from", "hebrew_name", "honoree_name", "message", "printed_copy_to", "tree_count"],
