        {
          "name": "create_checkout_link",
          "title": "Build a cart to check out",
          "description": "Build the order into a cart on herbertandphyllis.com, prefilled with the gift, recipient, delivery date and card message. No key needed. THIS DOES NOT CHARGE ANYTHING. It returns a link the buyer opens, reviews and pays from with the normal Checkout button; nothing is charged until they do, and this server never sees card details. Prices, shipping, tax and discount codes are worked out by the shop. Confirm the items, the recipient address, the delivery speed and the total with the customer BEFORE calling this. Without a key: up to 10 lines and 20 items, and 10 carts an hour per connection. Standard shipping is free in the United States. Paid 2-Day and Overnight are offered for a ZIP when they arrive sooner than free Standard.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "buyer_email": {
                "description": "The buyer's email. The receipt and any order lookup use it.",
                "maxLength": 200,
                "type": "string"
              },
              "buyer_name": {
                "description": "The buyer's name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "card_message": {
                "description": "Message for the enclosure card.",
                "maxLength": 500,
                "type": "string"
              },
              "coupon_code": {
                "description": "Validated server-side at checkout; an invalid code is ignored.",
                "maxLength": 40,
                "type": "string"
              },
              "delivery_speed": {
                "description": "standard (free, default), 2day or overnight (paid, only where faster than standard; check_delivery lists them).",
                "enum": ["standard", "2day", "overnight"],
                "type": "string"
              },
              "items": {
                "description": "The cart: products and quantities.",
                "items": {
                  "properties": {
                    "product_key": {
                      "description": "A product id or slug from search_gifts.",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "How many. Default 1.",
                      "maximum": 50,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["product_key"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "occasion": {
                "description": "e.g. \"shiva\", \"new baby\", \"thank you\".",
                "maxLength": 60,
                "type": "string"
              },
              "recipient_address": {
                "description": "Street address, with apartment if any.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "recipient_city": {
                "description": "City.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "recipient_name": {
                "description": "Who receives the gift, e.g. \"The Cohen Family\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "recipient_phone": {
                "description": "Phone for the carrier, optional.",
                "maxLength": 32,
                "type": "string"
              },
              "recipient_state": {
                "description": "Two-letter US state code.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "recipient_zip": {
                "description": "ZIP code.",
                "maxLength": 12,
                "minLength": 3,
                "type": "string"
              },
              "requested_arrival_date": {
                "description": "Requested arrival, YYYY-MM-DD. Refused if sooner than the earliest date for the chosen speed and ZIP.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["buyer_email", "buyer_name", "items", "recipient_address", "recipient_city", "recipient_name", "recipient_state", "recipient_zip"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "checkout_url": {
                "type": "string"
              },
              "delivery_speed": {
                "enum": ["standard", "2day", "overnight"],
                "type": "string"
              },
              "earliest_arrival_date": {
                "type": ["string", "null"]
              },
              "expires_note": {
                "type": "string"
              },
              "link_type": {
                "description": "cart: a prefilled cart on herbertandphyllis.com where the buyer reviews and taps Checkout. stripe_checkout: a Stripe payment page (key holders).",
                "enum": ["cart", "stripe_checkout"],
                "type": "string"
              },
              "quoted_total": {
                "type": ["number", "null"]
              },
              "what_happens_next": {
                "type": "string"
              }
            },
            "required": ["checkout_url", "delivery_speed", "earliest_arrival_date", "expires_note", "link_type", "quoted_total", "what_happens_next"],
            "type": "object"
          },
