                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "zip": {
                "description": "Recipient 5-digit ZIP code, for the exact dates the cart would show.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["product_key"],
            "type": "object"
          },
