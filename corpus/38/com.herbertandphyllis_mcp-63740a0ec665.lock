                "type": "boolean"
              },
              "earliest_arrival_date": {
                "type": "string"
              },
              "latest_bookable_arrival_date": {
                "type": "string"
              },
              "method": {
                "type": "string"
              },
              "product_id": {
                "type": "string"
              },
              "requested_date_ok": {
                "type": ["boolean", "null"]
              },
              "tax_note": {
                "type": "string"
              },
              "transit_note": {
                "type": "string"
