        {
          "name": "create_tree_checkout_link",
          "title": "Order trees planted in Israel",
          "description": "Build a cart on herbertandphyllis.com for N trees planted in Israel with a personalised Certificate of Dedication. No key needed. THIS DOES NOT CHARGE ANYTHING: the buyer opens the cart, reviews it and checks out. After payment the certificate is emailed within minutes to the buyer and, if given, the family; a printed copy is mailed if printed_copy is set (+$5). Confirm the honoree name, spelling, dedication and total with the customer BEFORE calling this: the certificate is issued exactly as sent. Without a key: up to 20 trees, and 10 carts an hour per connection.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "buyer_email": {
                "description": "The buyer's email. The certificate and receipt go here.",
                "maxLength": 200,
                "type": "string"
              },
              "buyer_name": {
                "description": "The buyer's name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "coupon_code": {
                "description": "Validated server-side at checkout; an invalid code is ignored.",
                "maxLength": 40,
                "type": "string"
              },
              "dedication": {
                "description": "The line above the name on the certificate.",
                "enum": ["In Honor Of", "In Memory Of", "In Celebration Of", "In Recognition Of"],
                "type": "string"
              },
              "family_email": {
                "description": "Also email the certificate to the family.",
                "maxLength": 200,
                "type": "string"
              },
              "from": {
                "description": "Who the trees are from, as printed on the certificate.",
                "maxLength": 80,
                "type": "string"
              },
              "hebrew_name": {
                "description": "Optional, in Hebrew letters only, e.g. \"משה בן אברהם\".",
                "maxLength": 60,
                "type": "string"
              },
              "honoree_name": {
                "description": "The name printed on the certificate.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Certificate wording: \"en\" English (default), \"he\" Hebrew, or \"both\" (Hebrew above English).",
                "enum": ["en", "he", "both"],
                "type": "string"
              },
              "message": {
                "description": "Short message printed on the certificate.",
                "maxLength": 160,
                "type": "string"
              },
              "occasion": {
                "description": "e.g. \"shiva\", \"yahrzeit\", \"bar mitzvah\".",
                "maxLength": 60,
                "type": "string"
              },
              "passing_date": {
                "description": "Optional date of passing, for a memorial.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "printed_copy": {
                "description": "Mail a printed copy to this US address (+$5).",
                "properties": {
                  "address": {
                    "description": "Street address.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "apt": {
                    "description": "Apartment or suite, optional.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "city": {
                    "description": "City.",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "name": {
                    "description": "Who the printed copy is addressed to.",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "state": {
                    "description": "Two-letter US state code.",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "zip": {
                    "description": "ZIP code.",
                    "maxLength": 12,
                    "minLength": 3,
                    "type": "string"
                  }
                },
                "required": ["address", "city", "name", "state", "zip"],
                "type": "object"
              },
              "send_on": {
                "description": "Optional YYYY-MM-DD, today to 12 months ahead: email the family on that date (e.g. the yahrzeit) at 8am New York time instead of right away. The buyer still gets the certificate right after paying. Leave out to send right away.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "tree_count": {
                "description": "How many trees, 1 to 50, all on one certificate.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["buyer_email", "buyer_name", "dedication", "honoree_name", "tree_count"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "certificate": {
                "additionalProperties": false,
                "properties": {
                  "dedication": {
