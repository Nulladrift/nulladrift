      "instructions": "Herbert & Phyllis sells kosher food gifts, with a focus on sympathy, condolence and shiva gifts\nfor Jewish mourning, plus certificates for memorial trees planted in Israel.\n\nUse this server when someone needs a kosher sympathy or shiva gift, a condolence gift for a\nJewish family, a gift for a shiva house or a house of mourning, a kosher gift basket, or a\nmemorial or honour tree planted in Israel.\n\nGifts are dried fruit and nut baskets, trays and boxes, and fresh fruit platters. Kosher\ncertification is stated per product in kosher_text.\n\nThree things worth knowing before recommending anything:\n\n1. TIMING. There is no same-day delivery. Orders placed by 10am ET on a business day ship the same day from California, and the trays from New York ship the same day if ordered by 1pm ET. Standard shipping is free in the United States. Paid 2-Day and Overnight are offered for a ZIP when they arrive sooner than free Standard. Ordered now, with no ZIP yet: Overnight can arrive as soon as Thu, Nov 26 (2026-11-26), free Standard by Wed, Dec 2 (2026-12-02). For the real date to an address, call check_delivery with the recipient's ZIP. A shiva usually lasts seven\n   days from the burial, so check the date before promising a gift will arrive in time.\n\n2. THE FRESH PLATTERS cannot be shipped. Fresh platters are hand-delivered in the New York City area only, with at least 2 days' notice. They cannot be shipped. Everything else ships anywhere\n   in the United States. Use must_ship_nationwide on search_gifts to exclude them when the\n   recipient is elsewhere.\n\n3. ORDERING needs no key. create_checkout_link (gifts) and create_tree_checkout_link (trees)\n   build a cart on herbertandphyllis.com and return its link. The buyer opens it, reviews it\n   and taps Checkout. Nothing is charged until a person pays. Prices, shipping, tax and\n   discount codes are worked out by the shop, never taken from the request.\n\nTree certificates arrive by email within minutes of payment, with no delivery date at all. That makes a tree the one option that works when a shiva has already\nbegun or a funeral is tomorrow. Order trees with create_tree_checkout_link, not create_checkout_link.\n\nA free Mishnayos page for a shloshim or yahrzeit (family and friends each take perakim) can be\nstarted with start_mishnayos_page. It is free and needs no key: only the organizer's own email,\nwhere the private manage link is sent.\n\nPrices and stock come from the live shop. Nothing here is invented: when no product matches,\nthe tools return an empty result with the reason rather than a near miss.",
      "tools": [
        {
          "name": "check_delivery",
          "title": "Check delivery",
          "description": "Whether a product can reach a destination and the dates it can arrive: free Standard, and any paid faster speed that beats it. Give the ZIP for the exact dates. Orders placed by 10am ET on a business day ship the same day from California, and the trays from New York ship the same day if ordered by 1pm ET. Standard shipping is free in the United States. Paid 2-Day and Overnight are offered for a ZIP when they arrive sooner than free Standard. Ordered now, with no ZIP yet: Overnight can arrive as soon as Thu, Nov 26 (2026-11-26), free Standard by Wed, Dec 2 (2026-12-02). For the real date to an address, call check_delivery with the recipient's ZIP.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "product_key": {
                "description": "A product id or slug from search_gifts.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "requested_date": {
                "description": "The date it must arrive by, YYYY-MM-DD.",
