        {
          "name": "atlas_compare",
          "title": "Compare AI tools on verified prices",
          "description": "Preview a price comparison of 2-5 Atlas tools for a usage scenario, computed without a model from plan editions checked against the vendors' own pricing pages. First category: AI transcription (seats, minutes a month, required capabilities). Returns per tool the cheapest fitting verified plan, or why there is none (unknown, ineligible, contact sales, stale) - unknown is never shown as missing or free. Nothing is saved; atlas_dataset keeps it for a website. Free; sixty a day per address.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Pricing category; default transcription.",
                "enum": ["transcription"],
                "type": "string"
              },
              "productIds": {
                "description": "Atlas domains, e.g. \"otter.ai\"; resolve names with atlas_search first.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "required": {
                "description": "Capabilities a plan must have to count (up to three).",
                "items": {
                  "enum": ["file_upload", "meeting_bot", "speaker_labels", "subtitle_export", "api"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "scenario": {
                "description": "The usage the price is worked out for.",
                "properties": {
                  "billing": {
                    "description": "Which plan price to compare.",
                    "enum": ["monthly", "annual"],
                    "type": "string"
                  },
                  "currency": {
                    "description": "ISO code; plans in other currencies are not converted. Default USD.",
                    "type": "string"
                  },
                  "longestRecording": {
                    "description": "Longest single recording in minutes, when per-recording caps matter.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "seats": {
                    "description": "People who need accounts.",
                    "maximum": 500,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "volume": {
                    "description": "Minutes of audio transcribed per month across the team.",
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["billing", "seats", "volume"],
                "type": "object"
              }
            },
            "required": ["productIds", "scenario"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "coverage": {
                "type": "object"
              },
              "freshness": {
                "type": "object"
              },
              "results": {
                "type": "object"
              },
              "rulesVersion": {
                "type": "string"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare AI tools on verified prices"
