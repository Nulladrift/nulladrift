        {
          "name": "atlas_search",
          "title": "Search the AI tools catalogue",
          "description": "Filter the INITE Atlas without a model, when you know the shelf or the properties a tool must have: a phrase, a category, and slices that must all hold. For a job described in prose, use match_tools. Free, no allowance.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "One shelf only",
                "enum": ["sales", "hr", "security", "analytics", "agents", "support", "dev", "llmops", "finance", "automation", "marketing", "meetings", "knowledge", "rag", "voice", "documents", "legal", "data", "health", "i18n", "creative", "writing", "productivity", "career", "learning", "commerce", "lifestyle", "assistants", "coding", "study", "images", "video", "trading", "agent-payments"],
                "type": "string"
              },
              "limit": {
                "description": "Tools per page, default 10",
                "maximum": 25,
                "minimum": 1,
                "type": "number"
              },
              "offset": {
                "description": "Tools to skip, for the next page",
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "description": "Words to match in the name and description",
                "type": "string"
              },
              "slices": {
                "description": "All must hold, e.g. [\"api\",\"free-plan\"]",
                "items": {
                  "enum": ["free-plan", "open-source", "api", "self-hosted", "no-code", "states-hipaa", "states-soc2", "states-gdpr", "no-training", "free-trial", "student-discount", "mcp-server", "openapi", "made-with-lovable", "made-with-base44", "made-with-bolt", "made-with-replit"],
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "description": "Default used: by measured use",
                "enum": ["used", "active", "liked", "rising", "newest", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "limit": {
                "type": "integer"
              },
              "matched": {
                "type": "integer"
              },
              "nextOffset": {
                "type": ["integer", "null"]
              },
              "offset": {
                "type": "integer"
              },
              "tools": {
                "type": "array"
              },
              "total": {
                "type": "integer"
              },
              "totalIsAtLeast": {
                "type": "boolean"
              }
            },
            "required": ["matched", "tools", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the AI tools catalogue"
