        {
          "name": "atlas_lookup",
          "title": "One AI tool's measured record",
          "description": "One AI tool from the INITE Atlas, by domain or name: what it does and who it is for, the starting price with the pricing page and the day it was read and how the price has moved, how a program reaches it (API docs, an OpenAPI document that parses and its path count, an MCP server in the official registry and how it is tied to the vendor, a status page), what it states about your data (certifications, training on your data), and how used and how alive it is. Every fact is dated; 'claimed' and 'found' are kept apart. AI tools and software only, by INITE's measurement; a business's own confirmed facts are INITE Directory's (find_business, business).",
          "inputSchema": {
