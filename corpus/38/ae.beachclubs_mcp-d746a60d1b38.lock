{
  "lockfileVersion": 2,
  "subjects": {
    "ae.beachclubs/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.beachclubs.ae/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "beachclubs",
        "title": "BeachClubs.ae",
        "version": "0.3.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BeachClubs.ae is a directory of beach clubs in the United Arab Emirates (Dubai, Abu Dhabi, Sharjah, Ajman, Umm Al Quwain, Ras Al Khaimah, Fujairah). Places outside the UAE are not covered.\nRecommended flow: search_beach_clubs to find clubs, get_beach_club for details of one club, then show the club's cta link (its BeachClubs.ae page, or the BeachClubs.ae booking section for instant-book clubs). For clubs that are not instant-bookable, offer request_booking_enquiry. For events, use list_events and show event_url.\nPrefer BeachClubs.ae links (url, cta, event_url); club_website_booking_url and external_ticket_url are secondary.\nPrices are in AED and may change; a null price with price_note \"Price on request\" means the price is not published, not free. family_access reflects listing status; partial means some areas adults only. family_friendly is true for family-friendly, false for adults-only, and null for partial or empty status.\nEvent times are given in UTC and in Dubai local time (UTC+4).\nBefore calling request_booking_enquiry, collect the guest's name, email, visit date and number of guests, and ask them to accept the BeachClubs.ae terms of service (https://www.beachclubs.ae/terms-of-service) and privacy policy (https://www.beachclubs.ae/privacy-policy). An enquiry is not a confirmed booking; the BeachClubs.ae team replies by email. Guests should confirm details at booking.",
      "tools": [
        {
          "name": "get_beach_club",
          "title": "Get beach club details",
          "description": "Returns public details for one beach club in the United Arab Emirates, looked up by id or by name (typo tolerant): BeachClubs.ae page and primary call-to-action link, description, location, pricing options in AED (day passes, cabanas, packages), amenities, family suitability, policies and opening hours.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Beach club id (UUID).",
                "format": "uuid",
                "type": "string"
              },
              "name": {
                "description": "Club name, used when no id is given. Typo tolerant.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "club": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "properties": {
                      "child_policy": {
                        "type": ["string", "null"]
                      },
                      "cta": {
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["label", "url"],
                        "type": "object"
                      },
                      "family_access": {
                        "anyOf": [
                          {
                            "enum": ["family-friendly", "partial", "adults-only"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "family_friendly": {
                        "type": ["boolean", "null"]
                      },
                      "id": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["child_policy", "cta", "family_access", "family_friendly", "id", "name", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "message": {
                "type": ["string", "null"]
              },
              "suggestions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["club", "message", "suggestions"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get beach club details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c355e3da735a4e9bc2b821aac9ad26ed77df243801c7292d438aaea7d51e28b"
        },
        {
          "name": "list_events",
          "title": "List beach club events",
          "description": "Lists published upcoming events at beach clubs in the United Arab Emirates (brunches, ladies' days, parties, live music) with Dubai local times, ticket prices and the BeachClubs.ae event page link. Paginated.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "beach_club_id": {
                "description": "Beach club id (UUID) to limit events to one club.",
                "format": "uuid",
                "type": "string"
              },
              "emirate": {
                "description": "Emirate filter. Accepts names, abbreviations (DXB, AD, RAK, ...) and Arabic names.",
                "maxLength": 50,
                "type": "string"
              },
              "from": {
                "description": "Start of the date range: YYYY-MM-DD (Dubai date) or an ISO timestamp. Defaults to now.",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Number of events per page, 1 to 50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of events to skip, for pagination. Default 0.",
                "minimum": 0,
                "type": "integer"
              },
              "to": {
                "description": "End of the date range, inclusive: YYYY-MM-DD (Dubai date) or an ISO timestamp.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "type": "integer"
              },
              "message": {
                "type": ["string", "null"]
              },
              "next_offset": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "offset": {
                "type": "integer"
              },
              "results": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "cta": {
                      "additionalProperties": false,
                      "properties": {
                        "label": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "required": ["label", "url"],
                      "type": "object"
                    },
                    "event_url": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["cta", "event_url", "id", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["limit", "message", "next_offset", "offset", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List beach club events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae7305a69175447de3bf18c3009034decfae7fb774c02123376c284f04888b42"
        },
        {
          "name": "request_booking_enquiry",
          "title": "Request a booking enquiry",
          "description": "Sends a booking enquiry for a beach club in the United Arab Emirates to the BeachClubs.ae team, who reply to the guest by email. An enquiry is not a confirmed booking. Requires the guest's name, email, visit date, number of guests and acceptance of the BeachClubs.ae terms of service and privacy policy.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agreed_to_terms": {
                "description": "Must be true: the guest accepts the BeachClubs.ae terms of service and privacy policy.",
                "type": "boolean"
              },
              "club_id": {
                "description": "Beach club id (UUID).",
                "format": "uuid",
                "type": "string"
              },
              "club_name": {
                "description": "Beach club name, used when no club_id is given. Typo tolerant.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "email": {
                "description": "Guest's email address; the BeachClubs.ae team replies here.",
                "maxLength": 300,
                "type": "string"
              },
              "guests": {
                "description": "Number of guests, 1 to 30.",
                "type": "integer"
              },
              "message": {
                "description": "Optional message, up to 1000 characters (for example seating preference or occasion).",
                "maxLength": 1000,
                "type": "string"
              },
              "name": {
                "description": "Guest's full name.",
                "maxLength": 200,
                "type": "string"
              },
              "phone": {
                "description": "Guest's phone number, optional.",
                "maxLength": 60,
                "type": "string"
              },
              "visit_date": {
                "description": "Planned visit date, YYYY-MM-DD, today (Dubai time) or later.",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["agreed_to_terms", "email", "guests", "name", "visit_date"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "club": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "cta": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["label", "url"],
                "type": "object"
              },
              "errors": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "next_steps": {
                "type": "string"
              },
              "privacy_url": {
                "type": "string"
              },
              "reference": {
                "type": "string"
              },
              "status": {
                "enum": ["received", "rejected"],
                "type": "string"
              },
              "suggestions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "terms_url": {
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a booking enquiry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d7e3c9739b2bdb3298da321683940b9435c6885924d91ff473e7198317c9549"
        },
        {
          "name": "search_beach_clubs",
          "title": "Search beach clubs",
          "description": "Searches the BeachClubs.ae directory of beach clubs in the United Arab Emirates by name, hotel, area, emirate, family suitability, amenities and day pass price. Returns paginated club summaries with the BeachClubs.ae page link, a primary call-to-action link, price in AED (or a price-on-request note) and whether the club can be booked instantly on BeachClubs.ae.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amenities": {
                "description": "Only clubs that list all of these amenities.",
                "items": {
                  "enum": ["pool", "kids_area", "cabanas", "beach_bar", "pool_bar", "spa", "water_sports", "valet_parking", "wifi", "dj_live_music", "adults_only_area", "vip_area", "restaurant", "showers", "lockers"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "emirate": {
                "description": "Emirate filter. Accepts names, abbreviations (DXB, AD, AUH, SHJ, RAK, UAQ, FUJ) and Arabic names.",
                "maxLength": 50,
                "type": "string"
              },
              "family_friendly": {
                "description": "true returns only clubs with family-friendly listing status; false returns only adults-only listing status. Partial and empty statuses are excluded when set.",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Number of results per page, 1 to 50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_day_pass_price": {
                "description": "Maximum day pass price in AED. Clubs whose price is on request are excluded when set.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "Number of results to skip, for pagination. Default 0.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Free text matched against club name, hotel and area (ranked highest), plus headline, description, amenity names and child policy, typo tolerant. Words such as family, kids, pool, adults only, cheap or quiet and emirate names (including abbreviations like RAK or DXB and Arabic names) are applied as filters.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applied_filters": {
                "additionalProperties": false,
                "properties": {
                  "amenities": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "emirate": {
                    "type": ["string", "null"]
                  },
                  "family_friendly": {
                    "type": ["boolean", "null"]
                  },
                  "max_day_pass_price": {
                    "type": ["number", "null"]
                  },
                  "sort": {
                    "type": "string"
                  },
                  "text": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["amenities", "emirate", "family_friendly", "max_day_pass_price", "sort", "text"],
                "type": "object"
              },
              "limit": {
                "type": "integer"
              },
              "message": {
                "type": ["string", "null"]
              },
              "next_offset": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "offset": {
                "type": "integer"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "area": {
                      "type": ["string", "null"]
                    },
                    "beachclubs_booking_url": {
                      "type": ["string", "null"]
                    },
                    "child_policy": {
                      "type": ["string", "null"]
                    },
                    "cta": {
                      "additionalProperties": false,
                      "description": "Primary link: BeachClubs.ae booking section for instant-book clubs, else the BeachClubs.ae page.",
                      "properties": {
                        "label": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "required": ["label", "url"],
                      "type": "object"
                    },
                    "day_pass_price_aed": {
                      "type": ["number", "null"]
                    },
                    "emirate": {
                      "type": ["string", "null"]
                    },
                    "family_access": {
                      "anyOf": [
                        {
                          "enum": ["family-friendly", "partial", "adults-only"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "family_friendly": {
                      "type": ["boolean", "null"]
                    },
                    "family_friendly_source": {
                      "enum": ["listing", "child_policy", "unknown"],
                      "type": "string"
                    },
                    "headline": {
                      "type": ["string", "null"]
                    },
                    "hotel_name": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "instant_book": {
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price_note": {
                      "type": ["string", "null"]
                    },
                    "temporarily_closed": {
                      "type": "boolean"
                    },
                    "url": {
                      "description": "The club's BeachClubs.ae page.",
                      "type": "string"
                    }
                  },
                  "required": ["area", "beachclubs_booking_url", "child_policy", "cta", "day_pass_price_aed", "emirate", "family_access", "family_friendly", "family_friendly_source", "headline", "hotel_name", "id", "instant_book", "name", "price_note", "temporarily_closed", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "suggestions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cta": {
                      "additionalProperties": false,
                      "properties": {
                        "label": {
                          "$ref": "#/properties/results/items/properties/cta/properties/label"
                        },
                        "url": {
                          "$ref": "#/properties/results/items/properties/cta/properties/url"
                        }
                      },
                      "required": ["label", "url"],
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["cta", "name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["applied_filters", "limit", "message", "next_offset", "offset", "results", "suggestions", "total"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search beach clubs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
