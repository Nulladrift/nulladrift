      "serverInfo": {
        "name": "qadir",
        "title": "Qadir",
        "version": "1.0.0",
        "websiteUrl": "https://qadir.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Prayer times, masjids, iqamah and Jumu'ah times, halal food and khutbahs for cities in the US, Canada and Mexico, from qadir.com. Start with find_city when the place is unclear; every other tool takes a city name (\"Anaheim, CA\") or a city path (\"/anaheim-ca\"). Prayer times are computed (ISNA method, standard Asr); a masjid's own iqamah times can differ. Cite the url each answer returns.",
      "tools": [
        {
          "name": "find_city",
          "title": "Find a city",
          "description": "Cities, counties and metros on Qadir that match a name, with how many masjids and halal places each has.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A place name, optionally with a state or province: \"dallas tx\", \"london ontario\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a city"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5008a1f03438f2e021d475419a04b00ff7eb25d5d1a310a69066e439fcaaed23"
        },
        {
          "name": "halal_food",
          "title": "Halal food",
          "description": "Halal restaurants, markets and butchers in a city, strongest halal evidence first, with today's hours and whether each is open now.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City, county or metro: a name such as \"Anaheim, CA\" or a path such as \"/anaheim-ca\".",
                "maxLength": 120,
                "type": "string"
              },
              "kind": {
                "description": "Only this kind of place.",
                "enum": ["Restaurant", "Market", "Butcher", "Bakery", "Dessert", "Coffee"],
                "type": "string"
              },
              "limit": {
                "description": "At most this many (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "open_now": {
                "description": "Only places open right now.",
                "type": "boolean"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Halal food"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:441314a912b8008c5516ee8432e9e9565352a88de02807437a04c7f2c7c611e1"
        },
        {
          "name": "iqamah_times",
          "title": "Iqamah times",
          "description": "Today's iqamah (congregation) times at the masjids in a city, from each masjid's own posted board, with the date the board was read. Masjids without a current board are counted, never estimated.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City, county or metro: a name such as \"Anaheim, CA\" or a path such as \"/anaheim-ca\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
