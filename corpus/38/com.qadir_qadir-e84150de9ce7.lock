        },
        {
          "name": "khutbahs",
          "title": "Khutbahs",
          "description": "Recent Friday khutbahs (sermons) from masjids in the US, Canada and Mexico, newest first, optionally on a topic or from a city.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City, county or metro: a name such as \"Anaheim, CA\" or a path such as \"/anaheim-ca\".",
                "maxLength": 120,
                "type": "string"
              },
              "limit": {
                "description": "At most this many (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for in the khutbah's title or key line, e.g. \"patience\".",
