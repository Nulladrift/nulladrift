      "serverInfo": {
        "name": "changethisfile",
        "title": "ChangeThisFile",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Convert files across 1,000+ supported routes. Pass a file URL or base64 content, pick a target format, get back a download URL. Also runs instruction-driven file jobs: translate documents with layout preserved, extract tables from PDFs/images into Excel, and compress files to an exact target size (free). Not sure which tool? Describe what you want in plain language with do_file_job. Paid jobs run immediately and return a free preview plus a checkout link; the full output unlocks after payment. Conversion routes are enumerated, so call list_conversions instead of guessing source/target pairs.",
      "tools": [
        {
          "name": "check_job",
          "title": "Check Job Status",
          "description": "Check the status of a previously submitted file job (translate_file, extract_tables, compress_file). Returns the current status, preview + checkout link for completed paid jobs, or the download URL for completed free/paid-and-unlocked jobs.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "The job_id returned by a job tool",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Job Status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:898b77cbf1edbd990bb67f11d73539f81ae29cb065e1c5003f801003afdf3057"
        },
        {
          "name": "compress_file",
          "title": "Compress File to Exact Size (free)",
          "description": "Compress a file (PDF, JPG, PNG, WebP, MP4, MOV, WebM) down to an exact target size — e.g. \"under 5MB for an upload form\". FREE (daily limit applies). Returns a download URL on success; if the target is physically unreachable it fails honestly and reports the smallest achievable size. Provide EITHER source_url OR base64_content, plus a filename with extension.",
          "inputSchema": {
            "properties": {
              "base64_content": {
                "description": "Base64-encoded file content (for small files)",
                "type": "string"
              },
              "filename": {
                "description": "Filename WITH extension (e.g. \"report.pdf\"). Required when the format cannot be inferred from source_url.",
                "type": "string"
              },
              "source_url": {
                "description": "Publicly accessible URL of the input file (preferred for large files)",
                "type": "string"
              },
              "target_size_kb": {
                "description": "Target maximum size in kilobytes (e.g. 5120 for 5MB). Min 50KB.",
                "type": "integer"
              }
            },
            "required": ["target_size_kb"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Compress File to Target Size"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c5f6cc1eb05914415ceabbed8bbced3831d092bba057bad438ff2d3c60d28e7a"
        },
        {
          "name": "convert_file",
          "title": "Convert File",
          "description": "Convert a file from one format to another. Anonymous callers get 25 free conversions per month per network; after that a free verified ChangeThisFile API key is required (25/month shared across REST + MCP; send it as Authorization: Bearer ctf_sk_…). Pass EITHER a publicly accessible URL (source_url) OR base64-encoded file contents (base64_content + source_format) — exactly one is required. Returns a temporary download URL (valid 1 hour; file deleted within 24 hours).",
          "inputSchema": {
            "properties": {
              "base64_content": {
                "description": "Base64-encoded file content (for small files; max ~5MB)",
                "type": "string"
              },
              "filename": {
                "description": "Optional filename hint for auto-detection (e.g. \"document.docx\"). Include this for extensionless download URLs when known.",
                "type": "string"
              },
              "source_format": {
                "description": "Source format extension (e.g. \"docx\", \"mp4\"). Optional: detected from filename, URL response filename, or file bytes when omitted.",
                "type": "string"
              },
              "source_url": {
                "description": "Publicly accessible URL of the file to convert (preferred for large files)",
                "type": "string"
              },
              "target_format": {
                "description": "Target format extension (e.g. \"json\", \"mp3\", \"pdf\"). Required.",
                "type": "string"
              }
            },
            "required": ["target_format"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Convert File"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62ba3d5a64db5a540abe4efbe2176ed49ee5ffa2350128e1b8f1dc774a9650b6"
        },
        {
          "name": "do_file_job",
          "title": "Do Something to a File (natural language)",
          "description": "Describe what you want done to a file in plain language — e.g. \"translate this contract to German\", \"pull every table out of this PDF into Excel\", \"shrink this video to under 25MB\", \"convert this to PDF\". The instruction is routed to the right job automatically; if the request is not supported yet you get an honest explanation of what is. Provide EITHER source_url OR base64_content, plus a filename with extension.",
          "inputSchema": {
            "properties": {
              "base64_content": {
                "description": "Base64-encoded file content (for small files)",
                "type": "string"
              },
              "filename": {
                "description": "Filename WITH extension (e.g. \"report.pdf\"). Required when the format cannot be inferred from source_url.",
                "type": "string"
              },
              "instruction": {
                "description": "What to do with the file, in plain language (any language)",
                "type": "string"
              },
              "source_url": {
                "description": "Publicly accessible URL of the input file (preferred for large files)",
                "type": "string"
              }
            },
            "required": ["instruction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Do Something to a File"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:850db08b4015a3fbe5cf7d2f4676bad9cdbd951cec983baf80e787a498f9a579"
        },
        {
          "name": "extract_tables",
          "title": "Extract Tables to Excel (paid, free preview)",
          "description": "Extract every table from a PDF or image (PNG, JPG, WebP) into a clean multi-sheet Excel file. The job runs immediately and returns a FREE preview of the first table plus a secure Stripe checkout link — the full .xlsx unlocks after payment ($3.99, one-time, no account needed). Provide EITHER source_url OR base64_content, plus a filename with extension.",
          "inputSchema": {
            "properties": {
              "base64_content": {
                "description": "Base64-encoded file content (for small files)",
                "type": "string"
              },
              "filename": {
                "description": "Filename WITH extension (e.g. \"report.pdf\"). Required when the format cannot be inferred from source_url.",
                "type": "string"
              },
              "source_url": {
                "description": "Publicly accessible URL of the input file (preferred for large files)",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Extract Tables to Excel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ea3026107847702fbc986aca50e2f0c65001bc685d688d26651cccb07539f25a"
        },
        {
          "name": "list_conversions",
          "title": "List Supported Conversions",
          "description": "List all supported conversion routes. Optionally filter by source format to see what you can convert FROM a specific format.",
          "inputSchema": {
            "properties": {
              "source_format": {
                "description": "Filter by source format (e.g. \"docx\" returns all DOCX target options)",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Supported Conversions"
          },
