        },
        {
          "name": "translate_file",
          "title": "Translate Document (paid, free preview)",
          "description": "Translate a document into another language with the original layout and formatting preserved (DOCX, PPTX, XLSX, PDF, TXT, MD, SRT, VTT). The job runs immediately and returns a FREE preview of the first pages plus a secure Stripe checkout link — the full translated file unlocks after payment ($4.99, one-time, no account needed). Provide EITHER source_url OR base64_content, plus a filename with extension.",
          "inputSchema": {
            "properties": {
