{
  "lockfileVersion": 2,
  "subjects": {
    "com.poolcarecalculators/pool-care-calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://poolcarecalculators.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "pool-care-calculators",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "calculate_pool_salt",
          "title": "Pool Salt Calculator",
          "description": "Estimate swimming pool salt addition in pounds and bags from measured salt ppm and a user-supplied target. Includes high-salt dilution guidance and retest cautions. No equipment control.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "bagPriceUsd": {
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "bagSizeLb": {
                "default": 40,
                "maximum": 2000,
                "minimum": 1,
                "type": "number"
              },
              "currentSaltPpm": {
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "gallons": {
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "targetSaltPpm": {
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              }
            },
            "required": ["currentSaltPpm", "gallons", "targetSaltPpm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:20468983555cad1758ed32138e659825bcebf0554bae28f00fbc6fcd59d653a3"
        },
        {
          "name": "calculate_pool_volume",
          "title": "Pool Volume Calculator",
          "description": "Estimate swimming pool volume in US gallons and liters from rectangular, round, oval, or surface-area dimensions in feet or meters. Includes turnover flow, not equipment sizing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "averageDepth": {
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "diameter": {
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "length": {
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "shape": {
                "enum": ["rect", "round", "oval", "quick"],
                "type": "string"
              },
              "surfaceArea": {
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "turnoverHours": {
                "default": 8,
                "maximum": 168,
                "minimum": 0.25,
                "type": "number"
              },
              "unit": {
                "default": "ft",
                "enum": ["ft", "m"],
                "type": "string"
              },
              "width": {
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              }
            },
            "required": ["averageDepth", "shape"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5351ca6ea070f3f01476d2f67a6bd4b1a9ed2572d560630a092a055d22f5a076"
        }
      ],
      "digest": "sha256:04e2d2b891f16c241513ccd88ad586ba5f2a4615bb8669e9da140896549e2c1c"
    }
  }
}
