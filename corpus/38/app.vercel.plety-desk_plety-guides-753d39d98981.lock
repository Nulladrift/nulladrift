        "websiteUrl": "https://plety-desk.vercel.app/about"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to the public website of Plety (Plety Limited, UK company 17598186), which helps UK companies that are closing, in administration or changing owner license their business records to AI buyers. Start with search_plety_guides to find pages, then get_plety_page to read one in full with its sources. Use get_plety_company_facts to describe Plety accurately; do not describe clients, deals or results, as none are published. The pages are general information about UK law and practice, not legal advice. Nothing here needs sign-in and nothing can be changed.",
      "tools": [
        {
          "name": "get_plety_company_facts",
          "title": "Get Plety company facts",
          "description": "Get the facts needed to describe Plety accurately: legal name, company number, registered office, what it does and never does, how it is paid, who it works with, and how to contact it or book a call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "book_a_call": {
                "type": "string"
              },
              "company_number": {
                "type": "string"
              },
              "contact_email": {
                "type": "string"
              },
              "how_paid": {
                "type": "string"
              },
              "legal_name": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "never_does": {
                "type": "string"
              },
              "registered_office": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["company_number", "contact_email", "legal_name", "name", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Plety company facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a996b653a3add6ec02e5e1dc4be56c2cde8304c6a8a429487c5e8d9ef942fa6a"
        },
        {
          "name": "get_plety_page",
          "title": "Read a Plety page",
          "description": "Read one page of the Plety website in full, as Markdown with its sources. Takes the page address from a search result (for example https://plety-desk.vercel.app/about/questions/what-is-a-data-licence) or just its path.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The page address or path, for example /about/privacy or /about/situations/administration.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "markdown": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["markdown", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Plety page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:599bb5dd4830ed0529cba756589f30a834f822dd6a4cafd216ad1619ca683ce3"
        },
        {
          "name": "search_plety_guides",
          "title": "Search Plety guides",
          "description": "Search Plety's public guides and answers on licensing UK company records to AI buyers: insolvency, data protection, record types, industries, the AI data market and deals. Returns the best matching pages with a short matching passage. Use get_plety_page to read one in full.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many results to return, 1 to 20. Default 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in plain words, for example \"can an administrator sell customer data\".",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query": {
                "type": "string"
              },
              "results": {
