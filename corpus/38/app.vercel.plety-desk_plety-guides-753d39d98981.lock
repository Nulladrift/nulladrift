                    },
                    "score": {
                      "type": "number"
                    },
                    "section": {
                      "type": "string"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
