{
  "lockfileVersion": 2,
  "subjects": {
    "com.homedadpro/propfirm": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://homedadpro.com/wp-json/hdp-public/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "全職奶爸公開資料",
        "version": "1.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public read-only access to the bounded HomeDadPro catalog and published articles. Records include verification status, applicable coupons, article links and disclosed affiliate referral links. No account access, order placement, investment execution or LLM calls. Reference quotes are historical or conflicted rather than current offers.",
      "tools": [
        {
          "name": "get_discounts",
          "title": "查詢優惠",
          "description": "Look up recorded coupon eligibility and plan-level prices in the HomeDadPro public catalog when the user asks about a specific offer or purchase configuration. Returns the applicable code, verification date, billing conditions, article URLs and affiliate referral URLs. HDP is not universally applicable; some records have no discount or are reference-only. Does not apply coupons to a cart or initiate checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accountCurrency": {
                "description": "Simulated account currency; different from purchase fee currency. Omit to include both, with currency labels.",
                "enum": ["USD", "EUR"],
                "type": "string"
              },
              "budget": {
                "description": "Single account purchase fee in currency (USD by default). Split or milestone payment uses the total required if all stages pass, not only the upfront payment. Excludes conflicted or stale quotes.",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              },
              "currency": {
                "description": "Purchase fee currency. Budget defaults to USD. No currency conversion; prices in different currencies are not ranked together.",
                "enum": ["USD", "EUR"],
                "type": "string"
              },
              "dailyLossMode": {
                "enum": ["with", "without"],
                "type": "string"
              },
              "drawdown": {
                "enum": ["EOD", "TDD", "STATIC", ""],
                "type": "string"
              },
              "excludedFirms": {
                "items": {
                  "maxLength": 50,
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "firms": {
                "description": "Firm IDs or names. Main futures IDs: lucid, tradeify, fundednext, apex, blueguardian, tradeday, tpt, ftmo-futures. FFF requires explicit fff. Perps includes vest.",
                "items": {
                  "maxLength": 50,
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Select the product market explicitly. Defaults to futures when omitted. SpiceProp and other forex/CFD programs require cfd. Company names do not automatically change this field.",
                "enum": ["futures", "cfd", "perps"],
                "type": "string"
              },
              "model": {
                "enum": ["evaluation", "direct", ""],
                "type": "string"
              },
              "noActivation": {
                "type": "boolean"
              },
              "offset": {
                "maximum": 2000,
                "minimum": 0,
                "type": "integer"
              },
              "plan": {
                "description": "Exact planId previously returned by this server, for example cfd:spice:three. Not a display name such as 3-Step. Omit this field when the exact planId is unknown; filter by firm, market and size first.",
                "maxLength": 80,
                "type": "string"
              },
              "platform": {
                "maxLength": 40,
                "type": "string"
              },
              "size": {
                "description": "Account size, e.g. 50K. Defaults to 50K.",
                "pattern": "^[0-9]{1,3}(?:\\.[0-9])?K$",
                "type": "string"
              },
              "stage": {
                "enum": ["exam", "funded", "live"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6ddace187fde69ba292f39a6e11bea7126ab9ed4f28fd58fae480689d53013a"
        },
        {
          "name": "search_articles",
          "title": "搜尋文章",
          "description": "Search published HomeDadPro articles by company, topic or tutorial keyword. Returns titles, bounded excerpts, canonical article URLs, reader-facing article links, modification dates and relevant disclosed affiliate referral URLs. Useful for finding public PropFirm explanations and platform or payout tutorials. Excerpts may not contain the entire article; modification dates are not rule-verification dates. No access to drafts, private messages or user accounts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4c70fd80e7380595bdea3bb656b3c507b4c919a50ec2b9a9ce144fbf0972916"
        },
        {
          "name": "search_plans",
          "title": "查詢方案",
          "description": "Search the HomeDadPro public PropFirm catalog by market, account size, purchase-fee budget, company and supported configuration filters. Returns dated price snapshots, billing terms, eligibility, article URLs and disclosed affiliate referral URLs. CFD split-payment records distinguish initial payment from conditional total cost; stale or conflicted quotes are returned separately and excluded from budget matches. Does not place orders or provide live market quotes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accountCurrency": {
                "description": "Simulated account currency; different from purchase fee currency. Omit to include both, with currency labels.",
                "enum": ["USD", "EUR"],
                "type": "string"
              },
              "budget": {
                "description": "Single account purchase fee in currency (USD by default). Split or milestone payment uses the total required if all stages pass, not only the upfront payment. Excludes conflicted or stale quotes.",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              },
              "currency": {
                "description": "Purchase fee currency. Budget defaults to USD. No currency conversion; prices in different currencies are not ranked together.",
                "enum": ["USD", "EUR"],
                "type": "string"
              },
              "dailyLossMode": {
                "enum": ["with", "without"],
                "type": "string"
              },
              "drawdown": {
                "enum": ["EOD", "TDD", "STATIC", ""],
                "type": "string"
              },
              "excludedFirms": {
                "items": {
                  "maxLength": 50,
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "firms": {
                "description": "Firm IDs or names. Main futures IDs: lucid, tradeify, fundednext, apex, blueguardian, tradeday, tpt, ftmo-futures. FFF requires explicit fff. Perps includes vest.",
                "items": {
                  "maxLength": 50,
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Select the product market explicitly. Defaults to futures when omitted. SpiceProp and other forex/CFD programs require cfd. Company names do not automatically change this field.",
                "enum": ["futures", "cfd", "perps"],
                "type": "string"
              },
              "model": {
                "enum": ["evaluation", "direct", ""],
                "type": "string"
              },
              "noActivation": {
                "type": "boolean"
              },
              "offset": {
                "maximum": 2000,
                "minimum": 0,
                "type": "integer"
              },
              "plan": {
                "description": "Exact planId previously returned by this server, for example cfd:spice:three. Not a display name such as 3-Step. Omit this field when the exact planId is unknown; filter by firm, market and size first.",
                "maxLength": 80,
                "type": "string"
              },
              "platform": {
                "maxLength": 40,
                "type": "string"
              },
              "size": {
                "description": "Account size, e.g. 50K. Defaults to 50K.",
                "pattern": "^[0-9]{1,3}(?:\\.[0-9])?K$",
                "type": "string"
              },
              "stage": {
                "enum": ["exam", "funded", "live"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6fc63176cfb53a16466123306ce0a7c22f1d76dc4cf847a72c2ed21547f5ef7"
        }
      ],
      "digest": "sha256:db3c1c3c0964abe8a6941f528b09b4993ecfd6761df39478628ec39bfb39858d"
    }
  }
