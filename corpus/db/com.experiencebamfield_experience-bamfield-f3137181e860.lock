      "serverInfo": {
        "name": "experience-bamfield",
        "title": "Experience Bamfield — trips to Bamfield, British Columbia",
        "version": "2026.10.8"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Experience Bamfield is the booking site for Bamfield, on the west coast of Vancouver Island, British Columbia: waterfront cottages (Woods End Landing), kayak and canoe rentals (Bamfield Adventure Center), fishing charters, moorage and parking. Sea kayak expeditions to the Deer Group and Broken Group Islands are self-guided, with the Adventure Center's sea kayaks (bac-sea-kayak-single, bac-sea-kayak-double) rented by the day for as many days as the trip takes.\nEverything here is read-only. You cannot hold, book or pay: you help the guest choose, quote the whole trip, and give them one cart link to review and pay.\nHow to plan a trip: list_products for what exists and its ids; price_cottages and check_availability for the guest's dates; quote_trip for the whole basket — quote the guest from totals.dueAtCheckoutCents and say how much of it is refundable deposit; build_cart_link for the link to hand over (it is checked for you: lines that would not open are named).\nPrices are in Canadian cents. Nothing is held until the guest pays, so availability is true at the moment of the answer. Bookings are open from today to the end of the third year on; a date that has passed, does not exist, or is further out is refused, and asking again will not change that.\nA boat is charged by the time between pick-up and return (07:00 to 20:00). A fishing charter is priced here and goes into the guest's cart from its own page, which asks who is fishing. Camping in the Deer Group or the Broken Group Islands takes a permit that can take up to 10 business days: see camping_permits and tell the guest to apply as soon as the dates are known.\nAfter the booking: if the guest has given you a link from their trip page (it ends in a long key), get_trip_summary reads that one trip — whether it is ready, what needs doing and by when, what is booked and the money. Read it again each time you are asked; not known is never yes, no or 0; and when the payment record does not add up, tell the guest not to pay again and to call the desk.\nAn answer marked retryable was not a refusal: ask again in a few seconds. People: 1-800-917-3837.",
      "tools": [
        {
          "name": "build_cart_link",
          "title": "The link to give the guest",
          "description": "Builds the one link that puts the chosen lines in the guest's cart on experiencebamfield.com, and checks it: the lines it opens with, any that would be left out and why, and the totals. Give the guest the url. They review the cart and pay by card; the booking is confirmed the moment they pay. A fishing charter is not carried by the link: it is added from its own page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "boatLengthFt": {
                      "description": "Moorage only: the boat's length in feet.",
                      "maximum": 200,
                      "minimum": 8,
                      "type": "integer"
                    },
                    "endDate": {
                      "description": "Last day: the morning the guests leave for a stay or moorage; the return day for a rental (the same date for a rental within one day).",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "endTime": {
                      "description": "Boats only: return time, HH:MM, by 20:00.",
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    },
                    "guests": {
                      "description": "How many people. Checked against how many a cottage sleeps. Default 2.",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "productId": {
                      "description": "A product id from list_products.",
                      "maxLength": 80,
                      "minLength": 2,
                      "pattern": "^[a-z0-9][a-z0-9:_-]{1,79}$",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Boats, vehicles or charter trips. 1 for a cottage. Default 1.",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "startDate": {
                      "description": "First day: check-in for a stay, pick-up day for a rental.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "startTime": {
                      "description": "Boats only: pick-up time, HH:MM, from 07:00. Send both times or neither.",
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    }
                  },
                  "required": ["endDate", "productId", "startDate"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "leftOut": {
                "type": "integer"
              },
              "lines": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "opensWith": {
                "type": "integer"
              },
              "totals": {
                "type": "object"
              },
              "url": {
                "description": "The link to give the guest. Null when no line would open: there is nothing to hand over.",
                "type": ["string", "null"]
              }
            },
            "required": ["lines", "opensWith", "totals", "url"],
            "type": "object"
          },
