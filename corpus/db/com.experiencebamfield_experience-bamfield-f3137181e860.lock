        {
          "name": "get_trip_summary",
          "title": "A guest's booked trip, from the link they gave you",
          "description": "After the booking. Takes the link a guest made for their assistant on their trip page (or just the key on the end of it) and returns a read-only summary of that one trip: whether it is ready to travel, what needs doing, by what date and who it is waiting on, each booked line with what it came to, and the money — payments received, refunds completed and pending, what is retained, the damage deposit and what is owing. Read it again each time you are asked (freshness.staleAfterSeconds). A fact that is not known is \"unknown\" and an amount that cannot be stated is null: never read those as yes, no or 0. When money.state is not_reconciled, tell the guest not to pay again on the strength of this and to call the desk. It includes nobody's name or contact details and can change nothing. A link that is wrong, expired or turned off is refused; ask the guest for a new one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "key": {
                "description": "Or only the 43-character key on the end of that link.",
                "maxLength": 400,
                "type": "string"
              },
              "link": {
                "description": "The link the guest gave you, whole: it looks like https://experiencebamfield.com/api/assistant/trip/KEY. Send this or key.",
                "maxLength": 400,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "about": {
                "type": "string"
              },
              "booked": {
                "items": {
                  "properties": {
                    "actBy": {
                      "description": "The date to act by. For a camping permit not yet applied for, two weeks before it is needed. For a payment record to check, today. null when nothing is left to do, and on a booked line that is only waiting on the payment check (the payment item carries the date).",
                      "type": ["string", "null"]
                    },
                    "amount": {
                      "description": "What this line came to. null when the payment record does not add up, or the order is from before lines were itemised.",
                      "properties": {
                        "discountCents": {
                          "description": "Canadian cents.",
                          "type": "integer"
                        },
                        "feesCents": {
                          "description": "Fees that are part of the cost, such as cleaning. Never the damage deposit.",
                          "type": "integer"
                        },
                        "priceCents": {
                          "description": "Canadian cents.",
                          "type": "integer"
                        },
                        "suppliedBy": {
                          "type": ["string", "null"]
                        },
                        "taxCents": {
                          "description": "Canadian cents.",
                          "type": "integer"
                        },
                        "taxes": {
                          "items": {
                            "properties": {
                              "amountCents": {
                                "description": "Canadian cents.",
                                "type": "integer"
                              },
                              "code": {
                                "type": "string"
                              },
                              "label": {
                                "type": "string"
                              }
                            },
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "totalCents": {
                          "description": "price − discount + fees + tax. The damage deposit is not in it.",
                          "type": "integer"
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "blocksTheTrip": {
                      "type": "boolean"
                    },
                    "booked": {
                      "enum": ["yes", "no", "unknown", "not_applicable"],
                      "type": "string"
                    },
                    "business": {
                      "description": "The business as a guest knows it.",
                      "type": ["string", "null"]
                    },
                    "confirmedByTheBusiness": {
                      "description": "not_yet means the business has not answered yet. It is not a refusal.",
                      "enum": ["yes", "not_yet", "unknown", "not_applicable"],
                      "type": "string"
                    },
                    "counts": {
                      "description": "For waivers and permits: how many are done of how many are needed.",
                      "properties": {
                        "done": {
                          "type": "integer"
                        },
                        "total": {
                          "type": "integer"
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "detail": {
                      "description": "What to tell the guest, in words.",
                      "type": "string"
                    },
                    "endDate": {
                      "description": "YYYY-MM-DD, or null.",
                      "type": ["string", "null"]
                    },
                    "neededBy": {
                      "description": "The day the thing this line gates begins.",
                      "type": ["string", "null"]
                    },
                    "paid": {
                      "description": "yes only when the order's payment record adds up. unknown when it does not. not_applicable on a cancelled line: what was paid for it is in the refunds.",
                      "enum": ["yes", "no", "unknown", "not_applicable"],
                      "type": "string"
                    },
                    "recordLastChangedAt": {
                      "description": "When the record this line was read from last changed. null when there is no record behind the line at all (for example, boats booked with nobody listed to paddle them).",
                      "type": ["string", "null"]
                    },
                    "startDate": {
                      "description": "YYYY-MM-DD, or null.",
                      "type": ["string", "null"]
                    },
                    "state": {
                      "description": "ready: nothing more is needed. yours: the guest has something to do. waiting: someone else does (waitingOn). unknown: the record that would say is missing — never treat it as ready. failed: the desk has to fix it. cancelled: no longer part of the trip. A booked and confirmed line whose order's payment record does not add up is waiting (on the desk), not ready.",
                      "enum": ["ready", "yours", "waiting", "unknown", "failed", "cancelled"],
                      "type": "string"
                    },
                    "status": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "urgency": {
                      "description": "now: money that does not add up or has not come back — the guest should contact the desk today. Otherwise from actBy and the day in Bamfield at checkedAt; overdue: the date has passed.",
                      "enum": ["now", "overdue", "this_week", "later", null],
                      "type": ["string", "null"]
                    },
                    "waitingOn": {
                      "enum": ["guest", "organiser", "business", "skipper", "permit_office", "desk", "nobody"],
                      "type": "string"
                    },
                    "what": {
                      "enum": ["stay", "parking", "rental", "charter", "moorage", "service", "waivers", "permits", "payment", "deposit", "group"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "contact": {
                "properties": {
                  "deskPhone": {
                    "type": "string"
                  },
                  "for": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "finishes": {
                "description": "Three separate things: ready to travel, the trip being over, and the money being settled.",
                "properties": {
                  "moneySettled": {
                    "description": "deposit_held: taken and due back after the trip. deposit_part_not_returned: part went back and the rest did not, with no reason recorded — the guest contacts the desk.",
                    "enum": ["settled", "owing", "refund_pending", "deposit_held", "deposit_part_not_returned", "not_reconciled", "not_shown"],
                    "type": "string"
                  },
                  "readyToTravel": {
                    "type": "boolean"
                  },
                  "tripFinished": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "freshness": {
                "description": "The summary is the trip as recorded at checkedAt and is worked out again on every read. Read the link again before answering; do not answer from a copy older than staleAfterSeconds.",
                "properties": {
                  "checkedAt": {
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "readAgainBeforeAnswering": {
                    "type": "boolean"
                  },
                  "staleAfterSeconds": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "money": {
                "description": "Read from the order's own payment record. Always present on this link.",
                "properties": {
                  "bookingsTotalCents": {
                    "description": "What the bookings came to: the sum of booked[].amount.totalCents plus minimumChargeCents. The damage deposit is not in it. For a cancelled trip, what it came to before it was cancelled. null when not reconciled.",
                    "type": ["integer", "null"]
                  },
                  "currency": {
                    "enum": ["CAD"],
                    "type": "string"
                  },
                  "deposit": {
                    "description": "The refundable damage deposit, held separately from the cost. When reconciled: paymentsReceivedCents = bookingsTotalCents + deposit.amountCents.",
                    "properties": {
                      "amountCents": {
                        "description": "The deposit on the order. null when state is unknown.",
                        "type": ["integer", "null"]
                      },
                      "detail": {
                        "type": ["string", "null"]
                      },
                      "notReturnedCents": {
                        "description": "Once a return has started: what was left out of it. The reason is not recorded: do not tell the guest it is refundable, and do not tell them it was kept — they contact the desk. null while the deposit is simply held (state held) — a held deposit is not money that has failed to come back — and when state is unknown.",
                        "type": ["integer", "null"]
                      },
                      "onItsWayBackCents": {
                        "description": "Canadian cents. null means not known — never read null as 0.",
                        "type": ["integer", "null"]
                      },
                      "returnedCents": {
                        "description": "Canadian cents. null means not known — never read null as 0.",
                        "type": ["integer", "null"]
                      },
                      "sentBackAt": {
                        "description": "When the latest deposit return was sent. The bank can take 5 to 10 business days from then.",
                        "type": ["string", "null"]
                      },
                      "sentBackWithinHours": {
                        "description": "Experience Bamfield sends the deposit back within this many hours of the return or check-out. The guest's bank can take 5 to 10 business days after that to show it.",
                        "type": "integer"
                      },
                      "state": {
                        "description": "none: the order has no deposit. held: taken and not sent back. refund_processing: sent back, not finished. partly_returned: part was sent back and the rest was not. returned: all of it was sent back. unknown: the payment record does not add up and the order carries a deposit (or nothing says whether it does), so where it stands is not claimed.",
                        "enum": ["none", "held", "refund_processing", "partly_returned", "returned", "unknown"],
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "detail": {
                    "type": "string"
                  },
                  "events": {
                    "description": "Each payment and refund with its date, oldest first.",
                    "items": {
                      "properties": {
                        "amountCents": {
                          "description": "Canadian cents. null means not known — never read null as 0.",
                          "type": ["integer", "null"]
                        },
                        "at": {
                          "description": "An ISO 8601 time in UTC (ending in Z), or null.",
                          "type": ["string", "null"]
                        },
                        "isDepositReturn": {
                          "type": "boolean"
                        },
                        "kind": {
                          "enum": ["payment", "payment_registered", "refund"],
                          "type": "string"
                        },
                        "status": {
                          "enum": ["completed", "processing", "failed"],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "headline": {
                    "type": "string"
                  },
                  "minimumChargeCents": {
                    "description": "Added to reach the card network's smallest charge, when the order came to less. Usually 0.",
                    "type": "integer"
                  },
                  "netAfterPendingRefundsCents": {
                    "description": "netRetainedCents − refundsPendingCents: what will remain once the refunds on their way finish.",
                    "type": ["integer", "null"]
                  },
                  "netRetainedCents": {
                    "description": "Net payments after completed refunds: paymentsReceivedCents − refundsCompletedCents. A refund that is still on its way (refundsPendingCents) has NOT been taken off yet — see netAfterPendingRefundsCents.",
                    "type": ["integer", "null"]
                  },
                  "notReconciledReason": {
                    "description": "Which check failed, when state is not_reconciled; null when reconciled. For the desk and for testing: the guest is told the same thing whichever it is — do not pay again, contact the desk.",
                    "enum": ["not_paid", "charge_missing", "total_missing", "line_total_missing", "lines_do_not_add_up", "charge_differs_from_total", "refund_on_unitemised_order", "nothing_recorded", null],
                    "type": ["string", "null"]
                  },
                  "owingCents": {
                    "description": "What the guest still owes. null when not reconciled.",
                    "type": ["integer", "null"]
                  },
                  "paymentsReceivedCents": {
                    "description": "Every payment received. Refunds are not taken off. null when the order is marked paid and the amount charged is not on the record.",
                    "type": ["integer", "null"]
                  },
                  "refundsCompletedCents": {
                    "description": "Canadian cents.",
                    "type": "integer"
                  },
                  "refundsPendingCents": {
                    "description": "Refunds sent and not finished.",
                    "type": "integer"
                  },
                  "state": {
                    "description": "not_reconciled: what was received cannot be matched to what the order came to. No balance is stated, the trip is not ready, and the guest should not pay again on the strength of this summary.",
                    "enum": ["reconciled", "not_reconciled"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "needsAttention": {
                "description": "Lines that need someone: a payment record to be checked first, then the guest's own, then the desk's, then what could not be verified, then what is waiting; within each, the earliest actBy first. Once the trip is over or cancelled, only money that still needs someone is listed (a payment record to check, a deposit not returned).",
                "items": {
                  "properties": {
                    "actBy": {
                      "description": "The date to act by. For a camping permit not yet applied for, two weeks before it is needed. For a payment record to check, today. null when nothing is left to do, and on a booked line that is only waiting on the payment check (the payment item carries the date).",
                      "type": ["string", "null"]
                    },
                    "blocksTheTrip": {
                      "type": "boolean"
                    },
                    "business": {
                      "description": "The business as a guest knows it.",
                      "type": ["string", "null"]
                    },
                    "counts": {
                      "description": "For waivers and permits: how many are done of how many are needed.",
                      "properties": {
                        "done": {
                          "type": "integer"
                        },
                        "total": {
                          "type": "integer"
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "detail": {
                      "description": "What to tell the guest, in words.",
                      "type": "string"
                    },
                    "neededBy": {
                      "description": "The day the thing this line gates begins.",
                      "type": ["string", "null"]
                    },
                    "recordLastChangedAt": {
                      "description": "When the record this line was read from last changed. null when there is no record behind the line at all (for example, boats booked with nobody listed to paddle them).",
                      "type": ["string", "null"]
                    },
                    "state": {
                      "description": "ready: nothing more is needed. yours: the guest has something to do. waiting: someone else does (waitingOn). unknown: the record that would say is missing — never treat it as ready. failed: the desk has to fix it. cancelled: no longer part of the trip. A booked and confirmed line whose order's payment record does not add up is waiting (on the desk), not ready.",
                      "enum": ["ready", "yours", "waiting", "unknown", "failed", "cancelled"],
                      "type": "string"
                    },
                    "status": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "urgency": {
                      "description": "now: money that does not add up or has not come back — the guest should contact the desk today. Otherwise from actBy and the day in Bamfield at checkedAt; overdue: the date has passed.",
                      "enum": ["now", "overdue", "this_week", "later", null],
                      "type": ["string", "null"]
                    },
                    "waitingOn": {
                      "enum": ["guest", "organiser", "business", "skipper", "permit_office", "desk", "nobody"],
                      "type": "string"
                    },
                    "what": {
                      "enum": ["stay", "parking", "rental", "charter", "moorage", "service", "waivers", "permits", "payment", "deposit", "group"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "notIncluded": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ready": {
                "properties": {
                  "answer": {
                    "description": "ready only when every line the trip depends on is ready, the payment record included. cannot_tell: nothing is waiting on anyone, and something the trip depends on could not be verified. not_applicable: the trip is over or cancelled.",
                    "enum": ["ready", "not_ready", "cannot_tell", "not_applicable"],
                    "type": "string"
                  },
                  "checkedAt": {
                    "type": "string"
                  },
                  "dependsOn": {
                    "type": ["integer", "null"]
                  },
                  "detail": {
                    "type": "string"
                  },
                  "headline": {
                    "type": "string"
                  },
                  "readyCount": {
                    "description": "null once the trip is over or cancelled.",
                    "type": ["integer", "null"]
                  },
                  "rule": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "thisLink": {
                "properties": {
                  "cannot": {
                    "type": "string"
                  },
                  "expiresAt": {
                    "description": "An ISO 8601 time in UTC. 30 days after the end of the trip's last day in Bamfield, and never sooner than 30 days after the link was made.",
                    "type": "string"
                  },
                  "expiryRule": {
                    "type": "string"
                  },
                  "lastReadAt": {
                    "description": "When it was read before this.",
                    "type": ["string", "null"]
                  },
                  "readsOnly": {
                    "type": "boolean"
                  },
                  "timesRead": {
                    "description": "How many times this link has been read, this read included. Counted in one step in the database, so reads arriving together are all counted. Reads through the MCP tool get_trip_summary are counted here too, and count toward the same 30-a-minute limit.",
                    "type": ["integer", "null"]
                  }
                },
                "type": "object"
              },
              "trip": {
                "properties": {
                  "endDate": {
                    "description": "YYYY-MM-DD, or null.",
                    "type": ["string", "null"]
                  },
                  "stage": {
                    "enum": ["upcoming", "under_way", "finished", "cancelled"],
                    "type": "string"
                  },
                  "startDate": {
                    "description": "YYYY-MM-DD, or null.",
                    "type": ["string", "null"]
                  },
                  "testOrder": {
                    "description": "Present, and true, only on an order made with a test code. A real trip does not carry this field.",
                    "type": "boolean"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
