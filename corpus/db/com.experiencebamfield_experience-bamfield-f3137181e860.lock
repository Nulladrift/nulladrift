        {
          "name": "quote_trip",
          "title": "Price a whole trip",
          "description": "The whole basket, the way checkout charges it. Each line: its price and whether it is free for those dates in that number. The basket: the cleaning fee, each tax, the refundable deposits, and totals.dueAtCheckoutCents — the amount the guest's card is charged. Saves nothing and holds nothing. A fishing charter line takes tripType (half-day or full-day).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "boatLengthFt": {
                      "description": "Moorage only: the boat's length in feet.",
                      "maximum": 200,
                      "minimum": 8,
                      "type": "integer"
                    },
                    "endDate": {
                      "description": "Last day: the morning the guests leave for a stay or moorage; the return day for a rental (the same date for a rental within one day).",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "endTime": {
                      "description": "Boats only: return time, HH:MM, by 20:00.",
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    },
                    "guests": {
                      "description": "How many people. Checked against how many a cottage sleeps. Default 2.",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "productId": {
                      "description": "A product id from list_products.",
                      "maxLength": 80,
                      "minLength": 2,
                      "pattern": "^[a-z0-9][a-z0-9:_-]{1,79}$",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Boats, vehicles or charter trips. 1 for a cottage. Default 1.",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "startDate": {
                      "description": "First day: check-in for a stay, pick-up day for a rental.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "startTime": {
                      "description": "Boats only: pick-up time, HH:MM, from 07:00. Send both times or neither.",
                      "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                      "type": "string"
                    },
                    "tripType": {
                      "description": "Fishing charters only. Full day when left out.",
                      "enum": ["half-day", "full-day"],
                      "type": "string"
                    }
