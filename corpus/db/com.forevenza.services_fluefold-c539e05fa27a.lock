        {
          "name": "interpret_requirement",
          "title": "Describe a need to Fluefold in words",
          "description": "Give Fluefold the buyer's requirement, or a correction or addition to it, in their own words: it is read into a structured requirement (each value says which words it came from), conflicting or unclear facts come back as one question, and words not yet read are kept as written. Pass the requirement (id, token) from the first answer to continue it. Nothing is sent or ordered: send_requirement sends it when the buyer says so. When you already have the fields in structured form, use submit_request instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
