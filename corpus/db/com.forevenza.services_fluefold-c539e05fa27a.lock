        {
          "name": "release_payment",
          "title": "Release a payment condition",
          "description": "Confirm a payment condition only where the inspected order allows the customer to release it. This records approval; it does not pay the processor.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirm": {
                "const": true,
