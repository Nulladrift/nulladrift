                "type": "object"
              },
              "timezone": {
                "description": "The buyer's IANA time zone, for reading dates",
                "maxLength": 64,
                "type": "string"
              },
              "turn_id": {
                "description": "Your id for this message: a retry with the same id is applied once",
                "maxLength": 80,
                "type": "string"
              },
              "utterance": {
                "description": "The buyer's words, as written",
