{
  "lockfileVersion": 2,
  "subjects": {
    "com.optilibra/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://optilibra.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "optilibra",
        "title": "OptiLibra optical networking catalog and RFQ",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OptiLibra (ArcMind Technologies Limited, Hong Kong) is an optical networking equipment brand for AI, data center and fiber networks; its equipment is manufactured by a long-term manufacturing partner and supplied, configured and supported under the OptiLibra brand. Use search_products and get_product to find equipment and its documented specifications. Use request_quote only when the user wants a quotation and has given their name, work email, company and country; prices, availability and lead times are given in the quotation, never in the catalog. Contact: contact@optilibra.com.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get product specifications",
          "description": "Get the documented specifications, images and source of one product by slug or model (from search_products). Figures not documented are not invented; reach, OSNR, prices and lead times are confirmed per quote.",
          "inputSchema": {
            "properties": {
              "product": {
                "description": "Product slug or model, e.g. dci5800-t8e2",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:777946be02e5fff325e95adf14f90be12a469ab341a3d85272db8c6465f3c0ec"
        },
        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Submit a request for quotation (RFQ) to OptiLibra on behalf of a buyer. Only call this when the buyer has asked for a quote and provided their real name, work email, company and country. Returns a tracking ID; an engineer replies to the work email within 24 hours.",
          "inputSchema": {
            "properties": {
              "agentName": {
                "description": "Name of the AI agent or application submitting on the buyer's behalf",
                "type": "string"
              },
              "company": {
                "description": "Buyer's company",
                "type": "string"
              },
              "country": {
                "description": "Buyer's country",
                "type": "string"
              },
              "destinationCountry": {
                "description": "Delivery country",
                "type": "string"
              },
              "fullName": {
                "description": "Buyer's full name",
                "type": "string"
              },
              "networkDistance": {
                "description": "Approximate fiber distance, e.g. 80 km",
                "type": "string"
              },
              "products": {
                "description": "Product slugs or models from search_products, e.g. dci5800-t8e2",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "projectDescription": {
                "description": "What the buyer needs: application, sites, distances, capacity, timeline",
                "type": "string"
              },
              "projectTimeline": {
                "description": "When the equipment is needed",
                "type": "string"
              },
              "quantity": {
                "description": "Quantity or range",
                "type": "string"
              },
              "requiredCapacity": {
                "description": "Target capacity, e.g. 4 × 800G",
                "type": "string"
              },
              "technicalRequirements": {
                "description": "Interfaces, wavelengths, port counts, protection, power or other constraints",
                "type": "string"
              },
              "workEmail": {
                "description": "Buyer's work email; the quote is sent here",
                "type": "string"
              }
            },
            "required": ["company", "country", "fullName", "projectDescription", "workEmail"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d7345dca43630823fe3ce567f8e856ceb801dc7cc5a171db6fa9dd8a14f7ccf"
        },
        {
          "name": "search_products",
          "title": "Search optical networking products",
          "description": "Search OptiLibra's catalog of optical networking equipment for AI and data center networks: 400G/800G DCI/DWDM transport (DCI5800, DCI5800-T8E2 800G transponder), optical switches and OXC matrices up to 64×64, EDFA amplifiers, OLP protection, OTDR/OCM monitoring, WSS and passive DWDM components. Returns product names, summaries and URLs.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter, e.g. 'Data center interconnect', 'Optical switching'",
                "type": "string"
              },
              "query": {
                "description": "Free text, e.g. '800G DCI', 'optical switch 32x32', 'line protection'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4eaf18440962771f497497fd1f19b8e59063e336c6e5e5cc86f7bf4434b6f09"
        }
      ],
      "digest": "sha256:986effd532c93881f018479768313b572c143fa7346cb91f318b142825fc9294"
    }
  }
}
