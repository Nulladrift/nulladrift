{
  "lockfileVersion": 2,
  "subjects": {
    "com.apished/current-datetime-tool": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://apished.com/mcp/v1/datetime"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "apished-datetime",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "datetime_now",
          "description": "Returns the actual current date/time — an LLM has a training cutoff and no live clock, so it can't know what time it actually is right now.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "iso8601 (default), unix, unixmilli, or rfc1123",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone name, e.g. Europe/Warsaw; default UTC",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "type": "string"
              },
              "timezone": {
                "type": "string"
              },
              "value": {
                "type": "string"
              }
            },
            "required": ["format", "timezone", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8a98a1d0c8f73cffbab44ae57ffee3131e0383154c8f41f60e825ef0526af707"
        }
      ],
      "digest": "sha256:9ce7e6fd2b5b3d32463dd809cd4940841b8c0b7229cf0b1bdf85930153501182"
    }
  }
}
