        {
          "name": "analyst_debate",
          "title": "Analyst Debate",
          "description": "★ CORE. Compare several analysts' takes on ONE ticker and surface the clash.\n\nGroups the named analysts into bull / bear / neutral camps and returns their\npoints so you can construct each side's case (paraphrased), then judge whether\nBOTH opposing views are internally reasonable, what evidence would settle it,\nand where they talk past each other. Balanced analysis, not a recommendation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "handles": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit_per_analyst": {
                "default": 25,
                "type": "integer"
              },
              "ticker": {
                "type": "string"
              }
            },
            "required": ["handles", "ticker"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
