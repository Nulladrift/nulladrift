{
  "lockfileVersion": 2,
  "subjects": {
    "com.localscreenshot/localscreenshot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.localscreenshot.com/mcp/free"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "localscreenshot MCP Server (Free)",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "localscreenshot takes screenshots of public web pages for AI agents, from 227 countries.\n\nThis is the free endpoint. It needs no key and it does not capture a page of your choice. It has three read-only tools:\n- take_demo_screenshot: a real screenshot of one of our example pages.\n- list_countries: the countries a screenshot can be taken from.\n- get_pricing: free credits, limits and prices.\n\nTo capture any public page, create a free account (50 free credits every month, no card) and connect to https://api.localscreenshot.com/mcp with your API key in the Authorization header.",
      "tools": [
        {
          "name": "get_pricing",
          "title": "Get pricing",
          "description": "What localscreenshot costs: the free credits every account gets each month, the limits of a free account, what a screenshot costs in credits, and where paid plans and credit packs start.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "countries": {
                "description": "Number of countries a screenshot can be taken from.",
                "type": "integer"
              },
              "credits_per_screenshot": {
                "description": "Credits one screenshot costs.",
                "type": "integer"
              },
              "credits_per_screenshot_with_country": {
                "description": "Credits one screenshot costs when a country is chosen.",
                "type": "integer"
              },
              "currency": {
                "description": "Currency of the prices, ISO 4217.",
                "type": "string"
              },
              "free_credits": {
                "description": "Free credits an account without a paid plan gets each calendar month (UTC). They do not carry over.",
                "type": "integer"
              },
              "free_credits_period": {
                "description": "How often the free credits come back: \"month\".",
                "type": "string"
              },
              "free_requests_per_minute": {
                "description": "Requests a minute for an account that has only free credits.",
                "type": "integer"
              },
              "packs_from": {
                "properties": {
                  "credits": {
                    "description": "Credits in the smallest pack.",
                    "type": "integer"
                  },
                  "price": {
                    "description": "Price of the smallest credit pack, paid once, before tax.",
                    "type": "number"
                  }
                },
                "required": ["credits", "price"],
                "type": "object"
              },
              "plans_from": {
                "properties": {
                  "credits_per_month": {
                    "description": "Credits a month in the smallest plan.",
                    "type": "integer"
                  },
                  "price": {
                    "description": "Price a month of the smallest plan, before tax.",
                    "type": "number"
                  }
                },
                "required": ["credits_per_month", "price"],
                "type": "object"
              }
            },
            "required": ["countries", "credits_per_screenshot", "credits_per_screenshot_with_country", "currency", "free_credits", "free_credits_period", "free_requests_per_minute", "packs_from", "plans_from"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54091231494374c60295e63e3a901bd016457d35a2bc2f4723d921bd4c16b362"
        },
        {
          "name": "list_countries",
          "title": "List countries",
          "description": "List the countries a screenshot can be taken from, with their two-letter codes. Choosing a country needs an account: this free endpoint only lists them.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "description": "Number of countries.",
                "type": "integer"
              },
              "countries": {
                "items": {
                  "properties": {
                    "code": {
                      "description": "Two-letter country code (ISO 3166-1 alpha-2).",
                      "type": "string"
                    },
                    "name": {
                      "description": "Country name in English.",
                      "type": "string"
                    }
                  },
                  "required": ["code", "name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "countries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:37e0d98edcd1266960fc5580388b16f407b5e9d120c4940893bded01a2783888"
        },
        {
          "name": "take_demo_screenshot",
          "title": "Take a demo screenshot",
          "description": "See what a localscreenshot result looks like: a real screenshot of one of our example pages. It does not capture a page of your choice. For that, create a free account and use the main MCP server with an API key.",
          "inputSchema": {
            "properties": {
              "device": {
                "description": "Screen to render it on. Default: desktop.",
                "enum": ["desktop", "phone"],
                "type": "string"
              },
              "page": {
                "description": "Which example page to capture.",
                "enum": ["guardian", "wikipedia", "hackernews"],
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "height": {
                "description": "Image height in pixels.",
                "type": "integer"
              },
              "image_url": {
                "description": "Short-lived link to the image.",
                "type": "string"
              },
              "page": {
                "description": "Site that was captured.",
                "type": "string"
              },
              "page_status": {
                "description": "HTTP status the page answered with.",
                "type": "integer"
              },
              "retry_after_seconds": {
                "description": "When pending: how long to wait before calling again.",
                "type": "integer"
              },
              "status": {
                "description": "\"succeeded\" when the image is ready, \"pending\" while it is being taken.",
                "type": "string"
              },
              "taken_at": {
                "description": "When the screenshot was taken. Example pages are shared and can be a few hours old.",
                "type": "string"
              },
              "width": {
                "description": "Image width in pixels.",
                "type": "integer"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fd24e6b40c82b137fa31c00ce7e2e2d6db644b3e34491153d4b7c03c35b0082a"
        }
      ],
      "digest": "sha256:1345fefdd9f7a4a61f4664e758fab635d4f62e39d198983706b6b486c288874a"
    }
  }
