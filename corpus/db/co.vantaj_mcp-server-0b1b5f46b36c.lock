      "serverInfo": {
        "name": "vantaj",
        "title": "Vantaj Uptime",
        "version": "1.1.0",
        "description": "Uptime monitoring, heartbeats, incidents, domains, and status pages - query and manage your Vantaj workspace.",
        "websiteUrl": "https://vantaj.co/products/mcp-server"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Vantaj Uptime monitoring. Most tools need a project_id - call list_projects first to discover them. Monitor status values: up, degraded, down, paused, unknown. Inverted monitors are UP while their target is unreachable (exposure monitoring). Deleting resources is not possible via MCP - use the dashboard at app.vantaj.co.",
      "tools": [
        {
          "name": "create_maintenance_window",
          "title": "Create maintenance window",
          "description": "Schedule a one-time maintenance window: the listed monitors keep running but their alerts are suppressed between starts_at and ends_at. Use before deploys or planned downtime.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "Optional details shown alongside the window",
                "type": "string"
              },
              "ends_at": {
                "description": "ISO 8601 datetime with offset - must be after starts_at",
                "type": "string"
              },
              "monitor_ids": {
                "description": "Monitors whose alerts to suppress (from list_monitors)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "project_id": {
                "description": "Project ID (from list_projects)",
                "type": "string"
              },
              "starts_at": {
                "description": "ISO 8601 datetime with offset, e.g. 2026-07-12T02:00:00Z",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone for display (default UTC)",
                "type": "string"
              },
              "title": {
                "description": "Window title, e.g. 'Database migration'",
                "type": "string"
              }
            },
            "required": ["ends_at", "monitor_ids", "project_id", "starts_at", "title"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": true,
                "description": "The resource object",
                "type": "object"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:98da2e3a1f382329312329236d490e49472b7fa9f70d38534517f2de8eb37c75"
        },
        {
          "name": "create_monitor",
          "title": "Create monitor",
          "description": "Create a new uptime monitor. Checks start immediately. Types: http, tcp (host:port URL), smtp, ping, ssl, dns. Set inverted=true for exposure monitoring (alert when a target that should stay down becomes reachable).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expected_status_codes": {
                "description": "HTTP status codes considered up (default: any 2xx)",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "group": {
                "description": "Optional group name",
                "type": "string"
              },
              "interval_seconds": {
                "description": "Check interval (default 300)",
                "enum": [30, 60, 180, 300, 600, 1800, 3600, 21600, 86400],
                "type": "integer"
              },
              "inverted": {
                "description": "Exposure monitoring: up while unreachable, alert when reachable",
                "type": "boolean"
              },
              "name": {
                "description": "Display name",
                "type": "string"
              },
              "project_id": {
                "description": "Project ID (from list_projects)",
                "type": "string"
              },
              "regions": {
                "description": "Probe regions (defaults to all)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "timeout_seconds": {
                "description": "Request timeout in seconds (default 30)",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "Check type",
                "enum": ["http", "tcp", "smtp", "ping", "ssl", "dns"],
                "type": "string"
              },
              "url": {
                "description": "URL for http, host for ping/smtp, host:port for tcp",
                "type": "string"
              }
            },
            "required": ["name", "project_id", "type", "url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": true,
                "description": "The resource object",
                "type": "object"
              }
            },
            "required": ["data"],
            "type": "object"
          },
