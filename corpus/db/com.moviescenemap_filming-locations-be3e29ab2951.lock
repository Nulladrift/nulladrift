      "serverInfo": {
        "name": "moviescenemap",
        "title": "Movie Scene Map",
        "version": "1.2.3",
        "description": "Where films and television series were filmed, and where video games, anime and manga are set: real places from Wikidata, read only.",
        "websiteUrl": "https://moviescenemap.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only tools over Movie Scene Map: 40,965 real filming locations, plus 166 whole countries or regions that carry nothing but video-game settings, for 45,158 films, series and games across 187 countries. The backbone is \"filming location\" (P915) statements on Wikidata joined to each place's coordinates and Wikipedia article; some records additionally carry places named in the production's own English Wikipedia article, ALWAYS in fields prefixed wiki_ and never merged with the statements: quote those as \"per Wikipedia\". Nothing is scraped from listicles and nothing is generated. TWO RULES WHEN YOU QUOTE THIS DATA. (1) Video games, anime and manga are placed by where they are SET (P840), because they are filmed nowhere; every record carries a \"relation\" field saying \"filmed at\" or \"set in\", and calling such a place a filming location is a false claim. (2) This atlas records that a production filmed at a place and stops there: which scene was shot where is NOT in the data, so never assign one. Gaps are reported rather than filled: where Wikidata knows only a country, the answer says so. Use where_was_it_filmed for the main question, what_was_filmed_here for the inverse, locations_near for \"what was filmed near me\" (it takes coordinates, so geocode a place name first), search_productions to resolve a title you are unsure of and search_locations for places, top_locations and list_countries for coverage, and get_statistics for aggregate claims. A production or a place links its page on https://moviescenemap.com where the site has one.",
      "tools": [
        {
          "name": "get_statistics",
          "title": "Atlas statistics",
          "description": "Headline figures computed live from the atlas: totals by medium and by kind of place, the top countries, the busiest and the most famous locations, and how many productions Wikidata records only at country level and so cannot place.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Atlas statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9f7c4c49a259475b7a720cf870f6f3f6bb585f4fc6eaf7ea6cd788c79831794"
        },
        {
          "name": "list_countries",
          "title": "Countries with location counts",
          "description": "Lists every country in the atlas with its number of filming locations, most first. Countries with a page on the site carry its URL. The counts reflect what Wikidata records, which is uneven and skewed to Europe and North America: they are records, not an inventory of world film production.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Countries with location counts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:164a31aef9ade89837358596a9cf109250bf0653464b8d02390583de5e012b29"
        },
        {
          "name": "locations_near",
          "title": "Filming locations near a point",
          "description": "Lists the filming locations within a radius of a WGS84 coordinate, most famous first, each with its `distance_km`: what was filmed near a point. The radius defaults to 50 km (at most 500). Takes a latitude and a longitude in degrees; it does not look up place names.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Kind of place, as a key or a slug: studio (Studios & sets), castle (Castles & palaces), landmark (Landmarks & buildings), street (Streets & squares), nature (Landscapes & nature), city (Towns & cities), region (Countries & regions), fiction (Fictional places) (optional)",
                "type": "string"
              },
              "latitude": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "Max results (default 15)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_km": {
                "description": "Search radius in km (default 50)",
                "maximum": 500,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Filming locations near a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83805e2d4cfc211d9dee3d6a6556c52de5081ba90cbfb178a3808b7fcaeeb872"
        },
        {
          "name": "search_locations",
          "title": "Search filming locations by name",
          "description": "Finds filming locations by name, optionally filtered by country (a name or a two letter ISO code) and by kind of place. Results are ordered by fame rank, which comes from the most widely covered production shot there rather than from the place itself.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Kind of place, as a key or a slug: studio (Studios & sets), castle (Castles & palaces), landmark (Landmarks & buildings), street (Streets & squares), nature (Landscapes & nature), city (Towns & cities), region (Countries & regions), fiction (Fictional places) (optional)",
                "type": "string"
              },
              "country": {
                "description": "Country name or ISO code (optional)",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Place name or part of one, e.g. \"skellig\", \"petra\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search filming locations by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6628c402c757b255bdd6ede55b9d3619f51d0754b9bc8035a3ca07b5cd0fa598"
        },
        {
          "name": "search_productions",
          "title": "Search films, series and games by name",
          "description": "Finds productions by name, ignoring accents and case, best match first, then by how widely Wikipedia covers them. An optional filter by kind: film, tv, game, anime or manga. Each result carries its kind, its year and a `relation` field: films and series are placed where they were filmed, games, anime and manga where they are set.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Restrict to one medium (optional)",
                "enum": ["film", "tv", "game", "anime", "manga"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Title or part of one, e.g. \"bond\", \"star wars\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search films, series and games by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75d3a99eb7ec042055005c63cde9c350e4ecc14f6417b3780c70a723ab943b33"
        },
        {
          "name": "top_locations",
          "title": "The most filmed places",
          "description": "Ranks the places in the atlas, worldwide or inside one country or one kind of place. The default order is fame rank, which comes from the most widely covered production shot there, so rank 1 is the place the most famous production used, not the place with the most credits. With `sort` set to `productions` the order is by number of productions (Los Angeles, New York, Vancouver).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Kind of place, as a key or a slug: studio (Studios & sets), castle (Castles & palaces), landmark (Landmarks & buildings), street (Streets & squares), nature (Landscapes & nature), city (Towns & cities), region (Countries & regions), fiction (Fictional places) (optional)",
                "type": "string"
              },
              "country": {
                "description": "Country name or two letter ISO code (optional; without it the ranking is worldwide)",
                "type": "string"
              },
              "limit": {
                "description": "How many (default 10)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Ranking (default fame)",
                "enum": ["fame", "productions"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The most filmed places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4db1160278517dbc7c63e8c77d29aead95519a1e2ca5bab473a28d7e10c9b78d"
        },
        {
          "name": "what_was_filmed_here",
          "title": "What was filmed at a place",
          "description": "Returns everything recorded as made at a place, most widely covered first. Takes the place as a slug (e.g. \"skellig-michael\") or as a name. Each result carries a `relation` field, because a video game, an anime or a manga tied to a place is set there, not filmed there.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max productions (default 50)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "description": "Place slug (preferred) or name, e.g. \"durham-cathedral\"",
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What was filmed at a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e01bef2dd000323c4bd353365a22b8dc0a2a6c142aa70dbd7e522830d06d6a4c"
        },
        {
          "name": "where_was_it_filmed",
          "title": "Where a film, series or game was filmed",
          "description": "Returns every place recorded for a film, series, game, anime or manga, with coordinates, plus the countries recorded too coarsely to place. Covers 45,158 productions across 41,131 places. Films and series are placed where they were filmed (Wikidata P915). Video games, anime and manga are filmed nowhere, so they are placed where they are set (P840); the `relation` field of each record says which. A filled `countries_only` list means Wikidata records the production in those countries without a finer place. Places named only in the production's own Wikipedia article come in separate fields prefixed `wiki_`. The data records that a production was filmed at a place, not which scene was shot there.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max places (default 50)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "title": {
                "description": "Title, or its slug, e.g. \"Skyfall\", \"game-of-thrones\", \"The Third Man\"",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Where a film, series or game was filmed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1235bc0f90add59fc7097e7437d18ea20aa809329b1e4c1e4adc846f7d9015e"
        }
      ],
      "digest": "sha256:b3b1d01be0cd92491af73306eefa1c7ac0e22a2a1982d45daa87691f9cf754c8"
    }
  }
