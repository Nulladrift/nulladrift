          "description": "在进行中的实时面试里按「立即回答」：以面试官刚说的、还没回答的那段话（至少 6 个字）立即作答；AI 正在作答时先打断再答。关闭自动回答时用它触发作答。需要用户已在网页或桌面客户端打开这场面试的页面并处于连接状态；操作由该页面执行，与用户点击对应按钮完全相同。会消耗用户的时长、次数或产生付款，执行前向用户说明扣费内容并取得同意。（需要用户授权，范围 interviews:write）",
