        {
          "name": "create_payment_order",
          "description": "为某个商品下单并生成付款链接，由用户本人完成付款。wxpay 返回 weixin:// 开头的微信支付链接，需生成二维码供用户用微信扫一扫（直接点开无效）；alipay 返回一个网页地址，用户在电脑浏览器打开后用支付宝扫页面上的二维码；alipay_wap 返回手机浏览器打开即跳转支付宝 App 的地址。付款后用 check_order_status 确认到账。商品 ID 取自 list_plans；优惠码与升级券折扣自动计入，可先用 preview_coupon / get_upgrade_offer 预览。会消耗用户的时长、次数或产生付款，执行前向用户说明扣费内容并取得同意。（需要用户授权，范围 account:write）",
