            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "wxpay = 微信扫码；alipay = 电脑浏览器打开、支付宝扫码；alipay_wap = 手机浏览器打开、跳转支付宝",
                "enum": ["wxpay", "alipay", "alipay_wap"],
                "type": "string"
              },
              "couponCode": {
                "description": "优惠码（仅新用户首单可用）",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "deferActivation": {
