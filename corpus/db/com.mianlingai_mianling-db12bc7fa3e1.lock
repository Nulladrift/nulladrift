        {
          "name": "send_job_apply_instruction",
          "description": "把一句话交给用户电脑上的网申 AI，等同于用户在客户端对话框里说了这句话，例如「把投递清单里的岗位都投了」「按我的简历挑 10 个北京的后端校招」。默认交给 Skills 专用的那条常驻对话（没有则新开），传 taskId 则交给指定的对话；对话正在执行时这句不打断，随下一步一并交给 AI 或排队到这一轮结束。网申 AI 据此投递时，每家填到提交前或提交成功时扣 1 家网申可投家数（同一家只扣一次，不限家数期内不扣）。回包为客户端读回的去向（已开始执行 / 已随下一步交给 AI / 排队中）与对话 ID，之后用 get_job_apply_client_status 查看进展与 AI 的回复。需要用户电脑上的「面灵求职网申助手」客户端已登录并打开（关闭窗口后转入后台运行的同样可以）；客户端不在线或版本较旧时，工具如实返回原因。会消耗用户的时长、次数或产生付款，执行前向用户说明扣费内容并取得同意。（需要用户授权，范围 job_applications:write）",
