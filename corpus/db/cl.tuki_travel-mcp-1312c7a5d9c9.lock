        {
          "name": "search_bus_schedules",
          "title": "Buscar horarios de buses (Carretera Austral / Coyhaique)",
          "description": "Search bus schedules for the Carretera Austral region via the Coyhaique terminal (unique inventory, hard to find online). Filter by origin, destination, date or free text. Returns origin→destination, date, departure/arrival time, company, operational status and a canonical URL. Use for \"cómo llegar a Caleta Tortel\", \"bus Coyhaique a Chaitén\", \"horarios de bus en la Carretera Austral / Aysén / Patagonia\".",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Date YYYY-MM-DD. Empty = upcoming.",
                "type": "string"
