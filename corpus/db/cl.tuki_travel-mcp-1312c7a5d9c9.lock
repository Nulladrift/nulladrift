        {
          "name": "search_accommodations",
          "title": "Buscar alojamientos",
          "description": "Search Tuki accommodations (boutique lodges, mountain refugios, hotels, cabins, hostels, unique stays) by text or destination. Includes remote locations where major OTAs have no inventory (Cochamó valley, Carretera Austral, Atacama, Patagonia outposts). Returns title, price (CLP), capacity, location, URL. For Hotel landings (pousadas Ilha Grande, Casa D'Agostino, etc. at /hotel/<slug>) prefer search_hotels.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Destination slug filter.",
                "type": "string"
              },
              "max_results": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Pagination offset. Use next_offset from a previous response.",
                "minimum": 0,
                "type": "integer"
              },
              "price_max": {
                "description": "Maximum nightly price in CLP. Converted from foreign currency via live FX rates.",
                "type": "number"
              },
              "price_min": {
                "description": "Minimum nightly price in CLP. Converted from foreign currency via live FX rates.",
                "type": "number"
              },
              "property_type": {
                "description": "Type: hotel, lodge, refugio, cabin, hostel, etc.",
                "type": "string"
              },
              "query": {
                "description": "Free text search.",
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "description": "concise = high-signal fields + canonical URL (token-cheap, default). detailed = full record.",
