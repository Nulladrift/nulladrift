        },
        {
          "name": "verify_material_compliance",
          "title": "Verify material compliance (Pro)",
          "description": "[PRO] Checks whether a specific material, product, or component meets the code requirements for a given trade application and jurisdiction. Returns COMPLIANT, NON_COMPLIANT, or REQUIRES_VERIFICATION with the specific clause that governs the material selection, and — if non-compliant — the compliant alternative. Use this tool BEFORE ordering materials to avoid costly substitutions on site. Do NOT use this tool for general compliance questions — use check_compliance instead. Example inputs: '2.5mm2 TPS cable for 20A underground direct burial circuit NSW', 'Class 12 copper pipe for domestic hot water NSW', 'R3.5 glasswool batts for external wall cavity UK Building Regs'.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Pro API key required.",
                "type": "string"
              },
              "material": {
                "description": "The material or product to check. Include: product name or type, specification or rating, and manufacturer if known. Example: '2.5mm2 TPS twin and earth, 450/750V rating, PVC insulation'.",
                "type": "string"
              },
              "region": {
                "description": "Use the state, province or country where the user works; if they have not said, ask them - never assume NSW or Australia. Jurisdiction. Determines which product standards and approval schemes apply.",
                "type": "string"
              },
              "role": {
                "default": "Qualified Tradesperson",
                "description": "Role of the person checking the material.",
                "enum": ["Apprentice / Trainee", "Qualified Tradesperson", "Supervisor / Foreman", "Manager / Executive"],
                "type": "string"
              },
              "trade": {
                "description": "The trade context for this material check.",
                "enum": ["Electrical", "Plumbing", "HVAC", "Welding", "Carpentry", "Fire protection", "Concrete", "Roofing", "Gas fitting", "Solar / Battery"],
                "type": "string"
              },
              "use_case": {
                "default": "standard installation",
                "description": "Where and how the material will be used. Include installation method, environmental conditions, load. Example: 'underground direct burial, 20A circuit, 30m run, clay soil'.",
                "type": "string"
              }
            },
            "required": ["material", "region", "trade"],
            "type": "object"
          },
          "annotations": {
