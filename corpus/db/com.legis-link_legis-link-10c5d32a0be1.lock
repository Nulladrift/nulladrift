      "tools": [
        {
          "name": "calculate_technical_spec",
          "title": "Calculate a technical spec (Pro)",
          "description": "[PRO] Performs numerical technical calculations for construction trades with code-compliant results. Use this tool when a specific measurement, size, rating, or capacity needs to be calculated — not just checked for compliance. Returns the calculated value with units, the method or formula used, relevant derating or correction factors, and the code reference that governs the calculation. Supports: cable/conductor sizing (mm2 or AWG), voltage drop (%), pipe sizing (mm or inches), HVAC duct sizing (CFM/L/s), heat load calculations, load current calculations, and more. Example inputs: 'Cable size for 32A circuit, 25m run, 240V single phase, clipped direct', 'Pipe size for 40 fixture units copper hot water supply', 'Duct size for 1200 CFM round duct'.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Pro API key required. Get at https://rickyfarmer.gumroad.com/l/Legis-LinkPro",
                "type": "string"
              },
              "calculation": {
                "description": "Describe the calculation needed with all relevant parameters. Include: load/flow value, distance/length, voltage/pressure, installation method, ambient conditions. Example: 'Cable size for 45A, 30m run, 240V, single phase, in conduit, 35 degrees ambient'.",
                "type": "string"
              },
              "region": {
                "description": "Use the state, province or country where the user works; if they have not said, ask them - never assume NSW or Australia. Jurisdiction. Affects which standard and units apply (e.g. mm2 for AU/UK, AWG for USA).",
                "type": "string"
              },
              "role": {
                "default": "Qualified Tradesperson",
                "description": "User role. Affects detail level of the output.",
                "enum": ["Apprentice / Trainee", "Qualified Tradesperson", "Supervisor / Foreman", "Manager / Executive"],
                "type": "string"
              },
              "trade": {
                "description": "The trade for this calculation. Determines the applicable standard and units.",
                "enum": ["Electrical", "Plumbing", "HVAC", "Welding", "Carpentry", "Fire protection", "Concrete", "Roofing", "Gas fitting", "Solar / Battery"],
                "type": "string"
              }
            },
            "required": ["calculation", "region", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate a technical spec (Pro)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3bbff38a5aafb316e73275a411b1796844dcb050ab6840265ade68fc921eca78"
        },
        {
          "name": "check_compliance",
          "title": "Check compliance",
          "description": "Answers construction trade compliance questions with exact code references and clause citations. Use this tool when a tradesperson or engineer asks whether a specific installation, practice, or configuration is compliant with local regulations. Returns a COMPLIANT, NON_COMPLIANT, or REQUIRES_VERIFICATION status with the precise standard (e.g. AS/NZS 3000:2018 Clause 3.2.4) and any critical caveats. Covers electrical, plumbing, HVAC, welding, carpentry, roofing, gas fitting, solar, fire protection, and concrete trades across Australia, UK, USA, Canada, and EU. Do NOT use this tool for numerical calculations (use calculate_technical_spec instead) or for generating safety checklists or RAMS documents.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Legis-Link API key. Optional: leave empty for the free tier (a daily question limit applies); Pro users paste their ll_p_ key. Get a free key at https://legis-link.com",
                "type": "string"
              },
              "question": {
                "description": "The compliance question in plain English. Be specific: include voltages, distances, materials, or load values where relevant. Example: 'Is 2.5mm2 TPS cable compliant for a 20A circuit in a wall cavity?'",
                "type": "string"
              },
              "region": {
                "description": "Use the state, province or country where the user works; if they have not said, ask them - never assume NSW or Australia. Jurisdiction for the compliance check. Examples: 'NSW', 'England', 'Texas', 'Ontario', 'Germany'. Determines which standard applies.",
                "type": "string"
              },
              "role": {
                "default": "Qualified Tradesperson",
                "description": "The role of the person asking. Affects the depth and terminology of the answer.",
                "enum": ["Apprentice / Trainee", "Qualified Tradesperson", "Supervisor / Foreman", "Manager / Executive"],
                "type": "string"
              },
              "trade": {
                "description": "The construction trade relevant to the question. Must match a supported trade exactly.",
                "enum": ["Electrical", "Plumbing", "HVAC", "Welding", "Carpentry", "Fire protection", "Concrete", "Roofing", "Gas fitting", "Solar / Battery"],
                "type": "string"
              }
            },
            "required": ["question", "region", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check compliance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f10ec2459a3ea6c97d902a7d3253b150090d2c71903ac71466620008ac3b530"
        },
        {
          "name": "generate_rams",
          "title": "Generate RAMS (Pro)",
          "description": "[PRO] Generates a complete Risk Assessment and Method Statement (RAMS) document — called a Job Hazard Analysis (JHA) in the USA or Safe Work Method Statement (SWMS) in Australia. Use this tool when a foreman or PM needs a formal safety document before a high-risk task. Output includes: Section 1 — Hazard Register (tabular, with severity/likelihood/risk rating/controls/regulations), Section 2 — Method Statement (numbered sequential steps), Section 3 — Required Qualifications and Certifications. The document is formatted for printing or inclusion in a site safety file. This tool produces a longer output than other tools — expect 800-1500 words. Example tasks: 'Electrical switchboard installation in commercial building NSW', 'Gas line installation in residential kitchen UK', 'Roof framing timber frame residential NSW'.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Pro API key required.",
                "type": "string"
              },
              "company_name": {
                "description": "Optional. Company name to include in the document header.",
                "type": "string"
              },
              "region": {
                "description": "Use the state, province or country where the user works; if they have not said, ask them - never assume NSW or Australia. Jurisdiction. Determines applicable WHS/CDM/OSHA legislation cited in the document.",
                "type": "string"
              },
              "role": {
                "default": "Foreman",
                "description": "Role of the person generating the RAMS. Foreman or PM recommended.",
                "enum": ["Apprentice / Trainee", "Qualified Tradesperson", "Supervisor / Foreman", "Manager / Executive"],
                "type": "string"
              },
              "site_address": {
                "description": "Optional. Site address to include in the document header.",
                "type": "string"
              },
              "task": {
                "description": "Full description of the task requiring the RAMS. Include: what work, where, at what height or voltage, any confined space, any hot work. The more detail, the more accurate the hazard register.",
                "type": "string"
              },
              "trade": {
                "description": "The trade performing the work.",
                "enum": ["Electrical", "Plumbing", "HVAC", "Welding", "Carpentry", "Fire protection", "Concrete", "Roofing", "Gas fitting", "Solar / Battery"],
                "type": "string"
              }
            },
            "required": ["region", "task", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate RAMS (Pro)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b80651a04c91ad1760aa34453d02fa3d372daf9d65a4c3396cda8aae0a81404"
        },
        {
          "name": "generate_safety_checklist",
          "title": "Generate a safety checklist (Pro)",
          "description": "[PRO] Generates a numbered safety checklist for a specific construction task with PPE requirements, hazard controls, and regulatory citations for each item. Use this tool when a foreman or safety officer needs a task-specific checklist before work begins. Each checklist item includes: the safety requirement, the specific control measure, and the regulation or standard that mandates it (e.g. WHS Act 2011, CDM 2015, OSHA 29 CFR 1926). Do NOT use this tool to generate a full RAMS document — use generate_rams for that. Example tasks: 'working at height on a residential roof', 'hot work near fuel lines', 'isolating and working on a 415V switchboard'.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Pro API key required.",
                "type": "string"
              },
              "region": {
                "description": "Use the state, province or country where the user works; if they have not said, ask them - never assume NSW or Australia. Jurisdiction. Determines which WHS/HSE regulations and codes of practice apply.",
                "type": "string"
              },
              "role": {
                "default": "Qualified Tradesperson",
                "description": "Role of the person who will use the checklist.",
                "enum": ["Apprentice / Trainee", "Qualified Tradesperson", "Supervisor / Foreman", "Manager / Executive"],
                "type": "string"
              },
              "task": {
                "description": "Specific task description. Be precise about the activity, location, and any known hazards. Example: 'Installing 415V switchboard in an occupied commercial building, working at 3m height'.",
                "type": "string"
              },
              "trade": {
                "description": "The trade performing the task.",
                "enum": ["Electrical", "Plumbing", "HVAC", "Welding", "Carpentry", "Fire protection", "Concrete", "Roofing", "Gas fitting", "Solar / Battery"],
                "type": "string"
              }
            },
            "required": ["region", "task", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate a safety checklist (Pro)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e84a38284b5b92706b6d6d8774308bfbe2b35a9d4417357d6c8565ae60658c3"
        },
        {
          "name": "get_code_reference",
          "title": "Look up a code or standard",
          "description": "Retrieves specific code sections, standards, and regulatory references for a construction trade topic. Use this tool when you need to cite the exact standard document, clause number, table reference, or regulatory instrument — without asking a yes/no compliance question. Returns the standard name, edition year, specific clause or table, and a plain-English summary of what that clause requires. Useful for pre-populating compliance documents, RAMS, or certificates. Examples: 'AS/NZS 3008 cable sizing tables', 'CDM 2015 notification thresholds', 'NEC Article 210 branch circuits'.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Legis-Link API key. Optional: leave empty for the free tier (a daily question limit applies); Pro users paste their ll_p_ key.",
                "type": "string"
              },
              "region": {
                "description": "Use the state, province or country where the user works; if they have not said, ask them - never assume NSW or Australia. Jurisdiction. Determines which edition of the standard applies. Examples: 'NSW', 'England', 'California'.",
                "type": "string"
              },
              "topic": {
                "description": "The specific topic or subject to look up. Example: 'cable sizing for final sub-circuits', 'maximum water heater temperature', 'roof pitch minimums'.",
                "type": "string"
              },
              "trade": {
                "description": "The construction trade for which you need a code reference.",
                "enum": ["Electrical", "Plumbing", "HVAC", "Welding", "Carpentry", "Fire protection", "Concrete", "Roofing", "Gas fitting", "Solar / Battery"],
                "type": "string"
              }
            },
            "required": ["region", "topic", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a code or standard"
          },
          "behavior": {
