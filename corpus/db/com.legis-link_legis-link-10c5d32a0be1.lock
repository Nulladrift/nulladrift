          },
          "digest": "sha256:3de45bcf89e3289d65dae47089cbb31e5d303deefdd51c5ae4c6a7e1d36e7023"
        },
        {
          "name": "get_inspection_requirements",
          "title": "Get inspection requirements (Pro)",
          "description": "[PRO] Returns all mandatory inspection hold points, sign-off authorities, certificates to be issued, and notification requirements for a construction installation in a specific jurisdiction. Use this tool when a foreman or PM needs to know: who must inspect, at what stage work must stop, what certificate is issued, and which regulation mandates the inspection. Prevents costly rework caused by covering work before mandatory inspection. Returns a numbered list of inspection stages with: inspector role/authority, certificate type and form number, regulatory reference, and notification timing. Example installations: 'residential electrical installation NSW', 'timber frame residential build NSW', 'gas fitting domestic kitchen UK'.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Pro API key required.",
                "type": "string"
              },
              "installation": {
                "description": "Description of the installation requiring inspection. Be specific about scope. Example: 'new 3-bedroom residential electrical installation including switchboard, circuits, and solar inverter connection, NSW'.",
                "type": "string"
              },
              "region": {
                "description": "Use the state, province or country where the user works; if they have not said, ask them - never assume NSW or Australia. Jurisdiction. Inspection authorities and certificate types vary significantly by region.",
                "type": "string"
              },
              "role": {
                "default": "Qualified Tradesperson",
                "description": "Role of the person requesting the inspection requirements.",
                "enum": ["Apprentice / Trainee", "Qualified Tradesperson", "Supervisor / Foreman", "Manager / Executive"],
                "type": "string"
              },
              "trade": {
                "description": "The trade performing the installation.",
                "enum": ["Electrical", "Plumbing", "HVAC", "Welding", "Carpentry", "Fire protection", "Concrete", "Roofing", "Gas fitting", "Solar / Battery"],
                "type": "string"
              }
            },
            "required": ["installation", "region", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
