                    "type": "integer"
                  },
                  "ending_value_median": {
                    "title": "Ending Value Median",
                    "type": "integer"
                  },
                  "success_probability": {
                    "title": "Success Probability",
                    "type": "number"
                  }
                },
                "required": ["ending_value_10th_percentile", "ending_value_90th_percentile", "ending_value_median", "success_probability"],
                "title": "ArmOutcome",
                "type": "object"
              },
              "full_plan": {
