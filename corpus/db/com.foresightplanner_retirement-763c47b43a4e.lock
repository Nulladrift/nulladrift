      "instructions": "Foresight Planner checks whether retirement savings are likely to last, using simulations built from more than a century of global market history. Use retirement_quick_check for a quick answer; send people to the full plan for taxes, CPP/OAS, pensions and anything personal.",
      "tools": [
        {
          "name": "get_plan_result",
          "title": "Get a plan result",
          "description": "Gets the result of a Foresight Planner plan that run_plan started but that was still running when run_plan answered. Pass the run_id run_plan gave. Free: it uses no plan run. If the plan is still running, it says so; call it again a little later.",
          "inputSchema": {
            "properties": {
              "run_id": {
                "description": "The run_id run_plan gave.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "title": "Run Id",
                "type": "string"
              }
            },
            "required": ["run_id"],
            "title": "get_plan_result_toolArguments",
            "type": "object"
          },
          "outputSchema": {
            "description": "The `run_plan` tool's structured output.",
            "properties": {
              "assumptions": {
                "items": {
                  "properties": {
                    "field": {
                      "title": "Field",
                      "type": "string"
                    },
                    "value": {
                      "title": "Value"
                    }
                  },
                  "required": ["field", "value"],
                  "title": "Assumption",
                  "type": "object"
                },
                "title": "Assumptions",
                "type": "array"
              },
              "benefits": {
                "items": {
                  "description": "One benefit program, or all employer pensions together, paid within the plan.\n\n`start_ages` maps each claimant paid within the plan (person label) to their start\nage (their earliest, for pensions). `amounts` is the household's amount from each year\na claim starts, a pension ends or a claimant's own fixed horizon ends, in order.",
                  "properties": {
                    "amounts": {
                      "items": {
                        "description": "The source's household amount from a calendar year on, until the next event.",
                        "properties": {
                          "annual_amount": {
                            "description": "The household's amount that year, in today's dollars (mean across paths). It holds until the next event, except that an unindexed pension falls in today's dollars each year and a benefit that steps up at an age rises then.",
                            "title": "Annual Amount",
                            "type": "integer"
                          },
                          "calendar_year": {
                            "title": "Calendar Year",
                            "type": "integer"
                          },
                          "events": {
                            "items": {
                              "description": "A claim starting, a pension with an end age stopping, or a person's own fixed\nhorizon ending (which stops all their income), at that person's age.",
                              "properties": {
                                "age": {
                                  "title": "Age",
                                  "type": "number"
                                },
                                "change": {
                                  "enum": ["starts", "ends", "plan ends"],
                                  "title": "ClaimChange",
                                  "type": "string"
                                },
                                "person": {
                                  "title": "Person",
                                  "type": "string"
                                }
                              },
                              "required": ["age", "change", "person"],
                              "title": "ClaimEvent",
                              "type": "object"
                            },
                            "title": "Events",
                            "type": "array"
                          }
                        },
                        "required": ["annual_amount", "calendar_year", "events"],
                        "title": "AmountFrom",
                        "type": "object"
                      },
                      "title": "Amounts",
                      "type": "array"
                    },
                    "lifetime_total": {
                      "title": "Lifetime Total",
                      "type": "integer"
                    },
                    "source": {
                      "title": "Source",
                      "type": "string"
                    },
                    "start_ages": {
                      "additionalProperties": {
                        "type": "number"
                      },
                      "title": "Start Ages",
                      "type": "object"
                    }
                  },
                  "required": ["amounts", "lifetime_total", "source", "start_ages"],
                  "title": "BenefitIncome",
                  "type": "object"
                },
                "title": "Benefits",
                "type": "array"
              },
              "benefits_after_plan_end": {
                "items": {
                  "description": "Claims on a source that start after the claimant's last plan year, so none of it\nis paid.\n\n`start_years` is the calendar year each claimant would first collect, and\n`last_plan_years` their last year in the plan: their own fixed horizon's, else the\nplan's.",
                  "properties": {
                    "last_plan_years": {
                      "additionalProperties": {
                        "type": "integer"
                      },
                      "title": "Last Plan Years",
                      "type": "object"
                    },
                    "source": {
                      "title": "Source",
                      "type": "string"
                    },
                    "start_ages": {
                      "additionalProperties": {
                        "type": "number"
                      },
                      "title": "Start Ages",
                      "type": "object"
                    },
                    "start_years": {
                      "additionalProperties": {
                        "type": "integer"
                      },
                      "title": "Start Years",
                      "type": "object"
                    }
                  },
                  "required": ["last_plan_years", "source", "start_ages", "start_years"],
                  "title": "BenefitAfterPlanEnd",
                  "type": "object"
                },
                "title": "Benefits After Plan End",
                "type": "array"
              },
              "data_attribution": {
                "title": "Data Attribution",
                "type": "string"
              },
              "end_ages": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "type": "integer"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Fixed horizon: each person's age at the end of their own horizon, by person label. Null under life expectancy.",
                "title": "End Ages",
                "type": ["object", "null"]
              },
              "first_retirement_year": {
                "description": "The first calendar year in which everyone in the plan is retired.\n\nUnder a life-expectancy horizon the amounts are means over the paths still running\nthat year, as the plan's year-by-year chart shows them.",
                "properties": {
                  "age": {
                    "title": "Age",
                    "type": "integer"
                  },
                  "benefits_and_pensions": {
                    "description": "Government benefits and employer pensions paid that year.",
                    "title": "Benefits And Pensions",
                    "type": "integer"
                  },
                  "calendar_year": {
                    "title": "Calendar Year",
                    "type": "integer"
                  },
                  "employment_income": {
                    "description": "Employment and other income the plan lists (the plan's Income band).",
                    "title": "Employment Income",
                    "type": "integer"
                  },
                  "investment_income": {
                    "description": "Dividends and interest earned in every account (the plan's Dividends & interest). The part earned inside sheltered accounts (RRSP, TFSA, 401(k), IRA) stays there and is counted again in reinvested.",
                    "title": "Investment Income",
                    "type": "integer"
                  },
                  "portfolio_withdrawals": {
                    "description": "Withdrawals from accounts (the plan's Portfolio withdrawals). Excludes dividends and interest, which also fund spending: see investment_income.",
                    "title": "Portfolio Withdrawals",
                    "type": "integer"
                  },
                  "reinvested": {
                    "description": "Income left after tax and spending, put back into the portfolio, plus the yield that stays inside sheltered accounts (the plan's Reinvested).",
                    "title": "Reinvested",
                    "type": "integer"
                  },
                  "spending": {
                    "description": "What the household spends that year (the plan's Net spendable): benefits_and_pensions + employment_income + portfolio_withdrawals + investment_income - taxes - reinvested.",
                    "title": "Spending",
                    "type": "integer"
                  },
                  "taxable_income": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Household income the tax brackets were applied to that year: benefits, pensions, employment income, interest, dividends (Canadian eligible dividends grossed up), the taxable part of realized capital gains and RRSP/RRIF or traditional 401(k)/IRA withdrawals, less deducted contributions. TFSA and Roth withdrawals are not in it. The engine applies these after it, so they lower the tax but not this figure: in Canada the basic personal, age and pension income amounts, the dividend tax credit, provincial tax reductions and surtax, and the OAS recovery tax; in the US the standard deduction (with its age-65 addition and the 2025-2028 senior deduction) and the Social Security exclusion (Social Security counts here in full), with qualified dividends and long-term gains taxed at their own rates. Null for a run saved before this figure existed.",
                    "title": "Taxable Income",
                    "type": ["integer", "null"]
                  },
                  "taxes": {
                    "description": "Income tax that year, averaged over the paths.",
                    "properties": {
                      "clawback": {
                        "title": "Clawback",
                        "type": "integer"
                      },
                      "federal": {
                        "title": "Federal",
                        "type": "integer"
                      },
                      "provincial_or_state": {
                        "title": "Provincial Or State",
                        "type": "integer"
                      }
                    },
                    "required": ["clawback", "federal", "provincial_or_state"],
                    "title": "Taxes",
                    "type": "object"
                  },
                  "withdrawals_by_account": {
                    "anyOf": [
                      {
                        "additionalProperties": {
                          "type": "integer"
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "portfolio_withdrawals split by account type, keyed by the plan's own account types (RRSP includes its RRIF years); every account the plan holds is listed, 0 where nothing was drawn, and the parts sum to portfolio_withdrawals. Null for a run saved before this breakdown existed.",
                    "title": "Withdrawals By Account",
                    "type": ["object", "null"]
                  }
                },
                "required": ["age", "benefits_and_pensions", "calendar_year", "employment_income", "investment_income", "portfolio_withdrawals", "reinvested", "spending", "taxable_income", "taxes", "withdrawals_by_account"],
                "title": "FirstRetirementYear",
                "type": "object"
              },
              "horizon_mode": {
                "description": "A person's horizon, and the household's: life expectancy when anyone in the plan\nis on it.",
                "enum": ["fixed", "life_expectancy"],
                "title": "HorizonMode",
                "type": "string"
