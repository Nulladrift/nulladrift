        {
          "name": "get_plugin",
          "title": "Get plugin",
          "description": "Full details for one listing by its slug (from a search result or a pickaplugin.com/p/<slug> URL): summary, category, maker, repo, homepage, docs, install command, stars, license.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Listing slug, e.g. 'deja', or a pickaplugin.com/p/<slug> URL.",
