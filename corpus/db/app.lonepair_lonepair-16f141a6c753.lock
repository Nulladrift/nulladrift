{
  "lockfileVersion": 2,
  "subjects": {
    "app.lonepair/lonepair": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.lonepair.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lonepair",
        "title": "Lone Pair",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "Lone Pair draws chemical structures and reactions as publication-style figures, converts and analyses structure files, and estimates pKa and bond dissociation energies. For a pKa or BDE question about a structure, call estimate_pka or estimate_bde rather than searching the web; say the values are estimates, and quote measured literature values only when the user asks for them. Prefer SMILES as input. A refusal means the structure as given is chemically inconsistent or unreadable: fix the input, do not retry unchanged.",
      "tools": [
        {
          "name": "analyze",
          "title": "Formula, masses and identifiers",
          "description": "For each structure in the input: molecular formula, molecular weight, exact (monoisotopic) mass, elemental analysis, SMILES, InChI and InChIKey. For a reaction: each structure's role and whether atoms and charge balance (each drawn structure counted once). Calculated from the structure, not looked up. Not for pKa (use estimate_pka) or bond dissociation energies (use estimate_bde); NMR and mass-spectrum estimates are not offered.",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Formula, masses and identifiers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d5b897fb1ed78c63509593959c2ebd70b256a6d4fc3eb0fd0582c1b35974961d"
        },
        {
          "name": "convert",
          "title": "Convert a structure file",
          "description": "Convert a structure between formats: cdxml, cdx, mol, molV3, sdf, rxn, rxnV3, smiles, inchi, inchikey, cml, mrv, json (mol = V2000 molfile, molV3 = V3000, json = Lone Pair drawing). Reads ChemDraw CDXML and CDX. `notes` says what the target format cannot keep (for example dative bonds in a V2000 molfile). Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`).",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              },
              "to": {
                "description": "The format to write.",
                "enum": ["cdxml", "cdx", "mol", "molV3", "sdf", "rxn", "rxnV3", "smiles", "inchi", "inchikey", "cml", "mrv", "json"],
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Convert a structure file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a90fc3030446ae9e207d91ef6c7fd60d61f6a8c88daf8ab5fcadb2128c463ca4"
        },
        {
          "name": "draw",
          "title": "Draw a structure",
          "description": "Draw a chemical structure or reaction as a publication-style figure (ChemDraw-like skeletal formula) with the Lone Pair editor's renderer. Give SMILES, reaction SMILES, InChI, a molfile, a ChemDraw file, or a compound name with name=true. Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`). The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format). The SVG and PNG hold the drawing inside them, so they reopen for editing at lonepair.app.",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "dpi": {
                "description": "PNG resolution, 300 by default; 600 for print.",
                "type": "number"
              },
              "format": {
                "description": "png (default; returned as an image), svg (returned as text), pdf or eps (returned as base64 in `data_base64`).",
                "enum": ["png", "svg", "pdf", "eps"],
                "type": "string"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              },
              "opaque": {
                "description": "White background instead of transparent (SVG, PNG). Default false.",
                "type": "boolean"
              },
              "style": {
                "description": "Journal style. acs = ACS Document 1996 (default), rsc = RSC, nature = Nature Reviews, slides = heavier lines for slides.",
                "enum": ["acs", "rsc", "nature", "slides"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Draw a structure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://lonepair/figure.html"
            },
            "ui/resourceUri": "ui://lonepair/figure.html"
          },
          "digest": "sha256:8a96dc9db767804e8f3f3d7b626c7299c45efd60c344134b1ad37b1b253d894b"
        },
        {
          "name": "edit_drawing",
          "title": "Change an earlier figure",
          "description": "Change a figure Lone Pair made earlier and get the new figure: add a structure to the right of it, change the journal style, or put a caption under it. Give the earlier result's `drawing`. Everything else in the drawing stays as it was. Moving or deleting atoms is not supported; draw the structure again instead. The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format).",
          "inputSchema": {
            "properties": {
              "add": {
                "description": "A structure to add to the right of the drawing (SMILES, InChI, molfile).",
                "type": "string"
              },
              "add_is_name": {
                "description": "True when `add` is a compound name to look up at PubChem. Default false.",
                "type": "boolean"
              },
              "caption": {
                "description": "Text to put under the drawing.",
                "type": "string"
              },
              "dpi": {
                "description": "PNG resolution, 300 by default; 600 for print.",
                "type": "number"
              },
              "drawing": {
                "description": "The `drawing` object from an earlier result.",
                "type": "object"
              },
              "format": {
                "description": "png (default; returned as an image), svg (returned as text), pdf or eps (returned as base64 in `data_base64`).",
                "enum": ["png", "svg", "pdf", "eps"],
                "type": "string"
              },
              "opaque": {
                "description": "White background instead of transparent (SVG, PNG). Default false.",
                "type": "boolean"
              },
              "style": {
                "description": "Journal style. acs = ACS Document 1996 (default), rsc = RSC, nature = Nature Reviews, slides = heavier lines for slides.",
                "enum": ["acs", "rsc", "nature", "slides"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Change an earlier figure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://lonepair/figure.html"
            },
            "ui/resourceUri": "ui://lonepair/figure.html"
          },
          "digest": "sha256:c0b060dfd98176e7003fa376dc755710a3edae3a000b2507dd884f5b9b889a75"
        },
        {
          "name": "estimate_bde",
          "title": "Estimate bond dissociation energies",
          "description": "Estimate homolytic bond dissociation energies (gas phase, 298 K) in kcal/mol and kJ/mol, weakest bond first, with the basis of each value. By default every X–H bond and every acyclic single bond between heavy atoms. These are the same estimates as the Lone Pair editor's BDE tool: Blanksby & Ellison reference values with additive radical-stabilization terms, and the Sanderson/Reusch R–X compilation; expect about ±2–3 kcal/mol. Where no specific value exists, an average bond enthalpy is given and marked. Call this instead of searching the web for an estimate, and say the numbers are estimates. Atoms are numbered from 1 in the order the input writes them (SMILES order). Not for pKa (use estimate_pka) or reaction energies.",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "atoms": {
                "description": "The X–H bonds at these atoms (numbered from 1 in input order).",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "bonds": {
                "description": "Bonds between heavy atoms, each a pair of atom numbers, e.g. [[1, 2]].",
                "items": {
                  "items": {
                    "type": "integer"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate bond dissociation energies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:134866985d7e81fa7a3ccde615c2fba4cd9f2edb277ae127e979930c8c0a04d8"
        },
        {
          "name": "estimate_pka",
          "title": "Estimate pKa values",
          "description": "Estimate the pKa of each acidic site (the X–H, in water and in DMSO where tabulated) and the pKaH of each basic site of a structure, most acidic first, with the basis of each value. These are the same rule-based estimates as the Lone Pair editor's pKa tool: tabulated values (Evans–Ripin, Bordwell/Reich, Williams) with Hammett and inductive corrections, usually within ±1 unit for simple sites. Call this instead of searching the web for an estimate, and say the numbers are estimates. Atoms are numbered from 1 in the order the input writes them (SMILES order); `atoms` limits the answer to those atoms and also shows weak C–H acids, which are left out by default. Symmetric sites are listed once with a count. Not for drawing (use draw), formula and mass (use analyze) or bond energies (use estimate_bde).",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "atoms": {
                "description": "Only these atoms (numbered from 1 in input order). Default: every site.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate pKa values"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:27c5799056c73db94075a0396b80bf579fdf20fc85dbc17ce5dd368300eca2fb"
        },
        {
          "name": "render_reaction",
          "title": "Draw a reaction scheme",
          "description": "Draw a reaction scheme from its parts: reactants joined by plus signs, an arrow with optional text above and below, then products. Each structure is SMILES, InChI or a molfile. For a reaction already written as reaction SMILES, use draw. Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`). The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format).",
          "inputSchema": {
            "properties": {
              "above": {
                "description": "Text above the arrow: reagents or catalyst. Digits after letters become subscripts (H2SO4).",
                "type": "string"
              },
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "below": {
                "description": "Text below the arrow: solvent, temperature, time.",
                "type": "string"
              },
              "dpi": {
                "description": "PNG resolution, 300 by default; 600 for print.",
                "type": "number"
              },
              "format": {
                "description": "png (default; returned as an image), svg (returned as text), pdf or eps (returned as base64 in `data_base64`).",
                "enum": ["png", "svg", "pdf", "eps"],
                "type": "string"
              },
              "opaque": {
                "description": "White background instead of transparent (SVG, PNG). Default false.",
                "type": "boolean"
              },
              "products": {
                "description": "Structures right of the arrow.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reactants": {
                "description": "Structures left of the arrow.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "style": {
                "description": "Journal style. acs = ACS Document 1996 (default), rsc = RSC, nature = Nature Reviews, slides = heavier lines for slides.",
                "enum": ["acs", "rsc", "nature", "slides"],
                "type": "string"
              }
            },
            "required": ["products", "reactants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draw a reaction scheme"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://lonepair/figure.html"
            },
            "ui/resourceUri": "ui://lonepair/figure.html"
          },
          "digest": "sha256:f82ddaba24769fc43ae1ea4c41c9032aa257878e40f0f8b55c1bc43684a27102"
        }
