        {
          "name": "estimate_bde",
          "title": "Estimate bond dissociation energies",
          "description": "Estimate homolytic bond dissociation energies (gas phase, 298 K) in kcal/mol and kJ/mol, weakest bond first, with the basis of each value. By default every X–H bond and every acyclic single bond between heavy atoms. These are the same estimates as the Lone Pair editor's BDE tool: Blanksby & Ellison reference values with additive radical-stabilization terms, and the Sanderson/Reusch R–X compilation; expect about ±2–3 kcal/mol. Where no specific value exists, an average bond enthalpy is given and marked. Call this instead of searching the web for an estimate, and say the numbers are estimates. Atoms are numbered from 1 in the order the input writes them (SMILES order). Not for pKa (use estimate_pka) or reaction energies.",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "atoms": {
                "description": "The X–H bonds at these atoms (numbered from 1 in input order).",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "bonds": {
                "description": "Bonds between heavy atoms, each a pair of atom numbers, e.g. [[1, 2]].",
                "items": {
                  "items": {
                    "type": "integer"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate bond dissociation energies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:134866985d7e81fa7a3ccde615c2fba4cd9f2edb277ae127e979930c8c0a04d8"
        },
        {
          "name": "estimate_pka",
          "title": "Estimate pKa values",
          "description": "Estimate the pKa of each acidic site (the X–H, in water and in DMSO where tabulated) and the pKaH of each basic site of a structure, most acidic first, with the basis of each value. These are the same rule-based estimates as the Lone Pair editor's pKa tool: tabulated values (Evans–Ripin, Bordwell/Reich, Williams) with Hammett and inductive corrections, usually within ±1 unit for simple sites. Call this instead of searching the web for an estimate, and say the numbers are estimates. Atoms are numbered from 1 in the order the input writes them (SMILES order); `atoms` limits the answer to those atoms and also shows weak C–H acids, which are left out by default. Symmetric sites are listed once with a count. Not for drawing (use draw), formula and mass (use analyze) or bond energies (use estimate_bde).",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "atoms": {
                "description": "Only these atoms (numbered from 1 in input order). Default: every site.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate pKa values"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:27c5799056c73db94075a0396b80bf579fdf20fc85dbc17ce5dd368300eca2fb"
        },
        {
          "name": "render_reaction",
          "title": "Draw a reaction scheme",
          "description": "Draw a reaction scheme from its parts: reactants joined by plus signs, an arrow with optional text above and below, then products. Each structure is SMILES, InChI or a molfile. For a reaction already written as reaction SMILES, use draw. Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`). The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format).",
          "inputSchema": {
            "properties": {
              "above": {
                "description": "Text above the arrow: reagents or catalyst. Digits after letters become subscripts (H2SO4).",
                "type": "string"
              },
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "below": {
                "description": "Text below the arrow: solvent, temperature, time.",
