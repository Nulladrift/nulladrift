                },
                "maxItems": 40,
                "type": "array"
              },
              "color": {
                "description": "black (default); cpk to colour heteroatoms (N blue, O red, S yellow, halogens green); or one colour as #rrggbb for every line and label, such as #ffffff over a dark picture.",
                "type": "string"
              },
              "dpi": {
                "description": "PNG resolution, 300 by default; 600 for print.",
                "type": "number"
              },
              "embed": {
                "description": "For a structure that goes into a larger figure (an SVG or HTML figure you build, or a picture an image model made): format svg or png only. The SVG gets its own id, data-smiles, data-formula and data-inchikey, and px sizes; the result's `embed` gives its box, the drawn bond length and each atom's position (atom n = the n-th atom of the input), and how to place it. Place it whole and scale it uniformly; never redraw or retouch it. Default false.",
