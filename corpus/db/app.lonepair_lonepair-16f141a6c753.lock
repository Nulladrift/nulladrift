      "serverInfo": {
        "name": "lonepair",
        "title": "Lone Pair",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Lone Pair draws chemical structures and reactions as publication-style figures, converts and analyses structure files, and estimates pKa and bond dissociation energies. For a pKa or BDE question about a structure, call estimate_pka or estimate_bde rather than searching the web; say the values are estimates, and quote measured literature values only when the user asks for them. When a structure goes into a larger figure or picture, never let an image model draw it: call draw or render_reaction with embed: true, place the result whole, scaled uniformly, and check the finished figure with verify_figure before showing it; over a picture from an image model, use compose_figure (the figure prompt and the template lonepair://figure-kit/template.html set out the steps). Prefer SMILES as input. A refusal means the structure as given is chemically inconsistent or unreadable: fix the input, do not retry unchanged.",
      "tools": [
        {
          "name": "analyze",
          "title": "Formula, masses and identifiers",
          "description": "For each structure in the input: molecular formula, molecular weight, exact (monoisotopic) mass, elemental analysis, SMILES, InChI and InChIKey. For a reaction: each structure's role and whether atoms and charge balance (each drawn structure counted once). Calculated from the structure, not looked up. Not for pKa (use estimate_pka) or bond dissociation energies (use estimate_bde); NMR and mass-spectrum estimates are not offered.",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Formula, masses and identifiers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d5b897fb1ed78c63509593959c2ebd70b256a6d4fc3eb0fd0582c1b35974961d"
        },
        {
          "name": "compose_figure",
          "title": "Put molecules over a picture",
          "description": "Put Lone Pair structures over a picture, such as a background an image model made with empty space for each molecule, so that no structure is drawn by the image model. Give the picture's size in pixels and, for each molecule, its structure and a box (x, y, width, height in the picture's pixels). Each molecule is drawn by Lone Pair, fitted to its box at one bond length for the whole figure, centred, and laid over the picture as the top layer on a white plate (plate: false for none). SVG (default): the figure the size of the picture, showing the picture by background_href; it can be checked again with verify_figure. PNG: a transparent overlay the size of the picture, to lay over it. The result gives each molecule's place, its bond length and its atoms' positions in the picture's pixels (for arrows and labels), and the check verify_figure makes. Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`).",
          "inputSchema": {
            "properties": {
              "background_href": {
                "description": "The picture's file name or URL, written into the SVG so that it shows the picture (it is not fetched).",
                "type": "string"
              },
              "bond_length": {
                "description": "Bond length in pixels for every molecule. Default: the largest that fits every box.",
                "type": "number"
              },
              "color": {
                "description": "black (default); cpk to colour heteroatoms (N blue, O red, S yellow, halogens green); or one colour as #rrggbb for every line and label, such as #ffffff over a dark picture.",
                "type": "string"
              },
              "format": {
                "description": "svg (default) or png.",
                "enum": ["svg", "png"],
                "type": "string"
              },
              "height": {
                "description": "The picture's height in pixels.",
                "type": "integer"
              },
              "molecules": {
                "description": "The molecules to place, each over the empty space left for it.",
                "items": {
                  "properties": {
                    "embed_id": {
                      "description": "Its id in the figure; needed when the same structure is placed twice.",
                      "type": "string"
                    },
                    "height": {
                      "description": "Height of its box.",
                      "type": "number"
                    },
                    "highlight": {
                      "description": "Highlight parts of the structure with a coloured band under them, e.g. the atoms that react: [{ \"atoms\": [1, 2, 3], \"color\": \"#ffe066\" }]. Atoms are numbered from 1 in input order; bonds between listed atoms are highlighted too, and `bonds` adds others. SVG and PNG only.",
                      "items": {
                        "properties": {
                          "atoms": {
                            "description": "Atom numbers.",
                            "items": {
                              "type": "integer"
                            },
                            "type": "array"
                          },
                          "bonds": {
                            "description": "Bonds as pairs of atom numbers.",
                            "items": {
                              "items": {
                                "type": "integer"
                              },
                              "type": "array"
                            },
                            "type": "array"
                          },
                          "color": {
                            "description": "#rrggbb; default #ffe066 (yellow).",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "description": "True when structure is a compound name to look up at PubChem.",
                      "type": "boolean"
                    },
                    "structure": {
                      "description": "SMILES, InChI or a molfile; a compound name with name: true.",
                      "type": "string"
                    },
                    "width": {
                      "description": "Width of its box.",
                      "type": "number"
                    },
                    "x": {
                      "description": "Left of its box, in the picture's pixels.",
                      "type": "number"
                    },
                    "y": {
                      "description": "Top of its box.",
                      "type": "number"
                    }
                  },
                  "required": ["height", "structure", "width", "x", "y"],
                  "type": "object"
                },
                "type": "array"
              },
              "outline_text": {
                "description": "SVG: draw atom labels and text as outlines instead of text, so the figure looks the same in any program, with or without the fonts. Default false.",
                "type": "boolean"
              },
              "plate": {
                "description": "A white rounded plate behind each molecule so it reads over the picture. Default true.",
                "type": "boolean"
              },
              "style": {
                "description": "Journal style. acs = ACS Document 1996 (default), rsc = RSC, nature = Nature Reviews, slides = heavier lines for slides.",
                "enum": ["acs", "rsc", "nature", "slides"],
                "type": "string"
              },
              "width": {
                "description": "The picture's width in pixels.",
                "type": "integer"
              }
            },
            "required": ["molecules"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Put molecules over a picture"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cb46b8afcee2db89c1c132a65fd61a98088fe8c05cc42705bde84a8dd19b3ab7"
        },
        {
          "name": "convert",
          "title": "Convert a structure file",
          "description": "Convert a structure between formats: cdxml, cdx, mol, molV3, sdf, rxn, rxnV3, smiles, inchi, inchikey, cml, mrv, json (mol = V2000 molfile, molV3 = V3000, json = Lone Pair drawing). Reads ChemDraw CDXML and CDX. `notes` says what the target format cannot keep (for example dative bonds in a V2000 molfile). Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`).",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              },
              "to": {
                "description": "The format to write.",
                "enum": ["cdxml", "cdx", "mol", "molV3", "sdf", "rxn", "rxnV3", "smiles", "inchi", "inchikey", "cml", "mrv", "json"],
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Convert a structure file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a90fc3030446ae9e207d91ef6c7fd60d61f6a8c88daf8ab5fcadb2128c463ca4"
        },
        {
          "name": "draw",
          "title": "Draw a structure",
          "description": "Draw a chemical structure or reaction as a publication-style figure (ChemDraw-like skeletal formula) with the Lone Pair editor's renderer. Give SMILES, reaction SMILES, InChI, a molfile, a ChemDraw file, or a compound name with name=true. Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`). The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format). The SVG and PNG hold the drawing inside them, so they reopen for editing at lonepair.app.",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "color": {
                "description": "black (default); cpk to colour heteroatoms (N blue, O red, S yellow, halogens green); or one colour as #rrggbb for every line and label, such as #ffffff over a dark picture.",
                "type": "string"
              },
              "dpi": {
                "description": "PNG resolution, 300 by default; 600 for print.",
                "type": "number"
              },
              "embed": {
                "description": "For a structure that goes into a larger figure (an SVG or HTML figure you build, or a picture an image model made): format svg or png only. The SVG gets its own id, data-smiles, data-formula and data-inchikey, and px sizes; the result's `embed` gives its box, the drawn bond length and each atom's position (atom n = the n-th atom of the input), and how to place it. Place it whole and scale it uniformly; never redraw or retouch it. Default false.",
                "type": "boolean"
              },
              "embed_id": {
                "description": "With embed: the id for this structure in your figure (letters, digits, - and _). Give one when the same structure appears twice. Default: lp- and the start of its InChIKey.",
                "type": "string"
              },
              "format": {
                "description": "png (default; returned as an image), svg (returned as text), pdf or eps (returned as base64 in `data_base64`).",
                "enum": ["png", "svg", "pdf", "eps"],
                "type": "string"
              },
              "highlight": {
                "description": "Highlight parts of the structure with a coloured band under them, e.g. the atoms that react: [{ \"atoms\": [1, 2, 3], \"color\": \"#ffe066\" }]. Atoms are numbered from 1 in input order; bonds between listed atoms are highlighted too, and `bonds` adds others. SVG and PNG only.",
                "items": {
                  "properties": {
                    "atoms": {
                      "description": "Atom numbers.",
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    },
                    "bonds": {
                      "description": "Bonds as pairs of atom numbers.",
                      "items": {
                        "items": {
                          "type": "integer"
                        },
                        "type": "array"
                      },
                      "type": "array"
                    },
                    "color": {
                      "description": "#rrggbb; default #ffe066 (yellow).",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              },
              "opaque": {
                "description": "White background instead of transparent (SVG, PNG). Default false.",
                "type": "boolean"
              },
              "outline_text": {
                "description": "SVG: draw atom labels and text as outlines instead of text, so the figure looks the same in any program, with or without the fonts. Default false.",
                "type": "boolean"
              },
              "style": {
                "description": "Journal style. acs = ACS Document 1996 (default), rsc = RSC, nature = Nature Reviews, slides = heavier lines for slides.",
                "enum": ["acs", "rsc", "nature", "slides"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Draw a structure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://lonepair/figure.html"
            },
            "ui/resourceUri": "ui://lonepair/figure.html"
          },
          "digest": "sha256:3c7928b8c6a77d6af24a8a14f153a9a6ac7ab368845eccd5caabdd8250aadccd"
        },
