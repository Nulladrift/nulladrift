{
  "lockfileVersion": 2,
  "subjects": {
    "app.lonepair/lonepair": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.lonepair.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lonepair",
        "title": "Lone Pair",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "Lone Pair draws chemical structures and reactions as publication-style figures and converts and analyses structure files. Prefer SMILES as input. A refusal means the structure as given is chemically inconsistent or unreadable: fix the input, do not retry unchanged.",
      "tools": [
        {
          "name": "analyze",
          "title": "Formula, masses and identifiers",
          "description": "For each structure in the input: molecular formula, molecular weight, exact (monoisotopic) mass, elemental analysis, SMILES, InChI and InChIKey. For a reaction: each structure's role and whether atoms and charge balance (each drawn structure counted once). Calculated from the structure, not looked up. NMR, pKa and mass-spectrum estimates are not part of this tool.",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Formula, masses and identifiers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:565949f303c2161c96b3e5818183d3700896b8f4ecb2fdbbade9d3d6e6d82fb0"
        },
        {
          "name": "convert",
          "title": "Convert a structure file",
          "description": "Convert a structure between formats: cdxml, cdx, mol, molV3, sdf, rxn, rxnV3, smiles, inchi, inchikey, cml, mrv, json (mol = V2000 molfile, molV3 = V3000, json = Lone Pair drawing). Reads ChemDraw CDXML and CDX. `notes` says what the target format cannot keep (for example dative bonds in a V2000 molfile). Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`).",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              },
              "to": {
                "description": "The format to write.",
                "enum": ["cdxml", "cdx", "mol", "molV3", "sdf", "rxn", "rxnV3", "smiles", "inchi", "inchikey", "cml", "mrv", "json"],
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Convert a structure file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a90fc3030446ae9e207d91ef6c7fd60d61f6a8c88daf8ab5fcadb2128c463ca4"
        },
        {
          "name": "draw",
          "title": "Draw a structure",
          "description": "Draw a chemical structure or reaction as a publication-style figure (ChemDraw-like skeletal formula) with the Lone Pair editor's renderer. Give SMILES, reaction SMILES, InChI, a molfile, a ChemDraw file, or a compound name with name=true. Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`). The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format). The SVG and PNG hold the drawing inside them, so they reopen for editing at lonepair.app.",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "dpi": {
                "description": "PNG resolution, 300 by default; 600 for print.",
                "type": "number"
              },
              "format": {
                "description": "png (default; returned as an image), svg (returned as text), pdf or eps (returned as base64 in `data_base64`).",
                "enum": ["png", "svg", "pdf", "eps"],
                "type": "string"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Default false.",
                "type": "boolean"
              },
              "opaque": {
                "description": "White background instead of transparent (SVG, PNG). Default false.",
                "type": "boolean"
              },
              "style": {
                "description": "Journal style. acs = ACS Document 1996 (default), rsc = RSC, nature = Nature Reviews, slides = heavier lines for slides.",
                "enum": ["acs", "rsc", "nature", "slides"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Draw a structure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://lonepair/figure.html"
            },
            "ui/resourceUri": "ui://lonepair/figure.html"
          },
          "digest": "sha256:8a96dc9db767804e8f3f3d7b626c7299c45efd60c344134b1ad37b1b253d894b"
        },
        {
          "name": "edit_drawing",
          "title": "Change an earlier figure",
          "description": "Change a figure Lone Pair made earlier and get the new figure: add a structure to the right of it, change the journal style, or put a caption under it. Give the earlier result's `drawing`. Everything else in the drawing stays as it was. Moving or deleting atoms is not supported; draw the structure again instead. The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format).",
          "inputSchema": {
            "properties": {
              "add": {
                "description": "A structure to add to the right of the drawing (SMILES, InChI, molfile).",
                "type": "string"
              },
              "add_is_name": {
                "description": "True when `add` is a compound name to look up at PubChem. Default false.",
                "type": "boolean"
              },
              "caption": {
                "description": "Text to put under the drawing.",
                "type": "string"
              },
              "dpi": {
                "description": "PNG resolution, 300 by default; 600 for print.",
                "type": "number"
              },
              "drawing": {
                "description": "The `drawing` object from an earlier result.",
                "type": "object"
              },
              "format": {
                "description": "png (default; returned as an image), svg (returned as text), pdf or eps (returned as base64 in `data_base64`).",
                "enum": ["png", "svg", "pdf", "eps"],
                "type": "string"
              },
              "opaque": {
                "description": "White background instead of transparent (SVG, PNG). Default false.",
                "type": "boolean"
              },
              "style": {
                "description": "Journal style. acs = ACS Document 1996 (default), rsc = RSC, nature = Nature Reviews, slides = heavier lines for slides.",
                "enum": ["acs", "rsc", "nature", "slides"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Change an earlier figure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://lonepair/figure.html"
            },
            "ui/resourceUri": "ui://lonepair/figure.html"
          },
          "digest": "sha256:c0b060dfd98176e7003fa376dc755710a3edae3a000b2507dd884f5b9b889a75"
        },
        {
          "name": "render_reaction",
          "title": "Draw a reaction scheme",
          "description": "Draw a reaction scheme from its parts: reactants joined by plus signs, an arrow with optional text above and below, then products. Each structure is SMILES, InChI or a molfile. For a reaction already written as reaction SMILES, use draw. Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`). The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format).",
          "inputSchema": {
            "properties": {
              "above": {
                "description": "Text above the arrow: reagents or catalyst. Digits after letters become subscripts (H2SO4).",
                "type": "string"
              },
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "below": {
                "description": "Text below the arrow: solvent, temperature, time.",
                "type": "string"
              },
              "dpi": {
                "description": "PNG resolution, 300 by default; 600 for print.",
                "type": "number"
              },
              "format": {
                "description": "png (default; returned as an image), svg (returned as text), pdf or eps (returned as base64 in `data_base64`).",
                "enum": ["png", "svg", "pdf", "eps"],
                "type": "string"
              },
              "opaque": {
                "description": "White background instead of transparent (SVG, PNG). Default false.",
                "type": "boolean"
              },
              "products": {
                "description": "Structures right of the arrow.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reactants": {
                "description": "Structures left of the arrow.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "style": {
                "description": "Journal style. acs = ACS Document 1996 (default), rsc = RSC, nature = Nature Reviews, slides = heavier lines for slides.",
                "enum": ["acs", "rsc", "nature", "slides"],
                "type": "string"
              }
            },
            "required": ["products", "reactants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draw a reaction scheme"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://lonepair/figure.html"
            },
            "ui/resourceUri": "ui://lonepair/figure.html"
          },
          "digest": "sha256:f82ddaba24769fc43ae1ea4c41c9032aa257878e40f0f8b55c1bc43684a27102"
        }
      ],
