        {
          "name": "edit_drawing",
          "title": "Change an earlier figure",
          "description": "Change a figure Lone Pair made earlier and get the new figure. `ops` changes atoms and bonds: add, change element or charge, delete, bond, move, recolour. Atoms are named by their id in `drawing` (or {map: n} for an atom-map number from SMILES such as [CH3:1]). The operations are applied all or nothing: if one fails or leaves an atom over its valence, nothing changes and the error names the operation. The result's `changes` lists what was added, changed and removed, with the formula before and after. Also: add a structure beside it, change the journal style, or put a caption under it. Give the earlier result's `drawing`. Everything else in the drawing stays as it was. Not for drawing something new (use draw). The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format).",
          "inputSchema": {
            "properties": {
              "add": {
                "description": "A structure to add to the right of the drawing (SMILES, InChI, molfile).",
                "type": "string"
              },
              "add_is_name": {
                "description": "True when `add` is a compound name to look up at PubChem. Default false.",
                "type": "boolean"
              },
              "caption": {
                "description": "Text to put under the drawing.",
                "type": "string"
              },
              "color": {
                "description": "black (default); cpk to colour heteroatoms (N blue, O red, S yellow, halogens green); or one colour as #rrggbb for every line and label, such as #ffffff over a dark picture.",
                "type": "string"
              },
              "dpi": {
                "description": "PNG resolution, 300 by default; 600 for print.",
                "type": "number"
              },
              "drawing": {
                "description": "The `drawing` object from an earlier result.",
                "type": "object"
              },
              "embed": {
                "description": "For a structure that goes into a larger figure (an SVG or HTML figure you build, or a picture an image model made): format svg or png only. The SVG gets its own id, data-smiles, data-formula and data-inchikey, and px sizes; the result's `embed` gives its box, the drawn bond length and each atom's position (atom n = the n-th atom of the input), and how to place it. Place it whole and scale it uniformly; never redraw or retouch it. Default false.",
                "type": "boolean"
              },
              "embed_id": {
                "description": "With embed: the id for this structure in your figure (letters, digits, - and _). Give one when the same structure appears twice. Default: lp- and the start of its InChIKey.",
                "type": "string"
              },
              "format": {
                "description": "png (default; returned as an image), svg (returned as text), pdf or eps (returned as base64 in `data_base64`).",
                "enum": ["png", "svg", "pdf", "eps"],
                "type": "string"
              },
              "highlight": {
                "description": "Highlight parts of the structure with a coloured band under them, e.g. the atoms that react: [{ \"atoms\": [1, 2, 3], \"color\": \"#ffe066\" }]. Atoms are numbered from 1 in input order; bonds between listed atoms are highlighted too, and `bonds` adds others. SVG and PNG only.",
                "items": {
                  "properties": {
                    "atoms": {
                      "description": "Atom numbers.",
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    },
                    "bonds": {
                      "description": "Bonds as pairs of atom numbers.",
                      "items": {
                        "items": {
                          "type": "integer"
                        },
                        "type": "array"
                      },
                      "type": "array"
                    },
                    "color": {
                      "description": "#rrggbb; default #ffe066 (yellow).",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "opaque": {
                "description": "White background instead of transparent (SVG, PNG). Default false.",
                "type": "boolean"
              },
