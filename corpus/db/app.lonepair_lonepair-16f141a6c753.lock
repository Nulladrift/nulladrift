        {
          "name": "convert",
          "title": "Convert a structure file",
          "description": "Convert a structure between formats: cdxml, cdx, mol, molV3, sdf, rxn, rxnV3, smiles, inchi, inchikey, cml, mrv, json (mol = V2000 molfile, molV3 = V3000, json = Lone Pair drawing). Reads ChemDraw CDXML and CDX. `notes` says what the target format cannot keep (for example dative bonds in a V2000 molfile). Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`). Not for images (use draw with format svg or png).",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Short text that is valid SMILES (such as \"CO\") is read as SMILES, with a note, and not sent. Default false.",
                "type": "boolean"
              },
              "to": {
                "description": "The format to write.",
                "enum": ["cdxml", "cdx", "mol", "molV3", "sdf", "rxn", "rxnV3", "smiles", "inchi", "inchikey", "cml", "mrv", "json"],
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Convert a structure file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a591eef074e71e1caa3eda77748995a61e0db9b867c699ab5260fd54377f295e"
        },
        {
          "name": "draw",
          "title": "Draw a structure",
          "description": "Draw a chemical structure or reaction as a publication-style figure (ChemDraw-like skeletal formula) with the Lone Pair editor's renderer. Give SMILES, reaction SMILES, InChI, a molfile, a ChemDraw file, or a compound name with name=true. Refused, with the reason, instead of drawn wrongly: SMILES that cannot be read, aromatic rings that cannot alternate single and double bonds, and atoms with too many bonds (unless `as_written`). The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format). The SVG and PNG hold the drawing inside them, so they reopen for editing at lonepair.app. Not for a scheme built from separate reactant and product lists (use render_reaction), for changing an earlier figure (use edit_drawing), for numbers only (use analyze), or for molecules placed over a picture (use compose_figure).",
          "inputSchema": {
            "properties": {
              "as_written": {
                "description": "Draw atoms that have too many bonds instead of refusing the structure. Default false.",
                "type": "boolean"
              },
              "color": {
                "description": "black (default); cpk to colour heteroatoms (N blue, O red, S yellow, halogens green); or one colour as #rrggbb for every line and label, such as #ffffff over a dark picture.",
                "type": "string"
              },
              "dpi": {
                "description": "PNG resolution, 300 by default; 600 for print.",
                "type": "number"
              },
              "embed": {
                "description": "For a structure that goes into a larger figure (an SVG or HTML figure you build, or a picture an image model made): format svg or png only. The SVG gets its own id, data-smiles, data-formula and data-inchikey, and px sizes; the result's `embed` gives its box, the drawn bond length and each atom's position (atom n = the n-th atom of the input), and how to place it. Place it whole and scale it uniformly; never redraw or retouch it. Default false.",
                "type": "boolean"
              },
              "embed_id": {
                "description": "With embed: the id for this structure in your figure (letters, digits, - and _). Give one when the same structure appears twice. Default: lp- and the start of its InChIKey.",
                "type": "string"
              },
              "format": {
                "description": "png (default; returned as an image), svg (returned as text), pdf or eps (returned as base64 in `data_base64`).",
                "enum": ["png", "svg", "pdf", "eps"],
                "type": "string"
              },
              "highlight": {
                "description": "Highlight parts of the structure with a coloured band under them, e.g. the atoms that react: [{ \"atoms\": [1, 2, 3], \"color\": \"#ffe066\" }]. Atoms are numbered from 1 in input order; bonds between listed atoms are highlighted too, and `bonds` adds others. SVG and PNG only.",
                "items": {
                  "properties": {
                    "atoms": {
                      "description": "Atom numbers.",
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    },
                    "bonds": {
                      "description": "Bonds as pairs of atom numbers.",
                      "items": {
                        "items": {
                          "type": "integer"
                        },
                        "type": "array"
                      },
                      "type": "array"
                    },
                    "color": {
                      "description": "#rrggbb; default #ffe066 (yellow).",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "input": {
                "description": "The structure as text: SMILES, reaction SMILES (reactants>agents>products), InChI, a molfile, RXN, SD file, CDXML, CML or Marvin text, or a Lone Pair drawing (the JSON from an earlier result, or the SVG text of an earlier figure).",
                "type": "string"
              },
              "name": {
                "description": "Set to true when `input` is a compound name (e.g. \"aspirin\") rather than a structure. The name is sent to PubChem to find the structure; this is the only network call the server makes. Short text that is valid SMILES (such as \"CO\") is read as SMILES, with a note, and not sent. Default false.",
                "type": "boolean"
              },
              "opaque": {
                "description": "White background instead of transparent (SVG, PNG). Default false.",
                "type": "boolean"
              },
              "outline_text": {
                "description": "SVG: draw atom labels and text as outlines instead of text, so the figure looks the same in any program, with or without the fonts. Default false.",
                "type": "boolean"
              },
              "style": {
                "description": "Journal style. acs = ACS Document 1996 (default), rsc = RSC, nature = Nature Reviews, slides = heavier lines for slides.",
                "enum": ["acs", "rsc", "nature", "slides"],
                "type": "string"
              }
            },
            "type": "object"
          },
