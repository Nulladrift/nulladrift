        {
          "name": "render_mechanism",
          "title": "Draw a reaction mechanism",
          "description": "Draw one step of a reaction mechanism with curved (arrow-pushing) arrows. Give the structures as SMILES with atom-map numbers on the atoms the arrows touch, e.g. [\"[CH3:1][Br:2]\", \"[OH-:3]\"], and each arrow's `from` and `to` by those numbers: {\"atom\": n}, {\"bond\": [n, m]}, {\"lone_pair\": n}, {\"charge\": n}, or {\"between\": [n, m]} for a bond that forms. An arrow from a lone pair starts at the drawn pair (the atom's lone pairs are shown if the drawing had none); a curly arrow moves two electrons, a fishhook one. The curves bow away from the structures. `notes` warns about chemistry that looks wrong (an arrow from an atom with nothing to give, electrons sent to a carbon with a full octet when no bond breaks), and a map number that is not in the structures is refused. Arrows are ordinary curved arrows the editor can move. Not for a whole multi-step scheme (use render_reaction for each step's reactants and products) or for guessing the mechanism: give the arrows. The result carries `drawing` (Lone Pair JSON to pass to edit_drawing or back in as `input`) and `notes` (anything changed on reading or lost in the format).",
