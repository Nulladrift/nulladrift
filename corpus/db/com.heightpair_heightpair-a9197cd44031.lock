      },
      "transport": {
        "type": "http",
        "url": "https://heightpair.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "heightpair",
        "title": "heightpair",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "HeightPair provides dimension comparisons and sourced height percentiles. Preserve units, dimension definitions and source population in answers. Body visualizations are illustrative. Editable comparison links contain the names and measurements supplied to the tool.",
      "tools": [
        {
          "name": "compare_heights",
          "title": "Compare two heights",
          "description": "Calculate the absolute difference and A-to-B ratio, and create an editable, true-scale HeightPair comparison link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "height_a": {
                "description": "A height such as 170 cm, 1.85 m or 5 ft 11 in. Bare numbers follow the selected input units.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "height_b": {
                "description": "A height such as 170 cm, 1.85 m or 5 ft 11 in. Bare numbers follow the selected input units.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "mode": {
                "default": "side",
                "enum": ["side", "overlay"],
                "type": "string"
              },
              "name_a": {
                "default": "Person A",
                "maxLength": 50,
                "type": "string"
              },
              "name_b": {
                "default": "Person B",
                "maxLength": 50,
                "type": "string"
              },
              "units": {
                "default": "metric",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["height_a", "height_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3fe70db3e0968ca7af59b8de87b465a456ae853725480a6ea1a81200d4eede2f"
        },
        {
          "name": "convert_height",
          "title": "Convert a height",
          "description": "Convert cm, meters, feet and inches using the exact 25.4 mm inch definition.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "height": {
                "description": "A height such as 170 cm, 1.85 m or 5 ft 11 in. Bare numbers follow the selected input units.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "units": {
                "default": "metric",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["height"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8832876aa7acabaf90da3f4334dc904b2bbfdeb61727986c1f1cd60b3b245881"
        },
        {
          "name": "height_percentile",
          "title": "Calculate a sourced height percentile",
          "description": "Use WHO 2007 ages 61–228 months or CDC/NHANES US adult 2021–2023 measured height quantiles. Returns source, population, interpolation method and tail bounds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adult_age_group": {
                "default": "all",
                "enum": ["all", "20-29", "30-39", "40-49", "50-59", "60-69", "70-79", "80+"],
                "type": "string"
              },
              "age_months": {
                "description": "WHO 2007 only. Ages 61–228 months, including fractional months.",
                "maximum": 228,
                "minimum": 61,
                "type": "number"
              },
              "height": {
                "description": "A height such as 170 cm, 1.85 m or 5 ft 11 in. Bare numbers follow the selected input units.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "population": {
                "enum": ["who2007", "us-adults-2021-2023"],
                "type": "string"
              },
              "reference_sex": {
                "enum": ["female", "male"],
                "type": "string"
              },
              "units": {
                "default": "metric",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["height", "population", "reference_sex"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:321b83961765293eb7cc040d1116e67551017e7abc7ed99b4b983a1566560bb5"
        },
        {
          "name": "search_references",
          "title": "Find sourced reference dimensions",
          "description": "Search people, animals, prehistoric animals, objects, furniture, sports, vehicles and landmarks. Returns the recorded measurement axis, endpoints, source and artwork license.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["People", "Animals", "Prehistoric", "Objects", "Furniture", "Sports", "Vehicles", "Landmarks"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "default": "",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ac56c185d174ae8a2b066424706dd3a6fee6baddb3cb096e6215dced7f3d6220"
        }
      ],
