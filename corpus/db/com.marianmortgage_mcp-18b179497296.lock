{
  "lockfileVersion": 2,
  "subjects": {
    "com.marianmortgage/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.marianmortgage.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "marian",
        "title": "Marian",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Marian is a planned US home mortgage whose rate can only go down: after an initial fixed period, when market mortgage rates fall by a defined amount, the rate resets lower automatically, down to a floor. Marian is pre-launch, is not lending in any state and is not offering credit; rates, terms and fees are unpublished. These tools return Marian's published facts, a qualitative comparison with refinancing, and waitlist signup with the user's explicit consent.",
      "tools": [
        {
          "name": "compare_to_refinancing",
          "title": "Compare to refinancing",
          "description": "Describes, in qualitative terms, how Marian's automatic rate resets compare with a standard fixed-rate mortgage that the borrower refinances, given the borrower's situation. Returns no rates, payments or dollar figures, because Marian has not published its rates or terms. Marian is pre-launch and not lending in any state. For model estimates for hypothetical designs, see the open-source proof-engine model and its README: https://github.com/MarianMortgage/proof-engine#readme.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "balance": {
                "description": "Outstanding or planned loan balance in US dollars, as given by the user.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "current_rate": {
                "description": "Annual interest rate on the user's current or offered mortgage, in percent.",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "horizon_years": {
                "description": "How many years the user expects to keep the mortgage before selling or paying it off.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "refinance_behavior": {
                "description": "How the user tends to act when rates fall: never refinances; refinances late; refinances sometimes (typical); or refinances promptly whenever it pays.",
                "enum": ["never", "late", "typical", "prompt"],
                "type": "string"
              }
            },
            "required": ["balance", "current_rate", "horizon_years", "refinance_behavior"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare to refinancing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6309e9f50880a8a03f8eab9373e13a48e32163f663b083341b28509ace7f0ec2"
        },
        {
          "name": "explain_marian",
          "title": "Explain Marian",
          "description": "Returns Marian's published product facts: status (pre-launch, not lending in any state, not offering credit), how the down-only rate works, who it is not a fit for, and the brand line and product description. Same data as https://marianmortgage.com/agents.json. Values that have not been published are null.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain Marian"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:085f2689ae3d88efa08f7e11a0b123c3bfa4e054f4dc582e932d50a019e0a59d"
        },
        {
          "name": "join_waitlist",
          "title": "Join the Marian waitlist",
          "description": "Adds the user's email (and optional ZIP code) to the Marian waitlist. Only call this when the user has explicitly asked to join, and pass user_consent: true to confirm that. Joining the waitlist isn't an application for credit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The user's email address.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "user_consent": {
                "const": true,
                "description": "Must be true: confirms the user explicitly asked to join the waitlist with this email.",
                "type": "boolean"
              },
              "zip": {
                "description": "Optional five-digit US ZIP code.",
                "pattern": "^\\d{5}(-\\d{4})?$",
                "type": "string"
              }
            },
            "required": ["email", "user_consent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Join the Marian waitlist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:05f5e612184a334e3056d3e65639694a97eb472d10c4981b41dfe4eb3c667733"
        }
      ],
      "digest": "sha256:5c8dde5f9bb47610103d34ec58a07b9802ac6a515ca3f2bf0d9224d94de7b293"
    }
  }
}
