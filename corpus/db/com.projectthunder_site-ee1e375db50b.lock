        {
          "name": "plan_commerce_migration",
          "title": "Plan a B2B e-commerce migration",
          "description": "A rollout plan for moving a B2B store from one platform to another around an ERP, from ProjectThunder's published method: the migration paths its pages cover, project phases, a pre-migration checklist, risks with mitigations, which integration pattern fits (real-time, middleware or batch), when each platform is the right target, and the ERP's own caveats when one is named. Every point links to its source page.",
          "inputSchema": {
            "properties": {
              "erp": {
                "default": null,
                "description": "Optional ERP the store must integrate with.",
                "type": ["string", "null"]
