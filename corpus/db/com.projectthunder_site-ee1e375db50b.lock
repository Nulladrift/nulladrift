        "name": "projectthunder",
        "title": "ProjectThunder: ERP and B2B e-commerce research",
        "version": "1.1.0",
        "description": "ERP and B2B e-commerce rollout research from projectthunder.com: ERP-to-platform fit, migration planning, a free website scan, the ERP partner directory, case studies, and the site's guides and articles in English, Spanish, Portuguese and Chinese.",
        "websiteUrl": "https://www.projectthunder.com"
      },
      "capabilities": {
        "logging": {},
        "prompts": {},
        "tools": {}
      },
      "instructions": "Research tools for ERP-integrated B2B e-commerce rollouts, from ProjectThunder.com, Inc., a B2B e-commerce and custom software studio founded in 2004 (Sana Commerce Cloud, BigCommerce, DynamicWeb, its own Wardenclyffe engine, ERP integrations, .NET, agentic AI). assess_erp_commerce_fit: how an ERP and version fits each platform. plan_commerce_migration: phases, checklist and risks for a replatform. scan_website: what a public site runs on and what to fix (one free scan per site every 30 days). list_erp_partners / get_erp_partner: the ERP partner directory. list_case_studies: ProjectThunder's projects. search_site / get_page / list_pages / list_articles: the site's guides and articles (language: en, es, pt, zh). get_contact_info: how to reach the team. Answers come from the site's own pages; cite the URLs you use.",
      "tools": [
        {
          "name": "assess_erp_commerce_fit",
          "title": "Check how an ERP fits a B2B e-commerce platform",
          "description": "For an ERP (and optionally a version and an e-commerce platform), returns how it integrates with Sana Commerce Cloud, BigCommerce, DynamicWeb or Wardenclyffe, version notes such as end-of-support dates, what to settle first, the guides that cover it, and implementation partners in ProjectThunder's ERP partner directory. Every point carries the URL of the page it comes from. Examples: \"Business Central\", \"Dynamics GP 2018\", \"SAP Business One\", \"NAV 2009 R2\".",
          "inputSchema": {
            "properties": {
              "erp": {
                "description": "The ERP, for example \"Business Central\", \"Dynamics NAV\", \"SAP S/4HANA\" or \"Epicor Kinetic\".",
                "type": "string"
              },
              "platform": {
                "default": null,
                "description": "Optional e-commerce platform to focus on: Sana Commerce Cloud, BigCommerce, DynamicWeb or Wardenclyffe.",
                "type": ["string", "null"]
              },
              "version": {
                "default": null,
                "description": "Optional ERP version or edition, for example \"2009 R2\", \"GP 2018\" or \"on-premises\".",
                "type": ["string", "null"]
              }
            },
            "required": ["erp"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
