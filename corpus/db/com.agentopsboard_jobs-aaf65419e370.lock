{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentopsboard/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentopsboard.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "agent-ops-jobs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "A post costs $149 USD. It includes a 30-day listing. Active roles are included in the job feeds we provide for aggregators such as Careerjet, Jooble and Adzuna (submissions pending). It also includes newsletter inclusion and an IndexNow submission. A featured add-on is $99 USD for 30 days. A post plus featured bundle is $199 USD. It saves $49 against buying the listing and the add-on separately. Posts are manually reviewed before publishing. Payment does not publish the role. Use get_posting_info before submit_job_post. Payment does not publish the role.",
      "tools": [
        {
          "name": "get_job",
          "description": "Fetch one active listing by its slug, the id used in /jobs/<slug>/.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13e7e64240b5aae7fe7566cb464a2d0ecf2a5e0e3ee4da2b7f7fcd631304c511"
        },
        {
          "name": "get_posting_info",
          "description": "Price, what a post includes, the manual review, and the exact steps to purchase a listing. No arguments.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0bd5d24451058e5e74cec17d3f5ea376ee14af6351f6a8655daf8f5e4351c7f6"
        },
        {
          "name": "search_jobs",
          "description": "Search active Agent Ops Jobs listings. Featured roles are listed first among the matches. Each result includes a featured boolean. Does not include closed roles.",
          "inputSchema": {
            "properties": {
              "employment_type": {
                "description": "contract also matches contract-to-hire and other contract listings. part-time and fractional match listings whose type contains that word.",
                "enum": ["contract", "part-time", "fractional", "freelance"],
                "type": "string"
              },
              "limit": {
                "description": "Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words matched against title, company, location, summary, and tags.",
                "type": "string"
              },
              "remote": {
                "description": "True keeps remote roles. False keeps hybrid and on-site roles.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d3801a49a19a1a2209bc989a1285114157e359aa88683931ca052c7661ab2e0"
        },
        {
          "name": "submit_job_post",
          "description": "Submit a fractional, part-time, contract, or freelance role. Returns a submission id and the $149 Stripe payment link. featured true also returns featured_addon ($99 USD for 30 days) and does not change that link. Does not publish the role and does not charge a card. Jay reviews it before it goes live.",
          "inputSchema": {
            "properties": {
              "apply_url": {
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "company_url": {
                "type": "string"
              },
              "contact_email": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "employment_type": {
                "enum": ["contract", "part-time", "fractional", "freelance"],
                "type": "string"
              },
              "featured": {
                "type": "boolean"
              },
              "location": {
                "type": "string"
              },
              "pay_max": {
                "type": "number"
              },
              "pay_min": {
                "type": "number"
              },
              "period": {
                "enum": ["hour", "day", "month", "year"],
                "type": "string"
              },
              "remote": {
                "type": "boolean"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["apply_url", "company", "company_url", "contact_email", "description", "employment_type", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b299499a62ed287fe6ead8ac4dd0cb2c2c12e38f13e7ab6377db549f61cdf4a"
        }
      ],
      "digest": "sha256:625786ba0b0b1f0f03217a8a143b7dd7384c4d74ed898f3dfb3ddac71c8b059e"
    }
  }
}
