      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "countersignatory_get_order",
          "title": "Get an order",
          "description": "Read one order by the id countersignatory_place_order returned: its status (awaiting_payment, paid, in_progress, answered, refused, refunded or expired), its price, how to pay while it is unpaid, and once answered the answer, the reason, and who gave it and how they are disclosed. A consensus order returns each responder's answer and the majority.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "description": "The order id, e.g. ord_ followed by 32 hex characters.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:59a488b18ce7df215b5098f2d2506ea20fcdad9eca5d07b07c65a0aaa3a90736"
        },
        {
          "name": "countersignatory_place_order",
          "title": "Place an order",
          "description": "Buy one task from a verified human in a market whose state is live on the spot index: an approval (should this action go ahead), a verification (does this page, document or screenshot show X), or a judgment (which is better, or which label applies). The order is priced at current spot and created unpaid; nothing is charged by this call. The response carries a checkout_url a person can open to pay by card. Once paid it is answered by hand within the SLA, or refunded in full. Read the answer with countersignatory_get_order. Refused at intake: CAPTCHAs and bot checks, logging in or entering credentials, contacting third parties, medical, legal or financial advice, anything sexual or involving minors.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "input": {
                "additionalProperties": {},
                "description": "The task. approval: {action, context (up to 20,000 characters), urls? (up to 5), policy?}. verification: {claim, evidence: {url}, instructions?}. judgment: {item, labels (2 to 10)} or {pair: [a, b], labels?}, with an optional rubric.",
                "type": "object"
              },
              "market": {
                "description": "The id of a market whose state is live on the spot index, e.g. check.general or consensus.3.general. Pass the id verbatim.",
                "maxLength": 64,
                "type": "string"
              },
              "max_price": {
                "description": "The most you will pay, in USD. If the price is above it the order is refused and nothing is charged.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "sla_seconds": {
                "description": "Seconds from payment to answer. 86400 is the base price; a shorter deadline costs more. Not answered in time is refunded in full.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "template": {
                "description": "approval: answers approve or reject. verification: answers true, false or cannot_tell. judgment: answers one label. Every answer comes with a reason.",
                "enum": ["approval", "verification", "judgment"],
                "type": "string"
              },
              "webhook_url": {
                "description": "An https URL that receives the order on every status change.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["input", "market", "max_price", "sla_seconds", "template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Place an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a6906e1059dd88f16d38218696423c3add805092ce574795ddb3ead632d268dd"
        },
        {
          "name": "countersignatory_quote",
          "title": "Price a task",
          "description": "Get the current spot price to have a verified human check, agree on, sign off or notarise something. Use when an agent needs human judgment, accountability or a signature, and needs to know the cost and time before committing. Returns an indicative price, a band, what would clear at a lower bid, and the implied rate per human minute.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "consensus_n": {
                "description": "Odd quorum size for the consensus tier.",
                "maximum": 9,
                "minimum": 3,
                "type": "integer"
              },
              "criteria": {
                "description": "Required for a market priced per criterion, currently countersign.accessibility_statement, and rejected for any other. The criteria to examine, each priced from its published effort class and summed. GET /v1/methodology publishes the class table and every valid id.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "A WCAG 2.2 success criterion, e.g. 1.4.3: the leading token of an evidence pack's criterion string.",
                      "type": "string"
                    },
                    "measured": {
                      "description": "True when the pack row carries a measured value. A measured automated-fail is priced as a confirmation, which is cheaper.",
                      "type": "boolean"
                    },
                    "status": {
                      "description": "The machine's result for this criterion, from the evidence pack row.",
                      "enum": ["automated-fail", "automated-review", "not-flagged", "not-run", "manual-only", "agent-verified"],
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "maxItems": 55,
                "minItems": 1,
                "type": "array"
              },
              "jurisdiction": {
                "description": "Two-letter ISO 3166-1 alpha-2 country code, for example GB or US. UK is accepted as an alias for GB.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "market": {
                "description": "The market id from the spot index, e.g. countersign.accessibility_statement. Pass the id verbatim.",
                "maxLength": 64,
                "type": "string"
              },
              "max_price": {
                "description": "Your maximum bid in USD. The response says whether it clears.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "sla_seconds": {
                "description": "Deadline in seconds. 300 is five minutes.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "task_type": {
                "enum": ["judgment", "verification", "approval", "physical", "signature"],
                "type": "string"
              },
              "tier": {
                "description": "check: one screened human, a score at stake. consensus: N humans, majority resolves. countersign: a named, register-verified professional attaches their name. seal: a regulated act by a licensed partner.",
                "enum": ["check", "consensus", "countersign", "seal"],
                "type": "string"
              },
              "unassisted": {
                "description": "Require unassisted human perception. Carries a premium.",
                "type": "boolean"
              }
            },
            "required": ["sla_seconds", "task_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price a task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f9834b07c0291059940b65acb46aba1deb24798f5eaa8c22a73c991c4164de47"
        },
        {
          "name": "countersignatory_register_interest",
          "title": "Register interest",
          "description": "Record that you would buy. Send the quote_id from a countersignatory_quote response to say the quoted price would clear your use case. For a market on the spot index whose state is opening, which cannot be quoted yet, send its market id instead. This is the demand signal that decides which markets open first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "The market id from the spot index, for a market whose state is opening. Pass the id verbatim. Send this or quote_id, not both.",
                "maxLength": 64,
                "type": "string"
              },
              "note": {
                "description": "What you would use it for, or what would have to change.",
                "maxLength": 500,
                "type": "string"
              },
              "quote_id": {
                "description": "The quote_id from a countersignatory_quote response. Send this or market, not both.",
                "maxLength": 64,
                "type": "string"
              },
              "would_pay": {
                "description": "Whether you would buy at the quoted price.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Register interest"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:457a2c9b560ad89893b963f315c3ced7b9922eed5287b3f2b6051117533a281c"
        },
        {
          "name": "countersignatory_spot_index",
          "title": "Spot Index",
          "description": "The public Countersignatory Spot Index: the going rate for verified human judgment by market, with the urgency and off-hours multipliers, the published wage floor, and the derivation of every seeded number. Use it for the reference rate table across all markets; use countersignatory_quote when you have a specific task and need a price for it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Spot Index"
          },
          "behavior": {
