{
  "lockfileVersion": 2,
  "subjects": {
    "com.abundanceapis/abundance-apis": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://abundanceapis.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Abundance APIs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Abundance APIs — a catalog of small, affordable REST APIs. Call the `list_apis` tool to discover all APIs with their OpenAPI spec URLs and pricing. The other tools are keyless, rate-limited trials of individual APIs so you can test them immediately. For production traffic, subscribe to the relevant API on RapidAPI and call it with an X-RapidAPI-Key; these MCP trial tools are not metered for production use.",
      "tools": [
        {
          "name": "cors_fetch",
          "description": "Fetch any URL through the SSRF-hardened CORS proxy and return its response headers + status. Keyless trial of the CORS Proxy & Web Toolbox API.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The URL to fetch through the proxy.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf9113054a566fa6ed31985941a6333586cb51a0f6522f756c6751c70249c257"
        },
        {
          "name": "currency_convert",
          "description": "Convert an amount between currencies using European Central Bank daily reference rates. Keyless trial of the Currency Exchange Rates API.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount to convert (default 1).",
                "type": "number"
              },
              "from": {
                "description": "ISO currency code to convert from, e.g. USD.",
                "type": "string"
              },
              "to": {
                "description": "ISO currency code to convert to, e.g. EUR.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:579ceac1f9bc9ef3e2aba79d2cc7c0bfd39ac4beb58f0c2370a546f24190ec13"
        },
        {
          "name": "email_validate",
          "description": "Validate an email address — syntax, MX records, disposable/role detection, and typo suggestions. Keyless trial of the Email Validator API.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The email address to validate.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:83b96d62b5c2f86a9859fafa2bd504c490f0ce187119c02f1120e07e9f2125cf"
        },
        {
          "name": "ip_lookup",
          "description": "Geolocate an IPv4/IPv6 address — country, city, coordinates, timezone. Keyless trial of the IP Geolocation API.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ip": {
                "description": "The IP address to look up.",
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97e833088d80604889fe309df6e180aa528804fcd751a61597ad79c97e41391b"
        },
        {
          "name": "list_apis",
          "description": "List the full Abundance APIs catalog — every API with its description, category, OpenAPI spec URL, RapidAPI listing URL, gateway host, and pricing. Call this first to discover what is available and how to get production access.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4db55a811ba147bc72964bdf9847d648f49a8836c815befacb808fb8386a2c9f"
        },
        {
          "name": "naics_match",
          "description": "Semantically match a plain-English company description to 2022 NAICS industry codes. Returns ranked codes with a 0-100 match rating, hierarchy, and the official Census activities that matched. Keyless trial of the NAICS Code Finder API.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Number of matches (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "text": {
                "description": "Company description, capabilities, or services (3-1000 chars).",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f89ad613c068aeaf0b7fc2c7798d55e7ecc2496c9ca26fb629f44bcdd376a55"
        },
        {
          "name": "url_metadata",
          "description": "Fetch a URL's Open Graph / Twitter card metadata (title, description, preview image) server-side. Keyless trial of the Web Toolbox API.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The page URL to inspect.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4945a8673944c5b74147c8749954dbe04cd006a80ee390f0b7a8014eb2e954ae"
        }
      ],
      "digest": "sha256:e90bc43bc189e96b9e49ea718eb4acb06a2f7fc50db96cff921b1e76fe57680a"
    }
  }
}
