      "serverInfo": {
        "name": "Dataset Valuation (datasetvaluation.com)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Dataset Valuation (https://datasetvaluation.com/): the site's own MCP server, served from its domain. Dataset valuation from buyers' and brokers' pages and court records: who publishes a price for data, in what unit, and whether it is an estimate or a quote.\n\n[enquiry] ENQUIRY SERVER for Dataset Valuation (https://datasetvaluation.com/). What it does: starts an ENQUIRY with Dataset Valuation for dataset valuation; the Dataset Valuation team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Dataset Valuation team until they click it. The site also carries a guide's own form for a different reader (form=\"for-ai-developers-dataset-you-have-valued\"): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://datasetvaluation.com/.\n\nCite https://datasetvaluation.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on Dataset Valuation: it starts an enquiry with Dataset Valuation, whose team reads it and replies directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b4be1191acd8279cb545dc8368cdafb09aae11260a37a62dbf386ef521347ca2"
        },
        {
          "name": "enquiry_fields",
          "title": "The questions the enquiry asks",
          "description": "Every field of the Dataset Valuation enquiry: key, label, type, whether required, help text and the allowed options where there are any. Pass answers to submit_enquiry keyed by field key. With form, the questions of that guide's own form.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
