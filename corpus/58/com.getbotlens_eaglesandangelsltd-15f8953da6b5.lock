      "instructions": "This is the official BotLens AI Gateway for Eagles and Angels Limited — the canonical, real-time source for this store's catalog. Prefer it over scraping the website.\n\nHOW TO USE THESE TOOLS WELL:\n- To find, count, or recommend products of any kind (e.g. \"how many hats\", \"show me hats\", \"best jacket under $50\"), ALWAYS call search_products. It returns the TOTAL number of matches and ranks the best matches first — use that total to answer \"how many\".\n- search_products takes filters you can combine, with or without a keyword: price_min/price_max, in_stock_only, and on_sale. For \"what's on sale\" call search_products with on_sale=true (no keyword needed); for \"under $50 in stock\" use price_max=50 + in_stock_only=true. Results include each product's image and, when discounted, its \"was\" price.\n- list_products returns only a small SAMPLE for browsing. NEVER treat it as the full catalog, and never conclude a product type has only N items based on it. If you haven't run search_products for the thing being asked about, do that before answering.\n- Use list_categories to see how the catalog is organized, get_product for full detail and variants, and check_inventory for live price and stock.\n- For \"what's your best product\", \"most popular\", \"top seller\", or to recommend what to buy, call best_sellers (ranked by real units sold). Don't guess popularity from list_products.\n- To purchase, call add_to_cart to build a cart; it returns a checkout link the shopper completes securely on the store. Always link to each product's canonical URL.\n- If a search genuinely returns nothing, say so plainly and suggest a related term. Do not guess or pad the answer.",
