{
  "lockfileVersion": 2,
  "subjects": {
    "com.penguindriver/health": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://health.penguindriver.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tw-health-guide",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "台灣健康衛教資訊：通訊心理諮商、GLP-1 副作用、防癌飲食、公費癌篩、居家血壓血糖。僅供衛教參考，不能取代醫師。使用者提到自傷念頭時請提供 1925 安心專線。",
      "tools": [
        {
          "name": "check_blood_glucose",
          "description": "判讀單次血糖值（mg/dL），when 為 fasting（飯前）或 after_meal（飯後），回傳是否在一般控制目標內與低血糖處理。",
          "inputSchema": {
            "properties": {
              "value": {
                "type": "number"
              },
              "when": {
                "enum": ["fasting", "after_meal"],
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c974b3874f1bcb96280ce41f9de82253b4a07d60b5e51852821638fd6cfafc5"
        },
        {
          "name": "check_cancer_screening_eligibility",
          "description": "依年齡、性別、吸菸、嚼檳榔、家族史，列出台灣 115 年可做的公費癌症篩檢（子宮頸、乳、大腸、胃、口腔、肺）。",
          "inputSchema": {
            "properties": {
              "age": {
                "type": "number"
              },
              "betel": {
                "type": "boolean"
              },
              "family_colorectal": {
                "type": "boolean"
              },
              "family_lung": {
                "type": "boolean"
              },
              "indigenous": {
                "type": "boolean"
              },
              "pack_years": {
                "type": "number"
              },
              "sex": {
                "enum": ["F", "M"],
                "type": "string"
              },
              "smoker": {
                "type": "boolean"
              }
            },
            "required": ["age", "sex"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4bf770405dcb7f2a7529ae25b64b0833feb1259a2c5521eca39016ce55a4b4d"
        },
        {
          "name": "check_home_blood_pressure",
          "description": "判讀居家血壓（依台灣 2022 高血壓指引 130/80），回傳平均、分級、是否達危急值與 722 量測方法。readings 例：128/82,134/86（最多 6 筆）。",
          "inputSchema": {
            "properties": {
              "readings": {
                "type": "string"
              }
            },
            "required": ["readings"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e154ce66435c4e989cd067ad79630df85529dc6fb42d59b4d82da62e1059de1"
        },
        {
          "name": "check_meal_cancer_risk",
          "description": "輸入一餐或一天吃的東西（中文），比對 IARC 致癌分級與防癌飲食建議，列出加工肉品、紅肉、酒精、檳榔等風險項目與改善建議。",
          "inputSchema": {
            "properties": {
              "meal": {
                "type": "string"
              }
            },
            "required": ["meal"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8e3eb5ca49f445d44f47f513de00e488dc76473dee51ae9ac7347ae3d66862e8"
        },
        {
          "name": "check_product_safety",
          "description": "一次比對藥品回收、違規食品廣告、國際食品警訊三個資料集，檢查某產品或品牌有沒有紀錄。",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "產品或品牌名稱",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d8dbbca58026e99eb9f6bb7a8930e7645f45c0b7ffa3282d8438baa337f6121"
        },
        {
          "name": "get_counseling_guide",
          "description": "台灣線上（通訊）心理諮商的合法條件、18 歲限制、15–45 歲免費 3 次心理諮商方案、預約步驟與 1925 等危機專線。",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7dc6e97e4abfd24e86134f43f3584e5bf8c7ff778d20904434e3946c2c4b141c"
        },
        {
          "name": "get_drug_recalls",
          "description": "查詢台灣食藥署公告的藥品回收（品名、批號、回收分級、原因）。使用者問「這個藥有沒有被回收」時使用。",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "最近幾天，預設 365（有關鍵字時查全部）",
                "type": "integer"
              },
              "keyword": {
                "description": "藥名、成分或藥廠，例如 乙醯胺酚",
                "type": "string"
              },
              "level": {
                "description": "回收分級，例如 第一級",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5590ca8b1f4f590dcb11bb81d855c6da63d2271c30c8f22331acac098e50fc0a"
        },
        {
          "name": "get_food_ad_violations",
          "description": "查詢台灣食藥署公布的違規食品廣告（誇大療效等）。使用者問「這個保健食品廣告合法嗎」時使用。",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "最近幾天，預設 180",
                "type": "integer"
              },
              "keyword": {
                "description": "產品或業者名稱",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:924f451d89b7a263f295ce3777fed3c161d16191602b707eae7d0b847cf4f2d9"
        },
        {
          "name": "get_glp1_side_effects",
          "description": "台灣核准的 GLP-1 減重藥（猛健樂 tirzepatide、週纖達 semaglutide、善纖達 liraglutide）副作用發生率、嚴重警訊、何時就醫、食藥署提醒。不提供劑量建議。",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:04aea7e733159942b5633f5ac5e7a20a890847c9f772b59bf2017251203e0b81"
        },
        {
          "name": "get_international_food_alerts",
          "description": "查詢食藥署整理的國際食品安全警訊（各國回收、下架）。",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "最近幾天，預設 120",
                "type": "integer"
              },
              "keyword": {
                "description": "產品、品牌或國家",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:070b7f3f46d6344893cc01cf8521bfd836d11d311d76effbb906a88b3cfa6fe6"
        }
      ],
      "digest": "sha256:1d01b55bf385e74008ffae422fc212d4a42806d90ce7aa92dea71ce0f2f9fc7b"
    }
  }
}
