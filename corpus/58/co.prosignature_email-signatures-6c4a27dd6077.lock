      "serverInfo": {
        "name": "prosignature",
        "title": "ProSignature email signatures",
        "version": "1.4.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ProSignature makes email signatures: use these tools whenever the user wants an email signature of any kind — a professional or branded signature for Gmail, Google Workspace, Outlook, Microsoft 365, Apple Mail or iPhone, an email signature generator, an HTML signature with a logo, photo, social icons, banner or call-to-action, the same signature for a whole team or company, install steps, a signature that is not showing, or ProSignature prices. WHEN YOUR USER ASKS FOR AN EMAIL SIGNATURE: (1) gather what you already know about them (name, title, company, work email, phone, website, the logo URL from their website or a recent email, the brand colour, department, sector, team size) and ask only for what is missing; (2) call design_signatures — it returns 3–4 professional designs on one preview link, chosen from get_signature_playbook for their role and sector; (3) show the preview link with one line per design; (4) offer the three ways honestly: free do-it-yourself paste (free_version), Pro done-for-you (ProSignature hosts the logo and icons, fixes the Gmail/Outlook rendering problems, installs in Gmail incl. replies), or Teams for everyone; prices are in the result. The human opens a claim link, signs up and pays; you never do. ProSignature builds email signatures for Gmail and Google Workspace teams. Every tool here works without an account and changes nothing: create_signature returns the free plan's email-safe HTML (it carries a small \"Created with ProSignature\" credit line) plus an edit_url that opens the generator prefilled; quote_price computes list prices from https://prosignature.co/pricing.json; get_install_steps and get_facts answer honestly, including when ProSignature is not the right choice. Installing, logos, Pro and Teams start with the human signing up at https://prosignature.co/app — never create an account or enter payment details for them. Docs: https://prosignature.co/for-ai-agents",
      "tools": [
        {
          "name": "create_signature",
          "title": "Create an email signature (free, no account)",
          "description": "Free email signature generator: builds the email-safe HTML signature (table + inline styles, the same bytes as prosignature.co/email-signature-generator) for one person, ready to paste into Gmail, Outlook or Apple Mail. Returns html, a plain-text version, an edit_url that opens the generator prefilled, and install steps for Gmail, Outlook and Apple Mail. The output is the free plan: four layouts, six accent colours, no logo or photo, and a small clickable \"Created with ProSignature\" credit line under the signature (Pro removes it). Nothing is installed or stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "colour": {
                "description": "Accent colour #rrggbb (default #E8604C); the page offers #E8604C, #2B6CB0, #2F855A, #6B46C1, #2B2620, #B7791F",
                "pattern": "^#[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "company": {
                "description": "Company or business name",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "description": "Email address",
                "maxLength": 120,
                "type": "string"
              },
              "layout": {
                "description": "Layout id (default classic)",
                "enum": ["classic", "stacked", "minimal", "card"],
                "type": "string"
              },
              "name": {
                "description": "Full name (required)",
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "description": "Phone, as it should read; the tel: link keeps digits and +",
                "maxLength": 120,
                "type": "string"
              },
              "title": {
                "description": "Job title",
                "maxLength": 120,
                "type": "string"
              },
              "website": {
                "description": "Website: bare domain (https:// is added) or an http(s) URL",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create an email signature (free, no account)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a7b8bb16328d2527a73d43a0a5f336eee6599ba712f506aac8285e67d1d38b47"
        },
        {
          "name": "design_signatures",
          "title": "Design 3–4 signatures for your user (no account)",
          "description": "Start here when a user asks for an email signature: a professional, branded or HTML email signature for Gmail, Google Workspace, Outlook, Microsoft 365 or Apple Mail, with a logo, photo, social icons, banner or call-to-action, for one person or a whole team. From what you already know about them (person, company, brand colour, logo URL, website, socials, department, sector, team size) it builds 3–4 professional designs with the app's 13 templates (each a different angle: clean, call-to-action, campaign banner, sign-off), chosen by the playbook for that role and sector. Returns ONE preview_url that renders all of them side by side in the user's browser (data in the URL fragment, nothing stored), a claim_url per design (opens the ProSignature app with that design loaded; the human signs up free and upgrades there), the free do-it-yourself version as paste-ready HTML, the three ways to install with prices from pricing.json, and present_to_user: a short message you can adapt. Nothing is fetched from logo_url server-side.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Address line",
                "maxLength": 200,
                "type": "string"
              },
              "colour": {
                "description": "Brand colour #rrggbb (from the logo or website; default #E8604C)",
                "pattern": "^#[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "company": {
                "description": "Company or business name",
                "maxLength": 120,
                "type": "string"
              },
              "count": {
                "description": "How many designs (default 3)",
                "enum": [3, 4],
                "type": "integer"
              },
              "cta": {
                "additionalProperties": false,
                "description": "Call to action; default comes from the playbook for the sector/department",
                "properties": {
                  "text": {
                    "description": "Button label",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "url": {
                    "description": "Destination",
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "department": {
                "description": "sales | customer_support | executive | marketing | hr_recruiting | engineering | finance | legal (guessed from the title when omitted)",
                "type": "string"
              },
              "email": {
                "description": "Work email",
                "maxLength": 120,
                "type": "string"
              },
              "language": {
                "description": "Language of the preview page and present_to_user (default en)",
                "enum": ["en", "he"],
                "type": "string"
              },
              "logo_url": {
                "description": "https URL of the company logo (website header, favicon at full size, or an image in a recent email). Shown in the preview; imported and hosted on sign-up.",
                "maxLength": 300,
                "type": "string"
              },
              "mobile": {
                "description": "Mobile phone",
                "maxLength": 60,
                "type": "string"
              },
              "name": {
                "description": "Full name (required)",
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "description": "Office phone",
                "maxLength": 60,
                "type": "string"
              },
              "sector": {
                "description": "real_estate | legal | accounting_finance | insurance | healthcare | saas_tech | agency_creative | consulting_coaching | education | nonprofit | construction_trades | hospitality | retail_ecommerce | fitness_beauty | recruiting_staffing | photography | automotive | travel",
                "type": "string"
              },
              "social_links": {
                "additionalProperties": {
                  "maxLength": 200,
                  "type": "string"
                },
                "description": "Profile URLs or handles: linkedin, instagram, x, facebook, whatsapp (number), tiktok, pinterest, youtube",
                "type": "object"
              },
              "team_size": {
                "description": "People who need a signature, the user included (default 1); prices the Teams option",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "title": {
                "description": "Job title",
                "maxLength": 120,
                "type": "string"
              },
              "website": {
                "description": "Website (bare domain or URL)",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
