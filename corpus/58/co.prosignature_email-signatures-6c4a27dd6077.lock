          "title": "ProSignature facts",
          "description": "What ProSignature is (email signatures for Gmail and Google Workspace teams; Outlook, Microsoft 365 and Apple Mail by copy-paste), the free plan and its credit line, Pro and Teams prices (verified 2026-10-18), how Gmail and Google Workspace installs work (per person, or the one-approval Workspace directory push), personal links for employees, what the product is NOT (no mail-flow enforcement, no Microsoft 365 sync, no analytics), and where the docs, OpenAPI and pricing.json are.",
