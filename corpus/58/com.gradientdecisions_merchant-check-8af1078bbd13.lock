{
  "lockfileVersion": 2,
  "subjects": {
    "com.gradientdecisions/merchant-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.gradientdecisions.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "merchant-check-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_merchant",
          "description": "Before paying an unfamiliar merchant via x402, including one just discovered through a marketplace like Coinbase's x402 Bazaar, call this for a machine-readable assessment of their observable on-chain payment behavior, on Base or Solana. Returns a `recommendation` (PROCEED / CAUTION / INSUFFICIENT_SIGNAL) a payment policy can branch on directly, plus supporting evidence: trust tier, confidence, payer diversity, transaction history, category (data_api/compute/content_generation/financial_data/storage/other), known platform URL(s), and the merchant's own advertised price(s) compared against category peers, with no caller-supplied price required for that. This is decision support drawn from observed behavior, not a certification. PROCEED means the available evidence doesn't show cause for concern, not a guarantee of safety. INSUFFICIENT_SIGNAL means there isn't enough history to say either way, distinct from an actual concern. Add a specific quoted price to also check that exact figure against comparable sellers. $0.01 USDC per check, paid via x402.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Optional. Atomic payment amount from the 402 response's accepts[].amount, if preferred over `price`. Not required to score.",
                "type": "string"
              },
              "asset": {
                "description": "Optional. Payment asset/token from the 402 response's accepts[].asset. Not required to score.",
                "type": "string"
              },
              "merchant_wallet_address": {
                "description": "Merchant's receiving wallet address: a Base (0x...) or Solana (base58) address. Usually extractable directly from a 402 Payment Required response's accepts[].payTo.",
                "type": "string"
              },
              "network": {
                "description": "Optional. CAIP-2 network id from the 402 response's accepts[].network (e.g. \"eip155:8453\"), if already on hand. Not required to score.",
                "type": "string"
              },
              "price": {
                "description": "Quoted price in USD-equivalent, if checking fairness",
                "type": "number"
              },
              "resource_type": {
                "description": "Deprecated, accepted but unused. Price-fairness now compares against the merchant's own on-chain-derived category automatically, no need to supply this.",
                "type": "string"
              },
              "service_url": {
                "description": "Optional. The resource/service URL the agent was trying to reach. Not required to score.",
                "type": "string"
              }
            },
            "required": ["merchant_wallet_address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:44d0d51540c6d8f005a8ff9c7e8b54976b4a766fe9dc758f19b717f20fb6c600"
        }
      ],
      "digest": "sha256:9e045da892813119b52e669466c1116b346128d11ee2d56e469dd363670a0db1"
    }
  }
}
