{
  "lockfileVersion": 2,
  "subjects": {
    "com.codemate/website": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://codemate.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "codemate",
        "title": "Codemate",
        "version": "1.1.0",
        "description": "Read-only tools for codemate.com: search, articles, case studies, company and contact facts, jobs.",
        "websiteUrl": "https://codemate.com",
        "icons": [
          {
            "src": "https://codemate.com/icons/favicon.png",
            "mimeType": "image/png",
            "sizes": ["320x320"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_company_info",
          "description": "Get authoritative facts about Codemate as a company: what it does, its legal entities, and whatever else it publishes about itself. Use this when asked to describe or introduce Codemate, rather than assembling an answer from service pages and articles. Only states facts Codemate has verified — if something is not returned, it is not published, so do not infer it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Which language edition of the site to answer from. Defaults to English.",
                "enum": ["en", "fi"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8b209cb74181d408d620622631006d2f47293dc1301e6d11d0256528410cd705"
        },
        {
          "name": "get_contact_info",
          "description": "Get how to reach Codemate: office addresses with map links, named people with their role, email, phone, LinkedIn and photo, plus the general sales email and phone numbers. Filter by role or office. Use this when asked how to contact Codemate, who to speak to about something, or where its offices are.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Which language edition of the site to answer from. Defaults to English.",
                "enum": ["en", "fi"],
                "type": "string"
              },
              "office": {
                "description": "Office filter, e.g. \"Helsinki\", \"Oulu\".",
                "type": "string"
              },
              "role": {
                "description": "Role filter, e.g. \"sales\", \"CEO\", \"recruit\". Matches part of the job title.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:87503abc48b324f9e9180db88d4b057fccc9e5f7be106c5a04b0fb013f12ee86"
        },
        {
          "name": "get_page_data",
          "description": "Read the full text of a codemate.com article or client case study, given the URL that search_site, list_articles or list_references returned. Returns the title, date, metadata and the page's prose. Use this after a search to actually read a result — search only returns a summary. For Codemate's main service and product pages, use get_topic instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "The codemate.com URL (or path) of an article or case study, from a search or list result.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d2be748e1cc822ce615ab74f85632f0dceaa4cdf2f923eca4ca1395e8c06c41b"
        },
        {
          "name": "get_topic",
          "description": "Read the full text of one of Codemate's main pages. Valid ids: what-we-do, design, code, care, how-we-deliver, ai-transformation, solutions, paimen-ai, about, google-partnership. Returns the page summary, its sections and any FAQ. Use this to answer questions about Codemate's services, delivery model, AI transformation offering or the Paimen agentic UX platform.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Which page to read.",
                "enum": ["what-we-do", "design", "code", "care", "how-we-deliver", "ai-transformation", "solutions", "paimen-ai", "about", "google-partnership"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Which language edition of the site to answer from. Defaults to English.",
                "enum": ["en", "fi"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cae7792aa697946f6c2f3628c6b9aa589ac6e9bedfa097400256204b2915679d"
        },
        {
          "name": "list_articles",
          "description": "List Codemate's published articles, newest first, with date, category, summary and URL. Filter by category or by date. Use this when asked what Codemate has written or published about something, or for recent news — search_site only returns the closest few matches.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Category filter, matching the site's own article filter tabs.",
                "enum": ["codemate-life", "mates-behind-the-code", "news", "other", "recordings", "guide"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Which language edition of the site to answer from. Defaults to English.",
                "enum": ["en", "fi"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum articles, 1-50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Only articles published on or after this date. A year (\"2026\") or an ISO date.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c0873736b9fa0680c35c16240543081eaeca3e67d786f33d2b50955473b7baa0"
        },
        {
          "name": "list_open_positions",
          "description": "List the jobs Codemate is currently hiring for, with location, the job page URL and the application link. Use this when asked whether Codemate is hiring, or about careers and open roles.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Which language edition of the site to answer from. Defaults to English.",
                "enum": ["en", "fi"],
                "type": "string"
              },
              "location": {
                "description": "Optional city or country filter, e.g. \"Helsinki\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bf10b2a2167612f5dab1912dfe5b30cdd95046255b196749ae19dc9519e5689b"
        },
        {
          "name": "list_references",
          "description": "List Codemate's client case studies (called references on the site), with the client name, industries, services, a summary and the URL. Filter by industry, service or client. Use this when asked what Codemate has delivered, for whom, or for proof of experience in a sector — search_site only returns the closest few matches and mixes in articles.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "client": {
                "description": "Client name filter, e.g. \"Restel\".",
                "type": "string"
              },
              "industry": {
                "description": "Industry filter, e.g. \"Finance and insurance\" or just \"finance\".",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Which language edition of the site to answer from. Defaults to English.",
                "enum": ["en", "fi"],
                "type": "string"
              },
              "service": {
                "description": "Service filter, e.g. \"AI and data\", \"Software development\", \"Testing\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7994c3ec8553331cda6f74d5650f10f906821619c06b7f3fc8c242c4fb2d8db5"
        },
        {
          "name": "search_site",
          "description": "Search Codemate's website: service pages, client case studies and articles. Returns the best-matching titles with their URLs and a one-line summary. Use this to find out what Codemate does, which industries and technologies it has delivered in, or whether it has written about a topic.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "Restrict to one kind: \"reference\" for client case studies, \"article\" for published articles, \"page\" for service and product pages. Omit to search all three.",
                "enum": ["page", "reference", "article"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Which language edition of the site to answer from. Defaults to English.",
                "enum": ["en", "fi"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Maximum results, 1-10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bab4ba435b06cac9d297f24b7ebc42ef708f0af726d4c856bd184a8b89a3eae2"
        }
      ],
      "digest": "sha256:f2300fb180ee56f9735f10b73bd5afb75f3173862f7be043b528900d743b3458"
    }
  }
}
