                          "enum": ["topic", "reference", "article", "position", "person"],
                          "type": "string"
                        },
                        "maxItems": 5,
                        "type": "array"
                      },
                      "limit": {
                        "maximum": 18,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "services": {
                        "additionalProperties": false,
                        "properties": {
                          "exclude": {
                            "items": {
                              "pattern": "^[a-z0-9-]{1,40}$",
