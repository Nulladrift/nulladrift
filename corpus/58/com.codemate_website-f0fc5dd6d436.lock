      "instructions": "Codemate's case studies, articles, pages, open jobs and people can also be shown as an interactive view (search_view) where the user filters by industry, service and type. If your client can display MCP Apps views, offer it when the user is exploring Codemate's work, for example after listing references. Answer in plain text when the user just wants a fact.",
      "tools": [
        {
          "name": "get_company_info",
          "title": "Get Codemate company facts",
          "description": "Get authoritative facts about Codemate as a company: what it does, its legal entities, and whatever else it publishes about itself. Use this when asked to describe or introduce Codemate, rather than assembling an answer from service pages and articles. Only states facts Codemate has verified — if something is not returned, it is not published, so do not infer it.",
