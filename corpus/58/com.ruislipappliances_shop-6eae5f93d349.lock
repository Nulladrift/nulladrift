{
  "lockfileVersion": 2,
  "subjects": {
    "com.ruislipappliances/shop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.ruislipappliances.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ruislip-appliances-shop",
        "title": "Ruislip Appliances",
        "version": "1.0.1",
        "websiteUrl": "https://www.ruislipappliances.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ruislip Appliances is an independent kitchen and laundry appliance shop in Ruislip, West London (since 1958). Use search_products and get_product to find appliances with live prices (GBP inc VAT) and stock, check_delivery for delivery options and dates to a postcode, and basket_link to hand the customer a filled basket to pay for on our website. send_enquiry reaches our sales team (reservations, delivery slots, questions); use it only with the customer's agreement. Always give the customer the product URL. Phone 01895 633837.",
      "tools": [
        {
          "name": "basket_link",
          "title": "Make a basket link",
          "description": "Make a link to our website's basket with these appliances already in it: new items by model number, and/or specific graded units by graded_id (at their graded price). The customer opens it, enters their address, chooses a delivery date and pays on our site. Nothing is ordered or paid until the customer does that. For graded units you must first show the customer the grade and condition notes and offer the photos (get_graded_photos), then set condition_shown_to_customer.",
          "inputSchema": {
            "properties": {
              "condition_shown_to_customer": {
                "description": "Required true when graded_ids is used: the customer has seen each graded unit's grade and condition notes and been offered the photos",
                "type": "boolean"
              },
              "graded_ids": {
                "description": "graded_id of specific GRADED units (from get_product graded_options)",
                "items": {
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "models": {
                "description": "Model numbers of NEW items to put in the basket",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make a basket link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1734daba9935ccad880367acc260d6cc2c71d2f720b44fb8bbf31730b0843286"
        },
        {
          "name": "check_delivery",
          "title": "Check delivery",
          "description": "Can we deliver to a UK postcode, how, and on which dates. Pass the model to get dates that allow for the item's stock. Returns own_team (London and the South East), palletline_kerbside (rest of mainland Great Britain, with charge) or not_available, with available dates.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model number (optional)",
                "type": "string"
              },
              "postcode": {
                "description": "UK postcode, e.g. HA4 8NW",
                "type": "string"
              }
            },
            "required": ["postcode"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check delivery"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca10295e8a5fd2522fa416f7fadab13e953f61fd976e88b08c4454f23edcc233"
        },
        {
          "name": "create_basket",
          "title": "Create a ready-to-pay basket",
          "description": "Create a shared basket with the items AND the customer's contact and delivery details (and delivery date), and get a link. The customer opens it on any device, lands on our checkout with everything filled in, reviews it and pays. Use check_delivery first for valid dates. For graded units the same rule as basket_link applies: show grade, condition notes and photos first, then set condition_shown_to_customer. Only use the customer's real details, with their agreement.",
          "inputSchema": {
            "properties": {
              "comment": {
                "description": "Delivery instructions, e.g. access or parking",
                "type": "string"
              },
              "condition_shown_to_customer": {
                "description": "Required true when graded_ids is used",
                "type": "boolean"
              },
              "customer": {
                "properties": {
                  "company": {
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "delivery": {
                "properties": {
                  "address_line1": {
                    "type": "string"
                  },
                  "address_line2": {
                    "type": "string"
                  },
                  "address_line3": {
                    "type": "string"
                  },
                  "county": {
                    "type": "string"
                  },
                  "date": {
                    "description": "YYYY-MM-DD, one of the dates check_delivery offers",
                    "type": "string"
                  },
                  "postcode": {
                    "type": "string"
                  },
                  "time": {
                    "enum": ["am", "pm"],
                    "type": "string"
                  },
                  "town": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "graded_ids": {
                "description": "graded_id of specific GRADED units",
                "items": {
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "models": {
                "description": "Model numbers of NEW items",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a ready-to-pay basket"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:01e73bf044b61c63de0a953e62f796dba8aec0b712bb274d1bec0a083cfb2542"
        },
        {
          "name": "get_graded_photos",
          "title": "Graded unit photos",
          "description": "Photos of one graded unit's cosmetic condition (marks, dents, scratches), returned as images you can look at and show the customer, with the grade and condition notes. Use before putting a graded unit in a basket.",
          "inputSchema": {
            "properties": {
              "graded_id": {
                "description": "graded_id from get_product graded_options",
                "type": "integer"
              },
              "max_photos": {
                "default": 6,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["graded_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Graded unit photos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8767252584cf8ca596e0870f03019d631ec27eb0c8449ba2dcdc971347e8bd3b"
        },
        {
          "name": "get_product",
          "title": "Product details",
          "description": "Full details of one appliance by model number: price, was-price, availability and stock, expected date if on order, description, highlights, specification (dimensions, energy rating...), images, product page, a basket link if it can be bought online, and graded_options: individual discounted graded units with grade, condition notes, price, saving and their own basket link.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model number, e.g. WGB256090GB",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:186c892c7b83659b04d2a513e77f9265a9dbaeeeb544b643661a12064f66284d"
        },
        {
          "name": "list_brands",
          "title": "List brands",
          "description": "The brands we sell, with the number of products of each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List brands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a7906e2d7a0250666bdc36d4766599fa1febbe5240d2111d71e91e36f6e1b825"
        },
        {
          "name": "list_departments",
          "title": "List departments",
          "description": "The departments (appliance types) we sell, with the number of products in each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List departments"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2e13c82e4265096e09dc4b087c73b99451a05ac12ac5d2ed9dd0b0ee12fa7644"
        },
        {
          "name": "search_products",
          "title": "Search appliances",
          "description": "Search the appliances Ruislip Appliances (West London) sells: washing machines, dishwashers, fridge freezers, ovens, hobs, cookers, hoods and more from Bosch, Neff, Siemens, Miele, Smeg, Liebherr, AEG, Samsung and others. Returns model, name, price in GBP inc VAT, availability (in_stock, special_order or graded_only), graded units and graded_from_gbp where discounted graded stock exists, and the product page URL.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Exact brand from list_brands, e.g. 'Bosch'",
                "type": "string"
              },
              "condition": {
                "default": "any",
                "description": "new, graded (discounted, cosmetic marks only, full warranty) or any",
                "enum": ["any", "new", "graded"],
                "type": "string"
              },
              "department": {
                "description": "Exact department name from list_departments, e.g. 'Dishwashers'",
                "type": "string"
              },
              "in_stock_only": {
                "description": "Only items in stock in our Ruislip warehouse (fastest delivery)",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in GBP inc VAT",
                "type": "number"
              },
              "min_price": {
                "description": "Minimum price in GBP inc VAT",
                "type": "number"
              },
              "query": {
                "description": "Words or a model number, e.g. 'integrated dishwasher', 'Bosch washing machine 9kg', 'WGB256090GB'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search appliances"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d99cd104fde1b56721ff52eae40582a6427d57d3d0d5e5d4fea7cf20d2e876e6"
        },
        {
          "name": "send_enquiry",
          "title": "Send an enquiry",
          "description": "Send an enquiry to the Ruislip Appliances sales team on the customer's behalf: reserve an appliance, ask for a delivery slot, a price or stock question, installation or a special order. Only use with the customer's agreement and their real contact details. Needs a name and a phone number or email. The team replies during opening hours.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Customer's email address",
                "type": "string"
              },
              "message": {
                "description": "The question or request",
                "type": "string"
              },
              "model": {
                "description": "Model number the enquiry is about",
                "type": "string"
              },
              "name": {
                "description": "Customer's name",
                "type": "string"
              },
              "phone": {
                "description": "Customer's UK phone number",
                "type": "string"
              },
              "postcode": {
                "description": "Delivery postcode",
                "type": "string"
              },
              "preferred_date": {
                "description": "Preferred delivery date, YYYY-MM-DD",
                "type": "string"
              },
              "type": {
                "enum": ["Delivery slot", "Reserve an appliance", "Price or stock question", "Installation", "Special order", "Other"],
                "type": "string"
              }
            },
            "required": ["message", "name", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send an enquiry"
          },
          "behavior": {
            "destructive": false,
