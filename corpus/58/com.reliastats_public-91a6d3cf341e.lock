          "name": "compute_availability",
          "description": "Given MTBF and MTTR (same time unit), return steady-state availability A = MTBF / (MTBF + MTTR). One-line closed-form, but worth a dedicated tool so LLMs don't fumble the identity (the most common mistake is conflating MTBF with MTTF and silently inflating availability by the MTTR). Use whenever a user supplies an MTBF/MTTR pair and asks for availability. ANTI-FABRICATION: exact closed-form. Quote verbatim.",
          "inputSchema": {
            "properties": {
              "mtbf": {
                "default": 1000,
                "description": "Mean Time Between Failures (repairable system). Same time unit as MTTR.",
                "minimum": 0,
                "type": "number"
              },
              "mttr": {
                "default": 10,
                "description": "Mean Time To Repair. Same time unit as MTBF.",
                "minimum": 0,
