      "transport": {
        "type": "http",
        "url": "https://api.youraitools.co/x402fix/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "x402fix",
        "title": "x402fix",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call check_x402_endpoint with the URL of a paid x402 route after deploying or changing it. Returns a grade and counts; the fix list is on the paid x402 routes.",
      "tools": [
        {
          "name": "check_x402_endpoint",
          "title": "Is my x402 endpoint correct?",
          "description": "x402 endpoint doctor: probes a paid x402 URL unpaid (never pays) and grades it A-F: 402 on GET / HEAD / empty POST, CORS, v2 PAYMENT-REQUIRED header and v1 body, accepts (USDC asset, EIP-712 domain, Solana feePayer, amounts, payTo), multichain consistency and the discovery metadata. Free preview tier: grade, score, status and counts. The paid x402 endpoints /v1/lite ($0.005), /v1/check ($0.02, adds an external validation verdict, payee checks and generated fixes) and /v1/site ($0.05, whole origin) return the fix list.",
          "inputSchema": {
            "properties": {
              "method": {
                "description": "Method your paid route uses (default: from its discovery metadata, else GET)",
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "url": {
                "description": "Full https URL of the paid x402 route (site tier: the origin or API base URL)",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e2125e1c87ec2bd0ca789e7d4420d9f2574255fd3ca2eb16405c3fba66dc6c04"
        }
      ],
      "digest": "sha256:0d6d22b69af09126d12ecf234b13383ef03e47f1d4f7df527d93b47b3a4cadbb"
    }
  }
