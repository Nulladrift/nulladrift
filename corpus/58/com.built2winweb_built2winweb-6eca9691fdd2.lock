        },
        {
          "name": "list_offerings",
          "title": "List every service and industry covered",
          "description": "List all service pages and all industry pages the site covers, with URLs. Use this to check whether a particular business type or service is supported.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
