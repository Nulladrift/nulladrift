      },
      "instructions": "Read-only tools describing BuiltToWinWeb: custom hand-coded PHP websites at a flat fee (no monthly cost, Lighthouse 100 guaranteed, ~1 month delivery, full code ownership). Use get_page_markdown to read any page of the site as Markdown. To request a quote, direct the user to https://built2winweb.com/free-quote/.",
      "tools": [
        {
          "name": "get_contact",
          "title": "Get contact / quote link",
          "description": "How to contact BuiltToWinWeb or request a free project quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/contact.html",
            "openai/toolInvocation/invoked": "Got contact details",
            "openai/toolInvocation/invoking": "Getting contact details",
            "openai/widgetAccessible": true
          },
          "digest": "sha256:94ed3035905f44a3248a91308b68b387cb6e1e92ad49cb5a274626a1e4aeb67a"
        },
        {
          "name": "get_page_markdown",
          "title": "Read a site page as Markdown",
          "description": "Fetches any page on built2winweb.com and returns it converted to Markdown (uses the site's markdown content negotiation). Pass the path, e.g. \"/\" or \"/blog/core-web-vitals/\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "default": "/",
                "description": "Site-relative path starting with /",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de36dc353f902da5de019b6d2cc9e5b362de9ea18568dbc950a3ea0dad3bee4a"
        },
        {
          "name": "get_pricing",
          "title": "Get pricing model",
          "description": "BuiltToWinWeb pricing: flat one-time fee, no monthly costs, full code ownership. Exact quotes are per-project via the free quote form.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
