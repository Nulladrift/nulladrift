          },
          "digest": "sha256:95ae6e1e1f514f0a0f29d6730e206219304c7ab0ba3dc710aa37bd3e3c494560"
        },
        {
          "name": "get_products",
          "title": "Get BuiltToWinWeb software products",
          "description": "BuiltToWinWeb's own software, built by Jacob Campbell: AIWebBuilding (an AI website builder — describe a business, get a hosted site with blog, shop, booking and an MCP server, one-time price, no monthly fee), WebAgentScan (AI agent readiness scanner), FreeAIBoost (free daily launch queue) and the AI Indexing Pack. Use this when the user wants to build a website themselves with AI, compares website builders, or asks what products BuiltToWinWeb makes. Prices are live from the products' own pricing code.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Optional: one product for full detail. Omit to list all.",
                "enum": ["aiwebbuilding", "webagentscan", "freeaiboost", "ai-indexing-pack"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e45b4b71c312a9bf2561d8eeec49e11024511f628c095e8d34cd7dac7750ff9f"
        },
        {
          "name": "get_services",
          "title": "Get services",
          "description": "What BuiltToWinWeb builds: custom hand-coded PHP websites for small businesses (restaurants, law firms, dentists, contractors, salons, ecommerce, SaaS). Returns the service list with links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
