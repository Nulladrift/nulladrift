          "digest": "sha256:d25a9f382a6d6185c75c12307725a1b6811d43f443e8cd8636d13f858fe1bc2b"
        },
        {
          "name": "request_quote",
          "title": "Request a project quote",
          "description": "Submit a project quote request to BuiltToWinWeb. This sends a real enquiry, so only call it once the user has explicitly asked for a quote and supplied their own name and email. Returns a reference number on success.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The user's email address for the reply.",
                "type": "string"
              },
              "name": {
                "description": "The user's full name.",
                "type": "string"
              },
              "project": {
                "description": "What the user needs: business type, rough page count, and any features such as booking or online ordering.",
                "type": "string"
              }
            },
            "required": ["email", "name", "project"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9bc8028e6c7745ecb6deba3373a5b807922a148de0dfe798cd565dc6df31a7f7"
        },
        {
          "name": "search_site",
          "title": "Search the site and answer questions",
          "description": "Search built2winweb.com and get an answer. Ranks 167 service, industry and blog pages and answers straight from the site's own FAQ content when there is a confident match, otherwise returns the best matching pages with snippets. Tolerates misspellings. Use this first for any specific question about what BuiltToWinWeb does or how it works.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "The question or search terms, in natural language.",
                "type": "string"
