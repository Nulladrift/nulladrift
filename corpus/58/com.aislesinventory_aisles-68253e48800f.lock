      "serverInfo": {
        "name": "aisles",
        "title": "Aisles local store inventory",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Aisles answers local shopping questions: \"where can I find X near Y\", \"who has X near Y\" and \"is X in stock near <city or ZIP>\", including needs with a deadline (\"I need Dunks in size 9 before Saturday, South Bend\"). It reports whether a specific product was in stock at specific physical stores in 192 metro areas (Chicago, IL; New York, NY; Los Angeles, CA; Houston, TX; Phoenix, AZ; Philadelphia, PA; San Antonio, TX; San Diego, CA; Dallas, TX; Fort Worth, TX; Charlotte, NC; Columbus, OH; Indianapolis, IN; Seattle, WA; South Bend, IN; Orlando, FL; Atlanta, GA; Boston, MA; Fort Lauderdale, FL; Baltimore, MD; Detroit, MI; Danbury, CT; Tampa, FL; Oakland, CA; Denver, CO; Las Vegas, NV; Akron, OH; Riverside, CA; Trenton, NJ; Pittsburgh, PA; St. Louis, MO; Norfolk, VA; Milwaukee, WI; Little Rock, AR; Tucson, AZ; West Palm Beach, FL; Miami, FL; Aurora, IL; Louisville, KY; Minneapolis, MN; Memphis, TN; Omaha, NE; Cincinnati, OH; Lancaster, PA; Myrtle Beach, SC; Austin, TX; Cypress, TX; Fredericksburg, VA; Rogers, AR; Modesto, CA; Daytona Beach, FL; Jacksonville, FL; Savannah, GA; Michigan City, IN; Kansas City, MO; Albuquerque, NM; Albany, NY; Buffalo, NY; Middletown, NY; Rochester, NY; Niles, OH; Tulsa, OK; Scranton, PA; Charleston, SC; Nashville, TN; Allen, TX; El Paso, TX; McAllen, TX; Puyallup, WA; Birmingham, AL; Mobile, AL; Fort Smith, AR; Camarillo, CA; Bakersfield, CA; Fairfield, CA; Escondido, CA; Fresno, CA; Salinas, CA; Sacramento, CA; Victorville, CA; Colorado Springs, CO; Grand Junction, CO; Pueblo, CO; Wilmington, DE; Hartford, CT; Fort Myers, FL; Destin, FL; Jensen Beach, FL; Ocala, FL; Panama City, FL; Pensacola, FL; Sarasota, FL; Tallahassee, FL; Commerce, GA; Columbus, GA; Augusta, GA; Coralville, IA; Davenport, IA; Sioux City, IA; Boise, ID; Champaign, IL; Normal, IL; Rockford, IL; Springfield, IL; Evansville, IN; Fort Wayne, IN; Kokomo, IN; Lafayette, IN; Peoria, IL; Ashland, KY; Wichita, KS; Bowling Green, KY; Lexington, KY; Elizabethtown, KY; Paducah, KY; Alexandria, LA; Baton Rouge, LA; Worcester, MA; Hyannis, MA; Hagerstown, MD; Salisbury, MD; Flint, MI; Portage, MI; Duluth, MN; Columbia, MO; St Cloud, MN; Springfield, MO; Jackson, MS; Tupelo, MS; Missoula, MT; Asheville, NC; Greensboro, NC; Raleigh, NC; Fargo, ND; Wilmington, NC; Manchester, NH; Rockaway, NJ; Gallup, NM; Reno, NV; Syracuse, NY; Dayton, OH; Sandusky, OH; St Clairsville, OH; Toledo, OH; Oklahoma City, OK; Erie, PA; Allentown, PA; Columbia, SC; Greenville, SC; Florence, SC; Sioux Falls, SD; Clarksville, TN; Knoxville, TN; Chattanooga, TN; Abilene, TX; Beaumont, TX; College Station, TX; Corpus Christi, TX; Killeen, TX; Longview, TX; Laredo, TX; Lubbock, TX; Midland, TX; San Angelo, TX; San Marcos, TX; Texas City, TX; Victoria, TX; Waco, TX; Richmond, VA; Lynchburg, VA; Roanoke, VA; Kennewick, WA; Portland, OR; Union Gap, WA; Green Bay, WI; Johnson Creek, WI; Madison, WI; Bridgeport, WV; Mount Hope, WV; Vienna, WV; Huntsville, AL; Florence, AL; Dothan, AL; Chico, CA; Yuba City, CA; Palm Desert, CA; Palmdale, CA; Fort Collins, CO; Macon, GA; Gainesville, GA; Eugene, OR; Grand Rapids, MI), with the retailer-reported price, pickup and delivery options, and the time Aisles last checked. Within those metros it lists only certain stores, not every chain or store. Grocery: Kroger-family stores (Food 4 Less, Fred Meyer, Fry’s Food, Harris Teeter, Kroger, Mariano’s, QFC, Ralphs) in Chicago, IL; Los Angeles, CA; Houston, TX; Phoenix, AZ; San Diego, CA; Dallas, TX; Fort Worth, TX; Charlotte, NC; Columbus, OH; Indianapolis, IN; Seattle, WA; South Bend, IN. Grocery stores are checked only for these kinds of products: milk, eggs, bread, coffee, baby formula, diapers, pain relief, cold and flu, toothpaste, paper towels, batteries, dog food; other groceries are not tracked. Other chains, their own stores: JD Sports (435 stores in 179 metros); Finish Line (39 stores in 28 metros); Bricks & Minifigs (16 stores in 15 metros); DICK’S Sporting Goods (15 stores in 9 metros); SCHEELS (2 stores in 2 metros); Alamo Shoes (1 store in 1 metro); Alice's Garden (1 store in 1 metro); Just Roughin' It (1 store in 1 metro). Malls: only the stores inside these 9 Simon malls (department stores, clothing, shoes, beauty, accessories): Del Amo Fashion Center in Torrance, CA (location \"los-angeles\"); King of Prussia in King of Prussia, PA (location \"philadelphia\"); Mall of Georgia in Buford, GA (location \"atlanta\"); Roosevelt Field in Garden City, NY (location \"new-york\"); Sawgrass Mills in Sunrise, FL (location \"fort-lauderdale\"); South Shore Plaza in Braintree, MA (location \"boston\"); The Galleria in Houston, TX (location \"houston\"); University Park Mall in Mishawaka, IN (location \"south-bend\"); Woodfield Mall in Schaumburg, IL (location \"chicago\"). list_locations names the chains and malls in each metro; call it when unsure whether a place, chain or mall is covered. compare_online_prices is separate: online prices, discount codes and a net price after the user's gift cards, with no location. Ask for amounts only, never a card number, PIN or gift card code. Call search_products with the product words as query and the place as location: a covered metro or a ZIP code there. Town and mall names are not resolved: for a town or mall inside a metro, use the metro (as listed above) or the town's ZIP. Location precedence: the place the user named; if they named none, call it without location and the user's approximate location is used when the app provides one; otherwise the tool asks which city or ZIP, and you should ask the user rather than guess. Put a stated size in size (and size_system only when the user said men's, women's, youth, EU or UK); never guess a size system or audience from a bare number. Package amounts (\"gallon\", \"12 pack\") stay in query. For a deadline (\"before Saturday\", \"for tomorrow\"), search now and give the result as the retailer's last report: Aisles never guarantees an item will still be there on that day. Do not use Aisles for online-only shopping or shipping orders, restaurants and food delivery, places outside the covered metro areas, chains or stores Aisles does not list, reserving or holding items, and promises that an item will still be there later. For an uncovered place or an unlisted chain, say Aisles doesn't cover it rather than presenting other stores as that one; a request that also asks whether a product is in stock near a covered place is still in scope for that part. Stock and prices are what each retailer reported at Aisles' last check (last_checked_at), not a physical check; a price can be the retailer's online or regional price rather than that branch's shelf price. When answering, say how long ago Aisles checked, name the retailer that reported it, and link the Aisles page. Aisles cannot reserve items.",
      "tools": [
        {
          "name": "compare_online_prices",
          "title": "Compare online prices and net price after gift cards",
          "description": "Use this when someone asks for the lowest online price, a discount code, or what a product would cost after their gift card or card rewards (\"what is the cheapest place to buy ASICS GEL-NYC online?\", \"I have a $50 JD Sports gift card, what would these cost me?\"). Covers only products sold online by Hanes, Finish Line, JD Sports, from each store's product file. \"Lowest\" means among these stores, not the whole web. Returns each store's listed price, the estimated price with any confirmed discount code, and net_price: what is left to pay after the code, that store's gift card balance and card rewards, before tax and shipping. A gift card counts only at its own store. Ask for amounts only: never ask for or accept a card number, PIN or gift card code. Say that a net price is an estimate, and that sizes and stock are checked on the store's site. For stock at physical stores, use search_products.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "card_rewards_percent": {
                "description": "Only when the user stated it: percent back from their credit card, e.g. 2.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "gift_cards": {
                "description": "The gift card balances the user stated. Amounts only, never a card number, PIN or code.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "balance": {
                      "description": "Balance in US dollars.",
                      "exclusiveMinimum": 0,
                      "maximum": 10000,
                      "type": "number"
                    },
                    "store": {
                      "description": "The store the gift card is for.",
                      "enum": ["hanes", "finish-line", "jd-sports"],
                      "type": "string"
                    }
                  },
                  "required": ["balance", "store"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "limit": {
                "description": "Number of products to return (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum listed price in US dollars.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Product words: brand and product name, e.g. \"asics gel-nyc\", \"hanes crew socks\".",
                "type": "string"
              },
              "store": {
                "description": "Only when the user asked about one store.",
                "enum": ["hanes", "finish-line", "jd-sports"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare online prices and net price after gift cards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://aisles/results.html"
            }
          },
          "digest": "sha256:d23f17d18a02d7ba6ffbc2e094a4542b41002d62365a91f759cf22d1acd2304b"
        },
        {
          "name": "list_answers",
          "title": "List answered shopping questions for a metro",
          "description": "Use this for broad questions about one covered metro rather than one product: what stores are at a mall, where to find a kind of product at a mall or nearby, which stores carry a brand, what is on sale, the cheapest product per category, stores with curbside pickup or delivery, and chain price comparisons. Returns the questions Aisles answers from its daily checks, each with its page URL. For a specific product, use search_products instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "location": {
                "description": "Covered metro slug, e.g. chicago or south-bend. list_locations has them all.",
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List answered shopping questions for a metro"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a37374b68444f560eea8b26c1acd10bd737610611bcdb7844c8cfe32e48b30bf"
        },
        {
          "name": "list_locations",
          "title": "List covered metros, chains and malls",
          "description": "Use this to check whether Aisles covers a place, chain or mall before answering, or when the user asks where Aisles works. Lists the 192 metro areas with published listings, with their slugs, the chains Aisles lists in each and the specific shopping malls whose stores are covered (with each mall's town). A metro being covered does not mean every store in it is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filter": {
                "description": "Optional: words a metro, its state, a chain or a mall must contain, e.g. \"TX\", \"Kroger\", \"Roosevelt Field\". Leave it out for every covered metro.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List covered metros, chains and malls"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f931da6b35ee02415b5c274437a8abf91f2b30c263a214e0717037857e00a109"
        },
        {
          "name": "search_products",
          "title": "Find a product in stock at nearby stores",
          "description": "Use this when someone asks where to find a specific product near a place, who has it, or whether it is in stock near a city or ZIP code (\"where can I find Nike Dunks near South Bend?\", \"who has 2% milk near 46204?\", \"is the adidas Samba in stock near me in size 8?\"), including indirect needs with a deadline (\"I need Dunks in size 9 before Saturday\"). Covers only the stores Aisles lists in 192 metro areas: Kroger-family grocery stores (in 12 of them), the stores inside 9 specific Simon malls and JD Sports, Finish Line, Bricks & Minifigs, DICK’S Sporting Goods, SCHEELS, Alamo Shoes, Alice's Garden, Just Roughin' It stores, not every chain or store. Grocery stores are checked only for milk, eggs, bread, coffee, baby formula, diapers, pain relief, cold and flu, toothpaste, paper towels, batteries, dog food; for other groceries Aisles has no listing. Returns the closest store listings: whether each store reported the item in stock, the retailer-reported price (possibly an online or regional price; a range across sizes/colors when no size is given), pickup/delivery options and when Aisles last checked. Not for online-only shopping or shipping orders, restaurants and food delivery, places outside the covered metro areas, chains or stores Aisles does not list, reserving or holding items, and promises that an item will still be there later. A listing is the retailer's last report, not a guarantee for a later day or a deadline. Add size, fulfillment, max_price or availability only when the user asked for them; if a fulfillment, price or availability filter leaves nothing, the reply lists what there is without it. A size is never dropped.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "availability": {
                "description": "Default \"available\": in stock or low stock.",
                "enum": ["available", "out_of_stock", "unknown", "any"],
                "type": "string"
              },
              "fulfillment": {
                "description": "Only stores offering all of these.",
                "items": {
                  "enum": ["curbside_pickup", "store_pickup", "pickup_today", "in_store_shopping", "local_delivery", "same_day_delivery", "ship_to_store"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Number of listings to return (default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "The place the user named: a covered metro slug or name (list_locations has them all) or a 5-digit ZIP code in those areas. Town and mall names are not resolved: for a town or mall inside a metro, use the metro (Del Amo Fashion Center or Torrance: los-angeles; King of Prussia or King of Prussia: philadelphia; Mall of Georgia or Buford: atlanta; Roosevelt Field or Garden City: new-york; Sawgrass Mills or Sunrise: fort-lauderdale; South Shore Plaza or Braintree: boston; The Galleria or Houston: houston; University Park Mall or Mishawaka: south-bend; Woodfield Mall or Schaumburg: chicago) or the town's ZIP. Leave it out when the user named no place: their approximate location is used if the app supplies it, and otherwise the reply asks for a city or ZIP.",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price in US dollars.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Product words only: brand, product name or kind, e.g. \"similac formula\", \"2% milk gallon\", \"dozen eggs\", \"nike air force 1\", \"levi's 501 jeans\", \"ugg\". A brand alone is fine when that is all the user named. Package quantities and amounts (\"gallon\", \"12 pack\", \"32 oz\") stay here. Leave out the place and the clothing or shoe size.",
                "type": "string"
              },
              "radius_miles": {
                "description": "Search radius in miles. Leave it out for a city to cover every store Aisles lists there, including malls outside the center; a ZIP defaults to 10 miles.",
                "maximum": 50,
                "minimum": 0.1,
                "type": "number"
              },
              "size": {
                "description": "The clothing or shoe size the user stated, exactly as said, e.g. \"8\", \"10.5\", \"M\", \"32\". Only when the user gave one; a package amount is not a size.",
                "type": "string"
              },
              "size_system": {
                "description": "Only when the user said whose size it is: US_MENS, US_WOMENS, US_YOUTH, US_UNISEX, EU or UK. Never infer it from the number alone (\"size 8\" has no system).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a product in stock at nearby stores"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://aisles/results.html"
            }
          },
          "digest": "sha256:ec8dec646d3c9933a28cefd6a70552c5b6fb48cee43c6235f7f823ab94b03b3f"
        }
      ],
      "resources": [
        {
          "uri": "ui://aisles/results.html",
          "name": "aisles-results",
          "title": "Aisles results",
          "description": "Cards for store listings (search_products) and online price comparisons (compare_online_prices), with links to the Aisles page and the retailer.",
          "mimeType": "text/html;profile=mcp-app",
