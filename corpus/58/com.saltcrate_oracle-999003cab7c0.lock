{
  "lockfileVersion": 2,
  "subjects": {
    "com.saltcrate/oracle": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://oracle.saltcrate.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "saltcrate-oracle",
        "title": "Oracle by SaltCrate",
        "version": "1.1.6",
        "description": "Pay-per-call web intelligence for AI agents: search, schema-driven extract, clean fetch, link checks, change detection, monitoring, claim verification and dependency CVE scans. 200 free calls/hour with no API key.",
        "websiteUrl": "https://oracle.saltcrate.com/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SaltCrate Oracle — live web intelligence, pay-per-call. Endpoint: https://oracle.saltcrate.com/mcp\n\nTools: search, fetch, extract, check_link, check_change, monitor, verify, check_deps.\n\nFree tier (no key, no signup): fetch, search, check_link, check_change, verify, monitor and check_deps answer 200 calls/hour per IP. Use them freely — nothing to configure.\n\nPaid: extract (LLM schema-driven structured extraction from a page; pass a JSON Schema string in `schema`) is billed. Prices: $0.01 per call in USDC on Tempo, or $0.50 by card, or pay once for a prepaid pass — $1 = 100 calls, $5 = 1,000 calls at https://oracle.saltcrate.com/buy (card) or https://saltedcrate.gumroad.com. Send a pass as the header `Authorization: Bearer orc_...`.\n\nOn a -32042 / 402 response do not retry blindly: it carries the exact price and payment methods. Tell the user the amount and the pass URL above.\n\nGuidance: prefer check_change for \"did this page change\" and monitor for repeated watching — both keep state server-side, so a second call returns a diff instead of a full page. Use extract only when you need typed fields out of a page, since it is the costly tool. `search` returns titles, URLs and snippets; follow up with fetch for full text.",
      "tools": [
        {
          "name": "check_change",
          "description": "Did this web page change since the last time it was checked? Hash-based change detection. First check reports 'new'; later checks report 'changed' or 'unchanged'.",
          "inputSchema": {
            "properties": {
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "check_changeArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f5197330b9571d688eafd5f1c56ba27f4d03f166a00eea795d37a1b2423658cf"
        },
        {
          "name": "check_deps",
          "description": "Is this dependency current, and does the version in use have known vulnerabilities? Takes a package name and returns the latest version, deprecation/license, and advisories from OSV.dev with the version that fixes each. Accepts 'lodash@4.17.20' (npm-style), 'requests==2.19.0' (PyPI-style), or a prefix: npm:, pypi:, cargo:, go:, gem:. Backed by the live registries — no guessing.",
          "inputSchema": {
            "properties": {
              "package": {
                "title": "Package",
                "type": "string"
              }
            },
            "required": ["package"],
            "title": "check_depsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de17b4d9558d57a15569bd8e1268ca9e60dd5f086240e9d1e54c9aebc26f521c"
        },
        {
          "name": "check_link",
          "description": "Is this URL live right now? Returns HTTP status, the redirect chain, final URL, and round-trip latency in milliseconds.",
          "inputSchema": {
            "properties": {
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "check_linkArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97458a8db832e25033f33403ce26c3b5ae6bd9b910b48aeb48232577e36b0140"
        },
        {
          "name": "extract",
          "description": "Schema-driven structured extraction: fetch a URL and map its content into typed entities that conform to a JSON Schema you provide. Pass the schema as a JSON string; returns schema-conforming JSON (e.g. pricing, company facts, product specs, events). Requires DEEPSEEK_API_KEY.",
          "inputSchema": {
            "properties": {
              "schema": {
                "title": "Schema",
                "type": "string"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["schema", "url"],
            "title": "extractArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:92f119cf04927a857b560c61e859c5598b1cb439de916787dacf33e040b01b6a"
        },
        {
          "name": "fetch",
          "description": "Get clean, readable text from a web page — boilerplate, navigation, and ads stripped — so you can work with the actual content. Returns the text plus title, content-type, HTTP status, and length.",
          "inputSchema": {
            "properties": {
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "fetchArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:465c4befe277af7430c3960caeb497ea331b7cd49b19d735b573fa59eab486aa"
        },
        {
          "name": "monitor",
          "description": "Watch a URL over time — call periodically and pay per check. First call reports 'new'; later calls report 'changed' or 'unchanged', with changes_since_first_seen, first_seen, and last_checked timestamps for recurring monitoring.",
          "inputSchema": {
            "properties": {
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "monitorArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:353c1a8e41128a27cae48829c82b7785a336e3288b54e8f3e95049300c79354a"
        },
        {
          "name": "search",
          "description": "Live web search. Returns a list of {title, url, snippet} results plus which backend served them (free DuckDuckGo by default, or Brave/Serper when configured).",
          "inputSchema": {
            "properties": {
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "searchArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e5a965bc8025f56d7b562f850a85f3519bac5339dfa032e49e4d306ebcd44a6"
        },
        {
          "name": "verify",
          "description": "Does this source URL support a given claim? Returns a confidence score, matched terms, and the best supporting excerpt. Heuristic term-overlap — not semantic fact-checking.",
          "inputSchema": {
            "properties": {
              "claim": {
                "title": "Claim",
                "type": "string"
              },
              "source_url": {
                "title": "Source Url",
                "type": "string"
              }
            },
            "required": ["claim", "source_url"],
            "title": "verifyArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bfc09fc6a0ddbbf17fd839d181b6ee78273bc63e66237ae0f76de3845e31f50c"
        }
      ],
      "digest": "sha256:11f58a07a4bc52cbf0631fe594a5c65a1fe70cd688c85afb442bbac7a5e1971e"
    }
  }
}
