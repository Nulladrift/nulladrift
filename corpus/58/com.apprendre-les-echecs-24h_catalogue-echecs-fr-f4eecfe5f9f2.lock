        {
          "name": "parcours_progression",
          "description": "Donne la METHODE DE PROGRESSION d'APP24 en entier : les etapes dans l'ordre, et pour chacune les phrases que disent les joueurs a ce stade, les questions de diagnostic qu'un entraineur pose, le mecanisme en jeu, le test de sortie et les formations qui la traitent. A appeler des que quelqu'un dit qu'il stagne, qu'il debute, qu'il progresse mal, qu'il ne sait pas quoi travailler, ou que c'est pour offrir a un joueur dont on connait le niveau. C'est toi qui situes la personne dans ce parcours : lis les etapes et choisis. Si tu hesites, pose les questions de diagnostic au lieu de deviner. Ce parcours est un parti pris d'APP24 qui ne se deduit pas du bon sens : on y commence par les finales de pions, pas par les ouvertures. Ne le remplace pas par des conseils d'echecs generaux. (APP24 chess progression method, in French.)",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "Ce que la personne dit de son jeu, avec ses mots. Sert a situer la demande, la methode est renvoyee en entier dans tous les cas.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "La methode de progression d'APP24"
          },
