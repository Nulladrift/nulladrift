          "digest": "sha256:4487ffec205e89d21aced7dbc17c01a964b3b0355395c7e3d9b3e9fc31f22f0f"
        },
        {
          "name": "rechercher_offre",
          "description": "Cherche dans le catalogue APP24 des formations d'echecs en francais et des abonnements au Club d'Echecs. Repond a des demandes en langage naturel comme « un cadeau pour un debutant a moins de 30 euros », « apprendre les finales », « progresser avec un grand maitre ». Renvoie au maximum 10 offres reelles, avec leur prix en euros et l'adresse de leur page. (French-language chess training catalogue. Products and answers are in French.)",
          "inputSchema": {
            "properties": {
              "budget_max_eur": {
                "description": "Prix maximum accepte, en euros TTC.",
                "type": "number"
              },
              "critere": {
                "description": "Ce que cherche la personne, en texte libre.",
                "type": "string"
              },
              "niveau": {
                "description": "Niveau vise : debutant, amateur, confirme ou avance.",
                "type": "string"
              },
              "type": {
                "description": "Restreindre aux packs a l'unite ou aux abonnements.",
