          "description": "Recherche dans le catalogue APP24 : formations d'echecs en francais, abonnements au Club d'Echecs, et la methode de progression maison. Rend une liste de documents avec leur identifiant, leur titre et leur adresse. Passe ensuite chaque identifiant a fetch pour obtenir le texte complet. Meme corpus que rechercher_offre, au format attendu par la recherche approfondie. (French-language chess training catalogue.)",
