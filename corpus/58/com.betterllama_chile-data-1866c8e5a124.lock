        {
          "name": "colombia_secop_search",
          "title": "Contratos y procesos de compras públicas de Colombia (SECOP II)",
          "description": "Busca contratos firmados (dataset \"contratos\") o procesos de contratación publicados (dataset \"procesos\") del Estado colombiano en SECOP II, vía el Portal de Datos Abiertos datos.gov.co: texto libre, entidad compradora (nombre o NIT), NIT del proveedor, departamento, rango de fechas (firma del contrato o publicación del proceso), valor mínimo y estado. Ordena del más reciente al más antiguo y devuelve JSON compacto (entidad, objeto, modalidad, valores en COP, fechas, proveedor, enlace a SECOP). Sin clave. No incluye representantes legales, funcionarios, cuentas bancarias ni nombres o documentos de proveedores que sean personas naturales. / Search Colombia public procurement contracts and processes (SECOP II).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset": {
                "default": "contratos",
                "description": "contratos = SECOP II Contratos Electrónicos (jbjy-vk9h); procesos = SECOP II Procesos de Contratación (p6dx-8zbt).",
                "enum": ["contratos", "procesos"],
                "type": "string"
              },
              "department": {
                "description": "Departamento de la entidad, p. ej. \"Antioquia\", \"Bogotá\", \"Valle del Cauca\".",
                "type": "string"
              },
              "entity": {
                "description": "Parte del nombre de la entidad compradora, p. ej. \"Alcaldía de Medellín\".",
                "type": "string"
              },
              "entityNit": {
                "description": "NIT de la entidad compradora (solo dígitos, sin dígito de verificación).",
                "type": "string"
              },
              "fromDate": {
                "description": "Desde (AAAA-MM-DD). Contratos: fecha de firma. Procesos: fecha de publicación.",
                "type": "string"
              },
              "maxItems": {
                "default": 10,
                "description": "Máximo de resultados a devolver (1-50). Por defecto 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minValue": {
                "description": "Valor mínimo en pesos colombianos (contratos: valor del contrato; procesos: precio base).",
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "Resultados a saltar (paginación).",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Texto libre (búsqueda de texto completo de Socrata), p. ej. \"software\", \"interventoría vial\".",
                "type": "string"
              },
              "status": {
                "description": "Estado (coincidencia parcial). Contratos: p. ej. \"En ejecución\", \"Firmado\", \"terminado\". Procesos: p. ej. \"Publicado\", \"Adjudicado\", \"Seleccionado\".",
                "type": "string"
              },
              "supplierNit": {
                "description": "NIT del proveedor adjudicado (solo dígitos).",
                "type": "string"
              },
              "toDate": {
                "description": "Hasta (AAAA-MM-DD), inclusive.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Contratos y procesos de compras públicas de Colombia (SECOP II)"
          },
          "behavior": {
