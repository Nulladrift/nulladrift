              "dayTo": {
                "description": "Día hasta / Day to — Fin del rango por días (dólar y euro).",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "institutionCode": {
                "description": "Código de institución / Institution code — Código SBIF de 3 dígitos (001 = Banco de Chile, 012 = BancoEstado, 028 = BICE, 999 = sistema financiero). Obligatorio en perfil, accionistas, integrantes y adecuación. En balances/resultados, si se omite y no hay accountCode, se lista el catálogo de instituciones del mes.",
                "type": "string"
              },
              "listCatalog": {
                "description": "Catálogo / Catalog — Solo balances o resultados. instituciones = lista de bancos con datos en ese mes; cuentas = plan de cuentas del mes. Vacío = detalle (estado o cuenta).",
