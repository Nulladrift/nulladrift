        {
          "name": "chilexpress_shipping",
          "title": "Chilexpress: coberturas, regiones, oficinas, cotizar y seguir envíos",
          "description": "Usa las APIs oficiales de Chilexpress: coberturas y códigos de comuna, regiones (sin clave), oficinas y puntos Pick Up, cotización de envíos entre comunas y seguimiento de órdenes de transporte. Cotizar y seguir requieren tus propias claves gratuitas de developers.wschilexpress.com (argumentos cotizadorKey/enviosKey/coberturasKey o encabezados X-Chilexpress-*-Key). No afiliado a Chilexpress. / Chilexpress coverage, offices, quotes and tracking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coberturasKey": {
                "description": "Clave «Coberturas» — Tu clave personal y gratuita del proveedor (https://developers.wschilexpress.com). También puedes enviarla en un encabezado HTTP (ver la ficha de la herramienta). Se usa solo en esa solicitud; nunca se guarda ni se registra.",
                "type": "string"
              },
              "companyRut": {
                "description": "RUT de la empresa emisora — RUT de la empresa que generó las OT (con o sin dígito verificador). La API de Envíos solo permite seguir OT de tu propia empresa.",
                "type": "string"
              },
              "comunas": {
                "description": "Comunas / Communes — Filtra por comuna (sin tildes ni mayúsculas).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cotizadorKey": {
                "description": "Clave «Cotizador» — Tu clave personal y gratuita del proveedor (https://developers.wschilexpress.com). También puedes enviarla en un encabezado HTTP (ver la ficha de la herramienta). Se usa solo en esa solicitud; nunca se guarda ni se registra.",
                "type": "string"
              },
              "coverageType": {
                "default": "comunas",
                "description": "Tipo de cobertura — comunas = una fila por comuna; sectores = localidades dentro de comunas; todas = ambas.",
                "enum": ["comunas", "sectores", "todas"],
                "type": "string"
              },
              "declaredValue": {
                "description": "Valor declarado (CLP) — Por defecto 10000.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "deliveryTime": {
                "default": "todos",
                "description": "Servicios — Qué servicios cotizar.",
                "enum": ["todos", "prioritarios", "no_prioritarios"],
                "type": "string"
              },
              "destinations": {
                "description": "Destinos / Destinations — Una o más comunas o códigos (máx. 50).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "enviosKey": {
                "description": "Clave «Envíos» — Tu clave personal y gratuita del proveedor (https://developers.wschilexpress.com). También puedes enviarla en un encabezado HTTP (ver la ficha de la herramienta). Se usa solo en esa solicitud; nunca se guarda ni se registra.",
                "type": "string"
              },
              "environment": {
                "default": "produccion",
                "description": "Ambiente / Environment — Las claves de prueba solo funcionan en «pruebas».",
                "enum": ["produccion", "pruebas"],
                "type": "string"
              },
              "heightCm": {
                "description": "Alto (cm) — Por defecto 10.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "lengthCm": {
                "description": "Largo (cm) — Por defecto 10.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "maxItems": {
                "default": 20,
                "description": "Máximo de resultados a devolver (1-200). Por defecto 20.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "officeType": {
                "default": "todas",
                "description": "Tipo de oficina — Solo operation=oficinas.",
                "enum": ["todas", "sucursales", "pickup"],
                "type": "string"
              },
              "operation": {
                "default": "coberturas",
                "description": "Operación / Operation — regiones y coberturas: sin clave. oficinas: clave «Coberturas» recomendada. cotizar: clave «Cotizador». seguimiento: clave «Envíos».",
                "enum": ["coberturas", "regiones", "oficinas", "cotizar", "seguimiento"],
                "type": "string"
              },
              "origin": {
                "description": "Origen / Origin — Comuna o código de cobertura (p. ej. «Santiago» o «STGO»).",
                "type": "string"
              },
              "productType": {
                "default": "encomienda",
                "description": "Producto — Tipo de envío.",
                "enum": ["encomienda", "documento"],
                "type": "string"
              },
              "reference": {
                "description": "Referencia (opcional) — Referencia del cliente asociada a la OT.",
                "type": "string"
              },
              "regions": {
                "description": "Regiones / Regions — coberturas/oficinas: RM, R5…, número INE o nombre. Vacío = todo Chile.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "showEvents": {
                "default": true,
                "description": "Incluir todos los eventos — Si no, solo el estado actual.",
                "type": "boolean"
              },
              "trackingNumbers": {
                "description": "Números de OT / Tracking numbers — Órdenes de transporte a seguir (máx. 200).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "weightKg": {
                "description": "Peso (kg) — Por defecto 1.",
                "type": "string"
              },
              "widthCm": {
                "description": "Ancho (cm) — Por defecto 10.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
