                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "Mes / Month — 1-12. Obligatorio para period=month/date y para reportes bancarios.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "monthTo": {
                "description": "Mes hasta / Month to — Fin del rango por meses o por días.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "default": "current",
                "description": "Período (indicadores) / Period — Solo indicadores. current = valor vigente; year / month / date = un año, un mes o un día; range = entre year(/month[/day]) y yearTo(/monthTo[/dayTo]). El rango por días (dias_i / dias_f) está documentado y verificado para dólar y euro. UF, UTM, IPC, TMC y TIP usan rango por meses o años.",
