        {
          "name": "find_chile_fuel_prices",
          "title": "Precios de bencina, diésel y gas por estación en Chile (CNE)",
          "description": "Encuentra precios actuales de combustibles (gasolina 93/95/97, diésel, kerosene, GLP, GNC) por estación de servicio en Chile, filtrando por región, comuna, marca o cercanía a una coordenada (radio en km), ordenados por precio o distancia. También lista estaciones con dirección y servicios. / Current fuel prices per gas station in Chile.",
