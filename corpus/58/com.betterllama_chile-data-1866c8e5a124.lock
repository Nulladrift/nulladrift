      "instructions": "Better Llama: herramientas de datos públicos de Latinoamérica (hoy Chile, Colombia y Perú) para agentes de IA. Usa search_tools para encontrar la herramienta correcta por tarea y luego llámala. Todas devuelven JSON normalizado con atribución de la fuente oficial; cita la fuente al mostrar los datos. Algunas requieren que el usuario traiga su propia clave gratuita (access=byok).",
      "tools": [
        {
          "name": "chile_calendar_and_rut",
          "title": "Feriados, días hábiles, comunas y validación de RUT (Chile)",
          "description": "Utilidades para Chile sin llamadas externas: feriados legales nacionales, regionales y comunales (2022-2035), si una fecha es feriado, días hábiles entre dos fechas, sumar N días hábiles a una fecha, regiones/provincias/comunas con código CUT, y validación o cálculo del dígito verificador del RUT. / Chile holidays, business days, communes and RUT validation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "businessDays": {
                "default": 10,
                "description": "Días hábiles a sumar (negativo = restar) — Para sumar_dias_habiles.",
                "maximum": 2000,
                "minimum": -2000,
                "type": "integer"
              },
              "comuna": {
                "description": "Comuna — Nombre o código CUT (p. ej. Chillán o 16101). Aplica feriados comunales (20 de agosto en Chillán y Chillán Viejo).",
                "type": "string"
              },
              "dates": {
                "description": "Fechas a consultar (es_feriado) — Fechas AAAA-MM-DD. Vacío = hoy (hora de Chile).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "fromDate": {
                "description": "Desde (AAAA-MM-DD) — Inicio del rango (dias_habiles, o filtro de feriados).",
                "type": "string"
              },
              "includeBank": {
                "default": false,
                "description": "Incluir feriado bancario (31 dic) — El 31 de diciembre es feriado solo para la atención bancaria.",
                "type": "boolean"
              },
              "includeRegional": {
                "default": true,
                "description": "Incluir feriados regionales en el listado — Si no indicas región, lista también los feriados regionales (marcados con scope=regional).",
                "type": "boolean"
              },
              "maxItems": {
                "default": 50,
                "description": "Máximo de resultados a devolver (1-1000). Por defecto 50.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "operation": {
                "default": "feriados",
                "description": "Operación / Operation — Qué calcular.",
                "enum": ["feriados", "es_feriado", "dias_habiles", "sumar_dias_habiles", "regiones", "provincias", "comunas", "validar_rut"],
                "type": "string"
              },
              "region": {
                "description": "Región — Código (13), sigla (RM), ISO (CL-RM), numeral (XIII) o nombre. Filtra comunas/provincias y aplica feriados regionales.",
                "type": "string"
              },
              "rutBodyOnly": {
                "default": false,
                "description": "Los RUT vienen sin dígito verificador — Calcula el DV a partir del cuerpo.",
                "type": "boolean"
              },
              "ruts": {
                "description": "RUT a validar — Formatos 12.345.678-5, 12345678-5 o 123456785. Máximo 5.000.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "saturdayIsBusinessDay": {
                "default": false,
                "description": "Sábado es día hábil — Para plazos legales que cuentan sábados (p. ej. algunos plazos procesales).",
                "type": "boolean"
              },
              "search": {
                "description": "Buscar por nombre (DPA) — Texto sin tildes ni mayúsculas, p. ej. 'nunoa'.",
                "type": "string"
              },
              "startDate": {
                "description": "Fecha inicial (sumar_dias_habiles) — Vacío = hoy. Se cuenta desde el día siguiente.",
                "type": "string"
              },
              "toDate": {
                "description": "Hasta (AAAA-MM-DD) — Fin del rango, inclusive.",
                "type": "string"
              },
              "years": {
                "description": "Años (feriados) — Años a listar (2022–2035). Vacío = año en curso. / Years.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
