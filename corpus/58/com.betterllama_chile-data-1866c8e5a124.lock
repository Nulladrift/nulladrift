        {
          "name": "get_chile_central_bank_series",
          "title": "Series del Banco Central de Chile (BDE): dólar, TPM, IMACEC, PIB, desempleo",
          "description": "Consulta series estadísticas oficiales del Banco Central de Chile (BDE): dólar observado, euro, UF, UTM, tasa de política monetaria, IPC, IMACEC, PIB, desempleo, tipo de cambio real o cualquier código de serie, por rango de fechas o solo el último dato. Con operation=search busca códigos de series en el catálogo. / Official Central Bank of Chile statistical series.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "firstDate": {
                "description": "Desde / From — AAAA-MM-DD. Por defecto: 31 días antes de lastDate.",
                "type": "string"
              },
              "frequency": {
                "default": "MONTHLY",
                "description": "Frecuencia (búsqueda) / Frequency (search) — Solo operation=search.",
                "enum": ["DAILY", "MONTHLY", "QUARTERLY", "ANNUAL"],
                "type": "string"
              },
              "indicators": {
                "description": "Indicadores frecuentes / Common indicators — Atajos con el código oficial ya resuelto. Se suman a seriesIds.",
                "items": {
                  "enum": ["dolar", "euro", "uf", "utm", "tpm", "ipc_variacion", "imacec", "imacec_desestacionalizado", "pib", "desempleo", "tipo_cambio_real"],
                  "type": "string"
                },
                "type": "array"
              },
              "lastDate": {
                "description": "Hasta / To — AAAA-MM-DD. Por defecto: hoy (hora de Chile).",
                "type": "string"
              },
              "latestOnly": {
                "default": false,
                "description": "Solo el último valor / Latest value only — Entrega solo la observación más reciente con dato de cada serie (ideal para agentes).",
                "type": "boolean"
              },
              "maxItems": {
                "default": 100,
                "description": "Máximo de resultados a devolver (1-1000). Por defecto 100.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "operation": {
                "default": "series",
                "description": "Operación / Operation — series = observaciones de una o más series; search = buscar series en el catálogo por frecuencia y texto.",
                "enum": ["series", "search"],
                "type": "string"
              },
              "query": {
                "description": "Texto a buscar / Search text — Solo operation=search. Todas las palabras deben aparecer en el título (español o inglés) o el código; no distingue tildes ni mayúsculas. Ej.: «imacec desestacionalizado».",
                "type": "string"
              },
              "seriesIds": {
