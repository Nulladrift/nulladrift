          "title": "UF, dólar, euro, UTM, IPC y reportes bancarios (CMF Chile)",
          "description": "Obtiene indicadores oficiales de la CMF Chile: UF, dólar observado, euro, UTM, IPC, TMC y TIP (valor vigente, por día, mes, año o rango), y reportes bancarios (balances, estados de resultados, perfil, adecuación de capital) por banco. JSON con fecha ISO y valor numérico. / Official Chilean financial indicators (UF, USD, EUR, UTM, CPI) and bank reports from CMF.",
          "inputSchema": {
