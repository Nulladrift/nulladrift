      "serverInfo": {
        "name": "soofi-website-grader",
        "title": "Website Grader by Soofi Digital",
        "version": "1.0.0",
        "websiteUrl": "https://soofidigital.com/tools/website-grader/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use audit_website when the user wants a website audited, graded or reviewed for SEO, speed, trust or lead capture; share the score, the most important problems with their fixes, and the full report link. Use request_help only if the user asks for someone to fix the site for them and gives their contact details for that purpose.",
      "tools": [
        {
          "name": "audit_website",
          "title": "Audit a website",
          "description": "Grades a public website out of 100 (A–F) across speed & mobile (including Google's live PageSpeed mobile test), Google visibility (SEO), trust & security, and lead capture. Returns every problem ranked by impact with a plain-English fix, what already works, and a link to a shareable full report. Use when the user asks to audit, grade, check, review or analyse a website, its SEO, speed or conversion. Takes 10–40 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The website address, e.g. example.com or https://example.com/page",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:25c5e9aa5fe339aeafd93793bc3d93aee5e14a92941a3465471c6e6405291049"
        },
        {
          "name": "request_help",
          "title": "Ask Soofi Digital to fix the website",
          "description": "Sends the user's request for help fixing their website to Soofi Digital's team, who will contact them by email or WhatsApp. Only use when the user explicitly asks for help or for Soofi Digital to contact them, and only with contact details the user has given you for this purpose. Confirm the details with the user before sending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business": {
                "description": "Optional business name",
                "type": "string"
              },
              "email": {
                "description": "The user's email address",
                "type": "string"
              },
              "message": {
                "description": "Optional: what they want help with, in their words",
                "type": "string"
              },
              "name": {
                "description": "The user's name",
                "type": "string"
              },
              "phone": {
                "description": "Optional WhatsApp/phone number with country code, e.g. +1 555 123 4567",
                "type": "string"
              },
              "website": {
                "description": "The website they want help with",
                "type": "string"
              }
            },
            "required": ["email", "name", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask Soofi Digital to fix the website"
          },
