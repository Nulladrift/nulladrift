        {
          "name": "compare_sources",
          "description": "Compare source readings. Default mode returns latest IMF, World Bank and UN readings with their own years. For the 20-economy, 10-concept research pilot, provide country_id and year (exact year or common) to compare IMF and World Bank in the same period, inspect definition mismatches and retrieve recorded-state provenance. Optional as_of and revision pin SOTW stored state, not publisher availability.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Optional SOTW recording cutoff: date at UTC midnight or ISO timestamp with timezone. Publisher availability is not established.",
                "type": "string"
              },
              "country_id": {
                "description": "Optional ISO3 code to return a single country instead of all",
                "type": "string"
              },
              "indicator_id": {
                "description": "Concept key, e.g. IMF.NGDPD (GDP), IMF.NGDPDPC (GDP per capita), IMF.NGDP_RPCH (real growth)",
                "type": "string"
              },
              "processing_version": {
                "description": "Pin the comparison processing contract.",
                "enum": ["source-comparison-v1"],
                "type": "string"
              },
              "revision": {
                "description": "Archive transaction watermark returned by an earlier comparison. Requires as_of.",
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "maximum": 2100,
                    "minimum": 1960,
                    "type": "integer"
                  },
                  {
                    "enum": ["common"],
                    "type": "string"
                  }
                ],
                "description": "Opt into the research pilot: exact year or latest common past year. Requires country_id."
              }
            },
            "required": ["indicator_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Compare source readings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:288ae15bf04b740a6de7fa32d0bb0fcd20b4138d54ba94722a13a421fe2ed7e3"
        },
