        {
          "name": "get_company_facts",
          "description": "Read the reviewed SEC company catalog, or exact issuer/concept facts with exact decimal strings, fiscal contexts, filing dates, units and immutable acquisition evidence. Publication pins guard current registry coherence; they do not reconstruct a full historical filing snapshot. No inferred quarters or currency conversions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cik": {
                "description": "SEC Central Index Key, ten digits with leading zeros (e.g. 0000320193). Omit to list the reviewed companies.",
                "pattern": "^[0-9]{10}$",
                "type": "string"
              },
              "evidence": {
                "description": "Evidence ID (64 hex characters) from a fact, with cik, to return its acquisition receipt.",
                "type": "string"
              },
              "filed_from": {
                "description": "Earliest filing date, YYYY-MM-DD.",
                "type": "string"
              },
              "filed_to": {
                "description": "Latest filing date, YYYY-MM-DD.",
                "type": "string"
              },
              "from": {
                "description": "Earliest fiscal period end, YYYY-MM-DD.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum facts returned (default 200).",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "publication": {
                "description": "Publication pin (64 hex characters) from an earlier response, to keep reads on the same registry state.",
                "type": "string"
              },
              "tag": {
                "description": "US-GAAP concept, e.g. Assets (default), Revenues, NetIncomeLoss, StockholdersEquity, EarningsPerShareDiluted.",
                "type": "string"
              },
              "to": {
                "description": "Latest fiscal period end, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "SEC company facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
