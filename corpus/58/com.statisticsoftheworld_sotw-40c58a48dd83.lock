        {
          "name": "get_data_status",
          "description": "Inspect reviewed macro country-level freshness, source import ages and separately measured public operating probes. matrix=true returns actual definition/geography pairs. Reference-age screens are not publisher deadlines. A single VPS observer is not external uptime monitoring.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "geo": {
                "description": "ISO 3166-1 alpha-3 code or aggregate code (e.g. USA, DEU, EU27), to filter matrix rows.",
                "type": "string"
              },
              "matrix": {
                "description": "true returns one row per definition and geography pair.",
                "type": "boolean"
              },
              "series_id": {
                "description": "Exact reviewed definition ID (from get_economic_data catalog=true), to filter matrix rows.",
                "type": "string"
              }
