        {
          "name": "get_series_data",
          "description": "High-frequency (daily/weekly/monthly) series: US Treasury yield curve (UST.YC.3M … UST.YC.30Y), SOFR/EFFR/OBFR, CORRA and GoC yields, central bank policy rates for ~38 economies (BIS.CBPOL.M/D), monthly CPI inflation for ~190 countries (IMF.CPI.YOY.M, IMF.CPI.FOOD.YOY.M), monthly 10-year government bond yields for 40+ countries (OECD.IRLT.10Y), monthly unemployment (ILO.UNEMP.RT.M, EUROSTAT.UNEMP.RT.M), Eurostat HICP/industrial production/retail (EUROSTAT.*.M), monthly electricity (EMBER.ELEC.*.M), and daily shipping chokepoint transits plus weekly port trade volumes (PORTWATCH.*). Call list_series to browse. Every response carries source licence and attribution.",
