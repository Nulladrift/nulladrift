        {
          "name": "get_market_history",
          "description": "Read forward sampled pool states or perpetual midpoints, including quiet/unavailable states and separate definition versions. These are sampled quotes rather than trades or cash-security OHLC. Requires exact market, symbol and UTC from/to timestamps, maximum 31 days. No history is inferred before collection began.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Window start, UTC timestamp ending in Z (e.g. 2026-11-01T00:00:00Z).",
                "type": "string"
              },
              "limit": {
                "description": "Maximum samples returned (default 5000).",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Token pools or perpetual derivatives.",
                "enum": ["pools", "derivatives"],
                "type": "string"
              },
              "symbol": {
                "description": "Exact, case-sensitive symbol from get_onchain_quotes catalog=true (e.g. PAXG, xyz:SILVER).",
                "type": "string"
              },
              "to": {
                "description": "Window end, UTC timestamp ending in Z; at most 31 days after from.",
                "type": "string"
              }
            },
            "required": ["from", "market", "symbol", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Sampled onchain market history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2ea66deeff1d4e2d24266fcfb37e9ca283bb772cd8de51c7e8a826432b7ae4d7"
        },
        {
          "name": "get_market_quotes",
          "description": "Market quotes: delayed quotes collected from Yahoo Finance (32 stock market index levels, US index futures, front-month commodity futures, US dollar exchange rates), each with its market time (asOf, UTC) and change on the previous session close; and official daily settlement prices of Chinese commodity futures (most-traded contract) read from the Shanghai and Zhengzhou exchanges, with trade date and change on the previous settlement. Every quote names its source, unit and source URL. Official daily reference rates (ECB, central banks, treasuries) are separate: use get_series_data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "group": {
                "description": "indices: stock index levels; futures: US index futures; commodities: front-month commodity futures; china: official Chinese futures settlements; crypto: top 250 crypto assets in US dollars (CoinGecko); fx: US dollar exchange rates; all (default).",
                "enum": ["indices", "futures", "commodities", "china", "crypto", "fx", "all"],
                "type": "string"
              },
              "ids": {
                "description": "Exact quote IDs, for example YF.IDX.USA (S&P 500), YF.IDX.JPN (Nikkei 225), YF.BRENT or YF.FX.EUR. Narrows the group.",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Delayed market quotes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4fd1aecf521c902a36bdbabc31f879e78ba96a06ace4917a7906e2fe423a3085"
        },
        {
          "name": "get_onchain_quotes",
          "description": "Read SOTW-computed public onchain prices. market=pools (default) reads Uniswap/Raydium/PancakeSwap token pools in USDC (BNB uses Binance-Peg USD Coin). market=derivatives reads Hyperliquid perpetual bid/ask midpoints with original units, source time, spread and depth checks. Instruments are distinct from linked cash securities, bullion benchmarks, indices and official yields. Unavailable prices are null. Set catalog=true to list reviewed contracts without source reads.",
          "inputSchema": {
            "properties": {
              "catalog": {
                "description": "true lists the reviewed contracts without reading prices.",
                "type": "boolean"
              },
              "category": {
                "description": "Limit quotes to one instrument category.",
                "enum": ["crypto", "stablecoin", "tokenized-gold", "tokenized-equity", "tokenized-etf", "equities", "etfs", "commodities", "currencies", "indices", "rates"],
                "type": "string"
              },
              "market": {
                "default": "pools",
                "description": "pools (default): token pool prices in USDC. derivatives: perpetual bid/ask midpoints.",
                "enum": ["pools", "derivatives"],
                "type": "string"
              },
              "symbols": {
                "description": "Case-sensitive token symbols (PAXG, AAPLx, SLVon) or exact perpetual IDs (xyz:SILVER, xyz:CL, para:10Y).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Onchain quotes"
