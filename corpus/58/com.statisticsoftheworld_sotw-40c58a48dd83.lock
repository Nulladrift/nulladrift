        {
          "name": "get_economic_data",
          "description": "Read reviewed GDP, inflation, jobs, trade, production, energy and credit packs with exact definitions, complete source flags, national qualifiers and observation-bound evidence. Set catalog=true to browse; otherwise provide an exact series_id and latest=true for its complete geography cohort or geo for history. Unreliable publisher values are withheld with raw_value retained. Reference periods and source publishing schedules vary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Exact timestamp with timezone, up to six fractional digits. SOTW recorded transactions only.",
                "type": "string"
              },
              "catalog": {
                "description": "true lists every reviewed definition (metadata only). Cannot be combined with other arguments.",
                "type": "boolean"
              },
              "format": {
                "description": "json (default) returns observations; manifest returns the export manifest with checksums.",
                "enum": ["json", "manifest"],
                "type": "string"
              },
              "from": {
                "description": "Earliest period, YYYY-MM-DD.",
                "type": "string"
              },
              "generation": {
                "description": "Publication generation (UUID) from an earlier response, to keep reads on the same publication.",
                "type": "string"
              },
              "geo": {
                "description": "ISO 3166-1 alpha-3 code or aggregate code (e.g. USA, DEU, EU27); with series_id, returns that geography's history.",
                "type": "string"
              },
              "latest": {
                "description": "true returns the newest observation for every geography of series_id.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum observations (default 2000).",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              },
              "recorded": {
                "description": "true reconstructs SOTW recorded state from archive activation onward.",
                "type": "boolean"
              },
              "revision": {
                "description": "Positive bigint string returned by recorded_state. Preserve as text.",
                "type": "string"
              },
              "series_id": {
                "description": "Exact definition ID from the catalog.",
                "type": "string"
              },
              "to": {
                "description": "Latest period, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Reviewed economic data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ac2132eb029db7b2e1869e4aefdf766c1d0db97edd3bfb9a53159a487f0b352b"
