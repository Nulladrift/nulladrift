      "serverInfo": {
        "name": "stackrates",
        "title": "StackRates VPS prices",
        "version": "1.8.0",
        "websiteUrl": "https://stackrates.ai/",
        "icons": [
          {
            "src": "https://stackrates.ai/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
