        {
          "name": "search_vps_plans",
          "title": "Search VPS plans",
          "description": "Cheapest VPS plans matching a size, budget, provider or location (one per provider unless exactly one provider is given), in groups, each cheapest first: prices confirmed for the location, then prices not confirmed there, then plans with a Windows license in the price unless windows is set. A location lists no dedicated server unless dedicated is set. Marked rows say why in `marks`.",
          "inputSchema": {
            "properties": {
              "dedicated": {
                "description": "Dedicated servers (whole machines) instead of VPS plans.",
                "type": "boolean"
              },
              "limit": {
                "description": "1-20, default 8.",
                "type": "number"
              },
              "location": {
                "description": "Country, city or region slug, e.g. usa, germany, india, frankfurt, new-york, europe, asia, austria, vienna, helsinki, zurich.",
                "type": "string"
              },
              "managed": {
                "description": "Managed hosting (Cloudways, Kinsta) instead of unmanaged servers.",
                "type": "boolean"
              },
              "max_usd_month": {
                "description": "Maximum monthly price in USD.",
                "type": "number"
              },
              "min_disk_gb": {
                "description": "Minimum disk in GB.",
                "type": "number"
              },
              "min_ram_gb": {
                "description": "Minimum memory in GB (0.5 for 512 MB).",
                "type": "number"
              },
              "min_transfer_tb": {
                "description": "Minimum included monthly transfer in TB.",
                "type": "number"
              },
              "min_vcpu": {
                "description": "Minimum vCPU count.",
                "type": "number"
              },
              "no_commitment": {
                "description": "The same as term 1 (kept for older callers).",
                "type": "boolean"
              },
              "providers": {
                "description": "Provider slugs, e.g. hetzner, digitalocean, vultr, akamai-linode, aws-lightsail, ovhcloud, contabo, netcup.",
