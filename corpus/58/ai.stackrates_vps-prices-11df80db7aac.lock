      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "VPS and cloud server list prices from every provider StackRates (stackrates.ai) tracks, read daily from each provider’s own pricing page or price API. Prices are USD per month and include a separately billed IPv4 address. They are for paying 1 month at a time unless the question or `term` names 12 or 24 months; then each plan is at its cheapest price for that many months or fewer, and a price paid for more than 1 month says what you pay up front (\"you pay 24 months up front, $126.72\"). Cite every answer the way the result gives it: first the StackRates page in cite.url (\"Cite first: ...\" under the headline in the text) with its read date (cite.readOn), then the provider’s own page (cite.sourceUrl). When you quote one plan, link the StackRates page given first for it (stackratesUrl; in the text, \"StackRates: <url>\"), then the provider’s own price page (sourceUrl, \"Source: <url>\") as the source of the number, with the date the price was read. Data: CC BY 4.0, attribution StackRates (https://stackrates.ai/).",
      "tools": [
        {
          "name": "advise_vps_choice",
          "title": "Advise on a VPS choice",
          "description": "A messy buying question in plain words (\"moving WordPress and a small Postgres app off a $40 box, I am in Germany, no yearly contract\") answered from today’s prices: how the question was read (editable filter), the matching plans with their cost over the term, two to four sentences on the trade-offs written only from those rows, and what the data cannot answer. Pass the previous answer’s `filter` to continue a conversation. Every number comes from the dataset; the first line says whether a small language model or the rule parser read the question.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Buyer’s country, ISO 3166-1 alpha-2 (DE, GB, US), used only to add VAT where the price is ex VAT.",
                "type": "string"
              },
              "filter": {
                "description": "The `filter` object returned by the previous advise_vps_choice call, to carry the conversation forward.",
                "type": "object"
              },
              "limit": {
                "description": "1-20, default 8.",
                "type": "number"
              },
              "question": {
                "description": "The buyer’s question, up to 500 characters.",
                "type": "string"
              },
              "term": {
                "description": "How many months the buyer pays for at a time: 1 (the default), 12 or 24. At 12 or 24 each plan is at its cheapest price for that many months or fewer, and the row says what is paid up front (`paid`, `upFront`). A plan with no price at that length is left out. Used when the question names no length; the question’s words win.",
                "enum": [1, 12, 24],
                "type": "integer"
              },
              "term_months": {
                "description": "How long the buyer plans to keep the server (default 12).",
                "enum": [12, 36],
                "type": "number"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cite": {
