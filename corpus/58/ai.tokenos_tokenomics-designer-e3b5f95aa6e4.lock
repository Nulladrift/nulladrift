      },
      "instructions": "Use when the user asks for a tokenomics template, token distribution, allocation percentages, a vesting schedule or unlock calculator, or how much supply is circulating at month N. Pick the closest preset, or pass custom allocations that total 100%. Describe warnings constructively.",
      "tools": [
        {
          "name": "design_tokenomics",
          "title": "Design tokenomics",
          "description": "Build a full allocation + vesting model with a 48-month circulating-supply schedule, FDV / initial market cap and sanity warnings.",
          "inputSchema": {
            "properties": {
              "allocations": {
                "description": "Custom allocation buckets (must total 100%)",
                "items": {
                  "properties": {
                    "bucket": {
                      "type": "string"
                    },
                    "cliff_months": {
                      "type": "integer"
                    },
                    "pct": {
                      "type": "number"
                    },
                    "tge_unlock_pct": {
                      "description": "% of the bucket liquid at launch",
                      "type": "number"
                    },
                    "vesting_months": {
                      "description": "Linear vesting duration after the cliff",
                      "type": "integer"
                    }
                  },
                  "required": ["bucket", "pct"],
                  "type": "object"
                },
                "type": "array"
              },
              "launch_price_usd": {
                "description": "Optional launch price to compute FDV and initial market cap",
                "type": "number"
              },
              "name": {
                "description": "Token name or ticker",
                "type": "string"
              },
              "preset": {
                "description": "Starting template (default defi)",
                "enum": ["defi", "gaming", "meme", "infra", "dao", "custom"],
                "type": "string"
              },
              "total_supply": {
                "description": "Total supply (default 1,000,000,000)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Design tokenomics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/tokenos-tokenomics.html",
            "openai/resultCanProduceWidget": true,
            "openai/toolInvocation/invoked": "Tokenomics ready",
            "openai/toolInvocation/invoking": "Modelling the token economy",
            "openai/widgetAccessible": false,
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/tokenos-tokenomics.html",
              "visibility": ["model"]
            }
          },
          "digest": "sha256:7b590598770ca16d9c52408aa8565a8884b082a8988f0ec875318a74126c4e82"
        },
        {
          "name": "vesting_schedule",
          "title": "Calculate a vesting schedule",
          "description": "Month-by-month unlock table for one allocation given TGE unlock %, cliff and linear vesting months.",
          "inputSchema": {
            "properties": {
              "cliff_months": {
                "type": "integer"
              },
