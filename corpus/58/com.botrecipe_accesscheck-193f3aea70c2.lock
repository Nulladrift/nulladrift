{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/accesscheck": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://accesscheck.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-access-check",
        "title": "Agent Access Check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "One call tells your AI agent whether a website will block it (bot challenges, CAPTCHAs, robots.txt rules for GPTBot, ClaudeBot and others) and where the site's agent door is: llms.txt, MCP, or OpenAPI. Free 50 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "check_agent_access",
          "description": "Before an agent browses or fetches a site, check if it will get in. Fetches the URL as an AI agent and as a browser, detects bot challenges (CAPTCHAs, DataDome, PerimeterX and other bot walls), reads robots.txt rules for GPTBot/ChatGPT-User/ClaudeBot/Claude-User/PerplexityBot and others, and looks for agent doors (llms.txt, MCP, OpenAPI). Returns verdict: open | challenged | blocked | robots_disallowed | unreachable, plus advice. Read-only. Use it before an automated web task, not for pages you already fetched successfully.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Page or domain, e.g. https://example.com/pricing",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f99ea047671466d26835a207bea4472bd492464d1bdcbd72b0909ba11abdd4c"
        },
        {
          "name": "check_many",
          "description": "Run check_agent_access on up to 10 URLs at once (counts as 1 call). Use it to pick which sources an agent can actually use.",
          "inputSchema": {
            "properties": {
              "urls": {
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ea5731e8f378ffc06c4b51f6e7f91632b1e41fc67ff06ebb893e265b4648abb1"
        },
        {
          "name": "find_agent_alternative",
          "description": "Find a machine-friendly way into a site instead of scraping its HTML: llms.txt, /.well-known/mcp.json, agents.json, openapi.json, ai-plugin.json, and MCP URLs listed in llms.txt. Read-only.",
          "inputSchema": {
            "properties": {
              "url": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5c78269cd7c84a914d5c16ecb2a3033429f0e5ceead0335a5ce3ad31e86c93bf"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $9/month upgrade link. Free tier: 50 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e5d8e6e650efaef1a182c6ee31561044f3d244d61647ca3fb50d9a374bc87c5d"
        }
      ],
      "digest": "sha256:581e6c5617a5793fbcc4152eb8ffa990eaf443fb0d44d6e98ac1f6bef1ca5392"
    }
  }
