      "serverInfo": {
        "name": "spickme",
        "title": "Spick Me — Swiss public transport",
        "version": "0.1.0",
        "description": "Swiss trains, buses, boats: journeys with punctuality, live delays, museums, where to meet, PDFs",
        "websiteUrl": "https://spickme.ch/ai",
        "icons": [
          {
            "src": "https://spickme.ch/icon-192.png",
