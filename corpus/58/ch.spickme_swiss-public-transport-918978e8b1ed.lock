        {
          "name": "museums_to_visit",
          "title": "Museums reachable by public transport while they are open",
          "description": "List the museums and galleries in Switzerland that can be reached by public transport from one place within a travel budget, each with the minutes to its door (the walk from the stop included), that day's opening hours, and whether a visit of the length asked for fits before it closes.\n\nUse it for \"which museums can I visit from Bern this afternoon\", \"a rainy-day museum within an hour of Zürich\", \"an art museum near Lausanne open on Monday\", or \"what is there to see from Olten in two hours\". For the journey to one museum, use plan_journey with its address; for a day with several stops, plan_day_out. The answer's open_url opens the same question on spickme.ch's museums page, and each museum's plan_url opens the visit as a day out there and back, to change and share.\n\nInputs: from is A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. departure is when to leave: Swiss local time in ISO 8601, e.g. \"2026-09-26T08:00\"; an explicit offset or Z is converted. A bare \"08:00\" means today (tomorrow if it has long passed). Omit for now. visit_minutes is the time wanted inside (10–360, default 50). max_minutes is the most travel time to the door (5–360, default 90). kinds narrows to art, gallery, history, science, technology, museum (general) or other. limit is how many to list (1–60, default 15). lang is the language of the museums' names (de, fr, it or en; default the name in the language of the place).\n\nEach museum has a status: \"fits\" (open when you arrive, or opens later, with the whole visit before closing), \"short\" (open, but not for the whole visit; closes is given), \"closed\" (closed by then, that day or that season), or \"hours_unknown\" (no source publishes its hours as data, which is most museums; its website is given). Listed fits first, then hours_unknown, short and closed; within each, museums of national importance first, then the nearest. Times are planned timetable times; live delays are not included. The museum records are CC BY-SA 4.0; their source and licence are in data.museums.\n\nExample: {\"from\": \"Bern\", \"departure\": \"2026-09-26T13:00\", \"visit_minutes\": 90, \"max_minutes\": 60, \"kinds\": [\"art\"]}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "departure": {
                "description": "When to leave. Omit for now.",
                "type": "string"
              },
              "from": {
