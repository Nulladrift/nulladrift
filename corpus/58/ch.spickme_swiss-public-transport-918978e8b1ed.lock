        {
          "name": "plan_day_out",
          "title": "Plan a day out with several stops in Switzerland",
          "description": "Plans a multi-stop day with a stay at each stop, timing each leg from when the previous stay ends: the train there, the hours somewhere, the connection on, and the way home.\n\nUse it for \"a day trip from Bern to Grindelwald with four hours hiking, then dinner in Interlaken\", \"visit Thun, Spiez and Interlaken today\", or an evening out and back. For a single A-to-B trip, use plan_journey.\n\nInputs: start is A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. stops is the list of places in order (1–12), each with stay_minutes (default 120; 0 means pass through without stopping) or leave_at (\"HH:MM\", move on at that time — a night away works: the next such time), and an optional note. end defaults to start, which makes it a round trip. max_transfers caps the changes on each stretch. bicycle: true keeps to rides that carry bicycles; avoid_tilting: true keeps off tilting trains. Both are rules for the search, so it finds the connection that keeps them rather than striking trains out of the usual answer. departure is when the day starts: Swiss local time in ISO 8601, e.g. \"2026-09-26T08:00\"; an explicit offset or Z is converted. A bare \"08:00\" means today (tomorrow if it has long passed). Omit for now.\n\nEach leg comes with a picture_url that opens an image of that connection, and the answer's open_url opens the whole day on spickme.ch, where a stay can be changed, the day re-planned for another date, and the plan shared. Each leg also carries its track record from the days before, as plan_journey's journeys do: on how many of them it ran smoothly, how punctual each train was where you get off, and how often each change was too short; punctuality sets how much of it (default \"summary\").\n\nExample: {\"start\": \"Bern\", \"stops\": [{\"place\": \"Grindelwald\", \"stay_minutes\": 240, \"note\": \"hike\"}, {\"place\": \"Interlaken Ost\", \"stay_minutes\": 90, \"note\": \"dinner\"}], \"departure\": \"2026-09-26T08:00\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "avoid_tilting": {
                "default": false,
                "description": "No tilting trains (the timetable's Neigezug note: on the 2026 timetable the IC5, IC51 and the ICN), for someone who feels sick in one; the search finds the connection without them.",
                "type": "boolean"
              },
              "bicycle": {
                "default": false,
                "description": "Only rides that carry bicycles: every train, bus or boat whose timetable notes say bicycles are not carried is avoided, and the search finds the connection that does without them. Rides where a bicycle needs a reservation or places are limited are kept.",
                "type": "boolean"
              },
              "departure": {
                "description": "When the day starts. Omit for now.",
                "type": "string"
              },
              "end": {
                "description": "Where the day ends; defaults to start.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "max_transfers": {
                "description": "The most changes of vehicle allowed on each stretch of the day; 0 for direct connections only.",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "punctuality": {
                "default": "summary",
                "description": "How much of the trains' record on past days to include. \"summary\" (default): for each ride, on how many of the last days (up to eight weeks) it was on time at the station you get off; for each change, on how many it left too little time to change; for each journey, on how many it ran smoothly — every change made and on time at the destination — and what spoiled the other days. \"days\": the same, and every day counted with its delay in seconds. \"off\": none of it.",
                "enum": ["summary", "days", "off"],
                "type": "string"
              },
              "start": {
                "description": "Where the day starts.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "stops": {
                "description": "The places to visit, in order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "leave_at": {
                      "description": "Move on at this time of day (\"HH:MM\") instead of after a length of stay; the next such time, so a night away works.",
                      "pattern": "^[0-2]?[0-9]:[0-5][0-9]$",
                      "type": "string"
                    },
                    "note": {
                      "description": "What the stay is for, e.g. \"lunch\"; shown in the answer.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "place": {
                      "description": "A place to visit.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "stay_minutes": {
                      "description": "How long to stay; 0 passes through. Default 120.",
                      "maximum": 20160,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["place"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "transfer_time_factor": {
                "description": "How much time to allow for changing trains, as a multiple of the timetable's minimum change times: 1 (default) is the timetable's own; 1.5 for luggage, children or reduced mobility; 0.7 for a fast walker. Between 0.5 and 3.",
                "maximum": 3,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "required": ["start", "stops"],
            "type": "object"
          },
          "outputSchema": {
