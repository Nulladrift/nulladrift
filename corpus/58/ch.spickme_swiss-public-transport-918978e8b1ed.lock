        {
          "name": "find_place",
          "title": "Find a station, stop, address or place in Switzerland",
          "description": "Look up what a place name means in the Swiss public-transport network: stations and stops, street addresses, and named places (a university, a museum, a mountain), ranked best first, each with a stable place_id.\n\nUse it when the user names a place you are not sure of, when another tool answered that a name is ambiguous, or to get coordinates for a place. You do not need it before plan_journey or departures for ordinary names — those tools accept names directly and say how they read them. A station or stop in Switzerland carries a page_url: its page on spickme.ch, with its departures, its lines and the places it reaches directly.\n\nInputs: query is A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. limit is how many candidates to return (1–10, default 5). near is an optional latitude/longitude that breaks ties between equally good matches.\n\nExample: {\"query\": \"Winterthur Spital\"} returns the stop \"Winterthur, Kantonsspital\" with its place_id, which you can pass to plan_journey as from or to.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many candidates to return, best first.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "additionalProperties": false,
                "description": "Where the user is, if known: prefers nearer matches among equally good ones.",
                "properties": {
                  "latitude": {
                    "description": "Decimal degrees north.",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "description": "Decimal degrees east.",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "query": {
                "description": "The name, address or coordinate to look up.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "candidates": {
                "items": {
                  "properties": {
                    "kind": {
                      "enum": ["station", "stop", "address", "street", "locality", "place", "coordinate"],
                      "type": "string"
                    },
                    "latitude": {
                      "type": "number"
                    },
                    "longitude": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "place_id": {
                      "type": "string"
                    }
                  },
                  "required": ["kind", "latitude", "longitude", "name", "place_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "data": {
                "type": "object"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["candidates", "data", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a station, stop, address or place in Switzerland"
