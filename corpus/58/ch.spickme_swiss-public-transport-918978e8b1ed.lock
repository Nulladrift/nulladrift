        {
          "name": "timetable_change",
          "title": "What changes at the December timetable change",
          "description": "List what changes in Swiss public transport at the timetable change in December, from a comparison of this year's published timetable with next year's: lines with more or fewer trips on a weekday, a Saturday or a Sunday, new and discontinued lines, stops added to or dropped from a line, first and last trips that move, direct connections between two stations that start or end or get quicker, stops that open, close or are renamed.\n\nUse it for \"what changes at Olten in December\", \"will the S24 still run next year\", \"what is new in canton Bern from 13 December\", \"does my bus 31 get more trips\". For the planned works of the coming weeks, use station_info; for a journey after the change, plan_journey with a date after it.\n\nInputs: give one or more of place (a station, stop or town: entries whose stops or communes include it), line (a line's label: \"S24\", \"31\"), canton (two letters: \"BE\", \"VD\"); with none, the largest changes in the country. limit is how many entries (1–50, default 12).\n\nAn operator whose lines are not in next year's file yet is listed in operators_not_yet_published, and its lines are left out rather than called discontinued; an entry marked uncertain may be a gap in next year's data. The comparison is redone every week until the change.\n\nExample: {\"place\": \"Olten\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "canton": {
                "description": "A canton's two letters: \"BE\", \"ZH\", \"VD\".",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 12,
                "description": "How many entries to list, the largest changes first.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "line": {
                "description": "A line's label, as on the vehicle: \"S24\", \"IC5\", \"31\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "place": {
                "description": "A station, stop or town whose changes to list.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "change_day": {
                "type": "string"
              },
              "compared_on": {
                "type": "string"
              },
              "data": {
                "type": "object"
              },
              "entries": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "operators_not_yet_published": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "page_url": {
                "format": "uri",
                "type": "string"
              },
              "total_matching": {
                "type": "integer"
              }
            },
            "required": ["data", "entries", "total_matching"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What changes at the December timetable change"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae144dabb1cd0afefc882ddc1409e63bc61a347d4515307eb9f147521d055cb3"
        },
        {
          "name": "travel_time_matrix",
          "title": "Public-transport travel times between many origins and destinations",
          "description": "Compute the public-transport travel time in minutes from each of several origins to each of several destinations in Switzerland, for one departure time. For comparing locations: which office site is best reached from where staff live, which flat has the shortest commutes, how well a venue is connected.\n\nUse it when there are several places on either side. For one pair with the actual connection, use plan_journey; for everywhere reachable, reachable_area. Each origin in the answer carries a reach_url: the places reachable from it, as a map on spickme.ch.\n\nInputs: origins and destinations are lists of places, each A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. (addresses and coordinates are snapped to their nearest stop, named in the answer). departure: Swiss local time in ISO 8601, e.g. \"2026-09-26T08:00\"; an explicit offset or Z is converted. A bare \"08:00\" means today (tomorrow if it has long passed). Omit for now. max_transfers caps changes.\n\nThe answer is minutes[i][j] from origins[i] to destinations[j], waiting for the first vehicle included, or null where no connection exists that day. A place that cannot be read (an ambiguous or unknown name) is left out of origins, destinations and minutes and listed in unresolved with its candidates; the rest is answered. Planned timetable; live delays are not included.\n\nExample: {\"origins\": [\"Winterthur\", \"Baden\", \"Zug\"], \"destinations\": [\"Zürich HB\", \"Zürich Oerlikon\"], \"departure\": \"2026-09-28T07:30\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "departure": {
                "description": "When to leave. Omit for now.",
                "type": "string"
              },
              "destinations": {
                "description": "Where each column of the matrix ends.",
                "items": {
                  "description": "A destination.",
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "max_transfers": {
                "description": "The most changes of vehicle allowed.",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "origins": {
                "description": "Where each row of the matrix starts.",
                "items": {
                  "description": "An origin.",
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "transfer_time_factor": {
                "description": "How much time to allow for changing trains, as a multiple of the timetable's minimum change times: 1 (default) is the timetable's own; 1.5 for luggage, children or reduced mobility; 0.7 for a fast walker. Between 0.5 and 3.",
                "maximum": 3,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "required": ["destinations", "origins"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "type": "object"
              },
              "departure": {
                "type": "string"
              },
              "destinations": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "minutes": {
                "items": {
                  "items": {
                    "type": ["integer", "null"]
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "origins": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "unresolved": {
                "description": "Places that could not be read and are left out of origins, destinations and minutes: each with argument (\"origins\" or \"destinations\"), index (its position in the call), query, kind, message and, for an ambiguous name, candidates with their place_ids.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["data", "destinations", "minutes", "origins"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Public-transport travel times between many origins and destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64bd4dc7a1708972c6422eee138ea5429f0bb4d32b3654ebc22d7f1a0dfa259d"
        }
