      "instructions": "Spick Me plans public transport in Switzerland — trains, trams, buses, boats and mountain railways — over the official Swiss timetable.\n\n- plan_journey: connections between two places, including \"the next trains from A to B\". It reads stations, addresses and landmarks as people write them, says how it read each one, and gives departure and arrival times, lines, changes and platforms. A departure board names only each train's final destination, so a question with a destination is plan_journey's, or departures' with to.\n- departures: what leaves one station; with to, only what calls at that station later, with the arrival time there. plan_day_out: a day with several stops and a stay at each. reachable_area: everywhere within a time budget. travel_time_matrix: minutes from many origins to many destinations. museums_to_visit: the museums reachable within a travel budget, with that day's opening hours and whether a visit fits before closing. meeting_point: where two to ten people starting from different places should meet, fairest and least travel. last_way_home: the last connection home tonight, and what runs after one in the morning. station_info: a station's lines with each line's timetable as a PDF, its planned changes (works, replacement buses) and how its connections have held. line_info: one line's stops, how often it runs on each kind of day, and its whole timetable as a PDF. timetable_change: what changes at the December timetable change for a station, a line or a canton. find_place: what a name means, as place_ids the other tools take.\n- An ambiguous name comes back as a list of candidates rather than a guess; any candidate's place_id can be passed back.\n- All times are planned timetable times with their Swiss offset. plan_journey and departures take live: true for the live data beside them: each ride's delay in minutes, whether it is cancelled, and the operators' notices; a live journey is routed around cancelled trains. Without it, live delays and cancellations are not included.\n- Every journey from plan_journey and plan_day_out carries its track record from the days before, up to eight weeks, recorded from live data: on how many days it ran smoothly — every change made and on time at the destination — and what happened on the others; for each ride, on how many days that train was on time (less than 3 minutes late) where the ride ends and how late it usually is; for each change, on how many days it left less time than the timetable reckons. It is a record of past days, not a forecast; punctuality: \"days\" adds every day's delay, \"off\" leaves it out.\n- The text of every answer is complete on its own: every connection found, in order of departure, each marked direct or with its number of changes, with times, lines and the platform to leave from. Some hosts draw a picture of the connection under plan_journey and plan_day_out answers and can report it as drawn when it failed to load, so the picture is an addition to the text, not a substitute for it.\n- Every journey carries a picture_url: a ready-made image of the connection that opens in any browser, for looking at or sharing.\n- Every answer carries a link to the same question on spickme.ch: open_url opens the connections with their live delays, the station's live board, the reachable area as a map, or the day out ready to change and share; a station's page_url is its page, with its departures and the places it reaches directly.\n- When the timetable has no connection, the answer says so in as many words; nothing in it is filled in from elsewhere.\n- Every answer names its data sources in its attribution field and its last line.",
      "tools": [
        {
          "name": "departures",
          "title": "Departure board for a Swiss station or stop",
          "description": "List the next departures from one station or stop, as the board on the platform would: time, line, direction, platform, kind of vehicle, and the next stops it calls at.\n\nUse it for \"what leaves from Bern in the next hour\", \"when is the next tram from Bellevue\", or to see how often a place is served. With to, it lists only what calls at that station later, each with its arrival time there — \"trains from Olten to Zürich HB\" — including trains whose destination is further on. For connections that may need a change, or door to door, use plan_journey. The answer's open_url opens the station's live board on spickme.ch.\n\nInputs: station is A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. If it is an address or coordinate, the nearest stop is used and named in the answer. to (optional) is a station the departures must call at, read the same way. time is when the board starts; Swiss local time in ISO 8601, e.g. \"2026-09-26T08:00\"; an explicit offset or Z is converted. A bare \"08:00\" means today (tomorrow if it has long passed). Omit for now. limit is how many departures (1–40, default 12).\n\nTimes are planned timetable times with their Swiss offset. With live: true each departure carries live: its delay in minutes and whether it is cancelled, and the answer the operators' notices about it.\n\nExample: {\"station\": \"Luzern\", \"time\": \"2026-09-26T17:30\", \"limit\": 8}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 12,
                "description": "How many departures to list.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "live": {
                "default": false,
                "description": "Ask the live data too: delays in minutes, cancellations and the operators' notices beside the timetable times, from the realtime data at the moment of asking. Takes a little longer; use it for a journey or a departure within the next few hours.",
                "type": "boolean"
              },
              "station": {
                "description": "The station or stop whose board to show.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "time": {
                "description": "When the board starts. Omit for now.",
                "type": "string"
              },
              "to": {
                "description": "Only departures that call at this station later, with their arrival there.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["station"],
            "type": "object"
          },
