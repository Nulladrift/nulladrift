        {
          "name": "plan_journey",
          "title": "Plan a public-transport journey in Switzerland",
          "description": "Find the best connections by train, tram, bus, boat and mountain railway between two places in Switzerland, over the official Swiss timetable. Door to door: an address or a named place works as well as a station, and the walk to and from the nearest stops is included.\n\nUse it for \"how do I get from A to B\", \"the next connections from Olten to Zürich\", \"when is the next train to …\", \"I need to be in Bern by 9\" — it gives departure and arrival times, changes and platforms. Prefer it to the departure board for any question with a destination. Every journey comes with a picture_url: a link that opens a ready-made image of the connection, for looking at or sharing. The answer's open_url opens the same search on spickme.ch, where the connections are shown with their live delays.\n\nInputs: from and to are each A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. Give departure (leave at or after) or arrival (be there by), not both; with arrival, the answer also brings the first connection arriving up to 30 minutes after it, for a user who said \"around\"; both are Swiss local time in ISO 8601, e.g. \"2026-09-26T08:00\"; an explicit offset or Z is converted. A bare \"08:00\" means today (tomorrow if it has long passed). Omit for now. via is up to three stations or stops the journey must pass through (then one best journey is returned); to stop somewhere on the way, use plan_day_out. max_transfers caps the number of changes (0 = direct only). bicycle: true keeps to rides that carry bicycles; avoid_tilting: true keeps off tilting trains. Both are rules for the search, so it finds the connection that keeps them rather than striking trains out of the usual answer. limit is how many alternatives to return (1–8, default 4). punctuality says how much of the trains' past record to include (default \"summary\").\n\nEvery journey also carries its track record from the days before (up to eight weeks): track_record says on how many of them it ran smoothly — every change made and on time at the destination — and what happened on the others; each ride's punctuality says on how many days that train was on time (less than 3 minutes late) where you get off and how late it usually is; each change_after says on how many days the change left less time than the timetable reckons for it. These are past days, recorded from live data, not a forecast.\n\nAll times are planned timetable times with their Swiss offset. With live: true, the connections are routed on the realtime data (a cancelled ride is avoided, an added one used) and each ride carries live: its departure and arrival delay in minutes, whether it is cancelled, and the operators' notices about the stations ridden past; the journey's live gives the delay at the destination.\n\nExample: {\"from\": \"Winterthur\", \"to\": \"Bern\", \"departure\": \"2026-09-26T07:00\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "arrival": {
                "description": "Arrive by this time. Give this or departure, not both.",
                "type": "string"
              },
              "avoid_tilting": {
                "default": false,
                "description": "No tilting trains (the timetable's Neigezug note: on the 2026 timetable the IC5, IC51 and the ICN), for someone who feels sick in one; the search finds the connection without them.",
                "type": "boolean"
