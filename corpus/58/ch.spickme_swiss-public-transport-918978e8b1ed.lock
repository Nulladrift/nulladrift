        {
          "name": "last_way_home",
          "title": "The last connection home tonight",
          "description": "Find the last public-transport connection tonight from where someone is to where they are going, the few before it, and what still runs after one in the morning (night trains and night buses), in Switzerland. When nothing goes tonight, the first connection after five in the morning.\n\nUse it for \"when is the last train from Zürich to Bern tonight\", \"how late can I stay in Lausanne and still get home to Vevey\", \"is there a night bus from Bellevue to Witikon on Saturday\". A plain plan_journey search asked for a late departure lists what leaves after it, and one asked to arrive by midnight misses the connection that leaves at 00:02; this tool asks the timetable the way the night needs. For any other time of day, use plan_journey.\n\nInputs: from is where the person is, to where they are going home to; each is A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. departure is the earliest they could leave: Swiss local time in ISO 8601, e.g. \"2026-09-26T08:00\"; an explicit offset or Z is converted. A bare \"08:00\" means today (tomorrow if it has long passed). Omit for now. (\"the last train tonight\" from a dinner: the time the dinner might end, or omit for now). bicycle: true keeps to rides that carry bicycles; avoid_tilting: true keeps off tilting trains. Both are rules for the search, so it finds the connection that keeps them rather than striking trains out of the usual answer.\n\nThe regular service is taken to end at one in the morning, and the night at five: last is the latest connection leaving before one, earlier the three before it, after_1am everything leaving between one and five. When nothing leaves before one, the latest night connection is last. Connections that sit out the night at a station (a change of two hours or more) are left out. Times are planned timetable times with their Swiss offset; live delays and cancellations are not included.\n\nExample: {\"from\": \"Zürich HB\", \"to\": \"Bern\", \"departure\": \"2026-09-26T22:00\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "avoid_tilting": {
                "default": false,
                "description": "No tilting trains (the timetable's Neigezug note: on the 2026 timetable the IC5, IC51 and the ICN), for someone who feels sick in one; the search finds the connection without them.",
                "type": "boolean"
              },
              "bicycle": {
                "default": false,
                "description": "Only rides that carry bicycles: every train, bus or boat whose timetable notes say bicycles are not carried is avoided, and the search finds the connection that does without them. Rides where a bicycle needs a reservation or places are limited are kept.",
                "type": "boolean"
              },
              "departure": {
                "description": "The earliest they could leave. Omit for now.",
                "type": "string"
              },
              "from": {
                "description": "Where the person is now, or will be when they leave.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "description": "Where they are going home to.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "after_1am": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "data": {
                "type": "object"
              },
              "earlier": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "earliest_departure": {
                "type": "string"
              },
              "first_in_the_morning": {
                "type": ["object", "null"]
              },
              "from": {
                "type": "object"
              },
              "last": {
                "type": ["object", "null"]
              },
              "open_url": {
                "format": "uri",
                "type": "string"
              },
              "to": {
                "type": "object"
              }
            },
            "required": ["after_1am", "data", "earlier", "from", "last", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The last connection home tonight"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5137ebd437dcac6a2dabd7421a68305ec94ca410ae36a42dd939de7d56d88fbe"
        },
        {
          "name": "line_info",
          "title": "A line's stops, how often it runs, and its timetable as a PDF",
          "description": "Describe one public-transport line in Switzerland — a train (S24, IC5, RE33), a tram or bus line (tram 11, bus 31), a boat or a mountain railway — by its directions and the stops of each with the minutes to them, how many trips it makes on a working day, a Saturday and a Sunday with the first, the last and how often it runs, and its page and whole timetable as a PDF to print or save.\n\nUse it for \"where does the S24 go\", \"how often does tram 11 in Zürich run on Sundays\", \"when is the first and last IC5\", \"give me the timetable of the S6 as a PDF\". For a station's lines and works, station_info; for a journey, plan_journey.\n\nInputs: line is the line's label as on the vehicle or the board (\"S24\", \"IC 5\", \"11\", \"Bus 31\"). near narrows a label used in several places: a station or town it calls at, A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. Without near, the busiest line of that label is described and the others are listed with their towns.\n\nThe days are read from the published timetable for the four weeks from today, each kind of day from an ordinary one of them; times are planned.\n\nExample: {\"line\": \"S24\", \"near\": \"Zug\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "line": {
                "description": "The line's label, as on the vehicle or the board: \"S24\", \"IC5\", \"11\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "near": {
                "description": "A station or town the line calls at, for a label used in several places.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["line"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "type": "object"
              },
              "days": {
                "type": "object"
              },
              "directions": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "line": {
                "type": "object"
              },
              "other_lines_with_this_label": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "page_url": {
                "format": "uri",
                "type": "string"
              },
              "timetable_pdf_url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["data", "days", "directions", "line", "page_url", "timetable_pdf_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A line's stops, how often it runs, and its timetable as a PDF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:160ec3047d5967c3c8ca6d0d7a115842a89c490b8aa55bf957417b8b81f9e8fe"
        },
        {
          "name": "meeting_point",
          "title": "Where a group should meet, by public transport",
          "description": "Suggest railway stations in Switzerland where two to ten people starting from different places can meet by public transport, each with every person's travel time. Two rankings: fairest (the longest journey as short as it can be, and nobody travelling much longer than the others) and least_travel (everybody's minutes added up, keeping to places in between). Well-connected stations get a small bonus, and the suggestions are spread out rather than five suburbs of one town.\n\nUse it for \"where should I meet my friend from Basel if I'm in Chur\", \"a good place for the four of us from Bern, Luzern, Zürich and Basel to meet for lunch\", \"halfway between Geneva and Lausanne\". For the travel times between given places, use travel_time_matrix; for the journey to the place chosen, plan_journey. Each suggestion carries plan_urls, one per person, opening their connections to it on spickme.ch; with two people, open_url opens the meet page with a map.\n\nInputs: people is the list of starting places in any order (2–10), each A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. departure is when everybody leaves: Swiss local time in ISO 8601, e.g. \"2026-09-26T08:00\"; an explicit offset or Z is converted. A bare \"08:00\" means today (tomorrow if it has long passed). Omit for now. limit is how many suggestions per ranking (1–8, default 5). max_transfers caps changes.\n\nMinutes are from the departure to the arrival at the meeting station, waiting for the first vehicle included, on that day's planned timetable; live delays are not included. A person's own station is never suggested.\n\nExample: {\"people\": [\"Basel\", \"Chur\"], \"departure\": \"2026-09-26T09:00\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "departure": {
                "description": "When everybody leaves. Omit for now.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many suggestions per ranking.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "max_transfers": {
                "description": "The most changes of vehicle allowed.",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "people": {
                "description": "Where each person starts, 2 to 10 places.",
