        {
          "name": "reachable_area",
          "title": "Everywhere reachable by public transport within a time budget",
          "description": "List every station and stop in Switzerland reachable from one place within a number of minutes by public transport, nearest first, with the earliest arrival at each.\n\nUse it for \"where can I get to from Bern in 45 minutes\", \"which towns are within an hour's commute of Zug\", catchment areas and isochrones. For the travel time between specific places, use travel_time_matrix; for how to make a particular journey, plan_journey. The answer's open_url opens the area as a map on spickme.ch, with every place reached and a picture of it to share.\n\nInputs: from is A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. (an address or coordinate is snapped to its nearest stop, which the answer names). departure is when to leave: Swiss local time in ISO 8601, e.g. \"2026-09-26T08:00\"; an explicit offset or Z is converted. A bare \"08:00\" means today (tomorrow if it has long passed). Omit for now. max_minutes is the time budget (default 60), waiting for the first vehicle included. limit is how many places to list (default 50). max_transfers caps changes. include: [\"museums\"] also lists the museums reachable in the same time, with that day's hours where known (museums_to_visit has the full question, with a visit length).\n\nMinutes are timetable minutes from the departure time given, on that day's planned timetable; live delays are not included.\n\nExample: {\"from\": \"Bern\", \"departure\": \"2026-09-28T07:30\", \"max_minutes\": 45}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "departure": {
                "description": "When to leave. Omit for now.",
                "type": "string"
              },
              "from": {
                "description": "Where to start.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "include": {
                "description": "Things to do within the same budget, listed beside the places: \"museums\" adds the museums and galleries reachable, nearest first, each with that day's hours where known.",
                "items": {
                  "enum": ["museums"],
