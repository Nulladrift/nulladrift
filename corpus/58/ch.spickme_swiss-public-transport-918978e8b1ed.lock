        {
          "name": "station_info",
          "title": "A station's lines, planned changes and connections",
          "description": "Describe one station or stop in Switzerland as its page on spickme.ch does: the lines that call there, each with its page and its whole timetable as a PDF to print; the planned changes of the coming weeks (works, a replacement bus and the stop it leaves from, departures that do not run, end early or leave at another minute, extra departures, holidays that run as a Sunday); and the connections the timetable builds there, line to line, with the minutes allowed, what missing one costs, and how often each held over the last weeks.\n\nUse it for \"are there any works at Olten next week\", \"is the train replaced by a bus this weekend\", \"which lines stop at Bern, Wankdorf\", \"can I get a PDF timetable of the S24\", \"does the change from the IR to the bus in Langnau usually work\". For what leaves in the next hour, use departures; for a journey, plan_journey; for one line's stops and how often it runs, line_info.\n\nInputs: station is A station or stop name (\"Zürich HB\", \"Bern\", \"Lausanne, Flon\"), an address (\"Bahnhofplatz 1, Winterthur\"), a named place (\"ETH Zürich\", \"Kunsthaus Zürich\"), a town's name in English, French or Italian (\"Geneva\", \"Lucerne\"), a coordinate as \"geo:47.3769,8.5417\", or a place_id returned by find_place (\"stop:8503000\"). Names are read the way a rider types them; an ambiguous name returns candidates instead of a guess. (an address or coordinate is taken to its nearest station). date is the first day the planned changes are read from: Swiss local time in ISO 8601, e.g. \"2026-09-26T08:00\"; an explicit offset or Z is converted. A bare \"08:00\" means today (tomorrow if it has long passed). Omit for now. lines is how many lines to list, busiest first (1–80, default 25).\n\nThe planned changes are the published timetable's, compared with an ordinary week; live disruptions are not in them (departures with live: true has those). The connections' record is of past days, recorded from live data, not a forecast.\n\nExample: {\"station\": \"Olten\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The first day to read planned changes from. Omit for today.",
                "type": "string"
              },
              "lines": {
                "default": 25,
                "description": "How many lines to list, busiest first.",
                "maximum": 80,
                "minimum": 1,
                "type": "integer"
              },
              "station": {
                "description": "The station or stop.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["station"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "connections": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "data": {
                "type": "object"
              },
              "lines": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "page_url": {
                "format": "uri",
                "type": "string"
              },
              "planned_changes": {
                "type": "object"
              },
              "station": {
                "type": "object"
              }
            },
            "required": ["connections", "data", "lines", "planned_changes", "station"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A station's lines, planned changes and connections"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
