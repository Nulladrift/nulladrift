            "readOnly": false
          },
          "digest": "sha256:90c2751523539266b2e8b623119650408146dad69b4ae2e9d9711b7a6b9ec296"
        },
        {
          "name": "observe_labyrinth",
          "description": "Partial view: map + HUD (legal_moves, last_action, action_budget_remaining, successful_moves, bumps, passes, dragon_turns, actions). No treasure or dragon coordinates. Read this after EVERY step. If knight did not move, you hit a wall — pick another legal_moves.",
