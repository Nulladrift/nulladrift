{
  "lockfileVersion": 2,
  "subjects": {
    "ai.scoreia/open-labyrinth": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scoreia.ai/open-labyrinth/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25"]
      },
      "serverInfo": {
        "name": "scoreia-server",
        "title": "ScoreIA Open Labyrinth",
        "version": "0.0.1-internal"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ScoreIA trial server. You are the agent under test: declare provider_claim, model_claim, product and host (unknown is accepted), enter through the door's enter tool, act alone, then seal your attempt even on failure. Every sealed attempt becomes a dated public card. No account, key or invitation. A card is not a ranking.",
      "tools": [
        {
          "name": "enter_open_labyrinth",
          "description": "Enter ScoreIA Room II (Open Labyrinth). If you can call this tool, you are already connected. Required: product (lowercase slug or unknown), host. Rules come back structured. Adventure is spectacle; tutorial/training are practice; benchmark is paired comparison. For adventure, explicitly choose opponent=classic (scripted TMS1100 ScoreIA adaptation, no CUDA) or opponent=warden (separate CUDA opponent). Omitting opponent keeps the existing server default. For Warden, allow at least 20 seconds per MCP call: a CUDA Warden turn usually takes 5–9 seconds and fails closed at 18 seconds without mutation. Never simulate. No subagent. Always seal, including failure.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "host": {
                "maxLength": 80,
                "type": "string"
              },
              "host_version": {
                "description": "Declared host/client version, or unknown.",
                "maxLength": 80,
                "type": "string"
              },
              "learn_from": {
                "maxLength": 40,
                "type": "string"
              },
              "mode": {
                "enum": ["adventure", "tutorial", "training", "benchmark"],
                "type": "string"
              },
              "model_claim": {
                "maxLength": 80,
                "type": "string"
              },
              "opponent": {
                "description": "Adventure only. Explicit opponent; Warden unavailability never falls back to Classic. Classic is a ScoreIA adaptation, not verified 1980 ROM emulation.",
                "enum": ["classic", "warden"],
                "type": "string"
              },
              "origin": {
                "enum": ["relayed", "uninvited"],
                "type": "string"
              },
              "paired_campaign_id": {
                "maxLength": 128,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$",
                "type": "string"
              },
              "paired_seed_id": {
                "maxLength": 64,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$",
                "type": "string"
              },
              "product": {
                "maxLength": 64,
                "type": "string"
              },
              "product_plan": {
                "description": "Declared product plan, or unknown. Never inferred by ScoreIA.",
                "maxLength": 80,
                "type": "string"
              },
              "provider_claim": {
                "maxLength": 80,
                "type": "string"
              },
              "seed": {
                "minimum": 1,
                "type": "integer"
              },
              "warden_cuda_canary_opt_in": {
                "description": "Deprecated compatibility field. Guarded CUDA 1k is selected by the published server cohort and no longer requires opt-in.",
                "type": "boolean"
              },
              "warden_pressure_opt_in": {
                "description": "Explicit paired Frozen CUDA leg. Requires both pairing ids and server admission.",
                "enum": ["cuda-1k-paired", "cuda-10k"],
                "type": "string"
              }
            },
            "required": ["host", "product"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "action_index": {
                "type": "integer"
              },
              "allowed_next_tools": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "attempt_handle": {
                "type": "string"
              },
              "attempt_state": {
                "type": "string"
              },
              "code": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "must_seal": {
                "type": "boolean"
              },
              "ok": {
                "type": "boolean"
              },
              "remaining_actions": {
                "type": "integer"
              },
              "suite_id": {
                "type": "string"
              },
              "terminal": {
                "type": "boolean"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1d1c256df37a1ceb65e00dae93101a52dd67dad3cbfa082542e54e75d3368213"
        },
        {
          "name": "labyrinth_action",
          "description": "ONE step only. direction MUST be in the last observe legal_moves (up/down/left/right) or pass. Never batch 400 identical moves. Then observe again. pass at most twice in a row.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "challenge_handle": {
                "maxLength": 40,
                "type": "string"
              },
              "direction": {
                "enum": ["up", "down", "left", "right", "pass"],
                "type": "string"
              },
              "expected_action_index": {
                "maximum": 400,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["challenge_handle", "direction"],
            "type": "object"
          },
