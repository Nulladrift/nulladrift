      "tools": [
        {
          "name": "find_books_by_mood",
          "title": "Find books by mood",
          "description": "Find books in the ShelfClub catalog by mood, vibe, pace and genre tags. At least one tag is needed. Books that carry every requested tag are listed first, most read first; when there are fewer of those than asked for, books that carry some of the tags follow, and `matchAll` says how many of the books returned carry every tag. Each book is returned with its own tags. Returns up to 10 books, each with its ShelfClub id, authors, description, reader rating, series and shelfclub.app link. The tags are machine-generated, or voted for by at least three readers of the book.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "genres": {
                "default": [],
                "items": {
                  "enum": ["science-fiction", "fantasy", "romance", "mystery", "thriller", "horror", "historical-fiction", "literary-fiction", "young-adult", "childrens", "graphic-novel", "poetry", "biography-memoir", "history", "science-nature", "self-help", "business", "true-crime", "religion-spirituality"],
                  "type": "string"
                },
                "maxItems": 19,
                "type": "array"
              },
              "limit": {
                "default": 5,
                "description": "How many books to return.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "moods": {
                "default": [],
                "description": "How the book feels to read.",
                "items": {
                  "enum": ["cozy", "adventurous", "emotional", "dark", "hopeful", "romantic", "funny", "spicy"],
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "pace": {
                "description": "How quickly the story moves.",
                "enum": ["fast", "medium", "slow"],
                "type": "string"
              },
              "vibes": {
                "default": [],
                "description": "The kind of reading experience.",
                "items": {
                  "enum": ["beach-read", "page-turner", "literary", "thought-provoking", "atmospheric", "character-driven", "plot-driven", "slow-burn", "epic", "comfort-read"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "books": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "authors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "averageRating": {
                      "description": "Reader rating out of 5.",
                      "type": ["number", "null"]
                    },
                    "description": {
                      "description": "From the catalog, cut to 600 characters.",
                      "type": ["string", "null"]
                    },
                    "genres": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "description": "The ShelfClub id of the book.",
                      "type": "string"
                    },
                    "moods": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "pace": {
                      "type": ["string", "null"]
                    },
                    "series": {
                      "type": ["string", "null"]
                    },
                    "seriesPosition": {
                      "type": ["number", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The book's page on shelfclub.app.",
                      "type": "string"
                    },
                    "vibes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["authors", "averageRating", "description", "genres", "id", "moods", "pace", "series", "seriesPosition", "title", "url", "vibes"],
                  "type": "object"
                },
                "type": "array"
              },
              "hasMore": {
                "description": "Whether more books carry these tags than were returned.",
                "type": "boolean"
              },
              "matchAll": {
                "description": "How many of `books`, counted from the first, carry every tag asked for. The books after them carry some of the tags.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "retryAfterSeconds": {
                "description": "With \"try_again_later\", when known: how long to wait.",
                "maximum": 3600,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "\"try_again_later\": the service was busy and looked nothing up, so the other fields are absent.",
                "enum": ["ok", "try_again_later"],
                "type": "string"
              },
              "tagProvenance": {
                "description": "Where the moods, vibes, pace and genres come from.",
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find books by mood"
          },
