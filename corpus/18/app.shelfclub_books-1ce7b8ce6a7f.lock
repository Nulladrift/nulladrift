                    "seriesPosition": {
                      "type": ["number", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The book's page on shelfclub.app.",
                      "type": "string"
                    },
                    "vibes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["authors", "averageRating", "description", "genres", "id", "moods", "pace", "series", "seriesPosition", "title", "url", "vibes"],
                  "type": "object"
