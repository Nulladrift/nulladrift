        {
          "name": "get_book",
          "title": "Get book details",
          "description": "Look up one book in the ShelfClub catalog, by its ShelfClub id or by ISBN. Returns its description, authors, reader rating, series, an edition (ISBN, page count, publisher, publication date, language), its shelfclub.app link, and its mood, vibe, pace and genre tags (machine-generated, or voted for by at least three readers of the book). A lookup by id also returns the ShelfClub author id of each author that has an author record, and which of the moods, vibes and pace readers of the book voted for, with how many did. These tools do not return content warnings: if asked, say so, and do not infer them from the tags or present anything as ShelfClub's.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The ShelfClub id of the book, as the other tools return it. Give this or `isbn`, not both.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$",
                "type": "string"
              },
              "isbn": {
                "description": "An ISBN-10 or ISBN-13, with or without hyphens.",
                "maxLength": 32,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "book": {
                "additionalProperties": false,
                "properties": {
                  "authorLinks": {
                    "description": "The authors that have a ShelfClub author record. Present when the book was looked up by id, not by ISBN.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "id": {
                          "description": "The ShelfClub id of the author.",
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "url": {
                          "description": "The author's page on shelfclub.app.",
                          "type": "string"
                        }
                      },
                      "required": ["id", "name", "url"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "authors": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "averageRating": {
                    "description": "Reader rating out of 5.",
                    "type": ["number", "null"]
                  },
                  "description": {
                    "description": "From the catalog, cut to 600 characters.",
                    "type": ["string", "null"]
                  },
                  "edition": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "isbn": {
                            "type": ["string", "null"]
                          },
                          "language": {
                            "type": ["string", "null"]
                          },
                          "pageCount": {
                            "type": ["number", "null"]
                          },
                          "publishedDate": {
                            "type": ["string", "null"]
                          },
                          "publisher": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["isbn", "language", "pageCount", "publishedDate", "publisher"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "The edition with the ISBN that was asked for; for a lookup by id, the catalog's main edition of the book."
                  },
                  "genres": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "id": {
                    "description": "The ShelfClub id of the book.",
                    "type": "string"
                  },
                  "moods": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "pace": {
                    "type": ["string", "null"]
                  },
                  "ratingCount": {
                    "type": ["number", "null"]
                  },
                  "readerTags": {
                    "additionalProperties": false,
                    "description": "Which of the book's moods, vibes and pace at least `minimum` readers of the book voted for, and how many did. A mood, vibe or pace of the book that is not named here is machine-generated only. Present when the book was looked up by id, not by ISBN.",
                    "properties": {
                      "minimum": {
                        "description": "How many readers of a book must vote for a mood, vibe or pace before it is put on the book.",
                        "type": "number"
                      },
                      "moods": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "alsoFromCatalog": {
                              "description": "True when the tag is machine-generated as well. False when the readers' votes are all that puts it on the book.",
                              "type": "boolean"
                            },
                            "readers": {
                              "description": "How many readers of the book voted for it.",
                              "type": "number"
                            },
                            "tag": {
                              "type": "string"
                            }
                          },
                          "required": ["alsoFromCatalog", "readers", "tag"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "pace": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "alsoFromCatalog": {
                                "description": "True when the tag is machine-generated as well. False when the readers' votes are all that puts it on the book.",
                                "type": "boolean"
                              },
                              "readers": {
                                "description": "How many readers of the book voted for it.",
                                "type": "number"
                              },
                              "tag": {
                                "type": "string"
                              }
                            },
                            "required": ["alsoFromCatalog", "readers", "tag"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "vibes": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "alsoFromCatalog": {
                              "description": "True when the tag is machine-generated as well. False when the readers' votes are all that puts it on the book.",
                              "type": "boolean"
                            },
                            "readers": {
                              "description": "How many readers of the book voted for it.",
                              "type": "number"
                            },
                            "tag": {
                              "type": "string"
                            }
                          },
                          "required": ["alsoFromCatalog", "readers", "tag"],
                          "type": "object"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["minimum", "moods", "pace", "vibes"],
                    "type": "object"
                  },
                  "series": {
                    "type": ["string", "null"]
                  },
                  "seriesPosition": {
                    "type": ["number", "null"]
                  },
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "description": "The book's page on shelfclub.app.",
                    "type": "string"
                  },
                  "vibes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["authors", "averageRating", "description", "edition", "genres", "id", "moods", "pace", "ratingCount", "series", "seriesPosition", "title", "url", "vibes"],
                "type": "object"
              },
              "retryAfterSeconds": {
                "description": "With \"try_again_later\", when known: how long to wait.",
                "maximum": 3600,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "\"try_again_later\": the service was busy and looked nothing up, so the other fields are absent.",
                "enum": ["ok", "try_again_later"],
                "type": "string"
              },
              "tagProvenance": {
                "description": "Where the moods, vibes, pace and genres come from.",
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
