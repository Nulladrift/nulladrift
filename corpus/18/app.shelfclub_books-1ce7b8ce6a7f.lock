                    "averageRating": {
                      "description": "Reader rating out of 5.",
                      "type": ["number", "null"]
                    },
                    "description": {
                      "description": "From the catalog, cut to 600 characters.",
                      "type": ["string", "null"]
                    },
                    "genres": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "description": "The ShelfClub id of the book.",
                      "type": "string"
                    },
                    "moods": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "pace": {
                      "type": ["string", "null"]
                    },
                    "series": {
                      "type": ["string", "null"]
