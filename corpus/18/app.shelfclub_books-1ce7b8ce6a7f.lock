        {
          "name": "get_author",
          "title": "Get author",
          "description": "Look up an author in the ShelfClub catalog by ShelfClub author id, which get_book returns for the authors of a book. Returns the author's name, biography, birth and death dates and shelfclub.app link. With `include_books`, also returns up to 10 of their books, the most recently published first, each with its ShelfClub id, description, reader rating, series, shelfclub.app link, and mood, vibe, pace and genre tags (machine-generated, or voted for by at least three readers of the book).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The ShelfClub id of the author, from the `authorLinks` of a get_book result.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$",
                "type": "string"
              },
              "include_books": {
                "default": false,
                "description": "Also return up to 10 of the author's books.",
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "author": {
                "additionalProperties": false,
                "properties": {
                  "bio": {
                    "description": "From the catalog, cut to 600 characters.",
                    "type": ["string", "null"]
                  },
                  "birthDate": {
                    "description": "As the catalog has it: a full date, a year, or other text.",
                    "type": ["string", "null"]
                  },
                  "deathDate": {
                    "type": ["string", "null"]
                  },
                  "id": {
                    "description": "The ShelfClub id of the author.",
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "description": "The author's page on shelfclub.app.",
                    "type": "string"
