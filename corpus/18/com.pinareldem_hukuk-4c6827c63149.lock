          "description": "Pınar Eldem Hukuk & Danışmanlık (İstanbul, Maltepe) hakkında bilgi: faaliyet alanları, yapay zekâ projelerine yönelik hizmetler, görüşme biçimleri ve iletişim kanalları.",
