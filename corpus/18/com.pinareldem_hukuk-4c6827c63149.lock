          "name": "on_degerlendirme_yap",
          "title": "Ön değerlendirme yap",
          "description": "12 sorunun cevaplarından risk seviyesi, uyum puanı ve öncelikli eksikleri hesaplar; kullanıcının açıp gözden geçirebileceği dolu test bağlantısını ve avukata gönderilebilecek e-posta taslağını döndürür. E-posta gönderilmez; taslağı kullanıcıya gösterin.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
