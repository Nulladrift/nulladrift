          "title": "12 soruluk kontrol listesini getir",
          "description": "Yapay zekâ ile geliştirilen web/mobil projeler için 'Yayına almadan önce 12 soru' hukuki ön kontrol listesini döndürür: sorular, mevzuat dayanakları, öneriler ve kod tabanında her soru için neye bakılacağı. Kullanıcının projesini incelemeden önce çağırın.",
