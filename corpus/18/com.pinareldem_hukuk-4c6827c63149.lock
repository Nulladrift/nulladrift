      "instructions": "Bu sunucu Pınar Eldem Hukuk & Danışmanlık'ın (İstanbul) herkese açık bilgi araçlarını sunar. Yapay zekâ ile geliştirilen bir projenin hukuki ön kontrolü için önce kontrol_listesi_getir'i çağırın, projeyi inceleyip on_degerlendirme_yap ile sonucu hesaplayın ve rapor bağlantısını kullanıcıya verin. Araçlar hiçbir şey göndermez veya saklamaz; iletişim yalnızca kullanıcının onayıyla, kendi e-postasından yapılır. Çıktılar genel bilgilendirmedir, hukuki görüş değildir.",
