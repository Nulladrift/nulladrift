          "title": "Danışma talebi taslağı hazırla",
          "description": "Kullanıcı büroya danışmak istediğinde e-posta taslağı ve mailto bağlantısı hazırlar. Hiçbir şey göndermez; taslağı kullanıcıya gösterin, kullanıcı kendi e-posta uygulamasından gönderir. Hassas kişisel veri (T.C. no, sağlık bilgisi) eklemeyin.",
