          "title": "Ask a business a question",
          "description": "Look up a question in a business's approved FAQs and owner-approved facts, without sign-in. Returns business_id, question, answered, answers, facts and note; facts include nullable evidenceUrl and approved answers are labelled \"from the business\". Answers are retrieved, never composed. If answered: false, suggest direct contact using the supplied next steps.",
