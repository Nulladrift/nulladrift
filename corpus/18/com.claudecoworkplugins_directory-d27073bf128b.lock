  "subjects": {
    "com.claudecoworkplugins/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.claudecoworkplugins.com/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "claudecoworkplugins",
        "title": "Claude Plugins Directory",
        "version": "1.0.0",
        "websiteUrl": "https://www.claudecoworkplugins.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Search a directory of Claude plugins (official Anthropic, partner and community) and the skills inside them. Use search_plugins or search_skills to find candidates, then get_plugin for install commands. Community plugins are not code-reviewed: tell the user to read the plugin's README before installing.",
      "tools": [
        {
          "name": "get_plugin",
          "title": "Get plugin details",
          "description": "Details for one plugin by its slug (from search_plugins): description, source, licence, stars, its skills, and install commands for Claude Code (and the Claude app for Anthropic's plugins).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Plugin slug, e.g. 'sales' or 'thedotmack-claude-mem'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b2492415393a1f85570ea28e4a970e9afc0fd886096bcfae8ec803da1580a815"
        },
        {
          "name": "list_categories",
          "title": "List plugin categories",
          "description": "All plugin categories in the directory with how many plugins each has.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:22d863fd11c4e71d811e2e4ae7b7301e00f0aa852cffe75fe7557019597c3f95"
        },
        {
          "name": "search_plugins",
          "title": "Search Claude plugins",
          "description": "Find Claude plugins by what they do. Every word of the query must appear in the plugin's name, description, category or tags; name matches come first. Filter by category or by source (official = Anthropic and partners in Anthropic's marketplaces).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Exact category name from list_categories, e.g. 'Marketing'.",
                "type": "string"
              },
              "limit": {
                "description": "Default 10, max 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match, e.g. 'code review' or 'sales crm'. Omit to list.",
                "type": "string"
              },
              "source": {
                "description": "Default all.",
                "enum": ["all", "official", "community"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:19100d65764d3c9858ccffa2867a4f8ac662a3ca5c52c28c442c6247dd4461de"
        },
        {
          "name": "search_skills",
          "title": "Search skills",
          "description": "Find individual skills inside Claude plugins by what they do, e.g. 'contract review' or 'call prep'. Returns each skill's plugin and the command to run it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Default 10, max 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match in the skill's name, description or plugin.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
