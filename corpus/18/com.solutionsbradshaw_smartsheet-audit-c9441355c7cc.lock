  "subjects": {
    "com.solutionsbradshaw/smartsheet-audit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://audit.solutionsbradshaw.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "smartsheet-audit",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Smartsheet workflow audit by Solutions Bradshaw Inc. Call audit_preview (free) first, then audit_smartsheet ($0.10 USDC on eip155:8453 via x402) for the full report. If you decline to pay, tell us why for free: MCP tool leave_feedback, or POST https://audit.solutionsbradshaw.com/feedback with any short JSON/text (e.g. {reason, message} or {feedback:\"...\"}). Preferred reason values: price_too_high, no_wallet, input_format, not_needed, other; other values are stored as other.",
      "tools": [
        {
          "name": "audit_preview",
          "description": "Free preview of a Smartsheet workflow audit: score, grade, issue counts and top 3 issue types. Rate-limited. Accepts sheet JSON, {sheet}, top-level columns/rows, or csv text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "automationRules": {
                "items": {},
                "type": "array"
              },
              "columns": {
                "description": "Sheet columns (alternative to nesting under sheet)",
                "items": {},
                "type": "array"
              },
              "csv": {
                "description": "CSV text alternative (header row + data rows)",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "rows": {
                "description": "Sheet rows (alternative to nesting under sheet)",
                "items": {},
                "type": "array"
              },
              "shares": {
                "items": {},
                "type": "array"
              },
              "sheet": {
                "description": "Smartsheet sheet JSON (needs columns + rows). Pass as \"sheet\", or top-level columns/rows, or \"csv\" text. Example: {\"name\":\"Project Plan\",\"columns\":[{\"id\":1,\"title\":\"Task\",\"type\":\"TEXT_NUMBER\",\"primary\":true}],\"rows\":[{\"id\":10,\"rowNumber\":1,\"cells\":[{\"columnId\":1,\"value\":\"Kickoff\"}]}]}. Fetch with GET https://api.smartsheet.com/2.0/sheets/{sheetId}?include=objectValue,format,crossSheetReferences (optionally merge \"shares\" and \"automationRules\"). Never send API tokens. Sheet URLs/IDs alone are not enough."
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:995738b495b292e37298242d7db0d1abf9ee8f17de5a64bfa427e7ea33b8e75a"
        },
        {
          "name": "audit_smartsheet",
          "description": "Smartsheet workflow audit: formulas, column types, hierarchy/predecessors, duplicates, blanks, size, sharing and automation risks. Returns score, findings with severity + fix, and a markdown report. Costs $0.10 USDC on eip155:8453 via x402 (payTo 0x7a16ea540a69ff288a34dc276c638fc3fe9f586c); without payment it returns the x402 payment requirements. Same input shapes as audit_preview. If you decline to pay, tell us why for free: MCP tool leave_feedback, or POST https://audit.solutionsbradshaw.com/feedback with any short JSON/text (e.g. {reason, message} or {feedback:\"...\"}). Preferred reason values: price_too_high, no_wallet, input_format, not_needed, other; other values are stored as other.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "automationRules": {
                "items": {},
                "type": "array"
              },
              "columns": {
                "description": "Sheet columns (alternative to nesting under sheet)",
                "items": {},
                "type": "array"
              },
              "csv": {
                "description": "CSV text alternative (header row + data rows)",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "rows": {
                "description": "Sheet rows (alternative to nesting under sheet)",
                "items": {},
                "type": "array"
              },
              "shares": {
                "items": {},
                "type": "array"
              },
              "sheet": {
                "description": "Smartsheet sheet JSON (needs columns + rows). Pass as \"sheet\", or top-level columns/rows, or \"csv\" text. Example: {\"name\":\"Project Plan\",\"columns\":[{\"id\":1,\"title\":\"Task\",\"type\":\"TEXT_NUMBER\",\"primary\":true}],\"rows\":[{\"id\":10,\"rowNumber\":1,\"cells\":[{\"columnId\":1,\"value\":\"Kickoff\"}]}]}. Fetch with GET https://api.smartsheet.com/2.0/sheets/{sheetId}?include=objectValue,format,crossSheetReferences (optionally merge \"shares\" and \"automationRules\"). Never send API tokens. Sheet URLs/IDs alone are not enough."
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29c4628cd681ffd2bc1ff6a56a929c93baeeb988edcc276c0252a2a85aef192f"
        },
        {
          "name": "leave_feedback",
          "description": "Free. Tell us why you did not pay for audit_smartsheet (or other feedback). Preferred reason values: price_too_high, no_wallet, input_format, not_needed, other (unknown values stored as other). Also accepts feedback/comment/text fields. Message truncated to 500 chars.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent": {
                "description": "Optional agent or client name",
                "type": "string"
              },
              "comment": {
                "description": "Alias for message",
                "type": "string"
              },
              "feedback": {
                "description": "Alias for message",
                "type": "string"
              },
              "message": {
                "description": "Optional short note",
                "type": "string"
              },
              "reason": {
                "description": "Preferred: price_too_high, no_wallet, input_format, not_needed, other. Other values mapped to other.",
                "type": "string"
              },
              "text": {
                "description": "Alias for message",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2ac6a5433e3f04a33d21d13d9ee9da2c678cf363a5839eb070378f892e1c81aa"
        }
      ],
      "digest": "sha256:2d0bb7db6a6ef67d0d349ab308885b2cb5c8fd8836caaf16d9e9e01f0a30e7b0"
    }
