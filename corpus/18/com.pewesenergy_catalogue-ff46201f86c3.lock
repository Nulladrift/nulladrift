{
  "lockfileVersion": 2,
  "subjects": {
    "com.pewesenergy/catalogue": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pewesenergy.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pewes-energy",
        "title": "PEWES ENERGY catalogue",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read only tools over the PEWES ENERGY catalogue, plus customer tools (orders, wishlist) when the customer has approved this agent through OAuth at https://pewesenergy.com/.well-known/oauth-authorization-server. Prices are per can in EUR before volume pricing; read them live and say when they were checked. Customers buy on https://pewesenergy.com/ themselves; never ask them for passwords or card numbers.",
      "tools": [
        {
          "name": "get_drink",
          "title": "Get one drink",
          "description": "Everything the store publishes about one drink, as Markdown: facts, price, caffeine options, description and the page to buy it from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The drink slug, for example grape-madness",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:02b24d4033a8d878c53d18361d1acc09a755b7bd6a7c8b2744692ebd336ab898"
        },
        {
          "name": "get_price_list",
          "title": "Get the price list",
          "description": "The price list as Markdown: price per can, the volume pricing ladder, the subscription discount and reseller terms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a7ec48a88fb9e82dc366504d6608c680063509d1884e27d15c17cd6b3a2bf9c7"
        },
        {
          "name": "read_page",
          "title": "Read a page",
          "description": "Any public storefront page as Markdown, by path: /, /shop, /shop/<range>, /shop/<range>/<slug>, /about, /subscribe, /faq, /blog, /blog/<slug>, /become-a-reseller.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "A path on this site, starting with /",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba5fe7b387714300da7c7f1ba62d5cf63c6bb6935c9b605b26954537fe6b103e"
        },
        {
          "name": "search_drinks",
          "title": "Search drinks",
          "description": "Search and filter the PEWES ENERGY catalogue. Returns a page of drinks with slug, name, price per can in EUR, stock, range, sugar, taste and caffeine options.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Range slug: guilt-free-pleasures, sweet-sins, herbal-delights, coffee-culture",
                "enum": ["guilt-free-pleasures", "sweet-sins", "herbal-delights", "coffee-culture"],
                "type": "string"
              },
              "in_stock_only": {
                "type": "boolean"
              },
              "page": {
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text, matched against names and descriptions",
                "type": "string"
              },
              "sort": {
                "enum": ["rating", "price-asc", "price-desc"],
                "type": "string"
              },
              "sugar": {
                "enum": ["zero-sugar", "with-sugar"],
                "type": "string"
              },
              "taste": {
                "description": "Comma separated: citrus, berry, tropical, orchard, botanical, roasted",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:00bf97842d89eb3f4b7ebded2f8c8a29282bd59ed028185feae5099e042c60e8"
        }
      ],
      "digest": "sha256:a51a42d1f9ae4699e611c118c11dd855487a9f71ce200880fc285888b6cb69b8"
    }
  }
}
