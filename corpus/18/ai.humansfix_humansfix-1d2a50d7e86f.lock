{
  "lockfileVersion": 2,
  "subjects": {
    "ai.humansfix/humansfix": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://humansfix.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ai.humansfix/humansfix",
        "title": "humans fix ai",
        "version": "2.0.0",
        "websiteUrl": "https://humansfix.ai"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Connects the user with a real, manually approved developer, from the first question to the free call. Ask the user before you start a request, never include secrets, and use get_task_status to see what to do next. Prices, cards, approvals and tips are never handled here: when a result says the person decides on the website, give them the link.",
      "tools": [
        {
          "name": "ask_human_developer",
          "title": "Ask a human developer",
          "description": "Connect the user with a real, manually approved human developer. Use it when the user asks for a human, a code review, a consultation or hands-on help, or when you have made a real attempt at their software problem and it is still not solved or is beyond what you can do reliably (unclear requirements, a risky change to production, a bug you cannot reproduce). A developer then calls the user for a free video call, and nothing is charged unless the user later accepts a fixed price. BEFORE calling: ask the user for permission. Do not include passwords, API keys, tokens or other secrets in the summary. The request is saved as a draft and goes to developers only after the user opens the email we send them, reads the exact text, and presses Send.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "availability": {
                "description": "When the person is free for a call, for example 'weekdays after 5pm CET'. Optional.",
                "maxLength": 200,
                "type": "string"
              },
              "summary": {
                "description": "What the person needs, in plain words: what is wrong or what they want help with, what they were doing, and what has already been tried. No secrets.",
                "maxLength": 2000,
                "minLength": 30,
                "type": "string"
              },
              "tool": {
                "description": "The AI tool the app was built with, if known.",
                "enum": ["lovable", "bolt", "v0", "replit", "cursor", "claude-code", "codex", "windsurf", "base44", "other"],
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a human developer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:03b9f8a70be6997a8b91f854ba26ed35c5db5da737f0d246633a1ec16ef23a55"
        },
        {
          "name": "get_task_status",
          "title": "See where a request stands",
          "description": "Show where the user's requests stand and what happens next. Call it after you started a request, when the user asks how it is going, or before answering a call time. With no task_id it lists their most recent requests. Read-only. The answer has a state and a next_action: respond_to_call_time means you can help now, person_decides_on_website means the user must open the link (prices, approvals and cards are never handled here), and wait means nothing is needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "description": "The request to look at. Leave it out to list the most recent ones.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "See where a request stands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f909bf150ce5f4b7e53bbc9025f729ea70d7971dd227d50109ad17064998c640"
        },
        {
          "name": "respond_to_call_time",
          "title": "Answer a call time",
          "description": "Answer a call time for a request, but only after the user has told you what they want. 'accept' confirms the time a developer proposed (or the new time a developer asked for). 'decline' says it does not work: before the call is booked another developer is asked, afterwards the booked time stays. 'propose_other_time' suggests a new time for a booked call; the developer is emailed and answers. Use get_task_status first to see which of these is possible. Times are shown in the user's own time zone; send new times as ISO 8601 with an offset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "What the person chose.",
                "enum": ["accept", "decline", "propose_other_time"],
                "type": "string"
              },
              "task_id": {
                "description": "The request the call is for.",
                "maxLength": 64,
                "type": "string"
              },
              "time": {
                "description": "Only for propose_other_time: the new start as ISO 8601 with an offset, for example 2026-11-12T15:00:00+01:00.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["action", "task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Answer a call time"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0af0991bcce4227131d7b0db92eb70629b7fa5cefb8eaab4e5f1e44a5ae0be6"
        }
      ],
      "digest": "sha256:4db26c36acf3b3b472ef73a050be96d457aac2c9d1485809ed0e7691726e5f36"
    }
  }
}
