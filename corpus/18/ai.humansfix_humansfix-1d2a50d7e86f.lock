      },
      "instructions": "One tool: ask_human_developer. It connects the user with a real, manually approved developer. Ask the user first, and never include secrets in what you send.",
      "tools": [
        {
          "name": "ask_human_developer",
          "title": "Ask a human developer",
          "description": "Connect the user with a real, manually approved human developer. Use it when the user asks for a human, a code review, a consultation or hands-on help, or when you have made a real attempt at their software problem and it is still not solved or is beyond what you can do reliably (unclear requirements, a risky change to production, a bug you cannot reproduce). It starts a request on humansfix.ai. A developer then calls the user for a free video call, and nothing is charged unless the user later accepts a fixed price. BEFORE calling: ask the user for permission, and for their own email address. Do not include passwords, API keys, tokens or other secrets in the summary. The request is not sent to any developer until the user confirms it with a code we email them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "availability": {
                "description": "When the person is free for a call, for example 'weekdays after 5pm CET'. Optional.",
                "maxLength": 200,
                "type": "string"
              },
              "email": {
                "description": "The person's own email address, given by them. We send a confirmation code there.",
                "format": "email",
                "type": "string"
              },
              "summary": {
                "description": "What the person needs, in plain words: what is wrong or what they want help with, what they were doing, and what has already been tried. No secrets.",
                "maxLength": 2000,
                "minLength": 30,
                "type": "string"
              },
              "tool": {
                "description": "The AI tool the app was built with, if known.",
                "enum": ["lovable", "bolt", "v0", "replit", "cursor", "claude-code", "codex", "windsurf", "base44", "other"],
                "type": "string"
              }
            },
            "required": ["email", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a human developer"
          },
          "behavior": {
