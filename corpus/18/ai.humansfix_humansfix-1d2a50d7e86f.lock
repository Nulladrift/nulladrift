{
  "lockfileVersion": 2,
  "subjects": {
    "ai.humansfix/humansfix": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://humansfix.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ai.humansfix/humansfix",
        "title": "humans fix ai",
        "version": "2.0.0",
        "websiteUrl": "https://humansfix.ai"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Connects the user with a real, manually approved developer, from the first question to the free call. Ask the user before you start a request and never include secrets. A request is saved as a draft first: show the user the exact text, and call send_request only after they clearly say yes. Use get_task_status to see what to do next (next_action send_request means a draft is waiting for the user's yes). Prices, cards, approvals and tips are never handled here: when a result says the person decides on the website, give them the link.",
      "tools": [
        {
          "name": "ask_human_developer",
          "title": "Ask a human developer",
          "description": "Saves a draft request to a real, manually approved human developer: a question, a code review, a consultation or hands-on help with a software problem. It takes a short summary in plain words, which must not contain passwords, API keys, tokens or other secrets. Only a draft is saved: nothing reaches a developer until it is sent, and nothing is charged. It returns the exact saved text and a task_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "availability": {
                "description": "When the person is free for a call, for example 'weekdays after 5pm CET'. Optional.",
                "maxLength": 200,
                "type": "string"
              },
              "summary": {
                "description": "What the person needs, in plain words: what is wrong or what they want help with, what they were doing, and what has already been tried. No secrets.",
                "maxLength": 2000,
                "minLength": 30,
                "type": "string"
              },
              "tool": {
                "description": "The AI tool the app was built with, if known.",
                "enum": ["lovable", "bolt", "v0", "replit", "cursor", "claude-code", "codex", "windsurf", "base44", "other"],
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a human developer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a7695de2108528788bfea089845b1db06f6d3f972eb487252165e2ad265de200"
        },
        {
          "name": "get_task_status",
          "title": "See where a request stands",
          "description": "Returns where the user's requests stand: a fixed state, a next_action (send_request, respond_to_call_time, person_decides_on_website, join_call, wait or none), the call time in the user's own time zone and a link to the request page. With no task_id it lists the most recent requests. Read-only. It never returns text written by a developer. Prices, approvals and cards are never handled by this connector.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "description": "The request to look at. Leave it out to list the most recent ones.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "See where a request stands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2bb3f2811d032ce18a18f531c7e1bacc790e2d00b3777b62aaf30659d69a2482"
        },
        {
          "name": "respond_to_call_time",
          "title": "Answer a call time",
          "description": "Answers a call time for a request. 'accept' confirms the time a developer proposed, or the new time a developer asked for. 'decline' says it does not work: before the call is booked another developer is asked, afterwards the booked time stays. 'propose_other_time' suggests a new time for a booked call; the developer is emailed and answers. Times are shown in the user's own time zone; new times are ISO 8601 with an offset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "What the person chose.",
                "enum": ["accept", "decline", "propose_other_time"],
                "type": "string"
              },
              "task_id": {
                "description": "The request the call is for.",
                "maxLength": 64,
                "type": "string"
              },
              "time": {
                "description": "Only for propose_other_time: the new start as ISO 8601 with an offset, for example 2026-11-12T15:00:00+01:00.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["action", "task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Answer a call time"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:19212d8a2c958fc88504e0d9fd8182f1874d577490c74d3ae97a6fd3be95f15b"
        },
        {
          "name": "send_request",
          "title": "Send a request to developers",
          "description": "Sends a saved draft to approved developers. It works only for a draft this connection saved in the last 30 minutes, and each person can send only a few per day. The person receives an email copy with a link to cancel. Nothing is charged. The optional text is compared with the saved draft, and nothing is sent if it differs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "description": "The draft to send: the task_id that ask_human_developer returned.",
                "maxLength": 64,
                "type": "string"
              },
              "text": {
                "description": "The exact saved text, to confirm what is being sent. If it differs from the saved draft, nothing is sent.",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a request to developers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:35389133b152b1786f3f2cef5de43915fdff1412e86b248974d9318ebf04d919"
        }
      ],
      "digest": "sha256:af8b431d17b91a05e0fff6a61487faa0e1a08a1e6d5e9b2dbc6731098d266cea"
    }
  }
}
