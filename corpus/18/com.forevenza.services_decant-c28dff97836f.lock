        {
          "name": "convert_document",
          "title": "Convert CSV, XLSX or text PDF to JSON",
          "description": "Convert an uploaded file (file_base64) or public URL: CSV and XLSX become JSON rows per sheet; text PDFs become text per page. Up to 5 MB decoded, 20,000 rows per sheet; no OCR, PDF table grids or schema extraction. No account or API key; free within the shared daily limit. Files are sent to Decant, processed in memory and not stored. URL fetching honours robots.txt. Send exactly one input; local files need not be published. For a large file, pass limit (and offset) to page the rows, since many hosts show only part of a long tool result. Raw-upload HTTP is also available.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "file_base64": {
                "description": "File bytes encoded as standard padded base64 (up to 5 MB decoded); not a path or data URL. Use instead of url.",
                "maxLength": 6990508,
                "minLength": 1,
                "type": "string"
              },
              "filename": {
                "description": "Optional filename with .csv, .xlsx or .pdf extension for type detection; not a filesystem path",
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "description": "At most this many rows per sheet; row_count stays the total and next_offset is where the next page starts. Omit for every row",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "First row of each sheet to return (0-based), to page a large file",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "sheet": {
                "description": "Only this XLSX sheet, if specified",
                "maxLength": 100,
                "type": "string"
              },
              "url": {
                "description": "Public HTTP(S) file URL; omit when sending file_base64",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
