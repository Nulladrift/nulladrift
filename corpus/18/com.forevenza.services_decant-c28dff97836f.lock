      },
      "instructions": "Decant: Documents into data for developers, analysts and operations staff who need documents, pages and datasets in a form software can use. Files in. Rows out. Decant is a hosted MCP server and HTTP API that converts CSV and XLSX into JSON rows under each sheet's headers, and text PDFs into numbered page text. Send file bytes or a public URL without an account or API key. Files up to 5 MB are processed in memory and not stored. Conversion is free within a shared daily allowance; no OCR or arbitrary schema extraction. Decant also reads public web pages into title, headings, text, links and JSON-LD, honouring robots.txt, and takes specifications for datasets to buy or license. Use list_propositions to see Decant's services, describe_proposition for one of them, then submit_request or an operation tool.",
      "tools": [
        {
          "name": "accept_offer",
          "title": "Accept an offer and place the order",
          "description": "Place an order on terms you have inspected and the buyer has authorized you to accept. Requires the exact terms hash and explicit acceptance. Follow inspect_offer later for payment links and verified payment state.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accept": {
                "const": true,
                "type": "boolean"
              },
              "id": {
                "description": "The request or offer id from your receipt or customer link",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "organization": {
                "maxLength": 160,
                "type": "string"
              },
              "purchase_order": {
                "maxLength": 80,
                "type": "string"
              },
              "terms_sha256": {
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "token": {
                "description": "Private token from your receipt or customer link; keep it for later visits",
                "pattern": "^[0-9a-f]{48}$",
                "type": "string"
              }
            },
            "required": ["accept", "id", "name", "terms_sha256", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
