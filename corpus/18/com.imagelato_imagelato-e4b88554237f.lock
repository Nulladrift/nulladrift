      "instructions": "# Image asset workflows with Imagelato\n\nThis skill drives the Imagelato MCP connector. The user must connect Imagelato\nand authorize an account with access to an organization. If authorization\nfails, ask them to connect or reauthorize Imagelato; never request an API key\nor token in chat.\n\n## Media boundary\n\nImagelato's product API uses deterministic resizing and reformatting, with no\nAI model. The public connector does not upload, process, transform or generate\nimages. It reviews safe asset metadata, manages projects/presets and deletes\none exact processed batch. Do not imply that creating or updating a preset\ncreates media.\n\nThere is no arbitrary object-bucket tool. If asked to discover every stored\nobject, explain that project/batch reads are the supported tenant-safe\nworkflow.\n\n## Start with identifiers\n\nDo not guess ids.\n\n- Use `list_projects` before project-specific work. It returns project ids and\n  names.\n- Use `list_templates` before `get_template` or `update_template`.\n- Use `list_batches` before `get_batch` or `delete_batch`.\n- `add_template` requires the exact project id returned by\n  `list_projects`; a project name is deliberately refused.\n\nAll identifiers are at most 200 characters and names at most 120. Lists return\n25 rows by default, never more than 100, and provide an opaque cursor. Pass the\ncursor unchanged. Do not decode, construct or modify it.\n\n## Available tools\n\nReading:\n\n| Tool                         | Use it when someone asks…                                                         |\n| ---------------------------- | --------------------------------------------------------------------------------- |\n| `list_projects`              | which projects they have; also resolves the project id other tools need           |\n| `get_project`                | about one project by exact id or name                                             |\n| `show_project_overview`      | for a quick card of one project and at most eight of its newest processed batches |\n| `list_batches`               | which batches exist, optionally in one project (storage order, not newest first)  |\n| `get_batch`                  | for one processed image's resized or converted versions (at most 20 variants)     |\n| `list_templates`             | which resize and format presets exist, optionally in one project                  |\n| `get_template`               | about one preset by exact id or name                                              |\n| `list_webhook_subscriptions` | whether webhooks are working, failing or disabled                                 |\n| `list_team_members`          | who is on the team and their roles                                                |\n\nWriting:\n\n| Tool              | Use it when the user wants…                                      |\n| ----------------- | ---------------------------------------------------------------- |\n| `add_project`     | a new named project                                              |\n| `add_template`    | a new resize and format preset in an exact project               |\n| `update_template` | to rename a preset or replace its formats or widths              |\n| `delete_batch`    | one exact batch and every file it produced deleted, with no undo |\n\n## Presets\n\nA preset holds future output formats and pixel widths. Supported format values\nare exactly:\n\n`jpg` · `png` · `webp` · `gif` · `svg`\n\nA preset has one to five formats and one to ten width strings. Each width is\nfrom 1 to 9999 pixels. `add_template` defaults to formats `jpg, webp` and\nwidths `512, 256, 128, 64` only when the user accepts those defaults.\n\nBefore `add_template`, show the exact project, name, formats and widths.\nCreation is not idempotent: repeating it can create a duplicate.\n\nBefore `update_template`, call `get_template`, show the current and replacement\nvalues, and confirm the change. Identical replacements are idempotent. A\ntemplate cannot be moved to another project.\n\n## Batch inspection and deletion\n\n`get_batch` can show a batch-detail card in MCP App hosts. It returns no more\nthan 20 variants and only first-party `www.imagelato.com/images/` URLs without\nquery strings. Do not treat the displayed count as every object ever stored.\n\n`list_batches` returns batches in storage order, not newest first. For the\nmost recent processing activity, use `show_project_overview`, which shows the\neight most recently created batches of one project.\n\n`delete_batch` permanently removes the database row, original, primary output\nand resized/reformatted files, then fires a `batch.deleted` webhook. Always:\n\n1. call `get_batch` on the exact candidate;\n2. describe what will be removed;\n3. ask for confirmation for that exact batch id; and\n4. invoke one deletion only.\n\nDeletion is idempotent when the record is already absent, but it is not\nrecoverable. Never turn a broad request into a loop. Ask the user to choose one\nrecord or use `list_batches` to narrow the set.\n\n## Privacy-aware audits\n\n`list_webhook_subscriptions` intentionally exposes only HTTPS origins, not\nfull paths, queries or signing secrets. `list_team_members` exposes only\ndisplay names and roles, not emails, phones or user ids. If asked for excluded\nfields, explain the boundary and offer the safe summary; do not try another\ntool to reconstruct them.\n\nFor a routine delivery audit:\n\n1. `list_projects` to resolve the project;\n2. `show_project_overview` for recent processing activity;\n3. `list_templates` to check configured formats and widths;\n4. `list_webhook_subscriptions` to find inactive or repeatedly failing\n   endpoints; and\n5. `get_batch` only for a specifically relevant processed item.\n\nWhen an interactive card renders, avoid repeating every field. Explain the\nimportant gap, anomaly or next action.\n\n## Project sidebar\n\nUse `open_imagelato` when asked to open Imagelato or browse projects. The sidebar lists up to 100 owned projects and supports recent batches, bounded first-party variants and paginated resize presets. Selecting a project, batch or preset supplies context to the assistant. The sidebar itself is read-only; any separate mutation still requires the exact confirmation described above.\n",
