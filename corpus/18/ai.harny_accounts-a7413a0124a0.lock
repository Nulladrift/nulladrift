{
  "lockfileVersion": 2,
  "subjects": {
    "ai.harny/accounts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.harny.ai/accounts"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Harny Connected Accounts",
        "version": "1.26.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Connects a person's accounts (mail, calendar, files, notes, chat) so the agent can use them. This entry lists only its own job. Call enable_jobs to use Harny's other jobs on this same connection and key: no new install, no new account.",
      "tools": [
        {
          "name": "provision_app",
          "title": "Provision App",
          "description": "Set up Harny for an app with no account: memory, connected accounts, actions and the action record behind one key; makes a new app and its key, as `POST /v1/auth/provision` does. The answer carries the app key once, and the assistant is told to put it in the owner's secret store and nowhere else. Needs no key; it is the only tool that does not. To save and recall, call the REST API with the app key it returns (`POST /v1/users`, then `POST /v1/memory/ingest` and `POST /v1/memory/recall`), steps in https://harny.ai/auth.md.",
          "inputSchema": {
            "properties": {
              "app_name": {
                "description": "A name for the new app, such as the product's name.",
                "maxLength": 255,
                "minLength": 1,
                "title": "App Name",
                "type": "string"
              },
              "assistant_name": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. Your own name: the product you run as, the way you would say who you are. The app's owner sees it on their Home as who set the app up. Leave it out if you do not know it; Harny never fills it in for you.",
                "title": "Assistant Name"
              },
              "contact_email": {
                "anyOf": [
                  {
                    "format": "email",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. A contact address for platform messages. Leave it out when you do not have one: the app's owner gives their sign-in address when they claim the app.",
                "title": "Contact Email"
              },
              "customers": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Who the app's customers are, in one or two sentences. Stored with the app's objective; the owner can change it.",
                "title": "Customers"
              },
              "model_preset": {
                "anyOf": [
                  {
                    "enum": ["cost_first", "quality_first", "regulated"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Retired and ignored. Harny names no model: the business sets its own provider and model.",
                "title": "Model Preset"
              },
              "objective": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What the app does, in one or two sentences, in the business's words. Stored as the app's objective; the owner can change it.",
                "title": "Objective"
              }
            },
            "required": ["app_name"],
            "title": "provision_appArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Provision App"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "anthropic/alwaysLoad": true,
            "anthropic/searchHint": "set up memory for an app, add long-term memory, create a memory store, get a key with no account"
          },
          "digest": "sha256:e1ce7d213d7abaaa3755e19f22b2bd6e9933efe9354190cdd284ef1a3478c33b"
        }
      ],
      "digest": "sha256:df757cf106a0c25e320d0b4a46dec27769019c101dda5481c4d66c54ae04332f"
    }
  }
}
