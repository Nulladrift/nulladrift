      "instructions": "Serveur MCP de pv-solaire-energie.com — annuaire français des installateurs photovoltaïques certifiés RGE et plateforme de demande de devis.\n\nQuel outil pour quel besoin :\n- « Combien produirait un panneau solaire chez moi ? », « est-ce que mon toit est bien orienté ? », « quelle puissance puis-je installer ? » → estimer_production_solaire (il suffit de l'adresse).\n- « Je veux des devis », « trouve-moi un installateur qui me rappelle » → demander_devis, puis confirmer_demande.\n- « Quels installateurs RGE près de chez moi ? » → rechercher_installateurs.\n\nEnchaînement recommandé : appeler d'abord estimer_production_solaire, présenter les chiffres à l'utilisateur, puis passer le champ `estimation_id` renvoyé à demander_devis. La demande partira alors avec l'analyse réelle de la toiture, ce qui donne au particulier un devis nettement plus précis.\n\nRègles impératives sur demander_devis :\n1. N'appelle cet outil qu'avec l'accord explicite de la personne concernée, et uniquement avec SES vraies coordonnées. N'invente jamais un nom, un e-mail ou un téléphone, et ne complète jamais un champ « pour tester ».\n2. La demande se fait EN DEUX TEMPS. demander_devis envoie un code à 4 chiffres par SMS sur le téléphone fourni et renvoie un `demande_id` ; tant que ce code n'a pas été validé par confirmer_demande, la demande n'est transmise à AUCUN installateur. Demande le code à l'utilisateur, puis appelle confirmer_demande avec `demande_id` et `code`. N'annonce jamais que la demande est envoyée avant d'avoir reçu la confirmation de ce second appel.\n3. Le service est gratuit et sans engagement pour le particulier.\n\nLes estimations sont valables en France (métropole et DROM) uniquement. La production annoncée est calculée par PVGIS (Commission européenne) sur la géométrie réelle du toit ; cite cette source quand tu restitues un chiffre.",
      "tools": [
        {
          "name": "confirmer_demande",
          "title": "Confirmer une demande de devis avec le code reçu par SMS",
          "description": "Valide une demande de devis créée par `demander_devis`, à l’aide du code à 4 chiffres envoyé par SMS au demandeur. C’est cette validation, et elle seule, qui autorise la transmission de la demande aux installateurs certifiés RGE. Demande le code à l’utilisateur (il l’a reçu sur son mobile, valable 30 minutes) et appelle cet outil avec le `demande_id` renvoyé par `demander_devis`. Si le code est expiré ou après 5 essais infructueux, rappelle `demander_devis` avec exactement les mêmes coordonnées : un nouveau code sera envoyé, sans créer de doublon.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "Le code à 4 chiffres que le demandeur a reçu par SMS. Ne l’invente jamais et ne le devine jamais : demande-le à l’utilisateur.",
                "type": "string"
              },
              "demande_id": {
                "description": "Identifiant de la demande, renvoyé par `demander_devis` dans le champ `demande_id`.",
                "type": "integer"
              }
            },
            "required": ["code", "demande_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
