          },
          "digest": "sha256:02a9b310cfdd7835cd8ca8b71d62bf48a305924b27c3022e75d510b8bcdadbaf"
        },
        {
          "name": "demander_devis",
          "title": "Demander un devis d’installation photovoltaïque (France)",
          "description": "Dépose une demande de devis gratuite et sans engagement pour une installation de panneaux solaires en France. Un installateur certifié RGE proche du lieu du projet prend la demande en charge et recontacte directement le particulier pour établir son devis. ⚠️ PREMIÈRE ÉTAPE SUR DEUX. Cet outil envoie un code à 4 chiffres par SMS sur le téléphone fourni et renvoie un `demande_id` : la demande n’est transmise à AUCUN installateur tant que ce code n’a pas été validé via `confirmer_demande`. Demande le code à l’utilisateur puis appelle `confirmer_demande`. N’annonce jamais la demande comme envoyée avant ce second appel. N’appelle cet outil qu’avec l’accord explicite de la personne concernée et avec ses vraies coordonnées — jamais avec des données inventées ou de test. Appelle d’abord `estimer_production_solaire` et transmets son `estimation_id` : le devis sera bien plus précis.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adresse": {
                "description": "Adresse du lieu de l’installation (numéro et rue), pas l’adresse de facturation.",
                "type": "string"
              },
              "code_postal": {
                "description": "Code postal du lieu de l’installation (5 chiffres).",
                "type": "string"
              },
              "demarche": {
                "description": "Maturité du projet. Aide l’installateur à prioriser son rappel.",
                "enum": ["projet immediat", "sous 3 mois", "sous 6 mois", "simple renseignement"],
                "type": "string"
              },
              "email": {
                "description": "Adresse e-mail réelle du demandeur, transmise avec la demande à l’installateur qui la prend en charge.",
                "type": "string"
              },
              "equipements": {
                "description": "Équipements envisagés, séparés par des virgules (ex. « batterie de stockage, borne de recharge, ballon thermodynamique »).",
                "type": "string"
              },
              "estimation_id": {
                "description": "Identifiant renvoyé par `estimer_production_solaire` pour la même adresse. Fortement recommandé : il attache l’analyse réelle de la toiture à la demande. Valable 2 heures.",
                "type": "string"
              },
              "facture_elec": {
                "description": "Facture d’électricité mensuelle moyenne en euros. Ne renseigne ce champ que si l’utilisateur donne réellement un montant.",
                "type": "string"
              },
              "nom": {
                "description": "Nom de famille du demandeur.",
                "type": "string"
              },
              "objectif": {
                "description": "Objectif du projet.",
                "enum": ["autoconsommation", "revente totale", "autoconsommation avec revente du surplus", "independance energetique", "je ne sais pas"],
                "type": "string"
              },
              "orientation": {
                "description": "Orientation principale de la toiture. Inutile si `estimation_id` est fourni : elle est alors mesurée.",
                "enum": ["sud", "sud-est", "sud-ouest", "est", "ouest", "nord", "plat", "je ne sais pas"],
                "type": "string"
              },
              "precisions": {
                "description": "Précisions libres utiles à l’installateur (contraintes d’accès, ombrage, travaux prévus…).",
                "type": "string"
              },
              "prenom": {
                "description": "Prénom du demandeur.",
                "type": "string"
              },
              "surface_toit": {
                "description": "Surface de toiture disponible, en m². Inutile si `estimation_id` est fourni.",
                "type": "string"
              },
              "telephone": {
                "description": "Téléphone MOBILE réel du demandeur, au format français (10 chiffres ou +33). Le code de confirmation à 4 chiffres y est envoyé par SMS : un numéro fixe ou erroné empêche définitivement la demande d’aboutir. C’est aussi le numéro auquel l’installateur rappelle.",
                "type": "string"
              },
              "type_couverture": {
                "description": "Type de couverture. Aucune API ne le fournit : c’est la seule caractéristique de toiture qu’il faut demander à l’utilisateur.",
                "enum": ["tuiles", "ardoise", "tole", "bac acier", "toit plat", "fibrociment", "autre"],
                "type": "string"
              },
              "type_logement": {
                "description": "Type de bâtiment à équiper.",
                "enum": ["maison", "immeuble", "local_professionnel"],
                "type": "string"
              },
              "ville": {
                "description": "Commune du lieu de l’installation.",
                "type": "string"
              }
            },
            "required": ["adresse", "code_postal", "email", "nom", "prenom", "telephone", "ville"],
            "type": "object"
          },
