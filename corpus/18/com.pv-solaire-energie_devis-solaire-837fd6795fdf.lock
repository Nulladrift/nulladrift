        {
          "name": "estimer_production_solaire",
          "title": "Estimer la production solaire d’une toiture (France)",
          "description": "Calcule le potentiel photovoltaïque réel d’une toiture située en France, à partir de sa seule adresse postale : puissance installable en kWc, production annuelle en kWh, nombre de panneaux, surface exploitable, orientation, inclinaison du pan de toit et heures d’ensoleillement. L’analyse porte sur la géométrie 3D réelle du bâtiment (relevé Google Solar) et la production est calculée par PVGIS, l’outil officiel de la Commission européenne — ce n’est ni une moyenne régionale ni une règle de trois au m². Renvoie également, quand elle est disponible, une carte de chaleur du rendement de la toiture, et un `estimation_id` à repasser à `demander_devis` pour joindre cette analyse à la demande. Utilise cet outil dès qu’un utilisateur demande combien produirait une installation solaire chez lui, si son toit est bien orienté, quelle puissance il peut installer, ou quelles économies il peut espérer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adresse": {
                "description": "Adresse postale complète en France (numéro, rue, code postal, commune). Exemple : « 12 rue des Lilas, 31000 Toulouse ». Une adresse imprécise (commune seule) donne une estimation dégradée : demande le numéro et la rue à l’utilisateur avant d’appeler l’outil.",
                "type": "string"
              },
              "type_batiment": {
                "description": "Type de bâtiment. Change réellement le résultat : une maison est bornée aux paliers commerciaux 3/6/9 kWc du résidentiel, un immeuble ou un local professionnel non. Par défaut : maison.",
                "enum": ["maison", "immeuble", "local_professionnel"],
                "type": "string"
              }
            },
            "required": ["adresse"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:716a2fc0e64b88105954c2241234fac248d0493998a828ca9d95583d17150b5e"
        },
        {
          "name": "rechercher_installateurs",
          "title": "Trouver des installateurs photovoltaïques RGE près d’une commune",
          "description": "Recherche dans l’annuaire pv-solaire-energie.com (plus de 5 500 installateurs et 500 bureaux d’études géolocalisés) les installateurs photovoltaïques et bureaux d’études français situés autour d’une commune ou d’un code postal, triés par distance croissante. Seuls les professionnels dont la qualification RGE (Reconnu Garant de l’Environnement) est encore valide à la date du jour sont renvoyés — la qualification RGE est exigée pour vendre le surplus à EDF OA et pour la TVA à 5,5 % (il n’y a plus de prime à l’autoconsommation depuis juin 2026). Chaque résultat donne le nom, la ville, la distance en km, la date de fin de qualification et l’URL de la fiche. Utilise cet outil quand un utilisateur cherche un professionnel du solaire dans sa région, veut vérifier la présence d’installateurs certifiés près de chez lui, ou compare des entreprises avant de demander un devis.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lieu": {
                "description": "Commune, code postal ou adresse en France. Exemples : « Rennes », « 35000 », « 4 avenue de la Gare, 69003 Lyon ».",
                "type": "string"
              },
              "limite": {
                "description": "Nombre maximum de professionnels renvoyés (1 à 20). Par défaut 10.",
                "type": "integer"
              },
              "rayon_km": {
                "description": "Rayon de recherche en kilomètres (1 à 150). Par défaut 30.",
                "type": "integer"
              },
              "type": {
                "description": "Nature du professionnel recherché. Un installateur pose les panneaux ; un bureau d’études réalise l’étude technique et le dimensionnement en amont. Par défaut : installateur.",
                "enum": ["installateur", "bureau_etudes", "tous"],
                "type": "string"
              }
            },
            "required": ["lieu"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e7ab38b982f4811ae8d29e6344b1e7ba1485793d8e7d9506d7fb639a0a014230"
        }
      ],
