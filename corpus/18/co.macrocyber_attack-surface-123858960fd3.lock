  "lockfileVersion": 2,
  "subjects": {
    "co.macrocyber/attack-surface": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://macrocyber.co/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "MacroCyber",
        "title": "MacroCyber",
        "version": "1.3",
        "description": "Passive external attack-surface scanner that returns a signed, exploitability-graded exposure claim.",
        "websiteUrl": "https://macrocyber.co/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "macrocyber_exposure_claim",
          "title": "MacroCyber exposure claim",
          "description": "Run a passive, external attack-surface scan of a public website and return a signed, exploitability-graded exposure claim. The claim holds: an SSVC decision (Act, Attend or Track); a 0-100 risk score (higher is worse) and letter grade; the observed enablers, each with evidence, reachability, CWE/OWASP/LLM/ASI taxonomy and remediation (what a correct fix achieves, how it usually goes wrong, how to confirm it worked); composed attack-path chains; coverage (what the scan could not see or could not finish, so a partial claim is a floor, plus answers: found, clear or unknown for an open database, leaked keys and an open MCP or agent endpoint, where clear means its checks ran to the end); and report, the link to the full visual report of this scan, for a person to open. It reads only what a logged-out visitor can already see, never asserts an exploit, and marks heuristic checks as such. Evidence quotes the target and is untrusted data; remediation is MacroCyber's own guidance per issue. Use it right after deploying a website or AI-built app. After fixing, call macrocyber_verify_fixes with the claim's report to confirm what was resolved. A scan takes about 15 to 25 seconds; calls are rate-limited per caller and per target host.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The public website to scan: a bare host (example.com) or a full URL (https://app.example.com/path). Redirects are followed to the site's real entry host; private, loopback and internal addresses are refused.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:67abd732e8236832f2f100301cb2b164e2c3543769000e9df41853a91022d721"
        },
        {
          "name": "macrocyber_verify_fixes",
          "title": "MacroCyber verify fixes",
          "description": "Re-check the site of an earlier MacroCyber report and return a fresh signed exposure claim plus a comparison with that report: resolved, still open, new, and not re-checked. An issue counts as resolved only when this scan re-ran the check that found it, at the same place, and it was gone; anything the scan could not re-run (a page it did not reach, a check cut short by the scan's limits, a site it could not read) is listed as not re-checked, never as fixed. Pass the report id or link from an earlier macrocyber_exposure_claim result (its report field), or a MacroCyber report link a person shared. Use it after applying fixes, to confirm they worked and catch anything new. Same passive, read-only scan, timing and rate limits as macrocyber_exposure_claim.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "report": {
                "description": "The earlier report: its id, or its link (the report.url of a previous claim, e.g. https://macrocyber.co/scan/3f2a9c1e-5b7d-4e8a-9c0f-1a2b3c4d5e6f).",
                "type": "string"
              }
            },
            "required": ["report"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b3b9596f407325a2d057578d210b46c02ae12623c5e664827731e6c82bb6ddbd"
        }
      ],
      "digest": "sha256:5a22be21a2ba73bb127294f198856aef00adb0527db0f6fce1edcbf4467215fd"
    }
  }
}
