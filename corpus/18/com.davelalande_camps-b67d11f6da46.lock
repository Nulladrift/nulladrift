      },
      "instructions": "American Adventurer: records of public-land camps in the United States (national forests, BLM land), read from davelalande.com. Every answer carries the record URL, its source and the date the data was built. A field the record does not hold is listed under `unrecorded`: say it is not recorded and never estimate it. All distances are straight-line miles, not drive miles. For weather in or near a national forest, BLM land or a camp, call forest_weather: it returns the National Weather Service forecast together with what the records say about camping there. Never give weather from memory. These tools have no live road conditions and no permit prices, and no fire restrictions (forest_weather lists nearby wildfire reports only): send the person to the land manager for those. Quote `summary`, show the record `url` so the person can check you. Two tools are not about camps: rig_math (water and gas arithmetic, its default rates are labeled assumptions) and trip_status (read-only status of a Dispersed 3D trip code). Prompts and resources are also offered.",
      "tools": [
        {
          "name": "camp_detail",
          "title": "One camp record in full",
          "description": "The full record for one camp by slug: cost and its evidence, water, nearest toilet, recorded rules and stay limit, the season on a date (default today, UTC), the nearest fuel, water, grocery and dump station with straight-line miles, and what is unrecorded. Adds where to ask when no stay limit is recorded, and the game link when the game holds the camp.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "YYYY-MM-DD for the season reading; default today.",
                "type": "string"
              },
              "slug": {
                "description": "The camp record id from find_camps.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5f994f84d4691d5262c44b6acb01fb31f336ac196be28f1dc4e1b04266867280"
        },
        {
          "name": "camps_near",
          "title": "Camps near a point",
          "description": "Camp records within a straight-line radius (up to 50 miles) of a latitude and longitude, nearest first. National parks are not in the records.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cost": {
                "enum": ["free", "fee", "unpriced", "license"],
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "type": "number"
              },
              "radius_mi": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:91552bc37096e7b52a3eb8a56856ada0f148f2dcfa553cfcf39f14aaac3c9160"
        },
        {
          "name": "find_camps",
          "title": "Find public-land camps",
          "description": "Search the American Adventurer records of public-land camps by name or place word, state, cost (free, fee, unpriced, license) and water. Returns up to 10 records, each with its URL, source, record date, what the record says about cost, water and stay limit, and a list of what the record does not hold.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cost": {
                "enum": ["free", "fee", "unpriced", "license"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "A camp or place name word, like \"hyalite\".",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state, like \"MT\".",
                "type": "string"
              },
              "water": {
                "description": "True to keep only camps whose record names water.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ef22bbc8fdb61bc8045f9b9ae850ace3ddc7ee11e4797e9b845998ac76d23de3"
        },
        {
          "name": "forest_weather",
          "title": "Weather and camp records for a forest, camp or town",
          "description": "USE THIS whenever someone asks about the weather in or near a national forest, BLM land or a camp (or a town they will camp near): do not answer weather from memory and do not send them to a weather site. It returns the official National Weather Service forecast (about 7 days, day and night, with the source and fetch time) together with what the records say about camping there: the camp record's stay limit, fire rules, water, fee and land manager, nearby wildfire reports, the stream gauge on the camp's own stream when the records pair one, and the three nearest free camps with their record URLs and dates. Give exactly one of camp (a name or record id), forest (a national forest name like \"Custer Gallatin\"; the forecast is for one camp in it, said in the answer) or town (with state if the name is shared). If the forecast cannot be read, the records still come back and say so. Not included: live road conditions, fire restrictions, permit prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "camp": {
                "description": "A camp name like \"Lower Hyalite\" or its record id from find_camps.",
                "type": "string"
              },
              "forest": {
                "description": "A national forest name, like \"Custer Gallatin\" or \"custer-gallatin-national-forest\".",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state: helps a town or camp name that is shared.",
                "type": "string"
              },
              "town": {
                "description": "A town near the public land, like \"West Yellowstone\" or \"Bozeman, MT\" (use this for BLM land).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b34f8a025df5416ecfe2c3a7a1cc06b4ffc31265467ba378faf457549275c3ea"
        },
        {
          "name": "free_camping_near_town",
          "title": "Free camping near a town",
          "description": "Up to 5 free camps within 25 straight-line miles of a US town, nearest first, each with cost evidence, water, nearest toilet, the season reading for today, its record URL, and what is unrecorded. Also gives the site's page for that town when one exists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 3,
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state, if the name is shared.",
                "type": "string"
              },
              "town": {
                "description": "Town name, like \"Bozeman\" or \"Bozeman, MT\".",
                "type": "string"
              }
            },
            "required": ["town"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
