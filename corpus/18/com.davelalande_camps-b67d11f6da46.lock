        {
          "name": "trip_check",
          "title": "Trip Check: gas, water, forecast and records for a trip",
          "description": "USE THIS when someone is planning a trip to a national forest (or a camp) on given dates in a truck, a van or a rig with their own tank and water, and wants to know whether the gas and water work and what is known about the place. It is the camping game Dispersed 3D's dry run as one read. It returns: the gas and water arithmetic in the game's own rig and burn numbers (the Tacoma, the Sprinter, or your tank_gal and water_gal; give pump_paved_mi and pump_unpaved_mi, one way, for the gas to the pump); the National Weather Service forecast for the trip's dates that fall inside its window of about a week (a later date says 'no forecast yet', never an average); the fire rules the camp records hold, as dated records (not today's posting, so it cannot say whether there is a fire ban today); and camp records near the forest. Every item carries its source link and when it was fetched or built, and anything missing says 'unknown: check with <the named office>'. It does NOT know road conditions, closures, today's fire restrictions, permit rules or what the weather will do beyond the forecast, and it never says a road or camp can be used: send the person to the land manager for those. A trip with a night in December, January or February is refused in a plain sentence (overlanding is spring, summer and fall); so is a date that has gone by. The forecast is for one camp record's point, not the whole forest, and the answer says which.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "camp": {
                "description": "A camp record id from find_camps. Give this or forest. Use it for BLM land.",
                "type": "string"
              },
              "forest": {
                "description": "A national forest, like \"custer-gallatin-national-forest\" or \"Custer Gallatin\". Give this or camp.",
