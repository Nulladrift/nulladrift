        {
          "name": "land_at",
          "title": "Whose land is this point",
          "description": "USE THIS when someone gives a place (latitude and longitude) and asks \"whose land is this\", who manages it, or who to call. It answers for NATIONAL FORESTS ONLY (national grasslands included). Where the record says the Forest Service manages the surface, it returns that, the national forest and ranger district, whether the point is within about 200 meters of a boundary, the office to ask (with its phone when we read one from the Forest Service page), and where to confirm. For stay limits, call posted_orders or read a camp record. Everywhere else it does NOT cover that ground: BLM, National Park Service, state land, private land, a point in no record, the ocean. For those it says the point is not on national forest land, names no manager and has `scope` \"national_forests_only\"; do not guess one, and do not call such ground public or private. It never says a spot can be camped on, and \"Signs on the ground and the office win.\" ends every answer. Answers include `say` (two sentences to speak) and `tiny` (under 160 characters for a satellite text). The point is used for the lookup and never stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees, United States and territories.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees (negative in the US).",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0c12d8762ca1173ab2bcd0be980ec526b91aad16af9efcebe68c5c80da9fcbce"
        },
        {
          "name": "nearby",
          "title": "Nearest toilets, resupply and chargers",
          "description": "USE THIS for \"nearest toilet\", \"bathroom near\", \"where can I fill water, dump, shower, fuel up, buy groceries, do laundry, get propane or air, find a mechanic, pharmacy, urgent care, hardware store, post office, outfitter or coffee shop\", or \"electric charger near\" at a latitude and longitude anywhere in the United States. kind is toilets (the default: 20,621 recorded toilets with the agency that lists them), chargers (the Department of Energy station list), or one mapped resupply kind: potable_water, shower, dump_station, fuel, grocery, laundry, propane, air, mechanic, pharmacy, urgent_care, hardware, mail, outfitter, coffee (cafes within 25 miles of a camp record only). Returns up to 25 records within a straight-line radius (up to 50 miles), nearest first, with the source and its date. A recorded toilet can be closed for the season, and the mapped points are a floor from OpenStreetMap, not a survey: hours, brands and whether a place still exists go stale, so say \"OpenStreetMap lists\", never \"there is\". It never says a place is open.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "default": "toilets",
                "description": "What to find. Default toilets.",
