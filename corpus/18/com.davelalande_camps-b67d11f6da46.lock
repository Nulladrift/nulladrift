        },
        {
          "name": "forest_weather",
          "title": "Weather and camp records for a forest, camp or town",
          "description": "USE THIS whenever someone asks about the weather in or near a national forest, BLM land or a camp (or a town they will camp near): do not answer weather from memory and do not send them to a weather site. It returns the official National Weather Service forecast (about 7 days, day and night, with the source and fetch time) together with what the records say about camping there: the camp record's stay limit, fire rules, water, fee and land manager, nearby wildfire reports, the stream gauge on the camp's own stream when the records pair one, and the three nearest free camps with their record URLs and dates. Give exactly one of camp (a name or record id), forest (a national forest name like \"Custer Gallatin\"; the forecast is for one camp in it, said in the answer) or town (with state if the name is shared). If the forecast cannot be read, the records still come back and say so. Not included: live road conditions, permit prices, and today's fire restrictions: for \"is there a fire ban\" it gives the fire rules the camp records hold and nearby wildfire reports, which are not a ban or its lifting, so send the person to the forest office or its alerts page (posted_orders where that tool is listed).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "camp": {
                "description": "A camp name like \"Lower Hyalite\" or its record id from find_camps.",
                "type": "string"
              },
              "forest": {
                "description": "A national forest name, like \"Custer Gallatin\" or \"custer-gallatin-national-forest\".",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state: helps a town or camp name that is shared.",
                "type": "string"
              },
              "town": {
                "description": "A town near the public land, like \"West Yellowstone\" or \"Bozeman, MT\" (use this for BLM land).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
