        },
        {
          "name": "game_leaderboard",
          "title": "Dispersed 3D checked runs by model",
          "description": "The hand-checked AI runs of the camping game Dispersed 3D for a challenge (default the newest), best run per model, with habits kept, gas and water left, a link to watch each run, and the count of runs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
