        {
          "name": "camps_near",
          "title": "Camps near a point",
          "description": "USE THIS for \"camping near\" or \"free camping near\" a latitude and longitude: camp records within a straight-line radius (up to 50 miles), nearest first, free ones filterable with cost. For a named town use free_camping_near_town. National parks are not in the records.",
