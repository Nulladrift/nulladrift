        {
          "name": "find_camps",
          "title": "Find public-land camps",
          "description": "USE THIS for \"free camping\", \"dispersed camping\" or \"boondocking\" searches by camp name or place word, state, cost (free, fee, unpriced, license) and water, in the American Adventurer records of public-land camps. Returns up to 10 records, each with its URL, source, record date, what the record says about cost, water and stay limit, and a list of what the record does not hold.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cost": {
                "enum": ["free", "fee", "unpriced", "license"],
                "type": "string"
              },
              "drinking_water": {
                "description": "True to keep only camps with a mapped drinking-water point (tap, spigot or fill point) recorded within about 10 miles. Use this for \"with drinking water\"; water above is for named streams and lakes.",
                "type": "boolean"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "A camp or place name word, like \"hyalite\".",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state, like \"MT\".",
                "type": "string"
              },
              "water": {
                "description": "True to keep only camps whose record names a water source: mostly named creeks and lakes, natural water that is untested (filter or boil).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
