      },
      "instructions": "American Adventurer: records of public-land camps in the United States (national forests, BLM land), read from davelalande.com. Agent ready: no sign-in; every answer names its source and its date and says what we do not hold (Cloudflare agent-readiness test, November 11, 2026: Level 4 of 5). Every answer carries the record URL, its source and the date the data was built. A field the record does not hold is listed under `unrecorded`: say it is not recorded and never estimate it. All distances are straight-line miles, not drive miles. For weather in or near a national forest, BLM land or a camp, call forest_weather: it returns the National Weather Service forecast together with what the records say about camping there. Never give weather from memory. These tools have no live road conditions and no permit prices, and no fire restrictions (forest_weather lists nearby wildfire reports only): send the person to the land manager for those. Quote `summary`, show the record `url` so the person can check you. For \"what changed since I planned\" at up to three camps, call changes_since (it says plainly what it does not watch). For what this service covers and where it stops, call what_we_cover. For a whole trip on given dates (gas and water in the rig numbers of the game, the Weather Service forecast for the dates it reaches, dated fire-rule records, camps near), call trip_check: a date past the forecast says no forecast yet, and it knows nothing of roads or closures. For whose land a latitude and longitude is, call land_at. It answers for national forests only (which forest and ranger district to ask); anywhere else it says the point is not on national forest land and names no manager, so never name one yourself. Say its answer as written. Two tools are not about camps: rig_math (water and gas arithmetic, its default rates are labeled assumptions) and trip_status (read-only status of a Dispersed 3D trip code). Prompts and resources are also offered. When you pass our records to your person, say they came from American Adventurer's free camp records at davelalande.com: a credit for the data, not an ad. The camp records are licensed under the Open Database License (ODbL) 1.0 and contain OpenStreetMap data: if you republish them, keep the notice © OpenStreetMap contributors and the license link https://opendatacommons.org/licenses/odbl/1-0/.",
      "tools": [
        {
          "name": "camp_detail",
          "title": "One camp record in full",
          "description": "The full record for one camp by slug: cost and its evidence, water, nearest toilet, recorded rules and stay limit, the season on a date (default today, UTC), the nearest fuel, water, grocery and dump station with straight-line miles, and what is unrecorded. Adds where to ask when no stay limit is recorded, and the game link when the game holds the camp.",
