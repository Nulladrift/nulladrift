        },
        {
          "name": "one_call",
          "title": "A camping Call for your AI",
          "description": "Hands your AI one decision from a checked Dispersed 3D run (the same one for everyone on a date): where it is, the gas, water and light line, and the moves on the menu. Your AI picks one, then sends the person the reveal link, which shows the other AI's pick and reason. The other AI's answer is not in this result. If no per-turn data is published yet, it answers not_yet with the leaderboard link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "challenge": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:187f2a18a4cd5389d365a464eb7136e05a1e1b38bfb282b3c06ed48172fb9efc"
        },
        {
          "name": "plan_four_nights",
          "title": "Plan a four-night trip from the records",
          "description": "A trip letter: up to four nights at named camps from the records (free first, then unpriced, said so), a town run on day 3 with the recorded fuel, water and grocery, each camp's cost, stay limit, water, toilet and season for the date. Give forest_slug (a national forest) or town. start_date defaults to today; no night is put on a camp the record reads closed on that date, and a mostly-closed forest gets the earliest date its records say a camp opens. For the four places the game holds it adds a play link and a prompt with the plan folded in. All distances straight-line.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "forest_slug": {
                "description": "National forest slug, like \"custer-gallatin-national-forest\".",
                "type": "string"
              },
              "nights": {
                "default": 4,
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "description": "YYYY-MM-DD; default today.",
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "town": {
                "description": "A town to plan around, like \"Quartzsite\" (use for BLM land).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:735be015096f6b3627900e8e3e405127aebfc854b4d8ddd5238a4bcbd8c97d41"
        },
        {
          "name": "rig_math",
          "title": "Water and gas math for a rig",
          "description": "Plain arithmetic: how many nights a tank of water lasts for a number of people at a stated use per person per day, and how far a tank of gas goes at a stated mileage. Nothing is read from a record. Any default rate (1 gallon per person per day, 13 mpg, the game's numbers) is labeled in the answer as an assumption you can change; it is not a fact about a place.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gas_gal": {
                "description": "Gallons of gas in the tank.",
                "maximum": 500,
                "minimum": 0,
                "type": "number"
              },
              "mpg": {
                "description": "Optional: your rig's miles per gallon. Default 13 (an assumption, the game's pavement number).",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "nights": {
                "description": "Optional: nights planned, to say whether the water is enough.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "people": {
                "description": "How many people use the water.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "water_gal": {
                "description": "Gallons of water aboard.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "water_gal_per_person_per_day": {
                "description": "Optional: gallons each person uses a day. Default 1 (an assumption).",
                "maximum": 20,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["gas_gal", "people", "water_gal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7135d6f10aa5e504a9117ed5ae15bcd49e5fe678b425a1328159f1e0e9c7ad1"
        },
        {
          "name": "trip_status",
          "title": "Where a Dispersed 3D trip is",
          "description": "Read-only status of a Dispersed 3D trip from its 8-character code (like ABCD-2345): the day and clock of the last saved move, the last few moves, finished or not, the end-card gas and water once the trip is over, and the link to watch it. The saved trip holds commands, not the camp name or the tank until it ends; those are listed as unrecorded. Never changes a trip.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The trip code the game shows: 8 characters, a dash allowed after the fourth.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e1cfb6df222f575ae6f15e5da305235aa229bd799e99f8a4c2f65b564f365179"
        }
