        },
        {
          "name": "search_articles",
          "title": "Search articles",
          "description": "Search Open Factory articles by topic, equipment class, company, tag or series ID. Returns the best matches with slug, URL, date, pillar, summary and the CSV files behind their charts; the slug identifies an article for a full-text read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results, default 8.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "pillar": {
                "description": "Optional filter: electrical, power, cooling, machinery or procurement.",
                "enum": ["electrical", "power", "cooling", "machinery", "procurement"],
                "type": "string"
              },
              "query": {
                "description": "Words to look for, e.g. \"transformer lead time\", \"switchgear PPI\", \"PJM capacity\", \"Hadrian\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
