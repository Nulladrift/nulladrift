        {
          "name": "get_lead_times",
          "title": "Lead times by class",
          "description": "Current published lead time, in weeks, for factory and datacenter electrical equipment classes (transformers, switchgear, switchboards, MCC, busway, gensets, ATS, drives), each with the OEM or publisher and its date. Optional text filter on the class name. Edition history and per-product OEM rows are paid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional filter, e.g. \"switchgear\", \"pad-mount\", \"genset\".",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
