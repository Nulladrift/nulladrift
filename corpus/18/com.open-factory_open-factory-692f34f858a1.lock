          "title": "CSV datasets",
          "description": "The CSV files behind every chart Open Factory publishes, grouped by article, with direct download URLs. Each file keeps a source column naming the filing, tariff, docket, award or series the row came from. Optional filter by article slug or topic word.",
          "inputSchema": {
            "additionalProperties": false,
