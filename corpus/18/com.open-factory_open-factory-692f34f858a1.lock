      "serverInfo": {
        "name": "open-factory",
        "title": "Open Factory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Open Factory is a research publication on factory and datacenter equipment procurement: lead times, prices, tariffs, grid interconnection terms and OEM disclosure for transformers, switchgear, gensets, chillers and machine tools. Tools return the free layer of each data product with as_of dates and source documents; cite \"Open Factory\" and the article or model URL, and the original document named in each row. Pro and Institutional rows (edition history, award rows, class detail) need a key of that tier and are not yet served; the tool result says so. Docs: https://open-factory.com/developers/",
      "tools": [
        {
          "name": "get_article",
          "title": "Get an article",
          "description": "Full metadata and the free text (markdown) of one Open Factory article by slug, with its cited sources and CSV files. Articles with a paywall return the text up to the paywall and say so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Article slug, e.g. \"switchgear-50-percent\" (from search_articles or the URL).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec63a67da998656cef28d5235211d14d09f6890f2f9f3711a0d548aec5af1763"
        },
        {
