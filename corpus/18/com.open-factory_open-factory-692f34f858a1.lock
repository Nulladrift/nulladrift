            "readOnly": true
          },
          "digest": "sha256:77e6aa48f97d8496b32612ef8ef53934fb67edc0251c304948306f5108573b10"
        },
        {
          "name": "get_tariff_rates",
          "title": "Tariff rates",
          "description": "US import tariff for factory and datacenter equipment: 22 HTS lines (transformers, switchgear, gensets, chillers, machine tools, robots and parts) by origin country, with MFN, Section 232, Section 301 and total ad valorem rates and the instrument behind each. Filter by HTS prefix, origin or a word in the description.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hts": {
                "description": "Optional HTS prefix, e.g. \"8504\" or \"8504.22\".",
                "type": "string"
              },
              "origin": {
                "description": "Optional origin country as in the table, e.g. \"China\", \"Mexico\", \"Germany\".",
                "type": "string"
              },
              "query": {
                "description": "Optional word in the heading description, e.g. \"transformer\", \"switchgear\", \"generating sets\".",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tariff rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94421223c5e1d8d6784d4aad0136d86fe3a0e14372a63e9b4a97cca9bb35a8eb"
        },
        {
          "name": "get_tool_data",
          "title": "Calculator source table",
          "description": "The source table one Open Factory calculator runs on, with every input's provenance: copper-wire-price-sheet, genset-tco, interconnection-cost, lead-time-schedule, pjm-capacity-bill, quote-check, tariff-exposure-calculator, transformer-sizing-cost. The calculation itself runs in the browser at the tool URL in this version.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tool": {
                "description": "Tool slug.",
                "enum": ["copper-wire-price-sheet", "genset-tco", "interconnection-cost", "lead-time-schedule", "pjm-capacity-bill", "quote-check", "tariff-exposure-calculator", "transformer-sizing-cost"],
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
