        },
        {
          "name": "get_price_bands",
          "title": "Bid-tab price bands",
          "description": "Transaction price bands from public procurement awards: pad-mount and power transformers ($/kVA), MV switchgear, gensets ($/kW) and chillers ($/ton), with p25, median, p75, n, buyers and award-date range. Filter by class and window (recent = awards since 2024-01-01). Award rows with document URLs are paid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "class": {
                "description": "Optional class id: pad-mount-transformer, power-transformer, mv-switchgear, genset, chiller (see classes in the result).",
                "type": "string"
              },
              "window": {
                "description": "all, recent or both (default both).",
                "enum": ["all", "recent", "both"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bid-tab price bands"
