        {
          "name": "get_large_load_terms",
          "title": "Large-load interconnection terms",
          "description": "What a 50 MW or larger load pays to connect in fifteen US utilities and markets: study fee, security or collateral per MW, minimum bill, contract term, ramp, exit fee and realistic energization year, each cell linked to the tariff or docket. Optional filter by market, utility or state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "Optional filter, e.g. \"Virginia\", \"ERCOT\", \"AEP\", \"TX\".",
