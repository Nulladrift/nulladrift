          "digest": "sha256:c7156d7f844ff5ac5d89ac47ff7e915e3857f0bf4ad1c5f021185ee161cdb1df"
        },
        {
          "name": "get_record",
          "title": "The Record",
          "description": "Every dated, checkable forecast Open Factory has made (lead times, prices, tariffs, power), the public series it is scored against, the date it resolves, and the result once scored. Filter by status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "status": {
                "description": "open, right, partial, wrong, withdrawn or all (default all).",
                "enum": ["open", "right", "partial", "wrong", "withdrawn", "all"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The Record"
          },
          "behavior": {
            "destructive": false,
