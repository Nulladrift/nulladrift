        "type": "http",
        "url": "https://mcp.foreverworks.com/bnr"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "bnr",
        "title": "BNR exchange rates",
        "version": "0.1.2",
        "websiteUrl": "https://foreverworks.github.io/mcps/servers/bnr/",
        "icons": [
          {
            "src": "data:image/png;base64,",
            "mimeType": "image/png"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "The National Bank of Romania's reference exchange rates (RON per unit of a currency), read from BNR's own XML: the rate in force on a day, conversions to and from RON, every fixing in a window, and the yearly average ANAF uses in the D212. Rates are exact text: never round them again.",
      "tools": [
        {
          "name": "annual_average",
          "title": "BNR annual average",
          "description": "BNR's annual average rate for a year, as ANAF converts foreign income in the D212 (\"cursul de schimb mediu anual comunicat de BNR\"): the mean of the twelve monthly averages, each the mean of the month's daily rates, to four places, with the monthly values and their day counts. Not the mean of the daily rates, which differs. A year not over yet answers the months so far with complete: false.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 code: EUR, USD, GBP, CHF, ... (XAU gold, XDR SDR); case ignored.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "year": {
                "description": "The calendar year, e.g. 2023.",
                "maximum": 2100,
                "minimum": 2005,
                "type": "integer"
              }
            },
            "required": ["currency", "year"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "average": {
                "description": "BNR's exact text, RON per `multiplier` units",
                "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                "type": "string"
              },
              "complete": {
                "type": "boolean"
              },
              "currency": {
                "type": "string"
              },
              "method": {
                "type": "string"
              },
              "months": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "average": {
                      "description": "BNR's exact text, RON per `multiplier` units",
                      "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                      "type": "string"
                    },
                    "days": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "month": {
                      "pattern": "^\\d{4}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["average", "days", "month"],
                  "type": "object"
                },
                "type": "array"
              },
              "multiplier": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "const": true,
                "type": "boolean"
              },
              "source": {
                "type": "string"
              },
              "warning": {
                "type": "string"
              },
              "year": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["average", "complete", "currency", "method", "months", "multiplier", "ok", "source", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "foreverworks.com/access": "read"
          },
          "digest": "sha256:08d8c6d4232ad419ffa0229d46cc60748fe342fb0307de3eedb024f4c7798ee4"
        },
        {
          "name": "convert",
          "title": "Convert to or from RON",
          "description": "An amount converted to or from RON at BNR's reference rate, computed exactly and rounded once: to RON is amount x rate / multiplier, from RON amount x multiplier / rate. rate_rule picks the fixing: in_force (the day's, or the last banking day's before it, as rate answers) or last_before (the last one strictly before the day, the rule for an invoice in a foreign currency). Answers the result with the rate, its multiplier and the date BNR published it, so the conversion can be stated. One side must be RON; for two other currencies, convert twice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The amount, as a decimal string: \"1250.50\", \"-75\". Never a number.",
                "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                "type": "string"
              },
              "date": {
                "description": "The day of the conversion, YYYY-MM-DD in Bucharest (an invoice's date, a payment's); default today.",
                "type": "string"
              },
              "from": {
                "description": "The amount's currency: RON, or the currency to convert to RON. ISO 4217; case ignored.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "places": {
                "default": 2,
                "description": "Digits after the point in the result.",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "rate_rule": {
                "default": "in_force",
                "description": "in_force: the rate in force on the day; last_before: the last rate published before the day.",
                "enum": ["in_force", "last_before"],
                "type": "string"
              },
              "rounding": {
                "default": "half-up",
                "description": "How the result is rounded, once: half-up (halves away from zero, as invoices round) or half-even (banker's).",
                "enum": ["half-up", "half-even"],
                "type": "string"
              },
              "to": {
                "description": "The currency wanted: RON, or the currency to convert RON to. ISO 4217; case ignored.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The amount converted, as given",
                "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                "type": "string"
              },
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "meaning": {
                "type": "string"
              },
              "multiplier": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "const": true,
                "type": "boolean"
              },
              "places": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "published_on": {
                "description": "The date of the fixing the conversion used",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "rate": {
                "description": "BNR's exact text, RON per `multiplier` units",
                "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                "type": "string"
              },
              "rate_rule": {
                "enum": ["in_force", "last_before"],
                "type": "string"
              },
              "result": {
                "description": "The converted amount, computed exactly and rounded once",
                "pattern": "^-?\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "rounding": {
                "enum": ["half-up", "half-even"],
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "to": {
                "type": "string"
              }
            },
            "required": ["amount", "date", "from", "meaning", "multiplier", "ok", "places", "published_on", "rate", "rate_rule", "result", "rounding", "source", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "foreverworks.com/access": "read"
          },
          "digest": "sha256:83dc91538098edd8ea0e448bfa8188f77b86bdfab21115d8ad0b7304e15ed3f3"
        },
        {
          "name": "health",
          "title": "Health",
          "description": "Whether BNR's rates can be read now: the date of its latest fixing and how many currencies it carries.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currencies": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "latest_fixing": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "ok": {
                "const": true,
                "type": "boolean"
              },
              "source": {
                "type": "string"
              },
              "today": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "warning": {
                "type": "string"
              }
            },
            "required": ["currencies", "ok", "source", "today"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
