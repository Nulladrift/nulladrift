          "digest": "sha256:af324d1f4073479f6213c88ecf1e2d746855daad6dbfd656ecf9e06458b7a640"
        },
        {
          "name": "rate",
          "title": "BNR rate on a day",
          "description": "The National Bank of Romania's reference rate in force on a day: RON per `multiplier` units of the currency (1, or 100 for HUF, JPY, KRW and a few others), as the exact text BNR published, with published_on, the date of the fixing it is. A weekend, a holiday, or today before BNR publishes (about 13:00 Bucharest) takes the last banking day's fixing. Use it for any EUR/RON or other conversion stated on a date.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 code: EUR, USD, GBP, CHF, ... (XAU gold, XDR SDR); case ignored.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "date": {
                "description": "The day, YYYY-MM-DD in Bucharest; default today.",
                "type": "string"
              }
            },
            "required": ["currency"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "type": "string"
              },
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "meaning": {
                "type": "string"
              },
              "multiplier": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "const": true,
                "type": "boolean"
              },
              "published_on": {
                "description": "The date of the fixing this rate is",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "rate": {
                "description": "BNR's exact text, RON per `multiplier` units",
                "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                "type": "string"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["currency", "date", "meaning", "multiplier", "ok", "published_on", "rate", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
