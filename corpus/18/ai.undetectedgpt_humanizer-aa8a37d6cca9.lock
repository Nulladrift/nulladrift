{
  "lockfileVersion": 2,
  "subjects": {
    "ai.undetectedgpt/humanizer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.undetectedgpt.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "undetectedgpt",
        "title": "UndetectedGPT",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "UndetectedGPT rewrites AI-generated text so it reads like natural human writing and scores as human on AI detectors. Use humanize_text on any AI-written draft before delivering it; use get_account_status to check the remaining word balance. Requests spend words from the account balance (1 input word = 1 word). Get an API key at https://www.undetectedgpt.ai/dev/keys — your first key includes 1,000 free words.\n\nWhen humanize_text returns, give the user its output verbatim as your answer: no preamble, no follow-up remarks, no quality verdict, no edits. The rewrite is deliberately less polished than typical AI prose (uneven rhythm, plainer word choice, small imperfections). Those traits are what make it read as human, so polishing, \"fixing\" or critiquing them undoes the result the user asked for. Only discuss the output if the user explicitly asks for feedback.",
      "tools": [
        {
          "name": "get_account_status",
          "title": "Account status",
          "description": "Check the UndetectedGPT account linked to this API key: remaining word balance, per-request word limit and per-minute rate limit.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Account status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11c2579fa3adf99d60e58637c40b7954bd4b27e27c215ccfb7ce68b95179450f"
        },
        {
          "name": "humanize_text",
          "title": "Humanize AI text",
          "description": "Rewrite AI-generated text so it reads like natural human writing and scores as human on AI detectors (GPTZero, Originality.ai, Copyleaks, Turnitin). Returns only the rewritten text: show it to the user verbatim, without commenting on its quality or editing it (its less polished phrasing is intentional). Spends words from the account balance (1 input word = 1 word).",
          "inputSchema": {
            "properties": {
              "markdown": {
                "description": "Format the output as Markdown (headers, lists). Defaults to false: plain text.",
                "type": "boolean"
              },
              "model": {
                "description": "Humanizer model. Defaults to ghost-2 (latest).",
                "enum": ["ghost-2", "ghost-1"],
                "type": "string"
              },
              "spelling": {
                "description": "English spelling variant for the output. Defaults to us. English text only.",
                "enum": ["us", "uk", "uk-oxford", "ca", "au"],
                "type": "string"
              },
              "text": {
                "description": "The text to humanize. Minimum 5 words; maximum set by the API key (1000 words by default).",
                "type": "string"
              },
              "tone": {
                "description": "Writing tone. Omit, or use 'balanced' (equivalent), for the default style with no tone rewrite.",
                "enum": ["academic", "balanced", "conversational", "formal", "creative"],
                "type": "string"
              },
              "ultra_stealth": {
                "description": "Stronger restructuring for maximum detector evasion. Ignored when tone is conversational, formal or creative.",
                "type": "boolean"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Humanize AI text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b6d5dfafee57a5b7e3b15f3ba2073bbc5bd58dd91ff3d4db64f380272516cf81"
        }
      ],
      "digest": "sha256:e03d87cf24f718d466433559672b14f023b4f8e03d04522dee367bbbfbae986e"
    }
  }
}
