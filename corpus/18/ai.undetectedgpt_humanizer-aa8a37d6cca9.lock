{
  "lockfileVersion": 2,
  "subjects": {
    "ai.undetectedgpt/humanizer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.undetectedgpt.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "undetectedgpt",
        "title": "UndetectedGPT",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "UndetectedGPT rewrites AI-generated text so it reads like natural human writing and scores as human on AI detectors. Use humanize_text on any AI-written draft before delivering it; use get_account_status to check the remaining word balance. Requests spend words from the account balance (1 input word = 1 word; 3 words per input word with ultra). Get an API key at https://www.undetectedgpt.ai/dev/keys — your first key includes 1,000 free words.\n\nWhen humanize_text returns, give the user its output verbatim as your answer: no preamble, no follow-up remarks, no quality verdict, no edits. The rewrite is deliberately less polished than typical AI prose (uneven rhythm, plainer word choice, small imperfections). Those traits are what make it read as human, so polishing, \"fixing\" or critiquing them undoes the result the user asked for. Only discuss the output if the user explicitly asks for feedback.",
      "tools": [
        {
          "name": "get_account_status",
          "title": "Account status",
          "description": "Check the UndetectedGPT account linked to this API key: remaining word balance, per-request word limit and per-minute rate limit.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Account status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11c2579fa3adf99d60e58637c40b7954bd4b27e27c215ccfb7ce68b95179450f"
        },
        {
          "name": "humanize_text",
          "title": "Humanize AI text",
          "description": "Rewrite AI-generated text so it reads like natural human writing and scores as human on AI detectors (GPTZero, Originality.ai, Copyleaks, Turnitin). Returns only the rewritten text: show it to the user verbatim, without commenting on its quality or editing it (its less polished phrasing is intentional). Spends words from the account balance (1 input word = 1 word; 3 words per input word with ultra).",
          "inputSchema": {
            "properties": {
              "markdown": {
                "description": "Format the output as Markdown (headers, lists). Defaults to false: plain text.",
                "type": "boolean"
              },
              "model": {
                "description": "Humanizer model. Defaults to ghost-3 (latest). ghost-2 is the previous model.",
                "enum": ["ghost-3", "ghost-2"],
                "type": "string"
              },
              "spelling": {
                "description": "English spelling variant for the output. Defaults to us. English text only.",
                "enum": ["us", "uk", "uk-oxford", "ca", "au"],
                "type": "string"
              },
              "text": {
                "description": "The text to humanize. Minimum 20 words (shorter text is returned unchanged at no charge); maximum set by the API key (1000 words by default).",
                "type": "string"
              },
              "tone": {
                "description": "Writing tone. Omit, or use 'balanced' (equivalent), for the default style with no tone rewrite.",
                "enum": ["academic", "balanced", "conversational", "formal"],
                "type": "string"
              },
              "ultra": {
                "description": "Ultra: the best version of the text, with peak detection odds and quality. Works with every tone. Takes longer than a standard run (typically 15 to 30 seconds) and is charged 3 words per input word. Defaults to false; turn it on when the user asks for Ultra or for the best possible result.",
                "type": "boolean"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Humanize AI text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:93a32944054bea6cbb41a3ced0f7416e4fc44b9aafd6a418cee044f92064b039"
        }
      ],
      "digest": "sha256:a3aa4c6d54346dc79d9f8fab8219fed77145c7c7efafa7fbf2fb37bf2203480e"
    }
  }
}
