        {
          "name": "gage_borrow_quote",
          "title": "Borrow quote",
          "description": "The largest loan the partner vaults fund now for at most maxCollateral of a token, at the lowest fixed cost they accept; or one exact loan (collateral and principal) at the lowest cost that funds it now, or at your own costBps, with what each Loan grade costs; in USDG or the lend asset named, with a prepare object for gage_prepare_borrow.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "collateral": {
                "description": "With principal: the exact pledge of one chosen loan, raw units",
                "pattern": "^[1-9]\\d{0,77}$",
                "type": "string"
              },
              "costBps": {
                "description": "With collateral and principal: your own fixed cost for the loan instead, bps of the amount borrowed, to a tenth (more digits are rounded); the quote's grades say what each Loan grade costs",
                "maximum": 5000,
                "minimum": 0.1,
                "type": "number"
              },
              "lendAsset": {
                "description": "The asset the loan is paid in and repaid in: USDG when omitted, or a lend asset gage_capabilities lists (its token address)",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "maxCollateral": {
                "description": "Most of the token to pledge, raw units: quotes the largest loan the vaults fund for it, at the lowest fixed cost they accept",
                "pattern": "^[1-9]\\d{0,77}$",
                "type": "string"
              },
              "principal": {
                "description": "With collateral: the exact amount to borrow, raw units of the loan's asset; priced at the lowest fixed cost the vaults funding it accept, or at costBps",
                "pattern": "^[1-9]\\d{0,77}$",
                "type": "string"
              },
              "term": {
                "description": "Loan term in seconds, one of the terms gage_capabilities lists",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "token": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "wallet": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
