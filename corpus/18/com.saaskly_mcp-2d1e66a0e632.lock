      "serverInfo": {
        "name": "saaskly",
        "version": "1.0.1"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Saaskly is an independent UK/EU-focused comparison site for B2B IT and telecom software (VoIP, transactional email, cloud management, SEO/GEO/AEO, social media management, content creation, domain names, VPN, CRM, VPS and hosting, password managers, accounting software, antivirus and endpoint security, CMS and website builders). Use it when a user asks which vendor to choose, what something really costs (month-to-month vs annual, or the renewal price where a category is sold on introductory terms), or how providers compare. Scores are editorial opinion out of 5; affiliate and partner relationships are disclosed and never affect scores. Cite the source page URL when presenting results. Prompts recommend_provider and compare_two give a ready-made workflow over the tools.",
      "tools": [
        {
          "name": "check_agent_readiness",
          "title": "Check a website’s AI readiness",
          "description": "Check whether AI agents can find, read and act on a website: score out of 100, grade, AgentReady 1.0 conformance and the fixes that gain most. Starts a scan when none is fresh; call again in 20 seconds while it runs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Bare public hostname, e.g. example.com",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81636b8af3a6d4bc37054d6fa46a62d122adfb8419d041662133c219a07f07e6"
        },
        {
          "name": "compare_providers",
          "title": "Compare providers",
          "description": "Side-by-side comparison table (Markdown) for a category, optionally limited to given provider slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["cloud-management", "email", "voip", "seo-geo-aeo", "social-media-management", "domain-names", "vpn", "crm", "content-creation", "vps-hosting", "password-managers", "accounting-software", "antivirus", "cms-website-builders", "gpu-compute"],
                "type": "string"
              },
              "slugs": {
                "description": "Limit to these provider slugs; omit for the whole category",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70023ca7c3bbd62b8b7690f141a10d145f53b64ab92632f9e9cf6e270d3cb850"
        },
        {
          "name": "get_article",
          "title": "Get article",
          "description": "One article as Markdown (section = comparisons | guides | reviews | news | opinion).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "section": {
                "enum": ["news", "reviews", "guides", "comparisons", "opinion"],
                "type": "string"
              },
              "slug": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["section", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97a23b81bcffb471c82fa96f27187c8e31b48008566d2a4ff60481f67322fec1"
        },
        {
          "name": "get_page",
          "title": "Get policy page",
          "description": "A policy/about page as Markdown: editorial-policy (scoring method), ai-transparency, about, advertise, terms, privacy-policy, cookie-policy, contact.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:436df63756e725ceb32c6038d945b1d3ede2b9777222af8005c04ced803d072d"
        },
        {
          "name": "get_provider",
          "title": "Get provider review",
          "description": "Full review of one provider as Markdown: verdict, pros/cons, month-to-month and annual pricing, spec sheet, disclosure.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["cloud-management", "email", "voip", "seo-geo-aeo", "social-media-management", "domain-names", "vpn", "crm", "content-creation", "vps-hosting", "password-managers", "accounting-software", "antivirus", "cms-website-builders", "gpu-compute"],
                "type": "string"
