      },
      "instructions": "Saaskly is an independent UK/EU-focused comparison site for B2B IT and telecom software (VoIP, transactional email, cloud management, SEO/GEO/AEO, social media management, content creation, domain names, VPN, CRM, VPS and hosting, password managers, accounting software, antivirus and endpoint security, CMS and website builders). Use it when a user asks which vendor to choose, what something really costs (month-to-month vs annual, or the renewal price where a category is sold on introductory terms), or how providers compare. Scores are editorial opinion out of 5; affiliate and partner relationships are disclosed and never affect scores. Cite the source page URL when presenting results. Prompts recommend_provider and compare_two give a ready-made workflow over the tools.",
      "tools": [
        {
          "name": "check_agent_readiness",
          "title": "Check a website’s AI readiness",
          "description": "Check whether AI agents can find, read and act on a website: score out of 100, grade, AgentReady 1.0 conformance and the fixes that gain most. Starts a scan when none is fresh; call again in 20 seconds while it runs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Bare public hostname, e.g. example.com",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:db33e731b7cd73d35f7a76c8314317ebdad209ef7525d7481d3b00302d8625d0"
        },
        {
          "name": "compare_providers",
          "title": "Compare providers",
          "description": "Side-by-side comparison table (Markdown) for a category, optionally limited to given provider slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["cloud-management", "email", "voip", "seo-geo-aeo", "social-media-management", "domain-names", "vpn", "crm", "content-creation", "vps-hosting", "password-managers", "accounting-software", "antivirus", "cms-website-builders", "gpu-compute"],
                "type": "string"
              },
              "slugs": {
                "description": "Limit to these provider slugs; omit for the whole category",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
