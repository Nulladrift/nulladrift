          "description": "Ranked providers in a category with editorial score (0–5), one-line summary, entry price and partner disclosure.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category slug",
                "enum": ["cloud-management", "email", "voip", "seo-geo-aeo", "social-media-management", "domain-names", "vpn", "crm", "content-creation", "vps-hosting", "password-managers", "accounting-software", "antivirus", "cms-website-builders", "gpu-compute"],
