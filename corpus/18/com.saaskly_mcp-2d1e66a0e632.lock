      "prompts": [
        {
          "name": "compare_two",
          "title": "Compare two providers",
          "description": "Compare two providers in a category: spec-sheet differences from the comparison table plus each editorial verdict, with source URLs.",
          "arguments": [
            {
              "name": "category",
              "description": "Category slug.",
              "required": true
            },
            {
              "name": "providerA",
              "description": "First provider slug.",
              "required": true
            },
            {
              "name": "providerB",
              "description": "Second provider slug.",
              "required": true
            }
          ],
          "digest": "sha256:e84de12ac54f66de251f7f81e04c997663f314917fd915ad992d02ce2efb8b0c"
        },
        {
          "name": "recommend_provider",
          "title": "Recommend a provider",
          "description": "Recommend a provider in a category for a stated need: ranks the category, reads the top reviews, and explains the pick with both price bases, the renewal premium where the category has one, and disclosures.",
          "arguments": [
            {
              "name": "category",
              "description": "Category slug (see list_categories), e.g. vpn, domain-names, voip.",
              "required": true
            },
            {
              "name": "need",
              "description": "What the user needs, in their words, e.g. \"a fixed UK IP for a five-person team\".",
              "required": true
            }
          ],
          "digest": "sha256:5a96c1c360bed43701ed7bc6bd934fcb60543279949230788301c0c260f9c2d3"
        }
