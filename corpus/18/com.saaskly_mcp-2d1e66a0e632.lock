            {
              "name": "category",
              "description": "Category slug.",
              "required": true
            },
            {
              "name": "providerA",
              "description": "First provider slug.",
              "required": true
            },
            {
              "name": "providerB",
              "description": "Second provider slug.",
              "required": true
            }
          ],
          "digest": "sha256:e84de12ac54f66de251f7f81e04c997663f314917fd915ad992d02ce2efb8b0c"
        },
        {
          "name": "recommend_provider",
          "title": "Recommend a provider",
          "description": "Recommend a provider in a category for a stated need: ranks the category, reads the top reviews, and explains the pick with both price bases, the renewal premium where the category has one, and disclosures.",
