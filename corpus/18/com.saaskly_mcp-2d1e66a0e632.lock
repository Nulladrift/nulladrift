            {
              "name": "category",
              "description": "Category slug (see list_categories), e.g. vpn, domain-names, voip.",
              "required": true
            },
            {
              "name": "need",
              "description": "What the user needs, in their words, e.g. \"a fixed UK IP for a five-person team\".",
