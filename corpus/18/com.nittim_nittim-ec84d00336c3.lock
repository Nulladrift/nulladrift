        {
          "name": "dispute_finding",
          "title": "Dispute or Confirm a Finding",
          "description": "NEEDS A KEY: mint one at https://nittim.com/keys. Records that a finding from a prior audit is wrong (stance:'dispute') or genuinely real (stance:'confirm'), backed by evidence from the repo. Free. A SIGNAL for owner triage — it never changes the audit's scores, verdict or stored report on its own. The finding is identified by its findingKey (from the digest), or by its exact dimension and title.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "auditId": {
                "description": "The audit UUID, from its report link.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "dimension": {
                "description": "The finding's dimension, e.g. 'security' — required if findingKey is omitted.",
                "type": "string"
              },
              "evidence": {
                "description": "What you can see in the repo that supports your stance.",
                "properties": {
                  "explanation": {
                    "description": "Why this finding is wrong or confirmed real, in your own words.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "file": {
                    "description": "The file path your evidence points to.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "lines": {
                    "description": "Line range, e.g. '42-58'.",
                    "type": "string"
                  },
                  "snippet": {
                    "description": "A short excerpt of the actual code supporting your stance.",
                    "type": "string"
                  }
                },
                "required": ["explanation", "file"],
                "type": "object"
              },
              "findingKey": {
                "description": "The finding's stable key from the digest, if you have it (preferred over dimension+title).",
                "type": "string"
              },
              "stance": {
                "description": "'dispute' = this finding is wrong. 'confirm' = this finding is genuinely real.",
                "enum": ["dispute", "confirm"],
                "type": "string"
              },
              "title": {
                "description": "The finding's exact title — required if findingKey is omitted.",
                "type": "string"
              }
            },
            "required": ["auditId", "evidence", "stance"],
            "type": "object"
          },
