        {
          "name": "report_loop",
          "title": "Report a Completed Nittim Loop (opt-in, counts only)",
          "description": "NEEDS A KEY: mint one at https://nittim.com/keys. Records anonymised counts from a Nittim Loop the developer has finished and agreed to send: pass numbers, a findings-by-category tally, a fixed count, and whether each pass was clean. Counts only — never a title, file path or snippet. Nothing is charged, and an eligible report can earn a credit reward (rules and caps: see describe_protocol). Reporting the same repo again updates the existing record; the reply says which happened. Results appear at https://nittim.com/loop.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "client_name": {
                "description": "Your own name — omit to read it from the MCP connection instead.",
                "maxLength": 64,
                "type": "string"
              },
              "client_version": {
                "description": "Your own version string, if you have one.",
                "maxLength": 64,
                "type": "string"
              },
              "convergence": {
                "description": "Optional: 'converged' (two consecutive clean passes) or 'cap_reached' (stopped for any other reason). Omit if unsure — the read from `passes` is derived either way.",
                "enum": ["converged", "cap_reached"],
                "type": "string"
              },
              "first_wave_lenses": {
                "description": "Optional, with mode 'one_shot' only: how many lenses ran in parallel on pass 1.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "integer"
              },
              "mode": {
                "description": "Optional: 'one_shot' (every lens sweeps the whole tree first, then one fix wave, then a short convergence loop) or 'serial' (one lens or area per pass, fixing between passes).",
                "enum": ["one_shot", "serial"],
                "type": "string"
              },
              "passes": {
                "description": "One entry per pass you actually ran, in order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clean": {
                      "description": "True iff this pass found nothing new.",
                      "type": "boolean"
                    },
                    "findings": {
                      "description": "Findings this pass named — one entry per category with something to report; omit a category that found nothing. Each count defaults to 0 when omitted.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "category": {
                            "enum": ["security", "privacy", "reliability", "code_quality", "ai_risk", "performance", "devops", "data", "business", "devex", "accessibility", "observability", "maintainability"],
                            "type": "string"
                          },
                          "critical": {
                            "default": 0,
                            "maximum": 9007199254740991,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "high": {
                            "default": 0,
                            "maximum": 9007199254740991,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "low": {
                            "default": 0,
                            "maximum": 9007199254740991,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "medium": {
                            "default": 0,
                            "maximum": 9007199254740991,
                            "minimum": 0,
                            "type": "integer"
                          }
                        },
                        "required": ["category"],
                        "type": "object"
                      },
                      "maxItems": 13,
                      "type": "array"
                    },
                    "fixed": {
                      "description": "How many findings this pass fixed.",
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "n": {
                      "description": "This pass's number, starting at 1.",
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["clean", "findings", "fixed", "n"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "repo_hash": {
                "description": "sha256 of the repository's canonical identity (the lowercased 'owner/repo', or a stable local fingerprint) — never the repo name itself. nittim never sees the name.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "repo_size_bucket": {
                "description": "A rough size bucket for the repo you looped over.",
                "enum": ["xs", "s", "m", "l", "xl"],
                "type": "string"
              },
              "swept": {
                "description": "Optional: was the CLASS swept — a guard, lint rule or exhaustiveness check that makes a new instance loud — rather than only the instances a pass named? Never derived, never changes the reward. On a repeat report, omitting it keeps the last answer; `false` withdraws it.",
                "type": "boolean"
              }
            },
            "required": ["passes", "repo_hash", "repo_size_bucket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report a Completed Nittim Loop (opt-in, counts only)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d0d96a2aa057dce0a09de4c1fcb683e3882434d9c57daa0b1be42c9d6c65ceab"
        },
        {
          "name": "run_module",
          "title": "Run a Single Audit Module",
          "description": "Run ONE nittim audit module against a GitHub repository, never producing scores or a verdict. The two deterministic modules (secret-scan, dependency-cve) return scanner evidence directly, free, with nothing to confirm. Deep-tier modules make one focused model call, cost 5.03 credits each and follow the protocol below. NEEDS A KEY: mint one at https://nittim.com/keys. COSTS MONEY in three calls: the first quotes a price and charges nothing; a second with `confirmedCost` set to that exact price returns a one-time link for the ACCOUNT OWNER to confirm — their yes, not the assistant's; a plain third call with the same arguments runs once at that price. A moved price is re-quoted, never charged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
