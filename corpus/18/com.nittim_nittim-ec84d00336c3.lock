      "instructions": "## Keys\nPaid tools need a nittim key: mint one at https://nittim.com/keys and send it as the bearer token in your MCP server config. `scan_source`, `list_modules`, `estimate_audit` and `describe_protocol` work free with no key. A paid tool called with no key may answer with a 401 sign-in challenge instead of a tool result; a client with no OAuth of its own sends `x-nittim-auth: none` in its server config to get a plain tool error instead.\n\n## Spending money (every paid tool, identical protocol)\nPrice it first, free and keyless, with `estimate_audit` — same `cost` object, nothing runs or charges. Show that price to the person you are working for. The first call to a paid tool NEVER runs and NEVER charges either — it answers with the price as a `cost` object, in `structuredContent` and as a fenced JSON block of the exact arguments to send back. Call again with `confirmedCost` set to the exact `cost` you were quoted — this second, price-confirming call doesn't have to follow an earlier quote-only one: sending `confirmedCost` on your very first call to a paid tool reaches the same step directly. A price that moved is refused and re-quoted, never charged. Unless the key was deliberately made autonomous, that second call answers with a one-time link the ACCOUNT OWNER opens and confirms — their yes, never yours, and never inferred. A plain third call with the same arguments then runs once at that price, or set `authorization` to the id from the second answer. Repeating the second call while you wait is free and safe.\n\n## Two tiers\n`audit_repo` and `audit_source` default to Audit: one structured pass over the highest-signal source. `fullScan: true` buys Full Audit — every eligible source file, priced by pass count — and `estimate_audit` prices either without charging or running anything.\n\n## How audits are delivered\n`audit_repo` and `audit_source` submit and return an id immediately; nothing runs inside the call. The report lands Usually within 15 minutes* — poll `get_audit` with the id to read it. * Most reports land within 15 minutes. Worst case, 24 hours. Subscribers can run `audit_source` on their own Anthropic key via the `x-nittim-anthropic-key` header (BYOK Pro), which returns its report in the call.\n\n## Before the AI audit\nCall `get_loop` — free, no key — and run it on a repository you own before spending on an audit. An AI audit is worth more on fixed code, so the Nittim Loop comes first — fix, re-run, and stop at two consecutive passes that find nothing new. The AI audit is the sensible step from there. On a repository you own, running this costs nothing and sends nothing — fix and commit before spending on an AI audit. Claude Code users can install it as the nittim-loop skill from github.com/ilanwolberger/nittim-mcp instead of fetching https://nittim.com/selfcheck.md by hand each time. \n\n## The full protocol\n`describe_protocol` is free, needs no key, and returns this in full detail — the money protocol, the tiers, the Nittim Loop and its reward rules, and dispute guidance.\n\n## Server version\nThis is nittim's MCP server, version 0.2.0+22f95d4. If tools suddenly error or look missing after they worked before, the server was likely updated — reconnect or reload the nittim MCP connection in your client and try again; nothing is lost and nothing was charged. More cases — a 401, a long-running audit, a \"not found\" on an id you own — are answered at https://nittim.com/agents.md under Troubleshooting.\n",
      "tools": [
        {
          "name": "audit_repo",
          "title": "Audit a GitHub Repository",
          "description": "Paid nittim AI audit of a GitHub repository: one structured pass over the highest-signal source; the only tool here that returns scores and a verdict. Answers with the audit's id, not the report. `fullScan: true` buys the wider Full Audit tier. NEEDS A KEY: mint one at https://nittim.com/keys. COSTS MONEY in three calls: the first quotes a price and charges nothing; a second with `confirmedCost` set to that exact price returns a one-time link for the ACCOUNT OWNER to confirm — their yes, not the assistant's; a plain third call with the same arguments runs once at that price. A moved price is re-quoted, never charged.DELIVERED AS A BATCH: the report lands Usually within 15 minutes*. * Most reports land within 15 minutes. Worst case, 24 hours. ",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "authorization": {
                "description": "HUMAN CONFIRMATION. The `authorization` id from the confirm-link answer, once the account owner has pressed Confirm. Single-use, short TTL.",
                "type": "string"
              },
              "confirmedCost": {
                "description": "COST CONFIRMATION. Omit on the first call; then send back the exact quoted `cost`.",
                "properties": {
                  "centicredits": {
                    "description": "The `centicredits` integer from the quoted cost, if it carried one.",
                    "type": "number"
                  },
                  "credits": {
                    "description": "The `credits` number from the quoted cost.",
                    "type": "number"
                  },
                  "kind": {
                    "description": "The `kind` from the quoted cost, e.g. 'credits'.",
                    "type": "string"
                  }
                },
                "required": ["credits", "kind"],
                "type": "object"
              },
              "deployedUrl": {
                "description": "Optional URL of this repository's live deployment, for an origin the account owner actually operates. When set, the audit adds one bounded, READ-ONLY fetch pass against it and reports drift between the deployed artifact and the audited commit. Redirects are never followed; private addresses are refused.",
                "type": "string"
              },
              "fullScan": {
                "description": "True buys the wider Full Audit tier: every eligible source file, priced by pass count.",
                "type": "boolean"
              },
              "githubToken": {
                "description": "Optional read-only GitHub token for a private repo. Without one, only public repos are reachable — unless the account has installed nittim's GitHub App at nittim.com for this repo, in which case a private repo works with no token at all.",
                "type": "string"
              },
              "payInstead": {
                "description": "True pays credits now instead of queuing for the daily free-audit budget to reopen, skipping the covered (Audit) entitlement even when it would otherwise be free.",
                "type": "boolean"
              },
              "repoUrl": {
                "description": "GitHub repository URL or owner/repo. A private repo needs a githubToken, unless the account has installed nittim's GitHub App at nittim.com for it.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["repoUrl"],
            "type": "object"
          },
