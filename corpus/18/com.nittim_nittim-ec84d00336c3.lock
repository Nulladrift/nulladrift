                "required": ["credits", "kind"],
                "type": "object"
              },
              "githubToken": {
                "description": "Optional read-only GitHub token. Without one, only public repos are reachable.",
                "type": "string"
              },
              "moduleKey": {
                "description": "The module's key, e.g. 'secret-scan', 'dependency-cve', 'security', 'privacy', 'gdpr'.",
                "minLength": 1,
                "type": "string"
              },
              "repoUrl": {
