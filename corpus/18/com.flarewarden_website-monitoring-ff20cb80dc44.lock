                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "For a custom webhook only: the new https endpoint.",
                "type": "string"
              },
              "webhook": {
                "description": "The webhook's id (from list_webhooks) or its name.",
                "type": "string"
