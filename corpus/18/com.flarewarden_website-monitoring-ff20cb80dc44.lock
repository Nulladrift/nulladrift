              },
              "description": {
                "description": "A check's description.",
                "type": "string"
              },
              "expected_text": {
                "description": "A plain HTTP dependency's text its answer must hold (or, with match, must not hold or match); an empty string stops checking it.",
                "type": "string"
              },
              "grace": {
                "description": "A cron job's grace period in seconds.",
                "maximum": 86400,
                "minimum": 0,
                "type": "integer"
              },
              "group": {
                "description": "A site's group; an empty string removes it.",
                "type": "string"
              },
              "interval": {
                "description": "Seconds between checks (30, 60, 300, 600, 1800 or 3600, as the plan allows).",
                "maximum": 3600,
                "minimum": 30,
