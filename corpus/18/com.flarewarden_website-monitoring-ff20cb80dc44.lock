        {
          "name": "add_webhook",
          "title": "Add a webhook",
          "description": "Use this when the user wants FlareWarden to send alert events to their own HTTPS endpoint (a generic, signed JSON webhook), or to connect Slack, Discord, Google Chat or Microsoft Teams. Each event FlareWarden then sends there carries the monitor's name and URL and what happened, such as an incident's times and error message or a certificate's dates. For an endpoint: creates the webhook and returns a one-time link where the user sees its signing secret (the secret never appears in the chat). For a chat destination: returns the page where the user pastes the channel's webhook URL, which works as a password and is never a tool argument. Owners and admins only. Not for the user's own alert emails: use update_my_notifications. The webhook format, events and signature are documented at https://flarewarden.com/docs/alerts/webhooks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "custom (default): the user's own HTTPS endpoint. slack, discord, googlechat or teams (Microsoft Teams): returns the page to connect that channel.",
                "enum": ["custom", "slack", "discord", "googlechat", "teams"],
                "type": "string"
              },
              "events": {
                "description": "For destination custom, required: the events to send, at least one, such as incident.started and incident.recovered (the Webhooks page asks for them too).",
                "items": {
                  "enum": ["incident.started", "incident.recovered", "ssl.expiring", "ssl.expired", "ssl.changed", "ssl.issued", "dns.failed", "dns.recovered", "dns.changed", "domain.expiring", "domain.expired", "monitor.created", "monitor.deleted", "monitor.paused", "monitor.resumed", "maintenance.started", "maintenance.completed", "maintenance.cancelled", "cron.failed", "cron.late", "anomaly.detected", "anomaly.resolved"],
                  "type": "string"
                },
                "type": "array"
              },
              "idempotency_key": {
                "description": "Optional. Send the same key again after a lost reply and the change is not made twice.",
                "type": "string"
              },
              "name": {
                "description": "A name for the webhook, as the Webhooks page lists it.",
                "type": "string"
              },
              "sites": {
                "description": "Limit the webhook to these sites, each by id, name or part of its URL. Leave out for every site.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "For destination custom: the HTTPS endpoint. Never a Slack, Discord, Google Chat or Microsoft Teams URL.",
                "type": "string"
              }
            },
            "type": "object"
          },
