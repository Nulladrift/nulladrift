        {
          "name": "get_legal_ai_tool",
          "title": "Get one legal AI tool",
          "description": "Get the full listing for one legal AI tool by its slug, including the complete description and MCP install command. Use after search_legal_ai_tools to go deeper on a specific result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Listing slug, e.g. \"harvey-ai\" — taken from a search result",
                "maxLength": 100,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "found": {
                "description": "False when no published listing has this slug",
                "type": "boolean"
              },
              "tool": {
                "additionalProperties": false,
                "description": "The listing, present when found is true",
                "properties": {
                  "category": {
                    "description": "Practice-area category slug",
                    "type": "string"
                  },
                  "category_label": {
                    "description": "Human-readable category name",
                    "type": "string"
                  },
                  "connection": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "customer_account_tested": {
                            "const": false,
                            "type": "boolean"
                          },
                          "documentation_reviewed_at": {
                            "type": "string"
                          },
                          "permissions": {
                            "type": "string"
                          },
                          "requirements": {
                            "type": "string"
                          },
                          "setup": {
                            "type": "string"
                          },
                          "source_url": {
                            "format": "uri",
                            "type": "string"
                          },
                          "type": {
                            "enum": ["official", "community"],
                            "type": "string"
                          }
                        },
                        "required": ["customer_account_tested", "documentation_reviewed_at", "permissions", "requirements", "setup", "source_url", "type"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Reviewed setup documentation, not a compatibility or security test. Null means no reviewed setup guide is attached, not that a connector cannot exist."
                  },
                  "description": {
                    "description": "Full listing description",
                    "type": ["string", "null"]
                  },
                  "install_command": {
                    "description": "MCP install command, if the tool ships an MCP server",
                    "type": ["string", "null"]
                  },
                  "links_verified": {
                    "description": "True if an automated check confirmed every URL on this listing resolved, as of links_verified_at. An automated link check only — NOT an endorsement, security audit, or legal review.",
                    "type": "boolean"
                  },
                  "links_verified_at": {
                    "description": "ISO date of the last passing link check; null = not confirmed (often just bot-blocking)",
                    "type": ["string", "null"]
                  },
                  "listing_url": {
                    "description": "Canonical listing page on legalaimcp.com",
                    "type": "string"
                  },
                  "maker": {
                    "description": "Creator or vendor name",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Tool name",
                    "type": "string"
                  },
                  "pricing_details": {
                    "description": "Pricing notes, if any",
                    "type": ["string", "null"]
                  },
                  "pricing_model": {
                    "description": "One of: free, freemium, paid, contact",
                    "type": "string"
                  },
                  "repo": {
                    "description": "Source repository, if open source",
                    "type": ["string", "null"]
                  },
                  "slug": {
                    "description": "Stable listing identifier — pass to get_legal_ai_tool",
                    "type": "string"
                  },
                  "source_review": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "customer_account_tested": {
                            "const": false,
                            "type": "boolean"
                          },
                          "reviewed_at": {
                            "type": "string"
                          },
                          "scope": {
                            "const": "public_documentation",
                            "type": "string"
                          },
                          "source_urls": {
                            "items": {
                              "format": "uri",
                              "type": "string"
                            },
                            "type": "array"
                          }
                        },
                        "required": ["customer_account_tested", "reviewed_at", "scope", "source_urls"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Dated primary-source review for the matching published claims. This is not a runtime, security or legal-output test."
                  },
                  "tagline": {
                    "description": "One-line summary",
                    "type": ["string", "null"]
                  },
                  "website": {
                    "description": "Tool website",
                    "type": ["string", "null"]
                  }
                },
                "required": ["category", "category_label", "connection", "description", "install_command", "links_verified", "links_verified_at", "listing_url", "maker", "name", "pricing_details", "pricing_model", "repo", "slug", "source_review", "tagline", "website"],
                "type": "object"
              }
            },
            "required": ["found"],
            "type": "object"
