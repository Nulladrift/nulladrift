                "type": "string"
              },
              "methodology": {
                "type": "string"
              },
              "retrieved_at": {
                "type": "string"
              },
              "steps": {
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 3,
                "type": "array"
              },
              "tools": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "compatibility": {
                      "const": "Not tested with a customer account or ChatGPT",
                      "type": "string"
                    },
                    "connection_type": {
                      "anyOf": [
                        {
                          "enum": ["official", "community"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "links_checked_at": {
                      "type": ["string", "null"]
