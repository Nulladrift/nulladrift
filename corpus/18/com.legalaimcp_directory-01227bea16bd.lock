        {
          "name": "search_legal_ai_tools",
          "title": "Search legal AI tools",
          "description": "Search the legalaimcp.com directory of AI tools and MCP servers built for law firms. Filter by free-text query, practice-area category, and pricing model. Use this when someone asks what AI tooling exists for legal work such as contract review, legal research, client intake, billing, or compliance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Practice-area filter — get slugs from list_legal_ai_categories",
                "enum": ["document_processing", "case_management", "client_communication", "legal_research", "billing_time", "compliance", "general"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return (1–25, default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "pricing": {
                "description": "Pricing-model filter: free, freemium, paid, or contact",
                "enum": ["free", "freemium", "paid", "contact"],
                "type": "string"
              },
              "query": {
                "description": "Free-text search over tool names, taglines, and descriptions, e.g. \"contract review\"",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
