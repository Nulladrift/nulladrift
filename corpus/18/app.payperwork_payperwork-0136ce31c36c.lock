      "serverInfo": {
        "name": "payperwork",
        "version": "0.4.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PayperWork index. Paid services for agents over x402 (USDC on Base): no signup, the paying wallet is the identity, every call is priced before it runs and charged only if it succeeds. This server only describes the services; each one is its own MCP server: drop at https://payperwork.app/drop/mcp (temporary key-value drops and hand-off channels; put $0.002, wait $0.001, reads free) ai at https://payperwork.app/ai/mcp (chat completions on frontier models, priced per call from the request) decide at https://payperwork.app/decide/mcp (decision models: yes/no, choice and score questions answered as probabilities, priced per decision) and image at https://payperwork.app/image/mcp (image generation on GPT Image and Gemini image models, priced per image). Call list_services, then describe_service for the one you want. Off-the-shelf MCP clients cannot pay x402 tools; call the HTTP route through a Coinbase wallet instead. Claude Code, Claude Desktop, Codex CLI, Gemini CLI: npx @coinbase/payments-mcp, then its x402 request tool (pays within limits, no tap per call). Claude.ai, ChatGPT, Cursor: add the Wallet MCP connector https://wallet-mcp.coinbase.com, then initiate_x402_request and complete_x402_request (each call approved in the wallet app). This MCP server is for agents built with an x402-aware MCP client (@x402/mcp, or the agents package). Plain text: https://payperwork.app/llms.txt. Security model: every call is priced before it runs (the 402 states the amount) and charged only if it succeeds; the paying wallet is the identity; no account or key exists to revoke. Full statement: GET / (JSON) or /llms.txt.",
      "tools": [
        {
          "name": "describe_service",
          "title": "Describe a service",
          "description": "One service in full: its MCP URL and config snippet, HTTP routes, prices, limits and security model. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "service": {
                "description": "drop, ai, decide or image",
                "enum": ["drop", "ai", "decide", "image"],
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
