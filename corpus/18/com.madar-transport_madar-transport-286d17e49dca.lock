      },
      "instructions": "Madar Transport («مدار للنقل», madar-transport.com) is an Egyptian company that hires out whole vehicles with their drivers to groups: a 13-seat HiAce, a 21-seat Coaster, a 28–33 seat midibus and 49+1 seat coaches. Mansoura, Dakahlia and the Nile Delta first, every governorate of Egypt, conferences in any Egyptian city, and tour-operator transport in Luxor and Aswan. It never sells single seats and is transport only (no guides, tickets or hotels). It publishes NO prices: every trip gets a written quote from Madar on WhatsApp within the day. Use get_company_info first, recommend_vehicle to size the group (people incl. children, and bags), list_services / list_fleet / list_destinations / search_site / get_page to answer questions from the site itself, and request_quote to send the traveller's trip to Madar — only with the traveller's permission and their own contact details. request_quote books nothing and charges nothing: it sends the request straight to Madar, whose team is notified at once, and returns a reference to give the traveller (and an optional WhatsApp link for adding details); Madar replies with the price within the day. Never invent a price and never ask for payment details. Answer in Arabic (lang 'ar') when the traveller writes Arabic.",
