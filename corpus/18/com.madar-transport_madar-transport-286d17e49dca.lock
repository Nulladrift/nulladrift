        {
          "name": "request_quote",
          "title": "Send a quote or booking request to Madar",
          "description": "Sends the traveller's trip to Madar Transport as a quote request (or a booking request with ready_to_book), with the traveller's own name and WhatsApp/phone — only with their permission. The request goes straight to Madar and their team is notified at once; nothing is booked or charged. It returns a reference to give the traveller, and an optional WhatsApp link if they want to add details; Madar replies with a written price within the day, by WhatsApp or phone. Ask for the day-by-day programme with start and end times for any trip longer than one day. Use dry_run to test without sending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assistant": {
                "description": "Your name, e.g. ChatGPT, Claude, Gemini",
                "maxLength": 80,
                "type": "string"
              },
              "bags": {
                "description": "Number of bags",
                "minimum": 0,
                "type": "integer"
              },
              "children": {
                "minimum": 0,
                "type": "integer"
              },
              "date": {
                "description": "Travel date (e.g. 2026-12-04)",
                "maxLength": 60,
                "type": "string"
              },
              "days": {
                "description": "Number of days the vehicle is needed",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "driver_overnight": {
                "description": "For multi-day trips: who covers the driver's accommodation and meals",
                "maxLength": 200,
                "type": "string"
              },
              "dropoff": {
                "description": "Exact destination",
                "maxLength": 300,
                "type": "string"
              },
              "dry_run": {
                "description": "Validate and preview without sending anything",
                "type": "boolean"
              },
              "email": {
                "maxLength": 120,
                "type": "string"
              },
              "flight_number": {
                "description": "For airport pick-ups",
                "maxLength": 40,
                "type": "string"
              },
              "foreign_group": {
                "type": "boolean"
              },
              "language": {
                "description": "Language of the WhatsApp message (default en)",
                "enum": ["ar", "en"],
                "type": "string"
              },
              "nationality": {
                "maxLength": 60,
                "type": "string"
              },
              "notes": {
                "maxLength": 2000,
                "type": "string"
              },
              "people": {
                "description": "Everyone travelling, children included",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "pickup": {
                "description": "Exact pick-up place (hotel, address, airport and terminal)",
                "maxLength": 300,
                "type": "string"
              },
              "programme": {
                "description": "Day-by-day programme: places, and start and end time of each day",
                "maxLength": 4000,
                "type": "string"
              },
              "ready_to_book": {
                "description": "True if the traveller wants to book once the price is confirmed",
                "type": "boolean"
              },
              "return_date": {
                "description": "Return date and time, if returning on another day",
                "maxLength": 60,
                "type": "string"
              },
              "service": {
                "description": "e.g. conference transport, airport transfer, day trip",
                "maxLength": 120,
                "type": "string"
              },
              "stops": {
                "description": "Stops on the way, if any",
                "maxLength": 500,
                "type": "string"
              },
              "time": {
                "description": "Departure time",
                "maxLength": 40,
                "type": "string"
              },
              "traveller_name": {
                "description": "The traveller's or group leader's name",
                "maxLength": 120,
                "type": "string"
              },
              "trip_type": {
                "enum": ["one_way", "return_same_day", "return_another_day", "vehicle_stays_several_days", "full_day_in_one_city", "monthly_contract"],
                "type": "string"
              },
              "vehicle_preference": {
                "maxLength": 120,
                "type": "string"
              },
              "whatsapp_or_phone": {
                "description": "Their WhatsApp or phone number, with country code if outside Egypt",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["date", "dropoff", "people", "pickup", "traveller_name", "whatsapp_or_phone"],
            "type": "object"
          },
