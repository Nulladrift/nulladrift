        {
          "name": "recommend_vehicle",
          "title": "Which vehicle fits this group",
          "description": "Recommends the vehicle size (and how many) for a group from the headcount (every child counts as a seat) and the luggage, using Madar's own rule: HiAce up to 13, Coaster 14–21, midibus 22–33, coach 34–50, more vehicles above that; suitcases that must be locked away start at the midibus; foreign tourist groups ride licensed tourist vehicles. Madar confirms the final size in its quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bags_locked_away": {
                "description": "True if the bags must ride in a closed hold, not on a roof rack or inside",
                "type": "boolean"
              },
              "foreign_tourists": {
                "description": "True for a group of foreign tourists",
                "type": "boolean"
              },
              "hand_bags": {
                "description": "Small bags and carry-ons",
                "minimum": 0,
                "type": "integer"
              },
              "lang": {
                "description": "Language of the answer: 'ar' (Egyptian Arabic) or 'en'. Default 'en'.",
                "enum": ["ar", "en"],
                "type": "string"
              },
              "people": {
                "description": "Everyone travelling, children included",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "suitcases": {
                "description": "Full-size suitcases",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["people"],
            "type": "object"
          },
