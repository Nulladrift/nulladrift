        "name": "keep-one-resolution",
        "title": "Keep One Resolution",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Most people collect resolutions, then quietly drop them by February. This year, keep one. Just one: Keep One Resolution picks the single resolution small enough to still be alive in December, with a first step, a weekly check-in, and a letter to future you. Keep One Resolution gives a person ONE resolution worth keeping. Call pick_resolution when the user wants to choose a New Year resolution: it takes four answers (what part of life needs care, what felt off this year, how much time they can give each week, and what made past plans fail) and returns one resolution sized to their real time, a first move for week one, a guard line for when it gets hard, a weekly check-in prompt they can paste into any AI or notes app, and a short note to future you written for that same plan. The result is computed by the same engine as keeponeresolution.com, from a fixed bank of 30 actions: 6 life areas times 5 feelings. Example: health, felt drained, 30 minutes a week, and forgot last time returns one pick, 'Take a short walk: 10 min, 3x a week,' first move 'Put your shoes by the front door. Walk 5 min right after a meal.' Week one always runs at about half the steady dose (never under 5 minutes, never above the dose), and the result states the week-one size plus a stakes line counted from the plan's own weekly sessions. Call search_resolutions to browse the bank by area, feeling, or word. Call get_resolution for the full detail on one action. If the user names a specific thing they want to learn — a language, an instrument, a subject — say plainly that the bank holds no plan for that subject itself; its learning actions are the practice slot for it, so present the dose as practice time for the thing they named, not as a job skill unless they asked about work. Keep answers to what the tools return: do not invent resolutions, areas, or feelings beyond the bank, and do not give medical, financial, or personal health advice. All tools are read-only; nothing is bought, booked, saved, or tracked.",
      "tools": [
        {
          "name": "get_resolution",
          "title": "Get resolution details",
          "description": "Returns the full detail for one action in the bank of 30: its life area and feeling, the first move for week one, the resolution at all three time levels (30 minutes, 2 hours, and 5 hours a week), the guard line for each kind of past failure, and up to 3 similar actions. Accepts an action id or name from pick_resolution or search_resolutions, or an area plus a feeling. When nothing matches, the result says so and gives example ids.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Optional, with off: one life area, e.g. 'health' or 'home'.",
                "type": "string"
              },
              "off": {
                "description": "Optional, with area: one feeling, e.g. 'drained' or 'stuck'.",
                "type": "string"
              },
              "resolution_id": {
                "description": "Action id from pick_resolution or search_resolutions (e.g. 'take-a-short-walk'), or an action name like 'take a short walk'.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get resolution details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ecc116ce36e3e88fa241ca846085022ace885f836bf145a3b0f72b8666c5d309"
        },
        {
          "name": "pick_resolution",
          "title": "Keep One Resolution",
          "description": "One resolution, not ten: the single pick small enough to still be alive in December, with a first step, a weekly check-in, and a letter to future you. Returns ONE resolution from a fixed bank of 30 actions, computed by the same quiz engine as keeponeresolution.com. The four answers pick the action and size it: the life area and what felt off choose the action, the weekly time sizes the dose (each action has its own dose at each time level, always inside the time they can give), and what made past plans fail picks the guard line. The result carries the resolution, a first move for week one (week one runs at about half the dose, 5-minute floor, and the result states that week-one size plus a stakes line counted from the plan's own weekly sessions), the guard line, a copyable weekly check-in prompt built for that resolution, a short future-you note written for that same plan, share text, and a link to keeponeresolution.com. There are 360 possible answer paths and 90 distinct resolutions. When an answer is missing or not one of the quiz choices, the result says what is needed and lists the valid choices. Example: health, felt drained, 30 minutes a week, forgot last time returns the single pick 'Take a short walk: 10 min, 3x a week.'",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "What part of life needs care: 'Body and health', 'Money', 'Home', 'Work', 'Family and friends', or 'Mind and calm'. Plain words work too, e.g. 'health', 'my job', 'money'.",
                "type": "string"
              },
              "fail": {
                "description": "What made past plans fail: 'I tried to do too much.', 'I just forgot to do it.', 'Life got busy and loud.', or 'I got bored and quit.' Plain words work too, e.g. 'forgot', 'too busy'.",
                "type": "string"
              },
              "off": {
                "description": "What felt off this year: 'I felt drained a lot.', 'Things piled up on me.', 'I felt stuck in place.', 'I drifted from good habits.', or 'I felt alone a lot.' Plain words work too, e.g. 'drained', 'stuck'.",
                "type": "string"
              },
              "time": {
                "description": "How much time they can give: '30 minutes a week', '2 hours a week', or '5 hours a week'.",
                "type": "string"
              }
            },
            "required": ["area", "fail", "off", "time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Keep One Resolution"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e09401ef96b0002083f6735f76a6df603a6f8c73803305d3152e3da58f99b9e3"
        },
        {
          "name": "search_resolutions",
          "title": "Search resolutions",
          "description": "Searches the fixed bank of 30 resolution actions by life area, by what felt off, by a keyword, or by a mix of those. Returns up to 30 matches in bank order, each with its area and feeling, plus the total number of matches, including when there are none. Use it to browse what the quiz can pick before running the full quiz with pick_resolution.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Optional filter: one life area: 'Body and health', 'Money', 'Home', 'Work', 'Family and friends', or 'Mind and calm'.",
                "type": "string"
              },
              "keyword": {
                "description": "Optional: a plain word to match against action names, e.g. 'walk', 'meal', 'savings'.",
                "type": "string"
              },
              "limit": {
                "description": "Optional: max results to return, 1 to 30. Default 10.",
                "type": "number"
              },
              "off": {
                "description": "Optional filter: one feeling: drained, piled up, stuck, drifted, or alone.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
