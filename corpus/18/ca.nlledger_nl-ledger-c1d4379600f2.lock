        {
          "name": "search_records",
          "title": "Search spending records",
          "description": "Search every line item: contract awards, federal contracts and grants, minister and MHA expense lines, and pay over $100,000. records holds exact matches: every word matches (by prefix), largest amount first, up to 25 per page (use page for more). A misspelled word is corrected when nothing matches exactly (see corrected). On page 1, related_by_meaning adds up to 20 records about the same thing that do not contain every word, closest first. Give a query, a filter, or both. Each record has its source citation. Sources: ppa = Provincial contract award; fed_contract = Federal contract; fed_grant = Federal grant or contribution; canadabuys = Federal award notice; pa_pss = Federal professional services payment; pa_tp = Federal transfer payment; sunshine = Public sector pay over $100,000; minister = Minister's expense claim; mha = MHA expense.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number. Default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "pattern": {
                "description": "Flag id from list_flags, e.g. no-competition.",
                "type": "string"
              },
              "query": {
                "description": "Words to find, e.g. 'ferry repair', a company name, a town or a job title.",
                "type": "string"
              },
              "source": {
                "description": "Limit to one source.",
                "enum": ["ppa", "fed_contract", "fed_grant", "canadabuys", "pa_pss", "pa_tp", "sunshine", "minister", "mha"],
                "type": "string"
              },
              "supplier_id": {
                "description": "Supplier id from get_supplier.",
                "type": "string"
              },
              "year": {
                "description": "Calendar year of the record date, e.g. 2024.",
                "pattern": "^\\d{4}$",
                "type": "string"
              }
            },
            "type": "object"
          },
