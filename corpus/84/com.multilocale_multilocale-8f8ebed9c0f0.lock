        {
          "name": "export_locale_dictionary",
          "title": "Export one language's strings",
          "description": "Use this when someone wants the key and value pairs of one language, for example to review or copy a translation file. Returns up to 50 entries per call (25 by default) sorted by key, values cut to 500 characters, with nextSkip for the next page. Not for a complete file download, which the MultiLocale CLI provides.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Locale code to export, such as en",
                "maxLength": 35,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Entries to return, from 1 to 50; defaults to 25",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "integer"
              },
              "project": {
                "description": "Project name; an id matches nothing",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "skip": {
                "description": "Keys to skip in alphabetical order, for paging: pass the previous nextSkip; defaults to 0, at most 10000",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["language", "project"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entries": {
                "description": "Key and value pairs sorted by key, values cut to 500 characters",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "maxLength": 256,
                      "minLength": 1,
                      "type": "string"
                    },
                    "value": {
                      "maxLength": 500,
                      "type": "string"
                    }
                  },
                  "required": ["key", "value"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "hasMore": {
                "type": "boolean"
              },
              "language": {
                "maxLength": 35,
                "type": "string"
              },
              "nextSkip": {
                "anyOf": [
                  {
                    "$ref": "#/properties/skip"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Pass as skip to get the next page; null on the last page"
              },
              "offsetCapReached": {
                "type": "boolean"
              },
              "project": {
                "maxLength": 128,
                "type": "string"
              },
              "returnedCount": {
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "skip": {
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "status": {
                "enum": ["found", "empty", "partial"],
                "type": "string"
              },
              "valuesTruncated": {
                "type": "boolean"
              }
            },
            "required": ["entries", "hasMore", "language", "nextSkip", "offsetCapReached", "project", "returnedCount", "skip", "status", "valuesTruncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Export one language's strings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
