                "minLength": 1,
                "type": "string"
              },
              "locales": {
                "description": "Other locale codes to start with, such as it or de; the default locale is added automatically",
                "items": {
                  "maxLength": 35,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "name": {
                "description": "Name of the new project, 1 to 128 characters; a URL-safe slug such as my-app is easiest to reference later",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["defaultLocale", "name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "project": {
                "anyOf": [
