        {
          "name": "add_locale",
          "title": "Add a language and translate it",
          "description": "Use this when someone asks to add a new language to a project and translate their strings into it. Returns the updated language list and how many strings were machine-translated, one per key, all before anything is saved, so a very large project can time out. Not for a language the project already has.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Note applied to every translation in this run, up to 600 characters",
                "maxLength": 600,
                "type": "string"
              },
              "locale": {
                "description": "Locale code to add, such as it or pt-BR",
                "maxLength": 35,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Translation model id; defaults to gpt-6-luna",
                "maxLength": 64,
                "type": "string"
              },
              "project": {
                "description": "Project id or name",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["locale", "project"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "maxLength": 35,
                "type": "string"
              },
              "locales": {
                "items": {
                  "maxLength": 35,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "project": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "status": {
                "enum": ["created", "not-found", "already-exists"],
                "type": "string"
              },
              "translationCount": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["locale", "locales", "project", "status", "translationCount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a language and translate it"
