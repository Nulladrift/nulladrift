          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "phraseCount": {
                "minimum": 0,
                "type": "integer"
              },
              "phrases": {
                "description": "Up to 100 matching phrases, values cut to 2,000 characters; phraseCount has the total",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "creationTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
