                "type": "string"
              },
              "note": {
                "description": "A note on this result.",
                "type": "string"
              },
              "notice": {
                "description": "Terms notice: research use only, not legal advice.",
                "type": "string"
              },
              "omissions": {
                "description": "On composed: short source phrases skipped between pieces."
              },
              "outcome": {
