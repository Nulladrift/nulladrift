            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "description": "verify_quote result.",
            "properties": {
              "also_in_obligation_id": {
                "description": "On a match in an amending issuance: the amended obligation that also carries the text.",
                "type": "string"
              },
              "checked_against": {
                "description": "Source documents checked (document, edition, retrieval date)."
              },
              "checked_snapshot_ids": {
                "description": "Snapshot ids checked."
              },
              "coverage": {
                "description": "Share of the text's words found in the source (0 to 1).",
                "type": "number"
              },
              "differences": {
                "description": "On a near miss: {closest_source, missing_from_quote, extra_in_quote}."
              },
              "elisions": {
                "description": "On composed: gaps (marked or not).",
                "type": "number"
              },
              "error": {
                "description": "Present only on an error or refusal: not_found, ambiguous, unparsed, empty_terms, unknown_playbook, unknown_reference, offset_out_of_range, daily_capacity_reached.",
                "type": "string"
              },
              "fallback": {
                "description": "On daily_capacity_reached: where the full corpus can be downloaded.",
                "type": "string"
              },
              "furniture_ignored": {
                "description": "A page footer or running head was ignored.",
                "type": "boolean"
              },
              "guidance": {
                "description": "On a refusal or empty search: the server's explanation.",
                "type": "string"
              },
              "hint": {
                "description": "On an error: the server's explanation.",
                "type": "string"
              },
              "limit": {
                "description": "On not_checked: the word limit.",
                "type": "number"
              },
              "list_markers_ignored": {
                "description": "Added list markers were ignored.",
                "type": "boolean"
              },
              "mandatory_date": {
                "description": "On an Update 18 revision: when it becomes mandatory.",
                "type": "string"
              },
              "matched_against": {
                "description": "The checked document the text matched.",
                "type": "string"
              },
              "matched_obligation_id": {
