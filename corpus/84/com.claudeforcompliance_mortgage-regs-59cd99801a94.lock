            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "description": "search_regs result.",
            "properties": {
              "cited": {
                "description": "When the query is a citation: {citation, register_ids}."
              },
              "error": {
                "description": "Present only on an error or refusal: not_found, ambiguous, unparsed, empty_terms, unknown_playbook, unknown_reference, offset_out_of_range, daily_capacity_reached.",
                "type": "string"
              },
              "fallback": {
                "description": "On daily_capacity_reached: where the full corpus can be downloaded.",
                "type": "string"
              },
              "guidance": {
                "description": "On a refusal or empty search: the server's explanation.",
                "type": "string"
              },
              "handbook": {
                "description": "When the query names a whole handbook: its outline."
              },
