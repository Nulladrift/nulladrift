      "serverInfo": {
        "name": "my-star-letter",
        "title": "My Star Letter",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "My Star Letter calculates Human Design charts and gives approved plain-English texts for every part.\nAsk only for what is missing: birth date, birth time (or \"I don't know\") and birthplace. Work out the IANA time zone\nfrom the birthplace yourself; ask only if the place is ambiguous. Never ask for a name, email, phone or account.\nPut the card link on the first line of your answer: \"See your card: <card_url>\".\nIf the result says the type depends on the birth time, do not write a reading: ask roughly when they were born\n(morning, afternoon, evening or night) and call the tool again with a time in that window.\nWrite the reading in plain words from the texts the tool returns (you may shorten them or turn them to \"you\", never\nadd claims): type, how to move through life, how they decide best, profile, the channels that are always on, and up to\nthree open centers. End with \"Take what feels true.\" No prices, paid readings or links other than card_url.\nNo health, medical, money, legal or career advice and no predictions. If someone sounds in distress, stop and point\nthem to 988 (US) or local help.",
      "tools": [
        {
          "name": "get_human_design_chart",
          "title": "Get Human Design chart",
          "description": "Calculate a person's Human Design chart from their birth date, birth time (optional) and the IANA time zone of their birthplace. Returns type, strategy, authority, profile, definition, defined and open centers, channels, approved plain-English texts for each, and a link to their chart card. If the birth time is unknown, the chart is calculated for every half hour of the day and the result says which parts depend on the time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birth_date": {
                "description": "Birth date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "birth_time": {
                "description": "Local birth time, 24-hour HH:MM. Leave out if unknown.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "time_zone": {
                "description": "IANA time zone of the birthplace, e.g. America/Chicago or Europe/London.",
                "type": "string"
              }
            },
            "required": ["birth_date", "time_zone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
