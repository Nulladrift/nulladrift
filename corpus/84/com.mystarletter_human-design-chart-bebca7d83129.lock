      "instructions": "My Star Letter calculates Human Design, astrology, numerology, BaZi and Saju charts with the same math as the\nfree tools on mystarletter.com, checked against the Swiss Ephemeris, and gives approved plain-English texts.\nPick the tool by the ask: Human Design type or chart -> get_human_design_chart; Sun, Moon, rising, Venus, Mars or big\nthree -> get_birth_chart; Saturn return -> get_saturn_return; North Node or life direction -> get_north_node; two\npeople in astrology -> get_astrology_compatibility; two people in Human Design -> get_human_design_compatibility;\nwhere to live or travel by the stars -> get_astrocartography; Life Path -> get_life_path_number; two Life Path\nnumbers -> get_life_path_compatibility; BaZi or four pillars -> get_bazi_chart; Korean Saju -> get_saju_chart; Saju\nmatch -> get_saju_compatibility.\nAsk only for what is missing: birth date, birth time (or \"I don't know\") and birthplace. Work out the IANA time zone\nfrom the birthplace yourself; ask only if the place is ambiguous. Never ask for a name, email, phone or address.\nPut the link from the result (card_url or page_url) on the first line of your answer.\nIf a result says a part depends on the birth time, say so plainly and offer to check again with a time.\nWrite the reading in plain words from the texts the tool returns (you may shorten them or turn them to \"you\", never\nadd claims). End with \"Take what feels true.\" No prices, paid readings, offers or links other than the returned link.\nNo health, medical, money, legal or career advice and no predictions. If someone sounds in distress, stop and point\nthem to 988 (US) or local help.",
      "tools": [
        {
          "name": "get_astrocartography",
          "title": "Astrocartography lines",
          "description": "Map where on Earth a person's ten planet lines fall (MC, IC, rising and setting lines), the line closest to their birthplace, and which lines run within 700 km of up to five places they name, each with an approved plain meaning and a link to the free astro map. Use when someone asks \"where should I live astrologically\", \"my astro map\", \"astrocartography\", \"my Venus line\" or \"is Lisbon good for me\". Lines come from an ephemeris checked against the Swiss Ephemeris and move about 1,000 miles per hour of birth time, so this needs an exact birth time and birthplace. Put the cities to check in places.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birth_date": {
                "description": "Birth date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "birth_place": {
                "description": "Birthplace as city, region, country, e.g. Austin, Texas, United States. Gives coordinates (and the time zone if time_zone is left out).",
                "maxLength": 80,
                "type": "string"
              },
              "birth_time": {
                "description": "Local birth time, 24-hour HH:MM. Leave out if unknown.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "latitude": {
                "description": "Birthplace latitude, if the city is not found. Optional.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Birthplace longitude (east positive), with latitude. Optional.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "places": {
                "description": "Up to five cities to check for nearby lines, e.g. [\"Lisbon, Portugal\"]. Optional.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "time_zone": {
                "description": "IANA time zone of the birthplace, e.g. America/Chicago. Work it out from the birthplace. Needed with a birth_time unless birth_place is in our list.",
                "type": "string"
              }
            },
            "required": ["birth_date", "birth_time"],
            "type": "object"
          },
