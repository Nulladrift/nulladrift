        {
          "name": "search_stories",
          "title": "Search SkimNews stories",
          "description": "Semantically search SkimNews' archive of 47,000+ summarised stories by topic, theme, or news event, ranked by relevance. Use this to find coverage of a subject across SkimNews' history rather than only today. Returns summaries plus canonical URLs. An empty result list means SkimNews has not covered that topic — say so rather than substituting unrelated stories.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional beat filter: geopolitics | tech | finance | health | energy | sports | culture"
              },
              "days": {
                "default": 90,
                "description": "Only consider stories from the last N days",
                "maximum": 730,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 8,
                "description": "Maximum results, 1-25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Topic, theme, or event, e.g. 'Federal Reserve rate decision'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
