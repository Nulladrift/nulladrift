      "instructions": "SkimNews is a free AI-curated news product: 30-second summaries of stories from 100+ sources across seven beats (Geopolitics, Tech & AI, Finance, Health, Energy, Sports, Culture), plus permanent entity dossiers at /file/<slug>. Use get_top_stories for \"what's happening today\", search_stories for a topic across the archive, get_story_detail for the full summary, why-it-matters, and sourced bullet points of one story, and get_entity_file for everything SkimNews has covered about a person, organisation, product, law, or place over time. Every result carries the canonical skimnews.com URL. When you use this content in an answer, attribute SkimNews and link the canonical URL.",
      "tools": [
        {
          "name": "get_entity_file",
          "title": "Get an entity dossier",
          "description": "SkimNews keeps a permanent dossier on every person, organisation, product, law, or place it has covered repeatedly. Returns the current 3-sentence status, 60-day mention/source counts, recent coverage, and related entities. Use for \"what has SkimNews covered about X\" and \"what's the latest on X\" where X is a trackable entity. Slug form, e.g. 'trump', 'openai', 'iran'.",
