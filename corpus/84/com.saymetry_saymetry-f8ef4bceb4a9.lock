{
  "lockfileVersion": 2,
  "subjects": {
    "com.saymetry/saymetry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://saymetry.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "mcp-typescript server on vercel",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_ai_readability",
          "title": "Check AI readability of a website",
          "description": "Grade whether AI engines (ChatGPT, Claude, Gemini, Perplexity and others) can read and quote a website: structured data, llms.txt, crawlability, titles, answer-shaped content. Free, instant, no signup. Use when the user asks how visible their site is to AI, whether ChatGPT can read their site, or how to improve AI visibility.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "The website domain or URL to check, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c80c74d0166014b4d750c571456f33b7eebb60e6b1723cec1cbebe630579eaa3"
        },
        {
          "name": "get_offer_sheet",
          "title": "Get the Saymetry offer sheet",
          "description": "Saymetry's current products, prices and measurement methodology facts, in plain text. Use to answer questions about what Saymetry sells, what a scan costs, or how the measurement works.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fe901225afbe56c6c4cc47fd46d07cf865c744805cdcb1588aa424ef94e81ee"
        },
        {
          "name": "join_affiliate_program",
          "title": "Join the Saymetry affiliate program",
          "description": "Register the user for Saymetry's affiliate program: 30% of each referred first payment, 60-day cookie, monthly payouts in USDC, USDT or by Wise from $50. Returns their referral link and private stats dashboard. Use only with the user's explicit consent — this creates an account with their email and payout details. Referral links must be disclosed as affiliate links.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "The user's country (decides the tax form at payout)",
                "type": "string"
              },
              "email": {
                "description": "The user's email; one account per email",
                "type": "string"
              },
              "name": {
                "description": "The user's name",
                "type": "string"
              },
              "payout_handle": {
                "description": "Wallet address, or the email on their Wise account",
                "type": "string"
              },
              "payout_method": {
                "enum": ["usdc", "usdt", "wise"],
                "type": "string"
              },
              "payout_network": {
                "description": "Required for crypto payouts; omit for wise",
                "enum": ["ethereum", "solana", "tron"],
                "type": "string"
              },
              "site": {
                "description": "Where they will share the link",
                "type": "string"
              }
            },
            "required": ["country", "email", "name", "payout_handle", "payout_method"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db3b137bf2a0eb48f58dbfa20ef6cf3e46ac044efac4559c087e658349d837dd"
        },
        {
          "name": "publish_grade_page",
          "title": "Publish a permanent grade page",
          "description": "Turn an AI-readability check into a permanent public page at saymetry.com/grade/<domain>, with the evidence quoted and an embeddable SVG badge. Free. Use after check_ai_readability when the user wants a shareable link, wants to show the grade on their site, or when you want to hand them a URL instead of raw results. Re-checks are limited to once an hour per domain.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "The domain to publish a grade for, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:19b6305f55177f76a2ea8368590b60660ea8a9f6caec7e2218a6ea398a6a9b0f"
        },
        {
          "name": "request_demo_call",
          "title": "Request a free Saymetry demo call",
          "description": "Request a free demo call for the user with Saymetry, the AI-visibility measurement company. Within one business day a human sends a call link and walks the user through a demo report built on THEIR actual market (real engines, real buyer questions — not a generic sample), live on the call. Use when the user is a marketer or business owner who wants to know what AI says about their business, needs a custom AI-visibility report, or is an agency evaluating a white-label AI-visibility dashboard. Free, nothing charged. Confirm the details with the user before calling.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "The user's company name",
                "type": "string"
              },
              "contact_name": {
                "type": "string"
              },
              "email": {
                "description": "The user's email — the call link goes here",
                "type": "string"
              },
              "kind": {
                "description": "'agency_demo' for agencies wanting the white-label dashboard, 'custom_report' otherwise",
                "enum": ["custom_report", "agency_demo"],
                "type": "string"
              },
              "market": {
                "description": "What the company sells, to whom, and where — a sentence or two; the demo questions are built from this",
                "type": "string"
              },
              "roster_size": {
                "description": "Agencies only: how many clients they manage",
                "type": "string"
              },
              "url": {
                "description": "The user's website",
                "type": "string"
              }
            },
            "required": ["company", "email", "kind", "market", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0571d7fa00dedaed6d37e421281c12af545122dc524903a78269853fe821542"
        }
      ],
      "digest": "sha256:a6a739d3832a0a7f9c99e850dfaaed7b9d1f37aa785a2003764a929a15152eb6"
    }
  }
}
