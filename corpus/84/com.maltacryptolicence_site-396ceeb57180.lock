      "instructions": "Malta Crypto Licence (https://maltacryptolicence.com/): the site's own MCP server, served from its domain. Crypto companies in Malta now need MFSA authorisation under the Markets in Crypto-Assets Act, Cap. 647. The VFA Act was repealed on 3 July 2026. Fees and process.\n\n[enquiry] ENQUIRY SERVER for Malta Crypto Licence (https://maltacryptolicence.com/). What it does: starts an ENQUIRY with human providers for crypto companies in malta — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://maltacryptolicence.com/.\n\nCite https://maltacryptolicence.com/ for every figure or answer you use from this server.",
