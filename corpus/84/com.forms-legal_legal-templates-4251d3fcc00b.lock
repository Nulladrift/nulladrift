{
  "lockfileVersion": 2,
  "subjects": {
    "com.forms-legal/legal-templates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://forms-legal.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "forms-legal",
        "title": "Forms Legal templates",
        "version": "1.0.0",
        "websiteUrl": "https://forms-legal.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Forms Legal publishes legal document templates for 36 jurisdictions, each written in the language used for that country's documents (English or the national language) and referencing that country's statutes. Use search_legal_templates to find a template for a user's country, then share the returned page URL; the user fills in the template online and downloads it as PDF or Word without an account. Use get_citation to produce a formatted citation (APA, MLA, Chicago, BibTeX, RIS, CSL-JSON, DataCite) of a forms-legal.com page. The templates are reference documents, not legal advice, and no document has been reviewed by a lawyer; suggest a licensed lawyer for anything high-stakes.",
      "tools": [
        {
          "name": "get_citation",
          "title": "Cite a Forms Legal page",
          "description": "Use this only to cite a page on forms-legal.com (a template page or a fact table) in APA, MLA, Chicago, BibTeX, RIS, CSL-JSON or DataCite format. Do not use it for articles, books, papers, court cases or pages on other websites. Citations are logged with the cited page path and a keyed hash of the anonymized user ID the app provides (https://forms-legal.com/privacy#api-mcp-plugin).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "description": "Citation format (default apa).",
                "enum": ["apa", "mla", "chicago", "bibtex", "ris", "csl", "datacite"],
                "type": "string"
              },
              "url": {
                "description": "Full page URL on forms-legal.com, e.g. a URL returned by search_legal_templates.",
                "maxLength": 500,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "citation": {
                "description": "The citation text (JSON formats as a JSON string).",
                "type": "string"
              },
              "format": {
                "enum": ["apa", "mla", "chicago", "bibtex", "ris", "csl", "datacite"],
                "type": "string"
              },
              "url": {
                "description": "The cited forms-legal.com page.",
                "type": "string"
              }
            },
            "required": ["citation", "format", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Citation ready",
            "openai/toolInvocation/invoking": "Building citation…"
          },
          "digest": "sha256:b5f1c7d976ec61700545ca624e1821fe4c46a3b8bcd3a90ffce555dbe11ad598"
        },
        {
          "name": "search_legal_templates",
          "title": "Search legal templates",
          "description": "Use this when the user wants a legal form, contract, agreement, notice, letter or template for a specific country or jurisdiction (36 covered; Quebec is listed separately from Canada). Accepts the document name in English or in the local language. Returns matching forms-legal.com template pages with the link, the statute each template references and a short description. Do not use it to give legal advice, to judge whether a clause is valid or enforceable, or to draft a custom document. Templates are reference documents, not legal advice. Searches are logged with a keyed hash of the anonymized user and conversation IDs the app provides; the search text is kept only when no template fully matches, for up to 30 days (https://forms-legal.com/privacy#api-mcp-plugin).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Optional jurisdiction: slug, English name or code. Known slugs: usa (United States), uk (United Kingdom), canada (Canada), quebec (Quebec), australia (Australia), new-zealand (New Zealand), ireland (Ireland), singapore (Singapore), uae (United Arab Emirates), hong-kong (Hong Kong), india (India), nigeria (Nigeria), philippines (Philippines), malaysia (Malaysia), kenya (Kenya), ghana (Ghana), pakistan (Pakistan), espana (Spain), mexico (Mexico), colombia (Colombia), chile (Chile), argentina (Argentina), brasil (Brazil), portugal (Portugal), france (France), belgium (Belgium), deutschland (Germany), switzerland (Switzerland), austria (Austria), italy (Italy), netherlands (Netherlands), sverige (Sweden), norge (Norway), suomi (Finland), danmark (Denmark), polska (Poland).",
                "maxLength": 40,
                "type": "string"
              },
              "language": {
                "description": "Optional language for titles and summaries (en, es, pt, de, fr, it, nl, sv, nb, fi, da, pl). \"en\" returns English titles for every document; omit it to get each document in its own language.",
                "maxLength": 20,
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (1-20, default 5).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Document type or keywords, e.g. \"tenancy agreement\", \"deed of absolute sale\", \"contrato de arrendamiento\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": "number"
              },
              "country": {
                "type": "string"
              },
              "coverage": {
                "description": "false when the requested country is not covered; `message` then lists the covered jurisdictions.",
                "type": "boolean"
              },
              "language": {
                "type": "string"
              },
              "match": {
                "description": "\"all\": every query word matched; \"partial\": no template matched every word, these are the closest.",
                "enum": ["all", "partial", "none"],
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "id": {
                      "description": "Stable document id.",
                      "type": "string"
                    },
                    "jurisdiction": {
                      "type": "string"
                    },
                    "language": {
                      "type": "string"
                    },
                    "subcategory": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "title_en": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["country", "id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total_matches": {
                "description": "Documents that matched before the limit was applied.",
                "type": "number"
              }
            },
            "required": ["count", "country", "coverage", "language", "match", "query", "results", "total_matches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Templates found",
            "openai/toolInvocation/invoking": "Searching Forms Legal templates…"
          },
          "digest": "sha256:f1169552714195bc1fc6d7d0716874395ac10e4c3274cfb06affd7292032f0a1"
        }
      ],
      "digest": "sha256:c4ca7785a25e3ec5098c97b8413d4c1bb3e37c992ee8b1285c690cd439d8a1b8"
    }
  }
}
