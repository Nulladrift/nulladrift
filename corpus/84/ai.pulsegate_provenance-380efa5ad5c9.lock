{
  "lockfileVersion": 2,
  "subjects": {
    "ai.pulsegate/provenance": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.pulsegate.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pulsegate-provenance",
        "version": "0.2.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "PulseGate searches a bounded public software catalog and explains where a listing's identifiers came from. Some apps, recent changes or details about what an app can do may be missing from the index. No matches in the indexed data does not mean no suitable service exists. Search candidates are not verified recommendations: retain recorded classifications, unknown requirements and source limits. Cite recordUrl (record_url on lookup_project), not the publisher URL. No tool returns the complete public purpose profile; follow the record link or documented HTTP detail if your client can. Provenance tools deliberately answer nothing about whether software is alive or maintained; retain what_this_answer_does_not_say. Inspect HTTP status/Content-Type before JSON-RPC, then isError and logical error status; HTTP 200 alone is not success. Respect Retry-After on 429 and do not change format or identity to evade the shared catalog allowance. Every POST, including initialize and tools/list, reserves 80 shared units.",
      "tools": [
        {
          "name": "list_identifier_platforms",
          "title": "List supported identifier platforms",
          "description": "List every platform PulseGate records identifiers on, with how many identifiers it holds for each. Use it to learn the vocabulary the platform argument of lookup_project accepts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List supported identifier platforms"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:779fd5e809b3effad8660e1a30825cfd2dc8504eec35eefd607b635ae8e89ed8"
        },
        {
          "name": "lookup_project",
          "title": "Read a project's identifier evidence",
          "description": "Return the external identifiers PulseGate holds for one project, and for each one how it arrived and whether anyone has checked that it belongs. Makes no claim about whether the software is alive, maintained, or working. Look up by slug, or by an identifier you already have.",
          "inputSchema": {
            "properties": {
              "platform": {
                "description": "Identifier platform to look up by, e.g. \"github_repo\" or \"npm_package\". Use with value.",
                "type": "string"
              },
              "slug": {
                "description": "The PulseGate slug of the listing.",
                "type": "string"
              },
              "value": {
                "description": "The identifier on that platform, e.g. owner/name for github_repo.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a project's identifier evidence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:709955d30ea3e57094c142981706b3016d2b09ef071d4fa7c2058b90f8206776"
        },
        {
          "name": "search_catalog",
          "title": "Find software for a task",
          "description": "Find software by name, task or recorded filters. Returns at most ten candidates from the same service as native HTML/HTTP search, with recordUrl and met/unmet/unknown requirement assessments. Unknown is not false. No complete profile, publisher fetch, bulk export or functionality guarantee.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Recorded category slug, including its descendants.",
                "type": "string"
              },
              "license": {
                "description": "Recorded license family, not a verified legal conclusion.",
                "type": "string"
              },
              "limit": {
                "description": "Same normalization as HTTP search; at most ten combined identities.",
                "type": "integer"
              },
              "page": {
                "description": "Same normalization as HTTP search; depth beyond 50 is refused.",
                "type": "integer"
              },
              "platform": {
                "description": "Recorded platform filter, using the HTTP search vocabulary.",
                "type": "string"
              },
              "pricing": {
                "description": "Recorded pricing classification, not proof of a price.",
                "type": "string"
              },
              "q": {
                "description": "Name or task; at most 512 UTF-8 bytes and 12 words. No model or translation is called.",
                "maxLength": 120,
                "type": "string"
              },
              "require": {
                "description": "Up to three requirements, e.g. api:true,mcp:true. Missing or inferred evidence stays unknown.",
                "maxLength": 256,
                "type": "string"
              },
              "unknown": {
                "description": "Defaults to include candidates needing verification.",
                "enum": ["include", "exclude"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find software for a task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:159d36f9e4f2d5874132491761d2cf08358a8b9868a1b6ee8ea360d4363bab42"
        }
      ],
      "digest": "sha256:bf0a8b255012cd4f2aae5089fff5d65df204d2c50797343f91ab1f374f867a2c"
    }
  }
}
