                "minLength": 1,
                "title": "Next Step Summary",
                "type": "string"
              },
              "request_summary": {
                "description": "The user request that needs more Unquant access.",
                "maxLength": 240,
                "minLength": 1,
                "title": "Request Summary",
                "type": "string"
              },
              "value_summary": {
                "description": "The useful result that Unquant already delivered.",
                "maxLength": 240,
                "minLength": 1,
                "title": "Value Summary",
                "type": "string"
              }
            },
