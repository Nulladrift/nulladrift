            },
            "additionalProperties": false,
            "description": "The current state and next action for an upgrade request.",
            "properties": {
              "agent_context_received": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Whether Unquant saved all three agent summaries.",
                "title": "Agent Context Received"
              },
              "confirmation_required": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Whether the upgrade needs user confirmation.",
                "title": "Confirmation Required"
              },
              "confirmation_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The link that the agent must return to the user.",
                "title": "Confirmation Url"
              },
              "confirmation_url_expires_at": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The UTC expiration time for the confirmation link.",
                "title": "Confirmation Url Expires At"
              },
              "confirmation_url_is_opaque": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Whether the agent must preserve the exact link.",
                "title": "Confirmation Url Is Opaque"
              },
              "human_action": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The action that the user must complete.",
                "title": "Human Action"
              },
              "message": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A concise state message.",
                "title": "Message"
              },
              "plan": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/UpgradePlan"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The requested paid plan."
              },
              "privacy_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The Unquant privacy link.",
                "title": "Privacy Url"
              },
              "recommended_poll_seconds": {
                "anyOf": [
                  {
                    "type": "integer"
