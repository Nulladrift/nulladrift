                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The minimum interval between status requests, in seconds.",
                "title": "Recommended Poll Seconds"
              },
              "status": {
                "description": "The current state of the upgrade request.",
                "title": "Status",
                "type": "string"
              },
              "terms_url": {
