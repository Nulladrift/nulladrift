{
  "lockfileVersion": 2,
  "subjects": {
    "com.ailounge99/lounges": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ailounge99.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ailounge99",
        "title": "AILounge99 lounge passes",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AILounge99 will sell (not on sale yet) single-visit airport lounge passes at four prices. Use match_itinerary for a trip, search_catalog to find lounges, get_lounge for details and get_product_rules for prices and rules. Never claim a lounge is usable when a leg lists caveats, or pick for a leg marked needs_answer; ask the traveller the question instead. Lounge rules come from a catalogue snapshot: the lounge desk has the final say. This server is read-only: it cannot quote, book or buy.",
      "tools": [
        {
          "name": "get_lounge",
          "title": "Lounge details",
          "description": "Opening hours, location, security side, stay limit, children policy, amenities and notices for one lounge.",
          "inputSchema": {
            "properties": {
              "lounge_id": {
                "description": "Lounge id from search_catalog or match_itinerary",
                "type": "string"
              }
            },
            "required": ["lounge_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da882157924337d39bc1ccabb505c176a9941974d5b781eaba1e7028c220fff0"
        },
        {
          "name": "get_product_rules",
          "title": "Pass prices and rules",
          "description": "The four AILounge99 passes with prices in a currency, how many lounges each covers, and the rules (validity, refunds, transfers, one pass per person per visit).",
          "inputSchema": {
            "properties": {
              "currency": {
                "default": "USD",
                "description": "ISO 4217 code, e.g. USD, EUR, CNY, JPY",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eab4c0c1c5f2debac33de2427bae1e32f9ba0bee1cb822373ac1fb1da159e8f0"
        },
        {
          "name": "match_itinerary",
          "title": "Match a trip to lounges",
          "description": "Given a trip (free text in any language, or structured stops), checks every lounge at each departure and connection against security area, terminal (including which terminals connect after security) and children, ranks the rest by the traveller's wishes and price (a lounge closed at the given time goes last, flagged), and returns the pass needed per leg with a total. A missing fact that would change the pass comes back as a question (\"questions\", \"changes_the_pass\": true) and that leg as \"needs_answer\" with what each answer gives, never as an assumption; ask the traveller, then call again with the answer in \"trip\" (e.g. the stop's \"terminal\"). Read-only: it does not reserve or buy anything.",
          "inputSchema": {
            "properties": {
              "currency": {
                "default": "USD",
                "type": "string"
              },
              "text": {
                "description": "The trip as the traveller said it, e.g. \"Shenzhen to Tokyo via Singapore, 4h layover, 2 adults, want a shower\"",
                "type": "string"
              },
              "trip": {
                "description": "Structured alternative to text. Stops in travel order.",
                "properties": {
                  "adults": {
                    "minimum": 1,
                    "type": "integer"
                  },
                  "children": {
                    "description": "Ages; -1 if unknown",
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "layovers": {
                    "additionalProperties": {
                      "type": "integer"
                    },
                    "description": "Connection minutes by IATA, e.g. {\"SIN\": 240}",
                    "type": "object"
                  },
                  "preferences": {
                    "items": {
                      "enum": ["shower", "food", "sleep", "work", "quiet", "family"]
                    },
                    "type": "array"
                  },
                  "stops": {
                    "items": {
                      "properties": {
                        "departs": {
                          "description": "Local departure time HH:MM",
                          "type": "string"
                        },
                        "iata": {
                          "type": "string"
                        },
                        "role": {
                          "enum": ["departure", "transit", "arrival"]
                        },
                        "terminal": {
                          "description": "\"Terminal 2\"",
                          "type": "string"
                        }
                      },
                      "required": ["iata", "role"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["stops"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:077407441e729734fa48184a6b453edaf5bffab71bb70e975c28ab80c0848e06"
        },
        {
          "name": "search_catalog",
          "title": "Search airports and lounges",
          "description": "Find airports and lounges sold with AILounge99 passes by city, airport name, IATA code or lounge name. Returns each lounge with its pass tier, terminal and security side.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "City, airport, IATA code or lounge name, e.g. \"Singapore\", \"SIN\", \"Plaza Premium\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16681b81068f1487e01ba08288ce4e871310fb7d805d21ccfef9d8902fd34072"
        }
      ],
      "digest": "sha256:12a8dce6db5e02b48c4e36a7d33d7c862b658210bfe88379580f056eba69a4ea"
    }
  }
}
