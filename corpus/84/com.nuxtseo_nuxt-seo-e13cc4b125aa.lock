      "instructions": "Use diagnose_url first to audit any public URL. It returns a score, a grade, and findings ranked by severity, each with the fix. Use the single checks (check_meta_tags, validate_schema, debug_social_share, analyze_robots_txt, validate_sitemap) to inspect one area in detail. Use search_pages, then get_page_markdown, to answer questions about the Nuxt SEO modules. Use list_modules and get_module_setup to install one. URL tools are rate limited per ChatGPT user when the client names one, otherwise per IP with the free web tools. A failed call returns isError with a _tag and a message; the nuxtseo.com/retry entry in _meta says whether to retry.",
