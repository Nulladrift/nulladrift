        },
        {
          "name": "diagnose_url",
          "title": "Diagnose URL",
          "description": "Audit one public URL for search and AI answers in a single call: returns a 0 to 100 score, a grade, and findings ranked by severity, each with the fix, covering indexability, meta tags, Schema.org, social cards, sitemap and robots.txt.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "URL to run a combined SEO/GEO diagnosis on (indexability, meta, schema, social, sitemap, robots)",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checks": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "fetchedAt": {
                "type": "number"
              },
              "finalUrl": {
                "type": "string"
              },
              "findings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "enum": ["indexability", "meta", "social", "structured-data", "content", "discoverability"],
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    },
                    "docs": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["error", "warning", "notice"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "detail", "id", "severity", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "grade": {
                "enum": ["A", "B", "C", "D", "F"],
                "type": "string"
              },
              "score": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "stats": {
                "additionalProperties": false,
                "properties": {
                  "errors": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "notices": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "passed": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "warnings": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["errors", "notices", "passed", "warnings"],
                "type": "object"
              },
              "status": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "summary": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["checks", "fetchedAt", "findings", "grade", "score", "stats", "summary", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Diagnose URL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "filename": "diagnose-url.ts",
