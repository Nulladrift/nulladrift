{
  "lockfileVersion": 2,
  "subjects": {
    "com.nuxtseo/nuxt-seo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nuxtseo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Nuxt SEO",
        "version": "2.0.1",
        "description": "Free SEO checks for any URL, and the Nuxt SEO module docs."
      },
      "capabilities": {
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use diagnose_url first to audit any public URL. It returns a score, a grade, and findings ranked by severity, each with the fix. Use the single checks (check_meta_tags, validate_schema, debug_social_share, analyze_robots_txt, validate_sitemap) to inspect one area in detail. Use search_pages, then get_page_markdown, to answer questions about the Nuxt SEO modules. Use list_modules and get_module_setup to install one. URL tools are rate limited per ChatGPT user when the client names one, otherwise per IP with the free web tools. A failed call returns isError with a _tag and a message; the nuxtseo.com/retry entry in _meta says whether to retry.",
      "tools": [
        {
          "name": "analyze_robots_txt",
          "title": "Analyze robots.txt",
          "description": "Fetch and parse the robots.txt of a site: rules per user agent, sitemap directives, syntax errors, and whether the file exists at all.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "URL or domain to fetch robots.txt from",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Analyze robots.txt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "filename": "analyze-robots-txt.ts",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:4d157f2c96e6153a6a35096056c2fb8e1f31ae42ff5f2ec8892e3615f1b451a6"
        },
        {
          "name": "check_meta_tags",
          "title": "Check Meta Tags",
          "description": "Read the head metadata of a URL: title, language, every meta tag (description, robots, Open Graph, Twitter), canonical and hreflang links, and the JSON-LD block count.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "URL to check meta tags for",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Meta Tags"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "filename": "check-meta-tags.ts",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:8aac18f28a0d93e3a052b6358e3922a9ec4759cdd214ae098887d26dcfb0ff06"
        },
        {
          "name": "convert_html_to_markdown",
          "title": "Convert HTML to Markdown",
          "description": "Convert a web page (by URL) or a raw HTML string to Markdown, optionally keeping only the main content without navigation and footer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "extractContent": {
                "default": false,
                "description": "Extract main content only, removing nav/footer/etc.",
                "type": "boolean"
              },
              "html": {
                "description": "Raw HTML to convert (optional if url provided)",
                "type": "string"
              },
              "url": {
                "description": "URL to fetch and convert (optional if html provided)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Convert HTML to Markdown"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "filename": "convert-html-to-markdown.ts",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:7ff32cb3a678dc02a8b190a21dccde9f2288f17eb877114fba8ecb8a34e92cf9"
        },
        {
          "name": "debug_social_share",
          "title": "Debug Social Share Cards",
