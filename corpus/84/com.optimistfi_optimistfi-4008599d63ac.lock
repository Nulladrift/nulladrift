                "description": "One venue id (hyperliquid, dydx, aster, lighter, gmx, …) for whales, new_listings, exchanges, open_interest (that venue's markets, with longs and shorts on a pool venue), large_orders, orderbook_heatmap, liquidation_feed and footprint (that venue's price buckets).",
                "title": "Venue"
              },
              "view": {
                "default": "trending",
                "description": "trending: where open interest is building over window (1h, 4h or 24h; dollars added, which move with price as well as positions), and the most active markets. movers: the largest price moves up and down over window (5m, 15m, 1h, 4h or 24h). funding: the highest and lowest funding now, annualized (the hour's rate times 8,760, a snapshot) and weighted by open interest, with the venues' settled, running and continuous rates counted. funding_gaps: the same market long on one venue and short on another, what each leg pays or earns after funding and borrow at the latest hourly reading (a snapshot funding spread), each leg's interval and whether its rate is settled or a running estimate, and the two legs' mark-price difference (not executable prices). funding_matrix: every market on every venue, largest open interest first: its funding now (hourly, per 8 hours and annualized), the venue's predicted rate where it publishes one, the funding interval, stablecoin- or coin-margined, and open interest. premium: listings trading furthest above or below the index they settle on (for a stock perp, the stock's price). open_interest: the largest markets by open interest (one side of the market: how much is open, not which way traders lean), with the change over one, four and 24 hours as the site counts it (a listing in whole) and over the markets read at both ends, in USD and in quantity; with venue, that venue's own markets, largest first, and on a pool venue (GMX, gTrade, Jupiter, Ostium, Variational, Vest, Veranta) each market's longs and shorts in USD. liquidations: per market, the dollars of longs and shorts liquidated over window from complete stored hours (stored_comparable_window), most first, with the venues counted and those left out. whales: single trades of $100K or more and single liquidations of $10K or more over window, largest first, plus the newest trades, each market's net whale buying or selling, totals over time, and big accounts' long and short positioning. new_listings: markets venues listed within window. weekend: while US stocks are shut, every stock perp's move since the close (one stock: get_perps). lean: where Hyperliquid's accounts worth $1M or more lean on each market, long against short, with each side's leverage and open profit. hl_cohorts: every Hyperliquid account's positioning across its markets, or one market's with `market`: accounts and dollars long and short, the share of open interest held, and cohorts by account equity and by all-time P&L, each with its accounts in profit and in loss. position_changes: the largest changes in Hyperliquid accounts' positions over window (15m, 1h, 4h or 24h), what each did (opened, added, reduced, closed, flipped) and the account's size cohort, never the account. twaps: Hyperliquid TWAP orders running now, their remaining size and the buying and selling they schedule over the next hour and day. leverage: every perp offered at `leverage` or more, the venues and their caps, and the move that liquidates at each. builds: markets where open interest kept building for two to seven days while the price lagged, ranked. venues: every venue on OptimistFi's perps pages, with its network, settlement, funding interval and markets. hlp: HLP, Hyperliquid's liquidation backstop vault: its account value and cumulative P&L now, its return month by month and year by year, annualized, and its max drawdowns. oi_caps: on Hyperliquid and each of its builder dexes, the markets at their open-interest cap and since when, and each market's cap against its open interest now, nearest the cap first. basis: for one coin (market), each dated future's premium to its index on Deribit, OKX, Kraken and Gate, annualized, and the 90-day constant-maturity basis over 30 days. options: for one coin (market), Deribit's options by expiry: ATM implied volatility (the term structure), 25-delta call and put IVs and skew, call and put open interest and their ratio, volume, max pain (the strike where the expiry's options pay their holders least), open interest by strike, and the 30-day ATM IV and skew over 30 days. market_series: open interest and 24-hour volume in total and per venue over window (24h hourly, 7d every 4 hours, 30d, 90d or 1y daily), the share of BTC, ETH and the rest, each point with the venues it covers, the venues first read inside the window, the like-for-like total over the venues read across all of it (sameVenues), and each venue's liquidations over the hours it recorded. funding_heatmap: funding weighted by open interest, annualized, every 4 hours over the last week, for each market holding $10M or more. returns: how many markets moved how far over window (24h or 7d) in 5% buckets, and the largest gainers and losers with their open-interest change. rsi: RSI(14) on completed hourly, 4-hour and daily closes, each with its last close; window picks the one ranked (1h, 4h, or 24h for daily), or market reads one. sessions: for one market over 30 days, the average return by UTC hour and weekday and the cumulative return of the Asia, Europe and US sessions. liquidation_feed: every single liquidation record the venues publish one by one (event_feed: a record, not a trader), newest first, with the dollars liquidated per coin and per exchange over trailing windows of 1, 4, 12 and 24 hours and each venue's readThrough; it covers other venues and hours than the stored-window liquidations, so the totals differ. cvd: one market's cumulative volume delta per venue and across venues, and its netflow (taker buying less selling) over 1h, 4h, 12h, 24h, 3d and 7d; with no market, the markets with the most net buying and selling. footprint: one market's taker buying and selling at each price, hour by hour. liquidation_max_pain: the price band within 2, 5, 10 or 25% of a market's price where the most perp positions are liquidated, from Hyperliquid's mapped positions (not options max pain); with no market, every mapped market ranked. hyperliquid: Hyperliquid beside its markets, by section: its user count and totals, validators and staking, spot markets, deploy auctions, builder dexes (HIP-3), outcome markets (HIP-4), USDC through its Arbitrum bridge, traders seen, the leaderboard's top 100 by P&L (ranked, never named) and fees. market_overview: per market, open interest and its split by venue, open interest per dollar of volume, market cap, 30-day volume with its change, sector tags and the price change over 5 minutes to a day, ranked by open interest and by 30-day volume. exchanges: per venue, open interest and its share of reported OI, 24-hour volume, liquidations, markets and taker and maker fee, each column ranked on its own. sectors: each sector's open interest, volume and 1-, 7- and 30-day return weighted by open interest. indicators: the technical indicator or index named by `indicator` (one market's TD Sequential, ATR, RSI, MA, EMA, MACD or Bollinger Bands at `interval`; RSI, ATR and MACD lists across markets; Bitfinex margin longs and shorts, borrow rates, futures to spot volume, the altcoin season index; or the catalog of every indicator and its status). btc_cycle: Bitcoin's long-history measures (AHR999, Pi Cycle Top, Golden Ratio Multiplier, 2-Year MA Multiplier, 200-week average, Rainbow, Stock-to-Flow, Puell Multiple, profitable days) and peak signals. fear_greed: our fear and greed index with each of its six inputs. macro: Bitcoin against money supply (M2), its correlations with stocks, gold, the dollar and ether, and the US economic release calendar. etf: every spot ETF on market (BTC, ETH or SOL; a fund ticker such as IBIT for that fund's days, \"fund BTC\" or \"fund ETH\" for Grayscale's mini trusts; grayscale for every Grayscale trust), each fund's NAV, shares, net assets, coins held, premium and daily net flow from the issuer's own figures. cot: CFTC Commitments of Traders for market's futures (CME and others), weekly positions by trader group. treasuries: companies holding bitcoin, each count dated and quoted from the SEC filing that states it. orderbook: bids against asks resting within 0.5, 1, 2, 5, 10 and 20% of the mid, per venue and summed across venues, each band's change over 1 hour, 24 hours and 7 days, and the bands over window (for one market), or every market ranked by bid-heavy, ask-heavy, deepest and depth added or pulled in 24 hours. large_orders: every price level resting $100K or more within 10% of the mid, as far as each venue's published book reaches (coverage states the span read), resting now (price, size, side, venue, distance from the mid, size against the market's open interest) and those that ended within window, filled, pulled or unseen, with full counts and totals. orderbook_heatmap: one market's resting dollars by price bucket over window, from its book read every five minutes. week_in_numbers: one week's market-wide figures, frozen once built (period 2026-W42). venue_scorecard: one month's figures per venue (period 2026-10).",
                "enum": ["trending", "movers", "funding", "funding_gaps", "funding_matrix", "premium", "open_interest", "liquidations", "whales", "new_listings", "weekend", "lean", "hl_cohorts", "position_changes", "twaps", "leverage", "builds", "venues", "hlp", "oi_caps", "basis", "options", "market_series", "funding_heatmap", "returns", "rsi", "sessions", "liquidation_feed", "cvd", "footprint", "liquidation_max_pain", "hyperliquid", "market_overview", "exchanges", "sectors", "indicators", "btc_cycle", "fear_greed", "macro", "etf", "cot", "treasuries", "orderbook", "large_orders", "orderbook_heatmap", "week_in_numbers", "venue_scorecard"],
