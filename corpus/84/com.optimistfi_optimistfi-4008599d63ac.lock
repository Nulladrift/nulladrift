        {
          "name": "get_perps_market",
          "title": "Perpetual futures — whole market",
          "description": "Perps market research and sized trade costs. trade/cost: BTC/ETH entry, holding and exit dollars from fresh books. Funding, OI, whales and advanced supplied-data studies. Use when the user asks: what does my position cost; where can I trade 100x. Not for: one market overview → get_perps. Args: view; workflow; parameters; market; venue.",
          "inputSchema": {
            "properties": {
              "asset_class": {
                "anyOf": [
                  {
                    "enum": ["crypto", "equity", "index", "commodity", "fx"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this kind of market; unset reads every class.",
                "title": "Asset Class"
              },
              "indicator": {
                "anyOf": [
                  {
                    "enum": ["td", "atr", "rsi", "ma", "ema", "macd", "boll", "rsi_list", "atr_list", "macd_list", "coinbase_premium", "bitfinex_margin", "borrow_rate", "futures_spot_volume", "altcoin_season", "catalog", "m2", "correlations", "calendar"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "indicators view: which one (td, atr, rsi, ma, ema, macd and boll read one market, named by market; the _list ones every market; coinbase_premium is Coinbase's BTC-USD against OKX's BTC-USDT; bitfinex_margin and borrow_rate take a coin as market; catalog lists every indicator with its status). macro view: m2, correlations or calendar; unset reads all three.",
                "title": "Indicator"
