        {
          "name": "get_calendar",
          "title": "Upcoming dated events",
          "description": "What is ahead for a company: the next earnings date projected from its own filing cadence (held, not rolled, marked overdue when lapsed), then trial readouts, nearest first. Use when the user asks: when does X report next; what's coming up for X. Not for: past events → get_filings; what the earnings were → answer. Args: entity; types; limit.",
          "inputSchema": {
            "properties": {
              "entity": {
                "description": "The company: a ticker (AAPL, BRK.B), a company name (Apple) or an SEC CIK.",
                "title": "Entity",
                "type": "string"
              },
              "limit": {
                "default": 12,
                "description": "Most events: the earnings date first, then readouts nearest first to return.",
                "title": "Limit",
                "type": "integer"
              },
              "types": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Kinds of dated event: \"corporate_event\" (projected earnings dates) and \"fda_event\" (clinical trial readouts); unset returns both.",
                "title": "Types"
              }
            },
            "required": ["entity"],
            "title": "get_calendarArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "get_calendarOutput",
            "type": "object"
