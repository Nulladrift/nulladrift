                "default": null,
                "description": "Validated workflow inputs. trade analysis=cost: market BTC/ETH, sizesUsd (1-6 sizes), side long/short, holdingHours, maxAgeSeconds default 3; live Hyperliquid/Lighter books, optional feeOverridesBps, or up to four normalized supplied quotes. Entry, hold and same-book exit dollar scenarios; missing costs stay null. trade analysis=execution_choices: supplied bids/asks, quantityBase, feeBps and optional explicit passive/sliced fill fractions. screen analysis=liquidity_resilience: eventAt, horizonsSeconds, frozen bandPriceRangeUsd, samples/cadence or prospective venue/market capture. study analyses: markouts (fills and timed benchmarks), price_discovery (synchronized observations and predeclared lags/clocks), relative_value (return_beta with frozen training), capacity (fixed cohort and entry/exit books), options_context (bounded expiry IV summaries). risk analyses: reference_divergence (native-timed mark/oracle/sized exit), leg_risk (separate standard linear margin pools), crowded_exit (one shared book and explicit cohort). carry analysis=capture reconciles supplied settled funding with oracle notionals and an explicit entitlement boundary. Legacy carry/funding/hedge/events/replay inputs remain supported. No MCP writes; private prospective cost studies are saved through the authenticated website. Source clocks, assumptions and economic receipts accompany results.",
