      "instructions": "OptimistFi serves three kinds of market data. US companies: the investment thesis for a stock alongside the numbers, SEC filings, insider and congressional trades, capital returns and the earnings calendar. Perpetual futures across venues: prices, funding, open interest, liquidations, leverage limits and the positions of big accounts on Hyperliquid. Prop firms that fund crypto and stock perps traders: each firm's rules, every challenge's price, live discount codes, country, platforms, asset classes and maximum allocation, read from the firms' own pages.",
      "tools": [
        {
          "name": "answer",
          "title": "Financial answer",
          "description": "A stock's full read in one call: the standing investment case, valuation off its filed financials, and the latest quarter. Use when the user asks: is X a buy; is X cheap; what are X's earnings; how was X's quarter; did X beat. response_mode=plain for beginners. Not for: several companies → compare. Args: entity; response_mode.",
          "inputSchema": {
            "properties": {
              "entity": {
                "description": "The company: a ticker (AAPL, BRK.B), a company name (Apple) or an SEC CIK.",
                "title": "Entity",
                "type": "string"
              },
              "reading_level": {
                "anyOf": [
                  {
                    "enum": [5, 10, 13],
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With response_mode plain, who the explanation is written for: 5 a complete beginner, 10 a general reader, 13 an informed investor (unset reads as 13, with precise figures).",
                "title": "Reading Level"
              },
              "response_mode": {
                "default": "standard",
                "description": "\"standard\" (default): the full read with the investment case; \"plain\": a short beginner-friendly explanation at the reading_level grade.",
                "enum": ["standard", "plain"],
                "title": "Response Mode",
                "type": "string"
              }
            },
            "required": ["entity"],
            "title": "answerArguments",
            "type": "object"
          },
