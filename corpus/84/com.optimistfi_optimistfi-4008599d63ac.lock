        {
          "name": "get_capital_returns",
          "title": "Dividends & buybacks",
          "description": "How a company returns capital: dividend-rate history with each raise or cut, buyback authorizations beside the cash actually spent, splits and name changes. Forward ex-dates are not served. Use when the user asks: did X raise its dividend; is X buying back stock; has X cut it. Args: entity; kind = dividends | buybacks | actions.",
          "inputSchema": {
            "properties": {
              "entity": {
                "description": "The company: a ticker (AAPL, BRK.B), a company name (Apple) or an SEC CIK.",
                "title": "Entity",
                "type": "string"
              },
              "kind": {
                "default": "dividends",
                "description": "\"dividends\" (default): the declared per-share dividend over time, each raise or cut named; \"buybacks\": repurchase authorisations beside the cash actually spent; \"actions\": stock splits and name changes; \"calendar\": the declared dividends (forward ex-dates are not served).",
                "enum": ["dividends", "dividend", "buybacks", "buyback", "repurchase", "repurchases", "actions", "action", "corporate_actions", "split", "splits", "name_change", "calendar", "upcoming", "dividend_calendar"],
                "title": "Kind",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Most records to return.",
                "title": "Limit",
                "type": "integer"
              },
              "periods": {
                "default": 8,
                "description": "How many of the latest filed periods to read (usually quarters).",
                "title": "Periods",
                "type": "integer"
              }
            },
            "required": ["entity"],
            "title": "get_capital_returnsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
