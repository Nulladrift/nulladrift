          "description": "House, Senate and President/officials stock trades (STOCK Act) by ticker or filer, dated by transaction. Use when the user asks: who in Congress traded X; what did a member or Trump buy. Not for: company insiders → get_insider_trades. Args: ticker or member; chamber; limit.",
