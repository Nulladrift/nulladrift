{
  "lockfileVersion": 2,
  "subjects": {
    "ai.exducer/turbo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://exducer.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "turbo",
        "title": "ExducerAI",
        "version": "1.0.2",
        "websiteUrl": "https://exducer.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ExducerAI rents whole GPUs in Montréal (CA-QC) by the hour and serves an OpenAI-compatible Models API. Amounts are in CAD. Read prices, servers and templates from the tools; never from memory. A booking is a request: it runs later (wait_for_deployment). Billing is per minute while it runs. Never call create_booking, extend_deployment, set_auto_renew or stop_deployment without the user's explicit yes; quote first. A stop deletes the deployment's disk. A key that starts with tml_test_ is a sandbox key: everything is simulated and nothing is charged. To run commands on a deployment use SSH (the CLI: turbo ssh ID --batch -- COMMAND). Docs: search_docs.",
      "tools": [
        {
          "name": "check_availability",
          "title": "GPU availability now",
          "description": "One yes or no per GPU model: is it free right now. A no does not block a request; the request waits for capacity.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GPU availability now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4dd5c9e582b3247f5c32a8ad3849936de6075ff9edc5f066affb476daf9f37b9"
        },
        {
          "name": "create_booking",
          "title": "Book GPUs",
          "description": "Send a GPU request. It is created as requested or queued and becomes running later (use wait_for_deployment); nothing is charged before it runs, then credit is drawn per minute. Quote first with quote_booking and get the user's yes on the total. Retry-safe: see idempotency_key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "auto_renew": {
                "description": "Renew by itself at the end of the term while credit lasts.",
                "type": "boolean"
              },
              "client_reference": {
                "description": "Your own reference for this deployment; unique among the account's live deployments.",
                "maxLength": 128,
                "type": "string"
              },
              "confirm": {
                "description": "Must be true. It states that the user approved this exact action after seeing what it does and costs. With a sandbox key (tml_test_…) nothing is real and it may be set freely.",
                "type": "boolean"
              },
              "gpus": {
                "description": "Number of GPUs: one of the server's allowed_gpu_counts.",
                "maximum": 4096,
                "minimum": 1,
                "type": "integer"
              },
              "hours": {
                "description": "Duration in hours. A live booking has a minimum (the API answers duration_below_minimum under it).",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "Optional. 8 to 128 characters. Reuse the same value when retrying the same request. Left out, one is derived from the request and the UTC date, so the identical request the same day returns the first answer; pass a new value to really do it a second time.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "image": {
                "description": "A container image instead of a template. Only images the platform already runs are accepted.",
                "maxLength": 255,
                "type": "string"
              },
              "notes": {
                "description": "A note for the staff who place the request.",
                "maxLength": 1000,
                "type": "string"
              },
              "renew_hours": {
                "description": "The renewal block in hours.",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              },
              "sandbox_scenario": {
                "description": "Sandbox keys only: the lifecycle to simulate.",
                "enum": ["immediate", "busy", "marketplace_release", "fail_start", "host_unreachable", "insufficient_credit", "capacity_timeout", "slow_start"],
                "type": "string"
              },
              "sandbox_speed": {
                "description": "Sandbox keys only: shorten every simulated wait this many times.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "server_id": {
                "description": "Server id from list_servers.",
                "type": "string"
              },
              "ssh_public_key": {
                "description": "The text of the user's SSH public key (.pub), one key per line. Left out, the keys saved on the account are used. Required with a sandbox key.",
                "maxLength": 4096,
                "type": "string"
              },
              "template": {
                "description": "Template slug from list_templates. Left out: the default PyTorch image.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["confirm", "gpus", "hours", "server_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Book GPUs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b8c4d720d1f62f67336c62575ca140aef71528de16ab79b8152d7520523fa5d6"
        },
        {
          "name": "extend_deployment",
          "title": "Run a deployment longer",
          "description": "Add hours to the term of a deployment that is requested, queued, provisioning or running. Same machine, same SSH details; billing stays per minute. Tell the user the extra cost (hours × gpu_count × rate) and get a yes first. Retry-safe: see idempotency_key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "description": "Must be true. It states that the user approved this exact action after seeing what it does and costs. With a sandbox key (tml_test_…) nothing is real and it may be set freely.",
                "type": "boolean"
              },
              "hours": {
                "description": "Hours to add. The new end may not be more than 720 hours away.",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              },
              "id": {
                "description": "The deployment id (rnt_… on a live key, snd_… in the sandbox).",
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. 8 to 128 characters. Reuse the same value when retrying the same request. Left out, one is derived from the request and the UTC date, so the identical request the same day returns the first answer; pass a new value to really do it a second time.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["confirm", "hours", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Run a deployment longer"
          },
          "behavior": {
