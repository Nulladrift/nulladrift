        {
          "name": "set_auto_renew",
          "title": "Automatic renewal",
          "description": "Turn automatic renewal of a deployment on or off. On, it keeps running and drawing credit past its end time until it is turned off or credit runs short, so get the user's yes first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "description": "Must be true. It states that the user approved this exact action after seeing what it does and costs. With a sandbox key (tml_test_…) nothing is real and it may be set freely.",
                "type": "boolean"
              },
              "enabled": {
                "description": "true: renew at the end of each term while credit lasts. false: end as booked.",
                "type": "boolean"
              },
              "id": {
                "description": "The deployment id (rnt_… on a live key, snd_… in the sandbox).",
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              },
              "renew_hours": {
