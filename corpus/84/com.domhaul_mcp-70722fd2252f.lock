{
  "lockfileVersion": 2,
  "subjects": {
    "com.domhaul/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.domhaul.com/api/mcp/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "domhaul",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_domains",
          "title": "Check Domain Availability",
          "description": "Check whether domain names are actually available to register, using live registry (RDAP) data. Use this when suggesting domain names (verify availability before presenting them, never assume a name is unregistered) or when the user asks whether specific domains are available. Accepts up to 50 fully-qualified domains (e.g. 'brewlog.app'). Returns availability, the registrar for taken domains, a 0-100 brandability score, an estimated resale value, the price in USD (price_usd for term_years, quote it rather than estimating; price_source 'checkout' is the expected charge at buy_url, confirmed before payment), and buy_url, the domhaul checkout page where the user can purchase the domain. If too few names are available, generate more candidates and call again.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domains": {
                "description": "Fully-qualified domain names to check, e.g. ['brewlog.app', 'getbrewlog.com']. Max 50.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "available": {
                      "anyOf": [
                        {
                          "type": "boolean"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "brandability": {
                      "type": "number"
                    },
                    "buy_url": {
                      "description": "domhaul checkout page for purchasing this domain",
                      "type": "string"
                    },
                    "domain": {
                      "type": "string"
                    },
                    "est_value_usd": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Estimated brand resale value in USD (market data + algorithm), NOT the registration cost"
                    },
                    "note": {
                      "type": "string"
                    },
                    "price_source": {
                      "description": "'checkout' = expected buy_url charge; 'estimate' = registrar retail",
                      "enum": ["checkout", "estimate"],
                      "type": "string"
                    },
                    "price_usd": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Total price in USD for term_years"
                    },
                    "registrar": {
                      "type": "string"
                    },
                    "term_years": {
                      "type": "number"
                    }
                  },
                  "required": ["available", "brandability", "domain"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["results", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://domhaul/domain-results.html",
            "openai/toolInvocation/invoked": "Checked domain availability",
            "openai/toolInvocation/invoking": "Checking domain availability…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://domhaul/domain-results.html"
            },
            "ui/resourceUri": "ui://domhaul/domain-results.html"
          },
          "digest": "sha256:ff2b58664d826a51137c8f9ce9b9e624c17d9c161df64a0a183193a1e6fc453c"
        },
        {
          "name": "get_tld_prices",
          "title": "Get TLD Registration Prices",
          "description": "Get registrar retail first-year price estimates in USD for top-level domains (.com, .io, .app, .dev, .ai, …). Use this when the user is comparing TLD options, e.g. 'should I get the .com or the .io?'. For the exact purchase price of a specific domain, use check_domains instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tlds": {
                "description": "TLDs to price, with or without the leading dot, e.g. ['com', '.io', 'app']",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tlds"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "prices": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "first_year_usd": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Registrar retail first-year price estimate in USD; null when unknown"
                    },
                    "tld": {
                      "description": "TLD with leading dot, e.g. '.com'",
                      "type": "string"
                    }
                  },
                  "required": ["first_year_usd", "tld"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["prices"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2282251edb3d550a06f79b9dd568caaabdb4cbc8c9d35c487a03f9f9f84214c5"
        }
      ],
      "resources": [
        {
          "uri": "ui://domhaul/domain-results.html",
          "name": "Domain Results",
          "description": "Interactive domain availability results card",
          "mimeType": "text/html;profile=mcp-app",
          "meta": {
            "openai/widgetCSP": {
              "connect_domains": [],
              "resource_domains": []
            },
            "openai/widgetDescription": "Interactive card listing checked domains with availability, price, estimated resale value, and a Register button that opens domhaul's checkout page, plus an input to check more names.",
            "ui": {
              "csp": {
                "connectDomains": [],
                "resourceDomains": []
              }
            }
          },
          "digest": "sha256:6f2439e35c07c88915403bb0a12b697da5351da161eca31b844d39c050d878f7"
        }
      ],
      "digest": "sha256:0e85b25fab5d6c877495132cf67f7bfc0a97409e923eafe74648178f752effbd"
    }
  }
}
