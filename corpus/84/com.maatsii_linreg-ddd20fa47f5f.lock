        {
          "name": "maatsii_get_setup",
          "title": "Maatsii Get Setup",
          "description": "Get the full public playbook for ONE active setup by id (accepts \"#19\", \"19\", \"T1\", \"t1\"). Returns the catalog card (id/name/category/direction/description/strengthTier/appliesTo) plus logic/entry/confirmation/exit/stop/target/edge text. Use it to verify a candidate against the chart before citing it. There are 64 active setups (45 Fan + 19 Tick); ids outside the active library return an error. Catalog direction is not the trade side.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Setup id, e.g. \"#19\", 19, or \"T1\"",
                "type": ["string", "number"]
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
