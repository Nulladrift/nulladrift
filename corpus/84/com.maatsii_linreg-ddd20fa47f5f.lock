        {
          "name": "maatsii_get_chart",
          "title": "Maatsii Get Chart",
          "description": "Get ONE fresh Maatsii chart by id (c1..c200) or ticker (NQ_100T, BTCUSD, PLTR). Returns the chart JPEG INLINE (type=image) plus a JSON metadata block with the render-ready api.maatsii.com url (unique cachebuster), symbol, timeframe and group. Vision the image; the printed chart title is ground truth for symbol+timeframe; prices are read off the RIGHT AXIS (maatsii_reading_guide).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cb": {
                "description": "Optional cachebuster [A-Za-z0-9._-]{1,64}; a fresh one is generated if omitted or invalid",
                "type": "string"
              },
              "id_or_ticker": {
                "description": "Canonical id c1..c200, or a ticker like NQ_100T / BTCUSD / PLTR",
                "type": "string"
              },
              "image_mode": {
                "description": "\"both\" (default) = JPEG inline + url in text; \"inline\" = same; \"url_only\" = no image bytes, url only",
                "enum": ["inline", "url_only", "both"],
                "type": "string"
              },
              "include_images": {
                "description": "Default true. false is equivalent to image_mode url_only.",
                "type": "boolean"
              }
            },
            "required": ["id_or_ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "charts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bytes": {
                      "type": "integer"
                    },
                    "fetched_at": {
                      "type": "string"
                    },
                    "frame_ts": {
                      "type": "string"
                    },
                    "group": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "image": {
                      "enum": ["inline", "url_only", "failed"],
                      "type": "string"
                    },
                    "interval": {
                      "type": "string"
                    },
                    "sha256": {
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["group", "id", "image", "interval", "symbol", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "degraded": {
                "type": "boolean"
              },
              "omitted": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "reason"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["charts", "degraded", "omitted"],
            "type": "object"
          },
          "annotations": {
