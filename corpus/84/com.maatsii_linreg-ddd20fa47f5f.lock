        },
        {
          "name": "maatsii_match_setup",
          "title": "Maatsii Match Setup (hint)",
          "description": "OPTIONAL hint — do not lead a TA with it. THE CLIENT matches setups by visioning the fetched chart JPEGs and verifying candidates via maatsii_get_setup; this tool only cross-checks vision_features (boolean flags, plus raw_vision_text scanned for natural TA language with negations respected) against the 64-setup active library and may return best null (correct on empty/thin input — never invents a setup). Results carry a QUALITATIVE fit label + playbook text; ignore the catalog direction label (trade side = highest fetched TF EQ slope). Pass timeframes — the chart intervals you actually read; TICK setups (T-series) and the tick-native Fan #34 are only eligible when a 100T/1000T tick chart is in scope. Pass groups_read — the group aliases you fetched this turn; cross-asset setup #78 is only eligible when a vol group (VIX/MOVE) was fetched.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "groups_read": {
                "description": "Group aliases the client fetched this turn (e.g. [\"NQ\",\"VIX\"]); used only to allow the vol-gated setup #78.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "max_results": {
                "description": "Optional; the default of 4 is a hint-quality default, NOT a cap — any positive integer is accepted (bounded only by the active library size).",
                "minimum": 1,
                "type": "integer"
              },
              "timeframes": {
                "description": "Intervals of the charts the features were read from, e.g. [\"100T\",\"15M\",\"1H\"]. Required for TICK setup eligibility.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "vision_features": {
                "additionalProperties": true,
                "description": "Boolean structure flags (fan_support_test, pullback_to_fan, tick_absorption, ...), dominant_bias, raw_vision_text, optional conditions[] — see the vision_features concept",
                "properties": {
                  "conditions": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "dominant_bias": {
                    "type": "string"
                  },
                  "raw_vision_text": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["vision_features"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Maatsii Match Setup"
