        {
          "name": "maatsii_get_group",
          "title": "Maatsii Get Group",
          "description": "Get FRESH charts for every chart in a group (the REAL non-contiguous ids) — each chart's JPEG INLINE (type=image) plus one JSON metadata block listing every id with its api.maatsii.com url, symbol, interval. Accepts a friendly name/alias (NQ, ES, YM, RTY, BTC, ETH, GOLD, ENERGY, DXY, VIX, PLTR, NVDA, HYG, MACRO, CREDIT, ...). Rates note: YIELDS/ZN/RATES = the 10-Year group only; the curve/credit complex is CREDIT. EVERY chart in the group is inlined by default — there is no server image cap; use ids:[...] (or the optional max_images hint) to take a subset, image_mode:\"url_only\" to skip bytes. The metadata always lists the whole group. Vision EVERY chart; the MTF hierarchy for your analysis is the intervals these charts actually have.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "group": {
                "description": "Group name or alias, e.g. NQ, BTC, GOLD, VIX, PLTR, CREDIT",
                "type": "string"
              },
              "ids": {
                "description": "Only these chart ids from the group, e.g. [\"c1\",\"c4\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "image_mode": {
                "description": "\"both\" (default) = JPEG inline + url in text; \"inline\" = same; \"url_only\" = no image bytes, url only",
                "enum": ["inline", "url_only", "both"],
                "type": "string"
              },
              "include_images": {
                "description": "Default true. false is equivalent to image_mode url_only.",
                "type": "boolean"
              },
              "max_images": {
                "description": "OPTIONAL caller hint: inline at most this many JPEGs (the rest stay url-only). Omitted = EVERY requested chart inline — there is no server maximum.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["group"],
            "type": "object"
          },
