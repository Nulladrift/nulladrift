        {
          "name": "maatsii_list_setups",
          "title": "Maatsii List Setups",
          "description": "List all 64 active LinReg setups (45 Fan #-series + 19 Tick T-series). detail:\"full\" (default) includes each setup's playbook text (logic/entry/confirmation/exit/stop/target/edge); detail:\"card\" is a lightweight catalog for browsing. Filter by type (FAN|TICK|ALL), direction, category, and/or timeframe (TICK setups — and the tick-native Fan #34 — apply ONLY on 100T/1000T tick charts, never on time-based intervals). Note: catalog direction is the pattern's native side, NOT the trade side, and strengthTier is an ID-band label, not live chart state.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Filter by category slug, e.g. advanced_pattern, confluence, correlation_intermarket, divergence, ...",
                "type": "string"
              },
              "detail": {
                "description": "\"card\" = catalog fields only; \"full\" (default) adds the playbook text",
                "enum": ["card", "full"],
                "type": "string"
              },
              "direction": {
                "enum": ["LONG", "SHORT", "ANY"],
                "type": "string"
              },
              "timeframe": {
                "description": "Filter to setups applicable on this interval, e.g. 1H or 100T",
                "type": "string"
              },
              "type": {
                "enum": ["FAN", "TICK", "ALL"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Maatsii List Setups"
          },
          "behavior": {
