{
  "lockfileVersion": 2,
  "subjects": {
    "com.gbotranked/gbotranked": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gbotranked.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gbotranked",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use this server to discover and compare independently indexed Grok Bot templates. Scores are evidence signals, not safety guarantees.",
      "tools": [
        {
          "name": "atlas_compare_templates",
          "title": "Compare Grok Bot templates",
          "description": "Compare up to five templates using the same versioned GBotRanked rubric.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb86e487fd0e1161aa9e92af04d5db3aa010a3a06562d373bb327fec4f7649cd"
        },
        {
          "name": "atlas_explain_score",
          "title": "Explain a GBotRanked score",
          "description": "Return the score decision, dimension breakdown, evidence, gaps and critical flags for one template.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca9ae45a7cd035ae53ee09aeb9767d25f8cb2bd794feafa31a0759243201b7d3"
        },
        {
          "name": "atlas_get_new_templates",
          "title": "Get recently checked templates",
          "description": "Return templates ordered by their recorded link-check date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa721599b0701fe0ce81660150f60e9542d1a972f04ac2f4b2a2138e2a9045c3"
        },
        {
          "name": "atlas_get_template",
          "title": "Get a Grok Bot template",
          "description": "Return one indexed template with source evidence and the complete score breakdown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05c9a033ec39d6e8f413f8c1231b9a07fc34071e00d1c662283174e652e37046"
        },
        {
          "name": "atlas_get_top_templates",
          "title": "Get top-ranked templates",
          "description": "Return the highest-scoring indexed templates, optionally within one category.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ad33102bd04c59f77abbce45a238d7134a0df5892cde1af00d2e1c7127a2d51"
        },
        {
          "name": "atlas_search_templates",
          "title": "Search Grok Bot templates",
          "description": "Search the independent GBotRanked index by text, category, source, decision or minimum score.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "decision": {
                "enum": ["Accept", "Watchlist", "Reject"]
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "minScore": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "type": "string"
              },
              "source": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e02a5e83933e7d93f601a1dbe7fc298b56fd5a8ed39f6f6c66d706bf8d514b23"
        },
        {
          "name": "check_bot",
          "title": "Check a Grok Bot share link",
          "description": "Check one https://x.ai/bot/<id> share link. Returns the indexed template if listed; otherwise a provisional, unreviewed v2 score from the public share page only. Never lists or publishes anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "https://x.ai/bot/<id>",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d4d0e8344b627131d8db6d6ab19aae370a7a777e11d00d4601fdc3025cb96d8f"
        }
      ],
      "digest": "sha256:aa276ab2d63ca46adea5737a2746f56d7f91ca49def124fb3f85948715e2a607"
    }
  }
}
