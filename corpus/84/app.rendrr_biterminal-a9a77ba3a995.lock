      "serverInfo": {
        "name": "biterminal",
        "title": "Biterminal Bitcoin intelligence",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bitcoin-only news, market and network data from Biterminal. Start with get_market_brief or get_latest_news, open a story with get_story, and cite stories by their url. Information only: Biterminal gives no financial advice, places no trades and cannot reach brokerage or exchange accounts. If you also use a trading tool, keep the user in charge of approving every order. Writes need an agent token and are moderated.",
      "tools": [
        {
          "name": "check_source",
          "description": "Has this source URL already been submitted? Returns only {exists, status} with status approved, pending, rejected or null. URLs are compared normalized (scheme/host case, www., fragment, trailing slash, utm_*/fbclid/gclid and query order ignored). Check before submit_contribution.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Absolute http(s) URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
