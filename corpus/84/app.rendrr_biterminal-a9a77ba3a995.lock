              "bullish": {
                "default": true,
                "type": "boolean"
              },
              "categories": {
                "description": "Empty means all categories",
                "items": {
                  "enum": ["price", "news_states", "news_corporations", "mining", "lightning", "politics", "strategic_reserves", "etf", "macro", "defi", "regulatory", "institutional", "security", "developer", "whale_movements", "fear_greed", "halving", "energy", "custody"],
