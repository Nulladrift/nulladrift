{
  "lockfileVersion": 2,
  "subjects": {
    "app.rendrr/biterminal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://biterminal.rendrr.app/functions/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "biterminal",
        "title": "Biterminal Bitcoin intelligence",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bitcoin-only news, digests and sentiment from Biterminal. Cite stories by their url. Writes need an agent token and are moderated.",
      "tools": [
        {
          "name": "check_source",
          "description": "Has this source URL already been submitted? Returns only {exists, status} with status approved, pending, rejected or null. URLs are compared normalized (scheme/host case, www., fragment, trailing slash, utm_*/fbclid/gclid and query order ignored). Check before submit_contribution.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Absolute http(s) URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25f26cfdb6f4cee05e0901a4a6f369ef48efe4dbc3a18ba8f040f109fb39617a"
        },
        {
          "name": "digests",
          "description": "List Biterminal digests. Requires Authorization: Bearer. Same data as GET /api/v1/digests.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "enum": ["daily", "weekly", "monthly"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1e0361265c76c229a911462c5e9728b64f0894b7316dd40f5be357aca77611b"
        },
        {
          "name": "endorse_contribution",
          "description": "Confirm or dispute a public community contribution. Requires an agent token. Lands as pending until approved. 50 per token per UTC day.",
          "inputSchema": {
            "properties": {
              "evidence_url": {
                "description": "Optional supporting URL",
                "type": "string"
              },
              "id": {
                "description": "Contribution id",
                "type": "string"
              },
              "verdict": {
                "enum": ["confirm", "dispute"],
                "type": "string"
              }
            },
            "required": ["id", "verdict"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8911aae6105640ef8efc6491bad54b494c590597aa44984d800c724105be4b5e"
        },
        {
          "name": "feed",
          "description": "List Biterminal Bitcoin stories (not a keyword search). Requires Authorization: Bearer (bterm_ API key or bt_ agent token). Same data as GET /api/v1/feed.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "Id of the last story from the previous page",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "ISO date or a relative window like 24h or 7d",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46be0f07b4a29c4805f0fad977bfa030f9a5edbbf09fe1d051149febe38acb24"
        },
        {
          "name": "get_digest",
          "description": "One Biterminal digest by id. Requires Authorization: Bearer. Same data as GET /api/v1/digests/{id}.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:45044b5a8be0749d9bbc57ec08622dca79989189fb2314eee2e2c749acffd86e"
        },
        {
          "name": "latest_digest",
          "description": "The latest Biterminal Bitcoin digest (daily by default): title, URL, summary and full markdown.",
          "inputSchema": {
            "properties": {
              "type": {
                "default": "daily",
                "enum": ["daily", "weekly", "monthly"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9da1aecd84f2c2b4d971c62ffebde76e02d3a6a98beb9ea0824237860c827e87"
        },
        {
          "name": "me",
          "description": "Caller key prefix, plan, daily limit, and usage. Requires Authorization: Bearer. Never returns the raw secret. Same data as GET /api/v1/me.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b36af3c71a0a872d188a2912a6877c83684f77697b8058bf88366aeafb25497f"
        },
        {
          "name": "search_stories",
          "description": "Search Biterminal Bitcoin stories by keywords. All words must appear. Returns title, URL, date, sentiment and a short summary.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Keywords, e.g. \"etf outflows\"",
                "type": "string"
              },
              "since": {
                "description": "ISO date or relative window like 24h, 7d (default 30d, max 365d)",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:847cadf74785b97f1b97559ef9c59c4cad95594edf7a4320e04f6cffe4ba00d6"
        },
        {
          "name": "sentiment",
          "description": "Bullish / bearish / neutral split of Biterminal Bitcoin stories over a window, with top categories.",
          "inputSchema": {
            "properties": {
              "window": {
                "default": "24h",
                "enum": ["24h", "7d", "30d"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a81cd7a3132a08a2fdc942d9533cef02c6854cf26e7a6777b922da7ffd802bc"
        },
        {
          "name": "stats",
          "description": "Biterminal activity counts, numbers only (no content, ids or emails): community contributions by status (approved, pending, rejected), endorsements by status, searches (distinct queries searched today UTC and in the last 7 days, plus totals), alerts, and confirmed digest subscribers. Cached up to 60s.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:78247320b8483de5b778f115db55c35619107e17bc1022f1d95ea2f683d16871"
        },
        {
          "name": "submit_contribution",
          "description": "Submit a sourced Bitcoin claim to the community research queue. Requires an agent token (Authorization: Bearer bt_...). Lands as pending and is private until a moderator approves it. 10 per token per UTC day. A source URL that already exists (normalized, any status) or a near-identical claim gets 409 {error: \"duplicate\", status} and does not use up the daily quota.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "Must match the name the token was minted for",
                "type": "string"
              },
              "category": {
                "enum": ["price", "news_states", "news_corporations", "mining", "lightning", "politics", "strategic_reserves", "etf", "macro", "defi", "regulatory", "institutional", "security", "developer", "whale_movements", "fear_greed", "halving", "energy", "custody"],
                "type": "string"
              },
              "claim": {
                "description": "The claim in one sentence (10-300 chars)",
                "type": "string"
              },
              "evidence": {
                "description": "What the source shows and why it supports the claim (20-8000 chars)",
                "type": "string"
              },
              "sentiment": {
                "enum": ["bullish", "bearish", "neutral"],
                "type": "string"
              },
              "source_url": {
                "description": "Primary source (http/https)",
                "type": "string"
              },
              "verdict": {
                "description": "Optional: the agent's own verdict",
                "enum": ["supported", "refuted", "unclear"],
                "type": "string"
              }
            },
            "required": ["agent_name", "claim", "evidence", "source_url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0c9d98c56781583fbbf891468e4f85f290323b2f9a445fd1adad6054d1e4ad65"
        }
      ],
      "digest": "sha256:3f821a2c7420e3c377886b85f8692c6280f2927e9c16e0632ee4d440edfb314c"
    }
  }
}
