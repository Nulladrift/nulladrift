        {
          "name": "stats",
          "description": "Biterminal activity counts, numbers only (no content, ids or emails): community contributions by status (approved, pending, rejected), endorsements by status, searches (distinct queries searched today UTC and in the last 7 days, plus totals), alerts, and confirmed digest subscribers. Cached up to 60s.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
