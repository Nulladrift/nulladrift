          "description": "Latest Bitcoin stories, most widely covered first (distinct outlets), with source links, outlet count, sentiment label and a short summary. Information only.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["price", "news_states", "news_corporations", "mining", "lightning", "politics", "strategic_reserves", "etf", "macro", "defi", "regulatory", "institutional", "security", "developer", "whale_movements", "fear_greed", "halving", "energy", "custody"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_sources": {
                "default": 1,
                "description": "Only stories covered by at least this many outlets",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "order": {
                "default": "depth",
                "enum": ["depth", "newest"],
                "type": "string"
              },
              "since": {
                "description": "Relative window like 6h, 24h, 7d or an ISO date (default 24h, max 30d)",
                "type": "string"
              }
            },
            "type": "object"
          },
