          "inputSchema": {
            "properties": {
              "end": {
                "description": "Price only: ISO end time (default now)",
                "type": "string"
              },
              "metric": {
                "enum": ["price", "hashrate", "difficulty", "fees"],
                "type": "string"
              },
              "start": {
                "description": "Price only: ISO start time for an hourly range (with end, at most 31 days)",
