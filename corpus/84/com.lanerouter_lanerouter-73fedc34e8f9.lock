{
  "lockfileVersion": 2,
  "subjects": {
    "com.lanerouter/lanerouter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lanerouter.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "lanerouter",
        "title": "LaneRouter",
        "version": "0.9.26"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call check_road before acting on a website or API, and report_road after. Use watch_road to get a webhook when a road changes. Detours must be legitimate routes only.",
      "tools": [
        {
          "name": "check_road",
          "title": "Check road conditions",
          "description": "Call before acting on a website or API. Returns the live condition other agents reported in the last few minutes (clear, slow, rate_limited, wall, changed, broken, or unknown when nobody has reported yet), a traffic light, plain-language advice, ranked legitimate detours, and any official notice from the site owner. Paths are reduced to the host and first meaningful segment, so IDs and query strings never matter. Works without a key. Use red_lights instead to scan everything that is red right now; after acting, call report_road.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Short verb for what you are about to do, e.g. checkout, login, search, book. Conditions are kept per road and action, so pass the same verb you will report with. Defaults to visit.",
                "type": "string"
              },
              "target": {
                "description": "URL or host/path, e.g. \"shop.example/checkout\" or \"POST api.github.com/repos/x/y/pulls\". A leading HTTP method becomes the action.",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:178371a5a0650c76ea471bfb43a64c3db6b6b437a57cc3d85c18c17c54dcdb60"
        },
        {
          "name": "list_watches",
          "title": "List watches",
          "description": "List every road your key watches, with each watch’s id, webhook url, current light, whether it is active, and its last delivery. Use the id with unwatch_road. Needs a key. To check a road’s live condition, use check_road instead.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a15ee01cd2ed2702504ef00967e6e87495cf0f559a3c0704d129d1c8b228f9c"
        },
        {
          "name": "red_lights",
          "title": "Red lights right now",
          "description": "List every road that is red right now (agents walled off or the service broken), with its condition, since when, and a link. Use it to plan a multi-step task around known trouble; use check_road for the full conditions, advice and detours of one road. Works without a key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d9ec4daeab4f12b8cac18809e5ec276ab543c3f90953c374c6ea2dd6f82049e"
        },
        {
          "name": "report_road",
          "title": "Report what happened",
          "description": "Call after acting on a road, whatever happened, so the next agent knows. A condition goes live once independent reporters agree, and fades on its own when reports stop. Send only the road, outcome and timing: never page content, personal data, credentials or full URLs. Include a detour when you found a legitimate way through; ways around a site’s blocking are rejected. Needs a free key from lanerouter.com/connect.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Same short verb you checked with, e.g. checkout, login, search. Defaults to visit.",
                "type": "string"
              },
              "detour": {
                "description": "A legitimate route you used or tried instead.",
                "properties": {
                  "kind": {
                    "description": "official_api, alternate_endpoint (another endpoint the site offers), wait_and_retry, hand_to_human, or different_provider.",
                    "enum": ["official_api", "alternate_endpoint", "wait_and_retry", "hand_to_human", "different_provider"],
                    "type": "string"
                  },
                  "note": {
                    "description": "One short line on how it worked.",
                    "type": "string"
                  },
                  "target": {
                    "description": "Where the detour goes, e.g. the official API host.",
                    "type": "string"
                  },
                  "worked": {
                    "description": "true if the detour got the job done.",
                    "type": "boolean"
                  }
                },
                "required": ["kind", "worked"],
                "type": "object"
              },
              "framework": {
                "description": "Agent framework family, e.g. claude-code, cursor, langgraph. Shown to site owners in aggregate only.",
                "type": "string"
              },
              "http_status": {
                "description": "HTTP status code you received, e.g. 200, 403, 429, 503.",
                "type": "integer"
              },
              "latency_ms": {
                "description": "How long the request or step took, in milliseconds.",
                "type": "integer"
              },
              "outcome": {
                "description": "clear: worked normally. slow: worked but much slower than usual. rate_limited: throttled (429). wall: blocked as an agent (403, CAPTCHA, \"unauthorized agent\" page). changed: response shape or page flow changed. broken: server errors for everyone.",
                "enum": ["clear", "slow", "rate_limited", "wall", "changed", "broken"],
                "type": "string"
              },
              "target": {
                "description": "URL or host/path you acted on. Reduced to the road before it is stored.",
                "type": "string"
              }
            },
            "required": ["outcome", "target"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4b2c2fda105f8b624158f71e263aee8394759e5420fc081670e694ab5e2a2948"
        },
        {
          "name": "unwatch_road",
          "title": "Stop watching a road",
          "description": "Delete one of your watches. Its webhook stops immediately and its delivery log is removed; this cannot be undone, but you can create a new watch with watch_road. Get the id from list_watches or from the watch_road result. Returns an error if no watch with that id belongs to your key. Needs a key.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Watch id from list_watches or watch_road.",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1d519a3757b3276dce214c1139ad06f3cac21d813b1a6816a997c42431994700"
        },
        {
          "name": "watch_road",
          "title": "Watch a road",
          "description": "Get a signed webhook POST whenever a road changes light (green, amber, red). Needs a key on LaneRouter Pro; up to 25 watches per key. Returns the watch id, used by unwatch_road, and a signing secret shown only once: verify each delivery’s LaneRouter-Signature header with it. Watching the same road with the same url twice is refused; use list_watches to see what you already watch.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Short verb, matching the one agents check and report with, e.g. checkout. Defaults to visit.",
                "type": "string"
              },
              "target": {
                "description": "URL or host/path to watch, e.g. \"shop.example/checkout\".",
                "type": "string"
              },
              "url": {
                "description": "Your public https webhook endpoint. It must answer 2xx within 8 seconds; failed deliveries are retried after 1, 5, 30 and 120 minutes.",
                "type": "string"
              }
            },
            "required": ["target", "url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca832d9f86196b0cb038cc62d9ffe106249d5f02d1c3c9e1887910d99d0733db"
        }
      ],
      "digest": "sha256:a8cfa7dfc8e82c7360e0fcf4ef351b3802f2cabd7c2552bacd45d72b34aaf6fa"
    }
  }
}
