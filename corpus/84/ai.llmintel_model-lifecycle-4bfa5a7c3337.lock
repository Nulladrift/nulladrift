{
  "lockfileVersion": 2,
  "subjects": {
    "ai.llmintel/model-lifecycle": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://llmintel.ai/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "llmintel",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_model",
          "title": "Check a model's lifecycle status",
          "description": "Check whether an LLM model id is safe to use, deprecated, or retired, and what to migrate to. Accepts the exact string used in code (e.g. 'gpt-4o', 'claude-sonnet-4-5-20250929', 'anthropic/claude-opus-4-1'). Call this before writing or changing any hardcoded model id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "Model id or alias exactly as it appears in code, e.g. 'gpt-4o'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:51246170071376f965823da6f18f1c247a397ad19a80fe77916a935112ee06bf"
        },
        {
          "name": "list_retiring_models",
          "title": "List models retiring soon",
          "description": "List tracked models scheduled to retire within a time window, soonest first. Use this to audit a codebase or plan migration work.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "Restrict to one provider. Omit for all providers.",
                "enum": ["openai", "anthropic", "azure", "bedrock", "google", "vertex", "mistral", "cohere"],
                "type": "string"
              },
              "withinDays": {
                "default": 180,
                "description": "Only include models retiring within this many days. Defaults to 180.",
                "exclusiveMinimum": 0,
                "maximum": 1095,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:87e5b9f13aed0d9ca55621593ef9f69976d62cbfd4260cc43c4df7f690aa2dae"
        },
        {
          "name": "recent_lifecycle_changes",
          "title": "Recent lifecycle changes",
          "description": "Lifecycle state changes across all tracked providers, newest first. Use this to answer 'what model deprecations happened recently?'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "Restrict to one provider.",
                "enum": ["openai", "anthropic", "azure", "bedrock", "google", "vertex", "mistral", "cohere"],
                "type": "string"
              },
              "sinceDays": {
                "default": 30,
                "description": "Look back this many days. Defaults to 30.",
                "exclusiveMinimum": 0,
                "maximum": 365,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9407d590cb85599332d8f190c06839522f917d582001594551f6577c3c13ae22"
        },
        {
          "name": "search_models",
          "title": "Search the model catalog",
          "description": "List tracked models, optionally filtered by provider and lifecycle state. Use this to discover what is currently available from a provider.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 50,
                "description": "Maximum results.",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "integer"
              },
              "provider": {
                "description": "Filter by provider.",
                "enum": ["openai", "anthropic", "azure", "bedrock", "google", "vertex", "mistral", "cohere"],
                "type": "string"
              },
              "state": {
                "description": "Filter by canonical lifecycle state, e.g. 'active' or 'deprecated'.",
                "enum": ["announced", "active", "legacy", "deprecated", "retiring", "retired"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e648d209a5ee39cde1d1b63db286dc3e1c0737d431d31e54de77a9d9d489d932"
        },
        {
          "name": "suggest_replacement",
          "title": "Suggest a replacement for a model",
          "description": "Given a deprecated or retiring model, return the provider's recommended replacement(s) and, when none is published, active models from the same provider to consider.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "Model id or alias to find a replacement for.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:560b1fddad4165cc2bd8b8479461a89c16a7b9ada8c77217577c1dc539d9ea29"
        }
      ],
      "digest": "sha256:fc79a7ff7d3f3517d2f85d4cc59b8216b6c08482caec87486d46164e63441f8b"
    }
  }
}
