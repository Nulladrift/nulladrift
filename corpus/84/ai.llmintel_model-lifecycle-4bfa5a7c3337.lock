{
  "lockfileVersion": 2,
  "subjects": {
    "ai.llmintel/model-lifecycle": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://llmintel.ai/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "llmintel",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_model",
          "title": "Check a model's lifecycle status",
          "description": "Check whether an LLM model id is safe to use, deprecated, or retired, and what to migrate to. Accepts the exact string used in code (e.g. 'gpt-4o', 'claude-sonnet-4-5-20250929', 'anthropic/claude-opus-4-1'). Call this before writing or changing any hardcoded model id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "Model id or alias exactly as it appears in code, e.g. 'gpt-4o'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:188f19581bbbb93c5822c4a7cab23604a322274fc2dbfd91ab97a08ff6204385"
        },
        {
          "name": "list_retiring_models",
          "title": "List models retiring soon",
          "description": "List tracked models scheduled to retire within a time window, soonest first. Use this to audit a codebase or plan migration work.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "Restrict to one provider. Omit for all providers.",
                "enum": ["openai", "anthropic", "azure", "bedrock", "google", "vertex", "mistral", "cohere"],
                "type": "string"
              },
              "withinDays": {
                "default": 180,
                "description": "Only include models retiring within this many days. Defaults to 180.",
                "exclusiveMinimum": 0,
                "maximum": 1095,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6bc7d21f4fd094f5276552c1aefe4cc414f9c4b3908d8995b4d4e258fe150af2"
        },
        {
          "name": "recent_lifecycle_changes",
          "title": "Recent lifecycle changes",
          "description": "Lifecycle state changes across all tracked providers, newest first. Use this to answer 'what model deprecations happened recently?'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "provider": {
                "description": "Restrict to one provider.",
                "enum": ["openai", "anthropic", "azure", "bedrock", "google", "vertex", "mistral", "cohere"],
                "type": "string"
              },
              "sinceDays": {
                "default": 30,
                "description": "Look back this many days. Defaults to 30.",
                "exclusiveMinimum": 0,
                "maximum": 365,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c23c4b5c98d6bd134dbb2b927785fdc0968031c91c0ff8dd78799680759900c4"
        },
        {
          "name": "search_models",
          "title": "Search the model catalog",
          "description": "List tracked models, optionally filtered by provider and lifecycle state. Use this to discover what is currently available from a provider.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 50,
                "description": "Maximum results.",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "integer"
              },
              "provider": {
                "description": "Filter by provider.",
                "enum": ["openai", "anthropic", "azure", "bedrock", "google", "vertex", "mistral", "cohere"],
                "type": "string"
              },
              "state": {
                "description": "Filter by canonical lifecycle state, e.g. 'active' or 'deprecated'.",
                "enum": ["announced", "active", "legacy", "deprecated", "retiring", "retired"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0d477315d080b3b9733863609435f2132757179f8c7aaa35b0eef4648a5e4e48"
        },
        {
          "name": "suggest_replacement",
          "title": "Suggest a replacement for a model",
          "description": "Given a deprecated or retiring model, return the provider's recommended replacement(s) and, when none is published, active models from the same provider to consider.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "Model id or alias to find a replacement for.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7ab5f50298f947b99c54ecebab3e4643862017fece0cccda63f4bf50abbb40b2"
        }
      ],
      "digest": "sha256:0e2b7c456768cbb5fd39d30ceab320cd00cd89935cf8d6245e1d3727a4d7a30b"
    }
  }
}
