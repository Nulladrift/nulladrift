{
  "lockfileVersion": 2,
  "subjects": {
    "com.profullstack/ch4nnels": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ch4nnels.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ch4nnels",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ch4nnels compares IPTV and live-TV services. Use search_iptv for \"which service\" questions and search_channels for \"who carries channel X\". Prices are per month in EUR unless a currency is given. The featured provider (ArgonTV) is the one this site resells and is labelled as such; start_checkout sells it. search_seedboxes and get_seedbox compare seedbox providers; nothing is pinned there.",
      "tools": [
        {
          "name": "compare_providers",
          "title": "Compare IPTV Providers",
          "description": "Side-by-side comparison of two to five providers by slug.",
          "inputSchema": {
            "properties": {
              "slugs": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3bc0dcfa513f12b179462e277259af53a8dbc2ba65230b285fa5af9ab8f5f57"
        },
        {
          "name": "get_provider",
          "title": "Get IPTV Provider",
          "description": "Everything known about one provider: plans, prices, devices, apps, trial, payment and (when indexed) its lineup by country.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e9e5d37f5927a71dd72f938ef18f9ffbb6f9c52e370021816fd2cd1f86b5e4d"
        },
        {
          "name": "get_seedbox",
          "title": "Get Seedbox",
          "description": "Everything known about one seedbox provider: every plan with price, storage, port, traffic and location, plus apps, features, payment, refund and trial.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c79389b73638060006d13a85dd72a0693182d45cb4eb061dfea5c95af8d42fec"
        },
        {
          "name": "list_providers",
          "title": "List IPTV Providers",
          "description": "Every provider in the register, cheapest first, with slug, kind and per-month price.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9928a95fc0cbf7024f9b2eb681a36538dc461f206de7b9e40c38a3f74e6a58d6"
        },
        {
          "name": "search_channels",
          "title": "Search Channels",
          "description": "Find a channel by name across indexed IPTV lineups. Returns channel, category, country, quality and which provider carries it.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO-3166 alpha-2 (GB, US, DE…) or LAT, ARAB, EXYU, AFR.",
                "type": "string"
              },
              "limit": {
                "type": "integer"
              },
              "q": {
                "description": "Channel name to look for in lineups, e.g. \"sky sports main event\".",
                "type": "string"
              },
              "resolution": {
                "enum": ["HD", "FHD", "4K"],
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f8a497816db4cbbd7af23716cc67c7837d2e748622ae6c7204a584fcd3e6f6b"
        },
        {
          "name": "search_iptv",
          "title": "Search IPTV Services",
          "description": "Search and rank IPTV and live-TV services by price, devices, resolution, trial, payment and country, and look for channels in their lineups. Returns providers (cheapest first; our own service is pinned and flagged featured) and any matching channels.",
          "inputSchema": {
            "properties": {
              "catchup": {
                "type": "boolean"
              },
              "country": {
                "description": "ISO-3166 alpha-2 (GB, US, DE…) or LAT, ARAB, EXYU, AFR.",
                "type": "string"
              },
              "currency": {
                "enum": ["EUR", "USD", "GBP"],
                "type": "string"
              },
              "epg": {
                "type": "boolean"
              },
              "kind": {
                "enum": ["licensed", "independent"],
                "type": "string"
              },
              "max_price": {
                "description": "Maximum per-month price in `currency` (default EUR).",
                "type": "number"
              },
              "min_connections": {
                "description": "Simultaneous devices needed.",
                "type": "integer"
              },
              "months": {
                "description": "Plan length in months (1, 3, 6, 12).",
                "type": "integer"
              },
              "payment": {
                "enum": ["card", "crypto", "paypal"],
                "type": "string"
              },
              "q": {
                "description": "Channel name to look for in lineups, e.g. \"sky sports main event\".",
                "type": "string"
              },
              "resolution": {
                "enum": ["HD", "FHD", "4K"],
                "type": "string"
              },
              "text": {
                "description": "Free text, e.g. \"4k uk sports under €10 with trial\". Parsed into the filters below.",
                "type": "string"
              },
              "trial": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b68d8816fab35140f957b60f5966d0f157ca6ce827e05fe00d174e65a9975d72"
        },
        {
          "name": "search_seedboxes",
          "title": "Search Seedboxes",
          "description": "Search and rank seedbox providers by price, storage, port speed, unmetered traffic, apps (Plex, qBittorrent, rTorrent, the *arrs), datacenter country, type and payment. Returns providers cheapest first with the best matching plan; nothing is pinned, this site sells no seedbox.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "plex, jellyfin, emby, qbittorrent, rtorrent, deluge, transmission, sonarr, radarr, prowlarr, sabnzbd, nzbget, rclone…",
                "type": "string"
              },
              "country": {
                "description": "Datacenter country, ISO-3166 alpha-2.",
                "type": "string"
              },
              "currency": {
                "enum": ["EUR", "USD", "GBP"],
                "type": "string"
              },
              "feature": {
                "description": "root, ssh, sftp, vpn, wireguard, 10gbps, nvme, raid…",
                "type": "string"
              },
              "limit": {
                "description": "Providers to return (default 25).",
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum per-month price in `currency` (default EUR).",
                "type": "number"
              },
              "min_port": {
                "description": "Minimum port speed in Gbps.",
                "type": "number"
              },
              "min_storage": {
                "description": "Minimum storage in GB.",
                "type": "number"
              },
              "payment": {
                "enum": ["card", "crypto", "paypal"],
                "type": "string"
              },
              "sort": {
                "enum": ["price", "per_tb", "storage", "name"],
                "type": "string"
              },
              "storage_type": {
                "enum": ["hdd", "ssd", "nvme"],
                "type": "string"
              },
              "text": {
                "description": "Free text, e.g. \"plex 10gbps 2tb under €15 in NL\". Parsed into the filters below.",
                "type": "string"
              },
              "trial": {
                "type": "boolean"
              },
              "type": {
                "enum": ["shared", "dedicated", "vps"],
                "type": "string"
              },
              "unmetered": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e289c6ca235f896ee239857755d2ebe43bafe5f9e170ff23aad5ec405b69d9c2"
        },
        {
          "name": "start_checkout",
          "title": "Start ArgonTV Checkout",
          "description": "Open a checkout for an ArgonTV subscription, which this site resells. Returns a pay_url where the person pays with any supported coin or PayPal, and an order_url where their login appears once paid. Ask for their email first; the login is sent there.",
          "inputSchema": {
            "properties": {
              "email": {
                "type": "string"
              },
              "months": {
                "enum": [1, 3, 6, 12],
                "type": "integer"
              }
            },
            "required": ["email", "months"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:021223b73da91cef3011b41485ccf5f27017d1afc6af9246cb61a7c190ff90f4"
        }
      ],
      "digest": "sha256:00b819c5519f7f25354c7e919028b56c63c0bc3016430468e35f3d45ecc4d27d"
    }
  }
