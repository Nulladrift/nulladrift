      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CelerAPI provides normalized public company, legal-entity, FX, securities-filing, and time-zone resources with provenance, warnings, and completeness indicators. search_company resolves names through supported authoritative registries; provide country_hint when possible, while omission defaults to GB. Inspect available_capabilities and pass the returned entity_id unchanged to the preferred global entity tools. Global profile supports GB and NO; other global entity capabilities currently support GB where advertised. Legacy company-number tools remain available for compatibility. Registry records are not independent identity or ownership verification. Paid tools use x402 in production USDC on Base mainnet.",
      "tools": [
        {
          "name": "convert_currency",
          "description": "Convert a specified amount using ECB reference rates via Frankfurter. Requires finite amount > 0 and <= 1000000000, from_currency and to_currency (supported three-letter ISO codes). Returns amount, converted_amount, rate and published rate date. One CelerAPI call; get_fx_rate is not a prerequisite. Informational estimate, not trade execution or a real-time quote. Price: $0.0011 production USDC via x402 on Base mainnet. Example arguments: {\"amount\":500,\"from_currency\":\"GBP\",\"to_currency\":\"USD\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              },
              "from_currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "to_currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "required": ["amount", "from_currency", "to_currency"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "complete": {
                "type": "boolean"
              },
              "success": {
                "type": "boolean"
              }
            },
            "required": ["complete", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f86469cc943d36a57b1801b6455a28718e4125d407e537e589e340a7cbb8b5ac"
        },
        {
          "name": "get_company_filings",
          "description": "Retrieve recent Companies House filing-history metadata for a known UK company. Records may include accounts, confirmation statements, officer changes, and other filing categories. Useful for corporate research, due diligence, and reviewing recent company changes; this tool does not semantically interpret filing contents. limit defaults to 10 and accepts 1 to 100. Price: $0.0103 production USDC via x402 on Base mainnet.",
