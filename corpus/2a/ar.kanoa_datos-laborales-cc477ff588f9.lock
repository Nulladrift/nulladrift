      "serverInfo": {
        "name": "kanoa-datos-laborales",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Datos laborales e impositivos de Argentina que mantiene Kanoa: escalas salariales de convenios colectivos (sólo los actualizados en los últimos 3 meses), el calendario de vencimientos de ARCA y organismos provinciales por terminación de CUIT, y el manual de ayuda de Kanoa. Cada respuesta indica desde cuándo rige el dato y cuándo se cargó: citá esas fechas y la fuente. Los valores son de referencia; para liquidar o presentar, confirmá con la norma o el organismo.",
      "tools": [
        {
          "name": "kanoa_ayuda_buscar",
          "title": "Buscar en el manual de Kanoa",
          "description": "Busca en el manual de ayuda de Kanoa (liquidación de sueldos, Libro de Sueldos Digital, F.931, fichadas, facturación, contabilidad) y devuelve los artículos con su enlace público.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limite": {
                "description": "cantidad de artículos, 1 a 10 (por defecto 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "qué buscar (ej. \"libro de sueldos digital\")",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar en el manual de Kanoa"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4f3b5e92295de369b2b17d3e9cec96adf4896dd41caec063277a8fb73fbc1940"
        },
        {
          "name": "kanoa_buscar_convenio",
          "title": "Buscar convenio colectivo",
          "description": "Lista los convenios colectivos de trabajo de Argentina que tienen escala salarial actualizada en Kanoa, con su número, nombre, la vigencia más reciente cargada y cuántas categorías tiene. Sólo figuran los convenios con una vigencia de los últimos 3 meses. Sin texto, lista todos.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "texto": {
                "description": "número (ej. \"130/75\"), sigla o parte del nombre (ej. \"comercio\")",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar convenio colectivo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ad773ce576236f731e01720694a24003b8d1ac5aea5a74df8f3d0202f388eb8b"
        },
        {
          "name": "kanoa_escala_salarial",
          "title": "Escala salarial de un convenio",
          "description": "Valores de la escala salarial de un convenio colectivo argentino a una fecha: por categoría, cada ítem (básico, sumas no remunerativas, adicionales) con su valor mensual en pesos y desde cuándo rige, y el conformado (suma de los ítems fijos de la categoría). Indica cuándo se cargó la escala y si ya hay una vigencia posterior cargada. Kanoa publica las categorías que tiene cargadas, que pueden no ser todas las del convenio.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "categoria": {
                "description": "parte del nombre de la categoría (ej. \"administrativo a\")",
                "maxLength": 80,
                "type": "string"
              },
              "convenio": {
                "description": "número (ej. \"130/75\"), sigla o nombre del convenio",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "fecha": {
                "description": "YYYY-MM-DD; por defecto, hoy",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["convenio"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Escala salarial de un convenio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6f346a62aaf4b106de8b1bf6b09b6bb61b6304487ca92ae5e3260b2b7431f46d"
        },
        {
          "name": "kanoa_vencimientos_mes",
          "title": "Vencimientos impositivos del mes",
          "description": "Vencimientos impositivos y de la seguridad social de un mes en Argentina según la terminación del CUIT: fecha, organismo (ARCA, AGIP, ARBA, Convenio Multilateral), impuesto, obligación y período. Por defecto sólo las obligaciones principales (IVA, Ganancias, F.931, Monotributo, Ingresos Brutos); con solo_principales=false, también regímenes de información y de retención. Incluye hasta qué fecha está cargado el calendario de cada organismo: un mes fuera de ese rango no significa que no venza nada.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mes": {
                "description": "mes de los vencimientos, YYYY-MM (ej. \"2026-11\")",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              },
              "solo_principales": {
                "description": "por defecto true: sólo las obligaciones principales",
                "type": "boolean"
              },
              "terminacion_cuit": {
                "description": "último dígito del CUIT",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "texto": {
                "description": "impuesto u obligación (ej. \"IVA\", \"931\", \"ingresos brutos\", \"ARBA\")",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["mes", "terminacion_cuit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Vencimientos impositivos del mes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
