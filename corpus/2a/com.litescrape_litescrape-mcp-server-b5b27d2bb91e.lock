{
  "lockfileVersion": 2,
  "subjects": {
    "com.litescrape/litescrape-mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.litescrape.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "litescrape-mcp-server",
        "version": "0.5.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "This session has no Litescrape API key. google_search (25 calls), bing_search (50), google_maps (50) and duckduckgo_search (50) are free per network per UTC day, one call at a time; failed calls do not count. Only the free search tools are listed. More than 130 other Litescrape tools (AI answers, maps details and reviews, app stores, retailers, real estate, jobs, social media, web pages and more) are found with find_tools: describe the task and it returns the best matches with their input schemas, then run one with call_tool. Identifiers from one result, such as a place, product or user ID, feed the matching detail tool. Found tools marked keyless false need an API key, which also lifts every limit: get one at https://litescrape.com and set LITESCRAPE_API_KEY in this server's environment. Every call returns the Litescrape API response as JSON, unchanged, after a one-line summary. Pass result_groups (inside call_tool arguments for found tools) to keep only the top-level groups you need; search_metadata is always kept. google_search with fast_mode true returns organic results only, faster. Results come straight from the source site; links are real destinations, never redirects. When a call reports a limit, relay its \"Fix:\" line to the user.",
      "tools": [
        {
          "name": "bing_search",
          "title": "Bing Search",
          "description": "Get Bing web search results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cc": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Case-insensitive two-letter country of origin.\n\nFormat: US or GB. Cannot be combined with mkt.",
                "title": "Cc"
              },
              "device": {
                "default": "desktop",
                "description": "Selects desktop, tablet, or mobile result behavior.",
                "enum": ["desktop", "tablet", "mobile"],
                "title": "Device",
                "type": "string"
              },
              "engine": {
                "const": "bing",
                "default": "bing",
                "description": "Selects the Bing web-search engine.",
                "title": "Engine",
                "type": "string"
              },
              "filters": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Native Bing display or date filter expression.\n\nMaximum length: 8,192 characters. Control characters are rejected.",
                "title": "Filters"
              },
              "first": {
                "default": 1,
                "description": "One-based native offset for organic results.\n\nRange: 1 through 9,007,199,254,740,991. Prefer litescrape_pagination.next when it is returned.",
                "title": "First",
                "type": "integer"
              },
              "lat": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latitude from -90 through 90.\n\nMay be supplied independently or with lon.",
                "title": "Lat"
              },
              "location": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Named city-level origin used to localize the Bing request.\n\nMaximum length: 256 characters. Control characters are rejected.",
                "title": "Location"
              },
              "lon": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longitude from -180 through 180.\n\nMay be supplied independently or with lat.",
                "title": "Lon"
              },
              "mkt": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Case-insensitive Bing language-country market token.\n\nFormat: two-letter language and country, such as en-US. Cannot be combined with cc.",
                "title": "Mkt"
              },
              "q": {
                "description": "Bing search query after trimming.\n\nAccepted length: 1 through 2,048 characters. Control characters are rejected. Bing query syntax such as quoted phrases and exclusions remains available.",
                "title": "Q",
                "type": "string"
              },
              "result_groups": {
                "description": "Return only these top-level result groups, e.g. [\"organic_results\", \"knowledge_graph\"]; omit for the complete response. search_metadata is always kept",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "safeSearch": {
                "default": "moderate",
                "description": "Bing adult-content policy; values are case-insensitive.",
                "enum": ["off", "moderate", "strict"],
                "title": "Safesearch",
                "type": "string"
              }
            },
            "required": ["q"],
            "title": "Request",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:782c8fe3582ffe43680dee91bb2c5b69a25f473f079d0d43bbd2692de862ceda"
        },
        {
          "name": "call_tool",
          "title": "Call a Litescrape tool",
          "description": "Run a Litescrape tool found with find_tools. Pass its name and arguments matching its input schema; arguments may also take result_groups to keep only some top-level groups.",
          "inputSchema": {
            "properties": {
              "arguments": {
                "description": "Arguments for the tool, matching its input schema; {} when it needs none",
                "type": "object"
              },
              "name": {
                "description": "Tool name from find_tools",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:41713072d174e06fe89c85c8192001ee67d2dd13cb789f03bf2d5706226dbd07"
        },
        {
          "name": "duckduckgo_search",
          "title": "DuckDuckGo Search",
          "description": "Get DuckDuckGo web search results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "df": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Date window: d, w, m, y, or YYYY-MM-DD..YYYY-MM-DD.",
                "title": "Df"
              },
              "kl": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "DuckDuckGo region and language token, such as us-en.",
                "title": "Kl"
              },
              "m": {
                "default": 50,
                "description": "Requested result count from 1 through 50; mutually exclusive with search_assist.",
                "title": "M",
                "type": "integer"
              },
              "q": {
                "description": "Required search text, up to 500 characters.",
                "title": "Q",
                "type": "string"
              },
              "result_groups": {
                "description": "Return only these top-level result groups, e.g. [\"organic_results\", \"knowledge_graph\"]; omit for the complete response. search_metadata is always kept",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "safe": {
                "default": "-1",
                "description": "DuckDuckGo safe-search level.",
                "enum": ["1", "-1", "-2"],
                "title": "Safe",
                "type": "string"
              },
              "search_assist": {
                "default": true,
                "description": "Enable DuckDuckGo query assistance; mutually exclusive with m.",
                "title": "Search Assist",
                "type": "boolean"
              },
              "start": {
                "default": 0,
                "description": "Result offset from 0 through 10,000.",
                "title": "Start",
                "type": "integer"
              }
            },
            "required": ["q"],
            "title": "Request",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5ec59b869457e2445aba8a7f054d4d81a7781adb765456a4dd4b0a60afa722cc"
        },
        {
          "name": "find_tools",
          "title": "Find Litescrape tools",
          "description": "Find the Litescrape tools for a task beyond the ones listed here: AI answers, maps details and reviews, app stores, retailers, real estate, jobs, social media, web pages and more. Describe the task in q to get the best matches first, or pass names to fetch specific tools. Each tool comes with its description and whether it works without an API key; best matches and named tools also carry their input schema. Run one with call_tool.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Most tools to return for q; default 5",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "names": {
                "description": "Tool names to fetch with their input schemas, instead of q",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "q": {
                "description": "The task, in plain language, e.g. \"track competitor prices on Amazon\"",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:26fb2a35179c2bf3aaddcb8ee31da5ce7d14b286b8ebb4d13598e12c363e6e44"
        },
        {
          "name": "google_maps",
          "title": "Google Maps",
          "description": "Search Google Maps places, or get one place by ID.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A Google Maps protobuf parameter sequence for search filters or an exact place.\n\nMaximum length: 8,192 characters. Exact-place data requires type=place.",
                "title": "Data"
              },
              "data_cid": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A decimal Google CID used to resolve one exact place.\n\nCannot be combined with place_id or exact-place data.",
                "title": "Data Cid"
              },
              "gl": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Two-letter country code used for regional result localization.\n\nExamples: us, gb, ca, au",
                "title": "Gl"
              },
              "google_domain": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Validated Google domain used for the request.\n\nExamples: google.com, google.co.uk, google.ca",
                "title": "Google Domain"
              },
              "hl": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Language used for Google Maps labels and returned text.\n\nExamples: en, es, fr, de",
                "title": "Hl"
              },
              "lat": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latitude for a coordinate-based viewport. Must be supplied with lon and either z or m.",
                "title": "Lat"
              },
              "ll": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A complete viewport containing latitude, longitude, and either zoom or radius.\n\nFormat: @lat,lon,14z or @lat,lon,5000m",
                "title": "Ll"
              },
              "location": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A named geographic location resolved by the API. Cannot be combined with ll or lat/lon.\n\nRequires z or m.",
                "title": "Location"
              },
              "lon": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longitude for a coordinate-based viewport. Must be supplied with lat and either z or m.",
                "title": "Lon"
              },
              "m": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Search radius in meters for location or lat/lon geography.\n\nAccepted range: 1 through 15,028,132. Cannot be combined with z.",
                "title": "M"
              },
              "max_price": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum price level for returned places.\n\nMust be non-negative and cannot be lower than min_price.",
                "title": "Max Price"
              },
              "min_price": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum price level for returned places.\n\nMust be non-negative and cannot exceed max_price.",
                "title": "Min Price"
              },
              "min_rating": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Preferred minimum Google rating.\n\nGoogle treats this as a relevance preference.",
                "title": "Min Rating"
              },
              "nearby": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Uses the supplied geography as a nearby-search scope.\n\nRequires ll, location, or a lat/lon pair.",
                "title": "Nearby"
              },
              "open_at_hour": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filters for places open at a specific hour using 24-hour time.\n\nAccepted range: 0 through 23. Requires open_on_day.",
                "title": "Open At Hour"
              },
              "open_on_day": {
                "anyOf": [
                  {
                    "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filters for places open on a specific day.",
                "title": "Open On Day"
              },
              "open_state": {
                "anyOf": [
                  {
                    "enum": ["now", "24h"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filters by the current open state.\n\nCannot be combined with open_on_day or open_at_hour.",
                "title": "Open State"
              },
              "place_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A Google place identifier used to resolve one exact place or request live foot traffic.\n\nCannot be combined with data_cid or exact-place data on the primary Maps endpoint. It is the only required parameter on /api/google/maps/popular-times. Every response is fetched live; places without published data return popular_times: null.",
                "title": "Place Id"
              },
              "q": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The business, category, address, or natural-language query to search. Required when type is search.\n\nExamples: coffee shops in Austin, dentist near Denver",
                "title": "Q"
              },
              "result_groups": {
                "description": "Return only these top-level result groups, e.g. [\"organic_results\", \"knowledge_graph\"]; omit for the complete response. search_metadata is always kept",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "start": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Native Maps result offset: 0, 20, 40, and so on. Each request returns up to 20 places and each successful request costs one credit.\n\nUse pagination.next when it is present instead of constructing the next request manually.",
                "title": "Start"
              },
              "type": {
                "anyOf": [
                  {
                    "enum": ["search", "place"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Chooses a result search or an exact place response. Required for query and filter searches.\n\nUse place when sending an exact-place data sequence.",
                "title": "Type"
              },
              "z": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Google Maps zoom level for location or lat/lon geography.\n\nAccepted range: 3 through 30. Cannot be combined with m.",
                "title": "Z"
              }
            },
            "title": "Request",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9e53da1195e357d3d2578f3069beb70defadf327cf2e6299580b936aa98c266c"
        },
        {
          "name": "google_search",
          "title": "Google Search",
          "description": "Get Google search results, including the AI Overview and People also ask.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_dt": {
                "anyOf": [
                  {
                    "enum": ["i", "e"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Includes or excludes as_sitesearch.\n\nRequires as_sitesearch.",
                "title": "As Dt"
              },
              "as_epq": {
                "anyOf": [
                  {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Exact phrase query.",
                "title": "As Epq"
              },
              "as_eq": {
                "anyOf": [
                  {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Excluded phrase query.",
                "title": "As Eq"
              },
              "as_lq": {
                "anyOf": [
                  {
                    "maxLength": 4096,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Require results that link to this URL.",
                "title": "As Lq"
              },
              "as_nhi": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Inclusive range upper bound.\n\nRequires as_nlo.",
                "title": "As Nhi"
              },
              "as_nlo": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Inclusive range lower bound.\n\nRequires as_nhi.",
                "title": "As Nlo"
              },
              "as_oq": {
                "anyOf": [
                  {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Any-of search terms.",
                "title": "As Oq"
              },
              "as_q": {
                "anyOf": [
                  {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Additional all-of search terms.",
                "title": "As Q"
              },
              "as_qdr": {
                "anyOf": [
                  {
                    "pattern": "^[dwmy](?:[1-9][0-9]*)?$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Quick range d, w, m, or y with an optional positive count.",
                "title": "As Qdr"
              },
              "as_rq": {
                "anyOf": [
                  {
                    "maxLength": 4096,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Find pages related to this URL.",
                "title": "As Rq"
              },
              "as_sitesearch": {
                "anyOf": [
                  {
                    "maxLength": 253,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Site hostname to include or exclude.",
                "title": "As Sitesearch"
              },
              "color_scheme": {
                "anyOf": [
                  {
                    "enum": ["light", "dark"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Google result color presentation.",
                "title": "Color Scheme"
              },
              "cr": {
                "anyOf": [
                  {
                    "pattern": "^country[A-Z]{2}(?:\\|country[A-Z]{2})*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "One or more countryXX restrictions joined with |.",
                "title": "Cr"
              },
              "device": {
                "default": "desktop",
                "description": "Request device profile and radius bound.",
                "enum": ["desktop", "tablet", "mobile"],
                "title": "Device",
                "type": "string"
              },
