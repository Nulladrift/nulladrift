          },
          "digest": "sha256:ecadbabf3a5839285675dbc56382206853d436ae8294c2e3deedc525c616e4e8"
        },
        {
          "name": "check_availability",
          "title": "Check open appointment days",
          "description": "See Sonlight Window Cleaning's real dispatch availability for the next two weeks, which days have morning/afternoon capacity and which days carry an extra $25–$50 discount. Use after get_quote to help the customer pick a day before calling book_window_cleaning. Serves Colorado (Denver, Colorado Springs, Front Range), New Mexico (Albuquerque area) and Texas (Austin).",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Service address (used to determine the local dispatch calendar). Include zip if known.",
                "type": "string"
              },
              "days_out": {
                "default": 14,
                "description": "How many days ahead to check.",
                "maximum": 60,
                "minimum": 7,
                "type": "integer"
              },
              "zip": {
                "description": "5-digit zip of the service address, preferred over address parsing.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "days": {
                "items": {
                  "properties": {
                    "am": {
                      "type": "boolean"
                    },
                    "date": {
                      "description": "YYYY-MM-DD",
                      "type": "string"
                    },
                    "discount": {
                      "description": "USD off if booked on this day",
                      "type": ["number", "null"]
                    },
                    "discountSlot": {
                      "enum": ["am", "pm", null],
                      "type": ["string", "null"]
                    },
