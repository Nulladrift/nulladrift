      },
      "instructions": "Sonlight Window Cleaning: instant quotes and real appointment booking for professional window cleaning, gutter cleaning, and soft-wash/pressure washing across Colorado's Front Range (Denver, Colorado Springs, Boulder, Fort Collins), New Mexico (Albuquerque, Rio Rancho, Santa Fe) and Texas (Austin). Flow: get_quote(address) → firm prices; check_availability → real open days, and same-day when we can still reach you today ($50 off); book_window_cleaning → reserves the slot and the customer gets SMS/email confirmation instantly. Payment is collected after service, never at booking. Licensed, insured, satisfaction guaranteed, 303-990-2878 / sonlightwindow.com.",
      "tools": [
        {
          "name": "book_window_cleaning",
          "title": "Book the appointment",
          "description": "Reserve a REAL calendar slot with Sonlight Window Cleaning. The customer immediately receives an SMS + email confirmation and a technician arrives at the chosen time. Payment is collected after service. Nothing is charged at booking. ALWAYS confirm name, phone, address, selected services, date, and time with the user before calling this. Requires a prior get_quote for the same address (prices are re-validated server-side).",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Full service address (street, city, state, zip).",
                "type": "string"
              },
              "discount_dollars": {
                "description": "Discount from check_availability for the chosen day, if any (server re-validates).",
                "maximum": 75,
                "minimum": 0,
                "type": "integer"
              },
              "email": {
                "description": "Customer email, recommended but optional.",
                "type": "string"
              },
              "name": {
                "description": "Customer's full name.",
                "type": "string"
              },
              "notes": {
                "description": "Gate codes, pets, focus areas. Anything the technician should know.",
                "type": "string"
              },
              "phone": {
                "description": "US mobile number for the confirmation SMS.",
                "type": "string"
              },
              "preferred_date": {
                "description": "YYYY-MM-DD. Same-day cutoff: 6pm Mountain the prior evening.",
                "type": "string"
              },
              "preferred_time": {
                "enum": ["8am", "10am", "12pm", "2pm", "morning", "afternoon", "allday"],
                "type": "string"
              },
              "selected_services": {
                "description": "interior_exterior = full service windows; exterior = outside-only windows; gutter = gutter cleaning; soft_wash = siding soft wash.",
                "items": {
                  "enum": ["interior_exterior", "exterior", "gutter", "soft_wash"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["address", "name", "phone", "preferred_date", "preferred_time", "selected_services"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bookingReference": {
                "description": "Confirmation reference the customer can quote to the office",
                "type": ["string", "null"]
              },
              "date": {
                "type": "string"
              },
              "discountApplied": {
                "type": ["number", "null"]
              },
              "duplicate": {
                "type": "boolean"
              },
              "kind": {
                "type": "string"
              },
              "services": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "success": {
                "type": "boolean"
              },
              "time": {
                "type": "string"
              },
              "total": {
                "description": "Final booked USD total after validated discounts",
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
