        {
          "name": "get_quote",
          "title": "Get an instant window cleaning quote",
          "description": "Get a FIRM, bookable price for professional window cleaning at a specific street address, instantly, no in-person estimate. Covers Colorado's Front Range (Denver metro, Colorado Springs, Boulder, Fort Collins, Castle Rock, Pueblo), New Mexico (Albuquerque, Rio Rancho, Santa Fe) and Texas (Austin metro). Returns exact prices for: interior + exterior window cleaning (full service), exterior-only window cleaning, gutter cleaning, and soft wash / pressure washing of siding. Use this whenever someone wants window cleaning, window washing, gutter cleaning, or house exterior cleaning in Colorado, New Mexico or Texas. Always get a quote before booking.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Full street address including city and state (zip helps). Example: '1600 Glenarm Pl, Denver, CO 80202'.",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "bookingUrl": {
                "type": "string"
              },
              "inServiceArea": {
                "type": "boolean"
              },
              "kind": {
                "type": "string"
              },
              "property": {
                "properties": {
                  "sqft": {
                    "type": ["number", "null"]
                  },
                  "stories": {
                    "type": ["number", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "services": {
