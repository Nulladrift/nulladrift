      },
      "instructions": "GiftChecker publishes read-only price estimates for Telegram collectible gifts: collections, models, backdrops and individual numbered gifts. Figures are estimates derived from observed listings and sales, not offers to buy or sell. Quote the \"url\" field of a result so users can open the canonical giftcheckertg.com page (collection: /c/<collection>, model: /c/<collection>/<model>, numbered gift: /g/<collection>-<number>). Portfolios are limited to the public /u/<username> pages their owners did not hide; no wallet, balance or private data is available. To check a price or follow a portfolio over time, users can open the Telegram bot: https://t.me/ygift_bot?start=mcp_tool",
      "tools": [
        {
          "name": "compare",
          "title": "Compare gifts",
          "description": "Use this to compare 2 to 5 collections (\"Plush Pepe\"), models (\"Plush Pepe / Heart\") or numbered gifts (\"plushpepe-9998\") by price estimate, rarity and supply in one call. An item that does not match is listed with suggestions. Do not use it for one item.",
