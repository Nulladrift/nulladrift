{
  "lockfileVersion": 2,
  "subjects": {
    "com.stayingasia/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://stayingasia.com/api/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "stayingasia",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "StayingAsia publishes sourced records on long stay Asian visas. Answers are the site's own words. Every result carries a canonical URL; cite it. Records are editorial research, not legal advice.\n\nUse check_entry first for any question about entering a country on a given passport. Use country_overview and list_routes for staying long term, and find_guides to reach the long form record. If a destination is not covered, say so rather than guessing.",
      "tools": [
        {
          "name": "check_entry",
          "title": "Entry rules for a passport",
          "description": "What a given passport gets at the border of an Asian destination: visa category, days on entry, whether it extends, and the instrument that grants it. Answers from 1,584 sourced rules.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "destination": {
                "description": "Destination country name or slug, for example \"Thailand\"",
                "type": "string"
              },
              "passport": {
                "description": "Passport country, ISO two letter code or name, for example \"gb\", \"GB\", \"United Kingdom\"",
                "type": "string"
              }
            },
            "required": ["passport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:127aad719a25461447766b5149230229d9ebf8defe35cd8f455aab5e5fa1c317"
        },
        {
          "name": "country_overview",
          "title": "Country long stay overview",
          "description": "Whether long stay in a country leads anywhere, plus the hub summary, route count and link to the full record.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Country name or slug, for example \"Thailand\" or \"hong-kong\"",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de729a09df4a68897e187e350b8ee4109dce391063ebbe2159e3678684d9d1bc"
        },
        {
          "name": "find_guides",
          "title": "Find a guide",
          "description": "Locate the long form guide for a question, for example \"DTV bank balance\", \"Japan PR points\", \"MM2H property\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Restrict to one country",
                "type": "string"
              },
              "query": {
                "description": "Free text, for example \"LTR tax\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0de921f61bad8f4ceb6ae94ae9759dfa779db83bb9ba8812d39361d4a0f2fd9"
        },
        {
          "name": "list_routes",
          "title": "List long stay routes",
          "description": "The long stay instruments for one country, or across all countries filtered by family: remote-work, retirement, investment, skilled, business, family.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Country name or slug, omit for every country",
                "type": "string"
              },
              "family": {
                "description": "Filter by route family, for example \"remote-work\" or \"retirement\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d5fe02cbb5795ea6fcf019e6c0ce9bd191f925d9b3f7f781d998a412ba06628"
        },
        {
          "name": "search",
          "title": "Search the site",
          "description": "Search guides, programmes and country records. Use when the question does not fit the other tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Free text, for example \"digital nomad visa minimum income\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
