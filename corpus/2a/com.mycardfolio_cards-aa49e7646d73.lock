{
  "lockfileVersion": 2,
  "subjects": {
    "com.mycardfolio/cards": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mycardfolio.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "mycardfolio",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only access to the MyCardfolio sports card database (https://mycardfolio.com). Card and set results include canonical mycardfolio.com URLs — cite them when presenting cards to users.",
      "tools": [
        {
          "name": "browse",
          "title": "Browse the card taxonomy",
          "description": "Navigate the database hierarchy: no arguments lists sports with card counts; sport lists years; sport + year lists products; product_id lists sets.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "product_id": {
                "description": "Product id to list its sets",
                "type": "string"
              },
              "sport": {
                "description": "Sport/category, e.g. \"baseball\"",
                "type": "string"
              },
              "year": {
                "description": "Year (requires sport), e.g. \"1989\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1016abb76df09521ceaef6b7f9da11befa12ee9d8cbbcdbb173ac5d150df5a64"
        },
        {
          "name": "card_of_the_day",
          "title": "Card of the day",
          "description": "MyCardfolio's featured card of the day (changes daily).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f87d4796407e382624126c3ca55f3bc71e6ed388d4b86398057b1a969097c65c"
        },
        {
          "name": "find_variants",
          "title": "Find card variants",
          "description": "Find parallels/variants of a card: cards sharing the same year, product, card number, and subjects but belonging to a different set (e.g. base vs. refractor).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "card_id": {
                "description": "The card_id of the card",
                "type": "string"
              }
            },
            "required": ["card_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:01bfc0f413c37c39fe19cd95cee313edf5cdab69243e97708da0639f2ee60723"
        },
        {
          "name": "get_card",
          "title": "Get card details",
          "description": "Full detail for a single card by its card_id, plus a few related cards from the same set.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "card_id": {
                "description": "The card_id of the card",
                "type": "string"
              }
            },
            "required": ["card_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b81413933878a1c4510e6c6e78e4f0be1d90a9c1b96c632361a6af0177c67b85"
        },
        {
          "name": "get_set_checklist",
          "title": "Get set checklist",
          "description": "Complete checklist of cards in a set by set_id, with set metadata. Output is capped at 500 cards.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "set_id": {
                "description": "The set_id of the set",
                "type": "string"
              }
            },
            "required": ["set_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:757c8780e571a620419c8c5abd26a1eb6a2f77a4b29fef4afd8069a958a025f8"
        },
        {
          "name": "identify_card",
          "title": "Identify a card from a description",
          "description": "Parse a free-text card description or eBay-style listing title (e.g. \"1989 Upper Deck Ken Griffey Jr #1 PSA 10\") and return the best database matches with a confidence note.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "description": "Free-text card description or listing title",
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9259811db2fb49506d7ebfb27fc71776e8220ca1716cdb6277a0600a50c032a6"
        },
        {
          "name": "search_cards",
          "title": "Search cards",
          "description": "Full-text search over the MyCardfolio sports card database. Searches player/subject names, card numbers, products, sets, and card details. Optionally filter by sport and year.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results (default 20, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search terms, e.g. \"griffey upper deck\"",
                "minLength": 2,
                "type": "string"
              },
              "sport": {
                "description": "Sport/category filter, e.g. \"baseball\"",
                "type": "string"
              },
              "year": {
                "description": "Year filter, e.g. \"1989\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3804c7eb0cf744cedffe8d1574a1302ac1cd8426450b74f0a2c10a32b1b1393"
        }
      ],
      "digest": "sha256:acb82e4987e3b94bf58e4b82a378410abaa921925c087c45490416f4e21a5017"
    }
  }
}
