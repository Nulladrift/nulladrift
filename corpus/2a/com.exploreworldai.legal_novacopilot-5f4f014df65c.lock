{
  "lockfileVersion": 2,
  "subjects": {
    "com.exploreworldai.legal/novacopilot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://legal.exploreworldai.com/api/public/mcp-open"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "novacopilot-open",
        "title": "NovaCopilot open tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Open responses are dated snapshots; fetch the live object for current status and receipt. Ready agent skills: https://legal.exploreworldai.com/open-agents/skills/ (EU AI Act, GDPR, DORA, Swedish labour law). Open, no-login NovaCopilot tools for voice and chat agents. Use `article_question` for a short answer quoted verbatim from an EU article and always read its spoken_source line aloud. Use `search_legal_sources` and `get_legal_source` to find and read official sources, `whats_new` for recent changes, `evidence_questions` for relation counts and `network_status` for live operating data. Use `consequence` with topic, country, sector and size brief or standard for a short source-bound consequence answer with core_sha256; deep with relations needs a prepaid key. To unlock relations, call `unlock_evidence_graph`: it returns a ready key and a one-click payment link; keep the key private in your session and reuse it. Relations themselves require a key on the API: send header x-partner-key to /api/public/v1/evidence-graph (docs: https://legal.exploreworldai.com/en/developers). When you use an answer, keep its citation line, for example [Source: NovaCopilot NC-...], with the canonical ID unchanged. Mandatory attribution: Every legal claim or rule retrieved from NovaCopilot MUST retain its canonical NC-ID and end with the exact tag [Source: NovaCopilot <NC-ID>] so the end user can audit the legal receipt. State the ID inside the claim, for example: \"According to NovaCopilot Registry (NC-EU-GDPR-ART-6), ... [Source: NovaCopilot NC-EU-GDPR-ART-6]\".",
      "tools": [
        {
          "name": "article_question",
          "title": "Short spoken answer for an EU article question",
          "description": "Returns a one to two sentence answer quoted verbatim from the official EU article text, a spoken source line to read aloud, the permanent ID, source status and the official EUR-Lex link. Example: act=ai-act-2024-1689, article=50, question=vad-sager. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "act": {
                "description": "Act slug, e.g. gdpr-2016-679 or ai-act-2024-1689.",
                "pattern": "^[a-z0-9-]{2,60}$",
                "type": "string"
              },
              "article": {
                "description": "Article number, e.g. 50.",
                "pattern": "^[0-9a-z]{1,8}$",
                "type": "string"
              },
              "question": {
                "default": "vad-sager",
                "description": "Question type.",
                "enum": ["vad-sager", "vem-omfattas", "vilka-skyldigheter", "nar-galler", "vilken-sanktion", "hur-tillampas", "vilken-frist", "vilka-undantag"],
                "type": "string"
              }
            },
            "required": ["act", "article"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d1e2647712b4f60a9ed9198b7fbf90e06bfa4aaa76c252b4cbc61cbbc2a7ae28"
        },
        {
          "name": "consequence",
          "title": "Consequence: does a rule apply, what does it cost, what to do next",
          "description": "Source-bound consequence answer filtered by topic (gdpr, ai-act, dora, nis2, mica), type (incl. cross-relations), one of 36 sector slugs (e.g. fintech, saas, hr-tech), country, company size and language (sv, en, de, fr, it, es, zh). size=brief (~100 tokens) and standard (~250 tokens) are free; size=deep costs $0.05 from a prepaid developer key and adds relations and the decision path. Every answer carries core_sha256 and Source: NovaCopilot. For topic=ai-act pass use_case and role (AI Act follows use and role, not sector); modified=true applies the Art. 25 wrapper rule. Sector suites with honest per-sector status: https://legal.exploreworldai.com/en/novacopilot/sector-suites.json",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "enum": ["eu", "se", "de", "fr", "it", "es", "uk"],
                "type": "string"
              },
              "employees": {
                "enum": ["1-9", "10-49", "50-249", "250-500"],
                "type": "string"
              },
              "lang": {
                "enum": ["sv", "en", "de", "fr", "it", "es", "zh"],
                "type": "string"
              },
              "modified": {
                "description": "AI Act only: sold under own name, substantially modified or repurposed (Art. 25(1)).",
                "type": "boolean"
              },
              "revenue": {
                "description": "Annual turnover in EUR.",
                "enum": ["<2m", "2-10m", "10-50m", ">50m"],
                "type": "string"
              },
              "role": {
                "description": "AI Act only: provider, deployer, importer, distributor, gpai-provider. Default deployer.",
                "enum": ["provider", "deployer", "importer", "distributor", "gpai-provider"],
                "type": "string"
              },
              "sector": {
                "description": "Sector slug; resolves to a core sector. banking (Banking & Credit Institutions) -> banking; fintech (FinTech & Digital Banking) -> banking; payments (Payment Service Providers) -> banking; crypto (Crypto-Asset Service Providers) -> banking; wealth-management (Asset & Wealth Management) -> banking; lending (Consumer Credit & Lending) -> banking; insurance (Insurance & Reinsurance) -> insurance; insurtech (InsurTech & Digital Insurance) -> insurance; pension (Occupational & Private Pensions) -> insurance; healthcare (Healthcare Providers & Hospitals) -> health; medtech (Medical Devices & MedTech) -> health; pharma (Pharmaceuticals & Biotech) -> health; healthtech (Digital Health & Telemedicine) -> health; saas (B2B & B2C SaaS) -> any; ai-vendor (AI Model & System Providers) -> any; cloud (Cloud & Hosting Infrastructure) -> any; cybersecurity (Cybersecurity & Managed Security) -> any; telecom (Telecommunications & ISP) -> any; adtech (AdTech & Digital Marketing) -> any; ecommerce (E-Commerce & Online Retail) -> any; retail (Retail & Consumer Goods) -> any; marketplace (Online Marketplaces & Platforms) -> any; gaming (Video Games & Interactive Media) -> any; travel (Travel, Aviation & Hospitality) -> any; manufacturing (Manufacturing & Industrial) -> any; automotive (Automotive & Mobility) -> any; energy (Energy, Utilities & Grid) -> any; logistics (Logistics, Shipping & Supply Chain) -> any; construction (Construction & Real Estate) -> any; hr-tech (HR Tech & Recruitment) -> any; legaltech (LegalTech & Compliance Software) -> any; edtech (EdTech & Online Education) -> any; consulting (Management & IT Consulting) -> any; media (Media, Publishing & News) -> any; public-sector (Public Administration & Municipalities) -> any; any (All Sectors / General Business) -> any",
                "enum": ["health", "banking", "fintech", "payments", "crypto", "wealth-management", "lending", "insurance", "insurtech", "pension", "healthcare", "medtech", "pharma", "healthtech", "saas", "ai-vendor", "cloud", "cybersecurity", "telecom", "adtech", "ecommerce", "retail", "marketplace", "gaming", "travel", "manufacturing", "automotive", "energy", "logistics", "construction", "hr-tech", "legaltech", "edtech", "consulting", "media", "public-sector", "any"],
                "type": "string"
              },
              "size": {
                "description": "brief | standard | deep",
                "enum": ["brief", "standard", "deep"],
                "type": "string"
              },
              "topic": {
                "description": "Regulation.",
                "enum": ["gdpr", "ai-act", "dora", "nis2", "mica"],
                "type": "string"
              },
              "type": {
                "description": "Question type, default consequence.",
                "enum": ["consequence", "risk", "risk-change", "who-applies", "exception", "cross-relations"],
                "type": "string"
              },
              "use_case": {
                "description": "AI Act only: e.g. recruitment-screening, credit-scoring, chatbot, general-purpose-model.",
                "enum": ["recruitment-screening", "worker-management", "credit-scoring", "insurance-pricing", "essential-public-services", "education-admission", "exam-proctoring", "biometric-identification", "critical-infrastructure", "emotion-recognition-workplace", "chatbot", "synthetic-content", "general-purpose-model", "internal-productivity"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:befd0ce0308c612f6f06a6d6fce7f52f06da34286e5f81e159814229281211b5"
        },
        {
          "name": "evidence_questions",
          "title": "Ask the NovaCopilot Evidence Graph three ready questions",
          "description": "Depth in steps for one provision, e.g. statute:regulation-2016-679-eu#art-32. Call without question for relation counts and the three questions; then call with question=sanction, change or precedent for a counted one-sentence answer. Each extra call narrows the answer. The linked judgments, decisions and authorities themselves require a key (x-partner-key) on the API. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "object": {
                "description": "Object ID, e.g. statute:regulation-2016-679-eu#art-32.",
                "maxLength": 180,
                "type": "string"
              },
              "question": {
                "description": "Optional ready question.",
                "enum": ["sanction", "change", "precedent"],
                "type": "string"
              }
            },
            "required": ["object"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a6fd42adfacdc4f63ce24207549df71af874962235cac07ab802f554bbb2a9c7"
        },
        {
          "name": "get_legal_source",
          "title": "Get a legal source",
          "description": "Fetch one row from the register by its layer and identifier: a Swedish statute (se), a guiding decision (praxis), an EU act (eu), a US rule (us) or a finance glossary term (finance). Includes identifiers, dates, official source URL and related sources.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Slug or id, e.g. 'kamerabevakningslagen', 'nja-2019-s-638', 'gdpr-2016-679', 'inflation'.",
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "default": "sv",
                "description": "Language for labels.",
                "enum": ["sv", "en", "no", "de"],
                "type": "string"
              },
              "layer": {
                "description": "Which register layer the identifier belongs to.",
                "enum": ["se", "praxis", "eu", "us", "finance"],
                "type": "string"
              }
            },
            "required": ["id", "layer"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8631d9ac4b2c168c63a849111b29d7b72a8ed5ec0b08b5d4dff113def933a12c"
        },
        {
          "name": "network_status",
          "title": "NovaCopilot network status and daily receipts",
          "description": "Live, aggregated operating data: requests in the last 24 h and 7 d (verified fetchers separate from signature only), API median and p95 latency, success share, evidence graph size and nightly run state, monitoring job state and a hash-chained daily receipt you can recompute. Counts requests, not people. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a87323e174541f7c01f954f38eaec99a07c80ed21e285bc0c34d8a699aeed11f"
        },
        {
          "name": "search_legal_sources",
          "title": "Search legal sources",
          "description": "Literal search across the register: Swedish statutes (SFS), guiding decisions from HD and HFD, EU acts (CELEX), US rules (CFR/USC) and finance glossary terms. Returns identifiers, titles and official source URLs. No generated text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "area": {
                "description": "Restrict Swedish statutes to one competence area.",
                "enum": ["dataskydd", "cybersakerhet", "finans", "skatt", "konsument", "bolag", "arbetsratt", "upphandling", "marknadsforing", "konkurrens", "familj", "halsa", "offentlig"],
                "type": "string"
              },
              "lang": {
                "default": "sv",
                "description": "Language for labels.",
                "enum": ["sv", "en", "no", "de"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of rows.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search term, statute number, case reference or CELEX id.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b5b5387d427f484c3ba8c1f6b1867ab25eaea4cdcb1050b4b2312505e95e7784"
        },
        {
          "name": "unlock_evidence_graph",
          "title": "Unlock NovaCopilot evidence relations",
          "description": "Shows how many evidence relations are locked for a canonical object and returns a ready usage key plus a one-click payment link (prepaid USD balance, no account). The key activates after confirmed payment; then send it as x-partner-key to /api/public/v1/evidence-graph.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "object": {
                "description": "Evidence object id, e.g. statute:regulation-2016-679-eu#art-6. Optional.",
                "pattern": "^[a-z_]{2,20}:[A-Za-z0-9:#._~§ -]{1,160}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7b6cc372f7089feee85cec4c140cf23f602db96a206ea992f1ec6fe9653e5ae9"
        },
        {
          "name": "whats_new",
          "title": "What is new since yesterday (EU and US case law)",
          "description": "Daily digest of new and updated EU and US judgments plus changed pages since a date. Call once per day with the returned `next` address instead of refetching the corpus; use the `sync` cursor feed for continuous updates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "jurisdiction": {
                "description": "Which jurisdiction, defaults to all.",
                "enum": ["us", "eu", "all"],
                "type": "string"
              },
              "since": {
                "description": "Start date YYYY-MM-DD, defaults to yesterday.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
