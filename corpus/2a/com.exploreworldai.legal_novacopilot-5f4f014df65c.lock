        {
          "name": "consequence",
          "title": "Business consequences",
          "description": "Jurisdiction: tool_input_or_source.\nOriginal specification (English): Source-bound consequence answer filtered by topic (gdpr, ai-act, dora, nis2, mica), type (incl. cross-relations), one of 36 sector slugs (e.g. fintech, saas, hr-tech), country, company size and language (sv, en, de, fr, it, es, zh). size=brief (~100 tokens) and standard (~250 tokens) are free. Open no-login MCP returns the public view only. In authenticated MCP, size=deep costs $0.05 from the signed-in account's developer balance and adds relations and the decision path. To use a prepaid product key, call the REST endpoint with x-partner-key. Every answer carries core_sha256 and Source: NovaCopilot. For topic=ai-act pass use_case and role (AI Act follows use and role, not sector); modified=true applies the Art. 25 wrapper rule. Sector suites with honest per-sector status: https://legal.exploreworldai.com/en/novacopilot/sector-suites.json",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "enum": ["eu", "se", "de", "fr", "it", "es", "uk"],
                "type": "string"
              },
              "employees": {
                "enum": ["1-9", "10-49", "50-249", "250-500"],
                "type": "string"
              },
              "lang": {
                "enum": ["sv", "en", "de", "fr", "it", "es", "zh"],
                "type": "string"
              },
              "modified": {
                "description": "AI Act only: sold under own name, substantially modified or repurposed (Art. 25(1)).",
                "type": "boolean"
              },
              "revenue": {
                "description": "Annual turnover in EUR.",
                "enum": ["<2m", "2-10m", "10-50m", ">50m"],
                "type": "string"
              },
              "role": {
                "description": "AI Act only: provider, deployer, importer, distributor, gpai-provider. Default deployer.",
                "enum": ["provider", "deployer", "importer", "distributor", "gpai-provider"],
                "type": "string"
              },
              "sector": {
                "description": "Sector slug; resolves to a core sector. banking (Banking & Credit Institutions) -> banking; fintech (FinTech & Digital Banking) -> banking; payments (Payment Service Providers) -> banking; crypto (Crypto-Asset Service Providers) -> banking; wealth-management (Asset & Wealth Management) -> banking; lending (Consumer Credit & Lending) -> banking; insurance (Insurance & Reinsurance) -> insurance; insurtech (InsurTech & Digital Insurance) -> insurance; pension (Occupational & Private Pensions) -> insurance; healthcare (Healthcare Providers & Hospitals) -> health; medtech (Medical Devices & MedTech) -> health; pharma (Pharmaceuticals & Biotech) -> health; healthtech (Digital Health & Telemedicine) -> health; saas (B2B & B2C SaaS) -> any; ai-vendor (AI Model & System Providers) -> any; cloud (Cloud & Hosting Infrastructure) -> any; cybersecurity (Cybersecurity & Managed Security) -> any; telecom (Telecommunications & ISP) -> any; adtech (AdTech & Digital Marketing) -> any; ecommerce (E-Commerce & Online Retail) -> any; retail (Retail & Consumer Goods) -> any; marketplace (Online Marketplaces & Platforms) -> any; gaming (Video Games & Interactive Media) -> any; travel (Travel, Aviation & Hospitality) -> any; manufacturing (Manufacturing & Industrial) -> any; automotive (Automotive & Mobility) -> any; energy (Energy, Utilities & Grid) -> any; logistics (Logistics, Shipping & Supply Chain) -> any; construction (Construction & Real Estate) -> any; hr-tech (HR Tech & Recruitment) -> any; legaltech (LegalTech & Compliance Software) -> any; edtech (EdTech & Online Education) -> any; consulting (Management & IT Consulting) -> any; media (Media, Publishing & News) -> any; public-sector (Public Administration & Municipalities) -> any; any (All Sectors / General Business) -> any",
                "enum": ["health", "banking", "fintech", "payments", "crypto", "wealth-management", "lending", "insurance", "insurtech", "pension", "healthcare", "medtech", "pharma", "healthtech", "saas", "ai-vendor", "cloud", "cybersecurity", "telecom", "adtech", "ecommerce", "retail", "marketplace", "gaming", "travel", "manufacturing", "automotive", "energy", "logistics", "construction", "hr-tech", "legaltech", "edtech", "consulting", "media", "public-sector", "any"],
                "type": "string"
              },
              "size": {
                "description": "brief | standard | deep",
                "enum": ["brief", "standard", "deep"],
                "type": "string"
              },
              "topic": {
                "description": "Regulation.",
                "enum": ["gdpr", "ai-act", "dora", "nis2", "mica"],
                "type": "string"
              },
              "type": {
                "description": "Question type, default consequence.",
                "enum": ["consequence", "risk", "risk-change", "who-applies", "exception", "cross-relations"],
                "type": "string"
              },
              "use_case": {
                "description": "AI Act only: e.g. recruitment-screening, credit-scoring, chatbot, general-purpose-model.",
                "enum": ["recruitment-screening", "worker-management", "credit-scoring", "insurance-pricing", "essential-public-services", "education-admission", "exam-proctoring", "biometric-identification", "critical-infrastructure", "emotion-recognition-workplace", "chatbot", "synthetic-content", "general-purpose-model", "internal-productivity"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
