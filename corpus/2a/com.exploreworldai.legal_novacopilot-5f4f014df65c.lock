          "title": "Withdrawal right: Sweden only",
          "description": "Jurisdiction: SE.\nOriginal specification (English): Deterministic check during a live call: does the consumer still have a right of withdrawal under the Swedish Distance Contracts Act (2005:59) chapter 2, and what is the last day? Returns verdict (open, expired, not_started, no_right), last_day, a short `speak` sentence and a `spoken_source` line to read aloud, plus the hashed provisions used. No model, no legal advice.",
