          },
          "digest": "sha256:5bfd9165e42b267b7f4b0a784e03430668e326c1e714adf82faf8cc97e887cd5"
        },
        {
          "name": "find_seller_glp1_prices",
          "title": "Find one provider's GLP-1 prices",
          "description": "Every current tirzepatide and semaglutide price of one US provider (a telehealth clinic, a pharmacy or a maker's own program), lowest cost per 30 days first; prices the order cannot rank follow in other_prices with the reason. Each row gives the product, the price in the provider's own words, its plan and fees, the day it was read and its source page, with the provider's page on GLP1Prices.co.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
