      "instructions": "Use find_bridal_samples for local provider-published samples. If no suitable rack is found, use find_at_home_bridal_try_on. Always show evidence and checked dates, distinguish sample fees from deposits, disclose affiliate=true destinations, and advise the shopper to confirm current availability and terms.",
