{
  "lockfileVersion": 2,
  "subjects": {
    "com.kasspian/kasspian": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kasspian.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "kasspian",
        "version": "0.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Kasspian reads where a founder's buyers already ask for what they sell, and whether a room allows an answer. Every result carries its read date and sources. An access read is a model inference, so repeat its hedge (\"usually\"); never restate it as a quoted rule. None of these tools posts anywhere. Tell the user to post from their own account after reading the room's rules.",
      "tools": [
        {
          "name": "check_subreddit_rules",
          "title": "Check a subreddit's self-promotion rules",
          "description": "Whether a subreddit allows a founder to post, comment, or share a link about their product. Returns a hedged read with its source and date. Input: the subreddit name, with or without r/.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "room": {
                "description": "Subreddit name, e.g. r/microsaas",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["room"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:47feb84259bcfa5ae1b6a66e636395725dd1507ff9b877baf6523b265b75f9a1"
        },
        {
          "name": "draft_reply",
          "title": "Read or write the reply for a thread",
          "description": "The reply Kasspian wrote for one of the user's threads, written to that room's rules, or writes it if none exists yet. Input: the handle from my_new_threads (planId#index). The user posts it themselves; this tool never posts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "description": "planId#index from my_new_threads",
                "maxLength": 60,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c7dd7f3d6f61b9d13264b00d18618b06d33de4dffe902dbb75cf7d7aa07d9d8"
        },
        {
          "name": "find_people_asking",
          "title": "Find where people ask for what a business sells",
          "description": "The real places (subreddits, forums, communities, directories) where the buyers of a business already ask for something like it, each with why, the move to make there, a source URL when live search opened it, and a read on whether posting or commenting is allowed. Three places without an account; a free plan holds the rest and the live threads. Input: the business in a sentence or two, or its website URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business": {
                "description": "What the business sells and to whom, or its URL",
                "maxLength": 2000,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["business"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:54914cffa7dec107cef937c56ba78e64c88ec9975197338e2513451588a05b80"
        },
        {
          "name": "mark_reply",
          "title": "Record what happened to a reply",
          "description": "After the user posts a reply from their own account, record it: status sent, then replied, signed_up or paid as it happens, with the Reddit account used and the amount when paid. Feeds the daily thread check, the revenue tally and the webhook. Input: handle (planId#index) and status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "maxLength": 60,
                "minLength": 3,
                "type": "string"
              },
              "reddit_username": {
                "description": "The Reddit account the reply was posted from",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "revenue": {
                "description": "Only with status paid",
                "properties": {
                  "amount": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "currency": {
                    "enum": ["usd", "gbp", "eur"],
                    "type": "string"
                  },
                  "monthly": {
                    "type": "boolean"
                  }
                },
                "required": ["amount", "monthly"],
                "type": "object"
              },
              "status": {
                "enum": ["sent", "replied", "signed_up", "paid"],
                "type": "string"
              }
            },
            "required": ["handle", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:61e5e5782db36e3602c6680785748872e0f0af70a79ce38e59d40b82d4a19a5e"
        },
        {
          "name": "my_new_threads",
          "title": "My new threads",
          "description": "The live threads waiting for a reply on the signed-in user's Kasspian plans, newest first, each with a handle (planId#index), the asker's words, the link, the room read and whether a reply is written.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many to show, default 10",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7ee20d0bee1159bcc7941001c236579d0832f2aa1be6d1e5b7875f169ce0be07"
        },
        {
          "name": "validate_idea",
          "title": "Validate a business idea",
          "description": "A scored verdict on a business idea or a live site: who pays, the biggest risk, the cheapest test, with live sources when the daily search budget allows. Input: the idea in one or two sentences, or the site's URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "idea": {
                "description": "The idea, or a URL to read",
                "maxLength": 2000,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["idea"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f5939e91a31d44741f060ab61356d7795fa23d9c653eb9d940085aa3c71d72e6"
        }
      ],
      "prompts": [
        {
          "name": "find_my_first_customers",
          "title": "Find my first customers",
          "description": "Where your buyers are already asking for what you sell, and whether each room lets you answer.",
          "arguments": [
            {
              "name": "business",
              "description": "What you sell and to whom, or your website",
              "required": true
            }
          ],
          "digest": "sha256:45aa5e42e5af1a03a8745a14d4009bdfc732da472a427ddfe29d6467d39d93d9"
        },
        {
          "name": "morning_brief",
          "title": "Brief me this morning",
          "description": "What's new on your plans, and the one reply worth posting today, ready to paste.",
          "digest": "sha256:9ccc80119db3dd1a42b066bf84c8c4ae19edd6f9f90c4ef09f847025d07294e2"
        },
        {
          "name": "plan_my_week",
          "title": "Plan my replies this week",
          "description": "Your best threads for the week, each with the reply written to its room's rules, laid out day by day.",
          "digest": "sha256:fbc6937c83cd9a65850b05d23f2b7accf3db58329bc48efd51222909d18d4f33"
        }
      ],
      "digest": "sha256:7d0eee90a6a276a3c8d3932bafc8f8fb216ac3169b0aa40613e094d6b7089015"
    }
  }
}
