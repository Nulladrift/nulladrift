      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "MyBoatGuru Boat Advisor",
        "version": "1.1.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Helps people figure out which type of boat fits their needs and budget. For finding the right boat type, prefer boat-quiz — it launches a guided, interactive quiz the user can click through (any preferences already known from the conversation are pre-filled), then shows ranked matches with match percentages. Call recommend-boat-type instead only for a quick, one-shot text answer, or when the current client cannot render interactive content — it takes the same preferences (activity, water type, crew size, budget, etc., all optional) and returns the same kind of ranked matches without a UI. Call get-boat-type-details for a deep dive on one specific boat type. Call compare-boat-types to compare two boat types side by side. Call get-gear-checklist for the required/recommended safety gear list with cost estimates. All tools link back to myboatguru.com for more detail.",
      "tools": [
        {
          "name": "boat-quiz",
          "title": "Boat Quiz Tool",
          "description": "The preferred way to help someone figure out what type of boat to buy, especially on a client that can render interactive app content. Launches a guided, step-by-step quiz covering purpose, water type, crew size, budget, and more, then shows their top boat type matches with why each fits. Any preferences already known from the conversation can be passed in up front and will be pre-filled in the quiz, so having known preferences is a reason to use this tool, not a reason to skip it. Use recommend-boat-type instead only when the user explicitly asks for a quick, non-interactive text answer, or the current client cannot render interactive content.",
          "inputSchema": {
            "properties": {
              "activities": {
                "description": "Specific must-have activities.",
                "items": {
                  "enum": ["fishing", "tubing", "wakeboarding", "water_skiing", "swimming", "sun_lounging", "overnighting", "entertaining"],
                  "type": "string"
                },
                "type": "array"
              },
              "amenities": {
                "description": "Amenities that matter most.",
                "items": {
                  "enum": ["toilet", "cabin", "sleeping", "shade_hardtop", "swim_platform", "livewell", "rod_storage", "cooler_space", "watersports_tower", "electronics"],
                  "type": "string"
                },
                "type": "array"
              },
              "annual_operating": {
                "description": "Annual operating budget range.",
                "enum": ["under_2k", "2k_5k", "5k_10k", "10k_25k", "over_25k", "not_sure"],
                "type": "string"
              },
              "crew_count": {
                "description": "Typical number of people aboard.",
                "enum": ["1_2", "3_4", "5_8", "9_plus"],
                "type": "string"
              },
              "experience": {
                "description": "Boating experience level.",
                "enum": ["first_time", "some", "experienced"],
                "type": "string"
              },
              "maintenance": {
                "description": "How much upkeep they are comfortable with.",
                "enum": ["minimal", "moderate", "regular", "hands_on"],
                "type": "string"
              },
              "propulsion": {
                "description": "Preferred propulsion type.",
                "enum": ["outboard", "inboard", "sterndrive", "jet", "sail", "not_sure"],
                "type": "string"
              },
              "purchase_budget": {
                "description": "Purchase budget range.",
                "enum": ["under_10k", "10k_25k", "25k_50k", "50k_100k", "100k_250k", "over_250k", "not_sure"],
                "type": "string"
              },
              "purpose": {
                "description": "Primary activity on the water.",
                "enum": ["fishing", "family_cruising", "watersports", "overnight", "relaxing", "mix"],
                "type": "string"
              },
              "space_preference": {
                "description": "What kind of onboard space matters most.",
                "enum": ["seating", "standing", "open_deck", "mix_of_all"],
                "type": "string"
              },
              "step": {
                "description": "Which question step to show (1-10). Omit or send 1 to start.",
                "type": "integer"
              },
              "tow_vehicle": {
                "description": "What tow vehicle, if any, they have.",
                "enum": ["yes_capable", "yes_smaller", "no_will_buy", "no_no_plans"],
                "type": "string"
              },
              "trailerability": {
                "description": "How important trailering the boat home is.",
                "enum": ["must_trailer", "prefer_trailer", "marina_fine", "not_sure"],
                "type": "string"
              },
              "water_type": {
                "description": "Where they boat most often.",
                "enum": ["freshwater_lake", "river", "bay_coastal", "inshore_saltwater", "offshore_saltwater", "shallow_flats"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answers": {
                "description": "All preferences known so far, echoed back so a client can show prior selections. Present when mode is \"question\".",
                "type": "object"
              },
              "mode": {
                "description": "Which part of the quiz flow this response represents.",
                "enum": ["question", "results"],
                "type": "string"
              },
              "question": {
                "description": "The current question definition (title, options, or a questions array for grouped steps), taken directly from the quiz configuration. Present when mode is \"question\".",
                "type": "object"
              },
              "recommendations": {
                "description": "Up to 3 ranked boat type recommendations, strongest match first. Present when mode is \"results\".",
                "items": {
                  "properties": {
                    "boat_type": {
                      "type": "string"
                    },
                    "match_percent": {
                      "type": ["integer", "null"]
                    },
                    "match_reasons": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "next_steps": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "top_factors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "tradeoffs": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["boat_type", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "step": {
                "description": "Current step number (1-10). Present when mode is \"question\".",
                "type": "integer"
              },
              "total": {
                "description": "Total number of steps. Present when mode is \"question\".",
                "type": "integer"
              }
            },
            "required": ["mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Boat quiz ready",
            "openai/toolInvocation/invoking": "Launching the boat quiz...",
            "ui": {
              "resourceUri": "ui://boat-quiz-widget",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:57d2db036e0ec8b3ec5c8bc8439cfc333b32041862abce2cf0873088412aa470"
        },
