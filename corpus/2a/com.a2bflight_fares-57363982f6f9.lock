        {
          "name": "meet_link",
          "title": "Group trip link",
          "description": "A link to a2bflight.com's group page for people flying from different homes to meet in one place. Use it when the user already knows where; where_to_meet when they ask where. Without dates it picks the weekend whose round trips we have seen price everyone, with each fare and the total; with dates it quotes no price, and the page shows each person's cheapest fare we have seen for them or the closest. A warning says why the fares are a poor option and what to try instead: pass it on.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "back": {
                "description": "YYYY-MM-DD: the day everyone flies home",
                "type": "string"
              },
              "members": {
                "description": "2 to 8 people, each flying from their own home; person 1 first",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "adults": {
                      "description": "how many adults fly from this home together; omit for 1",
                      "type": "integer"
                    },
                    "home": {
                      "description": "the person's home IATA airport, such as JFK — an airport, not a city code",
                      "type": "string"
                    }
                  },
                  "required": ["home"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "mode": {
                "description": "cheapest_total (the default: the lowest sum), fairest (the lowest dearest ticket), least_travel (the least flying time) or earliest_together (everyone landed soonest)",
                "type": "string"
              },
              "out": {
                "description": "YYYY-MM-DD: the day they meet; leave out and back both empty for a suggested long weekend",
                "type": "string"
              },
              "to": {
                "description": "the IATA airport where they all meet — an airport, not a city code",
                "type": "string"
              }
            },
            "required": ["members", "to"],
