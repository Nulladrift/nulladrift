      "instructions": "Flight fares a2bflight.com has seen. Every price is an observation for one adult, economy, seen on its seen date (a row without one, last checked on its checked date) — not a live quote; say so when quoting. Quote each price in the currency its row gives: never convert it or look up an exchange rate. Lead with the few best rows rather than every row. Each row's trip says one-way or return; most travellers fly there and back, so give both when a route has both, the one-way first, and say a return's stops and duration cover both directions. Give the user the row's page_url first: it shows the whole route on a2bflight.com. book_url opens the seller's booking page for that fare. Never invent a link. Look up codes with find_airports; ask cheapest_routes for where to go from somewhere, and route_fares for one airport pair. For a group flying from several cities, ask where_to_meet where they can meet, or meet_link when they know where, and give the user its meet_url.",
      "tools": [
        {
          "name": "cheapest_routes",
          "title": "Cheapest routes",
          "description": "Use this when someone asks where they can fly cheaply from a city, or for flight deals under a budget or in a month. The cheapest cached fare on every route we hold from an origin (or into a destination), cheapest one-way first, each with its cheapest round trip of a 3 to 21 day stay in `return` when we hold one. Filter by a maximum price and a departure month here rather than by reading the list; both apply to the one-way. Prices are one adult, economy, as seen on the date in `seen` (or last checked on `checked` when a row has none) — observations, not quotes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "where the flights leave from: origin IATA airport or city code (NYC covers JFK, LGA and EWR); give from, to or both",
                "type": "string"
              },
              "limit": {
                "description": "how many routes to return, 1 to 20; 10 when omitted",
                "type": "integer"
              },
              "max_price": {
                "description": "keep only fares at or under this amount, in the currency the results carry",
                "type": "number"
              },
              "month": {
                "description": "YYYY-MM: the cheapest fare departing in that month; needs from",
                "type": "string"
              },
              "to": {
                "description": "where the flights land: destination IATA airport or city code",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "type": "string"
              },
              "note": {
                "type": "string"
