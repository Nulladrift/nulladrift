      "instructions": "Flight fares from a2bflight.com, cheapest first. Every price is for one adult in economy. Each fare carries found_at, the day it was found (a row without one carries checked, the day its route was last checked); give that day with the price. Fares are shown before bags: bag fees and the final price appear at checkout on the seller's page. Quote each price in the currency its row gives: never convert it or look up an exchange rate. A one-way row may carry typical_price, the route's typical one-way fare, and pct_below_typical, how many percent below it the fare is; use both as given. Lead with the few cheapest rows rather than every row. Each row's trip says one-way or return; most travellers fly there and back, so give both when a route has both, the one-way first, and say a return's stops and duration cover both directions. Give the user the row's page_url first: it shows the whole route on a2bflight.com. book_url opens the seller's booking page for that fare. Never invent a link. Look up codes with find_airports; use cheapest_routes for where to go from a city, and route_fares for one airport pair. For a group flying from several cities, use where_to_meet to find where they can meet, or meet_link when they know where, and give the user its meet_url.",
      "tools": [
        {
          "name": "cheapest_routes",
          "title": "Cheapest routes",
          "description": "Use this when someone asks where they can fly cheaply from a city, or for flight deals under a budget or in a month. Returns the cheapest fare on each route with fares from an origin (or into a destination), cheapest one-way first, each with its cheapest round trip of a 3 to 21 day stay in `return` when the route has one. Filter by a maximum price and a departure month here rather than by reading the list; both apply to the one-way. Prices are for one adult in economy; each fare carries found_at, the day it was found (or checked, the day its route was last checked, when it has none), and a one-way may carry typical_price and pct_below_typical.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "where the flights leave from: origin IATA airport or city code (NYC covers JFK, LGA and EWR); give from, to or both",
                "type": "string"
              },
              "limit": {
                "description": "how many routes to return, 1 to 20; 10 when omitted",
                "type": "integer"
              },
              "max_price": {
                "description": "keep only fares at or under this amount, in the currency the results carry",
                "type": "number"
              },
              "month": {
                "description": "YYYY-MM: the cheapest fare departing in that month; needs from",
                "type": "string"
              },
              "to": {
                "description": "where the flights land: destination IATA airport or city code",
                "type": "string"
              }
            },
            "type": "object"
          },
