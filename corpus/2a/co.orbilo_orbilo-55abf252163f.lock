{
  "lockfileVersion": 2,
  "subjects": {
    "co.orbilo/orbilo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://orbilo.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "orbilo",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Orbilo checks whether websites are ready for AI agents against the UCP (Universal Commerce Protocol), WebMCP and Access specs. check_site and get_report work without an account: check any public site and get a score, grade and fixes per spec, plus a shareable report link. check_site runs live and can take up to a minute. The monitoring tools (list_monitored_sites, get_site_status, add_monitored_site) need a connected Orbilo account and are scoped to that account's team. The changelog resources explain recent UCP and WebMCP spec releases in plain English.",
      "tools": [
        {
          "name": "add_monitored_site",
          "title": "Add a Monitored Site",
          "description": "Start monitoring a site: Orbilo checks it against UCP, WebMCP and Access now and on a schedule, and alerts the team when readiness changes. Use this when someone wants ongoing monitoring rather than a one-off check, or asks to be told when their site breaks for agents. Uses one of the plan's site slots. Requires a connected Orbilo account.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The site to monitor, as a domain or URL, e.g. shop.example.com. Monitoring is per site; WebMCP pages can be added on the dashboard.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:fe8d1ec268cb7b4b6f21fcc987ab17879dcf4ad7c4653bd53cdfe19fb3e45bbd"
        },
        {
          "name": "check_site",
          "title": "Check a Site",
          "description": "Check whether a website is ready for AI agents against the UCP, WebMCP and Access specs. Use this when someone asks \"can agents use my site\", whether a site supports UCP or WebMCP, or why an agent cannot buy from or act on a page. Returns a score and grade per spec, every check that passed, warned or failed with a fix for each, and a shareable report link. Runs live and can take up to a minute for all three specs. Works without signing in; signed-in users get a higher daily limit.",
          "inputSchema": {
            "properties": {
              "fresh": {
                "description": "Skip the 10 minute result cache and check the site again now.",
                "type": "boolean"
              },
              "spec": {
                "description": "Which spec to check: ucp, webmcp, access, or all (default). WebMCP checks are page-specific, so pass the page that registers tools.",
                "enum": ["ucp", "webmcp", "access", "all"],
                "type": "string"
              },
              "url": {
                "description": "The page to check, e.g. https://shop.example.com. A bare domain is checked over https.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7972cfdf4c64b081a372b648ddb652ca23ea747b4576f74835c933cd70bc9ed7"
        },
        {
          "name": "get_report",
          "title": "Get a Shared Report",
          "description": "Fetch a check report by its share token, the 16 character code at the end of an orbilo.co/check/r/... link. Use this when someone pastes a report link or asks about a check that was already run, instead of checking the site again. Reports expire 30 days after the check. Works without signing in.",
          "inputSchema": {
            "properties": {
              "token": {
                "description": "The share token, or the full report URL",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cdd8dbf521c8166a661b7a62a53b7e3c3a03e148be0bed967a34f7dd3c665592"
        },
        {
          "name": "get_site_status",
          "title": "Get Site Status",
          "description": "The current standing of one monitored site: the latest stored check per spec (UCP and Access for the site, WebMCP per monitored page) and every open issue with its fix. Use this when someone asks what is wrong with a site they monitor, what to fix first, or when it was last checked. Pass the domain or the site id from list_monitored_sites. For a site that is not monitored, use check_site instead. Requires a connected Orbilo account.",
          "inputSchema": {
            "properties": {
              "site": {
                "description": "The site domain (e.g. shop.example.com) or its id",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bccff2b0900f43d763c1fea8bf0f17ce408963a1e3c4efa2979f8a7be84147d4"
        },
        {
          "name": "list_monitored_sites",
          "title": "List Monitored Sites",
          "description": "List the sites your Orbilo team monitors, with the latest grade per spec (UCP, WebMCP, Access), how many issues are open on each, and how many sites the plan still allows. Use this when someone asks what they are monitoring, how their sites are doing, or whether they can add another site. Requires a connected Orbilo account.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:428c5b3210c1054a44d358655e61badb75ef014535ab5f7d22fa0ececeefbc6d"
        }
      ],
      "resources": [
        {
          "uri": "orbilo://changelog/ucp",
          "name": "ucp_changelog",
          "title": "UCP Changelog",
          "description": "The latest UCP (Universal Commerce Protocol) spec releases explained in plain English: what changed, whether it is breaking, and what a site needs to do. Read this before advising on UCP changes.",
          "mimeType": "application/json",
          "digest": "sha256:838b99c32ce5c7a0d3fe8150fcaedb4f4c60926fd5944d8fde0cf8f0848dd87d"
        },
        {
          "uri": "orbilo://changelog/webmcp",
