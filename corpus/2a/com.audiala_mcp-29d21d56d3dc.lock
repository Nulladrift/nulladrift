      },
      "instructions": "Audiala publishes narrated audio guides for 1,900+ cities and 44,000+ places in 11 languages. get_audio_guide_preview returns a card for one place with a 45-second preview of its audio guide. get_city_overview returns a card for one city with the places that have an audio guide. get_trip_planner_link returns a link to Audiala's trip planner for one city. This server does not build itineraries.",
      "tools": [
        {
          "name": "get_audio_guide_preview",
          "title": "Get audio guide preview",
          "description": "Looks up one landmark, museum or other place in Audiala's audio-guide catalog and returns a place card: a photo, a short summary, a 45-second preview of the narrated audio guide that the user can play in the card, and a link that opens the full guide in the Audiala app. Use this when the user asks for Audiala's audio guide to a specific named place, or asks to hear it. Both the city and the place name are required. Only the 45-second preview plays in the chat; the full narration is in the Audiala app. If the place has no guide, the result lists up to 6 places in that city that do (kind \"place_candidates\"). Read-only.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City the place is in, as a name or catalog slug, for example 'Rome' or 'rome'.",
                "type": "string"
              },
              "lang": {
                "description": "Language of the guide and its preview. Defaults to en.",
                "enum": ["en", "fr", "de", "es", "it", "pt", "ru", "ja", "zh", "cs", "hi"],
                "type": "string"
              },
              "monument": {
                "description": "Name of the landmark, museum or place, for example 'Colosseum'.",
                "type": "string"
              }
            },
            "required": ["city", "monument"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "city": {
                "description": "The resolved city.",
                "properties": {
                  "app_url": {
                    "description": "Opens the city in the signed-in Audiala web app.",
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "guides_count": {
                    "description": "Number of audio guides in the city.",
                    "type": ["integer", "null"]
                  },
                  "image": {
                    "description": "Hero image URL.",
                    "type": ["string", "null"]
                  },
                  "image_fallbacks": {
                    "description": "Images to try if `image` fails.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "summary": {
                    "description": "Short summary of the city.",
                    "type": ["string", "null"]
                  },
                  "url": {
                    "description": "Public audiala.com city page.",
                    "type": "string"
                  }
                },
                "required": ["country", "name", "url"],
                "type": "object"
              },
              "kind": {
                "enum": ["place", "place_candidates", "not_found"],
                "type": "string"
              },
              "lang": {
                "type": "string"
              },
              "links": {
                "description": "UTM-tagged links into Audiala.",
                "properties": {
                  "app_url": {
                    "description": "Signed-in Audiala web app.",
                    "type": "string"
                  },
                  "download": {
                    "description": "App download page.",
                    "type": "string"
                  },
                  "listen_in_app": {
                    "description": "Deep link to the full guide in the Audiala app.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "listen_in_app": {
                "type": "string"
              },
              "message": {
                "description": "Why nothing matched and what to try instead.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "place": {
                "properties": {
                  "app_url": {
                    "type": "string"
                  },
                  "audio_preview_url": {
                    "description": "45-second narration preview (MP3/M4A).",
                    "type": ["string", "null"]
                  },
                  "image": {
                    "type": ["string", "null"]
                  },
                  "image_fallbacks": {
                    "items": {
                      "type": "string"
