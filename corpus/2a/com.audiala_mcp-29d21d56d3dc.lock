              "query": {
                "type": "string"
              },
              "suggestions": {
                "description": "Other places in the city that have a guide, when the place was not found.",
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Public audiala.com page for the place.",
                      "type": "string"
                    }
                  },
                  "required": ["name", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
