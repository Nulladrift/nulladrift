      "instructions": "The Agentic Engineering Periodic System (ase.academy, CC BY 4.0). Call overview first. To check a repository, call repository_checklist and read the files yourself; the server does not ask for your code and keeps no request contents.",
      "tools": [
        {
          "name": "find_elements",
          "description": "Find elements of the table by words in their name, problem or test, by role (dev, lead, plat, qa, ...), by group (security, verification, ...) or by row (task, change, system, organisation). Returns one line per element.",
          "inputSchema": {
            "properties": {
              "group": {
                "maxLength": 200,
                "type": "string"
              },
              "query": {
                "maxLength": 200,
                "type": "string"
              },
              "role": {
                "maxLength": 200,
                "type": "string"
              },
              "row": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5c7b9c41975a042ba39db76559b2e1d96c5297658e0a7c7916059d260413e1b0"
        },
        {
          "name": "get_element",
          "description": "One element in full: problem, observable test with its clauses and evidence kinds, when it applies, when it adds work without helping, activities, relations, page link. By ID (ae-006), symbol (Sx) or name.",
          "inputSchema": {
            "properties": {
              "ref": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3736330c97a8cf0eaed0ec1d8480c3d09060183f3ad8a5c262de2c4139f9112a"
        },
        {
          "name": "overview",
          "description": "The Agentic Engineering Periodic System: what it is, how to read it (rows, columns, judging and reading rules), the roles. Call this first.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f92c706550205583b2fa5c89d1c288753a8e833a779ed5ba726e0d95563ce1f"
        },
        {
          "name": "repository_checklist",
          "description": "What a repository can show for each test, clause by clause, what it cannot, and the judging rules. Use it to check the current project; read the files yourself. Optional: element IDs, a role or a group to narrow it.",
          "inputSchema": {
            "properties": {
              "group": {
                "maxLength": 200,
                "type": "string"
              },
              "ids": {
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 60,
                "type": "array"
              },
              "role": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9594f3eb179bff0561ab389e544b6f0812d3aa92d3d95efca8ca24b59f947a4d"
        }
      ],
      "prompts": [
        {
          "name": "check_repository",
          "description": "Check this repository against the Agentic Engineering Periodic System.",
