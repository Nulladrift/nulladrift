      "tools": [
        {
          "name": "check_rotation",
          "description": "Check a beekeeper's varroa treatment history against published resistance-rotation guidance. Deterministic rules only — no AI. Returns violations (same active group repeated, label withdrawal period breached), cautions, and the inputs it could not judge.",
          "inputSchema": {
            "properties": {
              "harvest_date": {
                "description": "Planned or actual honey harvest date (YYYY-MM-DD), used to check label withdrawal periods.",
                "type": "string"
              },
              "infestation_percent": {
                "description": "Your measured varroa infestation in percent of adult bees (from a wash/shake count), if you measured it.",
                "type": "number"
              },
              "treatments": {
                "description": "Treatments in any order. Each: {date:\"YYYY-MM-DD\", product:\"apivar\"|\"apistan\"|\"apiguard\"|\"formic\"|\"oxalic\"|\"bayvarol\"|\"checkmite\"|\"hopguard\"|\"biotech\"|\"other\", active?, irac_group?, label_withdrawal_days?, honey_supers_on?, notes?}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["treatments"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a741793ac095f792d0bf2bbce9c630d1ecd965e9225389f08f85c5759a08cc80"
        },
        {
          "name": "get_thresholds",
          "description": "Published varroa damage thresholds with their exact source, plus the monitoring cadence the guidance asks for. Quoted study values — not a recommendation.",
