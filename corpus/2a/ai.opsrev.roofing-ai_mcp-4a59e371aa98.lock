            "additionalProperties": false,
            "properties": {
              "contactId": {
                "maxLength": 36,
                "minLength": 36,
                "pattern": "^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$",
                "type": "string"
              },
              "locationAddress": {
                "additionalProperties": false,
                "properties": {
                  "city": {
                    "maxLength": 50,
                    "minLength": 1,
                    "type": "string"
