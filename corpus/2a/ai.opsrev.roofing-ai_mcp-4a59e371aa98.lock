                    "maxLength": 50,
                    "minLength": 1,
                    "type": "string"
                  },
                  "zipCode": {
                    "maxLength": 10,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["city", "country", "state", "street1", "zipCode"],
                "type": "object"
              },
              "notes": {
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "priority": {
                "enum": ["Normal", "High", "Urgent"],
                "maxLength": 6,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["contactId"],
            "type": "object"
