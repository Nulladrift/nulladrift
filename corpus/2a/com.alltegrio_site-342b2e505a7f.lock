{
  "lockfileVersion": 2,
  "subjects": {
    "com.alltegrio/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.alltegrio.com/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "alltegrio-mcp",
        "title": "Alltegrio",
        "version": "2.0.0",
        "description": "Search and read alltegrio.com (AI development company); send Alltegrio a project inquiry.",
        "websiteUrl": "https://alltegrio.com/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Website of Alltegrio (alltegrio.com), a custom AI development company: AI agents, generative AI, LLM and RAG systems, machine learning, computer vision, data engineering; services, industries, case studies, blog and glossary, in English. Use search to find pages, then fetch with a result id to read one in full. submit_inquiry sends the Alltegrio team a project inquiry: use it only when the user explicitly asks to contact Alltegrio, with the user’s real name and email.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page",
          "description": "Return the full text of one alltegrio.com page as markdown, by the id from search results (its canonical URL).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Page id from search: its canonical URL.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "properties": {
                  "language": {
                    "type": "string"
                  },
                  "site": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "text": {
                "description": "The page as markdown.",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e5330b06ac07c61c94e76279e324e50a0589e02f47f004b0b523e3c53ccac6d5"
        },
        {
          "name": "get_page",
          "title": "Read a page (plain text)",
          "description": "Return the full markdown of one alltegrio.com page by its canonical URL (e.g. https://alltegrio.com/cases/ai-data-analyst-in-microsoft-teams). The same as fetch, as plain text.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Canonical page URL.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page (plain text)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d631d0415b50f58e9e513ff1f93389aa88b0b38097d80467a3b872f0995eafb"
        },
        {
          "name": "search",
          "title": "Search alltegrio.com",
          "description": "Search the website of Alltegrio, a custom AI development company: services (AI agents, generative AI, LLM and RAG systems, machine learning, computer vision, data engineering, MLOps), industry pages, case studies, blog articles and glossary terms. Use it to find what Alltegrio offers, has built or has written about. Returns matching pages with snippets and URLs; read one in full with fetch, passing its id.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many pages to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search query in English, e.g. \"AI agents for insurance claims\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "description": "Page id for fetch: its canonical URL.",
                      "type": "string"
                    },
                    "snippet": {
                      "description": "The passage that matched the query.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search alltegrio.com"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43f075c360c4036f30b968d61b37aab39b9e51f80c81b0ea570b8ee2d6e1f2a6"
        },
        {
          "name": "submit_inquiry",
          "title": "Send Alltegrio an inquiry",
          "description": "Send a project inquiry to Alltegrio on the user’s behalf: a request for a consultation, an estimate or a proposal for AI or software development. It reaches the Alltegrio team’s inbox and they reply by email to the address given. Use it only when the user asked to contact Alltegrio, with the user’s own name and email address — never invent them — and show the user the text before sending. Sending means the user agrees to the Privacy Policy: https://alltegrio.com/privacy-policy/",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company name, optional.",
                "maxLength": 150,
                "type": "string"
              },
              "email": {
                "description": "The user’s real email address. Alltegrio replies to it.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "message": {
                "description": "What the user needs: the task, the business context, timing, any constraints.",
                "maxLength": 5000,
                "type": "string"
              },
              "name": {
                "description": "The user’s full name.",
                "maxLength": 100,
                "type": "string"
              },
              "phone": {
                "description": "Phone number, optional.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "type": "string"
              },
              "sent": {
                "type": "boolean"
              }
            },
            "required": ["message", "sent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send Alltegrio an inquiry"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc405b43f0342285317f0a7047e49664694041223ec77f271e2445a0dcfb50ba"
        }
      ],
      "digest": "sha256:b4d46277fed5465b9fb45aa2ef99555e3d07aaf97a0ed9683ebfe7dc00f1af28"
    }
  }
