      "instructions": "Live Bittensor subnet intelligence: ranked screener grid, subnet details, OHLC history, AlphaGap flow/whale signals, TAO price and 7-day TAO forecast. Prices are in TAO (alpha) unless stated USD. Use screener_top() to find momentum, subnet_detail() for depth.",
