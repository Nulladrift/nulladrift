          "name": "alphagap_flow",
          "description": "AlphaGap momentum snapshot: flow_score (momentum+whale+volume),\n    whale_signal ('accumulating'/'distributing'), whale_ratio, composite,\n    dev, eval scores. High flow = strong momentum.",
          "inputSchema": {
            "properties": {
              "netuid": {
                "title": "Netuid",
                "type": "integer"
              }
            },
            "required": ["netuid"],
            "title": "alphagap_flowArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "alphagap_flowDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e5b8b191ee1bcc8f1ce2f4484bbc9f1f02acc8546d30b2261bfaadd73a782c54"
        },
        {
          "name": "screener_top",
          "description": "Top subnets by Cipher heat score. n up to 50. category filters by tag\n    (e.g. 'inference', 'training', 'agents', 'finance', 'tools').",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
