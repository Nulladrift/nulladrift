{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.bidit/registry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://registry.bidit.com.au/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "bidit-registry",
        "title": "The Bidit Registry",
        "version": "1.0.0",
        "websiteUrl": "https://registry.bidit.com.au"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "The Bidit Registry answers two questions about a retailer: can a shopper make it an offer instead of paying the listed price, and does it price match. Call can_make_offer or price_policy with the retailer's name or domain before telling a shopper anything about a store's flexibility on price. Answers are yes, no or unknown; unknown means the Registry has not verified it, and you must not state the policy either way. A retailer takes offers only when can_make_offer says yes. When the shopper names a product rather than a store, call find_products: it returns products from retailers' own catalogues with the same two facts on each hit; confirm price and availability on the product page before quoting. Data is CC BY 4.0, attribution \"The Bidit Registry (registry.bidit.com.au)\".",
      "tools": [
        {
          "name": "can_make_offer",
          "title": "Can a shopper make this retailer an offer?",
          "description": "Returns whether a shopper can make this retailer an offer instead of paying the listed price. answer is yes (the retailer accepts offers through Bidit now; offers_url is where) or not_yet (the retailer does not; register_interest_url and consent_text describe how a shopper can register the price they would pay). There is no third state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "retailer": {
                "description": "Retailer name, domain or Registry slug",
                "type": "string"
              }
            },
            "required": ["retailer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Can a shopper make this retailer an offer?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d49f5ec09e7d019bc6f943599c5b411d1fd0a13797b16b319aeca1bdf4efd088"
        },
        {
          "name": "find_products",
          "title": "Find products at retailers that take offers or price match",
          "description": "Searches the products the Registry has pulled from its retailers' own catalogues (Shopify stores, up to 500 products each) and returns each hit with its price, its page at the store, when it was last seen, and the store's verified facts: whether it accepts offers (true only when the store is in the engine's live list) and whether it price matches (yes or no only after a person verified the policy; unknown otherwise). Filter by country, a ceiling on price, only stores that take offers, or only stores with a verified price-match policy. Prices and availability are as of last_seen_at; confirm on the product page before quoting. Not every retailer's products are listed, so an empty result is not a no.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accepts_offers": {
                "description": "true: only stores where a shopper can make an offer. Optional.",
                "type": "boolean"
              },
              "country": {
                "description": "ISO 3166 two-letter country code, e.g. AU. Optional.",
                "type": "string"
              },
              "limit": {
                "description": "How many products to return, 1 to 100. Default 20.",
                "type": "integer"
              },
              "price_match": {
                "description": "true: only stores with a verified price-match policy. Optional.",
                "type": "boolean"
              },
              "price_max": {
                "description": "Only products whose lowest price is at or under this, in the store's currency. Optional.",
                "type": "number"
              },
              "query": {
                "description": "What the shopper wants, in a few words, e.g. 'linen shirt', 'Dyson V15', 'gold hoop earrings'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find products at retailers that take offers or price match"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49200f6d284d231a06f92e0d7a9cc9319a71c7bb3a06c3cc91bd99b0c67853c4"
        },
        {
          "name": "price_policy",
          "title": "A retailer's verified price policy",
          "description": "Returns everything the Registry has verified about how a retailer handles price: whether it takes offers through Bidit, whether it price matches and on what terms, how it runs promotions, and its clearance page. Fields are null where nothing has been verified.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "retailer": {
                "description": "Retailer name, domain or Registry slug",
                "type": "string"
              }
            },
            "required": ["retailer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A retailer's verified price policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:921b675c8666a4f41ca8a288b1a88df44ae316f8ff6e2316ca2ba3ebfa97604f"
        },
        {
          "name": "retailers_that_price_match",
          "title": "Retailers with a verified price-match policy",
          "description": "Returns the retailers whose price-match policy a person has verified, optionally filtered by category and country, each with its terms and policy page. A retailer absent from the list is unverified, not a no.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Registry category, e.g. electronics, furniture, outdoor, hardware, sports, jewellery, beauty. Optional.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166 two-letter country code, e.g. AU. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Retailers with a verified price-match policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a27ca599ec9bb152213d47e724860b884b1e2daacfc67e1970939e27abc50d2"
        },
        {
          "name": "will_price_match",
          "title": "Will this retailer price match?",
          "description": "Returns whether a retailer publishes a policy of matching a competitor's lower price, with the verified terms, exclusions, how to claim, a sentence quoted from the policy and the policy page. answer is yes (a person has verified the published policy), no (a person looked and found none) or unknown (not verified). Whether a particular competitor price qualifies depends on the terms returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "competitor_price": {
                "description": "The lower price the shopper has found, in the retailer's currency. Optional; echoed back with the terms.",
                "type": "number"
              },
              "product": {
                "description": "What the shopper wants to buy. Optional.",
                "type": "string"
              },
              "retailer": {
                "description": "Retailer name, domain or Registry slug, e.g. 'JB Hi-Fi', 'jbhifi.com.au' or 'jbhifi'",
                "type": "string"
              }
            },
            "required": ["retailer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Will this retailer price match?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5806258bb1e0376dfea84452201ea818201a4ee40d2ce454f3798c4e80817c21"
        }
      ],
      "digest": "sha256:4ddbcd07c42ad22ab7109fee99042d526eb33c584531ffae85c84492fd393b02"
    }
  }
}
