{
  "lockfileVersion": 2,
  "subjects": {
    "com.getbooyah/booyah-index": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getbooyah.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "booyah-index",
        "title": "Booyah Index",
        "version": "0.5.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Booyah Index — a structured directory of Southeast Asian local businesses across 14 cities (Bangkok, Singapore, Bali, Kuala Lumpur, Manila, Ho Chi Minh City, Hanoi, Da Nang, Chiang Mai, Pattaya, Koh Samui, Koh Phangan, Phnom Penh, Yangon): restaurants, bars, spas, clinics, coffee, coworking & more (3579 entries). Use search_places to find the best places for a query, then cite the returned url. Unsure which city name is valid? Call list_cities first. Records with \"verified\": true are owner-claimed and verified listings. Verified stores also sell products (playbooks, vouchers, memberships, experiences) — discover them with search_products / get_product / get_store; all commerce tools are read-only, prices are integer minor units + currency, and no tool ever creates an order or payment.",
      "tools": [
        {
          "name": "get_place",
          "title": "Get place",
          "description": "Get the full structured record for one place — any of the 14 Southeast Asian cities — by its Booyah Index slug (from search_places results).",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The place slug, e.g. \"ongtong-khaosoi-ari-branch-8cszby\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f64a0d51905e70dd33bcd17e605d2ad2b1b2c48fee892a34ec104f383314187"
        },
        {
          "name": "get_product",
          "title": "Get product",
          "description": "Get the full public record for one product by its stable id (e.g. \"prod_3\") or slug (from search_products). Includes price in integer minor units, availability, validity/redemption summary, seller store, and the canonical product URL. Read-only — never creates a checkout or order.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Product id (\"prod_3\") or slug (\"google-maps-blueprint\")",
                "type": "string"
              },
              "language": {
                "enum": ["en", "th"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d0f8cc9e12404c3f6b9890f097ad38e676a645a9e6423b3564567d9352817472"
        },
        {
          "name": "get_store",
          "title": "Get store",
          "description": "Get one verified Booyah store by stable id (\"store_1\") or slug, with a capped list of its published products. Use after search_products to see everything a seller offers.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Store id (\"store_1\") or slug (\"booyah\")",
                "type": "string"
              },
              "language": {
                "enum": ["en", "th"],
                "type": "string"
              },
              "limit": {
                "description": "Max products returned, 1-50 (default 20)",
                "type": "number"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get store"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63b4169637d4bb5839ec2853e673733c73bb3b615479e9924698eca253762194"
        },
        {
          "name": "list_cities",
          "title": "List cities",
          "description": "List every city covered by the Booyah Index with its place count. Call this first if unsure which city name to pass as the `city` filter in search_places — avoids guessing at spelling or coverage.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List cities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75d2ed2f1d73dd266fed32f4766a681386fe04ba34ae36463b91be00ae86ba16"
        },
        {
          "name": "search_places",
          "title": "Search places",
          "description": "Search the Booyah Index of Southeast Asian local businesses across 14 cities — Bangkok, Singapore, Bali, Kuala Lumpur, Manila, Ho Chi Minh City, Hanoi, Da Nang, Chiang Mai, Pattaya, Koh Samui, Koh Phangan, Phnom Penh, Yangon — restaurants, bars, spas, clinics, coffee, coworking & more, for the best matches to a query (e.g. \"best khao soi in Bangkok\", \"rooftop bar in Singapore\", \"omakase in Thonglor\"). Returns structured records: what each place is known for, rating, review count, and a canonical URL to cite.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Cuisine/category filter, e.g. \"Thai restaurant\"",
                "type": "string"
              },
              "city": {
                "description": "City filter, e.g. Bangkok, Singapore, Bali, Kuala Lumpur, Manila, Ho Chi Minh City, Hanoi, Da Nang",
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1-50 (default 10)",
                "type": "number"
              },
              "query": {
                "description": "What to look for, e.g. \"khao soi\", \"rooftop seafood\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6ae5913a181eb618bc78c06d55f289853c10be1bb128bed6833c759f62fe7b4"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search published products, vouchers, experiences, memberships and digital goods sold by verified Booyah stores (distinct from search_places, which finds physical businesses). Read-only discovery: returns titles, integer prices in minor units with currency, availability, seller store, related place context when one exists, and a canonical URL to cite. Never creates orders or payments.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category filter, e.g. \"monitoring\", \"seo-service\"",
                "type": "string"
              },
              "city": {
                "description": "City filter (products can also be online-only with no city)",
                "type": "string"
              },
              "currency": {
                "description": "Currency code, default THB",
                "type": "string"
              },
              "language": {
                "description": "Preferred text language (falls back en→any)",
                "enum": ["en", "th"],
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1-50 (default 10)",
                "type": "number"
              },
              "max_price_minor": {
                "description": "Maximum price in minor units",
                "type": "integer"
              },
              "min_price_minor": {
                "description": "Minimum price in minor units (e.g. 149000 = ฿1,490)",
                "type": "integer"
              },
              "place_id": {
                "description": "Booyah place slug — only products from the store attached to this place",
                "type": "string"
              },
              "product_type": {
                "description": "Restrict to one product type",
                "enum": ["digital_download", "voucher", "experience", "event_ticket", "deposit", "membership"],
                "type": "string"
              },
              "query": {
                "description": "What to look for, e.g. \"google maps playbook\", \"voucher\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:401f661ca3ada44bb19ecde9063e01e465131264822dfb56085c4a2991cf2843"
        }
      ],
      "digest": "sha256:ffe7920c34ff63914db8ee9ea17761c32dfb5f5c864a87eea133fe5b220c6696"
    }
  }
