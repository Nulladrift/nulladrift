        },
        {
          "name": "get_master_data_relationships",
          "title": "Get Master Data Relationships",
          "description": "Paid x402 tool. Get governed public relationships for one master-data golden record, such as supplier ownership, location hierarchy, or organization parentage. Returns direction, validity dates, provenance, and confidence. Price IDs by requested depth: price.relationships.depth-1.v1, price.relationships.depth-2.v1, or price.relationships.depth-3.v1.",
          "inputSchema": {
            "$defs": {
              "entityType": {
                "description": "One of the v1 entity domains. customer, asset, and person are closed Operator decisions, not gaps; reference data is served by get_reference_data.",
                "enum": ["supplier", "location", "organization"]
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Input for the paid fetch of the relationship graph around one golden record, priced by traversal depth. Mirrors GET /v1/master-data/entities/{entity_type}/{record_id}/relationships.",
            "properties": {
              "depth": {
                "default": 1,
                "description": "Traversal depth. Each depth is a separately priced tier.",
                "enum": [1, 2, 3],
                "type": "integer"
              },
              "entity_type": {
                "$ref": "#/$defs/entityType"
              },
              "record_id": {
                "description": "Golden-record identifier within the entity domain.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["entity_type", "record_id"],
            "title": "get_master_data_relationships tool input",
            "type": "object"
