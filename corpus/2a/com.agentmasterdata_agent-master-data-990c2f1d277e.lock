        {
          "name": "get_master_data_schema",
          "title": "Get Master Data Schema",
          "description": "Free discovery tool. Get supported public master-data entity types, identifiers, searchable attributes, relationships, reference domains, coverage, and freshness. Use this first when an agent does not know the data model or valid filters.",
          "inputSchema": {
            "$defs": {
              "entityType": {
                "description": "One of the v1 entity domains. customer, asset, and person are closed Operator decisions, not gaps; reference data is served by get_reference_data.",
                "enum": ["supplier", "location", "organization"]
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Input for the free discovery tool that describes the published master-data schema: entity domains, identifiers, attributes, and relationships. Every property is optional: an empty object returns the full schema for all v1 entity domains.",
            "properties": {
              "entity_type": {
                "$ref": "#/$defs/entityType",
                "description": "Describe only this entity domain. Omitted means all v1 entity domains."
              },
              "include_attributes": {
                "default": true,
                "description": "When false, the attributes member is omitted from each described entity type.",
                "type": "boolean"
              },
              "include_identifiers": {
                "default": true,
                "description": "When false, the identifiers member is omitted from each described entity type. primary_identifier is always present.",
                "type": "boolean"
              },
              "include_relationships": {
                "default": true,
                "description": "When false, the relationships member is omitted from each described entity type.",
                "type": "boolean"
              }
            },
            "title": "get_master_data_schema tool input",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
