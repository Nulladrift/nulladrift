            }
          },
          "digest": "sha256:3373206d6c4df6e7bf8304ce692919241f575abe0877d4c416320b5eac99b18b"
        },
        {
          "name": "get_reference_data",
          "title": "Get Reference Data",
          "description": "Paid x402 tool. Get governed public reference data and controlled vocabulary values such as country, currency, unit of measure, industry, status, category, or code mappings. Returns codes, labels, definitions, validity dates, mappings, provenance, and version. Price ID: price.reference.v1.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Input for the paid fetch of one governed reference-data code list. Mirrors GET /v1/reference-data/{domain}. Every optional member below is BUILD.md 8.7's, and the semantics are implemented in crates/core/src/operations/reference.rs: query and codes narrow the list, valid_at and include_inactive decide which values are current, limit and cursor page the result.",
            "properties": {
              "codes": {
                "description": "Exact codes wanted. Set membership, never a substring match; omit it to narrow nothing.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array",
                "uniqueItems": true
              },
              "cursor": {
                "description": "Opaque continuation cursor from a prior identical request. Bound to the operation, the normalized request, and the data_version it paged.",
                "maxLength": 2048,
                "type": "string"
              },
              "domain": {
                "description": "Reference-data domain identifier, as get_master_data_schema names it.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "include_inactive": {
                "default": false,
                "description": "Whether values declared inactive at valid_at are served. A value whose source states no validity interval is always served, flagged active: null beside the reference_value_validity_unknown warning. False excludes values declared inactive; true serves them flagged active: false beside the reference_value_inactive warning, so an intentionally excluded value is distinguishable from an accidental match.",
                "type": "boolean"
              },
              "limit": {
                "default": 100,
                "description": "Page size, applied after query, codes, and validity have narrowed the list. For mitre-cwe the maximum is 125.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language tag echoed on every served value and in the answer. Labels are served exactly as the snapshot stores them; there is no translation layer. For mitre-cwe, the tag may contain at most 64 ASCII bytes.",
                "pattern": "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$",
                "type": "string"
              },
              "query": {
                "description": "Optional code or label search: a case-insensitive substring match against a value's code OR its label. Omit it to match every value.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "valid_at": {
                "description": "The instant to evaluate each value's validity interval at. Defaults to the request clock. A value whose source DECLARES its interval is active when valid_from <= valid_at < valid_to, an absent or null bound open on its side. A value whose source states no interval at all is neither: it is served active: null and carries the reference_value_validity_unknown warning.",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["domain"],
            "title": "get_reference_data tool input",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.agentmasterdata/availability": {
              "available": true,
              "price_ids": ["price.reference.v1"],
              "reason": null
            }
          },
          "digest": "sha256:28b6d7b7e0e7ac5127810b9408b56e0fbde1c373b640e85ecb0e8a57b402ed55"
        },
        {
          "name": "resolve_master_data_entity",
          "title": "Resolve Master Data Entity",
          "description": "Paid x402 tool. Match incomplete or conflicting public supplier, location, or organization attributes to trusted master-data candidates. Returns explainable match evidence and never silently chooses an ambiguous entity. Price ID: price.resolve.v1.",
          "inputSchema": {
            "$defs": {
              "entityType": {
                "description": "One of the v1 entity domains. customer, asset, and person are closed Operator decisions, not gaps; reference data is served by get_reference_data.",
                "enum": ["supplier", "location", "organization"]
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["identifiers"]
              },
              {
                "required": ["attributes"]
              }
            ],
            "description": "Input for the paid resolution of identifying attributes to the matching golden-record identity. Mirrors POST /v1/master-data/entities/resolve. At least one of identifiers or attributes must be supplied.",
            "properties": {
              "attributes": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Identifying attribute values keyed by field name, e.g. a name or an address line.",
                "type": "object"
              },
              "entity_type": {
                "$ref": "#/$defs/entityType"
              },
              "identifiers": {
                "description": "Known identifiers of the entity being resolved.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "system": {
                      "description": "Identifier system the value belongs to.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "value": {
                      "description": "The identifier value within its system.",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["system", "value"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["entity_type"],
            "title": "resolve_master_data_entity tool input",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.agentmasterdata/availability": {
              "available": true,
              "price_ids": ["price.resolve.v1"],
              "reason": null
            }
          },
          "digest": "sha256:ff586e2b3d5c156bae773f5c4c06970d7a6f7b3b5a23e23ce7ea16a1bd46e933"
        },
        {
          "name": "search_master_data",
          "title": "Search Agent Master Data",
          "description": "Paid x402 tool. Search trusted public master data for suppliers, locations, or organizations. Returns bounded golden-record summaries with match reasons, confidence, provenance, public-use status, freshness, and data-quality scores. Price ID: price.search.v1. Read masterdata://pricing before payment.",
          "inputSchema": {
            "$defs": {
              "entityType": {
                "description": "One of the v1 entity domains. customer, asset, and person are closed Operator decisions, not gaps; reference data is served by get_reference_data.",
                "enum": ["supplier", "location", "organization"]
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Input for the paid search over golden records. Mirrors POST /v1/master-data/search.",
            "properties": {
              "cursor": {
                "description": "Opaque pagination cursor from a previous response's meta.next_cursor.",
                "minLength": 1,
                "type": "string"
              },
              "entity_type": {
                "$ref": "#/$defs/entityType",
                "description": "Restrict the search to one entity domain. Omitted means all v1 entity domains."
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of results per page.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search over golden records.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_master_data tool input",
            "type": "object"
          },
