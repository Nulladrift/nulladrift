      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "This public paid-data service provides authoritative public supplier, location, organization, and reference data. Discovery, schema, and pricing are free. Data-returning tools use x402 v2 payment with prices published before signing. Start with get_master_data_schema when entity types are unknown and read masterdata://pricing before a paid call. Use resolve_master_data_entity for incomplete identifiers, search_master_data for bounded lists, and get_master_data_golden_record for a known record ID. Inspect public-use status, confidence, provenance, freshness, and quality before acting. All version 1 tools are read-only.",
      "tools": [
        {
          "name": "assess_master_data_quality",
          "title": "Assess Master Data Quality",
          "description": "Paid x402 tool. Assess the completeness, validity, consistency, uniqueness, and freshness of a master-data record or supplied attributes. Returns explainable issues, severity, affected fields, policy rules, and safe remediation guidance without changing data. Price ID: price.quality.v1.",
          "inputSchema": {
            "$defs": {
              "entityType": {
                "description": "One of the v1 entity domains. customer, asset, and person are closed Operator decisions, not gaps; reference data is served by get_reference_data.",
                "enum": ["supplier", "location", "organization"]
              },
              "qualityDimension": {
                "description": "The quality dimensions the serving snapshot scores. Exactly the five the snapshot's quality object carries and the quality_rules registry may name.",
                "enum": ["completeness", "validity", "consistency", "uniqueness", "freshness"]
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Input for the paid quality assessment of ONE stored golden record or ONE submitted attribute set. Mirrors POST /v1/master-data/data-quality/assess. Exactly one of record_id or attributes is supplied, per BUILD.md 8.8; the semantics are implemented in crates/core/src/operations/quality.rs. Submitted attributes are assessed without being written, and only their digest is ever echoed back.",
            "oneOf": [
              {
                "required": ["record_id"]
              },
              {
                "required": ["attributes"]
              }
            ],
            "properties": {
              "attributes": {
                "additionalProperties": {
                  "type": ["string", "number", "integer", "boolean", "null"]
                },
                "description": "Candidate attributes to assess without writing them. Supply this or record_id, never both. No value submitted here is stored, published, or echoed: the answer names the input by its digest alone.",
                "maxProperties": 50,
                "minProperties": 1,
                "type": "object"
              },
              "dimensions": {
                "default": ["completeness", "validity", "consistency", "uniqueness", "freshness"],
                "description": "The quality dimensions to assess. A registered rule scoring a dimension not asked for is absent from the answer's issues, passed_rules, and not_evaluated_rules alike.",
                "items": {
                  "$ref": "#/$defs/qualityDimension"
                },
                "type": "array",
                "uniqueItems": true
              },
              "entity_type": {
                "$ref": "#/$defs/entityType"
              },
              "include_remediation_guidance": {
                "default": true,
                "description": "Whether each reported issue carries remediation guidance.",
                "type": "boolean"
              },
              "record_id": {
                "description": "Existing golden-record ID to assess. Supply this or attributes, never both.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["entity_type"],
            "title": "assess_master_data_quality tool input",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.agentmasterdata/availability": {
              "available": true,
              "price_ids": ["price.quality.v1"],
              "reason": null
            }
          },
          "digest": "sha256:46d95b032b7f9da35cf58bdf9e032cf6d5ba08deb43a71679b440550c829eff1"
        },
        {
          "name": "get_master_data_golden_record",
          "title": "Get Master Data Golden Record",
          "description": "Paid x402 tool. Retrieve one authoritative public golden record by stable record ID. Returns public attributes, identifiers, source-record lineage, survivorship evidence, freshness, relationships summary, and data quality. Price ID: price.record.v1.",
          "inputSchema": {
            "$defs": {
              "entityType": {
                "description": "One of the v1 entity domains. customer, asset, and person are closed Operator decisions, not gaps; reference data is served by get_reference_data.",
                "enum": ["supplier", "location", "organization"]
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Input for the paid fetch of one golden record with provenance and per-value redistribution terms. Mirrors GET /v1/master-data/entities/{entity_type}/{record_id}.",
            "properties": {
              "entity_type": {
                "$ref": "#/$defs/entityType"
              },
              "record_id": {
                "description": "Golden-record identifier within the entity domain.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["entity_type", "record_id"],
            "title": "get_master_data_golden_record tool input",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
