                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: Send my contact details to up to three UK telephone answering providers, chosen by Answering Service Compare, who'll contact me directly. I'll be emailed each firm's name as my details go to it, and can stop any more firms getting them.",
                "type": "boolean"
              }
