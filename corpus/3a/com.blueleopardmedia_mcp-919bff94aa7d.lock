            "properties": {
              "budget": {
                "description": "Monthly ad spend, needed for google-ads, meta-ads and google-meta: ads-under-2k (Under $2,000 a month), ads-2k-10k ($2,000 to $10,000 a month), ads-10k-50k ($10,000 to $50,000 a month), ads-50k-plus ($50,000 or more a month).",
