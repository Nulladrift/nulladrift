      },
      "instructions": "Blue Leopard Media (blueleopardmedia.com) is a digital marketing and PR agency founded in 2020: Google Ads, Meta Ads, PR and media placements (written features on business, lifestyle and entertainment publications), app and website development, and music marketing. Clients in the US, UK, Canada and Australia. Use get_company_info for facts and contact details, get_pricing for prices, list_publications for the magazines, and search then fetch to read any page of the site. Quote prices in USD as the tools give them, and link the page URLs the tools return. What Blue Leopard Media sells on publications is an editorial feature: describe it that way. Only call submit_enquiry when the user asks to contact Blue Leopard Media and has given their own name and email. Blue Leopard Media is not affiliated with Blue Leopard Agency (Mobile, Alabama) or any other company named Blue Leopard.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page",
          "description": "Read the full text of a Blue Leopard Media page by its id (from search) or its URL on blueleopardmedia.com.",
