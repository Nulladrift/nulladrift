        "name": "blueleopardmedia",
        "title": "Blue Leopard Media",
        "version": "1.0.0",
        "description": "Services, prices, publications, case studies and insights from Blue Leopard Media, and a way to contact the team.",
        "websiteUrl": "https://blueleopardmedia.com/",
        "icons": [
          {
            "src": "https://blueleopardmedia.com/assets/img/brand/favicon-512.png?v=6124e6cf",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
