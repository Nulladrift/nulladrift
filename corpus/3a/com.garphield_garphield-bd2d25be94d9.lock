        {
          "name": "garphield_share",
          "title": "Share a Garphield graph",
          "description": "Get links that open a stored graph in the Garphield workbench and in its embeddable view, plus an iframe snippet. Depending on the host the link points at the stored document (anyone with the link can open it, until expiresAt), carries the whole document in the URL (selfContained), or, in the workbench, carries just the view of a built-in sample or generator. Rendering happens in the viewer's browser; a graph without saved positions is laid out when it opens.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "chrome": {
                "description": "Embed controls to show. Omitted: the embed's defaults. -wordmark takes the link off the Garphield wordmark; the mark stays.",
                "items": {
                  "enum": ["toolbar", "minimap", "search", "legend", "legend:open", "legend:closed", "tooltip", "tooltip:hover", "tooltip:select", "time", "time:open", "time:closed", "-wordmark"],
                  "type": "string"
                },
                "type": "array"
              },
              "doc": {
                "description": "Document reference: a stored document id, a file path, or \"current\" in the workbench.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "target": {
                "description": "Which link `url` is: the full workbench (\"app\", default) or the chromeless embed.",
                "enum": ["app", "embed"],
                "type": "string"
              },
              "theme": {
                "description": "Embed theme. Default: the document's theme, if it has one.",
                "enum": ["light", "dark", "seafoam"],
                "type": "string"
              }
            },
            "required": ["doc"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Share a Garphield graph"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://garphield/share-view.html"
            },
            "ui/resourceUri": "ui://garphield/share-view.html"
          },
          "digest": "sha256:5004609db6f88ec24ec6a4783383fc51839261dc1a1bac1890f087be3d1d733e"
        },
        {
          "name": "garphield_style",
          "title": "Style a Garphield graph",
          "description": "Bind data fields or computed algorithms to visual channels, and set the layout mode, how links show direction (arrows), theme, tooltip templates for nodes and links, drawing values (appearance: link width and opacity, node size, curvature, label placement) and structure (Group by rings, the Backbone, or a merge into one node per field value) of a stored graph. Example binding: {\"channel\": \"edgeWidth\", \"field\": \"amount_bn\"}; a bare field name resolves to the field on the channel's target (node or edge). Strict and atomic: if any entry is invalid nothing is written and each problem comes back with a path, the expected values and suggestions. Merges by channel unless replace is true. The result echoes every stored binding. preview: true also returns a small image of the styled graph; it adds a render (10-20 s on the hosted server), so ask for it when you mean to look.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "appearance": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "arrowSize": {
                        "description": "Arrowhead size, for flow links. 0.5 to 3; default 2.",
                        "maximum": 3,
                        "minimum": 0.5,
                        "type": "number"
                      },
                      "curvature": {
                        "description": "How far links bend, from 0 (straight) to 100. 0 to 100; default 0.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "number"
                      },
                      "labelBudget": {
                        "description": "Label density: how many node labels show at once. 0.5 to 10; default 1.",
                        "maximum": 10,
                        "minimum": 0.5,
                        "type": "number"
                      },
                      "labelPlacement": {
                        "description": "Node labels beside the node (default) or centred on it.",
                        "enum": ["beside", "center"],
                        "type": "string"
                      },
                      "linkOpacity": {
                        "description": "Multiplies link opacity; under 1 is fainter. 0.05 to 2; default 1.",
                        "maximum": 2,
                        "minimum": 0.05,
                        "type": "number"
                      },
                      "linkOutline": {
                        "description": "Link outline width in pixels. 0 to 20; default 2.",
                        "maximum": 20,
                        "minimum": 0,
                        "type": "number"
                      },
                      "linkWidth": {
                        "description": "Multiplies every link's drawn width. 0.1 to 8; default 1.",
                        "maximum": 8,
                        "minimum": 0.1,
                        "type": "number"
                      },
                      "nodeGap": {
                        "description": "Pixels kept clear between nodes. 0 to 8; default 2.",
                        "maximum": 8,
                        "minimum": 0,
                        "type": "number"
                      },
                      "nodeSize": {
                        "description": "Multiplies every node's drawn size. 0.5 to 2.5; default 1.",
                        "maximum": 2.5,
                        "minimum": 0.5,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The Style pane's drawing values, e.g. {\"linkWidth\": 4, \"linkOpacity\": 0.7}. Merges with the values already set; null returns them all to the defaults."
              },
              "bindings": {
                "items": {
                  "additionalProperties": false,
                  "description": "One binding: a channel plus exactly one of field, algorithm, set or source; or a channel with remove.",
                  "properties": {
                    "algorithm": {
                      "description": "A computed source id, e.g. degree, pagerank, louvain.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "channel": {
                      "description": "Channel id, e.g. color, size, edgeWidth, edgeColor, hull.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "enabled": {
                      "type": "boolean"
                    },
                    "field": {
                      "description": "A data field by name (\"amount_bn\") or id (\"efield:amount_bn\"); a bare name resolves to the field on the channel's target.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "params": {
                      "additionalProperties": {},
                      "description": "Algorithm params; each must be declared and in range.",
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "remove": {
                      "const": true,
                      "description": "Unbind this channel. Pass only channel with it.",
                      "type": "boolean"
                    },
                    "resultType": {
                      "description": "Override the source's type, e.g. cat to colour a numeric field by value. Required with source.",
                      "enum": ["num", "cat", "set", "trf"],
                      "type": "string"
                    },
                    "scale": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "description": "Marks and labels for a cat or set binding's values.",
                          "properties": {
                            "categories": {
                              "description": "One entry per value, in legend order. Values not listed keep the default palette or shape cycle.",
                              "items": {
                                "additionalProperties": false,
                                "properties": {
                                  "label": {
                                    "description": "What the legend shows for this value, instead of the value.",
                                    "type": "string"
                                  },
                                  "mark": {
                                    "description": "The mark for this value: a CSS colour (#rrggbb, rgb(), hsl()) for color, edgeColor, border, hull and contour; circle, square, triangle or diamond for shape; solid or dashed for edgeStyle; a glyph (text, inline <svg>, or image URL) for glyph.",
                                    "type": "string"
                                  },
                                  "value": {
                                    "anyOf": [
                                      {
                                        "type": "string"
                                      },
                                      {
                                        "type": "number"
                                      },
                                      {
                                        "type": "boolean"
                                      }
                                    ],
                                    "description": "A data value, matched by its text form: 3 and \"3\" are the same value. A set binding's values are true (member) and false."
                                  }
                                },
                                "required": ["value"],
                                "type": "object"
                              },
                              "type": "array"
                            },
                            "missing": {
                              "additionalProperties": false,
                              "description": "The mark and label for items with no value.",
                              "properties": {
                                "label": {
                                  "description": "What the legend shows for this value, instead of the value.",
                                  "type": "string"
                                },
                                "mark": {
                                  "description": "The mark for this value: a CSS colour (#rrggbb, rgb(), hsl()) for color, edgeColor, border, hull and contour; circle, square, triangle or diamond for shape; solid or dashed for edgeStyle; a glyph (text, inline <svg>, or image URL) for glyph.",
                                  "type": "string"
                                }
                              },
                              "type": "object"
                            }
                          },
                          "required": ["categories"],
                          "type": "object"
                        },
                        {
                          "additionalProperties": false,
                          "description": "A pinned domain and range for a num binding.",
                          "properties": {
                            "domain": {
                              "description": "The data values that map to the two ends of the range. Values outside it are clamped.",
                              "prefixItems": [
                                {
                                  "type": "number"
                                },
                                {
                                  "type": "number"
                                }
                              ],
                              "type": "array"
                            },
                            "range": {
                              "anyOf": [
                                {
                                  "prefixItems": [
                                    {
                                      "type": "number"
                                    },
                                    {
                                      "type": "number"
                                    }
                                  ],
                                  "type": "array"
                                },
                                {
                                  "items": {
                                    "type": "string"
                                  },
                                  "minItems": 2,
                                  "type": "array"
                                }
                              ],
                              "description": "Two lengths in px (size: node radius; edgeWidth: link width), or two or more CSS colours as ramp stops (color, edgeColor)."
                            }
                          },
                          "required": ["domain", "range"],
                          "type": "object"
                        }
                      ],
                      "description": "Explicit marks for the binding's values. Omit it to use the defaults."
                    },
                    "set": {
                      "description": "A set id saved in the document.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "source": {
                      "additionalProperties": false,
                      "description": "The stored wire form instead of field/algorithm/set; requires resultType.",
                      "properties": {
                        "id": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "kind": {
                          "enum": ["algorithm", "field", "transform", "set"],
                          "type": "string"
                        },
                        "params": {
                          "additionalProperties": {},
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        "target": {
                          "enum": ["node", "edge"],
                          "type": "string"
                        },
                        "temporal": {
                          "additionalProperties": false,
                          "properties": {
                            "kind": {
                              "const": "instant",
                              "type": "string"
                            }
                          },
                          "required": ["kind"],
                          "type": "object"
                        }
                      },
                      "required": ["id", "kind"],
                      "type": "object"
                    }
                  },
                  "required": ["channel"],
                  "type": "object"
                },
                "type": "array"
              },
              "doc": {
                "description": "Document reference: a stored document id, a file path, or \"current\" in the workbench.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "edgeDirection": {
                "description": "How links show their direction in a directed graph: arrow (arrowheads), tapered (each link narrows toward its target, the workbench default), flow (animated) or line (none).",
                "enum": ["line", "tapered", "arrow", "flow"],
                "type": "string"
              },
              "layout": {
                "description": "Layout the workbench uses on open. Sets config only and computes no positions.",
                "enum": ["force", "levels", "geo"],
                "type": "string"
              },
              "linkTooltipTemplate": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Embed hover card for links: the same Markdown over link attributes, plus {source} and {target} (the end nodes' labels), e.g. \"### {source} to {target}\\n{tasks} tasks\". A line that is only {@markdown field} renders that attribute's own lists and emphasis. Without it links get no card; null clears it."
              },
              "preview": {
                "description": "true returns a 600x400 image of the saved graph, so you can check it for overlapping nodes, tangles and unreadable labels and fix them. A render can take 10-20 s and counts toward the host's image limit; the change is saved even when no preview can be made. Default false.",
                "type": "boolean"
              },
              "replace": {
                "description": "true replaces every binding with this list; false (default) merges by channel.",
                "type": "boolean"
              },
              "structure": {
                "additionalProperties": false,
                "description": "How the workbench and embeds draw the graph on open: Group by, Backbone and merge. Each part changes only what is given. A merge draws with neither groups nor the Backbone: turning it on turns them off, and turning either on turns it off. The network and its positions are unchanged.",
                "properties": {
                  "backbone": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "background": {
                            "description": "How links outside the Backbone draw: auto (default), faded or hidden.",
                            "enum": ["auto", "faded", "hidden"],
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Backbone: only the links that carry the structure. The workbench draws it where it can build one for the graph. null turns it off."
                  },
                  "groups": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "by": {
                            "description": "Levels, outer to inner, each once: node fields and algorithms, e.g. [{\"kind\": \"algorithm\", \"id\": \"connected_components\"}, \"team\"]; [] groups by nested Louvain communities.",
                            "items": {
                              "anyOf": [
                                {
                                  "description": "A node field.",
                                  "minLength": 1,
                                  "type": "string"
                                },
                                {
                                  "additionalProperties": false,
                                  "description": "An algorithm's groups, written as a binding source: connected_components draws one ring per connected component, with isolated nodes in one ring.",
                                  "properties": {
                                    "id": {
                                      "description": "A categorical node algorithm: louvain, leiden, label_propagation, asyn_lpa, greedy_modularity, k_clique, spectral_bisection, kernighan_lin, connected_components.",
                                      "minLength": 1,
                                      "type": "string"
                                    },
                                    "kind": {
                                      "const": "algorithm",
                                      "type": "string"
                                    }
                                  },
                                  "required": ["id", "kind"],
                                  "type": "object"
                                }
                              ]
                            },
                            "maxItems": 4,
                            "type": "array"
                          },
                          "links": {
                            "description": "Links drawn besides those at hovered or selected nodes: none (default), inside (within the innermost group) or all (faded).",
                            "enum": ["none", "inside", "between", "all"],
                            "type": "string"
                          }
                        },
                        "required": ["by"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Group by: nodes drawn as dots in nested rings, one ring per value. null turns it off."
                  },
                  "merge": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "by": {
                            "description": "Node fields; one merged node per value, each field once.",
                            "items": {
                              "minLength": 1,
                              "type": "string"
                            },
                            "maxItems": 4,
                            "minItems": 1,
                            "type": "array"
                          },
                          "combine": {
                            "additionalProperties": {
                              "enum": ["sum", "mean", "min", "max", "area", "first", "mode", "list"],
                              "type": "string"
                            },
                            "description": "Rules per node or link field. Defaults: numbers sum, the size channel's field adds areas, categories keep the most common value, long text is listed.",
                            "propertyNames": {
                              "minLength": 1,
                              "type": "string"
                            },
                            "type": "object"
                          },
                          "label": {
                            "description": "Label template over the merged fields: {field}, {members} (how many nodes merged), and {field by other} (field per value of other, joined \" → \"), e.g. \"{role}  {tasks by side}\".",
                            "maxLength": 400,
                            "type": "string"
                          }
                        },
                        "required": ["by"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Merge: one node per value of the fields, with the links between two merged nodes combined into one per direction. null turns it off."
                  }
                },
                "type": "object"
              },
              "theme": {
                "anyOf": [
                  {
                    "enum": ["light", "dark", "seafoam"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Default theme for embed links (and the saved view, if the document has one). null clears it; a saved view returns to the light default."
              },
              "tooltipTemplate": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Embed tooltip Markdown with {attribute} placeholders, e.g. \"### {label}\\n{role}\". null clears it."
              }
            },
            "required": ["doc"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Style a Garphield graph"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a0932156f9ee614bc02e1bac7c6d13827065daadd5a8ad45260a5b249d8ee597"
        },
        {
          "name": "garphield_validate",
          "title": "Validate a Garphield document",
          "description": "Check a stored document (doc) or a raw .gph document (document) the way the workbench would load it, strictly: the schema, the graph, every binding against the graph's fields and the channel rules, and the filter stack. Returns ok, errors (code, path, message, expected, suggestions) and warnings such as UNLAID (no saved positions).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "doc": {
                "description": "Document reference: a stored document id, a file path, or \"current\" in the workbench.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "document": {
                "additionalProperties": {},
                "description": "A whole .gph document as JSON, for callers who wrote one themselves.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate a Garphield document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
