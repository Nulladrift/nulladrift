{
  "lockfileVersion": 2,
  "subjects": {
    "com.garphield/garphield": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.garphield.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "garphield",
        "title": "Garphield",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Garphield turns data into an interactive network graph. Call garphield_create with nodes and edges, CSV tables, or a url (GitHub files, public Google Sheets and Wikipedia tables only), garphield_inspect to see the fields a binding can name, garphield_style to bind colour, size and edge width, garphield_focus to highlight a path, the top nodes by a measure or a community and fade or hide the rest, then garphield_share for a link to give the user. Pass the doc reference that garphield_create returned to every later call. Documents are stored for 30 days after the last change and anyone with a link can open them.",
      "tools": [
        {
          "name": "garphield_create",
          "title": "Create a Garphield graph",
          "description": "Create a stored graph document from data and return its reference (doc). Pass exactly one of: graph (node-link JSON: nodes [{id, ...attributes}] and edges [{source, target, ...attributes}]), table (CSV text for links, optionally nodes), file (a GEXF, GraphML, GML, node-link JSON, Cytoscape JSON, edge list, Matrix Market, graph6 or .gph text), or url. url fetches from three public sources only, and refuses every other site: a file on GitHub (raw.githubusercontent.com, a github.com/<owner>/<repo>/blob/... page, or a gist's raw link), a Google Sheet shared with anyone with the link or published to the web, or a table on a Wikipedia article (<lang>.wikipedia.org/wiki/<Title>; url.wikitable picks which). For a table, name the link columns with url.source and url.target. The result lists the bindable fields with their ids and types, the names a binding accepts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "file": {
                "additionalProperties": false,
                "description": "A graph file in a format the workbench opens (not DOT).",
                "properties": {
                  "format": {
                    "enum": ["gph", "nodelink", "compactjson", "cyjs", "gexf", "graphml", "gml", "edgelist", "matrixmarket", "graph6", "sparse6", "digraph6"],
                    "type": "string"
                  },
                  "text": {
                    "description": "The file's contents.",
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["format", "text"],
                "type": "object"
              },
              "graph": {
                "additionalProperties": false,
                "description": "Node-link JSON. Nodes named only by a link are created. Ids are stored as strings.",
                "properties": {
                  "directed": {
                    "description": "Default false.",
                    "type": "boolean"
                  },
                  "edges": {
                    "items": {
                      "additionalProperties": {},
                      "description": "A link between two node ids, plus any attributes (weight, ...).",
                      "properties": {
                        "source": {
                          "anyOf": [
                            {
                              "minLength": 1,
                              "type": "string"
                            },
                            {
                              "type": "number"
                            }
                          ]
                        },
                        "target": {
                          "anyOf": [
                            {
                              "minLength": 1,
                              "type": "string"
                            },
                            {
                              "type": "number"
                            }
                          ]
                        }
                      },
                      "required": ["source", "target"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "links": {
                    "description": "NetworkX's older name for edges; pass one or the other.",
                    "items": {
                      "additionalProperties": {},
                      "description": "A link between two node ids, plus any attributes (weight, ...).",
                      "properties": {
                        "source": {
                          "anyOf": [
                            {
                              "minLength": 1,
                              "type": "string"
                            },
                            {
                              "type": "number"
                            }
                          ]
                        },
                        "target": {
                          "anyOf": [
                            {
                              "minLength": 1,
                              "type": "string"
                            },
                            {
                              "type": "number"
                            }
                          ]
                        }
                      },
                      "required": ["source", "target"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "nodes": {
                    "items": {
                      "additionalProperties": {},
                      "description": "A node: its id plus any attributes (label, role, x, y, ...).",
                      "properties": {
                        "id": {
                          "anyOf": [
                            {
                              "minLength": 1,
                              "type": "string"
                            },
                            {
                              "type": "number"
                            }
                          ]
                        }
                      },
                      "required": ["id"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "name": {
                "description": "Title shown in the workbench and in share previews.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "table": {
                "additionalProperties": false,
                "description": "Tables as text. Columns match case-insensitively; numeric cells become numbers and blank cells stay missing.",
                "properties": {
                  "directed": {
                    "description": "Default false.",
                    "type": "boolean"
                  },
                  "edges": {
                    "description": "Links table: CSV, TSV or semicolon text with a header row.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "nodeId": {
                    "description": "Node table column holding the id. Default \"id\".",
                    "minLength": 1,
                    "type": "string"
                  },
                  "nodes": {
                    "description": "Optional node table with a header row; its rows add attributes.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "source": {
                    "description": "Links column holding the source id. Default \"source\".",
                    "minLength": 1,
                    "type": "string"
                  },
                  "target": {
                    "description": "Links column holding the target id. Default \"target\".",
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["edges"],
                "type": "object"
              },
              "url": {
                "additionalProperties": false,
                "description": "Data fetched from a public link. A table's columns match case-insensitively; when source or target is missing, the error lists the columns.",
                "properties": {
                  "directed": {
                    "description": "Default false.",
                    "type": "boolean"
                  },
                  "href": {
                    "description": "An https link to a GitHub file (raw.githubusercontent.com, github.com/<owner>/<repo>/blob/..., gist.githubusercontent.com), a Google Sheet shared publicly or published (docs.google.com/spreadsheets/d/...; #gid= picks the tab), or a Wikipedia article (<lang>.wikipedia.org/wiki/<Title>). Other sites are refused.",
                    "maxLength": 2048,
                    "minLength": 1,
                    "type": "string"
                  },
                  "source": {
                    "description": "For a table (CSV/TSV file, sheet, Wikipedia table): the column holding the source id. Default \"source\".",
                    "minLength": 1,
                    "type": "string"
                  },
                  "target": {
                    "description": "For a table: the column holding the target id. Default \"target\".",
                    "minLength": 1,
                    "type": "string"
                  },
                  "wikitable": {
                    "description": "Wikipedia only: which wikitable on the page, counting from 1 in page order. Default 1.",
                    "maximum": 1000,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["href"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a Garphield graph"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:94a77ba2967be4c86bc224518d89184edc02dc17ace6ddd040f74ce48a3eb934"
        },
        {
          "name": "garphield_export",
          "title": "Export a Garphield graph",
          "description": "Export a stored graph as a .gph project (with its view config and positions), as node-link JSON, GEXF, GraphML or GML, or as a PNG where the host can render. Text formats come back inline up to the host's result limit; gph also reports where the stored file is, when the host has a location. The export is a frozen copy: later style or layout calls do not change it. Where the host stores images, a png export is also kept as the document's preview image.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "doc": {
                "description": "Document reference: a stored document id, a file path, or \"current\" in the workbench.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "description": "gph is the full Garphield project; nodeLink, gexf, graphml and gml carry the graph and its attributes; png is an image where the host can render one.",
                "enum": ["gph", "nodeLink", "gexf", "graphml", "gml", "png"],
                "type": "string"
              },
              "height": {
                "description": "png only.",
                "maximum": 4096,
                "minimum": 64,
                "type": "integer"
              },
              "inline": {
                "description": "gph only: false returns just the stored location and size, without the text. Default true.",
                "type": "boolean"
              },
              "width": {
                "description": "png only.",
                "maximum": 4096,
                "minimum": 64,
                "type": "integer"
              }
            },
            "required": ["doc", "format"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Export a Garphield graph"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02fb2a342655b2003b5bfac67915e67ca28d72c5adff9116522184f248be59e1"
        },
        {
          "name": "garphield_focus",
          "title": "Highlight or focus part of a Garphield graph",
          "description": "Save named sets of nodes and focus the view on them; the app, share links, embeds and PNG exports all show the result. A set comes from exactly one of: nodes (ids), edges ([source, target] pairs, kept as their endpoints), path (a shortest path from one node to another), top (the k highest or lowest by a field or algorithm such as degree), or match (a range, values, or one node's value of a field or algorithm, e.g. a louvain community). filters fade (default) or hide everything outside a set ({\"set\": \"path\"}) or outside a range or values of a field or algorithm. mark rings a set's nodes. clear empties the filters, or with \"all\" every set too. Example, highlight a path: {\"sets\": [{\"id\": \"route\", \"path\": {\"from\": \"a\", \"to\": \"e\"}}], \"filters\": [{\"set\": \"route\"}]}. Show only the top 20 by degree: {\"sets\": [{\"id\": \"hubs\", \"top\": {\"algorithm\": \"degree\", \"k\": 20}}], \"filters\": [{\"set\": \"hubs\", \"mode\": \"hide\"}]}. Strict and atomic: if anything is invalid nothing is written, and each problem comes back with a path and suggestions (unknown node ids suggest near ids and nodes with that label).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "clear": {
                "description": "Applied first. \"filters\" empties the filter stack; \"all\" also deletes every set and every binding that reads one.",
                "enum": ["filters", "all"],
                "type": "string"
              },
              "doc": {
                "description": "Document reference: a stored document id, a file path, or \"current\" in the workbench.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "filters": {
                "description": "Merged into the filter stack by id.",
                "items": {
                  "additionalProperties": false,
                  "description": "Keep a set, or keep what one criterion on a field or algorithm selects; fade or hide the rest.",
                  "properties": {
                    "algorithm": {
                      "description": "A computed source id, e.g. degree, pagerank, betweenness, louvain.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "field": {
                      "description": "A data field by name (\"role\") or id (\"field:role\", \"efield:amount_bn\"); a bare name resolves to the node field first.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "id": {
                      "description": "Filter entry id. Default \"focus-<set id>\" or \"focus-<source id>\"; an existing id is replaced.",
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "mode": {
                      "description": "fade (default) dims what the filter drops; hide removes it from the drawing.",
                      "enum": ["fade", "hide"],
                      "type": "string"
                    },
                    "node": {
                      "description": "Keep the value this node has, e.g. {\"algorithm\": \"louvain\", \"node\": \"valjean\"} for that node's community.",
                      "maxLength": 1024,
                      "minLength": 1,
                      "type": "string"
                    },
                    "params": {
                      "additionalProperties": {},
                      "description": "Algorithm params; each must be declared and in range.",
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "range": {
                      "additionalProperties": false,
                      "description": "Numeric sources: keep values from min to max inclusive. An omitted bound is the source's own minimum or maximum.",
                      "properties": {
                        "max": {
                          "type": "number"
                        },
                        "min": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "remove": {
                      "const": true,
                      "description": "Delete the filter entry with this id. Pass only id with it.",
                      "type": "boolean"
                    },
                    "set": {
                      "description": "Keep the members of this set (saved or defined in this call).",
                      "minLength": 1,
                      "type": "string"
                    },
                    "values": {
                      "description": "Categorical sources (or a numeric field read as categories): keep these values. Community ids are numbers from 0.",
                      "items": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "number"
                          },
                          {
                            "type": "boolean"
                          }
                        ]
                      },
                      "maxItems": 500,
                      "minItems": 1,
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "mark": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Ring this set's nodes (the border channel bound to the set). null removes a set ring."
              },
              "sets": {
                "items": {
                  "additionalProperties": false,
                  "description": "Create or replace a named set from exactly one of nodes, edges, path, top or match; or remove one.",
                  "properties": {
                    "edges": {
                      "description": "The endpoints of these links, each a [source, target] pair of node ids.",
                      "items": {
                        "prefixItems": [
                          {
                            "maxLength": 1024,
                            "minLength": 1,
                            "type": "string"
                          },
                          {
                            "maxLength": 1024,
                            "minLength": 1,
                            "type": "string"
                          }
                        ],
                        "type": "array"
                      },
                      "maxItems": 10000,
                      "minItems": 1,
                      "type": "array"
                    },
                    "id": {
                      "description": "The set's id (letters, digits, _ . : -). An existing id is replaced.",
                      "pattern": "^[\\w.:-]{1,64}$",
                      "type": "string"
                    },
                    "label": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "match": {
                      "additionalProperties": false,
                      "description": "The nodes whose value meets one criterion: a range, values, or the value of a node.",
                      "properties": {
                        "algorithm": {
                          "description": "A computed source id, e.g. degree, pagerank, betweenness, louvain.",
                          "minLength": 1,
                          "type": "string"
                        },
                        "field": {
                          "description": "A data field by name (\"role\") or id (\"field:role\", \"efield:amount_bn\"); a bare name resolves to the node field first.",
                          "minLength": 1,
                          "type": "string"
                        },
                        "node": {
                          "description": "Keep the value this node has, e.g. {\"algorithm\": \"louvain\", \"node\": \"valjean\"} for that node's community.",
                          "maxLength": 1024,
                          "minLength": 1,
                          "type": "string"
                        },
                        "params": {
                          "additionalProperties": {},
                          "description": "Algorithm params; each must be declared and in range.",
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        "range": {
                          "additionalProperties": false,
                          "description": "Numeric sources: keep values from min to max inclusive. An omitted bound is the source's own minimum or maximum.",
                          "properties": {
                            "max": {
                              "type": "number"
                            },
                            "min": {
                              "type": "number"
                            }
                          },
                          "type": "object"
                        },
                        "values": {
                          "description": "Categorical sources (or a numeric field read as categories): keep these values. Community ids are numbers from 0.",
                          "items": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "number"
                              },
                              {
                                "type": "boolean"
                              }
                            ]
                          },
                          "maxItems": 500,
                          "minItems": 1,
                          "type": "array"
                        }
                      },
                      "type": "object"
                    },
                    "nodes": {
                      "description": "These node ids.",
                      "items": {
                        "maxLength": 1024,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 10000,
                      "minItems": 1,
                      "type": "array"
                    },
                    "note": {
                      "maxLength": 4000,
                      "type": "string"
                    },
                    "path": {
                      "additionalProperties": false,
                      "description": "The nodes on a shortest path, following link direction on a directed graph.",
                      "properties": {
                        "from": {
                          "maxLength": 1024,
                          "minLength": 1,
                          "type": "string"
                        },
                        "to": {
                          "maxLength": 1024,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["from", "to"],
                      "type": "object"
                    },
                    "remove": {
                      "const": true,
                      "description": "Delete the set. Pass only id with it.",
                      "type": "boolean"
                    },
                    "top": {
                      "additionalProperties": false,
                      "description": "The k nodes (or the endpoints of the k links, for an edge source) with the highest or lowest values.",
                      "properties": {
                        "algorithm": {
                          "description": "A computed source id, e.g. degree, pagerank, betweenness, louvain.",
                          "minLength": 1,
                          "type": "string"
                        },
                        "field": {
                          "description": "A data field by name (\"role\") or id (\"field:role\", \"efield:amount_bn\"); a bare name resolves to the node field first.",
                          "minLength": 1,
                          "type": "string"
                        },
                        "k": {
                          "description": "How many to keep.",
                          "maximum": 9007199254740991,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "order": {
                          "description": "highest (default) or lowest values first.",
                          "enum": ["highest", "lowest"],
                          "type": "string"
                        },
                        "params": {
                          "additionalProperties": {},
                          "description": "Algorithm params; each must be declared and in range.",
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        }
                      },
                      "required": ["k"],
                      "type": "object"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["doc"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Highlight or focus part of a Garphield graph"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5ecaddbbe3cfe197a2d989ef78c3fea2e2507fc387747ec54004f87f8fb5e73c"
        },
        {
          "name": "garphield_inspect",
          "title": "Inspect a Garphield graph",
          "description": "Describe a stored graph: size, density, connected components, whether it has saved positions, its data fields (ids to bind, type num or cat, missing counts, ranges or example values), the channels and the types each accepts, the computed algorithms, the current view config (bindings, filters and saved sets), and a quality grade of the saved layout. The field ids it lists are the names a binding accepts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "doc": {
                "description": "Document reference: a stored document id, a file path, or \"current\" in the workbench.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "include": {
                "description": "Sections to return. Default [\"fields\", \"channels\", \"config\"]. \"algorithms\" lists computed sources (degree, louvain, ...) with their params; \"scales\" gives what each binding draws (every value's mark, label and count, or the numeric domain and range), in the form a binding's scale takes; \"quality\" grades the saved positions.",
                "items": {
                  "enum": ["fields", "algorithms", "channels", "config", "scales", "quality"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["doc"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Inspect a Garphield graph"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:403301ca86cc9c4b0f70567aeabca65ce0ad5ede1c626f451dacd56eee8b8105"
        },
        {
          "name": "garphield_layout",
          "title": "Lay out a Garphield graph",
          "description": "Compute and save node positions for a stored graph with the workbench's own layout recipes, and grade the result with its quality gate. Optional: a graph without positions is laid out by the browser when it opens. Use this to bake positions (for a gallery file or a stable share) or to get a quality grade. Reports which engine ran. Large graphs over the host's budget return LAYOUT_TOO_LARGE; clear: true removes saved positions. preview: true also returns a small image of the result, to check for overlaps, tangles and unreadable labels against the grade's findings; it adds a render (10-20 s on the hosted server), so ask for it when you mean to look.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "description": "Width over height of the frame to fit. Default 1.6.",
                "maximum": 4,
                "minimum": 0.25,
                "type": "number"
              },
              "clear": {
                "const": true,
                "description": "Remove saved positions instead, so the browser lays the graph out when it opens. Pass only doc with it.",
                "type": "boolean"
              },
              "doc": {
                "description": "Document reference: a stored document id, a file path, or \"current\" in the workbench.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "levels": {
                "additionalProperties": false,
                "description": "levels mode only.",
                "properties": {
                  "levelAttribute": {
                    "description": "A numeric node field that orders the levels.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "roots": {
                    "description": "Node ids for the top level.",
                    "items": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "mode": {
                "description": "force (production Blend, or ForceAtlas2 for large graphs), levels (layered), or geo (the browser places nodes by their coordinate fields). Default: the document's layout, else force.",
                "enum": ["force", "levels", "geo"],
                "type": "string"
              },
              "preview": {
                "description": "true returns a 600x400 image of the saved graph, so you can check it for overlapping nodes, tangles and unreadable labels and fix them. A render can take 10-20 s and counts toward the host's image limit; the change is saved even when no preview can be made. Default false.",
                "type": "boolean"
              }
            },
            "required": ["doc"],
            "type": "object"
          },
