        },
        {
          "name": "flatio_search_listings",
          "title": "Search Flatio listings",
          "description": "Use this when someone wants to rent a furnished flat, house or room for a month or longer and names a city or country, with or without dates, budget, size or pets. It returns up to 10 listings per page with the monthly price and a link to the listing on flatio.com, where the guest books. It takes exact dates or a flexible move-in such as \"sometime in March\", a budget, a size and pets as filters. Not for nightly or holiday stays, and not for buying property. Give the guest each listing's url exactly as returned, with all its query parameters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bedrooms_min": {
                "description": "Fewest bedrooms, e.g. 2, the same as the bedrooms filter on flatio.com. A listing without a separate bedroom, such as a studio, counts as 1 bedroom.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "currency": {
                "description": "Currency of max_monthly_price and of every price in the result, e.g. \"EUR\". Defaults to the currency of the response language's Flatio site.",
                "enum": ["CZK", "EUR", "GBP", "HUF", "PLN", "THB", "USD"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor of the previous page, sent with the same filters.",
                "maxLength": 100,
                "type": "string"
              },
              "guests": {
                "description": "People moving in, e.g. 2.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Language of titles, texts and links, e.g. \"en\", \"cs\", \"de\", \"es\", \"pt\". Defaults to the language the client reports, else English.",
                "maxLength": 35,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Listings per page, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City or country name in any language, e.g. \"Lisbon\", \"Praha\", \"Portugal\". A neighbourhood or an address is not accepted.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "max_monthly_price": {
                "description": "Highest monthly rent in the given currency, e.g. 1500.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "months": {
                "description": "Stay length in months, e.g. 6. With move_in the move-out is that many calendar months later, and with move_in_latest every listing keeps the nights between move_in and that move-out, see move_in_latest. Without move_in the listings must allow a stay that long. Not together with move_out.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "move_in": {
                "description": "Move-in date as YYYY-MM-DD, e.g. \"2027-02-01\", or the earliest move-in when move_in_latest is sent. Without move_out or months the search looks for a stay of 30 days (29 nights) from move_in, so listings that do not take a 30-day stay are left out; send move_out or months whenever the guest knows the length. Leave out when the dates are not known.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "move_in_latest": {
                "description": "Latest move-in date as YYYY-MM-DD, only when the guest's move-in is flexible, e.g. \"2027-03-31\" with move_in \"2027-03-01\" for \"sometime in March\". Each listing then gets its earliest move-in between move_in and move_in_latest, and its stay keeps the length asked in nights: as many as from move_in to move_out, or with months as many as from move_in to that many calendar months later. With months a later move-in can move out up to 3 days off the same day of the month: 3 months from 2027-01-01 are 90 nights, and a move-in on 2027-02-01 moves out on 2027-05-02. Give the guest the move_in and move_out each listing returns. With move_out_latest the stay length is not kept. The window is at most 92 days, both dates included. Needs move_in and either move_out or months.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "move_out": {
                "description": "Move-out date as YYYY-MM-DD, after move_in, e.g. \"2027-08-01\", or the earliest move-out when move_out_latest is sent. Needs move_in.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "move_out_latest": {
                "description": "Latest move-out date as YYYY-MM-DD, only when the guest's move-out is flexible, e.g. \"2027-05-20\" with move_out \"2027-05-15\" for \"moving out between 15 and 20 May\", or the same date as move_out for a fixed move-out with a flexible move-in. Each listing then gets a stay that moves in between move_in and move_in_latest, or on move_in without it, and moves out between move_out and move_out_latest, so the stay length can differ between listings. Each listing gets the longest stay its calendar allows inside both windows, and a listing that does not take a stay that long is left out rather than given a shorter one; to price a shorter stay of one listing, send its dates to flatio_get_listing. The window is at most 92 days, both dates included. Needs move_out.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "pets": {
                "description": "true when a pet moves in.",
                "type": "boolean"
              },
              "property_type": {
                "description": "apartment is a whole flat, house a whole house, room a private room in a shared flat.",
                "enum": ["apartment", "house", "room"],
                "type": "string"
              },
              "sort": {
                "default": "recommended",
                "description": "Order of the listings, the same as on flatio.com.",
                "enum": ["recommended", "cheapest", "newest", "best_rated"],
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "listings": {
                "items": {
                  "properties": {
                    "bedrooms": {
                      "description": "Bedrooms, the same count bedrooms_min filters on, so a studio has 1. Null for a room.",
                      "type": ["integer", "null"]
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "currency": {
                      "type": "string"
                    },
                    "district": {
                      "type": ["string", "null"]
                    },
                    "floor_size_m2": {
                      "type": ["number", "null"]
                    },
                    "guests": {
                      "type": "integer"
                    },
                    "id": {
                      "type": "integer"
                    },
                    "monthly_price": {
                      "type": "integer"
                    },
                    "move_in": {
                      "description": "Move-in of the stay found for this listing, null when the search had no move_in. When move_out is set too, send both to flatio_get_listing to price that stay.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": ["string", "null"]
                    },
                    "move_out": {
                      "description": "Move-out of the stay found for this listing, null unless the search had move_in with move_out or months.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": ["string", "null"]
                    },
                    "photo_url": {
                      "type": ["string", "null"]
                    },
                    "property_type": {
                      "enum": ["apartment", "house", "room"],
                      "type": "string"
                    },
                    "rating": {
                      "type": ["number", "null"]
                    },
                    "review_count": {
                      "type": "integer"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["currency", "guests", "id", "monthly_price", "property_type", "review_count", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": ["string", "null"]
              },
              "next_cursor": {
                "type": ["string", "null"]
              },
              "total": {
                "description": "All listings matching the filters, of which at most 100 can be paged.",
                "type": "integer"
              }
            },
            "required": ["listings", "message", "next_cursor", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2453a8dbdfed174136443f297e18dca821ca6cbad3815be15efffa3cdf9dbbd7"
        },
        {
          "name": "search",
          "title": "Search Flatio for deep research",
          "description": "Use this for deep research that works with a search and fetch pair. It takes one query, either a sentence naming a Flatio city or country or a JSON object with the guest's filters, and returns up to 10 listings as id, title and URL. A query that names no Flatio city or country gives an empty list. Give the guest each listing's url exactly as returned, with all its query parameters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A sentence naming a city or country, e.g. \"furnished flat in Lisbon for three months\", or a JSON object of the guest's filters where only location is required, e.g. {\"location\": \"Lisbon\", \"move_in\": \"2027-02-01\", \"move_in_latest\": \"2027-02-14\", \"move_out\": \"2027-04-30\", \"move_out_latest\": \"2027-05-07\", \"max_monthly_price\": 1500, \"currency\": \"EUR\", \"property_type\": \"apartment\", \"bedrooms_min\": 2, \"guests\": 2, \"pets\": true, \"sort\": \"cheapest\"}. Send move_in_latest only when the move-in is flexible, and each listing then moves in between move_in and move_in_latest and, without move_out_latest, stays as many nights as asked. Send move_out_latest when the move-out is flexible, or the same date as move_out for a fixed move-out with a flexible move-in, and each listing then moves out between move_out and move_out_latest, with the longest stay that fits both windows. \"months\": 3 gives the stay length instead of move_out, with or without move_in. move_in without move_out or months looks for a stay of 30 days (29 nights). property_type is apartment, house or room. sort is recommended, cheapest, newest or best_rated. currency is CZK, EUR, GBP, HUF, PLN, THB or USD.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d970497c362e4c747e8bee3a6e58809200d9014ed539729bfc8670d0e6e0b51"
        }
      ],
      "digest": "sha256:eec30578b189ebb8dfcaf16ae8bcaff413bca47fd20a9f70764a2aceb15b77e9"
    }
  }
