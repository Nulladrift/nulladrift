      "serverInfo": {
        "name": "flatio-search",
        "title": "Flatio",
        "version": "0.1.0",
        "websiteUrl": "https://www.flatio.com/ai"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Give the guest every listing link exactly as the url field returns it, with all its query parameters. Never shorten a link or build one yourself. When a call had dates, the from and to parameters open the listing with those dates selected, so the page shows the price for those dates. A search with move_in and a stay length, move_out or months, gives each listing the move_in and move_out of the stay found for it, and its link opens that stay. With move_in_latest the move-in can differ between listings, and every stay keeps the length asked, counted in nights. With move_out_latest the move-out can differ too, and so can the stay length. A search with move_in alone gives each listing that move_in and no move_out, and its link carries only from. A link without from and to opens the listing without dates and may show a different price. When you quote a price, give the url from the call that returned that price. None of the utm_source, utm_medium and utm_content parameters names the guest: utm_content is a random value that marks the call. They are how Flatio counts the guests that assistant answers bring, so it can tell whether this server helps them.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch one Flatio listing for deep research",
          "description": "Use this for deep research after search. It takes one id that search returned and gives that listing's facts as text, with the monthly rent and its URL on flatio.com. flatio_get_listing returns the same listing as fields and prices exact dates. Give the guest each listing's url exactly as returned, with all its query parameters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An id from the results of search, e.g. \"95507\".",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "properties": {
                  "city": {
                    "type": ["string", "null"]
                  },
                  "currency": {
                    "type": "string"
                  },
                  "monthly_rent": {
                    "type": ["integer", "null"]
                  },
                  "property_type": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3724e90f02f442842f1271c84ab7a56f085e68e79cd3ec2f70029d4b43e32bb"
        },
        {
          "name": "flatio_get_listing",
          "title": "Get one Flatio listing",
          "description": "Use this when someone asks about one listing whose id flatio_search_listings returned: its description, amenities, house rules, stay limits, availability, rating and price. With move_in and move_out it prices exactly those dates, broken into rent, service fee and deposit, and without them it gives the monthly rent. Not for finding listings. Give the guest each listing's url exactly as returned, with all its query parameters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency of every price in the result, e.g. \"EUR\". Send the currency of the search the id came from. Defaults to the currency of the response language's Flatio site.",
                "enum": ["CZK", "EUR", "GBP", "HUF", "PLN", "THB", "USD"],
                "type": "string"
              },
              "id": {
                "description": "Listing id from flatio_search_listings, e.g. 95507.",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Language of titles, texts and links, e.g. \"en\", \"cs\", \"de\", \"es\", \"pt\". Defaults to the language the client reports, else English.",
                "maxLength": 35,
                "type": "string"
              },
              "move_in": {
                "description": "Move-in date as YYYY-MM-DD, e.g. \"2027-02-01\". Send together with move_out.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "move_out": {
                "description": "Move-out date as YYYY-MM-DD, after move_in, e.g. \"2027-08-01\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amenities": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "availability": {
                "enum": ["available", "limited", "unavailable"],
                "type": "string"
              },
              "available_from": {
                "type": ["string", "null"]
              },
              "bathrooms": {
                "type": ["integer", "null"]
              },
              "bedrooms": {
                "type": ["integer", "null"]
              },
              "category": {
                "type": ["string", "null"]
              },
              "city": {
                "type": ["string", "null"]
              },
              "description": {
                "type": "string"
              },
              "district": {
                "type": ["string", "null"]
              },
              "floor_size_m2": {
                "type": ["integer", "null"]
              },
              "guests": {
                "type": "integer"
              },
              "house_rules": {
                "properties": {
                  "children": {
                    "type": "boolean"
                  },
                  "parties": {
                    "type": "boolean"
                  },
                  "pets": {
                    "enum": ["yes", "on_request", "no"],
                    "type": "string"
                  },
                  "smoking": {
                    "type": "boolean"
                  }
                },
                "required": ["children", "parties", "pets", "smoking"],
                "type": "object"
              },
              "id": {
                "type": "integer"
              },
              "max_stay_days": {
                "type": ["integer", "null"]
              },
              "min_stay_days": {
                "type": "integer"
              },
              "photos": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "price": {
                "properties": {
                  "currency": {
                    "type": "string"
                  },
                  "monthly_rent": {
                    "type": ["integer", "null"]
                  },
                  "stay": {
                    "properties": {
                      "days": {
                        "type": "integer"
                      },
                      "deposit": {
                        "type": ["integer", "null"]
                      },
                      "move_in": {
                        "type": "string"
                      },
                      "move_out": {
                        "type": "string"
                      },
                      "rent": {
                        "type": "integer"
                      },
                      "service_fee": {
                        "type": "integer"
                      },
                      "total": {
                        "description": "Rent and service fee, without the refundable deposit.",
                        "type": "integer"
                      }
                    },
                    "type": ["object", "null"]
                  }
                },
                "required": ["currency", "monthly_rent", "stay"],
                "type": "object"
              },
              "property_type": {
                "enum": ["apartment", "house", "room"],
                "type": "string"
              },
              "rating": {
                "type": ["number", "null"]
              },
              "review_count": {
                "type": "integer"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["amenities", "availability", "description", "guests", "house_rules", "id", "min_stay_days", "photos", "price", "property_type", "review_count", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
