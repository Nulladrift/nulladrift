{
  "lockfileVersion": 2,
  "subjects": {
    "com.flatio/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.flatio.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "flatio-search",
        "title": "Flatio",
        "version": "0.1.0",
        "websiteUrl": "https://www.flatio.com/ai"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Give the guest every listing link exactly as the url field returns it, with all its query parameters. Never shorten a link or build one yourself. When a call had exact dates, the from and to parameters open the listing with those dates selected, so the page shows the price for those dates. Without them the page opens without dates and may show a different price. When you quote a price, give the url from the call that returned that price. None of the utm_source, utm_medium and utm_content parameters names the guest: utm_content is a random value that marks the call. They are how Flatio counts the guests that assistant answers bring, so it can tell whether this server helps them.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch one Flatio listing for deep research",
          "description": "Use this for deep research after search. It takes one id that search returned and gives that listing's facts as text, with the monthly rent and its URL on flatio.com. flatio_get_listing returns the same listing as fields and prices exact dates. Give the guest each listing's url exactly as returned, with all its query parameters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An id from the results of search, e.g. \"95507\".",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "properties": {
                  "city": {
                    "type": ["string", "null"]
                  },
                  "currency": {
                    "type": "string"
                  },
                  "monthly_rent": {
                    "type": ["integer", "null"]
                  },
                  "property_type": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3724e90f02f442842f1271c84ab7a56f085e68e79cd3ec2f70029d4b43e32bb"
        },
        {
          "name": "flatio_get_listing",
          "title": "Get one Flatio listing",
          "description": "Use this when someone asks about one listing whose id flatio_search_listings returned: its description, amenities, house rules, stay limits, availability, rating and price. With move_in and move_out it prices exactly those dates, broken into rent, service fee and deposit, and without them it gives the monthly rent. Not for finding listings. Give the guest each listing's url exactly as returned, with all its query parameters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency of every price in the result, e.g. \"EUR\". Send the currency of the search the id came from. Defaults to the currency of the response language's Flatio site.",
                "enum": ["CZK", "EUR", "GBP", "HUF", "PLN", "THB", "USD"],
                "type": "string"
              },
              "id": {
                "description": "Listing id from flatio_search_listings, e.g. 95507.",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Language of titles, texts and links, e.g. \"en\", \"cs\", \"de\", \"es\", \"pt\". Defaults to the language the client reports, else English.",
                "maxLength": 35,
                "type": "string"
              },
              "move_in": {
                "description": "Move-in date as YYYY-MM-DD, e.g. \"2027-02-01\". Send together with move_out.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "move_out": {
                "description": "Move-out date as YYYY-MM-DD, after move_in, e.g. \"2027-08-01\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amenities": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "availability": {
                "enum": ["available", "limited", "unavailable"],
                "type": "string"
              },
              "available_from": {
                "type": ["string", "null"]
              },
              "bathrooms": {
                "type": ["integer", "null"]
              },
              "bedrooms": {
                "type": ["integer", "null"]
              },
              "category": {
                "type": ["string", "null"]
              },
              "city": {
                "type": ["string", "null"]
              },
              "description": {
                "type": "string"
              },
              "district": {
                "type": ["string", "null"]
              },
              "floor_size_m2": {
                "type": ["integer", "null"]
              },
              "guests": {
                "type": "integer"
              },
              "house_rules": {
                "properties": {
                  "children": {
                    "type": "boolean"
                  },
                  "parties": {
                    "type": "boolean"
                  },
                  "pets": {
                    "enum": ["yes", "on_request", "no"],
                    "type": "string"
                  },
                  "smoking": {
                    "type": "boolean"
                  }
                },
                "required": ["children", "parties", "pets", "smoking"],
                "type": "object"
              },
              "id": {
                "type": "integer"
              },
              "max_stay_days": {
                "type": ["integer", "null"]
              },
              "min_stay_days": {
                "type": "integer"
              },
              "photos": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "price": {
                "properties": {
                  "currency": {
                    "type": "string"
                  },
                  "monthly_rent": {
                    "type": ["integer", "null"]
                  },
                  "stay": {
                    "properties": {
                      "days": {
                        "type": "integer"
                      },
                      "deposit": {
                        "type": ["integer", "null"]
                      },
                      "move_in": {
                        "type": "string"
                      },
                      "move_out": {
                        "type": "string"
                      },
                      "rent": {
                        "type": "integer"
                      },
                      "service_fee": {
                        "type": "integer"
                      },
                      "total": {
                        "description": "Rent and service fee, without the refundable deposit.",
                        "type": "integer"
                      }
                    },
                    "type": ["object", "null"]
                  }
                },
                "required": ["currency", "monthly_rent", "stay"],
                "type": "object"
              },
              "property_type": {
                "enum": ["apartment", "house", "room"],
                "type": "string"
              },
              "rating": {
                "type": ["number", "null"]
              },
              "review_count": {
                "type": "integer"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["amenities", "availability", "description", "guests", "house_rules", "id", "min_stay_days", "photos", "price", "property_type", "review_count", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:39dd6fb719f96f259d2880afa4c16a4a520f2ad92a5d4d1ceb4104e7279029d4"
        },
        {
          "name": "flatio_search_listings",
          "title": "Search Flatio listings",
          "description": "Use this when someone wants to rent a furnished flat, house or room for a month or longer and names a city or country, with or without dates, budget, size or pets. It returns up to 10 listings per page with the monthly price and a link to the listing on flatio.com, where the guest books. It takes dates, a budget, a size and pets as filters. Not for nightly or holiday stays, and not for buying property. Give the guest each listing's url exactly as returned, with all its query parameters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bedrooms_min": {
                "description": "Fewest rooms with a bed, e.g. 2, the same as the bedrooms filter on flatio.com. A living room with a sofa bed counts, so a listing can show fewer bedrooms.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "currency": {
                "description": "Currency of max_monthly_price and of every price in the result, e.g. \"EUR\". Defaults to the currency of the response language's Flatio site.",
                "enum": ["CZK", "EUR", "GBP", "HUF", "PLN", "THB", "USD"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor of the previous page, sent with the same filters.",
                "maxLength": 100,
                "type": "string"
              },
              "guests": {
                "description": "People moving in, e.g. 2.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Language of titles, texts and links, e.g. \"en\", \"cs\", \"de\", \"es\", \"pt\". Defaults to the language the client reports, else English.",
                "maxLength": 35,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Listings per page, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City or country name in any language, e.g. \"Lisbon\", \"Praha\", \"Portugal\". A neighbourhood or an address is not accepted.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "max_monthly_price": {
                "description": "Highest monthly rent in the given currency, e.g. 1500.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "months": {
                "description": "Stay length in months when there are no dates, e.g. 6. Not together with move_in.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "move_in": {
                "description": "Move-in date as YYYY-MM-DD, e.g. \"2027-02-01\". Leave out when the dates are not known.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "move_out": {
                "description": "Move-out date as YYYY-MM-DD, after move_in, e.g. \"2027-08-01\". Needs move_in.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "pets": {
                "description": "true when a pet moves in.",
                "type": "boolean"
              },
              "property_type": {
                "description": "apartment is a whole flat, house a whole house, room a private room in a shared flat.",
                "enum": ["apartment", "house", "room"],
                "type": "string"
              },
              "sort": {
                "default": "recommended",
                "description": "Order of the listings, the same as on flatio.com.",
                "enum": ["recommended", "cheapest", "newest", "best_rated"],
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "listings": {
                "items": {
                  "properties": {
                    "bedrooms": {
                      "type": ["integer", "null"]
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "currency": {
                      "type": "string"
                    },
                    "district": {
                      "type": ["string", "null"]
                    },
                    "floor_size_m2": {
                      "type": ["number", "null"]
                    },
                    "guests": {
                      "type": "integer"
                    },
                    "id": {
                      "type": "integer"
                    },
                    "monthly_price": {
                      "type": "integer"
                    },
                    "photo_url": {
                      "type": ["string", "null"]
                    },
                    "property_type": {
                      "enum": ["apartment", "house", "room"],
                      "type": "string"
                    },
                    "rating": {
                      "type": ["number", "null"]
                    },
                    "review_count": {
                      "type": "integer"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["currency", "guests", "id", "monthly_price", "property_type", "review_count", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": ["string", "null"]
              },
              "next_cursor": {
                "type": ["string", "null"]
              },
              "total": {
                "description": "All listings matching the filters, of which at most 100 can be paged.",
                "type": "integer"
              }
            },
            "required": ["listings", "message", "next_cursor", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d2a15c21828f3c5b60319a5c773abcef8011e481de2bd39fecb9d42f02d5e9a4"
        },
        {
          "name": "search",
          "title": "Search Flatio for deep research",
          "description": "Use this for deep research that works with a search and fetch pair. It takes one query, either a sentence naming a Flatio city or country or a JSON object with the guest's filters, and returns up to 10 listings as id, title and URL. A query that names no Flatio city or country gives an empty list. Give the guest each listing's url exactly as returned, with all its query parameters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A sentence naming a city or country, e.g. \"furnished flat in Lisbon for three months\", or a JSON object of the guest's filters where only location is required, e.g. {\"location\": \"Lisbon\", \"move_in\": \"2027-02-01\", \"move_out\": \"2027-04-30\", \"max_monthly_price\": 1500, \"currency\": \"EUR\", \"property_type\": \"apartment\", \"bedrooms_min\": 2, \"guests\": 2, \"pets\": true, \"sort\": \"cheapest\"}. Without dates, \"months\": 3 gives the stay length instead. property_type is apartment, house or room. sort is recommended, cheapest, newest or best_rated. currency is CZK, EUR, GBP, HUF, PLN, THB or USD.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a948d94895288039c608f02ecc6c1c090fbfd58ae6c3943898850c50c94ed0f9"
        }
      ],
      "digest": "sha256:bb7fc9e60c4f804751abec45c347bdb7a57aba2b4b7cf90625e59818ceac7f88"
    }
  }
}
