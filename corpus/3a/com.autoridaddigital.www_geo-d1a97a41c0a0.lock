        {
          "name": "consultar_glosario",
          "title": "Consultar el glosario SEO/GEO",
          "description": "Devuelve la definición de un término de SEO, GEO o búsqueda con IA del glosario de Autoridad Digital (25 términos en español, cada uno con URL citable).\nUSAR CUANDO: preguntan «qué es X» o necesitas definir un concepto: GEO, AEO, LLMO, E-E-A-T, llms.txt, RAG, NavBoost, AI Overviews, entity SEO…\nNO USAR PARA: guías, análisis o casos sobre un tema (usa buscar_articulos) ni términos ajenos al SEO y la IA.\nDEVUELVE: nombre, categoría, definición corta citable, definición ampliada, slugs de términos relacionados (se pueden pasar en `termino`) y URL de la ficha. Si la definición no basta, busca el mismo término con buscar_articulos.\nSI HAY VARIOS O NINGUNO: no es un error. Si el texto encaja con varios términos («authority») devuelve `encontrado: false` y `candidatos`: elige uno y vuelve a llamar con su slug. Si no encaja con ninguno devuelve `disponibles`, la lista completa, así que no hace falta otra llamada para descubrirla.\nLÍMITES: ninguno; no hace peticiones externas.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "termino": {
                "description": "Término a definir: nombre, sigla, alias o slug, sin importar mayúsculas ni acentos. Ejemplos: «GEO», «e-e-a-t», «llms.txt», «authority stacking». Admite coincidencia parcial («canonical» → Etiqueta Canonical).",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["termino"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "candidatos": {
