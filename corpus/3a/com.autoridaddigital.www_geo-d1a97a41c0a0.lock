                            "description": "Impuesto que hay que sumar al importe (IVA, IGV)",
                            "type": "string"
                          },
                          "moneda": {
                            "description": "Código ISO 4217",
                            "type": "string"
                          },
                          "pais": {
                            "description": "País o región al que aplica la tarifa. Uno de: España, Unión Europea y resto del mundo; Argentina; Colombia; Perú; Uruguay",
                            "type": "string"
                          },
                          "valor": {
                            "description": "El mismo importe como número, para calcular",
                            "type": "number"
                          }
                        },
                        "required": ["importe", "impuesto_no_incluido", "moneda", "pais", "valor"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["a_medida", "descripcion", "id", "incluye", "nombre", "permanencia_meses", "precios"],
                  "type": "object"
                },
                "type": "array"
