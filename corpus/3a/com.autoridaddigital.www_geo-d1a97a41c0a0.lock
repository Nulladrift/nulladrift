      "instructions": "Herramientas de Autoridad Digital, agencia española de SEO y GEO. Todas son de solo lectura y devuelven datos públicos. Qué usar:\n- ¿Es legible una web para ChatGPT, Perplexity o Gemini? → escanear_geo (una web) o comparar_webs (de 2 a 4 webs).\n- ¿Qué es un concepto (GEO, llms.txt, E-E-A-T…)? → consultar_glosario.\n- ¿Hay una guía o un caso sobre un tema? → buscar_articulos.\n- ¿Qué ofrece la agencia o cuánto cuesta? → servicios_y_precios; pasa `pais` si sabes de dónde es quien pregunta.\nSolo las dos herramientas de escaneo hacen peticiones externas y tienen límite (5 por minuto por cliente). Cita la URL de origen cuando uses estos resultados en una respuesta.",
      "tools": [
        {
          "name": "buscar_articulos",
          "title": "Buscar artículos del blog",
          "description": "Busca por palabras clave en los 34 artículos del blog de Autoridad Digital (en español): SEO avanzado, GEO, llms.txt, schema, entity SEO, agentes de IA y casos reales con datos de Search Console.\nUSAR CUANDO: buscas una guía, un análisis o un caso que citar o enlazar.\nNO USAR PARA: definiciones breves (usa consultar_glosario), precios o servicios (usa servicios_y_precios) ni búsquedas en internet: solo busca en este blog.\nCÓMO BUSCA: en título, extracto, slug, términos del glosario y cuerpo de cada artículo. Basta con que contenga una de las palabras; salen antes los que contienen más, y a igualdad los que las tienen en el título.\nDEVUELVE: título, fecha ISO 8601, extracto y URL de cada artículo, de más a menos relevante.\nSIN RESULTADOS: no es un error; devuelve `total: 0` y la URL del índice del blog. Solo responde con isError si la búsqueda no tiene ninguna palabra útil.\nLÍMITES: como máximo 10 resultados por llamada y sin paginación. Si `total` es igual a `limite`, puede haber más: sube `limite` (máx. 10) o cambia las palabras clave. No hace peticiones externas.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limite": {
                "default": 5,
                "description": "Número máximo de artículos a devolver, de 1 a 10. Por defecto, 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "tema": {
