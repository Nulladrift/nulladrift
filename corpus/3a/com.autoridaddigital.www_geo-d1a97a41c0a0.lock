        {
          "name": "servicios_y_precios",
          "title": "Servicios, precios y criterios de encaje",
          "description": "Catálogo oficial de Autoridad Digital (agencia de SEO y GEO en España y LATAM), con los mismos datos que publica la web: planes y precios por país, servicios y su modalidad, para quién no es cada uno y contacto.\nUSAR CUANDO: preguntan qué ofrece la agencia, cuánto cuesta o si encaja con un caso.\nNO USAR PARA: definir conceptos (usa consultar_glosario), buscar contenido del blog (usa buscar_articulos) ni analizar una web (usa escanear_geo, gratuito).\nCÓMO LLAMARLA: sin parámetros, catálogo completo con las tarifas de todos los países; con `servicio`, además el detalle de uno (entregables y para quién no es, en los datos; KPIs y FAQ, solo en el texto); con `pais`, solo la tarifa de ese país. Se pueden combinar. Si vas a dar un precio y no sabes de dónde es quien pregunta, pregúntaselo y pasa su `pais`: citar la tarifa de otro país es un error.\nDEVUELVE: texto listo para citar y datos estructurados (`planes[]` con lo que incluyen y `precios[]` con importe publicado y valor numérico, `servicios[]` con su modalidad, `contacto`).\nAVISO: solo los planes tienen precio publicado; son mensuales, sin impuestos y no son un presupuesto cerrado. Los servicios no tienen precio propio: no les asignes el importe de un plan. Qué cubre cada plan está en `planes[].incluye`; para saber qué plan encaja con un servicio, o el precio de un encargo «proyecto» o «diagnóstico» (p. ej. auditoria-geo), remite al contacto que incluye la respuesta.\nERRORES: un `pais` sin tarifa propia no es error: devuelve la tarifa general en euros. Un `servicio` fuera de la lista lo rechaza la validación.\nLÍMITES: ninguno; no hace peticiones externas.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "pais": {
                "description": "Código ISO 3166-1 alfa-2 del país de quien pregunta, en mayúsculas o minúsculas. Tienen tarifa propia: AR (ARS), CO (COP), PE (PEN), UY (UYU). Cualquier otro código (España, resto de la UE, México, EE. UU.…) devuelve la tarifa general en euros. Si se omite, devuelve todas las tarifas (respuesta más larga).",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "servicio": {
                "description": "Slug del servicio del que quieres el detalle. Opciones: agencia-geo-aio (Agencia GEO / AIO, retainer); seo-dominacion-nicho (Dominación SEO de Nicho, retainer); founder-authority (Founder Authority, retainer); pr-digital (PR Digital, retainer); authority-stacking (Authority Stacking, retainer); auditoria-geo (Auditoría GEO, diagnóstico); medicion-visibilidad-ia (Medición de visibilidad en IA, proyecto). Si se omite, devuelve el catálogo completo.",
                "enum": ["agencia-geo-aio", "seo-dominacion-nicho", "founder-authority", "pr-digital", "authority-stacking", "auditoria-geo", "medicion-visibilidad-ia"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "contacto": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "url": {
                    "description": "Formulario de contacto: el sitio para pedir un presupuesto",
                    "type": "string"
                  }
                },
                "required": ["email", "url"],
                "type": "object"
              },
              "planes": {
                "description": "Planes mensuales de la agencia",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "a_medida": {
                      "description": "true si no tiene precio publicado: se presupuesta por contacto",
                      "type": "boolean"
                    },
                    "descripcion": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "incluye": {
                      "description": "Lo que cubre el plan, tal como lo publica la web",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "nombre": {
                      "type": "string"
                    },
                    "permanencia_meses": {
                      "description": "Permanencia mínima en meses; null si no tiene",
                      "type": ["number", "null"]
                    },
                    "precios": {
                      "description": "Una entrada por tarifa (solo la del país pedido si se pasó `pais`); vacío si es a medida",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "importe": {
                            "description": "Importe mensual tal como se publica, con símbolo: «690 €», «S/ 1.290»",
                            "type": "string"
                          },
