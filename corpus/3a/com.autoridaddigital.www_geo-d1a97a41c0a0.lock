                    "description": "Una de: Concepto SEO; Técnica avanzada; Metodología propia; Concepto GEO; Señal de Google; Métrica técnica",
                    "type": "string"
                  },
                  "definicion": {
                    "description": "Párrafo ampliado de 2 a 4 frases",
