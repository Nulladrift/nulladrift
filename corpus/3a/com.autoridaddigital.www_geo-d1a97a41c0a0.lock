                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "nombre": {
                      "type": "string"
                    },
                    "slug": {
                      "description": "Identificador que se puede pasar tal cual en `termino`",
                      "type": "string"
                    }
                  },
                  "required": ["nombre", "slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "disponibles": {
                "description": "Solo si no encaja con ninguno: la lista completa del glosario",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "nombre": {
                      "type": "string"
                    },
                    "slug": {
                      "description": "Identificador que se puede pasar tal cual en `termino`",
                      "type": "string"
                    }
                  },
                  "required": ["nombre", "slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "encontrado": {
                "description": "true si se encontró un único término; entonces llega `termino`",
                "type": "boolean"
