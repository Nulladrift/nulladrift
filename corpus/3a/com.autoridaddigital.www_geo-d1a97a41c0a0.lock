        {
          "name": "comparar_webs",
          "title": "Comparar la legibilidad para IA de varias webs",
          "description": "Compara de 2 a 4 webs en una llamada y las ordena por su preparación técnica para los motores de IA (la misma puntuación que escanear_geo), p. ej. una marca frente a sus competidores. No mide si la IA las cita de verdad.\nUSAR CUANDO: piden situar una web frente a otras o saber cuál está mejor preparada.\nNO USAR PARA: una sola web (usa escanear_geo; aquí el mínimo son 2) ni más de 4 (divide en varias llamadas, ver LÍMITES).\nDEVUELVE: ranking por puntuación (0-100, nota, bots de IA bloqueados, llms.txt) y los problemas de cada web. El texto resume los problemas; las correcciones van en los datos estructurados (`resultados[].problemas[].solucion`).\nLÍMITES: comparte cupo con escanear_geo (5 escaneos/min por IP; 10/h por dominio, sumando todos los usuarios; 500/día en todo el servicio). Cada web sin resultado de las últimas 24 h gasta 1 escaneo aunque falle: 4 webs nuevas consumen 4 de los 5 del minuto, así que para más de 4 espera 1 minuto entre llamadas. Se analizan en el orden dado, una tras otra, con un tope total de 48 s: pon primero la web del usuario. Los duplicados se analizan una sola vez.\nERRORES: una web que supera el cupo, falla o no da tiempo va a `fallidos` con su motivo y el resto se compara igual; isError solo si no se pudo analizar ninguna. Para reintentar una web de `fallidos`, usa escanear_geo solo con ella y sigue sus ERRORES.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dominios": {
                "description": "De 2 a 4 webs a comparar, p. ej. [«miempresa.com», «competidor1.es», «competidor2.com»]. Admite dominios o URLs: un dominio compara la portada; una URL, esa página.",
