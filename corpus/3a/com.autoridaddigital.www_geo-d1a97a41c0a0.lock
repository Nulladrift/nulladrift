        {
          "name": "escanear_geo",
          "title": "Escanear legibilidad para IA (GEO)",
          "description": "Diagnóstico técnico automático de una página para motores de IA (ChatGPT, Claude, Perplexity, Gemini, AI Overviews): revisa la página (título, metadatos, indexación, JSON-LD, texto citable), en la raíz de su dominio robots.txt (15 rastreadores), llms.txt y sitemap, pide la página como GPTBot, ClaudeBot y PerplexityBot para detectar bloqueos del CDN, y revisa una muestra de hasta 4 páginas más del mismo sitio.\nUSAR CUANDO: preguntan si una web concreta es visible o legible para la IA, o si tiene bien su robots.txt, llms.txt, sitemap o datos estructurados.\nNO USAR PARA: varias webs (comparar_webs, en una llamada); explicar qué es llms.txt u otro concepto (consultar_glosario); posiciones en Google o tráfico; saber si la IA ya cita una marca (mide preparación, no citas); precio o alcance de la «Auditoría GEO» de pago (servicios_y_precios, servicio=\"auditoria-geo\").\nDEVUELVE: puntuación 0-100, nota A-D, puntuación por categoría, las 3 correcciones prioritarias con la puntuación estimada tras aplicarlas, el resultado de la prueba de acceso real y cada problema con su gravedad y su corrección. Metodología: https://www.autoridaddigital.com/escaner-geo/metodologia\nLÍMITES: 5 escaneos/min por IP; 10/h por dominio, sumando todos los usuarios; 500/día en todo el servicio. Tarda hasta 45 s. Caché de 24 h: una página ya analizada se devuelve sin gastar cupo ni volver a rastrearla, y no se puede forzar un análisis nuevo; si `desde_cache` es true y el usuario acaba de cambiar su web, avísale de que el resultado puede no reflejarlo.\nERRORES (isError con el motivo): URL no válida, privada o con puerto distinto de 80/443 → corrige la URL; dominio que no resuelve → no reintentes; web que no contesta en 10 s → reintenta una vez como mucho; límite por minuto → espera 1 minuto; límite por dominio o diario → no reintentes y avisa al usuario.\nAVISO: no garantiza que la IA cite la web ni sustituye una auditoría completa.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "Página pública a analizar. Un dominio («ejemplo.com») analiza su portada por https; una URL completa («https://ejemplo.com/precios») analiza esa página concreta. Sin credenciales, IPs privadas ni puertos distintos de 80/443.",
                "maxLength": 500,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "acceso_real": {
                "description": "Prueba pidiendo la página con el user-agent de cada bot: detecta bloqueos del CDN/WAF que robots.txt no muestra",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bot": {
                      "type": "string"
                    },
                    "resultado": {
                      "description": "same = el servidor lo trata como a un visitante; blocked = 4xx o desafío del CDN; degraded = mucho menos contenido; inconclusive = la prueba no se completó",
                      "enum": ["same", "blocked", "degraded", "inconclusive"],
                      "type": "string"
                    }
                  },
                  "required": ["bot", "resultado"],
                  "type": "object"
                },
                "type": "array"
              },
              "analizado_en": {
                "description": "Fecha y hora del análisis real, ISO 8601 en UTC",
                "type": "string"
              },
              "bots_bloqueados": {
                "description": "User-agents que robots.txt bloquea (Googlebot, Bingbot, GPTBot, ClaudeBot…); vacío si ninguno",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "categorias": {
                "description": "Desglose de la puntuación por área: puntos obtenidos sobre el máximo de cada una",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "maximo": {
                      "type": "number"
                    },
                    "nombre": {
                      "description": "Una de: Acceso para motores de IA; Datos estructurados; Metadatos e indexación; Contenido citable; Resto del sitio",
                      "type": "string"
                    },
                    "puntuacion": {
                      "type": "number"
                    }
                  },
                  "required": ["maximo", "nombre", "puntuacion"],
                  "type": "object"
                },
                "type": "array"
