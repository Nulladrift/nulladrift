      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Klarbon opens, checks and converts European e-invoices and bank statements. Call list_formats first to see the format ids. Give files as base64 or as a public https address. open_invoice and list_formats are free; check_invoice is free within the account's daily checks; convert_invoice and convert_bank_statement spend credits from the Klarbon account behind the API key, as each description states. Files are processed for the request, without a document archive.",
      "tools": [
        {
          "name": "check_invoice",
          "title": "Check an e-invoice",
          "description": "Validates an e-invoice against EN 16931 and its national rules (XRechnung, Peppol BIS and others), with each finding explained in plain words and how to fix it. With country, also applies that country's national rules on top of EN 16931 (France: the CTC rules), only when asked; Klarbon never infers the country. Free within the account's daily checks; needs an API key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Also apply this country's national rules on top of EN 16931 (FR: the French CTC rules). Only when you give it; Klarbon never infers a country from the file.",
                "enum": ["FR"],
                "type": "string"
              },
              "file_base64": {
                "description": "The file's bytes as base64. Give this or file_url.",
                "maxLength": 27962031,
                "type": "string"
              },
              "file_url": {
                "description": "A public https address of the file. Private and local addresses are refused.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "filename": {
                "description": "The file's name, which helps recognise its format.",
                "maxLength": 200,
                "type": "string"
              },
              "ruleset": {
                "description": "A rule set id, or auto (the default) to pick it from the file. Leave it out when you give country.",
                "enum": ["auto", "en16931-ubl", "en16931-cii", "en16931-ubl-creditnote", "xrechnung-3.0-ubl", "xrechnung-3.0-cii", "peppol-bis3-invoice", "peppol-bis3-creditnote", "facturx-1.07-minimum", "facturx-1.07-basicwl", "facturx-1.07-basic", "facturx-1.07-en16931", "facturx-1.07-extended", "zugferd-2.3-minimum", "zugferd-2.3-basicwl", "zugferd-2.3-basic", "zugferd-2.3-en16931", "zugferd-2.3-extended", "facturx-1.09-minimum", "facturx-1.09-basicwl", "facturx-1.09-basic", "facturx-1.09-en16931", "facturx-1.09-extended", "zugferd-2.5-minimum", "zugferd-2.5-basicwl", "zugferd-2.5-basic", "zugferd-2.5-en16931", "zugferd-2.5-extended", "nlcius", "nlcius-cii", "fr-ctc", "fr-ctc-cii"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check an e-invoice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:272742d30ec1095e04b2750375ad8cefa1d542c19497c104428460f645056bf3"
        },
        {
          "name": "check_vat_numbers",
          "title": "Check EU VAT numbers in VIES",
          "description": "Checks up to 25 EU VAT numbers (and Northern Ireland's XI numbers) in the European Commission's VIES service: valid or not valid now, with the registered name and address where the member state gives them. Each number's format and published check digits are checked first, and one that fails is not sent. unavailable means the member state did not answer, never that the number is invalid. Free: without an API key the anonymous daily limit applies, with one 500 numbers a day. Nothing about the numbers is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "The country of numbers given without their prefix.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "numbers": {
                "description": "VAT numbers as written, with or without the country prefix (EL for Greece, XI for Northern Ireland).",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "requester": {
                "description": "Your own VAT number, so VIES returns a consultation number for each answer.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["numbers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check EU VAT numbers in VIES"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fd0695ebe2c2cf187862536036adbe568fb67cdcd4fc46f5e04c9d678e8a2812"
        },
        {
          "name": "convert_bank_statement",
          "title": "Convert a bank statement",
          "description": "Converts a bank statement file (CAMT.053, MT940, CODA, Norma 43, CFONB 120, BAI2, OFX, QIF and more) to another format such as CAMT.053, MT940, CSV or Excel, and checks that the balances reconcile. When the file leaves something open, such as the date order or the opening balance, the answer is a need: call again with the same file, the answer and the resume token. Costs 1 call per started 500 transactions from the account's API balance, or credits once the API balance is empty, charged only on success. A PDF statement or scan read automatically (beta, a draft to check) costs 5 calls per started 10 pages from the API balance, or 1 credit per started 10 pages once it cannot cover that. Needs an API key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "account": {
                "description": "The answer to an account need, for a file with several accounts: the chosen account's position in the need's accounts list.",
                "pattern": "^\\d{1,5}$",
                "type": "string"
              },
              "century": {
                "description": "The answer to a century need: the century of the file's two-digit years.",
                "enum": ["1900", "2000"],
                "type": "string"
              },
              "currency": {
                "description": "The answer to a currency need: an ISO 4217 code, for a file that states no currency.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "date_order": {
                "description": "The answer to a dateOrder need: how the file writes its dates.",
                "enum": ["dmy", "mdy", "ymd"],
                "type": "string"
              },
              "decimal_separator": {
                "description": "The answer to a decimalSeparator need: the decimal separator of the file's amounts.",
                "enum": [".", ","],
                "type": "string"
              },
              "file_base64": {
                "description": "The file's bytes as base64. Give this or file_url.",
                "maxLength": 27962031,
                "type": "string"
              },
              "file_url": {
                "description": "A public https address of the file. Private and local addresses are refused.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "filename": {
                "description": "The file's name, which helps recognise its format.",
                "maxLength": 200,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Any unique string. Calling again with the same key and arguments within 24 hours never charges again.",
                "maxLength": 255,
                "minLength": 1,
                "pattern": "^[\\x21-\\x7e]+$",
                "type": "string"
              },
              "opening_balance": {
                "description": "The answer to an openingBalance need: the opening balance the file does not print, as a decimal string.",
                "pattern": "^-?(?:0|[1-9]\\d{0,17})(?:\\.\\d{1,8})?$",
                "type": "string"
              },
              "resume": {
                "description": "The resume token from the last need answer.",
                "maxLength": 16777216,
                "type": "string"
              },
              "statement_number": {
                "description": "The statement number MT940 and CODA carry.",
                "pattern": "^\\d{1,5}$",
                "type": "string"
              },
              "target": {
                "description": "A bank format id, such as camt-053, mt940, bank-csv or xlsx.",
                "pattern": "^[a-z0-9][a-z0-9.-]{0,63}$",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Convert a bank statement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f98675957d81e4acded0372a81fc88ccaee0d91acb197924469626f13da1f2d6"
        },
        {
          "name": "convert_invoice",
          "title": "Convert an e-invoice",
          "description": "Converts an e-invoice to another format (for example UBL to XRechnung, or CII to a Factur-X PDF) and validates the result; only a valid file is returned. Costs 1 call per invoice from the account's API balance, or 1 credit once the API balance is empty, charged only on success. Needs an API key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "file_base64": {
                "description": "The file's bytes as base64. Give this or file_url.",
                "maxLength": 27962031,
                "type": "string"
              },
              "file_url": {
                "description": "A public https address of the file. Private and local addresses are refused.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "filename": {
                "description": "The file's name, which helps recognise its format.",
                "maxLength": 200,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Any unique string. Calling again with the same key and arguments within 24 hours never charges again.",
                "maxLength": 255,
                "minLength": 1,
                "pattern": "^[\\x21-\\x7e]+$",
                "type": "string"
              },
              "label_locale": {
                "description": "The language of a rendered PDF's labels.",
                "enum": ["en", "de", "fr", "nl", "it", "es", "pl", "pt", "ro", "sk"],
                "type": "string"
              },
              "profile": {
                "description": "The profile, for formats that have several.",
                "pattern": "^[a-z0-9][a-z0-9.-]{0,63}$",
                "type": "string"
              },
              "target": {
                "description": "A format id that list_formats shows with convertTo, such as xrechnung or peppol-bis-billing.",
                "pattern": "^[a-z0-9][a-z0-9.-]{0,63}$",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Convert an e-invoice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
