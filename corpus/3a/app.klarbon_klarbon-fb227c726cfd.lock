              },
              "filename": {
                "description": "The file's name, which helps recognise its format.",
                "maxLength": 200,
                "type": "string"
              },
              "html": {
                "description": "Also return the invoice as complete, print-ready HTML.",
                "type": "boolean"
              },
              "locale": {
                "description": "The language of the HTML's labels.",
                "enum": ["en", "de", "fr", "nl", "it", "es", "pl", "pt", "ro", "sk"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
