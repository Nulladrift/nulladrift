        },
        {
          "name": "open_invoice",
          "title": "Open an e-invoice",
          "description": "Reads an e-invoice (XRechnung, ZUGFeRD, Factur-X, Peppol BIS, UBL, CII and more) into structured data: parties, lines, totals, VAT, payment details. Optionally returns print-ready HTML. Free; without an API key the anonymous daily limit applies. Files are processed for the request, without a document archive.",
          "inputSchema": {
