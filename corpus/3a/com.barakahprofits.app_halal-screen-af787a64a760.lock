      "serverInfo": {
        "name": "barakah-halal-screen",
        "title": "Barakah Profits Halal Stock Screen",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use check_halal_stock when the user asks whether a stock is halal or Sharia-compliant. Always pass on the verdict history and the links.",
      "tools": [
        {
          "name": "check_halal_stock",
          "title": "Check if a stock is halal",
          "description": "Screen a listed company for Sharia compliance (AAOIFI-style): business activity, interest-bearing debt and cash under 30% of market cap, and interest income under 5% of revenue. Also returns the dates its verdict changed, from Barakah Profits' public verdict ledger. Covers US (NASDAQ, NYSE), Australia (ASX), Malaysia (Bursa) and Singapore (SGX). Pass a ticker (NVDA, CSL.AX, 1155.KL, D05.SI) or a company name.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "Ticker or company name, e.g. AAPL, CSL.AX, Maybank",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bcf97a915e1b2eda4f80f735ad2069a6687d0b0f0a503fc9d8880c2a4293e135"
        },
        {
          "name": "recent_halal_verdict_changes",
          "title": "Recent halal verdict changes",
          "description": "Stocks whose halal screening verdict recently flipped (cleared or broke the screen), with dates. A dated public record most screeners don't show.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
