{
  "lockfileVersion": 2,
  "subjects": {
    "com.craftingstepbystep/tutorials": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.craftingstepbystep.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "craftingstepbystep-mcp",
        "version": "0.1.0",
        "description": "Crafting Step by Step craft tutorials exposed as MCP tools. Search, browse, and fetch structured step-by-step craft tutorials with creator credits, tools, materials, project time and cost, and step prose."
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_tutorial",
          "description": "Fetch the full machine-readable rendition of a tutorial by slug: title, TL;DR, numbered steps (with text, imageUrl, tips, and YouTube videoTimestampSeconds for deep-linking), tools/materials, tags, related tutorial slugs, creator credit, recipe (with nutrition + cuisine when applicable), license, and canonicalUrl. Use this after search_tutorials to fetch step details.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Tutorial slug (e.g. 'how-to-fix-a-leaky-faucet')",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69a78618a8da8364903ba676fe295fe54b2b89290f20b7ed2a88affd1e2ee80c"
        },
        {
          "name": "list_categories",
          "description": "List all tutorial categories with a published tutorial. Returns slug, name, short description, and count of published tutorials per category.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7cc9e6d66339ea9fa73c7a14d550ded3c8faf50eb024e31879bb54dcb8d5ed4c"
        },
        {
          "name": "list_recent_tutorials",
          "description": "List the most recently published tutorials, newest first. Use this to discover what's new on the site or to surface fresh content for aggregator / 'what's new this week' agent loops. Tenant-aware.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 14,
                "description": "Lookback window in days (default 14, max 90).",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9871c777fad7855d9b126c5a1c7640dfad2c9fd53cf7ccf80d4e9f9f7d6bda08"
        },
        {
          "name": "list_tutorials_by_category",
          "description": "Browse tutorials within a specific category, ranked by view count then publish date. Use this when a user wants to explore a topic area rather than search.",
          "inputSchema": {
            "properties": {
              "categorySlug": {
                "description": "e.g. 'cooking', 'home-improvement', 'crafts'",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["categorySlug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b7f1a5a1308529749929759def54900dbdb3c80f928924681bf54b4fdead5068"
        },
        {
          "name": "request_tutorial",
          "description": "Submit a request for a tutorial we don't yet have. Call this when search_tutorials returned no good match for what the user actually wants. The request enters our content-demand queue, which the daily content batch reviews and prioritizes. Optionally include an email for notification when the tutorial ships.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Brief context about the requester (e.g. 'beginner crocheter', 'first-time homeowner', 'gluten-free baker'). Helps shape the tutorial when we ship it.",
                "maxLength": 200,
                "type": "string"
              },
              "notifyEmail": {
                "description": "Optional email to notify when the tutorial ships. Pure opt-in.",
                "maxLength": 254,
                "type": "string"
              },
              "originalQuery": {
                "description": "The exact user query that came up empty in search_tutorials. Useful for matching keyword demand.",
                "maxLength": 500,
                "type": "string"
              },
              "topic": {
                "description": "What the user wants to learn how to do (e.g. 'how to get pesto stains out of a white shirt')",
                "maxLength": 200,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7bc767653d070918cb92420b903dc885c43325f30677be15d201239c5feee235"
        },
        {
          "name": "search_tutorials",
          "description": "Search the Show Me Step by Step tutorial corpus by free-text query. Searches across tutorial titles, descriptions, and step content. Returns slim summaries with TL;DRs and canonical URLs. Tenant-aware. Optional filters narrow by category, difficulty, or maximum duration.",
          "inputSchema": {
            "properties": {
              "categorySlug": {
                "description": "Optional category to restrict the search to (e.g. 'cooking', 'crochet'). Use list_categories to see available slugs.",
                "type": "string"
              },
              "difficulty": {
                "description": "Optional difficulty filter.",
                "enum": ["easy", "medium", "advanced"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "maxDurationMinutes": {
                "description": "Optional ceiling on tutorial total duration. Useful for 'quick recipes' / 'under 10 min' queries.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search query (>= 2 chars)",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:384e0a56fd9759c6e6f3cb32d9366f4ab1dcee8ff70f27d1d1b3804b95ba173c"
        }
      ],
      "prompts": [
        {
          "name": "explain_step",
          "description": "Fetch a tutorial and explain a single step in more depth than the source provides — what to watch for, common mistakes, and the underlying technique. Useful when a step's prose is too terse.",
          "arguments": [
            {
              "name": "slug",
              "description": "Tutorial slug (e.g. 'how-to-knit-for-absolute-beginners').",
              "required": true
            },
            {
              "name": "stepNumber",
              "description": "Which step to explain (1-indexed integer as a string, e.g. '3').",
              "required": true
            },
            {
              "name": "audience",
              "description": "Who is this explanation for? Suggested values: 'beginner', 'kid', 'expert', 'esl-learner'. Defaults to 'beginner'.",
              "required": false
            }
          ],
          "digest": "sha256:042c6d4ae09e2ec184e7206eee26a6e12e77f40fb8b14cd2bfa3af65bc9faa58"
        },
        {
          "name": "submit_tutorial_request",
          "description": "Submit a request for a tutorial we don't yet have. Use this when search_tutorials returned no good match for what the user actually wants. The request enters our content-demand queue, which the daily content batch reviews and prioritizes.",
          "arguments": [
            {
              "name": "topic",
              "description": "What the user wants to learn how to do, in imperative form (e.g. 'how to get pesto stains out of a white shirt'). 5-200 chars.",
              "required": true
            },
            {
              "name": "originalQuery",
              "description": "The exact user query that came up empty in search_tutorials. Optional but helps us match keyword demand.",
              "required": false
            },
            {
              "name": "context",
              "description": "Brief context about the requester (e.g. 'beginner crocheter', 'first-time homeowner', 'gluten-free baker'). Optional but helps us shape the eventual tutorial.",
              "required": false
            }
          ],
          "digest": "sha256:32fddb2629d8b0b2bbdb45b48ed040f813e5a300e8ac49a72c38f8cf2926c7fe"
        },
        {
          "name": "summarize_tutorial",
          "description": "Fetch a tutorial by slug and summarize it for a target audience. Useful for accessibility (kids, ESL learners) or quick overviews before reading the full guide.",
          "arguments": [
            {
              "name": "slug",
              "description": "Tutorial slug (e.g. 'how-to-make-pesto'). Use search_tutorials if you don't know the slug yet.",
              "required": true
            },
            {
              "name": "audience",
              "description": "Who is this for? Suggested values: 'beginner', 'kid' (ages 6-10), 'expert', 'esl-learner'. Defaults to 'beginner'.",
              "required": false
            }
          ],
          "digest": "sha256:5913821dd24b1208611271d2b39f5fa22bc5de39068ef35d75ff4219c018969f"
        }
      ],
      "digest": "sha256:9db0979b5e2d0ab1d75d9825caaec119461f30db6311f194a753c4ba05708134"
    }
  }
}
