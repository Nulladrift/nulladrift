        "name": "plantguide",
        "title": "Plant Guide: Dubai gardening research",
        "version": "1.1.0",
        "description": "Research for Dubai gardens and homes: what to plant this month, a rated plant library (heat, salt, drought, shade, ease), indoor plants for Dubai homes (light, pets, air conditioning, where to buy), garden styles, practical guides, kitchen-garden advice and Garden Care price estimates. Read-only, no sign-in.",
