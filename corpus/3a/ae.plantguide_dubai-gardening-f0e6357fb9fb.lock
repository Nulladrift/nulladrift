        {
          "name": "search_plants",
          "title": "Search the Dubai plant library",
          "description": "Search and filter the library of plants rated for Dubai's heat, salt, drought and shade: by name (English, botanical, Arabic or a local name such as Hindi or Tagalog), category, sun, water need, minimum tolerance ratings, use, garden style or planting month. For houseplants and questions like \"low light, pet friendly plants for a Dubai apartment\", filter by light (low, medium, bright-indirect, direct-sun), petSafe, room and size: those four filters return only plants with an indoor profile (light, tolerance of dry air and air conditioning, pet safety, size, rooms). Returns short profiles with links; call get_plant for the full one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only these plant categories (any of them): tree, palm, shrub, climber, groundcover, flower, grass, succulent, herb, edible, indoor, fruit-tree, vegetable, ornamental-grass, aquatic.",
                "items": {
                  "enum": ["tree", "palm", "shrub", "climber", "groundcover", "flower", "grass", "succulent", "herb", "edible", "indoor", "fruit-tree", "vegetable", "ornamental-grass", "aquatic"],
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "group": {
                "description": "Only this group: vegetables-herbs, flowers, trees-palms, shrubs-climbers, lawn-grasses, indoor or water.",
                "enum": ["flowers", "trees-palms", "shrubs-climbers", "vegetables-herbs", "lawn-grasses", "indoor", "water"],
                "type": "string"
              },
              "light": {
                "description": "Houseplants that grow well in this indoor light: low (a dim room or corner), medium (a bright room, no direct sun), bright-indirect (by a window, out of direct sun) or direct-sun (a sunny window). Using light, petSafe, room or size limits results to plants with an indoor profile.",
                "enum": ["low", "medium", "bright-indirect", "direct-sun"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Results per page, 1–50 (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minDrought": {
                "description": "Minimum drought tolerance, 1–5 (5 = best).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "minEase": {
                "description": "Minimum ease of care, 1–5 (5 = easiest).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "minHeat": {
                "description": "Minimum heat tolerance in Dubai, 1–5 (5 = best).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "minSalt": {
                "description": "Minimum salt tolerance, 1–5 (5 = best).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "minShade": {
                "description": "Minimum shade tolerance, 1–5 (5 = best); use for shady spots.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
