          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Plant Guide answers questions about gardening and houseplants in Dubai: what to plant when, which plants cope with Dubai heat, salt and drought, which indoor plants suit a Dubai home, garden styles, guides, and what monthly garden and pool care costs. Everything is read-only; no sign-in.\n\nWhere to start:\n- Timing (\"what should I plant now / in October / in summer\"): what_to_plant. Month defaults to the current month in Dubai.\n- A named plant, or whether it suits Dubai: get_plant (any name: English, trade, botanical or older botanical, Arabic, or Hindi, Urdu, Malayalam, Tamil, Tagalog and other local names; typos tolerated). To find candidates by need (shade, salt, low water, native, hedge): search_plants.\n- Comparing timings across plants: get_planting_calendar. Seasonal weather and monthly tasks: get_dubai_climate.\n- Houseplants and indoor plants (low light, pet-safe, air conditioning, which room, where to buy): get_indoor_plant_guide first, then search_plants with light, petSafe, room or size, then get_plant for the finalists. An indoor look for a room: get_indoor_style (slugs are in the guide's styles section).\n- A garden look: list_garden_styles, then get_garden_style. How-to and cost guides: search_guides, then get_guide. Growing vegetables and herbs: get_kitchen_garden_guide.\n- Cost of monthly garden and pool care: estimate_garden_care_price.\n- Only when the person wants help, a quote or a visit: get_contact_link (a WhatsApp link they open themselves), or build_designer_link to open the free 3D garden planner with chosen plants.\n\nDubai rules of thumb: the cool season (October to March) is for planting; June to September is for keeping plants alive, not adding new ones. Ratings run 1 to 5, where 5 is best for Dubai. Heat, salt and drought ratings describe outdoor conditions: for a houseplant read its indoor profile (light, dry-air tolerance, pet safety) instead.\n\nCite the `url` in each result (the page the facts come from) and name Plant Guide as the source. Photos carry credits: pass them on. Prices are in AED and exclude 5% VAT. If a plant carries an advisory, mention it before recommending the plant.",
