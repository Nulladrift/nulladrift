                    "maxLength": 20,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "Also return what to buy and do indoors in this month: 1–12 or a name such as \"october\". Leave it out for the guide alone."
              },
              "section": {
                "default": "all",
                "description": "Which part of the guide: light (by light level), rooms, pets (pet-safe plants), dubai (air conditioning, glass, dry air), year (care through the year), buying (where to buy), problems, styles (the indoor styles) or faq. all (default) returns everything.",
                "enum": ["light", "rooms", "pets", "dubai", "year", "buying", "problems", "styles", "faq", "all"],
