{
  "lockfileVersion": 2,
  "subjects": {
    "com.navo24/air-cargo-tracking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.aircargomcp.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "air-cargo",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "air_rate_quote",
          "description": "Get an all-in per-kg air-freight rate quote for a lane. Computes chargeable weight (max of gross vs volumetric) and applies weight breaks + fuel/security surcharges.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Destination airport IATA code, e.g. \"FRA\"",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "origin": {
                "description": "Origin airport IATA code, e.g. \"HKG\"",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "volume_cm3": {
                "description": "Total volume in cm³ (for volumetric weight)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "weight_kg": {
                "description": "Actual gross weight in kg",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["destination", "origin", "weight_kg"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:132bbe49fe01f5e32f4188fce67647f55804f4ea1e21d4343b4f0ffc5366d498"
        },
        {
          "name": "resolve_awb_prefix",
          "description": "Resolve a 3-digit IATA AWB prefix to its airline (name, IATA code, cargo tracking site). The air equivalent of a container-prefix lookup.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "prefix": {
                "description": "3-digit AWB prefix, e.g. \"176\" for Emirates",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["prefix"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4a88c9c0bd6351261f86957ae8348b0631fd0128625aaa0568fd3c440a1e1865"
        },
        {
          "name": "track_awb",
          "description": "Track an air-cargo shipment by its air waybill (AWB) number. Accepts any format (\"176-1234 5675\", \"17612345675\"). Returns status, route, milestones.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "awb": {
                "description": "Air waybill number — 3-digit airline prefix + 8-digit serial",
                "type": "string"
              }
            },
            "required": ["awb"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0131693515154091b078c417bd53d83f1ec26c9077b3922270cab7e9b14c8070"
        }
      ],
      "digest": "sha256:3742cf6247723733e6d45b50e8b265a735cd65abde3388eac4c12ba650859fb2"
    }
  }
}
