{
  "lockfileVersion": 2,
  "subjects": {
    "com.navo24/air-cargo-tracking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.aircargomcp.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "air-cargo",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "air_rate_quote",
          "description": "Get an all-in per-kg air-freight rate quote for a lane. Computes chargeable weight (max of gross vs volumetric) and applies weight breaks + fuel/security surcharges.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Destination airport IATA code, e.g. \"FRA\"",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "origin": {
                "description": "Origin airport IATA code, e.g. \"HKG\"",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "volume_cm3": {
                "description": "Total volume in cm³ (for volumetric weight)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "weight_kg": {
                "description": "Actual gross weight in kg",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["destination", "origin", "weight_kg"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:84e424fb446f8b351cae359a631f0e6141aacb7cd1ea22aaa13214e968a8309b"
        },
        {
          "name": "resolve_awb_prefix",
          "description": "Resolve a 3-digit IATA AWB prefix to its airline (name, IATA code, cargo tracking site). The air equivalent of a container-prefix lookup.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "prefix": {
                "description": "3-digit AWB prefix, e.g. \"176\" for Emirates",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["prefix"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5c20b6b35d7cb9e2ed9f0f3c3be75bff72bb732bcc7b1762dfd098e692ad2115"
        },
        {
          "name": "track_awb",
          "description": "Track an air-cargo shipment by its air waybill (AWB) number. Accepts any format (\"176-1234 5675\", \"17612345675\"). Returns status, route, milestones.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "awb": {
                "description": "Air waybill number — 3-digit airline prefix + 8-digit serial",
                "type": "string"
              }
            },
            "required": ["awb"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f154a962bb3e7cf42ddf0aeb1e4178b577b3a296388dac72188ca03c210b8c98"
        }
      ],
      "digest": "sha256:1fc41022fa7628f5293cd320c23d7c3be897d5bf2096e0f0970ef93d7461117b"
    }
  }
}
