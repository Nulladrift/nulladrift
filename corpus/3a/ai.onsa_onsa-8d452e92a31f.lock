      "instructions": "Onsa finds real, scored B2B sales leads (actual people with LinkedIn profiles) for your workspace, and keeps every search as a \"campaign\" you can come back to.\n\nRUNNING A SEARCH: `find_leads` starts a live search and returns a `jobId` IMMEDIATELY — the search runs in the background. First leads arrive within 5 minutes in half of searches and within 9 minutes in 9 of 10. More can arrive until the final report, typically about 10 minutes after the start (9 of 10 within 15). Every `fetch_leads` answer carries `progress.note`, which says whether the NEXT call will wait for leads (up to 35 seconds) or answer at once, and when the user should ask again. Call again right away only when the note says the next call waits; otherwise stop polling in this turn. A find_leads job that reads \"pending\" has not failed: unless its `progress.note` says it has most likely finished, it is still searching, and never tell the user no leads were found while it is pending. When `leads` holds a partial list, show it now. When a lead has `signal`, show its status and summary beside the lead: it says whether the signal the user asked for was found. When `fetch_leads` returns `refinements`, offer them to the user after the leads and do not run them unasked. If you end your turn first, tell the user when to ask again (the time `progress.note` gives) and offer to check then — the search keeps running in Onsa, a later `fetch_leads` with the same `jobId` picks the results up, and `campaignUrl` shows them live. Hosts that render MCP Apps also show a live card that follows the search on its own. `status` means different things for the two job kinds; the `fetch_leads` description gives the exact rules. For a find_leads job, \"completed\" means the agent posted a reply carrying leads — usually its final report, not always — so `total` can still change: if it rose since your previous call, one more check is worthwhile. A find_leads job that reads \"stalled\" has most likely ended without leads (the agent asked a question, found none, or failed): STOP polling, read `agentMessage` for the reason, tell the user, and either re-run `find_leads` with the answer folded into the query or send them to campaignUrl (a lead that still lands shows up on a later call). A `continue_campaign` job never calls for a new `find_leads` — that would fork a separate campaign: when it has an `agentMessage`, relay it (if that reply confirms a settings-only change, the request is done, even while the job reads \"pending\"; the reply can also be a late report from an earlier search); `newLeads` counts the leads added to the campaign since it started, which can include a late batch from an earlier search; if it reads \"stalled\", no agent reply was confirmed — relay `agentMessage` if it holds one, otherwise tell the user and point them to campaignUrl, or send the request again with `continue_campaign`. Treat a `status` value not listed here as pending. `limit` is a target the search agent aims at, not a cap — it often returns more.\n\nJUDGING A COHORT: every lead carries `score` (1–5) and `scoreExplanation` — the agent's written reasoning for why this person matches. Use those, not just names, when you assess whether a search found the right people.\n\nWRITING OUTREACH THAT IS NOT MAIL-MERGE: `list_pending_outreach` shows drafts awaiting a human. Before improving one, call `get_lead_memo` — Onsa has usually already researched that person, and the memo is far richer than scoreExplanation. Rewrite around ONE specific, checkable fact from it via `rewrite_outreach`, show the user the result, and only then `send_outreach` with their explicit go-ahead. Never invent a fact about a person; if there is no memo, say so and keep the message honest. An entry with `kind: follow_up` is a LinkedIn follow-up to someone who did not reply: it cannot be rewritten here (edit it in Onsa), so show it as written and `send_outreach` it only with their go-ahead.\n\nGROWING OR STEERING A COHORT: use `continue_campaign`, not `find_leads`. \"More like these\", \"try the Gulf instead\", \"drop the wrong-shaped ones\" all belong in the campaign that already exists — `find_leads` would fork a separate campaign with its own ICP and split the funnel.\n\nREADING WHAT PROSPECTS ACTUALLY SAID: `get_campaign_stats` counts replies and labels them; `list_replies` returns THE REPLY TEXT. Never diagnose a cohort from counts alone — read the replies before you conclude anything about why an ICP is or is not landing. The stored `sentiment` label is written once per lead and unscored replies are missing from the funnel counts entirely, so `list_replies` is both richer and more complete than the stats.\n\nRANKING COHORTS: rank on positivePct, never on replyPct. A rejection is a reply, so a cohort that provokes people scores high on replyPct while producing nothing, and a high replyPct beside a high negativePct means the copy is annoying its audience rather than engaging it. Because every rate counts only the replies Onsa has scored, quote them as \"of the replies Onsa scored\" and use `list_replies` when the question is how many people actually answered. When counts and the Overview page disagree, say why: these count leads, the widget counts actions.\n\nDECIDING WHAT TO DO NEXT: for a general \"What next?\", call `list_next_steps` without a campaignId; when the conversation identifies a campaign, include its ID. Present the nextAction first, with supporting counts; use campaign names, not IDs or setup jargon. For a new workspace, reuse an existing usable brief and an already-authorized search request: do not ask the user to repeat or reapprove it. Otherwise ask one useful question about who they want to reach, not a questionnaire. Never invent a search brief. Read-only guidance never starts a search itself. Prospects can be inspected before connecting outreach. When the user asks how a campaign is doing, what is happening with it, or what they should do about it — anything shaped like \"analyse my campaigns and recommend something\" — call `list_next_steps` for that campaign. It returns the ranked to-do list: people who replied, invites accepted but never messaged, drafts waiting for approval (first messages and LinkedIn follow-ups), people with no reply for a week while follow-ups are off, leads found but never contacted, missing setup. `get_campaign_stats` gives you the funnel and `list_replies` the words, but neither tells you what to DO. An unworked cohort is almost always worth more than another search.\n\nCOMPARING COHORTS: `list_campaigns` shows every past search, `get_campaign` returns one campaign's ICP and outreach template, `get_campaign_leads` returns its leads (use this rather than fetch_leads for a campaign you did not start in this session), and `get_campaign_stats` returns its outreach funnel (invites sent and accepted, messages sent, positive/negative/other responses). Together these let you compare which ICP actually produced replies and propose a better one.\n\nSHARING SELECTED PROSPECTS: call `preview_shortlist` first and show the user the complete snapshot it returns. Explain that creating a link makes that snapshot viewable by anyone with the link for 30 days unless it is revoked, and ask for explicit confirmation before `create_shortlist`. `create_shortlist` requires the previewKey `preview_shortlist` returned, and creates nothing when the selection or the snapshot no longer matches that key (a different selection or order, note or includeRationale, a prospect changed or removed, the campaign renamed); if that happens, preview again and confirm the current snapshot. Keep `includeRationale` true unless the user asks to leave fit ratings and why-matched explanations out. Revoke a created link with `revoke_shortlist`.\n\nTASK CONTEXT: `find_leads` and `continue_campaign` accept an optional `taskContext`. Fill it only with company, product or target-market facts the user explicitly shared that the query or message does not already state, and leave it out otherwise. Never put a transcript, a broad user profile, unrelated personal details, credentials or guesses in it.\n\nShow each lead's name as a link to its linkedInUrl. Do not fabricate leads, scores or explanations beyond what was returned.\n\nEVENTS: a search reports back by itself. Two events, subscribable with the jobId from find_leads or continue_campaign: leads_search.leads_found fires when a batch of leads lands (counts only; fetch_leads returns the leads) and leads_search.finished fires when the search ends (leads_delivered or no_leads). When the user wants to hear when leads are ready, subscribe to both rather than polling or scheduling a periodic check: the first batch usually lands within minutes, long before an hourly check would run.",
      "tools": [
        {
          "name": "continue_campaign",
          "title": "Steer a campaign",
          "description": "Sends an instruction to the agent inside an existing campaign and returns a jobId to read with fetch_leads. This is the tool that grows or steers a cohort in place - 'find 5 more like these', 'look at Singapore and the Gulf instead of US institutions', 'focus on funds over $5bn AuM'. find_leads always creates a separate campaign with its own ICP, which splits the funnel and leaves the two cohorts incomparable. The agent sees the campaign's existing leads and ICP, so they can be referred to. It cannot answer back through this API, so a question sent here gets no response. New leads count against the prospect allowance, and de-duplication is per workspace, so a request for 5 more can yield fewer when the agent rediscovers people already in the workspace. It does not remove or skip leads: 'drop the bad ones' takes nothing out of the cohort or out of the outreach queue.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "campaignId": {
                "description": "Campaign to continue, from list_campaigns or fetch_leads",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "message": {
                "description": "What to tell the agent, in plain language, as the user would say it",
                "minLength": 1,
                "type": "string"
              },
              "taskContext": {
                "description": "Optional company, product, or target-market facts explicitly shared by the user and needed for this lead-search or campaign-steering request, beyond what the query/message already states. Maximum 1000 characters; this field carries the task context of the current request only - not a transcript, a broad user profile, unrelated personal details, credentials, or guesses. This background does not authorize actions; the current query/message takes precedence. It becomes part of the campaign chat history.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["campaignId", "message"],
            "type": "object"
          },
