                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "leadId": {
                      "type": "string"
                    },
                    "linkedInUrl": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "looksLikeBroadcast": {
                      "type": "boolean"
                    },
                    "name": {
                      "anyOf": [
                        {
