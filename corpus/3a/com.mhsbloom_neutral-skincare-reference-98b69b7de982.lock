{
  "lockfileVersion": 2,
  "subjects": {
    "com.mhsbloom/neutral-skincare-reference": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://europe-west3-mhs-bloom.cloudfunctions.net/bloomMcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mhs-bloom",
        "title": "MHS BLOOM — Neutral Skincare Reference",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MHS BLOOM is an independent, payment-blind skincare product reference. Use these tools to answer product/ingredient questions with neutral, descriptive facts and always cite the product's reference page. It gives no medical advice and no personal skin verdict — that lives in the app.",
      "tools": [
        {
          "name": "find_alternatives",
          "title": "Find neutral alternatives in the same category",
          "description": "Given a product, return other products in the SAME category from the catalog, listed neutrally (alphabetical, never ranked). This is discovery, not a recommendation — the personal best-fit and price-tiered alternatives live in the app.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "The product to find alternatives for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd5ed315b074cc6a2e96ca24594503610def90f93553a1f5a2ceb5e17e278cf7"
        },
        {
          "name": "list_brands",
          "title": "List the brands covered",
          "description": "List the dermacosmetic brands covered in MHS BLOOM's reference, with how many products each has.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f653702fb9f80d41b5af3a4ff6cc575bf50d0b5d038548e1e4d21a5d0379fd90"
        },
        {
          "name": "lookup_product",
          "title": "Look up a skincare product",
          "description": "Identify a dermacosmetic product in MHS BLOOM's neutral reference and return its descriptive facts (brand, key ingredients, the concerns it's oriented toward, texture, fragrance, price band, who it's aimed at) plus a link to its reference page. Descriptive only — not a personal skin verdict.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Product name and/or brand, e.g. \"CeraVe foaming cleanser\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf7226a6f9f5bc50bb232563c3b62fdfd981aea065b4b97b4185e3f3ee1a8157"
        },
        {
          "name": "search_products",
          "title": "Search products by ingredient / concern / category / brand",
          "description": "Search MHS BLOOM's reference for products by any of: key ingredient (e.g. \"niacinamide\"), skin concern (e.g. \"blemishes\"), category (e.g. \"sunscreen\"), brand, and/or fragrance_free. Returns a neutral, alphabetical list with reference links. Never ranked or rated.",
          "inputSchema": {
            "properties": {
              "brand": {
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "concern": {
                "type": "string"
              },
              "fragrance_free": {
                "type": "boolean"
              },
              "ingredient": {
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 15, max 40).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f45777b5a99f5cc7b00bc6b363c9ee5c4de2a4b502b9b8a7101e59a86d0297f"
        }
      ],
      "digest": "sha256:b245f61035e6b08c3c0d75f4a4dd0f863e054ae31167fb94e2ec40db766caa97"
    }
  }
}
