                "type": "number"
              },
              "dailyVisitors": {
                "description": "ab: traffic per day, to estimate how long to run",
                "type": "integer"
              },
              "lift": {
                "description": "ab: smallest relative lift to detect, percent",
                "type": "number"
              },
              "margin": {
                "description": "survey: margin of error, e.g. 0.05",
                "type": "number"
              },
              "mode": {
                "description": "Which calculator",
                "enum": ["sus", "discovery", "ab", "survey"],
                "type": "string"
              },
              "p": {
                "description": "discovery: chance a participant hits a problem, default 0.31",
                "type": "number"
              },
              "population": {
                "description": "survey: total population, for the finite-population correction",
                "type": "integer"
              },
              "power": {
                "description": "ab: 0.8, 0.9 or 0.95",
                "type": "number"
              },
              "responses": {
                "description": "sus: array of 10-number arrays",
                "items": {
                  "items": {
                    "type": "integer"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "target": {
                "description": "discovery: share of problems to find, default 0.85",
                "type": "number"
              }
            },
            "type": "object"
