        {
          "name": "calculate_proportion",
          "title": "Proportion calculator",
          "description": "Work out proportions. Pass `ratio` (golden, root2 or a-series, root3, any a:b such as 3:2 or 16:9, or a decimal such as 1.414; default golden) and `width` or `height`. Optionally `orientation` (landscape by default, or portrait) and `container` (length to split; defaults to the long side). Returns the missing side, the split of the container into a major and minor part at that ratio (with CSS fr and px forms), a table of heights at the same width for ten common ratios, and, when you give both width and height as a source image, centered crop sizes and offsets for the target ratio and common alternatives with the share of area kept. Root-2 is the ISO A-series ratio, where folding a sheet in half keeps its shape. Sources: Graphic Design Solutions (golden section); Samara, Making and Breaking the Grid; Müller-Brockmann, Grid Systems in Graphic Design. That any one ratio is more beautiful is a convention, not a finding. Pure arithmetic, nothing stored.",
          "inputSchema": {
            "properties": {
              "container": {
                "description": "Length to split into major and minor parts.",
                "type": "number"
              },
              "height": {
                "description": "Known height. Give one of width or height; give both to get crop suggestions.",
                "type": "number"
              },
              "orientation": {
                "description": "Landscape (default) makes the width the long side.",
                "enum": ["landscape", "portrait"],
                "type": "string"
              },
              "ratio": {
                "description": "golden, root2, a-series, 3:2, 16:9, 4:5, a decimal like 1.414, or any a:b. Default golden.",
                "type": "string"
              },
              "width": {
                "description": "Known width in px (or any unit).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
