                "type": "string"
              },
              "ratio": {
                "description": "Modular ratio, for example 1.5 or 1.25. Omit for a linear scale.",
                "type": "number"
              },
              "steps": {
                "description": "Your own step list in px, for example [4, 8, 12, 16, 24, 40].",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
